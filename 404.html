<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found - Alloy Studios</title>
<link rel="icon" type="image/png" href="/assets/brand/favicon-64.png">
<link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
<meta name="theme-color" content="#121110">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/assets/shell.css">
<script data-goatcounter="https://alloystudios.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<main></main>
<script src="/assets/account.js"></script>
<script src="/assets/shell.js"></script>
<script>
Alloy.boot(({ games }) => {
  // If the URL looks like a game name, offer the closest matches first.
  const guess = decodeURIComponent(location.pathname.split('/').filter(Boolean)[0] || '')
    .replace(/[-_]+/g, ' ');
  const near = guess ? Alloy.search(guess) : [];
  const list = near.length ? near : games;

  document.querySelector('main').innerHTML = `
    <div class="wrap">
      <div class="empty">
        <h2>We could not find that page</h2>
        <p>${near.length ? 'Did you mean one of these?' : 'Here is everything we do have.'}</p>
      </div>
      <div class="grid">${list.map(Alloy.cardHTML).join('')}</div>
    </div>`;
});
</script>
</body>
</html>
