<!doctype html>
<!-- =========================================================
     Alloy Studios game wrapper.

     This file is IDENTICAL for every game. Copy it to
     <game-id>/index.html and it works - player.js reads the
     game id out of the URL and loads games/<game-id>/ into the
     frame. Never edit a copy; edit this file and re-run
     tools/build.ps1 to push the change to every game.
     ========================================================= -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alloy Studios</title>
<link rel="icon" type="image/png" href="/assets/brand/favicon-64.png">
<link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
<meta name="theme-color" content="#121110">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/assets/shell.css">
<script data-goatcounter="https://alloystudios.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<main></main>
<script src="/assets/account.js"></script>
<script src="/assets/shell.js"></script>
<script src="/assets/player.js"></script>
</body>
</html>
