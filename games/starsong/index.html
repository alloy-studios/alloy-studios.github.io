  function openExport() {
    const box = el('textarea', 'save-box');
    box.id = 'export-box';
    box.readOnly = true;
    box.value = Game.serialize();
    const msg = el('p', 'note', 'Copy this text and keep it somewhere safe.');
    openModal({
      title: 'Export your save',
      body: textBlock([msg, box]),
      actions: [{ label: 'Done', primary: true }],
    });
    const copy = el('button', 'btn', 'Copy');
    copy.type = 'button';
    copy.onclick = () => {
      box.select();
      const p = navigator.clipboard && navigator.clipboard.writeText(box.value);
      if (p) p.then(() => { msg.textContent = 'Copied.'; }, () => { msg.textContent = 'Press Ctrl+C to copy the selected text.'; });
      else msg.textContent = 'Press Ctrl+C to copy the selected text.';
    };
    document.querySelector('.modal-card .btn-row').prepend(copy);
  }

  function openImport() {
    const box = el('textarea', 'save-box');
    box.id = 'import-box';
    box.placeholder = 'Paste your exported save here';
    const msg = el('p', 'note', 'Importing replaces your current game.');
    openModal({
      title: 'Import a save',
      body: textBlock([msg, box]),
      actions: [{ label: 'Cancel' }],
    });
    const load = el('button', 'btn primary', 'Load this save');
    load.type = 'button';
    load.onclick = () => {
      try {
        const state = Game.deserialize(box.value);
        closeModal();
        Store.adopt(state);
      } catch (err) {
        msg.textContent = 'That text is not a Starsong save. Check that you copied all of it.';
      }
    };
    document.querySelector('.modal-card .btn-row').prepend(load);
    box.focus();
  }

  /* ---------- Star chart and sky ---------- */
  function nodePos(n) {
    if (!n.arm) return [0, 0];
    const a = ARMS[n.arm].angle * Math.PI / 180;
    const U = 78;
    return [Math.cos(a) * n.r * U - Math.sin(a) * n.o * U, Math.sin(a) * n.r * U + Math.cos(a) * n.o * U];
  }

  let chartRefs = null;

  function openChart(kind) {
    chartKind = kind;
    chartSel = null;
    const root = $('chart');
    root.innerHTML = '';
    root.hidden = false;
    syncPlay();
    const map = el('div', 'chart-map' + (kind === 'score' ? ' score-map' : ''));
    const side = el('div', 'chart-side');
    const KIND = {
      stars: { box: '-610 -560 1220 1120', label: 'Star chart', title: 'Star chart', bal: 'dust', hint: 'Pick a point to see what it does. Tap it again to buy it.', buy: 'Light this point' },
      sky: { box: '0 0 1000 1000', label: 'The twelve dead stars', title: 'The sky', bal: 'void', hint: 'Pick a star to see what relighting it does. Tap it again to relight it.', buy: 'Relight this star' },
      score: { box: '0 10 880 640', label: 'The Score', title: 'The Score', bal: 'echo', hint: 'Pick a note to see what it does. Tap it again to write it. Each measure opens once the one before it is complete.', buy: 'Write this note' },
    }[kind];
    const svg = svgEl('svg', { viewBox: KIND.box, role: 'img', 'aria-label': KIND.label });
    map.appendChild(svg);

    const title = el('h2', '', KIND.title);
    const bal = el('div', 'chart-balance ' + KIND.bal);
    const detail = el('div', 'chart-detail');
    const dName = el('h3', '', '');
    const dArm = el('div', 'arm', '');
    const dDesc = el('p', '', KIND.hint);
    const dCost = el('div', 'cost', '');
    const buy = el('button', 'btn primary', KIND.buy);
    buy.type = 'button';
    buy.hidden = true;
    buy.onclick = () => buySelected();
    detail.append(dName, dArm, dDesc, dCost, buy);
    const close = el('button', 'btn', 'Back to the system');
    close.type = 'button';
    close.onclick = closeChart;
    side.append(title, bal, detail, close);
    root.append(map, side);

    const nodeEls = {};
    const edgeEls = [];
    if (kind === 'stars') {
      for (const n of NODES) {
        for (const r of n.req || []) {
          const [x1, y1] = nodePos(NODE_BY_ID[r]);
          const [x2, y2] = nodePos(n);
          const line = svgEl('line', { x1, y1, x2, y2, class: 'ce' });
          line.style.setProperty('--col', n.arm ? ARMS[n.arm].hue : '#fff');
          svg.appendChild(line);
          edgeEls.push({ line, a: r, b: n.id });
        }
      }
      for (const k in ARMS) {
        const a = ARMS[k].angle * Math.PI / 180;
        const lx = Math.cos(a) * 7.05 * 78, ly = Math.sin(a) * 6.75 * 78;
        const t = svgEl('text', { x: lx, y: ly, class: 'arm-label' });
        t.style.setProperty('--col', ARMS[k].hue);
        t.textContent = ARMS[k].name;
        svg.appendChild(t);
      }
      for (const n of NODES) {
        const [x, y] = nodePos(n);
        const g = addNode(svg, n.id, x, y, n.arm ? ARMS[n.arm].hue : '#fff4dc', n.arm ? (n.scale ? 19 : 16) : 24);
        nodeEls[n.id] = g;
      }
    } else if (kind === 'score') {
      drawStaff(svg, nodeEls, edgeEls);
    } else {
      for (const [a, b] of SKY_LINKS) {
        const A = SKY_BY_ID[a], B = SKY_BY_ID[b];
        const line = svgEl('line', { x1: A.x * 1000, y1: A.y * 1000, x2: B.x * 1000, y2: B.y * 1000, class: 'ce' });
        line.style.setProperty('--col', '#e9dcff');
        svg.appendChild(line);
        edgeEls.push({ line, a, b });
      }
      for (const t of SKY) {
        const g = addNode(svg, t.id, t.x * 1000, t.y * 1000, t.color, 22);
        const label = svgEl('text', { x: t.x * 1000, y: t.y * 1000 + 46, class: 'arm-label' });
        label.style.setProperty('--col', t.color);
        label.textContent = t.name;
        svg.appendChild(label);
        nodeEls[t.id] = g;
      }
    }
    chartRefs = { nodeEls, edgeEls, bal, dName, dArm, dDesc, dCost, buy };
    refreshChart();
  }

  /* The Score: two lines of music on a five-line staff, two measures to a line, then the
   * Refrain between repeat signs. A note's `line` counts half-steps up the staff from
   * the bottom line. */
  const MEASURES = ['Prelude', 'Theme', 'Development', 'Finale'];
  const MEASURE_HUES = ['#ffd98a', '#ffb3c9', '#9fdcff', '#cdb6ff'];
  const STAFF = { left: 30, x0: 70, w: 300, gap: 40, bottoms: [250, 580], ends: [670, 850], refrainX: 760 };
  function staffY(line, row) { return STAFF.bottoms[row] - line * (STAFF.gap / 2); }

  function drawStaff(svg, nodeEls) {
    const line = (x1, y1, x2, y2, cls) => svg.appendChild(svgEl('line', { x1, y1, x2, y2, class: cls }));
    const label = (x, y, text, col) => {
      const t = svgEl('text', { x, y, class: 'arm-label' });
      t.style.setProperty('--col', col);
      t.textContent = text;
      svg.appendChild(t);
    };
    for (let row = 0; row < 2; row++) {
      const top = staffY(8, row), bottom = staffY(0, row);
      for (let k = 0; k < 5; k++) line(STAFF.left, staffY(k * 2, row), STAFF.ends[row], staffY(k * 2, row), 'staff-line');
      line(STAFF.left, top, STAFF.left, bottom, 'staff-bar thick');
      line(STAFF.left + 9, top, STAFF.left + 9, bottom, 'staff-bar');
      line(STAFF.x0 + STAFF.w, top, STAFF.x0 + STAFF.w, bottom, 'staff-bar');
      for (let col = 0; col < 2; col++) label(STAFF.x0 + col * STAFF.w + STAFF.w / 2, top - 46, MEASURES[row * 2 + col], MEASURE_HUES[row * 2 + col]);
    }
    line(STAFF.ends[0], staffY(8, 0), STAFF.ends[0], staffY(0, 0), 'staff-bar');
    // Repeat signs around the Refrain
    const top = staffY(8, 1), bottom = staffY(0, 1);
    const a = STAFF.x0 + 2 * STAFF.w, b = STAFF.ends[1];
    line(a, top, a, bottom, 'staff-bar thick');
    line(a + 9, top, a + 9, bottom, 'staff-bar');
    line(b - 9, top, b - 9, bottom, 'staff-bar');
    line(b, top, b, bottom, 'staff-bar thick');
    for (const x of [a + 22, b - 22]) for (const ln of [3, 5]) svg.appendChild(svgEl('circle', { cx: x, cy: staffY(ln, 1), r: 5, class: 'staff-dot' }));
    label(STAFF.refrainX, top - 46, REFRAIN.name, '#fff4dc');

    const note = (id, x, ln, row, col) => {
      const y = staffY(ln, row);
      const up = ln < 4;
      const stem = svgEl('line', { x1: up ? x + 15 : x - 15, y1: y, x2: up ? x + 15 : x - 15, y2: up ? y - 100 : y + 100, class: 'staff-stem' });
      stem.style.setProperty('--col', col);
      svg.appendChild(stem);
      const g = addNode(svg, id, x, y, col, 17);
      // A wider, invisible target, so a note is easy to tap on a phone
      g.insertBefore(svgEl('circle', { cx: x, cy: y, r: 31, class: 'hit' }), g.firstChild);
      g.__stem = stem;
      nodeEls[id] = g;
    };
    for (let m = 0; m < 4; m++) {
      SCORE.filter((n) => n.m === m).forEach((n, k) => note(n.id, STAFF.x0 + (m % 2) * STAFF.w + 55 + k * 64, n.line, m < 2 ? 0 : 1, MEASURE_HUES[m]));
    }
    note('refrain', STAFF.refrainX, 5, 1, '#fff4dc');
  }

  function addNode(svg, id, x, y, col, r) {
    const g = svgEl('g', { class: 'cn', tabindex: '0', role: 'button' });
    g.style.setProperty('--col', col);
    g.appendChild(svgEl('circle', { class: 'halo', cx: x, cy: y, r: r + 11 }));
    g.appendChild(svgEl('circle', { class: 'body', cx: x, cy: y, r }));
    g.appendChild(svgEl('circle', { class: 'ring', cx: x, cy: y, r: r + 7 }));
    const t = svgEl('text', { x, y });
    g.appendChild(t);
    g.__label = t;
    g.addEventListener('click', () => {
      if (chartSel === id) buySelected();
      else { chartSel = id; refreshChart(); }
    });
    g.addEventListener('pointerenter', (e) => {
      if (e.pointerType === 'mouse') { chartSel = id; refreshChart(); }
    });
    g.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        e.stopPropagation();
        if (chartSel === id) buySelected();
        else { chartSel = id; refreshChart(); }
      }
    });
    svg.appendChild(g);
    return g;
  }

  function buySelected() {
    if (!chartSel) return;
    let ok;
    if (chartKind === 'stars') ok = Game.buyNode(chartSel);
    else if (chartKind === 'sky') ok = Game.buySky(chartSel);
    else ok = chartSel === 'refrain' ? Game.buyRefrain() : Game.buyScore(chartSel);
    if (ok) {
      if (chartKind === 'score') {
        // The note sounds at its own height on the staff
        const n = SCORE_BY_ID[chartSel];
        const step = [0, 2, 4, 5, 7, 9, 11, 12, 14][n ? n.line : 5];
        Sound.chime([step, step + 12], 0.12, 0.9);
      } else Sound.chime(chartKind === 'stars' ? [0, 2, 4] : [0, 2, 4, 7], 0.09, 0.8);
      refreshChart();
      refresh();
    }
  }

  function refreshChart() {
    if (!chartKind || !chartRefs) return;
    const s = Game.s;
    const r = chartRefs;
    if (chartKind === 'stars') {
      put(r.bal, fmt(s.stardust) + ' Stardust');
      for (const n of NODES) {
        const g = r.nodeEls[n.id];
        const lv = s.nodes[n.id] || 0;
        const avail = Game.nodeAvailable(n);
        const maxed = Game.nodeMaxed(n);
        const can = avail && !maxed && gte(s.stardust, nodeCost(n, lv));
        g.setAttribute('class', 'cn' + (lv > 0 ? ' lit' : '') + (avail ? ' open' : '') + (can ? ' can' : '') + (chartSel === n.id ? ' sel' : ''));
        g.setAttribute('aria-label', n.name + (lv > 0 ? ', owned' : ''));
        put(g.__label, n.scale && lv > 0 ? String(lv) : '');
      }
      for (const e of r.edgeEls) e.line.setAttribute('class', 'ce' + (s.nodes[e.a] && s.nodes[e.b] ? ' lit' : ''));
      if (chartSel) {
        const n = NODE_BY_ID[chartSel];
        const lv = s.nodes[n.id] || 0;
        const maxed = Game.nodeMaxed(n);
        const avail = Game.nodeAvailable(n);
        const cost = nodeCost(n, lv);
        put(r.dName, n.name + (n.scale ? ' (level ' + lv + ')' : ''));
        put(r.dArm, n.arm ? ARMS[n.arm].name + ': ' + ARMS[n.arm].theme : 'The centre of the chart');
        put(r.dDesc, n.desc);
        put(r.dCost, maxed ? (n.scale ? 'Fully upgraded' : 'Yours') : !avail ? 'Light a connected point first' : 'Costs ' + fmt(cost) + ' Stardust');
        show(r.buy, !maxed && avail);
        r.buy.disabled = !gte(s.stardust, cost);
      }
    } else if (chartKind === 'sky') {
      put(r.bal, fmtInt(s.voidCur) + ' Void');
      for (const t of SKY) {
        const g = r.nodeEls[t.id];
        const lit = !!s.sky[t.id];
        const can = !lit && s.voidCur >= t.cost;
        g.setAttribute('class', 'cn open' + (lit ? ' lit' : '') + (can ? ' can' : '') + (chartSel === t.id ? ' sel' : ''));
        g.setAttribute('aria-label', t.name + (lit ? ', relit' : ''));
        put(g.__label, lit ? '' : String(t.cost));
      }
      for (const e of r.edgeEls) e.line.setAttribute('class', 'ce' + (s.sky[e.a] && s.sky[e.b] ? ' lit' : ''));
      if (chartSel) {
        const t = SKY_BY_ID[chartSel];
        const lit = !!s.sky[t.id];
        put(r.dName, t.name);
        put(r.dArm, lit ? 'Burning again' : 'Dead star');
        put(r.dDesc, t.desc);
        put(r.dCost, lit ? '' : 'Costs ' + fmtInt(t.cost) + ' Void');
        show(r.buy, !lit);
        r.buy.disabled = s.voidCur < t.cost;
      }
    } else {
      put(r.bal, fmtInt(s.echoes) + ' Echoes');
      const allWritten = Game.refrainOpen();
      for (const n of SCORE) {
        const g = r.nodeEls[n.id];
        const owned = !!s.score[n.id];
        const avail = Game.scoreAvailable(n);
        const can = !owned && avail && s.echoes >= n.cost;
        g.setAttribute('class', 'cn' + (owned ? ' lit' : '') + (avail ? ' open' : '') + (can ? ' can' : '') + (chartSel === n.id ? ' sel' : ''));
        g.setAttribute('aria-label', n.name + (owned ? ', written' : ''));
        g.__stem.setAttribute('class', 'staff-stem' + (owned ? ' lit' : ''));
        put(g.__label, '');
      }
      const rg = r.nodeEls.refrain;
      const canR = allWritten && s.echoes >= Game.refrainCost();
      rg.setAttribute('class', 'cn' + (s.refrain > 0 ? ' lit' : '') + (allWritten ? ' open' : '') + (canR ? ' can' : '') + (chartSel === 'refrain' ? ' sel' : ''));
      rg.setAttribute('aria-label', REFRAIN.name + (s.refrain > 0 ? ', played ' + s.refrain + ' times' : ''));
      rg.__stem.setAttribute('class', 'staff-stem' + (s.refrain > 0 ? ' lit' : ''));
      put(rg.__label, s.refrain > 0 ? String(s.refrain) : '');
      if (chartSel === 'refrain') {
        put(r.dName, REFRAIN.name + (s.refrain ? ' (played ' + s.refrain + (s.refrain === 1 ? ' time)' : ' times)') : ''));
        put(r.dArm, 'After the final bar line');
        put(r.dDesc, REFRAIN.desc);
        put(r.dCost, allWritten ? 'Costs ' + fmtInt(Game.refrainCost()) + ' Echoes' : 'Write every note on the Score first');
        show(r.buy, allWritten);
        r.buy.disabled = !canR;
      } else if (chartSel) {
        const n = SCORE_BY_ID[chartSel];
        const owned = !!s.score[n.id];
        put(r.dName, n.name);
        put(r.dArm, 'Measure ' + (n.m + 1) + ': ' + MEASURES[n.m]);
        put(r.dDesc, n.desc);
        put(r.dCost, owned ? 'Written' : !Game.scoreAvailable(n) ? 'Finish the ' + MEASURES[n.m - 1] + ' first' : 'Costs ' + fmtInt(n.cost) + ' Echoes');
        show(r.buy, !owned && Game.scoreAvailable(n));
        r.buy.disabled = s.echoes < n.cost;
      }
    }
  }

  function closeChart() {
    $('chart').hidden = true;
    $('chart').innerHTML = '';
    chartKind = null;
    chartRefs = null;
    syncPlay();
  }

  /* ---------- Prestige flows ---------- */
  function confirmSupernova() {
    const s = Game.s, f = Game.f;
    const body = el('div', 'pad');
    body.style.padding = '0';
    body.appendChild(el('div', 'big', '+' + fmt(Game.stardustGain()) + ' Stardust'));
    body.appendChild(el('p', '', 'Your star dies and your planets are lost. Stardust, the star chart and your deeds all stay. You start again from an ember, much stronger.'));
    let choice = s.nextClass || 'main';
    if (f.classes) {
      body.appendChild(el('div', 'section-title', 'What kind of star comes next?'));
      const grid = el('div', 'class-grid');
      const paint = () => { for (const b of grid.children) b.classList.toggle('on', b.dataset.id === choice); };
      CLASSES.forEach((c) => {
        const b = el('button', 'class-opt');
        b.type = 'button';
        b.dataset.id = c.id;
        b.append(el('b', '', c.name), el('i', '', c.style), el('span', '', c.desc));
        b.onclick = () => { choice = c.id; paint(); };
        grid.appendChild(b);
      });
      body.appendChild(grid);
      paint();
    }
    openModal({
      title: 'Go Supernova',
      body,
      actions: [{ label: 'Go Supernova', primary: true, run: () => { s.nextClass = choice; runSupernova(choice); } }, { label: 'Not yet' }],
    });
  }

  let novaBusy = false;
  function runSupernova(cls) {
    if (novaBusy) return;
    novaBusy = true;
    Render.playSupernova();
    Sound.whoosh(0.8, 180, 2600, 0.45);
    setTimeout(() => {
      Render.captureGhosts(Game.s);
      const first = Game.s.supernovas === 0;
      Game.supernova(cls);
      Sound.setScale(songScale());
      Sound.setStage(Game.s.stage);
      Render.fitView(false);
      Store.save();
      novaBusy = false;
      refreshTabs();
      Platform.ads.midgame();
      if (first) {
        selectTab('chart');
        showLine('Spend your Stardust on the star chart. Open it from the Chart tab.');
      } else if (currentTab === 'chart') selectTab('chart');
      refresh();
    }, 750);
  }

  function confirmCollapse() {
    openModal({
      title: 'Collapse the star',
      body: textBlock([
        el('div', 'big', '+' + fmtInt(Game.voidGain()) + ' Void'),
        'Gravity takes everything: your Stardust, your star chart and your run. Deeds, Trial rewards and the stars you relit stay. Void relights the sky, and every point of it makes all future runs brighter.',
      ]),
      actions: [{ label: 'Collapse', primary: true, run: runCollapse }, { label: 'Not yet' }],
    });
  }

  /* Pull of Gravity collapses on its own, without taking the player to the sky. */
  function runCollapse(auto) {
    if (!Game.canCollapse()) return;
    Render.captureGhosts(Game.s);
    Render.playCollapse();
    Game.collapse();
    Sound.boom();
    Sound.setScale(songScale());
    Sound.setStage(0);
    Render.fitView(false);
    Store.save();
    refreshTabs();
    if (auto !== true) {
      selectTab('sky');
      openChartSoon();
    } else if (currentTab === 'sky') selectTab('sky');
    refresh();
  }
  function openChartSoon() {
    setTimeout(() => { if (Game.s.voidCur > 0 && $('modal').hidden) openChart('sky'); }, 6500);
  }

  /* The scale the song is played in: a star class has its own, and otherwise the Chord
   * the Choir is singing decides. */
  function songScale() {
    const s = Game.s;
    if (s.starClass !== 'main') return CLASS_BY_ID[s.starClass].scale;
    return s.chord && CHORD_BY_ID[s.chord] ? CHORD_BY_ID[s.chord].scale : CLASS_BY_ID.main.scale;
  }

  /* After the Final Song: Encore, the Choir and Rebirth */
  function resetBody(gain, lines) {
    return textBlock([el('div', 'big', gain)].concat(lines));
  }

  function confirmEncore() {
    const f = Game.f;
    openModal({
      title: 'Give an Encore',
      body: resetBody('+' + fmtInt(Game.echoGain()) + ' Echoes', [
        'Sing it again, for a bigger audience. Your star, Stardust and ' + (f.keepChart ? 'run start over, and the chart stays.' : 'star chart start over.') + ' The Void, the relit sky, the Score, Deeds and Trials all stay.',
        'Echoes write notes on the Score, and every Echo you earn makes Light brighter.',
      ]),
      actions: [{ label: 'Encore', primary: true, run: () => runEncore() }, { label: 'Not yet' }],
    });
  }

    const first = Game.s.encores === 0;
    Render.captureGhosts(Game.s);
    Game.encore();
    Render.playEncore();
    Sound.chime([0, 4, 7, 12, 16, 19], 0.1, 1);
    Sound.setScale(songScale());
    Sound.setStage(Game.s.stage);

    Store.save();
    refreshTabs();
    if (first) {
      selectTab('score');
      showLine('Spend your Echoes on the Score. Open it from the Score tab.');

  function confirmChoir() {
    const s = Game.s, f = Game.f;
    let choice = s.chord || 'major';
    const body = resetBody('+' + fmtInt(Game.voiceGain()) + ' Voices', [
      'Other stars join in. Your Echoes and the Score start over' + (f.keepScore ? ', except the first ' + (f.keepScore === 1 ? 'measure' : f.keepScore + ' measures') : '') +
        ', and so do the star, the chart' + (f.keepVoid ? '' : ' and the Void') + '. The Hymnal, the relit sky, Deeds and Trials stay.',
    ]);
    body.appendChild(el('div', 'section-title', 'Which Chord should the Choir sing?'));

      const b = el('button', 'class-opt');
      b.type = 'button';
      b.dataset.id = c.id;
      b.append(el('b', '', c.name), el('i', '', c.style), el('span', '', c.desc));
      b.onclick = () => { choice = c.id; paint(); };
      grid.appendChild(b);
    });

  function confirmRebirth() {
    const f = Game.f;
    const kept = [];
    if (f.lawScore) kept.push('the first ' + f.lawScore + ' measures of the Score');
    if (f.lawHymns) kept.push('the first ' + f.lawHymns + ' hymns');

      title: 'Let the universe breathe',
      body: resetBody('+' + fmtInt(Game.resonanceGain()) + ' Resonance', [

    box.append(el('h1', '', 'The First Note.'),
      el('p', '', 'It was never silence. It was the rest between two notes, and you have played the next one.'),
      el('p', '', 'It took ' + fmtTime(s.stats.time) + ', ' + fmtInt(s.encores) + ' Encores, ' + fmtInt(s.choirs) + ' Choirs and ' + fmtInt(s.rebirths) + (s.rebirths === 1 ? ' Rebirth.' : ' Rebirths.')),
      el('p', 'ending-more', 'Thank you for playing Starsong.'));
    const b = el('button', 'btn primary', 'Listen');
    b.type = 'button';
    b.onclick = () => { box.hidden = true; syncPlay(); };
    box.appendChild(b);
    syncPlay();
  }

  /* ---------- Chips and HUD ---------- */
  function chipData() {
    const s = Game.s, f = Game.f, d = Game.d;
    const list = [[STAGES[s.stage].name, 'stage']];
    if (s.planets[0] > 0 || s.supernovas > 0) list.push([Math.round(d.bpm * (s.cresc > 0 ? f.crescTempo : 1)) + ' BPM', '']);
    if (s.starClass !== 'main') list.push([CLASS_BY_ID[s.starClass].name, '']);
    if (s.trial) list.push(['Trial: ' + TRIAL_BY_ID[s.trial].name, 'trial']);
    if (s.cresc > 0) list.push(['Crescendo ' + Math.ceil(s.cresc) + 's', 'hot']);
    if (s.aurora > 0) list.push(['Aurora ×' + fmt(s.auroraMult) + ' ' + Math.ceil(s.aurora) + 's', 'cool']);
    if (f.patience > 1 && s.sinceTap >= 30 && s.planets[0] > 0) list.push(['Drift ×' + f.patience, 'cool']);
    if (s.chord && CHORD_BY_ID[s.chord]) list.push([CHORD_BY_ID[s.chord].name + ' chord', 'voice']);
    if (s.stardust > 0 - EPS) list.push([fmt(s.stardust) + ' Stardust', 'dust']);
    if (s.voidCur > 0) list.push([fmtInt(s.voidCur) + ' Void', 'void']);
    if (s.echoes > 0) list.push([fmtInt(s.echoes) + ' Echoes', 'echo']);
    if (s.voices > 0) list.push([fmtInt(s.voices) + ' Voices', 'voice']);
    if (s.resonance > 0) list.push([fmtInt(s.resonance) + ' Resonance', 'res']);
    return list;
  }

  function refreshChips() {
    const data = chipData();
    const key = JSON.stringify(data);
    if (key === chipKey) return;
    chipKey = key;
    const box = $('chips');
    box.innerHTML = '';
    data.forEach(([t, c]) => box.appendChild(el('span', 'chip ' + c, t)));
  }

  function refreshGoal() {
    const s = Game.s, d = Game.d;
    const g = Game.nextGoal();
    show($('goal'), !!g && (s.planets[0] > 0 || s.supernovas > 0));
    if (!g) return;
    const ratio = clamp01(ex(g.have - g.target));
    let text = g.text;
    if (d.lps > -50 && ratio < 1) {
      const need = lsub(g.target, g.have);
      const secs = ex(need - d.lps);
      // A planet comes far sooner than income alone suggests, because buying the cheaper
      // ones speeds it up. A long estimate would only put a new player off.
      const limit = g.text.startsWith('Next planet') ? 90 : 5400;
      if (secs < limit) text += ', about ' + fmtTime(secs);
    }
    put($('goal-text'), text);
    $('goal-fill').style.width = (Math.pow(ratio, 0.33) * 100) + '%';
  }

  function refreshActions() {
    const s = Game.s, f = Game.f;
    show($('btn-crescendo'), Game.crescendoReady() && !(f.autoCresc && s.auto.cresc));
    // A star must burn for a minute before it can go Supernova, so count that down
    const wait = Game.novaWait();
    const nova = Game.canSupernova();
    const btn = $('btn-supernova');
    // Like the Crescendo, a reset that runs itself keeps its button out of the way
    const autoNova = f.autoSupernova && s.auto.supernova && !s.trial;
    show(btn, !autoNova && (nova || (wait > 0 && wait < Infinity && !s.trial)));
    btn.disabled = !nova;
    btn.classList.toggle('hint', nova && s.supernovas === 0);
    if (nova) put(btn, 'Supernova: +' + fmt(Game.stardustGain()) + ' Stardust');
    else if (wait < Infinity) put(btn, 'Supernova in ' + Math.ceil(wait) + 's');
    const col = Game.canCollapse();
    show($('btn-collapse'), col && !(f.autoCollapse && s.auto.collapse && !s.trial));
    if (col) put($('btn-collapse'), 'Collapse: +' + fmtInt(Game.voidGain()) + ' Void');
    show($('btn-song'), Game.canSing());
    const enc = Game.canEncore();
    show($('btn-encore'), enc && !(f.autoEncore && s.auto.encore));
    if (enc) put($('btn-encore'), 'Encore: +' + fmtInt(Game.echoGain()) + ' Echoes');
    const choir = Game.canChoir();
    show($('btn-choir'), choir);
    if (choir) put($('btn-choir'), 'Join the Choir: +' + fmtInt(Game.voiceGain()) + ' Voices');
    const reb = Game.canRebirth();
    show($('btn-rebirth'), reb);
    if (reb) put($('btn-rebirth'), 'Breathe: +' + fmtInt(Game.resonanceGain()) + ' Resonance');
    show($('btn-first'), Game.canFirstNote());
    // Three or more buttons share two columns, and the message line stays clear of them
    const buttons = [...$('hud-bottom').querySelectorAll('button')];
    const key = buttons.map((b) => (b.hidden ? 0 : 1)).join('') + $('harmony').hidden;
    if (key !== actionKey) {
      actionKey = key;
      $('hud-bottom').querySelector('.actions').classList.toggle('many', buttons.filter((b) => !b.hidden).length >= 3);
      placeLine();
    }
  }
  let actionKey = '';
  function placeLine() {
    const top = $('hud-bottom').getBoundingClientRect().top;
    if (top > 0) document.documentElement.style.setProperty('--line-bottom', Math.round(window.innerHeight - top + 12) + 'px');
  }

  /* Reveal each piece of the interface when it first matters. */
  function revealCheck() {
    const s = Game.s;
    const returning = s.supernovas > 0 || s.collapses > 0;
    const hudWasHidden = $('hud-top').hidden;
    if (s.stats.taps > 0 || returning || s.runLight >= 0.5) { show($('hud-top'), true); hideTitle(); }
    if (hudWasHidden && !$('hud-top').hidden) layout(); // so the first toast lands below the counter
    const wasHidden = $('panel-planets').hidden || $('panel-side').hidden;
    if (s.runLight >= 0.7 || returning) show($('panel-planets'), true);
    if (s.runLight >= 1.5 || s.planets[1] > 0 || returning) show($('panel-side'), true);
    if (s.stats.goods + s.stats.perfects >= 3 || returning) show($('harmony'), true);
    show($('mobile-nav'), !$('panel-planets').hidden);
    if (wasHidden && (!$('panel-planets').hidden || !$('panel-side').hidden)) layout();
  }

  function hideTitle() {
    const t = $('title');
    if (t.hidden || t.classList.contains('gone')) return;
    t.classList.add('gone');
    setTimeout(() => { t.hidden = true; }, 600);
  }

  function tipsCheck() {
    const s = Game.s, f = Game.f;
    if (s.light >= 1 && s.planets[0] === 0) tip('tipBuy', 'You can afford a planet now. Buy Cinder from the Orrery.');
    if (s.planets[0] > 0) tip('tipMeridian', 'Planets pay out each time they cross the gold line. All of it happens on the beat.');
    if (s.stats.goods + s.stats.perfects >= 3 && s.planets[0] > 0) tip('tipHarmony', 'On-beat taps build Harmony, which multiplies everything you earn.');
    if (Game.crescendoReady()) tip('tipCresc', 'Harmony is full. Press Crescendo, or the C key, to speed the whole song up.');
    if (s.planets[1] > 0 && s.sinceTap >= 30) tip('tipDrift', 'Your star drifts when you leave it alone. Not tapping for 30 seconds gives Light ×' + f.patience + '.');
    if (s.planets[3] > 0) tip('tipConj', 'Planets that cross on the same beat form a Conjunction and pay more. Every 48 beats, they all line up.');
    if (Game.canSupernova()) tip('tipNova', 'The star can go Supernova. The longer you wait, the more Stardust you get.');
    if (f.autoPlanets > 0) tip('tipAuto', 'Your planets now buy themselves. The Auto-buy bar in the Orrery sets which ones, how often and how much.');
    if (Game.canEncore() && s.encores === 0) tip('tipEncore', 'You can give an Encore. Waiting for a brighter run brings far more Echoes.');
    if (Game.canChoir() && s.choirs === 0) tip('tipChoir', 'The Choir is ready to sing. More Echoes earned first means more Voices.');
    if (Game.canRebirth() && s.rebirths === 0) tip('tipRebirth', 'The universe can breathe. More Voices earned first means more Resonance.');
  }

  /* ---------- Layout ---------- */
  // Keep in step with the drawer media query in css/style.css
  const MOBILE_QUERY = '(max-width: 700px), (orientation: portrait) and (max-width: 1000px)';
  function isMobile() {
    return window.matchMedia(MOBILE_QUERY).matches;
  }

  function layout() {
    const top = $('hud-top').hidden ? 20 : $('hud-top').getBoundingClientRect().bottom + 6;
    const left = $('panel-planets'), right = $('panel-side');
    document.documentElement.style.setProperty('--toast-top', Math.round(top + 4) + 'px');
    // The sound switch lives at the top right: in the corner of the upgrades plate once
    // that is open, so it never crowds the Light counter, and in the window's corner before
    const sound = $('btn-mute');
    const dock = !isMobile() && !right.hidden;
    if (dock && sound.parentElement !== right) right.appendChild(sound);
    if (!dock && sound.parentElement !== document.body) document.body.insertBefore(sound, $('hud-top'));
    sound.classList.toggle('docked', dock);
    if (isMobile()) {
      const drawer = document.body.dataset.drawer;
      const vh = window.innerHeight;
      Render.setInsets(0, 0, top, drawer ? vh * 0.47 + 110 : $('mobile-nav').hidden ? 90 : 128);
    } else {
      const l = left.hidden ? 0 : left.getBoundingClientRect().right + 8;
      const r = right.hidden ? 0 : window.innerWidth - right.getBoundingClientRect().left + 8;
      Render.setInsets(l, r, top, 96);
    }
    placeLine();
  }

  function buildMobileNav() {
    const nav = $('mobile-nav');
    nav.innerHTML = '';
    [['planets', 'Orrery'], ['side', 'Upgrades']].forEach(([id, label]) => {
      const b = el('button', '', label);
      b.type = 'button';
      b.dataset.drawer = id;
      b.onclick = () => {
        document.body.dataset.drawer = document.body.dataset.drawer === id ? '' : id;
        for (const x of nav.children) x.classList.toggle('on', x.dataset.drawer === document.body.dataset.drawer);
        layout();
      };
      nav.appendChild(b);
    });
  }

  /* ---------- Sound controls ---------- */
  function applyVolumes() {
    const st = Game.s.settings;
    const off = st.muted || Platform.silenced;
    Sound.setVolumes(off ? 0 : st.music, off ? 0 : st.sfx);
    const b = $('btn-mute');
    b.classList.toggle('off', off);
    b.setAttribute('aria-pressed', String(off));
    b.setAttribute('aria-label', off ? 'Sound is off' : 'Sound is on');
    b.title = Platform.silenced ? 'Sound is off on this site' : st.muted ? 'Turn sound on (S)' : 'Mute sound (S)';
  }
  function toggleMute() {
    Game.s.settings.muted = !Game.s.settings.muted;
    applyVolumes();
  }

  /* ---------- Refresh ---------- */
  function refresh() {
    const s = Game.s;
    revealCheck();
    if (!$('panel-planets').hidden) { refreshAutoBar(); refreshPlanets(); }
    refreshChips();
    refreshGoal();
    refreshActions();
    if (!$('panel-side').hidden) {
      refreshTabs();
      const t = TABS.find((x) => x.id === currentTab);
      if (t && t.tick) t.tick();
    }
    if (chartKind) refreshChart();
    const f = Game.f;
    const mult = Game.harmonyMult();
    put($('harmony-mult'), '×' + mult.toFixed(2));
    $('harmony').classList.toggle('full', s.harmony >= f.harmMax - EPS || s.cresc > 0);
    tipsCheck();
  }

  function frame(dt) {
    const s = Game.s, f = Game.f, d = Game.d;
    put($('light-value'), fmt(s.light));
    put($('rate'), d.lps > ZERO / 2 ? '+' + fmt(d.lps) + ' per second' : '');
    $('harmony-fill').style.width = (s.harmony / f.harmMax * 100) + '%';
    tickLine(dt);
    refreshClock += dt;
    if (refreshClock >= 0.14) { refreshClock = 0; refresh(); }
    layoutClock += dt;
    if (layoutClock >= 1) { layoutClock = 0; layout(); }
    titleClock += dt;
    if (titleClock >= 2) { titleClock = 0; document.title = (s.stats.taps > 0 ? fmt(s.light) + ' Light, ' : '') + 'Starsong'; }
  }

  /* ---------- Input ---------- */
  function onPointer(e) {
    if (e.button !== undefined && e.button > 0) return;
    Sound.start(Game.s.settings);
    if (Render.hitComet(e.clientX, e.clientY)) {
      Game.catchComet();
      return;
    }
    Game.tap();
  }

  /* Tab moves between the game's own buttons and wraps around, so focus never escapes
   * to the page around the game. */
  function keepFocusInside(e) {
    const all = [...document.querySelectorAll('button, input, select, textarea, [tabindex]:not([tabindex="-1"])')]
      .filter((n) => !n.disabled && n.offsetParent !== null);
    if (!all.length) { e.preventDefault(); return; }
    const i = all.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); all[all.length - 1].focus(); }
    else if (!e.shiftKey && (i === -1 || i === all.length - 1)) { e.preventDefault(); all[0].focus(); }
  }

  function onKey(e) {
    if (e.key === 'Tab') { keepFocusInside(e); return; }
    const tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    // Inside a portal's frame these would scroll the page around the game
    if (e.key.startsWith('Arrow') || e.key === 'PageUp' || e.key === 'PageDown') e.preventDefault();
    if (e.key === 'Escape') {
      if (!$('modal').hidden) { if (modalClose) modalClose(); } else if (chartKind) closeChart();
      return;
    }
    if (!$('modal').hidden || chartKind) return;
    if (e.code === 'Space' || e.key === ' ') {
      if (tag === 'BUTTON') return;
      e.preventDefault();
      if (!e.repeat) { Sound.start(Game.s.settings); Game.tap(); }
      return;
    }
    if (e.repeat) return;
    const k = e.key.toLowerCase();
    if (k === 'c') { Game.startCrescendo(); return; }
    if (k === 's') { toggleMute(); return; }
    if (k === 'a') { toggleAutoBuy(); return; }
    if (k === 'm') {
      const order = [1, 10, 'next', 'max'];
      Game.s.settings.mode = order[(order.indexOf(Game.s.settings.mode) + 1) % 4];
      refreshBuyModes();
      refresh();
      return;
    }
    // The physical number keys, so AZERTY keyboards work without Shift
    const digit = /^(Digit|Numpad)([1-8])$/.exec(e.code || '');
    if (digit) {
      Sound.start(Game.s.settings);
      Game.buyPlanet(Number(digit[2]) - 1, Game.s.settings.mode);
      refresh();
    }
  }

  /* ---------- Game events ---------- */
  function wireGame() {
    Game.on('pulse', (e) => Sound.pulse(e.who, e.late, e.conj));
    Game.on('beat', (e) => Sound.beat(e.beat, Game.currentBps(), e.late, Game.s.harmony / Game.f.harmMax, Game.s.cresc > 0));
    Game.on('tap', (e) => { Sound.tap(e.q); });
    Game.on('buy', (e) => { Sound.buy(e.i, e.first); layout(); });
    Game.on('stage', (i) => { Sound.setStage(i); Sound.chime([0, 2, 4, 7], 0.12, 0.9); });
    Game.on('crescendo', () => { Sound.whoosh(1.2, 300, 3400, 0.22); Sound.chime([0, 2, 4, 5, 7], 0.06, 0.7); });
    Game.on('cometSpawn', () => { Sound.whoosh(2.4, 900, 2600, 0.05); tip('tipComet', 'A comet! Tap it before it leaves.'); });
    Game.on('cometCaught', () => Sound.chime([4, 7, 9], 0.08, 0.8));
    Game.on('deed', (a) => { toast(a.name, a.desc); Sound.chime([2, 4], 0.1, 0.5); });
    Game.on('story', (e) => showLine(e.text));
    Game.on('tapBlocked', () => tip('tipSilence', 'Silence holds. You cannot tap in this Trial.'));
    Game.on('autoSupernova', () => runSupernova(Game.s.nextClass));
    Game.on('autoCollapse', () => runCollapse(true));
    Game.on('autoEncore', () => runEncore());
    // Celebrations for the host page, kept to the biggest moments
    Game.on('supernova', () => { if (Game.s.supernovas === 1) Platform.happy(); });
    Game.on('collapse', () => { if (Game.s.collapses === 1) Platform.happy(); });
    Game.on('ending', () => Platform.happy());
    Game.on('choir', () => { if (Game.s.choirs === 1) Platform.happy(); });
    Game.on('rebirth', () => { if (Game.s.rebirths === 1) Platform.happy(); });
    Game.on('trueEnd', () => Platform.happy());
    ['supernova', 'trialDone', 'collapse', 'sky', 'ending', 'score', 'choir', 'hymn', 'rebirth', 'law', 'trueEnd'].forEach((name) => Game.on(name, () => Platform.progress(progressPercent())));
    Game.on('trialDone', (t) => {
      toast('Trial complete: ' + t.name, t.reward);
      Sound.chime([0, 2, 4, 7, 9], 0.1, 0.9);
      if (currentTab === 'trials') selectTab('trials');
    });
  }

  function rebuildAll() {
    chipKey = ''; tunKey = ''; autoKey = '';
    $('tabs').__key = '';
    lineQueue.length = 0;
    closeModal();
    closeChart();
    refreshBuyModes();
    selectTab('tunings');
    show($('hud-top'), false);
    show($('panel-planets'), false);
    show($('panel-side'), false);
    show($('harmony'), false);
    const t = $('title');
    const fresh = Game.s.stats.taps === 0 && Game.s.supernovas === 0;
    t.hidden = !fresh;
    t.classList.remove('gone');
    revealCheck();
    refresh();
    layout();
    applyVolumes();
  }

  function init() {
    buildPlanets();
    buildBuyModes();
    buildMobileNav();
    wireGame();
    $('fx').addEventListener('pointerdown', onPointer);
    window.addEventListener('keydown', onKey);
    window.addEventListener('resize', layout);
    $('btn-mute').onclick = (e) => { toggleMute(); if (e.detail) $('btn-mute').blur(); };
    Platform.onSilence = applyVolumes;
    $('btn-crescendo').onclick = () => Game.startCrescendo();
    $('btn-supernova').onclick = confirmSupernova;
    $('btn-collapse').onclick = confirmCollapse;
    $('btn-song').onclick = runEnding;
    $('btn-encore').onclick = confirmEncore;
    $('btn-choir').onclick = confirmChoir;
    $('btn-rebirth').onclick = confirmRebirth;
    $('btn-first').onclick = runTrueEnding;
    $('modal').addEventListener('pointerdown', (e) => { if (e.target === $('modal') && modalClose) modalClose(); });
    rebuildAll();
  }

  function offlineReport(r) {
    if (!r) return;
    const lines = ['You were away for ' + fmtTime(r.away) + '.'];
    const actions = [{ label: 'Back to the song', primary: true }];
    if (r.gain > ZERO / 2) {
      lines.unshift(el('div', 'big', '+' + fmt(r.gain) + ' Light'));
      lines.push('Your planets kept singing at ' + Math.round(r.eff * 100) + '% strength' + (r.capped ? ' for the first ' + fmtTime(r.secs) + '.' : '.'));
      if (Platform.ads.available()) {
        actions.push({ label: 'Watch an ad to double it', run: () => Platform.ads.rewarded(() => {
          if (Game.grantOffline(r)) toast('Doubled', '+' + fmt(r.gain) + ' more Light.');
        }) });
      }
    } else {
      lines.push('Nothing was orbiting, so nothing changed.');
    }
    openModal({ title: 'While you were gone', body: textBlock(lines), actions });
  }

  return { init, frame, refresh, rebuildAll, layout, offlineReport, showLine, toast, selectTab, openChart, closeChart, confirmSupernova, confirmCollapse, syncPlay, progressPercent, songScale };
})();

/* Starsong: Alloy account sync. The Alloy Studios site owns sign-in and gives the game
 * one object. Anywhere else that object is missing, this module does nothing, and the
 * browser save stays the only save. It is a layer on top of that save, never a
 * replacement for it, so the game plays exactly the same with or without an account. */

const Cloud = (() => {
  const GAME_ID = 'starsong';
  const OWNER_KEY = 'starsong.owner.v1';
  const RETRY_MS = 60000;
  // A clamp only matters if it touched real progress. Comparing every field would turn
  // any field the server does not know yet into a rollback on every save.
  const WATCHED = ['light', 'runLight', 'totalLight', 'stardust', 'stardustTotal', 'voidCur', 'voidTotal', 'supernovas', 'collapses'];

  const AA = (() => {
    try { return window.parent !== window ? window.parent.AlloyAccount || null : null; } catch (err) { return null; }
  })();

  let uid = null;           // the account whose cloud save has finished loading
  let loading = false;
  let paused = false;
  let status = 'guest';
  let seq = 0, lastTry = 0;
  const sent = new Map();   // saves awaiting a reply, by sequence number

  function readOwner() {
    try { return localStorage.getItem(OWNER_KEY); } catch (err) { return null; }
  }
  function writeOwner(id) {
    try { localStorage.setItem(OWNER_KEY, id); } catch (err) { /* storage blocked */ }
  }

  function setStatus(next) {
    status = next;
  }

  /* Lifetime Light never resets, so it says which of two saves is further along. */
  function isAhead(a, b) {
    if (a.totalLight !== b.totalLight) return a.totalLight > b.totalLight;
    return (a.lastSeen || 0) > (b.lastSeen || 0);
  }

  function adopt(data) {
    Store.backup();
    Store.adopt(Game.fromCloud(data));
    sent.clear();
  }

  /* Runs on start, on sign-in and on sign-out. Nothing goes up until this has finished,
   * or a slow load could let an empty device write over a real account. */
  async function sync() {
    const user = AA.user();
    uid = null;
    sent.clear();
    if (!user) { setStatus('guest'); return; }
    if (paused) return;
    loading = true;
    lastTry = Date.now();
    setStatus('syncing');
    let res = null;
    try { res = await AA.load(GAME_ID); } catch (err) { res = null; }
    loading = false;
    const now = AA.user();
    if (!now || now.uid !== user.uid) return; // the account changed while this was loading
    if (!res) { setStatus('unreachable'); return; }

    // A save left on this browser by someone else's account is not this player's
    const owner = readOwner();
    const foreign = !!owner && owner !== user.uid;
    if (res.data && (foreign || isAhead(res.data, Game.s))) {
      adopt(res.data);
      UI.toast('Welcome back', 'Loaded your save from your Alloy account.');
      UI.offlineReport(Game.applyOffline(Date.now()));
      Game.s.lastSeen = Date.now();
    } else if (!res.data && foreign) {
      Store.backup();
      Store.adopt(Game.newState());
    }
    writeOwner(user.uid);
    uid = user.uid;
    push(true);
  }

  function wasClamped(mine, theirs) {
    if (WATCHED.some((k) => Math.abs(mine[k] - theirs[k]) > 1e-6)) return true;
    return mine.planets.some((lv, i) => lv !== (theirs.planets || [])[i]);
  }

  function onReply(res) {
    if (!uid) return;
    if (!res || !res.ok) { setStatus('unreachable'); return; }
    setStatus('saved');
    const data = res.data;
    if (!data || !sent.has(data.seq)) return;
    const mine = sent.get(data.seq);
    // Replies arrive in order, so anything older than this one has been dealt with
    for (const k of sent.keys()) if (k <= data.seq) sent.delete(k);
    if (wasClamped(mine, data)) {
      const newer = data.totalLight > mine.totalLight;
      adopt(data);
      if (newer) UI.toast('Caught up', 'Loaded newer progress from your Alloy account.');
      else UI.toast('Save corrected', 'Your Alloy account changed a value it could not confirm.');
    }
  }

  /* Hands the latest save to the site, which batches routine calls. `now` is for
   * checkpoints such as a Supernova. */
  function push(now) {
    if (!AA || paused) return;
    if (!uid) {
      if (AA.user() && !loading && Date.now() - lastTry > RETRY_MS) sync();
      return;
    }
    const data = Game.toCloud();
    data.seq = ++seq;
    sent.set(data.seq, data);
    if (sent.size > 8) sent.delete(sent.keys().next().value);
    if (status !== 'saved') setStatus('syncing');
    AA.save(GAME_ID, data, now ? { now: true } : undefined).then(onReply, () => setStatus('unreachable'));
  }

  /* Stops syncing until the next load, so Erase can never reach the account's copy. */
  function pause() {
    paused = true;
    uid = null;
    setStatus('paused');
  }

  function statusText() {
    switch (status) {
      case 'saved': return 'Saved to your Alloy account.';
      case 'syncing': return 'Syncing with your Alloy account.';
      case 'unreachable': return 'Your Alloy account cannot be reached right now. Your progress is safe in this browser.';
      case 'paused': return 'Sync is off until you reload this page. Your Alloy account still has its copy.';
      default: return 'Sign in to keep your progress on any device.';
    }
  }

  function init() {
    if (!AA) return;
    ['supernova', 'collapse', 'trialDone', 'sky', 'ending'].forEach((name) => Game.on(name, () => push(true)));
    AA.ready.then(sync, () => setStatus('unreachable'));
    AA.onChange(sync);
  }

  return {
    init, push, pause, statusText,
    get available() { return !!AA; },
    get signedIn() { return !!AA && !!AA.user(); },
    signIn() { if (AA) AA.signIn(); },
  };
})();

/* Starsong: start-up, saving and the main loop. */

const Store = (() => {
  const KEY = 'starsong.save.v1';
  const BACKUP = 'starsong.backup.v1';
  let lastBackup = 0;

  function read(key) {
    return Platform.store.get(key);
  }
  function write(key, value) {
    return Platform.store.set(key, value);
  }

  function save() {
    const text = Game.serialize();
    const ok = write(KEY, text);
    const now = Date.now();
    if (now - lastBackup > 600000) { lastBackup = now; write(BACKUP, text); }
    return ok;
  }

  /* Tries the main save, then the backup. Returns null for a new player. */
  function load(extra) {
    const candidates = [extra, read(KEY), read(BACKUP)];
    for (const text of candidates) {
      if (!text) continue;
      try { return Game.deserialize(text); } catch (err) { console.warn('Skipping an unreadable save', err); }
    }
    return null;
  }

  /* Replaces the running game, used by Import. */
  function adopt(state) {
    Game.load(state);
    Sound.setScale(UI.songScale());
    Render.reset();
    UI.rebuildAll();
    save();
  }

  function wipe() {
    Cloud.pause();
    Platform.store.remove(KEY);
    Platform.store.remove(BACKUP);
    adopt(Game.newState());
  }

  /* Keeps a copy of the running game before something else replaces it. */
  function backup() {
    write(BACKUP, Game.serialize());
    lastBackup = Date.now();
  }

  return { save, load, adopt, wipe, backup };
})();

function startGame(hotData) {
  Game.load(Store.load(hotData && hotData.save));
  Render.init();
  UI.init();
  Render.reset();
  Sound.setScale(UI.songScale());
  Sound.setStage(Game.s.stage);
  UI.offlineReport(Game.applyOffline(Date.now()));
  Game.s.lastSeen = Date.now();

  let last = performance.now(), undrawn = 0, frames = 0;
  let firstFrame = true;
  function loop(now) {
    // Queue the next frame first, so one bad frame can never stop the game
    requestAnimationFrame(loop);
    if (firstFrame) {
      firstFrame = false;
      Platform.loading(false);
      UI.syncPlay();
    }
    // A frame's timestamp can come slightly before the moment the game started
    const seconds = Math.max(0, (now - last) / 1000);
    const dt = Math.min(seconds, 0.25);
    last = now;
    Game.tick(dt);
    Render.watchFrames(seconds);
    // The lowest graphics level draws the sky every other frame. The game never slows.
    undrawn += dt;
    if (!Render.lowPower() || frames++ % 2 === 0) { Render.frame(undrawn); undrawn = 0; }
    UI.frame(dt);
  }
  requestAnimationFrame(loop);

  setInterval(() => { Store.save(); Cloud.push(); Platform.progress(UI.progressPercent()); }, 15000);
  Platform.progress(UI.progressPercent());
  Cloud.init();

  // Browsers stop animation frames in hidden tabs, so keep time moving at a slower rate.
  let lastHidden = Date.now();
  setInterval(() => {
    const now = Date.now();
    if (document.hidden) {
      Game.tick(Math.min((now - lastHidden) / 1000, 5));
      Game.s.lastSeen = now;
    }
    lastHidden = now;
  }, 1000);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { Store.save(); Cloud.push(); return; }
    last = performance.now();
    UI.offlineReport(Game.applyOffline(Date.now()));
    Game.s.lastSeen = Date.now();
  });
  window.addEventListener('pagehide', Store.save);
}

/* In the claude.ai viewer this hook carries the save across a republish. Elsewhere it
 * is absent and the game simply boots. */
(() => {
  const hot = window.claude && window.claude.hot;
  try { if (hot && hot.snapshot) hot.snapshot(() => ({ save: Game.serialize() })); } catch (err) { /* optional */ }
  const boot = (data) => Platform.ready.then(() => startGame(data || {}), () => startGame(data || {}));
  if (hot && hot.ready) hot.ready(boot);
  else boot(hot && hot.data);
})();

</script>
