<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
/* Alloy Studios home check - keep this the FIRST script in <head>. */
(function () {
  var GAME = "starsong";                                 // this game's id on the site
  var h = location.hostname;
  var home = h === "alloy-studios.github.io" || h === "localhost" || h === "127.0.0.1" || location.protocol === "file:";
  var stranger = false;
  try { stranger = window.top !== window.self && window.top.location.hostname !== h; }
  catch (e) { stranger = true; }                             // can't read the parent: someone else's page
  if (home && !stranger) return;
  var url = "https://alloy-studios.github.io/" + GAME + "/";
  document.documentElement.innerHTML =
    '<head><meta charset="utf-8"><title>Alloy Studios</title></head>' +
    '<body style="margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;' +
    'background:#0b0d14;color:#eef1f7;font:16px/1.5 system-ui,sans-serif;text-align:center">' +
    '<div><p style="margin:0 0 10px;font-size:22px;font-weight:700">This game is by Alloy Studios</p>' +
    '<p style="margin:0 0 24px;color:#9aa3b8">You’re playing an unofficial copy. The real one is free.</p>' +
    '<a href="' + url + '" target="_top" rel="noopener" style="display:inline-block;padding:11px 22px;' +
    'border-radius:999px;background:#7c5cff;color:#fff;text-decoration:none;font-weight:600">' +
    'Play it at alloy-studios.github.io</a></div></body>';
  if (window.stop) window.stop();                            // stop the rest of the page loading
  throw new Error("Alloy Studios: not on the home site");
})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Starsong</title>
<meta name="description" content="An incremental game you can hear. Relight a silent universe, one planet at a time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Marcellus&display=swap">
<style>
/* Starsong. Brass instrument plates laid over a living sky: the panels should read
 * like the fittings of an orrery, and the star is always the brightest thing on screen. */
:root {
  color-scheme: dark;
  --ink: #05060f;
  --plate: rgba(12, 13, 32, 0.74);
  --plate-solid: #0f1027;
  --plate-raise: rgba(216, 183, 120, 0.07);
  --line: rgba(216, 183, 120, 0.2);
  --line-strong: rgba(216, 183, 120, 0.52);
  --brass: #d8b778;
  --parchment: #f2e9d8;
  --mist: #aeafcb;
  --faint: #76778f;
  --ember: #ff9a5a;
  --harmony: #7fdcff;
  --dust: #d0b6ff;
  --void: #a596ff;
  --echo: #ffc98a;
  --voice: #8fe6c4;
  --res: #f5a9dc;
  --good: #9be8a4;
  --display: 'Marcellus', Georgia, 'Times New Roman', serif;
  --body: 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  --panel-w: 332px;
  --gap: 14px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--ink);
  color: var(--parchment);
  font: 15px/1.35 var(--body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  touch-action: manipulation;
}
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--harmony);
  outline-offset: 2px;
}

#gl, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#fx { touch-action: none; cursor: pointer; }

/* Title */
.title {
  position: fixed;
  left: 0; right: 0; top: 13%;
  text-align: center;
  pointer-events: none;
  transition: opacity 0.5s ease;
  padding-inline: 20px;
}
.title.gone { opacity: 0; }
.title h1 {
  font: 400 clamp(46px, 9vw, 92px)/1 var(--display);
  letter-spacing: 0.16em;
  margin-right: -0.16em;
  color: var(--parchment);
  text-shadow: 0 0 44px rgba(255, 154, 90, 0.4);
}
.title p { margin-top: 14px; color: var(--mist); font-size: 18px; font-style: italic; }
.title .title-hint {
  position: fixed;
  left: 0; right: 0; bottom: 15%;
  margin: 0;
  color: var(--brass);
  font-size: 16px;
  font-style: normal;
  letter-spacing: 0.06em;
  animation: breathe 2.5s ease-in-out infinite;
}
@keyframes breathe { 50% { opacity: 0.45; } }
.title kbd {
  display: inline-block;
  margin: 0 3px;
  padding: 1px 9px 2px;
  border: 1px solid var(--brass);
  border-bottom-width: 3px;
  border-radius: 4px;
  font: 500 14px var(--body);
  letter-spacing: 0.04em;
  color: var(--parchment);
  background: rgba(216, 183, 120, 0.1);
}

/* The sound switch: always on screen, and never more than one click away */
.sound-btn {
  position: fixed;
  top: max(12px, env(safe-area-inset-top, 0px));
  right: 12px;
  z-index: 14;
  width: 38px;
  height: 38px;
  padding: 7px;
  display: grid;
  place-items: center;
  background: rgba(10, 11, 28, 0.72);
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  color: var(--brass);
  cursor: pointer;
}
.sound-btn svg { width: 100%; height: 100%; display: block; }
.sound-btn.docked { position: absolute; top: 4px; right: 6px; width: 32px; height: 32px; padding: 6px; z-index: 2; }
.panel-right .tabs { padding-right: 44px; }
.sound-btn:hover { color: var(--parchment); border-color: var(--brass); }
.sound-btn .cross { display: none; }
.sound-btn.off { color: var(--mist); }
.sound-btn.off .wave { display: none; }
.sound-btn.off .cross { display: inline; }

/* A gentle pulse on the thing a new player should do next */
@keyframes hint { 50% { box-shadow: inset 0 0 0 1px rgba(255, 214, 140, 0.95), 0 0 18px rgba(255, 200, 110, 0.35); } }
.planet-card.hint { animation: hint 1.4s ease-in-out infinite; box-shadow: inset 0 0 0 1px rgba(255, 214, 140, 0.45); }
.act.hint { animation: call 1.3s ease-in-out infinite; }
@keyframes rise-in { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* Top readout */
.hud-top {
  position: fixed;
  top: max(12px, env(safe-area-inset-top, 0px));
  left: 50%;
  transform: translateX(-50%);
  width: min(560px, calc(100vw - 2 * var(--panel-w) - 40px));
  min-width: min(240px, calc(100vw - 24px));
  text-align: center;
  pointer-events: none;
  animation: rise-in 0.6s 0.35s ease both;
}
.light-row { display: flex; justify-content: center; align-items: baseline; gap: 9px; }
.light-value {
  font: 400 clamp(32px, 4.4vw, 50px)/1.05 var(--display);
  letter-spacing: 0.01em;
  text-shadow: 0 0 22px rgba(255, 196, 122, 0.5), 0 2px 10px rgba(0, 0, 0, 0.8);
  font-variant-numeric: lining-nums tabular-nums;
}
.light-unit { font: 400 15px var(--display); color: var(--brass); letter-spacing: 0.1em; text-shadow: 0 1px 6px #000; }
.rate { color: var(--mist); font-size: 15px; min-height: 20px; text-shadow: 0 1px 6px #000; font-variant-numeric: lining-nums tabular-nums; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px 7px; margin-top: 5px; }
.chip {
  padding: 1px 8px;
  border: 1px solid var(--line);
  background: rgba(8, 9, 24, 0.55);
  color: var(--mist);
  font-size: 13px;
  border-radius: 2px;
  font-variant-numeric: lining-nums tabular-nums;
}
.chip.stage { color: var(--parchment); border-color: var(--line-strong); }
.chip.hot { color: #ffe2a6; border-color: rgba(255, 210, 122, 0.7); }
.chip.cool { color: var(--harmony); border-color: rgba(127, 220, 255, 0.5); }
.chip.trial { color: #ffb9a6; border-color: rgba(255, 150, 120, 0.6); }
.chip.dust { color: var(--dust); border-color: rgba(208, 182, 255, 0.5); }
.chip.void { color: var(--void); border-color: rgba(165, 150, 255, 0.5); }
.chip.echo { color: var(--echo); border-color: rgba(255, 201, 138, 0.5); }
.chip.voice { color: var(--voice); border-color: rgba(143, 230, 196, 0.5); }
.chip.res { color: var(--res); border-color: rgba(245, 169, 220, 0.5); }

.goal { display: inline-flex; flex-direction: column; gap: 3px; margin-top: 7px; color: var(--mist); font-size: 13.5px; text-shadow: 0 1px 6px #000; }
.goal-bar { display: block; width: 210px; max-width: 70vw; height: 3px; margin-inline: auto; background: rgba(216, 183, 120, 0.17); }
.goal-bar i { display: block; height: 100%; width: 0; background: var(--brass); transition: width 0.25s linear; }

/* Plates */
.panel {
  position: fixed;
  top: var(--gap);
  bottom: var(--gap);
  width: var(--panel-w);
  display: flex;
  flex-direction: column;
  background: var(--plate);
  border: 1px solid var(--line);
  backdrop-filter: blur(9px);
  -webkit-backdrop-filter: blur(9px);
  animation: plate-in 0.9s ease both;
}
.panel::before, .panel::after {
  content: '';
  position: absolute;
  width: 11px; height: 11px;
  border: 1px solid var(--line-strong);
  pointer-events: none;
}
.panel::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
.panel::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
@keyframes plate-in { from { opacity: 0; } }
.panel-left { left: max(var(--gap), env(safe-area-inset-left, 0px)); bottom: auto; max-height: calc(100% - 2 * var(--gap)); }
.panel-right { right: max(var(--gap), env(safe-area-inset-right, 0px)); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px 8px; border-bottom: 1px solid var(--line); }
.panel-head h2 { font: 400 19px var(--display); letter-spacing: 0.06em; color: var(--brass); }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }

.head-tools { display: flex; align-items: center; gap: 7px; }

.buy-modes { display: flex; border: 1px solid var(--line); }
.buy-modes button {
  background: none;
  border: 0;
  border-right: 1px solid var(--line);
  padding: 2px 8px;
  color: var(--mist);
  cursor: pointer;
  font-size: 13.5px;
  min-height: 26px;
}
.buy-modes button:last-child { border-right: 0; }
.buy-modes button.on { background: var(--brass); color: #17120a; font-weight: 700; }

/* Auto-buy bar */
.auto-bar { border-bottom: 1px solid var(--line); }
.auto-top { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; }
.auto-power, .auto-more {
  flex: none;
  min-height: 26px;
  padding: 2px 8px;
  background: none;
  border: 1px solid var(--line);
  color: var(--mist);
  cursor: pointer;
  font-size: 13.5px;
}
.auto-power.on { background: var(--brass); border-color: var(--brass); color: #17120a; font-weight: 700; }
.auto-more.on { color: var(--brass); border-color: var(--line-strong); }
.auto-status {
  flex: 1;
  min-width: 0;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
  color: var(--mist);
  font-size: 13px;
  line-height: 1.15;
  font-variant-numeric: lining-nums tabular-nums;
}
.auto-options { display: flex; flex-direction: column; gap: 8px; padding: 4px 12px 10px; }

/* Planet rows */
.planet-slot { display: flex; }
.planet-slot .planet-card { flex: 1; min-width: 0; }
.pc-auto { display: none; }
.with-auto .pc-auto {
  display: block;
  flex: none;
  width: 26px;
  padding: 0;
  background: none;
  border: 0;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  color: var(--faint);
  cursor: pointer;
  font: 400 13px var(--display);
  text-decoration: line-through;
}
.with-auto .pc-auto.on { background: rgba(216, 183, 120, 0.13); color: var(--brass); text-decoration: none; }
.with-auto.auto-paused .pc-auto.on { background: none; color: var(--mist); }
.with-auto .pc-auto:hover { color: var(--parchment); }
.planet-card.saving .pc-name { color: var(--harmony); }
.planet-card {
  position: relative;
  display: grid;
  grid-template-columns: 46px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  width: 100%;
  padding: 8px 12px 8px 8px;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--line);
  text-align: left;
  cursor: default;
  overflow: hidden;
}
.planet-card::before {
  content: '';
  position: absolute;
  inset: 0 auto 0 0;
  width: calc(var(--afford, 0) * 100%);
  background: linear-gradient(90deg, rgba(216, 183, 120, 0.03), rgba(216, 183, 120, 0.12));
  pointer-events: none;
}
.planet-card.can { cursor: pointer; }
.planet-card.can:hover { background: var(--plate-raise); }
.planet-card:active.can { background: rgba(216, 183, 120, 0.15); }
.planet-card.locked { opacity: 0.55; }
.pc-thumb { position: relative; width: 46px; height: 46px; }
.pc-thumb canvas { width: 46px; height: 46px; display: block; }
.planet-card.unowned .pc-thumb canvas { filter: grayscale(0.85) brightness(0.55); }
.pc-main { position: relative; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.pc-name { font: 400 16px var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc-lv { font: 500 13px var(--body); color: var(--brass); margin-left: 4px; font-variant-numeric: lining-nums tabular-nums; }
.pc-sub { color: var(--mist); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: lining-nums; }
.pc-mile { display: block; height: 2px; margin-top: 3px; background: rgba(216, 183, 120, 0.15); }
.pc-mile i { display: block; height: 100%; background: var(--harmony); opacity: 0.8; }
.pc-buy { position: relative; text-align: right; min-width: 64px; }
.pc-qty { display: block; color: var(--faint); font-size: 12px; }
.pc-cost { display: block; font-size: 14.5px; color: var(--faint); font-weight: 500; font-variant-numeric: lining-nums tabular-nums; }
.planet-card.can .pc-cost { color: var(--parchment); }
.planet-card.can .pc-qty { color: var(--brass); }

/* Tabs */
.tabs { display: flex; flex-wrap: wrap; gap: 0 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--line); }
.tabs button {
  position: relative;
  background: none;
  border: 0;
  padding: 5px 5px 7px;
  color: var(--mist);
  cursor: pointer;
  font-size: 14px;
  min-height: 32px;
}
.tabs button:hover { color: var(--parchment); }
.tabs button.on { color: var(--brass); box-shadow: inset 0 -2px 0 var(--brass); }
.tabs button.new::after { content: ''; position: absolute; top: 6px; right: 1px; width: 6px; height: 6px; background: var(--ember); transform: rotate(45deg); }

.pad { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.empty { color: var(--mist); padding: 16px 12px; font-style: italic; }
.note { color: var(--mist); font-size: 14px; }
.section-title { font: 400 15px var(--display); letter-spacing: 0.08em; color: var(--brass); }

/* Upgrade rows */
.row {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 2px 10px;
  width: 100%;
  padding: 9px 12px;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--line);
  text-align: left;
  cursor: default;
}
.row-name { font: 400 15.5px var(--display); }
.row-cost { color: var(--faint); font-weight: 500; font-variant-numeric: lining-nums tabular-nums; text-align: right; white-space: nowrap; }
.row-desc { grid-column: 1 / -1; color: var(--mist); font-size: 13.5px; }
.row.can { cursor: pointer; }
.row.can:hover { background: var(--plate-raise); }
.row.can .row-cost { color: var(--parchment); }
.row.can .row-name { color: #ffe9bf; }
.row.owned { cursor: default; opacity: 0.62; }
.row.owned .row-cost { color: var(--good); }
.row:disabled { color: inherit; }
.row.saving .row-name::after { content: ' · saving up'; color: var(--harmony); font: 400 13px var(--body); }

/* Controls */
.btn {
  background: none;
  border: 1px solid var(--line-strong);
  padding: 7px 14px;
  color: var(--parchment);
  cursor: pointer;
  min-height: 36px;
}
.btn:hover { background: var(--plate-raise); }
.btn.primary { background: var(--brass); color: #17120a; border-color: var(--brass); font-weight: 700; }
.btn.primary:hover { background: #e9cc92; }
.btn.danger { border-color: rgba(255, 130, 110, 0.6); color: #ffb9a6; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

.setting { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 14.5px; }
.setting input[type='range'] { width: 130px; accent-color: var(--brass); }
.setting select, .setting input[type='number'] {
  background: var(--plate-solid);
  color: var(--parchment);
  border: 1px solid var(--line-strong);
  padding: 4px 6px;
  font: inherit;
}
.setting input[type='number'] { width: 76px; }
.setting input[type='checkbox'] { width: 19px; height: 19px; accent-color: var(--brass); }
textarea.save-box {
  width: 100%;
  height: 92px;
  resize: vertical;
  background: var(--plate-solid);
  color: var(--mist);
  border: 1px solid var(--line-strong);
  padding: 8px;
  font: 12px/1.3 Consolas, monospace;
  user-select: text;
  -webkit-user-select: text;
}

.stat { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; font-size: 14.5px; border-bottom: 1px dotted var(--line); }
.stat b { font-weight: 500; color: var(--parchment); font-variant-numeric: lining-nums tabular-nums; text-align: right; }
.stat span { color: var(--mist); }
.story-line { color: var(--mist); font-style: italic; font-size: 14.5px; padding: 4px 0; }

.deed-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.deed { padding: 6px 8px; border: 1px solid var(--line); opacity: 0.5; min-width: 0; }
.deed.got { opacity: 1; border-color: var(--line-strong); background: var(--plate-raise); }
.deed b { display: block; font: 400 14px var(--display); }
.deed span { display: block; font-size: 12.5px; color: var(--mist); }

.trial { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; }
.trial h3 { font: 400 16px var(--display); display: flex; justify-content: space-between; gap: 8px; }
.trial .done { color: var(--good); font: 500 13px var(--body); }
.trial p { font-size: 13.5px; color: var(--mist); }
.trial .reward { color: #ffe2a6; }
.trial .btn { align-self: flex-start; margin-top: 5px; padding: 4px 12px; min-height: 30px; }

/* Bottom bar */
.hud-bottom {
  position: fixed;
  left: 50%;
  bottom: max(16px, env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  width: min(440px, calc(100vw - 2 * var(--panel-w) - 40px));
  min-width: min(240px, calc(100vw - 24px));
  display: flex;
  flex-direction: column;
  gap: 9px;
  align-items: stretch;
  pointer-events: none;
}
.harmony-top { display: flex; justify-content: space-between; font-size: 14px; color: var(--harmony); text-shadow: 0 1px 5px #000; font-variant-numeric: lining-nums tabular-nums; }
.harmony-track {
  position: relative;
  height: 8px;
  margin-top: 3px;
  background: rgba(127, 220, 255, 0.1);
  outline: 1px solid rgba(127, 220, 255, 0.28);
}
.harmony-track::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(90deg, transparent 0 calc(5% - 1px), rgba(5, 6, 15, 0.8) calc(5% - 1px) 5%);
}
.harmony-track i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #4fb8e8, var(--harmony)); box-shadow: 0 0 10px rgba(127, 220, 255, 0.6); }
.harmony.full .harmony-track i { background: linear-gradient(90deg, #ffc56b, #fff0c8); box-shadow: 0 0 14px rgba(255, 210, 122, 0.8); }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.actions.many { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.actions.many .act { font-size: 14px; padding: 6px 10px; min-height: 40px; line-height: 1.2; }
.act {
  pointer-events: auto;
  background: rgba(10, 11, 28, 0.82);
  border: 1px solid var(--line-strong);
  padding: 8px 18px;
  cursor: pointer;
  font: 400 16px var(--display);
  letter-spacing: 0.04em;
  min-height: 42px;
}
.act-cresc { color: #ffe2a6; border-color: #ffd27a; box-shadow: 0 0 18px rgba(255, 210, 122, 0.45); animation: call 1.3s ease-in-out infinite; }
.act-nova { color: #fff; border-color: #8fc2ff; box-shadow: 0 0 22px rgba(120, 170, 255, 0.55); }
.act-void { color: #dcd5ff; border-color: var(--void); box-shadow: 0 0 22px rgba(150, 130, 255, 0.5); }
.act-song { color: #17120a; background: var(--brass); border-color: var(--brass); animation: call 1.6s ease-in-out infinite; }
.act-echo { color: #ffe6c2; border-color: var(--echo); box-shadow: 0 0 22px rgba(255, 190, 120, 0.5); }
.act-choir { color: #d8fff0; border-color: var(--voice); box-shadow: 0 0 22px rgba(120, 230, 190, 0.5); }
.act-rebirth { color: #ffe0f4; border-color: var(--res); box-shadow: 0 0 22px rgba(245, 160, 215, 0.5); }
.act:hover { filter: brightness(1.25); }
.act:disabled { cursor: default; opacity: 0.6; box-shadow: none; filter: none; }
@keyframes call { 50% { box-shadow: 0 0 30px rgba(255, 210, 122, 0.85); } }

/* Messages */
.line {
  position: fixed;
  left: 50%;
  bottom: var(--line-bottom, 118px);
  transform: translateX(-50%);
  width: min(520px, calc(100vw - 2 * var(--panel-w) - 40px));
  min-width: min(240px, calc(100vw - 32px));
  text-align: center;
  color: var(--parchment);
  font: italic 400 17.5px var(--body);
  text-shadow: 0 1px 9px #000, 0 0 3px #000;
  opacity: 0;
  transition: opacity 0.9s ease;
  pointer-events: none;
  text-wrap: balance;
}
.line.show { opacity: 1; }
.toasts { position: fixed; top: var(--toast-top, 120px); left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 2 * var(--panel-w) - 40px); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; z-index: 6; }
.toast {
  background: var(--plate);
  border: 1px solid var(--line-strong);
  padding: 6px 12px;
  max-width: 240px;
  font-size: 14px;
  backdrop-filter: blur(6px);
  animation: toast 5s ease both;
}
.toast b { display: block; font: 400 15px var(--display); color: var(--brass); }
@keyframes toast { 0% { opacity: 0; transform: translateY(-6px); } 6%, 90% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* Modal */
.modal {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(3, 4, 12, 0.66);
  padding: 16px;
  z-index: 30;
}
.modal-card {
  position: relative;
  width: min(520px, 100%);
  max-height: calc(100% - 16px);
  overflow-y: auto;
  background: var(--plate-solid);
  border: 1px solid var(--line-strong);
  padding: 20px 22px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  user-select: text;
  -webkit-user-select: text;
}
.modal-card h2 { font: 400 26px var(--display); color: var(--brass); letter-spacing: 0.03em; }
.modal-card p { color: var(--mist); font-size: 15.5px; }
.modal-card .big { font: 400 30px var(--display); color: var(--parchment); font-variant-numeric: lining-nums; }
.class-grid { display: grid; gap: 6px; }
.class-opt {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 0 10px;
  width: 100%;
  background: none;
  border: 1px solid var(--line);
  padding: 7px 10px;
  text-align: left;
  cursor: pointer;
}
.class-opt.on { border-color: var(--brass); background: var(--plate-raise); }
.class-opt b { font: 400 15.5px var(--display); }
.class-opt i { font-style: normal; font-size: 13px; color: var(--brass); text-align: right; }
.class-opt span { grid-column: 1 / -1; font-size: 13.5px; color: var(--mist); }

/* Star chart */
.chart {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  background: rgba(4, 5, 14, 0.93);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
}
.chart-map { min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 10px; }
.chart-map svg { width: 100%; height: 100%; display: block; }
.chart-side { display: flex; flex-direction: column; gap: 12px; padding: 18px 16px; border-left: 1px solid var(--line); background: rgba(12, 13, 32, 0.8); min-height: 0; overflow-y: auto; }
.chart-side h2 { font: 400 25px var(--display); color: var(--brass); }
.chart-balance { font: 400 22px var(--display); font-variant-numeric: lining-nums; }
.chart-balance.dust { color: var(--dust); }
.chart-balance.void { color: var(--void); }
.chart-balance.echo { color: var(--echo); }
.chart-balance.voice { color: var(--voice); }
.chart-balance.res { color: var(--res); }
.chart-detail { flex: 1; display: flex; flex-direction: column; gap: 6px; min-height: 130px; }
.chart-detail h3 { font: 400 19px var(--display); }
.chart-detail .arm { font-size: 13px; color: var(--faint); }
.chart-detail p { color: var(--mist); font-size: 15px; }
.chart-detail .cost { color: var(--parchment); font-variant-numeric: lining-nums; }

.cn { cursor: pointer; outline: none; }
.cn:focus-visible circle.ring { opacity: 1; }
.cn circle.body { fill: #14152e; stroke: var(--col); stroke-width: 1.5; stroke-opacity: 0.48; }
.cn text { fill: var(--parchment); font: 500 14px var(--body); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.cn.open circle.body { stroke-opacity: 0.8; }
.cn.can circle.body { stroke-opacity: 1; stroke-width: 2.5; fill: #24254a; }
.cn.can circle.halo { opacity: 0.5; animation: breathe 1.8s ease-in-out infinite; }
.cn.lit circle.body { fill: var(--col); stroke-opacity: 1; }
.cn.lit text { fill: #0b0c1c; font-weight: 700; }
.cn.lit circle.halo { opacity: 0.55; }
.cn.sel circle.ring { opacity: 1; }
.cn circle.halo { fill: var(--col); opacity: 0; filter: blur(9px); }
.cn circle.ring { fill: none; stroke: #fff; stroke-width: 1.2; opacity: 0; stroke-dasharray: 3 4; }
.cn circle.hit { fill: transparent; }
.ce { stroke: rgba(216, 183, 120, 0.2); stroke-width: 1.2; }
.ce.lit { stroke: var(--col); stroke-opacity: 0.85; stroke-width: 1.8; }
.arm-label { fill: var(--col); font: 400 21px var(--display); letter-spacing: 0.05em; text-anchor: middle; opacity: 0.85; }
/* The Score */
.staff-line { stroke: rgba(242, 233, 216, 0.32); stroke-width: 1.4; }
.staff-bar { stroke: rgba(242, 233, 216, 0.45); stroke-width: 1.6; }
.staff-bar.thick { stroke-width: 5; }
.staff-dot { fill: rgba(242, 233, 216, 0.6); }
.staff-stem { stroke: var(--col); stroke-width: 2.4; stroke-opacity: 0.22; }
.staff-stem.lit { stroke-opacity: 0.95; }

/* Ending */
.ending {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: flex;
  flex-direction: column;
  gap: 16px;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
  background: rgba(4, 5, 14, 0.25);
  animation: plate-in 4s ease both;
}
.ending h1 { font: 400 clamp(40px, 8vw, 78px)/1.1 var(--display); text-shadow: 0 0 40px rgba(255, 220, 160, 0.6); }
.ending p { font-size: 19px; color: var(--parchment); max-width: 560px; font-style: italic; text-shadow: 0 1px 8px #000; }
.ending p.ending-more { font-size: 16px; color: var(--brass); font-style: normal; }

.mobile-nav { display: none; }

/* Medium screens: narrower plates */
@media (max-width: 1180px) { :root { --panel-w: 288px; } }

/* Small desktop windows, such as a game portal's frame: slimmer plates and rows */
@media (max-width: 1000px) {
  :root { --panel-w: 264px; --gap: 10px; }
  .planet-card { grid-template-columns: 40px minmax(0, 1fr) auto; gap: 8px; padding: 7px 10px 7px 7px; }
  .pc-thumb, .pc-thumb canvas { width: 40px; height: 40px; }
  .pc-name { font-size: 15px; }
  .pc-buy { min-width: 54px; }
  .panel-head { padding: 8px 10px 6px; }
  .light-value { font-size: 36px; }
}

/* Phones and portrait screens: plates become drawers above a nav bar. Keep in step
   with MOBILE_QUERY in js/ui.js. */
@media (max-width: 700px), (orientation: portrait) and (max-width: 1000px) {
  body { font-size: 15px; }
  .hud-top { width: calc(100vw - 24px); min-width: 0; }
  .light-value { font-size: 34px; }
  .chips { gap: 4px 5px; }
  .chip { font-size: 12.5px; padding: 0 6px; }
  .goal { margin-top: 4px; }
  .panel {
    top: auto;
    left: 0; right: 0;
    bottom: calc(50px + env(safe-area-inset-bottom, 0px));
    width: auto;
    height: 47vh;
    max-height: none;
    z-index: 12;
    display: none;
    border-left: 0;
    border-right: 0;
    background: rgba(10, 11, 28, 0.93);
    padding-inline: env(safe-area-inset-right, 0px) env(safe-area-inset-left, 0px);
  }
  body[data-drawer='planets'] .panel-left { display: flex; }
  body[data-drawer='side'] .panel-right { display: flex; }
  .with-auto .pc-auto { width: 34px; }
  .auto-power, .auto-more { min-height: 34px; }
  .mobile-nav {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 13;
    display: flex;
    background: rgba(10, 11, 28, 0.95);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: max(8px, env(safe-area-inset-left, 0px));
    padding-right: max(8px, env(safe-area-inset-right, 0px));
  }
  .mobile-nav button { flex: 1; min-height: 50px; background: none; border: 0; color: var(--mist); font: 400 15px var(--display); letter-spacing: 0.05em; }
  .mobile-nav button.on { color: var(--brass); box-shadow: inset 0 2px 0 var(--brass); }
  .hud-bottom { width: calc(100vw - 32px); bottom: calc(62px + env(safe-area-inset-bottom, 0px)); }
  body[data-drawer='planets'] .hud-bottom, body[data-drawer='side'] .hud-bottom { bottom: calc(47vh + 58px + env(safe-area-inset-bottom, 0px)); }
  .line { bottom: var(--line-bottom, calc(136px + env(safe-area-inset-bottom, 0px))); width: calc(100vw - 32px); font-size: 16px; }
  body[data-drawer='planets'] .line, body[data-drawer='side'] .line { display: none; }
  .toasts { top: 104px; left: 12px; right: 12px; transform: none; width: auto; max-width: none; }
  .chart { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .chart-side { border-left: 0; border-top: 1px solid var(--line); max-height: 44vh; padding-block: 12px; gap: 8px; }
  .chart-side h2 { font-size: 20px; }
  .chart-detail { min-height: 96px; }
  .title { top: 11%; }
}

@media (prefers-reduced-motion: reduce) {
  .title-hint, .act-cresc, .act-song, .cn.can circle.halo { animation: none; }
  .panel, .toast, .ending { animation-duration: 0.01s; }
}

</style>

<body>
<canvas id="gl" aria-hidden="true"></canvas>
<canvas id="fx" role="application" aria-label="Your star system. Tap or press Space in time with the pulse."></canvas>

<div id="title" class="title">
  <h1>Starsong</h1>
  <p id="title-line">The universe has gone silent. One ember is left.</p>
  <p class="title-hint">Tap or press <kbd>Space</kbd> in time with the pulse</p>
</div>

<button id="btn-mute" class="sound-btn" type="button" title="Mute sound (S)" aria-label="Sound" aria-pressed="false">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.2h3.6L12.5 5v14l-4.9-4.2H4z" fill="currentColor"/><path class="wave" d="M15.6 8.6a4.8 4.8 0 0 1 0 6.8M18.2 6a8.4 8.4 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="cross" d="M16 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
</button>

<header id="hud-top" class="hud-top" hidden>
  <div class="light-row">
    <span id="light-value" class="light-value">0</span>
    <span class="light-unit">Light</span>
  </div>
  <div id="rate" class="rate"></div>
  <div id="chips" class="chips"></div>
  <div id="goal" class="goal" hidden>
    <span id="goal-text"></span>
    <span class="goal-bar"><i id="goal-fill"></i></span>
  </div>
</header>

<aside id="panel-planets" class="panel panel-left" aria-label="Planets" hidden>
  <div class="panel-head">
    <h2>Orrery</h2>
    <div class="head-tools">
      <div id="buy-modes" class="buy-modes" role="group" aria-label="Amount to buy"></div>
    </div>
  </div>
  <div id="auto-bar" class="auto-bar" hidden></div>
  <div id="planet-list" class="scroll"></div>
</aside>

<aside id="panel-side" class="panel panel-right" aria-label="Upgrades and more" hidden>
  <nav id="tabs" class="tabs" aria-label="Sections"></nav>
  <section id="tab-body" class="scroll"></section>
</aside>

<footer id="hud-bottom" class="hud-bottom">
  <div id="harmony" class="harmony" hidden>
    <div class="harmony-top">
      <span>Harmony</span>
      <span id="harmony-mult">×1.00</span>
    </div>
    <div class="harmony-track"><i id="harmony-fill"></i></div>
  </div>
  <div class="actions">
    <button id="btn-crescendo" class="act act-cresc" type="button" hidden>Crescendo</button>
    <button id="btn-supernova" class="act act-nova" type="button" hidden></button>
    <button id="btn-collapse" class="act act-void" type="button" hidden></button>
    <button id="btn-song" class="act act-song" type="button" hidden>Sing the Final Song</button>
    <button id="btn-encore" class="act act-echo" type="button" hidden></button>
    <button id="btn-choir" class="act act-choir" type="button" hidden></button>
    <button id="btn-rebirth" class="act act-rebirth" type="button" hidden></button>
    <button id="btn-first" class="act act-song" type="button" hidden>Sing the First Note</button>
  </div>

<nav id="mobile-nav" class="mobile-nav" aria-label="Panels" hidden></nav>

<div id="chart" class="chart" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="ending" class="ending" hidden></div>
<script>
/* Starsong: big numbers.
 *
 * Every large quantity in the game (Light, Stardust, costs, yields) is stored as
 * its base-10 logarithm in a plain JS number. That gives us values up to
 * 10^(10^300), trivial saves, and multiplication as simple addition.
 *
 *   value 1,000  ->  stored 3
 *   value 0      ->  stored ZERO
 *
 * Comparisons are ordinary < and >. Use gte() when testing affordability so that
 * floating point noise can never leave a player one rounding error short.
 */
const ZERO = -1e300;
const EPS = 1e-9;

const lg = (x) => (x > 0 ? Math.log10(x) : ZERO);
const ex = (a) => (a < -320 ? 0 : Math.pow(10, a));
const gte = (a, b) => a >= b - EPS;

/** log10(10^a + 10^b) */
function ladd(a, b) {
  if (a < b) { const t = a; a = b; b = t; }
  const diff = b - a;
  if (diff < -17) return a;
  return a + Math.log10(1 + Math.pow(10, diff));
}

/** log10(10^a - 10^b), floored at ZERO */
function lsub(a, b) {
  if (b >= a) return ZERO;
  const diff = b - a;
  if (diff < -17) return a;
  return a + Math.log10(1 - Math.pow(10, diff));
}

/** Round a log value down to a whole number, leaving huge values alone. */
function lfloor(a) {
  if (a < 0) return ZERO;
  if (a > 15) return a;
  return lg(Math.floor(ex(a) + 1e-7));
}

const SUFFIXES = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'Nn', 'Dc',
  'UDc', 'DDc', 'TDc', 'QaDc', 'QiDc', 'SxDc', 'SpDc', 'OcDc', 'NnDc', 'Vg',
  'UVg', 'DVg', 'TVg', 'QaVg', 'QiVg', 'SxVg', 'SpVg', 'OcVg', 'NnVg', 'Tg'];

const NumFormat = { mode: 'short' };

function commas(n) {
  return Math.floor(n + 1e-7).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function fmtExp(e) {
  if (e < 1e6) return commas(e);
  if (!isFinite(e)) return '∞';
  const x = Math.floor(Math.log10(e));
  return (e / Math.pow(10, x)).toFixed(2) + 'e' + x;
}

/** Format a stored log value for display. */
function fmt(a, places) {
  if (places === undefined) places = 2;
  if (a !== a) return '?';
  if (a === Infinity) return '∞';
  if (!(a > -30)) return '0';
  if (a < 3 - EPS) {
    const v = ex(a);
    if (v < 0.01) return '<0.01';
    if (v >= 100) return Math.round(v).toString();
    if (v >= 10) return trimZeros(v.toFixed(1));
    return trimZeros(v.toFixed(2));
  }
  if (a < 6 - EPS) return commas(ex(a) + 1e-6);

  const mode = NumFormat.mode;
  if (a >= 1e6) return 'e' + fmtExp(a);

  if (mode === 'short' || mode === 'eng') {
    let e3 = Math.floor((a + EPS) / 3) * 3;
    let m = ex(a - e3);
    if (Number(m.toFixed(places)) >= 1000) { m /= 1000; e3 += 3; }
    if (mode === 'eng') return m.toFixed(places) + 'e' + commas(e3);
    const idx = e3 / 3;
    if (idx < SUFFIXES.length) return m.toFixed(places) + ' ' + SUFFIXES[idx];
  }
  let e = Math.floor(a + EPS);
  let m = ex(a - e);
  if (Number(m.toFixed(places)) >= 10) { m /= 10; e += 1; }
  return m.toFixed(places) + 'e' + fmtExp(e);
}

function trimZeros(str) {
  return str.indexOf('.') >= 0 ? str.replace(/\.?0+$/, '') : str;
}

/** Plain JS numbers such as levels and counts. */
function fmtInt(n) {
  if (n < 1e6) return commas(n);
  return fmt(lg(n));
}

function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) return 'a long time';
  if (sec < 1) return 'now';
  if (sec < 60) return Math.ceil(sec) + 's';
  if (sec < 3600) return Math.floor(sec / 60) + 'm ' + Math.floor(sec % 60) + 's';
  if (sec < 86400) return Math.floor(sec / 3600) + 'h ' + Math.floor((sec % 3600) / 60) + 'm';
  return Math.floor(sec / 86400) + 'd ' + Math.floor((sec % 86400) / 3600) + 'h';
}

/* Starsong: the page around the game. These defaults suit the Alloy site and a plain
 * file, where nothing needs to hear from the game. The CrazyGames build loads
 * platform/crazygames.js straight after this file, which swaps in SDK calls. Game code
 * only ever talks to Platform, never to a portal SDK. */

const Platform = {
  id: 'web',
  /** The game boots once this settles, so an SDK can start first. */
  ready: Promise.resolve(),

  /** Where saves live. Same shape as localStorage, so a portal can swap in its own. */
  store: {
    get(key) { try { return localStorage.getItem(key); } catch (err) { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); return true; } catch (err) { return false; } },
    remove(key) { try { localStorage.removeItem(key); } catch (err) { /* storage blocked */ } },
  },

  /** Wording that depends on where saves live: the Settings line about saving, and the
   *  Erase warning. Null keeps the game's own wording, which describes this browser. */
  saveNote: () => null,
  eraseNote: () => null,

  /** Reasons the host wants silence, such as its own mute setting or an ad playing.
   *  Any reason wins over the in-game sound setting. */
  silencers: new Set(),
  get silenced() { return this.silencers.size > 0; },
  onSilence: null,
  silence(reason, on) {
    const before = this.silenced;
    if (on) this.silencers.add(reason); else this.silencers.delete(reason);
    if (before !== this.silenced && this.onSilence) this.onSilence();
  },

  /** Loading began (true) or finished (false). */
  loading(on) {},
  /** 'play' while the player can play, 'menu' while a dialog or the star chart is open. */
  state(name) {},
  /** A big moment worth celebrating outside the game. Use sparingly. */
  happy() {},
  /** How far through the game the player is, from 0 to 100. */
  progress(percent) {},

  /** Ad hooks. Nothing shows an ad unless ads.available() says so, which it never does here. */
  ads: {
    available: () => false,
    /** A natural break, such as after a Supernova. done() always runs, ad or not. */
    midgame(done) { if (done) done(); },
    /** The player chose to watch one: reward() after a finished ad, otherwise fail(). */
    rewarded(reward, fail) { if (fail) fail(); },
  },
};

/* Starsong: game content. Everything a designer would want to tweak lives here. */

const BASE_BPM = 72;
const BPM_CAP = 150;        // music never goes faster than this; extra tempo turns into yield
const BEAT_CYCLE = 48;      // every orbit divides 48, so all planets realign every 48 beats
const SN_REQ = 12;          // log10 Light needed for the first Supernova
const SN_MIN_AGE = 60;      // seconds a star must burn before it can go Supernova
const COLLAPSE_REQ = 100;   // log10 Light needed to Collapse
const SONG_REQ = 1400;      // log10 Light needed for the Final Song
const MIN_GROWTH = 1.12;    // planet price growth can never be reduced below this
const SUPER_LEVEL = 300;    // planet prices climb faster above this level
const SUPER_RATE = 0.00005;
const FULL_HOLD_BEATS = 12;  // beats that full Harmony waits before it starts to fade
const SAVE_SECS = 20;       // the auto-buyer only saves for things this many seconds of income away

/* Planets, innermost first. Inner worlds are small, quick and high pitched;
 * outer worlds are huge, slow and low. */
const PLANETS = [
  { name: 'Cinder',    beats: 2,  cost: 10,   growth: 1.15, yield: 0.5,  size: 7,  orbit: 1.00, blurb: 'A molten pebble. It rings like struck glass.',
    tunes: ['Molten Core', 'Magma Seas', 'Forge World', 'Heart of Slag'] },
  { name: 'Mirage',    beats: 3,  cost: 150,  growth: 1.16, yield: 3,   size: 9,  orbit: 1.42, blurb: 'Dunes of glass that hum when the wind turns.',
    tunes: ['Glass Dunes', 'Salt Mirrors', 'Singing Sands', 'Sirocco'] },

/* Build the complete Tuning list: per-planet upgrades plus the global list. */
const TUNINGS = (() => {
  const list = [];
  PLANETS.forEach((p, i) => {
    PLANET_TUNE_STEPS.forEach((step, k) => {
      const levelPrice = lg(p.cost) + step.lv * lg(p.growth);
      list.push({
        id: 'p' + i + '_' + k,
        name: p.tunes[k],
        planet: i,
        reqLevel: step.lv,
        cost: levelPrice + lg(step.price),
        desc: p.name + ' yields ×' + step.mult + '.',
        fx: (f) => { f.yieldPlanet[i] += lg(step.mult); },
      });
    });
  });
  GLOBAL_TUNINGS.forEach((t) => list.push(t));
  list.sort((a, b) => a.cost - b.cost);
  return list;
})();
const TUNING_BY_ID = Object.fromEntries(TUNINGS.map((t) => [t.id, t]));
