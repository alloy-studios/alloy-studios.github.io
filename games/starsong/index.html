  }

  /* ---------- Planet art, generated at startup ---------- */
  function makeNoise(seed) {
    const perm = new Uint8Array(512);
    const vals = new Float32Array(256);
    let st = seed >>> 0;
    const rnd = () => { st = (st + 0x6D2B79F5) >>> 0; let t = st; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    for (let i = 0; i < 256; i++) { perm[i] = i; vals[i] = rnd(); }
    for (let i = 255; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
    for (let i = 0; i < 256; i++) perm[i + 256] = perm[i];
    const at = (x, y, z) => vals[perm[perm[perm[x & 255] + (y & 255)] + (z & 255)]];
    const sm = (t) => t * t * (3 - 2 * t);
    const n3 = (x, y, z) => {
      const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
      const fx = sm(x - xi), fy = sm(y - yi), fz = sm(z - zi);
      const a = at(xi, yi, zi), b = at(xi + 1, yi, zi), c = at(xi, yi + 1, zi), d = at(xi + 1, yi + 1, zi);
      const e = at(xi, yi, zi + 1), f = at(xi + 1, yi, zi + 1), g = at(xi, yi + 1, zi + 1), h = at(xi + 1, yi + 1, zi + 1);
      const l1 = a + (b - a) * fx, l2 = c + (d - c) * fx, l3 = e + (f - e) * fx, l4 = g + (h - g) * fx;
      const m1 = l1 + (l2 - l1) * fy, m2 = l3 + (l4 - l3) * fy;
      return m1 + (m2 - m1) * fz;
    };
    return (x, y, z, oct) => {
      let a = 0.5, s = 0, n = 0;
      for (let i = 0; i < oct; i++) { s += a * n3(x, y, z); n += a; a *= 0.5; x = x * 2.03 + 11; y = y * 2.03 + 7; z = z * 2.03 + 3; }
      return s / n;
    };
  }

  function ramp(t, stops) {
    if (t <= stops[0][0]) return stops[0][1];
    for (let i = 1; i < stops.length; i++) {
      if (t <= stops[i][0]) {
        const a = stops[i - 1], b = stops[i], k = (t - a[0]) / (b[0] - a[0]);
        return [a[1][0] + (b[1][0] - a[1][0]) * k, a[1][1] + (b[1][1] - a[1][1]) * k, a[1][2] + (b[1][2] - a[1][2]) * k];
      }
    }
    return stops[stops.length - 1][1];
  }
  const mix3 = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
  const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
  const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

  /* Each planet is a small painter working on the surface of a unit sphere. */
  const LOOKS = [
    { glow: '#ff8a4a', atmo: 'ember', paint: (n, x, y, z) => {
      const c = n(x * 2.4, y * 2.4, z * 2.4, 5);
      const r = 1 - Math.abs(n(x * 3.1 + 7, y * 3.1, z * 3.1, 4) * 2 - 1);
      return mix3(ramp(c, [[0.3, [24, 11, 12]], [0.55, [62, 24, 18]], [0.75, [104, 44, 24]]]), [255, 176, 70], Math.pow(r, 9));
    } },
    { glow: '#f2c98c', atmo: 'gold', paint: (n, x, y, z) => {
      const d = n(x * 1.7, y * 6.5, z * 1.7, 4);
      const w = n(x * 3, y * 3, z * 3, 4);
      return ramp(d * 0.7 + w * 0.3, [[0.32, [120, 84, 52]], [0.48, [186, 140, 88]], [0.62, [226, 192, 138]], [0.76, [246, 226, 184]]]);
    } },
    { glow: '#6fc7ff', atmo: 'cyan', paint: (n, x, y, z) => {
      const dep = n(x * 2, y * 2, z * 2, 4);
      const sea = ramp(dep, [[0.35, [8, 36, 92]], [0.55, [16, 80, 148]], [0.72, [52, 150, 190]]]);
      const cl = sstep(0.52, 0.68, n(x * 2.6 + 9, y * 4.4, z * 2.6, 5));
      return mix3(sea, [236, 244, 250], cl * 0.92);
    } },
    { glow: '#8fe08a', atmo: 'green', paint: (n, x, y, z) => {
      const h = n(x * 1.9 + 3, y * 1.9, z * 1.9, 5);
      const pole = sstep(0.68, 0.86, Math.abs(y) + (h - 0.5) * 0.3);
      let c = h < 0.5 ? ramp(h, [[0.3, [9, 44, 80]], [0.5, [20, 96, 128]]]) : ramp(h, [[0.5, [188, 178, 110]], [0.54, [76, 148, 66]], [0.66, [40, 104, 54]], [0.78, [96, 112, 72]]]);
      c = mix3(c, [240, 246, 248], pole);
      const cl = sstep(0.56, 0.7, n(x * 2.8, y * 4, z * 2.8 + 5, 4));
      return mix3(c, [244, 248, 250], cl * 0.75);
    } },
    { glow: '#bfeaff', atmo: 'cyan', paint: (n, x, y, z) => {
      const c = n(x * 2.2, y * 2.2, z * 2.2, 5);
      const r = 1 - Math.abs(n(x * 3.4 + 2, y * 3.4, z * 3.4, 3) * 2 - 1);
      const base = ramp(c, [[0.35, [120, 180, 220]], [0.55, [190, 228, 246]], [0.72, [244, 252, 255]]]);
      return mix3(base, [52, 120, 180], Math.pow(r, 14) * 0.85);
    } },
    { glow: '#ffbd80', atmo: 'gold', paint: (n, x, y, z) => {
      const warp = n(x * 2, y * 2, z * 2, 3) - 0.5;
      const lat = y + warp * 0.2;
      const band = Math.sin(lat * 15) * 0.5 + 0.5;
      let c = ramp(band * 0.8 + n(x * 2.2, y * 11, z * 2.2, 4) * 0.2, [[0.2, [146, 74, 42]], [0.45, [214, 140, 84]], [0.7, [240, 208, 164]], [0.9, [252, 236, 208]]]);
      const sx = x - 0.72, sy = (y + 0.25) * 2, sz = z;
      const spot = sstep(0.42, 0.14, Math.sqrt(sx * sx + sy * sy + sz * sz));
      c = mix3(c, [190, 62, 40], spot * 0.9);
      return c;
    } },
    { glow: '#ffe08a', atmo: 'gold', paint: (n, x, y, z) => {
      const warp = n(x * 1.6, y * 1.6, z * 1.6, 3) - 0.5;
      const band = Math.sin((y + warp * 0.1) * 11) * 0.5 + 0.5;
      return ramp(band * 0.85 + n(x * 2, y * 9, z * 2, 3) * 0.15, [[0.2, [176, 138, 76]], [0.55, [226, 196, 128]], [0.85, [250, 232, 180]]]);
    } },
    { glow: '#b67cff', atmo: 'violet', paint: (n, x, y, z) => {
      const c = n(x * 2.2, y * 2.2, z * 2.2, 5);
      const r = 1 - Math.abs(n(x * 2.8 + 4, y * 2.8, z * 2.8, 4) * 2 - 1);
      return mix3(ramp(c, [[0.3, [10, 6, 22]], [0.65, [30, 16, 56]], [0.8, [52, 28, 88]]]), [186, 120, 255], Math.pow(r, 11));
    } },
  ];

  const TEX_W = 192, TEX_H = 96;
  const textures = [];
  let shadeSprite = null;

  function makeTextures() {
    for (let i = 0; i < 8; i++) {
      const noise = makeNoise(1337 + i * 977);
      const cv = document.createElement('canvas');
      cv.width = TEX_W; cv.height = TEX_H;
      const c = cv.getContext('2d');
      const img = c.createImageData(TEX_W, TEX_H);
      for (let y = 0; y < TEX_H; y++) {
        const lat = (y / TEX_H - 0.5) * Math.PI;
        const cl = Math.cos(lat), sl = Math.sin(lat);
        for (let x = 0; x < TEX_W; x++) {
          const lon = (x / TEX_W) * TAU;
          const col = LOOKS[i].paint(noise, Math.cos(lon) * cl, sl, Math.sin(lon) * cl);
          const o = (y * TEX_W + x) * 4;
          img.data[o] = col[0]; img.data[o + 1] = col[1]; img.data[o + 2] = col[2]; img.data[o + 3] = 255;
        }
      }
      c.putImageData(img, 0, 0);
      textures.push(cv);
    }
    // Shadow sprite: lit from +x, used for every planet and rotated to face the star
    const S = 128;
    shadeSprite = document.createElement('canvas');
    shadeSprite.width = S; shadeSprite.height = S;
    const sc = shadeSprite.getContext('2d');
    const si = sc.createImageData(S, S);
    for (let y = 0; y < S; y++) {
      for (let x = 0; x < S; x++) {
        const nx = (x + 0.5) / S * 2 - 1, ny = (y + 0.5) / S * 2 - 1;
        const r2 = nx * nx + ny * ny;
        const o = (y * S + x) * 4;
        if (r2 > 1) { si.data[o + 3] = 0; continue; }
        const nz = Math.sqrt(1 - r2);
        const lit = nx * 0.86 + nz * 0.5;
        const dark = 1 - sstep(-0.12, 0.62, lit);
        const limb = Math.pow(1 - nz, 2.2) * 0.5;
        si.data[o] = 4; si.data[o + 1] = 5; si.data[o + 2] = 14;
        si.data[o + 3] = clamp(dark * 0.97 + limb * 0.45, 0, 0.98) * 255;
      }
    }
    sc.putImageData(si, 0, 0);
  }

  const GLOWS = {};
  const GLOW_COLORS = {
    ember: [255, 138, 74], gold: [255, 212, 130], cyan: [125, 220, 255], violet: [186, 130, 255],
    white: [255, 250, 240], rose: [255, 130, 190], green: [150, 240, 160], blue: [120, 170, 255],
  };

  function makeGlows() {
    for (const k in GLOW_COLORS) {
      const c = GLOW_COLORS[k];
      const cv = document.createElement('canvas');
      cv.width = cv.height = 64;
      const g = cv.getContext('2d');
      const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      gr.addColorStop(0, `rgba(255,255,255,1)`);
      gr.addColorStop(0.18, `rgba(${c[0]},${c[1]},${c[2]},0.85)`);
      gr.addColorStop(0.5, `rgba(${c[0]},${c[1]},${c[2]},0.2)`);
      gr.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]},0)`);
      g.fillStyle = gr;
      g.fillRect(0, 0, 64, 64);
      GLOWS[k] = cv;
    }
  }

  /* A static, lit picture of a planet, used on the planet cards. */
  function planetThumb(i, size) {
    const cv = document.createElement('canvas');
    cv.width = cv.height = size * 2;
    const c = cv.getContext('2d');
    const r = size * (PLANETS[i].ring ? 0.42 : 0.8);
    c.translate(size, size);
    if (PLANETS[i].ring) drawRing(c, 0, 0, r, 0.42, -0.3, false, 1);
    drawSphere(c, 0, 0, r, i, 40, -2.4);
    if (PLANETS[i].ring) drawRing(c, 0, 0, r, 0.42, -0.3, true, 1);
    return cv;
  }

  function drawSphere(c, x, y, r, i, spin, lightAngle) {
    const tex = textures[i];
    c.save();
    c.beginPath();
    c.arc(x, y, r, 0, TAU);
    c.clip();
    const w = 2 * r * 2, h = 2 * r;          // the texture wraps twice the visible width
    let off = ((spin % TEX_W) + TEX_W) % TEX_W / TEX_W * w;
    c.drawImage(tex, x - r - off, y - r, w, h);
    c.drawImage(tex, x - r - off + w, y - r, w, h);
    c.restore();
    c.save();
    c.translate(x, y);
    c.rotate(lightAngle);
    c.drawImage(shadeSprite, -r - 0.5, -r - 0.5, 2 * r + 1, 2 * r + 1);
    c.restore();
  }

  function drawRing(c, x, y, r, squash, rot, front, alpha) {
    c.save();
    c.translate(x, y);
    c.rotate(rot);
    const a0 = front ? 0 : Math.PI, a1 = front ? Math.PI : TAU;
    const bands = [[1.42, 2.1, 0.5], [1.62, 1.2, 0.3], [1.82, 2.6, 0.62], [2.08, 1.5, 0.34], [2.24, 0.9, 0.2]];
    for (const [k, wd, al] of bands) {
      c.beginPath();
      c.ellipse(0, 0, r * k, r * k * squash, 0, a0, a1);
      c.strokeStyle = `rgba(246,226,170,${al * alpha})`;
      c.lineWidth = Math.max(0.6, r * 0.09 * wd);
      c.stroke();
    }
    c.restore();
  }

  /* ---------- Particles ---------- */
  let maxParticles = 700;
  const parts = [];
  function spawn(x, y, vx, vy, life, size, glow, opts) {
    if (parts.length >= maxParticles) parts.shift();
    parts.push({ x, y, vx, vy, life, max: life, size, glow, drag: (opts && opts.drag) || 0, home: (opts && opts.home) || 0, sx: x, sy: y });
  }

  const floats = [];
  function addFloat(x, y, text, color, size, life, vy) {
    if (floats.length > 44) floats.shift();
    const f = { x, y, text, color, size: size || 14, life: life || 1.4, max: life || 1.4, vy: vy === undefined ? -28 : vy };
    floats.push(f);
    return f;
  }

  const rings = [];
  function addRing(x, y, r0, r1, life, color, width) {
    if (rings.length > 30) rings.shift();
    rings.push({ x, y, r0, r1, life, max: life, color, width: width || 2 });
  }

  /* ---------- World state that only the display cares about ---------- */
  const look = {
    starR: 12, starCore: [1, 0.55, 0.25], starEdge: [0.75, 0.13, 0.05],
    pulse: 0, flash: 0, shockR: 0, shockA: 0, bh: 0, cresc: 0, neb: 0, stars: 0.04, shake: 0,
    guide: 1, beamN: 0, beamA: 0, harmonyArc: 0,
    nebColors: [[0.2, 0.06, 0.36], [0.03, 0.22, 0.42], [0.9, 0.3, 0.45]],
  };
  const planetFlash = new Array(8).fill(0);
  const planetSpawn = new Array(8).fill(1);
  const ghosts = [];
  let nova = null, collapseFx = null, ending = 0;

  /* ---------- Layout ---------- */
  /* Graphics level. Automatic starts from what the device looks capable of, then steps
   * down for good if frames run slow, which keeps school Chromebooks smooth. */
  function level() {
    const st = Game.s.settings;
    if (st.quality !== 'auto') return st.quality;
    if (!st.autoLevel) {
      const weak = (navigator.hardwareConcurrency || 8) <= 4 || (navigator.deviceMemory || 8) <= 4;
      st.autoLevel = weak ? 'medium' : 'high';
    }
    return st.autoLevel;
  }

  function lowPower() {
    return level() === 'low';
  }

  let frameSum = 0, frameCount = 0, slowWindows = 0;
  function watchFrames(seconds) {
    const st = Game.s.settings;
    if (st.quality !== 'auto' || document.hidden || level() === 'low') return;
    if (seconds > 0.25) { frameSum = 0; frameCount = 0; return; } // a tab switch, not slow drawing
    frameSum += seconds;
    frameCount++;
    if (frameCount < 120) return;
    slowWindows = frameSum / frameCount > 1 / 42 ? slowWindows + 1 : 0;
    frameSum = 0; frameCount = 0;
    if (slowWindows >= 2) {
      slowWindows = 0;
      st.autoLevel = level() === 'high' ? 'medium' : 'low';
      resize();
    }
  }

  function resize() {
    const q = Game.s ? level() : 'high';
    const screenDpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    DPR = q === 'low' ? 1 : q === 'medium' ? Math.min(screenDpr, 1.5) : screenDpr;
    maxParticles = q === 'low' ? 220 : q === 'medium' ? 450 : 700;
    fxCanvas.width = Math.round(W * DPR);
    fxCanvas.height = Math.round(H * DPR);
    glScale = q === 'low' ? 0.5 : q === 'medium' ? 0.75 : Math.min(DPR, 1.5);
    if (gl) {
      glCanvas.width = Math.round(W * glScale);
      glCanvas.height = Math.round(H * glScale);
      // The gas clouds render small, but must match the screen's shape or they stretch
      const aspect = W / H;
      bgW = aspect >= 1 ? 512 : Math.round(512 * aspect);
      bgH = aspect >= 1 ? Math.round(512 / aspect) : 512;
      gl.bindTexture(gl.TEXTURE_2D, fboTex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, bgW, bgH, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      bgDirty = true;
    }
    fitView(true);
  }

  function setInsets(l, r, t, b) {
    insets.l = l; insets.r = r; insets.t = t; insets.b = b;
    fitView(false);
  }

  function outerOrbit() {
    const s = Game.s;
    let o = -1;
    for (let i = 0; i < 8; i++) if (s.planets[i] > 0) o = i;
    return o;
  }

  function fitView(snap) {
    if (!Game.s) return;
    const availW = Math.max(120, (W - insets.l - insets.r) / 2);
    const availH = Math.max(120, (H - insets.t - insets.b) / 2);
    view.tcx = insets.l + availW;
    view.tcy = insets.t + availH;
    const o = outerOrbit();
    const fit = o >= 0 ? PLANETS[o].orbit * ORBIT_UNIT + 46 : 88;
    view.tzoom = clamp(Math.min(availW / fit, availH / (fit * TILT + 34)), 0.32, 2.4);
    if (snap) { view.cx = view.tcx; view.cy = view.tcy; view.zoom = view.tzoom; }
  }

  function planetPos(i, beat) {
    const p = PLANETS[i];
    const phase = (beat % p.beats) / p.beats;
    const th = Math.PI / 2 + phase * TAU;
    const R = p.orbit * ORBIT_UNIT * view.zoom;
    return { x: view.cx + Math.cos(th) * R, y: view.cy + Math.sin(th) * R * TILT, th, depth: Math.sin(th) };
  }

  function planetRadius(i, lv) {
    const base = PLANETS[i].size * Math.max(view.zoom, 0.72);
    return base * (1 + Math.min(0.4, Math.log10(1 + lv) * 0.14));
  }

  function starPixelRadius() {
    return look.starR * view.zoom;
  }

  /* ---------- Events from the game ---------- */
  function onPulse(e) {
    const s = Game.s;
    const showNumbers = s.settings.floaters;
    e.who.forEach((i, k) => {
      planetFlash[i] = 1;
      const pos = planetPos(i, Math.round(s.beat));
      const r = planetRadius(i, s.planets[i]);
      if (showNumbers && (e.who.length <= 3 || k === 0 || i >= 5)) {
        addFloat(pos.x, pos.y - r - 6, '+' + fmt(e.gains[k]), LOOKS[i].glow, 12 + Math.min(i, 5), 1.3);
      }
      if (reducedMotion) return;
      const count = 3 + Math.min(5, Math.floor(i * 0.8));
      for (let n = 0; n < count; n++) {
        spawn(pos.x + (Math.random() - 0.5) * r, pos.y + (Math.random() - 0.5) * r, 0, 0, 0.55 + Math.random() * 0.35, 5 + Math.random() * 4, LOOKS[i].atmo, { home: 1 });
      }
    });
    look.pulse = Math.min(1.4, look.pulse + 0.14 * e.who.length);
    if (e.conj >= 2) { look.beamN = e.conj; look.beamA = Math.min(1, 0.3 + e.conj * 0.14); }
    if (e.grand) {
      look.beamA = 1;
      if (s.settings.flashes && !reducedMotion) look.shake = Math.min(7, 2 + e.conj);
      addRing(view.cx, view.cy, starPixelRadius(), Math.max(W, H) * 0.55, 1.5, 'gold', 2.5);
      addFloat(view.cx, view.cy - starPixelRadius() * 2.4 - 20, e.conj >= 8 ? 'SYZYGY' : 'Grand Conjunction', '#ffe2a6', 22, 2.2, -14);
    } else if (e.conj >= 3) {
      addRing(view.cx, view.cy + 8, starPixelRadius(), starPixelRadius() + 110 * view.zoom, 0.7, 'gold', 1.5);
    }
  }

  function onBeat() {
    look.pulse = Math.min(1.4, look.pulse + 0.1);
  }

  let tapLabel = null, tapGain = null;
  function onTap(e) {
    const r = starPixelRadius();
    const labels = ['Off beat', 'Good', 'Perfect'];
    const colors = ['#8e8fa8', '#bfeaff', '#ffe2a6'];
    // One timing label at a time, or quick taps pile up into an unreadable stack
    const lx = view.cx + (Math.random() - 0.5) * 30, ly = view.cy - r * 1.9 - 12;
    if (tapLabel && tapLabel.life > 0 && floats.includes(tapLabel)) {
      Object.assign(tapLabel, { x: lx, y: ly, text: labels[e.q], color: colors[e.q], size: e.q === 2 ? 19 : 15, life: tapLabel.max });
    } else {
      tapLabel = addFloat(lx, ly, labels[e.q], colors[e.q], e.q === 2 ? 19 : 15, 0.8, -36);
    }
    if (e.q > 0) {
      addRing(view.cx, view.cy, r, r * 2.8 + 26, 0.5, e.q === 2 ? 'gold' : 'cyan', e.q === 2 ? 2.4 : 1.6);
      look.pulse = Math.min(1.5, look.pulse + (e.q === 2 ? 0.5 : 0.28));
      if (!reducedMotion) {
        const n = e.q === 2 ? 12 : 6;
        for (let k = 0; k < n; k++) {
          const a = Math.random() * TAU, sp = 60 + Math.random() * 120;
          spawn(view.cx + Math.cos(a) * r, view.cy + Math.sin(a) * r, Math.cos(a) * sp, Math.sin(a) * sp, 0.6 + Math.random() * 0.4, 4 + Math.random() * 4, e.q === 2 ? 'gold' : 'cyan', { drag: 2.2 });
        }
      }
    }
    if (Game.s.settings.floaters) {
      // Quick taps add into one rising number instead of stacking on top of each other
      if (tapGain && floats.includes(tapGain) && tapGain.max - tapGain.life < 0.4) {
        tapGain.sum = ladd(tapGain.sum, e.gain);
        tapGain.text = '+' + fmt(tapGain.sum);
        tapGain.life = tapGain.max;
      } else {
        tapGain = addFloat(view.cx + 26 + Math.random() * 30, view.cy - r - 10, '+' + fmt(e.gain), '#f0e6d2', 13, 1, -30);
        tapGain.sum = e.gain;
      }
    }
  }

  function onBuy(e) {
    fitView(false);
    const pos = planetPos(e.i, Game.s.beat);
    if (e.first) {
      planetSpawn[e.i] = 0;
      addRing(pos.x, pos.y, 2, 50 * view.zoom + 26, 0.9, LOOKS[e.i].atmo, 2);
    }
    if (e.crossed > 0) {
      addRing(pos.x, pos.y, 4, 34 * view.zoom + 18, 0.8, 'white', 2);
      addFloat(pos.x, pos.y - 26, 'Octave ×' + fmt(lg(Game.f.mileBase)), '#ffe2a6', 15, 1.5);
    }
    const n = Math.min(14, 4 + e.n);
    for (let k = 0; k < n; k++) {
      const a = Math.random() * TAU, sp = 30 + Math.random() * 80;
      spawn(pos.x, pos.y, Math.cos(a) * sp, Math.sin(a) * sp, 0.5 + Math.random() * 0.4, 4 + Math.random() * 3, LOOKS[e.i].atmo, { drag: 2 });
    }
  }

  function onStage() {
    const r = starPixelRadius();
    addRing(view.cx, view.cy, r, r * 8 + 80, 1.6, 'gold', 3);
    look.pulse = 1.5;
    for (let k = 0; k < 70; k++) {
      const a = Math.random() * TAU, sp = 70 + Math.random() * 260;
      spawn(view.cx + Math.cos(a) * r, view.cy + Math.sin(a) * r * 0.9, Math.cos(a) * sp, Math.sin(a) * sp, 1 + Math.random() * 0.9, 5 + Math.random() * 6, Math.random() < 0.5 ? 'gold' : 'ember', { drag: 1.2 });
    }
    // A fast run can pass several stages in a second. One name updates in place rather
    // than a stack of names piling up over the star.
    const name = STAGES[Game.s.stage].name, ly = view.cy - r * 2.2 - 34;
    if (stageLabel && stageLabel.life > 0 && floats.includes(stageLabel)) {
      Object.assign(stageLabel, { x: view.cx, y: ly, text: name, life: stageLabel.max });
    } else {
      stageLabel = addFloat(view.cx, ly, name, '#fff1d0', 26, 2.6, -10);
    }
  }
  let stageLabel = null;

  function onCometCaught(o) {
    const x = o.x !== undefined ? o.x : view.cx, y = o.y !== undefined ? o.y : view.cy;
    addRing(x, y, 4, 90, 0.7, o.gold ? 'gold' : 'white', 2.5);
    for (let k = 0; k < 40; k++) {
      const a = Math.random() * TAU, sp = 60 + Math.random() * 220;
      spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp, 0.7 + Math.random() * 0.6, 4 + Math.random() * 5, o.gold ? 'gold' : k % 2 ? 'white' : 'cyan', { drag: 2 });
    }
    let label = '';
    if (o.kind === 'lump') label = '+' + fmt(o.gain) + ' Light';
    else if (o.kind === 'aurora') label = 'Aurora: Light ×' + fmtInt(Math.round(o.mult)) + ' for ' + Math.round(o.time) + 's';
    else label = 'Surge: Harmony full';
    addFloat(x, y - 22, label, o.gold ? '#ffe2a6' : '#d9f4ff', 18, 2.4, -22);
    if (o.stardust) addFloat(x, y + 8, '+' + fmt(o.stardust) + ' Stardust', '#d4b8ff', 16, 2.4, -16);
  }

  /* Snapshot the planets so they can fly apart after the game state has reset. */
  function captureGhosts(s) {
    ghosts.length = 0;
    for (let i = 0; i < 8; i++) {
      if (s.planets[i] > 0) {
        const p = planetPos(i, s.beat);
        ghosts.push({ i, x: p.x, y: p.y, r: planetRadius(i, s.planets[i]), a: Math.atan2(p.y - view.cy, p.x - view.cx), t: 0, spin: 0 });
      }
    }
  }

  function playSupernova() {
    nova = { t: 0, boomed: false };
    return nova;
  }

  function playCollapse() {
    collapseFx = { t: 0 };
  }

  function playEnding() {
    ending = 0.0001;
  }

  /* An Encore: the star rings like a bell and the audience answers in gold. */
  function playEncore() {
    const r = starPixelRadius();
    const calm = !Game.s.settings.flashes || reducedMotion;
    look.flash = Math.max(look.flash, calm ? 0.12 : 0.4);
    for (let k = 0; k < 4; k++) addRing(view.cx, view.cy, r, r + 240 + k * 150, 1.4 + k * 0.45, k % 2 ? 'rose' : 'gold', 3.2 - k * 0.6);
    for (let k = 0; k < 170; k++) {
      const a = Math.random() * TAU, sp = 60 + Math.random() * 420;
      spawn(view.cx, view.cy, Math.cos(a) * sp, Math.sin(a) * sp, 1.3 + Math.random() * 2, 5 + Math.random() * 9, k % 3 ? 'gold' : 'white', { drag: 1.1 });
    }
  }

  /* The Choir: new voices fly out from the star to take their places in the sky. */
  function playChoir() {
    const r = starPixelRadius();
    look.flash = Math.max(look.flash, Game.s.settings.flashes && !reducedMotion ? 0.35 : 0.1);
    for (let k = 0; k < 3; k++) addRing(view.cx, view.cy, r, r + 320 + k * 200, 1.8 + k * 0.5, k === 1 ? 'cyan' : 'green', 3 - k * 0.6);
    for (let k = 0; k < 120; k++) {
      const a = Math.random() * TAU, sp = 160 + Math.random() * 520;
      spawn(view.cx, view.cy, Math.cos(a) * sp, Math.sin(a) * sp, 2 + Math.random() * 1.8, 6 + Math.random() * 8, k % 2 ? 'green' : 'cyan', { drag: 0.5 });
    }
  }

  /* Rebirth: everything is drawn in, then the universe breathes out again. */
  let rebirthFx = null;
  function playRebirth() {
    rebirthFx = { t: 0, bloomed: false };
  }
  function bloomRebirth() {
    const r = starPixelRadius() + 20;
    const loud = Game.s.settings.flashes && !reducedMotion;
    look.flash = loud ? 0.9 : 0.25;
    look.shockR = r; look.shockA = 1.2;
    for (let k = 0; k < 5; k++) addRing(view.cx, view.cy, r, r + 300 + k * 220, 2 + k * 0.5, ['violet', 'rose', 'cyan', 'white', 'violet'][k], 3);
    for (let k = 0; k < 260; k++) {
      const a = Math.random() * TAU, sp = 80 + Math.random() * 640;
      spawn(view.cx, view.cy, Math.cos(a) * sp, Math.sin(a) * sp, 1.6 + Math.random() * 2.6, 6 + Math.random() * 12, ['violet', 'rose', 'cyan', 'white'][k % 4], { drag: 0.7 });
    }
  }

  /* Everyone who has heard the song: a gold twinkle for each Encore, and a green star for
   * every step up in the Voices the Choir has gathered. */
  function rnd(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function drawAudience() {
    const s = Game.s;
    const fans = Math.min(150, s.encores * 3);
    const voices = s.voicesEarned > 0 ? Math.min(90, Math.round(Math.log10(1 + s.voicesEarned) * 7)) : 0;
    if (!fans && !voices) return;
    const minR = Math.min(W, H) * 0.3;
    ctx.globalCompositeOperation = 'lighter';
    for (let k = 0; k < fans + voices; k++) {
      const voice = k >= fans;
      const seed = voice ? 5000 + (k - fans) : k;
      let x = rnd(seed * 3 + 1) * W, y = rnd(seed * 3 + 2) * H;
      // Keep the middle clear for the star system
      const dx = x - view.cx, dy = y - view.cy, d = Math.hypot(dx, dy);
      if (d < minR) { const m = minR / Math.max(d, 1); x = view.cx + dx * m; y = view.cy + dy * m; }
      const tw = 0.55 + 0.45 * Math.sin(time * (0.5 + rnd(seed * 3 + 3) * 1.6) + seed);
      ctx.globalAlpha = (voice ? 0.8 : 0.5) * tw;
      const sz = voice ? 18 : 10;
      ctx.drawImage(voice ? GLOWS.green : GLOWS.gold, x - sz / 2, y - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function burstNova() {
    const r = starPixelRadius() + 20;
    look.flash = Game.s.settings.flashes && !reducedMotion ? 1 : 0.28;
    look.shockR = r; look.shockA = 1.4;
    if (Game.s.settings.flashes && !reducedMotion) look.shake = 14;
    for (let k = 0; k < 340; k++) {
      const a = Math.random() * TAU, sp = 90 + Math.random() * 720;
      const keys = ['white', 'gold', 'ember', 'rose', 'violet', 'cyan'];
      spawn(view.cx, view.cy, Math.cos(a) * sp, Math.sin(a) * sp, 1.2 + Math.random() * 2.4, 6 + Math.random() * 12, keys[k % keys.length], { drag: 0.8 });
    }
    Sound.boom();
  }

  /* ---------- Per-frame drawing ---------- */
  function updateLook(dt) {
    const s = Game.s, f = Game.f;
    const st = STAGES[s.stage];
    const tint = CLASS_BY_ID[s.starClass].tint;
    let targetR = st.radius;
    if (nova) {
      nova.t += dt;
      if (nova.t < 0.9) targetR = st.radius;
      if (nova.t >= 0.75 && !nova.boomed) { nova.boomed = true; burstNova(); }
      if (nova.t > 5.5) nova = null;
    }
    if (collapseFx) {
      collapseFx.t += dt;
      const t = collapseFx.t;
      look.bh = t < 2 ? t / 2 : t < 6 ? 1 : Math.max(0, 1 - (t - 6) / 2.5);
      if (t > 8.5) { collapseFx = null; look.bh = 0; }
    }
    if (rebirthFx) {
      rebirthFx.t += dt;
      const t = rebirthFx.t;
      if (t >= 2.4 && !rebirthFx.bloomed) { rebirthFx.bloomed = true; bloomRebirth(); }
      look.bh = t < 2.4 ? t / 2.4 : Math.max(0, 1 - (t - 2.4) / 1.2);
      if (t > 4) { rebirthFx = null; look.bh = 0; }
    }
    const k = 1 - Math.exp(-dt * 3);
    const nr = nova && nova.t < 3.2 ? (nova.t < 0.75 ? st.radius + 34 * (nova.t / 0.75) : 0.5) : collapseFx || (rebirthFx && !rebirthFx.bloomed) ? 22 : targetR;
    look.starR += (nr - look.starR) * (nova && nova.t > 0.75 ? 1 - Math.exp(-dt * 16) : k);
    for (let i = 0; i < 3; i++) {
      look.starCore[i] += (st.core[i] * tint[i] - look.starCore[i]) * k;
      look.starEdge[i] += (st.edge[i] * tint[i] - look.starEdge[i]) * k;
    }
    look.pulse *= Math.exp(-dt * 4.5);
    look.flash *= Math.exp(-dt * 1.9);
    if (look.flash < 0.002) look.flash = 0;
    if (look.shockA > 0.001) { look.shockR += dt * (620 + look.shockR * 0.7); look.shockA *= Math.exp(-dt * 1.0); }
    look.shake *= Math.exp(-dt * 6);
    look.beamA *= Math.exp(-dt * 4);
    look.cresc += ((s.cresc > 0 ? 1 : 0) - look.cresc) * (1 - Math.exp(-dt * 5));

    // The sky fills in as you progress. This is the game's real progress bar.
    const sky = Object.keys(s.sky).length;
    const prog = Math.log2(1 + s.supernovas) * 0.11 + s.collapses * 0.02 + sky * 0.05 + (s.ended ? 1 : 0) + ending * 0.8;
    const tNeb = clamp(prog, 0, 1.15);
    const tStars = clamp(0.035 + Math.log2(1 + s.supernovas) * 0.08 + sky * 0.05 + (s.ended ? 1 : 0), 0, 1);
    if (Math.abs(tNeb - look.neb) > 0.002) bgDirty = true;
    look.neb += (tNeb - look.neb) * (1 - Math.exp(-dt * 0.8));
    look.stars += (tStars - look.stars) * (1 - Math.exp(-dt * 0.8));

    const tapped = s.sinceTap < 6 || s.stats.taps < 12;
    const tGuide = f.noTap ? 0 : tapped ? 1 : 0.25;
    look.guide += (tGuide - look.guide) * (1 - Math.exp(-dt * 3));
    look.harmonyArc += (s.harmony / f.harmMax - look.harmonyArc) * (1 - Math.exp(-dt * 10));
    if (ending > 0) ending = Math.min(1, ending + dt * 0.08);
  }

  function drawGL() {
    if (!gl) return;
    const qHigh = level() !== 'low';
    if (bgDirty || frameNo % (qHigh ? 8 : 30) === 0) {
      bgDirty = false;
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
      gl.viewport(0, 0, bgW, bgH);
      gl.useProgram(progBg);
      gl.uniform2f(uBg.u_res, bgW, bgH);
      gl.uniform1f(uBg.u_t, time);
      gl.uniform1f(uBg.u_neb, look.neb);
      gl.uniform3fv(uBg.u_c1, look.nebColors[0]);
      gl.uniform3fv(uBg.u_c2, look.nebColors[1]);
      gl.uniform3fv(uBg.u_c3, look.nebColors[2]);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    }
    gl.viewport(0, 0, glCanvas.width, glCanvas.height);
    gl.useProgram(progMain);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, fboTex);
    gl.uniform1i(uMain.u_bg, 0);
    gl.uniform2f(uMain.u_res, glCanvas.width, glCanvas.height);
    const sx = (Math.random() - 0.5) * look.shake, sy = (Math.random() - 0.5) * look.shake;
    gl.uniform2f(uMain.u_c, (view.cx + sx) * glScale, (H - view.cy - sy) * glScale);
    gl.uniform1f(uMain.u_r, Math.max(1.5, starPixelRadius() * glScale));
    gl.uniform1f(uMain.u_t, time);
    gl.uniform1f(uMain.u_pulse, look.pulse);
    gl.uniform1f(uMain.u_bh, look.bh);
    gl.uniform1f(uMain.u_flash, Math.min(1, look.flash));
    gl.uniform1f(uMain.u_shockR, look.shockR * glScale);
    gl.uniform1f(uMain.u_shockA, look.shockA);
    gl.uniform1f(uMain.u_stars, look.stars);
    gl.uniform1f(uMain.u_cresc, look.cresc);
    gl.uniform1f(uMain.u_scale, glScale);
    gl.uniform3fv(uMain.u_core, look.starCore);
    gl.uniform3fv(uMain.u_edge, look.starEdge);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  /* Used only when WebGL is missing. */
  function drawFallbackSky() {
    ctx.fillStyle = '#05060f';
    ctx.fillRect(0, 0, W, H);
    const r = starPixelRadius();
    const c = look.starEdge, core = look.starCore;
    const rgb = (v, a) => `rgba(${Math.round(v[0] * 255)},${Math.round(v[1] * 255)},${Math.round(v[2] * 255)},${a})`;
    const g = ctx.createRadialGradient(view.cx, view.cy, 0, view.cx, view.cy, r * 5);
    g.addColorStop(0, rgb(core, 1));
    g.addColorStop(0.19, rgb(core, 1));
    g.addColorStop(0.22, rgb(c, 0.6));
    g.addColorStop(1, rgb(c, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(view.cx, view.cy, r * 5, 0, TAU);
    ctx.fill();
  }

  function drawSkyStars() {
    const s = Game.s;
    for (const t of SKY) {
      if (!s.sky[t.id]) continue;
      const x = t.x * W, y = t.y * H;
      const tw = 0.75 + 0.25 * Math.sin(time * 1.3 + t.x * 40);
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.85 * tw;
      const sz = 34;
      ctx.drawImage(GLOWS.white, x - sz / 2, y - sz / 2, sz, sz);
      ctx.globalAlpha = 0.5 * tw;
      ctx.drawImage(GLOWS.blue, x - sz, y - 1.5, sz * 2, 3);
      ctx.drawImage(GLOWS.blue, x - 1.5, y - sz, 3, sz * 2);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  function drawOrbits() {
    const s = Game.s;
    const cresc = look.cresc;
    for (let i = 0; i < 8; i++) {
      const owned = s.planets[i] > 0;
      const next = !owned && (i === 0 || s.planets[i - 1] > 0);
      if (!owned && !next) continue;
      const R = PLANETS[i].orbit * ORBIT_UNIT * view.zoom;
      ctx.beginPath();
      ctx.ellipse(view.cx, view.cy, R, R * TILT, 0, 0, TAU);
      if (owned) {
        ctx.strokeStyle = `rgba(216,183,120,${0.13 + cresc * 0.18})`;
        ctx.lineWidth = 1;
        ctx.setLineDash([]);
      } else {
        ctx.strokeStyle = 'rgba(216,183,120,0.07)';
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 7]);
      }
      ctx.stroke();
      ctx.setLineDash([]);
      if (owned) {
        // Light trail behind the planet, drawn as layered arcs that shorten
        const pos = planetPos(i, s.beat);
        const col = GLOW_COLORS[LOOKS[i].atmo];
        for (let k = 1; k <= 3; k++) {
          const span = 0.2 * k;
          ctx.beginPath();
          ctx.ellipse(view.cx, view.cy, R, R * TILT, 0, pos.th - span, pos.th);
          ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${0.12 + planetFlash[i] * 0.16})`;
          ctx.lineWidth = 1.2 + (3 - k) * 0.5;
          ctx.stroke();
        }
      }
    }
    // The meridian: planets pay out as they cross this line
    const o = outerOrbit();
    if (o >= 0) {
      const y0 = view.cy + starPixelRadius() * 1.1;
      const y1 = view.cy + PLANETS[o].orbit * ORBIT_UNIT * view.zoom * TILT + 16;
      ctx.beginPath();
      ctx.moveTo(view.cx, y0);
      ctx.lineTo(view.cx, y1);
      ctx.strokeStyle = `rgba(255,226,166,${0.22 + look.pulse * 0.12})`;
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 5]);
      ctx.stroke();
      ctx.setLineDash([]);
      for (let i = 0; i < 8; i++) {
        if (s.planets[i] <= 0) continue;
        const y = view.cy + PLANETS[i].orbit * ORBIT_UNIT * view.zoom * TILT;
        ctx.save();
        ctx.translate(view.cx, y);
        ctx.rotate(Math.PI / 4);
        ctx.fillStyle = `rgba(255,226,166,${0.5 + planetFlash[i] * 0.5})`;
        ctx.fillRect(-2.4, -2.4, 4.8, 4.8);
        ctx.restore();
      }
      if (look.beamA > 0.01) {
        const w = 2 + look.beamN * 1.6;
        const g = ctx.createLinearGradient(0, y0, 0, y1);
        g.addColorStop(0, `rgba(255,240,205,${look.beamA})`);
        g.addColorStop(1, 'rgba(255,226,166,0)');
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = g;
        ctx.fillRect(view.cx - w / 2, y0, w, y1 - y0);
        // The wider glow is the round glow sprite stretched along the line, so it is soft
        // on every side rather than a lit box
        const half = w * 3.2, len = y1 - y0;
        ctx.globalAlpha = look.beamA * 0.5;
        ctx.drawImage(GLOWS.gold, view.cx - half, y0 - len * 0.12, half * 2, len * 1.05);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
      }
    }
  }

  function drawPlanet(i, pos, lv, dt) {
    const s = Game.s;
    if (planetSpawn[i] < 1) planetSpawn[i] = Math.min(1, planetSpawn[i] + dt * 1.6);
    const grow = sstep(0, 1, planetSpawn[i]);
    const persp = 1 + pos.depth * 0.13;
    const r = planetRadius(i, lv) * persp * grow;
    if (r < 0.5) return;
    const dx = pos.x - view.cx, dy = pos.y - view.cy;
    const lightAngle = Math.atan2(-dy, -dx);
    let alpha = 1;
    if (pos.depth < 0) {
      const dist = Math.hypot(dx, dy / TILT * 0.9);
      alpha = sstep(starPixelRadius() * 0.9, starPixelRadius() * 1.5, dist);
    }
    if (alpha <= 0.01) return;
    ctx.globalAlpha = alpha;

    // Soft atmosphere, brighter on each pulse
    ctx.globalCompositeOperation = 'lighter';
    const halo = r * (2.6 + planetFlash[i] * 2.2);
    ctx.globalAlpha = alpha * (0.3 + planetFlash[i] * 0.7);
    ctx.drawImage(GLOWS[LOOKS[i].atmo], pos.x - halo, pos.y - halo, halo * 2, halo * 2);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = alpha;

    const moons = Math.min(5, Math.floor(lv / Game.f.mileEvery));
    const drawMoons = (front) => {
      for (let m = 0; m < moons; m++) {
        const speed = 1.1 - m * 0.16;
        const a = time * speed + m * 2.1 + i;
        const mr = r * (1.55 + m * 0.34);
        const mz = Math.sin(a);
        if ((mz > 0) !== front) continue;
        const mx = pos.x + Math.cos(a) * mr, my = pos.y + mz * mr * 0.38;
        const ms = Math.max(1.1, r * 0.13 + 0.6);
        ctx.beginPath();
        ctx.arc(mx, my, ms, 0, TAU);
        ctx.fillStyle = front ? '#e8e2d4' : '#8d8a94';
        ctx.fill();
      }
    };
    drawMoons(false);
    if (PLANETS[i].ring) drawRing(ctx, pos.x, pos.y, r, 0.36, -0.32, false, alpha);
    drawSphere(ctx, pos.x, pos.y, r, i, time * (9 + i), lightAngle);
    if (PLANETS[i].ring) drawRing(ctx, pos.x, pos.y, r, 0.36, -0.32, true, alpha);
    drawMoons(true);
    ctx.globalAlpha = 1;
    void s;
  }

  function drawBeatGuide() {
    const s = Game.s;
    if (look.guide < 0.02 || nova || collapseFx) return;
    const r = starPixelRadius();
    const frac = s.beat - Math.floor(s.beat);
    const base = r * 1.32 + 5;
    // Fixed target ring
    ctx.beginPath();
    ctx.arc(view.cx, view.cy, base, 0, TAU);
    ctx.strokeStyle = `rgba(255,226,166,${0.28 * look.guide})`;
    ctx.lineWidth = 1;
    ctx.stroke();
    // Ring that closes on the target exactly on the beat
    const k = 1 - frac;
    const rr = base + k * (r * 1.5 + 34);
    ctx.beginPath();
    ctx.arc(view.cx, view.cy, rr, 0, TAU);
    ctx.strokeStyle = `rgba(255,236,196,${(0.12 + (1 - k) * 0.6) * look.guide})`;
    ctx.lineWidth = 1.4;
    ctx.stroke();
    // Harmony arc
    if (look.harmonyArc > 0.005) {
      ctx.beginPath();
      ctx.arc(view.cx, view.cy, base + 4, -Math.PI / 2, -Math.PI / 2 + TAU * look.harmonyArc);
      ctx.strokeStyle = s.cresc > 0 ? '#ffd27a' : '#7fdcff';
      ctx.lineWidth = 2.2;
      ctx.stroke();
    }
  }

  function drawComet(dt) {
    const c = Game.comet;
    if (!c) return;
    const p = c.t / c.dur;
    c.x = (c.x0 + (c.x1 - c.x0) * p) * W;
    c.y = (c.y0 + (c.y1 - c.y0) * p) * H;
    const col = c.gold ? 'gold' : 'white';
    if (Math.random() < dt * 90) {
      spawn(c.x + (Math.random() - 0.5) * 6, c.y + (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 18, (Math.random() - 0.5) * 18, 0.9 + Math.random() * 0.7, 6 + Math.random() * 7, c.gold ? 'gold' : Math.random() < 0.5 ? 'cyan' : 'white', {});
    }
    ctx.globalCompositeOperation = 'lighter';
    const sz = 30 + Math.sin(time * 9) * 4;
    ctx.drawImage(GLOWS[col], c.x - sz, c.y - sz, sz * 2, sz * 2);
    ctx.drawImage(GLOWS[col], c.x - sz * 0.5, c.y - sz * 0.5, sz, sz);
    ctx.globalCompositeOperation = 'source-over';
    // A slow ring so that the comet reads as something to tap
    ctx.beginPath();
    ctx.arc(c.x, c.y, 24 + Math.sin(time * 4) * 3, 0, TAU);
    ctx.strokeStyle = c.gold ? 'rgba(255,214,120,0.55)' : 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawParticles(dt) {
    ctx.globalCompositeOperation = 'lighter';
    const cx = view.cx, cy = view.cy;
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt;
      if (p.life <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
      const k = 1 - p.life / p.max;
      if (p.home) {
        const e = k * k;
        p.x = p.sx + (cx - p.sx) * e;
        p.y = p.sy + (cy - p.sy) * e;
      } else {
        if (p.drag) { const d = Math.exp(-p.drag * dt); p.vx *= d; p.vy *= d; }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
      const alpha = p.home ? Math.sin(k * Math.PI) * 0.9 : 1 - k;
      ctx.globalAlpha = alpha;
      const sz = p.size;
      ctx.drawImage(GLOWS[p.glow], p.x - sz, p.y - sz, sz * 2, sz * 2);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawRings(dt) {
    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i];
      r.life -= dt;
      if (r.life <= 0) { rings.splice(i, 1); continue; }
      const k = 1 - r.life / r.max;
      const e = 1 - (1 - k) * (1 - k);
      const c = GLOW_COLORS[r.color] || GLOW_COLORS.white;
      ctx.beginPath();
      ctx.arc(r.x, r.y, Math.max(0, r.r0 + (r.r1 - r.r0) * e), 0, TAU);
      ctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},${(1 - k) * 0.8})`;
      ctx.lineWidth = r.width * (1 - k * 0.6);
      ctx.stroke();
    }
  }

  function drawFloats(dt) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i];
      f.life -= dt;
      if (f.life <= 0) { floats.splice(i, 1); continue; }
      f.y += f.vy * dt;
      const k = f.life / f.max;
      ctx.globalAlpha = Math.min(1, k * 2.4);
      ctx.font = `${f.size}px Marcellus, Georgia, serif`;
      ctx.shadowColor = 'rgba(0,0,0,0.75)';
      ctx.shadowBlur = 5;
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  function drawGhosts(dt) {
    for (let i = ghosts.length - 1; i >= 0; i--) {
      const g = ghosts[i];
      g.t += dt;
      const inward = !!collapseFx || !!rebirthFx;
      if (inward) {
        const dx = view.cx - g.x, dy = view.cy - g.y;
        const d = Math.hypot(dx, dy) || 1;
        const pull = 90 + g.t * 170;
        g.x += (dx / d * pull - dy / d * pull * 0.6) * dt;
        g.y += (dy / d * pull + dx / d * pull * 0.3) * dt;
        g.r *= Math.exp(-dt * 0.5);
        if (d < 12 || g.t > 3.4) { ghosts.splice(i, 1); continue; }
      } else {
        if (!nova || nova.t < 0.75) { continue; }
        const sp = 220 + g.t * 520;
        g.x += Math.cos(g.a) * sp * dt;
        g.y += Math.sin(g.a) * sp * dt;
        if (g.t > 3.2) { ghosts.splice(i, 1); continue; }
      }
      ctx.globalAlpha = clamp(1.25 - g.t / 3, 0, 1);
      drawSphere(ctx, g.x, g.y, Math.max(0.5, g.r), g.i, g.t * 60, Math.atan2(view.cy - g.y, view.cx - g.x));
      ctx.globalAlpha = 1;
    }
  }

  function drawFx(dt) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (gl) ctx.clearRect(0, 0, W, H);
    else drawFallbackSky();
    if (look.shake > 0.3) ctx.translate((Math.random() - 0.5) * look.shake, (Math.random() - 0.5) * look.shake);

    drawSkyStars();
    const hush = nova || collapseFx || (rebirthFx && !rebirthFx.bloomed);
    if (!hush) drawAudience();
    if (!hush) drawOrbits();

    const s = Game.s;
    const list = [];
    if (!hush) {
      for (let i = 0; i < 8; i++) if (s.planets[i] > 0) list.push({ i, pos: planetPos(i, s.beat) });
      list.sort((a, b) => a.pos.depth - b.pos.depth);
      for (const e of list) if (e.pos.depth < 0) drawPlanet(e.i, e.pos, s.planets[e.i], dt);
    }
    drawBeatGuide();
    if (!hush) for (const e of list) if (e.pos.depth >= 0) drawPlanet(e.i, e.pos, s.planets[e.i], dt);
    drawGhosts(dt);
    drawRings(dt);
    drawParticles(dt);
    drawComet(dt);
    drawFloats(dt);
    for (let i = 0; i < 8; i++) planetFlash[i] *= Math.exp(-dt * 5);
  }

  function frame(dt) {
    time += dt;
    frameNo++;
    updateLook(dt);
    const k = 1 - Math.exp(-dt * 2.4);
    view.cx += (view.tcx - view.cx) * k;
    view.cy += (view.tcy - view.cy) * k;
    view.zoom += (view.tzoom - view.zoom) * k;
    drawGL();
    drawFx(dt);
  }

  function init() {
    glCanvas = document.getElementById('gl');
    fxCanvas = document.getElementById('fx');
    ctx = fxCanvas.getContext('2d');
    makeGlows();
    makeTextures();
    initGL();
    if (!gl) glCanvas.style.display = 'none';
    window.addEventListener('resize', resize);
    Game.on('pulse', onPulse);
    Game.on('beat', onBeat);
    Game.on('tap', onTap);
    Game.on('buy', onBuy);
    Game.on('autobuy', (e) => { if (e.first) onBuy({ i: e.i, n: 1, first: true, crossed: 0 }); else fitView(false); });
    Game.on('stage', onStage);
    Game.on('cometCaught', onCometCaught);
  }

  function reset() {
    resize();
    look.starR = STAGES[Game.s.stage].radius;
    parts.length = 0; floats.length = 0; rings.length = 0;
  }

  /* Returns the comet if a tap at (x, y) hit it. */
  function hitComet(x, y) {
    const c = Game.comet;
    if (!c || c.x === undefined) return false;
    return Math.hypot(x - c.x, y - c.y) < 54;
  }

  return {
    init, reset, resize, frame, setInsets, fitView, planetThumb, captureGhosts, playSupernova, playCollapse, playEnding, playEncore, playChoir, playRebirth, hitComet, watchFrames, lowPower,
    get hasGL() { return !!gl; },
    get busy() { return !!nova || !!collapseFx || !!rebirthFx; },
  };
})();

/* Starsong: panels, buttons and dialogs. Reads game state and calls game actions.
 * Features reveal themselves as they become relevant, so a new player only ever sees
 * the one thing they need next. */

const UI = (() => {
  const $ = (id) => document.getElementById(id);
  const SVG = 'http://www.w3.org/2000/svg';
  const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function svgEl(tag, attrs) {
    const n = document.createElementNS(SVG, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }
  function put(node, text) {
    if (node.__t !== text) { node.__t = text; node.textContent = text; }
  }
  function show(node, on) {
    if (node.hidden === on) node.hidden = !on;
  }

  const cards = [];
  let currentTab = 'tunings';
  let refreshClock = 0, layoutClock = 0, titleClock = 0;
  let tunKey = '', chipKey = '', autoKey = '';
  let autoRefs = null, cloudLine = null, cloudButton = null;
  let chartKind = null, chartSel = null;
  const newTabs = {};

  /* ---------- Message line ---------- */
  const lineQueue = [];
  let lineTimer = 0;
  function showLine(text) {
    if (lineQueue[lineQueue.length - 1] === text) return;
    lineQueue.push(text);
  }
  function tickLine(dt) {
    const n = $('line');
    if (lineTimer > 0) {
      lineTimer -= dt;
      if (lineTimer <= 0.9) n.classList.remove('show');
      return;
    }
    if (lineQueue.length) {
      n.textContent = lineQueue.shift();
      n.classList.add('show');
      lineTimer = 6.5;
    }
  }
  function tip(key, text) {
    const s = Game.s;
    if (s.story[key]) return;
    s.story[key] = -1;
    showLine(text);
  }

  function toast(title, body) {
    const t = el('div', 'toast');
    t.appendChild(el('b', '', title));
    if (body) t.appendChild(document.createTextNode(body));
    $('toasts').appendChild(t);
    setTimeout(() => t.remove(), 5000);
    while ($('toasts').children.length > 3) $('toasts').firstChild.remove();
  }

  /* ---------- Modal ---------- */
  let modalClose = null;
  function openModal(opts) {
    const m = $('modal');
    m.innerHTML = '';
    const c = el('div', 'modal-card');
    c.setAttribute('role', 'dialog');
    c.setAttribute('aria-modal', 'true');
    c.appendChild(el('h2', '', opts.title));
    if (opts.body) c.appendChild(opts.body);
    const row = el('div', 'btn-row');
    (opts.actions || [{ label: 'Close', primary: true }]).forEach((a) => {
      const b = el('button', 'btn' + (a.primary ? ' primary' : '') + (a.danger ? ' danger' : ''), a.label);
      b.type = 'button';
      b.onclick = () => { closeModal(); if (a.run) a.run(); };
      row.appendChild(b);
    });
    c.appendChild(row);
    m.appendChild(c);
    m.hidden = false;
    modalClose = opts.dismiss === false ? null : closeModal;
    syncPlay();
    const first = row.querySelector('.primary') || row.querySelector('button');
    if (first) first.focus();
  }
  function closeModal() {
    $('modal').hidden = true;
    $('modal').innerHTML = '';
    modalClose = null;
    syncPlay();
  }

  /* Tells the host page whether the player is playing or in a dialog. */
  function syncPlay() {
    const away = !$('modal').hidden || !!chartKind || !$('ending').hidden;
    Platform.state(away ? 'menu' : 'play');
  }

  /* How far through the game the player is, from 0 to 100, for the host page. */
  function progressPercent() {
    const s = Game.s;
    if (s.trueEnd) return 100;
    if (s.ended) {
      // After the Final Song: the Score, the Hymnal and the Laws
      const most = (o) => Object.keys(o).length;
      return Math.min(99, 50 + most(s.score) + (s.choirs > 0 ? 4 : 0) + most(s.hymnal) * 2 + (s.rebirths > 0 ? 4 : 0) + most(s.laws) * 3);
    }
    let p = s.supernovas > 0 ? 5 : 0;
    p += Object.keys(s.trialsDone).length * 2.5;
    if (s.collapses > 0) p += 5;
    p += Object.keys(s.sky).length * 1.5;
    return Math.min(49, p);
  }
  function textBlock(lines) {
    const d = el('div', 'pad');
    d.style.padding = '0';
    lines.forEach((l) => {
      if (typeof l === 'string') d.appendChild(el('p', '', l));
      else d.appendChild(l);
    });
    return d;
  }

  /* ---------- Planet list ---------- */
  function buildPlanets() {
    const list = $('planet-list');
    list.innerHTML = '';
    cards.length = 0;
    PLANETS.forEach((p, i) => {
      const slot = el('div', 'planet-slot');
      const auto = el('button', 'pc-auto', 'A');
      auto.type = 'button';
      auto.onclick = (e) => {
        const picks = Game.s.auto.planetOn;
        picks[i] = !picks[i];
        if (e.detail) auto.blur(); // or the next Space tap would flip it back
        refresh();
      };
      const b = el('button', 'planet-card');
      b.type = 'button';
      const thumb = el('span', 'pc-thumb');
      thumb.appendChild(Render.planetThumb(i, 46));
      const main = el('span', 'pc-main');
      const nameRow = el('span', 'pc-name', p.name);
      const lv = el('span', 'pc-lv');
      nameRow.appendChild(lv);
      const sub = el('span', 'pc-sub');
      const mile = el('span', 'pc-mile');
      const mileFill = el('i');
      mile.appendChild(mileFill);
      main.append(nameRow, sub, mile);
      const buy = el('span', 'pc-buy');
      const qty = el('span', 'pc-qty');
      const cost = el('span', 'pc-cost');
      buy.append(qty, cost);
      b.append(thumb, main, buy);
      b.onclick = () => { Sound.start(Game.s.settings); Game.buyPlanet(i, Game.s.settings.mode); refresh(); };
      slot.append(auto, b);
      list.appendChild(slot);
      cards.push({ slot, auto, b, lv, sub, mileFill, qty, cost });
    });
  }

  function refreshPlanets() {
    const s = Game.s, f = Game.f, d = Game.d;
    const mode = s.settings.mode;
    const target = f.autoPlanets > 0 && s.auto.planets ? Game.autoTarget() : null;
    for (let i = 0; i < 8; i++) {
      const c = cards[i];
      const lv = s.planets[i];
      const prevOwned = i === 0 || s.planets[i - 1] > 0;
      const visible = lv > 0 || prevOwned;
      show(c.slot, visible);
      if (!visible) continue;
      const picked = s.auto.planetOn[i];
      c.auto.style.visibility = i < f.autoPlanets ? '' : 'hidden';
      c.auto.classList.toggle('on', picked);
      c.auto.setAttribute('aria-pressed', String(picked));
      c.auto.title = (picked ? 'Auto-buy is on for ' : 'Auto-buy is off for ') + PLANETS[i].name;
      c.b.classList.toggle('saving', !!target && target.i === i && !target.ready);
      // In the first run, a new planet you can afford glows until you buy it
      c.b.classList.toggle('hint', s.supernovas === 0 && lv === 0 && !Game.planetLocked(i) && gte(s.light, Game.levelCost(i, 0, 1)));
      const locked = Game.planetLocked(i);
      const n = Game.buyQuantity(i, mode);
      const cost = Game.levelCost(i, lv, n);
      const can = !locked && gte(s.light, cost);
      c.b.classList.toggle('can', can);
      c.b.classList.toggle('unowned', lv === 0);
      c.b.classList.toggle('locked', locked);
      c.b.style.setProperty('--afford', can ? 1 : clamp01(ex(s.light - cost)));
      put(c.lv, lv > 0 ? 'Lv ' + fmtInt(lv) : '');
      put(c.sub, lv > 0 ? fmt(d.yl[i] + Game.dynLog()) + ' every ' + PLANETS[i].beats + ' beats' : PLANETS[i].blurb);
      c.mileFill.style.width = f.noMiles ? '0' : ((lv % f.mileEvery) / f.mileEvery * 100) + '%';
      put(c.qty, locked ? 'Limit reached' : '×' + fmtInt(n));
      put(c.cost, fmt(cost));
      c.b.setAttribute('aria-label', 'Buy ' + n + ' levels of ' + PLANETS[i].name + ' for ' + fmt(cost) + ' Light');
    }
  }

  function buildBuyModes() {
    const box = $('buy-modes');
    box.innerHTML = '';
    [[1, '×1'], [10, '×10'], ['next', 'Next'], ['max', 'Max']].forEach(([v, label]) => {
      const b = el('button', '', label);
      b.type = 'button';
      b.dataset.mode = v;
      b.title = v === 'next' ? 'Buy up to the next milestone' : v === 'max' ? 'Buy as many as you can afford' : 'Buy ' + v;
      b.onclick = () => { Game.s.settings.mode = v; refreshBuyModes(); refresh(); };
      box.appendChild(b);
    });
    refreshBuyModes();
  }
  function refreshBuyModes() {
    for (const b of $('buy-modes').children) b.classList.toggle('on', b.dataset.mode === String(Game.s.settings.mode));
  }

  /* ---------- Auto-buy bar ---------- */
  const AUTO_EVERY = [['0', 'As fast as it can'], ['5', 'Every 5 seconds'], ['15', 'Every 15 seconds'], ['30', 'Every 30 seconds'], ['60', 'Every minute'], ['300', 'Every 5 minutes']];
  const AUTO_SHARE = [['1', 'All of it'], ['0.5', 'Half'], ['0.25', 'A quarter'], ['0.1', 'A tenth']];

  function buildAutoBar() {
    const s = Game.s, f = Game.f;
    const bar = $('auto-bar');
    bar.innerHTML = '';
    const top = el('div', 'auto-top');
    const power = el('button', 'auto-power', 'Auto-buy');
    power.type = 'button';
    power.title = 'Turn auto-buy on or off (A)';
    power.onclick = (e) => { toggleAutoBuy(); if (e.detail) power.blur(); };
    const status = el('span', 'auto-status');
    const more = el('button', 'auto-more', 'Options');
    more.type = 'button';
    more.setAttribute('aria-controls', 'auto-options');
    more.onclick = (e) => { s.auto.open = !s.auto.open; refreshAutoBar(); if (e.detail) more.blur(); };
    top.append(power, status, more);

    const opts = el('div', 'auto-options');
    opts.id = 'auto-options';
    const { check, select } = settingRows(opts);
    select('auto-every', 'How often it buys', String(s.auto.every), AUTO_EVERY, (v) => { s.auto.every = Number(v); });
    select('auto-share', 'How much Light it spends', String(s.auto.share), AUTO_SHARE, (v) => { s.auto.share = Number(v); });
    check('auto-sp', 'Save up for new planets', s.auto.savePlanet, (v) => { s.auto.savePlanet = v; });
    check('auto-st', 'Save up for Tunings', s.auto.saveTuning, (v) => { s.auto.saveTuning = v; });
    if (f.autoTunings) check('auto-t', 'Buy Tunings for me', s.auto.tunings, (v) => { s.auto.tunings = v; });
    opts.appendChild(el('p', 'note', 'It buys whatever pays for itself soonest. Turn off the A beside a planet to leave that planet out.'));
    bar.append(top, opts);
    autoRefs = { power, status, more, opts };
  }

  function autoStatus() {
    const s = Game.s, f = Game.f;
    if (!s.auto.planets) return 'Paused';
    if (!s.auto.planetOn.slice(0, f.autoPlanets).some(Boolean)) return 'No planets picked';
    const target = Game.autoTarget();
    if (target && target.ready) return 'Ready: ' + target.name;
    if (target) return 'Saving for ' + target.name + (target.wait >= 1 ? ', ' + fmtTime(target.wait) : '');
    const wait = Game.autoWait();
    return wait > 0 ? 'Next buy in ' + fmtTime(wait) : 'Buying';
  }

  function refreshAutoBar() {
    const s = Game.s, f = Game.f;
    const on = f.autoPlanets > 0;
    const list = $('planet-list');
    show($('auto-bar'), on);
    list.classList.toggle('with-auto', on);
    list.classList.toggle('auto-paused', !s.auto.planets);
    if (!on) return;
    const key = String(f.autoTunings);
    if (key !== autoKey) { autoKey = key; buildAutoBar(); }
    const r = autoRefs;
    r.power.classList.toggle('on', s.auto.planets);
    r.power.setAttribute('aria-pressed', String(s.auto.planets));
    r.more.classList.toggle('on', s.auto.open);
    r.more.setAttribute('aria-expanded', String(s.auto.open));
    show(r.opts, s.auto.open);
    put(r.status, autoStatus());
    r.status.title = r.status.textContent;
  }

  function toggleAutoBuy() {
    if (!Game.f.autoPlanets) return;
    Game.s.auto.planets = !Game.s.auto.planets;
    refresh();
  }

  /* ---------- Tabs ---------- */
  const TABS = [
    { id: 'tunings', label: 'Tunings', when: () => true, build: buildTunings, tick: refreshTunings },
    { id: 'chart', label: 'Chart', when: (s) => s.supernovas > 0, build: buildChartTab, tick: refreshChartTab },
    { id: 'trials', label: 'Trials', when: () => Game.f.trials, build: buildTrials },
    { id: 'sky', label: 'Sky', when: (s) => s.collapses > 0 || Game.canCollapse(), build: buildSkyTab, tick: refreshSkyTab },
    { id: 'score', label: 'Score', when: (s) => s.ended, build: buildScoreTab, tick: refreshScoreTab },
    { id: 'choir', label: 'Choir', when: () => Game.choirOpen(), build: buildChoirTab, tick: refreshChoirTab },
    { id: 'laws', label: 'Laws', when: () => Game.rebirthOpen(), build: buildLawsTab, tick: refreshLawsTab },
    { id: 'journal', label: 'Journal', when: () => true, build: buildJournal },
    { id: 'settings', label: 'Settings', when: () => true, build: buildSettings, tick: refreshCloudLine },
  ];

  function refreshTabs() {
    const s = Game.s;
    const bar = $('tabs');
    const key = TABS.filter((t) => t.when(s)).map((t) => t.id).join();
    if (bar.__key !== key) {
      const old = bar.__key ? bar.__key.split(',') : null;
      bar.__key = key;
      bar.innerHTML = '';
      TABS.filter((t) => t.when(s)).forEach((t) => {
        const b = el('button', '', t.label);
        b.type = 'button';
        b.dataset.tab = t.id;
        b.onclick = () => selectTab(t.id);
        if (old && !old.includes(t.id)) newTabs[t.id] = true;
        bar.appendChild(b);
      });
    }
    const canNode = NODES.some((n) => Game.nodeAvailable(n) && !Game.nodeMaxed(n) && gte(s.stardust, nodeCost(n, s.nodes[n.id] || 0)));
    const canStar = SKY.some((t) => !s.sky[t.id] && s.voidCur >= t.cost);
    const canNote = s.ended && (SCORE.some((n) => !s.score[n.id] && Game.scoreAvailable(n) && s.echoes >= n.cost) || (Game.refrainOpen() && s.echoes >= Game.refrainCost()));
    const canHymn = HYMNAL.some((h) => !s.hymnal[h.id] && s.voices >= h.cost);
    const canLaw = LAWS.some((l) => !s.laws[l.id] && s.resonance >= l.cost);
    for (const b of bar.children) {
      const id = b.dataset.tab;
      b.classList.toggle('on', id === currentTab);
      b.classList.toggle('new', !!newTabs[id] || (id === 'chart' && canNode) || (id === 'sky' && canStar) ||
        (id === 'score' && canNote) || (id === 'choir' && canHymn) || (id === 'laws' && canLaw));
    }
  }

  function selectTab(id) {
    currentTab = id;
    delete newTabs[id];
    tunKey = '';
    const body = $('tab-body');
    body.innerHTML = '';
    body.scrollTop = 0;
    TABS.find((t) => t.id === id).build(body);
    refreshTabs();
  }

  /* Tunings */
  function buildTunings(body) {
    body.appendChild(el('div', '', ''));
    refreshTunings();
  }
  function refreshTunings() {
    const s = Game.s, f = Game.f;
    const body = $('tab-body');
    if (f.noTunings) {
      if (tunKey !== 'none') { tunKey = 'none'; body.innerHTML = ''; body.appendChild(el('p', 'empty', 'This Trial forbids Tunings.')); }
      return;
    }
    const list = TUNINGS.filter((t) => Game.tuningVisible(t)).slice(0, 14);
    const key = list.map((t) => t.id).join();
    if (key !== tunKey) {
      tunKey = key;
      body.innerHTML = '';
      if (!list.length) body.appendChild(el('p', 'empty', 'New Tunings appear as your Light and planets grow.'));
      list.forEach((t) => {
        const r = el('button', 'row');
        r.type = 'button';
        r.dataset.id = t.id;
        const cost = el('span', 'row-cost', fmt(Game.tuningCost(t)));
        r.append(el('span', 'row-name', t.name), cost, el('span', 'row-desc', t.desc));
        r.onclick = () => { if (Game.buyTuning(t.id)) { Sound.chime([0, 2], 0.07, 0.6); refresh(); } };
        body.appendChild(r);
      });
    }
    const target = f.autoPlanets > 0 && s.auto.planets ? Game.autoTarget() : null;
    for (const r of body.children) {
      if (!r.dataset || !r.dataset.id) continue;
      r.classList.toggle('can', gte(s.light, Game.tuningCost(TUNING_BY_ID[r.dataset.id])));
      r.classList.toggle('saving', !!target && target.tuning === r.dataset.id && !target.ready);
    }
  }

  /* Settings */
  function settingRows(p) {
    const slider = (id, label, value, min, max, step, onInput) => {
      const row = el('label', 'setting');
      row.htmlFor = id;
      row.appendChild(el('span', '', label));
      const i = el('input');
      i.type = 'range'; i.id = id; i.min = min; i.max = max; i.step = step; i.value = value;
      i.oninput = () => onInput(Number(i.value));
      row.appendChild(i);
      p.appendChild(row);
    };
    const check = (id, label, value, onChange) => {
      const row = el('label', 'setting');
      row.htmlFor = id;
      row.appendChild(el('span', '', label));
      const i = el('input');
      i.type = 'checkbox'; i.id = id; i.checked = value;
      i.onchange = () => onChange(i.checked);
      i.onclick = (e) => { if (e.detail) i.blur(); }; // hand Space and the hotkeys back to the game
      row.appendChild(i);
      p.appendChild(row);
    };
    const select = (id, label, value, options, onChange) => {
      const row = el('label', 'setting');
      row.htmlFor = id;
      row.appendChild(el('span', '', label));
      const i = el('select');
      i.id = id;
      options.forEach(([v, t]) => { const o = el('option', '', t); o.value = v; i.appendChild(o); });
      i.value = value;
      let pointer = false;
      i.onpointerdown = () => { pointer = true; };
      i.onchange = () => {
        onChange(i.value);
        if (pointer) i.blur(); // hand Space and the hotkeys back to the game
        pointer = false;
      };
      row.appendChild(i);
      p.appendChild(row);
    };
    return { slider, check, select };
  }
