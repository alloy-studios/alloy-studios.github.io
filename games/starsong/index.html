      offlineEff: 0.2, offlineCap: 4 * 3600,
      startLight: ZERO, startStage: 0,
      autoPlanets: 0, autoTunings: false, autoCresc: false, autoSupernova: false, keeper: 0, keepTunings: false,
      classes: false, trials: false,
      keepHand: false, keepLyreCrown: false, finalSong: false,
      lightPow: 1, voidMult: 1,
      // After the Final Song
      keepChart: false, keepVoid: false, autoCollapse: false, collapseEase: 1,
      echoMult: 1, encoreEase: 1, choir: false, keepScore: 0,
      voiceMult: 1, autoEncore: false, rebirth: false, lawScore: 0, lawHymns: 0, firstNote: false,
    };
  }

  function rebuild() {
    f = baseFx();
    // A Trial that forbids Tunings also silences any kept by Long Memory
    const rules = baseFx();
    if (s.trial) TRIAL_BY_ID[s.trial].rules(rules);
    if (!rules.noTunings) for (const id in s.tunings) if (s.tunings[id]) TUNING_BY_ID[id].fx(f);
    for (const n of NODES) { const lv = s.nodes[n.id]; if (lv) n.fx(f, lv, s); }
    for (const t of TRIALS) if (s.trialsDone[t.id]) t.fx(f);
    for (const t of SKY) if (s.sky[t.id]) t.fx(f);
    for (const n of SCORE) if (s.score[n.id]) n.fx(f, s);
    if (s.refrain > 0) f.yieldAll += BAL.refrainLight * s.refrain;
    if (s.chord && CHORD_BY_ID[s.chord]) CHORD_BY_ID[s.chord].fx(f);
    for (const h of HYMNAL) if (s.hymnal[h.id]) h.fx(f);
    for (const l of LAWS) if (s.laws[l.id]) l.fx(f);
    CLASS_BY_ID[s.starClass].fx(f);
    if (s.trial) TRIAL_BY_ID[s.trial].rules(f);

    // Light from deeds, lifetime Stardust and Void
    const deedCount = Object.keys(s.deeds).length;
    f.yieldAll += deedCount * lg(1.02);
    f.yieldAll += stardustBonusLog();
    f.yieldAll += voidBonusLog();
    f.yieldAll += s.stage * lg(f.stageMult);
    // ...and from the layers after the Final Song
    f.yieldAll += echoBonusLog() + voiceBonusLog() + resonanceBonusLog();

    // Tempo
    const rawBpm = f.bpmLock || (BASE_BPM + f.bpmAdd + s.stage * 4) * f.bpmMul;
    d.bpm = Math.min(rawBpm, BPM_CAP);
    d.overdrive = rawBpm / d.bpm;
    d.bps = d.bpm / 60;

    // Planets
    d.owned = 0;
    for (let i = 0; i < 8; i++) {
      const lv = s.planets[i];
      if (lv > 0) d.owned++;
      d.yl[i] = lv > 0 ? planetYieldLog(i, lv) : ZERO;
    }
    computeConjunctionAverages();
    dirty = false;
    refreshRates();
  }

  function stardustBonusLog() {
    if (s.stardustTotal <= ZERO / 2) return 0;
    // Lifetime Stardust multiplies Light by (1 + 0.2 * Stardust) ^ 0.7, so early
    // Stardust feels strong while huge totals cannot run away from the economy.
    const b = (f ? f.sdBonus : 1) * 0.2;
    return ladd(0, s.stardustTotal + lg(b)) * 0.7;
  }

  function voidBonusLog() {
    return s.voidTotal > 0 ? 2 * Math.sqrt(s.voidTotal) : 0;
  }

  /* Echoes earned since you last joined the Choir, Voices since the last Rebirth and all
   * Resonance ever each multiply Light by (1 + amount) to a fixed power. */
  function echoBonusLog() {
    return s.echoesEarned > 0 ? BAL.echoBonus * Math.log10(1 + s.echoesEarned) : 0;
  }
  function voiceBonusLog() {
    return s.voicesEarned > 0 ? BAL.voiceBonus * Math.log10(1 + s.voicesEarned) : 0;
  }
  function resonanceBonusLog() {
    return s.resonanceTotal > 0 ? BAL.resBonus * Math.log10(1 + s.resonanceTotal) : 0;
  }

  function planetYieldLog(i, lv) {
    const p = PLANETS[i];
    const miles = f.noMiles ? 0 : Math.floor(lv / f.mileEvery);
    const base = lg(p.yield) + lg(lv) + miles * lg(f.mileBase) + f.yieldPlanet[i] + f.yieldAll + lg(d.overdrive);
    return base * (base > 0 ? f.lightPow : 1);
  }

  /* Average conjunction multiplier each planet sees over the 48 beat cycle. */
  function computeConjunctionAverages() {
    const sum = new Array(8).fill(0);
    const cnt = new Array(8).fill(0);
    for (let b = 0; b < BEAT_CYCLE; b++) {
      let n = 0;
      for (let i = 0; i < 8; i++) if (s.planets[i] > 0 && b % PLANETS[i].beats === 0) n++;
      if (!n) continue;
      let m = 1 + f.conjBonus * (n - 1);
      if (b === 0 && d.owned >= 3) m *= f.grandMult;
      for (let i = 0; i < 8; i++) if (s.planets[i] > 0 && b % PLANETS[i].beats === 0) { sum[i] += m; cnt[i]++; }
    }
    for (let i = 0; i < 8; i++) d.avgConj[i] = cnt[i] ? sum[i] / cnt[i] : 1;
  }

  function harmonyMult() {
    return 1 + s.harmony * f.harmPer;
  }

  /* Multipliers that change from moment to moment, as a log. */
  function dynLog() {
    let m = lg(harmonyMult());
    if (s.cresc > 0) m += lg(f.crescForce);
    if (s.aurora > 0) m += s.auroraMult;
    if (f.patience > 1 && s.sinceTap >= 30) m += lg(f.patience);
    return m;
  }

  function currentBps() {
    return d.bps * (s.cresc > 0 ? f.crescTempo : 1);
  }

  function refreshRates() {
    let total = ZERO;
    const bps = d.bps;
    for (let i = 0; i < 8; i++) {
      if (s.planets[i] > 0) total = ladd(total, d.yl[i] + lg(d.avgConj[i]) + lg(bps / PLANETS[i].beats));
    }
    d.baseLps = total;
    d.lps = total <= ZERO / 2 ? ZERO : total + dynLog() + (s.cresc > 0 ? lg(f.crescTempo) : 0);
    d.tapLog = ladd(lg(f.tapBase), f.tapPct > 0 && total > ZERO / 2 ? lg(f.tapPct) + total : ZERO);
  }

  function addLight(a) {
    s.light = ladd(s.light, a);
    s.runLight = ladd(s.runLight, a);
    s.totalLight = ladd(s.totalLight, a);
    if (s.runLight > s.stats.bestRun) s.stats.bestRun = s.runLight;
  }

  /* The main loop */
  let autoTimer = 0, slowTimer = 0;
  let planetTimer = Infinity; // seconds since the planet auto-buyer last bought

  function tick(dt) {
    if (dirty) rebuild();
    s.stats.time += dt;
    s.runTime += dt;
    s.sinceTap += dt;

    if (s.cresc > 0) {
      s.cresc -= dt;
      if (s.cresc <= 0) {
        s.cresc = 0;
        s.harmony = Math.max(s.harmony * 0.4, harmonyFloor());
        emit('crescendoEnd');
      }
    }
    if (s.aurora > 0) { s.aurora -= dt; if (s.aurora < 0) s.aurora = 0; }

    const bps = currentBps();
    const prev = s.beat;
    s.beat += bps * dt;
    const b0 = Math.floor(prev), b1 = Math.floor(s.beat);
    for (let b = b0 + 1; b <= b1; b++) onBeat(b, (s.beat - b) / bps);

    updateComets(dt);

    planetTimer += dt;
    autoTimer += dt;
    if (autoTimer >= 0.4) { autoTimer = 0; runAutomation(); }
    slowTimer += dt;
    if (slowTimer >= 1) { slowTimer = 0; slowChecks(); }
    refreshRates();
  }

  function onBeat(b, late) {
    const who = [];
    for (let i = 0; i < 8; i++) if (s.planets[i] > 0 && b % PLANETS[i].beats === 0) who.push(i);
    const cycleStart = b % BEAT_CYCLE === 0;
    const grand = cycleStart && d.owned >= 3;

    // With nothing orbiting, the star's own heartbeat gives a little Light, so a run
    // can never get stuck at zero, even for someone who never taps.
    if (d.owned === 0 && b % 2 === 0) addLight(0);

    if (who.length) {
      let m = 1 + f.conjBonus * (who.length - 1);
      if (grand) m *= f.grandMult;
      const mult = lg(m) + dynLog() + (s.cresc > 0 ? lg(f.crescTempo) : 0);
      const gains = [];
      let sum = ZERO;
      for (const i of who) { const g = d.yl[i] + mult; gains.push(g); sum = ladd(sum, g); }
      addLight(sum);
      if (grand) {
        if (d.owned >= 4) s.stats.grands++;
        if (d.owned >= 8) s.stats.grand8++;
      }
      emit('pulse', { who, gains, sum, grand, beat: b, late, conj: who.length });
    }

    // Harmony fades unless the player is tapping. Crescendo holds it steady.
    if (s.cresc <= 0 && s.lastTapBeat < b - 1) {
      if (s.fullHold > 0 && s.harmony >= f.harmMax - EPS) s.fullHold--;
      else s.harmony = Math.max(harmonyFloor(), s.harmony - f.harmDecay);
      if (s.lastTapBeat < b - 2) s.streak = 0;
    }
    if (f.keeper > 0 && s.auto.keeper && !f.noTap && s.lastTapBeat < b && s.cresc <= 0 && Math.random() < f.keeper) {
      gainHarmony(1);
    }
    if (f.noTap) s.harmony = 0;
    emit('beat', { beat: b, late, cycleStart });
  }

  /* Adds Harmony. Reaching the top holds it there for a while, so the Crescendo
   * button does not vanish before the player can press it. */
  function gainHarmony(n) {
    s.harmony += n;
    if (s.harmony >= f.harmMax) { s.harmony = f.harmMax; s.fullHold = FULL_HOLD_BEATS; }
  }

  function harmonyFloor() {
    return f.noTap ? 0 : f.harmFloor * f.harmMax;
  }

  /* Tapping */
  function tapWindows() {
    const bps = currentBps();
    return { perfect: Math.min(0.075, 0.12 / bps), good: Math.min(0.15, 0.26 / bps) };
  }

  /* The very first moments of the game, before anything is orbiting. */
  function isEarly() {
    return d.owned === 0 && s.supernovas === 0;
  }

  function tap() {
    if (dirty) rebuild();
    if (f.noTap) { emit('tapBlocked'); return null; }
    const bps = currentBps();
    const beatPos = s.beat - (s.settings.latency || 0) / 1000 * bps;
    const frac = beatPos - Math.floor(beatPos);
    const dist = Math.min(frac, 1 - frac) / bps;
    const nearest = frac < 0.5 ? Math.floor(beatPos) : Math.floor(beatPos) + 1;
    const w = tapWindows();
    const early = isEarly();
    let q = dist <= w.perfect ? 2 : dist <= w.good * (early ? 1.7 : 1) ? 1 : 0;
    if (nearest === s.lastTapBeat) q = 0;
    if (q > 0) s.lastTapBeat = nearest;
    learnTiming(bps);
    return applyTap(q);
  }

  /* Sound reaches each player late by a different amount: a Chromebook speaker, a TV,
   * Bluetooth headphones. Players tap to what they hear, so a steady lean early or late
   * is the device, not the player. Taps near a beat teach the offset, which then moves
   * the beat windows to match. Random tapping averages out and leaves it alone. */
  const tapErrors = [];
  function learnTiming(bps) {
    if (!s.settings.autoTiming) return;
    const frac = s.beat - Math.floor(s.beat);
    const err = (frac < 0.5 ? frac : frac - 1) / bps * 1000;   // ms after the nearest beat
    if (Math.abs(err) > 320) return;
    tapErrors.push(err);
    if (tapErrors.length > 24) tapErrors.shift();
    if (tapErrors.length < 10 || tapErrors.length % 4) return;
    const sorted = tapErrors.slice().sort((a, b) => a - b);
    const lean = sorted[sorted.length >> 1];
    const spread = sorted[Math.floor(sorted.length * 0.75)] - sorted[Math.floor(sorted.length * 0.25)];
    if (spread > 160) return;                                  // not tapping to a beat at all
    const now = s.settings.latency || 0;
    if (Math.abs(lean - now) < 20) return;
    const next = now + (lean - now) * 0.6;
    s.settings.latency = Math.max(-150, Math.min(300, Math.round(next / 5) * 5));
  }

  function applyTap(q) {
    s.stats.taps++;
    s.sinceTap = 0;
    const early = isEarly();
    const mul = q === 2 ? 2 : q === 1 ? 1 : early ? 0.5 : 0.2;
    const g = d.tapLog + lg(mul) + dynLog();
    addLight(g);
    if (q === 2) { s.stats.perfects++; gainHarmony(f.perfectHarm); s.streak++; }
    else if (q === 1) { s.stats.goods++; gainHarmony(1); s.streak++; }
    else { if (!early) s.harmony = Math.max(harmonyFloor(), s.harmony - 1.5); s.streak = 0; }
    if (s.streak > s.stats.bestStreak) s.stats.bestStreak = s.streak;
    const result = { q, gain: g, streak: s.streak };
    emit('tap', result);
    return result;
  }

  function crescendoReady() {
    return s.cresc <= 0 && !f.noTap && s.harmony >= f.harmMax - EPS;
  }

  function startCrescendo() {
    if (!crescendoReady()) return false;
    s.cresc = f.crescLen;
    s.stats.crescendos++;
    emit('crescendo');
    return true;
  }

  /* Comets */
  function updateComets(dt) {
    if (f.noComets) { comet = null; return; }
    if (comet) {
      comet.t += dt;
      if (comet.t >= comet.dur) {
        if (f.autoComet) catchComet(0.5);
        comet = null;
      }
      return;
    }
    if (s.planets[0] <= 0 && s.supernovas === 0) return;
    s.cometIn -= dt * f.cometRate;
    if (showerLeft > 0 && s.cometIn > 1.2) s.cometIn = 1.2;
    if (s.cometIn <= 0) {
      s.cometIn = 45 + Math.random() * 50;
      spawnComet();
    }
  }

  function spawnComet() {
    if (showerLeft > 0) showerLeft--;
    else if (f.showers && Math.random() < 0.15) showerLeft = 5;
    const fromLeft = Math.random() < 0.5;
    comet = {
      t: 0, dur: 9, gold: Math.random() < f.goldChance,
      x0: fromLeft ? -0.08 : 1.08, y0: 0.1 + Math.random() * 0.5,
      x1: fromLeft ? 1.08 : -0.08, y1: 0.35 + Math.random() * 0.5,
    };
    emit('cometSpawn', comet);
  }

  function catchComet(scale) {
    if (!comet) return null;
    const c = comet;
    comet = null;
    s.stats.comets++;
    const power = (c.gold ? 5 : 1) * (scale || 1);
    const roll = Math.random();
    const out = { x: c.x, y: c.y, gold: c.gold };
    const light = Math.max(s.light, d.baseLps + lg(60));
    if (roll < 0.45) {
      // Comet strength multiplies the income part only. Multiplying a share of all the
      // Light you hold made frequent comets compound without limit.
      const g = ladd(d.baseLps + lg((90 + Math.random() * 120) * power * f.cometLump), s.light + lg(0.03));
      addLight(g);
      out.kind = 'lump'; out.gain = g;
    } else if (roll < 0.8 || s.harmony >= f.harmMax) {
      s.aurora = 20 * f.cometDur * (c.gold ? 1.5 : 1);
      s.auroraMult = lg(4 * f.cometPower * (c.gold ? 3 : 1));
      out.kind = 'aurora'; out.mult = ex(s.auroraMult); out.time = s.aurora;
    } else {
      if (!f.noTap) gainHarmony(f.harmMax);
      out.kind = 'surge';
    }
    if (f.cometStardust && Math.random() < 0.15) {
      const sd = Math.max(0, stardustGain() - 1.5);
      if (sd > 0) {
        s.stardust = ladd(s.stardust, sd);
        s.stardustTotal = ladd(s.stardustTotal, sd);
        dirty = true;
        out.stardust = sd;
      }
    }
    void light;
    emit('cometCaught', out);
    return out;
  }

  /* Buying planets */
  function growth(i) {
    const g = PLANETS[i].growth + f.growthAdd;
    return Math.max(MIN_GROWTH, 1 + (g - 1) * f.growthMul);
  }

  function planetLocked(i) {
    if (s.planets[i] > 0) return false;
    return d.owned >= f.planetLimit;
  }

  /* Log price of one level. Above SUPER_LEVEL prices climb faster and faster, which
   * stops very late growth from feeding on itself. */
  function levelPrice(i, lv) {
    const from = SUPER_LEVEL;
    const over = lv > from ? lv - from : 0;
    return lg(PLANETS[i].cost) + f.costMul + lv * Math.log10(growth(i)) + over * over * SUPER_RATE;
  }

  /* Log price of the next n levels. Long runs are nearly geometric, so the last few
   * levels decide the total and we can sum the tail in closed form. */
  function levelCost(i, lv, n) {
    if (n === 1) return levelPrice(i, lv);
    if (n <= 40) {
      let total = ZERO;
      for (let k = 0; k < n; k++) total = ladd(total, levelPrice(i, lv + k));
      return total;
    }
    const last = levelPrice(i, lv + n - 1);
    const step = last - levelPrice(i, lv + n - 2);
    return last - Math.log10(1 - Math.pow(10, -step));
  }

  function maxAffordable(i, budget = s.light) {
    const lv = s.planets[i];
    if (!gte(budget, levelPrice(i, lv))) return 0;
    let lo = 1, hi = 2;
    while (hi < 1e7 && gte(budget, levelCost(i, lv, hi))) { lo = hi; hi *= 2; }
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      if (gte(budget, levelCost(i, lv, mid))) lo = mid; else hi = mid;
    }
    return lo;
  }

  function nextMilestoneGap(i) {
    const lv = s.planets[i];
    return f.mileEvery - (lv % f.mileEvery);
  }

  /* How many levels the current buy mode would buy. `mode` is 1, 10, 'next' or 'max'. */
  function buyQuantity(i, mode) {
    if (mode === 'max') return Math.max(1, maxAffordable(i));
    if (mode === 'next') return nextMilestoneGap(i);
    return mode;
  }

  function buyPlanet(i, mode) {
    if (dirty) rebuild();
    if (planetLocked(i)) return false;
    const n = buyQuantity(i, mode || 1);
    const cost = levelCost(i, s.planets[i], n);
    if (!gte(s.light, cost)) return false;
    const before = s.planets[i];
    s.light = lsub(s.light, cost);
    s.planets[i] += n;
    dirty = true;
    rebuild();
    const crossed = f.noMiles ? 0 : Math.floor(s.planets[i] / f.mileEvery) - Math.floor(before / f.mileEvery);
    emit('buy', { i, n, first: before === 0, crossed });
    if (before === 0 && i === 0) tell('firstPlanet');
    return true;
  }

  /* Tunings */
  function tuningCost(t) {
    return t.cost + f.tuningCost;
  }

  function tuningVisible(t) {
    if (s.tunings[t.id]) return false;
    if (t.planet !== undefined) return s.planets[t.planet] >= t.reqLevel;
    return s.runLight >= t.cost - 1.2;
  }

  function buyTuning(id) {
    if (dirty) rebuild();
    const t = TUNING_BY_ID[id];
    if (f.noTunings || s.tunings[id] || !tuningVisible(t)) return false;
    const cost = tuningCost(t);
    if (!gte(s.light, cost)) return false;
    s.light = lsub(s.light, cost);
    s.tunings[id] = true;
    dirty = true;
    rebuild();
    emit('tuning', t);
    return true;
  }

  /* Automation */

  /* Saving only ever applies to things within SAVE_SECS of income. Anything further off
   * waits until more planets bring it into reach, so saving can never stall a run. */
  function withinReach(cost) {
    return gte(ladd(s.light, d.baseLps + lg(SAVE_SECS)), cost);
  }

  /* The cheapest Tuning, once it is close enough to leave Light for. */
  function tuningGoal() {
    if (!s.auto.saveTuning || f.autoPlanets === 0 || f.noTunings) return null;
    let goal = null;
    for (const t of TUNINGS) {
      if (tuningVisible(t) && (!goal || tuningCost(t) < tuningCost(goal))) goal = t;
    }
    return goal && withinReach(tuningCost(goal)) ? goal : null;
  }

  /* The next planet you do not own, once it is close enough to wait for, or -1. It may
   * be one the auto-buyer does not cover yet, in which case the Light is left for you. */
  function planetGoal() {
    if (!s.auto.savePlanet || f.autoPlanets === 0) return -1;
    for (let i = 0; i < 8; i++) {
      if (s.planets[i] > 0 || planetLocked(i)) continue;
      const covered = i < f.autoPlanets;
      if (covered && !s.auto.planetOn[i]) continue;
      return withinReach(levelPrice(i, 0) - (covered ? lg(s.auto.share) : 0)) ? i : -1;
    }
    return -1;
  }

  /* Light the planet buyer may spend: its share, less what is being left for you. */
  function autoBudget() {
    let free = s.light;
    const t = tuningGoal();
    if (t) free = lsub(free, tuningCost(t));
    const p = planetGoal();
    if (p >= f.autoPlanets) free = lsub(free, levelPrice(p, 0));
    return Math.min(s.light + lg(s.auto.share), free);
  }

  /* Seconds until the budget covers a price at the current income. */
  function secondsUntil(cost, budget, rate = d.baseLps + lg(s.auto.share)) {
    if (gte(budget, cost)) return 0;
    if (d.baseLps <= ZERO / 2) return Infinity;
    return ex(lsub(cost, budget) - rate);
  }

  function orbitLog(i, lv) {
    return lv > 0 ? planetYieldLog(i, lv) + lg(d.avgConj[i]) + lg(d.bps / PLANETS[i].beats) : ZERO;
  }

  /* What the buyer wants next. A new planet in reach comes first. After that it takes
   * whichever purchase pays for itself soonest, counting the wait to afford it, so it
   * will hold off a cheap level to buy a much better one a few seconds later. */
  function planetPick(budget) {
    const goal = planetGoal();
    if (goal >= 0 && goal < f.autoPlanets) {
      const cost = levelPrice(goal, 0);
      return { i: goal, n: 1, wait: secondsUntil(cost, budget) };
    }
    let best = null, bestScore = Infinity;
    for (let i = 0; i < Math.min(f.autoPlanets, 8); i++) {
      if (!s.auto.planetOn[i] || planetLocked(i)) continue;
      const lv = s.planets[i];
      for (const n of [1, nextMilestoneGap(i)]) {
        const cost = levelCost(i, lv, n);
        const wait = secondsUntil(cost, budget);
        if (wait > SAVE_SECS) continue;
        const payback = cost - lsub(orbitLog(i, lv + n), orbitLog(i, lv));
        const score = ladd(payback, lg(wait));
        if (score < bestScore) { bestScore = score; best = { i, n, wait }; }
      }
    }
    return best;
  }

  function runPlanetBuyer() {
    let budget = autoBudget(), bought = false;
    for (let step = 0; step < 32; step++) {
      const pick = planetPick(budget);
      if (!pick) break;
      // Levels cost the same one at a time, so a jump to a milestone starts now with
      // whatever is affordable. When Light dwarfs prices, take up to a quarter of the
      // budget per step so huge late game purchases finish quickly and spread by value.
      const lv = s.planets[pick.i];
      const n = pick.wait > 0 ? maxAffordable(pick.i, budget) : Math.max(pick.n, maxAffordable(pick.i, budget + lg(0.25)));
      if (n === 0) break;
      const cost = levelCost(pick.i, lv, n);
      s.light = lsub(s.light, cost);
      budget = lsub(budget, cost);
      s.planets[pick.i] = lv + n;
      if (lv === 0) d.owned++; // keeps a Trial's planet limit honest within this pass
      bought = true;
      emit('autobuy', { i: pick.i, n, first: lv === 0 });
    }
    if (bought) { planetTimer = 0; dirty = true; rebuild(); }
  }

  /* Seconds until the planet auto-buyer may buy again. */
  function autoWait() {
    return Math.max(0, s.auto.every - planetTimer);
  }

  /* What the auto-buyer is holding Light for, for display: something still being saved
   * for comes first, then anything left ready for you to buy. */
  function autoTarget() {
    const budget = autoBudget();
    const t = tuningGoal();
    const hand = planetGoal();
    const held = hand >= f.autoPlanets;
    if (t && !gte(s.light, tuningCost(t))) {
      return { name: t.name, tuning: t.id, wait: secondsUntil(tuningCost(t), s.light, d.baseLps) };
    }
    if (held && !gte(s.light, levelPrice(hand, 0))) {
      return { name: PLANETS[hand].name, i: hand, wait: secondsUntil(levelPrice(hand, 0), s.light, d.baseLps) };
    }
    const pick = planetPick(budget);
    if (pick && maxAffordable(pick.i, budget) === 0) {
      const wait = secondsUntil(levelPrice(pick.i, s.planets[pick.i]), budget);
      if (wait >= 1) return { name: PLANETS[pick.i].name, i: pick.i, wait };
    }
    if (t) return { name: t.name, tuning: t.id, ready: true };
    if (held) return { name: PLANETS[hand].name, i: hand, ready: true };
    return null;
  }

  function runAutomation() {
    // Tunings go first, or the planet buyer would spend the Light they need
    if (f.autoTunings && s.auto.tunings && !f.noTunings) {
      for (const t of TUNINGS) {
        if (tuningVisible(t) && gte(s.light, tuningCost(t))) {
          s.light = lsub(s.light, tuningCost(t));
          s.tunings[t.id] = true;
          dirty = true;
        }
      }
      if (dirty) rebuild();
    }
    if (f.autoPlanets > 0 && s.auto.planets && autoWait() === 0) runPlanetBuyer();
    if (f.autoCresc && s.auto.cresc && crescendoReady()) startCrescendo();
    if (f.autoSupernova && s.auto.supernova && canSupernova() && !s.trial) {
      const gain = stardustGain();
      if (gain >= s.stardustTotal + lg(s.auto.snTarget)) emit('autoSupernova');
    }
    // Pull of Gravity and Plainsong: the target is a share of what this layer has
    // already earned, like the Supernova target
    if (f.autoCollapse && s.auto.collapse && canCollapse() && !s.trial && voidGain() >= Math.max(1, s.voidTotal * s.auto.voidTarget)) emit('autoCollapse');
    if (f.autoEncore && s.auto.encore && canEncore() && echoGain() >= Math.max(1, s.echoesEarned * s.auto.echoTarget)) emit('autoEncore');
  }

  /* Slow checks: stage changes, deeds, story and trials */
  function slowChecks() {
    checkStage();
    if (s.trial && s.runLight >= TRIAL_BY_ID[s.trial].goal) completeTrial();
    checkDeeds();
    if (canCollapse()) tell('collapseReady');
    if (f.choir) tell('choirOpen');
    if (f.rebirth) tell('rebirthOpen');
    if (f.firstNote) tell('firstNoteOpen');
  }

  function checkStage() {
    while (s.stage < STAGES.length - 1 && s.runLight >= STAGES[s.stage + 1].req) {
      s.stage++;
      dirty = true;
      emit('stage', s.stage);
      tell('stage' + s.stage);
    }
    if (dirty) rebuild();
  }

  function checkDeeds() {
    for (const a of DEEDS) {
      if (!s.deeds[a.id] && a.check(s)) {
        s.deeds[a.id] = true;
        dirty = true;
        emit('deed', a);
      }
    }
  }

  function tell(key) {
    if (s.story[key] || !STORY[key]) return;
    s.story[key] = Date.now();
    emit('story', { key, text: STORY[key] });
  }

  /* Supernova */
  /* A star must reach Blue Giant and burn for a minute. The minute stops a run of
   * instant resets from outpacing the game: it once let a fast player finish in 1h45. */
  function canSupernova() {
    return s.runLight >= SN_REQ && s.runTime >= SN_MIN_AGE;
  }

  /* Seconds until a Blue Giant is old enough to go Supernova. */
  function novaWait() {
    return s.runLight >= SN_REQ ? Math.max(0, SN_MIN_AGE - s.runTime) : Infinity;
  }

  function stardustGain() {
    if (s.runLight < SN_REQ) return ZERO;
    const raw = (s.runLight - SN_REQ) * f.sdExp + lg(4) + f.sdMult;
    return lfloor(raw * f.sdPow);
  }

  function resetRun() {
    s.light = f.startLight;
    s.runLight = f.startLight;
    s.planets = [0, 0, 0, 0, 0, 0, 0, 0];
    if (!f.keepTunings) s.tunings = {};
    s.stage = 0;
    s.harmony = 0; s.streak = 0; s.lastTapBeat = -1;
    s.cresc = 0; s.aurora = 0;
    s.runTime = 0; s.beat = 0;
    s.cometIn = 30;
    comet = null;
    planetTimer = Infinity;
    dirty = true;
    rebuild();
    if (f.startStage > 0) {
      s.stage = f.startStage;
      s.runLight = Math.max(s.runLight, STAGES[f.startStage].req);
      dirty = true;
      rebuild();
    }
  }

  function supernova(nextClass) {
    if (!canSupernova()) return false;
    const gain = stardustGain();
    s.stardust = ladd(s.stardust, gain);
    s.stardustTotal = ladd(s.stardustTotal, gain);
    s.supernovas++;
    s.stats.classesPlayed[s.starClass] = true;
    if (s.runTime < s.stats.fastestNova) s.stats.fastestNova = s.runTime;
    if (nextClass && f.classes) s.starClass = nextClass;
    s.trial = null;
    dirty = true;
    rebuild();
    checkDeeds();
    resetRun();
    tell(s.supernovas === 1 ? 'firstNova' : s.supernovas === 3 ? 'thirdNova' : '');
    emit('supernova', { gain });
    return true;
  }

  /* Constellation chart */
  function nodeAvailable(n) {
    if (!n.req) return true;
    return n.req.some((r) => s.nodes[r] >= 1);
  }

  function nodeMaxed(n) {
    const lv = s.nodes[n.id] || 0;
    return n.scale ? lv >= n.max : lv >= 1;
  }

  function buyNode(id) {
    if (dirty) rebuild();
    const n = NODE_BY_ID[id];
    if (!nodeAvailable(n) || nodeMaxed(n)) return false;
    const lv = s.nodes[id] || 0;
    const cost = nodeCost(n, lv);
    if (!gte(s.stardust, cost)) return false;
    s.stardust = lsub(s.stardust, cost);
    s.nodes[id] = lv + 1;
    dirty = true;
    rebuild();
    if (id === 'root') tell('chart');
    if (id === 'crown4') tell('trials');
    emit('node', n);
    return true;
  }

  /* Trials */
  function enterTrial(id) {
    if (!f.trials || s.trial) return false;
    s.trial = id;
    dirty = true;
    rebuild();
    resetRun();
    emit('trialStart', TRIAL_BY_ID[id]);
    return true;
  }

  function leaveTrial() {
    if (!s.trial) return false;
    s.trial = null;
    dirty = true;
    rebuild();
    resetRun();
    emit('trialLeft');
    return true;
  }

  function completeTrial() {
    const t = TRIAL_BY_ID[s.trial];
    s.trialsDone[t.id] = true;
    s.trial = null;
    dirty = true;
    rebuild();
    emit('trialDone', t);
  }

  /* Collapse */
  function collapseReq() {
    // Counted from the last Encore, which starts the first movement over
    return COLLAPSE_REQ * (1 + 0.3 * (s.collapses - s.collapseBase) * f.collapseEase);
  }

  function canCollapse() {
    return s.runLight >= collapseReq();
  }

  function voidGain() {
    if (!canCollapse()) return 0;
    return Math.floor(Math.pow(s.runLight / COLLAPSE_REQ, 1.8) * f.voidMult + EPS);
  }

  function collapse() {
    if (!canCollapse()) return false;
    const gain = voidGain();
    s.voidCur += gain;
    s.voidTotal += gain;
    s.collapses++;
    const kept = {};
    for (const n of NODES) {
      const keep = f.keepChart || (f.keepHand && n.arm === 'hand') || (f.keepLyreCrown && (n.arm === 'lyre' || n.arm === 'crown'));
      if (keep && s.nodes[n.id]) kept[n.id] = s.nodes[n.id];
    }
    if (Object.keys(kept).length) kept.root = 1;
    s.nodes = kept;
    s.stardust = ZERO;
    s.stardustTotal = ZERO;
    s.starClass = 'main';
    s.trial = null;
    s.tunings = {};
    dirty = true;
    rebuild();
    resetRun();
    tell('firstCollapse');
    checkDeeds();
    emit('collapse', { gain });
    return true;
  }

  function buySky(id) {
    const t = SKY_BY_ID[id];
    if (s.sky[id] || s.voidCur < t.cost) return false;
    s.voidCur -= t.cost;
    s.sky[id] = true;
    dirty = true;
    rebuild();
    const count = Object.keys(s.sky).length;
    if (count === 6) tell('skyHalf');
    if (count === 12) tell('skyAll');
    emit('sky', t);
    return true;
  }

  function canSing() {
    return !s.ended && f.finalSong && s.runLight >= SONG_REQ;
  }

  function sing() {
    if (!canSing()) return false;
    s.ended = true;
    tell('ending');
    checkDeeds();
    emit('ending');
    return true;
  }

  /* ---------- After the Final Song ---------- */

  /* An Encore starts the star over, as a Collapse does: the run, Stardust and the chart
   * go, while the Void and the sky stay. */
  function encoreReset(wipeChart) {
    s.stardust = ZERO;
    s.stardustTotal = ZERO;
    if (wipeChart || !f.keepChart) s.nodes = {};
    s.tunings = {};
    s.starClass = 'main';
    s.trial = null;
    dirty = true;
    rebuild();
    resetRun();
  }

  /* Joining the Choir, or Rebirth, starts the whole first movement over: the chart and the
   * Void as well. The stars relit in the sky stay lit for good, and so do Deeds, Trials
   * and the layers above. */
  function firstMovementReset() {
    rebuild();                                   // what is kept depends on what was just reset
    if (!f.keepVoid) {
      s.voidCur = 0;
      s.voidTotal = 0;
      s.collapseBase = s.collapses;
    }
    s.nextClass = 'main';
    encoreReset(true);
  }

  /* Encore: Echoes. Any run past the Final Song's Light can Encore, and every
   * BAL.echoScale powers of ten of Light beyond it give ten times the Echoes. */
  function encoreReq() {
    return SONG_REQ;
  }

  function canEncore() {
    return s.ended && f.finalSong && s.runLight >= encoreReq();
  }

  function echoGain() {
    if (!canEncore()) return 0;
    return Math.min(1e300, Math.floor(f.echoMult * Math.pow(10, (s.runLight - encoreReq()) / BAL.echoScale) + EPS));
  }

  function encore() {
    if (!canEncore()) return false;
    const gain = echoGain();
    s.echoes += gain;
    s.echoesEarned += gain;
    s.stats.echoes += gain;
    s.encores++;
    s.encoresHere++;
    encoreReset();
    tell(s.encores === 1 ? 'firstEncore' : s.encores === 3 ? 'encore3' : '');
    checkDeeds();
    emit('encore', { gain });
    return true;
  }

  function scoreAvailable(n) {
    return n.m === 0 || SCORE.every((x) => x.m !== n.m - 1 || s.score[x.id]);
  }

  function buyScore(id) {
    const n = SCORE_BY_ID[id];
    if (!n || s.score[id] || !scoreAvailable(n) || s.echoes < n.cost) return false;
    s.echoes -= n.cost;
    s.score[id] = true;
    dirty = true;
    rebuild();
    checkDeeds();
    emit('score', n);
    return true;
  }

  function refrainCost() {
    return BAL.refrainCost * Math.pow(BAL.refrainGrowth, s.refrain);
  }

  function refrainOpen() {
    return SCORE.every((n) => s.score[n.id]);
  }

  function buyRefrain() {
    if (!refrainOpen() || s.echoes < refrainCost()) return false;
    s.echoes -= refrainCost();
    s.refrain++;
    dirty = true;
    rebuild();
    emit('score', REFRAIN);
    return true;
  }

  /* Choir: Voices, from the Echoes earned since you last joined. The Choir stays open
   * once it has been joined, Score or not. */
  function choirOpen() {
    return f.choir || s.choirs > 0;
  }

  function voiceGain() {
    if (!choirOpen()) return 0;
    return Math.min(1e300, Math.floor(Math.sqrt(s.echoesEarned / BAL.voiceReq) * f.voiceMult + EPS));
  }

  function canChoir() {
    return voiceGain() >= 1;
  }

  /* Keeps the Score's first `measures` measures and clears the rest. */
  function keepMeasures(measures) {
    const kept = {};
    for (const n of SCORE) if (s.score[n.id] && n.m < measures) kept[n.id] = true;
    s.score = kept;
    s.refrain = 0;
  }

  function joinChoir(chord) {
    if (!canChoir()) return false;
    const gain = voiceGain();
    s.voices += gain;
    s.voicesEarned += gain;
    s.stats.voices += gain;
    s.choirs++;
    s.chord = CHORD_BY_ID[chord] ? chord : s.chord || 'major';
    s.stats.chordsSung[s.chord] = true;
    keepMeasures(f.keepScore);
    s.echoes = 0;
    s.echoesEarned = 0;
    s.encoresHere = 0;
    firstMovementReset();
    tell('firstChoir');
    checkDeeds();
    emit('choir', { gain });
    return true;
  }

  function buyHymn(id) {
    const h = HYMN_BY_ID[id];
    if (!h || s.hymnal[id] || s.voices < h.cost) return false;
    s.voices -= h.cost;
    s.hymnal[id] = true;
    dirty = true;
    rebuild();
    checkDeeds();
    emit('hymn', h);
    return true;
  }

  /* Rebirth: Resonance, from the Voices earned since the last Rebirth. */
  function rebirthOpen() {
    return f.rebirth || s.rebirths > 0;
  }

  function resonanceGain() {
    if (!rebirthOpen() || s.voicesEarned < 1) return 0;
    // Grows with the number of digits, so Resonance never runs away with the Light it feeds
    const x = Math.log10(s.voicesEarned) - BAL.resLog;
    return x > 0 ? Math.floor(x * x + EPS) : 0;
  }

  function canRebirth() {
    return resonanceGain() >= 1;
  }

  function rebirth() {
    if (!canRebirth()) return false;
    const gain = resonanceGain();
    s.resonance += gain;
    s.resonanceTotal += gain;
    s.rebirths++;
    // The Laws decide what of the Hymnal and the Score survives
    const hymns = {};
    for (const h of HYMNAL.slice(0, f.lawHymns)) if (s.hymnal[h.id]) hymns[h.id] = true;
    s.hymnal = hymns;
    s.voices = 0;
    s.voicesEarned = 0;
    s.chord = null;
    keepMeasures(f.lawScore);
    s.echoes = 0;
    s.echoesEarned = 0;
    s.encoresHere = 0;
    firstMovementReset();
    tell('firstRebirth');
    checkDeeds();
    emit('rebirth', { gain });
    return true;
  }

  function buyLaw(id) {
    const l = LAW_BY_ID[id];
    if (!l || s.laws[id] || s.resonance < l.cost) return false;
    s.resonance -= l.cost;
    s.laws[id] = true;
    dirty = true;
    rebuild();
    emit('law', l);
    return true;
  }

  /* The true ending. */
  function canFirstNote() {
    return !s.trueEnd && f.firstNote && s.runLight >= TRUE_REQ;
  }

  function singFirstNote() {
    if (!canFirstNote()) return false;
    s.trueEnd = true;
    tell('trueEnd');
    checkDeeds();
    emit('trueEnd');
    return true;
  }

  /* Next goal text for the HUD */
  function nextGoal() {
    if (s.trial) {
      const t = TRIAL_BY_ID[s.trial];
      return { text: t.name + ': reach ' + fmt(t.goal) + ' Light', target: t.goal, have: s.runLight };
    }
    for (let i = 0; i < 8; i++) {
      if (s.planets[i] === 0 && !planetLocked(i)) {
        const c = levelCost(i, 0, 1);
        if (s.runLight >= c - 3.5 || i === 0 || s.planets[i - 1] > 0) {
          return { text: 'Next planet: ' + PLANETS[i].name, target: c, have: s.light };
        }
      }
    }
    if (s.stage < STAGES.length - 1) {
      const st = STAGES[s.stage + 1];
      return { text: 'Next star: ' + st.name, target: st.req, have: s.runLight };
    }
    if (f.firstNote && !s.trueEnd && !canFirstNote()) return { text: 'The First Note: reach ' + fmt(TRUE_REQ) + ' Light', target: TRUE_REQ, have: s.runLight };
    if (s.ended && f.finalSong && !canEncore()) return { text: 'Encore: reach ' + fmt(encoreReq()) + ' Light', target: encoreReq(), have: s.runLight };
    if (!canCollapse() && s.supernovas >= 5 && !(s.ended && f.finalSong)) return { text: 'Collapse the star', target: collapseReq(), have: s.runLight };
    return null;
  }

  /* Saving */
  function deepMerge(base, saved) {
    for (const k in saved) {
      const v = saved[k];
      if (v && typeof v === 'object' && !Array.isArray(v) && base[k] && typeof base[k] === 'object') deepMerge(base[k], v);
      else base[k] = v;
    }
    return base;
  }

  function serialize() {
    s.lastSeen = Date.now();
    const clean = JSON.stringify(s, (k, v) => (v === Infinity ? 1e308 : v));
    return btoa(unescape(encodeURIComponent(clean)));
  }

  function deserialize(text) {
    const obj = JSON.parse(decodeURIComponent(escape(atob(text.trim()))));
    if (!obj || typeof obj !== 'object' || !Array.isArray(obj.planets)) throw new Error('Not a Starsong save');
    return deepMerge(newState(), obj);
  }

  /* Cloud saves carry progress only. Settings belong to the device, and moment to moment
   * things like Harmony simply start fresh when a save moves between devices. */
  function toCloud() {
    const { settings, v, beat, harmony, fullHold, streak, lastTapBeat, sinceTap, cresc, aurora, auroraMult, cometIn, ...keep } = s;
    keep.lastSeen = Date.now();
    return JSON.parse(JSON.stringify(keep, (k, x) => (x === Infinity ? 1e308 : x)));
  }

  function fromCloud(data) {
    const state = deepMerge(newState(), data);
    state.settings = s.settings;
    return state;
  }

  function load(state) {
    s = state || newState();
    NumFormat.mode = s.settings.notation;
    comet = null;
    showerLeft = 0;
    planetTimer = Infinity;
    dirty = true;
    rebuild();
  }

  /* Pays out time away and returns a report, or null if the gap was short. */
  function applyOffline(now) {
    if (dirty) rebuild();
    const away = (now - s.lastSeen) / 1000;
    if (away < 60) return null;
    const secs = Math.min(away, f.offlineCap);
    let gain = ZERO;
    if (d.baseLps > ZERO / 2) {
      gain = d.baseLps + lg(secs) + lg(f.offlineEff);
      addLight(gain);
    }
    checkStage();
    return { away, secs, gain, eff: f.offlineEff, capped: away > f.offlineCap };
  }

  /* Pays an offline report's Light a second time, for a rewarded ad. */
  function grantOffline(report) {
    if (!report || report.doubled || !(report.gain > ZERO / 2)) return false;
    report.doubled = true;
    addLight(report.gain);
    checkStage();
    return true;
  }

  /* Sets a settings value and applies any side effects. */
  function setSetting(key, value) {
    s.settings[key] = value;
    if (key === 'notation') NumFormat.mode = value;
  }

  return {
    on, emit, tick, tap, applyTap, load, newState, serialize, deserialize, toCloud, fromCloud, applyOffline, grantOffline, setSetting,
    buyPlanet, levelCost, maxAffordable, buyQuantity, nextMilestoneGap, planetLocked, growth,
    tuningVisible, tuningCost, buyTuning, autoTarget, autoWait,
    crescendoReady, startCrescendo, harmonyMult, dynLog, tapWindows, currentBps,
    catchComet, canSupernova, novaWait, stardustGain, supernova,
    nodeAvailable, nodeMaxed, buyNode, enterTrial, leaveTrial,
    canCollapse, collapseReq, voidGain, collapse, buySky, canSing, sing, nextGoal,
    encoreReq, canEncore, echoGain, encore, scoreAvailable, buyScore, refrainCost, refrainOpen, buyRefrain,
    voiceGain, canChoir, joinChoir, buyHymn, resonanceGain, canRebirth, rebirth, buyLaw, canFirstNote, singFirstNote,
    get s() { return s; },
    get f() { return f; },
    get d() { return d; },
    get comet() { return comet; },
    stardustBonusLog, voidBonusLog, echoBonusLog, voiceBonusLog, resonanceBonusLog, choirOpen, rebirthOpen,
    markDirty() { dirty = true; },
    rebuild,
    tell,
  };
})();

/* Starsong: the music engine. Nothing here is a recording. The planets play the song
 * in real time, so a bigger economy literally sounds bigger. */

const Sound = (() => {
  let ctx = null, master = null, musicBus = null, sfxBus = null;
  let padFilter = null, padBus = null, verbSend = null, delaySend = null;
  let running = false;

  const ROOT = 220; // A3

  const SCALES = {
    pentMinor: [0, 3, 5, 7, 10],
    pentMajor: [0, 2, 4, 7, 9],
    dorian: [0, 2, 3, 5, 7, 9, 10],
    lydian: [0, 2, 4, 6, 7, 9, 11],
    hirajoshi: [0, 2, 3, 7, 8],
  };

  // Four chords per scale, as semitones from the root
  const PROGRESSIONS = {
    pentMinor: [[0, 7, 12, 15], [-4, 3, 8, 12], [3, 10, 15, 19], [-2, 5, 10, 14]],
    pentMajor: [[0, 7, 12, 16], [-3, 4, 9, 12], [5, 9, 12, 17], [7, 11, 14, 19]],
    dorian: [[0, 7, 10, 15], [5, 9, 12, 17], [-2, 5, 10, 14], [0, 7, 12, 15]],
    lydian: [[0, 7, 12, 16], [2, 9, 14, 18], [7, 11, 14, 19], [-1, 6, 11, 14]],
    hirajoshi: [[0, 7, 12, 15], [-4, 3, 8, 12], [2, 7, 14, 15], [0, 8, 12, 15]],
  };

  // Melody fragments as scale steps. Each planet walks its own pattern, one step per orbit.
  const PATTERNS = [
    [0, 2, 4, 2, 5, 4, 2, 1],
    [2, 1, 3, 2, 4, 3],
    [0, 2, 1, 3],
    [4, 2, 3, 0, 2, 1],
    [0, 1, 2, 4],
    [2, 0, 3, 1],
    [0, 2, 0, 3],
    [0, 0, 2, 1],
  ];
  const OCTAVES = [2, 2, 1, 1, 1, 0, 0, -1];

  // ratio: FM modulator ratio. index: brightness. decay: seconds.
  const VOICES = [
    { ratio: 3.51, index: 2.4, decay: 0.9, gain: 0.16, wave: 'sine' },
    { ratio: 2.76, index: 1.8, decay: 1.1, gain: 0.16, wave: 'sine' },
    { ratio: 2.0, index: 1.4, decay: 0.8, gain: 0.2, wave: 'sine' },
    { ratio: 4.0, index: 0.8, decay: 1.3, gain: 0.2, wave: 'sine' },
    { ratio: 1.0, index: 1.2, decay: 1.6, gain: 0.2, wave: 'triangle' },
    { ratio: 2.0, index: 0.9, decay: 2.0, gain: 0.22, wave: 'triangle' },
    { ratio: 3.0, index: 1.5, decay: 2.6, gain: 0.2, wave: 'sine' },
    { ratio: 1.0, index: 0.6, decay: 3.2, gain: 0.34, wave: 'sine' },
  ];

  const orbitCount = [0, 0, 0, 0, 0, 0, 0, 0];
  let scaleName = 'pentMinor';
  let chordIndex = 0;
  let padVoices = [];
  let padBaseCut = 500;

  function impulse(seconds, decay) {
    const rate = ctx.sampleRate;
    const len = Math.floor(rate * seconds);
    const buf = ctx.createBuffer(2, len, rate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

  /* Must be called from a user gesture, or browsers will keep audio muted. */
  function start(settings) {
    if (running) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createDynamicsCompressor();
    master.threshold.value = -14; master.ratio.value = 5; master.attack.value = 0.005; master.release.value = 0.25;
    master.connect(ctx.destination);

    musicBus = ctx.createGain();
    sfxBus = ctx.createGain();
    musicBus.connect(master);
    sfxBus.connect(master);

    const verb = ctx.createConvolver();
    verb.buffer = impulse(3.4, 2.6);
    verbSend = ctx.createGain();
    verbSend.gain.value = 0.55;
    verbSend.connect(verb);
    verb.connect(musicBus);

    const delay = ctx.createDelay(1.5);
    delay.delayTime.value = 0.42;
    const fb = ctx.createGain();
    fb.gain.value = 0.34;
    delaySend = ctx.createGain();
    delaySend.gain.value = 0.22;
    delaySend.connect(delay);
    delay.connect(fb);
    fb.connect(delay);
    delay.connect(verbSend);
    delay.connect(musicBus);

    padFilter = ctx.createBiquadFilter();
    padFilter.type = 'lowpass';
    padFilter.frequency.value = padBaseCut;
    padFilter.Q.value = 0.8;
    padBus = ctx.createGain();
    padBus.gain.value = 0.5;
    padFilter.connect(padBus);
    padBus.connect(musicBus);
    padBus.connect(verbSend);

    running = true;
    const off = settings.muted || Platform.silenced;   // the host page can ask for silence too
    setVolumes(off ? 0 : settings.music, off ? 0 : settings.sfx);
    playChord(0, 12);
  }

  function setVolumes(music, sfx) {
    if (!running) return;
    musicBus.gain.setTargetAtTime(music * 0.9, ctx.currentTime, 0.05);
    sfxBus.gain.setTargetAtTime(sfx * 0.9, ctx.currentTime, 0.05);
  }

  function freq(semis) {
    return ROOT * Math.pow(2, semis / 12);
  }

  function degreeToSemis(step) {
    const sc = SCALES[scaleName];
    const n = sc.length;
    const oct = Math.floor(step / n);
    return sc[((step % n) + n) % n] + oct * 12;
  }

  function when(late) {
    return ctx.currentTime + 0.035 - Math.min(late || 0, 0.03);
  }

  /* Two operator FM voice. Cheap, bell-like, and it never sounds out of place. */
  function fm(frequency, t, voice, velocity, bus) {
    const car = ctx.createOscillator();
    const mod = ctx.createOscillator();
    const modGain = ctx.createGain();
    const env = ctx.createGain();
    car.type = voice.wave;
    // High notes times a big ratio can pass what audio can carry. Above about 18 kHz
    // nothing is audible anyway, and the browser would only warn about it.
    car.frequency.value = Math.min(frequency, 16000);
    mod.frequency.value = Math.min(frequency * voice.ratio, 18000);
    modGain.gain.setValueAtTime(frequency * voice.index * velocity, t);
    modGain.gain.exponentialRampToValueAtTime(Math.max(0.01, frequency * 0.02), t + voice.decay * 0.6);
    env.gain.setValueAtTime(0.0001, t);
    env.gain.exponentialRampToValueAtTime(voice.gain * velocity, t + 0.006);
    env.gain.exponentialRampToValueAtTime(0.0001, t + voice.decay);
    mod.connect(modGain);
    modGain.connect(car.frequency);
    car.connect(env);
    env.connect(bus);
    env.connect(verbSend);
    env.connect(delaySend);
    car.start(t); mod.start(t);
    car.stop(t + voice.decay + 0.05); mod.stop(t + voice.decay + 0.05);
  }

  function pulse(who, late, conj) {
    if (!running) return;
    const t = when(late);
    const dense = who.length > 3 ? 3 / who.length + 0.15 : 1;
    who.forEach((i) => {
      const pat = PATTERNS[i];
      const step = pat[orbitCount[i] % pat.length];
      orbitCount[i]++;
      const semis = degreeToSemis(step) + OCTAVES[i] * 12;
      fm(freq(semis), t, VOICES[i], (0.72 + Math.random() * 0.2) * dense, musicBus);
    });
    if (conj >= 3) shimmer(t, conj);
  }

  function shimmer(t, n) {
    const steps = Math.min(n + 1, 6);
    for (let k = 0; k < steps; k++) {
      fm(freq(degreeToSemis(k * 2) + 36), t + k * 0.055, { ratio: 5.01, index: 1, decay: 0.7, gain: 0.05, wave: 'sine' }, 0.8, musicBus);
    }
  }

  function playChord(index, seconds) {
    if (!running) return;
    const prog = PROGRESSIONS[scaleName];
    const chord = prog[index % prog.length];
    const t = ctx.currentTime;
    for (const v of padVoices) {
      v.gain.gain.cancelScheduledValues(t);
      v.gain.gain.setTargetAtTime(0.0001, t, 0.8);
      v.osc.stop(t + 4);
    }
    padVoices = [];
    chord.forEach((semi, k) => {
      for (const detune of [-5, 6]) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = k === 0 ? 'triangle' : 'sawtooth';
        osc.frequency.value = freq(semi - 12);
        osc.detune.value = detune;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.setTargetAtTime(k === 0 ? 0.11 : 0.045, t, 1.1);
        osc.connect(gain);
        gain.connect(padFilter);
        osc.start(t);
        osc.stop(t + seconds + 8);
        padVoices.push({ osc, gain });
      }
    });
  }

  function beat(b, bps, late, harmonyLevel, crescendo) {
    if (!running) return;
    if (b % 16 === 0) { chordIndex++; playChord(chordIndex, 16 / bps + 2); }
    const t = when(late);
    if (harmonyLevel > 0.3 && b % 2 === 0) kick(t, 0.2 + harmonyLevel * 0.3);
    if (crescendo) { tick(t, 0.09); if (b % 2 === 1) tick(t + 0.5 / bps, 0.06); }
    const cut = padBaseCut + harmonyLevel * 1600 + (crescendo ? 1800 : 0);
    padFilter.frequency.setTargetAtTime(cut, ctx.currentTime, 0.4);
  }

  function kick(t, level) {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.frequency.setValueAtTime(95, t);
    o.frequency.exponentialRampToValueAtTime(38, t + 0.14);
    g.gain.setValueAtTime(level * 0.5, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(musicBus);
    o.start(t); o.stop(t + 0.25);
  }

  function noiseBuffer(seconds) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  function tick(t, level) {
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer(0.05);
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 7000;
    const g = ctx.createGain();
    g.gain.setValueAtTime(level, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    src.connect(hp); hp.connect(g); g.connect(musicBus);
    src.start(t);
  }

  function tap(quality) {
    if (!running) return;
    const t = ctx.currentTime + 0.002;
    const voice = { ratio: 2.0, index: quality === 2 ? 1.6 : 0.7, decay: quality === 2 ? 0.5 : 0.3, gain: quality ? 0.14 : 0.05, wave: 'sine' };
    const semis = quality === 0 ? 24 : degreeToSemis(quality === 2 ? 7 : 5) + 12;
    fm(freq(semis), t, voice, 0.8, sfxBus);
  }

  function buy(i, first) {
    if (!running) return;
    const t = ctx.currentTime + 0.002;
    const semis = degreeToSemis(i % 5) + OCTAVES[i] * 12;
    fm(freq(semis), t, VOICES[i], 0.5, sfxBus);
    if (first) fm(freq(semis + 7), t + 0.1, VOICES[i], 0.6, sfxBus);
  }

  function chime(steps, gap, level) {
    if (!running) return;
    const t = ctx.currentTime + 0.01;
    steps.forEach((s, k) => {
      fm(freq(degreeToSemis(s) + 24), t + k * gap, { ratio: 3.51, index: 1.4, decay: 1.5, gain: 0.16, wave: 'sine' }, level || 0.8, sfxBus);
    });
  }

  function whoosh(seconds, from, to, level) {
    if (!running) return;
    const t = ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer(seconds);
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.Q.value = 0.9;
    bp.frequency.setValueAtTime(from, t);
    bp.frequency.exponentialRampToValueAtTime(to, t + seconds);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(level, t + seconds * 0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t + seconds);
    src.connect(bp); bp.connect(g); g.connect(sfxBus); g.connect(verbSend);
    src.start(t);
  }

  function boom() {
    if (!running) return;
    const t = ctx.currentTime;
    whoosh(5, 3000, 60, 0.9);
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.frequency.setValueAtTime(120, t);
    o.frequency.exponentialRampToValueAtTime(24, t + 2.4);
    g.gain.setValueAtTime(0.9, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 3.6);
    o.connect(g); g.connect(sfxBus); g.connect(verbSend);
    o.start(t); o.stop(t + 3.8);
  }

  function setScale(name) {
    scaleName = SCALES[name] ? name : 'pentMinor';
    orbitCount.fill(0);
    if (running) playChord(chordIndex, 12);
  }

  function setStage(stage) {
    padBaseCut = 380 + stage * 150;
  }

  return {
    start, setVolumes, pulse, beat, tap, buy, chime, whoosh, boom, setScale, setStage,
    get running() { return running; },
  };
})();

/* Starsong: everything you see in the sky.
 *
 * Two stacked canvases:
 *   #gl  WebGL. Nebula, background stars, the living star, the black hole, shockwaves.
 *   #fx  2D.    Orbits, planets, moons, particles, comets, tap feedback.
 * If WebGL is missing, the 2D layer paints a simpler star and the game still works.
 */

const Render = (() => {
  const TAU = Math.PI * 2;
  const TILT = 0.6;          // orbits are viewed at an angle, so they appear as ellipses
  const ORBIT_UNIT = 74;     // world units for an orbit of 1.0
  const reducedMotion = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;

  let glCanvas, fxCanvas, gl = null, ctx;
  let W = 0, H = 0, DPR = 1, glScale = 1;
  const insets = { l: 0, r: 0, t: 0, b: 0 };
  const view = { cx: 0, cy: 0, zoom: 2, tcx: 0, tcy: 0, tzoom: 2 };
  let time = 0, frameNo = 0;

  /* ---------- Shaders ---------- */
  const VS = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';

  const NOISE = `
  float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
  float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
    return mix(mix(h21(i),h21(i+vec2(1.,0.)),f.x),mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),f.x),f.y);}
  float fbm(vec2 p){float a=.5,s=0.;mat2 m=mat2(1.6,1.2,-1.2,1.6);
    for(int i=0;i<4;i++){s+=a*vn(p);p=m*p;a*=.5;}return s;}
  `;

  /* Rendered small and rarely: drifting gas clouds. They start invisible and fill in as you progress. */
  const FS_BG = `precision highp float;
  uniform vec2 u_res;uniform float u_t,u_neb;uniform vec3 u_c1,u_c2,u_c3;
  ${NOISE}
  void main(){
    vec2 uv=(gl_FragCoord.xy-.5*u_res)/u_res.y;
    vec2 q=uv*1.5;float t=u_t*.012;
    float n1=fbm(q+vec2(t,-t*.6));
    float n2=fbm(q*1.7+n1*1.5+vec2(-t*.7,t));
    float n3=fbm(q*3.2+n2*1.3+3.7);
    float cloud=smoothstep(.34,.8,n2);
    vec3 col=mix(u_c1,u_c2,smoothstep(.3,.7,n1))*cloud;
    col+=u_c3*pow(n3,2.6)*cloud*1.9;
    col*=.45+.75*smoothstep(.28,.66,n3);
    vec3 base=vec3(.008,.009,.024)+vec3(.012,.008,.03)*(1.-length(uv));
    gl_FragColor=vec4(base+col*u_neb,1.);
  }`;

  const FS_MAIN = `precision highp float;
  uniform sampler2D u_bg;
  uniform vec2 u_res,u_c;
  uniform float u_r,u_t,u_pulse,u_bh,u_flash,u_shockR,u_shockA,u_stars,u_cresc,u_scale;
  uniform vec3 u_core,u_edge;
  ${NOISE}
  vec3 field(vec2 frag){
    vec3 c=vec3(0.);
    for(int L=0;L<3;L++){
      float fl=float(L);
      float sz=(92.-fl*26.)*u_scale;
      vec2 g=frag/sz+fl*17.3;
      vec2 id=floor(g);vec2 f=fract(g)-.5;
      float h=h21(id+fl*7.1);
      if(h<u_stars*(.42+fl*.2)){
        vec2 o=vec2(h21(id+3.1),h21(id+9.7))-.5;
        float d=length(f-o*.8)*sz/u_scale;
        float tw=.72+.28*sin(u_t*(.8+h*3.)+h*40.);
        float rad=1.5-fl*.38;
        float b=exp(-d*d/(rad*rad));
        vec3 tint=mix(vec3(.72,.82,1.),vec3(1.,.84,.68),h21(id+1.7));
        c+=tint*b*tw*(.45+h*.9);
      }
    }
    return c;
  }
  vec3 star(vec2 frag){
    vec2 p=(frag-u_c)/u_r;float d=length(p);float t=u_t;
    vec3 col=vec3(0.);
    if(d<1.03){
      float z=sqrt(max(0.,1.-d*d));
      vec2 s=p/(1.+z)*2.3;
      float w=fbm(s*2.+vec2(t*.05,-t*.03));
      float g=fbm(s*3.+w*1.7+vec2(-t*.08,t*.05));
      float gr=fbm(s*9.+g*2.2+t*.14);

      surf=mix(u_edge*.6,surf,limb);

      col+=surf*smoothstep(1.03,.98,d)*.95;

    float dd=max(d-1.,0.);
    float halo=.13/(1.+dd*dd*4.5);
    float wide=.026/(1.+dd*.55);
    float outside=smoothstep(.96,1.04,d);
    float cor=0.;

      float a=atan(p.y,p.x);
      vec2 dir=vec2(cos(a),sin(a));
      float rays=fbm(dir*2.2+vec2(d*.9-t*.2,t*.05));
      rays+=.55*fbm(dir*5.+vec2(d*2.4-t*.42,-t*.08));
      cor=exp(-dd*3.4)*(.34+.95*rays);
    }
    col+=outside*(u_edge*cor*(1.+u_pulse*.9)+mix(u_edge,u_core,.35)*halo*(1.+u_pulse*1.2)+u_edge*wide);
    return col;
  }
  vec3 hole(vec2 frag,out float shadow){
    vec2 p=(frag-u_c)/u_r;float d=length(p);float t=u_t;
    vec2 q=vec2(p.x,p.y/.3);
    float rd=length(q);float ang=atan(q.y,q.x);
    vec2 dir=vec2(cos(ang-t*.55),sin(ang-t*.55));
    float sw=fbm(dir*2.5+vec2(rd*1.7,0.));
    sw=mix(sw,fbm(dir*6.+vec2(rd*4.,3.)),.4);
    float disk=smoothstep(1.25,1.75,rd)*smoothstep(5.2,2.1,rd);
    float dop=1.+.8*cos(ang+.5);
    vec3 hot=mix(vec3(1.,.42,.14),vec3(1.,.93,.82),smoothstep(.3,.75,sw));
    vec3 dcol=hot*disk*(.25+sw*1.6)*dop;
    float pa=atan(p.y,p.x);
    float arc=exp(-pow((d-1.34)/.17,2.))*(.75+.55*sin(pa+1.1));
    float ring=exp(-pow((d-1.06)/.045,2.))*1.8;
    shadow=smoothstep(.98,1.08,d);
    float front=p.y<0.?1.:shadow;
    return dcol*front+(arc*hot+ring*vec3(1.,.88,.72))*shadow;
  }
  void main(){
    vec2 frag=gl_FragCoord.xy;vec2 uv=frag/u_res;
    vec3 col=texture2D(u_bg,uv).rgb;
    col+=field(frag);
    vec3 s=star(frag)*(1.-u_bh);
    col+=s;
    if(u_bh>.002){
      float sh;vec3 hc=hole(frag,sh);
      col*=mix(1.,sh,u_bh);
      col+=hc*u_bh;
    }
    float dist=length(frag-u_c);
    if(u_shockA>.001){
      float w=26.*u_scale+u_shockR*.11;
      float sk=exp(-pow((dist-u_shockR)/w,2.))*u_shockA;

    }
    if(u_cresc>.001){
      float a=atan(frag.y-u_c.y,frag.x-u_c.x);
      vec2 dir=vec2(cos(a),sin(a));
      float rr=fbm(dir*3.+vec2(u_t*.3,-dist/(u_res.y*.5)+u_t*.9));

    col=1.-exp(-col*1.3);
    col=mix(col,vec3(1.,.97,.93),u_flash);
    gl_FragColor=vec4(col,1.);
  }`;

  let progBg, progMain, uBg = {}, uMain = {}, fbo, fboTex, bgW = 512, bgH = 288, bgDirty = true, vbuf;

  function compile(vs, fs) {

      gl.compileShader(sh);

  function uniforms(p, names) {

      gl = null;
