<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abyssal Dredging</title>
    <style>
        /* === FONTS & RESET === */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Share+Tech+Mono&family=Teko:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        :root {
            --bg-deep: #010306;
            --bg-mid: #050a10;
            --bg-rust: #38241b;
            --bg-rust-dark: #120c0a;
            
            --text-main: #d1c5b4;
            --text-dim: #7a7065;
            --text-alert: #d95129;
            --text-dev: #3bc453;
            
            --panel-border: #3b2e26;
            --panel-bg: linear-gradient(135deg, #14100e 0%, #0a0807 100%);
            --button-rust: linear-gradient(to bottom, #7a3214, #361405);
            --button-rust-hover: linear-gradient(to bottom, #943d1a, #4a1c09);
            
            --rarity-common: #8c929c;
            --rarity-uncommon: #4b8f51;
            --rarity-rare: #3b74b8;
            --rarity-epic: #8a3bb8;
            --rarity-legendary: #d69f36;
            --rarity-mythic: #d63636;
            --rarity-eldritch: #27c4b5;
            --rarity-unfathomable: #ffffff;
            --rarity-absolute: #ff0055; /* The Ultimate Tier */
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Teko', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: filter 0.5s ease, background-color 0.5s ease;
        }

        /* Wraps rig-section + control-panel only, so it can carry the grayscale "corruption" filter during
           cutscenes without dragging #corrupted-overlay (a fixed-position sibling) down with it. Takes over
           the column flex layout body used to provide directly to those two sections. */
        #game-ui {
            display: flex; flex-direction: column; flex: 1; min-height: 0; width: 100%;
            transition: filter 0.5s ease, background-color 0.5s ease;
        }

        /* === INITIAL BOOT SCREEN (To Unlock Audio Context) === */
        #boot-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: opacity 1s ease;
        }
        #boot-text {
            font-family: 'Share Tech Mono', monospace; font-size: 1.5rem;
            color: var(--text-alert); text-transform: uppercase; letter-spacing: 4px;
            animation: pulseGlow 1.5s infinite alternate;
        }
        @keyframes pulseGlow { 0% { opacity: 0.4; } 100% { opacity: 1; text-shadow: 0 0 10px var(--text-alert); } }

        /* === STORM ALERT OVERLAY === */
        #storm-alert {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            font-family: 'Share Tech Mono', monospace; font-size: 1.2rem;
            color: #fff; text-shadow: 0 0 10px #00aaff, 0 0 20px #00aaff;
            background: rgba(0, 30, 50, 0.8); border: 1px solid #00aaff;
            padding: 5px 15px; border-radius: 4px; pointer-events: none;
            opacity: 0; z-index: 10; transition: opacity 0.5s ease;
        }
        #storm-alert.active {
            opacity: 1; animation: stormAlertPulse 1.5s infinite alternate;
        }
        @keyframes stormAlertPulse { 
            0% { box-shadow: 0 0 5px #00aaff; opacity: 0.8; } 
            100% { box-shadow: 0 0 20px #00aaff, inset 0 0 10px #00aaff; opacity: 1; text-shadow: 0 0 20px #00aaff, 0 0 40px #fff; } 
        }

        /* === ITEM-SPECIFIC CUSTOM CUTSCENES === */
        #corrupted-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; pointer-events: none; opacity: 0; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.5s ease; overflow: hidden; perspective: 1000px; 
        }

        #corrupted-overlay.active { opacity: 1; pointer-events: all; cursor: none; }
        #corrupted-shapes { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 1; }
        #corrupted-text { position: relative; z-index: 3; font-family: 'Cinzel Decorative', serif; font-size: 4.5rem; color: transparent; text-align: center; padding: 0 20px; }

        /* Universal cutscene polish layer: scanlines + breathing, rarity-tinted vignette (applies under every item-specific theme) */
        #corrupted-overlay.active { animation: cutsceneVignettePulse 4s ease-in-out infinite; }
        @keyframes cutsceneVignettePulse {
            0%, 100% { box-shadow: inset 0 0 160px 50px rgba(0,0,0,0.65), inset 0 0 110px 25px rgba(0,0,0,0.3); }
            50% { box-shadow: inset 0 0 230px 70px rgba(0,0,0,0.82), inset 0 0 110px 25px rgba(0,0,0,0.3); }
        }
        @supports (color: color-mix(in srgb, red, blue)) {
            @keyframes cutsceneVignettePulse {
                0%, 100% { box-shadow: inset 0 0 160px 50px rgba(0,0,0,0.65), inset 0 0 130px 30px color-mix(in srgb, var(--cutscene-tint, #000) 22%, transparent); }
                50% { box-shadow: inset 0 0 230px 70px rgba(0,0,0,0.82), inset 0 0 130px 30px color-mix(in srgb, var(--cutscene-tint, #000) 34%, transparent); }
            }
        }
        #corrupted-overlay.active::before {
            content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(255,255,255,0.045) 0px, rgba(255,255,255,0.045) 1px, transparent 1px, transparent 3px);
            mix-blend-mode: overlay; opacity: 0.45;
        }

        /* Particle layer: per-item drifting/swirling/bursting motes drawn on a canvas above the CSS backgrounds */
        #cutscene-particle-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        /* Radiating light rays behind the text, tinted to the item's rarity — gives every reveal a "burst of power" backdrop */
        #corrupted-rays {
            position: absolute; top: 50%; left: 50%; width: 145vmax; height: 145vmax;
            transform: translate(-50%, -50%) rotate(0deg); z-index: 2; pointer-events: none; opacity: 0;
            mix-blend-mode: screen; background: none;
        }
        #corrupted-overlay.active #corrupted-rays { animation: raysAppear 1.4s ease-out forwards 0.05s, raysSpin 45s linear infinite; }
        @supports (color: color-mix(in srgb, red, blue)) {
            #corrupted-rays {
                background: repeating-conic-gradient(from 0deg, transparent 0deg, color-mix(in srgb, var(--cutscene-tint, #fff) 45%, transparent) 3deg, transparent 10deg, transparent 26deg);
            }
        }
        @keyframes raysAppear { from { opacity: 0; } to { opacity: 0.6; } }
        @keyframes raysSpin { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        /* Flash burst on cutscene reveal: a hot white core immediately followed by a rarity-colored wash
           (skipped for The Depth Itself, which has its own choreographed bang) */
        #corrupted-flash {
            position: absolute; inset: 0; z-index: 6; pointer-events: none; opacity: 0; mix-blend-mode: screen;
            background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.35) 28%, transparent 65%);
        }
        #corrupted-flash.burst { animation: cutsceneFlashBurst 0.9s ease-out forwards; }
        @keyframes cutsceneFlashBurst {
            0% { opacity: 0; transform: scale(0.3); }
            12% { opacity: 1; transform: scale(1.4); }
            100% { opacity: 0; transform: scale(2.8); }
        }
        #corrupted-flash-tint {
            position: absolute; inset: 0; z-index: 5; pointer-events: none; opacity: 0; mix-blend-mode: screen;
        }
        @supports (color: color-mix(in srgb, red, blue)) {
            #corrupted-flash-tint {
                background: radial-gradient(circle, color-mix(in srgb, var(--cutscene-tint, #fff) 75%, white) 0%, color-mix(in srgb, var(--cutscene-tint, #fff) 45%, transparent) 32%, transparent 70%);
            }
        }
        #corrupted-flash-tint.burst { animation: cutsceneTintBurst 1.3s ease-out forwards; }
        @keyframes cutsceneTintBurst {
            0% { opacity: 0; transform: scale(0.4); }
            25% { opacity: 0.85; transform: scale(1.3); }
            100% { opacity: 0; transform: scale(2.3); }
        }

        /* Rarity tier badge — a bold "MYTHIC" / "ABSOLUTE" callout above the emblem, gacha-reveal style */
        #corrupted-tier-badge {
            position: absolute; top: 9%; left: 50%; z-index: 4; pointer-events: none; opacity: 0;
            font-family: 'Share Tech Mono', monospace; font-weight: bold; letter-spacing: 6px; font-size: 1.05rem;
            text-transform: uppercase; padding: 6px 22px; border-radius: 3px; border: 1px solid currentColor;
            background: rgba(0,0,0,0.45); box-shadow: 0 0 20px currentColor, inset 0 0 12px currentColor;
            transform: translate(-50%, -50%) scale(0.4);
        }
        #corrupted-tier-badge:empty { display: none; }
        #corrupted-overlay.active #corrupted-tier-badge { animation: tierBadgeIn 0.9s cubic-bezier(0.2, 0.9, 0.25, 1.3) forwards 0.15s; }
        @keyframes tierBadgeIn {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4) translateY(8px); }
            70% { opacity: 1; transform: translate(-50%, -50%) scale(1.18) translateY(0); }
            100% { opacity: 0.95; transform: translate(-50%, -50%) scale(1) translateY(0); }
        }

        /* Rune emblem: a spinning sigil-ring with a glyph unique to the item, floating above the main text */
        #corrupted-emblem {
            position: absolute; top: 22%; left: 50%; width: 150px; height: 150px; z-index: 3;
            pointer-events: none; opacity: 0; transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 14px currentColor);
        }
        #corrupted-emblem:empty { display: none; }
        #corrupted-emblem svg {
            width: 100%; height: 100%; overflow: visible;
            animation: emblemAppear 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards, emblemFloat 4.5s ease-in-out infinite 1.5s;
        }
        @keyframes emblemAppear {
            0% { opacity: 0; transform: scale(0.35) rotate(-30deg); }
            65% { opacity: 1; transform: scale(1.1) rotate(5deg); }
            100% { opacity: 0.92; transform: scale(1) rotate(0deg); }
        }
        @keyframes emblemFloat {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.03) translateY(-7px); }
        }
        .emblem-ring-outer, .emblem-ring-inner { fill: none; stroke: currentColor; stroke-width: 1; transform-origin: 60px 60px; }
        .emblem-ring-outer { opacity: 0.55; animation: emblemRingSpin 34s linear infinite; }
        .emblem-ring-inner { opacity: 0.32; animation: emblemRingSpin 24s linear infinite reverse; }
        @keyframes emblemRingSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .emblem-ticks line { stroke: currentColor; stroke-width: 1.4; opacity: 0.5; }
        .emblem-glyph { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }

        /* Glowing divider lines flanking the main cutscene text, colored to match whatever rarity/text color is active */
        #corrupted-text::before, #corrupted-text::after {
            content: ''; position: absolute; left: 50%; width: 130px; height: 2px;
            background: currentColor; opacity: 0.55; transform: translateX(-50%);
            box-shadow: 0 0 14px currentColor;
        }
        #corrupted-text::before { top: -20px; }
        #corrupted-text::after { bottom: -20px; }

        /* Odds subtitle shown under the main cutscene text */
        #corrupted-subtext {
            position: absolute; bottom: 13%; left: 0; right: 0; text-align: center; z-index: 5; pointer-events: none;
            font-family: 'Share Tech Mono', monospace; font-size: 1rem; letter-spacing: 3px; text-transform: uppercase;
            opacity: 0; text-shadow: 0 0 12px rgba(0,0,0,0.95), 0 0 4px rgba(0,0,0,0.9);
            animation: subtextFadeIn 1.4s ease-out forwards 0.6s;
        }
        @keyframes subtextFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 0.9; transform: translateY(0); } }

        /* Skip cutscene controls */
        #cutscene-controls {
            position: absolute; bottom: 40px; right: 40px; z-index: 20; display: flex; flex-direction: column;
            align-items: flex-end; gap: 8px; opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        #cutscene-controls.visible { opacity: 0.92; pointer-events: all; }
        #skip-cutscene-btn {
            background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.45); color: #fff;
            font-family: 'Share Tech Mono', monospace; letter-spacing: 2px; font-size: 0.9rem; padding: 8px 18px;
            border-radius: 4px; cursor: pointer; transition: background 0.15s, border-color 0.15s; text-transform: uppercase;
        }
        #skip-cutscene-btn:hover { background: rgba(0,0,0,0.85); border-color: #fff; }
        #always-skip-label {
            display: flex; align-items: center; gap: 6px; font-family: 'Share Tech Mono', monospace; font-size: 0.7rem;
            color: rgba(255,255,255,0.75); letter-spacing: 1px; cursor: pointer; background: rgba(0,0,0,0.4);
            padding: 4px 10px; border-radius: 3px; text-transform: uppercase;
        }
        #always-skip-label input { cursor: pointer; accent-color: #d95129; width: 12px; height: 12px; }

        /* 1. The Heart of the Trench (Mythic) */
        #corrupted-overlay.the-heart-of-the-trench { background: radial-gradient(circle, #2a0000 0%, #000 80%); }
        #corrupted-overlay.the-heart-of-the-trench #corrupted-shapes { background: repeating-radial-gradient(circle at 50% 50%, transparent 0, transparent 40px, rgba(255, 0, 0, 0.15) 41px, rgba(255, 0, 0, 0.4) 50px, transparent 51px); animation: pulseRings 1.2s infinite linear; }
        @keyframes pulseRings { 0% { transform: scale(0.8); opacity: 0.5; } 50% { opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
        #corrupted-overlay.the-heart-of-the-trench #corrupted-text { animation: heartThump 1.2s infinite; color: #ff3333; text-shadow: 0 0 30px #ff0000, 0 0 10px #ff0000; }
        @keyframes heartThump { 0%, 100% { transform: scale(1); opacity: 0.8; } 10% { transform: scale(1.15); opacity: 1; filter: brightness(1.5); } 25% { transform: scale(1.05); opacity: 0.9; } 35% { transform: scale(1.2); opacity: 1; filter: brightness(2); } }

        /* 2. Cursed Figurehead (Mythic) */
        #corrupted-overlay.cursed-figurehead { background: linear-gradient(to bottom, #001a11, #000905); }
        #corrupted-overlay.cursed-figurehead #corrupted-shapes { background: repeating-linear-gradient(45deg, rgba(0, 255, 150, 0.05) 0px, transparent 40px, rgba(0, 200, 100, 0.05) 80px), repeating-linear-gradient(-45deg, rgba(0, 200, 150, 0.05) 0px, transparent 50px, rgba(0, 255, 100, 0.05) 100px); background-size: 200% 200%; animation: fogDrift 8s infinite linear; }
        @keyframes fogDrift { 0% { background-position: 0% 0%; } 100% { background-position: 100% 100%; } }
        #corrupted-overlay.cursed-figurehead #corrupted-text { animation: ghostlySway 5s ease-in-out infinite; color: #88ccaa; text-shadow: 0 0 20px #448866, 0 5px 5px #000; letter-spacing: 5px; }
        @keyframes ghostlySway { 0%, 100% { transform: rotate(-3deg) translateY(0); filter: blur(1px); } 50% { transform: rotate(3deg) translateY(-15px); filter: blur(4px); } }

        /* 3. Phantom Lighthouse (Mythic) */
        #corrupted-overlay.phantom-lighthouse { background: #000508; }
        #corrupted-overlay.phantom-lighthouse #corrupted-shapes { background: conic-gradient(from 180deg at 50% 120%, transparent 0deg, rgba(255, 255, 100, 0.4) 30deg, transparent 60deg); transform-origin: 50% 120%; animation: lighthouseSweep 6s infinite ease-in-out alternate; mix-blend-mode: screen; }
        @keyframes lighthouseSweep { 0% { transform: rotate(-50deg); } 100% { transform: rotate(50deg); } }
        #corrupted-overlay.phantom-lighthouse #corrupted-text { background: linear-gradient(90deg, #222 0%, #fff 50%, #222 100%); background-size: 200% 100%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: textBeam 6s infinite ease-in-out alternate; filter: drop-shadow(0 0 15px rgba(255,255,150,0.5)); }
        @keyframes textBeam { 0% { background-position: 100% 0; } 100% { background-position: 0% 0; } }

        /* 4. The Drowned Crown (Eldritch) */
        #corrupted-overlay.the-drowned-crown { background: radial-gradient(circle at center, #004455 0%, #000b1a 100%); }
        #corrupted-overlay.the-drowned-crown #corrupted-shapes { background-image: radial-gradient(circle at 20% 80%, rgba(255, 215, 0, 0.6) 0%, transparent 4%), radial-gradient(circle at 80% 90%, rgba(255, 215, 0, 0.8) 0%, transparent 3%), radial-gradient(circle at 40% 60%, rgba(255, 215, 0, 0.4) 0%, transparent 5%), radial-gradient(circle at 60% 70%, rgba(255, 215, 0, 0.6) 0%, transparent 4%), radial-gradient(circle at 50% 40%, rgba(255, 215, 0, 0.9) 0%, transparent 12%); animation: bubblesRise 7s ease-in forwards; }
        @keyframes bubblesRise { 0% { transform: translateY(100px) scale(0.8); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-150px) scale(1.5); opacity: 0; } }
        #corrupted-overlay.the-drowned-crown #corrupted-text { animation: sinkingCrown 7s ease-in forwards; color: #ffd700; text-shadow: 0 0 40px #b8860b, 0 0 10px #ffea00, 0 0 50px #000; letter-spacing: 2px; }
        @keyframes sinkingCrown { 0% { transform: translateY(-80px); opacity: 0; filter: blur(10px); } 20% { opacity: 1; filter: blur(0px); } 80% { opacity: 1; filter: blur(0px); } 100% { transform: translateY(80px); opacity: 0; filter: blur(5px); } }

        /* 5. Whispering Obelisk (Eldritch) */
        #corrupted-overlay.whispering-obelisk { background: #0a001a; }
        #corrupted-overlay.whispering-obelisk #corrupted-shapes { background-image: linear-gradient(rgba(0, 255, 255, 0.3) 2px, transparent 2px), linear-gradient(90deg, rgba(255, 0, 255, 0.3) 2px, transparent 2px); background-size: 60px 60px; transform: perspective(600px) rotateX(60deg) translateY(-50px) translateZ(-200px); animation: gridMove 2s infinite linear; }
        @keyframes gridMove { 0% { background-position: 0 0; } 100% { background-position: 0 60px; } }
        #corrupted-overlay.whispering-obelisk #corrupted-text { animation: obeliskGlitch 0.15s infinite; color: #aa00ff; text-shadow: -4px 0 #00ffff, 4px 0 #ff00ff; font-family: 'Share Tech Mono', monospace; font-size: 3.5rem; font-weight: bold; }
        @keyframes obeliskGlitch { 0% { transform: translate(3px, -3px) skew(-5deg); } 33% { transform: translate(-3px, 2px) skew(5deg); } 66% { transform: translate(2px, 3px) skew(0deg); } 100% { transform: translate(-2px, -2px) skew(-2deg); } }

        /* 6. Abyssal Leviathan Spine (Eldritch) */
        #corrupted-overlay.abyssal-leviathan-spine { background: radial-gradient(circle, #001a14 0%, #000 80%); }
        #corrupted-overlay.abyssal-leviathan-spine #corrupted-shapes { background: radial-gradient(ellipse at 50% -50%, transparent 60%, rgba(0, 255, 150, 0.15) 65%, transparent 70%), radial-gradient(ellipse at 50% 150%, transparent 60%, rgba(0, 255, 150, 0.15) 65%, transparent 70%); background-size: 300px 100%; animation: spinePass 4s infinite linear; }
        @keyframes spinePass { 0% { background-position: 0 0; } 100% { background-position: -300px 0; } }
        #corrupted-overlay.abyssal-leviathan-spine #corrupted-text { color: #ccffee; text-shadow: 0 0 20px #00ffaa, 0 10px 10px #000; animation: leviathanBreath 6s ease-in-out infinite; letter-spacing: 8px; }
        @keyframes leviathanBreath { 0%, 100% { transform: scale(1) translateY(0); filter: blur(3px); opacity: 0.6; } 50% { transform: scale(1.1) translateY(-5px); filter: blur(0px); opacity: 1; } }

        /* 7. Tear of the Abyss (Unfathomable) */
        #corrupted-overlay.tear-of-the-abyss { animation: tearFlashbangBg 10s forwards ease-out; }
        @keyframes tearFlashbangBg { 0%, 15% { background: #ffffff; } 40% { background: radial-gradient(circle, #fff 0%, #0044aa 50%, #000 100%); } 100% { background: #000411; } }
        #corrupted-overlay.tear-of-the-abyss #corrupted-shapes { background: radial-gradient(3px 3px at 20% 30%, #ffffff 50%, rgba(0,0,0,0)), radial-gradient(4px 4px at 40% 70%, #ffffff 50%, rgba(0,0,0,0)), radial-gradient(2px 2px at 60% 20%, #ffffff 50%, rgba(0,0,0,0)), radial-gradient(5px 5px at 80% 80%, #ffffff 50%, rgba(0,0,0,0)), radial-gradient(3px 3px at 10% 90%, #ffffff 50%, rgba(0,0,0,0)), radial-gradient(4px 4px at 90% 10%, #ffffff 50%, rgba(0,0,0,0)); background-size: 200px 200px; animation: starryVortex 10s linear forwards; opacity: 0; }
        @keyframes starryVortex { 0%, 20% { opacity: 0; transform: scale(0.1) rotate(0deg); } 50% { opacity: 1; } 100% { opacity: 0.5; transform: scale(4) rotate(180deg); } }
        #corrupted-overlay.tear-of-the-abyss #corrupted-text { animation: tearText 10s forwards; color: #fff; text-shadow: 0 0 50px #00aaff, 0 0 100px #fff; }
        @keyframes tearText { 0% { opacity: 0; transform: scale(0.3); letter-spacing: -10px; filter: blur(20px); } 20% { opacity: 1; transform: scale(1); letter-spacing: 5px; filter: blur(0px); } 80% { opacity: 1; transform: scale(1.1); letter-spacing: 20px; filter: blur(0px); } 100% { opacity: 0; transform: scale(1.5); letter-spacing: 45px; filter: blur(15px); } }

        /* 8. The Sunken Moon (Unfathomable) */
        #corrupted-overlay.the-sunken-moon { background: #000511; animation: deepSeaEclipse 11s forwards; }
        @keyframes deepSeaEclipse { 0% { background: #000; } 50% { background: radial-gradient(circle at bottom, #002244 0%, #000 70%); } 100% { background: #fff; } }
        #corrupted-overlay.the-sunken-moon #corrupted-shapes { background: radial-gradient(circle, #ffffee 0%, #ffffaa 20%, transparent 60%); border-radius: 50%; width: 200vw; height: 200vw; position: absolute; left: -50vw; top: 100vh; animation: lunarRise 11s cubic-bezier(0.25, 0.1, 0.25, 1) forwards; box-shadow: 0 0 200px 100px rgba(255,255,200,0.8); mix-blend-mode: screen; }
        @keyframes lunarRise { 0% { transform: translateY(0); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-150vh); opacity: 1; } }
        #corrupted-overlay.the-sunken-moon #corrupted-text { color: #000; text-shadow: 0 0 20px #fff, 0 0 40px #ffffaa, 0 0 80px #ffcc00; animation: moonText 11s ease-in-out forwards; mix-blend-mode: overlay; z-index: 3; }
        @keyframes moonText { 0% { opacity: 0; transform: scale(0.8); letter-spacing: -5px; } 30% { opacity: 1; transform: scale(1); letter-spacing: 5px; } 80% { opacity: 1; transform: scale(1.1); letter-spacing: 15px; color: #fff; } 100% { opacity: 0; transform: scale(1.5); letter-spacing: 30px; filter: blur(10px); } }

        /* 9. Echo of the Genesis (Unfathomable) */
        #corrupted-overlay.echo-of-the-genesis { background: #000; }

            100% { background: radial-gradient(circle at center, #00020a 0%, #000 100%); }

        /* Layer 1: The Black Hole / Singularity Implosion */
        #corrupted-overlay.the-depth-itself #corrupted-shapes {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            border-radius: 50%;
            background: #fff;

            z-index: 1;

        @keyframes absoluteSingularity {

            49% { width: 0px; height: 0px; box-shadow: 0 0 500px 500px #fff; filter: brightness(5); } /* Implosion */
            50%, 100% { width: 0px; height: 0px; opacity: 0; box-shadow: none; }
        }

        /* Layer 1.5: Divine Ascension Particles */
        #corrupted-overlay.the-depth-itself::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255,255,255,1) 0%, transparent 2%),
                radial-gradient(circle at 30% 70%, rgba(0,255,255,1) 0%, transparent 3%),

        }

        #corrupted-overlay.the-depth-itself::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;

        /* Expanding shockwave ring, timed to detonate right at the flashbang moment */
        #corrupted-shockwave {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border-radius: 50%;
            border: 3px solid #fff; transform: translate(-50%, -50%); opacity: 0; pointer-events: none; z-index: 3;

        #corrupted-overlay.the-depth-itself #corrupted-shockwave { animation: depthShockwave 18s forwards; }
        @keyframes depthShockwave {
            0%, 48.5% { width: 10px; height: 10px; opacity: 0; border-width: 4px; }
            49.5% { width: 10px; height: 10px; opacity: 1; border-width: 10px; }
            58% { width: 250vmax; height: 250vmax; opacity: 0; border-width: 1px; }
            100% { opacity: 0; }

        #corrupted-overlay.the-depth-itself #corrupted-prophecy { animation: depthProphecyIn 2s ease-out forwards 11.3s; }
        @keyframes depthProphecyIn {

            animation: emblemAppear 1.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 9.3s, emblemFloat 6s ease-in-out infinite 11.1s;

        #corrupted-overlay.the-depth-itself #corrupted-tier-badge {
            font-size: 1.3rem; letter-spacing: 8px; padding: 8px 30px;
            animation: tierBadgeIn 0.9s cubic-bezier(0.2, 0.9, 0.25, 1.3) forwards 10.6s, absoluteBadgeShimmer 2.4s ease-in-out infinite 11.5s;
        }
        @keyframes absoluteBadgeShimmer {
            0%, 100% { color: #ff0055; box-shadow: 0 0 22px #ff0055, inset 0 0 12px #ff0055; border-color: #ff0055; }
            33% { color: #00ffff; box-shadow: 0 0 22px #00ffff, inset 0 0 12px #00ffff; border-color: #00ffff; }
            66% { color: #fff; box-shadow: 0 0 26px #fff, inset 0 0 14px #fff; border-color: #fff; }
        }

        /* Environmental Mechanics — this filter deliberately excludes #corrupted-overlay (a sibling, not a
           descendant, of #game-ui) so the cutscene's own colors stay vivid while the game world behind it
           desaturates. A child element's filter can never "undo" a filter already applied by an ancestor,
           so the overlay has to live outside this wrapper rather than try to counteract it from within. */
        #game-ui.corrupted { background-color: #000; filter: grayscale(1) contrast(1.5) brightness(0.8); }
        #game-ui.corrupted .preserve-color { filter: grayscale(0) !important; }

        @keyframes screenShake {
            0% { transform: translate(0, 0) rotate(0deg); }

            30% { transform: translate(0px, -1px) rotate(0deg); }
            40% { transform: translate(2px, 1px) rotate(0.5deg); }
            50% { transform: translate(-1px, 2px) rotate(-0.5deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-0.5deg); }
            80% { transform: translate(-1px, -1px) rotate(0.5deg); }
            90% { transform: translate(2px, 2px) rotate(0deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .shake { animation: screenShake 0.4s ease-out; }

        .dredge-net-cage { position: absolute; bottom: -20px; left: -20px; width: 44px; height: 55px; border: 3px solid #443731; border-top: 4px solid #1a1310; background-color: rgba(18, 14, 12, 0.8); background-image: linear-gradient(45deg, #2b1f1a 25%, transparent 25%), linear-gradient(-45deg, #2b1f1a 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #2b1f1a 75%), linear-gradient(-45deg, transparent 75%, #2b1f1a 75%); background-size: 8px 8px; border-radius: 4px 4px 18px 18px; box-shadow: 0 10px 15px rgba(0,0,0,0.9), inset 0 0 10px #000; display: flex; align-items: center; justify-content: center; }

        /* Middle Area */

        #dredge-button { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #3e4852, #141a20); border: 10px solid #000; box-shadow: inset 0 0 40px rgba(0,0,0,0.95), 0 10px 20px rgba(0,0,0,0.8), 0 0 0 3px var(--panel-border); cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; transition: transform 0.1s, box-shadow 0.1s; z-index: 3; }

        .auto-switch-container { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; background: rgba(0,0,0,0.3); padding: 4px 12px; border-radius: 20px; border: 1px solid var(--panel-border); }
        .switch-label { font-family: 'Share Tech Mono', monospace; font-size: 0.9rem; color: var(--text-dim); letter-spacing: 1px; }

        /* === RARITY FIND TOASTS (Legendary/Epic, non-blocking) === */

            background: radial-gradient(circle at 30% 30%, #3e4852, #141a20); border: 3px solid var(--panel-border);
            color: var(--rarity-legendary); font-size: 1.05rem; cursor: pointer;

            display: flex; align-items: center; justify-content: center;
        }

    <script>
        // === PROCEDURAL AUDIO SYSTEM ===
        class AudioSystem {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.rainGain = null;
                this.isInitialized = false;
                this.baseRainVol = 0.4;
                this.activeCutsceneNodes = [];
            }

            init() {
                if(this.isInitialized) return;
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = 0.5;
                this.masterGain.connect(this.ctx.destination);
                this.startRain();
                this.isInitialized = true;
            }

            startRain() {
                const bufferSize = this.ctx.sampleRate * 2;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for(let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }

                this.rainSource = this.ctx.createBufferSource();
                this.rainSource.buffer = buffer;
                this.rainSource.loop = true;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 400;

                this.rainGain = this.ctx.createGain();
                this.rainGain.gain.value = this.baseRainVol;

                this.rainSource.connect(filter);
                filter.connect(this.rainGain);
                this.rainGain.connect(this.masterGain);
                this.rainSource.start();
            }

            fadeRain(targetVol, transitionTime) {
                if(!this.rainGain || !this.ctx) return;
                this.rainGain.gain.setTargetAtTime(targetVol, this.ctx.currentTime, transitionTime);
            }

            // Quickly duck the master volume then restore it — used when a cutscene is skipped
            // so any still-playing drone/chime layers don't linger audibly.
            duck(durationSec) {
                if(!this.ctx || !this.masterGain) return;
                const now = this.ctx.currentTime;
                const current = this.masterGain.gain.value;
                this.masterGain.gain.cancelScheduledValues(now);
                this.masterGain.gain.setValueAtTime(current, now);
                this.masterGain.gain.linearRampToValueAtTime(0.001, now + 0.12);
                this.masterGain.gain.linearRampToValueAtTime(0.5, now + 0.12 + durationSec);
            }

            setHeavyStormAudio(active) {
                if(!this.ctx || !this.rainGain) return;
                this.baseRainVol = active ? 0.9 : 0.4;
                if(typeof game !== 'undefined' && !game.isCutsceneActive) {
                    this.fadeRain(this.baseRainVol, 2);
                }
            }

            playThunder(intensity) {
                if(!this.ctx) return;
                if(typeof game !== 'undefined' && game.isCutsceneActive) return;

                const bufferSize = this.ctx.sampleRate * 4;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for(let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }

                const source = this.ctx.createBufferSource();
                source.buffer = buffer;
                
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 150 + (intensity * 200);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(intensity * 1.5, this.ctx.currentTime + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 3);

                source.connect(filter); filter.connect(gain); gain.connect(this.masterGain);
                source.start(); source.stop(this.ctx.currentTime + 4);
            }

            playDredge(isAuto, durationMs) {
                if(!this.ctx) return;
                const vol = isAuto ? 0.04 : 0.15; 
                const duration = durationMs / 1000;
                const now = this.ctx.currentTime;
                
                const playHeavyClang = (time) => {
                    const bufferSize = this.ctx.sampleRate * 0.6;
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for(let i=0; i<bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    
                    const resonantFreqs = [220, 380, 650, 1100, 1800];
                    resonantFreqs.forEach((f, idx) => {
                        const noise = this.ctx.createBufferSource();
                        noise.buffer = buffer;
                        
                        const bp = this.ctx.createBiquadFilter();
                        bp.type = 'bandpass';
                        bp.frequency.value = f;
                        bp.Q.value = 25; 
                        
                        const gain = this.ctx.createGain();
                        gain.gain.setValueAtTime(0, time);
                        gain.gain.linearRampToValueAtTime((vol * 3.5) / resonantFreqs.length, time + 0.01);
                        
                        const decay = 0.5 - (idx * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, time + Math.max(0.1, decay));
                        
                        noise.connect(bp); bp.connect(gain); gain.connect(this.masterGain);
                        noise.start(time);
                    });

                    const crunch = this.ctx.createBufferSource();
                    crunch.buffer = buffer;
                    const lp = this.ctx.createBiquadFilter();
                    lp.type = 'lowpass';
                    lp.frequency.value = 300; 
                    
                    const lpGain = this.ctx.createGain();
                    lpGain.gain.setValueAtTime(0, time);
                    lpGain.gain.linearRampToValueAtTime(vol * 3.0, time + 0.02);
                    lpGain.gain.exponentialRampToValueAtTime(0.001, time + 0.3);
                    
                    crunch.connect(lp); lp.connect(lpGain); lpGain.connect(this.masterGain);
                    crunch.start(time);
                };
                
                const playGrind = (startTime, dur) => {
                    const bufferSize = this.ctx.sampleRate * dur;
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for(let i=0; i<bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    
                    const noise = this.ctx.createBufferSource();
                    noise.buffer = buffer;
                    
                    const bp = this.ctx.createBiquadFilter();
                    bp.type = 'bandpass';
                    bp.frequency.value = 180; 
                    bp.Q.value = 2;
                    
                    const lfo = this.ctx.createOscillator();
                    lfo.type = 'sawtooth';
                    lfo.frequency.value = 8; 
                    const lfoGain = this.ctx.createGain();
                    lfoGain.gain.value = 150;
                    lfo.connect(lfoGain); lfoGain.connect(bp.frequency);
                    lfo.start(startTime); lfo.stop(startTime + dur);
                    
                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(0, startTime);
                    gain.gain.linearRampToValueAtTime(vol * 0.5, startTime + 0.1);
                    gain.gain.setValueAtTime(vol * 0.5, startTime + dur - 0.1);
                    gain.gain.linearRampToValueAtTime(0, startTime + dur);
                    
                    noise.connect(bp); bp.connect(gain); gain.connect(this.masterGain);
                    noise.start(startTime);
                };

                playHeavyClang(now); 
                playGrind(now, duration); 
                playHeavyClang(now + duration); 
            }

            playCutsceneDrone(tierId, durationMs) {
                if(!this.ctx) return;
                this.fadeRain(0.01, 1.0); 
                this.activeCutsceneNodes = []; // reset tracking so skipCutscene can hard-stop these specific nodes
                
                const dur = durationMs / 1000;
                const now = this.ctx.currentTime;
                let freqs = []; 
                
                // MASSIVE CINEMATIC REVERB BUS
                const echo = this.ctx.createDelay();
                echo.delayTime.value = 0.5; // 500ms massive cavern echo
                const echoFeedback = this.ctx.createGain();
                echoFeedback.gain.value = 0.6; // 60% echo tail
                const echoFilter = this.ctx.createBiquadFilter();
                echoFilter.type = 'lowpass';
                echoFilter.frequency.value = 1500;
                echo.connect(echoFilter); echoFilter.connect(echoFeedback); echoFeedback.connect(echo);
                echo.connect(this.masterGain);

                if(tierId === 'absolute') {
                    // PHASE 1: The Cosmic Siren & Void Vacuum (0s - 9s)
                    const siren = this.ctx.createOscillator();
                    siren.type = 'sawtooth';
                    siren.frequency.setValueAtTime(50, now);
                    siren.frequency.exponentialRampToValueAtTime(800, now + 8.8);
                    
                    const sirenLp = this.ctx.createBiquadFilter();
                    sirenLp.type = 'lowpass';
                    sirenLp.frequency.setValueAtTime(100, now);
                    sirenLp.frequency.exponentialRampToValueAtTime(3000, now + 8.8);
                    
                    const sirenGain = this.ctx.createGain();
                    sirenGain.gain.setValueAtTime(0, now);
                    sirenGain.gain.linearRampToValueAtTime(0.5, now + 8.5);
                    sirenGain.gain.exponentialRampToValueAtTime(0.001, now + 8.9);
                    
                    siren.connect(sirenLp); sirenLp.connect(sirenGain); sirenGain.connect(echo); sirenGain.connect(this.masterGain);
                    siren.start(now); siren.stop(now + 9.0);
                    this.activeCutsceneNodes.push({ source: siren, gain: sirenGain });

                    // Vacuum wind
                    const wBuf = this.ctx.createBuffer(1, this.ctx.sampleRate * 9, this.ctx.sampleRate);
                    const wData = wBuf.getChannelData(0);
                    for(let i=0; i<wData.length; i++) wData[i] = Math.random() * 2 - 1;
                    const wind = this.ctx.createBufferSource(); wind.buffer = wBuf;
                    const wFilt = this.ctx.createBiquadFilter(); wFilt.type = 'bandpass'; wFilt.Q.value = 5;
                    wFilt.frequency.setValueAtTime(200, now); wFilt.frequency.exponentialRampToValueAtTime(4000, now + 8.8);
                    const wGain = this.ctx.createGain(); wGain.gain.setValueAtTime(0, now); wGain.gain.linearRampToValueAtTime(1.5, now + 8.5); wGain.gain.exponentialRampToValueAtTime(0.001, now + 8.9);
                    wind.connect(wFilt); wFilt.connect(wGain); wGain.connect(echo); wGain.connect(this.masterGain);
                    wind.start(now);
                    this.activeCutsceneNodes.push({ source: wind, gain: wGain });

                    // PHASE 2: The Sub Drop & Big Bang (9.0s)
                    const drop = this.ctx.createOscillator();
                    drop.type = 'sine';
                    drop.frequency.setValueAtTime(150, now + 8.5);
                    drop.frequency.exponentialRampToValueAtTime(10, now + 10.5);
                    const dropGain = this.ctx.createGain();
                    dropGain.gain.setValueAtTime(0, now + 8.4);
                    dropGain.gain.linearRampToValueAtTime(0.8, now + 8.5);
                    dropGain.gain.exponentialRampToValueAtTime(0.01, now + 12.0);
                    drop.connect(dropGain); dropGain.connect(this.masterGain);
                    drop.start(now + 8.5); drop.stop(now + 12.0);
                    this.activeCutsceneNodes.push({ source: drop, gain: dropGain });

                    const bangDur = 5;
                    const bBuf = this.ctx.createBuffer(1, this.ctx.sampleRate * bangDur, this.ctx.sampleRate);
                    const bData = bBuf.getChannelData(0);
                    for(let i=0; i<bData.length; i++) bData[i] = Math.random() * 2 - 1;
                    const blast = this.ctx.createBufferSource(); blast.buffer = bBuf;
                    
                    const bFilt = this.ctx.createBiquadFilter(); bFilt.type = 'lowpass';
                    bFilt.frequency.setValueAtTime(2500, now + 9.0); bFilt.frequency.exponentialRampToValueAtTime(50, now + 9.0 + bangDur);
                    
                    const bGain = this.ctx.createGain(); bGain.gain.setValueAtTime(0, now + 8.9); bGain.gain.setValueAtTime(4.0, now + 9.0); bGain.gain.exponentialRampToValueAtTime(0.001, now + 9.0 + bangDur);
                    blast.connect(bFilt); bFilt.connect(bGain); bGain.connect(echo); bGain.connect(this.masterGain);
                    blast.start(now + 9.0);
                    this.activeCutsceneNodes.push({ source: blast, gain: bGain });
                    
                    // PHASE 3: The Majestic Void Pad (9.1s - 18s) - Huge C Maj7 Lydian chord
                    freqs = [130.81, 164.81, 196.00, 261.63, 329.63, 392.00];
                    freqs.forEach((freq, idx) => {
                        for(let j=0; j<2; j++) {
                            const osc = this.ctx.createOscillator();
                            osc.type = j===0 ? 'sawtooth' : 'triangle';
                            osc.frequency.value = freq + ((Math.random() - 0.5) * 4); 
                            
                            const pLp = this.ctx.createBiquadFilter();
                            pLp.type = 'lowpass';
                            pLp.frequency.setValueAtTime(100, now + 9.1);
                            pLp.frequency.linearRampToValueAtTime(1200, now + 12);
                            pLp.frequency.linearRampToValueAtTime(200, now + 17);

                            const pGain = this.ctx.createGain();
                            pGain.gain.setValueAtTime(0, now + 9.0);
                            pGain.gain.linearRampToValueAtTime(0.15 / freqs.length, now + 10.5);
                            pGain.gain.setValueAtTime(0.15 / freqs.length, now + 15);
                            pGain.gain.linearRampToValueAtTime(0, now + dur);

                            osc.connect(pLp); pLp.connect(pGain); pGain.connect(echo); pGain.connect(this.masterGain);
                            osc.start(now + 9.1); osc.stop(now + dur);
                            this.activeCutsceneNodes.push({ source: osc, gain: pGain });
                        }
                    });

                    // PHASE 4: Divine Shimmering Bells (Post-Bang Ascension)
                    const bellFreqs = [1046.50, 1318.51, 1567.98, 2093.00]; // C6, E6, G6, C7
                    bellFreqs.forEach((freq, idx) => {
                        const bell = this.ctx.createOscillator();
                        bell.type = 'sine';
                        bell.frequency.value = freq;
                        
                        const bGain2 = this.ctx.createGain();
                        const startTime = now + 9.5 + (idx * 0.4); // Stagger the bell chimes
                        
                        bGain2.gain.setValueAtTime(0, now + 9.0);
                        bGain2.gain.setValueAtTime(0, startTime);
                        bGain2.gain.linearRampToValueAtTime(0.08, startTime + 0.1);
                        bGain2.gain.exponentialRampToValueAtTime(0.001, startTime + 3.0);
                        
                        bell.connect(bGain2); bGain2.connect(echo); bGain2.connect(this.masterGain);
                        bell.start(startTime); bell.stop(startTime + 3.5);
                        this.activeCutsceneNodes.push({ source: bell, gain: bGain2 });
                    });
                    
                    setTimeout(() => { this.fadeRain(this.baseRainVol, 3); }, durationMs - 1500);
                    return; 
                }
                
                // Other Rarities (Uses the shared variable declared at the top)
                if(tierId === 'mythic') freqs = [130.81, 196.00, 261.63]; 
                else if(tierId === 'eldritch') freqs = [110.00, 164.81, 220.00]; 
                else if(tierId === 'unfathomable') freqs = [87.31, 130.81, 174.61, 261.63]; 
                
                freqs.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    osc.type = 'sine'; 
                    
                    const lfo = this.ctx.createOscillator();
                    lfo.type = 'sine';
                    lfo.frequency.value = 0.1 + (idx * 0.05); 
                    const lfoGain = this.ctx.createGain();
                    lfoGain.gain.value = 3; 
                    lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
                    lfo.start(now); lfo.stop(now + dur);
                    
                    osc.frequency.value = freq;
                    
                    const gain = this.ctx.createGain();
                    osc.connect(gain); 
                    gain.connect(echo); 
                    gain.connect(this.masterGain);
                    
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.6 / freqs.length, now + dur * 0.3); 
                    gain.gain.setValueAtTime(0.6 / freqs.length, now + dur * 0.7);
                    gain.gain.linearRampToValueAtTime(0, now + dur);
                    
                    osc.start(now); osc.stop(now + dur);
                    this.activeCutsceneNodes.push({ source: osc, gain: gain });
                    this.activeCutsceneNodes.push({ source: lfo, gain: null });
                });
                
                setTimeout(() => { this.fadeRain(this.baseRainVol, 3); }, durationMs - 1500);
            }

            // Immediately silences every node currently playing as part of the cutscene drone
            // (used when a cutscene is skipped, so nothing keeps ringing out after the overlay closes).
            stopCutsceneDrone() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                (this.activeCutsceneNodes || []).forEach(({ source, gain }) => {
                    try {
                        if (gain && gain.gain) {
                            gain.gain.cancelScheduledValues(now);
                            gain.gain.setValueAtTime(gain.gain.value, now);
                            gain.gain.linearRampToValueAtTime(0.0001, now + 0.1);
                        }
                    } catch(e) {}
                    try { if (source && source.stop) source.stop(now + 0.12); } catch(e) {}
                });
                this.activeCutsceneNodes = [];
                this.fadeRain(this.baseRainVol, 1.2);
            }
        }

        class StormController {
            constructor() {
                this.canvas = document.getElementById('storm-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.lightningTimer = 0;
                this.lightningFlash = 0;
                this.isHeavyStorm = false;
                this.init();
            }
            init() {
                this.resize();
                window.addEventListener('resize', () => this.resize());
                for (let i = 0; i < 80; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        length: Math.random() * 20 + 10,
                        speedX: -2 - Math.random() * 2,
                        speedY: Math.random() * 12 + 15,
                        opacity: Math.random() * 0.4 + 0.1
                    });
                }
                this.animate();
            }
            resize() {
                this.canvas.width = this.canvas.parentElement.clientWidth;
                this.canvas.height = this.canvas.parentElement.clientHeight;
            }
            setHeavyStorm(active) {
                this.isHeavyStorm = active;
                if (active) {
                    for (let i = 0; i < 150; i++) {
                        this.particles.push({
                            x: Math.random() * this.canvas.width,
                            y: Math.random() * this.canvas.height,
                            length: Math.random() * 30 + 15,
                            speedX: -4 - Math.random() * 4,
                            speedY: Math.random() * 20 + 20,
                            opacity: Math.random() * 0.6 + 0.2
                        });
                    }
                } else {
                    this.particles.splice(80);
                }
            }
            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.lightningTimer++;
                
                const lightningMax = this.isHeavyStorm ? 80 : 250;
                const lightningProb = this.isHeavyStorm ? 0.05 : 0.01;
                
                if (this.lightningTimer > lightningMax && Math.random() < lightningProb) {
                    this.lightningFlash = Math.random() > 0.5 ? 0.9 : 0.6;
                    this.lightningTimer = 0;
                    if(sfx.isInitialized) sfx.playThunder(this.lightningFlash);
                }
                if (this.lightningFlash > 0) {
                    this.ctx.fillStyle = `rgba(180, 210, 255, ${this.lightningFlash})`;
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                    this.lightningFlash -= 0.08;
                }
                this.ctx.strokeStyle = 'rgba(156, 180, 204, 0.45)';
                this.ctx.lineWidth = 1;
                this.particles.forEach(p => {
                    this.ctx.beginPath(); this.ctx.moveTo(p.x, p.y); this.ctx.lineTo(p.x + p.speedX, p.y + p.speedY); this.ctx.stroke();
                    p.x += p.speedX; p.y += p.speedY;
                    if (p.y > this.canvas.height) { p.y = -p.length; p.x = Math.random() * (this.canvas.width + 100); }
                    if (p.x < -p.length) { p.x = this.canvas.width + p.length; }
                });
                requestAnimationFrame(() => this.animate());
            }
        }

        // Lightweight canvas particle system layered above the CSS cutscene backgrounds.
        // Each item gets a distinct "mode" (rise / drift / swirl / burst) and color so the
        // rarer reveals feel like they're actually happening in the space, not just painted CSS.
        class CutsceneParticles {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.rafId = null;
                this.active = false;
                this.preset = null;
                window.addEventListener('resize', () => { if (this.active) this.resize(); });
            }
            resize() {
                this.canvas.width = this.canvas.parentElement.clientWidth || window.innerWidth;
                this.canvas.height = this.canvas.parentElement.clientHeight || window.innerHeight;
            }
            start(preset) {
                this.stop();
                this.resize();
                this.preset = preset;
                this.active = true;
                this.particles = [];
                for (let i = 0; i < preset.count; i++) this.particles.push(this.spawn(true));
                this.loop();
            }
            spawn(initial) {
                const p = this.preset;
                const w = this.canvas.width, h = this.canvas.height;
                if (p.mode === 'rise') {
                    return { x: Math.random() * w, y: initial ? Math.random() * h : h + 20, size: p.minSize + Math.random() * (p.maxSize - p.minSize), speed: p.minSpeed + Math.random() * (p.maxSpeed - p.minSpeed), drift: (Math.random() - 0.5) * p.driftAmt, alpha: 0.3 + Math.random() * 0.6 };
                }
                if (p.mode === 'swirl') {
                    return { angle: Math.random() * Math.PI * 2, radius: 30 + Math.random() * (Math.min(w, h) * 0.32), speedAngle: (p.minSpeed + Math.random() * (p.maxSpeed - p.minSpeed)) * (Math.random() < 0.5 ? 1 : -1), size: p.minSize + Math.random() * (p.maxSize - p.minSize), alpha: 0.3 + Math.random() * 0.6, radiusJitter: (Math.random() - 0.5) * 0.4 };
                }
                if (p.mode === 'drift') {
                    return { x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - 0.5) * p.maxSpeed, vy: (Math.random() - 0.5) * p.maxSpeed, size: p.minSize + Math.random() * (p.maxSize - p.minSize), alpha: 0.2 + Math.random() * 0.5 };
                }
                // burst: fountains out from center, fades, then re-spawns from center again (continuous pulse)
                const angle = Math.random() * Math.PI * 2;
                const speed = p.minSpeed + Math.random() * (p.maxSpeed - p.minSpeed);
                return { x: w / 2, y: h / 2, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, size: p.minSize + Math.random() * (p.maxSize - p.minSize), alpha: 0.7 + Math.random() * 0.3 };
            }
            loop() {
                if (!this.active) return;
                const ctx = this.ctx, w = this.canvas.width, h = this.canvas.height, p = this.preset;
                ctx.clearRect(0, 0, w, h);
                ctx.globalCompositeOperation = 'lighter';
                this.particles.forEach((particle, idx) => {
                    let drawX, drawY;
                    if (p.mode === 'rise') {
                        particle.y -= particle.speed; particle.x += particle.drift * 0.02;
                        if (particle.y < -20) this.particles[idx] = this.spawn(false);
                        drawX = particle.x; drawY = particle.y;
                    } else if (p.mode === 'swirl') {
                        particle.angle += particle.speedAngle * 0.012;
                        particle.radius += particle.radiusJitter;
                        if (particle.radius < 20) particle.radius = 20;
                        drawX = w / 2 + Math.cos(particle.angle) * particle.radius;
                        drawY = h / 2 + Math.sin(particle.angle) * particle.radius * 0.62;
                    } else if (p.mode === 'drift') {
                        particle.x += particle.vx * 0.3; particle.y += particle.vy * 0.3;
                        if (particle.x < 0) particle.x = w; if (particle.x > w) particle.x = 0;
                        if (particle.y < 0) particle.y = h; if (particle.y > h) particle.y = 0;
                        drawX = particle.x; drawY = particle.y;
                    } else {
                        particle.x += particle.vx * 0.55; particle.y += particle.vy * 0.55;
                        particle.vx *= 0.985; particle.vy *= 0.985;
                        particle.alpha -= 0.007;
                        if (particle.alpha <= 0) this.particles[idx] = this.spawn(false);
                        drawX = particle.x; drawY = particle.y;
                    }
                    ctx.beginPath();
                    ctx.arc(drawX, drawY, particle.size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color.replace('ALPHA', Math.max(0, particle.alpha).toFixed(2));
                    ctx.shadowBlur = p.glow || 0;
                    ctx.shadowColor = p.glowColor || '#fff';
                    ctx.fill();
                });
                this.rafId = requestAnimationFrame(() => this.loop());
            }
            stop() {
                this.active = false;
                if (this.rafId) cancelAnimationFrame(this.rafId);
                this.rafId = null;
                if (this.ctx && this.canvas.width) this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            }
        }

        // === RARITIES DATA MODULE ===
        const RARITIES = {
            ABSOLUTE: { id: 'absolute', name: "Absolute", color: "var(--rarity-absolute)", shadow: "0 0 10px #ff00ff, 0 0 20px #fff", chance: 1/50000000, items: ["The Depth Itself"], canCrush: true, crushYield: 50000000 },
            UNFATHOMABLE: { id: 'unfathomable', name: "Unfathomable", color: "var(--rarity-unfathomable)", shadow: "var(--glow-unfath)", chance: 1/5000000, items: ["Tear of the Abyss", "The Sunken Moon", "Echo of the Genesis"], canCrush: true, crushYield: 5000000 },
            ELDRITCH: { id: 'eldritch', name: "Eldritch", color: "var(--rarity-eldritch)", shadow: "var(--glow-eldritch)", chance: 1/1000000, items: ["The Drowned Crown", "Whispering Obelisk", "Abyssal Leviathan Spine"], canCrush: true, crushYield: 1000000 },
