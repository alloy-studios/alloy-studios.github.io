            LEGENDARY: { id: 'legendary', name: "Legendary", color: "var(--rarity-legendary)", shadow: "none", chance: 1/15000, items: ["Deep-Trench Pearl", "Petrified Kraken Eye", "Ghost Ship Wheel", "Sunken Throne", "Gilded Megalodon Scale"], canCrush: true, crushYield: 50000 },
            EPIC: { id: 'epic', name: "Epic", color: "var(--rarity-epic)", shadow: "none", chance: 1/2000, items: ["Abyssal Angler Lure", "Drowned Sailor's Watch", "Kraken Ink Sac", "Sunken Reliquary", "Cursed Pirate Cutlass", "Bioluminescent Jelly"], canCrush: true, crushYield: 8000 },
            RARE: { id: 'rare', name: "Rare", color: "var(--rarity-rare)", shadow: "none", chance: 1/300, items: ["Leviathan Tooth", "Glowing Isopod", "Intact Captain's Log", "Phosphorescent Algae"], canCrush: true, crushYield: 1000 },
            UNCOMMON: { id: 'uncommon', name: "Uncommon", color: "var(--rarity-uncommon)", shadow: "none", chance: 1/60, items: ["Waterlogged Bone", "Sunken Coin", "Blind Cave Fish", "Rusted Anchor", "Tarnished Compass"], canCrush: true, crushYield: 150 },
            COMMON: { id: 'common', name: "Common", color: "var(--rarity-common)", shadow: "none", chance: 1, items: ["Rusted Scrap", "Dead Kelp", "Waterlogged Boot", "Barnacle Cluster", "Silt Core"], canCrush: false }
        };

        const RARITY_ORDER = [RARITIES.ABSOLUTE, RARITIES.UNFATHOMABLE, RARITIES.ELDRITCH, RARITIES.MYTHIC, RARITIES.LEGENDARY, RARITIES.EPIC, RARITIES.RARE, RARITIES.UNCOMMON];

        const UPGRADES_DEF = {
            winch: { id: 'winch', name: "High-Torque Motor", desc: "Speeds up net descent and recovery operations.", baseCost: 50, costMult: 1.45, baseValue: 5000, valueChange: -300, format: (val) => (val/1000).toFixed(1) + "s Recovery", maxLevel: 15 },
            lures: { id: 'lures', name: "Phosphor-Lures", desc: "Illuminates dark abyssal trenches to attract rarer specimen.", baseCost: 60, costMult: 1.25, baseValue: 1, valueChange: 15.0, format: (val) => val.toFixed(1) + "x Rarity Draw", maxLevel: 50 },
            capacity: { id: 'capacity', name: "Massive Heavy Net", desc: "Structural enhancement to pull multiple payloads concurrently.", baseCost: 250, costMult: 1.80, baseValue: 1, valueChange: 1, format: (val) => val + " Items / Pull", maxLevel: 10 }
        };

        // === CORE ENGINE INTERNALS ===
        class AbyssalDredging {
            constructor() {
                this.inventory = {};
                this.scrapCount = 0;
                this.upgrades = { winch: 0, lures: 0, capacity: 0 };
                this.isDredging = false;
                this.autoDredge = false;
                this.isCutsceneActive = false; 
                this.dredgeStartTime = 0;
                this.currentCooldown = 5000;
                this.animationFrameId = null;

                this.autoScrapEnabled = false;
                this.autoScrapThreshold = 'RARE';
                this.autoSkipCutscenes = false;
                this.cutsceneTimeoutId = null;
                this.skipBtnTimer = null;
                this.cutsceneParticles = new CutsceneParticles(document.getElementById('cutscene-particle-canvas'));

                // Endgame progression: once every upgrade is maxed, players can Descend for a permanent
                // luck bonus, and chase full item discovery — both persist across resets.
                this.lifetimeScrapEarned = 0; // resets each dive; drives Pressure Core payout on Descend
                this.pressureCores = 0;       // permanent, never resets — powers the permanent luck bonus
                this.totalDescents = 0;       // permanent, never resets — drives rank title
                this.discoveredItems = {};    // permanent, never resets — Uncommon+ items ever pulled
                
                this.stormActive = false;
                this.stormTimeLeft = 0;
                this.stormTick = setInterval(() => this.gameTick(), 1000);

                this.loadGame();
                this.initUI();
                this.updateUI();
                this.initSettingsUI();
            }

            // Reflect loaded/saved toggle & dropdown state into the actual DOM controls
            initSettingsUI() {
                const scrapToggle = document.getElementById('auto-scrap-toggle');
                const scrapThreshold = document.getElementById('auto-scrap-threshold');
                const skipToggle = document.getElementById('auto-skip-toggle');
                const skipToggleModal = document.getElementById('auto-skip-toggle-modal');

                scrapToggle.checked = this.autoScrapEnabled;
                scrapThreshold.value = this.autoScrapThreshold;
                scrapThreshold.disabled = !this.autoScrapEnabled;
                skipToggle.checked = this.autoSkipCutscenes;
                skipToggleModal.checked = this.autoSkipCutscenes;
            }
            
            gameTick() {
                if (this.stormActive) {
                    this.stormTimeLeft--;
                    document.getElementById('storm-alert').innerText = `ABYSSAL STORM ACTIVE: LUCK x3 (${this.stormTimeLeft}s)`;
                    if (this.stormTimeLeft <= 0) this.endStorm();
                } else {
                    if (Math.random() < 0.006) {
                        this.startStorm();
                    }
                }
            }

            startStorm() {
                if(this.stormActive) return;
                this.stormActive = true;
                this.stormTimeLeft = 60; 
                
                document.getElementById('storm-alert').classList.add('active');
                document.getElementById('storm-alert').innerText = `ABYSSAL STORM ACTIVE: LUCK x3 (${this.stormTimeLeft}s)`;
                
                if (window.stormController) window.stormController.setHeavyStorm(true);
                if (sfx.isInitialized) sfx.setHeavyStormAudio(true);
                
                this.logEntry("WARNING: ABYSSAL STORM FRONT DETECTED. RARITY RATES SPIKING.", RARITIES.LEGENDARY);
            }

            endStorm() {
                this.stormActive = false;
                document.getElementById('storm-alert').classList.remove('active');
                
                if (window.stormController) window.stormController.setHeavyStorm(false);
                if (sfx.isInitialized) sfx.setHeavyStormAudio(false);
                
                this.logEntry("The abyssal storm has passed.", RARITIES.UNCOMMON);
            }

            saveGame() {
                localStorage.setItem('abyssalSave', JSON.stringify({
                    inventory: this.inventory,
                    scrapCount: this.scrapCount,
                    upgrades: this.upgrades,
                    autoScrapEnabled: this.autoScrapEnabled,
                    autoScrapThreshold: this.autoScrapThreshold,
                    autoSkipCutscenes: this.autoSkipCutscenes,
                    lifetimeScrapEarned: this.lifetimeScrapEarned,
                    pressureCores: this.pressureCores,
                    totalDescents: this.totalDescents,
                    discoveredItems: this.discoveredItems
                }));
            }

            loadGame() {
                const saved = localStorage.getItem('abyssalSave');
                if (saved) {
                    try {
                        const data = JSON.parse(saved);
                        this.inventory = data.inventory || {};
                        this.upgrades = data.upgrades || { winch: 0, lures: 0, capacity: 0 };
                        this.autoScrapEnabled = data.autoScrapEnabled || false;
                        this.autoScrapThreshold = data.autoScrapThreshold || 'RARE';
                        this.autoSkipCutscenes = data.autoSkipCutscenes || false;
                        this.lifetimeScrapEarned = data.lifetimeScrapEarned || 0;
                        this.pressureCores = data.pressureCores || 0;
                        this.totalDescents = data.totalDescents || 0;
                        this.discoveredItems = data.discoveredItems || {};
                        this.recalcScrap(false); // false: restoring, not earning — don't double-count lifetime total
                    } catch(e) { console.error("Save load failure", e); }
                }
            }

            recalcScrap(trackLifetime = true) {
                let total = 0;
                for (let item of RARITIES.COMMON.items) { if (this.inventory[item]) total += this.inventory[item]; }
                if (trackLifetime && total > this.scrapCount) {
                    this.lifetimeScrapEarned = (this.lifetimeScrapEarned || 0) + (total - this.scrapCount);
                }
                this.scrapCount = total;
            }

            findRarity(itemName) {
                for (let key in RARITIES) { if (RARITIES[key].items.includes(itemName)) return RARITIES[key]; }
                return RARITIES.COMMON;
            }

            // Base odds for a single item within its rarity tier (chance is split evenly across that tier's items)
            getItemOdds(itemName, rarity) {
                const r = rarity || this.findRarity(itemName);
                if (!r || r.id === 'common') return { chance: 1, denom: 1 };
                const itemChance = r.chance / r.items.length;
                const denom = Math.max(1, Math.round(1 / itemChance));
                return { chance: itemChance, denom };
            }

            // === ENDGAME PROGRESSION: Pressure Cores (prestige) + the Curator's Collection ===

            // Permanent luck multiplier from all past Descents (+1% per Pressure Core, ever-growing),
            // plus a flat +25% bonus once every collectible item has been discovered at least once.
            getPermanentLuckMult() {
                let mult = 1 + (this.pressureCores * 0.01);
                if (this.isCollectionComplete()) mult *= 1.25;
                return mult;
            }

            getTotalCollectibleCount() {
                return Object.keys(RARITIES).filter(k => k !== 'COMMON').reduce((sum, k) => sum + RARITIES[k].items.length, 0);
            }

            getDiscoveredCount() {
                return Object.keys(this.discoveredItems).length;
            }

            isCollectionComplete() {
                return this.getDiscoveredCount() >= this.getTotalCollectibleCount();
            }

            isFullyUpgraded() {
                return Object.keys(UPGRADES_DEF).every(id => this.upgrades[id] >= UPGRADES_DEF[id].maxLevel);
            }

            // How many Pressure Cores the player would earn by Descending right now, based on this dive's
            // total lifetime scrap earned (spending doesn't reduce it — only new scrap counts).
            getProjectedCores() {
                return Math.floor(Math.sqrt((this.lifetimeScrapEarned || 0) / 400));
            }

            getRankTitle(descents) {
                const d = descents === undefined ? this.totalDescents : descents;
                if (d >= 50) return "Sovereign of the Deep";
                if (d >= 21) return "Leviathan's Peer";
                if (d >= 11) return "Void-Touched";
                if (d >= 6) return "Abyssal Veteran";
                if (d >= 3) return "Trench Walker";
                if (d >= 1) return "Deep Diver";
                return "Surface Dredger";
            }

            getUpgradeValue(id) {
                const def = UPGRADES_DEF[id];
                let val = def.baseValue + (def.valueChange * this.upgrades[id]);
                if (id === 'winch') val = Math.max(500, val);
                return val;
            }

            getUpgradeCost(id) { return Math.floor(UPGRADES_DEF[id].baseCost * Math.pow(UPGRADES_DEF[id].costMult, this.upgrades[id])); }

            buyUpgrade(id) {
                if (this.isCutsceneActive) return; 
                const cost = this.getUpgradeCost(id);
                if (this.scrapCount >= cost && this.upgrades[id] < UPGRADES_DEF[id].maxLevel) {
                    this.deductScrap(cost); this.upgrades[id]++; this.saveGame(); this.updateUI();
                    document.getElementById('rig-section').classList.add('shake');
                    setTimeout(() => document.getElementById('rig-section').classList.remove('shake'), 400);
                }
            }

            deductScrap(amount) {
                let rem = amount;
                for (let item of RARITIES.COMMON.items) {
                    if (rem <= 0) break;
                    if (this.inventory[item]) {
                        if (this.inventory[item] >= rem) { this.inventory[item] -= rem; rem = 0; }
                        else { rem -= this.inventory[item]; this.inventory[item] = 0; }
                        if (this.inventory[item] === 0) delete this.inventory[item];
                    }
                }
                this.recalcScrap();
            }

            crushItem(itemName, rarityId) {
                if (this.isCutsceneActive) return; 
                if (this.inventory[itemName] && this.inventory[itemName] > 0) {
                    this.inventory[itemName]--;
                    if (this.inventory[itemName] === 0) delete this.inventory[itemName];
                    this.inventory["Rusted Scrap"] = (this.inventory["Rusted Scrap"] || 0) + RARITIES[rarityId.toUpperCase()].crushYield;
                    this.recalcScrap(); this.saveGame(); this.updateUI();
                    const listEl = document.getElementById('inventory-list');
                    listEl.style.boxShadow = "inset 0 0 25px rgba(217, 81, 41, 0.4)";
                    setTimeout(() => listEl.style.boxShadow = "none", 250);
                }
            }

            toggleAutoDredge(isChecked) { 
                if (this.isCutsceneActive) return; 
                this.autoDredge = isChecked; 
                if (this.autoDredge && !this.isDredging) this.startDredge(); 
            }

            toggleAutoScrap(isChecked) {
                this.autoScrapEnabled = isChecked;
                document.getElementById('auto-scrap-threshold').disabled = !isChecked;
                if (this.autoScrapEnabled) this.performAutoScrap();
                this.saveGame(); this.updateUI();
            }

            setAutoScrapThreshold(value) {
                this.autoScrapThreshold = value;
                if (this.autoScrapEnabled) this.performAutoScrap();
                this.saveGame(); this.updateUI();
            }

            // Auto-crushes junk items (Uncommon/Rare/Epic tiers, per the chosen threshold) into scrap.
            // Legendary and above are never touched by this, so real finds are always safe.
            performAutoScrap() {
                if (!this.autoScrapEnabled) return;
                const thresholdOrder = ['UNCOMMON', 'RARE', 'EPIC'];
                const thresholdIndex = thresholdOrder.indexOf(this.autoScrapThreshold);
                if (thresholdIndex === -1) return;

                let totalGained = 0;
                let crushedAny = false;

                Object.keys(this.inventory).forEach(itemName => {
                    const rarity = this.findRarity(itemName);
                    const rarityKey = Object.keys(RARITIES).find(k => RARITIES[k] === rarity);
                    const idx = thresholdOrder.indexOf(rarityKey);
                    if (idx === -1 || idx > thresholdIndex || !rarity.canCrush) return;

                    const count = this.inventory[itemName];
                    if (count > 0) {
                        totalGained += count * rarity.crushYield;
                        delete this.inventory[itemName];
                        crushedAny = true;
                    }
                });

                if (crushedAny) {
                    this.inventory["Rusted Scrap"] = (this.inventory["Rusted Scrap"] || 0) + totalGained;
                    this.recalcScrap();
                }
            }

            startDredge() {
                if (this.isDredging || this.isCutsceneActive) return; 
                this.isDredging = true;
                this.currentCooldown = this.getUpgradeValue('winch');
                this.dredgeStartTime = performance.now();
                
                if(sfx.isInitialized) {
                    sfx.playDredge(this.autoDredge, this.currentCooldown);
                }
                
                document.getElementById('dredge-button').classList.add('cooldown');
                document.getElementById('progress-text').innerText = "DISPATCHING NETS...";
                document.getElementById('winch-speed-display').innerText = "Dredging...";
                document.getElementById('winch-speed-display').style.color = "var(--text-alert)";
                
                document.getElementById('winch-drum-spool').className = "winch-wire-coils spool-descending";
                document.getElementById('winch-pulley-wheel').className = "winch-guide-pulley spool-descending";

                const cable = document.getElementById('winch-cable');
                cable.style.transition = `height ${this.currentCooldown / 2000}s ease-in-out`;
                cable.style.height = `120%`;

                document.getElementById('rig-section').classList.add('shake');
                setTimeout(() => document.getElementById('rig-section').classList.remove('shake'), 400);

                this.animationFrameId = requestAnimationFrame((t) => this.dredgeLoop(t));
            }

            dredgeLoop(timestamp) {
                const elapsed = timestamp - this.dredgeStartTime;
                const progress = Math.min(elapsed / this.currentCooldown, 1);
                document.getElementById('progress-bar').style.width = `${progress * 100}%`;
                
                if (progress < 0.5) {
                    document.getElementById('progress-text').innerText = `DESCENDING... (${(progress * 200).toFixed(0)}m)`;
                } else {
                    document.getElementById('progress-text').innerText = `WINCHING UP... (${((1 - progress) * 200).toFixed(0)}m)`;
                    document.getElementById('winch-drum-spool').className = "winch-wire-coils spool-ascending";
                    document.getElementById('winch-pulley-wheel').className = "winch-guide-pulley spool-ascending";
                    const cable = document.getElementById('winch-cable');
                    cable.style.transition = `height ${this.currentCooldown / 2000}s ease-in-out`;
                    cable.style.height = `30%`;
                }

                if (progress >= 1) this.finishDredge();
                else this.animationFrameId = requestAnimationFrame((t) => this.dredgeLoop(t));
            }

            finishDredge() {
                this.isDredging = false;
                document.getElementById('dredge-button').classList.remove('cooldown');
                document.getElementById('progress-bar').style.width = `0%`;
                document.getElementById('progress-text').innerText = "IDLE";
                document.getElementById('winch-speed-display').innerText = "Ready";
                document.getElementById('winch-speed-display').style.color = "var(--rarity-uncommon)";

                document.getElementById('winch-drum-spool').className = "winch-wire-coils";
                document.getElementById('winch-pulley-wheel').className = "winch-guide-pulley";

                document.getElementById('rig-section').classList.add('shake');
                setTimeout(() => document.getElementById('rig-section').classList.remove('shake'), 350);
                
                const capacity = this.getUpgradeValue('capacity');
                let luck = this.getUpgradeValue('lures');
                if (this.stormActive) luck *= 3; 
                luck *= this.getPermanentLuckMult();
                
                const pulls = [];
                for(let i=0; i<capacity; i++) { pulls.push(this.rollRNG(luck)); }

                let triggeredEvent = null;
                let toastEvent = null;
                pulls.forEach(pull => {
                    this.inventory[pull.item] = (this.inventory[pull.item] || 0) + 1;
                    if (pull.rarityKey !== 'COMMON') this.discoveredItems[pull.item] = true;
                    this.logEntry(pull.item, pull.rarity);
                    
                    if (['ABSOLUTE', 'MYTHIC', 'ELDRITCH', 'UNFATHOMABLE'].includes(pull.rarityKey)) {
                        if (!triggeredEvent || pull.rarity.chance < triggeredEvent.rarity.chance) {
                            triggeredEvent = { item: pull.item, rarity: pull.rarity };
                        }
                    } else if (['LEGENDARY', 'EPIC'].includes(pull.rarityKey)) {
                        if (!toastEvent || pull.rarity.chance < toastEvent.rarity.chance) {
                            toastEvent = { item: pull.item, rarity: pull.rarity };
                        }
                    }
                });

                this.performAutoScrap();
                this.recalcScrap(); this.saveGame(); this.updateUI();

                if (triggeredEvent) {
                    this.triggerCutscene(triggeredEvent);
                } else {
                    if (toastEvent) this.showRarityToast(toastEvent.item, toastEvent.rarity);
                    if (this.autoDredge) {
                        setTimeout(() => { if (this.autoDredge && !this.isDredging && !this.isCutsceneActive) this.startDredge(); }, 300);
                    }
                }
            }

            showRarityToast(itemName, rarity, big) {
                const container = document.getElementById('toast-container');
                const odds = this.getItemOdds(itemName, rarity);
                const toast = document.createElement('div');
                toast.className = big ? 'rarity-toast toast-big' : 'rarity-toast';
                toast.style.setProperty('--toast-color', rarity.color);
                toast.innerHTML = `
                    <span class="toast-rarity">${rarity.name} FIND${big ? ' \u2014 AUTO-SKIPPED' : ''}</span>
                    <span class="toast-item">${itemName}</span>
                    <span class="toast-odds">ODDS: 1 in ${odds.denom.toLocaleString()}</span>
                `;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.classList.add('toast-out');
                    setTimeout(() => toast.remove(), 500);
                }, big ? 4500 : 3200);
            }

            rollRNG(luckMultiplier) {
                const roll = Math.random();
                for (let rarity of RARITY_ORDER) {
                    if (roll < (rarity.chance * luckMultiplier)) {
                        const item = rarity.items[Math.floor(Math.random() * rarity.items.length)];
                        return { item, rarity: rarity, rarityKey: Object.keys(RARITIES).find(k => RARITIES[k] === rarity) };
                    }
                }
                return { item: RARITIES.COMMON.items[Math.floor(Math.random() * RARITIES.COMMON.items.length)], rarity: RARITIES.COMMON, rarityKey: 'COMMON' };
            }

            triggerCutscene(eventData) {
                if (this.isCutsceneActive) return;

                // "Always Skip" means never show any part of the overlay — not even a brief flash.
                // The find is still surfaced clearly via a bigger toast so it's never silent/invisible.
                if (this.autoSkipCutscenes) {
                    this.showRarityToast(eventData.item, eventData.rarity, true);
                    if (this.autoDredge && !this.isDredging) this.startDredge();
                    return;
                }

                this.isCutsceneActive = true;

                const gameUI = document.getElementById('game-ui');
                const overlay = document.getElementById('corrupted-overlay');
                const shapes = document.getElementById('corrupted-shapes');
                const text = document.getElementById('corrupted-text');
                const subtext = document.getElementById('corrupted-subtext');
                const controls = document.getElementById('cutscene-controls');
                const emblem = document.getElementById('corrupted-emblem');
                const flash = document.getElementById('corrupted-flash');
                const flashTint = document.getElementById('corrupted-flash-tint');
                const tierBadge = document.getElementById('corrupted-tier-badge');
                const prophecy = document.getElementById('corrupted-prophecy');
                
                const itemClass = eventData.item.toLowerCase().replace(/[^a-z0-9]/g, '-');
                
                overlay.className = ''; shapes.className = ''; text.className = '';
                void overlay.offsetWidth; 

                gameUI.classList.add('corrupted'); 
                overlay.classList.add('active', itemClass);
                overlay.style.setProperty('--cutscene-tint', eventData.rarity.color);
                
                text.style.textShadow = eventData.rarity.shadow; 
                text.style.color = eventData.rarity.color;

                // Rarity tier badge (e.g. "MYTHIC TIER")
                tierBadge.style.color = eventData.rarity.color;
                tierBadge.textContent = eventData.rarity.name + ' TIER';

                // Rune emblem: unique glyph per item, colored to match its rarity
                emblem.style.color = eventData.rarity.color;
                emblem.innerHTML = buildEmblemSVG(itemClass);

                // Reveal flash: hot white core + rarity-colored wash (skipped for The Depth Itself, which has its own bang sequence already)
                flash.classList.remove('burst'); void flash.offsetWidth;
                flashTint.classList.remove('burst'); void flashTint.offsetWidth;
                if (itemClass !== 'the-depth-itself') {
                    flash.classList.add('burst');
                    flashTint.classList.add('burst');
                }

                // Ambient particles matched to this item's mood
                const particlePreset = CUTSCENE_PARTICLE_PRESETS[itemClass];
                if (particlePreset) this.cutsceneParticles.start(particlePreset);
                else this.cutsceneParticles.stop();

                let messages = ["ANOMALY DETECTED"];
                let duration = 5000;

                switch(itemClass) {
                    case 'the-heart-of-the-trench': messages = ["THUMP...", "THUMP...", "THE ABYSS HAS A PULSE"]; duration = 6000; document.getElementById('rig-section').style.animation = "screenShake 0.4s infinite"; break;
                    case 'cursed-figurehead': messages = ["SHE WEEPS SALT WATER", "A CAPTAIN'S REGRET", "THE WOOD GROANS"]; duration = 5000; break;
                    case 'the-drowned-crown': messages = ["BOW TO THE TIDE", "HEAVY IS THE HEAD", "A KINGDOM OF SILT"]; duration = 7000; break;
                    case 'whispering-obelisk': messages = ["/// NON-EUCLIDEAN ERROR ///", "IT SPEAKS IN DEAD TONGUES", "GEOMETRY OF THE DEEP"]; duration = 6000; document.getElementById('rig-section').style.animation = "screenShake 0.1s infinite"; break;
                    case 'tear-of-the-abyss': messages = ["THE OCEAN WEEPS", "A FRACTURE IN REALITY", "SINGULARITY ACHIEVED"]; duration = 10000; document.getElementById('rig-section').style.animation = "screenShake 0.05s infinite"; break;
                    case 'the-sunken-moon': messages = ["IT ILLUMINATES THE DEEP", "A LIGHT IN THE DARKNESS", "THE TIDES OBEY"]; duration = 11000; break;
                    case 'echo-of-the-genesis': messages = ["SYSTEM ERROR: 0x000000", "NULL", "BEGINNING AND END"]; duration = 9000; document.getElementById('rig-section').style.animation = "screenShake 0.05s infinite"; break;
                    case 'abyssal-leviathan-spine': messages = ["THE GIANTS STILL ROAM", "A REMNANT OF THE ANCIENTS", "COLOSSAL DECAY"]; duration = 7000; document.getElementById('rig-section').style.animation = "screenShake 0.8s infinite"; break;
                    case 'phantom-lighthouse': messages = ["IT GUIDES THEM DOWN", "DO NOT FOLLOW THE LIGHT", "LOST AT SEA"]; duration = 6000; break;
                    case 'the-depth-itself': messages = ["I AM THE OCEAN", "THERE IS NO BOTTOM", "YOU HAVE REACHED THE END"]; duration = 18000; document.getElementById('rig-section').style.animation = "screenShake 0.1s infinite"; break;
                }

                if(sfx.isInitialized) {
                    sfx.playCutsceneDrone(eventData.rarity.id, duration);
                }

                // The Depth Itself gets its own name as the huge hero text, with the poetic line
                // demoted to a secondary "prophecy" beneath it. Every other item just shows the phrase.
                if (itemClass === 'the-depth-itself') {
                    text.innerText = eventData.item.toUpperCase();
                    prophecy.textContent = messages[Math.floor(Math.random() * messages.length)];
                    prophecy.style.color = eventData.rarity.color;
                } else {
                    text.innerText = messages[Math.floor(Math.random() * messages.length)];
                    prophecy.textContent = '';
                }

                const odds = this.getItemOdds(eventData.item, eventData.rarity);
                subtext.style.animation = 'none'; void subtext.offsetWidth; subtext.style.animation = '';
                subtext.style.color = eventData.rarity.color;
                subtext.innerText = `${eventData.item}  \u00B7  ODDS: 1 IN ${odds.denom.toLocaleString()}`;

                document.getElementById('log-container').classList.add('preserve-color');

                // Skip button appears after a short beat so the reveal always gets a moment on screen first.
                controls.classList.remove('visible');
                clearTimeout(this.skipBtnTimer);
                this.skipBtnTimer = setTimeout(() => {
                    if (this.isCutsceneActive) controls.classList.add('visible');
                }, 900);

                clearTimeout(this.cutsceneTimeoutId);
                this.cutsceneTimeoutId = setTimeout(() => this.endCutscene(), duration);
            }

            // Shared cleanup for both a natural cutscene end and a manual/auto skip.
            endCutscene() {
                if (!this.isCutsceneActive) return;
                clearTimeout(this.cutsceneTimeoutId);
                clearTimeout(this.skipBtnTimer);
                this.cutsceneTimeoutId = null;

                document.getElementById('game-ui').classList.remove('corrupted'); 
                document.getElementById('corrupted-overlay').classList.remove('active');
                document.getElementById('cutscene-controls').classList.remove('visible');
                document.getElementById('log-container').classList.remove('preserve-color');
                document.getElementById('rig-section').style.animation = "";
                document.getElementById('corrupted-emblem').innerHTML = '';
                document.getElementById('corrupted-tier-badge').textContent = '';
                document.getElementById('corrupted-prophecy').textContent = '';
                document.getElementById('corrupted-flash').classList.remove('burst');
                document.getElementById('corrupted-flash-tint').classList.remove('burst');
                this.cutsceneParticles.stop();
                this.isCutsceneActive = false; 

                if (this.autoDredge && !this.isDredging) {
                    this.startDredge();
                }
            }

            skipCutscene() {
                if (!this.isCutsceneActive) return;
                if (sfx.isInitialized) sfx.stopCutsceneDrone();
                this.endCutscene();
            }

            toggleAutoSkip(isChecked) {
                this.autoSkipCutscenes = isChecked;
                document.getElementById('auto-skip-toggle').checked = isChecked;
                document.getElementById('auto-skip-toggle-modal').checked = isChecked;
                this.saveGame();
            }

            formatCrushYield(amount) {
                if (amount >= 1000000) return (amount / 1000000).toFixed(0) + "M";
                if (amount >= 1000) return (amount / 1000).toFixed(0) + "K";
                return amount;
            }

            initUI() {
                const upCont = document.getElementById('upgrades-container');
                upCont.innerHTML = '';
                Object.values(UPGRADES_DEF).forEach(def => {
                    upCont.innerHTML += `
                        <div class="upgrade-card" id="card-${def.id}">
                            <div class="upgrade-header">
                                <span>${def.name} <span style="font-size: 0.8em; color: var(--text-dim)">Lvl <span id="lvl-${def.id}">0</span></span></span>
                            </div>
                            <div class="upgrade-desc">${def.desc}</div>
                            <div style="color: var(--text-alert); margin-top: 3px; font-size: 0.85rem; font-family: 'Share Tech Mono', monospace;">
                                Output: <span id="val-${def.id}"></span>
                            </div>
                            <div class="upgrade-action">
                                <span class="cost-text">Cost: <span id="cost-${def.id}">0</span> Scrap</span>
                                <button class="btn-upgrade" id="btn-up-${def.id}" onclick="game.buyUpgrade('${def.id}')">Assemble</button>
                            </div>
                        </div>
                    `;
                });
            }

            updateUI() {
                document.getElementById('currency-amount').innerText = this.scrapCount.toLocaleString();
                Object.keys(UPGRADES_DEF).forEach(id => {
                    const def = UPGRADES_DEF[id]; const level = this.upgrades[id]; const cost = this.getUpgradeCost(id);
                    document.getElementById(`lvl-${id}`).innerText = level;
                    document.getElementById(`val-${id}`).innerText = def.format(this.getUpgradeValue(id));
                    const btn = document.getElementById(`btn-up-${id}`);
                    if (level >= def.maxLevel) { document.getElementById(`cost-${id}`).innerText = "MAX"; btn.disabled = true; btn.innerText = "BUILT"; }
                    else { document.getElementById(`cost-${id}`).innerText = cost.toLocaleString(); btn.disabled = this.scrapCount < cost; }
                });

                // Depth status bar: rank title, permanent luck bonus, collection progress, and the Descend button
                document.getElementById('depth-rank-label').innerText = this.getRankTitle();
                document.getElementById('depth-bonus-label').innerText = `+${(this.pressureCores * 1).toFixed(0)}% Permanent Luck`;
                document.getElementById('collection-badge').innerText = `${this.getDiscoveredCount()}/${this.getTotalCollectibleCount()}`;
                document.getElementById('collection-btn').classList.toggle('complete', this.isCollectionComplete());
                document.getElementById('descend-container').classList.toggle('unlocked', this.isFullyUpgraded());
                if (this.isFullyUpgraded()) {
                    document.getElementById('descend-hint').innerText = `Projected: +${this.getProjectedCores().toLocaleString()} Pressure Cores`;
                }

                const invList = document.getElementById('inventory-list'); invList.innerHTML = '';
                const sortedInv = [];
                Object.keys(this.inventory).forEach(itemName => {
                    let itemRarity = RARITIES.COMMON; let rarityKey = 'COMMON';
                    for (let key in RARITIES) { if (RARITIES[key].items.includes(itemName)) { itemRarity = RARITIES[key]; rarityKey = key; break; } }
                    sortedInv.push({ name: itemName, count: this.inventory[itemName], rarity: itemRarity, key: rarityKey });
                });

                sortedInv.sort((a, b) => {
                    const idxA = Object.keys(RARITIES).indexOf(a.key); const idxB = Object.keys(RARITIES).indexOf(b.key);
                    return idxA !== idxB ? idxA - idxB : a.name.localeCompare(b.name);
                });

                sortedInv.forEach(entry => {
                    const canCrush = entry.rarity.canCrush;
                    const displayYield = canCrush ? this.formatCrushYield(entry.rarity.crushYield) : '0';
                    invList.innerHTML += `
                        <div class="inv-item" style="border-left-color: ${entry.rarity.color}">
                            <div class="inv-item-info">
                                <span style="color: ${entry.rarity.color}; text-shadow: ${entry.rarity.shadow === 'none' ? '' : entry.rarity.shadow}">${entry.name}</span>
                                <span class="inv-item-count">x${entry.count.toLocaleString()}</span>
                            </div>
                            ${canCrush ? `<button class="btn-crush" data-item="${entry.name.replace(/"/g, '&quot;')}" data-rarity="${entry.key}" onclick="game.crushItem(this.getAttribute('data-item'), this.getAttribute('data-rarity'))">CRUSH (+${displayYield})</button>` : ''}
                        </div>
                    `;
                });
            }

            logEntry(itemName, rarity) {
                const log = document.getElementById('log-entries'); const entry = document.createElement('div'); entry.className = 'log-entry';
                const time = new Date().toLocaleTimeString('en-US', { hour12: false, hour: "numeric", minute: "numeric", second: "numeric" });
                let oddsHtml = '';
                if (rarity.id !== 'common' && rarity.items.includes(itemName)) {
                    const odds = this.getItemOdds(itemName, rarity);
                    oddsHtml = ` <span class="log-odds">1:${odds.denom.toLocaleString()}</span>`;
                }
                entry.innerHTML = `<span style="color: var(--text-dim)">[${time}]</span> <span style="color: ${rarity.color}; text-shadow: ${rarity.shadow === 'none' ? '1px 1px 0 #000' : rarity.shadow}">${itemName}</span>${oddsHtml}`;
                if (['absolute', 'mythic', 'eldritch', 'unfathomable'].includes(rarity.id)) entry.classList.add('mythic-plus');
                log.prepend(entry);
                if (log.children.length > 30) log.removeChild(log.lastChild);
            }

            // === ODDS TABLE MODAL ===
            openOddsModal() {
                this.renderOddsTable();
                document.getElementById('odds-modal-overlay').classList.add('active');
            }

            closeOddsModal() {
                document.getElementById('odds-modal-overlay').classList.remove('active');
            }

            renderOddsTable() {
                const bodyEl = document.getElementById('odds-modal-body');
                const luckInfo = document.getElementById('odds-modal-luck');

                let luck = this.getUpgradeValue('lures');
                if (this.stormActive) luck *= 3;
                luck *= this.getPermanentLuckMult();
                luckInfo.innerHTML = `Current Luck Multiplier: <strong>${luck.toFixed(1)}x</strong>${this.stormActive ? ' <span style="color:#00aaff">(Abyssal Storm Active)</span>' : ''}${this.pressureCores > 0 ? ` <span style="color:#cc66ff">(includes +${(this.pressureCores * 1).toFixed(0)}% Depth Pressure)</span>` : ''}`;

                const allTiers = [...RARITY_ORDER, RARITIES.COMMON];
                let html = '';
                allTiers.forEach(rarity => {
                    html += `<div class="odds-tier-header" style="color:${rarity.color}; border-color:${rarity.color};">${rarity.name}</div>`;
                    if (rarity.id === 'common') {
                        html += `<div class="odds-row"><span class="odds-item-name" style="color:${rarity.color}">${rarity.items.join(', ')}</span><span class="odds-value">Base Tier</span></div>`;
                    } else {
                        rarity.items.forEach(item => {
                            const base = this.getItemOdds(item, rarity);
                            const effChance = Math.min(1, base.chance * luck);
                            const effDenom = Math.max(1, Math.round(1 / effChance));
                            html += `<div class="odds-row"><span class="odds-item-name" style="color:${rarity.color}">${item}</span><span class="odds-value">1 in ${base.denom.toLocaleString()}<br><span class="odds-effective">now: 1 in ${effDenom.toLocaleString()}</span></span></div>`;
                        });
                    }
                });
                bodyEl.innerHTML = html;
            }

            // === THE ABYSSAL DESCENT (prestige) ===
            openDescendModal() {
                if (!this.isFullyUpgraded()) return;
                const cores = this.getProjectedCores();
                const currentBonus = this.pressureCores * 1;
                const nextBonus = (this.pressureCores + cores) * 1;
                document.getElementById('descend-modal-body').innerHTML = `
                    Your rig is fully mastered — every upgrade built to its limit. There is nothing deeper
                    to build here, only <span class="highlight">further</span> to fall.<br><br>
                    Descending will scuttle this operation: <span class="highlight">scrap, cargo, and every upgrade reset to zero.</span>
                    In exchange, the crushing pressure below permanently strengthens every dive from now on.<br><br>
                    Pressure Cores earned this descent: <span class="highlight">${cores.toLocaleString()}</span><br>
                    Permanent Luck Bonus: <span class="highlight">+${currentBonus}%</span> &rarr; <span class="highlight">+${nextBonus}%</span><br>
                    Rank after descending: <span class="highlight">${this.getRankTitle(this.totalDescents + 1)}</span>
                `;
                document.getElementById('descend-modal-overlay').classList.add('active');
            }

            closeDescendModal() {
                document.getElementById('descend-modal-overlay').classList.remove('active');
            }

            confirmDescend() {
                if (!this.isFullyUpgraded()) return;
                const coresEarned = this.getProjectedCores();

                this.pressureCores += coresEarned;
                this.totalDescents += 1;

                // Reset everything resettable — the collection log and permanent stats above are untouched.
                this.inventory = {};
                this.scrapCount = 0;
                this.lifetimeScrapEarned = 0;
                this.upgrades = { winch: 0, lures: 0, capacity: 0 };

                this.closeDescendModal();
                this.saveGame();
                this.updateUI();

                const log = document.getElementById('log-entries');
                const entry = document.createElement('div');
                entry.className = 'log-entry mythic-plus';
                entry.innerHTML = `<span style="color:#cc66ff; text-shadow: 0 0 12px #cc66ff, 0 0 24px #fff;">\u2693 DESCENDED — Rank: ${this.getRankTitle()} · +${coresEarned.toLocaleString()} Pressure Cores (permanent +${(this.pressureCores*1).toFixed(0)}% Luck)</span>`;
                log.prepend(entry);
            }

            // === CURATOR'S COLLECTION ===
            openCollectionModal() {
                this.renderCollection();
                document.getElementById('collection-modal-overlay').classList.add('active');
            }

            closeCollectionModal() {
                document.getElementById('collection-modal-overlay').classList.remove('active');
            }

            renderCollection() {
                const found = this.getDiscoveredCount();
                const total = this.getTotalCollectibleCount();
                const pct = total > 0 ? Math.round((found / total) * 100) : 0;

                document.getElementById('collection-progress').innerHTML = `
                    ${found} / ${total} Discovered (${pct}%)${this.isCollectionComplete() ? ' — <span style="color:#00ffaa">COMPLETE, +25% permanent Luck active</span>' : ''}
                    <div class="collection-progress-bar-track"><div class="collection-progress-bar-fill" style="width:${pct}%"></div></div>
                `;

                const grid = document.getElementById('collection-grid');
                let html = '';
                Object.keys(RARITIES).filter(k => k !== 'COMMON').forEach(key => {
                    const rarity = RARITIES[key];
                    rarity.items.forEach(item => {
                        const isFound = !!this.discoveredItems[item];
                        html += `<div class="collection-item ${isFound ? 'found' : 'locked'}" style="color:${rarity.color}" title="${isFound ? item : 'Undiscovered'}">
                            <span class="ci-icon">${isFound ? '\u2713' : '\u2753'}</span>
                            <span class="ci-name">${isFound ? item : '???'}</span>
                        </div>`;
                    });
                });
                grid.innerHTML = html;
            }
        }

        const game = new AbyssalDredging();

    </script>
</body>
</html>
