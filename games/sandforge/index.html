<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
/* Alloy Studios home check - keep this the FIRST script in <head>. */
(function () {
  var GAME = "sandforge";                                 // this game's id on the site
  var h = location.hostname;
  var home = h === "alloy-studios.github.io" || h === "localhost" || h === "127.0.0.1" || location.protocol === "file:";
  var stranger = false;
  try { stranger = window.top !== window.self && window.top.location.hostname !== h; }
  catch (e) { stranger = true; }                             // can't read the parent: someone else's page
  if (home && !stranger) return;
  var url = "https://alloy-studios.github.io/" + GAME + "/";
  document.documentElement.innerHTML =
    '<head><meta charset="utf-8"><title>Alloy Studios</title></head>' +
    '<body style="margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;' +
    'background:#0b0d14;color:#eef1f7;font:16px/1.5 system-ui,sans-serif;text-align:center">' +
    '<div><p style="margin:0 0 10px;font-size:22px;font-weight:700">This game is by Alloy Studios</p>' +
    '<p style="margin:0 0 24px;color:#9aa3b8">You’re playing an unofficial copy. The real one is free.</p>' +
    '<a href="' + url + '" target="_top" rel="noopener" style="display:inline-block;padding:11px 22px;' +
    'border-radius:999px;background:#7c5cff;color:#fff;text-decoration:none;font-weight:600">' +
    'Play it at alloy-studios.github.io</a></div></body>';
  if (window.stop) window.stop();                            // stop the rest of the page loading
  throw new Error("Alloy Studios: not on the home site");
})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sandforge</title>
<meta name="description" content="A falling-sand sandbox where everything runs on real physics: heat, pressure, chemistry, electricity, gravity and light.">
<style>body{margin:0}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Silkscreen:wght@400;700&display=swap">
<style>
  /* Layout: instrument-panel shell around one large pixel canvas. Header controls, scenario strip,
     canvas + side readouts, element palette docked underneath. Single dark theme on purpose. */
  :root {
    --bg: #0d0f12; --well: #07080a; --panel: #14171c; --panel-2: #1b1f26; --line: #262b34; --line-2: #353b47;
    --fg: #ebe6da; --muted: #959ba6; --faint: #6a707b;
    --accent: #e5c07b; --accent-ink: #1c1608;
    --good: #7ed492; --warn: #f2b33d; --danger: #ff6352; --idle: #8a93a3;
    --f-mark: 'Silkscreen', ui-monospace, monospace;
    --f-ui: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
    --f-num: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 14px; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { height: 100%; display: flex; flex-direction: column; gap: 8px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* header */
  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
  .brand b { font-family: var(--f-mark); font-weight: 700; font-size: 22px; letter-spacing: .06em; color: var(--accent); line-height: 1; }
  .brand span { color: var(--faint); font-size: 13px; white-space: nowrap; }
  .group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .group-label { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--faint); margin-right: 4px; }
  .btn { height: 30px; padding: 0 11px; border-radius: 4px; border: 1px solid var(--line-2); background: var(--panel-2); cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .btn:hover { border-color: var(--faint); }
  .btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.danger { border-color: #6b2b25; color: #ffb1a8; }
  .btn.danger:hover { background: #3a1714; }
  .btn svg { width: 14px; height: 14px; }
  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 4px; overflow: hidden; }
  .seg .btn { border: 0; border-radius: 0; height: 28px; }
  .seg .btn + .btn { border-left: 1px solid var(--line-2); }
  input[type="range"] { accent-color: var(--accent); width: 110px; }
  .val { font-family: var(--f-num); font-size: 12px; color: var(--muted); min-width: 2.2em; text-align: right; font-variant-numeric: tabular-nums; }

  /* scenarios */
  .scen { display: flex; gap: 6px; align-items: center; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
  .scen .group-label { flex: none; }
  .chip { flex: none; height: 28px; padding: 0 12px; border-radius: 14px; border: 1px solid var(--line-2); background: transparent; cursor: pointer; font-weight: 600; letter-spacing: .01em; }
  .chip:hover { border-color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--panel-2); border-color: var(--accent); color: var(--accent); }

  .menu-wrap { position: relative; }
  .menu { position: absolute; right: 0; top: 36px; z-index: 20; width: min(340px, calc(100vw - 32px)); max-height: 70vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line-2); border-radius: 6px; padding: 6px; box-shadow: 0 14px 36px rgba(0, 0, 0, .55); display: flex; flex-direction: column; gap: 2px; }
  .menu button { text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 4px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
  .menu button:hover, .menu button:focus-visible { background: var(--panel-2); }
  .menu b { font-weight: 700; font-size: 14px; }
  .menu span { color: var(--muted); font-size: 12.5px; line-height: 1.35; }

  /* stage */
  .stage { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px; grid-template-rows: minmax(0, 1fr) auto; gap: 10px; }
  .stage > .viewport { grid-column: 1; grid-row: 1; }
  .stage > .palette { grid-column: 1; grid-row: 2; min-width: 0; }
  .stage > .side { grid-column: 2; grid-row: 1 / span 2; }
  .viewport { position: relative; min-height: 0; min-width: 0; background: var(--well); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; display: grid; place-items: center; }
  .stack { position: relative; touch-action: none; }
  .stack canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #cv, #glow { image-rendering: pixelated; image-rendering: crisp-edges; }
  #glow { mix-blend-mode: screen; pointer-events: none; opacity: .95; }
  #ov { cursor: crosshair; }
  .hud { position: absolute; font-family: var(--f-num); font-size: 11px; color: var(--muted); background: rgba(7, 8, 10, .72); padding: 4px 8px; border-radius: 3px; pointer-events: none; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hud.tl { top: 8px; left: 8px; color: var(--fg); }
  .hud.tr { top: 8px; right: 8px; }
  .hud.bl { bottom: 8px; left: 8px; color: var(--faint); font-family: var(--f-ui); font-size: 12px; }
  .hud .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
  .paused-tag { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); font-family: var(--f-mark); font-size: 12px; letter-spacing: .12em; color: var(--accent-ink); background: var(--accent); padding: 3px 10px; border-radius: 3px; pointer-events: none; }

  /* side panel */
  .side { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow-y: auto; scrollbar-width: thin; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--faint); }
  .card h2 { margin: 0; font-family: var(--f-mark); font-weight: 400; font-size: 17px; letter-spacing: .03em; text-wrap: balance; }
  .card p { margin: 0; color: var(--muted); line-height: 1.45; }
  .ctrl { display: flex; flex-direction: column; gap: 4px; }
  .ctrl-row { display: flex; align-items: center; gap: 8px; }
  .ctrl-row label { flex: 1; font-weight: 500; }
  .ctrl input[type="range"] { width: 100%; }
  .ctrls { display: flex; flex-direction: column; gap: 10px; }
  .ctrls .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .stats { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; margin: 0; padding-top: 10px; border-top: 1px solid var(--line); }
  .stats dt { color: var(--muted); }
  .stats dd { margin: 0; font-family: var(--f-num); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
  .tone { display: inline-block; padding: 1px 7px; border-radius: 3px; font-family: var(--f-ui); font-weight: 700; font-size: 12px; letter-spacing: .04em; }
  .tone.good { background: rgba(126, 212, 146, .14); color: var(--good); }
  .tone.warn { background: rgba(242, 179, 61, .14); color: var(--warn); }
  .tone.danger { background: rgba(255, 99, 82, .16); color: var(--danger); }
  .tone.idle { background: rgba(138, 147, 163, .14); color: var(--idle); }
  .el-head { display: flex; align-items: center; gap: 10px; }
  .el-head h3 { margin: 0; font-size: 18px; font-weight: 700; flex: 1; min-width: 0; }
  .state-chip { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); border: 1px solid var(--line-2); border-radius: 3px; padding: 1px 6px; }
  .props { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 13px; }
  .props dt { color: var(--faint); }
  .props dd { margin: 0; font-family: var(--f-num); font-size: 12px; color: var(--fg); }
  .keys { font-size: 12.5px; color: var(--faint); line-height: 1.6; }
  .keys kbd { font-family: var(--f-num); font-size: 11px; color: var(--muted); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; }

  /* palette */
  .palette { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 8px; }
  .cats { display: flex; gap: 2px; align-items: center; overflow-x: auto; scrollbar-width: thin; }
  .cat { flex: none; height: 28px; padding: 0 10px; border: 0; border-bottom: 2px solid transparent; background: none; cursor: pointer; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
  .cat:hover { color: var(--fg); }
  .cat[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .search { margin-left: auto; flex: none; height: 28px; width: 160px; padding: 0 10px; border-radius: 4px; border: 1px solid var(--line-2); background: var(--well); }
  .els { display: flex; flex-wrap: wrap; gap: 5px; max-height: 104px; overflow-y: auto; scrollbar-width: thin; align-content: flex-start; }
  .elb { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px 0 4px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); cursor: pointer; font-weight: 500; font-size: 13.5px; }
  .elb:hover { border-color: var(--faint); }
  .elb .sw { width: 22px; height: 22px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .1), inset 0 -6px 8px rgba(0, 0, 0, .25); }
  .elb[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .empty-note { color: var(--faint); padding: 6px 2px; }

  .linkish { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; align-self: flex-start; }
  .btn.primary:hover { filter: brightness(1.08); }

  /* directory */
  .dir { width: min(1040px, calc(100vw - 32px)); height: min(760px, calc(100dvh - 32px)); max-width: none; max-height: none; padding: 0; border: 1px solid var(--line-2); border-radius: 8px; background: var(--panel); color: var(--fg); box-shadow: 0 24px 60px rgba(0, 0, 0, .6); }
  .dir::backdrop { background: rgba(4, 5, 7, .72); }
  .dir-shell { height: 100%; display: flex; flex-direction: column; min-height: 0; }
  .dir-top { display: flex; align-items: center; gap: 12px; padding: 12px 14px 0; }
  .dir-top h2 { margin: 0; font-family: var(--f-mark); font-weight: 400; font-size: 18px; letter-spacing: .04em; color: var(--accent); }
  .dir-count { color: var(--faint); font-size: 13px; margin-right: auto; }
  .dir-tools { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .dir-tools .search { margin: 0; flex: 1 1 200px; width: auto; height: 30px; }
  .dir-main { flex: 1; min-height: 0; display: grid; grid-template-columns: 260px minmax(0, 1fr); }
  .dir-list { overflow-y: auto; scrollbar-width: thin; border-right: 1px solid var(--line); padding: 6px; display: flex; flex-direction: column; gap: 1px; }
  .dir-cat { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--faint); padding: 10px 8px 4px; }
  .dir-item { display: flex; align-items: center; gap: 8px; text-align: left; background: none; border: 0; border-radius: 4px; padding: 5px 8px; cursor: pointer; font-weight: 500; }
  .dir-item:hover { background: var(--panel-2); }
  .dir-item[aria-current="true"] { background: var(--panel-2); box-shadow: inset 2px 0 0 var(--accent); }
  .dir-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dir-item .tag { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--warn); border: 1px solid rgba(242, 179, 61, .4); border-radius: 3px; padding: 0 5px; }
  .sw { display: inline-block; flex: none; width: 16px; height: 16px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .1); }
  .sw.big { width: 34px; height: 34px; border-radius: 5px; }
  .dir-body { overflow-y: auto; scrollbar-width: thin; padding: 16px 18px 22px; display: flex; flex-direction: column; gap: 12px; }
  .dir-body > p { margin: 0; color: var(--muted); line-height: 1.5; max-width: 68ch; }
  .dir-body .el-head h3 { font-size: 22px; }
  .dir-where { color: var(--faint); font-size: 13px; margin-top: -6px; }
  .dir-sec { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 7px; }
  .dir-sec h4 { margin: 0 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--faint); font-weight: 600; }
  .dir-sec .props { grid-template-columns: max-content 1fr; }
  .dir-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--muted); line-height: 1.4; }
  .dir-row .lab { color: var(--fg); }
  .dir-row.muted { color: var(--faint); }
  .echip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px 0 4px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); cursor: pointer; font-weight: 500; font-size: 13px; }
  .echip:hover { border-color: var(--faint); }
  .echip:disabled { cursor: default; color: var(--faint); }
  @media (max-width: 700px) {
    .dir { width: calc(100vw - 16px); height: calc(100dvh - 16px); }
    .dir-main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 38% minmax(0, 1fr); }
    .dir-list { border-right: 0; border-bottom: 1px solid var(--line); }
    .dir-count { display: none; }
  }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 4px; font-weight: 600; pointer-events: none; opacity: 0; transition: opacity .2s; }
  .toast.show { opacity: 1; }

  @media (max-width: 860px) {
    .app { height: auto; min-height: 100%; }
    .stage { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; }
    .stage > .viewport, .stage > .palette, .stage > .side { grid-column: 1; grid-row: auto; }
    .viewport { aspect-ratio: 16 / 9; max-width: 100%; }
    .side { overflow: visible; order: 3; }
    .palette { order: 2; }
    .brand span { display: none; }
    .search { width: 120px; }
    .hud.bl { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><b>SANDFORGE</b><span>falling-sand physics lab</span></div>
    <div class="group">
      <button class="btn" id="play" aria-pressed="false" title="Pause or resume (Space)"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg><span>Pause</span></button>
      <button class="btn" id="stepb" title="Advance one tick (.)">Step</button>
      <div class="seg" role="group" aria-label="Simulation speed" id="speed">
        <button class="btn" data-speed="0.5">½×</button><button class="btn" data-speed="1" aria-pressed="true">1×</button><button class="btn" data-speed="2">2×</button><button class="btn" data-speed="4">4×</button>
      </div>
    </div>
    <div class="group">
      <span class="group-label">Brush</span>
      <input type="range" id="brush" min="0" max="16" value="3" aria-label="Brush size">
      <span class="val" id="brushv">3</span>
      <button class="btn" id="shape" title="Brush shape">Round</button>
      <button class="btn" id="replace" aria-pressed="false" title="Overwrite existing material">Replace</button>
    </div>
    <div class="group">
      <div class="seg" role="group" aria-label="View mode" id="view">
        <button class="btn" data-view="normal" aria-pressed="true">Normal</button><button class="btn" data-view="thermal">Thermal</button>
      </div>
      <button class="btn" id="dirBtn" title="Every element, how it is made and what it reacts with (D)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 3.2c1.8-.9 3.7-.9 5.5.4v9.6c-1.8-1.3-3.7-1.3-5.5-.4zM13.5 3.2c-1.8-.9-3.7-.9-5.5.4v9.6c1.8-1.3 3.7-1.3 5.5-.4z" stroke-linejoin="round"/></svg>Directory</button>
      <button class="btn" id="save">Save</button>
      <button class="btn" id="load">Load</button>
      <button class="btn" id="clear">Clear</button>
      <div class="menu-wrap">
        <button class="btn" id="presetsBtn" aria-haspopup="true" aria-expanded="false">Presets ▾</button>
        <div class="menu" id="presetMenu" role="menu" hidden></div>
      </div>
    </div>
  </header>



  <main class="stage">
    <section class="viewport" id="viewport">
      <div class="stack" id="stack">
        <canvas id="cv"></canvas>
        <canvas id="glow"></canvas>
        <canvas id="ov"></canvas>
      </div>
      <div class="hud tl" id="hover">Hover the canvas to inspect</div>
      <div class="hud tr" id="perf">Starting…</div>
      <div class="hud bl" id="hint">Drag to draw · right-drag to erase · Shift-click for lines · wheel for brush size</div>
      <div class="paused-tag" id="pausedTag" hidden>PAUSED</div>
    </section>
    <aside class="side">
      <section class="card" id="scenario"></section>
      <section class="card" id="elinfo"></section>
      <section class="card">
        <div class="eyebrow">Controls</div>
        <div class="keys"><kbd>Space</kbd> pause · <kbd>.</kbd> step · <kbd>T</kbd> thermal · <kbd>[</kbd> <kbd>]</kbd> brush · <kbd>E</kbd> eraser · <kbd>Q</kbd> pick under cursor · <kbd>D</kbd> directory · <kbd>L</kbd> labels</div>
      </section>
    </aside>
    <footer class="palette">
      <div class="cats" role="tablist" aria-label="Element categories" id="cats">
        <input class="search" id="search" type="search" placeholder="Search elements" aria-label="Search elements">
      </div>
      <div class="els" id="els"></div>
    </footer>
  </main>
</div>
<dialog class="dir" id="directory" aria-labelledby="dirTitle">
  <div class="dir-shell">
    <header class="dir-top">
      <h2 id="dirTitle">Directory</h2>
      <span class="dir-count" id="dirCount"></span>
      <button class="btn" id="dirClose" type="button" aria-label="Close directory">Close</button>
    </header>
    <div class="dir-tools">
      <input class="search" id="dirSearch" type="search" placeholder="Search every element" aria-label="Search every element">
      <div class="seg" role="group" aria-label="Show" id="dirFilter">
        <button class="btn" data-f="all" aria-pressed="true">All</button><button class="btn" data-f="toolbar" aria-pressed="false">In toolbar</button><button class="btn" data-f="made" aria-pressed="false">From reactions</button>
      </div>
    </div>
    <div class="dir-main">
      <nav class="dir-list" id="dirList" aria-label="Elements"></nav>
      <article class="dir-body" id="dirBody"></article>
    </div>
  </div>
</dialog>
<div class="toast" id="toast" role="status"></div>
<script>
// Sandforge element table. Units: density kg/m3, temperatures in degrees C.
(function (G) {
  'use strict';

    { key: 'turbine', name: 'Turbine', cat: 'machine', state: SOLID, col: ['#9aa3ad', '#6d7681'], tex: 'turbine', dens: 7000, cond: .5, hard: .9, anchor: 1, elec: 1, beh: 'turbine', desc: 'Hot steam flowing past it spins it up and sends sparks down a wire.' },
    { key: 'fan', name: 'Fan', cat: 'machine', state: SOLID, col: ['#8a96a3', '#5c6670'], tex: 'teeth', dens: 7000, cond: .3, hard: .9, anchor: 1, beh: 'fan', desc: 'Blows particles and gas straight upward.' },
    { key: 'pump', name: 'Pump ▲', cat: 'machine', state: SOLID, col: ['#3f7fb0', '#2c5f88'], tex: 'pipe', dens: 7000, cond: .4, hard: .9, anchor: 1, beh: 'pump', desc: 'A pumped pipe running upward. Liquid touching the bottom end comes out of the top end.' },
    { key: 'pumpL', name: 'Pump ◀', cat: 'machine', state: SOLID, col: ['#3f7fb0', '#2c5f88'], tex: 'pipe', dir: -1, dens: 7000, cond: .4, hard: .9, anchor: 1, beh: 'pump', desc: 'A pumped pipe running left. Liquid touching the right end comes out of the left end.' },
    { key: 'pumpR', name: 'Pump ▶', cat: 'machine', state: SOLID, col: ['#3f7fb0', '#2c5f88'], tex: 'pipe', dir: 1, dens: 7000, cond: .4, hard: .9, anchor: 1, beh: 'pump', desc: 'A pumped pipe running right. Liquid touching the left end comes out of the right end.' },

    // ---------- nuclear ----------
    { key: 'uranium', name: 'Uranium', cat: 'nuclear', state: SOLID, col: ['#4f8a3a', '#5a9a42', '#46803a'], tex: 'metal', glow: .12, dens: 19000, cond: .45, hard: .8, rad: .0001, fiss: .22, fast: .12, critical: 1, life: [2600, 2600], hi: [2400, 'corium', .1], desc: 'Reactor fuel. Water slows its neutrons enough to keep a chain going; enough of it in water goes critical, flashes and blows itself apart. Melts at 2,400 °C. Seal it in a metal shell and flood it with neutrons: they bounce around inside, the chain runs away, and once the core passes 500 °C it goes nuclear.' },
    { key: 'plutonium', repose: 35, pd: 19800, gs: 2, name: 'Plutonium', cat: 'nuclear', state: POWDER, col: ['#6e7d8a', '#7b8a96', '#65737f'], glow: .1, dens: 19800, cond: .4, slide: .3, rad: .0002, fiss: .2, fast: .17, critical: 1, life: [2600, 2600], hi: [2400, 'corium', .1], desc: 'Splits even with fast neutrons. A large enough pile goes critical: a flash of radiation and heat blows it apart, like a real criticality accident. Seal it in a metal shell and flood it with neutrons: they bounce around inside, the chain runs away, and once the core passes 500 °C it goes nuclear.' },
    { key: 'spent', name: 'Spent Fuel', cat: 'nuclear', state: SOLID, col: ['#3d4a3a', '#45523f', '#384434'], tex: 'metal', dens: 18000, cond: .4, hard: .8, gam: .0006, hi: [2400, 'corium', .1], desc: 'Burned-out fuel. No longer fissile but still hot with gamma rays.' },
    { key: 'rod', name: 'Control Rod', cat: 'nuclear', state: SOLID, col: ['#2a2f38', '#343a44', '#262a32'], tex: 'metal', dens: 2520, cond: .3, hard: .8, anchor: 1, absorb: .55, desc: 'Boron carbide. Soaks up neutrons; insert it to slow a reactor down.' },
    { key: 'graphite', name: 'Graphite', cat: 'nuclear', state: SOLID, col: ['#2b2b2e', '#353538', '#232326'], dens: 2200, cond: .4, hard: .5, brk: 'coal', mod: .25, absorb: .002, ign: 1200, fuel: 2500, burnTo: 'ash', burnMax: 1600, desc: 'Moderator. Slows neutrons without absorbing them. Burns if it gets too hot.' },
    { key: 'corium', name: 'Corium', cat: 'nuclear', state: LIQUID, col: ['#ffea6a', '#ffd23f', '#fff3a0'], glow: 1, dens: 9000, cond: .4, temp: 2800, disp: 1, visc: .1, drag: 40, rad: .0005, fiss: .05, fast: .5, gam: .0015, life: [800, 800], lo: [1300, 'spent', .02], desc: 'Molten reactor core. Radioactive lava that melts through floors.' },
    { key: 'fallout', repose: 36, pd: 2000, gs: .6, vair: 2, name: 'Fallout', cat: 'nuclear', state: POWDER, col: ['#7d8a5a', '#6e7a4f', '#8c9963'], dens: 1500, cond: .1, slide: .5, gam: .0008, beh: 'decay', desc: 'Radioactive dust from a detonation. Slowly decays to ash.' },

    // ---------- life ----------
    { key: 'seed', repose: 30, pd: 1100, gs: 3, name: 'Seed', cat: 'life', state: POWDER, col: ['#a37b3c', '#8e6a30', '#b88a44'], dens: 1100, cond: .1, slide: .4, ign: 200, fuel: 10, burnTo: 'ash', beh: 'seed', rkill: 'ash', desc: 'Sprouts into a flowering plant when it lands on soil.' },
    { key: 'stem', name: 'Plant', cat: 'life', state: SOLID, col: ['#3f8f3a', '#357f31', '#4a9c43'], dens: 800, cond: .1, hard: .2, brk: 'ash', ign: 220, fuel: 70, burnTo: 'ash', beh: 'plant', rkill: 'ash', desc: 'Growing stem. Branches, leafs out and flowers.' },
    { key: 'leaf', name: 'Leaves', cat: 'life', state: SOLID, col: ['#4caf3e', '#5dbd4c', '#3e9a33', '#66c454'], dens: 600, cond: .1, hard: .1, ign: 200, fuel: 25, burnTo: 'ash', rkill: 'ash', desc: 'Foliage. Burns quickly.' },
    { key: 'flower', name: 'Flower', cat: 'life', state: SOLID, col: ['#ff5f8f', '#ffd23f', '#b07cff', '#ff8a3d', '#ffffff', '#ff4060'], dens: 600, cond: .1, hard: .1, ign: 200, fuel: 10, burnTo: 'ash', rkill: 'ash', desc: 'A bloom at the top of a fully grown plant.' },
    { key: 'grass', name: 'Grass', cat: 'life', state: SOLID, col: ['#58b33e', '#4aa233', '#6cc44f', '#3f9a2c'], dens: 900, cond: .1, hard: .1, brk: 'dirt', ign: 180, fuel: 20, burnTo: 'ash', beh: 'grass', rkill: 'dirt', desc: 'Spreads over exposed dirt.' },
    { key: 'fish', pd: 1000, gs: 3, name: 'Fish', cat: 'life', state: POWDER, col: ['#ff8a2e', '#ffa24a', '#f07a20'], dens: 1000, cond: .2, slide: .3, beh: 'fish', hi: [45, 'deadfish', .05], rkill: 'deadfish', desc: 'Swims in fresh or salt water. Suffocates on land and dies above 45 °C.' },
    { key: 'deadfish', repose: 30, pd: 1050, gs: 4, name: 'Dead Fish', cat: 'life', state: POWDER, col: ['#a8826a', '#9a7660'], dens: 1050, cond: .2, slide: .3, ign: 250, fuel: 30, burnTo: 'ash', desc: 'No longer swimming.' },
    { key: 'ant', pd: 1100, gs: 3, name: 'Ant', cat: 'life', state: POWDER, col: ['#2a1a12', '#3a241a', '#1e120c'], dens: 1100, cond: .1, slide: .2, beh: 'ant', hi: [60, 'ash', .1], rkill: 'ash', desc: 'Walks, climbs and tunnels through dirt and sand.' },

    // ---------- food ----------
    { key: 'wheat', repose: 22, pd: 1300, gs: 3, name: 'Wheat', cat: 'food', state: POWDER, col: ['#e3c25a', '#d4b04a', '#ecd27a', '#c9a23e'], dens: 750, cond: .1, slide: .5, ign: 230, fuel: 30, burnTo: 'ash', grind: 'flour', desc: 'Harvested grain. Run it through a grinder to make flour.' },
    { key: 'flour', pd: 1500, gs: .4, vair: 1.2, name: 'Flour', cat: 'food', state: POWDER, col: ['#f4efe4', '#ebe4d4', '#faf6ee'], dens: 600, cond: .05, slide: .35, ign: 330, exp: [2, .5], desc: 'Milled wheat. Mixes with water into dough. Airborne flour dust can explode.' },
    { key: 'dough', pd: 1100, gs: 4, name: 'Dough', cat: 'food', state: POWDER, col: ['#efd9a6', '#e8cf98', '#f4e1b4'], dens: 1100, cond: .15, slide: .12, hi: [140, 'bread', .045], desc: 'Bakes into bread after a while above 140 °C.' },
    { key: 'bread', pd: 300, gs: 5, name: 'Bread', cat: 'food', state: POWDER, col: ['#c98a3e', '#b97a33', '#d6994c', '#a86a2a'], dens: 400, cond: .08, slide: .2, hi: [290, 'toast', .01], desc: 'Freshly baked. Leave it in the oven too long and it burns.' },
    { key: 'toast', pd: 300, gs: 5, name: 'Burnt Toast', cat: 'food', state: POWDER, col: ['#4a2e18', '#3b2412', '#2e1c0e'], dens: 400, cond: .08, slide: .2, ign: 360, fuel: 60, burnTo: 'ash', desc: 'Overbaked bread. Eventually catches fire.' },

    // ---------- special ----------
    { key: 'sun', name: 'Sun', cat: 'special', state: SOLID, col: ['#fff6c8', '#ffe27a', '#ffd23f', '#fff0a0'], glow: 1, dens: 1400, cond: .4, temp: 5500, hard: 60, anchor: 1, beh: 'star', desc: 'A star burning at 5,500 °C. It swallows whatever touches it and grows. Fusion slowly builds a dead iron core in its middle, and big stars burn far faster: a small star lasts many minutes, a huge one under a minute. Feeding it metal speeds this up. When about a twelfth of the star is dead core, it collapses: a small star goes supernova and leaves a neutron star, a big one (500+ cells) leaves a black hole circled by a glowing disk of its own spinning remains, and a giant (2,000+ cells) falls straight into a black hole.' },
    { key: 'starcore', name: 'Dead Star Core', cat: 'special', state: SOLID, col: ['#c8502a', '#a83f20', '#e0683a'], glow: .7, dens: 8000, cond: .4, temp: 4000, hard: 60, anchor: 1, beh: 'star', desc: 'Metal a star has swallowed but cannot fuse. Enough of it makes the star collapse.' },
    { key: 'neutronstar', name: 'Neutron Star', cat: 'special', state: SOLID, col: ['#e6f2ff', '#cfe4ff', '#ffffff'], glow: 1, dens: 1e9, cond: .5, temp: 9000, hard: 99, anchor: 1, beh: 'neutronstar', desc: 'The crushed core left by a supernova: tiny, hot and immensely dense. Matter falling onto it hits the surface at a large fraction of light speed and flashes white-hot; past 40 cells it collapses into a black hole.' },
    { key: 'nebula', name: 'Nebula', cat: 'special', state: GAS, col: ['#ff4fa3', '#b44bff', '#4fd6ff', '#ff8a3d', '#7a5cff', '#3fffc8'], alpha: .55, glow: .45, dens: 1.22, cond: .02, temp: 400, beh: 'fade', life: [700, 1400], desc: 'Glowing clouds of gas blown off a star. Supernovae leave great drifting nebulae behind.' },
    { key: 'blackhole', name: 'Black Hole', cat: 'special', state: SOLID, col: ['#000000'], dens: 1e9, cond: .001, hard: 99, anchor: 1, beh: 'blackhole', desc: 'Its cells are the event horizon: whatever crosses it is gone. Its gravity is real orbital physics. Matter dropped straight at it falls straight in. Matter arriving sideways (thrown past it, or the spinning remains of a star that collapsed into it) swings into orbit and rubs against itself, which heats it white-hot and lets it spiral inward. Light passing within 2.6 horizon radii is captured, making the black shadow; the thin photon ring around it only lights up when hot matter is there.' },

    // Everything below was added later. New elements go on the end so saved games keep their element numbers.
    // ---------- land ----------
    { key: 'clay', repose: 44, pd: 2600, gs: .2, vair: 4, pores: [45, 38, .003, .05], coh: .98, name: 'Clay', cat: 'land', state: POWDER, col: ['#a86f4e', '#9c6445', '#b47a57', '#93603f'], dens: 1700, cond: .15, slide: .4, hi: [1000, 'brick', .01], desc: 'Very fine mineral grains. Soaks up water but barely lets it through, so it holds ponds; damp clay sticks together. Fired above 1,000 °C it turns into brick.' },
    { key: 'limestone', name: 'Limestone', cat: 'land', state: SOLID, col: ['#d8cfb4', '#cdc4a8', '#e2dac2', '#c4bb9e'], tex: 'stone', dens: 2700, cond: .2, hard: .5, brk: 'gravel', grind: 'gravel', hi: [825, 'quicklime', .01, 'co2', .44], desc: 'Calcium carbonate rock. Acid and vinegar fizz it away as carbon dioxide. Above 825 °C it gives off carbon dioxide and leaves quicklime.' },
    { key: 'sulfur', repose: 35, pd: 2070, gs: .8, name: 'Sulfur', cat: 'land', state: POWDER, col: ['#e8d23a', '#dcc52c', '#f0dc52', '#cfb726'], dens: 1200, cond: .05, slide: .6, hi: [115, 'msulfur', .05], desc: 'Yellow mineral. Melts at 115 °C into a red-brown liquid that burns with a blue flame into choking sulfur dioxide.' },
    { key: 'peat', repose: 40, pd: 1400, gs: .6, vair: 3, pores: [90, 70, .05, .15], coh: .85, name: 'Peat', cat: 'land', state: POWDER, col: ['#3b2a1c', '#463222', '#33241a', '#4f3a27'], dens: 500, cond: .06, slide: .4, ign: 230, fuel: 1500, burnTo: 'ash', burnMax: 650, desc: 'Half-rotted bog plants. Holds a lot of water; dry peat smoulders for a very long time.' },
    { key: 'pumice', name: 'Pumice', cat: 'land', state: SOLID, col: ['#c9c4bb', '#bdb8ae', '#d4d0c8', '#b2ada3'], tex: 'stone', dens: 640, cond: .05, hard: .35, brk: 'gravel', grind: 'sand', hi: [1200, 'lava', .05], desc: 'Volcanic rock full of gas bubbles. Lighter than water, so a block of it floats.' },

    // ---------- liquids ----------
    { key: 'mercury', drag: 1.5, name: 'Mercury', cat: 'liquid', state: LIQUID, metal: 1, elec: 1, col: ['#c8ccd2', '#d6dade', '#b8bdc4', '#e4e7ea'], dens: 13534, cond: .3, disp: 4, desc: 'Liquid metal. So dense that steel and lead float on it. Conducts electricity, and its surface is a mirror for lasers.' },
    { key: 'ethanol', drag: 1.2, name: 'Ethanol', cat: 'liquid', state: LIQUID, col: ['#e6eef2', '#dde8ee'], alpha: .35, dens: 789, cond: .17, disp: 6, ign: 365, fuel: 40, burnTo: 'vapor', burnMax: 900, hi: [78, 'fuelvapor', .03], evap: .0008, desc: 'Alcohol. Lighter than water; evaporates, boils at 78 °C and burns with a pale, clean flame into water vapour.' },
    { key: 'petrol', drag: .6, name: 'Petrol', cat: 'liquid', state: LIQUID, col: ['#e8c96a', '#dcbd5c'], alpha: .5, dens: 740, cond: .12, disp: 6, ign: 280, fuel: 35, burnTo: 'smoke', burnMax: 1050, hi: [95, 'fuelvapor', .03], evap: .0015, desc: 'Gasoline. Evaporates into heavy vapour that creeps along the ground, and the vapour cloud explodes when it meets a flame.' },
    { key: 'tar', drag: 140, visc: .015, name: 'Tar', cat: 'liquid', state: LIQUID, col: ['#121012', '#1a171a', '#0c0a0c'], dens: 1150, cond: .1, disp: 1, ign: 315, fuel: 500, burnTo: 'smoke', burnMax: 1000, desc: 'Pitch. Flows so slowly it is almost solid, and burns for a long time with thick smoke.' },
    { key: 'lox', drag: .7, name: 'Liquid Oxygen', cat: 'liquid', state: LIQUID, col: ['#9fc8ff', '#b2d4ff'], alpha: .7, dens: 1141, cond: .4, temp: -183, disp: 6, hi: [-183, 'oxygen', .3], desc: 'Pale blue oxygen at −183 °C. Anything that burns, burns ferociously in it.' },
    { key: 'lye', drag: 1.1, name: 'Lye', cat: 'liquid', state: LIQUID, elec: 1, col: ['#d8e8d0', '#cfe2c6'], alpha: .45, dens: 1100, cond: .4, disp: 5, beh: 'lye', hi: [110, 'steam', .3], lo: [-10, 'ice', .03], desc: 'Caustic soda solution. Dissolves wood, plants and flesh, neutralises acid into salt water, and eats aluminium, giving off hydrogen. Conducts electricity: current through it splits water into hydrogen and oxygen.' },

    // ---------- gases ----------
    { key: 'oxygen', name: 'Oxygen', cat: 'gas', state: GAS, col: ['#cfe3ff'], alpha: .1, dens: 1.43, cond: .05, lo: [-183, 'lox', .1], desc: 'Pure oxygen. Fire burns far hotter and faster in it. Liquefies at −183 °C.' },
    { key: 'helium', name: 'Helium', cat: 'gas', state: GAS, col: ['#efe6ff'], alpha: .08, dens: .18, cond: .15, desc: 'Inert and very light: it shoots upward and puts out fires by keeping oxygen away.' },
    { key: 'chlorine', name: 'Chlorine', cat: 'gas', state: GAS, col: ['#c6e05a', '#bcd64e'], alpha: .35, dens: 3.2, cond: .03, beh: 'toxic', desc: 'Heavy, poisonous green gas. Sinks into hollows, kills plants and animals, dissolves in water as acid and burns sodium into salt.' },
    { key: 'propane', name: 'Propane', cat: 'gas', state: GAS, col: ['#dfe8d0'], alpha: .1, dens: 1.88, cond: .05, ign: 470, fuel: 1, burnTo: 'fire', desc: 'Bottled fuel gas. Heavier than air, so a leak pools on the floor and flashes over when lit.' },
    { key: 'neon', name: 'Neon', cat: 'gas', state: GAS, elec: 1, col: ['#ffd2c2'], alpha: .1, dens: .9, cond: .05, beh: 'neon', desc: 'Inert gas that glows red-orange while electric current passes through it. Seal it in a glass tube and wire it to a battery.' },

    // ---------- solids ----------
    { key: 'aluminium', name: 'Aluminium', cat: 'solid', state: SOLID, cap: .6, metal: 1, elec: 1, col: ['#c9ced4', '#d6dade', '#bcc1c7'], tex: 'metal', dens: 2700, cond: .9, hard: .6, hi: [660, 'maluminium', .05], desc: 'Light, shiny metal. Conducts heat and electricity, reflects lasers, melts at 660 °C. Lye eats it and gives off hydrogen.' },
    { key: 'tungsten', name: 'Tungsten', cat: 'solid', state: SOLID, cap: .3, metal: 1, elec: 1, col: ['#7c8088', '#868a92', '#70747c'], tex: 'metal', dens: 19250, cond: .6, hard: .95, hi: [3422, 'mtungsten', .05], desc: 'Melts at 3,422 °C, the highest of any metal. Glows white-hot without melting: the stuff of lamp filaments and crucibles.' },
    { key: 'magnesium', name: 'Magnesium', cat: 'solid', state: SOLID, cap: .5, metal: 1, elec: 1, col: ['#b9bcc0', '#c6c9cc', '#adb1b5'], tex: 'metal', dens: 1740, cond: .6, hard: .5, ign: 650, fuel: 120, burnTo: 'ash', burnMax: 3000, sparks: 1, wetburn: 1, desc: 'Light metal that burns at 3,000 °C with a blinding white light. Water does not put it out: burning magnesium tears the oxygen out of water, releasing explosive hydrogen, and out of carbon dioxide too.' },
    { key: 'sodium', name: 'Sodium', cat: 'solid', state: SOLID, metal: 1, elec: 1, col: ['#d4d7db', '#c8ccd1', '#e0e3e6'], tex: 'metal', dens: 968, cond: .7, hard: .1, ign: 125, fuel: 60, burnTo: 'ash', burnMax: 900, desc: 'Soft alkali metal, lighter than water. It reacts violently with water, getting hot enough to ignite the hydrogen it gives off, and leaves lye behind. Burns in chlorine into salt.' },
    { key: 'rubber', name: 'Rubber', cat: 'solid', state: SOLID, col: ['#2b2b2e', '#232326', '#333336'], dens: 1100, cond: .02, hard: .5, bounce: .8, ign: 350, fuel: 300, burnTo: 'smoke', burnMax: 1000, desc: 'Elastic and insulating. Grains landing on it bounce off. Burns with heavy black smoke.' },
    { key: 'plastic', name: 'Plastic', cat: 'solid', state: SOLID, col: ['#e8e8e0', '#d8dcd2', '#f0f0ea'], dens: 950, cond: .03, hard: .3, hi: [160, 'mplastic', .05], desc: 'Polyethylene. Floats on water, insulates, and melts at 160 °C into a sticky melt that burns with black smoke.' },
    { key: 'wax', name: 'Wax', cat: 'solid', state: SOLID, col: ['#f2ead2', '#ebe1c3', '#f6f0de'], dens: 900, cond: .03, hard: .1, hi: [60, 'mwax', .08], desc: 'Paraffin. Melts at 60 °C; the liquid wax is what actually burns, which is how a candle works.' },
    { key: 'paper', name: 'Paper', cat: 'solid', state: SOLID, pores: [80, 70, .02, .25], col: ['#f2f0ea', '#e9e6dd', '#faf8f3'], dens: 800, cond: .04, hard: .05, ign: 233, fuel: 12, burnTo: 'ash', burnMax: 650, desc: 'Catches fire at 233 °C and burns fast. Soaks up water, and wet paper will not burn until it dries out.' },
    { key: 'sponge', name: 'Sponge', cat: 'solid', state: SOLID, pores: [250, 220, .05, .35], col: ['#e8cf4a', '#d9bf3c', '#f0d95c'], dens: 300, cond: .03, hard: .1, ign: 280, fuel: 30, burnTo: 'ash', desc: 'Soaks up about two and a half times its own volume of water and wicks it out of puddles.' },
    { key: 'insulation', name: 'Insulation', cat: 'solid', state: SOLID, col: ['#f0a8b8', '#e898aa', '#f6b8c6'], dens: 120, cond: .001, hard: .1, hi: [1100, 'mglass', .03], desc: 'Glass wool. Barely conducts heat at all, and does not burn. Line a furnace or a freezer with it.' },
    { key: 'ironfil', repose: 40, pd: 7870, gs: .3, name: 'Iron Filings', cat: 'solid', state: POWDER, col: ['#4a4c50', '#55575c', '#3f4145'], dens: 3500, cond: .4, slide: .5, beh: 'ferro', hi: [1510, 'miron', .05], desc: 'Fine iron dust. Magnets pull it in and it clings to them in spiky chains. Rusts in water.' },
    { key: 'mirror', name: 'Mirror', cat: 'solid', state: SOLID, metal: 1, col: ['#d8e4ea', '#c4d2da', '#e8f0f4'], tex: 'glass', dens: 2500, cond: .1, hard: .15, anchor: 1, brk: 'shards', desc: 'Silvered glass on a fixed mount. Reflects laser beams; angle it with a diagonal line.' },

    // ---------- explosives ----------
    { key: 'dynamite', name: 'Dynamite', cat: 'boom', state: SOLID, col: ['#c0392b', '#a83226', '#d0453a'], tex: 'tnt', dens: 1300, cond: .1, hard: .25, ign: 200, exp: [8, 2.6], desc: 'Nitroglycerin soaked into a stable filler. A bigger blast than TNT; goes off at 200 °C.' },
    { key: 'contact', repose: 40, pd: 3500, gs: .5, pores: [30, 25, .05, .1], name: 'Contact Explosive', cat: 'boom', state: POWDER, col: ['#3b2a45', '#4a3557', '#2e2036'], dens: 2000, cond: .1, slide: .5, ign: 90, exp: [3, 1], impact: .7, beh: 'touchy', desc: 'Nitrogen triiodide. Dry, it detonates at the slightest touch: a bump, a fall, anything brushing against it. Wet, it is stable; let it dry out and it is not.' },
    { key: 'flash', repose: 36, pd: 2400, gs: .3, vair: 3, name: 'Flash Powder', cat: 'boom', state: POWDER, col: ['#9ea3a8', '#b0b4b8', '#8d9196'], dens: 1300, cond: .2, slide: .6, ign: 400, fuel: 2, burnTo: 'ash', burnMax: 3200, sparks: 1, desc: 'Metal powder mixed with its own oxidiser. Burns almost instantly at over 3,000 °C in a blinding flash.' },

    // ---------- machines ----------
    { key: 'magnet', name: 'Magnet', cat: 'machine', state: SOLID, metal: 1, col: ['#c8352c', '#d0d4d8', '#b52e26'], tex: 'metal', dens: 7500, cond: .4, hard: .9, anchor: 1, beh: 'magnet', hi: [770, 'steel', .02], desc: 'A fixed permanent magnet. Pulls iron filings in, harder the closer they are, and more magnet pulls harder. Heated past 770 °C (its Curie point) it loses its magnetism and is just steel.' },
    { key: 'laser', name: 'Laser', cat: 'machine', state: SOLID, col: ['#3a3d45', '#ff3b30', '#2c2f36'], tex: 'plate', dens: 3000, cond: .2, hard: .9, anchor: 1, beh: 'laser', desc: 'Fires a beam that heats whatever absorbs it, enough to set wood alight and slowly melt metal. Glass, ice, water and thin gas let it through (water and smoke soak up some), and metal and mirrors reflect it at the angle it arrives. Set its aim below before you place it.' },

    const eb = document.createElement('div'); eb.className = 'eyebrow'; eb.textContent = p ? 'Preset build' : 'Sandbox';
    const h = document.createElement('h2'); h.textContent = p ? p.name : 'Blank sandbox';
    const d = document.createElement('p'); d.textContent = p ? p.blurb : 'A blank sandbox. Pick a material below and start drawing, or open Presets to load a ready-made build.';
    card.append(eb, h, d);
    for (const k in controlEls) delete controlEls[k];
    if (p && p.controls) {
      const wrap = document.createElement('div'); wrap.className = 'ctrls';
      const btns = document.createElement('div'); btns.className = 'btns';
      p.controls.forEach((c, n) => {
        if (c.type === 'range') {
          const box = document.createElement('div'); box.className = 'ctrl';
          const r = document.createElement('div'); r.className = 'ctrl-row';
          const lab = document.createElement('label'); lab.textContent = c.label; lab.htmlFor = 'ctl-' + c.id;
          const out = document.createElement('span'); out.className = 'val'; out.textContent = c.value + (c.unit || '');
          r.append(lab, out);
          const inp = document.createElement('input'); inp.type = 'range'; inp.min = c.min; inp.max = c.max; inp.value = c.value; inp.id = 'ctl-' + c.id;
          inp.oninput = () => { out.textContent = inp.value + (c.unit || ''); c.input(E, +inp.value, uiApi); };
          box.append(r, inp); wrap.append(box);
          controlEls[c.id] = { input: inp, out, unit: c.unit };
        } else {
          const b = document.createElement('button'); b.className = 'btn' + (c.tone === 'danger' ? ' danger' : ''); b.id = 'ctl-btn-' + n; b.textContent = c.label;
          b.onclick = () => { if (c.rebuild) loadPreset(p); else c.run(E, uiApi); };
          btns.append(b);
        }
      });
      if (btns.children.length) wrap.append(btns);
      card.append(wrap);
    }
    statsEl = null;
    if (p && p.stats) { statsEl = document.createElement('dl'); statsEl.className = 'stats'; card.append(statsEl); drawStats(); }
  }
  function drawStats() {
    if (!statsEl || !preset) return;
    const rows = preset.stats(E);
    statsEl.textContent = '';
    rows.forEach(([k, v, tone]) => {
      const dt = document.createElement('dt'); dt.textContent = k;
      const dd = document.createElement('dd');
      if (tone) { const s = document.createElement('span'); s.className = 'tone ' + tone; s.textContent = v; dd.append(s); } else dd.textContent = v;
      statsEl.append(dt, dd);
    });
  }
  function loadPreset(p) {
    const [w, h] = SF.PRESET_SIZE;
    if (E.W !== w || E.H !== h) { E.resize(w, h); setupBuffers(); } else E.clearAll();
    E.cfg.ambient = 20; E.cfg.wind = 1;
    p.build(E);
    setPreset(p);
    setPaused(false);
  }

  // ------------------------------------------------------------ directory
  // Every element in the game, including the ones only reactions make: what it is, its numbers, how it
  // is made, what it reacts with and what it turns into. Any of them can be placed from here.
  const CAT_NAME = Object.fromEntries(SF.CATS);
  const madeBy = EL.map(() => []), changes = EL.map(() => []), reacts = EL.map(() => []);
  const idK = k => E.idOf(k);
  // processes the engine runs in code rather than through the element tables
  const PROCESSES = [
    ['hydrogen', 'Current through it (electrolysis)', ['saltwater', 'lye']],
    ['chlorine', 'Current through it (electrolysis)', ['saltwater']],
    ['lye', 'Current through it (electrolysis)', ['saltwater']],
    ['oxygen', 'Current through it (electrolysis)', ['lye']],
    ['oxygen', 'Growing in the light, under water', ['algae']],
    ['hydrogen', 'Acid eating a metal', ['acid']],
    ['co2', 'Acid eating limestone, baking soda or quicklime', ['acid']],
    ['hydrogen', 'Burning magnesium in water or steam', ['magnesium']],
    ['coal', 'Burning magnesium in carbon dioxide', ['magnesium']],
    ['fire', 'Anything burning', []],
    ['smoke', 'A flame dying down', ['fire']],
    ['leaf', 'A tree or plant growing', ['trunk', 'stem']],
    ['trunk', 'Planted in soil', ['sapling']],
    ['stem', 'Planted in soil', ['seed']],
    ['flower', 'Finishing growing', ['stem']],
    ['grass', 'Spreading over bare dirt', ['grass']],
    ['water', 'Used up dissolving plant or animal matter', ['lye']],
    ['spent', 'Fissioning many times', ['uranium', 'plutonium']],
    ['plasma', 'Lightning, nuclear blasts and stars', []],
  ];
  EL.forEach(d => {
    if (!d.id) return;
    if (d.hi) {
      const to = idK(d.hi[1]), what = EL[to].state === S.GAS ? 'Boiling' : EL[to].state === S.LIQUID ? 'Melting' : 'Heating';
      madeBy[to].push({ text: `${what} above ${degF(d.hi[0])}`, from: [d.id] });
      changes[d.id].push({ text: `Above ${degF(d.hi[0])}`, to: [to] });
      if (d.hi[3]) { const alt = idK(d.hi[3]); madeBy[alt].push({ text: `Left behind or given off heating above ${degF(d.hi[0])}`, from: [d.id] }); changes[d.id][changes[d.id].length - 1].to.push(alt); }
    }
    if (d.lo) { const to = idK(d.lo[1]); madeBy[to].push({ text: `Cooling below ${degF(d.lo[0])}`, from: [d.id] }); changes[d.id].push({ text: `Below ${degF(d.lo[0])}`, to: [to] }); }
    if (d.evap) changes[d.id].push({ text: 'Evaporates at room temperature into', to: [idK(d.hi[1])] });
    if (d.fuel && d.burnTo && !d.exp) { const to = idK(d.burnTo); madeBy[to].push({ text: 'Burning', from: [d.id] }); changes[d.id].push({ text: `Burns (from ${degF(d.ign)}) into`, to: [to] }); }
    if (d.exp) changes[d.id].push({ text: d.nuke ? 'Detonates: a nuclear explosion' : `Explodes (from ${degF(d.ign)}), radius ${d.exp[0]}`, to: [] });
    if (d.grind) { const to = idK(d.grind); madeBy[to].push({ text: 'Run through a grinder', from: [d.id] }); changes[d.id].push({ text: 'Ground in a grinder into', to: [to] }); }
    if (d.brk) { const to = idK(d.brk); madeBy[to].push({ text: 'Shattered by a blast', from: [d.id] }); changes[d.id].push({ text: 'Shattered by a blast into', to: [to] }); }
    if (d.rkill) { const to = idK(d.rkill); if (to !== d.id) changes[d.id].push({ text: 'Killed by radiation or poison gas, becomes', to: [to] }); }
  });
  PROCESSES.forEach(([k, text, from]) => {
    const to = idK(k), src = from.map(idK);
    madeBy[to].push({ text, from: src });
    src.forEach(s => changes[s].push({ text, to: [to] }));
  });
  SF.REACTIONS.forEach(r => {
    const a = idK(r[0]), b = idK(r[1]), a2 = idK(r[3]), b2 = idK(r[4]), q = r[5] || 0;
    reacts[a].push({ other: b, to: [a2, b2], q }); if (a !== b) reacts[b].push({ other: a, to: [b2, a2], q });
    const how = { text: 'Reaction', from: [a, b], q };
    if (a2 && a2 !== a && a2 !== b) madeBy[a2].push(how);
    if (b2 && b2 !== b && b2 !== a && b2 !== a2) madeBy[b2].push(how);
  });

  const dirEl = $('directory'), dirList = $('dirList'), dirBody = $('dirBody'), dirSearch = $('dirSearch');
  let dirSel = ID.sand, dirFilter = 'all';
  function chip(id) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'echip';
    const sw = document.createElement('span'); sw.className = 'sw'; sw.style.background = id ? swatchCSS(EL[id].col) : 'transparent';
    b.append(sw, document.createTextNode(id ? EL[id].name : 'nothing'));
    if (id) b.onclick = () => showDir(id, true); else b.disabled = true;
    return b;
  }
  function drawDirList() {
    const q = dirSearch.value.trim().toLowerCase();
    dirList.textContent = '';
    let shown = 0;
    SF.CATS.forEach(([cat, label]) => {
      if (cat === 'tools') return;
      const items = EL.filter(d => d.id > 0 && d.cat === cat && (dirFilter === 'all' || (dirFilter === 'made') === !!d.made) && (!q || d.name.toLowerCase().includes(q) || d.key.includes(q)));
      if (!items.length) return;
      const h = document.createElement('div'); h.className = 'dir-cat'; h.textContent = label; dirList.append(h);
      items.forEach(d => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'dir-item'; b.dataset.id = d.id;
        b.setAttribute('aria-current', String(d.id === dirSel));
        const sw = document.createElement('span'); sw.className = 'sw'; sw.style.background = swatchCSS(d.col);
        const n = document.createElement('span'); n.className = 'nm'; n.textContent = d.name;
        b.append(sw, n);
        if (d.made) { const tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = 'made'; b.append(tg); }
        b.onclick = () => showDir(d.id, false);
        dirList.append(b); shown++;
      });
    });
    if (!shown) { const p = document.createElement('div'); p.className = 'empty-note'; p.textContent = 'Nothing matches.'; dirList.append(p); }
    $('dirCount').textContent = `${EL.length - 1} elements · ${EL.filter(d => d.made).length} only from reactions`;
  }
  function section(title) {
    const s = document.createElement('section'); s.className = 'dir-sec';
    const h = document.createElement('h4'); h.textContent = title; s.append(h);
    dirBody.append(s); return s;
  }
  function showDir(id, scrollList) {
    dirSel = id; const d = EL[id];
    dirList.querySelectorAll('.dir-item').forEach(b => b.setAttribute('aria-current', String(+b.dataset.id === id)));
    if (scrollList) { const b = dirList.querySelector(`.dir-item[data-id="${id}"]`); if (b) b.scrollIntoView({ block: 'nearest' }); }
    dirBody.textContent = ''; dirBody.scrollTop = 0;
    const head = document.createElement('div'); head.className = 'el-head';
    const sw = document.createElement('span'); sw.className = 'sw big'; sw.style.background = swatchCSS(d.col);
    const h = document.createElement('h3'); h.textContent = d.name;
    const c = document.createElement('span'); c.className = 'state-chip'; c.textContent = STATE_NAME[d.state];
    head.append(sw, h, c); dirBody.append(head);
    const where = document.createElement('div'); where.className = 'dir-where';
    where.textContent = (CAT_NAME[d.cat] || 'Special') + ' · ' + (d.made ? 'only from reactions, not in the toolbar' : 'in the toolbar');
    dirBody.append(where);
    const p = document.createElement('p'); p.textContent = d.desc || ''; dirBody.append(p);
    const place = document.createElement('button'); place.type = 'button'; place.className = 'btn primary'; place.textContent = 'Place ' + d.name;
    place.onclick = () => { closeDirectory(); select({ tool: null, id }); toast(d.name + ' selected'); };
    dirBody.append(place);

    const st = section('Stats'), dl = document.createElement('dl'); dl.className = 'props';
    elementProps(d, true).forEach(([k, v]) => { const dt = document.createElement('dt'); dt.textContent = k; const dd = document.createElement('dd'); dd.textContent = v; dl.append(dt, dd); });
    st.append(dl);

    const mk = section('How it is made');
    const rows = madeBy[id];
    if (d.from) { const r = document.createElement('div'); r.className = 'dir-row'; r.textContent = d.from; mk.append(r); }
    rows.forEach(m => {
      const r = document.createElement('div'); r.className = 'dir-row';
      const lab = document.createElement('span'); lab.className = 'lab'; lab.textContent = m.text + (m.q ? (m.q > 0 ? ' (gives off heat)' : ' (draws in heat)') : '') + (m.from.length ? ':' : '');
      r.append(lab);
      m.from.forEach((f, k) => { if (k) r.append(document.createTextNode(m.from.length === 2 && m.text === 'Reaction' ? '+' : ',')); r.append(chip(f)); });
      mk.append(r);
    });
    if (!rows.length && !d.from) { const r = document.createElement('div'); r.className = 'dir-row muted'; r.textContent = 'Nothing in the game makes it: place it from the toolbar.'; mk.append(r); }

    const rx = section('Reacts with');
    if (!reacts[id].length) { const r = document.createElement('div'); r.className = 'dir-row muted'; r.textContent = 'Nothing reacts with it on contact.'; rx.append(r); }
    reacts[id].forEach(m => {
      const r = document.createElement('div'); r.className = 'dir-row';
      r.append(chip(m.other), document.createTextNode('→'));
      const outs = [...new Set(m.to.filter(x => x))];
      if (!outs.length) r.append(document.createTextNode('both used up'));
      else outs.forEach((x, k) => { if (k) r.append(document.createTextNode('+')); r.append(chip(x)); });
      if (m.q) { const n = document.createElement('span'); n.className = 'lab'; n.textContent = m.q > 0 ? `gives off heat (+${m.q} °C)` : `draws in heat (${m.q} °C)`; r.append(n); }
      rx.append(r);
    });

    const ch = section('What happens to it');
    if (!changes[id].length) { const r = document.createElement('div'); r.className = 'dir-row muted'; r.textContent = 'It does not change on its own.'; ch.append(r); }
    changes[id].forEach(m => {
      const r = document.createElement('div'); r.className = 'dir-row';
      const lab = document.createElement('span'); lab.className = 'lab'; lab.textContent = m.text + (m.to.length && !/into|becomes$/.test(m.text) ? ' →' : '');
      r.append(lab); m.to.forEach((x, k) => { if (k) r.append(document.createTextNode('+')); r.append(chip(x)); });
      ch.append(r);
    });
  }
  function openDirectory(id, q) {
    dirSearch.value = q || '';
    if (id) dirSel = id; else if (!sel.tool) dirSel = sel.id;
    drawDirList(); showDir(dirSel, true);
    if (!dirEl.open) dirEl.showModal();
    dirSearch.focus();
  }
  function closeDirectory() { if (dirEl.open) dirEl.close(); }
  $('dirBtn').onclick = () => openDirectory();
  $('dirClose').onclick = closeDirectory;
  dirEl.addEventListener('click', e => { if (e.target === dirEl) closeDirectory(); }); // click on the backdrop
  dirSearch.oninput = () => {
    drawDirList();
    const first = dirList.querySelector('.dir-item'); if (first && !dirList.querySelector('.dir-item[aria-current="true"]')) showDir(+first.dataset.id, false);
  };
  dirSearch.onkeydown = e => { if (e.key === 'Enter') { const b = dirList.querySelector('.dir-item[aria-current="true"]') || dirList.querySelector('.dir-item'); if (b) { closeDirectory(); select({ tool: null, id: +b.dataset.id }); } } };
  $('dirFilter').querySelectorAll('button').forEach(b => b.onclick = () => {
    dirFilter = b.dataset.f; $('dirFilter').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); drawDirList();
  });

  // ------------------------------------------------------------ keyboard
  window.addEventListener('keydown', e => {
    if (e.target && (e.target.tagName === 'INPUT' && e.target.type !== 'range')) return;
    if (e.ctrlKey || e.metaKey || e.altKey || dirEl.open) return;
    const k = e.key;
    if (k === 'd' || k === 'D') { e.preventDefault(); openDirectory(); return; }
    if (k === ' ') { e.preventDefault(); setPaused(!paused); }
    else if (k === '.') { setPaused(true); simStep(); }
    else if (k === 't' || k === 'T') setThermal(!thermal);
    else if (k === '[') setBrush(brushR - 1);
    else if (k === ']') setBrush(brushR + 1);
    else if (k === 'e' || k === 'E') select({ tool: 'erase', id: sel.id });
    else if (k === 'l' || k === 'L') showLabels = !showLabels;
    else if ((k === 'q' || k === 'Q') && hover.x >= 0) { const id = E.get(hover.x, hover.y); if (id > 0) select({ tool: null, id }); }
  });

  // ------------------------------------------------------------ main loop
  function simStep() { E.step(); pf++; if (preset && preset.tick) preset.tick(E, pf); }
  let frames = 0, fpsT = performance.now(), fps = 60, rafN = 0;
  function hud() {
    const hv = $('hover');
    if (hover.x >= 0 && hover.x < W && hover.y >= 0 && hover.y < H) {
      const id = E.get(hover.x, hover.y), T = E.temperature(hover.x, hover.y);
      const c = id ? EL[id].col[0] : '#2a2f38';
      hv.innerHTML = `<span class="sw" style="background:${c}"></span>${EL[id].name} · ${Math.round(T)} °C · ${hover.x}, ${hover.y}`;
    } else hv.textContent = 'Hover the canvas to inspect';
    let n = 0; const t = E.t; for (let i = 0; i < t.length; i++) if (t[i]) n++;
    const neu = E.countParticles(0);
    $('perf').textContent = `${n.toLocaleString('en-US')} cells${neu ? ' · ' + neu + ' neutrons' : ''}`;
  }
  function loop(now) {
    requestAnimationFrame(loop);
    rafN++;
    if (pointer.down && !(sel.tool && ONE_SHOT[sel.tool]) && sel.tool !== 'push') applyAt(pointer.x, pointer.y, false, 0, 0);
    if (!paused) {
      if (speed < 1) { if (rafN & 1) simStep(); }
      else for (let k = 0; k < speed; k++) simStep();
    }
    render(); overlay();
    frames++;
    if (now - fpsT > 500) { fps = Math.round(frames * 1000 / (now - fpsT)); frames = 0; fpsT = now; hud(); }
    if (rafN % 30 === 0) drawStats();
  }

  E.resize(...SF.PRESET_SIZE);
  setupBuffers();
  drawPalette(); drawElInfo();
  setPreset(null);
  requestAnimationFrame(loop);
  // test hooks, only when served locally for development
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') window.SandforgeUI = { loadPreset, select, setPaused, bench(n) { const t0 = performance.now(); for (let k = 0; k < n; k++) { render(); overlay(); } return (performance.now() - t0) / n; } };
})();
</script>
</body>
</html>
