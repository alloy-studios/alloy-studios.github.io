<title>TOMORROWLESS</title>
<style>
html,body{margin:0;height:100%;background:#07060c;overflow:hidden;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}

<body><canvas id="c" width="320" height="240"></canvas>
<script>
/* =====================================================================
   TOMORROWLESS  -  01 core
   canvas, palette, pixel grid sprite builder, bitmap font, input, audio
   ===================================================================== */
const W=320,H=240;
const cv=document.getElementById('c'),g=cv.getContext('2d');
g.imageSmoothingEnabled=false;
function fit(){const iw=innerWidth||0,ih=innerHeight||0;if(iw<2||ih<2)return;
 const s=Math.max(1,Math.floor(Math.min(iw/W,ih/H)));cv.style.width=W*s+'px';cv.style.height=H*s+'px';}
addEventListener('resize',fit);fit();

let fr=0,shake=0,flashT=0;
const rnd=(a,b)=>a+Math.random()*(b-a),irnd=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- palette (role-named) ---------- */
const PAL={'0':'#07060c','1':'#151320','2':'#25223a','3':'#3d3958','4':'#625d82','5':'#948fb2',
 '6':'#cdc9e3','7':'#ffffff','a':'#f7d2a6','b':'#dba377','c':'#a86f47','d':'#4a2e1d','e':'#f2f2fb',
 'f':'#c4c6dc','g':'#d63c3c','h':'#8c1f2a','i':'#6fd2f6','j':'#2b7fc0','k':'#ffd866','l':'#f2a02e',
 'm':'#8fd650','n':'#3a8a3a','o':'#cdb072','p':'#86693e','q':'#9a6ad6','r':'#523284','s':'#b6bccc',
 't':'#6f7690','u':'#ece6ff','v':'#e2702c','w':'#5c3a1e','x':'#fff2a0','y':'#33304a','z':'#b8341e',
 'A':'#1d3a2c','B':'#2e5a3c','C':'#4f8a52','D':'#16233c','E':'#24395e','F':'#3e5d8e','G':'#7fe0d2',
 'H':'#3fa59a','I':'#ff8fb8','J':'#c2457a','K':'#e0b13a','L':'#8a5a1c'};

/* ---------- grid builders: shapes on a char grid, auto outline, bake ---------- */
function G(w,h){const d=[];for(let y=0;y<h;y++)d.push(new Array(w).fill('.'));return{w:w,h:h,d:d};}
function st(gr,x,y,c){x=Math.round(x);y=Math.round(y);if(x<0||y<0||x>=gr.w||y>=gr.h)return;gr.d[y][x]=c;}
function R(gr,x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)st(gr,x+i,y+j,c);}
function DIT(gr,x,y,w,h,c,p){for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(((x+i)+(y+j))%2==(p||0))st(gr,x+i,y+j,c);}
function EL(gr,cx,cy,rx,ry,c){for(let y=-ry;y<=ry;y++){const t=1-(y*y)/(ry*ry||1);if(t<0)continue;
 const w=Math.floor(rx*Math.sqrt(t)+0.3);for(let x=-w;x<=w;x++)st(gr,cx+x,cy+y,c);}}
function LN(gr,x1,y1,x2,y2,c,th){th=th||1;const n=Math.max(1,Math.ceil(Math.hypot(x2-x1,y2-y1)));
 for(let i=0;i<=n;i++){const X=Math.round(x1+(x2-x1)*i/n),Y=Math.round(y1+(y2-y1)*i/n);
  for(let a=0;a<th;a++)for(let b=0;b<th;b++)st(gr,X+a-(th>>1),Y+b-(th>>1),c);}}
function TRI(gr,x1,y1,x2,y2,x3,y3,c){const mnx=Math.floor(Math.min(x1,x2,x3)),mxx=Math.ceil(Math.max(x1,x2,x3)),
 mny=Math.floor(Math.min(y1,y2,y3)),mxy=Math.ceil(Math.max(y1,y2,y3));
 const s=(a,b,cx,cy,dx,dy)=>(a-dx)*(cy-dy)-(cx-dx)*(b-dy);
 for(let y=mny;y<=mxy;y++)for(let x=mnx;x<=mxx;x++){const d1=s(x,y,x1,y1,x2,y2),d2=s(x,y,x2,y2,x3,y3),d3=s(x,y,x3,y3,x1,y1);
  if(!(((d1<0)||(d2<0)||(d3<0))&&((d1>0)||(d2>0)||(d3>0))))st(gr,x,y,c);}}
function OUT(gr,c){c=c||'0';const add=[];
 for(let y=0;y<gr.h;y++)for(let x=0;x<gr.w;x++){if(gr.d[y][x]!='.')continue;
  const ink=(X,Y)=>X>=0&&Y>=0&&X<gr.w&&Y<gr.h&&gr.d[Y][X]!='.'&&gr.d[Y][X]!=c;
  if(ink(x-1,y)||ink(x+1,y)||ink(x,y-1)||ink(x,y+1))add.push([x,y]);}
 add.forEach(p=>gr.d[p[1]][p[0]]=c);return gr;}
function MIR(gr){for(let y=0;y<gr.h;y++)for(let x=0;x<gr.w>>1;x++)gr.d[y][gr.w-1-x]=gr.d[y][x];return gr;}
function CLONE(gr){return{w:gr.w,h:gr.h,d:gr.d.map(r=>r.slice())};}
function bake(gr,ov){const c=document.createElement('canvas');c.width=gr.w;c.height=gr.h;const x=c.getContext('2d');
 for(let y=0;y<gr.h;y++)for(let i=0;i<gr.w;i++){const ch=gr.d[y][i];if(ch=='.')continue;
  x.fillStyle=ov?(ch=='0'?'#000000':ov):(PAL[ch]||'#f0f');x.fillRect(i,y,1,1);}
 return c;}
function bakeFlip(c){const f=document.createElement('canvas');f.width=c.width;f.height=c.height;
 const x=f.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(c,0,0);return f;}

/* ---------- crisp primitives (no AA anywhere) ---------- */
function px(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));}
function frame(x,y,w,h,c,t){t=t||1;px(x,y,w,t,c);px(x,y+h-t,w,t,c);px(x,y,t,h,c);px(x+w-t,y,t,h,c);}
function blit(c,x,y,flip){if(!c)return;if(flip){g.save();g.translate(Math.round(x)+c.width,Math.round(y));g.scale(-1,1);g.drawImage(c,0,0);g.restore();}
 else g.drawImage(c,Math.round(x),Math.round(y));}
function blitS(c,x,y,s){if(!c)return;g.drawImage(c,Math.round(x),Math.round(y),c.width*s,c.height*s);}
function disc(cx,cy,r,c){cx=Math.round(cx);cy=Math.round(cy);r=Math.max(1,Math.round(r));g.fillStyle=c;
 for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(Math.max(0,r*r-y*y)));g.fillRect(cx-w,cy+y,w*2+1,1);}}
function ring(cx,cy,r,c){cx=Math.round(cx);cy=Math.round(cy);g.fillStyle=c;const n=Math.max(8,Math.ceil(r*6));
 for(let i=0;i<n;i++){const a=i/n*6.2832;g.fillRect(Math.round(cx+Math.cos(a)*r),Math.round(cy+Math.sin(a)*r),1,1);}}
function dith(x,y,w,h,c,p){g.fillStyle=c;x=Math.round(x);y=Math.round(y);
 for(let j=0;j<h;j++)for(let i=(x+j+y+(p||0))%2;i<w;i+=2)g.fillRect(x+i,y+j,1,1);}
function LNs(x1,y1,x2,y2,c,th){th=th||1;const n=Math.max(1,Math.ceil(Math.hypot(x2-x1,y2-y1)));g.fillStyle=c;
 for(let i=0;i<=n;i++)g.fillRect(Math.round(x1+(x2-x1)*i/n)-(th>>1),Math.round(y1+(y2-y1)*i/n)-(th>>1),th,th);}

/* ---------- 5x7 bitmap font (ASCII 32..126, 7 rows of 5 bits, base32) ---------- */
const FONT_SRC='0000000444400 4aaa0000aavavaa4fke5u4op248j3cik8lidc4800002488842842224804lel40044v4400000c48000v00000000cc01248g0'+
 'ehjlphe4c4444eeh1248vv2421he26aiv22vgu11he68guhhev124888ehhehheehhf12c0cc0cc00cc0c48248g84200v0v008421248eh12404eh1dlle'+
 'ehhhvhhuhhuhhuehggghesihhhisvgguggvvgguggg ehgnhhfhhhvhhhe44444e72222ichikokihggggggvhrllhhhhhpljhhehhhhheuhhuggg'+
 'ehhhliduhhukihfgge11uv444444hhhhhhehhhhha4hhhllla hha4ahhhhha444v1248gve88888e0g84210e22222e4ah0000000000v8420000'+
 '00e1fhfggmphhu00egghe11djhhf00ehvge698s8880fhhf1eggmphhh40c444e20622icggikokic44444e00qllhh00mphhh00ehhhe00uhugg'+
 '00djf1100mpggg00ege1u88s889600hhhjd00hhha400hhlla00ha4ah00hhf1e00v248v24484424444444844244 8008l200';
const FONT=(()=>{const s=FONT_SRC.replace(/ /g,''),out={},D='0123456789abcdefghijklmnopqrstuv';
 for(let i=0;i<95;i++){const rows=[];for(let r=0;r<7;r++)rows.push(D.indexOf(s[i*7+r]));out[String.fromCharCode(32+i)]=rows;}
 return out;})();
const _sheets={};
function fontSheet(col){if(_sheets[col])return _sheets[col];const c=document.createElement('canvas');c.width=95*6;c.height=7;
 const x=c.getContext('2d');x.fillStyle=col;
 for(let i=0;i<95;i++){const rows=FONT[String.fromCharCode(32+i)];if(!rows)continue;
  for(let r=0;r<7;r++)for(let b=0;b<5;b++)if(rows[r]&(16>>b))x.fillRect(i*6+b,r,1,1);}
 _sheets[col]=c;return c;}
/* T(text,x,y,color,scale,align,charsShown) */
function T(s,x,y,col,sc,al,n){if(s==null||s==='')return;s=String(s);col=col||'#ffffff';sc=sc||1;
 const sh=fontSheet(col),nn=n==null?s.length:Math.max(0,Math.min(s.length,n));
 let X=Math.round(x);const w=s.length*6*sc;if(al=='center')X=Math.round(x-w/2);else if(al=='right')X=Math.round(x-w);
 for(let i=0;i<nn;i++){let k=s.charCodeAt(i)-32;if(k<0||k>94)k=31;if(k==0)continue;
  g.drawImage(sh,k*6,0,5,7,X+i*6*sc,Math.round(y),5*sc,7*sc);}}
function Tsh(s,x,y,col,sc,al,n){T(s,x+sc,y+sc,'#07060c',sc,al,n);T(s,x,y,col,sc,al,n);}
function wrapT(s,n){const o=[];String(s).split('\n').forEach(p=>{let l='';p.split(' ').forEach(w=>{
 if((l+' '+w).trim().length>n){o.push(l);l=w;}else l=l?l+' '+w:w;});o.push(l);});return o;}

/* ---------- input ---------- */
const keys={},press={};
addEventListener('keydown',e=>{if(!e.repeat){press[e.code]=1;}keys[e.code]=1;
 if(e.code.indexOf('Arrow')==0||e.code=='Space')e.preventDefault();
 if(e.code=='KeyM'&&!e.repeat){mute=!mute;if(MG)MG.gain.value=mute?0:0.6;}
 aInit();});
addEventListener('keyup',e=>{keys[e.code]=0;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=0;});
const dn=(...a)=>a.some(k=>keys[k]),kp=(...a)=>a.some(k=>press[k]);
const CONF=['KeyZ','Enter'],CANC=['KeyX','ShiftLeft','ShiftRight'],MENUK=['KeyC','ControlLeft','ControlRight'];
const hU=()=>dn('ArrowUp','KeyW'),hD=()=>dn('ArrowDown','KeyS'),hL=()=>dn('ArrowLeft','KeyA'),hR=()=>dn('ArrowRight','KeyD');
const pU=()=>kp('ArrowUp','KeyW'),pD=()=>kp('ArrowDown','KeyS'),pL=()=>kp('ArrowLeft','KeyA'),pR=()=>kp('ArrowRight','KeyD');
const pZ=()=>kp(...CONF),pX=()=>kp(...CANC),pC=()=>kp(...MENUK);
function clearPress(){for(const k in press)delete press[k];}

/* ---------- audio: sfx + step sequencer ---------- */
let AC=null,MG=null,mute=false;
function aInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();
 MG=AC.createGain();MG.gain.value=mute?0:0.6;MG.connect(AC.destination);}catch(e){AC=null;}}
function tone(f,d,type,v,t0,slide){if(!AC)return;t0=t0||AC.currentTime;const o=AC.createOscillator(),gn=AC.createGain();
 o.type=type||'square';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+d);
 gn.gain.setValueAtTime(v||0.05,t0);gn.gain.exponentialRampToValueAtTime(0.0001,t0+d);
 o.connect(gn);gn.connect(MG);o.start(t0);o.stop(t0+d+0.03);}
let _nb=null;
function noise(d,v,t0){if(!AC)return;if(!_nb){_nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
 const ch=_nb.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;}
 t0=t0||AC.currentTime;const s=AC.createBufferSource(),gn=AC.createGain();s.buffer=_nb;
 gn.gain.setValueAtTime(v||0.05,t0);gn.gain.exponentialRampToValueAtTime(0.0001,t0+d);
 s.connect(gn);gn.connect(MG);s.start(t0);s.stop(t0+d+0.02);}
const SFX={
 select:()=>tone(880,0.06,'square',0.04),move:()=>tone(520,0.035,'square',0.03),
 back:()=>tone(330,0.06,'square',0.035),
 hurt:()=>{tone(260,0.16,'square',0.07,0,70);noise(0.08,0.05);},
 hit:()=>{noise(0.2,0.1);tone(140,0.22,'sawtooth',0.06,0,40);},
 slash:()=>tone(1500,0.13,'sawtooth',0.04,0,180),

 save:()=>{const t=AC.currentTime;tone(523,0.12,'triangle',0.07,t);tone(659,0.12,'triangle',0.07,t+0.1);tone(784,0.3,'triangle',0.07,t+0.2);},
 heal:()=>{const t=AC.currentTime;tone(660,0.1,'sine',0.07,t);tone(990,0.2,'sine',0.06,t+0.08);},

 shoot:()=>tone(1700,0.05,'square',0.025,0,900),block:()=>tone(700,0.06,'square',0.05,0,1100),
 ding:()=>tone(1975,0.25,'sine',0.05),tick:()=>tone(2600,0.02,'square',0.02),
 slam:()=>{noise(0.25,0.1);tone(70,0.3,'square',0.07,0,35);},
 levelup:()=>{const t=AC.currentTime;[523,659,784,1046].forEach((f,i)=>tone(f,0.14,'square',0.05,t+i*0.07));},
 shatter:()=>{noise(0.5,0.08);const t=AC.currentTime;[900,700,500].forEach((f,i)=>tone(f,0.1,'square',0.04,t+i*0.06));}};
function sfx(n){if(AC&&!mute&&SFX[n])SFX[n]();}
const VOICES={def:[440,'square'],pell:[300,'triangle'],brass:[200,'square'],lumen:[700,'triangle'],
 keeper:[150,'sawtooth'],tobin:[620,'square'],kid:[560,'square'],low:[180,'triangle'],none:null};
function voice(v){const p=VOICES[v||'def'];if(!p||!AC||mute)return;tone(p[0]*rnd(0.94,1.06),0.04,p[1],0.03);}

function NOTE(n){const m=/^([A-G])(#|b)?(\d)$/.exec(n);if(!m)return 0;
 const base={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]=='#'?1:m[2]=='b'?-1:0);
 return 440*Math.pow(2,((+m[3]+1)*12+base-69)/12);}
function parseLine(s){const tk=s.trim().split(/\s+/),out=[];
 for(let i=0;i<tk.length;i++){if(tk[i]=='-')continue;let len=1;while(tk[i+len]=='-')len++;
  out.push({at:i,f:tk[i]=='.'?0:NOTE(tk[i]),len:len});}
 return{n:tk.length,notes:out};}

 battle:{bpm:150,lw:'square',bw:'triangle',lead:'A4 C5 E5 A5 G5 E5 C5 E5 F4 A4 C5 F5 E5 C5 A4 C5 G4 B4 D5 G5 F5 D5 B4 D5 E5 . E5 . D5 . C5 B4',bass:'A2 A2 A3 A2 F2 F2 F3 F2 G2 G2 G3 G2 E2 E2 E3 E2'},

const TH={out:{f1:'A',f2:'B',f3:'C',w1:'B',w2:'A',p1:'w',p2:'p'},town:{f1:'3',f2:'4',f3:'5',w1:'c',w2:'d',p1:'p',p2:'o'},

function mkTile(th,ch,v){const t=TH[th],gr=G(16,16);
 const floor=()=>{R(gr,0,0,16,16,t.f1);if(th!='town')DIT(gr,0,0,16,16,t.f2,(v)%2);
  if(th=='town'){R(gr,1,1,6,6,'4');R(gr,9,9,6,6,'4');st(gr,2,2,'5');st(gr,10,10,'5');
   R(gr,0,0,16,1,'2');R(gr,0,8,16,1,'2');R(gr,v%2?4:8,0,1,8,'2');R(gr,v%2?12:2,8,1,8,'2');}
  else if(th=='tower'){for(let y=0;y<16;y+=4)R(gr,0,y,16,1,'d');R(gr,(v*5)%16,0,1,4,'d');}
  else if(th=='orch'){if(v%3==0){st(gr,4,5,'G');st(gr,11,12,'u');}}
  else {if(v%3==0){st(gr,3,4,t.f3);st(gr,4,3,t.f3);}if(v%4==1){st(gr,11,10,t.f3);st(gr,12,9,t.f3);}}};
 if(ch=='.'||ch=='S'||ch=='@')floor();
 else if(ch==','){R(gr,0,0,16,16,t.p1);DIT(gr,0,0,16,16,t.p2,v%2);if(th=='tower'){R(gr,0,0,16,2,'k');R(gr,0,14,16,2,'k');}}
 else if(ch=='#'){R(gr,0,0,16,16,t.w1);DIT(gr,0,0,16,16,t.w2,0);
  if(th=='town'){R(gr,0,0,16,16,'c');for(let y=0;y<16;y+=4){R(gr,0,y,16,1,'d');R(gr,(y/4)%2?4:12,y,1,4,'d');}}
  else if(th=='out'){R(gr,0,0,16,16,'B');for(let i=0;i<6;i++){EL(gr,(i*7+v*3)%16,(i*5)%16,3,3,'A');}DIT(gr,0,0,16,4,'C',1);}
  else if(th=='orch'){R(gr,0,0,16,16,'F');TRI(gr,8,0,1,16,15,16,'H');TRI(gr,8,2,5,16,8,16,'G');}
  else{R(gr,0,0,16,16,'L');R(gr,0,0,16,2,'K');R(gr,0,14,16,2,'d');EL(gr,8,8,4,4,'K');EL(gr,8,8,2,2,'L');}}
 else if(ch=='T'){floor();EL(gr,8,6,7,6,th=='orch'?'G':'C');EL(gr,7,5,5,4,th=='orch'?'u':'m');DIT(gr,2,6,12,5,th=='orch'?'H':'B',0);
  R(gr,6,12,4,4,'w');OUT(gr);}
 else if(ch=='C'){floor();TRI(gr,8,0,3,15,13,15,'G');TRI(gr,8,1,6,15,8,15,'u');OUT(gr);}
 else if(ch=='~'){R(gr,0,0,16,16,'j');DIT(gr,0,0,16,16,'F',v%2);R(gr,(v*4)%12,6,4,1,'i');R(gr,(v*7+6)%12,12,3,1,'i');}
 else if(ch=='='){floor();R(gr,0,5,16,2,'p');R(gr,0,10,16,2,'p');R(gr,2,3,2,11,'w');R(gr,12,3,2,11,'w');OUT(gr);}
 else if(ch=='L'){floor();R(gr,7,5,2,11,'2');R(gr,4,0,8,6,'y');R(gr,5,1,6,4,'k');st(gr,7,2,'x');st(gr,8,2,'x');OUT(gr);}
 else if(ch=='B'){floor();for(let i=0;i<3;i++){EL(gr,3+i*5,10-i%2*3,2,2,['I','k','u'][(i+v)%3]);st(gr,3+i*5,10-i%2*3,'x');}}
 else if(ch=='H'){R(gr,0,0,16,16,'o');R(gr,0,0,2,16,'w');R(gr,14,0,2,16,'w');R(gr,0,7,16,2,'w');DIT(gr,2,9,12,7,'p',1);}
 else if(ch=='R'){R(gr,0,0,16,16,'h');for(let y=0;y<16;y+=4)R(gr,0,y+3,16,1,'z');DIT(gr,0,0,16,16,'g',(v)%2);}
 else if(ch=='W'){R(gr,0,0,16,16,'o');R(gr,0,0,2,16,'w');R(gr,14,0,2,16,'w');R(gr,3,3,10,9,'w');R(gr,4,4,8,7,'k');R(gr,7,4,2,7,'w');R(gr,4,7,8,1,'w');}
 else if(ch=='D'){R(gr,0,0,16,16,'o');R(gr,2,2,12,14,'w');R(gr,3,3,10,13,'p');st(gr,11,10,'k');R(gr,2,1,12,1,'d');}
 else if(ch=='F'){floor();}
 else if(ch=='K'){floor();R(gr,1,4,14,10,'w');R(gr,0,3,16,2,'o');R(gr,3,7,4,3,'k');R(gr,9,7,4,3,'I');OUT(gr);}
 else if(ch=='g'){floor();for(let i=0;i<8;i++){const a=i/8*6.2832;st(gr,8+Math.cos(a)*6,8+Math.sin(a)*6,'K');}EL(gr,8,8,4,4,'K');EL(gr,8,8,2,2,'L');}
 else if(ch=='P'){R(gr,0,0,16,16,'1');R(gr,0,0,16,16,'1');for(let i=0;i<5;i++)st(gr,(i*7+v)%16,(i*5+v*3)%16,'u');}
 else {floor();}
 return bake(gr);}

function tileFor(th,ch,v){const k=th+ch+(v%4);if(!TILES[k])TILES[k]=mkTile(th,ch,v%4);return TILES[k];}

/* ---------- collision ---------- */
function solidPx(x,y){const tx=Math.floor(x/TS),ty=Math.floor(y/TS),c=tileAt(tx,ty);
 if(c==null)return false;if(SOLID.has(c))return true;
 for(const s of SAVES)if(Math.abs(s.x-x)<7&&y>s.y-8&&y<s.y+2)return true;
 for(const n of NPCS){if(n.hidden||n.ghost)continue;if(Math.abs(n.x-x)<7&&y>n.y-7&&y<n.y+2)return true;}
 return false;}
function blocked(x,y){return solidPx(x-5,y-3)||solidPx(x+5,y-3)||solidPx(x-5,y+1)||solidPx(x+5,y+1);}

/* ---------- world update ---------- */
function worldUpdate(){
 if(TRANS){TRANS.t++;if(TRANS.t==14){loadRoom(TRANS.to,TRANS.tx,TRANS.ty,TRANS.dir);}
  if(TRANS.t>=28)TRANS=null;return;}
 if(encBang>0){encBang--;if(encBang==0&&encPending){const p=encPending;encPending=null;startBattle(p.mons,{area:p.area,flee:true});}return;}
 if(pC()){openMenu();return;}
 let dx=0,dy=0;if(hL())dx-=1;if(hR())dx+=1;if(hU())dy-=1;if(hD())dy+=1;
 const sp=dn(...CANC)?2.2:1.45;PL.moving=dx||dy;
 if(dy<0)PL.dir=1;else if(dy>0)PL.dir=0;if(dx<0&&!dy)PL.dir=2;else if(dx>0&&!dy)PL.dir=3;
 if(dx&&!dy)PL.dir=dx<0?2:3;
 if(PL.moving){const nx=PL.x+dx*sp,ny=PL.y+dy*sp;let moved=0;
  if(!blocked(nx,PL.y)){PL.x=nx;moved+=Math.abs(dx*sp);}
  if(!blocked(PL.x,ny)){PL.y=ny;moved+=Math.abs(dy*sp);}
  PL.anim+=moved*0.09;PL.f=moved?[0,1,0,2][Math.floor(PL.anim)%4]:0;
  edgeCheck();
  if(moved&&RM.enc){stepAcc+=moved;if(stepAcc>encAt){stepAcc=0;encAt=irnd(380,640);tryEncounter();}}
  for(const t of(RM.trig||[]))if(!F['t_'+t.id]&&PL.x>=t.x*TS&&PL.x<(t.x+t.w)*TS&&PL.y>=t.y*TS&&PL.y<(t.y+t.h)*TS){
   F['t_'+t.id]=1;PL.moving=false;PL.f=0;t.run();return;}}
 else PL.f=0;
 if(pZ())interact();
 camFollow();}
function edgeCheck(){const mw=RM.map[0].length*TS,mh=RM.map.length*TS,ex=RM.ex||{};
 const row=Math.floor((PL.y-4)/TS),col=Math.floor(PL.x/TS);let e=null;
 if(PL.x>mw-4&&ex.e)e=[ex.e,'e'];else if(PL.x<4&&ex.w)e=[ex.w,'w'];else if(PL.y<10&&ex.n)e=[ex.n,'n'];else if(PL.y>mh-2&&ex.s)e=[ex.s,'s'];
 if(!e)return;const t=e[0],tr=ROOMS[t.to].map;
 let tx=t.x!=null?t.x:col,ty=t.y!=null?t.y:row+(t.dy||0);
 if(e[1]=='e')tx=t.x!=null?t.x:1;if(e[1]=='w')tx=t.x!=null?t.x:tr[0].length-2;
 if(e[1]=='n'&&t.y==null)ty=tr.length-2;if(e[1]=='s'&&t.y==null)ty=1;
 goRoom(t.to,tx,clamp(ty,0,tr.length-1),{e:3,w:2,n:1,s:0}[e[1]]);}

function tryEncounter(){const area=RM.area;
 if(gone(area)){if(!nobodyShown[room]){nobodyShown[room]=1;PL.moving=false;run([N('* But nobody came.')]);}return;}
 const pool=RM.enc,m=[pick(pool)];

 if(pool.includes('tick')&&m[0]=='tick')m.splice(0,m.length,'tick','tock');

let SCR=null,DLG=null,MENU=null,SHOP=null;
function run(steps,done){SCR={q:steps.slice(),done:done||null,wait:0,busy:false};scrStep();}
function scrActive(){return !!SCR;}
function scrStep(){while(SCR){if(SCR.busy)return;const s=SCR.q.shift();
 if(!s){const d=SCR.done;SCR=null;if(d)d();return;}
 if(s.t=='say'||s.t=='choice'){openDlg(s);SCR.busy=true;return;}
 if(s.t=='fn'){const r=s.f();if(Array.isArray(r))SCR.q.unshift(...r);continue;}
 if(s.t=='wait'){SCR.wait=s.n;SCR.busy=true;return;}
 if(s.t=='if'){SCR.q.unshift(...(s.c()?s.a:s.b));continue;}
 if(s.t=='battle'){SCR.busy=true;const o=Object.assign({},s.opts),cb=o.then;
  o.onEnd=res=>{if(cb){const r=cb(res);if(Array.isArray(r)&&SCR)SCR.q.unshift(...r);}if(SCR){SCR.busy=false;scrStep();}};
  startBattle(s.mons,o);return;}}}
function scrTick(){if(SCR&&SCR.wait>0){SCR.wait--;if(SCR.wait==0){SCR.busy=false;scrStep();}}}

 raw.forEach(l=>{if(/^  /.test(l)&&paras.length)paras[paras.length-1]+=' '+l.trim();else paras.push(l);});
 const out=[];paras.forEach(p=>{const star=/^\* /.test(p);const body=star?p.slice(2):p;
  const lines=wrapT(body,star?n-2:n);lines.forEach((l,i)=>out.push((star?(i==0?'* ':'  '):'')+l));});return out;}

 DLG={s:s,lines:lines,total:lines.join('').length,n:0,pause:0,port:port,sel:0,choice:s.t=='choice'};}

 if(pZ()){DLG=null;if(SCR){SCR.busy=false;scrStep();}}}

/* =====================================================================
   05 battle  -  menus, fight bar, soul modes, bullets, damage, win/lose
   ===================================================================== */
let B=null;
const TBOX={x:16,y:122,w:288,h:70};
const BTN=['FIGHT','ACT','ITEM','MERCY'];
function startBattle(ids,opts){opts=opts||{};
 B={opts:opts,phase:'menu',menu:0,sel:0,sub:0,turn:0,exp:0,gold:0,text:null,tn:0,bubbles:null,atks:[],bullets:[],parts:[],
  box:Object.assign({},TBOX),tbox:Object.assign({},TBOX),fight:null,pops:[],burn:0,intro:20,
  soul:{x:160,y:157,vx:0,vy:0,mode:'red',grav:'d',ground:false,shield:1,inv:0,moved:false,cool:0,jumpHeld:false},
  mons:ids.map((id,i)=>{const d=MON[id];return{id:id,d:d,hp:d.hp,max:d.hp,spare:false,flash:0,sh:0,dead:false,gone:false,
   spared:false,dying:0,acts:{},mem:{},x:0}})};
 layoutMons();scene='battle';playMusic(opts.music||(B.mons[0].d.music)||'battle');
 setText(opts.intro||B.mons[0].d.flavor||'* Something approaches!');
 if(B.mons[0].d.onStart)B.mons[0].d.onStart(B,B.mons[0]);}
function layoutMons(){const al=B.mons.filter(m=>!m.gone);const xs=al.length==1?[160]:al.length==2?[104,216]:[72,160,248];
 al.forEach((m,i)=>m.x=xs[i]);}
function alive(){return B.mons.filter(m=>!m.dead&&!m.spared);}
function setText(t){B.text={lines:fmt(t,44),n:0};B.tn=0;}
function textDone(){return !B.text||B.text.n>=B.text.lines.join('').length;}
function tickText(){if(!B.text)return;if(pX())B.text.n=999;else if(!textDone()){B.text.n++;if(B.text.n%2==0)voice('def');}}

/* ---------- flow helpers ---------- */
function toMenu(){B.phase='menu';B.sub=0;B.tbox=Object.assign({},TBOX);B.bullets=[];B.atks=[];
 const m=alive()[0];const t=m&&m.d.flavorTurn?m.d.flavorTurn(B,m):null;setText(t||(m?pick(m.d.idle||['* '+m.d.name+' is here.']):'...'));}
function afterAction(){if(checkWin())return;B.phase='etalk';B.bubbles=[];B.turn++;
 alive().forEach(m=>{const t=m.d.talk?m.d.talk(B,m):null;if(t)B.bubbles.push({m:m,lines:wrapT(t,18)});});
 if(!B.bubbles.length)beginAttack();}
function beginAttack(){B.phase='attack';B.bullets=[];B.atks=[];const al=alive();
 let bw=0,bh=0,mode=null,dur=0;
 al.forEach((m,i)=>{let name=m.d.pick?m.d.pick(B,m):pick(m.d.atks),A=ATK[name];if(!A)return;
  if(mode&&(A.soul||'red')!=mode&&m.d.atks){const alt=m.d.atks.find(n=>(ATK[n].soul||'red')==mode);if(alt){name=alt;A=ATK[alt];}}   // never mix soul modes
  const a={name:name,A:A,t:0,st:{},m:m,idx:i,dens:al.length>1?0.6:1};B.atks.push(a);
  bw=Math.max(bw,A.box[0]);bh=Math.max(bh,A.box[1]);if(!mode)mode=A.soul||'red';dur=Math.max(dur,A.dur);});
 bh=Math.min(bh,94);B.atkDur=dur;B.atkT=0;B.tbox={w:bw,h:bh,x:160-bw/2,y:192-bh};
 const S=B.soul;S.mode=mode;S.grav='d';S.vx=S.vy=0;S.x=160;S.y=192-bh/2;S.inv=0;S.shield=1;
 if(mode=='blue')S.y=192-6;B.atks.forEach(a=>a.A.init&&a.A.init(a));}
function checkWin(){if(alive().length)return false;
 const lv0=ST.lv;const up=B.exp>0?addExp(B.exp):false;ST.gold+=B.gold;
 B.phase='won';const allSpared=B.mons.every(m=>m.spared);
 setText('* YOU WON!\n* You earned '+B.exp+' EXP and '+B.gold+' gold.'+(up?'\n* Your LV increased. Your watch skips ahead.':''));
 if(up)sfx('levelup');B.result=allSpared?'spare':'kill';return true;}
function endBattle(){const r=B.result||'flee',o=B.opts;B=null;scene='world';
 if(RM&&RM.music)playMusic(RM.music);if(o.onEnd)o.onEnd(r);}

/* ---------- player actions ---------- */
function doFight(m){B.phase='fightbar';B.fight={m:m,x:TBOX.x+4,v:4.6,stop:false,t:0};}
function resolveFight(){const f=B.fight,m=f.m,c=TBOX.x+TBOX.w/2,acc=Math.max(0,1-Math.abs(f.x-c)/(TBOX.w/2));
 if(m.d.onFight){const r=m.d.onFight(B,m,acc);if(r=='dodge'){B.phase='slash';f.dodge=true;f.t=0;sfx('miss');return;}}
 let dmg=Math.round((10+atk()-(m.d.def||0)+rnd(0,2))*(acc>0.94?2.2:0.4+acc*1.5));
 if(f.x>=TBOX.x+TBOX.w-6)dmg=0;
 f.dmg=Math.max(0,dmg);f.t=0;B.phase='slash';if(f.dmg>0)sfx('slash');else sfx('miss');}
function applyFight(){const f=B.fight,m=f.m;
 if(f.dodge){B.pops.push({x:m.x,y:40,t:0,s:'MISS',c:'#948fb2'});m.mem.dodged=(m.mem.dodged||0)+1;
  if(m.d.onDodge){const t=m.d.onDodge(B,m);if(t){setText(t);B.phase='acttext';B.after=afterAction;return;}}afterAction();return;}
 if(f.dmg<=0){B.pops.push({x:m.x,y:40,t:0,s:'MISS',c:'#948fb2'});afterAction();return;}
 m.hp-=f.dmg;m.flash=24;m.sh=14;sfx('hit');shake=4;B.pops.push({x:m.x,y:40,t:0,s:''+f.dmg,c:'#d63c3c',bar:m});
 if(m.d.onHurt)m.d.onHurt(B,m);
 if(m.hp<=0){m.hp=0;killMon(m);return;}
 afterAction();}
function killMon(m){m.dead=true;m.dying=1;sfx('dust');B.exp+=m.d.exp||0;B.gold+=m.d.gold||0;
 if(B.opts.area&&AREA[B.opts.area]>0)AREA[B.opts.area]--;F.kills=(F.kills||0)+1;
 let t=m.d.onDeath?m.d.onDeath(B,m):null;
 if(t){B.phase='acttext';if(Array.isArray(t)){B.actQueue=t.slice(1);t=t[0];}else B.actQueue=null;
  setText(t);B.after=()=>{if(!checkWin())afterAction();};}
 else{B.phase='dusting';B.dustT=50;}}
function doSpare(){const sp=alive().filter(m=>m.spare);
 if(!sp.length){setText('* You tried to spare...\n* But nothing happened.');B.phase='acttext';B.after=afterAction;return;}
 sp.forEach(m=>{m.spared=true;m.dying=1;B.gold+=m.d.gold||0;F.spares=(F.spares||0)+1;});sfx('spare');
 if(!checkWin()){setText('* You spared '+sp.map(m=>m.d.name).join(' and ')+'.');B.phase='acttext';B.after=afterAction;}}
function doFlee(){if(B.opts.flee===false||B.mons.some(m=>m.d.boss)){setText('* You can\'t run from this.');B.phase='acttext';B.after=afterAction;return;}
 if(Math.random()<0.6||B.turn>2){sfx('back');B.result='flee';B.phase='fled';setText(pick(['* Escaped...','* You walked away. It\'s a big night.','* "I\'ll be right back" (You won\'t.)']));}
 else{setText('* You tried to run, but tripped over\n  your scarf.');B.phase='acttext';B.after=afterAction;}}

/* ---------- soul / bullets ---------- */
function hurt(d){const S=B.soul;if(S.inv>0||B.phase!='attack')return;
 const dmg=Math.max(1,d-Math.floor(def()/2));ST.hp-=dmg;S.inv=B.opts.burn?30:90;sfx('hurt');shake=5;
 if(B.opts.burn)B.burn=Math.min(40,B.burn+dmg+1);
 if(ST.hp<=0){ST.hp=0;B.phase='dead';B.deadT=0;stopMusic();}}
function soulUpdate(){const S=B.soul,bx=B.box;S.moved=false;if(S.inv>0)S.inv--;if(S.cool>0)S.cool--;
 const L=bx.x+6,Rr=bx.x+bx.w-6,Tt=bx.y+6,Bt=bx.y+bx.h-6,ox=S.x,oy=S.y;
 if(S.mode=='red'||S.mode=='yellow'){const sp=dn(...CANC)?0.9:1.8;
  if(hL())S.x-=sp;if(hR())S.x+=sp;if(hU())S.y-=sp;if(hD())S.y+=sp;
  if(S.mode=='yellow'&&kp(...CONF)&&S.cool<=0){S.cool=10;sfx('shoot');
   B.bullets.push({k:'shot',x:S.x,y:S.y-6,vy:-4.5,vx:0,r:2,life:80,t:0,mine:true});}}
 else if(S.mode=='blue'){const gd=S.grav,gx=gd=='l'?-1:gd=='r'?1:0,gy=gd=='u'?-1:gd=='d'?1:0;
  const side=gx==0;const mv=side?((hR()?1:0)-(hL()?1:0)):((hD()?1:0)-(hU()?1:0));
  const jumpKey=gd=='d'?hU():gd=='u'?hD():gd=='l'?hR():hL();
  if(side)S.x+=mv*1.8;else S.y+=mv*1.8;
  let vg=side?S.vy*gy:S.vx*gx;
  if(S.ground&&jumpKey){vg=-3.4;S.ground=false;}
  if(!jumpKey&&vg<-1)vg=-1;
  vg+=vg>4?0:0.17;if(S.slam){vg=Math.max(vg,7);}
  if(side)S.vy=vg*gy;else S.vx=vg*gx;
  S.x+=S.vx;S.y+=S.vy;S.ground=false;
  const hit=(gd=='d'&&S.y>=Bt)||(gd=='u'&&S.y<=Tt)||(gd=='l'&&S.x<=L)||(gd=='r'&&S.x>=Rr);
  if(hit){S.ground=true;if(side)S.vy=0;else S.vx=0;if(S.slam){S.slam=false;sfx('slam');shake=8;}}}
 else if(S.mode=='green'){S.x=bx.x+bx.w/2;S.y=bx.y+bx.h/2;
  if(pU())S.shield=0;if(pR())S.shield=1;if(pD())S.shield=2;if(pL())S.shield=3;}
 S.x=clamp(S.x,L,Rr);S.y=clamp(S.y,Tt,Bt);
 if(Math.abs(S.x-ox)>0.05||Math.abs(S.y-oy)>0.05)S.moved=true;}
function slam(dir){const S=B.soul;S.grav=dir;S.slam=true;S.ground=false;S.vx=S.vy=0;}
function segDist(px_,py_,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy||1;let t=((px_-x1)*dx+(py_-y1)*dy)/l;t=clamp(t,0,1);
 return Math.hypot(px_-(x1+dx*t),py_-(y1+dy*t));}
function bulletsUpdate(){const S=B.soul;
 for(const b of B.bullets){b.t++;if(b.upd)b.upd(b);if(!b.frozen){b.x+=b.vx||0;b.y+=b.vy||0;}
  if(b.k=='beam'&&b.ang!=null){b.x2=b.x+Math.cos(b.ang)*(b.len||400);b.y2=b.y+Math.sin(b.ang)*(b.len||400);}}
 // yellow shots
 for(const s of B.bullets)if(s.k=='shot')for(const b of B.bullets)if(b.shootable&&!b.dead&&Math.hypot(b.x-s.x,b.y-s.y)<(b.r||6)+3){
  b.hp=(b.hp||1)-1;s.dead=true;if(b.hp<=0){b.dead=true;B.parts.push(...burst(b.x,b.y,'#ffd866',6));sfx('block');}}
 B.bullets=B.bullets.filter(b=>!b.dead&&(b.life==null||b.t<b.life));
 if(B.phase!='attack')return;
 for(const b of B.bullets){if(b.mine||b.harmless||(b.warn&&b.t<b.warn))continue;
  if(b.cm=='blue'&&!S.moved)continue;if(b.cm=='orange'&&S.moved)continue;
  let h=false;
  if(b.k=='arrow'){const d=Math.hypot(b.x-S.x,b.y-S.y);
   if(d<16&&!b.dead){const dir=Math.abs(b.x-S.x)>Math.abs(b.y-S.y)?(b.x>S.x?1:3):(b.y>S.y?2:0);
    if(dir==S.shield){b.dead=true;sfx('block');B.parts.push(...burst(b.x,b.y,'#ffffff',4));continue;}}
   h=d<5;if(h)b.dead=true;}
  else if(b.k=='beam')h=segDist(S.x,S.y,b.x,b.y,b.x2,b.y2)<(b.w||8)/2+2;
  else if(b.r)h=Math.hypot(b.x-S.x,b.y-S.y)<b.r+3;
  else h=S.x+3>b.x&&S.x-3<b.x+b.w&&S.y+3>b.y&&S.y-3<b.y+b.h;
  if(h){hurt(b.dmg||3);if(b.once)b.dead=true;}}}
function burst(x,y,c,n){const o=[];for(let i=0;i<n;i++){const a=rnd(0,6.28),s=rnd(0.6,2.2);o.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,life:irnd(14,26),c:c});}return o;}

/* ---------- update ---------- */
function battleUpdate(){if(!B)return;
 const bx=B.box,tb=B.tbox;bx.x=lerp(bx.x,tb.x,0.3);bx.y=lerp(bx.y,tb.y,0.3);bx.w=lerp(bx.w,tb.w,0.3);bx.h=lerp(bx.h,tb.h,0.3);
 B.mons.forEach(m=>{if(m.flash>0)m.flash--;if(m.sh>0)m.sh--;if(m.dying>0&&m.dying<60)m.dying++;if(m.dying>=60)m.gone=true;});
 B.pops.forEach(p=>p.t++);B.pops=B.pops.filter(p=>p.t<50);
 B.parts.forEach(p=>{p.t++;p.x+=p.vx;p.y+=p.vy;p.vy+=0.04;});B.parts=B.parts.filter(p=>p.t<p.life);
 if(B.burn>0&&fr%5==0&&ST.hp>1){ST.hp--;B.burn--;}
 if(B.intro>0){B.intro--;return;}
 if(B.phase=='cine'){const c=B.cine;if(c&&c.upd(++c.t)){B.cine=null;(c.done||toMenu)();}return;}
 const ph=B.phase;
 if(ph=='menu'){tickText();
  if(pL()){B.menu=(B.menu+3)%4;sfx('move');}if(pR()){B.menu=(B.menu+1)%4;sfx('move');}
  if(pZ()){if(B.lock&&B.lock[B.menu]||(B.menu==2&&B.noItem)){sfx('back');shake=2;return;}sfx('select');B.sel=0;B.phase=['target','target','item','mercy'][B.menu];B.targetFor=B.menu;
   if(B.phase=='item'&&!ST.items.length){B.phase='menu';sfx('back');}}return;}
 if(ph=='target'){const al=alive();if(pX()){B.phase='menu';sfx('back');return;}
  if(pU()){B.sel=(B.sel+al.length-1)%al.length;sfx('move');}if(pD()){B.sel=(B.sel+1)%al.length;sfx('move');}
  if(pZ()){sfx('select');const m=al[B.sel];if(B.targetFor==0)doFight(m);else{B.actM=m;B.phase='act';B.sel=0;}}return;}
 if(ph=='act'){const m=B.actM,acts=[{n:'Check'}].concat(m.d.acts||[]);if(pX()){B.phase='target';B.sel=0;sfx('back');return;}
  const n=acts.length;if(pL()){B.sel=(B.sel+n-1)%n;sfx('move');}if(pR()){B.sel=(B.sel+1)%n;sfx('move');}
  if(pU()){B.sel=(B.sel+n-2)%n;sfx('move');}if(pD()){B.sel=(B.sel+2)%n;sfx('move');}
  if(pZ()){sfx('select');const a=acts[B.sel];let t;
   if(B.sel==0)t=m.d.check;else{m.acts[a.n]=(m.acts[a.n]||0)+1;t=a.f(B,m,m.acts[a.n]);}
   if(Array.isArray(t)){B.actQueue=t.slice(1);t=t[0];}else B.actQueue=null;
   setText(t);B.phase='acttext';B.after=afterAction;}return;}
 if(ph=='item'){const n=ST.items.length;if(pX()){B.phase='menu';sfx('back');return;}
  if(pU()){B.sel=(B.sel+n-1)%n;sfx('move');}if(pD()){B.sel=(B.sel+1)%n;sfx('move');}
  if(pZ()){sfx('select');const r=useItem(B.sel);setText(r[0].text);B.phase='acttext';B.after=afterAction;}return;}
 if(ph=='mercy'){const n=B.opts.flee===false?1:2;if(pX()){B.phase='menu';sfx('back');return;}
  if(pU()||pD()){B.sel=(B.sel+1)%n;sfx('move');}
  if(pZ()){sfx('select');if(B.sel==0)doSpare();else doFlee();}return;}
 if(ph=='acttext'||ph=='won'||ph=='fled'){tickText();
  if(textDone()&&pZ()){if(ph=='acttext'&&B.actQueue&&B.actQueue.length){setText(B.actQueue.shift());return;}
   if(ph=='acttext'){const f=B.after;B.after=null;f&&f();}else endBattle();}return;}
 if(ph=='dusting'){B.dustT--;if(B.dustT<=0){if(!checkWin())afterAction();}return;}
 if(ph=='fightbar'){const f=B.fight;f.x+=f.v;if(pZ()||f.x>=TBOX.x+TBOX.w-6){resolveFight();}return;}
 if(ph=='slash'){B.fight.t++;if(B.fight.t>34)applyFight();return;}
 if(ph=='etalk'){if(pZ()||pX()){B.bubbles=null;beginAttack();}return;}
 if(ph=='attack'){soulUpdate();B.atks.forEach(a=>{a.A.upd(a,a.t);a.t++;});bulletsUpdate();B.atkT++;
  if(B.atkT>=B.atkDur&&B.phase=='attack'){B.soul.slam=false;toMenu();}return;}
 if(ph=='dead'){B.deadT++;if(B.deadT==30)sfx('shatter');if(B.deadT>110){B=null;gameOver();}return;}}

/* ---------- drawing ---------- */
function drawMon(m){if(m.gone)return;const FX=BOSSFX[m.d.spr];if(FX&&FX.draw&&(!m.dying||FX.ownDeath)){FX.draw(m);return;}const d=m.d,sc=d.sc||2,c=SPR.mon[d.spr],cw=SPR.monW[d.spr];if(!c)return;
 const w=c.width*sc,h=c.height*sc,bob=d.boss?Math.round(Math.sin(fr*0.04)*2):Math.round(Math.sin(fr*0.06+m.x)*2);
 let x=m.x-w/2+(m.sh>0?(m.sh%4<2?-3:3):0),y=(d.baseY||102)-h+bob;
 if(m.dying){if(m.spared){if(m.dying%4<2)dith(x,y,w,h,'#07060c',0);g.globalAlpha=Math.max(0,1-m.dying/60);blitS(c,x,y,sc);g.globalAlpha=1;

  for(let i=0;i<4;i++)B.parts.push({x:x+rnd(0,w),y:y+cut,vx:rnd(-0.3,0.3),vy:rnd(-1.2,-0.3),t:0,life:30,c:i%2?'#948fb2':'#cdc9e3'});return;}
 blitS(m.flash>0&&(m.flash>>1)%2?cw:c,x,y,sc);
 if(m.spare&&!m.d.boss&&fr%40<20)T('!',m.x+w/2-4,y+4,'#ffd866');}
function drawBubble(bb){const m=bb.m,d=m.d,sc=d.sc||2,c=SPR.mon[d.spr];const w=c.width*sc,h=c.height*sc;
 const lines=bb.lines,bw=Math.max(...lines.map(l=>l.length))*6+12,bh=lines.length*10+10;
 const top=(d.baseY||102)-h,multi=alive().length>1;
 let x,y,tail;
 if(multi){x=clamp(m.x-bw/2,4,W-bw-4);y=Math.max(2,top-bh-6);tail='down';}       // crowded: speak from above
 else{x=Math.min(W-bw-4,m.x+w/2+6);y=Math.max(4,top+4);tail='left';if(x<m.x){x=m.x-w/2-bw-6;tail='right';}}
 px(x,y,bw,bh,'#ffffff');frame(x-1,y-1,bw+2,bh+2,'#07060c');
 if(tail=='left')for(let i=0;i<5;i++)px(x-1-i,y+8+i,1+i,1,'#ffffff');           // stepped pixel tail, no AA
 else if(tail=='right')for(let i=0;i<5;i++)px(x+bw,y+8+i,1+i,1,'#ffffff');
 else for(let i=0;i<4;i++)px(clamp(m.x,x+6,x+bw-10)-i,y+bh+i,2+i*2,1,'#ffffff');
 lines.forEach((l,i)=>T(l,x+6,y+6+i*10,'#07060c'));}
function TRIpx(x1,y1,x2,y2,x3,y3){g.fillStyle='#ffffff';g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.lineTo(x3,y3);g.fill();}
function drawBullet(b){if(b.draw){b.draw(b);return;}
 const col=b.cm=='blue'?'#6fd2f6':b.cm=='orange'?'#f2a02e':(b.col||'#ffffff');
 if(b.k=='shot'){px(b.x-1,b.y-3,3,6,'#ffd866');return;}
 if(b.k=='beam'){if(b.warn&&b.t<b.warn){if(fr%4<2)LNs(b.x,b.y,b.x2,b.y2,'#ffffff',1);return;}
  const w=(b.w||8)*(b.t-(b.warn||0)<4?(b.t-(b.warn||0))/4:1)*(b.life&&b.life-b.t<8?(b.life-b.t)/8:1);
  LNs(b.x,b.y,b.x2,b.y2,col,Math.max(1,Math.round(w)));if(w>4)LNs(b.x,b.y,b.x2,b.y2,'#ffffff',Math.max(1,Math.round(w*0.45)));return;}
 if(b.warn&&b.t<b.warn){if(fr%6<3){if(b.r)ring(b.x,b.y,b.r,'#d63c3c');else frame(b.x,b.y,b.w,b.h,'#d63c3c');}return;}
 if(b.spr){blit(b.spr,b.x-b.spr.width/2,b.y-b.spr.height/2);return;}
 if(b.k=='arrow'){const a=Math.atan2(160-b.y,0)+0;disc(b.x,b.y,3,col);px(b.x-1,b.y-1,2,2,'#07060c');return;}
 if(b.r)disc(b.x,b.y,b.r,col);else px(b.x,b.y,b.w,b.h,col);}

 else if(ph=='act'){const acts=[{n:'Check'}].concat(B.actM.d.acts||[]);acts.forEach((a,i)=>{const x=tx+18+(i%2)*134,y=ty+Math.floor(i/2)*14;

 if(ph=='etalk'&&B.bubbles)B.bubbles.forEach(drawBubble);
 // HUD
 T('KID',18,200,'#ffffff');T('LV '+ST.lv,58,200,'#ffffff');T('HP',112,200,'#ffffff',1);

/* =====================================================================
   06a attacks  -  pattern helpers, regular monsters, Sergeant Brass
   ATK[name] = {dur, box:[w,h], soul, init(a), upd(a,t), draw(a)}
   ===================================================================== */
const ATK={};
function bl(o){const b=Object.assign({t:0},o);B.bullets.push(b);return b;}
function every(a,t,n){const k=Math.max(1,Math.round(n/(a.dens||1)));return (t+(a.idx||0)*Math.floor(k/2))%k==0;}   // 2nd monster fires half a beat later
function TB(){return B.tbox;}
function offBox(b,m){const x=TB();m=m||40;if(b.x<x.x-m||b.x>x.x+x.w+m||b.y<x.y-m||b.y>x.y+x.h+m)b.dead=true;}
const kill=m=>b=>offBox(b,m);
function aimAt(x,y,sp){const S=B.soul,a=Math.atan2(S.y-y,S.x-x);return{vx:Math.cos(a)*sp,vy:Math.sin(a)*sp};}
function lanternDraw(x,y,glow){disc(x,y,7,glow?'#fff2a0':'#f2a02e');disc(x,y,5,glow?'#ffffff':'#ffd866');
 px(x-8,y-1,16,2,'#b8341e');px(x-1,y-10,2,4,'#5c3a1e');}
/* blaster: emitter at (x,y) firing along ang */
function blaster(x,y,ang,o){o=o||{};const warn=o.warn||34,life=warn+(o.hold||22),w=o.w||14;
 bl({k:'beam',x:x,y:y,ang:ang,len:420,w:w,warn:warn,life:life,noclip:true,dmg:o.dmg||4,col:o.col||'#fff2a0',cm:o.cm,
  upd(b){if(b.t==1)sfx('charge');if(b.t==warn){sfx('beam');shake=4;}}});
 bl({x:x,y:y,harmless:true,noclip:true,life:life,draw(b){lanternDraw(b.x,b.y,b.t>=warn&&b.t%4<2);}});}
function bayonet(x,y,h,vx,o){o=o||{};return bl({x:x,y:y,w:5,h:h,vx:vx,vy:0,dmg:o.dmg||4,cm:o.cm,upd:o.upd||kill(50),
 draw(b){const c=b.cm=='blue'?'#6fd2f6':b.cm=='orange'?'#f2a02e':'#ffffff';px(b.x,b.y+4,b.w,b.h-4,c);
  px(b.x+1,b.y+1,3,3,c);px(b.x+2,b.y,1,1,c);px(b.x,b.y+b.h-3,b.w,3,'#c4c6dc');}});}

function syncGears(B,m){m.mem.sync=1;const both=B.mons.filter(x=>(x.id=='tick'||x.id=='tock')&&!x.dead);
 if(both.every(x=>x.mem.sync)){both.forEach(x=>x.spare=true);return'* You count "TICK... TOCK..." in time.\n* For one perfect beat, they are in sync.\n* They\'re too happy to fight.';}
 if(both.length<2){m.spare=true;return'* You keep time for '+m.d.name+'.\n* It finally has a partner.';}
 return'* You keep time for '+m.d.name+'.\n* Now do the other one.';}

const ROMAN=['XII','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'];
function tri(x1,y1,x2,y2,x3,y3,c){const p=[[x1,y1],[x2,y2],[x3,y3]].sort((a,b)=>a[1]-b[1]),a=p[0],b=p[1],d=p[2];g.fillStyle=c;
 const ed=(u,v,y)=>v[1]==u[1]?u[0]:u[0]+(v[0]-u[0])*(y-u[1])/(v[1]-u[1]);
 for(let y=Math.ceil(a[1]);y<=Math.floor(d[1]);y++){let xa=ed(a,d,y),xb=y<b[1]?ed(a,b,y):ed(b,d,y);if(xa>xb){const s=xa;xa=xb;xb=s;}
  g.fillRect(Math.round(xa),y,Math.max(1,Math.round(xb)-Math.round(xa)+1),1);}}
function ellF(cx,cy,rx,ry,c){g.fillStyle=c;for(let y=-ry;y<=ry;y++){const w=Math.floor(rx*Math.sqrt(Math.max(0,1-(y*y)/(ry*ry))));g.fillRect(Math.round(cx-w),Math.round(cy+y),w*2+1,1);}}
function gearShape(x,y,r,teeth,ang,c1,c2){for(let i=0;i<teeth;i++){const a=ang+i/teeth*6.2832;px(x+Math.cos(a)*(r+1)-2,y+Math.sin(a)*(r+1)-2,5,5,c1);}
 disc(x,y,r,c1);if(c2)disc(x,y,Math.max(1,r*0.5),c2);}
function clockHand(x,y,ang,len,w,col,tip){const ex=x+Math.cos(ang)*len,ey=y+Math.sin(ang)*len,nx=-Math.sin(ang),ny=Math.cos(ang),tl=w*2.4;
 LNs(x,y,ex,ey,'#07060c',w+2);LNs(x,y,ex,ey,col,w);
 tri(ex+Math.cos(ang)*tl*1.8,ey+Math.sin(ang)*tl*1.8,ex+nx*tl,ey+ny*tl,ex-nx*tl,ey-ny*tl,tip||col);disc(x,y,w+1,'#e0b13a');}
function bellShape(x,y,s,c){tri(x,y-10*s,x-9*s,y+6*s,x+9*s,y+6*s,c||'#e0b13a');px(x-11*s,y+5*s,22*s,3*s,'#8a5a1c');disc(x,y+9*s,2*s,'#5c3a1e');px(x-1,y-13*s,2,4*s,'#5c3a1e');}

const _arrow=arrow;

 if(k=='lumen')b.draw=function(b){if(b.t<delay)return;const c=(o&&o.col)||'#7fe0d2';ellF(b.x,b.y+2,3,2,c);px(b.x+2,b.y-6,1,8,c);px(b.x+2,b.y-6,4,2,c);px(b.x+5,b.y-4,1,2,c);};
 else if(k=='keeper')b.draw=function(b){if(b.t<delay)return;bellShape(b.x,b.y,0.45,(o&&o.col)||'#e0b13a');};
 return b;};

  o.forEach((s,i)=>{T(s,160,186+i*14,GO.sel==i?'#ffd866':'#ffffff',1,'center');if(GO.sel==i)blit(SPR.heart.red,160-s.length*3-16,185+i*14);});}}

/* ---------- main loop ---------- */
function tick(){fr++;if(shake>0)shake--;if(flashT>0)flashT--;
 if(scene=='world'){F.time=(F.time||0)+1;
  if(SAVEUI)saveUiUpdate();else if(SHOP)shopUpdate();else if(MENU)menuUpdate();else if(DLG)dlgUpdate();else if(SCR)scrTick();else worldUpdate();}
 else if(scene=='battle')battleUpdate();
 else if(scene=='title')titleUpdate();else if(scene=='intro')introUpdate();
 else if(scene=='ending')endingUpdate();else if(scene=='gameover')goUpdate();
 // draw
 if(scene=='world'){g.save();if(shake>0)g.translate(Math.round(rnd(-shake,shake)),0);worldDraw();g.restore();
  if(SHOP)shopDraw();else{if(MENU)menuDraw();if(DLG)dlgDraw();if(SAVEUI)saveUiDraw();}
  if(flashT>0){dith(0,0,W,H,'#07060c',0);if(flashT>12)dith(0,0,W,H,'#07060c',1);}}
 else if(scene=='battle'){battleDraw();if(DLG)dlgDraw();}
 else if(scene=='title')titleDraw();else if(scene=='intro')introDraw();
 else if(scene=='ending')endingDraw();else if(scene=='gameover')goDraw();
 clearPress();}
let _last=0,_acc=0;
function loop(now){if(!_last)_last=now;_acc+=Math.min(100,now-_last);_last=now;
 while(_acc>=1000/60){tick();_acc-=1000/60;}requestAnimationFrame(loop);}
playMusic('title');requestAnimationFrame(loop);

/* test hook: localhost only */
if(location.hostname==='localhost'||location.hostname==='127.0.0.1')
 window.__t={step:n=>{for(let i=0;i<(n||1);i++)tick();},key:c=>{press[c]=1;},
  get:()=>({scene:scene,room:room,x:PL.x,y:PL.y,hp:ST.hp,lv:ST.lv,battle:B?{phase:B.phase,mons:B.mons.map(m=>m.id+':'+m.hp),turn:B.turn}:null,
   dlg:DLG?DLG.lines.join('|'):null,kills:kills(),areas:AREA}),
  room:(id,x,y)=>{scene='world';loadRoom(id,x,y,0);},battle:(ids)=>startBattle(ids,{}),newGame:()=>{newGame();}};
