      minY = Math.min(minY, o.position.y - r - 150);
    }
    const minX = SLING_X - 210;
    const spanX = maxX - minX, spanY = (GY + 90) - minY;
    const z = clamp(Math.min(R.W / spanX, R.H / spanY), .3, baseZ);
    const viewH = R.H / z;
    // keep the ground line low on screen instead of centring on empty dirt
    const y = Math.min(GY - viewH * .30, minY + viewH * .44);
    return { x: (minX + maxX) / 2, y, z };
  },
  updateCam(dt) {
    const c = this.cam;
    const baseZ = clamp(R.H / VIEW_H, .5, 1.9);
    let tz, tx, ty;
    const live = this.activeBalls.filter(b => !b.game.done && !b.isStatic);
    if ((this.state === 'flight' || this.state === 'settling' || this.state === 'done') && live.length) {
      let sx = 0, sy = 0;
      for (const b of live) { sx += b.position.x; sy += b.position.y; }
      tz = clamp(this.aimFrame().z * 1.28, .34, baseZ * .95);
      tx = sx / live.length + live[0].velocity.x * 8;
      ty = sy / live.length;
      const viewH = R.H / tz, viewW = R.W / tz;
      const defY = GY - viewH * .34;
      ty = clamp(Math.min(defY, ty - viewH * .04), defY - 700, defY);
      tx = clamp(tx, viewW * .5 - 160, Math.max(viewW * .5, this.level.w - viewW * .42));
    } else {
      const f = this.aimFrame();
      tz = f.z; tx = f.x; ty = f.y;
      const viewW = R.W / tz;
      tx = clamp(tx, viewW * .5 - 200, Math.max(viewW * .5, this.level.w - viewW * .38));
    }
    c.tx = tx; c.ty = ty; c.tz = tz;
    const k = 1 - Math.pow(.86, dt);
    c.x += (tx - c.x) * k;
    c.y += (ty - c.y) * k;
    c.z += (tz - c.z) * k * .6;
  }
};

/* ============================ src/62-elite-systems.js ============================ */
'use strict';
/* =========================================================
   Systems for the elite-tier abilities. Attached to G after
   the main object literal so 60-game.js stays untouched.
   ========================================================= */
Object.assign(G, {

  /* ---------------- HYDRA: every impact halves it ---------------- */
  hydraSplit(b, pt) {
    const Mx = M(), m = b.game;
    if (m.splitCD > 0) return;
    const gen = m.gen || 0;
    if (gen >= 3) { m.splitCD = 40; return; }   // 1 -> 2 -> 4 -> 8 and stop
    const v = b.velocity;
    const sp = Math.hypot(v.x, v.y) || 1;
    for (const a of [-.55, .55]) {
      const c = Math.cos(a), s = Math.sin(a);
      const nb = this.addBall(
        pt.x - v.x / sp * 6, pt.y - v.y / sp * 6,
        (v.x * c - v.y * s) * .82, (v.x * s + v.y * c) * .82 - 3,
        b.game.skin, { frag: true, dmg: 1.15 }
      );
      Mx.Body.scale(nb, .74, .74);
      nb.game.R *= .74;
      nb.game.gen = gen + 1;
      nb.game.hydra = true;
      nb.game.splitCD = 26;
      nb.game.used = true;
    }
    burst(pt.x, pt.y, 20, { col: ['#3ff0c0', '#b6fff0'], size: 3.4, spd: 8, life: 26, add: true });
    shock(pt.x, pt.y, 70, '#3ff0c0', 16);
    popText(pt.x, pt.y - 30, ['TWO', 'FOUR', 'EIGHT'][gen] || '', '#3ff0c0', 18);
    SFX.play('blip', { f: 500 + gen * 200 });
    this.removeBall(b);
  },

  /* ---------------- SIREN: five rising shockwaves ---------------- */
  sirenSong(b) {
    SFX.play('zap', { v: .5 });
    this.flash('#e6f0ff', .2);
    for (let i = 0; i < 5; i++) {
      this.after(i * 15, () => {
        if (b.game.dead) return;
        const p = { x: b.position.x, y: b.position.y };
        const r = 160 + i * 55, dmg = 70 + i * 48;
        shock(p.x, p.y, r, '#e6f0ff', 22, 9);
        shock(p.x, p.y, r * .6, '#ffffff', 16, 5);
        SFX.play('blip', { f: 420 + i * 260 });
        SFX.play('glass', { v: .3 + i * .1 });
        for (const o of this.dynamicBodies()) {
          const d = dist(p.x, p.y, o.position.x, o.position.y);
          if (d > r) continue;
          const k = 1 - d / r;
          // glass simply cannot survive the frequency
          if (o.game.mat === 'ice') { this.damageBody(o, 9999, o.position, '#e6f0ff'); continue; }
          this.damageBody(o, dmg * k, o.position, '#e6f0ff');
          const a = Math.atan2(o.position.y - p.y, o.position.x - p.x);
          M().Body.applyForce(o, o.position, {
            x: Math.cos(a) * o.mass * .012 * k,
            y: Math.sin(a) * o.mass * .012 * k - o.mass * .004 * k
          });
          M().Body.setAngularVelocity(o, o.angularVelocity + rand(-.2, .2) * k);
        }
        this.shake(8 + i * 3);
      });
    }
  },

  /* ---------------- MIDAS: turn matter to gold ---------------- */
  gild(x, y, r) {
    const Mx = M();
    let n = 0;
    for (const o of this.dynamicBodies()) {
      if (o.game.gold) continue;
      if (dist(x, y, o.position.x, o.position.y) > r) continue;
      o.game.gold = true;
      o.game.hp *= .5;             // gold is dense but brittle
      o.game.maxhp *= .5;
      Mx.Body.setDensity(o, o.density * 2.4);
      n++;
      burst(o.position.x, o.position.y, 10, {
        col: ['#ffd24a', '#fff6c0'], size: 3, spd: 4, life: 26, add: true
      });
    }
    if (n) {
      SFX.play('coin');
      shock(x, y, r, '#ffd24a', 20, 7);
    }
  },

  /* ---------------- DELUGE: flood the level ---------------- */
  startFlood(b) {
    if (this.flood) return;
    this.flood = { y: GY + 40, target: GY - 285, t: 0 };
    this.theme = this.theme === 'eclipse' ? 'eclipse' : this.theme;
    SFX.play('whoosh'); SFX.play('boom', { v: .45 });
    this.flash('#4fc3ff', .4);
    this.shake(24);
    UI.centerToast('HIGH TIDE', '#4fc3ff');
    const p = { x: b.position.x, y: b.position.y };
    shock(p.x, p.y, 900, '#4fc3ff', 40, 16);
    for (let i = 0; i < 90; i++) {
      const a = rand(0, TAU);
      FX.add({
        x: p.x, y: p.y, vx: Math.cos(a) * rand(4, 18), vy: Math.sin(a) * rand(4, 18) - 4,
        type: 'dot', size: rand(3, 8), col: pick(['#bdefff', '#4fc3ff', '#ffffff']),
        life: rand(30, 70), g: .12, add: true, drag: .96
      });
    }
  },
  stepFlood(dt) {
    const f = this.flood;
    if (!f) return;
    f.t += dt;
    f.y += (f.target - f.y) * .03 * dt;
    const Mx = M();
    const bodies = [...this.dynamicBodies(), ...this.activeBalls];
    for (const o of bodies) {
      if (o.isStatic) continue;
      const h = o.bounds.max.y - o.bounds.min.y;
      const sub = clamp((o.bounds.max.y - f.y) / Math.max(1, h), 0, 1);
      if (sub <= 0) {
        if (o.game.wet) { o.frictionAir = o.game.ball ? .006 : .002; o.game.wet = false; }
        continue;
      }
      o.game.wet = true;
      o.frictionAir = .07;
      // buoyancy just beats gravity, so things bob up and drift
      Mx.Body.applyForce(o, o.position, {
        x: Math.sin(this.time * 1.3 + o.id) * o.mass * .0011 * sub * dt,
        y: -o.mass * .0029 * sub * dt
      });
      Mx.Body.setAngularVelocity(o, o.angularVelocity * .97);
      if (Math.random() < .06 * dt * sub) FX.add({
        x: o.position.x + rand(-16, 16), y: o.position.y + rand(-10, 10),
        vx: rand(-.3, .3), vy: rand(-1.4, -.4), type: 'dot', size: rand(1.5, 3.4),
        col: '#bdefff', life: 34, add: true, drag: .98
      });
      if (Math.random() < .03 * dt * sub) this.damageBody(o, 11, o.position, '#4fc3ff');
    }
    if (Math.random() < .6 * dt) FX.add({
      x: this.cam.x + rand(-800, 800), y: f.y + rand(-6, 6),
      vx: rand(-.5, .5), vy: rand(-1.6, -.4), type: 'dot',
      size: rand(2, 5), col: '#ffffff', life: 40, add: true, drag: .97
    });
  },

  /* ---------------- COLOSSUS: an enormous fist ---------------- */
  summonFist(b) {
    if (this.fist) return;
    let tx = b.position.x;
    if (this.enemies.length) {
      let bd = 1e9;
      for (const e of this.enemies) {
        const d = Math.abs(e.position.x - b.position.x);
        if (d < bd) { bd = d; tx = e.position.x; }
      }
    }
    this.fist = { x: tx, y: GY - 1500, tx, phase: 'raise', t: 0, r: 124, dir: 1 };
    SFX.play('timewarp'); SFX.play('boom', { v: .5 });
    this.shake(20);
    UI.centerToast('THE BIG ONE', '#ff6b4a');
    this.slowmo(.5, 40);
  },
  stepFist(dt) {
    const f = this.fist;
    if (!f) return;
    const Mx = M();
    f.t += dt;
    if (f.phase === 'raise') {
      f.y += (GY - 620 - f.y) * .09 * dt;
      if (f.t > 34) { f.phase = 'slam'; f.t = 0; SFX.play('whoosh'); }
    } else if (f.phase === 'slam') {
      f.y += 46 * dt;
      if (f.y >= GY - 90) {
        f.y = GY - 90; f.phase = 'sweep'; f.t = 0;
        this.shake(40); this.flash('#ffd0b0', .4);
        SFX.play('boom'); SFX.play('stone');
        // a contained impact rather than the full ANCHOR quake, which
        // stacked with the sweep to clear whole levels
        this.explode(f.x, GY - 40, 300, .05, 150, '#ffb094');
        shock(f.x, GY, 620, '#ffb094', 34, 18);
        this.slowmo(1, 0);
      }
    } else if (f.phase === 'sweep') {
      f.x += 13 * f.dir * dt;
      f.y = GY - 90 + Math.sin(f.t * .06) * 22;
      if (Math.random() < .8 * dt) FX.add({
        x: f.x + rand(-f.r, f.r), y: GY - rand(0, 40), vx: rand(-3, 3) + f.dir * 5,
        vy: rand(-6, -1), type: 'smoke', size: rand(14, 30), grow: .8,
        col: '#6b5347', life: rand(40, 80), layer: 0
      });
      if (f.t > 78 || f.x > this.level.w + 300) { f.phase = 'lift'; f.t = 0; }
    } else if (f.phase === 'lift') {
      f.y -= 22 * dt;
      if (f.y < GY - 1400) { this.fist = null; return; }
    }
    // anything the fist occupies gets destroyed and thrown
    if (f.phase === 'slam' || f.phase === 'sweep') {
      for (const o of this.dynamicBodies()) {
        const d = dist(f.x, f.y, o.position.x, o.position.y);
        if (d > f.r) continue;
        const k = 1 - d / f.r;
        Mx.Body.applyForce(o, o.position, {
          x: (f.dir * .02 + (o.position.x - f.x) / (d || 1) * .01) * o.mass * k * dt,
          y: -o.mass * .006 * k * dt
        });
        this.damageBody(o, 2.0 * dt, o.position, '#ff6b4a');
      }
      for (const ab of this.activeBalls) {
        const d = dist(f.x, f.y, ab.position.x, ab.position.y);
        if (d < f.r && !ab.isStatic) Mx.Body.applyForce(ab, ab.position, { x: f.dir * ab.mass * .01 * dt, y: -ab.mass * .004 * dt });
      }
    }
  },

  /* ---------------- THE HOUSE: pull the lever ---------------- */
  allIn(b) {
    if (this.housePulls) return;
    this.housePulls = 0;
    SFX.play('shake'); SFX.play('coin');
    this.flash('#ffd24a', .45);
    this.shake(20);
    UI.centerToast('ALL IN', '#ffffff');
    shock(b.position.x, b.position.y, 700, '#ffd24a', 36, 16);

    /* every payout is drawn from the game's own ability pool */
    const REELS = [
      ['NUKE', '#ff7a1a', (g, p) => g.explode(p.x, p.y, 300, .085, 220, '#ff7a1a')],
      ['DEEP FREEZE', '#bfe9ff', (g, p) => g.freeze(p.x, p.y, 250)],
      ['THUNDER', '#ffe680', (g, p) => g.lightning(p.x, p.y, 4)],
      ['CYCLONE', '#cfe4f5', (g, p) => g.spawnVortex(p.x, Math.min(p.y + 40, GY - 60))],
      ['ORBITAL', '#7fe9ff', (g, p) => g.orbitalStrike(p.x)],
      ['ACID', '#9dff4d', (g, p) => g.acid(p.x, p.y, 210)],
      ['QUAKE', '#cfd6e2', (g, p) => g.quake(p.x, GY)],
      ['SWARM', '#ffd23d', (g, p, bb) => g.releaseSwarm(bb, 8)],
      ['GILDED', '#ffd24a', (g, p) => g.gild(p.x, p.y, 240)],
      ['CONTAGION', '#b6ff3d', (g, p) => {
        for (const o of g.dynamicBodies())
          if (dist(p.x, p.y, o.position.x, o.position.y) < 200) g.infect(o);
      }],
      ['HARMONIC', '#e6f0ff', (g, p, bb) => g.sirenSong(bb)],
      ['SINGULARITY', '#ff7be5', (g, p) => {
        g.explode(p.x, p.y, 260, .075, 170, '#ff7be5');
        for (const o of g.dynamicBodies()) {
          const d = dist(p.x, p.y, o.position.x, o.position.y);
          if (d < 420) M().Body.applyForce(o, o.position, {
            x: (p.x - o.position.x) / (d || 1) * o.mass * .014,
            y: (p.y - o.position.y) / (d || 1) * o.mass * .014
          });
        }
      }]
    ];

    const PULLS = 6;
    for (let i = 0; i < PULLS; i++) {
      this.after(14 + i * 26, () => {
        const alive = this.activeBalls[0];
        // fire at whatever is still standing, not at wherever the ball stopped
        const live = this.enemies.length ? this.enemies : this.blocks;
        const mark = live.length ? pick(live).position : null;
        const p = mark ? { x: mark.x, y: mark.y }
          : alive ? { x: alive.position.x, y: alive.position.y }
            : { x: this.level.w * .6, y: GY - 160 };
        const reel = pick(REELS);
        this.abilityMul = 1.15;   // each pull is a taste, not a nuke
        this.housePulls++;
        popText(p.x, p.y - 56, reel[0], reel[1], 20);
        for (let k = 0; k < 10; k++) FX.add({
          x: p.x + rand(-30, 30), y: p.y + rand(-30, 30), vx: rand(-4, 4), vy: rand(-6, -1),
          type: 'glyph', txt: pick(['7', '$', '*']), size: rand(12, 20),
          col: reel[1], life: 30, add: true
        });
        SFX.play('blip', { f: 600 + i * 90 });
        reel[2](this, p, alive || { position: p, velocity: { x: 8, y: -4 }, game: {} });
      });
    }

    // and the payout
    this.after(14 + PULLS * 26 + 30, () => {
      const alive = this.activeBalls[0];
      const p = alive ? { x: alive.position.x, y: alive.position.y } : { x: this.level.w * .6, y: GY - 160 };
      this.abilityMul = 2.45;
      UI.centerToast('JACKPOT', '#ffd24a');
      this.flash('#ffffff', .7);
      this.shake(46);
      this.slowmo(.3, 50);
      SFX.play('reveal', { r: 5 }); SFX.play('boom');
      for (let i = 0; i < 3; i++) this.after(i * 7, () =>
        this.explode(p.x + rand(-200, 200), p.y + rand(-130, 130), 260, .075, 165, pick(['#ffd24a', '#ff3fa0', '#7fe9ff'])));
      for (let i = 0; i < 140; i++) {
        const a = rand(0, TAU);
        FX.add({
          x: p.x, y: p.y, vx: Math.cos(a) * rand(6, 30), vy: Math.sin(a) * rand(6, 30),
          type: 'spark', size: rand(2, 5), col: hsl(rand(0, 360), 100, 70),
          life: rand(30, 70), add: true, drag: .95
        });
      }
      const bonus = 1500 + this.levelIndex * 250;
      this.coinsEarned += bonus;
      popText(p.x, p.y - 90, '+' + fmt(bonus) + 'c', '#ffd24a', 26);
      this.housePulls = 0;
    });
  }
});

/* fold the new per-frame systems into the game loop */
G._eliteStep = G._eliteStep || function (dt) {
  this.stepFlood(dt);
  this.stepFist(dt);
};

'use strict';
/* =========================================================
   CRATES
   ========================================================= */
const CRATES = [
  {
    id: 'wood', name: 'WOODEN CRATE', cost: 550, cc: '#c9924f',
    desc: 'Splintery, honest, and statistically disappointing.',
    odds: [.52, .28, .14, .05, .009, .001, 0]
  },
  {
    id: 'gold', name: 'GOLDEN CRATE', cost: 1900, cc: '#ffc23d',
    desc: 'No commons. Ever. Roughly one in a hundred bites back.',
    odds: [0, .42, .33, .18, .06, .01, 0]
  },
  {
    id: 'void', name: 'VOID CRATE', cost: 5400, cc: '#b56cff',
    desc: 'Epic guaranteed. 8% chance of something that rewrites the game.',
    odds: [0, 0, 0, .615, .30, .08, .005]
  },
  {
    id: 'vault', name: 'THE VAULT', cost: 17500, cc: '#ffffff',
    desc: 'Legendary floor. The only door the one-of-one has ever come through.',
    odds: [0, 0, 0, 0, .58, .385, .035]
  }
];
const DUPE_COINS = [130, 280, 600, 1300, 2800, 7500, 25000];
const PITY_LEG = 14;   // opens without legendary+ -> forced legendary
const PITY_MYTH = 70;   // opens without mythic -> forced mythic
const PITY_TRANS = 180; // the one-of-one is guaranteed eventually

function rollRarity(crate, save) {
  if ((save.transPity || 0) >= PITY_TRANS - 1) return 6;
  if (save.mythicPity >= PITY_MYTH - 1) return 5;
  if (save.pity >= PITY_LEG - 1) return Math.max(4, weighted(crate.odds));
  return weighted(crate.odds);
}
function weighted(odds) {
  let r = Math.random(), acc = 0;
  for (let i = 0; i < odds.length; i++) { acc += odds[i]; if (r < acc) return i; }
  return 0;
}
function rollSkin(crate, save) {
  let rar = rollRarity(crate, save);
  let pool = SKINS.filter(s => s.rar === rar);
  while (!pool.length && rar > 0) { rar--; pool = SKINS.filter(s => s.rar === rar); }
  // slight bias toward skins you do not own yet
  const missing = pool.filter(s => !save.inv[s.id]);
  if (missing.length && Math.random() < .72) return pick(missing);
  return pick(pool);
}

      const own = G.owns(s.id), n = G.save.inv[s.id] || 0;
      const eq = G.skin && G.skin.id === s.id;
      return `<div class="sk-card ${own ? 'owned' : 'locked'} ${s.rar >= 6 ? 'tier6' : ''}" data-id="${s.id}" style="--rc:${RC(s.rar)}
        ${eq ? ';box-shadow:0 0 0 2px ' + RC(s.rar) + ',0 0 34px ' + RC(s.rar) + '66' : ''}">
        <div class="sk-rar">${RARITY[s.rar].name}</div>
        ${n > 1 ? `<div class="sk-dupe">x${n}</div>` : ''}
        <canvas data-skin="${s.id}"></canvas>
        <div class="sk-nm">${own ? s.name : '???'}</div>
        <div class="sk-ab">${own ? s.abil : 'LOCKED'}</div>
        ${eq ? '<div class="sk-eq">EQUIPPED</div>' : ''}
      </div>`;
    }).join('');
    const el = this.set(`
      ${this.wallet()}
      <div class="scr-head">
        <div class="scr-title">COLLECTION<small>${owned} OF ${SKINS.length} SKINS &nbsp;&bull;&nbsp; CLICK TO EQUIP</small></div>
        <button class="btn small ghost" id="back">BACK</button>
      </div>
      <div class="scr-body">
        <div class="coll-stats">${byRar}</div>
        <div class="coll-grid">${cards}</div>
        <div class="tip" id="detail">Rarer skins hit harder, look better, and bend more rules.</div>
      </div>`, 'collection');
    el.querySelector('#back').onclick = () => { SFX.play('ui'); this.showMenu(); };
    this.anim = [...el.querySelectorAll('canvas[data-skin]')].map(cv => ({
      cv, skin: SKIN_BY_ID[cv.dataset.skin], opts: { float: true, glow: G.owns(cv.dataset.skin) }
    }));
    el.querySelectorAll('.sk-card').forEach(c => {
      const s = SKIN_BY_ID[c.dataset.id];
      c.onmouseenter = () => {
        const d = el.querySelector('#detail');
        d.innerHTML = G.owns(s.id)
          ? `<b style="color:${RC(s.rar)}">${s.abil}</b> — ${s.abilDesc}<br><span style="opacity:.6">${s.desc}</span>`
          : `A ${RARITY[s.rar].name.toLowerCase()} skin you have not found yet.`;
      };
      c.onclick = () => {
        if (!G.owns(s.id)) { SFX.play('error'); return; }
        G.skin = s; G.save.equipped = s.id; G.store();
        SFX.play('ui');
        this.showCollection();
        this.toast(`EQUIPPED <b>${s.name}</b>`, RC(s.rar));
      };
    });
  },

  /* =========================================================
     CRATE OPENING
     ========================================================= */
  openCrate(crate) {
    const save = G.save;
    const skin = rollSkin(crate, save);
    save.opened++;
    if (skin.rar >= 4) save.pity = 0; else save.pity++;
    if (skin.rar >= 5) save.mythicPity = 0; else save.mythicPity++;
    if (skin.rar >= 6) save.transPity = 0; else save.transPity = (save.transPity || 0) + 1;
    const dupe = G.owns(skin.id);
    if (dupe) save.coins += DUPE_COINS[skin.rar];
    save.inv[skin.id] = (save.inv[skin.id] || 0) + 1;
    G.store();

    this.stage.classList.remove('hidden');
    this.stage.style.setProperty('--rc', '#98a2b3');
    this.stage.innerHTML = `
      <div class="beam"></div>
      <div class="glowball"></div>
      <canvas class="confetti" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4"></canvas>
      <div class="crate-box" id="cbox"><canvas id="ccv"></canvas></div>
      <div class="crate-hint" id="chint">Click the crate to open</div>`;
    const box = this.stage.querySelector('#cbox');
    const cv = this.stage.querySelector('#ccv');
    this.crateAnims = [{ cv, crate, opts: { float: true } }];
    this.confetti = { cv: this.stage.querySelector('.confetti'), ps: [] };

    let opened = false;
    const start = () => {
      if (opened) return; opened = true;
      this.stage.querySelector('#chint').style.display = 'none';
      box.classList.add('shaking');
      const beam = this.stage.querySelector('.beam');
      const glow = this.stage.querySelector('.glowball');
      beam.style.opacity = .5;
      glow.style.opacity = .55;
      const steps = 4 + skin.rar * 2;
      const total = 950 + skin.rar * 320;
      let i = 0;
      const iv = setInterval(() => {
        i++;
        const lvl = Math.min(skin.rar, Math.floor(i / steps * (skin.rar + 1)));
        const col = RARITY[Math.max(0, lvl)].c;
        this.stage.style.setProperty('--rc', col);
        glow.style.transform = `translate(-50%,-50%) scale(${.35 + i / steps * .85})`;
        SFX.play('build', { k: i / steps });
        SFX.play('shake');
        G.shake(2);
        if (i >= steps) { clearInterval(iv); reveal(); }
      }, total / steps);
    };

    const reveal = () => {
      const col = RC(skin.rar);
      this.stage.style.setProperty('--rc', col);
      SFX.play('reveal', { r: skin.rar });
      if (skin.rar >= 3) this.confettiBurst(skin.rar);
      const myth = skin.rar >= 5;
      this.stage.querySelector('.glowball').style.opacity = .85;
      this.stage.querySelector('.beam').style.opacity = skin.rar >= 3 ? .85 : .35;
      box.remove();
      const div = document.createElement('div');
      div.className = 'reveal';
      div.innerHTML = `
        <div class="rar-tag ${myth ? 'mythic-txt' : ''}">${RARITY[skin.rar].name}</div>
        <div class="orb"><canvas id="rcv"></canvas></div>
        <div class="nm ${myth ? 'mythic-txt' : ''}">${skin.name}</div>
        <div class="ab">${skin.abil}</div>
        <div class="desc">${skin.abilDesc}</div>
        ${dupe ? `<div class="dupe">DUPLICATE &rarr; +${fmt(DUPE_COINS[skin.rar])} COINS</div>` : ''}
        <div class="cont">
          <button class="btn primary" id="rEquip">EQUIP</button>
          <button class="btn ghost" id="rClose">CONTINUE</button>
        </div>`;
      this.stage.appendChild(div);
      this.anim = [{ cv: div.querySelector('#rcv'), skin, opts: { float: true, scale: .3 } }];
      div.querySelector('#rEquip').onclick = () => {
        G.skin = skin; G.save.equipped = skin.id; G.store();
        SFX.play('ui'); this.closeStage();
        this.toast(`EQUIPPED <b>${skin.name}</b>`, col);
      };
      div.querySelector('#rClose').onclick = () => { SFX.play('ui'); this.closeStage(); };
      if (myth) { G.flash(col, .5); G.shake(24); }
    };

    box.onclick = start;
    this.stage.onclick = e => { if (!opened && e.target.closest('#cbox') === null) start(); };
  },
  closeStage() {
    this.stage.classList.add('hidden');
    this.stage.innerHTML = '';
    this.confetti = null;
    this.crateAnims = []; this.anim = [];
    if (this.cur === 'shop') this.showShop();
    else if (this.cur === 'collection') this.showCollection();
    else this.showMenu();
  },
  confettiBurst(rar) {
    const c = this.confetti; if (!c) return;
    const cols = rar >= 5 ? ['#ff3fa0', '#ffc23d', '#52e07a', '#3fa9ff', '#b56cff', '#ffffff']
      : rar >= 4 ? ['#ffc23d', '#ffe9a8', '#ffffff'] : ['#b56cff', '#e0c6ff', '#ffffff'];
    const n = 60 + rar * 40;
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), s = rand(4, 22);
      c.ps.push({
        x: .5, y: .5, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 4,
        w: rand(4, 11), h: rand(6, 16), col: pick(cols), rot: rand(0, TAU), spin: rand(-.35, .35), life: rand(80, 190)
      });
    }
  },
  confettiTick() {
    const c = this.confetti;
    if (!c || !c.cv || !c.cv.isConnected) return;
    const cv = c.cv, w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== w) { cv.width = w; cv.height = h; }
    const x = cv.getContext('2d');
    x.clearRect(0, 0, w, h);
    for (let i = c.ps.length - 1; i >= 0; i--) {
      const p = c.ps[i];
      if (p.px === undefined) { p.px = w * .5; p.py = h * .5; }
      p.px += p.vx;
      p.py += p.vy;
      p.vy += .35; p.vx *= .99; p.rot += p.spin;
      p.life--;
      if (p.life <= 0 || p.py > h + 40) { c.ps.splice(i, 1); continue; }
      x.save();
      x.translate(p.px, p.py); x.rotate(p.rot);
      x.globalAlpha = clamp(p.life / 60, 0, 1);
      x.fillStyle = p.col;
      x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      x.restore();
    }
  },

  /* =========================================================
     IN-GAME HUD
     ========================================================= */
  enterGame() {
    this.clearScreen();
    this.retroMode(false);
    this.hud.classList.remove('hidden');
    document.getElementById('hLvlNo').textContent = G.levelIndex + 1;
    document.getElementById('hLvlName').textContent = G.level.name;
    const sb = document.getElementById('hSkin');
    sb.style.setProperty('--rc', RC(G.skin.rar));
    document.getElementById('sbName').textContent = G.skin.name;
    document.getElementById('sbAbil').textContent = G.skin.abil;
    this.anim = [{ cv: document.getElementById('sbCv'), skin: G.skin, opts: { float: true, scale: .3 } }];
    this.syncHud();
    this.centerToast(G.level.name, THEMES[G.theme].amb);
  },
  syncHud() {
    const total = G.level ? G.level.balls : 0;
    let s = '';
    for (let i = 0; i < total; i++) s += `<i class="${i < total - G.ballsLeft ? 'spent' : ''}"></i>`;
    document.getElementById('hAmmo').innerHTML = s;
    document.getElementById('hCoins').textContent = fmt(G.save.coins + G.coinsEarned);
    document.getElementById('hScore').textContent = fmt(G.score);
    const k = document.getElementById('sbKey');
    const used = !!(G.ball && G.ball.game && G.ball.game.used);
    k.classList.toggle('used', used);
    k.classList.toggle('ready', G.state === 'flight' && !used);
    k.textContent = used ? 'USED' : (G.state === 'flight' ? 'SPACE' : 'ABILITY');
  },
  /* re-point the HUD badge at whatever skin is equipped right now */
  refreshSkinBadge() {
    if (!G.skin) return;
    const sb = document.getElementById('hSkin');
    if (!sb) return;
    sb.style.setProperty('--rc', RC(G.skin.rar));
    document.getElementById('sbName').textContent = G.skin.name;
    document.getElementById('sbAbil').textContent = G.skin.abil;
    const cv = document.getElementById('sbCv');
    const entry = this.anim.find(a => a.cv === cv);
    if (entry) entry.skin = G.skin;
    else this.anim.push({ cv, skin: G.skin, opts: { float: true, scale: .3 } });
  },

  markAbilityUsed() {
    const k = document.getElementById('sbKey');
    k.classList.remove('ready'); k.classList.add('used');
    k.textContent = 'USED';
  },
  centerToast(txt, col) {
    const el = document.getElementById('ctoast');
    el.textContent = txt;
    el.style.color = col || '#fff';
    el.style.textShadow = `0 0 40px ${col || '#fff'},0 6px 0 rgba(0,0,0,.35)`;
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  },
  toast(html, col) {
    const box = document.getElementById('toasts');
    const d = document.createElement('div');
    d.className = 'toast';
    d.style.setProperty('--rc', col || '#ffc23d');
    d.style.borderColor = (col || '#ffc23d') + '66';
    d.innerHTML = html;
    box.appendChild(d);
    setTimeout(() => { d.classList.add('out'); setTimeout(() => d.remove(), 320); }, 2100);
  },
  retroMode(on) {
    document.body.style.fontFamily = on ? "'Press Start 2P',monospace" : '';
    document.querySelectorAll('.lvl-name,.sb-abil,.stat').forEach(e => {
      e.style.letterSpacing = on ? '0' : '';
      e.style.fontSize = on ? '9px' : '';
    });
  },
  confirmRetry() {
    SFX.play('ui');
    this.hud.classList.add('hidden');
    this.retroMode(false);
    G.startLevel(G.levelIndex);
  },
  escape() {
    if (!this.stage.classList.contains('hidden')) return;
    if (G.state !== 'menu' && !this.cur) this.showMenu();
  },

  /* ---------- END SCREEN ---------- */
  showEnd(win, data) {
    this.hud.classList.add('hidden');
    const best = G.save.best['L' + G.levelIndex] || 0;
    const thresholds = [4000, 9000, 15000].map((v, i) => v + G.levelIndex * 2200);
    const sN = win ? clamp(Math.max(1, thresholds.filter(t => G.score >= t).length), 1, 3) : 0;
    const star = on => `<svg class="star ${on ? 'on' : ''}" viewBox="0 0 24 24" fill="${on ? '#ffc23d' : '#8894b5'}"
        style="filter:${on ? 'drop-shadow(0 0 14px #ffc23d)' : 'none'}">
        <path d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4l7.2-.8z"/></svg>`;
    const rows = win ? `
      <div class="end-row"><span>Score</span><b>${fmt(G.score)}</b></div>
      <div class="end-row"><span>Unused balls bonus</span><b>+${fmt(data.bonus || 0)}</b></div>
      <div class="end-row"><span>Coins earned</span><b>+${fmt(G.coinsEarned)} &#9679;</b></div>
      <div class="end-row"><span>Personal best</span><b>${fmt(best)}</b></div>`
      : `<div class="end-row"><span>Madballs left standing</span><b>${G.enemies.length}</b></div>
      <div class="end-row"><span>Score</span><b>${fmt(G.score)}</b></div>
      <div class="end-row"><span>Coins salvaged</span><b>+${fmt(Math.round(G.coinsEarned * .5))} &#9679;</b></div>`;
    const nextLocked = G.levelIndex + 1 >= LEVELS.length;
    const el = this.set(`
      ${this.wallet()}
      <div class="end-card">
        <div class="end-title ${win ? '' : 'fail'}">${win ? 'CLEARED' : 'WIPED OUT'}</div>
        <div style="font-size:11px;letter-spacing:.24em;color:#93a2c6;font-weight:800;margin-top:6px">
          LEVEL ${G.levelIndex + 1} &nbsp;&bull;&nbsp; ${G.level.name}</div>
        <div class="stars">${star(sN >= 1)}${star(sN >= 2)}${star(sN >= 3)}</div>
        <div class="end-rows">${rows}</div>
        <div class="end-btns">
          ${win && !nextLocked ? '<button class="btn primary" id="eNext">NEXT LEVEL</button>' : ''}
          <button class="btn" id="eRetry">${win ? 'REPLAY' : 'TRY AGAIN'}</button>
          <button class="btn ghost" id="eShop">CRATES</button>
          <button class="btn ghost" id="eMenu">MENU</button>
        </div>
      </div>`, 'end');
    this.retroMode(false);
    const n = el.querySelector('#eNext');
    if (n) n.onclick = () => { SFX.play('ui'); this.clearScreen(); G.startLevel(G.levelIndex + 1); };
    el.querySelector('#eRetry').onclick = () => { SFX.play('ui'); this.clearScreen(); G.startLevel(G.levelIndex); };
    el.querySelector('#eShop').onclick = () => { SFX.play('ui'); this.showShop(); };
    el.querySelector('#eMenu').onclick = () => { SFX.play('ui'); this.showMenu(); };
    if (win) setTimeout(() => { for (let i = 0; i < sN; i++) setTimeout(() => SFX.play('blip', { f: 900 + i * 260 }), i * 260); }, 380);
  }
};

/* ---------- crate artwork ---------- */
function drawCrateArt(cv, crate, t, opts = {}) {
  const x = cv.getContext('2d');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = cv.clientWidth || 150, h = cv.clientHeight || 132;
  if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.clearRect(0, 0, w, h);
  const S = Math.min(w, h) * .40;
  x.save();
  x.translate(w / 2, h / 2 + (opts.float ? Math.sin(t * 1.6) * S * .06 : 0));

  x.save(); x.globalCompositeOperation = 'lighter';
  glowCircle(x, 0, 0, Math.min(S * 2.6, Math.min(w, h) * .5), crate.cc, .35 + Math.sin(t * 2) * .08);
  x.restore();

  const dark = crate.id === 'void';
  const c1 = crate.id === 'wood' ? '#96683a' : crate.id === 'gold' ? '#f5c94e' : '#33165c';
  const c2 = crate.id === 'wood' ? '#4d2f11' : crate.id === 'gold' ? '#a1690c' : '#160726';

  // lid + body isometric-ish box
  const g = x.createLinearGradient(-S, -S, S, S);
  g.addColorStop(0, shade(c1, .18)); g.addColorStop(.55, c1); g.addColorStop(1, c2);
  x.fillStyle = g;
  rr(x, -S, -S * .55, S * 2, S * 1.5, S * .1); x.fill();
  x.strokeStyle = shade(c2, -.3); x.lineWidth = S * .07; x.stroke();
  // lid
  const g2 = x.createLinearGradient(0, -S, 0, -S * .4);
  g2.addColorStop(0, shade(c1, .3)); g2.addColorStop(1, c2);
  x.fillStyle = g2;
  rr(x, -S * 1.08, -S * .95, S * 2.16, S * .5, S * .1); x.fill();
  x.strokeStyle = shade(c2, -.3); x.stroke();
  // metal bands
  x.fillStyle = dark ? '#6a4ba8' : '#8e97a8';
  for (const bx of [-S * .62, S * .62]) {
    x.fillRect(bx - S * .1, -S * .95, S * .2, S * 1.9);
  }
  x.fillStyle = dark ? '#8f6ad8' : '#b9c2d2';
  for (const bx of [-S * .62, S * .62]) x.fillRect(bx - S * .1, -S * .95, S * .06, S * 1.9);
  // lock
  x.fillStyle = crate.cc;
  rr(x, -S * .2, -S * .5, S * .4, S * .42, S * .07); x.fill();
  x.strokeStyle = shade(crate.cc, -.4); x.lineWidth = S * .05; x.stroke();
  x.strokeStyle = crate.cc; x.lineWidth = S * .08;
  x.beginPath(); x.arc(0, -S * .5, S * .14, Math.PI, 0); x.stroke();
  x.fillStyle = shade(crate.cc, -.5);
  x.beginPath(); x.arc(0, -S * .3, S * .06, 0, TAU); x.fill();

  // rarity sparkles
  x.save(); x.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 7; i++) {
    const a = t * (.6 + i * .18) + i * 2.2;
    const rr2 = S * (1.3 + Math.sin(t * 1.4 + i) * .25);
    const px = Math.cos(a) * rr2, py = Math.sin(a) * rr2 * .7;
    const sz = S * (.05 + Math.abs(Math.sin(t * 3 + i)) * .07);
    starPath(x, px, py, sz, sz * .4, 4, t + i);
    x.fillStyle = crate.cc; x.fill();
  }
  x.restore();
  x.restore();
}

'use strict';
(function boot() {
  const start = () => {
    const cv = document.getElementById('cv');
    if (!window.Matter) {
      document.body.insertAdjacentHTML('beforeend',
        `<div style="position:fixed;inset:0;display:grid;place-items:center;background:#07080f;color:#eef2ff;
          font-family:system-ui;text-align:center;padding:30px;z-index:999">
          <div><h2 style="margin-bottom:10px">Physics engine failed to load</h2>
          <p style="opacity:.7;font-size:13px">MADBALLS needs matter.js from cdnjs. Check your connection and reload.</p></div>
        </div>`);
      return;
    }
    G.init(cv);
    UI.init();
    if (typeof ADMIN !== 'undefined') ADMIN.init();   // absent in the public build
    // first interaction unlocks audio
    const unlock = () => { SFX.init(); SFX.resume(); window.removeEventListener('pointerdown', unlock); };
    window.addEventListener('pointerdown', unlock);
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
