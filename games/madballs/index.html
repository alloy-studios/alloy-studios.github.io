    x.restore();
    x.restore();
  },

  /* ---------- COLOSSUS fist ---------- */
  giantFist(x, g, t) {
    const f = g.fist;
    if (!f) return;
    const R2 = f.r;
    // telegraph: a shadow that darkens as the fist drops, and a marching target ring
    if (f.phase === 'raise' || f.phase === 'slam') {
      const k = clamp(1 - (GY - 90 - f.y) / 1300, 0, 1);
      x.save();
      x.fillStyle = `rgba(0,0,0,${.12 + k * .4})`;
      x.beginPath(); x.ellipse(f.x, GY + 3, R2 * (1.7 - k * .55), R2 * .2, 0, 0, TAU); x.fill();
      if (f.phase === 'raise') {
        const p = .5 + Math.sin(t * 14) * .5;
        x.strokeStyle = `rgba(255,90,40,${.45 + p * .45})`; x.lineWidth = 5;
        x.setLineDash([20, 12]); x.lineDashOffset = -t * 80;
        x.beginPath(); x.ellipse(f.x, GY + 3, R2 * 1.3, R2 * .21, 0, 0, TAU); x.stroke();
        x.setLineDash([]);
      }
      x.restore();
    }
    x.save();
    x.translate(f.x, f.y);
    if (f.phase === 'sweep') x.rotate(f.dir * .07 + Math.sin(f.t * .08) * .03);
    this.titanArm(x, R2, t);
    this.titanFist(x, R2, t);
    if (f.phase === 'slam') {
      x.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 10; i++) {
        const lx = (i % 2 ? 1 : -1) * R2 * (.95 + hash(i * 3.7 + Math.floor(t * 30)) * .7);
        const len = R2 * (1.2 + hash(i * 1.3) * 1.6);
        const gr = x.createLinearGradient(0, -R2 * 1.1, 0, -R2 * 1.1 - len);
        gr.addColorStop(0, 'rgba(255,215,180,.5)'); gr.addColorStop(1, 'rgba(255,215,180,0)');
        x.strokeStyle = gr; x.lineWidth = 3 + hash(i) * 4;
        x.beginPath(); x.moveTo(lx, -R2 * 1.1); x.lineTo(lx, -R2 * 1.1 - len); x.stroke();
      }
    }
    x.restore();
  },

  /* COLOSSUS: a forearm of crimson basalt with magma in the seams */
  titanArm(x, R, t) {
    const top = -1800, w0 = R * .64, w1 = R * .82;
    const pulse = .6 + Math.sin(t * 4) * .4;
    x.save();
    x.beginPath();
    x.moveTo(-w0, -R * .6); x.lineTo(-w1, top); x.lineTo(w1, top); x.lineTo(w0, -R * .6); x.closePath();
    const sg = x.createLinearGradient(-w1, 0, w1, 0);
    sg.addColorStop(0, '#220704'); sg.addColorStop(.16, '#6e2014'); sg.addColorStop(.34, '#b2462d');
    sg.addColorStop(.52, '#7d2617'); sg.addColorStop(.85, '#3d0e07'); sg.addColorStop(1, '#1a0503');
    x.fillStyle = sg; x.fill();
    x.clip();
    for (let y = -R * 1.3, n = 0; y > top; y -= 160, n++) {
      const sag = 26 + hash(n) * 14;
      x.strokeStyle = '#170402'; x.lineWidth = 10;
      x.beginPath(); x.moveTo(-w1, y); x.quadraticCurveTo(0, y + sag, w1, y); x.stroke();
      x.save(); x.globalCompositeOperation = 'lighter';
      x.strokeStyle = `rgba(255,${115 + pulse * 70 | 0},35,${.6 * pulse})`; x.lineWidth = 3.5;
      x.beginPath(); x.moveTo(-w1, y); x.quadraticCurveTo(0, y + sag, w1, y); x.stroke();
      x.restore();
      // a chip or two per plate
      x.fillStyle = 'rgba(20,4,2,.45)';
      x.beginPath(); x.ellipse((hash(n * 5.3) - .5) * w1 * 1.2, y - 70, 10 + hash(n) * 12, 5, .3, 0, TAU); x.fill();
    }
    // rim light from the sky down the left edge
    const rl = x.createLinearGradient(-w1, 0, -w1 + R * .35, 0);
    rl.addColorStop(0, 'rgba(255,190,160,.32)'); rl.addColorStop(1, 'rgba(255,190,160,0)');
    x.fillStyle = rl; x.fillRect(-w1, top, R * .35, -top);
    x.restore();
  },

  titanFist(x, R, t) {
    const pulse = .6 + Math.sin(t * 4 + 1) * .4;
    const palm = () => rr(x, -R * .94, -R * .8, R * 1.88, R * 1.0, R * .32);
    // the back of the hand
    palm();
    const pg = x.createLinearGradient(-R, 0, R, 0);
    pg.addColorStop(0, '#2e0905'); pg.addColorStop(.22, '#94321e'); pg.addColorStop(.42, '#cc5638');
    pg.addColorStop(.72, '#86291a'); pg.addColorStop(1, '#260703');
    x.fillStyle = pg; x.fill();
    x.strokeStyle = '#140402'; x.lineWidth = R * .035; x.stroke();
    // four curled fingers, knuckles down
    const fw = R * .45;
    for (let i = 0; i < 4; i++) {
      const fx = -R * .69 + i * R * .46, fy0 = -R * .16, fy1 = R * (.74 - Math.abs(i - 1.4) * .06);
      rr(x, fx - fw / 2, fy0, fw, fy1 - fy0, fw * .46);
      const fg = x.createLinearGradient(fx - fw / 2, 0, fx + fw / 2, 0);
      fg.addColorStop(0, '#4a1409'); fg.addColorStop(.32, '#d45c3c'); fg.addColorStop(.68, '#97321e'); fg.addColorStop(1, '#330b05');
      x.fillStyle = fg; x.fill();
      x.strokeStyle = '#140402'; x.lineWidth = R * .035; x.stroke();
      // knuckle plane, joint crease, a lit knuckle top
      const kg = x.createLinearGradient(0, fy1 - fw * .55, 0, fy1);
      kg.addColorStop(0, 'rgba(0,0,0,0)'); kg.addColorStop(1, 'rgba(20,4,2,.45)');
      x.fillStyle = kg; rr(x, fx - fw / 2, fy1 - fw * .55, fw, fw * .55, fw * .46); x.fill();
      x.strokeStyle = 'rgba(20,4,2,.75)'; x.lineWidth = R * .028;
      x.beginPath(); x.moveTo(fx - fw * .3, R * .27); x.quadraticCurveTo(fx, R * .34, fx + fw * .3, R * .27); x.stroke();
      x.fillStyle = 'rgba(255,200,165,.38)';
      x.beginPath(); x.ellipse(fx - fw * .1, fy0 + fw * .32, fw * .2, fw * .1, 0, 0, TAU); x.fill();
    }
    // thumb wrapped across the first two fingers
    x.save();
    x.translate(-R * .14, -R * .04); x.rotate(-.1);
    rr(x, -R * .74, -R * .18, R * .98, R * .38, R * .19);
    const tg = x.createLinearGradient(0, -R * .18, 0, R * .2);
    tg.addColorStop(0, '#e8744f'); tg.addColorStop(.5, '#a63b25'); tg.addColorStop(1, '#40100a');
    x.fillStyle = tg; x.fill();
    x.strokeStyle = '#140402'; x.lineWidth = R * .035; x.stroke();
    rr(x, R * .04, -R * .12, R * .2, R * .25, R * .08);
    x.fillStyle = '#1e0603'; x.fill();
    x.fillStyle = 'rgba(255,140,90,.5)'; x.fillRect(R * .07, -R * .1, R * .05, R * .18);
    x.restore();
    // magma veins breaking through the stone
    x.save();
    x.globalCompositeOperation = 'lighter';
    x.lineJoin = 'round'; x.lineCap = 'round';
    const veins = [[[-.78, -.62], [-.55, -.44], [-.6, -.24], [-.42, -.1]], [[.28, -.72], [.43, -.5], [.62, -.46], [.7, -.2]],
      [[-.12, -.58], [.02, -.36], [-.04, -.2]], [[.5, .2], [.58, .42]]];
    for (const [w, a] of [[R * .085, .25], [R * .035, .95]]) {
      x.strokeStyle = `rgba(255,${125 + pulse * 80 | 0},45,${a * pulse})`; x.lineWidth = w;
      for (const v of veins) { x.beginPath(); v.forEach((p, i) => x[i ? 'lineTo' : 'moveTo'](p[0] * R, p[1] * R)); x.stroke(); }
    }
    glowCircle(x, 0, R * .1, R * 2, '#ff5a1f', .14 + pulse * .06);
    x.restore();
    // bronze bracer over the wrist, a rune gem at its heart
    const by = -R * 1.04, bh = R * .38, bw = R * .74;
    rr(x, -bw, by, bw * 2, bh, R * .08);
    const bg = x.createLinearGradient(0, by, 0, by + bh);
    bg.addColorStop(0, '#ffe7a0'); bg.addColorStop(.3, '#d69c36'); bg.addColorStop(.75, '#8a5a18'); bg.addColorStop(1, '#4a2c08');
    x.fillStyle = bg; x.fill();
    x.strokeStyle = '#2e1a04'; x.lineWidth = R * .03; x.stroke();
    x.strokeStyle = 'rgba(255,240,190,.5)'; x.lineWidth = R * .015;
    x.beginPath(); x.moveTo(-bw + R * .06, by + bh * .22); x.lineTo(bw - R * .06, by + bh * .22); x.stroke();
    for (const s of [-.82, -.5, .5, .82]) {
      x.fillStyle = '#5a3a0e'; x.beginPath(); x.arc(s * bw, by + bh * .58, R * .045, 0, TAU); x.fill();
      x.fillStyle = '#fff1c4'; x.beginPath(); x.arc(s * bw - R * .012, by + bh * .58 - R * .012, R * .018, 0, TAU); x.fill();
    }
    const gy = by + bh * .52;
    x.save(); x.globalCompositeOperation = 'lighter';
    glowCircle(x, 0, gy, R * .42, '#ff5a1f', .55 * pulse + .25);
    x.restore();
    x.beginPath(); x.moveTo(0, gy - R * .15); x.lineTo(R * .11, gy); x.lineTo(0, gy + R * .15); x.lineTo(-R * .11, gy); x.closePath();
    const gg = x.createLinearGradient(0, gy - R * .15, 0, gy + R * .15);
    gg.addColorStop(0, '#ffe2a0'); gg.addColorStop(.5, '#ff6a2a'); gg.addColorStop(1, '#8a1a06');
    x.fillStyle = gg; x.fill();
    x.strokeStyle = '#2e0a02'; x.lineWidth = R * .02; x.stroke();
    // rim light down the left of the fist
    x.save(); palm(); x.clip();
    x.globalCompositeOperation = 'lighter';
    const rl = x.createLinearGradient(-R * .94, 0, -R * .55, 0);
    rl.addColorStop(0, 'rgba(255,195,165,.36)'); rl.addColorStop(1, 'rgba(255,195,165,0)');
    x.fillStyle = rl; x.fillRect(-R, -R, R * .5, R * 2);
    x.restore();
  },

  /* ---------- ECLIPSE shadow tendrils ---------- */
  tendrilSpine(td, t) {
    const segs = 12, pts = [];
    for (let k = 0; k <= segs; k++) {
      const u = k / segs;
      const sway = Math.sin(t * 2.1 + td.seed + u * 3.6) * td.len * .2 * u
        + Math.sin(t * 3.3 + td.seed * 2 + u * 6) * td.len * .06 * u;
      pts.push({ x: td.x + sway, y: GY - td.len * u, u });
    }
    return pts;
  },
  tendrilPath(x, td, t) {
    const pts = this.tendrilSpine(td, t);
    x.beginPath();
    pts.forEach((p, k) => k ? x.lineTo(p.x, p.y) : x.moveTo(p.x, p.y));
    return pts;
  },
  tendrils(x, g, t) {
    if (!g.tendrils.length) return;
    x.save();
    for (const td of g.tendrils) {
      if (td.len < 4) continue;
      const pts = this.tendrilSpine(td, t);
      const n = pts.length - 1;
      // build a tapered silhouette so it reads as a limb, not a wire
      const L = [], Rr = [];
      for (let k = 0; k <= n; k++) {
        const p = pts[k];
        const a = pts[Math.max(0, k - 1)], b = pts[Math.min(n, k + 1)];
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
        const nx = -dy / d, ny = dx / d;
        const w = lerp(15, 1.2, Math.pow(p.u, .8));
        L.push({ x: p.x + nx * w, y: p.y + ny * w });
        Rr.push({ x: p.x - nx * w, y: p.y - ny * w });
      }
      x.beginPath();
      L.forEach((p, k) => k ? x.lineTo(p.x, p.y) : x.moveTo(p.x, p.y));
      for (let k = n; k >= 0; k--) x.lineTo(Rr[k].x, Rr[k].y);
      x.closePath();
      const gr = x.createLinearGradient(td.x, GY, td.x, GY - td.len);
      gr.addColorStop(0, '#1a0b2e');
      gr.addColorStop(.55, '#0d0518');
      gr.addColorStop(1, '#050209');
      x.fillStyle = gr; x.fill();
      x.strokeStyle = 'rgba(176,107,255,.75)'; x.lineWidth = 1.6; x.stroke();
      // inner vein
      x.beginPath();
      pts.forEach((p, k) => k ? x.lineTo(p.x, p.y) : x.moveTo(p.x, p.y));
      x.strokeStyle = 'rgba(255,46,136,.35)'; x.lineWidth = 2; x.lineCap = 'round';
      x.stroke();
      // barbs
      for (let k = 2; k < n; k += 2) {
        const p = pts[k];
        const a = pts[k - 1], b = pts[k + 1];
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
        const dir = (k % 4 === 0) ? 1 : -1;
        const nx = -dy / d * dir, ny = dx / d * dir;
        const w = lerp(15, 1.2, Math.pow(p.u, .8));
        x.beginPath();
        x.moveTo(p.x + nx * w, p.y + ny * w);
        x.lineTo(p.x + nx * (w + 16 * (1 - p.u * .6)) - dy / d * 12, p.y + ny * (w + 16 * (1 - p.u * .6)) + dx / d * 12);
        x.lineTo(p.x + nx * w * .3 - dy / d * 6, p.y + ny * w * .3 + dx / d * 6);
        x.closePath();
        x.fillStyle = '#0d0518'; x.fill();
        x.strokeStyle = 'rgba(176,107,255,.5)'; x.lineWidth = 1; x.stroke();
      }
      // clawed tip
      const tip = pts[n], pv = pts[n - 1];
      const ang = Math.atan2(tip.y - pv.y, tip.x - pv.x);
      x.save();
      x.translate(tip.x, tip.y); x.rotate(ang + Math.PI / 2);
      x.strokeStyle = '#0d0518'; x.lineWidth = 3.5; x.lineCap = 'round';
      for (let k = -1; k <= 1; k++) {
        x.beginPath();
        x.moveTo(0, 4);
        x.quadraticCurveTo(k * 11, -7, k * 15, -21);
        x.stroke();
      }
      x.strokeStyle = 'rgba(176,107,255,.7)'; x.lineWidth = 1.2;
      for (let k = -1; k <= 1; k++) {
        x.beginPath();
        x.moveTo(0, 4);
        x.quadraticCurveTo(k * 11, -7, k * 15, -21);
        x.stroke();
      }
      x.globalCompositeOperation = 'lighter';
      glowCircle(x, 0, -8, 30, '#b06bff', .4);
      x.restore();
      // fissure where it broke through the ground
      x.save();
      x.globalCompositeOperation = 'lighter';
      glowCircle(x, td.x, GY - 2, 46, '#7a2fd0', .3);
      x.restore();
    }
    x.restore();
  },
  tendrilGlow(x, g, t) {
    for (const td of g.tendrils) {
      if (td.len < 4) continue;
      x.save();
      x.globalCompositeOperation = 'lighter';
      this.tendrilPath(x, td, t);
      x.strokeStyle = 'rgba(150,80,235,.55)';
      x.lineWidth = 46; x.lineCap = 'round'; x.lineJoin = 'round';
      x.stroke();
      x.strokeStyle = 'rgba(200,140,255,.5)';
      x.lineWidth = 16;
      x.stroke();
      glowCircle(x, td.tipX, td.tipY, 60, '#c98cff', .5);
      glowCircle(x, td.x, GY - 4, 70, '#7a2fd0', .45);
      x.restore();
    }
  },

  /* ---------- SWARM drones ---------- */
  drones(x, g, t) {
    if (!g.drones.length) return;
    x.save();
    for (const d of g.drones) {
      const a = Math.atan2(d.vy, d.vx);
      x.save();
      x.translate(d.x, d.y);
      x.scale(1.7, 1.7);
      x.save();
      x.globalCompositeOperation = 'lighter';
      glowCircle(x, 0, 0, 16, '#ffd23d', .45);
      x.restore();
      x.rotate(a);
      // blurred wings
      x.fillStyle = 'rgba(255,255,255,.4)';
      const flap = Math.sin(t * 45 + d.seed) * 4;
      x.beginPath(); x.ellipse(-1, -5 - flap * .3, 5, 2.4, -.5, 0, TAU); x.fill();
      x.beginPath(); x.ellipse(-1, 5 + flap * .3, 5, 2.4, .5, 0, TAU); x.fill();
      // body
      x.fillStyle = '#ffd23d';
      x.beginPath(); x.ellipse(0, 0, 6, 4, 0, 0, TAU); x.fill();
      x.fillStyle = '#2b2410';
      x.fillRect(-1.5, -4, 2, 8);
      x.fillRect(2, -3.4, 1.6, 6.8);
      x.fillStyle = '#fff';
      x.beginPath(); x.arc(4.6, 0, 1.5, 0, TAU); x.fill();
      x.restore();
    }
    x.restore();
  },

  /* ---------- TEMPEST cyclone ---------- */
  cyclone(x, g, t) {
    const v = g.vortex;
    if (!v) return;
    const fade = clamp(Math.min(v.t / 18, (v.life - v.t) / 40), 0, 1);
    x.save();
    x.globalCompositeOperation = 'lighter';
    x.translate(v.x, v.y);
    // funnel
    const H = 460;
    for (let i = 0; i < 16; i++) {
      const u = i / 16;
      const yy = -H * .72 + u * H;
      const rw = lerp(v.r * .22, v.r * .95, u);
      const spin = t * (5 - u * 2.2) + u * 5;
      x.strokeStyle = rgba('#cfe4f5', (.06 + u * .2) * fade);
      x.lineWidth = 8 + u * 12;
      x.beginPath();
      x.ellipse(Math.cos(spin) * rw * .12, yy, rw, rw * .2, Math.sin(spin) * .16, 0, TAU);
      x.stroke();
    }
    // debris streaks riding the wall
    for (let i = 0; i < 22; i++) {
      const u = hash(i * 3.1);
      const yy = -H * .72 + u * H;
      const rw = lerp(v.r * .22, v.r * .95, u);
      const a = t * (4.4 - u * 2) + i * 1.7;
      x.globalAlpha = fade * .8;
      x.strokeStyle = i % 3 === 0 ? '#ffffff' : '#9fd0f5';
      x.lineWidth = 2 + u * 2;
      x.beginPath();
      x.moveTo(Math.cos(a) * rw, yy + Math.sin(a) * rw * .2);
      x.lineTo(Math.cos(a - .5) * rw, yy + Math.sin(a - .5) * rw * .2);
      x.stroke();
      x.globalAlpha = 1;
    }
    glowCircle(x, 0, 0, v.r * .8, '#9fd0f5', .12 * fade);
    x.restore();
  },

  /* ---------- infection / acid / yolk overlays ---------- */
  statusCoat(x, b, t) {
    const gm = b.game;
    if (!gm.infected && !gm.acid && !(gm.slick > 0)) return;
    const w = gm.w || (gm.r || 20) * 2, h = gm.h || (gm.r || 20) * 2;
    x.save();
    x.translate(b.position.x, b.position.y);
    x.rotate(b.angle);
    const shape = () => {
      if (gm.shape === 'circle' || gm.enemy) { x.beginPath(); x.arc(0, 0, (gm.r || 20) + 2, 0, TAU); }
      else rr(x, -w / 2 - 2, -h / 2 - 2, w + 4, h + 4, 5);
    };
    if (gm.infected) {
      const pulse = .5 + Math.sin(t * 5 + gm.seed) * .5;
      x.globalAlpha = clamp(gm.infected / 200, 0, 1) * (.24 + pulse * .2);
      x.fillStyle = '#7ddd1f';
      shape(); x.fill();
      x.globalAlpha = clamp(gm.infected / 200, 0, 1) * .75;
      x.fillStyle = '#b6ff3d';
      for (let i = 0; i < 5; i++) {
        const px = (hash(gm.seed + i * 3.3) - .5) * w * .8;
        const py = (hash(gm.seed + i * 7.7) - .5) * h * .8;
        const rr2 = (1.6 + hash(gm.seed + i) * 2.4) * (.7 + pulse * .5);
        x.beginPath(); x.arc(px, py, rr2, 0, TAU); x.fill();
      }
    }
    if (gm.acid) {
      x.globalAlpha = clamp(gm.acid / 160, 0, 1) * .4;
      x.strokeStyle = '#9dff4d'; x.lineWidth = 3;
      shape(); x.stroke();
      x.globalAlpha = clamp(gm.acid / 160, 0, 1) * .55;
      x.strokeStyle = '#c8ff8a'; x.lineWidth = 2; x.lineCap = 'round';
      for (let i = 0; i < 4; i++) {
        const px = (hash(gm.seed + i * 5.1) - .5) * w * .8;
        const drip = 3 + (Math.sin(t * 2 + i + gm.seed) * .5 + .5) * 9;
        x.beginPath(); x.moveTo(px, h / 2 - 2); x.lineTo(px, h / 2 - 2 + drip); x.stroke();
      }
    }
    if (gm.slick > 0) {
      // glossy yolk over the top, a shine streak, drips running off
      x.globalAlpha = clamp(gm.slick / 200, 0, 1);
      x.save(); shape(); x.clip();
      const yg = x.createLinearGradient(0, -h / 2, 0, h / 2);
      yg.addColorStop(0, 'rgba(255,212,60,.9)'); yg.addColorStop(.5, 'rgba(255,186,30,.55)'); yg.addColorStop(1, 'rgba(255,186,30,.1)');
      x.fillStyle = yg; x.fillRect(-w / 2 - 3, -h / 2 - 3, w + 6, h + 6);
      x.fillStyle = 'rgba(255,255,240,.8)';
      x.fillRect(-w * .36, -h / 2 + 2, w * .42, Math.max(2, Math.min(5, h * .1)));
      x.restore();
      x.fillStyle = 'rgba(255,196,40,.92)';
      for (let i = 0; i < 3; i++) {
        const px = (hash(gm.seed + i * 4.1) - .5) * w * .8, len = 4 + (Math.sin(t * 2 + i * 2 + gm.seed) * .5 + .5) * 11;
        x.beginPath(); x.ellipse(px, h / 2 + len * .45, 2.6, len * .6, 0, 0, TAU); x.fill();
      }
      x.globalAlpha = 1;
    }
    x.restore();
  },

  /* ---------- blocks ---------- */
  blocks(x, g, t) {
    for (const b of g.blocks) {
      if (b.game.dead) continue;
      const gm = b.game;
      x.save();
      x.translate(b.position.x, b.position.y);
      x.rotate(b.angle);
      if (gm.shape === 'circle') this.matCircle(x, gm, b, t, g);
      else this.matBox(x, gm, b, t, g);
      x.restore();
      if (gm.fire) this.fire(x, b, t);
      if (gm.frozen > 0) this.iceCoat(x, b);
      this.statusCoat(x, b, t);
    }
  },

  matBox(x, gm, b, t, g) {
    const m = MATS[gm.mat], w = gm.w, h = gm.h;
    const hw = w / 2, hh = h / 2;
    const dmg = 1 - clamp(gm.hp / gm.maxhp, 0, 1);
    const rad = gm.mat === 'stone' || gm.mat === 'steel' ? 3 : 5;
    // shadow
    x.fillStyle = 'rgba(0,0,0,.22)';
    rr(x, -hw + 3, -hh + 5, w, h, rad); x.fill();

    if (gm.gold) {
      // a gold ingot: bright bevel, a glint sweeping across, sparkles
      rr(x, -hw, -hh, w, h, rad);
      const gg = x.createLinearGradient(-hw, -hh, hw * .4, hh);
      gg.addColorStop(0, '#fff6c4'); gg.addColorStop(.25, '#ffd24a'); gg.addColorStop(.5, '#fff1a0');
      gg.addColorStop(.72, '#d89a1a'); gg.addColorStop(1, '#8a5606');
      x.fillStyle = gg; x.fill();
      x.strokeStyle = '#7a4a04'; x.lineWidth = 2.2; x.stroke();
      x.save(); rr(x, -hw, -hh, w, h, rad); x.clip();
      x.strokeStyle = 'rgba(255,255,230,.65)'; x.lineWidth = 1.6;
      rr(x, -hw + 3, -hh + 3, w - 6, h - 6, Math.max(1, rad - 2)); x.stroke();
      x.globalCompositeOperation = 'lighter';
      const span = w + h, gx = ((t * .5 + hash(gm.seed)) % 1.6 - .3) * span - span / 2;
      x.rotate(-.6);
      x.fillStyle = 'rgba(255,250,210,.5)'; x.fillRect(gx, -span, 9, span * 2);
      x.restore();
      x.save(); x.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 2; i++) {
        const ph = (t * .9 + hash(gm.seed + i * 3)) % 1, sz = Math.sin(ph * Math.PI) * 6;
        if (sz > .5) { x.fillStyle = '#fffbe0'; starPath(x, (hash(gm.seed + i * 7) - .5) * w * .7, (hash(gm.seed + i * 2) - .5) * h * .7, sz, sz * .2, 4, 0); x.fill(); }
      }
      x.restore();
    } else if (gm.mat === 'ice') {
      x.save();
      rr(x, -hw, -hh, w, h, rad); x.clip();
      const gr = x.createLinearGradient(-hw, -hh, hw, hh);
      gr.addColorStop(0, 'rgba(214,242,255,.85)');
      gr.addColorStop(.5, 'rgba(120,190,230,.6)');
      gr.addColorStop(1, 'rgba(90,166,216,.8)');
      x.fillStyle = gr; x.fillRect(-hw, -hh, w, h);
      x.globalCompositeOperation = 'lighter';
      x.fillStyle = 'rgba(255,255,255,.5)';
      for (let i = -2; i < 3; i++) {
        x.save(); x.rotate(-.6);
        x.fillRect(-w, i * (h * .34) + hash(gm.seed + i) * 6, w * 2.4, Math.max(2, h * .06));
        x.restore();
      }
      x.restore();
      x.strokeStyle = 'rgba(255,255,255,.85)'; x.lineWidth = 2;
      rr(x, -hw, -hh, w, h, rad); x.stroke();
      x.save(); x.globalCompositeOperation = 'lighter';
      x.strokeStyle = 'rgba(160,225,255,.5)'; x.lineWidth = 4;
      rr(x, -hw, -hh, w, h, rad); x.stroke(); x.restore();
    } else if (gm.mat === 'tnt') {
      rr(x, -hw, -hh, w, h, rad);
      const gr = x.createLinearGradient(0, -hh, 0, hh);
      gr.addColorStop(0, '#f0574c'); gr.addColorStop(.5, m.c1); gr.addColorStop(1, m.c2);
      x.fillStyle = gr; x.fill();
      x.save(); rr(x, -hw, -hh, w, h, rad); x.clip();
      x.fillStyle = 'rgba(255,235,180,.9)';
      x.fillRect(-hw, -h * .16, w, h * .32);
      x.fillStyle = '#3a0f0b';
      x.font = `900 ${Math.min(h * .26, w * .32)}px Outfit, sans-serif`;
      x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText('TNT', 0, 0);
      x.restore();
      const pulse = .5 + Math.sin(t * 8 + gm.seed) * .5;
      x.save(); x.globalCompositeOperation = 'lighter';
      glowCircle(x, 0, -hh, 16 + pulse * 8, '#ffb03a', .8);
      x.restore();
    } else if (gm.mat === 'steel') {
      rr(x, -hw, -hh, w, h, rad);
      const gr = x.createLinearGradient(-hw, -hh, hw * .3, hh);
      gr.addColorStop(0, '#8d97ac'); gr.addColorStop(.28, m.c1);
      gr.addColorStop(.42, '#ffffff'); gr.addColorStop(.56, m.c1);
      gr.addColorStop(1, m.c2);
      x.fillStyle = gr; x.fill();
      x.strokeStyle = m.edge; x.lineWidth = 2.4; x.stroke();
      x.fillStyle = 'rgba(255,255,255,.4)';
      const rvx = hw - 7, rvy = hh - 7;
      for (const p of [[-rvx, -rvy], [rvx, -rvy], [-rvx, rvy], [rvx, rvy]]) {
        if (w < 26 || h < 26) break;
        x.beginPath(); x.arc(p[0], p[1], 2.6, 0, TAU); x.fill();
      }
    } else {
      // wood + stone
      rr(x, -hw, -hh, w, h, rad);
      const gr = x.createLinearGradient(-hw, -hh, hw * .5, hh);
      gr.addColorStop(0, shade(m.c1, .12)); gr.addColorStop(.55, m.c1); gr.addColorStop(1, m.c2);
      x.fillStyle = gr; x.fill();
      x.save(); rr(x, -hw, -hh, w, h, rad); x.clip();
      if (gm.mat === 'wood') {
        x.strokeStyle = 'rgba(70,40,14,.35)'; x.lineWidth = 1.6;
        const n = Math.max(2, Math.floor(Math.min(w, h) / 9));
        const along = w >= h;
        for (let i = 1; i < n; i++) {
          const o = -(along ? hh : hw) + (i / n) * (along ? h : w);
          x.beginPath();
          if (along) { x.moveTo(-hw, o); x.bezierCurveTo(-hw * .3, o + 2.5, hw * .3, o - 2.5, hw, o); }
          else { x.moveTo(o, -hh); x.bezierCurveTo(o + 2.5, -hh * .3, o - 2.5, hh * .3, o, hh); }
          x.stroke();
        }
        x.fillStyle = 'rgba(60,34,12,.3)';
        for (let i = 0; i < 2; i++) {
          const kx = (hash(gm.seed + i * 3) - .5) * w * .7, ky = (hash(gm.seed + i * 7) - .5) * h * .7;
          x.beginPath(); x.ellipse(kx, ky, 3.4, 2.4, 1, 0, TAU); x.fill();
        }
      } else {
        for (let i = 0; i < 12; i++) {
          const sx = (hash(gm.seed + i * 3.1) - .5) * w, sy = (hash(gm.seed + i * 5.7) - .5) * h;
          x.fillStyle = hash(gm.seed + i) > .5 ? 'rgba(255,255,255,.15)' : 'rgba(0,0,0,.18)';
          x.beginPath(); x.arc(sx, sy, 1 + hash(i + gm.seed) * 2.4, 0, TAU); x.fill();
        }
      }
      x.restore();
      x.strokeStyle = m.edge; x.lineWidth = 2; rr(x, -hw, -hh, w, h, rad); x.stroke();
      x.strokeStyle = 'rgba(255,255,255,.22)'; x.lineWidth = 1.6;
      x.beginPath(); x.moveTo(-hw + 3, -hh + 2); x.lineTo(hw - 3, -hh + 2); x.stroke();
    }

    // damage cracks
    if (dmg > .12 && gm.cracks) {
      x.save();
      rr(x, -hw, -hh, w, h, rad); x.clip();
      x.strokeStyle = `rgba(0,0,0,${.25 + dmg * .5})`;
      x.lineWidth = 1 + dmg * 1.8; x.lineJoin = 'round';
      const show = Math.ceil(gm.cracks.length * dmg);
      for (let i = 0; i < show; i++) {
        const c = gm.cracks[i];
        x.beginPath(); x.moveTo(c[0].x, c[0].y);
        for (let k = 1; k < c.length; k++) x.lineTo(c[k].x, c[k].y);
        x.stroke();
      }
      x.restore();
    }
    if (gm.hitFlash > 0) {
      x.save(); x.globalCompositeOperation = 'lighter';
      x.globalAlpha = clamp(gm.hitFlash, 0, 1) * .8;
      x.fillStyle = '#fff'; rr(x, -hw, -hh, w, h, rad); x.fill();
      x.restore();
    }
  },

  matCircle(x, gm, b, t, g) {
    const m = MATS[gm.mat], r = gm.r;
    x.fillStyle = 'rgba(0,0,0,.22)';
    x.beginPath(); x.arc(3, 5, r, 0, TAU); x.fill();
    const gr = x.createRadialGradient(-r * .35, -r * .4, r * .1, 0, 0, r * 1.1);
    if (gm.gold) { gr.addColorStop(0, '#fff6c4'); gr.addColorStop(.5, '#ffc23d'); gr.addColorStop(1, '#8a5606'); }
    else { gr.addColorStop(0, shade(m.c1, .2)); gr.addColorStop(.6, m.c1); gr.addColorStop(1, m.c2); }
    x.fillStyle = gr;
    x.beginPath(); x.arc(0, 0, r, 0, TAU); x.fill();
    x.strokeStyle = gm.gold ? '#7a4a04' : m.edge; x.lineWidth = 2; x.stroke();
    if (gm.gold) {
      x.save(); x.globalCompositeOperation = 'lighter';
      const ph = (t * .9 + hash(gm.seed)) % 1, sz = Math.sin(ph * Math.PI) * 7;
      x.fillStyle = '#fffbe0'; starPath(x, -r * .35, -r * .35, sz, sz * .2, 4, 0); x.fill();
      x.restore();
    }
    x.save(); x.beginPath(); x.arc(0, 0, r, 0, TAU); x.clip();
    for (let i = 0; i < 10; i++) {
      x.fillStyle = hash(gm.seed + i) > .5 ? 'rgba(255,255,255,.16)' : 'rgba(0,0,0,.2)';
      x.beginPath(); x.arc((hash(gm.seed + i * 3) - .5) * r * 1.7, (hash(gm.seed + i * 9) - .5) * r * 1.7, 1.5 + hash(i) * 2.5, 0, TAU); x.fill();
    }
    x.restore();
    if (gm.hitFlash > 0) {
      x.save(); x.globalCompositeOperation = 'lighter'; x.globalAlpha = clamp(gm.hitFlash, 0, 1) * .8;
      x.fillStyle = '#fff'; x.beginPath(); x.arc(0, 0, r, 0, TAU); x.fill(); x.restore();
    }
  },

  iceCoat(x, b) {
    const gm = b.game;
    x.save();
    x.translate(b.position.x, b.position.y); x.rotate(b.angle);
    x.globalCompositeOperation = 'lighter';
    x.globalAlpha = clamp(gm.frozen / 60, 0, 1) * .55;
    x.fillStyle = '#bfe9ff';
    if (gm.shape === 'circle') { x.beginPath(); x.arc(0, 0, (gm.r || 20) + 3, 0, TAU); x.fill(); }
    else { rr(x, -gm.w / 2 - 3, -gm.h / 2 - 3, gm.w + 6, gm.h + 6, 5); x.fill(); }
    x.strokeStyle = 'rgba(255,255,255,.8)'; x.lineWidth = 2;
    x.beginPath();
    for (let i = 0; i < 4; i++) {
      const a = i / 4 * TAU + gm.seed;
      x.moveTo(0, 0); x.lineTo(Math.cos(a) * (gm.w || gm.r) * .5, Math.sin(a) * (gm.h || gm.r) * .5);
    }
    x.stroke();
    x.restore();
  },

  fire(x, b, t) {
    const gm = b.game;
    const w = gm.w || gm.r * 2, h = gm.h || gm.r * 2;
    x.save();
    x.globalCompositeOperation = 'lighter';
    const n = Math.max(2, Math.round(w / 18));
    for (let i = 0; i < n; i++) {
      const px = b.position.x + (i / (n - 1 || 1) - .5) * w * .85;
      const ph = i * 2.3 + gm.seed;
      const fh = 16 + Math.sin(t * 9 + ph) * 8 + hash(i + gm.seed) * 10;
      const py = b.position.y - h / 2;
      const gr = x.createRadialGradient(px, py - fh * .3, 0, px, py - fh * .3, fh);
      gr.addColorStop(0, 'rgba(255,246,190,.9)');
      gr.addColorStop(.35, 'rgba(255,150,40,.7)');
      gr.addColorStop(1, 'rgba(255,60,0,0)');
      x.fillStyle = gr;
      x.beginPath(); x.ellipse(px + Math.sin(t * 6 + ph) * 3, py - fh * .35, fh * .5, fh, 0, 0, TAU); x.fill();
    }
    x.restore();
  },

  /* ---------- enemies ---------- */
  enemies(x, g, t) {
    const target = g.ball || { position: { x: g.slingX, y: g.slingY } };
    for (const e of g.enemies) {
      if (e.game.dead) continue;
      const gm = e.game, r = gm.r;
      const v = Math.hypot(e.velocity.x, e.velocity.y);
      const sq = clamp(v * .012, 0, .22);
      const hurt = clamp(1 - gm.hp / gm.maxhp, 0, 1);
      let dx = target.position.x - e.position.x, dy = target.position.y - e.position.y;
      const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
      const ang = e.angle * .5, ca = Math.cos(-ang), sa = Math.sin(-ang);
      x.save();
      x.translate(e.position.x, e.position.y);
      x.fillStyle = 'rgba(0,0,0,.25)';
      x.beginPath(); x.ellipse(0, r * .95, r * .9, r * .22, 0, 0, TAU); x.fill();
      x.rotate(ang);
      x.scale(1 + sq, 1 - sq);
      // a live shot bearing down turns the teasing into panic
      const near = !!g.flip || g.activeBalls.some(b => !b.isStatic && !b.game.done &&
        Math.hypot(b.position.x - e.position.x, b.position.y - e.position.y) < 230 + r);
      this.monster(x, gm.kind, r, { t, hurt, seed: gm.seed, gold: gm.gold, mood: near ? 'scared' : 'tease',
        lx: dx * ca - dy * sa, ly: dx * sa + dy * ca });
      if (gm.frozen > 0) {
        x.save(); x.globalCompositeOperation = 'lighter';
        x.globalAlpha = clamp(gm.frozen / 60, 0, 1) * .6;
        x.fillStyle = '#bfe9ff'; x.beginPath(); x.arc(0, 0, r + 4, 0, TAU); x.fill();
        x.restore();
      }
      if (gm.hitFlash > 0) {
        x.save(); x.globalCompositeOperation = 'lighter'; x.globalAlpha = clamp(gm.hitFlash, 0, 1) * .85;
        x.fillStyle = '#fff'; x.beginPath(); x.arc(0, 0, r, 0, TAU); x.fill(); x.restore();
      }
      x.restore();
      this.statusCoat(x, e, t);
      if (hurt > .02) {
        const bw = r * 1.8, by = e.position.y - r - (gm.kind === 'king' ? 30 : gm.kind === 'bomber' ? 26 : 14);
        x.save();
        x.translate(e.position.x - bw / 2, by);
        x.fillStyle = 'rgba(0,0,0,.5)'; rr(x, -1, -1, bw + 2, 7, 3.5); x.fill();
        x.fillStyle = hurt > .66 ? '#ff5f6d' : hurt > .33 ? '#ffc23d' : '#52e07a';
        rr(x, 0, 0, bw * (1 - hurt), 5, 2.5); x.fill();
        x.restore();
      }
    }
  },

  /* A madball, at the origin, radius r. Shared by the level and the menu crowd.
     They are pests, not villains: smug and teasing until a shot comes close,
     then panicking. o: { t, hurt, seed, lx, ly (where it is looking), gold,
     mood: 'tease' | 'scared', blink } */
  monster(x, kind, r, o = {}) {
    const E2 = ENEMIES[kind] || ENEMIES.grunt;
    const t = o.t || 0, hurt = o.hurt || 0, seed = o.seed || 0;
    const c1 = o.gold ? '#ffd24a' : E2.c1, c2 = o.gold ? '#a8670c' : E2.c2;
    const dark = shade(c2, -.5), ink = '#2a1608';
    const scared = o.mood === 'scared';
    const dizzy = hurt > .66 && !scared;
    const look = { lx: o.lx || 0, ly: o.ly || 0 };
    const blink = o.blink !== undefined ? o.blink : Math.sin(t * 1.7 + seed * 9) > .985;
    // every few seconds the tease gets ruder: a wink, a raspberry
    const cheek = !scared && !dizzy && ((t * .33 + hash(seed) * 3) % 3) < .9;
    x.save();
    x.lineCap = 'round'; x.lineJoin = 'round';

    // --- behind the body
    if (kind === 'grunt' || kind === 'runt') {
      for (const s of [-1, 1]) {
        x.save(); x.translate(s * r * .58, -r * .72); x.rotate(s * .5 + Math.sin(t * 3 + s + seed) * .08);
        x.beginPath(); x.moveTo(-r * .2, r * .12); x.quadraticCurveTo(-r * .2, -r * .32, 0, -r * .36);
        x.quadraticCurveTo(r * .2, -r * .32, r * .2, r * .12); x.closePath();
        x.fillStyle = c2; x.fill(); x.strokeStyle = dark; x.lineWidth = r * .05; x.stroke();
        x.fillStyle = 'rgba(255,170,190,.7)';
        x.beginPath(); x.ellipse(0, -r * .06, r * .08, r * .17, 0, 0, TAU); x.fill();
        x.restore();
      }
    }
    if (kind === 'bomber') {
      x.strokeStyle = '#4a3a2a'; x.lineWidth = r * .12;
      x.beginPath(); x.moveTo(r * .1, -r * .9); x.quadraticCurveTo(r * .45, -r * 1.3, r * .25, -r * 1.5); x.stroke();
      const p = .5 + Math.sin(t * 18 + seed) * .5;
      x.save(); x.globalCompositeOperation = 'lighter';
      glowCircle(x, r * .25, -r * 1.52, r * (.55 + p * .3), '#ffb03a', .9);
      x.fillStyle = '#fffbe0'; starPath(x, r * .25, -r * 1.52, r * (.22 + p * .12), r * .06, 5, t * 6); x.fill();
      x.restore();
    }
    if (kind === 'blob') {
      for (let i = 0; i < 3; i++) {
        const dx = (i - 1) * r * .48, dl = r * (.22 + (Math.sin(t * 2 + i * 2 + seed) * .5 + .5) * .25);
        x.fillStyle = c2;
        x.beginPath(); x.ellipse(dx, r * .78 + dl * .4, r * .13, dl * .7, 0, 0, TAU); x.fill();
      }
    }

    // --- glossy body
    const bg = x.createRadialGradient(-r * .32, -r * .38, r * .08, 0, 0, r * 1.08);
    bg.addColorStop(0, shade(c1, .35)); bg.addColorStop(.55, c1); bg.addColorStop(1, c2);
    x.fillStyle = bg; x.beginPath(); x.arc(0, 0, r, 0, TAU); x.fill();
    x.save(); x.clip();
    for (let i = 0; i < 5; i++) {
      const a = hash(seed + i * 3.1) * TAU, dd = r * (.55 + hash(seed + i) * .35);
      x.fillStyle = rgba(c2, .35);
      x.beginPath(); x.arc(Math.cos(a) * dd, Math.sin(a) * dd, r * (.05 + hash(seed + i * 5) * .05), 0, TAU); x.fill();
    }
    const ao = x.createLinearGradient(0, r * .1, 0, r);
    ao.addColorStop(0, 'rgba(0,0,0,0)'); ao.addColorStop(1, 'rgba(0,0,0,.25)');
    x.fillStyle = ao; x.fillRect(-r, 0, r * 2, r);
    // rosy cheeks
    x.fillStyle = 'rgba(255,120,150,.28)';
    for (const s of [-1, 1]) { x.beginPath(); x.ellipse(s * r * .55, r * .22, r * .17, r * .1, 0, 0, TAU); x.fill(); }
    x.restore();
    x.strokeStyle = 'rgba(255,255,255,.28)'; x.lineWidth = r * .07;
    x.beginPath(); x.arc(0, 0, r * .88, 1.9, 2.9); x.stroke();
    x.strokeStyle = dark; x.lineWidth = Math.max(1.6, r * .07);
    x.beginPath(); x.arc(0, 0, r * .97, 0, TAU); x.stroke();

    // --- faces
    const E = (ex, ey, er, opt) => this.tEye(x, ex, ey, er, Object.assign({ c1, ink, blink, look, scared }, opt));
    const sweat = () => this.mDrop(x, r * .72, -r * .5, r * .11);
    if (scared) {
      // uh-oh
      const shake = Math.sin(t * 40) * r * .02;
      x.translate(shake, 0);
      E(-r * .32, -r * .12, r * .3, {});
      E(r * .32, -r * .12, r * .3, {});
      if (kind !== 'tank') {
        x.fillStyle = '#4a1020'; x.beginPath(); x.ellipse(0, r * .45, r * .12, r * .15, 0, 0, TAU); x.fill();
      }
      sweat();
    } else if (dizzy) {
      this.spiralEye(x, -r * .32, -r * .12, r * .24, t, ink);
      E(r * .32, -r * .12, r * .26, { lid: .55 });
      x.strokeStyle = ink; x.lineWidth = r * .07;
      x.beginPath(); x.moveTo(-r * .28, r * .45);
      for (let i = 1; i <= 4; i++) x.quadraticCurveTo(-r * .28 + (i - .5) * r * .14, r * (.45 + (i % 2 ? .08 : -.08)), -r * .28 + i * r * .14, r * .45);
      x.stroke();
    } else if (kind === 'runt') {
      // blowing a raspberry, eyes screwed shut laughing
      for (const s of [-1, 1]) {
        x.strokeStyle = ink; x.lineWidth = r * .09;
        x.beginPath(); x.moveTo(s * r * .48, -r * .2); x.lineTo(s * r * .24, -r * .1); x.lineTo(s * r * .48, -r * .0); x.stroke();
      }
      this.tongue(x, 0, r * .36, r, t, ink);
    } else if (kind === 'tank') {
      // a dented army helmet tipped over one eye, too cool to care
      E(-r * .3, -r * .02, r * .24, { lid: .5 });
      E(r * .32, -r * .02, r * .24, { lid: .62 });
      // cocky grin
      x.fillStyle = '#4a1020';
      x.beginPath(); x.moveTo(-r * .32, r * .36); x.quadraticCurveTo(0, r * .62, r * .36, r * .3); x.quadraticCurveTo(0, r * .44, -r * .32, r * .36); x.fill();
      x.fillStyle = '#fffbe8';
      x.beginPath(); x.moveTo(-r * .2, r * .39); x.quadraticCurveTo(0, r * .46, r * .24, r * .35); x.lineTo(r * .22, r * .42); x.quadraticCurveTo(0, r * .5, -r * .18, r * .44); x.fill();
      x.strokeStyle = '#2e1206'; x.lineWidth = r * .05; x.beginPath(); x.moveTo(-r * .32, r * .36); x.quadraticCurveTo(0, r * .62, r * .36, r * .3); x.stroke();
      // chin strap
      x.strokeStyle = '#3a2a12'; x.lineWidth = r * .06;
      x.beginPath(); x.moveTo(-r * .85, -r * .2); x.quadraticCurveTo(-r * .7, r * .6, 0, r * .78); x.stroke();
    } else if (kind === 'bomber') {
      // sneaky sideways glance and a gap-toothed giggle
      const side = { lx: Math.sign(look.lx || 1) * .9, ly: -.1 };
      E(-r * .3, -r * .14, r * .26, { lid: .4, look: side });
      E(r * .3, -r * .14, r * .26, { lid: .4, look: side });
      const gig = Math.abs(Math.sin(t * 9)) * r * .04;
      x.fillStyle = '#4a1020';
      x.beginPath(); x.moveTo(-r * .38, r * .3); x.quadraticCurveTo(0, r * .72 + gig, r * .38, r * .3); x.closePath(); x.fill();
      x.fillStyle = '#fffbe8';
      x.fillRect(-r * .2, r * .3, r * .15, r * .13); x.fillRect(r * .05, r * .3, r * .15, r * .13);
      x.fillStyle = '#ff7a9a'; x.beginPath(); x.ellipse(0, r * .55 + gig, r * .16, r * .08, 0, 0, TAU); x.fill();
      x.strokeStyle = '#2e1206'; x.lineWidth = r * .05;
      x.beginPath(); x.moveTo(-r * .38, r * .3); x.quadraticCurveTo(0, r * .72 + gig, r * .38, r * .3); x.closePath(); x.stroke();
    } else if (kind === 'king') {
      // nose in the air: smug closed eyes and a "hmph"
      x.rotate(-.1);
      for (const s of [-1, 1]) {
        x.strokeStyle = ink; x.lineWidth = r * .07;
        x.beginPath(); x.arc(s * r * .3, -r * .16, r * .16, .2, Math.PI - .2); x.stroke();
        x.lineWidth = r * .045;
        x.beginPath(); x.arc(s * r * .3, -r * .44, r * .2, Math.PI + .5, TAU - .5); x.stroke();
      }
      x.strokeStyle = ink; x.lineWidth = r * .06;
      x.beginPath(); x.moveTo(-r * .2, r * .48); x.quadraticCurveTo(r * .1, r * .52, r * .3, r * .4); x.stroke();
      // an aristocrat's moustache, curled up at the ends
      x.fillStyle = '#5a2a10';
      for (const s of [-1, 1]) {
        x.beginPath(); x.moveTo(0, r * .3);
        x.bezierCurveTo(s * r * .2, r * .2, s * r * .4, r * .42, s * r * .52, r * .2);
        x.bezierCurveTo(s * r * .56, r * .1, s * r * .46, r * .06, s * r * .44, r * .14);
        x.bezierCurveTo(s * r * .38, r * .28, s * r * .2, r * .34, 0, r * .36); x.fill();
      }
    } else if (kind === 'blob') {
      // goofy: eyes wandering every which way, tongue lolling
      const w = t * 2 + seed;
      E(0, -r * .36, r * .24, { look: { lx: Math.cos(w), ly: Math.sin(w) } });
      E(-r * .46, -r * .04, r * .16, { look: { lx: Math.cos(w * 1.3 + 2), ly: Math.sin(w * 1.3 + 2) } });
      E(r * .46, -r * .04, r * .16, { look: { lx: Math.cos(-w + 4), ly: Math.sin(-w + 4) } });
      x.fillStyle = '#4a1030';
      x.beginPath(); x.ellipse(0, r * .38, r * .34, r * .2, 0, 0, Math.PI); x.fill();
      x.fillStyle = '#ff7aa8';
      x.beginPath(); x.ellipse(r * .1, r * .55 + Math.sin(t * 4) * r * .04, r * .14, r * .2, -.3, 0, TAU); x.fill();
      x.strokeStyle = '#2e1206'; x.lineWidth = r * .05;
      x.beginPath(); x.ellipse(0, r * .38, r * .34, r * .2, 0, 0, Math.PI); x.stroke();
    } else {
      // grunt: smug half-lidded stare, one eyebrow up, a lopsided smirk
      if (cheek) {
        x.strokeStyle = ink; x.lineWidth = r * .08;
        x.beginPath(); x.arc(-r * .32, -r * .1, r * .17, Math.PI + .3, TAU - .3); x.stroke();
      } else E(-r * .32, -r * .12, r * .26, { lid: .45 });
      E(r * .32, -r * .12, r * .26, { lid: .3 });
      x.strokeStyle = ink; x.lineWidth = r * .07;
      x.beginPath(); x.arc(r * .32, -r * .34, r * .24, Math.PI + .45, TAU - .3); x.stroke();
      if (cheek) this.tongue(x, -r * .04, r * .36, r * .85, t, ink);
      else {
        x.strokeStyle = ink; x.lineWidth = r * .08;
        x.beginPath(); x.moveTo(-r * .32, r * .4); x.quadraticCurveTo(r * .05, r * .52, r * .36, r * .26); x.stroke();
        x.fillStyle = '#fffbe8'; rr(x, r * .08, r * .38, r * .12, r * .12, r * .03); x.fill();
        x.strokeStyle = ink; x.lineWidth = r * .03; x.stroke();
      }
    }
    // headgear stays on whatever the mood
    if (kind === 'tank') {
      x.save(); x.rotate(-.18);
      const hg = x.createLinearGradient(-r, -r, r, 0);
      hg.addColorStop(0, '#9ab07a'); hg.addColorStop(.5, '#5e7a3e'); hg.addColorStop(1, '#344a22');
      x.fillStyle = hg;
      x.beginPath(); x.arc(0, -r * .2, r * 1.0, Math.PI * 1.04, Math.PI * 1.96); x.closePath(); x.fill();
      x.strokeStyle = '#22300f'; x.lineWidth = r * .06; x.stroke();
      x.fillStyle = '#4a6230'; rr(x, -r * 1.12, -r * .3, r * 2.24, r * .17, r * .08); x.fill(); x.stroke();
      x.strokeStyle = 'rgba(255,255,255,.3)'; x.lineWidth = r * .05;
      x.beginPath(); x.arc(0, -r * .2, r * .8, Math.PI * 1.2, Math.PI * 1.45); x.stroke();
      x.strokeStyle = '#22300f'; x.lineWidth = r * .04;
      x.beginPath(); x.moveTo(r * .3, -r * .7); x.lineTo(r * .42, -r * .6); x.lineTo(r * .36, -r * .52); x.stroke();
      x.restore();
    }
    if (kind === 'king') {
      // crown, slightly too small and slightly askew
      x.save(); x.translate(r * .05, -r * .9); x.rotate(-.18);
      x.beginPath();
      x.moveTo(-r * .55, 0); x.lineTo(-r * .6, -r * .45); x.lineTo(-r * .28, -r * .2); x.lineTo(0, -r * .55);
      x.lineTo(r * .28, -r * .2); x.lineTo(r * .6, -r * .45); x.lineTo(r * .55, 0); x.closePath();
      const cg = x.createLinearGradient(0, -r * .55, 0, 0);
      cg.addColorStop(0, '#fff3b0'); cg.addColorStop(.5, '#ffc23d'); cg.addColorStop(1, '#a8670c');
      x.fillStyle = cg; x.fill(); x.strokeStyle = '#6a3e04'; x.lineWidth = r * .05; x.stroke();
      for (const [gx, gc] of [[-r * .3, '#3fa9ff'], [0, '#ff3f6a'], [r * .3, '#52e07a']]) {
        x.fillStyle = gc; x.beginPath(); x.arc(gx, -r * .12, r * .065, 0, TAU); x.fill();
      }
      x.restore();
    }
    if (hurt > .35) {
      // a plaster stuck on, slightly crooked
      x.save(); x.translate(r * .42, -r * .62); x.rotate(.6);
      rr(x, -r * .22, -r * .07, r * .44, r * .14, r * .05);
      x.fillStyle = '#f4d6b0'; x.fill(); x.strokeStyle = 'rgba(120,80,40,.6)'; x.lineWidth = r * .03; x.stroke();
      x.restore();
    }
    // gloss
    x.fillStyle = 'rgba(255,255,255,.5)';
    x.beginPath(); x.ellipse(-r * .46, -r * .56, r * .22, r * .1, -.65, 0, TAU); x.fill();
    x.restore();
  },

  /* a cartoon eye: lid (0-1) droops flat over the top for the smug look */
  tEye(x, ex, ey, er, o) {
    const ry = er * 1.08 * (o.blink ? .12 : 1);
    x.save();
    x.beginPath(); x.ellipse(ex, ey, er, ry, 0, 0, TAU);
    x.fillStyle = '#ffffff'; x.fill();
    if (!o.blink) {
      x.save(); x.clip();
      const k = o.scared ? .2 : .38;
      const px = ex + o.look.lx * er * k, py = ey + o.look.ly * er * k;
      x.fillStyle = '#1a1006';
      x.beginPath(); x.arc(px, py, er * (o.scared ? .18 : .4), 0, TAU); x.fill();
      x.fillStyle = '#ffffff'; x.beginPath(); x.arc(px - er * .14, py - er * .16, er * .12, 0, TAU); x.fill();
      if (o.lid) {
        const edge = ey - ry + ry * 2 * o.lid;
        x.fillStyle = o.c1; x.fillRect(ex - er * 1.2, ey - ry * 1.2, er * 2.4, edge - (ey - ry * 1.2));
        x.strokeStyle = o.ink; x.lineWidth = er * .16;
        x.beginPath(); x.moveTo(ex - er * 1.05, edge + er * .04); x.quadraticCurveTo(ex, edge - er * .08, ex + er * 1.05, edge + er * .04); x.stroke();
      }
      x.restore();
    }
    x.restore();
    x.strokeStyle = o.ink; x.lineWidth = Math.max(1, er * .12);
    x.beginPath(); x.ellipse(ex, ey, er, ry, 0, 0, TAU); x.stroke();
  },

  spiralEye(x, ex, ey, er, t, ink) {
    x.fillStyle = '#ffffff'; x.beginPath(); x.arc(ex, ey, er, 0, TAU); x.fill();
    x.strokeStyle = ink; x.lineWidth = Math.max(1, er * .14);
    x.beginPath();
    for (let a = 0; a < 3 * TAU; a += .3) { const rr2 = er * .85 * a / (3 * TAU); x.lineTo(ex + Math.cos(a + t * 6) * rr2, ey + Math.sin(a + t * 6) * rr2); }
    x.stroke();
    x.beginPath(); x.arc(ex, ey, er, 0, TAU); x.stroke();
  },

  /* a raspberry: small open mouth, tongue flopping out and wiggling */
  tongue(x, mx, my, r, t, ink) {
    x.fillStyle = '#4a1020';
    x.beginPath(); x.ellipse(mx, my, r * .26, r * .12, 0, 0, TAU); x.fill();
    const wig = Math.sin(t * 14) * r * .05;
    x.save(); x.translate(mx + wig, my + r * .05);
    rr(x, -r * .16, 0, r * .32, r * .34, r * .15);
    x.fillStyle = '#ff6f94'; x.fill();
    x.strokeStyle = '#8a1a3a'; x.lineWidth = r * .04; x.stroke();
    x.beginPath(); x.moveTo(0, r * .05); x.lineTo(0, r * .22); x.stroke();
    x.restore();
    x.strokeStyle = ink; x.lineWidth = r * .06;
    x.beginPath(); x.ellipse(mx, my, r * .26, r * .12, 0, Math.PI + .2, TAU - .2); x.stroke();
  },

  mDrop(x, dx, dy, s) {
    x.beginPath(); x.moveTo(dx, dy - s * 1.7);
    x.quadraticCurveTo(dx + s * 1.05, dy - s * .2, dx + s, dy + s * .2);
    x.arc(dx, dy + s * .2, s, 0, Math.PI);
    x.quadraticCurveTo(dx - s * 1.05, dy - s * .2, dx, dy - s * 1.7); x.closePath();
    x.fillStyle = 'rgba(180,230,255,.9)'; x.fill();
  },

  /* ---------- ATLAS: the ring of the world, which the level falls up onto ---------- */
  flipBarrier(x, g, t) {
    const f = g.flip;
    if (!f) return;
    const x0 = g.cam.x - 2800, x1 = g.cam.x + 2800, y = f.top;
    x.save();
    x.globalCompositeOperation = 'lighter';
    const gl = x.createLinearGradient(0, y - 200, 0, y + 90);
    gl.addColorStop(0, 'rgba(255,211,107,0)'); gl.addColorStop(.7, 'rgba(255,211,107,.4)'); gl.addColorStop(1, 'rgba(255,211,107,0)');
    x.fillStyle = gl; x.fillRect(x0, y - 200, x1 - x0, 290);
    x.globalCompositeOperation = 'source-over';
    // the band itself, seen from below: polished gold with an engraved channel
    const rg = x.createLinearGradient(0, y - 64, 0, y);
    rg.addColorStop(0, '#4a2c02'); rg.addColorStop(.3, '#fff0b0'); rg.addColorStop(.55, '#e0a428'); rg.addColorStop(.85, '#8a5606'); rg.addColorStop(1, '#4a2c02');
    x.fillStyle = rg; x.fillRect(x0, y - 64, x1 - x0, 64);
    x.fillStyle = '#2a1802'; x.fillRect(x0, y - 38, x1 - x0, 14);
    x.fillStyle = 'rgba(255,250,225,.85)'; x.fillRect(x0, y - 3, x1 - x0, 3);
    x.fillStyle = 'rgba(255,250,225,.5)'; x.fillRect(x0, y - 62, x1 - x0, 2);
    // runes burning in the channel, sliding along as the ring turns
    x.globalCompositeOperation = 'lighter';
    const slide = (t * 90) % 140;
    for (let wx = Math.floor(x0 / 140) * 140; wx < x1; wx += 140) {
      const px = wx + slide, pulse = .6 + Math.sin(t * 4 + wx * .05) * .4;
      glowCircle(x, px, y - 31, 26, '#ffb030', .5 * pulse);
      x.strokeStyle = `rgba(255,245,200,${.9 * pulse})`; x.lineWidth = 2.5; x.lineCap = 'round';
      x.beginPath();
      x.moveTo(px - 10, y - 25); x.lineTo(px, y - 37); x.lineTo(px + 10, y - 25);
      x.moveTo(px, y - 37); x.lineTo(px, y - 24);
      x.moveTo(px + 22, y - 36); x.lineTo(px + 30, y - 26);
      x.stroke();
    }
    x.restore();
  },

  /* ATLAS: while the world is flipped the sky gives way to deep space, and the
     world itself looms in it */
  spaceSky(x, g, t, a) {
    const W = this.W, H = this.H, M2 = Math.max(W, H);
    x.save();
    x.globalAlpha = a;
    const bg = x.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#030214'); bg.addColorStop(.55, '#0d0632'); bg.addColorStop(1, '#1c0b40');
    x.fillStyle = bg; x.fillRect(0, 0, W, H);
    x.globalCompositeOperation = 'lighter';
    glowCircle(x, W * (.22 + Math.sin(t * .07) * .05), H * .6, M2 * .5, '#5a2ab8', .4 * a);
    glowCircle(x, W * (.82 + Math.cos(t * .05) * .05), H * .72, M2 * .42, '#1a6ab8', .35 * a);
    glowCircle(x, W * .55, H * .35, M2 * .32, '#b83a8a', .2 * a);
    for (const s of this.stars) {
      const sx = (s.x * 1.7) % W, sy = (s.y * 2.1) % H;
      const k = .5 + Math.sin(t * s.sp * 2 + s.tw) * .5, rr2 = s.r * (1 + k * .6);
      x.fillStyle = `rgba(255,255,255,${(.3 + k * .7) * a})`;
      x.fillRect(sx - rr2 / 2, sy - rr2 / 2, rr2, rr2);
      if (s.r > 1.6) { x.fillStyle = `rgba(200,220,255,${.25 * k * a})`; x.fillRect(sx - rr2 * 2, sy - .5, rr2 * 4, 1); x.fillRect(sx - .5, sy - rr2 * 2, 1, rr2 * 4); }
    }
    x.globalCompositeOperation = 'source-over';
    x.translate(W * .5, H * .06); x.rotate(-.15);
    drawAtlasWorld(x, Math.min(W, H) * .44, t * .5);
    x.restore();
  },

  /* ---------- vines / flowers (BLOOM) ---------- */
  vines(x, g, t) {
    for (const f of g.flowers) {
      const r = f.r, wilt = clamp(1 - ((f.hold || 0) - 40) / 30, 0, 1);
      x.save();
      x.translate(f.body.position.x, f.body.position.y);
      x.globalAlpha = wilt;
      x.rotate(f.t * .01);
      for (let i = 0; i < 8; i++) {
        x.save(); x.rotate(i / 8 * TAU);
        const pg = x.createLinearGradient(0, 0, 0, -r);
        pg.addColorStop(0, '#ffffff'); pg.addColorStop(1, f.col);
        x.fillStyle = pg;
        x.beginPath(); x.moveTo(0, 0);
        x.quadraticCurveTo(r * .62, -r * .55, 0, -r); x.quadraticCurveTo(-r * .62, -r * .55, 0, 0); x.fill();
        x.restore();
      }
      x.fillStyle = '#ffd45c';
      x.beginPath(); x.arc(0, 0, r * .26, 0, TAU); x.fill();
      x.fillStyle = 'rgba(160,90,10,.35)';
      for (let i = 0; i < 7; i++) { const a = i * 2.4; x.beginPath(); x.arc(Math.cos(a) * r * .13, Math.sin(a) * r * .13, r * .04, 0, TAU); x.fill(); }
      x.globalCompositeOperation = 'lighter';
      glowCircle(x, 0, 0, r * 1.25, f.col, .16 * wilt);
      x.restore();
    }
    for (const v of g.vines) {
      const gr = clamp(v.t, 0, 1);
      x.save();
      x.strokeStyle = v.col2; x.lineWidth = v.w; x.lineCap = 'round';
      const steps = 14;
      x.beginPath();
      for (let i = 0; i <= steps * gr; i++) {
        const u = i / steps;
        const px = v.x + Math.cos(v.ang) * v.len * u + Math.sin(u * 7 + v.seed) * v.wob * u;
        const py = v.y + Math.sin(v.ang) * v.len * u + Math.cos(u * 5 + v.seed) * v.wob * u * .6;
        x[i ? 'lineTo' : 'moveTo'](px, py);
      }
      x.stroke();
      // leaves
      for (let i = 1; i <= 4; i++) {
        const u = i / 5;
        if (u > gr) break;
        const px = v.x + Math.cos(v.ang) * v.len * u + Math.sin(u * 7 + v.seed) * v.wob * u;
        const py = v.y + Math.sin(v.ang) * v.len * u + Math.cos(u * 5 + v.seed) * v.wob * u * .6;
        x.save(); x.translate(px, py);
        x.rotate(v.ang + (i % 2 ? 1.2 : -1.2) + Math.sin(t * 2 + i) * .12);
        x.fillStyle = v.col2;
        x.beginPath(); x.ellipse(v.w * 1.6, 0, v.w * 2.1, v.w * .95, 0, 0, TAU); x.fill();
        x.restore();
      }
      // flower head
      if (gr > .92) {
        const px = v.x + Math.cos(v.ang) * v.len + Math.sin(7 + v.seed) * v.wob;
        const py = v.y + Math.sin(v.ang) * v.len + Math.cos(5 + v.seed) * v.wob * .6;
        const fr = v.fr * clamp((gr - .92) / .08, 0, 1);
        x.save(); x.translate(px, py); x.rotate(t * .5 + v.seed);
        for (let i = 0; i < 6; i++) {
          x.save(); x.rotate(i / 6 * TAU);
          const pg = x.createLinearGradient(0, 0, 0, -fr);
          pg.addColorStop(0, '#ffffff'); pg.addColorStop(1, v.col);
          x.fillStyle = pg;
          x.beginPath();
          x.moveTo(0, 0); x.quadraticCurveTo(fr * .55, -fr * .6, 0, -fr);
          x.quadraticCurveTo(-fr * .55, -fr * .6, 0, 0); x.fill();
          x.restore();
        }
        x.fillStyle = '#ffd45c';
        x.beginPath(); x.arc(0, 0, fr * .3, 0, TAU); x.fill();
        x.save(); x.globalCompositeOperation = 'lighter';
        glowCircle(x, 0, 0, fr * 2, v.col, .25); x.restore();
        x.restore();
      }
      x.restore();
    }
  },

  /* ---------- balls ---------- */
  balls(x, g, t) {
    for (const b of g.activeBalls) {
      const gm = b.game, sk = gm.skin, Rr = gm.R;
      const sp = b.isStatic ? 0 : Math.hypot(b.velocity.x, b.velocity.y);
      // contact shadow: grounds the ball as it comes in low
      const hgt = GY - b.position.y - Rr;
      if (hgt < 240 && hgt > -4) {
        const k = 1 - clamp(hgt / 240, 0, 1);
        x.fillStyle = `rgba(0,0,0,${.28 * k})`;
        x.beginPath(); x.ellipse(b.position.x, GY + 3, Rr * (1.5 - k * .5), Rr * .3 * (.5 + k * .5), 0, 0, TAU); x.fill();
      }
      // trail ribbon
      const tr = gm.tr;
      if (tr && tr.length > 3) {
        x.save();
        if (sk.ribbon) sk.ribbon(x, tr, b, t);
        else this.skinTrail(x, tr, Rr, sk, sp);
        x.restore();
      }
      x.save();
      x.translate(b.position.x, b.position.y);
      // rarity aura — tinted and kept tight so the skin itself stays the hero
      if (sk.rar >= 2) {
        x.save(); x.globalCompositeOperation = 'lighter';
        const pulse = .85 + Math.sin(t * 4 + gm.seed) * .15;
        glowCircle(x, 0, 0, Rr * (2 + sk.rar * .2) * pulse, RC(sk.rar), .07 + sk.rar * .035);
        x.restore();
      }
      // squash and stretch along the flight path
      const st = clamp((sp - 7) * .0065, 0, .14);
      if (st > 0) {
        const va = Math.atan2(b.velocity.y, b.velocity.x);
        x.rotate(va); x.scale(1 + st, 1 - st * .65); x.rotate(-va);
      }
      if (sk.faceVel) {
        if (sp > 1.5) gm.face = Math.atan2(b.velocity.y, b.velocity.x);
        x.rotate(gm.face || 0);
      } else if (!sk.noRot) x.rotate(b.angle);
      sk.draw(x, Rr, t, b);
      x.restore();
    }
  },

  /* a smooth tapered ribbon through the trail points; wf(u) gives the half
     width at u (0 = oldest point, 1 = the ball) */
  ribbonPath(x, tr, wf) {
    const n = tr.length, L = [], Q = [];
    for (let i = 0; i < n; i++) {
      const a = tr[Math.max(0, i - 1)], b = tr[Math.min(n - 1, i + 1)];
      let nx = a.y - b.y, ny = b.x - a.x;
      const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
      const w = wf(i / (n - 1));
      L.push(tr[i].x + nx * w, tr[i].y + ny * w);
      Q.push(tr[i].x - nx * w, tr[i].y - ny * w);
    }
    x.beginPath();
    x.moveTo(L[0], L[1]);
    for (let i = 2; i < L.length - 2; i += 2) x.quadraticCurveTo(L[i], L[i + 1], (L[i] + L[i + 2]) / 2, (L[i + 1] + L[i + 3]) / 2);
    x.lineTo(L[L.length - 2], L[L.length - 1]);
    x.lineTo(Q[Q.length - 2], Q[Q.length - 1]);
    for (let i = Q.length - 4; i >= 2; i -= 2) x.quadraticCurveTo(Q[i], Q[i + 1], (Q[i] + Q[i - 2]) / 2, (Q[i + 1] + Q[i - 1]) / 2);
    x.lineTo(Q[0], Q[1]);
    x.closePath();
  },

  /* default trail for skins without a custom ribbon: a soft body in the
     skin's own colours, a glowing core, and a hot white streak at the head */
  skinTrail(x, tr, Rr, sk, sp) {
    Rr *= sk.trailW || 1;   // slender skins get slender trails
    // the skin's most saturated colour carries the body, its brightest the core
    const rgb = h => hex2rgb(h);
    const sat = h => { const c = rgb(h); return Math.max(...c) - Math.min(...c); };
    const lum = h => { const c = rgb(h); return c[0] * .3 + c[1] * .59 + c[2] * .11; };
    const c1 = sk.c1 || '#ffffff', c2 = sk.c2 || c1;
    let body = sat(c1) >= sat(c2) ? c1 : c2, core = lum(c1) >= lum(c2) ? c1 : c2;
    if (sat(body) < 40) body = mixHex(body, RC(sk.rar), .25);   // greys borrow a hint of rarity
    else body = mixHex(body, body, 0);
    core = mixHex(core, '#ffffff', .2);
    const a = tr[0], z = tr[tr.length - 1];
    const fade = (col, a0, a1) => {
      const gr = x.createLinearGradient(a.x, a.y, z.x, z.y), c = col.slice(4, -1);
      gr.addColorStop(0, `rgba(${c},0)`); gr.addColorStop(.5, `rgba(${c},${a0})`); gr.addColorStop(1, `rgba(${c},${a1})`);
      return gr;
    };
    const k = clamp(sp / 22, .45, 1);
    x.globalCompositeOperation = 'source-over';
    this.ribbonPath(x, tr, u => Rr * .9 * Math.pow(u, 1.3));
    x.fillStyle = fade(body, .28 * k, .62 * k); x.fill();
    this.ribbonPath(x, tr, u => Rr * .52 * Math.pow(u, 1.6));
    x.fillStyle = fade(core, .35 * k, .85 * k); x.fill();
    x.globalCompositeOperation = 'lighter';
    const head = tr.slice(-Math.max(4, Math.ceil(tr.length * .45)));
    this.ribbonPath(x, head, u => Rr * .17 * Math.pow(u, 1.2));
    x.fillStyle = `rgba(255,255,255,${.6 * k})`; x.fill();
  },

  rainFX(x, g, t) {
    x.save();
    x.strokeStyle = 'rgba(180,210,255,.35)'; x.lineWidth = 1.4;
    for (const r of this.rain) {
      const px = ((r.x - g.cam.x * .4 + t * 40) % (this.W + 200) + this.W + 200) % (this.W + 200) - 100;
      const py = ((r.y + t * r.sp * 60) % (this.H + 200)) - 50;
      x.beginPath(); x.moveTo(px, py); x.lineTo(px - 4, py + r.l); x.stroke();
    }
    x.restore();
  },

  /* draw a full-screen layer rotated about the centre, scaled to leave no gaps */
  drawRolled(c, img, th, CW, CH) {
    const cs = Math.abs(Math.cos(th)), sn = Math.abs(Math.sin(th));
    const s = Math.max(cs + sn * CW / CH, cs + sn * CH / CW);
    c.save(); c.translate(CW / 2, CH / 2); c.rotate(th); c.scale(s, s);
    c.drawImage(img, -CW / 2, -CH / 2, CW, CH);
    c.restore();
  },

  /* =========================================================
     POST PROCESSING
     ========================================================= */
  post(g, t, dt) {
    const c = this.ctx, dpr = this.dpr, W = this.W, H = this.H;
    const CW = this.cv.width, CH = this.cv.height;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.globalCompositeOperation = 'source-over';
    c.globalAlpha = 1; c.filter = 'none';

    const fx = g.fx;
    const retro = fx.retro > 0;

    /* ---- glitch: slice displacement while copying ---- */
    if (fx.glitch > 0) {
      c.fillStyle = '#000'; c.fillRect(0, 0, CW, CH);
      const slices = 26;
      for (let i = 0; i < slices; i++) {
        const sy = Math.floor(i / slices * CH);
        const sh = Math.ceil(CH / slices) + 1;
        const amp = fx.glitch * (hash(i * 3.7 + Math.floor(t * 14)) - .5);
        const off = amp * CW * .085;
        c.drawImage(this.wc, 0, sy, CW, sh, off, sy, CW, sh);
      }
    } else if (g.roll) {
      c.fillStyle = '#05031a'; c.fillRect(0, 0, CW, CH);
      this.drawRolled(c, this.wc, g.roll, CW, CH);
    } else {
      c.drawImage(this.wc, 0, 0, CW, CH);
    }

    /* ---- chromatic aberration ---- */
    const chroma = fx.chroma + (fx.glitch > 0 ? fx.glitch * 9 : 0);
    if (chroma > .4) {
      const tw = this.tc.width, th2 = this.tc.height;
      const tx = this.tx;
      const d = chroma * dpr;
      for (const [tint, dir] of [['#ff0040', -1], ['#00e5ff', 1]]) {
        tx.setTransform(1, 0, 0, 1, 0, 0);
        tx.globalCompositeOperation = 'source-over';
        tx.clearRect(0, 0, tw, th2);
        tx.drawImage(this.wc, 0, 0, tw, th2);
        tx.globalCompositeOperation = 'multiply';
        tx.fillStyle = tint; tx.fillRect(0, 0, tw, th2);
        tx.globalCompositeOperation = 'destination-in';
        tx.drawImage(this.wc, 0, 0, tw, th2);
        c.globalCompositeOperation = 'lighter';
        c.globalAlpha = .36;
        c.drawImage(this.tc, dir * d, dir * d * .35, CW, CH);
      }
      c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
    }

    /* ---- bloom (emissive buffer only — the sky never blooms) ---- */
    c.globalCompositeOperation = 'lighter';
    c.filter = `blur(${Math.max(3, 6 * dpr)}px)`;
    c.globalAlpha = clamp(.85 + fx.bloomBoost, 0, 1);
    if (g.roll) this.drawRolled(c, this.gc, g.roll, CW, CH); else c.drawImage(this.gc, 0, 0, CW, CH);
    c.filter = `blur(${Math.max(10, 22 * dpr)}px)`;
    c.globalAlpha = clamp(.55 + fx.bloomBoost, 0, 1);
    if (g.roll) this.drawRolled(c, this.gc, g.roll, CW, CH); else c.drawImage(this.gc, 0, 0, CW, CH);
    c.filter = 'none'; c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';

    /* ---- eclipse: darkness punched through by every emissive source ---- */
    if (fx.dark > .01) {
      const lx = this.tx, tw = this.tc.width, th2 = this.tc.height;
      lx.setTransform(1, 0, 0, 1, 0, 0);
      lx.globalCompositeOperation = 'source-over';
      lx.filter = 'none';
      lx.clearRect(0, 0, tw, th2);
      lx.fillStyle = '#02030a';
      lx.fillRect(0, 0, tw, th2);
      lx.globalCompositeOperation = 'destination-out';
      lx.filter = `blur(${Math.max(4, 9 * dpr)}px)`;
      lx.drawImage(this.gc, 0, 0, tw, th2);
      lx.drawImage(this.gc, 0, 0, tw, th2);
      lx.filter = 'none';
      c.globalAlpha = clamp(fx.dark * .93, 0, 1);
      c.drawImage(this.tc, 0, 0, CW, CH);
      c.globalAlpha = 1;
    }

    /* ---- retro demake ---- */
    if (retro) {
      const scale = clamp(fx.retro, 0, 1);
      const pw = Math.max(80, Math.round(280 + (1 - scale) * 900));
      const ph = Math.max(60, Math.round(pw * CH / CW));
      if (this.pc.width !== pw) { this.pc.width = pw; this.pc.height = ph; }
      this.px.setTransform(1, 0, 0, 1, 0, 0);
      this.px.imageSmoothingEnabled = true;
      this.px.filter = 'saturate(1.65) contrast(1.22)';
      this.px.drawImage(this.cv, 0, 0, pw, ph);
      this.px.filter = 'none';
      c.imageSmoothingEnabled = false;
      c.drawImage(this.pc, 0, 0, CW, CH);
      c.imageSmoothingEnabled = true;
      // scanlines + mask
      c.save();
      c.globalCompositeOperation = 'multiply';
      const lh = Math.max(2, Math.round(CH / ph) * 1);
      c.fillStyle = 'rgba(140,150,180,.4)';
      for (let y = 0; y < CH; y += lh * 3) c.fillRect(0, y, CW, lh);
      c.restore();
      c.save();
      c.globalCompositeOperation = 'lighter';
      c.fillStyle = 'rgba(60,120,255,.05)';
      c.fillRect(0, (t * 240 % CH), CW, CH * .06);
      c.restore();
    }

    /* ---- corruption blocks overlay ---- */
    if (fx.glitch > .02) {
      c.save();
      const n = Math.round(fx.glitch * 22);
      for (let i = 0; i < n; i++) {
        const sx = rand(0, CW), sy = rand(0, CH), sw = rand(30, 340) * dpr, sh = rand(4, 40) * dpr;
        c.globalCompositeOperation = Math.random() < .5 ? 'difference' : 'lighter';
        c.globalAlpha = rand(.1, .55);
        c.drawImage(this.cv, sx, sy, sw, sh, sx + rand(-90, 90) * dpr, sy, sw, sh);
      }
      c.globalCompositeOperation = 'source-over';
      c.globalAlpha = 1;
      c.font = `${14 * dpr}px monospace`;
      c.fillStyle = 'rgba(0,255,213,.5)';
      for (let i = 0; i < 5 * fx.glitch; i++) {
        let s = '';
        for (let k = 0; k < 40; k++) s += pick(['0', '1', 'x', 'F', 'E', '#', '§', '/']);
        c.fillText(s, rand(-100, CW), rand(0, CH));
      }
      c.restore();
    }

    /* ---- flash ---- */
    if (fx.flashA > .003) {
      c.save();
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = clamp(fx.flashA, 0, 1);
      c.fillStyle = fx.flashC;
      c.fillRect(0, 0, CW, CH);
      c.restore();
    }

    /* ---- slow-mo tint ---- */
    if (g.timeScale < .95) {
      c.save();
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = (1 - g.timeScale) * .1;
      c.fillStyle = '#ffd979'; c.fillRect(0, 0, CW, CH);
      c.restore();
    }

    /* ---- vignette ---- */
    const vg = c.createRadialGradient(CW / 2, CH / 2, Math.min(CW, CH) * .35, CW / 2, CH / 2, Math.max(CW, CH) * .78);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, `rgba(0,0,0,${.42 + (fx.glitch > 0 ? .1 : 0)})`);
    c.fillStyle = vg; c.fillRect(0, 0, CW, CH);
  }
};

/* ============================ src/60-game.js ============================ */
'use strict';
const M = () => window.Matter;
const STEP_MS = 1000 / 60;
/* velocity gained per fixed step from gravity — matches Matter's integrator,
   which adds gravity.y * gravity.scale * delta^2 to velocity each update. */
const gravityPerStep = eng => eng.gravity.y * eng.gravity.scale * STEP_MS * STEP_MS;
/* How hard an ability hits, by rarity. Applied centrally to all non-collision
   damage so a skin's tier is what determines its power, not 37 hand-tuned
   radii that drift apart every time something is added. */
const TIER_POWER = [1.05, 1.18, 1.34, 1.52, 1.95, 2.1, 2.45];

const G = {
  /* ---------- state ---------- */
  engine: null, world: null,
  blocks: [], enemies: [], activeBalls: [], flowers: [], vines: [], pending: [],
  ball: null, skin: DEFAULT_SKIN,
  levelIndex: 0, level: null, theme: 'day',
  state: 'menu',       // menu | aim | drag | flight | settling | done
  ballsLeft: 0, score: 0, coinsEarned: 0, shotsUsed: 0,
  time: 0, timeScale: 1, targetScale: 1, slowTimer: 0,
  cam: { x: 700, y: 300, z: 1, tx: 700, ty: 300, tz: 1 },
  shakeAmt: 0, shakeX: 0, shakeY: 0,
  fx: { glitch: 0, glitchTarget: 0, chroma: 0, retro: 0, retroTarget: 0, flashA: 0, flashC: '#fff', bloomBoost: 0, dark: 0, darkTarget: 0 },
  glitched: false, bloomed: false, retroOn: false, eclipse: false, corruptTimer: 0,
  drones: [], vortex: null, tendrils: [],
  flood: null, fist: null, flip: null,
  drag: null, mouseWorld: null,
  cheats: { infBalls: false, reAbility: false, noFail: false },
  abilityMul: 1,
  slingX: SLING_X, slingY: GY - 154,
  maxDrag: 138, maxSpeed: 29,
  save: null,

  /* ---------- persistence ---------- */
  loadProgress() {
    const s = loadSave();
    this.save = Object.assign({
      coins: 900, inv: {}, equipped: null, pity: 0, mythicPity: 0, transPity: 0,
      opened: 0, unlocked: 1, best: {}, muted: false, firstCrate: false
    }, s || {});
    if (!this.save.inv || typeof this.save.inv !== 'object') this.save.inv = {};
    SFX.on = !this.save.muted;
    this.skin = SKIN_BY_ID[this.save.equipped] || null;
    if (!this.skin) {
      const owned = Object.keys(this.save.inv).filter(k => SKIN_BY_ID[k]);
      this.skin = owned.length ? SKIN_BY_ID[owned[0]] : DEFAULT_SKIN;
    }
  },
  store() { writeSave(this.save); },
  owns(id) { return (this.save.inv[id] || 0) > 0; },

  /* ---------- boot ---------- */
  init(cv) {
    this.loadProgress();
    R.init(cv);
    const Mx = M();
    this.engine = Mx.Engine.create({ enableSleeping: false });
    this.engine.gravity.y = 1.7;
    this.world = this.engine.world;
    Mx.Events.on(this.engine, 'collisionStart', ev => this.onCollisions(ev));
    window.addEventListener('resize', () => R.resize());
    this.bindInput(cv);
    requestAnimationFrame(t => this.loop(t));
  },

  /* =========================================================
     LEVEL BUILD
     ========================================================= */
  startLevel(i) {
    const Mx = M();
    this.levelIndex = clamp(i, 0, LEVELS.length - 1);
    this.level = LEVELS[this.levelIndex];
    this.theme = this.level.theme;
    Mx.Composite.clear(this.world, false);
    this.blocks = []; this.enemies = []; this.activeBalls = []; this.flowers = [];
    this.vines = []; this.pending = []; this.ball = null;
    this.score = 0; this.coinsEarned = 0; this.shotsUsed = 0;
    this.ballsLeft = this.level.balls;
    this.settleGuard = 100;
    this.abilityMul = 1;
    this.glitched = false; this.bloomed = false; this.retroOn = false; this.eclipse = false;
    this.drones = []; this.vortex = null; this.tendrils = [];
    this.flood = null; this.fist = null; this.flip = null; this.roll = 0; this.spaceA = 0;
    this.engine.gravity.y = 1.7;
    this.engine.gravity.x = 0;
    this.timeScale = 1; this.targetScale = 1; this.slowTimer = 0;
    this.fx = { glitch: 0, glitchTarget: 0, chroma: 0, retro: 0, retroTarget: 0, flashA: 0, flashC: '#fff', bloomBoost: 0, dark: 0, darkTarget: 0 };
    FX.clear();

    const W2 = this.level.w;
    const ground = Mx.Bodies.rectangle(W2 / 2, GY + 300, W2 * 3, 600, {
      isStatic: true, friction: .9, restitution: .05,
      collisionFilter: { category: 0x0002 }
    });
    ground.game = { ground: true };
    const wallL = Mx.Bodies.rectangle(-140, GY - 900, 200, 2400, { isStatic: true, collisionFilter: { category: 0x0002 } });
    const wallR = Mx.Bodies.rectangle(W2 + 300, GY - 900, 200, 2400, { isStatic: true, collisionFilter: { category: 0x0002 } });
    wallL.game = wallR.game = { ground: true };
    Mx.Composite.add(this.world, [ground, wallL, wallR]);
    this.ground = ground;

    for (const it of this.level.items) {
      if (it.t === 'b') this.makeBlock(it);
      else if (it.t === 'c') this.makeCircleBlock(it);
      else if (it.t === 'e') this.makeEnemy(it);
    }

    this.resolveSpawnOverlaps();

    this.cam.x = this.cam.tx = SLING_X + 340;
    this.cam.y = this.cam.ty = GY - 260;
    this.state = 'aim';
    this.loadBall();
    UI.enterGame();
  },

  /* Nudge apart anything that spawned interpenetrating, so a level never
     opens with structures jolting themselves apart. Separates along each
     pair's collision normal, then lifts anything left below the ground. */
  resolveSpawnOverlaps() {
    const Mx = M();
    const bodies = [...this.blocks, ...this.enemies];
    for (let pass = 0; pass < 24; pass++) {
      let moved = false;
      for (let i = 0; i < bodies.length; i++) {
        for (let j = i + 1; j < bodies.length; j++) {
          const a = bodies[i], b = bodies[j];
          const col = Mx.Collision.collides(a, b);
          if (!col || !col.collided || col.depth < .4) continue;
          // choose the shallower axis from the AABB overlap, then lift the
          // upper body clear (never push down — that would bury it in the ground)
          const ox = Math.min(a.bounds.max.x, b.bounds.max.x) - Math.max(a.bounds.min.x, b.bounds.min.x);
          const oy = Math.min(a.bounds.max.y, b.bounds.max.y) - Math.max(a.bounds.min.y, b.bounds.min.y);
          if (oy <= ox) {
            const up = a.position.y <= b.position.y ? a : b;
            Mx.Body.translate(up, { x: 0, y: -(oy + .4) });
          } else {
            const lf = a.position.x <= b.position.x ? a : b;
            const rt = lf === a ? b : a;
            Mx.Body.translate(lf, { x: -(ox / 2 + .2), y: 0 });
            Mx.Body.translate(rt, { x: (ox / 2 + .2), y: 0 });
          }
          moved = true;
        }
      }
      if (!moved) break;
    }
    for (const o of bodies) {
      if (o.bounds.max.y > GY) Mx.Body.translate(o, { x: 0, y: GY - o.bounds.max.y });
      Mx.Body.setVelocity(o, { x: 0, y: 0 });
      Mx.Body.setAngularVelocity(o, 0);
    }
  },

  makeBlock(it) {
    const Mx = M(), m = MATS[it.mat];
    const b = Mx.Bodies.rectangle(it.x, it.y, it.w, it.h, {
      angle: it.a || 0, density: m.dens, restitution: m.rest, friction: m.fric,
      frictionAir: .002, collisionFilter: { category: 0x0001 }
    });
    b.game = {
      block: true, mat: it.mat, w: it.w, h: it.h, shape: 'box',
      hp: m.hp * (.55 + .45 * (it.w * it.h) / 2400), maxhp: 1, hitFlash: 0,
      seed: Math.random() * 1000, cracks: null, frozen: 0, fire: 0, dead: false
    };
    b.game.hp = Math.max(m.hp * .5, b.game.hp);
    b.game.maxhp = b.game.hp;
    this.blocks.push(b);
    Mx.Composite.add(this.world, b);
    return b;
  },
  makeCircleBlock(it) {
    const Mx = M(), m = MATS[it.mat];
    const b = Mx.Bodies.circle(it.x, it.y, it.r, {
      density: m.dens, restitution: m.rest, friction: m.fric, frictionAir: .008,
      collisionFilter: { category: 0x0001 }
    });
    b.game = {
      block: true, mat: it.mat, r: it.r, shape: 'circle',
      hp: m.hp * 1.1, maxhp: m.hp * 1.1, hitFlash: 0,
      seed: Math.random() * 1000, cracks: null, frozen: 0, fire: 0, dead: false
    };
    this.blocks.push(b);
    Mx.Composite.add(this.world, b);
    return b;
  },
  makeEnemy(it) {
    const Mx = M(), E2 = ENEMIES[it.kind];
    const b = Mx.Bodies.circle(it.x, it.y, E2.r, {
      density: .0011, restitution: .32, friction: .55, frictionAir: .012,
      collisionFilter: { category: 0x0001 }
    });
    b.game = {
      enemy: true, kind: it.kind, r: E2.r, hp: E2.hp, maxhp: E2.hp,
      hitFlash: 0, seed: Math.random() * 1000, frozen: 0, dead: false
    };
    this.enemies.push(b);
    Mx.Composite.add(this.world, b);
    return b;
  },

  /* =========================================================
     BALLS
     ========================================================= */
  loadBall() {
    if (this.ballsLeft <= 0 && !this.cheats.infBalls) return;
    const Mx = M(), sk = this.skin;
    const b = Mx.Bodies.circle(this.slingX, this.slingY, sk.R, {
      density: sk.dens, restitution: sk.rest, friction: sk.fric, frictionAir: .006,
      collisionFilter: { category: 0x0004 }, sleepThreshold: 9999
    });
    b.game = {
      ball: true, skin: sk, R: sk.R, tr: [], seed: Math.random() * 100,
      used: false, still: 0, done: false, born: 0, bonusDmg: 1, dead: false
    };
    Mx.Body.setStatic(b, true);
    Mx.Composite.add(this.world, b);
    this.ball = b;
    this.activeBalls = [b];
    this.state = 'aim';
    this.abilityMul = 1;
    UI.syncHud();
  },
  addBall(x, y, vx, vy, sk, opts = {}) {
    const Mx = M();
    const b = Mx.Bodies.circle(x, y, sk.R, {
      density: sk.dens, restitution: sk.rest, friction: sk.fric, frictionAir: .006,
      collisionFilter: { category: 0x0004 }, sleepThreshold: 9999
    });
    b.game = {
      ball: true, skin: sk, R: sk.R, tr: [], seed: Math.random() * 100,
      used: true, still: 0, done: false, born: 0, bonusDmg: opts.dmg || 1, frag: true, dead: false
    };
    Mx.Composite.add(this.world, b);
    Mx.Body.setVelocity(b, { x: vx, y: vy });
    this.activeBalls.push(b);
    return b;
  },
  removeBall(b) {
    if (b.game.dead) return;
    b.game.done = true; b.game.dead = true;
    // never unlink a body while the solver is mid-pass over its pairs
    if (this._inCollisions) this.after(0, () => M().Composite.remove(this.world, b));
    else M().Composite.remove(this.world, b);
    const i = this.activeBalls.indexOf(b);
    if (i >= 0) this.activeBalls.splice(i, 1);
    if (this.ball === b) this.ball = this.activeBalls[0] || null;
  },

  slingTips() {
    const bx = SLING_X, by = GY - 92;
    return [
      { x: bx + Math.sin(.34) * 66, y: by - Math.cos(.34) * 66 },
      { x: bx - Math.sin(.34) * 66, y: by - Math.cos(.34) * 66 }
    ];
  },
  bandPoint() {
    if (this.state === 'drag' && this.drag) return this.drag.pt;
    if (this.state === 'aim' && this.ball) return { x: this.ball.position.x, y: this.ball.position.y };
    return { x: this.slingX, y: this.slingY };
  },
  launchVel() {
    const p = this.bandPoint();
    const dx = this.slingX - p.x, dy = this.slingY - p.y;
    const d = Math.hypot(dx, dy);
    if (d < 1) return { x: 0, y: 0 };
    const k = clamp(d / this.maxDrag, 0, 1);
    return { x: dx / d * k * this.maxSpeed, y: dy / d * k * this.maxSpeed };
  },

  /* =========================================================
     INPUT
     ========================================================= */
  bindInput(cv) {
    const toW = e => {
      const r = cv.getBoundingClientRect();
      const sx = e.clientX - r.left, sy = e.clientY - r.top;
      return {
        x: (sx - R.W / 2) / this.cam.z + this.cam.x,
        y: (sy - R.H / 2) / this.cam.z + this.cam.y
      };
    };
    const down = e => {
      SFX.init(); SFX.resume();
      if (this.state === 'aim') {
        this.state = 'drag';
        this.drag = { pt: toW(e) };
        this.clampDrag();
      } else if (this.state === 'flight') {
        this.tryAbility();
      }
    };
    const move = e => {
      this.mouseWorld = toW(e);
      if (this.state === 'drag') {
        this.drag.pt = this.mouseWorld;
        this.clampDrag();
        const k = Math.hypot(this.slingX - this.drag.pt.x, this.slingY - this.drag.pt.y) / this.maxDrag;
        if (Math.random() < .3) SFX.play('stretch', { k });
      }
    };
    const up = () => {
      if (this.state !== 'drag') return;
      const d = Math.hypot(this.slingX - this.drag.pt.x, this.slingY - this.drag.pt.y);
      if (d < 16) { this.state = 'aim'; this.drag = null; return; }
      this.launch();
    };
    cv.addEventListener('pointerdown', down);
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('keydown', e => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (this.state === 'flight') this.tryAbility();
      }
      if (e.code === 'KeyR' && (this.state === 'aim' || this.state === 'flight')) UI.confirmRetry();
      if (e.code === 'Escape') UI.escape();
    });
  },
  clampDrag() {
    const p = this.drag.pt;
    let dx = p.x - this.slingX, dy = p.y - this.slingY;
    const d = Math.hypot(dx, dy);
    if (d > this.maxDrag) { dx = dx / d * this.maxDrag; dy = dy / d * this.maxDrag; }
    p.x = this.slingX + dx; p.y = this.slingY + dy;
    if (this.ball) M().Body.setPosition(this.ball, p);
  },
  launch() {
    const Mx = M(), v = this.launchVel(), b = this.ball;
    this.drag = null;
    if (!b || b.game.dead) { this.state = 'aim'; return; }
    Mx.Body.setStatic(b, false);
    Mx.Body.setVelocity(b, v);
    Mx.Body.setAngularVelocity(b, v.x * .012);
    b.game.born = this.time;
    this.state = 'flight';
    if (!this.cheats.infBalls) this.ballsLeft--;
    this.shotsUsed++;
    this.flightTime = 0;
    this.settleGuard = 0;
    if (b.game.skin.onLaunch) b.game.skin.onLaunch(this, b);
    SFX.play('launch');
    burst(b.position.x, b.position.y, 14, { col: ['#ffffff', '#cfe0ff'], size: 2.6, spd: 5, life: 20, add: true });
    shock(this.slingX, this.slingY, 60, '#ffffff', 14);
    this.shake(4);
    UI.syncHud();
  },
  tryAbility() {
    if (this.state !== 'flight') return;   // never while it is still on the sling
    const b = this.ball;
    if (!b || b.game.done || b.isStatic) return;
    if (b.game.used && !this.cheats.reAbility) return;
    b.game.used = true;
    UI.markAbilityUsed();
    const sk = b.game.skin;
    const mul = TIER_POWER[sk.rar] || 1;
    this.abilityMul = mul;
    if (sk.onAbility) sk.onAbility(this, b);
    // skins whose ability is "hit harder" route through collision damage,
    // which the central multiplier deliberately skips - top them up here
    if (b.game.bonusDmg > 1) b.game.bonusDmg *= 1 + (mul - 1) * .3;
  },

  /* =========================================================
     COLLISIONS + DAMAGE
     ========================================================= */
  onCollisions(ev) {
    const Mx = M();
    this._inCollisions = true;
    try {
    for (const pair of ev.pairs) {
      const a = pair.bodyA, b = pair.bodyB;
      const ga = a.game, gb = b.game;
      if (!ga || !gb) continue;
      const rv = Mx.Vector.sub(a.velocity, b.velocity);
      const sp = Mx.Vector.magnitude(rv);
      if (sp < 3.4) continue;
      const pt = pair.collision.supports[0] || { x: (a.position.x + b.position.x) / 2, y: (a.position.y + b.position.y) / 2 };

      const ballBody = ga.ball ? a : gb.ball ? b : null;
      const other = ballBody === a ? b : a;

      if (ballBody) {
        const bg = ballBody.game;
        if (bg.skin.onImpact) bg.skin.onImpact(this, ballBody, other, pt, sp);
        if (bg.pierceWood && other.game.mat === 'wood') {
          this.damageBody(other, 400, pt);
          bg.pierceWood--;
          const v = ballBody.velocity;
          Mx.Body.setVelocity(ballBody, { x: v.x * 1.25, y: v.y * 1.25 });
          continue;
        }
        this.impactFX(pt, sp, other, ballBody);
      }

      /* Momentum alone makes a light ball feel limp against a heavy crate, so a
         struck body also gets an explicit shove along the ball's heading. */
      if (ballBody && !other.isStatic && other.game && !other.game.ball) {
        const bv = ballBody.velocity, bs = Math.hypot(bv.x, bv.y) || 1;
        const kick = clamp((bs - 3) * .0019, 0, .055) * (ballBody.game.bonusDmg || 1);
        Mx.Body.applyForce(other, other.position, {
          x: bv.x / bs * other.mass * kick,
          y: bv.y / bs * other.mass * kick - other.mass * .0055
        });
        Mx.Body.setAngularVelocity(other, other.angularVelocity + rand(-.16, .16) * clamp(bs / 14, 0, 1.6));
      }

      const m = Math.min(a.mass === Infinity ? b.mass : a.mass, b.mass === Infinity ? a.mass : b.mass);
      let base = (sp - 3.4) * m * 2.6;
      if (ballBody) base *= 1.45 * (ballBody.game.bonusDmg || 1);
      if (base < 3) continue;

      this._collisionDamage = true;
      for (const [t, o] of [[a, b], [b, a]]) {
        if (!t.game || t.isStatic || t.game.ball) continue;
        let d = base;
        if (t.game.enemy) d *= 1.25;
        if (t.game.mat === 'ice') d *= 1.7;
        if (t.game.mat === 'steel') d *= .72;
        if (t.game.frozen > 0) d *= 1.8;
        if (o.game && o.game.ball && o.game.skin.id === 'spud' && t.game.mat === 'wood' && o.game.mash) d *= 2;
        this.damageBody(t, d, pt);
      }
      this._collisionDamage = false;
    }
    } finally { this._inCollisions = false; }
  },

  impactFX(pt, sp, other, ball) {
    const k = clamp(sp / 26, 0, 1.4);
    this.shake(2 + k * 9);
    if (k > .95 && this.slowTimer <= 0 && this.targetScale === 1 && this.time - (this._lastStop || 0) > .5) {
      this._lastStop = this.time;
