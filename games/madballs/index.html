    if (gm.shape === 'circle') { x.beginPath(); x.arc(0, 0, (gm.r || 20) + 3, 0, TAU); x.fill(); }
    else { rr(x, -gm.w / 2 - 3, -gm.h / 2 - 3, gm.w + 6, gm.h + 6, 5); x.fill(); }
    x.strokeStyle = 'rgba(255,255,255,.8)'; x.lineWidth = 2;
    x.beginPath();
    for (let i = 0; i < 4; i++) {
      const a = i / 4 * TAU + gm.seed;
      x.moveTo(0, 0); x.lineTo(Math.cos(a) * (gm.w || gm.r) * .5, Math.sin(a) * (gm.h || gm.r) * .5);
    }
    x.stroke();
    x.restore();
  },

  fire(x, b, t) {
    const gm = b.game;
    const w = gm.w || gm.r * 2, h = gm.h || gm.r * 2;
    x.save();
    x.globalCompositeOperation = 'lighter';
    const n = Math.max(2, Math.round(w / 18));
    for (let i = 0; i < n; i++) {
      const px = b.position.x + (i / (n - 1 || 1) - .5) * w * .85;
      const ph = i * 2.3 + gm.seed;
      const fh = 16 + Math.sin(t * 9 + ph) * 8 + hash(i + gm.seed) * 10;
      const py = b.position.y - h / 2;
      const gr = x.createRadialGradient(px, py - fh * .3, 0, px, py - fh * .3, fh);
      gr.addColorStop(0, 'rgba(255,246,190,.9)');
      gr.addColorStop(.35, 'rgba(255,150,40,.7)');
      gr.addColorStop(1, 'rgba(255,60,0,0)');
      x.fillStyle = gr;
      x.beginPath(); x.ellipse(px + Math.sin(t * 6 + ph) * 3, py - fh * .35, fh * .5, fh, 0, 0, TAU); x.fill();
    }
    x.restore();
  },

  /* ---------- enemies ---------- */
  enemies(x, g, t) {
    for (const e of g.enemies) {
      if (e.game.dead) continue;
      const gm = e.game, E2 = ENEMIES[gm.kind], r = gm.r;
      const v = Math.hypot(e.velocity.x, e.velocity.y);
      const sq = clamp(v * .012, 0, .22);
      const hurt = clamp(1 - gm.hp / gm.maxhp, 0, 1);
      x.save();
      x.translate(e.position.x, e.position.y);
      // shadow
      x.fillStyle = 'rgba(0,0,0,.25)';
      x.beginPath(); x.ellipse(0, r * .95, r * .9, r * .22, 0, 0, TAU); x.fill();
      x.rotate(e.angle * .5);
      x.scale(1 + sq, 1 - sq);

      // body
      const gr = x.createRadialGradient(-r * .3, -r * .38, r * .1, 0, 0, r * 1.15);
      gr.addColorStop(0, shade(E2.c1, .25)); gr.addColorStop(.55, E2.c1); gr.addColorStop(1, E2.c2);
      x.fillStyle = gr;
      x.beginPath(); x.arc(0, 0, r, 0, TAU); x.fill();
      // belly
      x.fillStyle = rgba('#ffffff', .18);
      x.beginPath(); x.ellipse(0, r * .3, r * .58, r * .42, 0, 0, TAU); x.fill();
      // spots
      x.fillStyle = rgba('#000000', .1);
      for (let i = 0; i < 4; i++) {
        const a = hash(gm.seed + i * 3) * TAU, d = hash(gm.seed + i) * r * .6;
        x.beginPath(); x.arc(Math.cos(a) * d, Math.sin(a) * d - r * .1, r * .1, 0, TAU); x.fill();
      }
      x.strokeStyle = rgba(E2.c2, .8); x.lineWidth = r * .09;
      x.beginPath(); x.arc(0, 0, r * .97, 0, TAU); x.stroke();

      // eyes look at ball
      const target = g.ball || { position: { x: g.slingX, y: g.slingY } };
      const dx = target.position.x - e.position.x, dy = target.position.y - e.position.y;
      const d2 = Math.hypot(dx, dy) || 1;
      const lx = clamp(dx / d2, -1, 1) * r * .12, ly = clamp(dy / d2, -1, 1) * r * .12;
      const blink = (Math.sin(t * 1.7 + gm.seed * 9) > .985) ? .12 : 1;
      const ex = r * .34, ey = -r * .16, er = r * .3;
      for (const s of [-1, 1]) {
        x.fillStyle = '#fff';
        x.beginPath(); x.ellipse(s * ex, ey, er, er * blink, 0, 0, TAU); x.fill();
        if (blink > .5) {
          x.fillStyle = '#12161f';
          x.beginPath(); x.arc(s * ex + lx, ey + ly, er * .48, 0, TAU); x.fill();
          x.fillStyle = '#fff';
          x.beginPath(); x.arc(s * ex + lx - er * .16, ey + ly - er * .18, er * .16, 0, TAU); x.fill();
        }
      }
      // brows (angrier as hurt)
      x.strokeStyle = '#20140a'; x.lineWidth = r * .13; x.lineCap = 'round';
      for (const s of [-1, 1]) {
        x.beginPath();
        x.moveTo(s * ex - s * er * .9, ey - er * (.9 + hurt * .3));
        x.lineTo(s * ex + s * er * .8, ey - er * (1.5 + hurt * .55));
        x.stroke();
      }
      // mouth
      x.strokeStyle = '#20140a'; x.lineWidth = r * .1;
      x.beginPath();
      if (hurt > .66) { x.arc(0, r * .58, r * .26, Math.PI, 0); }
      else if (hurt > .3) { x.moveTo(-r * .26, r * .48); x.lineTo(r * .26, r * .48); }
      else { x.arc(0, r * .34, r * .3, .35, Math.PI - .35); }
      x.stroke();
      if (hurt > .3) {
        x.fillStyle = '#fff';
        x.beginPath(); x.moveTo(-r * .16, r * .48); x.lineTo(-r * .06, r * .48); x.lineTo(-r * .11, r * .62); x.closePath(); x.fill();
      }
      // armour
      if (E2.armor) {
        x.fillStyle = 'rgba(200,214,235,.95)';
        x.beginPath(); x.arc(0, -r * .1, r * 1.02, Math.PI * 1.06, Math.PI * 1.94); x.fill();
        x.strokeStyle = '#67728c'; x.lineWidth = r * .09; x.stroke();
        x.fillStyle = 'rgba(255,255,255,.55)';
        x.beginPath(); x.ellipse(-r * .34, -r * .62, r * .22, r * .1, -.5, 0, TAU); x.fill();
      }
      if (E2.crown) {
        x.save(); x.translate(0, -r * 1.02);
        x.fillStyle = '#ffcc3d';
        x.beginPath();
        x.moveTo(-r * .62, 0); x.lineTo(-r * .62, -r * .34); x.lineTo(-r * .3, -r * .12);
        x.lineTo(0, -r * .52); x.lineTo(r * .3, -r * .12); x.lineTo(r * .62, -r * .34);
        x.lineTo(r * .62, 0); x.closePath(); x.fill();
        x.strokeStyle = '#a87b12'; x.lineWidth = r * .06; x.stroke();
        x.fillStyle = '#ff5f8f';
        x.beginPath(); x.arc(0, -r * .12, r * .09, 0, TAU); x.fill();
        x.restore();
      }
      if (E2.explodes) {
        const pulse = .5 + Math.sin(t * 7 + gm.seed) * .5;
        x.save(); x.globalCompositeOperation = 'lighter';
        glowCircle(x, 0, 0, r * (1.3 + pulse * .3), '#ff9d4d', .35 + pulse * .25);
        x.restore();
      }
      if (gm.frozen > 0) {
        x.save(); x.globalCompositeOperation = 'lighter';
        x.globalAlpha = clamp(gm.frozen / 60, 0, 1) * .6;
        x.fillStyle = '#bfe9ff'; x.beginPath(); x.arc(0, 0, r + 4, 0, TAU); x.fill();
        x.restore();
      }
      if (gm.hitFlash > 0) {
        x.save(); x.globalCompositeOperation = 'lighter'; x.globalAlpha = clamp(gm.hitFlash, 0, 1) * .85;
        x.fillStyle = '#fff'; x.beginPath(); x.arc(0, 0, r, 0, TAU); x.fill(); x.restore();
      }
      x.restore();

      this.statusCoat(x, e, t);

      // hp bar
      if (hurt > .02) {
        const bw = r * 1.8;
        x.save();
        x.translate(e.position.x - bw / 2, e.position.y - r - 14);
        x.fillStyle = 'rgba(0,0,0,.45)'; rr(x, 0, 0, bw, 5, 2.5); x.fill();
        x.fillStyle = hurt > .66 ? '#ff5f6d' : hurt > .33 ? '#ffc23d' : '#52e07a';
        rr(x, 0, 0, bw * (1 - hurt), 5, 2.5); x.fill();
        x.restore();
      }
    }
  },

  /* ---------- vines / flowers (BLOOM) ---------- */
  vines(x, g, t) {
    for (const v of g.vines) {
      const gr = clamp(v.t, 0, 1);
      x.save();
      x.strokeStyle = v.col2; x.lineWidth = v.w; x.lineCap = 'round';
      const steps = 14;
      x.beginPath();
      for (let i = 0; i <= steps * gr; i++) {
        const u = i / steps;
        const px = v.x + Math.cos(v.ang) * v.len * u + Math.sin(u * 7 + v.seed) * v.wob * u;
        const py = v.y + Math.sin(v.ang) * v.len * u + Math.cos(u * 5 + v.seed) * v.wob * u * .6;
        x[i ? 'lineTo' : 'moveTo'](px, py);
      }
      x.stroke();
      // leaves
      for (let i = 1; i <= 4; i++) {
        const u = i / 5;
        if (u > gr) break;
        const px = v.x + Math.cos(v.ang) * v.len * u + Math.sin(u * 7 + v.seed) * v.wob * u;
        const py = v.y + Math.sin(v.ang) * v.len * u + Math.cos(u * 5 + v.seed) * v.wob * u * .6;
        x.save(); x.translate(px, py);
        x.rotate(v.ang + (i % 2 ? 1.2 : -1.2) + Math.sin(t * 2 + i) * .12);
        x.fillStyle = v.col2;
        x.beginPath(); x.ellipse(v.w * 1.6, 0, v.w * 2.1, v.w * .95, 0, 0, TAU); x.fill();
        x.restore();
      }
      // flower head
      if (gr > .92) {
        const px = v.x + Math.cos(v.ang) * v.len + Math.sin(7 + v.seed) * v.wob;
        const py = v.y + Math.sin(v.ang) * v.len + Math.cos(5 + v.seed) * v.wob * .6;
        const fr = v.fr * clamp((gr - .92) / .08, 0, 1);
        x.save(); x.translate(px, py); x.rotate(t * .5 + v.seed);
        for (let i = 0; i < 6; i++) {
          x.save(); x.rotate(i / 6 * TAU);
          const pg = x.createLinearGradient(0, 0, 0, -fr);
          pg.addColorStop(0, '#ffffff'); pg.addColorStop(1, v.col);
          x.fillStyle = pg;
          x.beginPath();
          x.moveTo(0, 0); x.quadraticCurveTo(fr * .55, -fr * .6, 0, -fr);
          x.quadraticCurveTo(-fr * .55, -fr * .6, 0, 0); x.fill();
          x.restore();
        }
        x.fillStyle = '#ffd45c';
        x.beginPath(); x.arc(0, 0, fr * .3, 0, TAU); x.fill();
        x.save(); x.globalCompositeOperation = 'lighter';
        glowCircle(x, 0, 0, fr * 2, v.col, .25); x.restore();
        x.restore();
      }
      x.restore();
    }
  },

  /* ---------- balls ---------- */
  balls(x, g, t) {
    for (const b of g.activeBalls) {
      const gm = b.game, sk = gm.skin, Rr = gm.R;
      // trail ribbon
      const tr = gm.tr;
      if (tr && tr.length > 3) {
        x.save();
        if (sk.ribbon) {
          sk.ribbon(x, tr, b, t);
        } else {
          x.globalCompositeOperation = 'lighter';
          const col = RC(sk.rar);
          for (let i = 1; i < tr.length; i++) {
            const u = i / tr.length;
            x.strokeStyle = rgba(col, u * .32);
            x.lineWidth = Rr * 1.7 * u;
            x.lineCap = 'round';
            x.beginPath(); x.moveTo(tr[i - 1].x, tr[i - 1].y); x.lineTo(tr[i].x, tr[i].y); x.stroke();
          }
        }
        x.restore();
      }
      x.save();
      x.translate(b.position.x, b.position.y);
      if (!sk.noRot) x.rotate(b.angle);
      // rarity aura
      if (sk.rar >= 2) {
        x.save(); x.globalCompositeOperation = 'lighter';
        const pulse = .8 + Math.sin(t * 4 + gm.seed) * .2;
        glowCircle(x, 0, 0, Rr * (2.4 + sk.rar * .28) * pulse, RC(sk.rar), .1 + sk.rar * .045);
        x.restore();
      }
      sk.draw(x, Rr, t, b);
      x.restore();
    }
  },

  rainFX(x, g, t) {
    x.save();
    x.strokeStyle = 'rgba(180,210,255,.35)'; x.lineWidth = 1.4;
    for (const r of this.rain) {
      const px = ((r.x - g.cam.x * .4 + t * 40) % (this.W + 200) + this.W + 200) % (this.W + 200) - 100;
      const py = ((r.y + t * r.sp * 60) % (this.H + 200)) - 50;
      x.beginPath(); x.moveTo(px, py); x.lineTo(px - 4, py + r.l); x.stroke();
    }
    x.restore();
  },

  /* =========================================================
     POST PROCESSING
     ========================================================= */
  post(g, t, dt) {
    const c = this.ctx, dpr = this.dpr, W = this.W, H = this.H;
    const CW = this.cv.width, CH = this.cv.height;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.globalCompositeOperation = 'source-over';
    c.globalAlpha = 1; c.filter = 'none';

    const fx = g.fx;
    const retro = fx.retro > 0;

    /* ---- glitch: slice displacement while copying ---- */
    if (fx.glitch > 0) {
      c.fillStyle = '#000'; c.fillRect(0, 0, CW, CH);
      const slices = 26;
      for (let i = 0; i < slices; i++) {
        const sy = Math.floor(i / slices * CH);
        const sh = Math.ceil(CH / slices) + 1;
        const amp = fx.glitch * (hash(i * 3.7 + Math.floor(t * 14)) - .5);
        const off = amp * CW * .085;
        c.drawImage(this.wc, 0, sy, CW, sh, off, sy, CW, sh);
      }
    } else {
      c.drawImage(this.wc, 0, 0, CW, CH);
    }

    /* ---- chromatic aberration ---- */
    const chroma = fx.chroma + (fx.glitch > 0 ? fx.glitch * 9 : 0);
    if (chroma > .4) {
      const tw = this.tc.width, th2 = this.tc.height;
      const tx = this.tx;
      const d = chroma * dpr;
      for (const [tint, dir] of [['#ff0040', -1], ['#00e5ff', 1]]) {
        tx.setTransform(1, 0, 0, 1, 0, 0);
        tx.globalCompositeOperation = 'source-over';
        tx.clearRect(0, 0, tw, th2);
        tx.drawImage(this.wc, 0, 0, tw, th2);
        tx.globalCompositeOperation = 'multiply';
        tx.fillStyle = tint; tx.fillRect(0, 0, tw, th2);
        tx.globalCompositeOperation = 'destination-in';
        tx.drawImage(this.wc, 0, 0, tw, th2);
        c.globalCompositeOperation = 'lighter';
        c.globalAlpha = .36;
        c.drawImage(this.tc, dir * d, dir * d * .35, CW, CH);
      }
      c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
    }

    /* ---- bloom (emissive buffer only — the sky never blooms) ---- */
    c.globalCompositeOperation = 'lighter';
    c.filter = `blur(${Math.max(3, 6 * dpr)}px)`;
    c.globalAlpha = clamp(.85 + fx.bloomBoost, 0, 1);
    c.drawImage(this.gc, 0, 0, CW, CH);
    c.filter = `blur(${Math.max(10, 22 * dpr)}px)`;
    c.globalAlpha = clamp(.55 + fx.bloomBoost, 0, 1);
    c.drawImage(this.gc, 0, 0, CW, CH);
    c.filter = 'none'; c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';

    /* ---- eclipse: darkness punched through by every emissive source ---- */
    if (fx.dark > .01) {
      const lx = this.tx, tw = this.tc.width, th2 = this.tc.height;
      lx.setTransform(1, 0, 0, 1, 0, 0);
      lx.globalCompositeOperation = 'source-over';
      lx.filter = 'none';
      lx.clearRect(0, 0, tw, th2);
      lx.fillStyle = '#02030a';
      lx.fillRect(0, 0, tw, th2);
      lx.globalCompositeOperation = 'destination-out';
      lx.filter = `blur(${Math.max(4, 9 * dpr)}px)`;
      lx.drawImage(this.gc, 0, 0, tw, th2);
      lx.drawImage(this.gc, 0, 0, tw, th2);
      lx.filter = 'none';
      c.globalAlpha = clamp(fx.dark * .93, 0, 1);
      c.drawImage(this.tc, 0, 0, CW, CH);
      c.globalAlpha = 1;
    }

    /* ---- retro demake ---- */
    if (retro) {
      const scale = clamp(fx.retro, 0, 1);
      const pw = Math.max(80, Math.round(280 + (1 - scale) * 900));
      const ph = Math.max(60, Math.round(pw * CH / CW));
      if (this.pc.width !== pw) { this.pc.width = pw; this.pc.height = ph; }
      this.px.setTransform(1, 0, 0, 1, 0, 0);
      this.px.imageSmoothingEnabled = true;
      this.px.filter = 'saturate(1.65) contrast(1.22)';
      this.px.drawImage(this.cv, 0, 0, pw, ph);
      this.px.filter = 'none';
      c.imageSmoothingEnabled = false;
      c.drawImage(this.pc, 0, 0, CW, CH);
      c.imageSmoothingEnabled = true;
      // scanlines + mask
      c.save();
      c.globalCompositeOperation = 'multiply';
      const lh = Math.max(2, Math.round(CH / ph) * 1);
      c.fillStyle = 'rgba(140,150,180,.4)';
      for (let y = 0; y < CH; y += lh * 3) c.fillRect(0, y, CW, lh);
      c.restore();
      c.save();
      c.globalCompositeOperation = 'lighter';
      c.fillStyle = 'rgba(60,120,255,.05)';
      c.fillRect(0, (t * 240 % CH), CW, CH * .06);
      c.restore();
    }

    /* ---- corruption blocks overlay ---- */
    if (fx.glitch > .02) {
      c.save();
      const n = Math.round(fx.glitch * 22);
      for (let i = 0; i < n; i++) {
        const sx = rand(0, CW), sy = rand(0, CH), sw = rand(30, 340) * dpr, sh = rand(4, 40) * dpr;
        c.globalCompositeOperation = Math.random() < .5 ? 'difference' : 'lighter';
        c.globalAlpha = rand(.1, .55);
        c.drawImage(this.cv, sx, sy, sw, sh, sx + rand(-90, 90) * dpr, sy, sw, sh);
      }
      c.globalCompositeOperation = 'source-over';
      c.globalAlpha = 1;
      c.font = `${14 * dpr}px monospace`;
      c.fillStyle = 'rgba(0,255,213,.5)';
      for (let i = 0; i < 5 * fx.glitch; i++) {
        let s = '';
        for (let k = 0; k < 40; k++) s += pick(['0', '1', 'x', 'F', 'E', '#', '§', '/']);
        c.fillText(s, rand(-100, CW), rand(0, CH));
      }
      c.restore();
    }

    /* ---- flash ---- */
    if (fx.flashA > .003) {
      c.save();
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = clamp(fx.flashA, 0, 1);
      c.fillStyle = fx.flashC;
      c.fillRect(0, 0, CW, CH);
      c.restore();
    }

    /* ---- slow-mo tint ---- */
    if (g.timeScale < .95) {
      c.save();
      c.globalCompositeOperation = 'lighter';
      c.globalAlpha = (1 - g.timeScale) * .1;
      c.fillStyle = '#ffd979'; c.fillRect(0, 0, CW, CH);
      c.restore();
    }

    /* ---- vignette ---- */
    const vg = c.createRadialGradient(CW / 2, CH / 2, Math.min(CW, CH) * .35, CW / 2, CH / 2, Math.max(CW, CH) * .78);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, `rgba(0,0,0,${.42 + (fx.glitch > 0 ? .1 : 0)})`);
    c.fillStyle = vg; c.fillRect(0, 0, CW, CH);
  }
};

/* ============================ src/60-game.js ============================ */
'use strict';
const M = () => window.Matter;
const STEP_MS = 1000 / 60;
/* velocity gained per fixed step from gravity — matches Matter's integrator,
   which adds gravity.y * gravity.scale * delta^2 to velocity each update. */
const gravityPerStep = eng => eng.gravity.y * eng.gravity.scale * STEP_MS * STEP_MS;
/* How hard an ability hits, by rarity. Applied centrally to all non-collision
   damage so a skin's tier is what determines its power, not 37 hand-tuned
   radii that drift apart every time something is added. */
const TIER_POWER = [1.05, 1.18, 1.34, 1.52, 1.95, 2.1, 2.45];

const G = {
  /* ---------- state ---------- */
  engine: null, world: null,
  blocks: [], enemies: [], activeBalls: [], flowers: [], vines: [], pending: [],
  ball: null, skin: DEFAULT_SKIN,
  levelIndex: 0, level: null, theme: 'day',
  state: 'menu',       // menu | aim | drag | flight | settling | done
  ballsLeft: 0, score: 0, coinsEarned: 0, shotsUsed: 0,
  time: 0, timeScale: 1, targetScale: 1, slowTimer: 0,
  cam: { x: 700, y: 300, z: 1, tx: 700, ty: 300, tz: 1 },
  shakeAmt: 0, shakeX: 0, shakeY: 0,
  fx: { glitch: 0, glitchTarget: 0, chroma: 0, retro: 0, retroTarget: 0, flashA: 0, flashC: '#fff', bloomBoost: 0, dark: 0, darkTarget: 0 },
  glitched: false, bloomed: false, retroOn: false, eclipse: false, corruptTimer: 0,
  drones: [], vortex: null, tendrils: [],
  flood: null, fist: null, housePulls: 0,
  drag: null, mouseWorld: null,
  cheats: { infBalls: false, reAbility: false, noFail: false },
  abilityMul: 1,
  slingX: SLING_X, slingY: GY - 154,
  maxDrag: 138, maxSpeed: 29,
  save: null,

  /* ---------- persistence ---------- */
  loadProgress() {
    const s = loadSave();
    this.save = Object.assign({
      coins: 900, inv: {}, equipped: null, pity: 0, mythicPity: 0, transPity: 0,
      opened: 0, unlocked: 1, best: {}, muted: false, firstCrate: false
    }, s || {});
    if (!this.save.inv || typeof this.save.inv !== 'object') this.save.inv = {};
    SFX.on = !this.save.muted;
    this.skin = SKIN_BY_ID[this.save.equipped] || null;
    if (!this.skin) {
      const owned = Object.keys(this.save.inv).filter(k => SKIN_BY_ID[k]);
      this.skin = owned.length ? SKIN_BY_ID[owned[0]] : DEFAULT_SKIN;
    }
  },
  store() { writeSave(this.save); },
  owns(id) { return (this.save.inv[id] || 0) > 0; },

  /* ---------- boot ---------- */
  init(cv) {
    this.loadProgress();
    R.init(cv);
    const Mx = M();
    this.engine = Mx.Engine.create({ enableSleeping: false });
    this.engine.gravity.y = 1.7;
    this.world = this.engine.world;
    Mx.Events.on(this.engine, 'collisionStart', ev => this.onCollisions(ev));
    window.addEventListener('resize', () => R.resize());
    this.bindInput(cv);
    requestAnimationFrame(t => this.loop(t));
  },

  /* =========================================================
     LEVEL BUILD
     ========================================================= */
  startLevel(i) {
    const Mx = M();
    this.levelIndex = clamp(i, 0, LEVELS.length - 1);
    this.level = LEVELS[this.levelIndex];
    this.theme = this.level.theme;
    Mx.Composite.clear(this.world, false);
    this.blocks = []; this.enemies = []; this.activeBalls = []; this.flowers = [];
    this.vines = []; this.pending = []; this.ball = null;
    this.score = 0; this.coinsEarned = 0; this.shotsUsed = 0;
    this.ballsLeft = this.level.balls;
    this.settleGuard = 100;
    this.abilityMul = 1;
    this.glitched = false; this.bloomed = false; this.retroOn = false; this.eclipse = false;
    this.drones = []; this.vortex = null; this.tendrils = [];
    this.flood = null; this.fist = null; this.housePulls = 0;
    this.engine.gravity.y = 1.7;
    this.engine.gravity.x = 0;
    this.timeScale = 1; this.targetScale = 1; this.slowTimer = 0;
    this.fx = { glitch: 0, glitchTarget: 0, chroma: 0, retro: 0, retroTarget: 0, flashA: 0, flashC: '#fff', bloomBoost: 0, dark: 0, darkTarget: 0 };
    FX.clear();

    const W2 = this.level.w;
    const ground = Mx.Bodies.rectangle(W2 / 2, GY + 300, W2 * 3, 600, {
      isStatic: true, friction: .9, restitution: .05,
      collisionFilter: { category: 0x0002 }
    });
    ground.game = { ground: true };
    const wallL = Mx.Bodies.rectangle(-140, GY - 900, 200, 2400, { isStatic: true, collisionFilter: { category: 0x0002 } });
    const wallR = Mx.Bodies.rectangle(W2 + 300, GY - 900, 200, 2400, { isStatic: true, collisionFilter: { category: 0x0002 } });
    wallL.game = wallR.game = { ground: true };
    Mx.Composite.add(this.world, [ground, wallL, wallR]);
    this.ground = ground;

    for (const it of this.level.items) {
      if (it.t === 'b') this.makeBlock(it);
      else if (it.t === 'c') this.makeCircleBlock(it);
      else if (it.t === 'e') this.makeEnemy(it);
    }

    this.resolveSpawnOverlaps();

    this.cam.x = this.cam.tx = SLING_X + 340;
    this.cam.y = this.cam.ty = GY - 260;
    this.state = 'aim';
    this.loadBall();
    UI.enterGame();
  },

  /* Nudge apart anything that spawned interpenetrating, so a level never
     opens with structures jolting themselves apart. Separates along each
     pair's collision normal, then lifts anything left below the ground. */
  resolveSpawnOverlaps() {
    const Mx = M();
    const bodies = [...this.blocks, ...this.enemies];
    for (let pass = 0; pass < 24; pass++) {
      let moved = false;
      for (let i = 0; i < bodies.length; i++) {
        for (let j = i + 1; j < bodies.length; j++) {
          const a = bodies[i], b = bodies[j];
          const col = Mx.Collision.collides(a, b);
          if (!col || !col.collided || col.depth < .4) continue;
          // choose the shallower axis from the AABB overlap, then lift the
          // upper body clear (never push down — that would bury it in the ground)
          const ox = Math.min(a.bounds.max.x, b.bounds.max.x) - Math.max(a.bounds.min.x, b.bounds.min.x);
          const oy = Math.min(a.bounds.max.y, b.bounds.max.y) - Math.max(a.bounds.min.y, b.bounds.min.y);
          if (oy <= ox) {
            const up = a.position.y <= b.position.y ? a : b;
            Mx.Body.translate(up, { x: 0, y: -(oy + .4) });
          } else {
            const lf = a.position.x <= b.position.x ? a : b;
            const rt = lf === a ? b : a;
            Mx.Body.translate(lf, { x: -(ox / 2 + .2), y: 0 });
            Mx.Body.translate(rt, { x: (ox / 2 + .2), y: 0 });
          }
          moved = true;
        }
      }
      if (!moved) break;
    }
    for (const o of bodies) {
      if (o.bounds.max.y > GY) Mx.Body.translate(o, { x: 0, y: GY - o.bounds.max.y });
      Mx.Body.setVelocity(o, { x: 0, y: 0 });
      Mx.Body.setAngularVelocity(o, 0);
    }
  },

  makeBlock(it) {
    const Mx = M(), m = MATS[it.mat];
    const b = Mx.Bodies.rectangle(it.x, it.y, it.w, it.h, {
      angle: it.a || 0, density: m.dens, restitution: m.rest, friction: m.fric,
      frictionAir: .002, collisionFilter: { category: 0x0001 }
    });
    b.game = {
      block: true, mat: it.mat, w: it.w, h: it.h, shape: 'box',
      hp: m.hp * (.55 + .45 * (it.w * it.h) / 2400), maxhp: 1, hitFlash: 0,
      seed: Math.random() * 1000, cracks: null, frozen: 0, fire: 0, dead: false
    };
    b.game.hp = Math.max(m.hp * .5, b.game.hp);
    b.game.maxhp = b.game.hp;
    this.blocks.push(b);
    Mx.Composite.add(this.world, b);
    return b;
  },
  makeCircleBlock(it) {
    const Mx = M(), m = MATS[it.mat];
    const b = Mx.Bodies.circle(it.x, it.y, it.r, {
      density: m.dens, restitution: m.rest, friction: m.fric, frictionAir: .008,
      collisionFilter: { category: 0x0001 }
    });
    b.game = {
      block: true, mat: it.mat, r: it.r, shape: 'circle',
      hp: m.hp * 1.1, maxhp: m.hp * 1.1, hitFlash: 0,
      seed: Math.random() * 1000, cracks: null, frozen: 0, fire: 0, dead: false
    };
    this.blocks.push(b);
    Mx.Composite.add(this.world, b);
    return b;
  },
  makeEnemy(it) {
    const Mx = M(), E2 = ENEMIES[it.kind];
    const b = Mx.Bodies.circle(it.x, it.y, E2.r, {
      density: .0011, restitution: .32, friction: .55, frictionAir: .012,
      collisionFilter: { category: 0x0001 }
    });
    b.game = {
      enemy: true, kind: it.kind, r: E2.r, hp: E2.hp, maxhp: E2.hp,
      hitFlash: 0, seed: Math.random() * 1000, frozen: 0, dead: false
    };
    this.enemies.push(b);
    Mx.Composite.add(this.world, b);
    return b;
  },

  /* =========================================================
     BALLS
     ========================================================= */
  loadBall() {
    if (this.ballsLeft <= 0 && !this.cheats.infBalls) return;
    const Mx = M(), sk = this.skin;
    const b = Mx.Bodies.circle(this.slingX, this.slingY, sk.R, {
      density: sk.dens, restitution: sk.rest, friction: sk.fric, frictionAir: .006,
      collisionFilter: { category: 0x0004 }, sleepThreshold: 9999
    });
    b.game = {
      ball: true, skin: sk, R: sk.R, tr: [], seed: Math.random() * 100,
      used: false, still: 0, done: false, born: 0, bonusDmg: 1, dead: false
    };
    Mx.Body.setStatic(b, true);
    Mx.Composite.add(this.world, b);
    this.ball = b;
    this.activeBalls = [b];
    this.state = 'aim';
    this.abilityMul = 1;
    UI.syncHud();
  },
  addBall(x, y, vx, vy, sk, opts = {}) {
    const Mx = M();
    const b = Mx.Bodies.circle(x, y, sk.R, {
      density: sk.dens, restitution: sk.rest, friction: sk.fric, frictionAir: .006,
      collisionFilter: { category: 0x0004 }, sleepThreshold: 9999
    });
    b.game = {
      ball: true, skin: sk, R: sk.R, tr: [], seed: Math.random() * 100,
      used: true, still: 0, done: false, born: 0, bonusDmg: opts.dmg || 1, frag: true, dead: false
    };
    Mx.Composite.add(this.world, b);
    Mx.Body.setVelocity(b, { x: vx, y: vy });
    this.activeBalls.push(b);
    return b;
  },
  removeBall(b) {
    if (b.game.dead) return;
    b.game.done = true; b.game.dead = true;
    // never unlink a body while the solver is mid-pass over its pairs
    if (this._inCollisions) this.after(0, () => M().Composite.remove(this.world, b));
    else M().Composite.remove(this.world, b);
    const i = this.activeBalls.indexOf(b);
    if (i >= 0) this.activeBalls.splice(i, 1);
    if (this.ball === b) this.ball = this.activeBalls[0] || null;
  },

  slingTips() {
    const bx = SLING_X, by = GY - 92;
    return [
      { x: bx + Math.sin(.34) * 66, y: by - Math.cos(.34) * 66 },
      { x: bx - Math.sin(.34) * 66, y: by - Math.cos(.34) * 66 }
    ];
  },
  bandPoint() {
    if (this.state === 'drag' && this.drag) return this.drag.pt;
    if (this.state === 'aim' && this.ball) return { x: this.ball.position.x, y: this.ball.position.y };
    return { x: this.slingX, y: this.slingY };
  },
  launchVel() {
    const p = this.bandPoint();
    const dx = this.slingX - p.x, dy = this.slingY - p.y;
    const d = Math.hypot(dx, dy);
    if (d < 1) return { x: 0, y: 0 };
    const k = clamp(d / this.maxDrag, 0, 1);
    return { x: dx / d * k * this.maxSpeed, y: dy / d * k * this.maxSpeed };
  },

  /* =========================================================
     INPUT
     ========================================================= */
  bindInput(cv) {
    const toW = e => {
      const r = cv.getBoundingClientRect();
      const sx = e.clientX - r.left, sy = e.clientY - r.top;
      return {
        x: (sx - R.W / 2) / this.cam.z + this.cam.x,
        y: (sy - R.H / 2) / this.cam.z + this.cam.y
      };
    };
    const down = e => {
      SFX.init(); SFX.resume();
      if (this.state === 'aim') {
        this.state = 'drag';
        this.drag = { pt: toW(e) };
        this.clampDrag();
      } else if (this.state === 'flight') {
        this.tryAbility();
      }
    };
    const move = e => {
      this.mouseWorld = toW(e);
      if (this.state === 'drag') {
        this.drag.pt = this.mouseWorld;
        this.clampDrag();
        const k = Math.hypot(this.slingX - this.drag.pt.x, this.slingY - this.drag.pt.y) / this.maxDrag;
        if (Math.random() < .3) SFX.play('stretch', { k });
      }
    };
    const up = () => {
      if (this.state !== 'drag') return;
      const d = Math.hypot(this.slingX - this.drag.pt.x, this.slingY - this.drag.pt.y);
      if (d < 16) { this.state = 'aim'; this.drag = null; return; }
      this.launch();
    };
    cv.addEventListener('pointerdown', down);
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('keydown', e => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (this.state === 'flight') this.tryAbility();
      }
      if (e.code === 'KeyR' && (this.state === 'aim' || this.state === 'flight')) UI.confirmRetry();
      if (e.code === 'Escape') UI.escape();
    });
  },
  clampDrag() {
    const p = this.drag.pt;
    let dx = p.x - this.slingX, dy = p.y - this.slingY;
    const d = Math.hypot(dx, dy);
    if (d > this.maxDrag) { dx = dx / d * this.maxDrag; dy = dy / d * this.maxDrag; }
    p.x = this.slingX + dx; p.y = this.slingY + dy;
    if (this.ball) M().Body.setPosition(this.ball, p);
  },
  launch() {
    const Mx = M(), v = this.launchVel(), b = this.ball;
    this.drag = null;
    if (!b || b.game.dead) { this.state = 'aim'; return; }
    Mx.Body.setStatic(b, false);
    Mx.Body.setVelocity(b, v);
    Mx.Body.setAngularVelocity(b, v.x * .012);
    b.game.born = this.time;
    this.state = 'flight';
    if (!this.cheats.infBalls) this.ballsLeft--;
    this.shotsUsed++;
    this.flightTime = 0;
    this.settleGuard = 0;
    if (b.game.skin.onLaunch) b.game.skin.onLaunch(this, b);
    SFX.play('launch');
    burst(b.position.x, b.position.y, 14, { col: ['#ffffff', '#cfe0ff'], size: 2.6, spd: 5, life: 20, add: true });
    shock(this.slingX, this.slingY, 60, '#ffffff', 14);
    this.shake(4);
    UI.syncHud();
  },
  tryAbility() {
    if (this.state !== 'flight') return;   // never while it is still on the sling
    const b = this.ball;
    if (!b || b.game.done || b.isStatic) return;
    if (b.game.used && !this.cheats.reAbility) return;
    b.game.used = true;
    UI.markAbilityUsed();
    const sk = b.game.skin;
    const mul = TIER_POWER[sk.rar] || 1;
    this.abilityMul = mul;
    if (sk.onAbility) sk.onAbility(this, b);
    // skins whose ability is "hit harder" route through collision damage,
    // which the central multiplier deliberately skips - top them up here
    if (b.game.bonusDmg > 1) b.game.bonusDmg *= 1 + (mul - 1) * .3;
  },

  /* =========================================================
     COLLISIONS + DAMAGE
     ========================================================= */
  onCollisions(ev) {
    const Mx = M();
    this._inCollisions = true;
    try {
    for (const pair of ev.pairs) {
      const a = pair.bodyA, b = pair.bodyB;
      const ga = a.game, gb = b.game;
      if (!ga || !gb) continue;
      const rv = Mx.Vector.sub(a.velocity, b.velocity);
      const sp = Mx.Vector.magnitude(rv);
      if (sp < 3.4) continue;
      const pt = pair.collision.supports[0] || { x: (a.position.x + b.position.x) / 2, y: (a.position.y + b.position.y) / 2 };

      const ballBody = ga.ball ? a : gb.ball ? b : null;
      const other = ballBody === a ? b : a;

      if (ballBody) {
        const bg = ballBody.game;
        if (bg.skin.onImpact) bg.skin.onImpact(this, ballBody, other, pt, sp);
        if (bg.pierceWood && other.game.mat === 'wood') {
          this.damageBody(other, 400, pt);
          bg.pierceWood--;
          const v = ballBody.velocity;
          Mx.Body.setVelocity(ballBody, { x: v.x * 1.25, y: v.y * 1.25 });
          continue;
        }
        this.impactFX(pt, sp, other, ballBody);
      }

      /* Momentum alone makes a light ball feel limp against a heavy crate, so a
         struck body also gets an explicit shove along the ball's heading. */
      if (ballBody && !other.isStatic && other.game && !other.game.ball) {
        const bv = ballBody.velocity, bs = Math.hypot(bv.x, bv.y) || 1;
        const kick = clamp((bs - 3) * .0019, 0, .055) * (ballBody.game.bonusDmg || 1);
        Mx.Body.applyForce(other, other.position, {
          x: bv.x / bs * other.mass * kick,
          y: bv.y / bs * other.mass * kick - other.mass * .0055
        });
        Mx.Body.setAngularVelocity(other, other.angularVelocity + rand(-.16, .16) * clamp(bs / 14, 0, 1.6));
      }

      const m = Math.min(a.mass === Infinity ? b.mass : a.mass, b.mass === Infinity ? a.mass : b.mass);
      let base = (sp - 3.4) * m * 2.6;
      if (ballBody) base *= 1.45 * (ballBody.game.bonusDmg || 1);
      if (base < 3) continue;

      this._collisionDamage = true;
      for (const [t, o] of [[a, b], [b, a]]) {
        if (!t.game || t.isStatic || t.game.ball) continue;
        let d = base;
        if (t.game.enemy) d *= 1.25;
        if (t.game.mat === 'ice') d *= 1.7;
        if (t.game.mat === 'steel') d *= .72;
        if (t.game.frozen > 0) d *= 1.8;
        if (o.game && o.game.ball && o.game.skin.id === 'spud' && t.game.mat === 'wood' && o.game.mash) d *= 2;
        this.damageBody(t, d, pt);
      }
      this._collisionDamage = false;
    }
    } finally { this._inCollisions = false; }
  },

  impactFX(pt, sp, other, ball) {
    const k = clamp(sp / 26, 0, 1.4);
    this.shake(2 + k * 9);
    const col = other.game && other.game.mat ? MATS[other.game.mat].c1 : '#ffffff';
    burst(pt.x, pt.y, 5 + k * 12, {
      col: [col, '#ffffff'], size: 2.4, spd: 3 + k * 8, life: 18, add: true, g: .1
    });
    shock(pt.x, pt.y, 26 + k * 60, RC(ball.game.skin.rar), 14);
    if (other.game && other.game.mat) SFX.play(MATS[other.game.mat].snd, { v: clamp(k, .2, 1) });
    else if (other.game && other.game.enemy) SFX.play('thud', { v: clamp(k, .2, 1) });
    else SFX.play('thud', { v: clamp(k * .6, .1, .7) });
  },

  damageBody(body, dmg, pt, col) {
    if (this.settleGuard > 0) return;
    if (!this._collisionDamage) dmg *= this.abilityMul;
    const gm = body.game;
    if (!gm || gm.dead || body.isStatic || gm.ball || gm.ground) return;
    if (!gm.cracks && gm.block) {
      gm.cracks = [];
      const w = gm.w || gm.r * 2, h = gm.h || gm.r * 2;
      for (let i = 0; i < 4; i++) {
        const line = [];
        let px = (hash(gm.seed + i) - .5) * w, py = -h / 2;
        for (let k = 0; k < 5; k++) { line.push({ x: px, y: py }); px += (hash(gm.seed + i * 3 + k) - .5) * w * .5; py += h / 4; }
        gm.cracks.push(line);
      }
    }
    gm.hp -= dmg;
    gm.hitFlash = 1;
    this.score += Math.round(dmg * .55);
    if (pt && dmg > 12) {
      const c = col || (gm.mat ? MATS[gm.mat].c1 : '#ffd0d0');
      burst(pt.x, pt.y, 3, { col: [c], size: 2, spd: 3, life: 14, g: .2 });
    }
    if (gm.hp <= 0) this.destroyBody(body);
  },

  damageArea(x, y, r, dmg, col) {
    for (const o of this.dynamicBodies()) {
      const d = dist(x, y, o.position.x, o.position.y);
      if (d > r) continue;
      this.damageBody(o, dmg * (1 - d / r * .65), o.position, col);
    }
  },

  destroyBody(body) {
    const gm = body.game;
    if (gm.dead) return;
    gm.dead = true;
    const p = { x: body.position.x, y: body.position.y };

    if (gm.enemy) {
      const E2 = ENEMIES[gm.kind];
      this.score += E2.pts;
      let coins = Math.round(E2.pts * .09);
      if (gm.gold) coins *= 3;
      this.coinsEarned += coins;
      popText(p.x, p.y - 26, '+' + E2.pts, '#ffd979', this.retroOn ? 20 : 24);
      popText(p.x, p.y - 4, '+' + coins + 'c', '#ffc23d', 15);
      SFX.play('kill');
      burst(p.x, p.y, 26, { col: [E2.c1, E2.c2, '#ffffff'], size: 4, spd: 9, life: 34, g: .22, type: 'shard' });
      burst(p.x, p.y, 14, { col: [E2.c1], size: 8, spd: 5, life: 26, add: true, type: 'flare' });
      shock(p.x, p.y, 90, E2.c1, 20);
      this.shake(7);
      if (E2.explodes) this.after(4, () => this.explode(p.x, p.y, 175, .052, 120, '#ff9d4d'));
      const i = this.enemies.indexOf(body); if (i >= 0) this.enemies.splice(i, 1);
      M().Composite.remove(this.world, body);
      if (E2.splits) {
        for (let k = 0; k < E2.splits; k++) {
          const child = this.makeEnemy({ x: p.x + (k - (E2.splits - 1) / 2) * 34, y: p.y - 10, kind: 'runt' });
          M().Body.setVelocity(child, { x: rand(-6, 6), y: rand(-9, -3) });
        }
        popText(p.x, p.y - 48, 'IT SPLIT!', '#c78cf5', 18);
        SFX.play('blip', { f: 360 });
      }
      if (this.enemies.length === 0) this.onCleared();
      return;
    }

    const m = MATS[gm.mat];
    let coins = gm.mat === 'steel' ? 22 : gm.mat === 'stone' ? 14 : 8;
    if (gm.gold) {
      coins *= 3;
      popText(p.x, p.y - 14, '+' + coins + 'c', '#ffd24a', 16);
      burst(p.x, p.y, 14, { col: ['#ffd24a', '#fff6c0'], size: 3.4, spd: 6, life: 30, add: true });
    }
    this.coinsEarned += coins;
    this.score += 120;
    if (gm.mat === 'tnt') {
      this.after(2, () => this.explode(p.x, p.y, 210, .062, 165, '#ff7a1a'));
    } else {
      SFX.play(m.snd, { v: .7 });
      const n = gm.mat === 'ice' ? 22 : 15;
      burst(p.x, p.y, n, {
        col: [m.c1, m.c2], size: gm.mat === 'ice' ? 5 : 6, spd: 7, life: 40, g: .34,
        type: 'shard', drag: .99, add: gm.mat === 'ice'
      });
      if (gm.mat === 'ice') burst(p.x, p.y, 10, { col: ['#ffffff', '#d6f2ff'], size: 3, spd: 6, life: 24, add: true });
      else burst(p.x, p.y, 6, { col: ['#3a2a18'], size: 9, spd: 2, life: 34, type: 'smoke', grow: .5, layer: 0 });
    }
    const i = this.blocks.indexOf(body); if (i >= 0) this.blocks.splice(i, 1);
    M().Composite.remove(this.world, body);
  },

  dynamicBodies() {
    const out = [];
    for (const b of this.blocks) if (!b.game.dead) out.push(b);
    for (const e of this.enemies) if (!e.game.dead) out.push(e);
    return out;
  },

  /* =========================================================
     ABILITY API
     ========================================================= */
  after(frames, fn) { this.pending.push({ t: frames, fn }); },
  shake(a) { this.shakeAmt = Math.min(46, this.shakeAmt + a); },
  flash(col, a) { this.fx.flashC = col; this.fx.flashA = Math.max(this.fx.flashA, a); },
  slowmo(scale, frames) { this.targetScale = scale; this.slowTimer = frames; },

  explode(x, y, r, power, dmg, col) {
    const Mx = M();
    r *= Math.pow(this.abilityMul, .25);
    power *= Math.pow(this.abilityMul, .2);
    SFX.play('boom');
    this.shake(16 + r * .05);
    this.flash(col, .3);
    shock(x, y, r * 1.25, col, 24, 14);
    shock(x, y, r * .7, '#ffffff', 16, 8);
    for (let i = 0; i < 34; i++) {
      const a = rand(0, TAU), s = rand(3, 16);
      FX.add({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, type: 'flare', size: rand(10, 26), col: pick([col, '#ffffff', '#ffd66b']), life: rand(18, 40), add: true, drag: .93 });
    }
    for (let i = 0; i < 16; i++) {
      const a = rand(0, TAU), s = rand(1, 5);
      FX.add({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, type: 'smoke', size: rand(14, 30), grow: .8, col: '#2a2028', life: rand(40, 80), layer: 0 });
    }
    for (const o of this.dynamicBodies()) {
      const d = dist(x, y, o.position.x, o.position.y);
      if (d > r) continue;
      const f = (1 - d / r) * power * o.mass;
      const a = Math.atan2(o.position.y - y, o.position.x - x);
      Mx.Body.applyForce(o, o.position, { x: Math.cos(a) * f, y: Math.sin(a) * f - o.mass * .012 });
      this.damageBody(o, dmg * (1 - d / r * .6), o.position, col);
    }
    for (const b of this.activeBalls) {
      const d = dist(x, y, b.position.x, b.position.y);
      if (d > r || b.isStatic) continue;
      const a = Math.atan2(b.position.y - y, b.position.x - x);
      Mx.Body.applyForce(b, b.position, { x: Math.cos(a) * (1 - d / r) * power * b.mass * .6, y: Math.sin(a) * (1 - d / r) * power * b.mass * .6 });
    }
  },

  freeze(x, y, r) {
    SFX.play('glass'); SFX.play('blip', { f: 300 });
    this.flash('#bfe9ff', .3);
    this.shake(9);
    shock(x, y, r * 1.3, '#bfe9ff', 30, 12);
    for (let i = 0; i < 46; i++) {
      const a = rand(0, TAU), s = rand(2, 12);
      FX.add({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, type: 'shard', size: rand(3, 7), col: pick(['#ffffff', '#d6f2ff', '#8fd8ff']), life: rand(24, 50), add: true, g: .12, spin: rand(-.3, .3) });
    }
    for (const o of this.dynamicBodies()) {
      const d = dist(x, y, o.position.x, o.position.y);
      if (d > r) continue;
      if (o.game.mat === 'ice') { this.damageBody(o, 9999, o.position); continue; }
      o.game.frozen = 200;
      o.frictionAir = .12;
      this.damageBody(o, 48, o.position, '#bfe9ff');
    }
  },

  lightning(x, y, chains) {
    SFX.play('zap');
    this.flash('#fff8c0', .5);
    this.shake(14);
    const from = { x: x + rand(-40, 40), y: y - 900 };
    this.bolt(from, { x, y }, '#fff8c0', '#ffffff', 7);
    this.explode(x, y, 165, .042, 130, '#ffe680');
    let last = { x, y };
    const hit = [];
    for (let c = 0; c < chains; c++) {
      let best = null, bd = 1e9;
      for (const o of this.dynamicBodies()) {
        if (hit.includes(o)) continue;
        const d = dist(last.x, last.y, o.position.x, o.position.y);
        if (d < bd && d < 340) { bd = d; best = o; }
      }
      if (!best) break;
      hit.push(best);
      const target = { x: best.position.x, y: best.position.y };
      const p0 = { x: last.x, y: last.y };
      this.after(4 + c * 4, () => {
        this.bolt(p0, target, '#ffe680', '#ffffff', 5);
        this.damageBody(best, 140, target, '#ffe680');
        burst(target.x, target.y, 12, { col: ['#ffe680', '#ffffff'], size: 2.4, spd: 8, life: 20, add: true, type: 'spark' });
        SFX.play('blip', { f: 1600 - c * 200 });
        shock(target.x, target.y, 70, '#ffe680', 16);
      });
      last = target;
    }
  },
  bolt(a, b, col, col2, w) {
    const pts = [];
    const n = 12;
    for (let i = 0; i <= n; i++) {
      const u = i / n;
      const jitter = i === 0 || i === n ? 0 : (Math.random() - .5) * 60 * Math.sin(u * Math.PI);
      pts.push({ x: lerp(a.x, b.x, u) + jitter, y: lerp(a.y, b.y, u) + jitter * .3 });
    }
    FX.add({ x: 0, y: 0, type: 'bolt', pts, col, col2, size: w, life: 12, add: true, fade: .5, drag: 1 });
    FX.add({ x: 0, y: 0, type: 'bolt', pts, col, col2: null, size: w * 3.4, life: 9, add: true, fade: .5, drag: 1 });
  },

  ignite(body) {
    if (!body || !body.game || !body.game.block) return;
    if (!MATS[body.game.mat] || !MATS[body.game.mat].burn) return;
    if (body.game.fire) return;
    body.game.fire = 1;
    SFX.play('whoosh', { v: .4 });
  },
  crater(x, y) {
    burst(x, y, 18, { col: ['#4a3220', '#6b4a2c'], size: 5, spd: 6, life: 40, g: .4, type: 'shard' });
    FX.add({ x, y, type: 'ring', size: 10, grow: 2.2, col: '#ff7a1a', life: 30, add: true, width: 6 });
  },

  prismBeams(b) {
    const Mx = M();
    SFX.play('zap'); SFX.play('reveal', { r: 4 });
    this.flash('#ffffff', .55);
    this.shake(18);
    this.slowmo(.35, 34);
    const p = { x: b.position.x, y: b.position.y };
    const v = b.velocity;
    const base = Math.atan2(v.y, v.x) || 0;
    const targets = this.dynamicBodies();
    for (let i = 0; i < 7; i++) {
      const spread = (i - 3) * .30;
      const a = base + spread;
      const hue = i / 7 * 300;
      const col = hsl(hue, 95, 62);
      const end = { x: p.x + Math.cos(a) * 2200, y: p.y + Math.sin(a) * 2200 };
      this.after(i * 2, () => {
        FX.add({ x: 0, y: 0, type: 'bolt', pts: [p, end], col, col2: '#ffffff', size: 9, life: 26, add: true, fade: 1.4, drag: 1 });
        FX.add({ x: 0, y: 0, type: 'bolt', pts: [p, end], col, col2: null, size: 26, life: 20, add: true, fade: 2, drag: 1 });
        const cols = Mx.Query.ray(targets, p, end, 26);
        for (const c of cols) {
          const bd = c.body;
          this.damageBody(bd, 195, bd.position, col);
          burst(bd.position.x, bd.position.y, 10, { col: [col, '#ffffff'], size: 3, spd: 6, life: 22, add: true });
          Mx.Body.applyForce(bd, bd.position, { x: Math.cos(a) * bd.mass * .028, y: Math.sin(a) * bd.mass * .028 - bd.mass * .01 });
        }
        SFX.play('blip', { f: 700 + i * 220 });
      });
    }
    this.after(20, () => this.removeBall(b));
  },

  /* ---------------- MYTHIC: GLITCH ---------------- */
  corrupt(b) {
    if (this.glitched) return;
    this.glitched = true;
    SFX.play('glitch');
    this.flash('#ff2e88', .4);
    this.shake(30);
    this.fx.glitchTarget = 1;
    this.fx.chroma = 16;
    UI.centerToast('0xC0RRUPT', '#00ffd5');
    this.corruptTimer = 0;
    // instant reality tear
    const p = { x: b.position.x, y: b.position.y };
    shock(p.x, p.y, 700, '#ff2e88', 34, 20);
    shock(p.x, p.y, 480, '#00ffd5', 28, 14);
    for (let i = 0; i < 80; i++) {
      FX.add({
        x: p.x + rand(-300, 300), y: p.y + rand(-300, 300), vx: rand(-6, 6), vy: rand(-6, 6),
        type: 'glyph', txt: pick(['0', '1', 'x', 'F', '#', '§', 'ERR', 'NUL', '??']), size: rand(10, 26),
        col: pick(['#ff2e88', '#00ffd5', '#ffffff']), life: rand(20, 60), add: true
      });
    }
    this.glitchEvent(true);
    this.after(26, () => { this.fx.glitchTarget = .16; });
  },
  glitchEvent(big) {
    const Mx = M();
    const bodies = this.dynamicBodies();
    if (!bodies.length) return;
    const kind = big ? 0 : rint(0, 3);
    if (kind === 0) {
      // teleport scramble
      const n = big ? Math.min(5, bodies.length) : 2;
      for (let i = 0; i < n; i++) {
        const o = pick(bodies);
        const from = { x: o.position.x, y: o.position.y };
        Mx.Body.setPosition(o, { x: o.position.x + rand(-140, 140), y: o.position.y - rand(20, 190) });
        Mx.Body.setVelocity(o, { x: rand(-8, 8), y: rand(-6, 2) });
        FX.add({ x: from.x, y: from.y, type: 'ring', size: 6, grow: 2.4, col: '#00ffd5', life: 22, add: true, width: 4 });
        FX.add({ x: o.position.x, y: o.position.y, type: 'ring', size: 6, grow: 2.4, col: '#ff2e88', life: 22, add: true, width: 4 });
        this.damageBody(o, 24, o.position, '#ff2e88');
      }
      SFX.play('blip', { f: 220 });
    } else if (kind === 1) {
      // gravity inversion
      this.engine.gravity.y = -1.45;
      this.after(70, () => { this.engine.gravity.y = 1.7; });
      UI.centerToast('GRAVITY_ERR', '#ff2e88');
      SFX.play('glitch');
    } else if (kind === 2) {
      // null out a body
      const o = pick(bodies);
      popText(o.position.x, o.position.y - 20, 'NULL', '#00ffd5', 22);
      for (let i = 0; i < 20; i++) FX.add({
        x: o.position.x, y: o.position.y, vx: rand(-5, 5), vy: rand(-5, 5),
        type: 'pixel', size: 6, col: pick(['#ff2e88', '#00ffd5']), life: 26, add: true
      });
      this.damageBody(o, 99999, o.position, '#00ffd5');
      SFX.play('blip', { f: 90 });
    } else {
      // horizontal shear impulse
      for (const o of bodies) Mx.Body.setVelocity(o, { x: o.velocity.x + rand(-7, 7), y: o.velocity.y - rand(0, 4) });
      this.fx.chroma = 18;
      SFX.play('glitch');
    }
    this.fx.glitchTarget = .8;
    this.after(18, () => { if (this.glitched) this.fx.glitchTarget = .16; });
  },

  /* ---------------- MYTHIC: BLOOM ---------------- */
  genesis(b) {
    if (this.bloomed) return;
    this.bloomed = true;
    this.theme = 'garden';
    SFX.play('bloom');
    this.flash('#d9ffe4', .55);
    this.shake(18);
    this.fx.bloomBoost = .22;
    UI.centerToast('GENESIS', '#ff7ab8');
    const p = { x: b.position.x, y: b.position.y };
    shock(p.x, p.y, 900, '#8ef2b0', 46, 16);

    // vines erupt from every surface in the level
    const surfaces = [];
    for (const o of this.dynamicBodies()) surfaces.push({ x: o.position.x, y: o.position.y - (o.game.h ? o.game.h / 2 : o.game.r), body: o });
    for (let x = 260; x < this.level.w; x += 55) surfaces.push({ x, y: GY, body: null });

    surfaces.sort((a, c) => dist(p.x, p.y, a.x, a.y) - dist(p.x, p.y, c.x, c.y));
    surfaces.slice(0, 90).forEach((s, i) => {
      this.after(i * .8, () => {
        this.vines.push({
          x: s.x + rand(-10, 10), y: s.y, ang: -Math.PI / 2 + rand(-.9, .9), len: rand(60, 190),
          w: rand(2.5, 6), wob: rand(-40, 40), t: 0, sp: rand(.012, .028), seed: rand(0, 10),
          col: pick(['#ff7ab8', '#ffd45c', '#b18cff', '#ffffff', '#ff9de0']), col2: pick(['#3ddc84', '#2fa864', '#5fe89a']),
          fr: rand(11, 26)
        });
      });
    });

    // physical growing flowers that tear the structures apart
    const Mx = M();
    const spots = this.dynamicBodies().slice();
    spots.sort((a, c) => dist(p.x, p.y, a.position.x, a.position.y) - dist(p.x, p.y, c.position.x, c.position.y));
    const chosen = [];
    for (const o of spots) {
      if (chosen.length >= 8) break;
      if (chosen.some(c => dist(c.x, c.y, o.position.x, o.position.y) < 135)) continue;
      chosen.push({ x: o.position.x, y: o.position.y });
    }
    if (!chosen.length) chosen.push({ x: p.x, y: p.y });
    chosen.forEach((c, i) => this.after(i * 7, () => {
      const body = Mx.Bodies.circle(c.x, c.y, 6, { isStatic: true, collisionFilter: { category: 0x0001 } });
      body.game = { flower: true, r: 6 };
      Mx.Composite.add(this.world, body);
      this.flowers.push({ body, r: 6, max: rand(70, 105), col: pick(['#ff7ab8', '#ffd45c', '#b18cff', '#ffffff']), t: 0 });
      SFX.play('blip', { f: 400 + i * 90 });
      shock(c.x, c.y, 120, '#ff7ab8', 22);
    }));

    // butterflies + petal storm
    for (let i = 0; i < 90; i++) FX.add({
      x: p.x + rand(-500, 500), y: p.y + rand(-400, 200), vx: rand(-2, 2), vy: rand(-2, 1),
      type: 'petal', size: rand(4, 9), col: pick(['#ffb3d9', '#ff7ab8', '#fff0b3', '#8ef2b0', '#ffffff']),
      life: rand(80, 200), rot: rand(0, TAU), spin: rand(-.1, .1), g: .006, drag: .985, wob: .06
    });
    this.after(90, () => { this.fx.bloomBoost = .1; });
  },

  /* ---------------- MYTHIC: ARCADE ---------------- */
  demake(b) {
    if (this.retroOn) return;
    this.retroOn = true;
    this.fx.retroTarget = 1;
    SFX.play('arcade');
    this.flash('#00e5ff', .5);
    this.shake(16);
    UI.centerToast('DEMAKE', '#00e5ff');
    UI.retroMode(true);
    const p = { x: b.position.x, y: b.position.y };
    for (let i = 0; i < 140; i++) FX.add({
      x: p.x + rand(-260, 260), y: p.y + rand(-220, 220), vx: rand(-4, 4), vy: rand(-4, 4),
      type: 'pixel', size: 7, col: pick(['#00e5ff', '#ffcc00', '#ff2e88', '#ffffff', '#52e07a']),
      life: rand(20, 60), add: true
    });
    shock(p.x, p.y, 620, '#00e5ff', 30, 16);
    // retro physics
    this.engine.gravity.y = 1.25;
    for (const o of this.dynamicBodies()) {
      o.friction *= .35; o.frictionAir = .001;
      o.restitution = clamp(o.restitution + .22, 0, .9);
    }
    for (const ab of this.activeBalls) { ab.restitution = .7; ab.frictionAir = .001; }
    // arcade score bonus popups
    let n = 0;
    for (const e of this.enemies) {
      this.after(20 + n * 6, () => {
        if (e.game.dead) return;
        this.damageBody(e, 85, e.position, '#00e5ff');
        popText(e.position.x, e.position.y - 30, '+250 PTS', '#ffcc00', 18);
        this.score += 250;
        SFX.play('blip', { f: 700 + n * 120 });
      });
      n++;
    }
  },

  /* =========================================================
     LOOP
     ========================================================= */
  loop(now) {
    requestAnimationFrame(t => this.loop(t));
    const raw = this.lastT ? (now - this.lastT) : 16.6;
    this.lastT = now;
    const frameScale = clamp(raw / 16.666, .2, 4);

    // smooth time scale
    this.timeScale += (this.targetScale - this.timeScale) * .12;
    if (this.slowTimer > 0) { this.slowTimer -= this.timeScale * frameScale; if (this.slowTimer <= 0) this.targetScale = 1; }

    /* fixed-timestep physics: every step is exactly one 60Hz frame, so the
       aim preview integrates with the identical numbers the engine uses. */
    this.acc = (this.acc || 0) + frameScale;
    let steps = 0;
    if (this.state !== 'menu') {
      this.engine.timing.timeScale = clamp(this.timeScale, .02, 2);
      while (this.acc >= 1 && steps < 5) { M().Engine.update(this.engine, STEP_MS); this.acc -= 1; steps++; }
    } else { this.acc = Math.min(this.acc, 1); }
    const dt = (steps || frameScale) * this.timeScale;
    this.time += dt / 60;

    if (this.state !== 'menu') this.stepGame(dt);
    FX.update(dt);
    this.stepFX(dt, frameScale);

    if (this.state !== 'menu') R.frame(this, this.time, dt);
    else R.frame(this, this.time, dt);
  },

  stepFX(dt, fs) {
    const f = this.fx;
    f.glitch += (f.glitchTarget - f.glitch) * .14 * fs;
    f.retro += (f.retroTarget - f.retro) * .06 * fs;
    f.dark += (f.darkTarget - f.dark) * .035 * fs;
    f.chroma *= Math.pow(.9, fs);
    f.flashA *= Math.pow(.86, fs);
    // camera shake
    this.shakeAmt *= Math.pow(.88, fs);
    if (this.shakeAmt > .1) {
      this.shakeX = rand(-1, 1) * this.shakeAmt;
      this.shakeY = rand(-1, 1) * this.shakeAmt;
    } else { this.shakeX = this.shakeY = 0; }
  },

  stepGame(dt) {
    const Mx = M();
    if (this.settleGuard > 0) this.settleGuard -= dt;

    // pending timers
    for (let i = this.pending.length - 1; i >= 0; i--) {
      const p = this.pending[i];
      p.t -= dt;
      if (p.t <= 0) { this.pending.splice(i, 1); p.fn(); }
    }

    // recover from an empty slingshot rather than softlocking
    if (this.state === 'aim' && (!this.ball || this.ball.game.dead)) {
      this.ball = null;
      if (this.ballsLeft > 0 || this.cheats.infBalls) this.loadBall();
    }

    // held ball follows the pouch
    if (this.state === 'aim' && this.ball) {
      Mx.Body.setPosition(this.ball, { x: this.slingX, y: this.slingY });
    }

    // per-body upkeep
    for (const b of this.blocks) {
      const gm = b.game;
      if (gm.hitFlash > 0) gm.hitFlash -= .08 * dt;
      if (gm.frozen > 0) { gm.frozen -= dt; if (gm.frozen <= 0) b.frictionAir = .002; }
      if (gm.fire) {
        gm.fire += dt;
        if (Math.random() < .16 * dt) {
          FX.add({
            x: b.position.x + rand(-(gm.w || 20) / 2, (gm.w || 20) / 2), y: b.position.y - (gm.h || 20) / 2,
            vx: rand(-.5, .5), vy: rand(-2.4, -.9), type: 'flare', size: rand(6, 14),
            col: pick(['#ffb03a', '#ff5a1f', '#ffe08a']), life: rand(14, 30), add: true
          });
          FX.add({ x: b.position.x, y: b.position.y - (gm.h || 20) / 2, vx: rand(-.4, .4), vy: -1.4, type: 'smoke', size: 8, grow: .6, col: '#241c22', life: 50, layer: 0 });
        }
        if (Math.random() < .035 * dt) {
          this.damageBody(b, 9, b.position, '#ff9d2e');
          for (const o of this.dynamicBodies()) {
            if (o === b || o.game.fire) continue;
            if (dist(b.position.x, b.position.y, o.position.x, o.position.y) < 78) {
              if (o.game.enemy) this.damageBody(o, 6, o.position, '#ff9d2e');
              else this.ignite(o);
            }
          }
        }
      }
    }
    for (const e of this.enemies) {
      const gm = e.game;
      if (gm.hitFlash > 0) gm.hitFlash -= .08 * dt;
      if (gm.frozen > 0) { gm.frozen -= dt; if (gm.frozen <= 0) e.frictionAir = .012; }
      // fall damage against a still world handled by collisions
    }

    // growing flowers (BLOOM)
    for (let i = this.flowers.length - 1; i >= 0; i--) {
      const f = this.flowers[i];
      f.t += dt;
      if (f.r < f.max) {
        const grow = 1.25 * dt;
        const nr = Math.min(f.max, f.r + grow);
        Mx.Body.scale(f.body, nr / f.r, nr / f.r);
        f.r = nr; f.body.game.r = nr;
        for (const o of this.dynamicBodies()) {
          const d = dist(f.body.position.x, f.body.position.y, o.position.x, o.position.y);
          if (d < nr + 30) {
            this.damageBody(o, 2.0 * dt, o.position, f.col);
            const a = Math.atan2(o.position.y - f.body.position.y, o.position.x - f.body.position.x);
            Mx.Body.applyForce(o, o.position, { x: Math.cos(a) * o.mass * .0028 * dt, y: Math.sin(a) * o.mass * .0028 * dt - o.mass * .0008 * dt });
          }
        }
        if (Math.random() < .5 * dt) FX.add({
          x: f.body.position.x + rand(-nr, nr), y: f.body.position.y + rand(-nr, nr),
          vx: rand(-1, 1), vy: rand(-1.4, -.2), type: 'petal', size: rand(4, 8),
          col: f.col, life: 70, rot: rand(0, TAU), spin: rand(-.1, .1), g: .006, drag: .98
        });
      }
    }
    for (const v of this.vines) if (v.t < 1) v.t += v.sp * dt;

    if (this._eliteStep) this._eliteStep(dt);
    this.stepDrones(dt);
    this.stepVortex(dt);
    this.stepInfection(dt);
    this.stepStatus(dt);

    // eclipse: embers, new tendrils, and periodic corona flares
    this.stepTendrils(dt);
    if (this.eclipse) {
      if (Math.random() < .5 * dt) FX.add({
        x: this.cam.x + rand(-900, 900), y: this.cam.y - 520,
        vx: rand(-.6, .6), vy: rand(1.2, 3.4), type: 'flare', size: rand(3, 9),
        col: pick(['#ff5a2a', '#ffd07a']), life: rand(90, 200), add: true, drag: .995
      });
      this.tendrilTimer = (this.tendrilTimer || 0) + dt;
      if (this.tendrilTimer > 70 && this.tendrils.length < 14) {
        this.tendrilTimer = 0;
        const alive = this.dynamicBodies();
        const near = alive.length ? pick(alive).position.x + rand(-120, 120) : rand(400, this.level.w);
        this.spawnTendril(near);
        SFX.play('blip', { f: 110, v: .4 });
      }
      // the corona flares and the level is briefly visible again
      this.coronaTimer = (this.coronaTimer || 0) - dt;
      if (this.coronaTimer <= 0) {
        this.coronaTimer = 190;
        this.fx.darkTarget = .42;
        this.flash('#ff5a2a', .22);
        this.shake(7);
        SFX.play('boom', { v: .35 });
        this.coronaFlare = 26;
        this.after(30, () => { if (this.eclipse) this.fx.darkTarget = 1; });
      }
      if (this.coronaFlare > 0) this.coronaFlare -= dt;
    }

    // glitch upkeep
    if (this.glitched) {
      this.corruptTimer += dt;
      if (this.corruptTimer > 155) { this.corruptTimer = 0; this.glitchEvent(false); }
      if (Math.random() < .25 * dt) {
        FX.add({
          x: this.cam.x + rand(-700, 700), y: this.cam.y + rand(-400, 400), vx: rand(-2, 2), vy: 0,
          type: 'glyph', txt: pick(['0', '1', '#', 'x', '§', 'E']), size: rand(9, 20),
          col: pick(['#ff2e88', '#00ffd5']), life: 26, add: true
        });
      }
    }

    // balls
    for (let i = this.activeBalls.length - 1; i >= 0; i--) {
      const b = this.activeBalls[i];
      const gm = b.game;
      if (gm.dead) { this.activeBalls.splice(i, 1); continue; }
      if (this.state === 'flight' || this.state === 'settling') {
        gm.tr.push({ x: b.position.x, y: b.position.y });
        if (gm.tr.length > (gm.skin.rar >= 4 ? 30 : 16)) gm.tr.shift();
        if (gm.skin.trail) gm.skin.trail(this, b, this.time);
        if (gm.skin.tick) gm.skin.tick(this, b, dt);
        if (gm.rebirthCD > 0) gm.rebirthCD -= dt;
        if (gm.splitCD > 0) gm.splitCD -= dt;
        const sp = Math.hypot(b.velocity.x, b.velocity.y);
        const busy = gm.hole || gm.chrono || gm.phasing || gm.magnet || gm.returning;
        if (sp < 1.1 && !busy && !b.isStatic) gm.still += dt; else gm.still = 0;
        const oob = b.position.x < -300 || b.position.x > this.level.w + 600 || b.position.y > GY + 500;
        if (gm.still > 44 || oob) gm.done = true;
      }
    }

    if (this.state === 'flight') {
      this.flightTime += dt;
      const allDone = this.activeBalls.every(b => b.game.done) || this.activeBalls.length === 0;
      if (allDone || this.flightTime > 700) this.settle();
    }

    this.hudTick = (this.hudTick || 0) + dt;
    if (this.hudTick > 6) { this.hudTick = 0; UI.syncHud(); }

    this.updateCam(dt);
  },

  settle() {
    if (this.state !== 'flight') return;
    this.state = 'settling';
    this.after(34, () => {
      if (this.state !== 'settling') return;
      for (const b of this.activeBalls.slice()) this.removeBall(b);
      if (this.enemies.length === 0) return;
      if (this.ballsLeft > 0 || this.cheats.infBalls) { this.loadBall(); }
      else this.after(60, () => this.onFailed());
    });
  },

  onCleared() {
    if (this.state === 'done') return;
    this.state = 'done';
    this.slowmo(.28, 70);
    this.flash('#ffffff', .35);
    SFX.play('win');
    this.after(28, () => {
      const bonus = this.ballsLeft * 900;
      this.score += bonus;
      const coinBonus = 180 + this.levelIndex * 60 + this.ballsLeft * 70;
      this.coinsEarned += coinBonus;
      this.save.coins += this.coinsEarned;
      const key = 'L' + this.levelIndex;
      this.save.best[key] = Math.max(this.save.best[key] || 0, this.score);
      this.save.unlocked = Math.max(this.save.unlocked, Math.min(LEVELS.length, this.levelIndex + 2));
      this.store();
      this.targetScale = 1;
      UI.showEnd(true, { bonus, coinBonus });
    });
  },
  onFailed() {
    if (this.state === 'done') return;
    if (this.cheats.noFail) {
      this.ballsLeft = this.level.balls;
      this.state = 'aim'; this.loadBall();
      UI.toast('NO-FAIL: BALLS REFILLED', '#00ffd5');
      return;
    }
    this.state = 'done';
    SFX.play('lose');
    this.save.coins += Math.round(this.coinsEarned * .5);
    this.store();
    UI.showEnd(false, {});
  },

  /* =========================================================
     EXPANSION ABILITIES
     ========================================================= */

  /* EGG - kills friction so stacked structures slide apart */
  slick(x, y, r) {
    SFX.play('thud'); SFX.play('glass', { v: .35 });
    this.shake(8);
    shock(x, y, r, '#ffd45c', 24, 10);
    for (let i = 0; i < 40; i++) {
      const a = rand(0, TAU), sp = rand(2, 11);
      FX.add({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2, type: 'dot',
        col: pick(['#ffd45c', '#fff6e8', '#ffb703']), size: rand(3, 7), life: rand(24, 52), g: .3, drag: .96
      });
    }
    for (const o of this.dynamicBodies()) {
      if (dist(x, y, o.position.x, o.position.y) > r) continue;
      o.friction = .002; o.frictionStatic = .02; o.frictionAir = .0008;
      o.game.slick = 460;
      this.damageBody(o, 34, o.position, '#ffd45c');
    }
  },

  /* ANCHOR - ground-borne shockwave */
  quake(x, y) {
    SFX.play('boom'); SFX.play('stone');
    this.shake(32); this.flash('#cfd6e2', .28);
    shock(x, GY, 560, '#cfd6e2', 36, 16);
    shock(x, GY, 300, '#ffffff', 24, 10);
    for (let i = 0; i < 46; i++) {
      const dx = rand(-460, 460);
      FX.add({
        x: x + dx, y: GY, vx: dx * .014, vy: rand(-11, -2), type: 'shard',
        col: pick(['#8a6a4a', '#6b4a2c', '#a3a9b4']), size: rand(3, 8), life: rand(24, 52), g: .42, spin: rand(-.3, .3)
      });
    }
    for (const o of this.dynamicBodies()) {
      const d = Math.abs(o.position.x - x);
      if (d > 470 || o.position.y < GY - 500) continue;
      const k = 1 - d / 470;
      M().Body.applyForce(o, o.position, {
        x: sgn(o.position.x - x || 1) * o.mass * .011 * k,
        y: -o.mass * .028 * k
      });
      this.damageBody(o, 95 * k, o.position, '#cfd6e2');
    }
  },

  /* SLIME - lingering corrosion */
  acid(x, y, r) {
    SFX.play('glass', { v: .3 });
    shock(x, y, r, '#9dff4d', 22, 8);
    for (let i = 0; i < 30; i++) {
      const a = rand(0, TAU), sp = rand(2, 9);
      FX.add({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.5, type: 'dot',
        col: pick(['#9dff4d', '#c8ff8a', '#2f7a10']), size: rand(2, 6), life: rand(26, 54), g: .26, add: true
      });
    }
    for (const o of this.dynamicBodies()) {
      if (dist(x, y, o.position.x, o.position.y) > r) continue;
      o.game.acid = 330;
      this.damageBody(o, 26, o.position, '#9dff4d');
    }
  },

  /* SWARM - autonomous homing drones */
  releaseSwarm(b, n) {
    SFX.play('whoosh'); SFX.play('blip', { f: 1500 });
    shock(b.position.x, b.position.y, 90, '#ffd23d', 18);
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU;
      this.drones.push({
        x: b.position.x, y: b.position.y,
        vx: Math.cos(a) * rand(4, 9) + b.velocity.x * .3,
        vy: Math.sin(a) * rand(4, 9) + b.velocity.y * .3,
        t: 0, target: null, seed: rand(0, 99)
      });
    }
  },
  droneTarget(d) {
    let best = null, bd = 1e9;
    const pool = this.enemies.length ? this.enemies : this.blocks;
    for (const o of pool) {
      if (o.game.dead) continue;
      const dd = dist(d.x, d.y, o.position.x, o.position.y);
      if (dd < bd) { bd = dd; best = o; }
    }
    return best;
  },
  stepDrones(dt) {
    for (let i = this.drones.length - 1; i >= 0; i--) {
      const d = this.drones[i];
      d.t += dt;
      if (!d.target || d.target.game.dead) d.target = this.droneTarget(d);
      if (d.target) {
        const dx = d.target.position.x - d.x, dy = d.target.position.y - d.y;
        const dd = Math.hypot(dx, dy) || 1;
        d.vx += dx / dd * 1.05 * dt; d.vy += dy / dd * 1.05 * dt;
      } else d.vy += .12 * dt;
      d.vx += Math.sin(this.time * 9 + d.seed) * .4 * dt;
      d.vy += Math.cos(this.time * 11 + d.seed) * .4 * dt;
      const drg = Math.pow(.92, dt);
      d.vx *= drg; d.vy *= drg;
      d.x += d.vx * dt; d.y += d.vy * dt;
      if (Math.random() < .5 * dt) FX.add({
        x: d.x, y: d.y, vx: rand(-.4, .4), vy: rand(-.4, .4), type: 'dot',
        size: 1.8, col: '#ffd23d', life: 14, add: true
      });
      const tgt = d.target;
      if (tgt && !tgt.game.dead) {
        const reach = (tgt.game.r || Math.max(tgt.game.w, tgt.game.h) * .5 || 20) + 9;
        if (dist(d.x, d.y, tgt.position.x, tgt.position.y) < reach) {
          this.damageBody(tgt, 46, { x: d.x, y: d.y }, '#ffd23d');
          M().Body.applyForce(tgt, tgt.position, { x: d.vx * tgt.mass * .0016, y: d.vy * tgt.mass * .0016 });
          burst(d.x, d.y, 8, { col: ['#ffd23d', '#ffffff'], size: 2, spd: 5, life: 16, add: true });
          SFX.play('blip', { f: 1700, v: .4 });
          this.drones.splice(i, 1);
          continue;
        }
      }
      if (d.t > 460) this.drones.splice(i, 1);
    }
  },

  /* TEMPEST - persistent cyclone */
  spawnVortex(x, y) {
    this.vortex = { x, y, t: 0, life: 250, r: 330 };
    SFX.play('whoosh'); SFX.play('timewarp');
    this.shake(14);
    shock(x, y, 340, '#cfe4f5', 30, 12);
  },
  stepVortex(dt) {
    const v = this.vortex;
    if (!v) return;
    v.t += dt;
    if (v.t > v.life) { this.vortex = null; return; }
    const fade = clamp(Math.min(v.t / 20, (v.life - v.t) / 40), 0, 1);
    for (const o of this.dynamicBodies()) {
      const dx = o.position.x - v.x, dy = o.position.y - v.y;
      const d = Math.hypot(dx, dy);
      if (d > v.r || d < 2) continue;
      const k = (1 - d / v.r) * fade;
      const tx = -dy / d, ty = dx / d;
      M().Body.applyForce(o, o.position, {
        x: (tx * .0052 - dx / d * .0018) * o.mass * k * dt,
        y: (ty * .0052 - dy / d * .0018) * o.mass * k * dt - o.mass * .0036 * k * dt
      });
      if (Math.random() < .022 * dt) this.damageBody(o, 9, o.position, '#cfe4f5');
    }
    for (let i = 0; i < 2; i++) {
      const a = rand(0, TAU), r = rand(30, v.r);
      FX.add({
        x: v.x + Math.cos(a) * r, y: v.y + Math.sin(a) * r,
        vx: -Math.sin(a) * 8, vy: Math.cos(a) * 8 - 3, type: 'dot',
        size: rand(1.5, 3.5), col: pick(['#cfe4f5', '#9fd0f5', '#ffffff']),
        life: rand(16, 34), add: true, drag: .97
      });
    }
  },

  /* VIRUS - spreads body to body */
  infect(o) {
    if (!o || !o.game || o.game.dead || o.isStatic || o.game.ball) return;
    if (o.game.infected) return;
    o.game.infected = 620;
    burst(o.position.x, o.position.y, 10, { col: ['#b6ff3d', '#5c0f8f'], size: 3, spd: 4, life: 26, add: true });
    SFX.play('blip', { f: 200, v: .5 });
  },
  stepInfection(dt) {
    const all = this.dynamicBodies();
    for (const o of all) {
      const gm = o.game;
      if (!gm.infected) continue;
      gm.infected -= dt;
      if (Math.random() < .18 * dt) FX.add({
        x: o.position.x + rand(-16, 16), y: o.position.y + rand(-16, 16),
        vx: rand(-.4, .4), vy: rand(-.9, -.2), type: 'dot', size: rand(1.5, 3),
        col: pick(['#b6ff3d', '#7ddd1f']), life: 30, add: true
      });
      if (Math.random() < .05 * dt) {
        this.damageBody(o, 13, o.position, '#b6ff3d');
        const ro = gm.r || Math.max(gm.w, gm.h) * .5 || 20;
        for (const q of all) {
          if (q === o || q.game.infected || q.game.dead) continue;
          const rq = q.game.r || Math.max(q.game.w, q.game.h) * .5 || 20;
          if (dist(o.position.x, o.position.y, q.position.x, q.position.y) < ro + rq + 46) this.infect(q);
        }
      }
      if (gm.infected <= 0) gm.infected = 0;
    }
  },
  stepStatus(dt) {
    for (const o of this.dynamicBodies()) {
      const gm = o.game;
      if (gm.slick > 0) gm.slick -= dt;
      if (!gm.acid) continue;
      gm.acid -= dt;
      if (Math.random() < .22 * dt) FX.add({
        x: o.position.x + rand(-14, 14), y: o.position.y + rand(-6, 14),
        vx: 0, vy: rand(.4, 1.4), type: 'dot', size: rand(1.5, 3.4),
        col: '#9dff4d', life: 26, g: .1, add: true
      });
      if (Math.random() < .06 * dt) this.damageBody(o, 11, o.position, '#9dff4d');
      if (gm.acid <= 0) gm.acid = 0;
    }
  },

  /* ORBITAL - three escalating pillars from the sky */
  orbitalStrike(tx) {
    SFX.play('zap');
    this.flash('#7fe9ff', .3);
    for (let i = 0; i < 3; i++) {
      const x = tx + (i - 1) * 100;
      const rad = 125 + i * 42, dmg = 140 + i * 85;
      const col = i === 2 ? '#ffc23d' : '#7fe9ff';
      this.after(i * 26, () => {
        for (let k = 0; k < 3; k++) FX.add({
          x, y: GY - 6, type: 'ring', size: rad * (1.4 - k * .3), grow: -rad * .02,
          col, life: 16, add: true, width: 3
        });
        SFX.play('blip', { f: 500 + i * 220 });
        this.after(15, () => {
          const top = { x, y: GY - 1400 }, bot = { x, y: GY };
          FX.add({ x: 0, y: 0, type: 'bolt', pts: [top, bot], col, col2: '#ffffff', size: rad * .5, life: 20, add: true, fade: 1.6, drag: 1 });
          FX.add({ x: 0, y: 0, type: 'bolt', pts: [top, bot], col: '#ffffff', col2: null, size: rad * .16, life: 26, add: true, fade: 1.2, drag: 1 });
          for (let k = 0; k < 26; k++) FX.add({
            x: x + rand(-rad, rad), y: GY - rand(0, 900), vx: rand(-1, 1), vy: rand(-14, -4),
            type: 'spark', size: 2.4, col, life: rand(14, 30), add: true
          });
          this.explode(x, GY - 24, rad, .055, dmg, col);
          this.flash(col, .34);
          this.shake(20 + i * 6);
        });
      });
    }
  },

  /* DICE - six outcomes, one roll */
  diceRoll(b) {
    const face = rint(1, 6);
    b.game.diceFace = face;
    const p = { x: b.position.x, y: b.position.y };
    SFX.play('shake');
    popText(p.x, p.y - 44, 'ROLLED ' + face, '#ffffff', 20);
    for (let i = 0; i < 24; i++) FX.add({
      x: p.x, y: p.y, vx: rand(-8, 8), vy: rand(-8, 8), type: 'glyph',
      txt: String(rint(1, 6)), size: rand(11, 20), col: '#ffd979', life: rand(18, 34), add: true
    });
    const say = (txt, col) => { popText(p.x, p.y - 78, txt, col, 24); UI.centerToast(txt, col); };
    switch (face) {
      case 1:
        say('SNAKE EYES', '#ff6a8a');
        this.coinsEarned += 300;
        popText(p.x, p.y - 8, '+300c', '#ffc23d', 17);
        burst(p.x, p.y, 14, { col: ['#ff6a8a', '#ffffff'], size: 3, spd: 4, life: 24, add: true });
        SFX.play('error');
        break;
      case 2: {
        say('TRIPLE', '#52e07a');
        const v = b.velocity;
        for (const a of [-.42, .42, .84]) {
          const c = Math.cos(a), sn = Math.sin(a);
          this.addBall(p.x, p.y, v.x * c - v.y * sn, v.x * sn + v.y * c, b.game.skin, { frag: true, dmg: 1.2 });
        }
        SFX.play('whoosh');
        break;
      }
      case 3: say('DEEP FREEZE', '#bfe9ff'); this.freeze(p.x, p.y, 240); break;
      case 4:
        say('THUNDERSTORM', '#ffe680');
        this.lightning(p.x, p.y, 3);
        this.after(20, () => this.lightning(p.x + rand(-220, 220), GY - 60, 2));
        break;
      case 5:
        say('TITAN', '#ffc23d');
        M().Body.scale(b, 2.4, 2.4);
        b.game.R *= 2.4;
        M().Body.setDensity(b, .006);
        b.game.bonusDmg = 3;
        this.shake(16); this.flash('#ffc23d', .3);
        shock(p.x, p.y, 200, '#ffc23d', 24);
        break;
      case 6:
        say('JACKPOT', '#ff3fa0');
        this.explode(p.x, p.y, 340, .09, 260, '#ff3fa0');
        this.after(10, () => this.explode(p.x + rand(-140, 140), p.y + rand(-90, 90), 220, .06, 150, '#ffd979'));
        break;
    }
  },

  /* ---------------- PHOENIX: aimed dive bombing ---------------- */
  phoenixDive(b) {
    const Mx = M(), m = b.game;
    m.dives = (m.dives || 0);
    const tier = m.dives;
    const p = { x: b.position.x, y: b.position.y };

    // only burn where it stands if it is actually near something; the
    // opening dive used to waste its explosion in empty air
    let near = false;
    for (const o of this.dynamicBodies())
      if (dist(p.x, p.y, o.position.x, o.position.y) < 190) { near = true; break; }
    if (near || tier > 0) this.explode(p.x, p.y, 150 + tier * 40, .05, 95 + tier * 45, '#ff7a1a');
    for (let i = 0; i < 46; i++) {
      const a = rand(0, TAU);
      FX.add({
        x: p.x, y: p.y, vx: Math.cos(a) * rand(4, 15), vy: Math.sin(a) * rand(4, 15) - 3,
        type: 'flare', size: rand(8, 22), col: pick(['#fff3c0', '#ffd66b', '#ff5a1f']),
        life: rand(24, 54), add: true, drag: .94
      });
    }

    // pick where to come down
    let target = this.mouseWorld;
    if (!target) {
      const e = this.enemies[0];
      target = e ? { x: e.position.x, y: e.position.y } : { x: this.level.w * .6, y: GY - 120 };
    }
    const sx = clamp(target.x - 300, 60, this.level.w - 60), sy = GY - 780;
    Mx.Body.setPosition(b, { x: sx, y: sy });
    const dx = target.x - sx, dy = target.y - sy, d = Math.hypot(dx, dy) || 1;
    const spd = 23 + tier * 4;
    Mx.Body.setVelocity(b, { x: dx / d * spd, y: dy / d * spd });
    if (tier > 0) { Mx.Body.scale(b, 1.32, 1.32); m.R *= 1.32; }
    Mx.Body.setDensity(b, .0018 + tier * .0012);

    m.diving = true;
    m.rebirthCD = 8;
    m.burning = true;
    m.bonusDmg = 2.1 + tier * .7;
    m.dives++;

    this.slowmo(.42, 22 + tier * 4);
    this.flash('#ffd66b', .34);
    this.shake(14);
    SFX.play('reveal', { r: 4 }); SFX.play('whoosh');
    popText(sx, sy + 60, ['FIRST DESCENT', 'SECOND DESCENT', 'FINAL DESCENT'][tier] || 'DESCENT', '#ffd66b', 22);
    // a comet halo streaking down behind it
    for (let i = 0; i < 30; i++) FX.add({
      x: sx + rand(-30, 30), y: sy + rand(-30, 30), vx: dx / d * rand(2, 8), vy: dy / d * rand(2, 8),
      type: 'spark', size: 3, col: pick(['#fff3c0', '#ff7a1a']), life: 26, add: true
    });
  },
  phoenixImpact(b, other, pt) {
    const m = b.game;
    m.rebirthCD = 30;
    const tier = m.dives - 1;
    this.ignite(other);
    this.crater(pt.x, pt.y);
    this.explode(pt.x, pt.y, 200 + tier * 60, .06 + tier * .014, 165 + tier * 85, '#ff7a1a');
    this.flash('#ffd66b', .35 + tier * .1);
    this.shake(20 + tier * 8);
    // set the neighbourhood alight
    for (const o of this.dynamicBodies())
      if (dist(pt.x, pt.y, o.position.x, o.position.y) < 190 + tier * 60) this.ignite(o);

    if (m.dives < 3) {
      m.diving = false;
      popText(pt.x, pt.y - 44, 'REBIRTH', '#ffd66b', 24);
      for (let i = 0; i < 40; i++) FX.add({
        x: pt.x, y: pt.y, vx: rand(-9, 9), vy: rand(-18, -3), type: 'flare',
        size: rand(8, 20), col: pick(['#fff3c0', '#ffd66b', '#ff5a1f']), life: 40, add: true
      });
      this.after(16, () => { if (!b.game.dead) this.phoenixDive(b); });
    } else {
      m.diving = false;
      popText(pt.x, pt.y - 44, 'ASHES', '#ff7a1a', 26);
      this.after(6, () => this.explode(pt.x, pt.y, 320, .085, 220, '#ffd66b'));
      // leave the ball in play so it still settles and does normal damage
    }
  },

  /* ---------------- ECLIPSE: shadow tendrils ---------------- */
  spawnTendril(x) {
    this.tendrils.push({
      x: clamp(x, 40, this.level.w - 40), t: 0, len: 0,
      max: rand(150, 340), seed: rand(0, 99),
      life: rand(260, 460), grab: null
    });
  },
  stepTendrils(dt) {
    for (let i = this.tendrils.length - 1; i >= 0; i--) {
      const td = this.tendrils[i];
      td.t += dt;
      const grow = clamp(td.t / 26, 0, 1);
      const retract = clamp((td.life - td.t) / 30, 0, 1);
      td.len = td.max * grow * retract;
      const tipX = td.x + Math.sin(this.time * 1.6 + td.seed) * td.len * .22;
      const tipY = GY - td.len;
      td.tipX = tipX; td.tipY = tipY;

      if (grow >= 1 && (!td.grab || td.grab.game.dead)) {
        td.grab = null;
        let bd = 120;
        for (const o of this.dynamicBodies()) {
          const d = dist(tipX, tipY, o.position.x, o.position.y);
          if (d < bd) { bd = d; td.grab = o; }
        }
      }
      const g2 = td.grab;
      if (g2 && !g2.game.dead) {
        const dx = tipX - g2.position.x, dy = tipY - g2.position.y;
        const d = Math.hypot(dx, dy) || 1;
        M().Body.applyForce(g2, g2.position, {
          x: dx / d * g2.mass * .0016 * dt,
          y: (dy / d * .0016 + .0026) * g2.mass * dt   // and drag it downward
        });
        this.damageBody(g2, (g2.game.enemy ? .95 : .6) * dt, g2.position, '#b06bff');
        if (Math.random() < .3 * dt) FX.add({
          x: g2.position.x + rand(-14, 14), y: g2.position.y + rand(-14, 14),
          vx: rand(-.6, .6), vy: rand(-1.4, -.2), type: 'dot', size: rand(2, 4),
          col: pick(['#b06bff', '#ff2e88']), life: 26, add: true
        });
      }
      if (td.t > td.life) this.tendrils.splice(i, 1);
    }
  },

  /* MYTHIC: ECLIPSE - the lights go out for the rest of the level */
  eclipseWorld(b) {
    if (this.eclipse) return;
    this.eclipse = true;
    this.theme = 'eclipse';
    this.fx.darkTarget = 1;
    SFX.play('timewarp'); SFX.play('boom');
    this.flash('#ff5a2a', .5);
    this.shake(30);
    UI.centerToast('TOTALITY', '#ff5a2a');
    const p = { x: b.position.x, y: b.position.y };
    shock(p.x, p.y, 1100, '#ff5a2a', 46, 20);
    shock(p.x, p.y, 700, '#ffd07a', 34, 12);
    for (let i = 0; i < 70; i++) {
      const a = rand(0, TAU);
      FX.add({
        x: p.x, y: p.y, vx: Math.cos(a) * rand(4, 20), vy: Math.sin(a) * rand(4, 20),
        type: 'flare', size: rand(8, 22), col: pick(['#ff5a2a', '#ffd07a', '#8a1f5c']),
        life: rand(26, 60), add: true, drag: .94
      });
    }
    for (const o of this.dynamicBodies()) {
      this.damageBody(o, o.game.enemy ? 30 : 16, o.position, '#ff5a2a');
      if (o.game.block && Math.random() < .15) this.ignite(o);
    }
    // the dark reaches up right away, all along the level
    const n = 9;
    for (let i = 0; i < n; i++) {
      const x = 320 + (this.level.w - 400) * (i / (n - 1)) + rand(-60, 60);
      this.after(10 + i * 5, () => { this.spawnTendril(x); SFX.play('blip', { f: 90 + i * 12, v: .5 }); });
    }
    this.coronaTimer = 150;
  },

  /* ---------- camera ---------- */
  /* frames the slingshot together with everything still standing */
  aimFrame() {
    const baseZ = clamp(R.H / VIEW_H, .5, 1.9);
    let maxX = SLING_X + 620, minY = GY - 300;
    for (const o of this.dynamicBodies()) {
      const r = o.game.r || Math.max(o.game.w, o.game.h) * .6 || 30;
      maxX = Math.max(maxX, o.position.x + r + 190);
