    el.querySelectorAll('.sk-card').forEach(c => {
      if (c.classList.contains('locked')) return;
      c.onclick = () => { SFX.play('ui'); this.clearScreen(); G.startLevel(+c.dataset.i); };
    });
  },

  /* ---------- SHOP ---------- */
  showShop() {
    const rows = c => RARITY.map((r, i) => c.odds[i] > 0 ? `
      <div class="row" style="color:${r.c}">
        <span class="nm">${r.name}</span>
        <span class="bar"><i style="width:${Math.max(2, c.odds[i] * 100)}%"></i></span>
        <span class="pc">${(c.odds[i] * 100).toFixed(c.odds[i] < .01 ? 1 : 0)}%</span>
      </div>` : '').join('');
    const cards = CRATES.map(c => `
      <div class="crate-card" style="--cc:${c.cc}">
        ${c.id === 'gold' ? '<div class="ribbon">POPULAR</div>' : c.id === 'vault' ? '<div class="ribbon v">BEST ODDS</div>' : ''}
        <div class="crate-art"><canvas data-crate="${c.id}"></canvas></div>
        <div class="crate-name">${c.name}</div>
        <div class="crate-desc">${c.desc}</div>
        <div class="odds">${rows(c)}</div>
        <button class="btn ${G.save.coins >= c.cost ? 'primary' : ''}" data-buy="${c.id}"
          ${G.save.coins < c.cost ? 'disabled' : ''}>${fmt(c.cost)} &#9679;<span class="sub">OPEN CRATE</span></button>
      </div>`).join('');
    const free = !G.save.firstCrate ? `<div style="text-align:center;margin:0 0 20px">
        <button class="btn primary" id="freeCrate">CLAIM FREE CRATE<span class="sub">WELCOME GIFT</span></button></div>` : '';
    const el = this.set(`
      ${this.wallet()}
      <div class="scr-head">
        <div class="scr-title">CRATES<small>EVERY SKIN HAS A UNIQUE ABILITY</small></div>
        <button class="btn small ghost" id="back">BACK</button>
      </div>
      <div class="scr-body">
        ${free}
        <div class="crates">${cards}</div>
        <div class="pity pity-meters">
          ${pityMeter('Legendary guarantee', G.save.pity, PITY_LEG, RC(4))}
          ${pityMeter('Mythic guarantee', G.save.mythicPity, PITY_MYTH, RC(5))}
          ${pityMeter('Transcendent guarantee', G.save.transPity || 0, PITY_TRANS, '#ffffff')}
        </div>
        <div class="tip">Duplicates convert to coins. Coins come from wrecking things. Wreck more things.</div>
      </div>`, 'shop');
    el.querySelector('#back').onclick = () => { SFX.play('ui'); this.showMenu(); };
    this.crateAnims = [...el.querySelectorAll('canvas[data-crate]')].map(cv => ({
      cv, crate: CRATES.find(c => c.id === cv.dataset.crate), opts: { float: true }
    }));
    el.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => {
      const c = CRATES.find(x => x.id === b.dataset.buy);
      if (G.save.coins < c.cost) { SFX.play('error'); return; }
      G.save.coins -= c.cost; G.store();
      SFX.play('buy');
      this.openCrate(c);
    });
    const f = el.querySelector('#freeCrate');
    if (f) f.onclick = () => {
      G.save.firstCrate = true; G.store();
      SFX.play('buy');
      this.openCrate(CRATES[0]);
    };
  },

  /* ---------- COLLECTION ---------- */
  showCollection() {
    const owned = SKINS.filter(s => G.owns(s.id)).length;
    const byRar = RARITY.map((r, i) => {
      const tot = SKINS.filter(s => s.rar === i).length;
      const own = SKINS.filter(s => s.rar === i && G.owns(s.id)).length;
      return `<div class="cs" style="--rc:${r.c}"><b>${own}/${tot}</b><span>${r.name}</span></div>`;
    }).join('');
    const cards = SKINS.map(s => {
      const own = G.owns(s.id), n = G.save.inv[s.id] || 0;
      const eq = G.skin && G.skin.id === s.id;
      return `<div class="sk-card ${own ? 'owned' : 'locked'} ${s.rar >= 6 ? 'tier6' : ''}" data-id="${s.id}" style="--rc:${RC(s.rar)}
        ${eq ? ';box-shadow:0 0 0 2px ' + RC(s.rar) + ',0 0 34px ' + RC(s.rar) + '66' : ''}">
        <div class="sk-rar">${RARITY[s.rar].name}</div>
        ${n > 1 ? `<div class="sk-dupe">x${n}</div>` : ''}
        <canvas data-skin="${s.id}"></canvas>
        <div class="sk-nm">${own ? s.name : '???'}</div>
        <div class="sk-ab">${own ? s.abil : 'LOCKED'}</div>
        ${eq ? '<div class="sk-eq">EQUIPPED</div>' : ''}
      </div>`;
    }).join('');
    const el = this.set(`
      ${this.wallet()}
      <div class="scr-head">
        <div class="scr-title">COLLECTION<small>${owned} OF ${SKINS.length} SKINS &nbsp;&bull;&nbsp; CLICK TO EQUIP</small></div>
        <button class="btn small ghost" id="back">BACK</button>
      </div>
      <div class="scr-body">
        <div class="coll-prog"><div class="cpb"><i style="width:${Math.max(2, owned / SKINS.length * 100)}%"></i></div><span>${owned} / ${SKINS.length}</span></div>
        <div class="coll-stats">${byRar}</div>
        <div class="coll-grid">${cards}</div>
        <div class="tip" id="detail">Rarer skins hit harder, look better, and bend more rules.</div>
      </div>`, 'collection');
    el.querySelector('#back').onclick = () => { SFX.play('ui'); this.showMenu(); };
    this.anim = [...el.querySelectorAll('canvas[data-skin]')].map(cv => ({
      cv, skin: SKIN_BY_ID[cv.dataset.skin], opts: { float: true, glow: G.owns(cv.dataset.skin) }
    }));
    el.querySelectorAll('.sk-card').forEach(c => {
      const s = SKIN_BY_ID[c.dataset.id];
      c.onmouseenter = () => {
        const d = el.querySelector('#detail');
        d.innerHTML = G.owns(s.id)
          ? `<b style="color:${RC(s.rar)}">${s.abil}</b> — ${s.abilDesc}<br><span style="opacity:.6">${s.desc}</span>`
          : `A ${RARITY[s.rar].name.toLowerCase()} skin you have not found yet.`;
      };
      c.onclick = () => {
        if (!G.owns(s.id)) { SFX.play('error'); return; }
        G.skin = s; G.save.equipped = s.id; G.store();
        SFX.play('ui');
        this.showCollection();
        this.toast(`EQUIPPED <b>${s.name}</b>`, RC(s.rar));
      };
    });
  },

  /* =========================================================
     CRATE OPENING
     ========================================================= */
  openCrate(crate) {
    const save = G.save;
    const skin = rollSkin(crate, save);
    save.opened++;
    if (skin.rar >= 4) save.pity = 0; else save.pity++;
    if (skin.rar >= 5) save.mythicPity = 0; else save.mythicPity++;
    if (skin.rar >= 6) save.transPity = 0; else save.transPity = (save.transPity || 0) + 1;
    const dupe = G.owns(skin.id);
    if (dupe) save.coins += DUPE_COINS[skin.rar];
    save.inv[skin.id] = (save.inv[skin.id] || 0) + 1;
    G.store();

    this.stage.classList.remove('hidden');
    this.stage.style.setProperty('--rc', RC(skin.rar));
    this.anim = []; this.crateAnims = []; this.confetti = null;
    CrateShow.start(this.stage, crate, skin, () => this.revealCard(skin, dupe));
  },
  revealCard(skin, dupe) {
    const col = RC(skin.rar), myth = skin.rar >= 5;
    const div = document.createElement('div');
    div.className = 'reveal cs' + (skin.rar >= 6 ? ' tr' : '');
    div.innerHTML = `
      <div class="rar-tag ${myth ? 'mythic-txt' : ''}">${RARITY[skin.rar].name}</div>
      <div class="nm ${myth ? 'mythic-txt' : ''}">${skin.name}</div>
      <div class="ab">${skin.abil}</div>
      <div class="desc">${skin.abilDesc}</div>
      ${dupe ? `<div class="dupe">DUPLICATE &rarr; +${fmt(DUPE_COINS[skin.rar])} COINS</div>` : ''}
      <div class="cont">
        <button class="btn primary" id="rEquip">EQUIP</button>
        <button class="btn ghost" id="rClose">CONTINUE</button>
      </div>`;
    this.stage.appendChild(div);
    div.querySelector('#rEquip').onclick = e => {
      e.stopPropagation();
      G.skin = skin; G.save.equipped = skin.id; G.store();
      SFX.play('ui'); this.closeStage();
      this.toast(`EQUIPPED <b>${skin.name}</b>`, col);
    };
    div.querySelector('#rClose').onclick = e => { e.stopPropagation(); SFX.play('ui'); this.closeStage(); };
  },
  closeStage() {
    CrateShow.stop();
    this.stage.classList.add('hidden');
    this.stage.innerHTML = '';
    this.confetti = null;
    this.crateAnims = []; this.anim = [];
    if (this.cur === 'shop') this.showShop();
    else if (this.cur === 'collection') this.showCollection();
    else this.showMenu();
  },
  confettiBurst(rar) {
    const c = this.confetti; if (!c) return;
    const cols = rar >= 5 ? ['#ff3fa0', '#ffc23d', '#52e07a', '#3fa9ff', '#b56cff', '#ffffff']
      : rar >= 4 ? ['#ffc23d', '#ffe9a8', '#ffffff'] : ['#b56cff', '#e0c6ff', '#ffffff'];
    const n = 60 + rar * 40;
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), s = rand(4, 22);
      c.ps.push({
        x: .5, y: .5, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 4,
        w: rand(4, 11), h: rand(6, 16), col: pick(cols), rot: rand(0, TAU), spin: rand(-.35, .35), life: rand(80, 190)
      });
    }
  },
  confettiTick() {
    const c = this.confetti;
    if (!c || !c.cv || !c.cv.isConnected) return;
    const cv = c.cv, w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== w) { cv.width = w; cv.height = h; }
    const x = cv.getContext('2d');
    x.clearRect(0, 0, w, h);
    for (let i = c.ps.length - 1; i >= 0; i--) {
      const p = c.ps[i];
      if (p.px === undefined) { p.px = w * .5; p.py = h * .5; }
      p.px += p.vx;
      p.py += p.vy;
      p.vy += .35; p.vx *= .99; p.rot += p.spin;
      p.life--;
      if (p.life <= 0 || p.py > h + 40) { c.ps.splice(i, 1); continue; }
      x.save();
      x.translate(p.px, p.py); x.rotate(p.rot);
      x.globalAlpha = clamp(p.life / 60, 0, 1);
      x.fillStyle = p.col;
      x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      x.restore();
    }
  },

  /* =========================================================
     IN-GAME HUD
     ========================================================= */
  enterGame() {
    this.clearScreen();
    this.retroMode(false);
    this.hud.classList.remove('hidden');
    document.getElementById('hLvlNo').textContent = G.levelIndex + 1;
    document.getElementById('hLvlName').textContent = G.level.name;
    const sb = document.getElementById('hSkin');
    sb.style.setProperty('--rc', RC(G.skin.rar));
    document.getElementById('sbName').textContent = G.skin.name;
    document.getElementById('sbAbil').textContent = G.skin.abil;
    this.anim = [{ cv: document.getElementById('sbCv'), skin: G.skin, opts: { float: true, scale: .3 } }];
    this.syncHud();
    this.centerToast(G.level.name, THEMES[G.theme].amb);
  },
  syncHud() {
    const total = G.level ? G.level.balls : 0;
    let s = '';
    for (let i = 0; i < total; i++) s += `<i class="${i < total - G.ballsLeft ? 'spent' : ''}"></i>`;
    document.getElementById('hAmmo').innerHTML = s;
    document.getElementById('hCoins').textContent = fmt(G.save.coins + G.coinsEarned);
    document.getElementById('hScore').textContent = fmt(G.score);
    const k = document.getElementById('sbKey');
    const used = !!(G.ball && G.ball.game && G.ball.game.used);
    k.classList.toggle('used', used);
    k.classList.toggle('ready', G.state === 'flight' && !used);
    k.textContent = used ? 'USED' : (G.state === 'flight' ? 'SPACE' : 'ABILITY');
  },
  /* re-point the HUD badge at whatever skin is equipped right now */
  refreshSkinBadge() {
    if (!G.skin) return;
    const sb = document.getElementById('hSkin');
    if (!sb) return;
    sb.style.setProperty('--rc', RC(G.skin.rar));
    document.getElementById('sbName').textContent = G.skin.name;
    document.getElementById('sbAbil').textContent = G.skin.abil;
    const cv = document.getElementById('sbCv');
    const entry = this.anim.find(a => a.cv === cv);
    if (entry) entry.skin = G.skin;
    else this.anim.push({ cv, skin: G.skin, opts: { float: true, scale: .3 } });
  },

  markAbilityUsed() {
    const k = document.getElementById('sbKey');
    k.classList.remove('ready'); k.classList.add('used');
    k.textContent = 'USED';
  },
  centerToast(txt, col) {
    const el = document.getElementById('ctoast');
    el.textContent = txt;
    el.style.color = col || '#fff';
    el.style.textShadow = `0 0 40px ${col || '#fff'},0 6px 0 rgba(0,0,0,.35)`;
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  },
  toast(html, col) {
    const box = document.getElementById('toasts');
    const d = document.createElement('div');
    d.className = 'toast';
    d.style.setProperty('--rc', col || '#ffc23d');
    d.style.borderColor = (col || '#ffc23d') + '66';
    d.innerHTML = html;
    box.appendChild(d);
    setTimeout(() => { d.classList.add('out'); setTimeout(() => d.remove(), 320); }, 2100);
  },
  retroMode(on) {
    document.body.style.fontFamily = on ? "'Press Start 2P',monospace" : '';
    document.querySelectorAll('.lvl-name,.sb-abil,.stat').forEach(e => {
      e.style.letterSpacing = on ? '0' : '';
      e.style.fontSize = on ? '9px' : '';
    });
  },
  confirmRetry() {
    SFX.play('ui');
    this.hud.classList.add('hidden');
    this.retroMode(false);
    G.startLevel(G.levelIndex);
  },
  escape() {
    if (!this.stage.classList.contains('hidden')) return;
    if (G.state !== 'menu' && !this.cur) this.showMenu();
  },

  /* ---------- END SCREEN ---------- */
  showEnd(win, data) {
    this.hud.classList.add('hidden');
    const best = G.save.best['L' + G.levelIndex] || 0;
    const thresholds = [4000, 9000, 15000].map((v, i) => v + G.levelIndex * 2200);
    const sN = win ? clamp(Math.max(1, thresholds.filter(t => G.score >= t).length), 1, 3) : 0;
    const star = on => `<svg class="star ${on ? 'on' : ''}" viewBox="0 0 24 24" fill="${on ? '#ffc23d' : '#8894b5'}"
        style="filter:${on ? 'drop-shadow(0 0 14px #ffc23d)' : 'none'}">
        <path d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.7 21.4l1.5-7.1L1.8 9.4l7.2-.8z"/></svg>`;
    const rows = win ? `
      <div class="end-row"><span>Score</span><b>${fmt(G.score)}</b></div>
      <div class="end-row"><span>Unused balls bonus</span><b>+${fmt(data.bonus || 0)}</b></div>
      <div class="end-row"><span>Coins earned</span><b>+${fmt(G.coinsEarned)} &#9679;</b></div>
      <div class="end-row"><span>Personal best</span><b>${fmt(best)}</b></div>`
      : `<div class="end-row"><span>Madballs left standing</span><b>${G.enemies.length}</b></div>
      <div class="end-row"><span>Score</span><b>${fmt(G.score)}</b></div>
      <div class="end-row"><span>Coins salvaged</span><b>+${fmt(Math.round(G.coinsEarned * .5))} &#9679;</b></div>`;
    const nextLocked = G.levelIndex + 1 >= LEVELS.length;
    const el = this.set(`
      ${this.wallet()}
      <div class="end-card ${win ? 'win' : ''}">
        <div class="end-title ${win ? '' : 'fail'}">${win ? 'CLEARED' : 'WIPED OUT'}</div>
        <div style="font-size:11px;letter-spacing:.24em;color:#93a2c6;font-weight:800;margin-top:6px">
          LEVEL ${G.levelIndex + 1} &nbsp;&bull;&nbsp; ${G.level.name}</div>
        <div class="stars">${star(sN >= 1)}${star(sN >= 2)}${star(sN >= 3)}</div>
        <div class="end-rows">${rows}</div>
        <div class="end-btns">
          ${win && !nextLocked ? '<button class="btn primary" id="eNext">NEXT LEVEL</button>' : ''}
          <button class="btn" id="eRetry">${win ? 'REPLAY' : 'TRY AGAIN'}</button>
          <button class="btn ghost" id="eShop">CRATES</button>
          <button class="btn ghost" id="eMenu">MENU</button>
        </div>
      </div>`, 'end');
    this.retroMode(false);
    el.querySelectorAll('.end-row b').forEach((b, i) => {
      const m = b.textContent.match(/^([^\d]*)([\d,]+)(.*)$/);
      if (!m) return;
      const to = +m[2].replace(/,/g, ''), t0 = performance.now() + 250 + i * 140;
      b.textContent = m[1] + '0' + m[3];
      const run = () => {
        const k = clamp((performance.now() - t0) / 800, 0, 1);
        b.textContent = m[1] + fmt(to * eOut(k)) + m[3];
        if (k < 1 && b.isConnected) requestAnimationFrame(run);
      };
      requestAnimationFrame(run);
    });
    const n = el.querySelector('#eNext');
    if (n) n.onclick = () => { SFX.play('ui'); this.clearScreen(); G.startLevel(G.levelIndex + 1); };
    el.querySelector('#eRetry').onclick = () => { SFX.play('ui'); this.clearScreen(); G.startLevel(G.levelIndex); };
    el.querySelector('#eShop').onclick = () => { SFX.play('ui'); this.showShop(); };
    el.querySelector('#eMenu').onclick = () => { SFX.play('ui'); this.showMenu(); };
    if (win) setTimeout(() => { for (let i = 0; i < sN; i++) setTimeout(() => SFX.play('blip', { f: 900 + i * 260 }), i * 260); }, 380);
  }
};

/* ---------- level card art: a little glossy print of each world ---------- */
function drawLevelScene(cv, L, i) {
  const x = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = cv.clientWidth || 160, h = cv.clientHeight || 150;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const th = THEMES[L.theme] || THEMES.day, gy = h * .8;
  const sky = x.createLinearGradient(0, 0, 0, gy);
  sky.addColorStop(0, th.sky[0]); sky.addColorStop(.6, th.sky[1]); sky.addColorStop(1, th.sky[2]);
  x.fillStyle = sky; x.fillRect(0, 0, w, h);
  const sx = w * .74, sy = gy * th.sunY * .85 + 8;
  x.globalCompositeOperation = 'lighter'; glowCircle(x, sx, sy, 50, th.sunGlow, .45);
  x.globalCompositeOperation = 'source-over';
  x.fillStyle = th.sun; x.beginPath(); x.arc(sx, sy, 10, 0, TAU); x.fill();
  [[th.far, 30, .9], [th.mid, 18, 1.5], [th.near, 8, 2.3]].forEach(([col, amp, f], k) => {
    x.beginPath(); x.moveTo(0, h);
    for (let px = 0; px <= w + 4; px += 4)
      x.lineTo(px, gy - 4 + k * 4 - (Math.sin(px * .02 * f + i * 1.7 + k * 2) * .5 + .5) * amp - amp * .3);
    x.lineTo(w, h); x.closePath();

/* ---------- crate artwork ---------- */
const CRATE_PAL = {
  wood: { hi: '#e0ad6c', mid: '#a5733e', lo: '#5a3816', band: '#7f8796', bandHi: '#d0d6e2', lock: '#ffc23d', edge: '#2e1a06', inside: '#1a0e05' },
  gold: { hi: '#fff3b4', mid: '#f0c445', lo: '#97600a', band: '#fff1c0', bandHi: '#ffffff', lock: '#ff4a7a', edge: '#5a3604', inside: '#2a1804' },
  void: { hi: '#8a58d8', mid: '#3c1a6a', lo: '#12062a', band: '#9b74e6', bandHi: '#e2ccff', lock: '#ff7be5', edge: '#06020f', inside: '#05020c' },
  vault: { hi: '#f6f9fd', mid: '#b9c4d4', lo: '#566070', band: '#ffd76b', bandHi: '#fff6d0', lock: '#ffd76b', edge: '#262d3a', inside: '#0c0f16' }

/* One crate at the origin, half-width S. o.lid = { dx, dy, rot, a } flies the lid
   off; o.leak (0-1) + o.leakCol light the seams; o.open shows the glowing inside. */
function paintCrate(x, crate, S, t, o = {}) {
  const P = CRATE_PAL[crate.id] || CRATE_PAL.wood, id = crate.id;
  x.save();
  x.lineJoin = 'round';
  if (!o.noShadow) {
    x.fillStyle = 'rgba(0,0,0,.38)';
    x.beginPath(); x.ellipse(0, S * 1.06, S * 1.18, S * .17, 0, 0, TAU); x.fill();
  }
  // --- body
  const by = -S * .42, bh = S * 1.44;
  const bodyPath = () => rr(x, -S, by, S * 2, bh, S * .09);
  bodyPath();
  const bg = x.createLinearGradient(-S, 0, S, 0);
  bg.addColorStop(0, P.hi); bg.addColorStop(.45, P.mid); bg.addColorStop(1, P.lo);
  x.fillStyle = bg; x.fill();
  x.save(); bodyPath(); x.clip();
  const vg = x.createLinearGradient(0, by, 0, by + bh);
  vg.addColorStop(0, 'rgba(255,255,255,.12)'); vg.addColorStop(1, 'rgba(0,0,0,.3)');
  x.fillStyle = vg; x.fillRect(-S, by, S * 2, bh);
  if (id === 'wood') {
    x.strokeStyle = 'rgba(40,20,4,.55)'; x.lineWidth = S * .04;
    for (let i = 1; i < 4; i++) { const y = by + bh * i / 4; x.beginPath(); x.moveTo(-S, y); x.lineTo(S, y); x.stroke(); }
    x.strokeStyle = 'rgba(60,32,8,.25)'; x.lineWidth = S * .02;
    for (let i = 0; i < 8; i++) {
      const y = by + bh * (i + .5) / 8;
      x.beginPath(); x.moveTo(-S, y); x.bezierCurveTo(-S * .3, y + S * .05, S * .3, y - S * .05, S, y + S * .02); x.stroke();
    }
  } else if (id === 'gold') {
    x.strokeStyle = 'rgba(120,70,6,.6)'; x.lineWidth = S * .05;
    rr(x, -S * .86, by + S * .14, S * 1.72, bh - S * .28, S * .1); x.stroke();
    x.strokeStyle = 'rgba(255,250,220,.6)'; x.lineWidth = S * .02;
    for (const s of [-1, 1]) { x.beginPath(); x.arc(s * S * .36, by + bh * .62, S * .22, 0, TAU); x.stroke(); }
  } else if (id === 'void') {
    for (let i = 0; i < 6; i++) {
      x.fillStyle = i % 2 ? 'rgba(160,110,255,.18)' : 'rgba(0,0,0,.28)';
      x.beginPath(); x.moveTo(-S + i * S * .4, by); x.lineTo(-S + i * S * .4 + S * .5, by + bh); x.lineTo(-S + i * S * .4 + S * .1, by + bh); x.closePath(); x.fill();
    }
    x.globalCompositeOperation = 'lighter';
    const p = .5 + Math.sin(t * 3) * .5;
    x.strokeStyle = rgba('#d6b8ff', .35 + p * .45); x.lineWidth = S * .04; x.lineCap = 'round';
    for (const [rx, ry] of [[-.36, .55], [.36, .55], [-.36, .95], [.36, .95]]) {
      const cx = rx * S, cy = by + bh * ry * .78;
      x.beginPath(); x.moveTo(cx - S * .1, cy - S * .1); x.lineTo(cx + S * .1, cy - S * .1); x.lineTo(cx, cy + S * .12); x.closePath(); x.stroke();
    }
    x.globalCompositeOperation = 'source-over';
  } else if (id === 'vault') {
    x.fillStyle = 'rgba(30,36,48,.55)';
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) rr(x, -S * .9 + i * S * .96, by + S * .12 + j * bh * .46, S * .84, bh * .4, S * .05), x.fill();
    x.fillStyle = 'rgba(255,255,255,.18)';
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) x.fillRect(-S * .86 + i * S * .96, by + S * .15 + j * bh * .46, S * .76, S * .04);
  }
  x.restore();
  // metal bands
  for (const s of [-1, 1]) {
    const bx = s * S * .62;
    const mg = x.createLinearGradient(bx - S * .1, 0, bx + S * .1, 0);
    mg.addColorStop(0, P.bandHi); mg.addColorStop(.5, P.band); mg.addColorStop(1, shade(P.band, -.4));
    x.fillStyle = mg; x.fillRect(bx - S * .1, by, S * .2, bh);
    x.fillStyle = 'rgba(0,0,0,.35)';
    for (const yy of [by + S * .14, by + bh - S * .14]) { x.beginPath(); x.arc(bx, yy, S * .04, 0, TAU); x.fill(); }
  }
  x.strokeStyle = P.edge; x.lineWidth = S * .055; bodyPath(); x.stroke();
  // corner caps
  x.fillStyle = shade(P.band, -.15);
  for (const s of [-1, 1]) {
    x.beginPath(); x.moveTo(s * S, by + bh); x.lineTo(s * S, by + bh - S * .3); x.lineTo(s * S * .7, by + bh); x.closePath(); x.fill();
  }

  // --- the open top (only seen once the lid is gone)
  if (o.lid) {
    x.beginPath(); x.moveTo(-S * .92, by - S * .22); x.lineTo(S * .92, by - S * .22); x.lineTo(S, by); x.lineTo(-S, by); x.closePath();

  }

  // --- lid
  x.save();
  if (o.lid) { x.translate(o.lid.dx, o.lid.dy); x.rotate(o.lid.rot); x.globalAlpha = o.lid.a == null ? 1 : o.lid.a; }

  const tg = x.createLinearGradient(0, ly - S * .26, 0, ly);
  tg.addColorStop(0, shade(P.hi, .2)); tg.addColorStop(1, P.mid);
  x.fillStyle = tg; x.fill();
  x.strokeStyle = P.edge; x.lineWidth = S * .045; x.stroke();
  rr(x, -S * 1.07, ly, S * 2.14, S * .34, S * .06);
  const fg = x.createLinearGradient(-S, 0, S, 0);
  fg.addColorStop(0, shade(P.hi, .05)); fg.addColorStop(.5, P.mid); fg.addColorStop(1, P.lo);
  x.fillStyle = fg; x.fill();
  x.strokeStyle = P.edge; x.stroke();
  for (const s of [-1, 1]) {
    const bx = s * S * .62;
    x.fillStyle = P.band; x.fillRect(bx - S * .1, ly - S * .26 + S * .01, S * .2, S * .6);
    x.fillStyle = P.bandHi; x.fillRect(bx - S * .1, ly - S * .25, S * .05, S * .58);
  }
  if (id === 'gold' || id === 'vault') {
    x.fillStyle = id === 'gold' ? '#ff4a7a' : '#ffd76b';
    for (const s of [-1, 0, 1]) { x.beginPath(); x.arc(s * S * .32, ly + S * .17, S * .05, 0, TAU); x.fill(); }
  }
  x.restore();

  // --- lock (or the vault's dial), on the body under the seam
  const lx = 0, lyk = by + S * .26;
  if (id === 'vault') {
    const dg = x.createRadialGradient(-S * .05, lyk - S * .05, S * .02, 0, lyk, S * .32);
    dg.addColorStop(0, '#fff6d0'); dg.addColorStop(.6, '#d8a32a'); dg.addColorStop(1, '#6a4a0a');
    x.fillStyle = dg; x.beginPath(); x.arc(lx, lyk + S * .12, S * .3, 0, TAU); x.fill();
    x.strokeStyle = '#4a3206'; x.lineWidth = S * .03; x.stroke();
    x.strokeStyle = '#4a3206'; x.lineWidth = S * .05; x.lineCap = 'round';
    x.save(); x.translate(lx, lyk + S * .12); x.rotate(o.dial || 0);
    for (let i = 0; i < 4; i++) { x.rotate(Math.PI / 2); x.beginPath(); x.moveTo(0, S * .08); x.lineTo(0, S * .24); x.stroke(); }
    x.restore();
  } else if (!o.lid) {
    x.strokeStyle = shade(P.lock, -.25); x.lineWidth = S * .08;
    x.beginPath(); x.arc(lx, lyk - S * .06, S * .14, Math.PI, 0); x.stroke();
    rr(x, lx - S * .2, lyk - S * .06, S * .4, S * .38, S * .07);
    const kg = x.createLinearGradient(0, lyk - S * .06, 0, lyk + S * .32);
    kg.addColorStop(0, shade(P.lock, .35)); kg.addColorStop(1, shade(P.lock, -.3));
    x.fillStyle = kg; x.fill();
    x.strokeStyle = shade(P.lock, -.5); x.lineWidth = S * .035; x.stroke();
    x.fillStyle = shade(P.lock, -.6); x.beginPath(); x.arc(lx, lyk + S * .1, S * .05, 0, TAU); x.fill();
    x.fillRect(lx - S * .02, lyk + S * .1, S * .04, S * .1);

    x.strokeStyle = rgba(c, .5 + k * .5); x.lineWidth = S * (.03 + k * .05);
    x.beginPath(); x.moveTo(-S * 1.02, by - S * .01); x.lineTo(S * 1.02, by - S * .01); x.stroke();
    for (let i = 0; i < 7; i++) {
      const sx = (i / 6 - .5) * S * 1.8, len = S * (.4 + k * 1.6) * (.6 + hash(i + Math.floor(t * 12)) * .5);
      const gr = x.createLinearGradient(sx, by, sx, by - len);

      x.beginPath(); x.moveTo(sx - S * .07, by); x.lineTo(sx - S * .16, by - len); x.lineTo(sx + S * .16, by - len); x.lineTo(sx + S * .07, by); x.closePath(); x.fill();
    }
    glowCircle(x, 0, by, S * (1 + k * 1.2), c, .25 + k * .4);
    x.restore();
  }
  x.restore();
}

function drawCrateArt(cv, crate, t, opts = {}) {
  const x = cv.getContext('2d');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = cv.clientWidth || 150, h = cv.clientHeight || 132;
  if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.clearRect(0, 0, w, h);
  const S = Math.min(w, h) * .35;
  x.save();
  x.translate(w / 2, h / 2 + S * .05 + (opts.float ? Math.sin(t * 1.6) * S * .06 : 0));
  x.save(); x.globalCompositeOperation = 'lighter';
  glowCircle(x, 0, 0, Math.min(S * 2.8, Math.min(w, h) * .5), crate.cc, .35 + Math.sin(t * 2) * .08);
  x.restore();
  paintCrate(x, crate, S, t, { dial: t * .4 });

  x.restore();

/* =========================================================
   CRATE SHOW — the whole opening, drawn on one canvas:
   idle -> charge (light leaks, energy pulled in, rarity tease)
   -> burst (lid blown off, pillar of light) -> reveal (skin rises)
   ========================================================= */
const CINE_END = 5800;   // ms; the one-of-one's cutscene
const CrateShow = {
  a: null,
  start(stage, crate, skin, onReveal) {
    stage.innerHTML = `<canvas class="cshow"></canvas>
      <div class="crate-hint" id="chint">Click the crate to open</div>`;
    this.a = { stage, cv: stage.querySelector('.cshow'), crate, skin, onReveal, phase: 'idle', pt: 0, last: 0, t: 0,
      parts: [], lid: null, step: -1, flash: 0, ring: [], shakeX: 0, shakeY: 0, revealed: false };
    stage.onclick = () => {
      if (!this.a) return;
      if (this.a.phase === 'idle') this.open();
      else if (this.a.phase === 'cine') this.a.pt = Math.max(this.a.pt, CINE_END - 10);   // skip
    };
  },
  open() {
    const a = this.a; a.phase = 'charge'; a.pt = 0;
    const h = a.stage.querySelector('#chint'); if (h) h.style.display = 'none';
  },
  stop() { this.a = null; },
  burstParts(cx, cy, S, col, n, kinds) {
    const a = this.a;
    for (let i = 0; i < n; i++) {
      const ang = rand(0, TAU), sp = rand(2, 14) * S / 60;
      a.parts.push({ x: cx, y: cy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - S * .08, g: S * .006, life: rand(40, 90), max: 90,
        size: rand(2, 6) * S / 60, col: pick(kinds || [col, '#ffffff']), kind: Math.random() < .5 ? 'spark' : 'dot' });
    }
  },
  tick(now) {
    const a = this.a;
    if (!a) return;
    if (!a.cv.isConnected) { this.a = null; return; }
    const dt = a.last ? clamp(now - a.last, 0, 50) : 16; a.last = now;
    a.pt += dt; a.t += dt / 1000;
    const cv = a.cv, dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = cv.clientWidth || innerWidth, H = cv.clientHeight || innerHeight;
    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    const x = cv.getContext('2d');
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    x.clearRect(0, 0, W, H);
    const skin = a.skin, rar = skin.rar, t = a.t, f = dt / 16.67;
    const S = Math.min(W, H) * .15, cx = W / 2, cy = H * .55;
    const total = 950 + rar * 320, steps = 4 + rar * 2;
    let leak = 0, lvl = 0, k = 0;

    if (a.phase === 'charge') {
      k = clamp(a.pt / total, 0, 1);
      const st = Math.floor(k * steps);
      lvl = Math.min(rar, Math.floor(k * (rar + 1)));
      if (st !== a.step) {
        a.step = st; a.flash = Math.max(a.flash, .05 + lvl * .02);
        SFX.play('build', { k }); SFX.play('shake');
      }
      leak = .2 + k * .8;
      const amp = S * (.03 + k * k * .14);
      a.shakeX = rand(-amp, amp); a.shakeY = rand(-amp, amp) * .6;
      // energy pulled in from all around
      if (Math.random() < .55 + rar * .07) {
        const ang = rand(0, TAU), r = rand(S * 2.6, S * 4.6);
        a.parts.push({ x: cx + Math.cos(ang) * r, y: cy + Math.sin(ang) * r * .7, tx: cx, ty: cy - S * .4, life: 40, max: 40,
          size: rand(1.5, 3.5) * S / 60, col: RC(lvl), kind: 'suck' });
      }
      if (a.pt >= total && rar >= 6) {
        a.phase = 'cine'; a.pt = 0; a.letters = 0;
        SFX.play('timewarp');
      } else if (a.pt >= total) {
        a.phase = 'burst'; a.pt = 0; a.flash = 1;
        a.lid = { dx: 0, dy: 0, vx: rand(-.5, .5) * S * .06, vy: -S * .24, rot: 0, vr: rand(-.12, .12) };
        this.burstParts(cx, cy - S * .5, S, RC(rar), 50 + rar * 35, [RC(rar), '#ffffff', CRATE_PAL[a.crate.id].mid]);
        a.ring.push({ r: S * .5, a: 1 }); if (rar >= 3) a.ring.push({ r: S * .2, a: 1, d: 6 }); if (rar >= 5) a.ring.push({ r: 0, a: 1, d: 12 });
        SFX.play('reveal', { r: rar });
        if (rar >= 5) { G.flash(RC(rar), .5); G.shake(24); }
      }
    } else if (a.phase === 'burst') {
      lvl = rar;
      if (a.pt >= 620 && !a.revealed) { a.revealed = true; a.phase = 'reveal'; a.onReveal(); }
    } else if (a.phase === 'reveal') lvl = rar;

    if (a.phase === 'cine') { this.cine(a, x, W, H, S, cx, cy, t, f); return; }
    const col = RC(lvl), myth = rar >= 5;
    const rayCol = i => rar >= 6 ? (i % 2 ? '#ffe9a0' : '#ffffff') : myth ? `hsl(${(t * 80 + i * 40) % 360},100%,65%)` : col;

    // a spotlight from above, with motes drifting through it, until the lid blows
    const spotA = a.phase === 'idle' || a.phase === 'charge' ? 1 : a.phase === 'burst' ? 1 - clamp(a.pt / 300, 0, 1) : 0;
    if (spotA > 0) {
      x.save(); x.globalCompositeOperation = 'lighter'; x.globalAlpha = spotA;
      const sg = x.createLinearGradient(0, 0, 0, cy + S);
      sg.addColorStop(0, 'rgba(255,255,255,.0)'); sg.addColorStop(.25, rgba(col, .07 + k * .08)); sg.addColorStop(1, rgba(col, .16 + k * .14));
      x.fillStyle = sg;
      x.beginPath(); x.moveTo(cx - S * .35, 0); x.lineTo(cx + S * .35, 0); x.lineTo(cx + S * 2.2, cy + S * 1.06); x.lineTo(cx - S * 2.2, cy + S * 1.06); x.closePath(); x.fill();
      for (let i = 0; i < 18; i++) {
        const u = (t * (.04 + hash(i) * .05) + hash(i * 3)) % 1, yy = (1 - u) * (cy + S);
        const xx = cx + (hash(i * 7) - .5) * S * (.7 + (yy / (cy + S)) * 3.4);
        x.fillStyle = rgba('#ffffff', .5 * Math.sin(u * Math.PI));
        x.beginPath(); x.arc(xx, yy, S * .025, 0, TAU); x.fill();
      }
      x.restore();
    }

    // floor: a rune circle that spins up as the crate charges
    const floorA = a.phase === 'reveal' ? 0 : a.phase === 'burst' ? 1 - clamp(a.pt / 500, 0, 1) : 1;
    x.save(); x.translate(cx, cy + S * 1.06); x.scale(1, .28);
    x.globalAlpha = floorA;
    x.globalCompositeOperation = 'lighter';
    const spin = t * (.3 + k * 4) + (a.phase !== 'idle' && a.phase !== 'charge' ? t * 2 : 0);
    x.strokeStyle = rgba(col, .35 + k * .4); x.lineWidth = S * .05;
    x.beginPath(); x.arc(0, 0, S * 2.3, 0, TAU); x.stroke();
    x.beginPath(); x.arc(0, 0, S * 1.9, 0, TAU); x.stroke();
    x.rotate(spin);
    for (let i = 0; i < 12; i++) {
      x.rotate(TAU / 12);
      x.fillStyle = rgba(col, .4 + k * .4);
      x.fillRect(S * 1.95, -S * .07, S * .28, S * .14);
    }
    glowCircle(x, 0, 0, S * 2.6, col, .18 + k * .3);
    x.restore();

    // god rays behind everything once the crate has burst
    if (a.phase === 'burst' || a.phase === 'reveal') {
      const rt = a.phase === 'burst' ? clamp(a.pt / 400, 0, 1) : 1;
      const sy = this.skinY(a, H, cy, S);
      x.save(); x.translate(cx, sy); x.globalCompositeOperation = 'lighter';
      const n = 10 + rar * 3, L = Math.max(W, H);
      for (let pass = 0; pass < (rar >= 4 ? 2 : 1); pass++) {
        x.save(); x.rotate(t * (pass ? -.15 : .22));
        for (let i = 0; i < n; i++) {
          x.rotate(TAU / n);
          const gr = x.createLinearGradient(0, 0, L, 0);
          const c = rayCol(i);
          gr.addColorStop(0, rgba(c.startsWith('#') ? c : '#ffffff', (.16 + rar * .03) * rt * (pass ? .6 : 1)));
          gr.addColorStop(1, 'rgba(0,0,0,0)');
          if (!c.startsWith('#')) { x.fillStyle = c; x.globalAlpha = (.14 + rar * .02) * rt; } else { x.fillStyle = gr; x.globalAlpha = 1; }
          const w = .05 + (i % 3) * .025;
          x.beginPath(); x.moveTo(0, 0); x.lineTo(L, -L * w); x.lineTo(L, L * w); x.closePath(); x.fill();
        }
        x.restore();
      }
      x.globalAlpha = 1;
      glowCircle(x, 0, 0, S * (2.2 + rar * .25), rar >= 6 ? '#fff4c0' : col, .5 * rt);
      x.restore();
    }

    // the pillar of light from the open crate
    if (a.phase === 'burst' || a.phase === 'reveal') {
      const pk = a.phase === 'burst' ? a.pt / 620 : 1;
      const pw = S * (a.phase === 'burst' ? lerp(1.9, .45, eOut(pk)) : .35 + Math.sin(t * 3) * .05);
      const pa = a.phase === 'burst' ? 1 - pk * .5 : .35;
      x.save(); x.globalCompositeOperation = 'lighter';
      const pg = x.createLinearGradient(cx - pw, 0, cx + pw, 0);
      pg.addColorStop(0, rgba(RC(rar), 0)); pg.addColorStop(.5, rgba('#ffffff', pa)); pg.addColorStop(1, rgba(RC(rar), 0));
      x.fillStyle = pg; x.fillRect(cx - pw, 0, pw * 2, cy - S * .4);
      const pg2 = x.createLinearGradient(cx - pw * 2, 0, cx + pw * 2, 0);
      pg2.addColorStop(0, rgba(RC(rar), 0)); pg2.addColorStop(.5, rgba(RC(rar), pa * .5)); pg2.addColorStop(1, rgba(RC(rar), 0));
      x.fillStyle = pg2; x.fillRect(cx - pw * 2, 0, pw * 4, cy - S * .4);
      x.restore();
    }

    // the crate
    let crateA = 1, crateS = 1;
    if (a.phase === 'burst') { crateS = 1 - eIn(clamp(a.pt / 520, 0, 1)) * .25; crateA = 1 - clamp((a.pt - 250) / 370, 0, 1); }
    if (a.phase === 'reveal') crateA = 0;
    if (a.lid) {
      a.lid.vy += S * .012 * f; a.lid.dx += a.lid.vx * f; a.lid.dy += a.lid.vy * f; a.lid.rot += a.lid.vr * f;
      a.lid.a = clamp(1 - a.pt / 700, 0, 1);
    }
    if (crateA > 0) {
      x.save();
      x.translate(cx + a.shakeX, cy + a.shakeY + (a.phase === 'idle' ? Math.sin(t * 1.6) * S * .05 : 0));
      x.globalAlpha = crateA; x.scale(crateS, crateS);
      if (a.phase === 'charge') x.rotate(a.shakeX / S * .3);
      paintCrate(x, a.crate, S, t, { leak, leakCol: col, lid: a.lid, dial: t * (.4 + k * 8) });
      x.restore();
    }

    // shockwave rings
    x.save(); x.globalCompositeOperation = 'lighter';
    for (let i = a.ring.length - 1; i >= 0; i--) {
      const r = a.ring[i];
      if (r.d > 0) { r.d -= f; continue; }
      r.r += S * .2 * f; r.a -= .025 * f;
      if (r.a <= 0) { a.ring.splice(i, 1); continue; }
      x.strokeStyle = rgba(RC(rar), r.a); x.lineWidth = S * .1 * r.a;
      x.beginPath(); x.ellipse(cx, cy - S * .4, r.r, r.r * .62, 0, 0, TAU); x.stroke();
    }
    x.restore();

    // the skin rising out of the light
    if (a.phase === 'burst' || a.phase === 'reveal') {
      const rk = a.phase === 'burst' ? clamp((a.pt - 120) / 500, 0, 1) : 1;
      if (rk > 0) {
        const sy = this.skinY(a, H, cy, S), Rs = Math.min(W, H) * .145 * eBack(rk);
        x.save(); x.translate(cx, sy + Math.sin(t * 1.8) * Rs * .06);
        x.globalCompositeOperation = 'lighter';
        glowCircle(x, 0, 0, Rs * 2.4, RC(rar), .45);
        x.globalCompositeOperation = 'source-over';
        if (skin.faceVel) x.rotate(-.35);
        if (Rs > 1) skin.draw(x, Rs, t, null);
        x.restore();
        // orbiting sparkles
        x.save(); x.globalCompositeOperation = 'lighter';
        for (let i = 0; i < 6 + rar * 2; i++) {
          const ang = t * (.8 + (i % 3) * .3) + i * 2.4, r = Rs * (1.6 + (i % 4) * .25);
          const sz = Rs * (.06 + Math.abs(Math.sin(t * 3 + i)) * .08);
          x.fillStyle = rayCol(i).startsWith('#') ? rayCol(i) : '#ffffff';
          starPath(x, cx + Math.cos(ang) * r, sy + Math.sin(ang) * r * .5, sz, sz * .3, 4, t + i); x.fill();
        }
        x.restore();
      }
    }
    // the one-of-one: shooting stars across the sky
    if (rar >= 6 && a.phase === 'reveal' && Math.random() < .12 * f) {
      const sp = rand(9, 15);
      a.parts.push({ x: rand(-W * .2, W * .8), y: rand(-20, H * .35), vx: sp * .8, vy: sp * .45, g: 0, life: 70, max: 70,
        size: S * .04, col: pick(['#ffffff', '#ffe9a0', '#bff0ff']), kind: 'shoot' });
    }

    // particles
    x.save(); x.globalCompositeOperation = 'lighter';
    for (let i = a.parts.length - 1; i >= 0; i--) {
      const p = a.parts[i];
      p.life -= f;
      if (p.life <= 0 || p.y > H + 20) { a.parts.splice(i, 1); continue; }
      const al = clamp(p.life / p.max * 1.5, 0, 1);
      if (p.kind === 'suck') {
        const q = 1 - p.life / p.max;
        const q2 = Math.max(0, q - .12);
        const px = lerp(p.x, p.tx, eIn(q)), py = lerp(p.y, p.ty, eIn(q));
        const qx = lerp(p.x, p.tx, eIn(q2)), qy = lerp(p.y, p.ty, eIn(q2));
        x.strokeStyle = rgba(p.col, .85 * Math.min(1, q * 4)); x.lineWidth = p.size; x.lineCap = 'round';
        x.beginPath(); x.moveTo(qx, qy); x.lineTo(px, py); x.stroke();
        continue;
      }
      p.vy += (p.g || 0) * f; p.x += p.vx * f; p.y += p.vy * f;
      if (p.kind === 'shoot') {
        const tx = p.x - p.vx * 7, ty = p.y - p.vy * 7, gr = x.createLinearGradient(tx, ty, p.x, p.y);
        gr.addColorStop(0, rgba(p.col, 0)); gr.addColorStop(1, rgba(p.col, al));
        x.strokeStyle = gr; x.lineWidth = p.size; x.lineCap = 'round';
        x.beginPath(); x.moveTo(tx, ty); x.lineTo(p.x, p.y); x.stroke();
        x.fillStyle = rgba(p.col, al); starPath(x, p.x, p.y, p.size * 3, p.size * .7, 4, 0); x.fill();
        continue;
      }
      if (p.kind === 'coin') {
        x.globalCompositeOperation = 'source-over';
        p.rot += .08 * f;
        x.fillStyle = p.col; x.beginPath(); x.ellipse(p.x, p.y, p.size * Math.abs(Math.cos(p.rot)) + 1, p.size, 0, 0, TAU); x.fill();
        x.globalCompositeOperation = 'lighter';
        continue;
      }
      x.fillStyle = rgba(p.col.startsWith('#') ? p.col : '#ffffff', al);
      if (p.kind === 'spark') {
        x.strokeStyle = x.fillStyle; x.lineWidth = p.size * .7; x.lineCap = 'round';
        x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(p.x - p.vx * 2.5, p.y - p.vy * 2.5); x.stroke();
      } else { x.beginPath(); x.arc(p.x, p.y, p.size, 0, TAU); x.fill(); }
    }
    x.restore();

    // flash
    if (a.flash > .01) {
      x.save(); x.globalCompositeOperation = 'lighter';
      x.fillStyle = rgba(a.flash > .5 ? '#ffffff' : col, Math.min(.85, a.flash)); x.fillRect(0, 0, W, H);
      x.restore();
      a.flash *= Math.pow(.86, f);
    }
  },
  /* the one-of-one's entrance: the crate collapses to a point, the stars come
     out, the universe rushes past, and a world rises into view */
  cine(a, x, W, H, S, cx, cy, t, f) {
    const p = a.pt, skin = a.skin, mn = Math.min(W, H);
    if (!a.stars) a.stars = Array.from({ length: 240 }, () => ({ a: rand(0, TAU), d: Math.pow(Math.random(), .7), s: rand(.6, 2), tw: rand(0, TAU) }));
    if (p < 450) {
      const k = p / 450;
      x.save(); x.translate(cx, cy); x.scale(1 - eIn(k), 1 - eIn(k));
      paintCrate(x, a.crate, S, t, { leak: 1, leakCol: '#ffffff', noShadow: true });
      x.restore();
      x.fillStyle = `rgba(0,0,0,${k})`; x.fillRect(0, 0, W, H);
      x.save(); x.globalCompositeOperation = 'lighter';
      glowCircle(x, cx, cy - S * .3, S * (.6 + k * 1.6), '#ffffff', .4 + k * .6);
      x.restore();
      return;
    }
    x.fillStyle = '#000003'; x.fillRect(0, 0, W, H);
    const hy = H * .45;
    // stars bloom in, then the universe rushes past
    const warp = clamp((p - 1100) / 900, 0, 1) * (1 - clamp((p - 2700) / 900, 0, 1));
    const starA = clamp((p - 650) / 500, 0, 1);
    if (warp > .05 && !a.whoosh) { a.whoosh = true; SFX.play('whoosh'); }
    x.save(); x.globalCompositeOperation = 'lighter';
    const D = Math.hypot(W, H) * .62;
    for (const s of a.stars) {
      s.d += (.0003 + warp * .03 * (.3 + s.d)) * f;
      if (s.d > 1.15) { s.d = rand(.01, .15); s.a = rand(0, TAU); }
      const r = s.d * D, px = cx + Math.cos(s.a) * r, py = hy + Math.sin(s.a) * r;
      const al = starA * (.45 + Math.sin(t * 3 + s.tw) * .25 + .3 * s.d);
      if (warp > .05) {
        const len = warp * r * .35;
        x.strokeStyle = rgba(s.s > 1.5 ? '#ffe9b0' : '#dfe9ff', al); x.lineWidth = s.s;
        x.beginPath(); x.moveTo(px, py); x.lineTo(px - Math.cos(s.a) * len, py - Math.sin(s.a) * len); x.stroke();
      } else {
        x.fillStyle = rgba('#ffffff', al); x.fillRect(px - s.s / 2, py - s.s / 2, s.s, s.s);
      }
    }
    if (p < 1300) glowCircle(x, cx, hy, 40 * clamp((p - 450) / 300, 0, 1) * (1 - clamp((p - 1000) / 300, 0, 1)), '#ffffff', 1);
    x.restore();
    // a world rises
    const rise = eOut(clamp((p - 2300) / 1700, 0, 1)), shrink = eIO(clamp((p - 5000) / 800, 0, 1));
    if (p > 2300) {
      if (!a.rose) { a.rose = true; SFX.play('reveal', { r: 6 }); }
      const Rp = lerp(mn * .34, mn * .145, shrink);
      const py = lerp(lerp(H * 1.55, H * .62, rise), H * .3, shrink);
      x.save(); x.globalCompositeOperation = 'lighter';
      glowCircle(x, cx - Rp * .8, py - Rp * .3, Rp * 3.2, '#3a2a9a', .4 * rise);
      glowCircle(x, cx + Rp * .6, py + Rp * .2, Rp * 2.4, '#1a6a9a', .3 * rise);
      glowCircle(x, cx, py, Rp * 1.9, '#7fd0ff', .3 * rise);
      x.restore();
      x.save(); x.translate(cx, py); skin.draw(x, Rp, t, null); x.restore();
      // sunrise flare cresting the planet's edge
      const fl = clamp((p - 3000) / 600, 0, 1) * (1 - shrink);
      if (fl > 0) {
        x.save(); x.globalCompositeOperation = 'lighter';
        const fx = cx - Rp * .55, fy = py - Rp * .78;
        glowCircle(x, fx, fy, Rp * 1.1, '#ffffff', .7 * fl);
        x.fillStyle = rgba('#fff6d0', .8 * fl);
        x.fillRect(fx - Rp * 2.4, fy - 1.5, Rp * 4.8, 3);
        starPath(x, fx, fy, Rp * .5, Rp * .04, 4, 0); x.fill();
        x.restore();
      }
    }
    // titles
    const ta = clamp((p - 3300) / 400, 0, 1) * (1 - clamp((p - 4800) / 300, 0, 1));
    if (ta > 0) {
      x.save(); x.textAlign = 'center'; x.textBaseline = 'middle';
      x.font = `800 ${Math.max(12, mn * .026)}px Outfit, sans-serif`;
      x.fillStyle = rgba('#ffd36b', ta);
      x.fillText('O  N  E     O  F     O  N  E', cx, H * .065);
      const name = skin.name, shown = Math.min(name.length, Math.floor(clamp((p - 3700) / 800, 0, 1) * name.length + .999));
      if (shown > a.letters) { a.letters = shown; SFX.play('blip', { f: 500 + shown * 120 }); }
      x.font = `${mn * .1}px Bungee, Outfit, sans-serif`;
      const full = x.measureText(name).width;
      let lx = cx - full / 2;
      x.textAlign = 'left';
      x.shadowColor = '#7fd0ff'; x.shadowBlur = 34;
      for (let i = 0; i < shown; i++) {
        const ch = name[i], w = x.measureText(ch).width;
        const pop = clamp((p - 3700 - i * 800 / name.length) / 160, 0, 1);
        x.fillStyle = rgba('#ffffff', ta * pop);
        x.fillText(ch, lx, H * .15 - (1 - eBack(pop)) * 20);
        lx += w;
      }
      x.restore();
    }
    // hand over to the normal reveal
    if (p >= CINE_END) {
      a.phase = 'reveal'; a.pt = 0; a.revealed = true; a.flash = 1;
      a.ring.push({ r: 0, a: 1 }, { r: 0, a: 1, d: 8 });
      SFX.play('boom');
      G.flash('#ffffff', .4); G.shake(20);
      a.onReveal();
    }
  },
  skinY(a, H, cy, S) {
    const rk = a.phase === 'burst' ? eOut(clamp((a.pt - 120) / 500, 0, 1)) : 1;
    return lerp(cy - S * .4, H * .3, rk);
  }
};

'use strict';
/* =========================================================
   ALLOY ACCOUNTS — optional cloud sync.
   The site shell provides window.AlloyAccount to this iframe. With no
   account, or when this file is opened on its own, AA is null and the game
   runs entirely on its local save (madballs.save.v1), exactly as before.
   The server re-checks every number we send (alloy/validator.js), so
   nothing here needs to be trusted.
   ========================================================= */
const ALLOY_ID = 'madballs';
const AA = (() => {
  try { return window.parent !== window ? window.parent.AlloyAccount || null : null; }
  catch (_) { return null; }
})();

const Alloy = {
  signedIn: false,
  loaded: false,      // first AA.load has finished - nothing is written before this
  failed: false,
  rev: 0,             // payload counter, echoed back by the server
  sent: new Map(),    // rev -> payload, for saves not yet answered
  events: [],
  pullId: 0,          // bumps on every sign-in change, so stale replies are ignored

  /* The synced part of the save. `muted` stays a per-device preference. */
  pack() {
    const s = G.save;
    return {
      rev: ++this.rev,
      coins: Math.max(0, Math.floor(s.coins || 0)),
      inv: Object.assign({}, s.inv),
      equipped: s.equipped,
      pity: s.pity || 0, mythicPity: s.mythicPity || 0, transPity: s.transPity || 0,
      opened: s.opened || 0,
      unlocked: s.unlocked || 1,
      best: Object.assign({}, s.best),
      firstCrate: !!s.firstCrate
    };
  },

  /* On start and on every sign-in change: take the cloud save if there is
     one, otherwise upload this device's save. */
  async pull() {
    if (!AA) return;
    const id = ++this.pullId;
    const user = AA.user();
    this.signedIn = !!user;
    this.loaded = false; this.failed = false;
    this.sent.clear(); this.events = [];
    this.paintAll();
    if (!user) return;
    let r = null;
    try { r = await AA.load(ALLOY_ID); } catch (_) { r = null; }
    if (id !== this.pullId) return;                          // signed out or switched meanwhile
    if (!r) { this.failed = true; this.paintAll(); return; } // unreachable: stay local, never write
    this.loaded = true;
    if (r.data) this.adopt(r.data);
    else await this.push(true);                              // empty account: upload this save
    try {
      const ev = await AA.events(ALLOY_ID);
      if (id === this.pullId) this.events = (ev || []).filter(e => e && e.live);
    } catch (_) { }
    this.paintAll();
  },

  /* Checkpoint save. Called from G.store(), which the game only calls at
     checkpoints: a level ending, a crate, the free crate, an equip. */
  push(now = true) {
    if (!AA || !this.loaded || !AA.user()) return Promise.resolve();
    const p = this.pack();
    this.sent.set(p.rev, p);
    const id = this.pullId;
    return AA.save(ALLOY_ID, p, { now }).then(
      res => { if (id === this.pullId) this.reply(res); },
      () => { if (id === this.pullId) { this.failed = true; this.paintAll(); } });
  },

  /* Coalesced saves all resolve with the reply to the newest payload, so a
     reply is matched to its payload by `rev`, handled once, and every older
     payload it supersedes is forgotten. */
  reply(res) {
    if (!res || !res.ok || !res.data) { this.failed = true; this.paintAll(); return; }
    this.failed = false;
    const d = res.data, base = this.sent.get(d.rev);
    for (const k of [...this.sent.keys()]) if (k <= d.rev) this.sent.delete(k);
    if (base) this.correct(base, d);
    this.paintAll();
  },

  /* The server's reply is what exists - but the player may have played on
     while it was in flight. So a value the server lowered is taken off the
     LIVE value as a difference (and off any payload still in flight, so the
     same cut is never applied twice), instead of overwriting new progress. */
  correct(base, d) {
    const s = G.save, pending = [...this.sent.values()];
    let changed = false;
    const get = (o, path) => {
      let a = o;
      for (const k of path) a = a == null ? undefined : a[k];
      return Number(a) || 0;
    };
    const put = (o, path, v, dropZero) => {
      let a = o;
      for (let i = 0; i < path.length - 1; i++) a = a[path[i]] = a[path[i]] || {};
      const k = path[path.length - 1];
      if (dropZero && v <= 0) delete a[k]; else a[k] = v;
    };
    const lower = (path, min, dropZero) => {
      const cut = get(base, path) - get(d, path);
      if (!(cut > 0)) return;
      put(s, path, Math.max(min, get(s, path) - cut), dropZero);
      for (const q of pending) put(q, path, Math.max(min, get(q, path) - cut), dropZero);
      changed = true;
    };
    // things that only grow: the server may hold more (another device) - take it
    const raise = (path, dropZero) => {
      const v = get(d, path);
      if (v > get(s, path)) { put(s, path, v, dropZero); changed = true; }
    };

    for (const k of ['coins', 'pity', 'mythicPity', 'transPity']) lower([k], 0, false);
    lower(['opened'], 0, false); raise(['opened'], false);
    lower(['unlocked'], 1, false); raise(['unlocked'], false);
    const keys = (a, b) => [...new Set([...Object.keys(a || {}), ...Object.keys(b || {})])];
    for (const id of keys(base.inv, d.inv)) { lower(['inv', id], 0, true); raise(['inv', id], true); }
    for (const k of keys(base.best, d.best)) { lower(['best', k], 0, true); raise(['best', k], true); }
    if (d.firstCrate && !s.firstCrate) { s.firstCrate = true; changed = true; }
    if (d.equipped !== base.equipped && s.equipped === base.equipped) { s.equipped = d.equipped; changed = true; }

    if (changed) this.commit();
  },

  /* Replace the synced fields with the account's save (on load). */
  adopt(d) {
    const s = G.save;
    s.coins = d.coins; s.inv = Object.assign({}, d.inv); s.equipped = d.equipped;
    s.pity = d.pity; s.mythicPity = d.mythicPity; s.transPity = d.transPity;
    s.opened = d.opened; s.unlocked = d.unlocked;
    s.best = Object.assign({}, d.best); s.firstCrate = !!d.firstCrate;
    this.rev = Math.max(this.rev, d.rev | 0);
    this.commit();
  },

  /* Write the corrected save locally (not back to the cloud) and redraw. */
  commit() {
    const s = G.save;
    if (!s.inv || !Object.keys(s.inv).length) s.inv = { pebble: 1 };
    if (!s.inv[s.equipped]) s.equipped = s.inv.pebble ? 'pebble' : Object.keys(s.inv)[0];
    G.skin = SKIN_BY_ID[s.equipped] || DEFAULT_SKIN;
    writeSave(s);
    UI.syncHud();
    if (G.state !== 'menu' && UI.refreshSkinBadge) UI.refreshSkinBadge();
    const cur = UI.cur;
    if (cur === 'menu') UI.showMenu();
    else if (cur === 'shop') UI.showShop();
    else if (cur === 'collection') UI.showCollection();
    else if (cur === 'levels') UI.showLevels();
  },

  /* Event counters. Only metrics alloy/validator.js declares. */
  progress(metric, n) {
    if (!AA || !this.signedIn || !(n > 0)) return;
    for (const e of this.events) if (e.metric === metric && e.type !== 'leaderboard') AA.progress(e.id, n);
  },

  /* ---------- the small sync line ---------- */
  line() {
    if (!this.signedIn) return ['Sign in, top right, to keep your progress', false];
    if (this.failed) return ['Can’t reach your Alloy account — saved on this device', false];
    if (!this.loaded) return ['Connecting to your Alloy account…', false];
    return ['Saved to your Alloy account', true];
  },
  paint(anchor) {
    if (!AA || !anchor || !anchor.parentNode) return;
    let el = anchor.parentNode.querySelector(':scope > .alloy-sync');
    if (!el) {
      el = document.createElement('div');
      el.className = 'alloy-sync';
      anchor.insertAdjacentElement('afterend', el);
    }
    const [text, ok] = this.line();
    el.textContent = text;
    el.classList.toggle('ok', ok);
  },
  paintAll() {
    if (!AA) return;
    const [text, ok] = this.line();
    document.querySelectorAll('.alloy-sync').forEach(el => { el.textContent = text; el.classList.toggle('ok', ok); });
  }
};

/* Hook the game at the points that matter, without touching its files. */
(function () {
  const store = G.store;
  G.store = function () { store.call(this); Alloy.push(true); };

  const destroy = G.destroyBody;
  G.destroyBody = function (body) {
    const popped = !!(body && body.game && body.game.enemy && !body.game.dead);
    destroy.call(this, body);
    if (popped) Alloy.progress('madballsPopped', 1);
  };

  const cleared = G.onCleared;
  G.onCleared = function () {
    const first = this.state !== 'done';
    cleared.call(this);
    if (first) Alloy.progress('levelsCleared', 1);
  };

  const openCrate = UI.openCrate;
  UI.openCrate = function (crate) { openCrate.call(this, crate); Alloy.progress('cratesOpened', 1); };

  const showMenu = UI.showMenu;
  UI.showMenu = function () { showMenu.call(this); Alloy.paint(document.querySelector('#menu .tip')); };
  const showShop = UI.showShop;
  UI.showShop = function () { showShop.call(this); Alloy.paint(document.querySelector('#shop .pity')); };
  const showEnd = UI.showEnd;
  UI.showEnd = function (win, data) { showEnd.call(this, win, data); Alloy.paint(document.querySelector('.end-card .end-rows')); };

  if (AA) { AA.ready.then(() => Alloy.pull(), () => { }); AA.onChange(() => Alloy.pull()); }
})();

'use strict';
(function boot() {
  const start = () => {
    const cv = document.getElementById('cv');
    if (!window.Matter) {
      document.body.insertAdjacentHTML('beforeend',
        `<div style="position:fixed;inset:0;display:grid;place-items:center;background:#07080f;color:#eef2ff;
          font-family:system-ui;text-align:center;padding:30px;z-index:999">
          <div><h2 style="margin-bottom:10px">Physics engine failed to load</h2>
          <p style="opacity:.7;font-size:13px">MADBALLS needs matter.js from cdnjs. Check your connection and reload.</p></div>
        </div>`);
      return;
    }
    G.init(cv);
    UI.init();
    // The admin panel grants coins and skins, so it never runs on the live site:
    // only on localhost or a local file, where AA is null and nothing syncs.
    const local = location.hostname === 'localhost' || location.hostname === '127.0.0.1' ||
      location.protocol === 'file:';
    if (typeof ADMIN !== 'undefined' && local) ADMIN.init();   // absent in the public build
    // first interaction unlocks audio
    const unlock = () => { SFX.init(); SFX.resume(); window.removeEventListener('pointerdown', unlock); };
    window.addEventListener('pointerdown', unlock);
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
