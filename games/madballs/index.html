<script>
/* Alloy Studios home check - keep this the FIRST script in <head>. */
(function () {
  var GAME = "madballs";                                     // this game's id on the site
  var h = location.hostname;
  var home = h === "alloy-studios.github.io" || h === "localhost" || h === "127.0.0.1" || location.protocol === "file:";
  var stranger = false;
  try { stranger = window.top !== window.self && window.top.location.hostname !== h; }
  catch (e) { stranger = true; }                             // can't read the parent: someone else's page
  if (home && !stranger) return;
  var url = "https://alloy-studios.github.io/" + GAME + "/";
  document.documentElement.innerHTML =
    '<head><meta charset="utf-8"><title>Alloy Studios</title></head>' +
    '<body style="margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;' +
    'background:#0b0d14;color:#eef1f7;font:16px/1.5 system-ui,sans-serif;text-align:center">' +
    '<div><p style="margin:0 0 10px;font-size:22px;font-weight:700">This game is by Alloy Studios</p>' +
    '<p style="margin:0 0 24px;color:#9aa3b8">You\u2019re playing an unofficial copy. The real one is free.</p>' +
    '<a href="' + url + '" target="_top" rel="noopener" style="display:inline-block;padding:11px 22px;' +
    'border-radius:999px;background:#7c5cff;color:#fff;text-decoration:none;font-weight:600">' +
    'Play it at alloy-studios.github.io</a></div></body>';
  if (window.stop) window.stop();                            // stop the rest of the page loading
  throw new Error("Alloy Studios: not on the home site");
})();
</script>
<title>MADBALLS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@300;400;600;800;900&family=Press+Start+2P&display=swap');

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#07080f;
  --ink:#eef2ff;
  --dim:#9aa6c4;
  --panel:rgba(16,19,34,.82);
  --line:rgba(150,180,255,.14);
  --gold:#ffc23d;
  --c-common:#98a2b3; --c-uncommon:#52e07a; --c-rare:#3fa9ff;
  --c-epic:#b56cff;   --c-legendary:#ffc23d; --c-mythic:#ff3fa0;
  --c-transcendent:#ffffff;
  --ui:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --disp:'Bungee',var(--ui);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--ui);
  overscroll-behavior:none;touch-action:none}
#app{position:fixed;inset:0;overflow:hidden}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ---------------- HUD ---------------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:5}
#hud .hud-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
  align-items:flex-start;gap:10px;padding:14px 16px}
#hud .hud-left,#hud .hud-right{display:flex;align-items:center;gap:8px;pointer-events:auto}
#hud .hud-mid{flex:1;display:flex;justify-content:center;pointer-events:none}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(10px);font-size:15px;line-height:1;display:grid;place-items:center;
  transition:.18s;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.icon-btn:hover{background:rgba(40,52,92,.9);transform:translateY(-1px)}
.icon-btn.off{opacity:.4}
.lvl-chip{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:7px 14px 7px 8px;backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(0,0,0,.45)}
.lvl-no{font-family:var(--disp);font-size:15px;color:#0a0c16;background:linear-gradient(180deg,#ffd979,var(--gold));
  border-radius:8px;padding:3px 9px;box-shadow:0 0 16px rgba(255,194,61,.45)}
.lvl-name{font-weight:800;letter-spacing:.14em;font-size:11.5px;text-transform:uppercase;color:#cfd9f5}
.ammo{display:flex;gap:6px;padding:8px 12px;background:var(--panel);border:1px solid var(--line);
  border-radius:999px;backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(0,0,0,.45)}
.ammo i{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff,#8fa3c8 45%,#39415e);
  box-shadow:0 0 10px rgba(120,180,255,.5);transition:.3s}
.ammo i.spent{background:#20263a;box-shadow:none;opacity:.45;transform:scale(.7)}
.stat{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:8px 13px;font-weight:800;font-size:14px;backdrop-filter:blur(10px);
  box-shadow:0 6px 20px rgba(0,0,0,.45);font-variant-numeric:tabular-nums}
.stat.coins{color:var(--gold)}.stat .ic{font-size:11px}
.stat .lbl{font-size:9px;opacity:.5;letter-spacing:.12em;font-weight:800}
#hud .hud-bottom{position:absolute;left:16px;bottom:16px;pointer-events:none}
.skin-badge{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:8px 14px 8px 8px;backdrop-filter:blur(12px);box-shadow:0 10px 34px rgba(0,0,0,.5);
  position:relative;overflow:hidden}
.sb-orb{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.14),transparent 70%);position:relative}
.sb-orb canvas{width:46px;height:46px}
.sb-name{font-family:var(--disp);font-size:14px;letter-spacing:.02em;color:var(--rc,#fff);
  text-shadow:0 0 18px var(--rc,#fff)}
.sb-abil{font-size:10.5px;letter-spacing:.1em;font-weight:700;color:#9fb0d8;text-transform:uppercase;margin-top:2px}
.sb-key{font-size:9.5px;font-weight:900;letter-spacing:.12em;border:1px solid var(--line);border-radius:8px;
  padding:6px 8px;color:#cfe0ff;background:rgba(255,255,255,.05)}
.sb-key.ready{animation:keypulse 1.05s ease-in-out infinite;border-color:var(--rc,#fff);color:var(--rc,#fff)}
.sb-key.used{opacity:.28}
@keyframes keypulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 22px 2px var(--rc,#fff)}}

.center-toast{position:absolute;left:50%;top:31%;transform:translate(-50%,-50%);text-align:center;
  font-family:var(--disp);font-size:min(9vw,64px);letter-spacing:.02em;pointer-events:none;opacity:0}
.center-toast.show{animation:ctoast 1.5s cubic-bezier(.16,1,.3,1) forwards}
@keyframes ctoast{0%{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(-6deg);filter:blur(14px)}
 18%{opacity:1;transform:translate(-50%,-50%) scale(1.06) rotate(0)}
 70%{opacity:1;transform:translate(-50%,-52%) scale(1)}
 100%{opacity:0;transform:translate(-50%,-62%) scale(1.02);filter:blur(4px)}}

/* ---------------- Screens ---------------- */
#screens{position:absolute;inset:0;z-index:20;pointer-events:none}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:auto;
  background:radial-gradient(120% 90% at 50% 0%,rgba(28,20,60,.72),rgba(5,6,13,.93) 70%);
  backdrop-filter:blur(18px) saturate(.9);animation:scrIn .34s cubic-bezier(.16,1,.3,1)}
@keyframes scrIn{from{opacity:0;transform:scale(1.02)}to{opacity:1;transform:none}}
.scr.out{animation:scrOut .22s ease forwards;pointer-events:none}
@keyframes scrOut{to{opacity:0;transform:scale(.99)}}

.scr-head{display:flex;align-items:center;justify-content:space-between;padding:20px 26px;flex:0 0 auto;gap:12px}
.scr-title{font-family:var(--disp);font-size:clamp(20px,3.4vw,34px);letter-spacing:.02em}
.scr-title small{display:block;font-family:var(--ui);font-size:11px;letter-spacing:.22em;
  font-weight:700;color:var(--dim);margin-top:5px}
.scr-body{flex:1;overflow:auto;padding:0 26px 26px;scrollbar-width:thin}
.scr-body::-webkit-scrollbar{width:8px}
.scr-body::-webkit-scrollbar-thumb{background:rgba(140,160,220,.22);border-radius:9px}

.btn{font-family:var(--disp);letter-spacing:.03em;border-radius:14px;padding:14px 26px;font-size:16px;
  background:linear-gradient(180deg,#2b3455,#171d33);border:1px solid rgba(160,190,255,.18);
  box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.14);transition:.16s;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.2)}
.btn:active{transform:translateY(0) scale(.985)}
.btn.primary{background:linear-gradient(180deg,#ffd979,#f0a013);color:#231403;border-color:#ffe6a8;
  box-shadow:0 12px 34px rgba(240,160,19,.4),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.ghost{background:rgba(255,255,255,.05)}
.btn.small{padding:10px 18px;font-size:13px;border-radius:11px}
.btn[disabled]{opacity:.4;pointer-events:none;filter:grayscale(1)}
.btn .sub{display:block;font-family:var(--ui);font-size:10.5px;letter-spacing:.16em;font-weight:800;opacity:.72;margin-top:3px}

/* ---- Main menu ---- */
#menu .wrap{flex:1;display:grid;place-items:center;padding:20px}
.logo{text-align:center;position:relative;display:flex;flex-direction:column;align-items:center;max-width:100%}
.logo h1{font-family:var(--disp);font-size:clamp(46px,12vw,132px);line-height:.9;letter-spacing:.01em;
  background:linear-gradient(180deg,#fff 5%,#ffd979 45%,#ff8a3d 72%,#ff3fa0 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 8px 30px rgba(255,120,40,.45));animation:logoFloat 5s ease-in-out infinite}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(1deg)}}
.logo .tag{margin-top:8px;font-size:clamp(10px,1.6vw,13px);letter-spacing:.42em;font-weight:800;
  color:#9fb0d8;text-transform:uppercase;text-indent:.42em}
.menu-btns{margin:34px auto 0;display:flex;flex-direction:column;gap:12px;width:min(330px,80vw)}
.wallet{position:absolute;top:18px;right:22px;display:flex;gap:9px;align-items:center;z-index:3}
.wallet .stat{font-size:15px}

/* ---- Shop ---- */
.crates{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:18px;max-width:1120px;margin:0 auto}
.crate-card{position:relative;border-radius:20px;padding:20px;border:1px solid var(--line);overflow:hidden;
  background:linear-gradient(180deg,rgba(30,36,62,.85),rgba(11,13,24,.9));
  box-shadow:0 18px 50px rgba(0,0,0,.5);transition:.2s;display:flex;flex-direction:column;gap:12px}
.crate-card:hover{transform:translateY(-4px)}
.crate-art{height:132px;display:grid;place-items:center;position:relative}
.crate-art canvas{width:150px;height:132px;filter:drop-shadow(0 12px 22px rgba(0,0,0,.6))}
.crate-name{font-family:var(--disp);font-size:20px;color:var(--cc,#fff);text-align:center}
.crate-desc{font-size:11.5px;color:var(--dim);text-align:center;line-height:1.5;min-height:34px}
.odds{display:flex;flex-direction:column;gap:5px;font-size:10.5px;font-weight:700}
.odds .row{display:flex;align-items:center;gap:8px}
.odds .bar{flex:1;height:6px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}
.odds .bar i{display:block;height:100%;border-radius:9px;box-shadow:0 0 12px currentColor;background:currentColor}
.odds .pc{width:46px;text-align:right;font-variant-numeric:tabular-nums;opacity:.85}
.odds .nm{width:74px;letter-spacing:.1em;text-transform:uppercase;font-size:9.5px}
.pity{font-size:10px;letter-spacing:.1em;color:#8fa0c8;text-align:center;text-transform:uppercase;font-weight:800}
.pity b{color:var(--c-legendary)}

/* ---- Collection ---- */
.coll-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(154px,1fr));gap:14px;max-width:1180px;margin:0 auto}
.sk-card{position:relative;border-radius:17px;padding:13px 11px 20px;text-align:center;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(28,33,58,.8),rgba(10,12,22,.9));cursor:pointer;transition:.18s;overflow:hidden}
.sk-card:hover{transform:translateY(-3px)}
.sk-card.owned{box-shadow:0 14px 34px rgba(0,0,0,.5)}
.sk-card.locked{filter:grayscale(1) brightness(.45);cursor:default}
.sk-card canvas{width:76px;height:76px;position:relative}
.sk-nm{font-family:var(--disp);font-size:12.5px;margin-top:6px;color:var(--rc)}
.sk-ab{font-size:9.5px;letter-spacing:.08em;color:#93a2c6;text-transform:uppercase;font-weight:800;margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk-rar{position:absolute;top:8px;left:8px;font-size:8px;font-weight:900;letter-spacing:.14em;
  padding:3px 6px;border-radius:6px;color:var(--rc);text-transform:uppercase;background:rgba(255,255,255,.07)}
.sk-dupe{position:absolute;top:8px;right:8px;font-size:9px;font-weight:900;color:#0a0c16;background:var(--rc);
  border-radius:6px;padding:2px 6px}
.sk-eq{position:absolute;bottom:0;left:0;right:0;font-size:8.5px;letter-spacing:.16em;font-weight:900;
  background:var(--rc);color:#0a0c16;padding:3px}
.coll-stats{display:flex;gap:14px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
.cs{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:9px 16px;text-align:center}
.cs b{display:block;font-family:var(--disp);font-size:19px;color:var(--rc,#fff)}
.cs span{font-size:9px;letter-spacing:.16em;color:var(--dim);font-weight:800}

/* ---- Level end ---- */
.end-card{margin:auto;width:min(500px,92vw);border-radius:26px;padding:30px;text-align:center;
  background:linear-gradient(180deg,rgba(32,38,66,.9),rgba(10,12,22,.94));border:1px solid var(--line);
  box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .42s cubic-bezier(.16,1.4,.3,1)}
@keyframes pop{from{transform:scale(.86) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.end-title{font-family:var(--disp);font-size:clamp(30px,6vw,52px);
  background:linear-gradient(180deg,#fff,#ffd979 60%,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent}
.end-title.fail{background:linear-gradient(180deg,#fff,#ff6a8a 60%,#a3184a);-webkit-background-clip:text;background-clip:text}
.stars{display:flex;justify-content:center;gap:12px;margin:16px 0 6px}
.star{width:54px;height:54px;opacity:.16;transform:scale(.7)}
.star.on{animation:starPop .5s cubic-bezier(.16,1.6,.4,1) forwards}
@keyframes starPop{0%{opacity:0;transform:scale(2.2) rotate(-40deg)}60%{opacity:1;transform:scale(.92) rotate(6deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.end-rows{margin:18px 0;display:flex;flex-direction:column;gap:8px}
.end-row{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:#b9c6e8;
  padding:9px 14px;background:rgba(255,255,255,.04);border-radius:11px}
.end-row b{color:var(--gold);font-variant-numeric:tabular-nums}
.end-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}

/* ---------------- Crate opening ---------------- */
#crateStage{position:absolute;inset:0;z-index:60;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 50% 50%,rgba(10,6,26,.88),rgba(2,3,8,.97));backdrop-filter:blur(14px)}
#crateStage .beam{position:absolute;left:50%;top:50%;width:200vmax;height:200vmax;transform:translate(-50%,-50%);
  background:conic-gradient(from 0deg,transparent 0 6deg,var(--rc,#fff) 6deg 8deg,transparent 8deg 18deg);
  animation:spin 14s linear infinite;opacity:0;transition:opacity .7s;pointer-events:none;
  mask:radial-gradient(circle,#000 10%,transparent 60%);-webkit-mask:radial-gradient(circle,#000 10%,transparent 60%)}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
#crateStage .glowball{position:absolute;left:50%;top:50%;width:64vmin;height:64vmin;transform:translate(-50%,-50%) scale(.2);
  border-radius:50%;background:radial-gradient(circle,var(--rc,#fff),transparent 62%);opacity:0;transition:.5s;
  pointer-events:none;filter:blur(26px)}
.crate-box{position:relative;width:min(310px,60vmin);height:min(310px,60vmin);display:grid;place-items:center;z-index:2}
.crate-box canvas{width:100%;height:100%;filter:drop-shadow(0 24px 50px rgba(0,0,0,.8))}
.crate-box.shaking{animation:cshake .42s linear infinite}
@keyframes cshake{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-5px,3px) rotate(-2.4deg)}
 50%{transform:translate(6px,-4px) rotate(2.6deg)}75%{transform:translate(-4px,-2px) rotate(-1.6deg)}}
.crate-hint{position:absolute;bottom:10%;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.3em;
  font-weight:800;color:#93a2c6;text-transform:uppercase;animation:blink 1.5s infinite;z-index:3}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
.reveal{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:2px;
  animation:revealIn .7s cubic-bezier(.16,1.5,.35,1);padding:20px}
@keyframes revealIn{0%{transform:scale(.4) translateY(60px);opacity:0;filter:blur(20px)}
 60%{transform:scale(1.06);opacity:1;filter:blur(0)}100%{transform:scale(1)}}
.reveal .rar-tag{font-family:var(--disp);font-size:clamp(13px,2vw,19px);letter-spacing:.34em;color:var(--rc);
  text-shadow:0 0 34px var(--rc);margin-bottom:2px}
.reveal .orb{width:min(250px,46vmin);height:min(250px,46vmin);display:grid;place-items:center;position:relative}
.reveal .orb canvas{width:100%;height:100%;filter:drop-shadow(0 0 44px var(--rc))}
.reveal .nm{font-family:var(--disp);font-size:clamp(26px,5.4vw,54px);color:#fff;
  text-shadow:0 0 40px var(--rc),0 4px 0 rgba(0,0,0,.4);line-height:1.1}
.reveal .ab{font-size:12.5px;letter-spacing:.2em;font-weight:800;color:var(--rc);text-transform:uppercase;margin-top:4px}
.reveal .desc{font-size:12.5px;color:#adbbdc;max-width:440px;text-align:center;line-height:1.6;margin-top:9px}
.reveal .dupe{margin-top:10px;font-size:11.5px;letter-spacing:.14em;font-weight:800;color:var(--gold);text-transform:uppercase}
.reveal .cont{margin-top:18px;display:flex;gap:10px}
.mythic-txt{background:linear-gradient(90deg,#ff3fa0,#ffc23d,#52e07a,#3fa9ff,#b56cff,#ff3fa0);
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:hue 2.4s linear infinite}
@keyframes hue{to{background-position:300% 0}}

#toasts{position:absolute;top:74px;left:50%;transform:translateX(-50%);z-index:80;display:flex;
  flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 18px;
  font-size:12.5px;font-weight:800;letter-spacing:.06em;backdrop-filter:blur(12px);
  box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tIn .3s cubic-bezier(.16,1.4,.3,1);white-space:nowrap}
.toast b{color:var(--rc,var(--gold))}
@keyframes tIn{from{opacity:0;transform:translateY(-14px) scale(.9)}to{opacity:1;transform:none}}
.toast.out{animation:tOut .3s ease forwards}
@keyframes tOut{to{opacity:0;transform:translateY(-10px) scale(.96)}}


.tip{font-size:11px;max-width:560px;margin-left:auto;margin-right:auto;color:#7d8cb0;letter-spacing:.06em;text-align:center;margin-top:16px;line-height:1.8}
kbd{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:5px;padding:2px 6px;
  font-family:var(--ui);font-weight:800;font-size:10px}
@media (max-width:620px){
  #hud .hud-top{padding:10px}.stat{padding:6px 10px;font-size:12px}
  .sb-abil{display:none}.skin-badge{padding:6px 10px 6px 6px}
  .scr-head{padding:14px}.scr-body{padding:0 14px 18px}
  .logo h1{font-size:clamp(40px,15vw,90px)}
}


/* the one-of-one tier */
.sk-card.tier6{border-color:rgba(255,255,255,.55);
  box-shadow:0 0 0 1px rgba(255,255,255,.3),0 16px 44px rgba(0,0,0,.6),0 0 40px rgba(255,255,255,.18)}
.sk-card.tier6:before{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.16) 48%,transparent 62%);
  background-size:250% 100%;animation:holo 3.2s linear infinite}
@keyframes holo{to{background-position:-250% 0}}

/* Alloy account sync status (only rendered inside the Alloy site) */
.alloy-sync{margin-top:12px;font-size:10.5px;letter-spacing:.14em;font-weight:800;text-transform:uppercase;
  color:#7d8cb0;text-align:center}
.alloy-sync.ok{color:#52e07a}

/* ---------------- polish pass (same style, more life) ---------------- */
.scr{background:radial-gradient(120% 90% at 50% 0%,rgba(28,20,60,.58),rgba(5,6,13,.84) 70%);
  backdrop-filter:blur(7px) saturate(1.05)}
.scr-head{padding-right:160px}
/* title sheen */

<script>

/* ============================ src/10-util.js ============================ */
'use strict';
/* ---------- math / helpers ---------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const invl = (a, b, v) => (v - a) / (b - a);
const rand = (a = 1, b = 0) => b + Math.random() * (a - b);
const rint = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = arr => arr[(Math.random() * arr.length) | 0];
const chance = p => Math.random() < p;
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const sgn = v => v < 0 ? -1 : 1;
const eOut = t => 1 - Math.pow(1 - t, 3);
const eOut5 = t => 1 - Math.pow(1 - t, 5);
const eIn = t => t * t * t;
const eIO = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const eBack = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const eElastic = t => t === 0 ? 0 : t === 1 ? 1 :
  Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (TAU / 3)) + 1;
const fmt = n => Math.round(n).toLocaleString('en-US');

/* deterministic per-object noise */
function hash(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }
function hash2(a, b) { return hash(a * 311.7 + b * 74.7); }

/* ---------- color ---------- */
function hex2rgb(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgba(h, a) { const c = hex2rgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function shade(h, amt) {
  const c = hex2rgb(h);
  const f = amt < 0 ? 0 : 255, p = Math.abs(amt);
  return `rgb(${Math.round(lerp(c[0], f, p))},${Math.round(lerp(c[1], f, p))},${Math.round(lerp(c[2], f, p))})`;
}
function mixHex(a, b, t) {
  const A = hex2rgb(a), B = hex2rgb(b);
  return `rgb(${Math.round(lerp(A[0], B[0], t))},${Math.round(lerp(A[1], B[1], t))},${Math.round(lerp(A[2], B[2], t))})`;
}
const hsl = (h, s, l, a = 1) => `hsla(${h},${s}%,${l}%,${a})`;

/* ---------- canvas helpers ---------- */
function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function starPath(ctx, x, y, r1, r2, pts, rot = 0) {
  ctx.beginPath();
  for (let i = 0; i < pts * 2; i++) {
    const a = rot + i * Math.PI / pts, r = i % 2 ? r2 : r1;
    ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath();
}
function polyPath(ctx, pts) {
  ctx.beginPath();
  pts.forEach((p, i) => ctx[i ? 'lineTo' : 'moveTo'](p.x, p.y));
  ctx.closePath();
}
function glowCircle(ctx, x, y, r, col, a = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(col, a));
  g.addColorStop(.45, rgba(col, a * .35));
  g.addColorStop(1, rgba(col, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}

/* ---------- storage ---------- */
const SKEY = 'madballs.save.v1';
function loadSave() {
  try {
    const raw = localStorage.getItem(SKEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { }
  return null;
}
function writeSave(o) {
  try { localStorage.setItem(SKEY, JSON.stringify(o)); } catch (e) { }
}

/* ============================ src/20-fx.js ============================ */
'use strict';
/* =========================================================
   PARTICLE SYSTEM
   dt is measured in frames (1.0 == 1/60 s) so that particle
   velocities share units with the Matter.js bodies.
   ========================================================= */
const FX = {
  list: [],
  cap: 1600,

  add(o) {
    if (this.list.length > this.cap) this.list.splice(0, 120);
    const p = {
      x: 0, y: 0, vx: 0, vy: 0, g: 0, drag: .985, life: 30, max: 30,
      size: 4, col: '#ffffff', col2: null, type: 'dot', rot: 0, spin: 0,
      add: false, grow: 1, fade: 1, txt: '', layer: 1, wob: 0, seed: Math.random() * 999,
      ...o
    };
    p.max = p.life;
    this.list.push(p);
    return p;
  },

  update(dt) {
    const L = this.list;
    for (let i = L.length - 1; i >= 0; i--) {
      const p = L[i];
      p.life -= dt;
      if (p.life <= 0) { L.splice(i, 1); continue; }
      p.vy += p.g * dt;
      const d = Math.pow(p.drag, dt);
      p.vx *= d; p.vy *= d;
      if (p.wob) p.vx += Math.sin((p.max - p.life) * .18 + p.seed) * p.wob * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.spin * dt;
      if (p.type === 'smoke') p.size += p.grow * dt;
      if (p.type === 'ring') p.size += p.grow * dt;
    }
  },

  clear() { this.list.length = 0; },

  draw(ctx, layer) {
    const L = this.list;
    for (let i = 0; i < L.length; i++) {
      const p = L[i];
      if (p.layer !== layer) continue;
      const t = p.life / p.max;
      const a = clamp(Math.pow(t, p.fade), 0, 1);
      if (a <= .003) continue;
      ctx.save();
      ctx.globalCompositeOperation = p.add ? 'lighter' : 'source-over';
      switch (p.type) {
        case 'dot':
          ctx.globalAlpha = a;
          ctx.fillStyle = p.col;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (p.grow === 1 ? 1 : lerp(p.grow, 1, t)), 0, TAU); ctx.fill();
          break;
        case 'planet': {   // a tiny world with a ring, shrinking away (ATLAS)
          const r = p.size * (.35 + t * .65);
          ctx.globalAlpha = Math.min(1, a * 1.5);
          ctx.translate(p.x, p.y); ctx.rotate(p.rot);
          const back = () => { ctx.beginPath(); ctx.ellipse(0, 0, r * 1.9, r * .5, 0, Math.PI, TAU); ctx.stroke(); };
          const front = () => { ctx.beginPath(); ctx.ellipse(0, 0, r * 1.9, r * .5, 0, 0, Math.PI); ctx.stroke(); };
          ctx.strokeStyle = p.col2 || '#ffd36b'; ctx.lineWidth = Math.max(.8, r * .22);
          if (p.col2) back();
          const g = ctx.createRadialGradient(-r * .35, -r * .4, r * .1, 0, 0, r);
          g.addColorStop(0, '#ffffff'); g.addColorStop(.35, p.col); g.addColorStop(1, rgba(p.col, .55));
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
          if (p.col2) front();
          break;
        }
        case 'flare': {
          const r = p.size * (0.4 + t * .8);
          const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
          g.addColorStop(0, rgba(p.col, a));
          g.addColorStop(.4, rgba(p.col, a * .3));
          g.addColorStop(1, rgba(p.col, 0));
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.fill();
          break;
        }
        case 'spark': {
          ctx.globalAlpha = a;
          ctx.strokeStyle = p.col;
          ctx.lineWidth = p.size;
          ctx.lineCap = 'round';
          const sp = Math.hypot(p.vx, p.vy);
          const len = clamp(sp * 1.7, 2, 34);
          const ang = Math.atan2(p.vy, p.vx);
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x - Math.cos(ang) * len, p.y - Math.sin(ang) * len);
          ctx.stroke();
          break;
        }
        case 'shard': {
          ctx.globalAlpha = a;
          ctx.translate(p.x, p.y); ctx.rotate(p.rot);
          ctx.fillStyle = p.col;
          const s = p.size;
          ctx.beginPath();
          ctx.moveTo(-s, -s * .6); ctx.lineTo(s * .8, -s); ctx.lineTo(s, s * .7); ctx.lineTo(-s * .5, s);
          ctx.closePath(); ctx.fill();
          if (p.col2) { ctx.fillStyle = p.col2; ctx.globalAlpha = a * .5; ctx.fillRect(-s, -s * .6, s * .7, s * .5); }
          break;
        }
        case 'smoke': {
          const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
          g.addColorStop(0, rgba(p.col, a * .5));
          g.addColorStop(1, rgba(p.col, 0));
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
          break;
        }
        case 'ring': {
          ctx.globalAlpha = a;
          ctx.strokeStyle = p.col;
          ctx.lineWidth = Math.max(.6, p.width ? p.width * a : 3 * a);
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.stroke();
          break;
        }
        case 'shock': {
          ctx.globalAlpha = a * .85;
          ctx.strokeStyle = p.col; ctx.lineWidth = 10 * a + 1;
          ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size, p.size * (p.sq || 1), 0, 0, TAU); ctx.stroke();
          ctx.globalAlpha = a * .18;
          ctx.fillStyle = p.col;
          ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size, p.size * (p.sq || 1), 0, 0, TAU); ctx.fill();
          break;
        }
        case 'text': {
          ctx.globalAlpha = a;
          ctx.font = `900 ${p.size}px Outfit, sans-serif`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.55)';
          ctx.strokeText(p.txt, p.x, p.y);
          ctx.fillStyle = p.col;
          ctx.fillText(p.txt, p.x, p.y);
          break;
        }
        case 'glyph': {
          ctx.globalAlpha = a;
          ctx.font = `700 ${p.size}px monospace`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillStyle = p.col;
          ctx.fillText(p.txt, p.x, p.y);
          break;
        }
        case 'pixel': {
          ctx.globalAlpha = a > .5 ? 1 : a * 2;
          ctx.fillStyle = p.col;
          const s = p.size;
          ctx.fillRect(Math.round(p.x / s) * s, Math.round(p.y / s) * s, s, s);
          break;
        }
        case 'petal': {
          ctx.globalAlpha = a;
          ctx.translate(p.x, p.y); ctx.rotate(p.rot);
          ctx.fillStyle = p.col;
          ctx.beginPath();
          ctx.ellipse(0, 0, p.size, p.size * .48, 0, 0, TAU);
          ctx.fill();
          ctx.fillStyle = rgba('#ffffff', .35 * a);
          ctx.beginPath(); ctx.ellipse(-p.size * .25, -p.size * .1, p.size * .4, p.size * .16, 0, 0, TAU); ctx.fill();
          break;
        }
        case 'bolt': {
          ctx.globalAlpha = a;
          ctx.strokeStyle = p.col; ctx.lineWidth = p.size * a;
          ctx.lineJoin = 'round'; ctx.lineCap = 'round';
          ctx.beginPath();
          const pts = p.pts;
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k].x, pts[k].y);
          ctx.stroke();
          if (p.col2) { ctx.strokeStyle = p.col2; ctx.lineWidth = p.size * a * .35; ctx.stroke(); }
          break;
        }
        case 'streak': {
          ctx.globalAlpha = a;
          ctx.translate(p.x, p.y); ctx.rotate(p.rot);
          const g = ctx.createLinearGradient(-p.size, 0, p.size, 0);
          g.addColorStop(0, rgba(p.col, 0));
          g.addColorStop(.5, rgba(p.col, a));
          g.addColorStop(1, rgba(p.col, 0));
          ctx.fillStyle = g;
          ctx.fillRect(-p.size, -p.h * .5, p.size * 2, p.h);
          break;
        }
      }
      ctx.restore();
    }
  }
};

/* --- convenience emitters --- */
function burst(x, y, n, o = {}) {
  for (let i = 0; i < n; i++) {
    const a = o.ang !== undefined ? o.ang + rand(-o.spread || -.6, o.spread || .6) : rand(0, TAU);
    const s = rand(o.spdMin || 1, o.spd || 7);
    FX.add({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      ...o,
      col: Array.isArray(o.col) ? pick(o.col) : (o.col || '#fff'),
      life: (o.life || 26) * rand(.6, 1.3),
      size: (o.size || 3) * rand(.6, 1.4),
      rot: rand(0, TAU), spin: rand(-.3, .3)
    });
  }
}
function shock(x, y, r, col, life = 22, width = 8) {
  FX.add({ x, y, type: 'shock', size: 6, grow: r / life, col, life, add: true, width, fade: 1.6 });
}
function popText(x, y, txt, col, size = 22) {
  FX.add({ x, y, type: 'text', txt, col, size, vy: -1.6, g: .045, drag: .96, life: 52, fade: 2.2, layer: 2 });
}

/* =========================================================
   AUDIO — fully synthesised, no assets
   ========================================================= */
const SFX = {
  ac: null, master: null, on: true, ready: false,
  init() {
    if (this.ac) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ac = new AC();
      this.master = this.ac.createGain();
      this.master.gain.value = .5;
      const comp = this.ac.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 8;
      this.master.connect(comp); comp.connect(this.ac.destination);
      this.ready = true;
    } catch (e) { this.ready = false; }
  },
  resume() { if (this.ac && this.ac.state === 'suspended') this.ac.resume(); },
  now() { return this.ac.currentTime; },

  /* every AudioParam value has to be finite and, for exponential ramps,
     strictly positive - so sanitise once here rather than at each call site */
  num(v, dflt, min, max) {
    const n = +v;
    if (!isFinite(n)) return dflt;
    return clamp(n, min, max);
  },

  tone(o) {
    if (!this.on || !this.ready) return;
    const ac = this.ac;
    const at = this.num(o.at, 0, 0, 30);
    const dur = this.num(o.dur, .2, .01, 10);
    const f = this.num(o.f, 0, 20, 20000);
    const v = this.num(o.vol === undefined ? .3 : o.vol, .3, .0002, 1);
    if (!f) return;
    const t = ac.currentTime + at;
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t);
    if (o.f2 !== undefined) {
      const f2 = this.num(o.f2, 0, 20, 20000);
      if (f2) osc.frequency.exponentialRampToValueAtTime(f2, t + dur);
    }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + this.num(o.atk, .006, .001, dur));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = osc;
    if (o.filt) {
      const bf = ac.createBiquadFilter();
      bf.type = o.filt;
      bf.frequency.value = this.num(o.ff, 900, 20, 20000);
      bf.Q.value = this.num(o.q, 1, .0001, 40);
      osc.connect(bf); node = bf;
    }
    node.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + dur + .04);
  },

  noise(o = {}) {
    if (!this.on || !this.ready) return;
    const ac = this.ac;
    const at = this.num(o.at, 0, 0, 30);
    const dur = this.num(o.dur, .2, .01, 10);
    const vol = this.num(o.vol === undefined ? .3 : o.vol, .3, .0002, 1);
    const t = ac.currentTime + at;
    const len = Math.max(1, Math.floor(ac.sampleRate * dur));
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter();
    f.type = o.filt || 'bandpass';
    f.frequency.setValueAtTime(this.num(o.ff, 1200, 20, 20000), t);
    if (o.ff2 !== undefined) f.frequency.exponentialRampToValueAtTime(this.num(o.ff2, 400, 20, 20000), t + dur);
    f.Q.value = this.num(o.q, 1, .0001, 40);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur + .02);
  },

  play(n, p = {}) {
    if (!this.on) return;
    this.init();
    if (!this.ready) return;
    try { this._play(n, p); } catch (e) { /* audio must never break the game */ }
  },
  _play(n, p = {}) {
    const V = this.num(p.v === undefined ? 1 : p.v, 1, 0, 4);
    switch (n) {
      case 'stretch': this.tone({ f: 90 + 260 * (p.k || 0), f2: 110 + 320 * (p.k || 0), type: 'sawtooth', dur: .07, vol: .05 * V, filt: 'lowpass', ff: 900 }); break;
      case 'launch':
        this.noise({ dur: .3, ff: 2400, ff2: 300, vol: .28 * V, filt: 'bandpass', q: .8 });
        this.tone({ f: 480, f2: 90, type: 'triangle', dur: .26, vol: .2 * V });
        break;
      case 'thud': this.tone({ f: 130, f2: 46, type: 'sine', dur: .17, vol: .3 * V }); this.noise({ dur: .1, ff: 400, vol: .12 * V, filt: 'lowpass' }); break;
      case 'wood':
        this.tone({ f: 200 + rand(-30, 30), f2: 80, type: 'square', dur: .1, vol: .12 * V, filt: 'lowpass', ff: 1400 });
        this.noise({ dur: .16, ff: 900, ff2: 260, vol: .17 * V, q: .7 });
        break;
      case 'glass':
        for (let i = 0; i < 4; i++) this.tone({ f: rand(1800, 4200), type: 'triangle', dur: .12, vol: .07 * V, at: i * .018 });
        this.noise({ dur: .3, ff: 5200, ff2: 2400, vol: .16 * V, q: .6 });
        break;
      case 'stone': this.tone({ f: 110, f2: 42, type: 'square', dur: .16, vol: .16 * V, filt: 'lowpass', ff: 600 }); this.noise({ dur: .22, ff: 520, ff2: 140, vol: .2 * V, filt: 'lowpass' }); break;
      case 'metal':
        this.tone({ f: 620, f2: 300, type: 'square', dur: .3, vol: .07 * V, filt: 'bandpass', ff: 2400, q: 6 });
        this.tone({ f: 940, f2: 500, type: 'sawtooth', dur: .34, vol: .05 * V, filt: 'bandpass', ff: 3200, q: 9 });
        break;
      case 'boom':
        this.tone({ f: 190, f2: 26, type: 'sine', dur: .7, vol: .45 * V });
        this.noise({ dur: .65, ff: 1400, ff2: 90, vol: .4 * V, filt: 'lowpass', q: .5 });
        break;
      case 'coin': this.tone({ f: 1180, type: 'square', dur: .07, vol: .07 * V }); this.tone({ f: 1760, type: 'square', dur: .12, vol: .06 * V, at: .06 }); break;
      case 'kill':
        this.tone({ f: 420, f2: 160, type: 'sawtooth', dur: .18, vol: .16 * V, filt: 'lowpass', ff: 1800 });
        this.noise({ dur: .26, ff: 1800, ff2: 300, vol: .2 * V });
        break;
      case 'zap':
        this.tone({ f: 2600, f2: 160, type: 'sawtooth', dur: .22, vol: .16 * V, filt: 'bandpass', ff: 2600, q: 3 });
        this.noise({ dur: .3, ff: 6000, ff2: 800, vol: .22 * V });
        break;
      case 'whoosh': this.noise({ dur: .38, ff: 300, ff2: 2600, vol: .16 * V, q: .6 }); break;
      case 'ui': this.tone({ f: 700, f2: 900, type: 'triangle', dur: .06, vol: .1 * V }); break;
      case 'buy': this.tone({ f: 520, type: 'triangle', dur: .09, vol: .14 }); this.tone({ f: 780, type: 'triangle', dur: .14, vol: .12, at: .07 }); break;
      case 'error': this.tone({ f: 180, f2: 120, type: 'square', dur: .18, vol: .13 }); break;
      case 'shake': this.noise({ dur: .12, ff: 260, vol: .18, filt: 'lowpass' }); this.tone({ f: 70, type: 'sine', dur: .12, vol: .18 }); break;
      case 'build': {
        const k = p.k || 0;
        this.tone({ f: 180 + k * 720, type: 'triangle', dur: .13, vol: .1 + k * .1 });
        break;
      }
      case 'reveal': {
        const r = p.r || 0;
        const base = [262, 294, 330, 392, 523, 659, 784][r] || 523;
        [0, 4, 7, 12].slice(0, 2 + r / 2 | 0).forEach((s, i) =>
          this.tone({ f: base * Math.pow(2, s / 12), type: r >= 4 ? 'sawtooth' : 'triangle', dur: .9 + r * .2, vol: .1, at: i * .05, filt: 'lowpass', ff: 3000 }));
        this.noise({ dur: .8, ff: 5000, ff2: 400, vol: .1 + r * .02 });
        if (r >= 4) this.tone({ f: 60, f2: 40, type: 'sine', dur: 1.2, vol: .4 });
        break;
      }
      case 'win': [523, 659, 784, 1047].forEach((f, i) => this.tone({ f, type: 'triangle', dur: .5, vol: .16, at: i * .11 })); break;
      case 'lose': [392, 349, 294, 220].forEach((f, i) => this.tone({ f, type: 'sawtooth', dur: .4, vol: .12, at: i * .13, filt: 'lowpass', ff: 1200 })); break;
      case 'glitch':
        for (let i = 0; i < 9; i++) this.tone({ f: rand(80, 3000), type: 'square', dur: .05, vol: .09, at: i * .045 });
        this.noise({ dur: .6, ff: 3000, ff2: 100, vol: .26, q: .4 });
        break;
      case 'bloom':
        [392, 523, 659, 784, 1047, 1319].forEach((f, i) => this.tone({ f, type: 'sine', dur: 1.4, vol: .1, at: i * .07 }));
        this.noise({ dur: 1.1, ff: 500, ff2: 3000, vol: .1, q: .5 });
        break;
      case 'arcade':
        [523, 392, 523, 659, 784].forEach((f, i) => this.tone({ f, type: 'square', dur: .1, vol: .12, at: i * .085 }));
        break;
      case 'blip': this.tone({ f: p.f || 880, type: 'square', dur: .05, vol: .07 * V }); break;
      case 'timewarp': this.tone({ f: 900, f2: 120, type: 'sine', dur: 1.1, vol: .2 }); this.noise({ dur: 1.0, ff: 2200, ff2: 200, vol: .12 }); break;
    }
  }
};

function skinSphere(ctx, R, hi, mid, lo) {
  const g = ctx.createRadialGradient(-R * .35, -R * .4, R * .06, 0, 0, R * 1.08);
  g.addColorStop(0, hi); g.addColorStop(.5, mid); g.addColorStop(1, lo);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill();
}
function rimShade(ctx, R, a = .35) {
  const g = ctx.createRadialGradient(-R * .2, -R * .25, R * .5, 0, 0, R);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`);

}

  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = cv.clientWidth || cv.width, h = cv.clientHeight || cv.height;
  if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const R = Math.min(w, h) * (opts.scale || .34);
  ctx.save();
  ctx.translate(w / 2, h / 2);
  if (opts.glow !== false) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    glowCircle(ctx, 0, 0, Math.min(R * 2.6, Math.min(w, h) * .5), RC(skin.rar), skin.rar >= 4 ? .5 : .28);
    ctx.restore();
  }
  if (opts.float) ctx.translate(0, Math.sin(t * 1.8) * R * .07);
  if (skin.faceVel) ctx.rotate(-.35);
  else if (!skin.noRot && opts.spin !== false) ctx.rotate(t * .6);
  skin.draw(ctx, R, t, null);
  ctx.restore();
}

'use strict';
/* =========================================================
   ELITE TIER — a rarity above mythic, three more legendaries,
   two more mythics, and bespoke trail ribbons for everything
   legendary and up.

   NOTE ON RIBBONS: they blend normally (source-over), not
   additively. Additive hues saturate straight to white over a
   bright sky, which made every high-end trail look identical.
   Only thin core highlights use 'lighter'.
   ========================================================= */

RARITY.push({ key: 'transcendent', name: 'TRANSCENDENT', c: '#ffffff', dust: 60000 });
const TRANSCENDENT = 6;

/* ---------- ribbon helpers ---------- */
/* tr is the ball's recent path, oldest point first */
function ribbonStroke(x, tr, col, w, a, ox = 0, oy = 0) {
  x.lineCap = 'round';
  for (let i = 1; i < tr.length; i++) {
    const u = i / tr.length;
    x.strokeStyle = rgba(col, a * Math.pow(u, 1.35));
    x.lineWidth = Math.max(.5, w * (.4 + .6 * u));
    x.beginPath();
    x.moveTo(tr[i - 1].x + ox, tr[i - 1].y + oy);
    x.lineTo(tr[i].x + ox, tr[i].y + oy);
    x.stroke();
  }
}
/* unit normal of the path at index i */
function pathNormal(tr, i) {
  const a = tr[Math.max(0, i - 1)], b = tr[Math.min(tr.length - 1, i + 1)];
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
  return { x: -dy / d, y: dx / d };
}

      x.restore();
      // stars fixed in space, so it reads as a window rather than a texture
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      for (const p of tr) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }
      const C = 13, pad = Rr * 1.2;
      x.globalCompositeOperation = 'lighter';
      for (let gx = Math.floor((x0 - pad) / C); gx <= (x1 + pad) / C; gx++) {
        for (let gy = Math.floor((y0 - pad) / C); gy <= (y1 + pad) / C; gy++) {
          const h = hash2(gx, gy);
          if (h > .5) continue;
          const sx = (gx + hash2(gy, gx)) * C, sy = (gy + hash(gx * 5.3 + gy * 1.9)) * C;
          let bi = 0, bd = 1e9;
          for (let i = 0; i < n; i++) { const d = (tr[i].x - sx) ** 2 + (tr[i].y - sy) ** 2; if (d < bd) { bd = d; bi = i; } }
          const u = bi / (n - 1), w = W(u) * .92;
          if (bd > w * w) continue;
          x.globalAlpha = Math.min(1, u * 1.5) * (.5 + .5 * Math.sin(t * 5 + h * 90));
          if (h < .035) { x.fillStyle = '#ffdc82'; starPath(x, sx, sy, 5, 1, 4, 0); x.fill(); }
          else {
            x.fillStyle = h < .2 ? '#ffffff' : '#b4d2ff';
            const s = h < .1 ? 2.4 : 1.4; x.fillRect(sx - s / 2, sy - s / 2, s, s);
          }
        }
      }
      x.globalAlpha = 1;
      // gold hems
      const edge = s => {
        x.beginPath();
        for (let i = 0; i < n; i++) {
          const nn = pathNormal(tr, i), w = W(i / (n - 1)) * s;
          if (i) x.lineTo(tr[i].x + nn.x * w, tr[i].y + nn.y * w); else x.moveTo(tr[i].x + nn.x * w, tr[i].y + nn.y * w);
        }
        x.stroke();
      };
      const gg = x.createLinearGradient(a0.x, a0.y, a1.x, a1.y);
      gg.addColorStop(0, 'rgba(255,211,107,0)'); gg.addColorStop(1, 'rgba(255,236,170,.95)');
      x.strokeStyle = gg; x.lineJoin = 'round'; x.lineWidth = 1.8;
      edge(1); edge(-1);
      // the world's two rings unwinding around the path, one passing behind the other
      x.lineCap = 'round';
      for (const [ph, c] of [[0, '255,211,107'], [Math.PI, '255,240,192']]) {
        const back = new Path2D(), front = new Path2D();
        let px = 0, py = 0;
        for (let i = 1; i < n; i++) {
          const nn = pathNormal(tr, i), a = i * .42 - t * 9 + ph;
          const o = Math.sin(a) * W(i / (n - 1)) * 1.5, qx = tr[i].x + nn.x * o, qy = tr[i].y + nn.y * o;
          if (i > 1) { const p = Math.cos(a) > 0 ? front : back; p.moveTo(px, py); p.lineTo(qx, qy); }
          px = qx; py = qy;
        }
        const sg = x.createLinearGradient(a0.x, a0.y, a1.x, a1.y);
        sg.addColorStop(0, `rgba(${c},0)`); sg.addColorStop(1, `rgba(${c},1)`);
        x.strokeStyle = sg;
        x.globalAlpha = .3; x.lineWidth = 1.4; x.stroke(back);
        x.globalAlpha = 1; x.lineWidth = 2.6; x.stroke(front);
      }
    },
    /* little worlds dropping off behind it */
    trail(g, b) {
      if (Math.random() < .14) {
        const ringed = Math.random() < .45;
        FX.add({
          x: b.position.x + rand(-10, 10), y: b.position.y + rand(-10, 10), vx: -b.velocity.x * .05 + rand(-.3, .3), vy: -b.velocity.y * .05 + rand(-.3, .3),
          type: 'planet', size: rand(3, 6.5), col: pick(['#3a9ae6', '#e8704a', '#5bc46a', '#b88ae8', '#e8c46a']), col2: ringed ? '#ffd36b' : null,
          rot: rand(-.6, .6), spin: rand(-.02, .02), life: rand(50, 80), drag: .97, fade: .8
        });
      }
      if (Math.random() < .3) FX.add({
        x: b.position.x + rand(-12, 12), y: b.position.y + rand(-12, 12), vx: rand(-.4, .4), vy: rand(-.4, .4),
        type: 'flare', size: rand(4, 8), col: pick(['#ffd36b', '#ffffff']), life: rand(14, 24), add: true
      });
    },
    onAbility(g, b) { g.worldFlip(b); }
  }
);

/* ATLAS: a living little world in a golden orrery */
function drawAtlasWorld(ctx, R, t) {
  ctx.save();
  const ring = (tilt, rx, ry, spin, front) => {
    ctx.save(); ctx.rotate(tilt);
    const g = ctx.createLinearGradient(-R * rx, 0, R * rx, 0);
    g.addColorStop(0, '#6a4006'); g.addColorStop(.5, '#fff0b0'); g.addColorStop(1, '#6a4006');
    ctx.strokeStyle = g; ctx.lineWidth = R * .09;
    ctx.beginPath(); ctx.ellipse(0, 0, R * rx, R * ry, 0, front ? 0 : Math.PI, front ? Math.PI : TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,250,220,.6)'; ctx.lineWidth = R * .025;
    ctx.beginPath(); ctx.ellipse(0, -R * .02, R * rx, R * ry, 0, front ? .2 : Math.PI + .2, front ? Math.PI - .2 : TAU - .2); ctx.stroke();
    for (let i = 0; i < 4; i++) {
      const a = t * spin + i * Math.PI / 2;
      if ((Math.sin(a) > 0) !== front) continue;
      const bx = Math.cos(a) * R * rx, by = Math.sin(a) * R * ry;
      ctx.fillStyle = '#fff6d0'; ctx.beginPath(); ctx.arc(bx, by, R * .075, 0, TAU); ctx.fill();
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; glowCircle(ctx, bx, by, R * .25, '#ffd36b', .6); ctx.restore();
    }
    ctx.restore();
  };
  const RINGS = [[.38, 1.58, .4, .9], [-.55, 1.4, .3, -1.25]];
  for (const r of RINGS) ring(r[0], r[1], r[2], r[3], false);
  // atmosphere
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  glowCircle(ctx, 0, 0, R * 1.55, '#7fd0ff', .45);
  ctx.restore();
  // oceans
  const P = R * .92;
  const og = ctx.createRadialGradient(-P * .35, -P * .4, P * .08, 0, 0, P * 1.05);
  og.addColorStop(0, '#c4f2ff'); og.addColorStop(.35, '#3a9ae6'); og.addColorStop(1, '#0a2466');
  ctx.fillStyle = og; ctx.beginPath(); ctx.arc(0, 0, P, 0, TAU); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, P, 0, TAU); ctx.clip();
  // continents drifting past as it spins
  for (let i = 0; i < 4; i++) {
    const cx = ((hash(i * 5.1) * 2.6 + t * .1) % 2.6 - 1.3) * P * 1.25, cy = (hash(i * 2.7) - .5) * P * 1.2;
    const sq = Math.sqrt(Math.max(0, 1 - (cx / P) ** 2));   // squash toward the limb
    ctx.save(); ctx.translate(cx, cy); ctx.scale(Math.max(.15, sq), 1);
    ctx.fillStyle = '#5bc46a';
    ctx.beginPath();
    for (let k = 0; k < 4; k++) ctx.arc((hash(i * 9 + k) - .5) * P * .5, (hash(i * 4 + k) - .5) * P * .35, P * (.14 + hash(i + k) * .14), 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(232,210,122,.75)';
    ctx.beginPath(); ctx.arc((hash(i * 9) - .5) * P * .5, (hash(i * 4) - .5) * P * .35 + P * .05, P * .08, 0, TAU); ctx.fill();
    ctx.restore();
  }
  // clouds, quicker than the land
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  for (let i = 0; i < 5; i++) {
    const cx = ((hash(i * 7.7) * 2.6 + t * .2) % 2.6 - 1.3) * P * 1.25, cy = (hash(i * 3.9) - .5) * P * 1.5;
    ctx.beginPath(); ctx.ellipse(cx, cy, P * (.2 + hash(i) * .15), P * .055, -.1, 0, TAU); ctx.fill();
  }
  // night side
  const ng = ctx.createRadialGradient(-P * .45, -P * .5, P * .4, 0, 0, P * 1.3);
  ng.addColorStop(0, 'rgba(0,8,30,0)'); ng.addColorStop(1, 'rgba(0,8,30,.65)');
  ctx.fillStyle = ng; ctx.fillRect(-P, -P, P * 2, P * 2);
  ctx.restore();
  ctx.strokeStyle = 'rgba(190,240,255,.85)'; ctx.lineWidth = R * .05;
  ctx.beginPath(); ctx.arc(0, 0, P, 0, TAU); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.ellipse(-P * .4, -P * .5, P * .24, P * .11, -.65, 0, TAU); ctx.fill();
  for (const r of RINGS) ring(r[0], r[1], r[2], r[3], true);
  // its little moon
  const ma = t * .8;
  const mx = Math.cos(ma) * R * 1.85, my = Math.sin(ma) * R * .55 - R * .2;
  ctx.fillStyle = '#e8ecf6'; ctx.beginPath(); ctx.arc(mx, my, R * .13, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(80,90,120,.5)'; ctx.beginPath(); ctx.arc(mx + R * .04, my + R * .03, R * .1, 0, TAU); ctx.fill();
  ctx.restore();
}

/* =========================================================
   BESPOKE RIBBONS for the legendary+ skins that already existed
   ========================================================= */

/* PRISM — the trail refracts into seven separated colour channels */
SKIN_BY_ID.prism.ribbon = function (x, tr, b, t) {
  x.globalCompositeOperation = 'source-over';
  for (let s = 0; s < 7; s++) {
    const hu = s / 7 * 300;
    for (let i = 1; i < tr.length; i++) {
      const u = i / tr.length;
      const n0 = pathNormal(tr, i - 1), n1 = pathNormal(tr, i);
      const o = (s - 3) * (1 - u) * 8;
      x.strokeStyle = hsl(hu, 100, 58, .8 * Math.pow(u, 1.2));
      x.lineWidth = 5 * (.4 + .6 * u);
      x.lineCap = 'round';
      x.beginPath();
      x.moveTo(tr[i - 1].x + n0.x * o, tr[i - 1].y + n0.y * o);
      x.lineTo(tr[i].x + n1.x * o, tr[i].y + n1.y * o);
      x.stroke();
    }
  }
  ribbonStroke(x, tr, '#ffffff', 2.4, .95);
};

/* CHRONOS — clock-face afterimages frozen along the path */
SKIN_BY_ID.chronos.ribbon = function (x, tr, b, t) {
  x.globalCompositeOperation = 'source-over';
  ribbonStroke(x, tr, '#ffd979', 7, .75);
  for (let i = tr.length - 3; i > 0; i -= 5) {
    const u = i / tr.length;
    const p = tr[i], r = 10 + u * 6;
    x.strokeStyle = rgba('#ffd979', .7 * u);
    x.lineWidth = 1.8;
    x.beginPath(); x.arc(p.x, p.y, r, 0, TAU); x.stroke();
    for (let k = 0; k < 4; k++) {
      const a = k / 4 * TAU;
      x.beginPath();
      x.moveTo(p.x + Math.cos(a) * r * .7, p.y + Math.sin(a) * r * .7);
      x.lineTo(p.x + Math.cos(a) * r, p.y + Math.sin(a) * r);
      x.stroke();
    }
    const ha = -1.57 + (1 - u) * 5;
    x.strokeStyle = rgba('#ff8a3d', .8 * u);
    x.lineWidth = 2;
    x.beginPath();
    x.moveTo(p.x, p.y);
    x.lineTo(p.x + Math.cos(ha) * r * .8, p.y + Math.sin(ha) * r * .8);
    x.stroke();
  }
};

/* ORBITAL — a targeting track with range ticks and a scanning bracket */
SKIN_BY_ID.orbital.ribbon = function (x, tr, b, t) {
  x.globalCompositeOperation = 'source-over';
  ribbonStroke(x, tr, '#7fe9ff', 4, .8);
  for (let i = 1; i < tr.length; i += 2) {
    const u = i / tr.length, n = pathNormal(tr, i);
    const len = 5 + u * 8;
    x.strokeStyle = rgba(i % 4 === 0 ? '#ffc23d' : '#7fe9ff', .8 * u);
    x.lineWidth = 1.6;
    x.beginPath();
    x.moveTo(tr[i].x + n.x * len, tr[i].y + n.y * len);
    x.lineTo(tr[i].x - n.x * len, tr[i].y - n.y * len);
    x.stroke();
  }
  const h = tr[tr.length - 1];
  if (h) {
    x.strokeStyle = rgba('#ffc23d', .9); x.lineWidth = 2.4;
    for (let k = 0; k < 4; k++) {
      const a = k / 4 * TAU + t * 2;
      x.beginPath(); x.arc(h.x, h.y, 28, a, a + .5); x.stroke();
    }
  }
};

/* PHOENIX — a flame plume that swells behind the bird and pinches to nothing at it */
SKIN_BY_ID.phoenix.ribbon = function (x, tr, b, t) {
  const Rr = b.game.R, a0 = tr[0], a1 = tr[tr.length - 1];
  const plume = (k, col, lo, hi, add) => {
    x.globalCompositeOperation = add ? 'lighter' : 'source-over';
    R.ribbonPath(x, tr, u => Rr * k * Math.pow(Math.sin(Math.PI * u), .75) * (1 + Math.sin(u * 16 - t * 18) * .1));
    const g = x.createLinearGradient(a0.x, a0.y, a1.x, a1.y);
    g.addColorStop(0, rgba(col, 0)); g.addColorStop(.55, rgba(col, lo)); g.addColorStop(1, rgba(col, hi));
    x.fillStyle = g; x.fill();
  };
  plume(1.3, '#c41a0a', .4, .55);
  plume(.9, '#ff6a1f', .55, .75);
  plume(.45, '#ffd66b', .6, .85, true);
  x.globalCompositeOperation = 'lighter';
  for (let i = 2; i < tr.length - 2; i += 3) {
    const u = i / tr.length, n = pathNormal(tr, i), side = i % 6 < 3 ? 1 : -1;
    const spread = Math.sin(Math.PI * u) * Rr * 1.3 * side;
    x.strokeStyle = rgba('#ffb03a', .5 * u); x.lineWidth = 2.5; x.lineCap = 'round';
    x.beginPath(); x.moveTo(tr[i].x + n.x * spread * .5, tr[i].y + n.y * spread * .5);
    x.quadraticCurveTo(tr[i].x + n.x * spread, tr[i].y + n.y * spread, tr[i - 2].x + n.x * spread * 1.3, tr[i - 2].y + n.y * spread * 1.3 - 4);
    x.stroke();
  }
};

/* GLITCH — datamoshed RGB slabs instead of a smooth trail */
SKIN_BY_ID.glitch.ribbon = function (x, tr, b, t) {
  x.globalCompositeOperation = 'source-over';
  for (let i = 1; i < tr.length; i++) {
    const u = i / tr.length;
    const p = tr[i];
    const jx = (hash(i * 7.3 + Math.floor(t * 20)) - .5) * (1 - u) * 46;
    const h = 3 + hash(i * 3.1) * 11 * u;
    x.globalAlpha = .8 * u;
    x.fillStyle = '#ff2e88';
    x.fillRect(p.x - 16 * u + jx - 4, p.y - h / 2, 32 * u, h);
    x.fillStyle = '#00ffd5';
    x.fillRect(p.x - 16 * u + jx + 4, p.y - h / 2, 32 * u, h);
    x.globalAlpha = .95 * u;
    x.fillStyle = '#ffffff';
    x.fillRect(p.x - 11 * u + jx, p.y - h / 4, 22 * u, h / 2);
  }
  x.globalAlpha = 1;
};

/* BLOOM — a vine that grows along the flight path */
SKIN_BY_ID.bloom.ribbon = function (x, tr, b, t) {
  x.globalCompositeOperation = 'source-over';
  x.strokeStyle = 'rgba(45,180,105,.85)';
  x.lineCap = 'round';
  for (let i = 1; i < tr.length; i++) {
    const u = i / tr.length;
    x.lineWidth = 6 * (.35 + .65 * u);
    x.beginPath();
    x.moveTo(tr[i - 1].x, tr[i - 1].y);
    x.lineTo(tr[i].x, tr[i].y);
    x.stroke();
  }
  for (let i = 1; i < tr.length; i += 2) {
    const u = i / tr.length, n = pathNormal(tr, i);
    const dir = i % 4 < 2 ? 1 : -1;
    x.save();
    x.translate(tr[i].x + n.x * 8 * dir * u, tr[i].y + n.y * 8 * dir * u);
    x.rotate(i + t);
    x.fillStyle = rgba('#3ddc84', .9 * u);
    x.beginPath(); x.ellipse(0, 0, 7 * u, 3 * u, 0, 0, TAU); x.fill();
    x.restore();
    if (i % 6 === 1) {
      const c = ['#ff7ab8', '#ffd45c', '#b18cff', '#ffffff'][(i / 6 | 0) % 4];
      x.fillStyle = rgba(c, .95 * u);
      x.beginPath(); x.arc(tr[i].x, tr[i].y, 4 * u + 1, 0, TAU); x.fill();
    }
  }
};

/* ARCADE — a chunky four-colour pixel snake */
SKIN_BY_ID.arcade.ribbon = function (x, tr, b, t) {
  x.globalCompositeOperation = 'source-over';
  const S = 7;
  for (let i = 1; i < tr.length; i++) {
    const u = i / tr.length;
    if (u < .12) continue;
    const px = Math.round(tr[i].x / S) * S, py = Math.round(tr[i].y / S) * S;
    x.globalAlpha = u > .4 ? 1 : u * 2.5;
    x.fillStyle = ['#00e5ff', '#ffcc00', '#ff2e88', '#ffffff'][i % 4];
    const w = Math.max(S, Math.round(S * 2.2 * u));
    x.fillRect(px - w / 2, py - w / 2, w, w);
  }
  x.globalAlpha = 1;
};

/* ECLIPSE — negative space: a void ribbon with a burning rim */
SKIN_BY_ID.eclipse.ribbon = function (x, tr, b, t) {
  x.globalCompositeOperation = 'source-over';
  ribbonStroke(x, tr, '#ff5a2a', 26, .75);
  ribbonStroke(x, tr, '#ffd07a', 15, .6);
  for (let i = 1; i < tr.length; i++) {
    const u = i / tr.length;
    x.strokeStyle = rgba('#05040a', Math.pow(u, 1.1));
    x.lineWidth = Math.max(.5, 10 * (.4 + .6 * u));
    x.lineCap = 'round';
    x.beginPath();
    x.moveTo(tr[i - 1].x, tr[i - 1].y);
    x.lineTo(tr[i].x, tr[i].y);
    x.stroke();
  }
};

/* ---------- shorthand builders ---------- */
const B = (x, y, w, h, mat = 'wood', a = 0) => ({ t: 'b', x, y, w, h, mat, a });
const E = (x, y, kind = 'grunt') => ({ t: 'e', x, y, kind });
const T = (x, y) => ({ t: 'b', x, y, w: 40, h: 44, mat: 'tnt', a: 0 });
const C = (x, y, r, mat = 'stone') => ({ t: 'c', x, y, r, mat });

/* vertical plank */
const V = (x, base, h, mat = 'wood', w = 22) => B(x, base - h / 2, w, h, mat);
/* horizontal beam */
const Hb = (x, base, w, mat = 'wood', h = 22) => B(x, base - h / 2, w, h, mat);

/* a simple hut: two posts + roof beam. returns [items, newBase] */
function hut(x, base, w, h, mat = 'wood', th = 22) {
  return [
    V(x - w / 2 + th / 2, base, h, mat, th),
    V(x + w / 2 - th / 2, base, h, mat, th),
    Hb(x, base - h, w + th, mat, th)
  ];
}
function tri(x, base, w, mat = 'wood') {
  // an A-frame whose tops lean on each other (it used to be a V that always fell)
  return [B(x - 27.5, base - 44.5, 20, 88, mat, .42), B(x + 27.5, base - 44.5, 20, 88, mat, -.42)];
}

'use strict';
/* =========================================================
   RENDERER
   ========================================================= */
const R = {
  cv: null, ctx: null, W: 0, H: 0, dpr: 1,
  wc: null, wx: null,      // world buffer
  gc: null, gx: null,      // glow buffer (half res) — only emissive content
  tc: null, tx: null,      // temp (half res) for chroma
  pc: null, px: null,      // pixelate buffer
  clouds: [], stars: [], birds: [], rain: [],
  sun: { x: 0, y: 0, c: '#fff', a: .5 },

  init(cv) {
    this.cv = cv; this.ctx = cv.getContext('2d', { alpha: false });
    this.wc = document.createElement('canvas'); this.wx = this.wc.getContext('2d');
    this.gc = document.createElement('canvas'); this.gx = this.gc.getContext('2d');
    this.tc = document.createElement('canvas'); this.tx = this.tc.getContext('2d');
    this.pc = document.createElement('canvas'); this.px = this.pc.getContext('2d');
    this.resize();
    for (let i = 0; i < 16; i++) this.clouds.push({ x: rand(0, 2600), y: rand(40, 300), s: rand(.5, 1.7), sp: rand(.05, .25), d: rand(0, 1) });
    for (let i = 0; i < 190; i++) this.stars.push({ x: rand(0, 2600), y: rand(0, 520), r: rand(.5, 1.9), tw: rand(0, TAU), sp: rand(.4, 1.4) });
    for (let i = 0; i < 5; i++) this.birds.push({ x: rand(0, 2000), y: rand(90, 260), s: rand(.6, 1.2), ph: rand(0, TAU), sp: rand(.3, .7) });
    for (let i = 0; i < 260; i++) this.rain.push({ x: rand(0, 2400), y: rand(0, 1200), l: rand(12, 30), sp: rand(18, 30) });
  },

  resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    // a host pane can report a 0-size viewport on the very first frame
    const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
    this.dpr = dpr; this.W = w; this.H = h;
    for (const [c, s] of [[this.cv, 1], [this.wc, 1]]) { c.width = w * dpr * s; c.height = h * dpr * s; }
    this.gc.width = Math.max(2, (w * dpr) >> 1); this.gc.height = Math.max(2, (h * dpr) >> 1);
    this.tc.width = Math.max(2, (w * dpr) >> 1); this.tc.height = Math.max(2, (h * dpr) >> 1);
  },

  /* ---------- main frame ---------- */
  frame(g, t, dt) {
    if (this.cv.width < 4 || this.cv.height < 4 ||
        this.cv.width !== Math.max(1, window.innerWidth) * this.dpr) this.resize();
    if (this.cv.width < 4 || this.cv.height < 4) return;
    const dpr = this.dpr, W = this.W, H = this.H;
    const x = this.wx;
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    x.globalCompositeOperation = 'source-over';
    x.globalAlpha = 1; x.filter = 'none';

    const th = THEMES[g.theme] || THEMES.day;
    const cam = g.cam;
    const z = cam.z;
    const horizonY = (GY - cam.y) * z + H / 2;

    this.sky(x, g, th, t, horizonY);
    this.parallax(x, g, th, t, horizonY, z);
    this.ambient(x, g, th, t);
    // ATLAS: deep space floods in while the world is upside down
    g.spaceA = lerp(g.spaceA || 0, g.flip ? 1 : 0, g.flip ? .06 : .035);
    const up = g.flip && g.flip.phase === 'up';
    g.roll = lerp(g.roll || 0, up ? Math.PI : 0, up ? .045 : .1);
    if (Math.abs(g.roll) < .002) g.roll = 0;
    if (g.spaceA > .01) this.spaceSky(x, g, t, g.spaceA);

    /* ---- world space ---- */
    x.save();
    x.translate(W / 2 + g.shakeX, H / 2 + g.shakeY);
    x.scale(z, z);
    x.translate(-cam.x, -cam.y);

    this.ground(x, g, th);
    FX.draw(x, 0);
    this.vines(x, g, t);
    this.flipBarrier(x, g, t);
    this.blocks(x, g, t);
    this.enemies(x, g, t);
    this.cyclone(x, g, t);
    this.tendrils(x, g, t);
    this.water(x, g, t);
    this.slingBack(x, g);
    this.balls(x, g, t);
    this.drones(x, g, t);
    this.slingFront(x, g);
    this.giantFist(x, g, t);
    FX.draw(x, 1);
    this.aim(x, g, t);
    FX.draw(x, 2);
    x.restore();

    if (th.rain) this.rainFX(x, g, t);

    /* ---- emissive pass (drives bloom) ---- */
    const gx = this.gx, hs = dpr * .5;
    gx.setTransform(1, 0, 0, 1, 0, 0);
    gx.globalCompositeOperation = 'source-over';
    gx.globalAlpha = 1; gx.filter = 'none';
    gx.clearRect(0, 0, this.gc.width, this.gc.height);
    gx.setTransform(hs, 0, 0, hs, 0, 0);
    // sun / moon disc glows
    gx.globalCompositeOperation = 'lighter';
    glowCircle(gx, this.sun.x, this.sun.y, 150, this.sun.c, this.sun.a);
    gx.save();
    gx.translate(W / 2 + g.shakeX, H / 2 + g.shakeY);
    gx.scale(z, z);
    gx.translate(-cam.x, -cam.y);
    FX.draw(gx, 1);
    this.ballGlow(gx, g, t);
    if (g.eclipse) for (const e of g.enemies) {
      if (e.game.dead) continue;
      glowCircle(gx, e.position.x, e.position.y, e.game.r * 2.6, '#ff8a4d', .2);
    }
    this.tendrilGlow(gx, g, t);
    gx.restore();

    /* ---- composite + post ---- */
    this.post(g, t, dt);
  },

  /* emissive silhouettes of the balls so they always carry a halo */
  ballGlow(x, g, t) {
    for (const b of g.activeBalls) {
      const gm = b.game, sk = gm.skin;
      x.save();
      x.globalCompositeOperation = 'lighter';
      x.translate(b.position.x, b.position.y);
      glowCircle(x, 0, 0, gm.R * (1.9 + sk.rar * .25), RC(sk.rar), .12 + sk.rar * .055);
      x.restore();
    }
  },

  /* ---------- ambient life: drifting motes behind the play field ---------- */
  ambient(x, g, th, t) {
    const kind = AMBIENT_KIND[g.theme];
    if (!kind) return;
    const W = this.W, H = this.H;
    if (!this.motes) this.motes = Array.from({ length: 54 }, () => ({
      x: Math.random(), y: Math.random(), s: rand(.6, 1.6), ph: rand(0, TAU), sp: rand(.4, 1)
    }));
    const wrap = (v, m) => ((v % m) + m) % m;
    const col = th.amb || '#ffffff';
    x.save();
    for (const m of this.motes) {
      const drift = g.cam.x * .25 * m.s;
      let px, py, r, a;
      if (kind === 'snow') {
        px = wrap(m.x * W + Math.sin(t * .8 + m.ph) * 22 - drift, W + 40) - 20;
        py = wrap(m.y * H + t * 26 * m.sp * m.s, H + 40) - 20;
        r = 1.3 * m.s + .4; a = .75;
        x.globalCompositeOperation = 'source-over';
        x.fillStyle = `rgba(255,255,255,${a})`;
        x.beginPath(); x.arc(px, py, r, 0, TAU); x.fill();
        continue;
      }
      if (kind === 'petals') {
        px = wrap(m.x * W + Math.sin(t * .7 + m.ph) * 40 + t * 18 * m.sp - drift, W + 40) - 20;
        py = wrap(m.y * H + t * 30 * m.sp, H + 40) - 20;
        const flip = Math.cos(t * 2.2 * m.sp + m.ph);
        x.globalCompositeOperation = 'source-over';
        x.save(); x.translate(px, py); x.rotate(t * .9 * m.sp + m.ph);
        x.fillStyle = flip > 0 ? 'rgba(255,196,216,.85)' : 'rgba(240,150,186,.85)';
        x.beginPath(); x.ellipse(0, 0, 3.6 * m.s, 2 * m.s * Math.max(.2, Math.abs(flip)), 0, 0, TAU); x.fill();
        x.restore();
        continue;
      }
      if (kind === 'embers' || kind === 'spores') {
        px = wrap(m.x * W + Math.sin(t * .9 + m.ph) * 30 - drift, W + 40) - 20;
        py = H - wrap(m.y * H + t * (kind === 'embers' ? 34 : 14) * m.sp, H + 40) + 20;
        r = (kind === 'embers' ? 1.4 : 2) * m.s;
        a = (kind === 'embers' ? .55 + Math.sin(t * 9 + m.ph) * .35 : .35) * clamp(py / H * 1.4, 0, 1);
      } else if (kind === 'fireflies') {
        px = wrap(m.x * W + Math.sin(t * .45 + m.ph) * 46 - drift, W + 40) - 20;
        py = H * (.3 + m.y * .55) + Math.cos(t * .6 + m.ph * 2) * 28;
        r = 1.6 * m.s; a = Math.max(0, Math.sin(t * 1.6 * m.sp + m.ph)) * .9;
      } else {   // dust: lazy sunlit motes
        px = wrap(m.x * W + t * 9 * m.sp - drift, W + 40) - 20;
        py = H * (.15 + m.y * .7) + Math.sin(t * .5 + m.ph) * 14;
        r = 1.1 * m.s; a = .22 + Math.sin(t * .8 + m.ph) * .12;
      }
      if (a <= .02) continue;
      x.globalCompositeOperation = 'lighter';
      const c = kind === 'embers' ? '#ffab5c' : kind === 'spores' ? '#c8ff7a' : col;
      if (kind !== 'dust') glowCircle(x, px, py, r * 5, c, a * .35);
      x.fillStyle = rgba(c, a);
      x.beginPath(); x.arc(px, py, r, 0, TAU); x.fill();
    }
    x.restore();
  },

  /* ---------- sky ---------- */
  sky(x, g, th, t, horizonY) {
    const W = this.W, H = this.H;
    const grd = x.createLinearGradient(0, 0, 0, Math.max(horizonY, H * .6));
    grd.addColorStop(0, th.sky[0]); grd.addColorStop(.55, th.sky[1]); grd.addColorStop(1, th.sky[2]);
    x.fillStyle = grd; x.fillRect(0, 0, W, H);

    if (th.stars) {
      for (const s of this.stars) {
        const sx = (s.x - g.cam.x * .06) % 2600;
        if (sx < -20 || sx > W + 20) continue;
        const a = .35 + Math.sin(t * s.sp + s.tw) * .35;
        x.fillStyle = `rgba(255,255,255,${a})`;
        x.beginPath(); x.arc(sx, s.y * (H / 900), s.r, 0, TAU); x.fill();
      }
    }
    if (th.aurora) {
      // soft curtains of light, painted small and stretched (they're all blur anyway)
      const aw = 240, ah = 135;
      if (!this.aurC) { this.aurC = document.createElement('canvas'); this.aurC.width = aw; this.aurC.height = ah; }
      if (!(Math.abs(t - (this.aurT || -1)) < .05)) {
        this.aurT = t;
        const ac = this.aurC.getContext('2d');
        ac.clearRect(0, 0, aw, ah);
        ac.globalCompositeOperation = 'lighter';
        for (const [c, yk, ph] of [['90,255,200', .2, 0], ['120,200,255', .3, 2.1], ['200,120,255', .42, 4.2]]) {
          for (let i = 0; i <= 40; i++) {
            const u = i / 40, px = u * aw;
            const base = ah * yk + Math.sin(u * 5 + t * .35 + ph) * ah * .05 + Math.sin(u * 13 - t * .6 + ph) * ah * .015;
            const len = ah * (.1 + .07 * (.5 + .5 * Math.sin(u * 9 + t * .8 + ph)));
            const al = .16 * (.5 + .5 * Math.sin(u * 7 - t * .5 + ph * 2));
            const gr = ac.createLinearGradient(0, base - len, 0, base);
            gr.addColorStop(0, `rgba(${c},0)`); gr.addColorStop(.8, `rgba(${c},${al})`); gr.addColorStop(1, `rgba(${c},0)`);
            ac.fillStyle = gr; ac.fillRect(px - aw / 80, base - len, aw / 40 + 1, len);
          }
        }
      }
      x.save(); x.globalCompositeOperation = 'lighter';
      x.drawImage(this.aurC, 0, 0, W, H);
      x.restore();
    }
    // sun / moon
    const sx = W * .74 - g.cam.x * .03, sy = H * th.sunY;
    this.sun.x = sx; this.sun.y = sy; this.sun.c = th.sunGlow; this.sun.a = th.moon ? .22 : .34;
    x.save(); x.globalCompositeOperation = 'lighter';
    glowCircle(x, sx, sy, 165, th.sunGlow, th.moon ? .16 : .22);
    x.restore();
    if (th.corona) {
      x.save();
      x.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 40; i++) {
        const a = i / 40 * TAU + t * .12;
        const len = 58 + Math.abs(Math.sin(t * 1.6 + i * 1.9)) * 46;
        x.strokeStyle = rgba(i % 3 === 0 ? '#ffd07a' : '#ff5a2a', .5);
        x.lineWidth = 3.5; x.lineCap = 'round';
        x.beginPath();
        x.moveTo(sx + Math.cos(a) * 52, sy + Math.sin(a) * 52);
        x.lineTo(sx + Math.cos(a) * len, sy + Math.sin(a) * len);
        x.stroke();
      }
      x.strokeStyle = 'rgba(255,190,110,.9)'; x.lineWidth = 5;
      x.beginPath(); x.arc(sx, sy, 50, 0, TAU); x.stroke();
      x.restore();
    }
    if (!th.moon && !th.corona && !th.stars) {
      x.save(); x.globalCompositeOperation = 'lighter';
      x.translate(sx, sy); x.rotate(t * .025);
      const span = Math.max(W, H) * 1.1;
      for (let i = 0; i < 9; i++) {
        x.rotate(TAU / 9);
        const w = .07 + (i % 3) * .03, a = .045 + Math.sin(t * .4 + i * 1.7) * .02;
        const gr = x.createLinearGradient(0, 0, span, 0);
        gr.addColorStop(0, rgba(th.sunGlow, a)); gr.addColorStop(1, rgba(th.sunGlow, 0));
        x.fillStyle = gr;
        x.beginPath(); x.moveTo(0, 0); x.lineTo(span, -span * w); x.lineTo(span, span * w); x.closePath(); x.fill();
      }
      x.restore();
    }
    x.fillStyle = th.sun;
    x.beginPath(); x.arc(sx, sy, th.moon ? 40 : 52, 0, TAU); x.fill();
    if (th.moon) {
      x.fillStyle = th.sky[1];
      x.beginPath(); x.arc(sx + 17, sy - 9, 36, 0, TAU); x.fill();
    }
    // clouds
    for (const c of this.clouds) {
      const cx = ((c.x - g.cam.x * (.06 + c.d * .1) - t * c.sp * 12) % 3000 + 3000) % 3000 - 300;
      if (cx < -320 || cx > W + 320) continue;
      this.cloud(x, cx, c.y * (H / 900) + 20, c.s, th.cloud, .5 + c.d * .35);
    }
    // birds
    if (!th.stars) for (const b of this.birds) {
      const bx = ((b.x + t * b.sp * 22 - g.cam.x * .12) % 2600 + 2600) % 2600 - 200;
      const by = b.y + Math.sin(t * .8 + b.ph) * 14;
      x.strokeStyle = 'rgba(20,30,50,.35)'; x.lineWidth = 1.6 * b.s; x.lineCap = 'round';
      const f = Math.sin(t * 7 + b.ph) * 5 * b.s;
      x.beginPath();
      x.moveTo(bx - 7 * b.s, by + f); x.quadraticCurveTo(bx, by - 3 * b.s, bx + 7 * b.s, by + f);
      x.stroke();
    }
  },
  cloud(x, cx, cy, s, col, a) {
    x.save(); x.globalAlpha = a * .8;
    const g = x.createLinearGradient(0, cy - 44 * s, 0, cy + 32 * s);
    g.addColorStop(0, col); g.addColorStop(1, shade(col, -.22));
    x.fillStyle = g;
    const blobs = [[0, 0, 46], [-42, 10, 32], [40, 12, 34], [-18, -18, 30], [22, -14, 27], [70, 16, 22], [-70, 16, 20]];
    x.beginPath();
    for (const b of blobs) x.arc(cx + b[0] * s, cy + b[1] * s, b[2] * s, 0, TAU);
    x.fill();
    x.restore();
  },

  /* ---------- parallax hills ---------- */
  parallax(x, g, th, t, horizonY, z) {
    const W = this.W;
    const layers = [
      { p: .12, col: th.far, amp: 46, off: 30, tree: false },
      { p: .28, col: th.mid, amp: 62, off: 6, tree: true },
      { p: .5, col: th.near, amp: 40, off: -22, tree: true }
    ];
    for (let li = 0; li < layers.length; li++) {
      const L = layers[li];
      const base = horizonY + L.off * z;
      x.beginPath();
      x.moveTo(-10, this.H + 10);
      for (let sxp = -10; sxp <= W + 10; sxp += 14) {
        const wx = (sxp - W / 2) / z + g.cam.x;
        const u = wx * L.p;
        const y = base - (Math.sin(u * .0032 + li * 2.1) * L.amp + Math.sin(u * .0071 + li) * L.amp * .45 + Math.sin(u * .0015) * L.amp * .8) * z * .8;
        x.lineTo(sxp, y);
      }
      x.lineTo(W + 10, this.H + 10); x.closePath();
      const grd = x.createLinearGradient(0, base - 120 * z, 0, base + 120 * z);
      grd.addColorStop(0, L.col); grd.addColorStop(1, shade(L.col, -.35));
      x.fillStyle = grd; x.fill();
      if (L.tree) {
        x.save(); x.clip();
        x.fillStyle = shade(L.col, -.25);
        for (let i = 0; i < 60; i++) {
          const wx = (i * 137.3 + hash(i) * 90);
          const sxp = (wx * L.p - g.cam.x * L.p) * z + W / 2;
          if (sxp < -40 || sxp > W + 40) continue;
          const u = wx * L.p;
          const y = base - (Math.sin(u * .0032 + li * 2.1) * L.amp + Math.sin(u * .0071 + li) * L.amp * .45 + Math.sin(u * .0015) * L.amp * .8) * z * .8;
          const hgt = (18 + hash(i * 3) * 22) * z, w = hgt * .42;
          x.beginPath();
          x.moveTo(sxp, y - hgt); x.lineTo(sxp + w, y + 4); x.lineTo(sxp - w, y + 4); x.closePath(); x.fill();
        }
        x.restore();
      }
    }
  },

  /* ---------- ground ---------- */
  ground(x, g, th) {
    const x0 = g.cam.x - 2200, x1 = g.cam.x + 2200;
    const soil = x.createLinearGradient(0, GY, 0, GY + 420);
    soil.addColorStop(0, th.soil1); soil.addColorStop(1, th.soil2);
    x.fillStyle = soil;
    x.fillRect(x0, GY + 16, x1 - x0, 500);
    // grass band with wavy top
    x.beginPath();
    x.moveTo(x0, GY + 40);
    for (let wx = x0; wx <= x1; wx += 12) {
      x.lineTo(wx, GY + Math.sin(wx * .035) * 2.2 + Math.sin(wx * .011) * 3);
    }
    x.lineTo(x1, GY + 40); x.closePath();
    const gg = x.createLinearGradient(0, GY - 8, 0, GY + 40);
    gg.addColorStop(0, th.grass1); gg.addColorStop(1, th.grass2);
    x.fillStyle = gg; x.fill();
    // tufts
    x.strokeStyle = th.grass1; x.lineWidth = 2.4; x.lineCap = 'round';
    const step = 26;
    const s0 = Math.floor(x0 / step) * step;
    for (let wx = s0; wx < x1; wx += step) {
      const h1 = 6 + hash(wx * .07) * 13;
      const sw = Math.sin(g.time * 1.5 + wx * .02) * 2.4;
      x.beginPath();
      x.moveTo(wx, GY + 1); x.quadraticCurveTo(wx + sw, GY - h1 * .6, wx + sw * 2, GY - h1);
      x.stroke();
      if (g.bloomed) {
        const c = ['#ff7ab8', '#fff0b3', '#b18cff', '#ffffff'][(hash(wx) * 4) | 0];
        x.fillStyle = c;
        x.beginPath(); x.arc(wx + sw * 2, GY - h1 - 2, 2.6, 0, TAU); x.fill();
      }
    }
    // rocks
    x.fillStyle = shade(th.soil1, -.25);
    for (let i = 0; i < 34; i++) {
      const wx = x0 + ((i * 271 + Math.floor(x0 / 100) * 13) % (x1 - x0));
      const r = 3 + hash(i * 7) * 6;
      x.beginPath(); x.ellipse(wx, GY + 20 + hash(i) * 60, r, r * .6, 0, 0, TAU); x.fill();
    }
  },

  /* ---------- slingshot ---------- */
  slingBack(x, g) {
    const bx = SLING_X, by = GY;
    x.save();
    // shadow
    x.fillStyle = 'rgba(0,0,0,.25)';
    x.beginPath(); x.ellipse(bx, by + 6, 44, 9, 0, 0, TAU); x.fill();
    const wood = x.createLinearGradient(bx - 16, 0, bx + 16, 0);
    wood.addColorStop(0, '#5c3a1c'); wood.addColorStop(.4, '#8a5a2c'); wood.addColorStop(1, '#41280f');
    x.fillStyle = wood;
    // trunk
    rr(x, bx - 13, by - 96, 26, 100, 8); x.fill();
    // forks
    x.save(); x.translate(bx, by - 92);
    for (const s of [-1, 1]) {
      x.save(); x.rotate(s * .34);
      x.fillStyle = wood;
      rr(x, -10, -66, 20, 74, 8); x.fill();
      x.restore();
    }
    x.restore();
    // grain
    x.strokeStyle = 'rgba(40,22,8,.45)'; x.lineWidth = 1.6;
    for (let i = 0; i < 4; i++) {
      x.beginPath(); x.moveTo(bx - 8 + i * 5, by - 4);
      x.quadraticCurveTo(bx - 6 + i * 5, by - 50, bx - 8 + i * 5, by - 92); x.stroke();
    }
    // back band
    const tips = g.slingTips();
    const p = g.bandPoint();
    x.strokeStyle = '#3a2214'; x.lineWidth = 9; x.lineCap = 'round';
    x.beginPath(); x.moveTo(tips[1].x, tips[1].y); x.lineTo(p.x, p.y); x.stroke();
    x.restore();
  },
  slingFront(x, g) {
    const tips = g.slingTips();
    const p = g.bandPoint();
    x.save();
    x.strokeStyle = '#4a2a18'; x.lineWidth = 9; x.lineCap = 'round';
    x.beginPath(); x.moveTo(tips[0].x, tips[0].y); x.lineTo(p.x, p.y); x.stroke();
    // pouch
    if (g.state === 'aim' || g.state === 'drag') {
      x.fillStyle = '#31200f';
      x.save(); x.translate(p.x, p.y);
      x.rotate(Math.atan2(p.y - (tips[0].y + tips[1].y) / 2, p.x - (tips[0].x + tips[1].x) / 2));
      rr(x, -5, -13, 10, 26, 4); x.fill();
      x.restore();
    }
    x.restore();
  },

  /* ---------- aiming ---------- */
  aim(x, g, t) {
    if (g.state !== 'drag') return;
    const p = g.bandPoint();
    const v = g.launchVel();
    const sp = Math.hypot(v.x, v.y);
    const k = clamp(sp / g.maxSpeed, 0, 1);
    /* trajectory — integrated with the engine's own step:
       v = v*(1-frictionAir) + gravityPerStep, then position += v. */
    const gr = gravityPerStep(g.engine);
    const fa = g.ball ? g.ball.frictionAir : .006;
    const rBall = g.skin.R;
    let px = p.x, py = p.y, vx = v.x, vy = v.y;
    const DOTS = 34, EVERY = 4;
    let drawn = 0;
    for (let i = 0; i < DOTS * EVERY; i++) {
      vx *= (1 - fa); vy = vy * (1 - fa) + gr;
      px += vx; py += vy;
      if (py > GY - rBall) break;
      if (i % EVERY) continue;
      const u = drawn / DOTS; drawn++;
      const a = (1 - u) * .9;
      const rr2 = lerp(4.6, 1.7, u);
      x.fillStyle = `rgba(255,255,255,${a * .8})`;
      x.beginPath(); x.arc(px, py, rr2, 0, TAU); x.fill();
      if (drawn % 4 === 1) {
        x.fillStyle = rgba(RC(g.skin.rar), a * .45);
        x.beginPath(); x.arc(px, py, rr2 * 2.2, 0, TAU); x.fill();
      }
    }
    // power arc
    x.save();
    x.translate(p.x, p.y);
    x.rotate(Math.atan2(v.y, v.x));
    x.globalCompositeOperation = 'lighter';
    x.strokeStyle = rgba(RC(g.skin.rar), .55); x.lineWidth = 4;
    x.beginPath(); x.arc(0, 0, 46, -1.1, -1.1 + 2.2 * k); x.stroke();
    x.restore();
    // stretch line
    x.strokeStyle = `rgba(255,255,255,${.15 + k * .25})`;
    x.setLineDash([6, 8]); x.lineWidth = 2;
    x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(g.slingX, g.slingY); x.stroke();
    x.setLineDash([]);
  },

  /* ---------- DELUGE flood water ---------- */
  water(x, g, t) {
    const f = g.flood;
    if (!f) return;
    const x0 = g.cam.x - 1600, x1 = g.cam.x + 1600;
    const wy = f.y;
    const wave = wx => Math.sin(wx * .012 + t * 2.2) * 7 + Math.sin(wx * .031 - t * 3.1) * 3.5;
    x.save();
    // body of water
    x.beginPath();
    x.moveTo(x0, GY + 420);
    x.lineTo(x0, wy + wave(x0));
    for (let wx = x0; wx <= x1; wx += 16) x.lineTo(wx, wy + wave(wx));
    x.lineTo(x1, GY + 420);
    x.closePath();
    const grd = x.createLinearGradient(0, wy, 0, GY + 200);
    grd.addColorStop(0, 'rgba(110,205,255,.45)');
    grd.addColorStop(.4, 'rgba(30,120,205,.55)');
    grd.addColorStop(1, 'rgba(6,40,90,.75)');
    x.fillStyle = grd;
    x.fill();
    // caustic bands
    x.save();
    x.clip();
    x.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 5; i++) {
      const yy = wy + 30 + i * 58;
      x.strokeStyle = 'rgba(150,225,255,.1)';
      x.lineWidth = 12;
      x.beginPath();
      for (let wx = x0; wx <= x1; wx += 24)
        x.lineTo(wx, yy + Math.sin(wx * .02 + t * 1.6 + i) * 12);
      x.stroke();
    }
    x.restore();
    // surface line + foam
    x.beginPath();
    for (let wx = x0; wx <= x1; wx += 16) x.lineTo(wx, wy + wave(wx));
    x.strokeStyle = 'rgba(215,245,255,.85)';
    x.lineWidth = 3;
    x.stroke();
    x.save();
    x.globalCompositeOperation = 'lighter';
    x.strokeStyle = 'rgba(160,225,255,.35)';
    x.lineWidth = 10;
    x.stroke();
