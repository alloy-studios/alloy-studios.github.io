  // portrait medallion
  ctx.save();
  ctx.beginPath(); ctx.arc(px+42,py+42,29,0,TAU); ctx.fillStyle=C.sea; ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(px+42,py+42,29,0,TAU); ctx.clip();
  drawFigure(ctx,{x:px+42,y:py+86,s:1.5,dir:1,ph:0,walk:0,
    pal:{skin:'#e8b880',cloth:'#d8442f',pants:'#2f4356',accent:'#f0e2c0',hair:'#241a14'},
    hat:'straw',wep:null,aimA:-0.7,coat:true});
  ctx.restore();
  ctx.beginPath(); ctx.arc(px+42,py+42,29,0,TAU); ctx.strokeStyle=INK; ctx.lineWidth=3.4; ctx.stroke();
  ctx.restore();
  // level badge
  ctx.save(); ctx.translate(px+70,py+68);
  star(ctx,0,0,16,8,0.62,T*0.2); inkFill(ctx,C.gold,2.4);
  ctx.font=fD(14); ctx.textAlign='center'; ctx.fillStyle=INK; ctx.fillText(String(PL.lv),0,1);
  ctx.restore();
  // name + bars
  ctx.textAlign='left';
  ctx.font=fU(19,700); ctx.fillStyle=INK;
  ctx.fillText('CAPTAIN', px+82, py+18);
  ctx.font=fU(13,600); ctx.fillStyle='rgba(18,32,44,.62)';
  ctx.fillText(FRUITS[PL.fruit].tag+' USER', px+152, py+18);
  bar(px+82,py+30,pw-96,13,PL.hp/PL.max,C.vermil,C.vermil2,6);
  ctx.font=fU(12,700); ctx.fillStyle=C.paper;
  ctx.fillText(Math.ceil(PL.hp)+' / '+Math.ceil(PL.max), px+88, py+37);
  bar(px+82,py+50,pw-96,9,PL.en/PL.enMax,'#7fd8e8','#3f93aa',0);
  // xp
  bar(px+14,py+ph-19,pw-28,8,PL.xp/PL.xpN,C.gold,C.gold2,0);
  ctx.font=fU(11,700); ctx.fillStyle='rgba(18,32,44,.7)'; ctx.textAlign='right';
  ctx.fillText('XP '+Math.floor(PL.xp)+'/'+PL.xpN, px+pw-16, py+ph-30);

  /* ── beli ── */
  plate(px,py+ph+8,150,34);
  coin(px+22,py+ph+25,11);
  ctx.font=fD(17); ctx.textAlign='left'; ctx.fillStyle=INK;
  ctx.fillText(shortNum(PL.beli), px+40, py+ph+26);
  ctx.font=fU(12,600); ctx.fillStyle='rgba(18,32,44,.55)';
  ctx.fillText('BELI', px+40+ctx.measureText(shortNum(PL.beli)).width+34, py+ph+26);

  /* ── bottom-centre: ability rack ── */
  const F=FRUITS[PL.fruit];
  const slots=[{k:'LMB',nm:'CUTLASS',cd:0,cdm:1,cost:0,melee:true}].concat(
    F.ab.map((a,i)=>({k:a.k,nm:a.nm,cd:PL.cds[i],cdm:a.cd,cost:a.cost})));
  slots.push({k:'SPC',nm:'DASH',cd:PL.dashCd,cdm:0.85,cost:0,dash:true});
  const sw=76, gap=9, tw=slots.length*sw+(slots.length-1)*gap;
  let sx=(W-tw)/2, sy=H-96;
  // fruit nameplate above the rack
  plate(W/2-124,sy-33,248,27,0.95);
  ctx.font=fU(15,700); ctx.textAlign='center'; ctx.fillStyle=INK;
  ctx.fillText(F.nm, W/2, sy-19);
  for(let i=0;i<slots.length;i++){
    const s=slots[i], x=sx+i*(sw+gap);
    const ready=s.cd<=0 && (s.cost===0||PL.en>=s.cost);
    plate(x,sy,sw,sw,ready?0.95:0.72);
    ctx.save();
    ctx.translate(x+sw/2,sy+30);
    if(s.melee){
      ctx.save(); ctx.rotate(-0.6); limb(ctx,-10,6,-4,2,4,'#5a3a22',3);
      ctx.beginPath(); ctx.moveTo(-3,-3); ctx.lineTo(15,-2); ctx.lineTo(19,0); ctx.lineTo(15,2); ctx.lineTo(-3,3); ctx.closePath();
      inkFill(ctx,'#dfe6ea',2.4); ctx.restore();
    }else if(s.dash){
      ctx.strokeStyle=INK; ctx.lineWidth=3;
      for(let k2=0;k2<3;k2++){ ctx.globalAlpha=1-k2*0.28;
        ctx.beginPath(); ctx.moveTo(-14+k2*7,-7); ctx.lineTo(-4+k2*7,0); ctx.lineTo(-14+k2*7,7); ctx.stroke(); }
      ctx.globalAlpha=1;
    }else{
      F.icon(ctx,0,0,1.35);
    }
    ctx.restore();
    // auto-fit the name to the slot rather than truncating it
    ctx.textAlign='center'; ctx.fillStyle=INK;
    let fs=11.5;
    ctx.font=fU(fs,700);
    while(ctx.measureText(s.nm).width>sw-12 && fs>7.5){ fs-=0.5; ctx.font=fU(fs,700); }
    ctx.fillText(s.nm, x+sw/2, sy+sw-13);
    // key cap
    rr(ctx,x+5,sy+5,s.k.length>1?30:20,17,3); ctx.fillStyle=INK; ctx.fill();
    ctx.font=fU(11,700); ctx.fillStyle=C.paper; ctx.textAlign='center';
    ctx.fillText(s.k,x+5+(s.k.length>1?15:10),sy+14);
    if(s.cost){ ctx.font=fU(11,700); ctx.fillStyle=PL.en>=s.cost?'#2f7f96':C.vermil2;
      ctx.textAlign='right'; ctx.fillText(String(s.cost),x+sw-7,sy+14); }
    if(s.cd>0){
      // clipped to the slot's own plate, or the sweep's radius spills past it
      ctx.save();
      platePath(ctx,x,sy,sw,sw); ctx.clip();
      ctx.beginPath(); ctx.moveTo(x+sw/2,sy+sw/2);
      ctx.arc(x+sw/2,sy+sw/2,sw,-PI/2,-PI/2+TAU*(s.cd/s.cdm),false); ctx.closePath();
      ctx.globalAlpha=.55; ctx.fillStyle=INK; ctx.fill(); ctx.restore();
      ctx.font=fD(19); ctx.fillStyle=C.paper; ctx.textAlign='center';
      ctx.fillText(s.cd>1?Math.ceil(s.cd):s.cd.toFixed(1), x+sw/2, sy+sw/2);
    }
  }

  /* ── minimap: a compass rose plate ── */
  const mr=74, mx=W-mr-26, my=mr+26;
  ctx.save();
  ctx.beginPath(); ctx.arc(mx,my,mr+9,0,TAU);
  ctx.fillStyle=C.paper; ctx.globalAlpha=.93; ctx.fill(); ctx.globalAlpha=1;
  ctx.strokeStyle=INK; ctx.lineWidth=3.4; ctx.stroke();
  ctx.beginPath(); ctx.arc(mx,my,mr+4,0,TAU); ctx.lineWidth=1.2; ctx.globalAlpha=.4; ctx.stroke(); ctx.globalAlpha=1;
  // ticks
  ctx.strokeStyle=INK; ctx.lineWidth=1.6;
  for(let i=0;i<16;i++){ const a=i/16*TAU, l=i%4===0?8:4;
    ctx.beginPath(); ctx.moveTo(mx+Math.cos(a)*(mr+2),my+Math.sin(a)*(mr+2));
    ctx.lineTo(mx+Math.cos(a)*(mr+2-l),my+Math.sin(a)*(mr+2-l)); ctx.stroke(); }
  ctx.font=fU(11,700); ctx.textAlign='center'; ctx.fillStyle=INK;
  ctx.fillText('N',mx,my-mr-17); ctx.fillText('S',mx,my+mr+18);
  ctx.fillText('W',mx-mr-17,my); ctx.fillText('E',mx+mr+17,my);
  ctx.save();
  ctx.beginPath(); ctx.arc(mx,my,mr,0,TAU); ctx.clip();
  ctx.fillStyle=C.sea; ctx.fillRect(mx-mr,my-mr,mr*2,mr*2);
  ctx.strokeStyle='rgba(223,241,238,.22)'; ctx.lineWidth=1;
  for(let i=-3;i<=3;i++){ ctx.beginPath(); ctx.moveTo(mx-mr,my+i*17); ctx.lineTo(mx+mr,my+i*17); ctx.stroke(); }
  const sc=mr/2100;
  for(const is of ISLES){
    const ix=mx+(is.x-PL.x)*sc, iy=my+(is.y-PL.y)*sc;
    if(dst(ix,iy,mx,my)>mr+is.R*sc) continue;
    blobPath(ctx,ix,iy,is.sandR,sc);
    ctx.fillStyle=BIOMES[is.biome].grass; ctx.fill();
    ctx.strokeStyle=INK; ctx.lineWidth=1.4; ctx.stroke();
  }
  // objective pin on the minimap
  {
    const tg=objTarget(), ox2=mx+(tg.x-PL.x)*sc, oy2=my+(tg.y-PL.y)*sc;
    if(dst(ox2,oy2,mx,my)<mr-4&&objCur().t!=='done'){
      star(ctx,ox2,oy2,7,5,0.45,T*0.8); inkFill(ctx,C.gold,2);
    }
  }
  for(const e of foes){
    const ex=mx+(e.x-PL.x)*sc, ey=my+(e.y-PL.y)*sc;
    if(dst(ex,ey,mx,my)>mr) continue;
    ctx.fillStyle=e.boss?C.gold:'rgba(216,68,47,.9)';
    ctx.beginPath(); ctx.arc(ex,ey,e.boss?4:2.3,0,TAU); ctx.fill();
  }
  for(const p of pickups){
    const ex=mx+(p.x-PL.x)*sc, ey=my+(p.y-PL.y)*sc;
    if(dst(ex,ey,mx,my)>mr) continue;
    ctx.fillStyle=FRUITS[p.key].cols[1];
    star(ctx,ex,ey,5,4,0.4,T); ctx.fill();
  }
  // player arrow
  ctx.save(); ctx.translate(mx,my); ctx.rotate(PL.boat?PL.boatA:Math.atan2(PL.vy,PL.vx)||0);
  ctx.beginPath(); ctx.moveTo(8,0); ctx.lineTo(-5,5); ctx.lineTo(-2,0); ctx.lineTo(-5,-5); ctx.closePath();
  inkFill(ctx,C.vermil,2); ctx.restore();
  ctx.restore();
  ctx.restore();
  // location name
  const here=isleAt(PL.x,PL.y)||null;
  const near=nearIsle(PL.x,PL.y);
  const label=here?here.name:'OPEN SEA';
  plate(mx-84,my+mr+20,168,30,0.93);
  ctx.font=fU(15,700); ctx.textAlign='center'; ctx.fillStyle=INK;
  ctx.fillText(label,mx,my+mr+36);
  if(!here){
    ctx.font=fU(11,600); ctx.fillStyle='rgba(18,32,44,.6)';
  }

  /* ── voyage tracker: always on, so there is always a stated next step ── */
  {
    const o=objCur(), tis=ISLES[o.isle];
    const qw=286, qx=W-qw-14, qy=my+mr+62;
    const hasBar=o.t==='kill';
    plate(qx,qy,qw,hasBar?82:(o.tip?70:52));
    ctx.textAlign='left'; ctx.font=fU(13,700); ctx.fillStyle=C.vermil2;
    ctx.fillText(o.t==='done'?'VOYAGE COMPLETE':'YOUR VOYAGE  ·  '+tis.name, qx+14, qy+18);
    ctx.font=fU(17,700); ctx.fillStyle=INK;
    let txt=o.txt, fs=17;
    while(ctx.measureText(txt).width>qw-28&&fs>11){ fs-=0.5; ctx.font=fU(fs,700); }
    ctx.fillText(txt, qx+14, qy+39);
    if(hasBar){
      bar(qx+14,qy+50,qw-28,11,PL.objN/o.n,C.gold,C.gold2,o.n);
      ctx.font=fU(12,700); ctx.textAlign='right'; ctx.fillStyle=INK;
      ctx.fillText(PL.objN+' / '+o.n, qx+qw-14, qy+18);
      if(o.tip){ ctx.textAlign='left'; ctx.font=fU(12,600); ctx.fillStyle='rgba(18,32,44,.62)';
        ctx.fillText(o.tip, qx+14, qy+72); }
    }else if(o.tip){
      ctx.font=fU(12,600); ctx.fillStyle='rgba(18,32,44,.62)';
      ctx.fillText(o.tip, qx+14, qy+58);
    }
    // distance to the objective, so "sail east" has a number attached
    if(o.t!=='done'){
      const tg=objTarget(), dd2=Math.round(dst(PL.x,PL.y,tg.x,tg.y));
      ctx.textAlign='right'; ctx.font=fU(12,700); ctx.fillStyle='rgba(18,32,44,.6)';
      if(!hasBar) ctx.fillText(dd2>140?shortNum(dd2)+'m':'ARRIVED', qx+qw-14, qy+18);
    }
  }
  drawObjArrow();

  /* ── boss bar ── */
  const boss=foes.find(e=>e.boss&&e.hp>0&&dst(e.x,e.y,PL.x,PL.y)<820);
  if(boss){
    const bw=Math.min(620,W-120), bx=(W-bw)/2, by=26;
    plate(bx,by,bw,56);
    ctx.textAlign='center'; ctx.font=fD(23); ctx.fillStyle=INK;
    ctx.fillText(boss.nm,W/2,by+20);
    bar(bx+18,by+32,bw-36,13,boss.hp/boss.max,C.vermil,C.vermil2,10);
    ctx.font=fU(12,700); ctx.fillStyle='rgba(18,32,44,.6)'; ctx.textAlign='left';
    ctx.fillText('LV '+boss.lvl, bx+18, by+16);
  }

  /* ── dialogue ── */
  if(msgT>0){
    const a=Math.min(1,msgT*2);
    ctx.save(); ctx.globalAlpha=a;
    const bw=Math.min(640,W-80);
    plate((W-bw)/2,H-206,bw,44);
    ctx.textAlign='center'; ctx.font=fU(19,600); ctx.fillStyle=INK;
    ctx.fillText(msgTxt,W/2,H-184);
    ctx.restore();
  }

  /* ── reticle ── */
  const mtx=mouse.sx, mty=mouse.sy;
  let hot=false;
  for(const e of foes) if(dst(mouse.x,mouse.y,e.x,e.y-e.r)<e.r+18){hot=true;break;}
  ctx.save(); ctx.translate(mtx,mty); ctx.rotate(T*0.5);
  ctx.strokeStyle=hot?C.vermil:INK; ctx.lineWidth=2.4;
  for(let i=0;i<4;i++){ const a=i/4*TAU;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*8,Math.sin(a)*8); ctx.lineTo(Math.cos(a)*15,Math.sin(a)*15); ctx.stroke(); }
  ctx.globalAlpha=.6; ctx.beginPath(); ctx.arc(0,0,11,0,TAU); ctx.lineWidth=1.4; ctx.stroke();
  ctx.restore(); ctx.globalAlpha=1;
  ctx.beginPath(); ctx.arc(mtx,mty,2,0,TAU); ctx.fillStyle=hot?C.vermil:INK; ctx.fill();

  /* ── controls hint, first minute only ── */
  if(T<52&&!boss){
    ctx.save(); ctx.globalAlpha=clamp((52-T)/5,0,1);
    const tips=[
      'WASD move  ·  MOUSE aim  ·  CLICK cutlass  ·  SPACE dash',
      'Q  E  R  cast your Devil Fruit  ·  they cost energy (the blue bar)',
      'F  talk to  !  and take Devil Fruits  ·  M  open the chart',
      'Walk into the sea to board your boat  ·  follow the gold arrow'];
    const s=tips[Math.floor(T/13)%tips.length];
    ctx.font=fU(14,600);
    const bw=ctx.measureText(s).width+34;
    plate(W/2-bw/2,14,bw,30,0.9);
    ctx.textAlign='center'; ctx.fillStyle=INK;
    ctx.fillText(s,W/2,30);
    ctx.restore(); ctx.globalAlpha=1;
  }
}
/* A gold chevron pinned to the screen edge, pointing at the objective whenever
   it is off screen. The single most useful thing for "where do I go". */
function drawObjArrow(){
  const o=objCur(); if(o.t==='done') return;
  const tg=objTarget();
  const sx=(tg.x-cam.x-cam.sx)*ZM+W/2, sy=(tg.y-cam.y-cam.sy)*ZM+H/2;
  // pads are HUD-aware: the arrow must never sit under the rack or the tracker
  const pT=72, pB=Math.min(H*0.34,150), pL=28, pR=Math.min(W*0.42,330);
  if(sx>pL&&sx<W-pR&&sy>pT&&sy<H-pB) return;          // visible: no arrow needed
  const bl=pL, br=W-pR, bt=pT, bb=H-pB;
  const cxm=(bl+br)/2, cym=(bt+bb)/2, a=Math.atan2(sy-cym,sx-cxm);
  const rx=(br-bl)/2, ry=(bb-bt)/2;
  const t=Math.min(Math.abs(rx/Math.cos(a))||1e9,Math.abs(ry/Math.sin(a))||1e9);
  let px=cxm+Math.cos(a)*t, py=cym+Math.sin(a)*t;
  // keep clear of the captain plate in the top-left
  if(px<322&&py<188) py=188;
  const d=Math.round(dst(PL.x,PL.y,tg.x,tg.y));
  ctx.save(); ctx.translate(px,py);
  ctx.save(); ctx.rotate(a);
  ctx.beginPath(); ctx.moveTo(20,0); ctx.lineTo(-10,13); ctx.lineTo(-3,0); ctx.lineTo(-10,-13); ctx.closePath();
  inkFill(ctx,C.gold,3.2);
  ctx.restore();
  ctx.font=fU(12,700); ctx.textAlign='center'; ctx.textBaseline='middle';
  const lbl=tg.is.name+'  '+shortNum(d)+'m';
  const bw=ctx.measureText(lbl).width+20;
  const ly=(py<cym)?30:-30;
  plate(-bw/2,ly-12,bw,24,0.92);
  ctx.fillStyle=INK; ctx.fillText(lbl,0,ly);
  ctx.restore();
}
function drawBanner(){
  if(banT<=0) return;
  const a=Math.min(1,banT*1.6)*Math.min(1,(3.4-banT)*4);
  ctx.save(); ctx.globalAlpha=a;
  ctx.textAlign='center';
  ctx.font=fD(30);
  const bw=Math.max(ctx.measureText(banTxt).width, banSub?0:0)+80;
  ctx.font=fU(14,700);
  const sw2=banSub?ctx.measureText(banSub).width+80:0;
  const w2=Math.min(W-60,Math.max(bw,sw2));
  plate(W/2-w2/2,H*0.225,w2,banSub?66:46,0.95);
  ctx.font=fD(28); ctx.fillStyle=INK;
  ctx.fillText(banTxt,W/2,H*0.225+28);
  if(banSub){ ctx.font=fU(14,700); ctx.fillStyle=C.vermil2;
    ctx.fillText(banSub,W/2,H*0.225+52); }
  ctx.restore(); ctx.globalAlpha=1;
}
/* The chart (M): the one screen that shows the whole world at once — where the
   islands are, what level they want, and where you are heading. */
function drawChart(){
  ctx.save();
  ctx.fillStyle='rgba(11,20,28,.72)'; ctx.fillRect(0,0,W,H);
  const S=Math.min(W-70,H-120), cx=W/2, cy=H/2+12;
  plate(cx-S/2-16,cy-S/2-46,S+32,S+62,0.97);
  ctx.textAlign='center'; ctx.font=fD(24); ctx.fillStyle=INK;
  ctx.fillText('CHART OF THE GRAND LINE',cx,cy-S/2-22);
  ctx.save();
  ctx.beginPath(); ctx.rect(cx-S/2,cy-S/2,S,S); ctx.clip();
  ctx.fillStyle='#cdb88a'; ctx.fillRect(cx-S/2,cy-S/2,S,S);
  // rhumb lines
  ctx.strokeStyle='rgba(18,32,44,.16)'; ctx.lineWidth=1;
  for(let i=0;i<16;i++){ const a=i/16*TAU;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*S,cy+Math.sin(a)*S); ctx.stroke(); }
  const sc=S/(WORLD.r*2.05);
  const MX=x=>cx+x*sc, MY=y=>cy+y*sc;
  const tg=objTarget();
  for(const is of ISLES){
    blobPath(ctx,MX(is.x),MY(is.y),is.sandR,sc);
    ctx.fillStyle=BIOMES[is.biome].sand; ctx.fill();
    ctx.strokeStyle=INK; ctx.lineWidth=2; ctx.stroke();
    blobPath(ctx,MX(is.x),MY(is.y),is.grassR,sc);
    ctx.fillStyle=BIOMES[is.biome].grass; ctx.fill();
    const done=PL.obj>0&&VOYAGE.slice(0,PL.obj).some(v=>v.t==='boss'&&v.isle===is.id);
    const isTarget=ISLES[objCur().isle]===is;
    if(isTarget){
      ctx.strokeStyle=C.gold; ctx.lineWidth=3.4;
      ctx.beginPath(); ctx.arc(MX(is.x),MY(is.y),is.R*sc+13+Math.sin(T*4)*3,0,TAU); ctx.stroke();
    }
    ctx.textAlign='center'; ctx.font=fU(Math.max(11,S*0.026),700);
    const ly=MY(is.y)+is.R*sc+16;
    ctx.strokeStyle=C.paper2; ctx.lineWidth=4; ctx.strokeText(is.name,MX(is.x),ly);
    ctx.fillStyle=INK; ctx.fillText(is.name,MX(is.x),ly);
    ctx.font=fU(Math.max(10,S*0.021),600);
    ctx.fillStyle=PL.lv<is.lv-2?C.vermil2:'rgba(18,32,44,.65)';
    ctx.fillText('LV '+is.lv+'–'+is.lv2+(done?'   ✓':''),MX(is.x),ly+15);
  }
  // your ship
  ctx.save(); ctx.translate(MX(PL.x),MY(PL.y));
  ctx.beginPath(); ctx.arc(0,0,9+Math.sin(T*5)*1.6,0,TAU);
  ctx.fillStyle='rgba(216,68,47,.25)'; ctx.fill();
  ctx.rotate(Math.atan2(PL.vy,PL.vx)||0);
  ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(-6,6); ctx.lineTo(-3,0); ctx.lineTo(-6,-6); ctx.closePath();
  inkFill(ctx,C.vermil,2.4); ctx.restore();
  ctx.restore();
  ctx.textAlign='center'; ctx.font=fU(14,700); ctx.fillStyle='rgba(18,32,44,.7)';
  ctx.fillText('YOU ARE HERE  ·  '+(isleAt(PL.x,PL.y)?isleAt(PL.x,PL.y).name:'OPEN SEA')+'   —   M or TAB to close',cx,cy+S/2+6);
  ctx.restore();
}
function drawDeath(){
  ctx.save();
  ctx.fillStyle='rgba(11,20,28,.68)'; ctx.fillRect(0,0,W,H);
  ctx.translate(W/2,H/2-30);
  ctx.textAlign='center';
  ctx.font=fD(58); ctx.strokeStyle=INK; ctx.lineWidth=12;
  ctx.strokeText('LOST AT SEA',0,0); ctx.fillStyle=C.vermil; ctx.fillText('LOST AT SEA',0,0);
  ctx.font=fU(20,600); ctx.fillStyle=C.paper;
  ctx.fillText('The tide carries you back to shore.',0,44);
  ctx.font=fU(16,600); ctx.fillStyle='rgba(239,224,188,.7)';
  ctx.fillText(PL.respawn>0?('RESPAWNING IN '+Math.ceil(PL.respawn)):'PRESS R',0,76);
  ctx.restore();
}

/* ─────────────────────────── 19. title plate ───────────────────────────── */
function drawTitle(dt){
  drawSea();
  ctx.save(); worldXform();
  drawClouds(dt);
  drawIslands(); drawSurf();
  ctx.restore();
  // sun disc, flat vermilion — the pulp cover move
  ctx.save();
  // rays first, additive and warm, so they read as light rather than grey wedges
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=.22; ctx.fillStyle='#b8532c';
  for(let i=0;i<14;i++){
    const a=T*0.06+i/14*TAU;
    ctx.beginPath(); ctx.moveTo(W*0.5,H*0.34);
    ctx.arc(W*0.5,H*0.34,900,a,a+0.115); ctx.closePath(); ctx.fill();
  }
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  ctx.beginPath(); ctx.arc(W*0.5,H*0.34,132,0,TAU);
  ctx.fillStyle=C.vermil; ctx.fill();
  ctx.strokeStyle=INK; ctx.lineWidth=4; ctx.stroke();
  ctx.restore(); ctx.globalAlpha=1;
  // silhouette ship crossing the disc
  ctx.save();
  const shx=W*0.5+Math.sin(T*0.25)*74, shy=H*0.34+48;
  ctx.translate(shx,shy); ctx.rotate(Math.sin(T*0.8)*0.04); ctx.scale(1.5,1.5);
  ctx.fillStyle=INK;
  ctx.beginPath(); ctx.moveTo(-40,-4); ctx.quadraticCurveTo(-46,12,-24,16);
  ctx.lineTo(30,16); ctx.quadraticCurveTo(48,10,44,-4); ctx.closePath(); ctx.fill();
  ctx.fillRect(-2,-64,5,60);
  ctx.beginPath(); ctx.moveTo(2,-62); ctx.quadraticCurveTo(34,-40,29,-8); ctx.lineTo(2,-8); ctx.closePath(); ctx.fill();
  ctx.restore();
  // title mark
  ctx.save(); ctx.translate(W/2,H*0.60);
  ctx.textAlign='center';
  const s=Math.min(1,W/900);
  ctx.save(); ctx.scale(s,s);
  ctx.font=fD(76);
  ctx.strokeStyle=INK; ctx.lineWidth=17; ctx.lineJoin='round';
  ctx.strokeText('GRAND LINE',0,0);
  ctx.fillStyle=C.paper; ctx.fillText('GRAND LINE',0,0);
  ctx.fillStyle=C.vermil; ctx.globalAlpha=.9;
  ctx.fillRect(-250,16,500,7); ctx.globalAlpha=1;
  ctx.strokeStyle=INK; ctx.lineWidth=2.6; ctx.strokeRect(-250,16,500,7);
  // banner
  ctx.beginPath();
  ctx.moveTo(-186,34); ctx.lineTo(186,34); ctx.lineTo(170,70); ctx.lineTo(-170,70); ctx.closePath();
  inkFill(ctx,C.vermil,3.4);
  ctx.font=fU(27,700); ctx.fillStyle=C.paper;
  ctx.fillText('S E A   O F   F R U I T S',0,54);
  ctx.restore();
  ctx.globalAlpha=.62+Math.sin(T*3)*0.38;
  ctx.font=fU(21,700);
  const pw2=ctx.measureText('PRESS  ENTER  TO  SET  SAIL').width+52;
  plate(-pw2/2,132*s,pw2,40,0.94);
  ctx.fillStyle=INK; ctx.textAlign='center';
  ctx.fillText('PRESS  ENTER  TO  SET  SAIL',0,153*s+5);
  ctx.globalAlpha=1;
  ctx.restore();
}

/* ────────────────────────────── 20. post ───────────────────────────────── */
function post(dt){
  if(flash>0){
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=flash*0.5;
    ctx.fillStyle=flashCol; ctx.fillRect(0,0,W,H); ctx.restore();
    flash=Math.max(0,flash-dt*6.5); ctx.globalAlpha=1;
  }
  // low-health vignette in vermilion, not black — keeps the print warm.
  // The gradient object is cached: rebuilding it per frame was pure waste.
  const hurt=PL.dead?1:clamp(1-PL.hp/PL.max*1.6,0,1);
  const key=(Math.round(hurt*12))+'|'+W+'x'+H;
  if(key!==vigKey){
    vigKey=key;
    vigGrad=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.34,W/2,H/2,Math.max(W,H)*0.76);
    vigGrad.addColorStop(0,'rgba(0,0,0,0)');
    vigGrad.addColorStop(1,hurt>0.05?'rgba(150,30,20,'+(0.30+hurt*0.42)+')':'rgba(8,18,26,0.34)');
  }
  ctx.fillStyle=vigGrad; ctx.fillRect(0,0,W,H);
  // paper grain — this is a print, the tooth belongs. One draw off the
  // pre-tiled sheet, jittered so the tooth crawls rather than sitting still.
  if(grain){
    ctx.save(); ctx.globalCompositeOperation='overlay'; ctx.globalAlpha=.055;
    ctx.drawImage(grain,-Math.floor((T*7)%180),-Math.floor((T*11)%180));
    ctx.restore(); ctx.globalAlpha=1;
  }
}

/* ─────────────────────────── 21. game loop ─────────────────────────────── */
let state='title';
function reset(){
  foes.length=0; parts.length=0; fx.length=0; decals.length=0; floats.length=0;
  pickups.length=0; timers.length=0;
  const st=ISLES[0];
  Object.assign(PL,{x:st.x+st.dock.x*0.90,y:st.y+st.dock.y*0.90,vx:0,vy:0,hp:220,max:220,en:100,enMax:100,
    lv:1,xp:0,xpN:xpNeed(1),
    beli:0,dead:false,fruit:'flame',cds:[0,0,0],dashCd:0,dashT:0,combo:0,atkCd:0,swingT:0,
    iframe:0,kills:0,obj:0,objN:0,lastIsle:st,chart:false,meleeTier:1,trail:[]});
  populate();
  cam.x=PL.x; cam.y=PL.y; T=0; trauma=0; flash=0; banT=0;
  banner('DAWN SHORE','RECOMMENDED  LV 1–8');
  msg('"Welcome to Dawn Shore, rookie. Koby is waiting — follow the gold arrow."');
}
function sim(dt){
  T+=dt;
  if(state==='title'){
    if(just['Enter']||just['NumpadEnter']||just['Space']){ state='play'; reset(); }
    // open water, well clear of every island — this is a sea game's title card
    cam.x=340+Math.sin(T*0.09)*260; cam.y=-2150+Math.cos(T*0.11)*190;
    return;
  }
  updTimers(dt);
  if(msgT>0) msgT-=dt;
  if(banT>0) banT-=dt;
  plUpdate(dt);
  foeUpdate(dt);
  updParts(dt); updDecals(dt); updFloats(dt); updPickups(dt); flushReward(dt);
  for(let i=fx.length-1;i>=0;i--){
    const f=fx[i]; f.t+=dt; if(f.up) f.up(dt);
    if(f.t>=f.dur) fx.splice(i,1);
  }
  // respawn population
  popT-=dt; if(popT<=0){ popT=6; populate(); }
  // sea kings out on the open water
  if(!isleAt(PL.x,PL.y) && foes.filter(f=>f.type==='seaking').length<2 && Math.random()<0.25*dt){
    const a=rnd(TAU), d=rnd(760,560);
    const x=PL.x+Math.cos(a)*d, y=PL.y+Math.sin(a)*d;
    if(!isleAt(x,y)){ const e=spawnFoe('seaking',x,y,null); e.lvl=20+PL.lv;
      burst(x,y,24,{col:C.foam,spd:260,life:.9,r:8,kind:'smoke'}); }
  }
  for(let i=foes.length-1;i>=0;i--){ const e=foes[i];
    if(e.type==='seaking' && dst(e.x,e.y,PL.x,PL.y)>1600) foes.splice(i,1); }
  camUpdate(dt,PL.x,PL.y-30);
}
function draw(dt){
  if(state==='title'){ drawTitle(dt); post(dt); return; }
  figBakeBudget=4;                 // at most a few new figure frames per frame
  drawSea();
  ctx.save(); worldXform();
  drawIslands();
  drawSurf();
  drawDecals();
  drawClouds(dt);
  // ground-plane fx
  for(const f of fx) if(f.z===0) f.dr();
  drawParts(false);
  // pickups + npcs + actors, back to front
  const acts=[];
  for(const e of foes) if(onScreen(e.x,e.y,200)) acts.push({y:e.y,d:()=>drawFoe(e)});
  for(const is of ISLES) if(onScreen(is.npcPos.x,is.npcPos.y,120)) acts.push({y:is.npcPos.y,d:()=>drawNPC(is)});
  for(const p of pickups) if(onScreen(p.x,p.y,120)) acts.push({y:p.y,d:()=>drawFruit(ctx,SX(p.x),SY(p.y),p.key,p.t)});
  if(!PL.dead) acts.push({y:PL.y,d:drawPlayer});
  acts.sort((a,b)=>a.y-b.y);
  for(const a of acts) a.d();
  // over-plane fx
  for(const f of fx) if(f.z===1) f.dr();
  drawParts(true);
  drawFloats();
  // pickup prompt
  for(const p of pickups) if(dst(p.x,p.y,PL.x,PL.y)<58) prompt3(SX(p.x),SY(p.y)-86,'F','TAKE FRUIT');
  ctx.restore();
  // screen-space pass: impact frames sit over the world, under the interface
  for(const f of fx) if(f.z===2) f.dr();
  drawHUD();
  drawBanner();
  if(PL.chart) drawChart();
  if(PL.dead) drawDeath();
  post(dt);
}
function tick(dt){
  RT+=dt;
  if(hitstop>0){ hitstop-=dt; dt*=0.08; }
  sim(dt); draw(dt);
  just=Object.create(null); mouse.clicked=false;
}
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(!W||!ready){ resize(); }
  if(W&&ready) tick(dt);
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{});

/* test / inspection hook — the preview pane does not run rAF */
window.__t={
  reset,
  step:(n,dt)=>{ for(let i=0;i<(n||1);i++) tick(dt||1/60); },
  forceSize:(w,h)=>applySize(w,h),
  start:()=>{ state='play'; reset(); },
  set:o=>{ if(o.mouse){mouse.sx=o.mouse[0];mouse.sy=o.mouse[1];}
           if(o.keys) for(const k in o.keys) keys[k]=o.keys[k];
           if(o.press) for(const k of o.press) just[k]=true;
           if(o.down!==undefined) mouse.down=o.down;
           if(o.pl) Object.assign(PL,o.pl);
           if(o.state) state=o.state; },
  spawn:(t,dx,dy,b)=>spawnFoe(t,PL.x+(dx||120),PL.y+(dy||0),isleAt(PL.x,PL.y),b),
  fruit:k=>{PL.fruit=k;PL.cds=[0,0,0];},
  get:()=>({state,W,H,lv:PL.lv,hp:Math.round(PL.hp),en:Math.round(PL.en),beli:PL.beli,
    x:Math.round(PL.x),y:Math.round(PL.y),boat:PL.boat,fruit:PL.fruit,
    foes:foes.length,fx:fx.length,parts:parts.length,decals:decals.length,T:+T.toFixed(2)})
};
</script>
