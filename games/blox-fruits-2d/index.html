<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>GRAND LINE — Sea of Fruits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b141c;overflow:hidden;
    -webkit-user-select:none;user-select:none;touch-action:none;}
  canvas{display:block;width:100vw;height:100vh;cursor:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ══════════════════════════════════════════════════════════════════════════
   GRAND LINE — SEA OF FRUITS
   ──────────────────────────────────────────────────────────────────────────
   THESIS   A sun-bleached pirate sea drawn like a woodblock adventure print:
            flat inked shapes, bold silhouettes, a horizon of carved waves —
            and Devil Fruit powers that detonate as bursts of raw pigment
            across the page. Calm and graphic; violent only where pigment lands.
   ANCHOR   Hokusai's wave prints (carved crest lines, flat tonal bands, one hot
            accent) crossed with 1970s pulp adventure paperback covers (slab
            type, vermilion banners, cream paper stock).
   PALETTE  INK #12202c — every outline and letter, the carving block
            ABYSS #14304a · SEA #1f5273 · SHELF #3e8aa6 · FOAM #dff1ee
            PAPER #efe0bc — all UI surfaces · SAND #e0c184
            LEAF #4d8e52 / #356a40
            VERMIL #d8442f — THE accent: player sash, damage, danger. Nothing
            else is allowed to be this red.
            GOLD #f0b03c — berries, xp, reward.
            Fruit pigments are the only colours outside this set, and only
            while an ability is on screen.
   TYPE     Alfa Slab One — title mark, numerals, boss names (pulp slab)
            Barlow Condensed 600/700 — all UI text (broadsheet condensed)
            fallback: Impact / Haettenschweiler / Arial Narrow
   LEGIBILITY
            · The player is the only figure in VERMIL wearing a straw hat, and
              the only one with a cream rim-light. Always findable.
            · Enemies are cool and desaturated with one red eye dot; bosses are
              ~2x scale with gold trim and a named bar.
            · Pickups are GOLD and are the only things that bob and pulse.
            · Shapes: living things = round capsules; hazards/telegraphs = hard
              angular rings; UI = rectangles with notched corners.
            · Numeral size hierarchy: crit > hit > heal > pickup.
   ══════════════════════════════════════════════════════════════════════════ */
'use strict';

/* ───────────────────────────── 0. utility ──────────────────────────────── */
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a=1,b=0)=>b+Math.random()*(a-b);
const rint=(a,b)=>Math.floor(rnd(a,b));
const pick=a=>a[(Math.random()*a.length)|0];
const dst=(x,y,X,Y)=>Math.hypot(X-x,Y-y);
const angTo=(x,y,X,Y)=>Math.atan2(Y-y,X-x);
const easeOutCubic=t=>1-Math.pow(1-t,3);
const easeOutQuint=t=>1-Math.pow(1-t,5);
const easeInQuad=t=>t*t;
const easeOutBack=t=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
function hash(n){const s=Math.sin(n*12.9898)*43758.5453;return s-Math.floor(s);}
function noise1(x,sd){sd=sd||0;const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);
  return lerp(hash(i+sd*137.31),hash(i+1+sd*137.31),u);}
function shade(hex,d){
  const n=parseInt(hex.slice(1),16);
  const r=clamp(((n>>16)&255)+d,0,255),g=clamp(((n>>8)&255)+d,0,255),b=clamp((n&255)+d,0,255);
  return '#'+(((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1));
}
function shortNum(n){n=Math.floor(n);if(n>=1e6)return (n/1e6).toFixed(1)+'M';if(n>=1e4)return (n/1e3).toFixed(1)+'K';return String(n);}
function rngSeed(s){let t=(s*9301+49297)%233280;return()=>{t=(t*9301+49297)%233280;return t/233280;};}
function angDiff(a,b){let d=(b-a)%TAU; if(d>PI)d-=TAU; if(d<-PI)d+=TAU; return d;}

/* ───────────────────────────── 1. palette ──────────────────────────────── */
const INK='#12202c';
const C={
  abyss:'#14304a', sea:'#1f5273', sea2:'#26638a', shelf:'#3e8aa6', shelf2:'#5cadbe',
  foam:'#dff1ee', paper:'#efe0bc', paper2:'#ddc79a', sand:'#e0c184', sand2:'#c9a463',
  leaf:'#4d8e52', leaf2:'#356a40', vermil:'#d8442f', vermil2:'#9e2d1f',
  gold:'#f0b03c', gold2:'#c0801c', bone:'#ece5d1'
};
const FONT_D='"Alfa Slab One", Impact, Haettenschweiler, serif';
const FONT_U='"Barlow Condensed", Impact, "Arial Narrow", sans-serif';
const fD=s=>s+'px '+FONT_D;
const fU=(s,w)=>(w||700)+' '+s+'px '+FONT_U;

/* ───────────────────────────── 2. canvas ───────────────────────────────── */
const cv=document.getElementById('c');
const ctx=cv.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1,ready=false,grain=null;

/* The grain is pre-tiled to the full viewport once, so the frame costs ONE
   composited draw instead of ~70 — tiling per frame under a blend mode was by
   far the most expensive thing in the renderer. */
function makeGrain(){
  const S=180,t=document.createElement('canvas');t.width=t.height=S;
  const gx=t.getContext('2d'),im=gx.createImageData(S,S),d=im.data;
  for(let i=0;i<S*S;i++){const v=128+(Math.random()*2-1)*58;
    d[i*4]=v;d[i*4+1]=v;d[i*4+2]=v;d[i*4+3]=255;}
  gx.putImageData(im,0,0);
  const g=document.createElement('canvas');
  g.width=Math.max(2,W+S); g.height=Math.max(2,H+S);
  const c=g.getContext('2d');
  for(let x=0;x<g.width;x+=S) for(let y=0;y<g.height;y+=S) c.drawImage(t,x,y);
  grain=g;
}
let vigGrad=null, vigKey='';
function applySize(iw,ih){
  if(iw<2||ih<2) return;
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=Math.round(iw);H=Math.round(ih);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.lineJoin='round';ctx.lineCap='round';
  makeGrain(); vigGrad=null; vigKey='';
  SPR.clear(); sprBytes=0; sprBiome='';   // sprites are DPR-specific
  ready=true;
}
function resize(){ applySize(window.innerWidth||0, window.innerHeight||0); }
addEventListener('resize',resize);

/* ───────────────────────────── 3. input ────────────────────────────────── */
const keys=Object.create(null); let just=Object.create(null);
const mouse={sx:0,sy:0,x:0,y:0,down:false,clicked:false};
addEventListener('keydown',e=>{
  if(!keys[e.code]) just[e.code]=true;
  keys[e.code]=true;
  if(['Space','KeyQ','KeyE','KeyR','KeyF','Tab'].indexOf(e.code)>=0) e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.down=false;});
function mpos(e){const r=cv.getBoundingClientRect();mouse.sx=e.clientX-r.left;mouse.sy=e.clientY-r.top;}
cv.addEventListener('mousemove',mpos);
cv.addEventListener('mousedown',e=>{mpos(e);mouse.down=true;mouse.clicked=true;});
addEventListener('mouseup',()=>{mouse.down=false;});
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ───────────────────────────── 4. camera ───────────────────────────────── */
const cam={x:0,y:0,sx:0,sy:0};
let ZM=1.5;                       // world zoom — figures need presence on screen
let trauma=0,hitstop=0,flash=0,flashCol='#ffffff',T=0;
let RT=0;   // real seconds, unscaled by hitstop — impact frames must cut on time
const addTrauma=v=>{trauma=Math.min(1,trauma+v);};
const addFlash=(a,c)=>{if(a>flash){flash=a;flashCol=c||'#ffffff';}};
function camUpdate(dt,tx,ty){
  const k=1-Math.pow(0.0009,dt);
  cam.x=lerp(cam.x,tx,k); cam.y=lerp(cam.y,ty,k);
  trauma=Math.max(0,trauma-1.6*dt);
  const s=trauma*trauma;
  cam.sx=(Math.random()*2-1)*s*40; cam.sy=(Math.random()*2-1)*s*40;
}
const SX=x=>x-cam.x-cam.sx+W/2;
const SY=y=>y-cam.y-cam.sy+H/2;
const onScreen=(x,y,m)=>{m=(m||140)/ZM;const a=SX(x),b=SY(y),hw=W/(2*ZM),hh=H/(2*ZM);
  return a>W/2-hw-m&&a<W/2+hw+m&&b>H/2-hh-m&&b<H/2+hh+m;};
function worldXform(){ ctx.translate(W/2,H/2); ctx.scale(ZM,ZM); ctx.translate(-W/2,-H/2); }

/* ───────────────────────── 5. draw primitives ──────────────────────────── */
/* limb(): ink stroke then colour stroke over the SAME geometry, so the
   outline can never drift from its fill. */
function limb(g,x1,y1,x2,y2,w,col,ow){
  g.lineCap='round';
  g.strokeStyle=INK; g.lineWidth=w+(ow===undefined?4.5:ow);
  g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke();
  g.strokeStyle=col; g.lineWidth=w;
  g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke();
}
function rr(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h); g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y); g.closePath();
}
function ell(g,x,y,rx,ry,rot){ g.beginPath(); g.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,TAU); }
function inkFill(g,fill,lw){ if(fill){g.fillStyle=fill;g.fill();} if(lw!==0){g.strokeStyle=INK;g.lineWidth=lw||3;g.stroke();} }
/* tapered ribbon: thin tail → belly ~40% → thin head (loaded brush) */
function ribbon(g,pts,width,col,alpha){
  const n=pts.length>>1; if(n<3) return;
  const L=[],R=[];
  for(let i=0;i<n;i++){
    const x=pts[i*2],y=pts[i*2+1];
    const j=Math.min(n-1,i+1),k=Math.max(0,i-1);
    let dx=pts[j*2]-pts[k*2],dy=pts[j*2+1]-pts[k*2+1];
    const m=Math.hypot(dx,dy)||1; dx/=m; dy/=m;
    const t=i/(n-1);
    const w=width*Math.pow(Math.sin(Math.pow(t,0.62)*PI),0.78);
    L.push(x-dy*w,y+dx*w); R.push(x+dy*w,y-dx*w);
  }
  g.beginPath(); g.moveTo(L[0],L[1]);
  for(let i=1;i<n;i++) g.lineTo(L[i*2],L[i*2+1]);
  for(let i=n-1;i>=0;i--) g.lineTo(R[i*2],R[i*2+1]);
  g.closePath();
  g.globalAlpha=alpha===undefined?1:alpha; g.fillStyle=col; g.fill(); g.globalAlpha=1;
}
function boltPath(g,x1,y1,x2,y2,amp,seg,seed){
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;
  g.beginPath(); g.moveTo(x1,y1);
  for(let i=1;i<seg;i++){
    const t=i/seg,o=(hash(seed+i*7.7)*2-1)*amp*Math.sin(t*PI);
    g.lineTo(x1+dx*t+nx*o,y1+dy*t+ny*o);
  }
  g.lineTo(x2,y2);
}
function blobPath(g,cx,cy,rads,scale){
  const n=rads.length; scale=scale||1;
  g.beginPath();
  let px=cx+rads[0]*scale, py=cy;
  g.moveTo(px,py);
  for(let i=0;i<n;i++){
    const a=(i+1)/n*TAU, r=rads[(i+1)%n]*scale;
    const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
    const am=(i+0.5)/n*TAU, rm=(rads[i%n]+rads[(i+1)%n])*0.5*scale*1.02;
    g.quadraticCurveTo(cx+Math.cos(am)*rm, cy+Math.sin(am)*rm, x, y);
  }
  g.closePath();
}
function star(g,cx,cy,r,n,inner,rot){
  g.beginPath();
  for(let i=0;i<n*2;i++){
    const a=rot+i/(n*2)*TAU, q=(i&1)?r*inner:r;
    const x=cx+Math.cos(a)*q,y=cy+Math.sin(a)*q;
    i?g.lineTo(x,y):g.moveTo(x,y);
  }
  g.closePath();
}
function shardPath(g,x,y,r,rot,seed){
  g.beginPath();
  for(let i=0;i<6;i++){
    const a=rot+i/6*TAU, q=r*(0.55+hash(seed+i)*0.65);
    const px=x+Math.cos(a)*q, py=y+Math.sin(a)*q;
    i?g.lineTo(px,py):g.moveTo(px,py);
  }
  g.closePath();
}

/* ───────────────────────── 6. world definition ─────────────────────────── */
const WORLD={r:7400};
const BIOMES={
  green :{sand:'#e0c184',sand2:'#c9a463',grass:'#4d8e52',grass2:'#3a6f42',tree:'#2f6b3c',tree2:'#478a48',trunk:'#6b4a2e',rock:'#7d8794'},
  navy  :{sand:'#ddd2ab',sand2:'#c3b489',grass:'#6f9a5a',grass2:'#557a46',tree:'#3a7044',tree2:'#4f8a4e',trunk:'#6b4a2e',rock:'#828c99'},
  snow  :{sand:'#cfe0e8',sand2:'#a9c3d0',grass:'#eef6fa',grass2:'#cfe1ec',tree:'#2b5b56',tree2:'#3d7a6f',trunk:'#4a3a33',rock:'#8ea6b6'},
  bone  :{sand:'#c9b88f',sand2:'#ab9a72',grass:'#6f6f55',grass2:'#565a44',tree:'#4a4a3c',tree2:'#5f6050',trunk:'#4a4038',rock:'#9a9382'},
  ash   :{sand:'#4e3c35',sand2:'#3a2c28',grass:'#5d3a31',grass2:'#432823',tree:'#3a2420',tree2:'#4d2f28',trunk:'#2e1d1a',rock:'#6b544c'}
};
/* Islands are big enough to be places you walk around in, not tokens you stand
   on: ~2.4x the old radius, spread over a much wider sea. lv1/lv2 are the
   recommended level band, shown on the chart and on arrival. */
const ISLES=[
  {id:0,name:'DAWN SHORE',    x:    0,y:    0,R: 980,biome:'green',lv: 1,lv2: 8,foe:'bandit',pop:16,boss:null,     npc:'KOBY THE LOOKOUT'},
  {id:1,name:'MARINE POST',   x: 3600,y:-1700,R:1050,biome:'navy', lv: 9,lv2:19,foe:'marine',pop:20,boss:'morgan', npc:'DESERTER JANGO'},
  {id:2,name:'FROSTBITE ISLE',x:-3800,y:-3100,R:1020,biome:'snow', lv:20,lv2:33,foe:'frost', pop:20,boss:'wapol',  npc:'DOCTOR KUREHA'},
  {id:3,name:'SKULL BAY',     x: 4200,y: 3300,R:1080,biome:'bone', lv:34,lv2:51,foe:'skele', pop:22,boss:'moria',  npc:'GRAVE-KEEPER BROOK'},
  {id:4,name:'VOLCANO CROWN', x:-3000,y: 4200,R:1120,biome:'ash',  lv:52,lv2:80,foe:'magma', pop:22,boss:'akainu', npc:'SMITH WAYLAND'}
];

function buildIsle(is){
  const rng=rngSeed(is.id*77+13);
  const N=72, sandR=[], grassR=[];
  const a1=rng()*TAU,a2=rng()*TAU,a3=rng()*TAU;
  for(let i=0;i<N;i++){
    const t=i/N*TAU;
    const w=Math.sin(t*3+a1)*0.055+Math.sin(t*5+a2)*0.032+Math.sin(t*2+a3)*0.05+Math.sin(t*7+a1*2)*0.017;
    sandR.push(is.R*(1+w));
    grassR.push(is.R*(1+w)*(0.74+Math.sin(t*4+a2)*0.035));
  }
  is.sandR=sandR; is.grassR=grassR;
  is.radAt=a=>{ let i=((a/TAU)%1+1)%1*N; const i0=Math.floor(i)%N,i1=(i0+1)%N,f=i-Math.floor(i);
    return lerp(sandR[i0],sandR[i1],f); };
  is.grassAt=a=>{ let i=((a/TAU)%1+1)%1*N; const i0=Math.floor(i)%N,i1=(i0+1)%N,f=i-Math.floor(i);
    return lerp(grassR[i0],grassR[i1],f); };
  // props
  const props=[]; const B=BIOMES[is.biome];
  // grove-clustered placement with strong size variance, so the canopy has
  // focal points instead of reading as evenly-spaced wallpaper
  const K=is.R/450;                       // content scale vs. the original size
  const groves=[];
  for(let i=0;i<Math.round(11*K);i++){ const a=rng()*TAU, r=0.34+rng()*0.54;
    groves.push({x:Math.cos(a)*is.grassAt(a)*r,y:Math.sin(a)*is.grassAt(a)*r,s:(0.75+rng()*0.8)*K}); }
  // meadows: explicit holes in the canopy, so the island has places to fight in
  /* Clearing radius scales with the island, so their COUNT must stay near
     constant or they swallow the whole map (scaling both covered >100% of it). */
  const clearings=[{x:0,y:0,r:150*K}];
  for(let i=0;i<4;i++){ const a=rng()*TAU, r=0.30+rng()*0.56;
    clearings.push({x:Math.cos(a)*is.grassAt(a)*r,y:Math.sin(a)*is.grassAt(a)*r,r:(56+rng()*46)*K}); }
  is.clearings=clearings;
  const tries=Math.round((is.biome==='ash'?150:190)*K*K);
  for(let i=0;i<tries;i++){
    let x,y;
    if(rng()<0.68){
      const G=pick(groves), sp=125*G.s/K;
      x=G.x+(rng()*2-1)*sp*K; y=G.y+(rng()*2-1)*sp*K;
    }else{
      const a=rng()*TAU, rr2=Math.sqrt(rng())*0.93;
      x=Math.cos(a)*is.grassAt(a)*rr2; y=Math.sin(a)*is.grassAt(a)*rr2;
    }
    const a2=Math.atan2(y,x), d=Math.hypot(x,y);
    const gr2=is.grassAt(a2);
    if(d>gr2*0.95){
      // driftwood and boulders scattered up the beach, so the sand isn't bare
      if(d<is.radAt(a2)*0.94 && rng()<0.24)
        props.push({x,y,kind:rng()<0.65?'rock':'tuft',s:(0.5+rng()*0.7)*K*0.8,seed:rng()*999,tint:rng()});
      continue;
    }
    let inClear=false;
    for(const c of clearings) if(dst(x,y,c.x,c.y)<c.r){ inClear=true; break; }
    if(inClear) continue;
    const roll=rng();
    let kind='tree', s;
    if(roll>0.78){ kind='rock'; s=0.5+rng()*1.05; }
    else if(roll>0.58){ kind='tuft'; s=0.7+rng()*0.9; }
    else { s=0.62+Math.pow(rng(),2.0)*1.5; }       // mostly small, a few giants
    // canopies must not merge into one mass — enforce breathing room
    let tooClose=false;
    for(const q of props) if(q.kind==='tree'&&kind==='tree'&&dst(x,y,q.x,q.y)<24*(s+q.s)*0.5){ tooClose=true; break; }
    if(tooClose) continue;
    props.push({x,y,kind,s,seed:rng()*999,tint:rng()});
  }
  /* Outlying camps. A 2000-across island with nothing but grass gives the eye
     nothing to steer by — these are the landmarks you navigate between. */
  for(let i=1;i<clearings.length;i++){
    const c=clearings[i];
    props.push({x:c.x+c.r*0.35,y:c.y-c.r*0.2,kind:'hut',s:1.0+K*0.26,seed:rng()*999,tint:rng()});
    props.push({x:c.x-c.r*0.4,y:c.y+c.r*0.3,kind:'rock',s:1.5*K,seed:rng()*999,tint:rng()});
    if(rng()<0.6) props.push({x:c.x+c.r*0.1,y:c.y+c.r*0.45,kind:'hut',s:0.8+K*0.18,seed:rng()*999,tint:rng()});
  }
  // dock points toward world origin (or outward for the home isle)
  const da=is.id===0? -PI/2 : angTo(is.x,is.y,0,0);
  is.dock={a:da,x:Math.cos(da)*is.radAt(da)*1.0,y:Math.sin(da)*is.radAt(da)*1.0};
  props.sort((a,b)=>a.y-b.y);
  is.props=props; is.rng=rng; is.K=K;
  // spawn points spread right across the island, not bunched at the middle
  is.spawnPts=[];
  for(let i=0;i<70;i++){
    const a=rng()*TAU, rr2=0.16+Math.sqrt(rng())*0.76;
    is.spawnPts.push({x:is.x+Math.cos(a)*is.grassAt(a)*rr2, y:is.y+Math.sin(a)*is.grassAt(a)*rr2});
  }
  // the NPC stands just inland of the dock, where you actually make landfall
  const na=da+0.22;
  is.npcPos={x:is.x+Math.cos(na)*is.grassAt(na)*0.80, y:is.y+Math.sin(na)*is.grassAt(na)*0.80};
  is.tone=[];
  for(let i=0;i<Math.round(9*K);i++){
    const a=rng()*TAU,r=rng()*is.R*0.66;
    is.tone.push({x:Math.cos(a)*r,y:Math.sin(a)*r,rx:(40+rng()*70)*K,ry:(26+rng()*40)*K,rot:rng()*PI});
  }
}

function drawTree(g,x,y,s,B,seed,dead){
  g.save(); g.translate(x,y); g.scale(s,s);
  // cast shadow
  g.globalAlpha=.2; g.fillStyle=INK; ell(g,7,4,20,8); g.fill(); g.globalAlpha=1;
  limb(g,0,2,-1,-24,7,B.trunk,4);
  if(dead){
    limb(g,-1,-16,-14,-30,4.5,B.trunk,3.5);
    limb(g,-1,-20,12,-32,4.5,B.trunk,3.5);
    limb(g,-14,-30,-20,-40,3,B.trunk,3);
  }else{
    const lobes=[[0,-40,22,17],[-16,-31,15,12],[16,-31,15,12],[-7,-50,14,11],[9,-48,13,10]];
    // single silhouette first so outlines never cross inside the canopy
    g.beginPath();
    for(const L of lobes){ g.moveTo(L[0]+L[2],L[1]); g.ellipse(L[0],L[1],L[2],L[3],0,0,TAU); }
    g.fillStyle=INK; g.strokeStyle=INK; g.lineWidth=6.5; g.stroke(); g.fill();
    g.beginPath();
    for(const L of lobes){ g.moveTo(L[0]+L[2],L[1]); g.ellipse(L[0],L[1],L[2],L[3],0,0,TAU); }
    g.fillStyle=B.tree; g.fill();
    // light side
    g.save(); g.beginPath();
    for(const L of lobes){ g.moveTo(L[0]+L[2],L[1]); g.ellipse(L[0],L[1],L[2],L[3],0,0,TAU); }
    g.clip();
    g.fillStyle=B.tree2; g.beginPath(); g.ellipse(-9,-46,20,16,0,0,TAU); g.fill();
    g.restore();
  }
  g.restore();
}
function drawRock(g,x,y,s,B,seed){
  g.save(); g.translate(x,y); g.scale(s,s);
  g.globalAlpha=.2; g.fillStyle=INK; ell(g,5,3,17,6); g.fill(); g.globalAlpha=1;
  const n=7,rads=[];
  for(let i=0;i<n;i++) rads.push(13*(0.72+hash(seed+i*3.3)*0.6));
  blobPath(g,0,-5,rads,1); inkFill(g,B.rock,3.5);
  g.save(); blobPath(g,0,-5,rads,1); g.clip();
  g.fillStyle='rgba(255,255,255,.22)'; g.beginPath(); g.ellipse(-5,-11,9,6,-.5,0,TAU); g.fill();
  g.restore(); g.restore();
}
function drawTuft(g,x,y,s,B,seed){
  g.save(); g.translate(x,y); g.scale(s,s);
  g.strokeStyle=B.grass2; g.lineWidth=2.6;
  for(let i=0;i<5;i++){
    const o=(i-2)*4.5, h=9+hash(seed+i)*7;
    g.beginPath(); g.moveTo(o,0); g.quadraticCurveTo(o+(i-2)*1.5,-h*0.6,o+(i-2)*4,-h); g.stroke();
  }
  g.restore();
}
function drawHut(g,x,y,s,B){
  g.save(); g.translate(x,y); g.scale(s,s);
  g.globalAlpha=.22; g.fillStyle=INK; ell(g,8,6,30,11); g.fill(); g.globalAlpha=1;
  rr(g,-22,-26,44,30,3); inkFill(g,C.paper2,3.5);
  g.beginPath(); g.moveTo(-30,-24); g.lineTo(0,-48); g.lineTo(30,-24); g.closePath();
  inkFill(g,C.vermil2,3.5);
  rr(g,-7,-14,14,18,2); inkFill(g,'#6b4a2e',3);
  g.restore();
}
function drawDock(g,x,y,a,s){
  g.save(); g.translate(x,y); g.rotate(a); g.scale(s||1,s||1);
  g.globalAlpha=.22; g.fillStyle=INK; g.fillRect(-4,-16,110,36); g.globalAlpha=1;
  rr(g,-6,-20,116,34,2); inkFill(g,'#9a713f',3.5);
  g.strokeStyle='rgba(18,32,44,.45)'; g.lineWidth=2;
  for(let i=0;i<7;i++){ g.beginPath(); g.moveTo(8+i*15,-19); g.lineTo(8+i*15,13); g.stroke(); }
  for(const px of [4,100]){ for(const py of [-20,14]){
    g.beginPath(); g.arc(px,py,5,0,TAU); inkFill(g,'#6b4a2e',3); } }
  g.restore();
}

/* ── prop sprite cache ──────────────────────────────────────────────────
   Trees and rocks were the single biggest cost in the renderer: ~9 draw calls
   each INCLUDING a clip() (the most expensive Canvas2D op), ~150 on screen.
   Each distinct prop is now rasterised once at exactly DPR*ZM device pixels
   and blitted 1:1 — no resampling, so the pixels are identical to drawing it
   directly. Scale is quantised to 1/8 steps; at these sizes that is not a
   visible difference, and nothing else about the art changes.
   Keyed per biome and dropped wholesale when you sail to a different one, so
   only the island you are standing on is ever resident. */
const SPR=new Map(); let sprBiome='', sprBytes=0, SPR_OFF=false;
/* Bake a drawing into a canvas at exactly DPR*ZM device pixels, cropped to what
   it actually paints. Blitted 1:1 on a whole device pixel this is lossless —
   verified pixel-for-pixel against drawing the same shape directly. */
function bakeSprite(wU,hU,ax,ay,drawFn){
  const px=DPR*ZM;
  const cw=Math.max(1,Math.ceil(wU*px)), ch=Math.max(1,Math.ceil(hU*px));
  const axPx=Math.round(ax*px), ayPx=Math.round(ay*px);
  const tmp=document.createElement('canvas'); tmp.width=cw; tmp.height=ch;
  const g=tmp.getContext('2d');
  g.lineJoin='round'; g.lineCap='round';
  g.setTransform(px,0,0,px,axPx,ayPx);
  drawFn(g);
  const d=g.getImageData(0,0,cw,ch).data;
  let x0=cw,y0=ch,x1=-1,y1=-1;
  for(let y=0;y<ch;y++){ const r=y*cw;
    for(let x=0;x<cw;x++) if(d[(r+x)*4+3]>2){
      if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  if(x1<0){ x0=0;y0=0;x1=0;y1=0; }
  const nw=x1-x0+1, nh=y1-y0+1;
  const c=document.createElement('canvas'); c.width=nw; c.height=nh;
  c.getContext('2d').drawImage(tmp,x0,y0,nw,nh,0,0,nw,nh);
  return {cv:c,cw:nw,ch:nh,axPx:axPx-x0,ayPx:ayPx-y0,bytes:nw*nh*4};
}
/* Blit a baked sprite at a world point, snapped to whole device pixels so the
   copy stays 1:1. Caller must already be in device space. */
function blitSprite(g,sp,wx,wy){
  const sxp=(wx-W/2)*ZM+W/2, syp=(wy-H/2)*ZM+H/2;
  g.drawImage(sp.cv,Math.round(sxp*DPR-sp.axPx)/DPR,Math.round(syp*DPR-sp.ayPx)/DPR,
    sp.cw/DPR,sp.ch/DPR);
}
function sprite(key,wU,hU,ax,ay,drawFn){
  let s=SPR.get(key);
  if(s) return s;
  const px=DPR*ZM;
  /* The canvas is an integral number of device pixels and the blit size is
     derived back FROM that count, so source and destination match exactly.
     Deriving the size the other way (ceil, then blit at the requested size)
     scales the sprite by a fraction and softens every edge. */
  const cw=Math.max(1,Math.ceil(wU*px)), ch=Math.max(1,Math.ceil(hU*px));
  const axPx=Math.round(ax*px), ayPx=Math.round(ay*px);
  const tmp=document.createElement('canvas'); tmp.width=cw; tmp.height=ch;
  const g=tmp.getContext('2d');
  g.lineJoin='round'; g.lineCap='round';
  g.setTransform(px,0,0,px,axPx,ayPx);   // translation is device px, post-scale
  drawFn(g);
  /* Crop to the bounds actually painted. Hand-guessed boxes either clip the
     art or leave transparent margin that still costs fill on every blit;
     measuring it is exact and needs no per-shape bookkeeping. */
  const d=g.getImageData(0,0,cw,ch).data;
  let x0=cw,y0=ch,x1=-1,y1=-1;
  for(let y=0;y<ch;y++){ const r=y*cw;
    for(let x=0;x<cw;x++) if(d[(r+x)*4+3]>2){
      if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  if(x1<0){ x0=0;y0=0;x1=0;y1=0; }
  const nw=x1-x0+1, nh=y1-y0+1;
  const c=document.createElement('canvas'); c.width=nw; c.height=nh;
  c.getContext('2d').drawImage(tmp,x0,y0,nw,nh,0,0,nw,nh);   // 1:1, lossless
  s={cv:c,cw:nw,ch:nh,axPx:axPx-x0,ayPx:ayPx-y0};
  SPR.set(key,s); sprBytes+=nw*nh*4;
  return s;
}
function sprBiomeCheck(b){
  if(b===sprBiome && sprBytes<44e6) return;
  SPR.clear(); sprBytes=0; sprBiome=b;
}
const qs=s=>Math.max(0.25,Math.round(s*8)/8);          // quantised scale bucket
/* Boxes are cut to each shape's true extent (canopy union + stroke + cast
   shadow). Transparent margin still costs fill when blitted, so a loose box is
   wasted work — these are measured from the geometry in the draw functions. */
function propSprite(p,bi,B,dead){
  const s=qs(p.s);
  if(p.kind==='tree'){
    const tint=p.tint>0.66?2:(p.tint>0.33?1:0);
    const pal=tint===2?{tree:B.tree2,tree2:B.grass,trunk:B.trunk}
             :tint===1?{tree:B.grass2,tree2:B.tree,trunk:B.trunk}:B;
    return sprite('t'+bi+tint+s+(dead?'d':''),110*s,130*s,55*s,100*s,
      g=>drawTree(g,0,0,s,pal,p.seed,dead));
  }
  if(p.kind==='rock'){
    const v=Math.floor(p.seed)%8;                       // 8 rock silhouettes
    return sprite('r'+bi+v+s,80*s,70*s,40*s,45*s,g=>drawRock(g,0,0,s,B,v*37.3));
  }
  if(p.kind==='hut') return sprite('h'+bi+s,110*s,100*s,50*s,72*s,g=>drawHut(g,0,0,s,B));
  const v=Math.floor(p.seed)%8;
  return sprite('u'+bi+v+s,60*s,46*s,30*s,32*s,g=>drawTuft(g,0,0,s,B,v*53.1));
}
/* Drawn live each frame instead of blitted from one big pre-rendered sheet: at
   this island size a sheet would be ~19MB each. Props are culled to the
   viewport, so only the few dozen on screen cost anything. */
function drawIsle(is,vl,vr,vt,vb){
  const g=ctx, cx=SX(is.x), cy=SY(is.y), K=is.K;
  const B=BIOMES[is.biome];
  // shallows: two tight blue-green steps, well clear of the sand value
  blobPath(g,cx,cy,is.sandR,1.115); g.fillStyle='#2b6f92'; g.globalAlpha=.75; g.fill();
  blobPath(g,cx,cy,is.sandR,1.055); g.fillStyle='#4d9fb4'; g.globalAlpha=.85; g.fill();
  g.globalAlpha=1;
  // sand, with a heavy cut outline
  blobPath(g,cx,cy,is.sandR,1); inkFill(g,B.sand,6.5);
  g.save(); blobPath(g,cx,cy,is.sandR,1); g.clip();
  blobPath(g,cx,cy,is.sandR,0.962); g.strokeStyle=B.sand2; g.lineWidth=22*K;
  g.globalAlpha=.55; g.stroke(); g.globalAlpha=1;
  g.restore();
  // grass casts onto the sand — the island reads as raised, not painted flat
  g.save(); g.globalAlpha=.20; g.fillStyle=INK;
  blobPath(g,cx+9*K,cy+13*K,is.grassR,1.012); g.fill();
  g.restore(); g.globalAlpha=1;
  blobPath(g,cx,cy,is.grassR,1); inkFill(g,B.grass,4.5);
  g.save(); blobPath(g,cx,cy,is.grassR,1); g.clip();
  g.strokeStyle=B.grass2; g.globalAlpha=.5; g.lineWidth=42*K;
  blobPath(g,cx,cy,is.grassR,0.995); g.stroke(); g.globalAlpha=1;
  g.fillStyle=B.grass2; g.globalAlpha=.55;
  for(const t of is.tone){ ell(g,cx+t.x,cy+t.y,t.rx,t.ry,t.rot); g.fill(); }
  g.globalAlpha=1;
  // a worn path from the dock to the plaza
  g.strokeStyle=B.sand2; g.globalAlpha=.5; g.lineWidth=34*K;
  g.beginPath(); g.moveTo(cx+is.dock.x*0.95,cy+is.dock.y*0.95);
  g.quadraticCurveTo(cx+is.dock.x*0.4+40,cy+is.dock.y*0.4,cx,cy); g.stroke();
  g.globalAlpha=1;
  g.restore();
  // plaza flagstone
  g.save(); g.globalAlpha=.4; g.fillStyle=B.sand2;
  ell(g,cx,cy,104*K,74*K); g.fill(); g.globalAlpha=1; g.restore();
  // props, back to front, culled to the viewport
  const dead=is.biome==='bone'||is.biome==='ash';
  const m=90*K;
  sprBiomeCheck(is.biome);
  /* Props blit in device-aligned screen space, not through the world
     transform: a whole-device-pixel destination is what makes the copy 1:1 and
     keeps every ink outline as crisp as drawing it directly. The position
     snaps by under half a world unit, which is not visible. */
  if(SPR_OFF){                                   // reference path, for verifying
    for(const p of is.props){
      const wx=is.x+p.x, wy=is.y+p.y;
      if(wx<vl-m||wx>vr+m||wy<vt-m||wy>vb+m) continue;
      const px2=cx+p.x, py2=cy+p.y;
      if(p.kind==='tree'){ const t=p.tint>0.66?2:(p.tint>0.33?1:0);
        drawTree(g,px2,py2,qs(p.s),
          t===2?{tree:B.tree2,tree2:B.grass,trunk:B.trunk}
         :t===1?{tree:B.grass2,tree2:B.tree,trunk:B.trunk}:B, p.seed,dead); }
      else if(p.kind==='rock') drawRock(g,px2,py2,qs(p.s),B,(Math.floor(p.seed)%8)*37.3);
      else if(p.kind==='hut') drawHut(g,px2,py2,qs(p.s),B);
      else drawTuft(g,px2,py2,qs(p.s),B,(Math.floor(p.seed)%8)*53.1);
    }
  }else{
  g.save(); g.setTransform(DPR,0,0,DPR,0,0);
  for(const p of is.props){
    const wx=is.x+p.x, wy=is.y+p.y;
    if(wx<vl-m||wx>vr+m||wy<vt-m||wy>vb+m) continue;
    const sp=propSprite(p,is.biome,B,dead);
    const sxp=(cx+p.x-W/2)*ZM+W/2, syp=(cy+p.y-H/2)*ZM+H/2;
    const dx=Math.round(sxp*DPR-sp.axPx)/DPR, dy=Math.round(syp*DPR-sp.ayPx)/DPR;
    g.drawImage(sp.cv,dx,dy,sp.cw/DPR,sp.ch/DPR);
  }
  g.restore();
  }
  drawHut(g,cx-86*K,cy-46*K,1.1+K*0.3,B);
  if(is.id!==0) drawHut(g,cx+104*K,cy-22*K,0.95+K*0.24,B);
  drawDock(g,cx+is.dock.x*0.99,cy+is.dock.y*0.99,is.dock.a,1.0+K*0.42);
}
ISLES.forEach(buildIsle);

function isleAt(x,y){
  for(const is of ISLES){
    const d=dst(x,y,is.x,is.y);
    if(d<is.R*1.2){ if(d<is.radAt(angTo(is.x,is.y,x,y))) return is; }
  }
  return null;
}
function nearIsle(x,y){
  let best=null,bd=1e9;
  for(const is of ISLES){ const d=dst(x,y,is.x,is.y)-is.R; if(d<bd){bd=d;best=is;} }
  return best;
}

/* ───────────────────── 7. entity pools + effects ───────────────────────── */
const parts=[], fx=[], decals=[], floats=[], foes=[], pickups=[], boats=[];
function P(o){ if(parts.length>900) parts.shift(); parts.push(o); return o; }
function burst(x,y,n,opt){
  opt=opt||{};
  for(let i=0;i<n;i++){
    const a=opt.ang===undefined?rnd(TAU):opt.ang+rnd(opt.spread||TAU)-(opt.spread||TAU)/2;
    const sp=rnd(opt.spd||180,(opt.spd||180)*0.25);
    // opt.rad spawns on a ring instead of a point, so big bursts don't pile
    // into one white mass at the origin
    const rd=opt.rad?rnd(opt.rad,opt.rad*0.45):0;
    P({x:x+Math.cos(a)*rd+rnd(6,-6),y:y+Math.sin(a)*rd+rnd(6,-6),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      r:rnd(opt.r||5,(opt.r||5)*0.4),life:0,max:rnd(opt.life||0.6,(opt.life||0.6)*0.45),
      col:opt.col||C.foam,col2:opt.col2,kind:opt.kind||'spark',add:!!opt.add,
      grav:opt.grav||0,drag:opt.drag===undefined?2.6:opt.drag,rot:rnd(TAU),vr:rnd(9,-9),seed:rnd(999)});
  }
}
function decal(x,y,r,kind,col,life){
  if(!isleAt(x,y)) return;                 // nothing scorches or cracks open water
  if(decals.length>160) decals.shift();
  decals.push({x,y,r,kind,col,life:0,max:life||9,rot:rnd(TAU),seed:rnd(999)}); }
function fl(x,y,txt,col,size,crit){
  if(floats.length>34) floats.splice(0,floats.length-34);
  // stagger against anything already in that spot so numbers never stack illegibly
  let ty=y;
  for(const f of floats) if(Math.abs(f.x-x)<46&&Math.abs(f.y-ty)<20) ty-=22;
  floats.push({x,y:ty,txt,col,size:size||20,life:0,max:crit?1.15:0.85,crit:!!crit,vx:rnd(46,-46)});
}
/* rewards are batched into one line so kills don't bury the screen in receipts */
let rwXP=0,rwBeli=0,rwT=0;
function reward(xp,beli){ rwXP+=xp; rwBeli+=beli; if(rwT<=0) rwT=0.45; }
function flushReward(dt){
  if(rwT>0){ rwT-=dt;
    if(rwT<=0&&(rwXP||rwBeli)){
      const s=(rwBeli?shortNum(rwBeli)+' B':'')+(rwXP&&rwBeli?'   ':'')+(rwXP?'+'+shortNum(rwXP)+' XP':'');
      fl(PL.x,PL.y-78,s,C.gold,19);
      rwXP=0; rwBeli=0;
    }
  }
}

function updParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.life+=dt;
    if(p.life>=p.max){ parts.splice(i,1); continue; }
    const d=Math.exp(-p.drag*dt);
    p.vx*=d; p.vy*=d; p.vy+=(p.grav||0)*dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt;
  }
}
function drawParts(add){
  ctx.save();
  if(add) ctx.globalCompositeOperation='lighter';
  for(const p of parts){
    if(!!p.add!==add) continue;
    if(!onScreen(p.x,p.y,60)) continue;
    const t=p.life/p.max, k=1-t;
    const x=SX(p.x), y=SY(p.y);
    ctx.globalAlpha=add?k*0.95:k;
    if(p.kind==='spark'){
      ctx.fillStyle=p.col; const r=p.r*k;
      ctx.beginPath(); ctx.arc(x,y,Math.max(.4,r),0,TAU); ctx.fill();
    }else if(p.kind==='streak'){
      const sp=Math.hypot(p.vx,p.vy), L=clamp(sp*0.035,4,26);
      const a=Math.atan2(p.vy,p.vx);
      ctx.strokeStyle=p.col; ctx.lineWidth=Math.max(.8,p.r*k*1.3);
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-Math.cos(a)*L,y-Math.sin(a)*L); ctx.stroke();
    }else if(p.kind==='shard'){
      shardPath(ctx,x,y,p.r*(0.4+k*0.9),p.rot,p.seed);
      ctx.fillStyle=p.col; ctx.fill();
      if(!add){ ctx.strokeStyle=INK; ctx.lineWidth=1.4; ctx.stroke(); }
    }else if(p.kind==='smoke'){
      ctx.fillStyle=p.col; ctx.globalAlpha=(add?k:k*0.5);
      ctx.beginPath(); ctx.arc(x,y,p.r*(0.6+t*1.8),0,TAU); ctx.fill();
    }else if(p.kind==='chip'){
      ctx.save(); ctx.translate(x,y); ctx.rotate(p.rot);
      ctx.fillStyle=p.col; ctx.fillRect(-p.r,-p.r*0.6,p.r*2,p.r*1.2);
      ctx.strokeStyle=INK; ctx.lineWidth=1.2; ctx.strokeRect(-p.r,-p.r*0.6,p.r*2,p.r*1.2);
      ctx.restore();
    }else if(p.kind==='ring'){
      ctx.strokeStyle=p.col; ctx.lineWidth=Math.max(.6,p.r*0.32*k);
      ctx.beginPath(); ctx.arc(x,y,p.r*(0.4+t*2.4),0,TAU); ctx.stroke();
    }
  }
  ctx.restore(); ctx.globalAlpha=1;
}
function updDecals(dt){
  for(let i=decals.length-1;i>=0;i--){ const d=decals[i]; d.life+=dt; if(d.life>=d.max) decals.splice(i,1); }
}
function drawDecals(){
  for(const d of decals){
    if(!onScreen(d.x,d.y,d.r+40)) continue;
    const k=1-d.life/d.max, a=Math.min(1,k*1.8);
    const x=SX(d.x),y=SY(d.y);
    ctx.save(); ctx.globalAlpha=a*(d.kind==='ice'?0.52:0.75); ctx.translate(x,y); ctx.rotate(d.rot);
    if(d.kind==='scorch'){
      // a burn mark, not a hole: warm umber at low alpha with a charred core
      ctx.globalAlpha=a*0.34; ctx.fillStyle='#6b3a22';
      const rads=[]; for(let i=0;i<9;i++) rads.push(d.r*(0.62+hash(d.seed+i)*0.44));
      blobPath(ctx,0,0,rads,1); ctx.fill();
      ctx.globalAlpha=a*0.36; ctx.fillStyle='#3a1d13';
      blobPath(ctx,0,0,rads,0.55); ctx.fill();
    }else if(d.kind==='ice'){
      ctx.fillStyle='#cfe9f5';
      const rads=[]; for(let i=0;i<8;i++) rads.push(d.r*(0.72+hash(d.seed+i)*0.45));
      blobPath(ctx,0,0,rads,1); ctx.fill();
      ctx.strokeStyle='#8fc6df'; ctx.lineWidth=2; ctx.globalAlpha=a*0.8;
      for(let i=0;i<5;i++){ const ang2=hash(d.seed+i*5)*TAU;
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(ang2)*d.r*0.85,Math.sin(ang2)*d.r*0.85); ctx.stroke(); }
    }else if(d.kind==='crack'){
      // a split in the soil: dark gap with a lit lip, short and wedge-shaped
      for(let i=0;i<3;i++){
        const ang2=hash(d.seed+i*3)*TAU, L=d.r*(0.35+hash(d.seed+i)*0.45);
        ctx.globalAlpha=a*0.55; ctx.strokeStyle='#20160f'; ctx.lineWidth=5.5;
        boltPath(ctx,0,0,Math.cos(ang2)*L,Math.sin(ang2)*L,d.r*0.12,4,d.seed+i*11); ctx.stroke();
        ctx.globalAlpha=a*0.28; ctx.strokeStyle='#cbb894'; ctx.lineWidth=1.8;
        boltPath(ctx,1.5,1.5,Math.cos(ang2)*L+1.5,Math.sin(ang2)*L+1.5,d.r*0.12,4,d.seed+i*11); ctx.stroke();
      }
    }else if(d.kind==='blood'){
      ctx.fillStyle=C.vermil2; ctx.globalAlpha=a*0.5;
      const rads=[]; for(let i=0;i<7;i++) rads.push(d.r*(0.6+hash(d.seed+i)*0.7));
      blobPath(ctx,0,0,rads,1); ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha=1;
}
function updFloats(dt){
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i]; f.life+=dt; if(f.life>=f.max){floats.splice(i,1);continue;}
    f.y-=(f.crit?46:36)*dt*(1-f.life/f.max*0.5); f.x+=f.vx*dt; f.vx*=Math.exp(-3*dt);
  }
}
function drawFloats(){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const f of floats){
    if(!onScreen(f.x,f.y,90)) continue;
    const t=f.life/f.max;
    const pop=t<0.28? easeOutBack(t/0.28) : 1;
    const s=f.size*pop*(f.crit?1+ (1-Math.min(1,t*3))*0.35 :1);
    const a=t>0.65? 1-(t-0.65)/0.35 : 1;
    ctx.save(); ctx.globalAlpha=a; ctx.translate(SX(f.x),SY(f.y));
    ctx.font=fD(s);
    ctx.lineJoin='round'; ctx.strokeStyle=INK; ctx.lineWidth=Math.max(3,s*0.3);
    ctx.strokeText(f.txt,0,0);
    ctx.fillStyle=f.col; ctx.fillText(f.txt,0,0);
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

/* ───────────────────────── 8. figure drawing ───────────────────────────── */
/* One builder for every humanoid. Consistency is the point: player, marine,
   skeleton and boss all share the capsule skeleton, and read as one world. */
function drawFigure(g,o){
  const s=o.s||1, dir=o.dir||1, ph=o.ph||0, pal=o.pal;
  const walk=o.walk||0;                         // 0..1 how much stride
  const bob=Math.abs(Math.sin(ph))*2.2*walk;
  const sw=o.swing||0;                          // attack arm swing 0..1
  g.save(); g.translate(o.x,o.y);
  // ground shadow — always drawn in world-flat space, never mirrored
  g.globalAlpha=.26; g.fillStyle=INK;
  ell(g,2*s,3*s,15*s*(o.sq?1.18:1),6*s); g.fill(); g.globalAlpha=1;
  g.scale(dir*s,s);
  if(o.sq) g.scale(1/o.sq,o.sq);
  g.translate(0,-bob);
  const legA=Math.sin(ph)*7*walk, legB=Math.sin(ph+PI)*7*walk;
  const legL=Math.cos(ph)*2.4*walk;
  // legs
  limb(g,-4,-14,-5+legA,0-Math.abs(legL),6.5,pal.pants||pal.cloth,4);
  limb(g, 4,-14, 4+legB,0-Math.abs(legL),6.5,pal.pants||pal.cloth,4);
  // back arm
  const ba=-0.5+Math.sin(ph+PI)*0.5*walk;
  limb(g,-6,-30,-6-Math.sin(ba)*9,-30+Math.cos(ba)*11,5.5,pal.skin,4);
  // coat / torso
  g.save();
  g.beginPath();
  const flare=o.coat? 10 : 4;
  // o.ft lets a cached figure drive its coat off its own phase; the player,
  // which is drawn live, leaves it undefined and flutters on world time
  const fl2=o.coat? Math.sin((o.ft===undefined?T*7:o.ft*4)+ph)*2.5*(0.4+walk) : 0;
  g.moveTo(-8,-34); g.lineTo(8,-34);
  g.lineTo(9+flare*0.35,-6+fl2*0.3); g.lineTo(-9-flare*0.35-fl2,-4+fl2);
  g.closePath();
  inkFill(g,pal.cloth,4);
  g.restore();
  // sash / belt
  g.beginPath(); g.moveTo(-9,-16); g.lineTo(9,-16); g.lineTo(9,-11); g.lineTo(-9,-11); g.closePath();
  g.fillStyle=pal.accent; g.fill();
  g.strokeStyle=INK; g.lineWidth=2; g.stroke();
  if(o.chest){ // chest mark (marine stripe / bone ribs)
    g.strokeStyle=pal.accent; g.lineWidth=2.4;
    g.beginPath(); g.moveTo(-6,-31); g.lineTo(4,-19); g.stroke();
  }
  // head
  g.beginPath(); g.arc(1,-41,9.2,0,TAU); inkFill(g,pal.skin,3.6);
  // hair
  if(pal.hair){
    g.save(); g.beginPath(); g.arc(1,-41,9.2,0,TAU); g.clip();
    g.fillStyle=pal.hair; g.beginPath(); g.ellipse(1,-46,10,7,0,0,TAU); g.fill();
    g.restore();
  }
  // eye — one dot, reads at any distance
  g.fillStyle=o.evil?C.vermil:INK;
  g.beginPath(); g.arc(6,-41.5,o.evil?2.1:1.7,0,TAU); g.fill();
  if(o.evil){ g.globalAlpha=.5; g.beginPath(); g.arc(6,-41.5,4.2,0,TAU); g.fillStyle=C.vermil; g.fill(); g.globalAlpha=1; }
  // headgear
  const hat=o.hat;
  if(hat==='straw'){
    g.save(); g.translate(1,-48); g.rotate(Math.sin(T*3)*0.03);
    g.beginPath(); g.ellipse(0,2,17,6.4,0,0,TAU); inkFill(g,'#e9c86f',3.4);
    g.beginPath(); g.moveTo(-9,2); g.quadraticCurveTo(0,-13,9,2); g.closePath(); inkFill(g,'#dfb757',3.2);
    g.beginPath(); g.moveTo(-8.6,0.4); g.quadraticCurveTo(0,-4,8.6,0.4);
    g.strokeStyle=C.vermil; g.lineWidth=3.4; g.stroke();
    g.restore();
  }else if(hat==='bandana'){
    g.beginPath(); g.moveTo(-9,-45); g.quadraticCurveTo(1,-52,10,-45); g.lineTo(10,-42); g.quadraticCurveTo(1,-48,-9,-42); g.closePath();
    inkFill(g,pal.accent,2.6);
    limb(g,-9,-44,-17,-38,3,pal.accent,2.4);
  }else if(hat==='cap'){
    g.beginPath(); g.moveTo(-9,-46); g.quadraticCurveTo(1,-56,10,-46); g.closePath(); inkFill(g,'#f3f0e6',3);
    g.beginPath(); g.moveTo(2,-47); g.lineTo(16,-45); g.lineTo(16,-42); g.lineTo(2,-44); g.closePath(); inkFill(g,'#2f5f96',2.6);
  }else if(hat==='horn'){
    limb(g,-6,-47,-12,-58,4,pal.accent,3); limb(g,8,-47,14,-58,4,pal.accent,3);
  }else if(hat==='tri'){
    g.beginPath(); g.moveTo(-16,-46); g.quadraticCurveTo(1,-64,18,-46); g.quadraticCurveTo(1,-52,-16,-46); g.closePath();
    inkFill(g,pal.hat||'#2b2b33',3.2);
  }
  // front arm + weapon
  const aa=(o.aimA===undefined?-0.3:o.aimA)-sw*2.3;
  const hx=8+Math.cos(aa)*13, hy=-30+Math.sin(aa)*13;
  limb(g,8,-30,hx,hy,5.8,pal.skin,4);
  if(o.wep==='sword'){
    g.save(); g.translate(hx,hy); g.rotate(aa-0.5);
    limb(g,-4,0,4,0,4.5,'#5a3a22',3.4);
    g.beginPath(); g.moveTo(5,-4); g.lineTo(38,-3); g.lineTo(44,0); g.lineTo(38,3); g.lineTo(5,4); g.closePath();
    inkFill(g,'#dfe6ea',3);
    g.beginPath(); g.moveTo(7,-1.5); g.lineTo(38,-1); g.strokeStyle='#ffffff'; g.lineWidth=1.6; g.stroke();
    g.restore();
  }else if(o.wep==='club'){
    g.save(); g.translate(hx,hy); g.rotate(aa-0.4);
    // one tapered silhouette so the head can never detach from the haft
    g.beginPath();
    g.moveTo(-5,-3.2); g.lineTo(14,-6.5); g.quadraticCurveTo(25,-7,25,0);
    g.quadraticCurveTo(25,7,14,6.5); g.lineTo(-5,3.2); g.closePath();
    inkFill(g,'#6b4a2e',3.4);
    g.beginPath(); g.arc(18,-2,2,0,TAU); g.arc(21,3,1.8,0,TAU);
    g.fillStyle='rgba(18,32,44,.4)'; g.fill();
    g.restore();
  }else if(o.wep==='rifle'){
    g.save(); g.translate(hx,hy); g.rotate(aa);
    limb(g,-4,0,30,0,4.2,'#3b3f46',3.4);
    limb(g,-8,3,0,1,5,'#6b4a2e',3);
    g.restore();
  }else if(o.wep==='axe'){
    g.save(); g.translate(hx,hy); g.rotate(aa-0.5);
    limb(g,-4,0,26,0,5,'#5a3a22',3.6);
    g.beginPath(); g.moveTo(22,-4); g.quadraticCurveTo(42,-20,46,0); g.quadraticCurveTo(42,20,22,4); g.closePath();
    inkFill(g,'#cfd8de',3.4);
    g.restore();
  }else if(o.wep==='claw'){
    g.save(); g.translate(hx,hy); g.rotate(aa);
    for(let i=-1;i<2;i++) limb(g,0,i*4,14,i*7,3.2,'#e6eef2',2.6);
    g.restore();
  }
  g.restore();
  // rim light — player only, so the player is never lost in a crowd
  if(o.rim){
    g.save(); g.globalCompositeOperation='lighter'; g.globalAlpha=.45;
    g.strokeStyle='#fff3d0'; g.lineWidth=2.6*s;
    g.beginPath(); g.arc(o.x+1*dir*s,o.y-41*s-bob*s,10.6*s,-2.6,-0.3); g.stroke();
    g.beginPath(); g.moveTo(o.x-8*dir*s,o.y-33*s-bob*s); g.lineTo(o.x-9*dir*s,o.y-8*s-bob*s);
    g.lineWidth=2.2*s; g.globalAlpha=.32; g.stroke();
    g.restore(); g.globalAlpha=1;
  }
}
/* The player's standing mark: a vermilion ground arc. Red is reserved, so this
   alone tells the eye which figure is you, even inside a crowd. */
function heroMark(g,x,y,s){
  g.save(); g.translate(x,y);
  // a cream separation halo so the silhouette never merges with a crowd
  g.globalCompositeOperation='lighter'; g.globalAlpha=.13;
  g.fillStyle='#ffe9b8';
  g.beginPath(); g.ellipse(0,-26*s,26*s,38*s,0,0,TAU); g.fill();
  g.globalCompositeOperation='source-over';
  g.globalAlpha=.55; g.strokeStyle=C.vermil; g.lineWidth=2.6;
  g.beginPath(); g.ellipse(0,3,19*s,7.4*s,0,0.35,PI-0.35); g.stroke();
  g.globalAlpha=.30;
  g.beginPath(); g.ellipse(0,3,19*s,7.4*s,0,PI+0.5,TAU-0.5); g.stroke();
  g.globalAlpha=.22; g.fillStyle=C.vermil;
  g.beginPath(); g.ellipse(0,3,16*s,6*s,0,0,TAU); g.fill();
  g.restore(); g.globalAlpha=1;
}

function spawnFoe(type,x,y,isle,bossKey){
  const t=ETYPE[type]; const b=bossKey?BOSS[bossKey]:null;
  const lvl=isle?isle.lv:1;
  const scale=1+lvl*0.06;
  const e={
    type,t,x,y,vx:0,vy:0,ph:rnd(TAU),isle,boss:!!b,bossKey,
    nm:b?b.nm:t.nm, s:(b?b.sM:1)*(t.serpent?1:1),
    hp:t.hp*scale*(b?b.hpM:1), max:t.hp*scale*(b?b.hpM:1),
    dmg:t.dmg*(1+lvl*0.05)*(b?b.dmgM:1),
    r:t.r*(b?b.sM:1), xp:t.xp*(b?b.xpM:1), beli:t.beli*(b?b.beliM:1),
    pal:b?b.pal:t.pal, wep:b?b.wep:t.wep, hat:b?(t===ETYPE.frost?'horn':t.hat):t.hat,
    st:'idle', stt:0, atkcd:rnd(1.2,0.2), hurt:0, stun:0, slow:0, burn:0, burnT:0,
    dir:1, aimA:-0.3, swing:0, walk:0, seed:rnd(999), home:{x,y}, wander:rnd(TAU),
    lvl, special:0, flashT:0, orbit:rnd(TAU), orbitT:rnd(3,1),
    band:b?1:rnd(2.9,1.0), vs:b?1:rnd(1.09,0.9), vpal:rint(0,3)
  };
  if(!b && e.vpal){                     // two alternate dye-lots per foe type
    const shift=e.vpal===1?{cloth:-18,pants:-10}:{cloth:14,pants:8};
    e.pal=Object.assign({},t.pal,{cloth:shade(t.pal.cloth,shift.cloth),
      pants:shade(t.pal.pants,shift.pants)});
  }
  foes.push(e); return e;
}
function populate(){
  for(const is of ISLES){
    const n=is.pop - foes.filter(f=>f.isle===is&&!f.boss).length;
    for(let i=0;i<n;i++){
      const p=pick(is.spawnPts);
      const type=(is.id>=1 && Math.random()<0.3)?'gunner':is.foe;
      spawnFoe(type,p.x+rnd(40,-40),p.y+rnd(40,-40),is);
    }
    if(is.boss && !foes.some(f=>f.isle===is&&f.boss)){
      spawnFoe(BOSS[is.boss].t,is.x+rnd(60,-60),is.y+rnd(60,-60),is,is.boss);
    }
  }
}

/* ─────────────────── 11. shared FX primitives (pigment) ────────────────── */
function ringFx(x,y,r0,r1,dur,cols,o){
  o=o||{};
  fx.push({t:0,dur,z:o.z||0,kind:'ring',
    up(dt){ if(o.dmg&&this.t<dur*0.5){ /* damage applied on spawn below */ } },
    dr(){
      const k=this.t/dur, r=lerp(r0,r1,easeOutQuint(k)), a=(1-k);
      ctx.save(); ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=a*0.9; ctx.strokeStyle=cols[1]||cols[0];
      ctx.lineWidth=(o.w||14)*(1-k*0.7)+2;
      ctx.beginPath(); ctx.arc(SX(x),SY(y),r,0,TAU); ctx.stroke();
      ctx.globalAlpha=a*0.55; ctx.strokeStyle=cols[0];
      ctx.lineWidth=(o.w||14)*1.9*(1-k*0.7)+2;
      ctx.beginPath(); ctx.arc(SX(x),SY(y),r*0.96,0,TAU); ctx.stroke();
      ctx.restore();
      // carved outer edge — the print stays graphic even when it glows
      ctx.globalAlpha=a*0.8; ctx.strokeStyle=INK; ctx.lineWidth=2.4;
      ctx.beginPath(); ctx.arc(SX(x),SY(y),r+ (o.w||14)*0.5*(1-k*0.7),0,TAU); ctx.stroke();
      ctx.globalAlpha=1;
    }});
}
function shockRing(x,y,r0,r1,dur,cols){
  fx.push({t:0,dur,z:1,up(){},dr(){
    const k=this.t/dur, r=lerp(r0,r1,easeOutQuint(k)), a=1-k;
    ctx.save(); ctx.globalAlpha=a*0.85;
    ctx.strokeStyle=cols[0]; ctx.lineWidth=5*(1-k)+1.5;
    ctx.beginPath();
    for(let i=0;i<=40;i++){
      const ang2=i/40*TAU, w=r*(1+Math.sin(ang2*7+this.t*9)*0.035);
      const px=SX(x)+Math.cos(ang2)*w, py=SY(y)+Math.sin(ang2)*w*0.94;
      i?ctx.lineTo(px,py):ctx.moveTo(px,py);
    }
    ctx.closePath(); ctx.stroke(); ctx.restore(); ctx.globalAlpha=1;
  }});
}
/* ── anime impact frames ─────────────────────────────────────────────────
   Hand-drawn impact frames read the way they do because they SNAP between a
   few extreme, abstract states — white-out, inverted, then radiating lines —
   with no tweening. Interpolating any of this turns it back into a glow.
   Drawn in screen space (z:2), over the world and under the interface. */
function impactFrames(wx,wy){
  const seed=rnd(999);
  // rough, hand-cut wedge starburst — jagged, never a clean cone
  const shards=[];
  const n=16;
  for(let i=0;i<n;i++){
    const a=i/n*TAU+hash(seed+i)*0.16;
    const w=0.055+hash(seed+i*3.1)*0.075;
    shards.push({a,w,len:0.55+hash(seed+i*7.7)*0.75});
  }
  const wedge=(g,cx,cy,R,s,squash)=>{
    g.beginPath();
    const a0=s.a-s.w, a1=s.a+s.w, L=R*s.len*squash;
    g.moveTo(cx,cy);
    g.lineTo(cx+Math.cos(a0)*L*0.55,cy+Math.sin(a0)*L*0.55);
    g.lineTo(cx+Math.cos(s.a-s.w*0.35)*L,cy+Math.sin(s.a-s.w*0.35)*L);
    g.lineTo(cx+Math.cos(s.a+s.w*0.2)*L*0.88,cy+Math.sin(s.a+s.w*0.2)*L*0.88);
    g.lineTo(cx+Math.cos(a1)*L*0.5,cy+Math.sin(a1)*L*0.5);
    g.closePath();
  };
  const t0=RT, DUR=0.30;
  fx.push({t:0,dur:99,z:2,
    up(){ if(RT-t0>=DUR) this.t=this.dur; },   // expires in real time, so the
    dr(){                                      // hitstop holds the world, not the cut
    const cx=(wx-cam.x-cam.sx)*ZM+W/2, cy=(wy-cam.y-cam.sy)*ZM+H/2;
    const R=Math.hypot(W,H);
    const t=RT-t0;
    ctx.save();

      ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle=INK;
      for(const s of shards) { wedge(ctx,cx,cy,R,s,1); ctx.fill(); }
      ctx.beginPath(); ctx.arc(cx,cy,R*0.055,0,TAU); ctx.fillStyle=INK; ctx.fill();
    }else if(t<0.135){

      ctx.beginPath(); ctx.arc(cx,cy,R*0.10,0,TAU); ctx.fillStyle='#ffffff'; ctx.fill();
    }else{

      const k=(t-0.135)/0.165;
      ctx.globalAlpha=1-k;
      ctx.strokeStyle='#ffffff'; ctx.lineCap='butt';
      for(let i=0;i<46;i++){
        const a=hash(seed+i*2.7)*TAU;
        const i0=R*(0.10+hash(seed+i*5.3)*0.30)+k*R*0.55;
        const i1=i0+R*(0.10+hash(seed+i*9.1)*0.34);
        ctx.lineWidth=1+hash(seed+i*4.4)*4.5;
        ctx.beginPath();
        ctx.moveTo(cx+Math.cos(a)*i0,cy+Math.sin(a)*i0);
        ctx.lineTo(cx+Math.cos(a)*i1,cy+Math.sin(a)*i1);
        ctx.stroke();
      }
      ctx.globalAlpha=(1-k)*0.55; ctx.strokeStyle=INK; ctx.lineWidth=3;

        const a=hash(seed+i*3.9)*TAU, i0=R*0.06+k*R*0.5;
        ctx.beginPath();
        ctx.moveTo(cx+Math.cos(a)*i0,cy+Math.sin(a)*i0);
        ctx.lineTo(cx+Math.cos(a)*(i0+R*0.3),cy+Math.sin(a)*(i0+R*0.3));
        ctx.stroke();
      }
    }
    ctx.restore(); ctx.globalAlpha=1;
  }});
}
function telegraph(x,y,r,dur,col){

function projFx(o){

    trail:[],dead:false,

      while(this.trail.length>(o.tlen||26)*2) this.trail.splice(0,2);

        }

            this.hit.push(e); damageFoe(e,o.dmg,this.ang,o.kb||140,o.eff);

            if(this.hit.length>=(o.pierce||1)){ if(o.onEnd)o.onEnd(this.x,this.y); this.t=this.dur; }
          }

    },

}

function damageFoe(e,dmg,ang,kb,eff){
  if(e.hp<=0) return;
  const crit=Math.random()<0.16;
  const d=dmg*(crit?1.85:1)*rnd(1.08,0.92);
  e.hp-=d; e.hurt=0.18; e.flashT=0.12;
  if(kb){ e.vx+=Math.cos(ang)*kb/(e.boss?3.4:1); e.vy+=Math.sin(ang)*kb/(e.boss?3.4:1); }
  if(eff){
    if(eff.slow){ e.slow=Math.max(e.slow,eff.slow); }
    if(eff.stun){ e.stun=Math.max(e.stun,eff.stun); }
    if(eff.burn){ e.burn=Math.max(e.burn,eff.burn); e.burnT=Math.max(e.burnT,eff.burnT||3); }
  }
  fl(e.x+rnd(14,-14),e.y-e.r*1.9,String(Math.round(d)),crit?C.gold:C.foam,crit?30:20,crit);
  burst(e.x,e.y-e.r*0.9,crit?9:5,{col:C.vermil,spd:crit?250:170,life:.4,r:4,ang:ang,spread:1.7,kind:'streak'});
  if(crit) addTrauma(.1);
  if(e.hp<=0) killFoe(e,ang);
}
function killFoe(e,ang){
  e.hp=0;
  addTrauma(e.boss?0.8:0.18);
  if(e.boss){ addFlash(.28,'#ffffff'); hitstop=Math.max(hitstop,0.22); }
  burst(e.x,e.y-e.r,e.boss?70:22,{col:C.vermil,col2:C.vermil2,spd:e.boss?460:260,life:e.boss?1.1:.65,r:e.boss?9:6,kind:'streak',drag:2.2});
  burst(e.x,e.y-e.r,e.boss?30:10,{col:e.pal.cloth,spd:200,life:.9,r:5,kind:'chip',grav:420,drag:.8});
  decal(e.x,e.y,e.boss?60:26,'blood',C.vermil2,e.boss?18:10);
  gainXP(Math.round(e.xp)); gainBeli(Math.round(e.beli));
  reward(Math.round(e.xp),Math.round(e.beli));
  PL.kills++;
  const o=objCur();
  if(o.t==='kill'&&e.type===o.foe&&e.isle===ISLES[o.isle]&&!e.boss){
    PL.objN++; if(PL.objN>=o.n) objAdvance();
  }else if(o.t==='boss'&&e.boss&&e.isle===ISLES[o.isle]){
    objAdvance();
  }
  if(e.boss){
    // bosses drop their island's Devil Fruit
    const drops={morgan:'ice',wapol:'rumble',moria:'quake',akainu:'flame'};
    spawnFruit(e.x,e.y,drops[e.bossKey]||'flame');
    fl(e.x,e.y-90,e.nm+' DEFEATED',C.gold,30,true);
  }
  const i=foes.indexOf(e); if(i>=0) foes.splice(i,1);
}
function hurtPlayer(dmg,ang){
  if(PL.iframe>0||PL.dead) return;
  PL.hp-=dmg; PL.iframe=0.45; PL.hurtT=0.3; PL.hitFlash=1;
  addTrauma(.3); addFlash(.22,C.vermil);

function areaHit(x,y,r,dmg,kb,eff,ex){
  for(const e of foes){
    if(e.hp<=0) continue;
    const d=dst(x,y,e.x,e.y-e.r*0.5);
    if(d<r+e.r){ damageFoe(e,dmg,angTo(x,y,e.x,e.y),kb,eff); if(ex)ex(e); }
  }
}
function coneHit(x,y,a0,spread,r,dmg,kb,eff){
  let n=0;
  for(const e of foes){
    if(e.hp<=0) continue;
    const d=dst(x,y,e.x,e.y-e.r*0.5);
    if(d<r+e.r && Math.abs(angDiff(a0,angTo(x,y,e.x,e.y)))<spread/2){
      damageFoe(e,dmg,angTo(x,y,e.x,e.y),kb,eff); n++;

  }
  return n;
}
function lineHit(x,y,ang,len,w,dmg,kb,eff){
  let n=0;
  for(const e of foes){
    if(e.hp<=0) continue;
    const dx=e.x-x, dy=(e.y-e.r*0.5)-y;
    const t=dx*Math.cos(ang)+dy*Math.sin(ang);
    if(t<-e.r||t>len+e.r) continue;
    const px=x+Math.cos(ang)*t, py=y+Math.sin(ang)*t;
    if(dst(px,py,e.x,e.y-e.r*0.5)<w+e.r){ damageFoe(e,dmg,ang,kb,eff); n++; }
  }
  return n;
}

/* ── tsunami: real water raised by the quake ─────────────────────────────
   A seaquake moves the sea, so it raises actual rolling crests — which is the
   one effect in the game that gets to be literally the anchor: a Hokusai wave,
   flat tonal band, foam lip, and breaking curls along the ridge. */
function tsunami(x,y,count,r0,r1,life){
  for(let i=0;i<count;i++){
    const idx=i;
    setTimeoutFx(i*0.115,()=>{
      const seed=rnd(999), N=70;
      const wob=a=>Math.sin(a*5+seed)*0.055+Math.sin(a*11+seed*2.3)*0.028+Math.sin(a*3-seed)*0.035;
      fx.push({t:0,dur:life,z:0,up(){},dr(){
        const k=this.t/life;
        const r=lerp(r0,r1,easeOutCubic(k));            // rolls, doesn't snap out
        const rise=Math.sin(Math.min(1,k*1.25)*PI);
        const h=(104+idx*30)*rise;                      // crest height
        if(h<2) return;
        const al=1-Math.max(0,(k-0.7)/0.3);
        const RX=a=>x+Math.cos(a)*r*(1+wob(a));
        const RY=a=>y+Math.sin(a)*r*(1+wob(a))*0.9;
        const IX=a=>x+Math.cos(a)*(r-h)*(1+wob(a)*0.5);
        const IY=a=>y+Math.sin(a)*(r-h)*(1+wob(a)*0.5)*0.9;
        ctx.save(); ctx.globalAlpha=al;
        // the body of the wave — one flat tonal band, ink-edged
        ctx.beginPath();
        for(let q=0;q<=N;q++){ const a=q/N*TAU, px=SX(RX(a)), py=SY(RY(a));
          q?ctx.lineTo(px,py):ctx.moveTo(px,py); }
        for(let q=N;q>=0;q--){ const a=q/N*TAU; ctx.lineTo(SX(IX(a)),SY(IY(a))); }
        ctx.closePath();
        ctx.fillStyle='#16405e'; ctx.fill();             // deep trough
        ctx.strokeStyle='rgba(8,26,42,0.7)'; ctx.lineWidth=3; ctx.stroke();
        // lit face — a band hugging the crest, not the whole wall
        ctx.save(); ctx.clip();
        ctx.beginPath();
        for(let q=0;q<=N;q++){ const a=q/N*TAU;
          const px=SX(RX(a)), py=SY(RY(a));
          q?ctx.lineTo(px,py):ctx.moveTo(px,py); }
        ctx.closePath();
        ctx.strokeStyle='#2e7fa6'; ctx.lineWidth=Math.max(4,h*0.62); ctx.stroke();
        ctx.strokeStyle='#4fa6c4'; ctx.lineWidth=Math.max(3,h*0.30); ctx.stroke();
        ctx.restore();
        // foam lip along the ridge, with the cut edge above it
        ctx.beginPath();
        for(let q=0;q<=N;q++){ const a=q/N*TAU, px=SX(RX(a)), py=SY(RY(a));
          q?ctx.lineTo(px,py):ctx.moveTo(px,py); }
        ctx.closePath();
        ctx.strokeStyle='#eafaf7'; ctx.lineWidth=Math.max(2.5,6.5*rise); ctx.stroke();
        ctx.strokeStyle='rgba(8,26,42,0.5)'; ctx.lineWidth=1.8; ctx.stroke();
        // breaking crests around the ring, leaning outward
        const curls=Math.round(11+idx*3);
        ctx.fillStyle='#eafaf7';
        ctx.beginPath();
        for(let q=0;q<curls;q++){
          const a=(q/curls)*TAU+seed*0.3+k*0.25;
          const cs2=(0.9+rise*1.35)*ZM*0.85;
          crestCurlPath(ctx,SX(RX(a)),SY(RY(a)),cs2,Math.cos(a)<0,true);
        }
        ctx.fill();
        ctx.strokeStyle='rgba(8,26,42,0.45)'; ctx.lineWidth=1.4; ctx.stroke();
        ctx.restore(); ctx.globalAlpha=1;
        // spray thrown off the ridge
        if(Math.random()<0.6){
          const a=rnd(TAU);
          burst(RX(a),RY(a),1,{col:'#eafaf7',spd:120,life:.6,r:5,grav:260,drag:1.4});
        }
      }});
    });
  }
}

const timers=[];
function setTimeoutFx(d,f){ timers.push({d,f}); }
function updTimers(dt){
  for(let i=timers.length-1;i>=0;i--){ timers[i].d-=dt; if(timers[i].d<=0){ const f=timers[i].f; timers.splice(i,1); f(); } }
}

  const F=FRUITS[key];
  const bob=Math.sin(t*2.4)*5;
  g.save(); g.translate(x,y-30+bob);
  // aura — the only glow allowed on the ground plane
  g.save(); g.globalCompositeOperation='lighter'; g.globalAlpha=.30+Math.sin(t*4)*0.1;
  g.fillStyle=F.cols[0]; g.beginPath(); g.arc(0,0,26+Math.sin(t*3)*4,0,TAU); g.fill();
  g.restore();
  // orbiting motes
  g.save(); g.globalCompositeOperation='lighter';
  for(let i=0;i<5;i++){ const a=t*1.8+i/5*TAU, r2=22+Math.sin(t*3+i)*5;
    g.globalAlpha=.7; g.fillStyle=F.cols[1];
    g.beginPath(); g.arc(Math.cos(a)*r2,Math.sin(a)*r2*0.45,2.4,0,TAU); g.fill(); }
  g.restore(); g.globalAlpha=1;
  // the fruit: swirl-marked sphere, inked
  g.beginPath(); g.arc(0,0,15,0,TAU); inkFill(g,F.cols[0],3.4);
  g.save(); g.beginPath(); g.arc(0,0,15,0,TAU); g.clip();
  g.strokeStyle=F.ink; g.lineWidth=2.2;
  for(let i=0;i<4;i++){ g.beginPath();
    g.moveTo(-16,-9+i*6); g.quadraticCurveTo(0,-13+i*6,16,-9+i*6); g.stroke(); }
  g.restore();
  g.fillStyle='rgba(255,255,255,.45)'; g.beginPath(); g.ellipse(-5,-6,4.5,3,-.5,0,TAU); g.fill();
  limb(g,0,-14,3,-22,3,'#4a7a3a',2.6);
  g.beginPath(); g.ellipse(9,-22,7,4,-.5,0,TAU); inkFill(g,'#4a7a3a',2.4);
  g.restore();
}

/* ─────────────────────────── 15. player update ─────────────────────────── */
function plUpdate(dt){
  if(PL.dead){
    PL.respawn-=dt;
    if(PL.respawn<=0 || just['KeyR']){
      const is=nearIsle(PL.x,PL.y);
      PL.x=is.x+is.dock.x*0.8; PL.y=is.y+is.dock.y*0.8;
      PL.hp=PL.max; PL.en=PL.enMax; PL.dead=false; PL.iframe=1.4;
      const lost=Math.floor(PL.beli*0.12); PL.beli-=lost;
      if(lost>0) fl(PL.x,PL.y-80,'-'+shortNum(lost)+' B',C.vermil,20);
      cam.x=PL.x; cam.y=PL.y;
    }
    return;
  }
  // aim
  mouse.x=(mouse.sx-W/2)/ZM+cam.x+cam.sx; mouse.y=(mouse.sy-H/2)/ZM+cam.y+cam.sy;
  PL.aimA=angTo(PL.x,PL.y-24,mouse.x,mouse.y);
  PL.dir=Math.cos(PL.aimA)<0?-1:1;

  // movement
  let mx=0,my=0;
  if(keys['KeyW']||keys['ArrowUp'])my-=1;
  if(keys['KeyS']||keys['ArrowDown'])my+=1;
  if(keys['KeyA']||keys['ArrowLeft'])mx-=1;
  if(keys['KeyD']||keys['ArrowRight'])mx+=1;
  const ml=Math.hypot(mx,my); if(ml){mx/=ml;my/=ml;}
  const here=isleAt(PL.x,PL.y);
  PL.boat=!here;
  // making landfall names the place and its level band, so you always know
  // whether you have sailed somewhere you can survive
  if(here!==PL.lastIsle){
    PL.lastIsle=here;
    if(here){
      const tough=PL.lv<here.lv-2;
      banner(here.name,'RECOMMENDED  LV '+here.lv+'–'+here.lv2+(tough?'   ·   YOU ARE UNDER-LEVELLED':''));
      if(tough) addFlash(.10,C.vermil);
      const o=objCur();
      if(o.t==='travel'&&ISLES[o.isle]===here) objAdvance();
    }
  }
  const casting=(PL.casting||0)>0;
  if(casting) PL.casting-=dt;
  const base=PL.boat?236:186;
  // swinging slows you, but not so much that disengaging becomes impossible
  const sp=base*(casting?0.15:1)*(PL.swingT>0?0.74:1);
  if(PL.dashT>0){
    PL.dashT-=dt;
    const pw=PL.dashPow||980;
    PL.vx=Math.cos(PL.dashA)*pw*(0.4+PL.dashT*2.2);
    PL.vy=Math.sin(PL.dashA)*pw*(0.4+PL.dashT*2.2);
    if(PL.dashT<=0) PL.dashPow=0;
  }else{
    PL.vx=lerp(PL.vx,mx*sp,1-Math.pow(0.0001,dt));
    PL.vy=lerp(PL.vy,my*sp,1-Math.pow(0.0001,dt));
  }
  PL.x+=PL.vx*dt; PL.y+=PL.vy*dt;
  const R=WORLD.r;
  const dd=Math.hypot(PL.x,PL.y);
  if(dd>R){ PL.x*=R/dd; PL.y*=R/dd; }
  const spd=Math.hypot(PL.vx,PL.vy);
  PL.walk=clamp(spd/170,0,1);
  PL.ph+=dt*(PL.boat?4:10)*clamp(spd/140,0,1.6);
  if(PL.boat) PL.boatA=lerp(PL.boatA, spd>20?Math.atan2(PL.vy,PL.vx):PL.boatA, 1-Math.pow(0.001,dt));

  // trail history
  PL.trail.push(PL.x,PL.y-24); while(PL.trail.length>34) PL.trail.splice(0,2);
  // wake / dust
  if(PL.boat){
    PL.wake-=dt;
    if(PL.wake<=0&&spd>50){ PL.wake=0.045;
      burst(PL.x-Math.cos(PL.boatA)*22,PL.y-Math.sin(PL.boatA)*22+6,2,{col:C.foam,spd:50,life:.75,r:6,drag:3,kind:'smoke'}); }
  }else if(spd>140 && Math.random()<0.35){
    burst(PL.x,PL.y+4,1,{col:'#d8c49a',spd:40,life:.45,r:5,drag:3.4,kind:'smoke'});
  }

  // dash
  PL.dashCd=Math.max(0,PL.dashCd-dt);
  if(just['Space']&&PL.dashCd<=0&&!casting){
    PL.dashCd=0.85; PL.dashT=0.19; PL.dashPow=1020;
    PL.dashA=ml?Math.atan2(my,mx):PL.aimA; PL.iframe=Math.max(PL.iframe,0.24);
    burst(PL.x,PL.y-18,14,{col:C.foam,spd:220,life:.45,r:6,ang:PL.dashA+PI,spread:1.3,kind:'streak'});
    addTrauma(.08);
  }
  // melee
  PL.atkCd=Math.max(0,PL.atkCd-dt);
  PL.comboT=Math.max(0,PL.comboT-dt);
  if(PL.comboT<=0) PL.combo=0;
  if(PL.swingT>0){ PL.swingT-=dt; PL.swing=Math.sin(clamp(1-PL.swingT/0.26,0,1)*PI); } else PL.swing=0;
  if(mouse.down&&PL.atkCd<=0&&!PL.boat&&!casting){
    mouse.clicked=false;
    PL.combo=(PL.combo%3)+1; PL.comboT=0.72;
    const heavy=PL.combo===3;
    PL.atkCd=heavy?0.44:0.26; PL.swingT=0.26;
    const a=PL.aimA, D=plDmgMelee()*(heavy?2.0:1);
    const n=coneHit(PL.x,PL.y-24,a,heavy?2.6:1.9,heavy?108:88,D,heavy?420:190,heavy?{stun:0.25}:null);
    if(n){ hitstop=Math.max(hitstop,heavy?0.09:0.055); addTrauma(heavy?.34:.14);
      burst(PL.x+Math.cos(a)*60,PL.y-24+Math.sin(a)*60,heavy?16:8,{col:C.foam,spd:300,life:.4,r:5,ang:a,spread:1.5,kind:'streak'}); }
    if(heavy){ addFlash(.1,'#ffffff'); }
    swingFx(a,heavy);
  }
  // abilities
  const F=FRUITS[PL.fruit];
  const abKeys=['KeyQ','KeyE','KeyR'];
  for(let i=0;i<3;i++){
    PL.cds[i]=Math.max(0,PL.cds[i]-dt);
    if(just[abKeys[i]]&&PL.cds[i]<=0&&!casting){
      const ab=F.ab[i];
      if(PL.en>=ab.cost){
        PL.en-=ab.cost; PL.cds[i]=ab.cd; ab.cast(PL.aimA);
      }else{
        fl(PL.x,PL.y-70,'NO ENERGY',C.foam,17);
      }
    }
  }
  if(just['KeyF']) interact();
  if(just['KeyM']||just['Tab']) PL.chart=!PL.chart;
  // regen
  PL.en=Math.min(PL.enMax,PL.en+15*dt);
  if(PL.hp<PL.max) PL.hp=Math.min(PL.max,PL.hp+PL.max*0.012*dt);
  PL.iframe=Math.max(0,PL.iframe-dt);
  PL.hurtT=Math.max(0,PL.hurtT-dt);
  PL.hitFlash=Math.max(0,PL.hitFlash-dt*4);
  PL.sq=lerp(PL.sq,1,1-Math.pow(0.001,dt));
}
function swingFx(a,heavy){
  const r0=heavy?36:30, r1=heavy?112:92;

/* ────────────────────────── 16. enemy update ───────────────────────────── */
let atkTokens=0;
const MAX_ATTACKERS=3;
function foeUpdate(dt){
  atkTokens=MAX_ATTACKERS;
  for(const e of foes) if(e.st==='wind'&&!e.boss) atkTokens--;
  for(const e of foes){
    if(!onScreen(e.x,e.y,900)&&!e.boss){ e.stt+=dt; continue; }
    e.hurt=Math.max(0,e.hurt-dt); e.flashT=Math.max(0,e.flashT-dt);
    e.stun=Math.max(0,e.stun-dt); e.slow=Math.max(0,e.slow-dt);
    if(e.burnT>0){ e.burnT-=dt; e.burnTick=(e.burnTick||0)-dt;
      if(e.burnTick<=0){ e.burnTick=0.5; e.hp-=e.burn;
        // no floater: the rising embers already say "burning", numbers would spam
        burst(e.x+rnd(9,-9),e.y-e.r,2,{col:'#ff7a2b',spd:40,life:.6,r:5,add:true,grav:-110});
        if(e.hp<=0){ killFoe(e,rnd(TAU)); continue; } } }
    if(e.t.ember && Math.random()<0.25)
      burst(e.x+rnd(14,-14),e.y-e.r,1,{col:'#ff7a2b',spd:24,life:.8,r:4,add:true,grav:-90});

    const d=dst(e.x,e.y,PL.x,PL.y);
    const aggro=e.boss?620:(e.t.ranged?400:300);
    const leash=e.boss?800:380;
    /* Hard leash. Enemies guard a patch of ground, not you: drag one far
       enough from where it lives and it breaks off and walks home, and it
       stays disengaged until it gets there. Without this they followed you
       across the island and the only way out was to kill them. */
    const fromHome=dst(e.x,e.y,e.home.x,e.home.y);
    if(fromHome>leash) e.returning=true;
    if(e.returning && fromHome<100) e.returning=false;
    /* Noticing you takes a moment, and the delay is per-enemy, so a camp wakes
       up raggedly instead of the whole island turning on you at once. */
    if(!PL.dead && d<aggro && !e.returning){
      if(e.notice===undefined) e.notice=rnd(1.05,0.3);
      if(e.notice>0){ e.notice-=dt; if(e.notice<=0) e.alert=0.55; }
    }else if(d>aggro*1.08 || e.returning){ e.notice=undefined; }

    const canSee=!PL.dead && awake && d<aggro*1.18 && !e.returning;

        if(e.t.ranged){
          projFx({x:e.x,y:e.y-e.r,ang:a,sp:520,r:9,life:1.4,dmg:e.dmg,foe:true,cols:['#e8e0c8','#fff'],tlen:14,
            draw(p){ ctx.save(); ctx.translate(SX(p.x),SY(p.y));
              ctx.beginPath(); ctx.arc(0,0,5,0,TAU); inkFill(ctx,'#3b3f46',2.2);
              ctx.restore();
              ctx.save(); ctx.globalAlpha=.35; ctx.strokeStyle='#cfd6da'; ctx.lineWidth=2;
              ctx.beginPath(); ctx.moveTo(SX(p.x),SY(p.y));
              ctx.lineTo(SX(p.x)-Math.cos(p.ang)*22,SY(p.y)-Math.sin(p.ang)*22); ctx.stroke(); ctx.restore(); }});
          burst(e.x+Math.cos(a)*16,e.y-e.r+Math.sin(a)*16,7,{col:'#f0e6c8',spd:170,life:.35,r:4,ang:a,spread:1,kind:'streak'});
        }else if(e.boss && e.special>=2){
          e.special=0;
          // boss slam: ring you must leave
          areaHit(0,0,0,0);
          const bx=e.x,by=e.y;
          // an enemy AoE must read as danger, not decoration: a heavy vermilion
          // wall with a hard ink lip, the one enemy effect allowed the accent
          fx.push({t:0,dur:0.5,z:1,up(){},dr(){
            const kk=this.t/0.5, r=lerp(24,278,easeOutQuint(kk)), al=1-kk;

            ctx.beginPath(); ctx.arc(SX(bx),SY(by),r,0,TAU); ctx.stroke();

            ctx.beginPath(); ctx.arc(SX(bx),SY(by),r+8*(1-kk*0.55),0,TAU); ctx.stroke();

      // nested bands, so a dozen attackers surround rather than stack
      const want=e.t.ranged?Math.min(300,e.t.range*0.8)*e.band
                          :(e.t.range+e.r)*e.band;
      const ox2=PL.x+Math.cos(e.orbit)*want, oy2=PL.y+Math.sin(e.orbit)*want;

/* A figure is ~30 separate fill/stroke calls. Enemies re-use their pose from
   frame to frame — an idle one is literally identical — so each enemy keeps a
   baked sprite and only re-bakes when its pose actually changes. Idle crowds,
   which is what an island mostly is, collapse to one blit each.
   Pose is quantised finely (0.4rad of stride, 0.02rad of arm) so the animation
   stays smooth; it is a cache key, not a reduction in frame rate. */
function figOpts(e,wind){
  return {s:(e.boss?1.85:e.vs)*(e.type==='magma'?1.15:1),
    dir:e.dir,ph:e.ph,walk:e.walk,pal:e.pal,hat:e.hat,wep:e.wep,
    aimA:wind?-1.5:(-0.75+((e.seed*0.037)%1)*0.9+Math.sin(T*1.6+e.seed)*0.10),
    swing:wind?(1-e.stt/e.t.wind)*0.5:0,
    coat:e.boss||e.type==='skele',evil:e.t.evil,chest:e.type==='marine'};
}
/* The cache is GLOBAL and keyed on the pose, not on the enemy, so a crowd of
   marines shares one set of walk frames instead of baking its own.
   Two things make the keys actually repeat:
     · phase is wrapped into [0,TAU) — e.ph accumulates forever, so an unwrapped
       key is monotonic and never hits, which turned this cache into a
       per-frame canvas-allocate-and-readback machine;
     · when walk≈0 the stride and bob are both multiplied by walk, so phase has
       no effect at all — idle enemies collapse to a single frame. */
const FIG=new Map(); let figBytes=0, figBakeBudget=0, figMiss=0;
const FIG_MAX=520;
function figSprite(e,wind){
  const o=figOpts(e,wind);
  // 1/12 steps: still only ~3 buckets across the 0.9–1.09 size jitter, but they
  // land on the intended sizes instead of stretching the spread
  const s=Math.round(o.s*12)/12;
  o.s=s;
  const ph=((o.ph%TAU)+TAU)%TAU;
  const walking=o.walk>0.06;
  /* Key space is kept small deliberately: every extra bucket multiplies out and
     starts evicting frames that are about to be needed again. 10 stride steps,
     5 arm angles — enough that enemies don't move in lockstep, few enough that
     a crowd's whole walk cycle stays resident. */
  const key=e.type+(e.vpal||0)+'|'+s+'|'+(o.dir>0?1:0)+'|'
    +(walking?Math.round(ph*1.6):'i')+'|'+Math.round(clamp(o.walk,0,1)*2)+'|'
    +Math.round(o.aimA*3)+'|'+Math.round(o.swing*5)+'|'+DPR;
  let sp=FIG.get(key);
  if(sp){ FIG.delete(key); FIG.set(key,sp); return sp; }   // LRU touch
  figMiss++;
  // A cold frame draws a few figures directly rather than stalling on bakes.
  if(figBakeBudget<=0) return null;
  figBakeBudget--;
  o.ph=ph; o.x=0; o.y=0; o.ft=ph;   // flutter off phase, not T, or the key churns
  sp=bakeSprite(152*s,112*s,76*s,96*s,g=>drawFigure(g,o));
  FIG.set(key,sp); figBytes+=sp.bytes;
  while(FIG.size>FIG_MAX){

    FIG.delete(k); figBytes-=v.bytes;

}
function drawFoe(e){
  const shake=e.hurt>0?(Math.random()*2-1)*3:0;
  const wind=e.st==='wind';
  if(wind){
    // telegraph: a hard red arc, the hazard shape language
    const k=1-e.stt/e.t.wind;
    ctx.save(); ctx.globalAlpha=0.25+k*0.5;
    ctx.strokeStyle=C.vermil; ctx.lineWidth=3.4;
    const a=angTo(e.x,e.y,PL.x,PL.y);
    ctx.beginPath(); ctx.arc(SX(e.x),SY(e.y-e.r*0.6),e.t.range+40,a-1.0,a+1.0); ctx.stroke();
    ctx.globalAlpha=0.14*k; ctx.fillStyle=C.vermil;
    ctx.beginPath(); ctx.moveTo(SX(e.x),SY(e.y-e.r*0.6));
    ctx.arc(SX(e.x),SY(e.y-e.r*0.6),e.t.range+40,a-1.0,a+1.0); ctx.closePath(); ctx.fill();
    ctx.restore(); ctx.globalAlpha=1;

       case where baking costs more than drawing. */
    const o=figOpts(e,wind); o.x=SX(e.x)+shake; o.y=SY(e.y);
    drawFigure(ctx,o);

      blitSprite(ctx,sp,SX(e.x)+shake,SY(e.y));
      ctx.restore();
    }else{                                  // budget spent this frame
      const o=figOpts(e,wind); o.x=SX(e.x)+shake; o.y=SY(e.y);
      drawFigure(ctx,o);
    }
  }

    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=e.flashT/0.12*0.55;
    ctx.fillStyle='#ffffff';
    ell(ctx,SX(e.x),SY(e.y)-e.r*1.6,e.r*1.25,e.r*2.0); ctx.fill();
    ctx.restore(); ctx.globalAlpha=1;

    ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.6; ctx.stroke(); ctx.restore(); ctx.globalAlpha=1;

    ctx.scale(pop,pop);

    ctx.strokeStyle=INK; ctx.lineWidth=6; ctx.strokeText('!',0,0);
    ctx.fillStyle=C.vermil; ctx.fillText('!',0,0);
    ctx.restore();

  if(e.hp<e.max && !e.boss){
    const w=Math.max(30,e.r*2.4), x=SX(e.x)-w/2, y=SY(e.y)-e.r*3.2;
    ctx.fillStyle=INK; ctx.fillRect(x-1.5,y-1.5,w+3,7);
    ctx.fillStyle=C.vermil2; ctx.fillRect(x,y,w,4);

function drawSerpent(e,shake){
  const x=SX(e.x)+shake, y=SY(e.y);

  ctx.save();

    const t=i/7, a=e.ph*0.6+i*0.9;
    const bx=x-Math.cos(e.dir>0?0.4:PI-0.4)*i*26+Math.sin(a)*10;
    const by=y+Math.sin(a)*13+i*3;

/* ─────────────────────── 17. the sea (woodblock) ───────────────────────── */
const clouds=[];
for(let i=0;i<16;i++) clouds.push({x:rnd(7000,-3500),y:rnd(7000,-3500),r:rnd(430,190),sp:rnd(16,7),a:rnd(TAU)});
/* A woodblock sea is not a field of dashes — it is a stack of flat tonal
   SWELLS, each a solid shape whose leading edge carries the foam, and the
   crest curls grow off the ends of those edges. Structure first, then detail. */
/* Appends one curl to the CURRENT path rather than drawing it. Every curl in a
   swell layer shares a colour, so they batch into a single fill and a single
   stroke instead of five draw calls each. Same geometry, same pixels. */
function crestCurlPath(g,x,y,s,flip,drips){
  const sx=flip?-s:s;
  const P=(px,py)=>[x+px*sx,y+py*s];
  const m=P(0,1), a1=P(7,-9), a2=P(17,-12), b1=P(28,-15), b2=P(26,-4),
        c1=P(24,3), c2=P(17,-1), d1=P(10,-4), d2=P(0,1);
  g.moveTo(m[0],m[1]);
  g.quadraticCurveTo(a1[0],a1[1],a2[0],a2[1]);   // the lift off the ridge
  g.quadraticCurveTo(b1[0],b1[1],b2[0],b2[1]);   // breaking over
  g.quadraticCurveTo(c1[0],c1[1],c2[0],c2[1]);   // curling back under
  g.quadraticCurveTo(d1[0],d1[1],d2[0],d2[1]);
  g.closePath();
  if(drips){                                      // drips falling off the lip
    const D=[[25,4.5,2.3,3.0],[20,8.5,1.6,2.1],[14.5,11,1.1,1.4]];
    for(const q of D){
      const c=P(q[0],q[1]);
      g.moveTo(c[0]+q[2]*s,c[1]);
      g.ellipse(c[0],c[1],q[2]*s,q[3]*s,0,0,TAU);
    }
  }
}
function drawSea(){

     h:184*Z,per:406*Z,sp:0.46,amp:48*Z,wl:0.0049/Z,t:0.24,lw:2.2*Z,curl:0.40,cs:0.78,
     dx:11*Z,dy:3.5*Z},
    {col:'#235f85',ed:'rgba(10,34,52,0.5)', fm:'rgba(214,240,240,0.85)',sh:'rgba(12,40,60,0.45)',
     h:128*Z,per:276*Z,sp:0.66,amp:36*Z,wl:0.0074/Z,t:0.36,lw:2.7*Z,curl:0.62,cs:0.94,
     dx:18*Z,dy:5.5*Z},
    {col:'#31799e',ed:'rgba(12,42,62,0.45)',fm:'rgba(238,252,249,0.96)',sh:'rgba(14,48,70,0.45)',
     h: 88*Z,per:190*Z,sp:0.86,amp:26*Z,wl:0.0104/Z,t:0.52,lw:3.1*Z,curl:0.76,cs:1.08,

  /* Margin sized to what the rake actually needs (rotating a W×H rect by θ),

       foam runs, curls — is positioned in this drifting space rather than in
       screen space. Screen-anchored seeds were regenerating the whole foam
       pattern every time the camera crossed a quantum, which is what made the
       water jump about while you walked and sit dead still when you stopped. */

function drawSurf(){
  ctx.save(); ctx.lineCap='round';
  for(const is of ISLES){
    if(!onScreen(is.x,is.y,is.R+260)) continue;

      ctx.strokeStyle=b?'rgba(223,241,238,0.85)':'rgba(223,241,238,0.45)';
      ctx.lineWidth=b?3.4:6;
      ctx.beginPath();
      const N=90;
      for(let i=0;i<=N;i++){
        const a=i/N*TAU;
        const r=is.radAt(a)*(1.02+b*0.035)+Math.sin(a*9+T*(b?1.8:1.2))*5+Math.sin(a*17-T*1.4)*3;

        i?ctx.lineTo(x,y):ctx.moveTo(x,y);
      }
      ctx.stroke();
    }

}

/* ─────────────────────────── 18. interface ─────────────────────────────── */
/* Every surface is the same parchment plate with notched corners and a
   double rule — the UI is a printed broadsheet laid over the print. */
function platePath(g,x,y,w,h){
  const n=9;
  g.beginPath();
  g.moveTo(x+n,y); g.lineTo(x+w-n,y); g.lineTo(x+w,y+n);
  g.lineTo(x+w,y+h-n); g.lineTo(x+w-n,y+h); g.lineTo(x+n,y+h);
  g.lineTo(x,y+h-n); g.lineTo(x,y+n); g.closePath();
}
function plate(x,y,w,h,alpha){
  const n=9;
  ctx.save();
  platePath(ctx,x,y,w,h);
  ctx.globalAlpha=alpha===undefined?0.93:alpha;
  ctx.fillStyle=C.paper; ctx.fill();
  ctx.globalAlpha=1;
  ctx.strokeStyle=INK; ctx.lineWidth=3; ctx.stroke();
  ctx.globalAlpha=.34; ctx.lineWidth=1.2;
  ctx.beginPath();
  const m=5;
  ctx.moveTo(x+n+m,y+m); ctx.lineTo(x+w-n-m,y+m); ctx.lineTo(x+w-m,y+n+m);
  ctx.lineTo(x+w-m,y+h-n-m); ctx.lineTo(x+w-n-m,y+h-m); ctx.lineTo(x+n+m,y+h-m);
  ctx.lineTo(x+m,y+h-n-m); ctx.lineTo(x+m,y+n+m); ctx.closePath(); ctx.stroke();
  ctx.restore(); ctx.globalAlpha=1;
}
function bar(x,y,w,h,frac,col,col2,ticks){
  ctx.fillStyle=INK; rr(ctx,x-2.5,y-2.5,w+5,h+5,3); ctx.fill();
  ctx.fillStyle='#6b5a3e'; rr(ctx,x,y,w,h,2); ctx.fill();
  const fw=Math.max(0,w*clamp(frac,0,1));
  if(fw>0){
    ctx.save(); rr(ctx,x,y,w,h,2); ctx.clip();
    ctx.fillStyle=col2; ctx.fillRect(x,y,fw,h);
    ctx.fillStyle=col; ctx.fillRect(x,y,fw,h*0.55);
    ctx.restore();
  }
  if(ticks){
    ctx.strokeStyle='rgba(18,32,44,.45)'; ctx.lineWidth=1.4;
    for(let i=1;i<ticks;i++){ const px=x+w*i/ticks;
      ctx.beginPath(); ctx.moveTo(px,y+1); ctx.lineTo(px,y+h-1); ctx.stroke(); }
  }
}
function coin(x,y,r){
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU); inkFill(ctx,C.gold,2.4);
  ctx.beginPath(); ctx.arc(x,y,r*0.62,0,TAU); ctx.strokeStyle=C.gold2; ctx.lineWidth=1.6; ctx.stroke();
}
function drawHUD(){
  ctx.textBaseline='middle';

  const px=16,py=16,pw=286,ph=104;
