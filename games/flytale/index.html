<!doctype html>
<html><head><meta charset="utf-8"><title>FLYTALE</title>
<style>
html,body{margin:0;height:100%;background:#07060c;overflow:hidden;display:flex;flex-direction:column;
align-items:center;justify-content:center;font-family:monospace}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
#h{color:#474459;font:11px monospace;margin-top:6px;letter-spacing:1px}
</style></head><body>
<canvas id=c width=320 height=240></canvas>
<div id=h>ARROWS/WASD move &middot; Z confirm &middot; X cancel &middot; M mute</div>
<script>
/* =====================================================================
   FLYTALE  -  art direction

   THESIS   A housefly's life is an epic. Everything is drawn like a
            1994 handheld RPG battle screen: hard 1px black outlines,
            three flat values per material, dithered shade instead of
            translucency. Nothing on screen may have a soft edge.
   ANCHOR   Game Boy Color / early GBA battle sprites (Pokemon G/S
            enemy art, Mother 3 bug portraits). Proposed by me.
   PALETTE  28 fixed colors with roles below. Hostile things are warm
            (red/orange/yellow), the fly is cold slate + one red eye,
            UI is orange-on-black, telegraphs are ALWAYS flashing red.
   TYPE     Bold Courier, rendered once to an offscreen buffer and
            alpha-THRESHOLDED to 1-bit, so text is hard pixels with no
            grey fringe. No live canvas fillText anywhere on screen.
   LEGIBILITY  Silhouette first: every creature is one readable blob
            with limbs breaking the outline. Damage = white flash.
            Danger = red flashing outline. Safe = no outline.

   NO ctx.rotate (sprites are pre-rotated nearest-neighbour, 16 steps)
   NO ctx.arc    (discs are integer scanline spans)
   NO rgba fills (transparency is checkerboard dither)
   ===================================================================== */

const cv=document.getElementById('c'),g=cv.getContext('2d');
g.imageSmoothingEnabled=false;
function fit(){const s=Math.max(1,Math.floor(Math.min(innerWidth/320,(innerHeight-40)/240)));
 if(s<1||!isFinite(s))return;cv.style.width=320*s+'px';cv.style.height=240*s+'px';}
onresize=fit;fit();

/* ================= palette ================= */
const PAL={'0':'#07060c','1':'#17151f','2':'#2b2838','3':'#474459','4':'#6d6a85','5':'#9c99b4',
 '6':'#cfcde0','7':'#ffffff','a':'#f6cb9a','b':'#d99f6b','c':'#a56b41','d':'#3a2617','e':'#f0f1fa',
 'f':'#c2c5da','g':'#c83c3c','h':'#8a2020','i':'#6fd0f5','j':'#2e8fc4','k':'#ffd866','l':'#f09d2a',
 'm':'#8fd44a','n':'#3f8a2e','o':'#c9a96a','p':'#8a6f42','q':'#7b5aa0','r':'#4a3260','s':'#b0b6c6',
 't':'#6f7688','u':'#e8e9f2','v':'#d96b2a','w':'#5a3a1e','x':'#ffef9a','y':'#39364a','z':'#b8341e'};

/* ================= pixel grid builders ================= */
function G(w,h){const d=[];for(let y=0;y<h;y++)d.push(new Array(w).fill('.'));return{w:w,h:h,d:d};}
function st(gr,x,y,c){x|=0;y|=0;if(x<0||y<0||x>=gr.w||y>=gr.h)return;gr.d[y][x]=c;}
function R(gr,x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)st(gr,x+i,y+j,c);}
function DIT(gr,x,y,w,h,c,p){for(let j=0;j<h;j++)for(let i=0;i<w;i++)
 if(((x+i)+(y+j))%2==(p||0))st(gr,x+i,y+j,c);}
function EL(gr,cx,cy,rx,ry,c){for(let y=-ry;y<=ry;y++){const t=1-(y*y)/(ry*ry);if(t<0)continue;
 const w=Math.floor(rx*Math.sqrt(t));for(let x=-w;x<=w;x++)st(gr,cx+x,cy+y,c);}}
function LN(gr,x1,y1,x2,y2,c,th){const n=Math.max(1,Math.ceil(Math.hypot(x2-x1,y2-y1)));th=th||1;
 for(let i=0;i<=n;i++){const X=Math.round(x1+(x2-x1)*i/n),Y=Math.round(y1+(y2-y1)*i/n);
  for(let a=0;a<th;a++)for(let b=0;b<th;b++)st(gr,X+a-(th>>1),Y+b-(th>>1),c);}}
function TRI(gr,x1,y1,x2,y2,x3,y3,c){
 const mnx=Math.min(x1,x2,x3)|0,mxx=Math.max(x1,x2,x3)|0,mny=Math.min(y1,y2,y3)|0,mxy=Math.max(y1,y2,y3)|0;
 const s=(a,b,cx,cy,dx,dy)=>(a-dx)*(cy-dy)-(cx-dx)*(b-dy);
 for(let y=mny;y<=mxy;y++)for(let x=mnx;x<=mxx;x++){
  const d1=s(x,y,x1,y1,x2,y2),d2=s(x,y,x2,y2,x3,y3),d3=s(x,y,x3,y3,x1,y1);
  const neg=(d1<0)||(d2<0)||(d3<0),pos=(d1>0)||(d2>0)||(d3>0);
  if(!(neg&&pos))st(gr,x,y,c);}}
/* auto 1px outline: any empty cell touching ink becomes outline */
function OUT(gr,c){const add=[];
 for(let y=0;y<gr.h;y++)for(let x=0;x<gr.w;x++){if(gr.d[y][x]!='.')continue;
  let n=false;
  if(x>0&&gr.d[y][x-1]!='.'&&gr.d[y][x-1]!=c)n=true;
  if(x<gr.w-1&&gr.d[y][x+1]!='.'&&gr.d[y][x+1]!=c)n=true;
  if(y>0&&gr.d[y-1][x]!='.'&&gr.d[y-1][x]!=c)n=true;
  if(y<gr.h-1&&gr.d[y+1][x]!='.'&&gr.d[y+1][x]!=c)n=true;
  if(n)add.push([x,y]);}
 add.forEach(p=>gr.d[p[1]][p[0]]=c||'0');return gr;}

/* ================= baking ================= */
function bake(gr,ov){const c=document.createElement('canvas');c.width=gr.w;c.height=gr.h;
 const x=c.getContext('2d');
 for(let y=0;y<gr.h;y++)for(let i=0;i<gr.w;i++){const ch=gr.d[y][i];if(ch=='.')continue;
  x.fillStyle=ov?(ch=='0'?'#0b0a12':ov):PAL[ch]||'#f0f';x.fillRect(i,y,1,1);}
 c.gw=gr.w;c.gh=gr.h;return c;}
/* nearest-neighbour pre-rotation, no ctx.rotate = no antialiasing */
function bakeRot(gr,n){const out=[],R2=Math.ceil(Math.hypot(gr.w,gr.h))+2;
 for(let k=0;k<n;k++){const a=k/n*6.28318,ca=Math.cos(-a),sa=Math.sin(-a);
  const c=document.createElement('canvas');c.width=c.height=R2;const x=c.getContext('2d');
  for(let py=0;py<R2;py++)for(let pxx=0;pxx<R2;pxx++){
   const dx=pxx-R2/2+0.5,dy=py-R2/2+0.5;
   const sx=Math.floor(dx*ca-dy*sa+gr.w/2),sy=Math.floor(dx*sa+dy*ca+gr.h/2);
   if(sx<0||sy<0||sx>=gr.w||sy>=gr.h)continue;
   const ch=gr.d[sy][sx];if(ch=='.')continue;
   x.fillStyle=PAL[ch]||'#f0f';x.fillRect(pxx,py,1,1);}
  c.r=R2;out.push(c);}
 return out;}
function blit(c,x,y,flip){if(!c)return;
 if(flip){g.save();g.translate(Math.round(x)+c.width,Math.round(y));g.scale(-1,1);
  g.drawImage(c,0,0);g.restore();}
 else g.drawImage(c,Math.round(x),Math.round(y));}
function blitRot(arr,cx,cy,ang){const n=arr.length;
 let k=Math.round(((ang%6.28318)+6.28318)%6.28318/6.28318*n)%n;const c=arr[k];
 g.drawImage(c,Math.round(cx-c.r/2),Math.round(cy-c.r/2));}

/* ================= crisp primitives ================= */
function px(a,b,w,h,c){g.fillStyle=c;g.fillRect(a|0,b|0,Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));}
function disc(cx,cy,r,c,oc){cx=Math.round(cx);cy=Math.round(cy);r=Math.max(1,Math.round(r));
 g.fillStyle=c;for(let y=-r;y<=r;y++){const t=r*r-y*y;if(t<0)continue;
  const w=Math.floor(Math.sqrt(t));g.fillRect(cx-w,cy+y,w*2+1,1);}
 if(oc){g.fillStyle=oc;for(let y=-r;y<=r;y++){const t=r*r-y*y;if(t<0)continue;
  const w=Math.floor(Math.sqrt(t));g.fillRect(cx-w-1,cy+y,1,1);g.fillRect(cx+w+1,cy+y,1,1);}
  const w0=r;g.fillRect(cx-w0,cy-r-1,w0*2+1,1);g.fillRect(cx-w0,cy+r+1,w0*2+1,1);}}
function dith(x,y,w,h,c,p){g.fillStyle=c;x=x|0;y=y|0;
 for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(((x+i)+(y+j))%2==(p||0))g.fillRect(x+i,y+j,1,1);}
function frame(x,y,w,h,c){px(x,y,w,1,c);px(x,y+h-1,w,1,c);px(x,y,1,h,c);px(x+w-1,y,1,h,c);}
function LNs(x1,y1,x2,y2,c,th){const n=Math.max(1,Math.ceil(Math.hypot(x2-x1,y2-y1)));g.fillStyle=c;
 for(let i=0;i<=n;i++)g.fillRect(Math.round(x1+(x2-x1)*i/n)-(th>>1),Math.round(y1+(y2-y1)*i/n)-(th>>1),th,th);}

/* ================= 1-bit text ================= */
const _tc=document.createElement('canvas'),_tx=_tc.getContext('2d');
const _tcache=new Map(),_cw={};
function tfont(s){return 'bold '+s+'px "Courier New",Courier,monospace';}
function charW(s){if(_cw[s])return _cw[s];_tx.font=tfont(s);_cw[s]=Math.max(4,Math.round(_tx.measureText('M').width));return _cw[s];}
function h2r(h){return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];}
function bakeText(s,col,sz){const cw=charW(sz),w=Math.max(2,cw*s.length+2),h=sz+6;
 _tc.width=w;_tc.height=h;_tx.font=tfont(sz);_tx.textBaseline='top';_tx.fillStyle='#fff';
 for(let i=0;i<s.length;i++)_tx.fillText(s[i],i*cw,2);
 const im=_tx.getImageData(0,0,w,h),d=im.data,rgb=h2r(col);
 for(let i=0;i<d.length;i+=4){if(d[i+3]>=110){d[i]=rgb[0];d[i+1]=rgb[1];d[i+2]=rgb[2];d[i+3]=255;}
  else d[i+3]=0;}
 const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').putImageData(im,0,0);
 return {c:c,cw:cw,h:h};}
function T(s,x,y,col,sz,al,n){if(s==null||s==='')return;col=col||'#ffffff';sz=sz||10;
 const k=s+'|'+col+'|'+sz;let e=_tcache.get(k);
 if(!e){e=bakeText(s,col,sz);_tcache.set(k,e);}
 const nn=(n==null?s.length:Math.max(0,Math.min(s.length,n)));if(nn<=0)return;
 let X=x;if(al=='center')X=x-(s.length*e.cw)/2;else if(al=='right')X=x-s.length*e.cw;
 const wpx=nn*e.cw;g.drawImage(e.c,0,0,wpx,e.h,Math.round(X),Math.round(y),wpx,e.h);}

/* ================= sprites ================= */
const S={};
function mkFly(up){const gr=G(13,11),y0=2;
 R(gr,0,y0+2,4,3,'2');R(gr,1,y0+1,3,1,'3');          // abdomen
 R(gr,3,y0+1,5,5,'2');R(gr,4,y0+1,3,2,'3');          // thorax
 R(gr,7,y0+1,4,4,'3');R(gr,8,y0+2,2,2,'g');st(gr,8,y0+2,'z'); // head + eye
 const wy=up?y0-2:y0-1;                               // wings
 R(gr,3,wy,6,2,'6');R(gr,4,wy-1,4,1,'5');
 R(gr,2,y0+5,5,2,'5');
 LN(gr,2,y0+5,1,y0+8,'0',1);LN(gr,5,y0+6,5,y0+8,'0',1);LN(gr,8,y0+5,9,y0+8,'0',1);
 return OUT(gr,'0');}
function mkHead(){const gr=G(24,24);
 R(gr,3,4,18,17,'b');R(gr,4,4,16,14,'a');            // face
 R(gr,2,9,2,5,'b');R(gr,20,9,2,5,'b');               // ears
 R(gr,2,0,20,5,'d');R(gr,3,3,6,3,'d');R(gr,15,3,6,3,'d');R(gr,1,3,2,7,'d');R(gr,21,3,2,7,'d');
 DIT(gr,4,2,16,2,'1',0);
 R(gr,5,9,6,4,'7');R(gr,13,9,6,4,'7');               // eyes
 R(gr,7,10,3,3,'1');R(gr,15,10,3,3,'1');
 R(gr,4,7,7,2,'d');R(gr,13,7,7,2,'d');st(gr,10,8,'d');st(gr,13,8,'d');
 R(gr,11,12,2,4,'b');R(gr,10,15,4,1,'c');            // nose
 R(gr,7,18,10,2,'h');                                 // mouth
 DIT(gr,4,16,4,4,'c',1);DIT(gr,16,16,4,4,'c',1);
 return OUT(gr,'0');}
function mkHeadYell(){const gr=mkHead();R(gr,7,17,10,5,'0');R(gr,8,18,8,3,'h');return gr;}
function mkTorso(){const gr=G(36,34);
 TRI(gr,4,6,31,6,33,33,'e');TRI(gr,4,6,33,33,2,33,'e');
 R(gr,3,8,30,25,'e');DIT(gr,3,22,30,11,'f',1);
 R(gr,12,2,12,5,'e');TRI(gr,12,2,18,12,24,2,'a');     // collar v
 R(gr,16,4,4,26,'g');R(gr,15,3,6,3,'h');R(gr,16,26,4,4,'h'); // tie
 R(gr,11,3,3,8,'f');R(gr,22,3,3,8,'f');
 return OUT(gr,'0');}
function mkHand(){const gr=G(9,9);EL(gr,4,4,4,4,'b');EL(gr,3,3,2,2,'a');return OUT(gr,'0');}
function mkTap(){const gr=G(46,72);
 R(gr,16,0,14,28,'s');R(gr,18,0,5,28,'6');DIT(gr,16,20,14,8,'t',1);
 R(gr,10,26,26,11,'t');R(gr,12,28,22,4,'s');R(gr,12,34,22,2,'y');
 R(gr,14,35,11,16,'s');R(gr,16,37,4,14,'6');
 R(gr,10,48,17,9,'t');R(gr,13,55,11,6,'s');R(gr,15,59,7,4,'y');
 R(gr,30,12,12,8,'t');R(gr,28,9,5,14,'s');R(gr,31,6,12,5,'6');R(gr,34,2,6,6,'s');
 DIT(gr,10,42,26,5,'4',1);DIT(gr,30,16,12,5,'y',0);
 return OUT(gr,'0');}
function mkAnt(){const gr=G(58,34);
 for(let i=0;i<3;i++){LN(gr,26+i*8,22,20+i*10,33,'w',3);LN(gr,20+i*10,33,16+i*10,33,'w',2);}
 EL(gr,44,18,13,11,'c');EL(gr,42,14,9,6,'b');DIT(gr,33,19,22,12,'w',1);
 EL(gr,30,19,6,6,'c');EL(gr,36,19,4,4,'c');
 EL(gr,17,17,9,8,'c');EL(gr,15,14,6,4,'b');
 R(gr,2,11,9,3,'0');R(gr,2,21,9,3,'0');
 R(gr,9,12,4,3,'k');R(gr,9,20,4,3,'k');
 R(gr,13,13,5,5,'7');R(gr,14,14,3,3,'0');
 LN(gr,20,9,13,1,'0',2);LN(gr,23,9,31,2,'0',2);
 return OUT(gr,'0');}
function mkMoth(fl){const gr=G(68,46),f=fl?4:0,C=34;
 TRI(gr,C,18,4,2+f,12,30-f,'o');TRI(gr,C,18,12,30-f,28,34,'o');
 TRI(gr,C,18,64,2+f,56,30-f,'o');TRI(gr,C,18,56,30-f,40,34,'o');
 TRI(gr,C,18,9,8+f,17,26-f,'u');TRI(gr,C,18,59,8+f,51,26-f,'u');
 EL(gr,16,18,6,6,'p');EL(gr,16,18,3,3,'u');EL(gr,52,18,6,6,'p');EL(gr,52,18,3,3,'u');
 DIT(gr,6,4+f,16,8,'p',0);DIT(gr,46,4+f,16,8,'p',1);
 EL(gr,C,25,5,14,'p');DIT(gr,C-5,20,11,14,'s',0);
 EL(gr,C,16,6,7,'o');EL(gr,C,9,5,5,'o');EL(gr,C-1,8,3,3,'u');
 R(gr,C-4,7,3,3,'0');R(gr,C+2,7,3,3,'0');
 LN(gr,C-3,6,24,0,'0',2);LN(gr,C+3,6,44,0,'0',2);
 return OUT(gr,'0');}
function mkSpider(step){const gr=G(78,56),k=step?3:0,C=39;
 for(let i=0;i<4;i++){const kx=C-8-i*9,ky=16+i*4+(i%2?k:-k),fx=C-32-i*2,fy=38+i*5-(i%2?k:-k);
  LN(gr,C-4,33,kx,ky,'q',4);LN(gr,kx,ky,fx,fy,'q',3);st(gr,kx,ky,'u');
  LN(gr,C+4,33,2*C-kx,ky,'q',4);LN(gr,2*C-kx,ky,2*C-fx,fy,'q',3);st(gr,2*C-kx,ky,'u');}
 EL(gr,C,36,18,16,'r');EL(gr,C,32,14,11,'q');DIT(gr,C-16,38,32,14,'q',1);
 EL(gr,C-6,30,3,3,'r');EL(gr,C+6,30,3,3,'r');
 EL(gr,C,18,12,10,'r');EL(gr,C-2,16,9,7,'q');
 R(gr,C-8,13,6,6,'7');R(gr,C+2,13,6,6,'7');R(gr,C-7,15,4,4,'0');R(gr,C+3,15,4,4,'0');
 R(gr,C-13,18,4,4,'7');R(gr,C+9,18,4,4,'7');R(gr,C-12,19,2,2,'0');R(gr,C+10,19,2,2,'0');
 LN(gr,C-5,25,C-7,31,'0',2);LN(gr,C+5,25,C+7,31,'0',2);
 return OUT(gr,'0');}
/* weapons (drawn pointing +x, rotated at draw time) */
function mkSwatter(){const gr=G(38,18);R(gr,0,7,22,4,'w');R(gr,1,8,20,1,'p');
 R(gr,20,1,16,16,'3');R(gr,21,2,14,14,'4');
 for(let i=0;i<4;i++)for(let j=0;j<4;j++)R(gr,22+i*3,3+j*3,2,2,'1');
 return OUT(gr,'0');}
function mkNews(){const gr=G(38,14);R(gr,0,2,36,10,'o');R(gr,0,2,36,3,'u');
 for(let i=0;i<5;i++)R(gr,4+i*6,7,4,1,'p');R(gr,30,2,4,10,'p');DIT(gr,0,9,36,3,'p',0);
 return OUT(gr,'0');}
function mkSpray(){const gr=G(22,22);R(gr,2,4,12,17,'g');R(gr,2,4,12,3,'6');
 R(gr,4,9,8,7,'x');R(gr,5,11,6,3,'h');R(gr,14,6,5,5,'6');R(gr,18,7,4,3,'4');
 DIT(gr,10,7,4,14,'h',1);return OUT(gr,'0');}
function mkZap(){const gr=G(38,26);R(gr,0,11,14,4,'2');R(gr,1,12,12,1,'4');
 EL(gr,25,13,12,12,'3');EL(gr,25,13,10,10,'1');
 for(let i=0;i<5;i++){LN(gr,16+i*4,4,16+i*4,22,'k',1);LN(gr,15,7+i*3,36,7+i*3,'k',1);}
 EL(gr,25,13,12,12,'3');EL(gr,25,13,10,10,'1');
 for(let i=0;i<4;i++){LN(gr,17+i*5,5,17+i*5,21,'k',1);LN(gr,15,8+i*4,36,8+i*4,'k',1);}
 R(gr,12,9,4,8,'g');R(gr,13,10,2,6,'z');return OUT(gr,'0');}
function mkVac(){const gr=G(40,26);R(gr,0,8,14,10,'t');R(gr,1,9,12,3,'s');
 DIT(gr,0,14,14,4,'3',0);
 TRI(gr,14,4,14,22,28,0,'t');TRI(gr,14,22,28,26,28,0,'t');
 R(gr,26,0,6,26,'y');R(gr,32,2,4,22,'3');R(gr,28,2,2,22,'s');
 return OUT(gr,'0');}
function mkShotgun(){const gr=G(48,14);R(gr,0,4,16,8,'w');R(gr,1,5,14,2,'p');
 R(gr,14,4,32,4,'2');R(gr,14,8,26,3,'3');R(gr,44,3,4,6,'1');R(gr,12,7,4,6,'2');
 return OUT(gr,'0');}
function mkFlamer(){const gr=G(44,20);R(gr,0,6,10,9,'n');R(gr,10,5,22,10,'n');
 R(gr,10,5,22,3,'m');R(gr,32,7,8,6,'y');R(gr,40,8,4,4,'t');
 R(gr,4,0,8,7,'z');R(gr,5,1,6,4,'g');DIT(gr,12,11,20,4,'p',1);
 return OUT(gr,'0');}
function mkRpg(){const gr=G(54,18);R(gr,2,5,46,9,'n');R(gr,2,5,46,3,'m');
 R(gr,0,2,6,15,'p');R(gr,44,2,8,15,'y');R(gr,18,1,10,5,'2');R(gr,20,0,3,3,'t');
 DIT(gr,6,11,38,3,'p',0);return OUT(gr,'0');}
function mkRocket(){const gr=G(18,9);R(gr,4,2,10,5,'z');R(gr,4,2,10,2,'v');
 R(gr,13,3,4,3,'k');R(gr,3,0,4,2,'2');R(gr,3,7,4,2,'2');R(gr,0,3,4,3,'l');
 return OUT(gr,'0');}

/* ================= scenes ================= */

/* ================= update ================= */
function update(){fr++;if(shake>0)shake--;if(flashScr>0)flashScr--;
 if(E&&E.flash>0)E.flash--;if(P.inv>0)P.inv--;
 if(banner){banner.t++;if(banner.t>112)banner=null;}
 pops.forEach(p=>{p.t++;p.y+=p.v;p.v+=0.06;});pops=pops.filter(p=>p.t<50);
 parts.forEach(p=>{p.t++;p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.vx*=0.96;});
 parts=parts.filter(p=>p.t<p.life);
 if(hs>0){hs--;return;}

 if(mode=='title'){if(kp(...CONF)){aInit();si=0;nextStep();}return;}
 if(mode=='card'){cardT++;if(cardT>110||kp(...CONF))nextStep();return;}
 if(mode=='dead'){gt++;if(gt>40&&kp(...CONF)){P.hp=P.max;P.inv=0;bullets=[];pops=[];
  E.hp=E.max;mode='battle';
  say('* You get up.\n* You are a fly, but you are a DETERMINED fly.',E.survive?startAttack:startTurn);}
  return;}
 if(mode=='end'){endT++;if(endT>70&&kp(...CONF))location.reload();return;}

 if(state=='dialog'){
  if(!dDone()){D.n+=dn(...CONF)?3:1;if(D.n%2==0)bp(430+Math.random()*90,0.03,'square',0.03);}
  else if(kp(...CONF)){const cb=D.cb;D=null;if(cb)cb();}
  return;}
 if(state=='menu'){
  if(!subMode){
   if(kp('ArrowLeft','KeyA')){menu=(menu+3)%4;bp(330,0.05,'square',0.05);}
   if(kp('ArrowRight','KeyD')){menu=(menu+1)%4;bp(330,0.05,'square',0.05);}
   if(kp(...CONF)){bp(520,0.07,'square',0.06);
    if(menu==0){
     if(E.man&&E.w==9){ending='kill';kills++;
      sayAll(['* You dive straight at his forehead.',
       '* The MAN staggers, trips over the chair, and\n  does not get up.',
       '* You open the window latch with your whole\n  body. It takes nine minutes.'],()=>{mode='end';endT=0;});}
     else{state='fightbar';bar={x:box.x+8,v:3.4+(E.man?E.w*0.18:0.4)};}}
    else if(menu==1){subMode='act';sub=0;}
    else if(menu==2){subMode='item';sub=0;}
    else{
     if(E.spare){spared++;
      if(E.man){ending='spare';sayAll(['* You buzz once. Softly.',
       '* The MAN stares at you for a long, long moment.','* ...',
       '* He walks to the window and slides it open.','MAN: ...Go on. Get.'],()=>{mode='end';endT=0;});}
      else battleEnd(E.def.spared);}
     else say(E.man?'* You offer peace.\n* He does not accept apologies from flies.'
                  :'* You try to make peace.\n* It is not working. Not yet.',startAttack);}}
   return;}
  if(kp(...CANC)){subMode=null;return;}
  const n=subMode=='act'?E.acts.length:items.length;
  if(kp('ArrowDown','KeyS')){sub=(sub+1)%n;bp(330,0.05,'square',0.05);}
  if(kp('ArrowUp','KeyW')){sub=(sub+n-1)%n;bp(330,0.05,'square',0.05);}
  if(kp(...CONF)){bp(560,0.07,'square',0.06);
   if(subMode=='act'){const a=E.acts[sub];subMode=null;
    if(a[2]==1){E.spare=true;bp(760,0.25,'triangle',0.07);say(a[1]+'\n* (MERCY is now yellow.)',startTurn);}
    else if(a[2]==2){bonus+=8;say(a[1]+'\n* (Next FIGHT: +'+bonus+' damage.)',startAttack);}
    else if(a[2]==3){dmgE(9);E.rage=1;say(a[1],startAttack);}
    else say(a[1],sub==0?startTurn:startAttack);}
   else{const it=items[sub];subMode=null;
    if(it.c<=0)say('* You are out of that.',startTurn);
    else{it.c--;P.hp=Math.min(P.max,P.hp+it.h);bp(700,0.2,'triangle',0.07);say(it.t,startAttack);}}}
  return;}
 if(state=='fightbar'){bar.x+=bar.v;
  if(bar.x>box.x+box.w-8){bar.x=box.x+box.w-8;say('* You hesitated. It did not.',startAttack);}
  if(kp(...CONF)){const c=box.x+box.w/2,acc=1-Math.abs(bar.x-c)/((box.w-16)/2);
   const d=Math.max(4,Math.round(40*Math.pow(Math.max(acc,0),1.4))+bonus);bonus=0;
   dmgE(d);state='hitpause';gt=0;}
  return;}
 if(state=='hitpause'){gt++;if(gt>45)afterHit();return;}
 if(state=='attack'){
  const ax=(dn('ArrowRight','KeyD')?1:0)-(dn('ArrowLeft','KeyA')?1:0);
  const ay=(dn('ArrowDown','KeyS')?1:0)-(dn('ArrowUp','KeyW')?1:0);
  if(ax)P.face=ax;
  P.vx+=ax*0.42;P.vy+=ay*0.42;P.vx*=0.87;P.vy*=0.87;
  const m=2.15;P.vx=Math.max(-m,Math.min(m,P.vx));P.vy=Math.max(-m,Math.min(m,P.vy));
  P.x+=P.vx;P.y+=P.vy;
  if(P.x<box.x+7){P.x=box.x+7;P.vx=0;}if(P.x>box.x+box.w-7){P.x=box.x+box.w-7;P.vx=0;}
  if(P.y<box.y+6){P.y=box.y+6;P.vy=0;}if(P.y>box.y+box.h-6){P.y=box.y+box.h-6;P.vy=0;}
  updAtk();}}

   continue;}
  if(b.news){px(b.x,b.y,b.w,b.h,'#c9a96a');px(b.x,b.y,b.w,4,'#e8e9f2');
   for(let i=0;i<6;i++)px(b.x+4+i*7,b.y+9,5,1,'#8a6f42');
   dith(b.x,b.y+b.h-8,b.w,8,'#8a6f42',0);frame(b.x,b.y,b.w,b.h,'#07060c');continue;}
  if(b.ant){blit(S.antSm,b.x,b.y,b.vx<0);continue;}
  if(b.crumb){px(b.x,b.y,b.w,b.h,'#c9a96a');px(b.x,b.y,b.w-2,2,'#e8e9f2');
   frame(b.x-1,b.y-1,b.w+2,b.h+2,'#07060c');continue;}
  if(b.junk){px(b.x,b.y,b.w,b.h,'#8a6f42');px(b.x+1,b.y+1,3,3,'#c9a96a');
   frame(b.x-1,b.y-1,b.w+2,b.h+2,'#07060c');continue;}
  if(b.rock){for(let i=0;i<b.tr.length;i+=2)
    px(b.tr[i]-1,b.tr[i+1]-1,2,2,i<b.tr.length/2?'#8a2020':'#f09d2a');
   blitRot(S.rocket,b.x,b.y,b.ang||Math.atan2(b.vy,b.vx));continue;}
  if(b.spid){disc(b.x,b.y,b.r,'#4a3260','#07060c');
   for(let i=0;i<3;i++){px(b.x-6,b.y-3+i*3,4,1,'#07060c');px(b.x+3,b.y-3+i*3,4,1,'#07060c');}
   px(b.x-2,b.y-1,1,1,'#ffffff');px(b.x+1,b.y-1,1,1,'#ffffff');continue;}
  if(b.web){if(warn){if(fr%8<4)dith(b.x,b.y,b.w,b.h,'#c83c3c',0);}
   else{px(b.x,b.y,b.w,b.h,'#e8e9f2');
    for(let i=0;i<b.h;i+=6)px(b.x-3,b.y+i,b.w+6,1,'#cfcde0');
    px(b.x,b.y,1,b.h,'#9c99b4');}continue;}
  if(b.suck){if(warn){if(fr%8<4)dith(b.x,b.y,b.w,b.h,'#c83c3c',0);}
   else{dith(b.x,b.y,b.w,b.h,'#6fd0f5',fr%2);
    for(let i=0;i<5;i++)px(b.x+2,b.y+8+i*14+((fr*2)%14),b.w-4,2,'#bfe9ff');}continue;}
  if(b.pool){if(warn){if(fr%8<4)frame(b.x,b.y,b.w,b.h,'#c83c3c');dith(b.x,b.y,b.w,b.h,'#8a2020',0);}
   else{px(b.x,b.y+3,b.w,b.h-3,'#f09d2a');dith(b.x,b.y,b.w,b.h,'#ffd866',fr%2);
    for(let i=0;i<b.w;i+=7)px(b.x+i,b.y-2+((fr+i)%5<2?-1:0),4,4,'#ffef9a');}continue;}
  if(b.fire){const r=Math.round(b.r);disc(b.x,b.y,r,fr%4<2?'#f09d2a':'#d96b2a');
   disc(b.x,b.y,Math.max(1,r-2),'#ffd866');if(r>4)disc(b.x,b.y,1,'#ffef9a');continue;}
  if(b.gas){dith(b.x-b.r,b.y-b.r,b.r*2,b.r*2,'#8fd44a',fr%2);
   disc(b.x,b.y,Math.max(1,b.r-3),'#3f8a2e');continue;}
  if(b.glow){if(warn){if(fr%8<4)disc(b.x,b.y,Math.max(1,b.r),'#8a2020');}
   else{disc(b.x,b.y,b.r,'#ffd866','#f09d2a');disc(b.x,b.y,Math.max(1,b.r-3),'#ffef9a');}continue;}
  if(b.drop){disc(b.x,b.y,b.r,'#2e8fc4','#07060c');disc(b.x-1,b.y-1,Math.max(1,b.r-2),'#6fd0f5');
   px(b.x-1,b.y-b.r-1,2,2,'#6fd0f5');continue;}
  if(warn){if(fr%8<4)frame(b.x,b.y,b.w,b.h,'#c83c3c');continue;}
  if(b.s=='r'){px(b.x,b.y,b.w,b.h,b.col);frame(b.x-1,b.y-1,b.w+2,b.h+2,'#07060c');}
  else{disc(b.x,b.y,b.r,b.col,'#07060c');
   if(b.pellet)disc(b.x,b.y,1,'#ffef9a');}}}

/* ================= render ================= */
function draw(){
 g.fillStyle='#07060c';g.fillRect(0,0,320,240);
 g.save();if(shake>0)g.translate(((Math.random()-.5)*shake)|0,((Math.random()-.5)*shake)|0);

 if(mode=='title'){
  blit(S.scene.kitchen,0,0);dith(0,0,320,116,'#07060c',0);dith(0,0,320,116,'#07060c',1);
  px(38,40,244,40,'#07060c');frame(36,38,248,44,'#f09d2a');frame(38,40,244,40,'#07060c');
  T('FLYTALE',160,46,'#ffd866',26,'center');
  T('a very small monster hunts a very large one',160,92,'#9c99b4',9,'center');
  blit(S.fly[fr%20<10?0:1],152,112);
  if(fr%60<38)T('[ PRESS Z ]',160,142,'#f09d2a',12,'center');
  T('6 CHAPTERS   5 ENEMIES   8 WEAPONS',160,176,'#474459',9,'center');
  T('you are the fly.',160,192,'#474459',9,'center');
  g.restore();return;}
 if(mode=='card'){
  const w2=Math.min(240,cardT*8);px(160-w2/2,104,w2,2,'#f09d2a');
  T(card.a,160,74,'#9c99b4',11,'center');T(card.b,160,112,'#ffffff',22,'center');
  const w3=Math.min(240,Math.max(0,(cardT-6)*8));px(160-w3/2,142,w3,2,'#f09d2a');
  g.restore();return;}
 if(mode=='dead'){
  for(let i=0;i<8;i++){const A=i/8*6.283;
   px(160+Math.cos(A)*gt*1.2-1,104+Math.sin(A)*gt*1.2,3,3,'#9c99b4');}
  T('GAME OVER',160,86,'#ffffff',24,'center');
  T('* You were only a fly.',160,134,'#cfcde0',10,'center');
  if(gt>40&&fr%50<32)T('[ Z ] TRY AGAIN',160,162,'#f09d2a',11,'center');
  g.restore();return;}
 if(mode=='end'){const w2=ending=='spare';
  blit(S.scene[w2?'kitchen':'table'],0,0);dith(0,0,320,116,'#07060c',0);
  T(w2?'THE WINDOW':'THE KITCHEN',160,40,'#ffd866',20,'center');
  T(w2?'* He opened it. You did not have to make him.'
     :'* It is yours now. It is very quiet.',160,74,'#cfcde0',9,'center');
  T(kills==0?'* TRUE PACIFIST   0 KILLS'
    :'* '+kills+' KILL'+(kills>1?'S':'')+'   '+spared+' SPARED',160,92,kills==0?'#8fd44a':'#c83c3c',10,'center');
  blit(S.fly[fr%20<10?0:1],152,122);
  T(w2?'you are outside. it is loud and warm and huge.'
     :'the window is still closed.',160,150,'#9c99b4',9,'center');
  if(endT>70&&fr%50<32)T('[ Z ] PLAY AGAIN',160,180,'#f09d2a',10,'center');
  g.restore();return;}

 /* arena */
 if(mode=='story'){blit(S.scene[scene],0,0);}
 else{
  blit(S.scene[scene],0,0);dith(0,0,320,116,'#07060c',0);
  dith(0,0,320,10,'#07060c',1);dith(0,104,320,12,'#07060c',1);
  drawEnemy();
  const bw2=110,hpp=Math.max(0,E.hp/E.max);
  px(MZX-64,83,128,31,'#07060c');frame(MZX-65,82,130,33,'#2b2838');
  if(!E.survive){
   px(MZX-bw2/2-1,105,bw2+2,6,'#07060c');px(MZX-bw2/2,106,bw2,4,'#8a2020');
   px(MZX-bw2/2,106,Math.round(bw2*hpp),4,'#8fd44a');
   if(E.man){T(E.w==9?'WEAPON: HIS BARE HANDS':'WEAPON '+E.w+'/8: '+WN[E.w],MZX,94,'#f09d2a',9,'center');
    for(let i=1;i<=8;i++)px(MZX-56+(i-1)*14,86,11,4,i<E.w?'#8a2020':(i==E.w?'#ffd866':'#2b2838'));}
   else T(E.name,MZX,94,'#cfcde0',9,'center');}
  else{const left=Math.max(0,Math.ceil((atk?atk.dur-atk.t:0)/60));
   T('SURVIVE   '+left,MZX,94,'#c83c3c',11,'center');
   px(MZX-56,106,112,5,'#2b2838');px(MZX-56,106,Math.round(112*(atk?1-atk.t/atk.dur:1)),5,'#c83c3c');
   frame(MZX-57,105,114,7,'#07060c');}
  pops.forEach(p=>T(p.s,p.x,p.y,'#c83c3c',13,'center'));}
 parts.forEach(p=>px(p.x,p.y,2,2,p.c));

 if(state=='attack'&&atk.e.aim!=null&&atk.e.aimT>0){
  g.save();g.beginPath();g.rect(box.x+2,box.y+2,box.w-4,box.h-4);g.clip();
  const A=atk.e.aim;for(let d=0;d<300;d+=7)
   px(MZX+Math.cos(A)*d,box.y-26+Math.sin(A)*d,3,3,fr%8<4?'#c83c3c':'#8a2020');
  g.restore();}

 frame(box.x-1,box.y-1,box.w+2,box.h+2,'#07060c');
 px(box.x,box.y,box.w,2,'#ffffff');px(box.x,box.y+box.h-2,box.w,2,'#ffffff');
 px(box.x,box.y,2,box.h,'#ffffff');px(box.x+box.w-2,box.y,2,box.h,'#ffffff');

 g.save();g.beginPath();g.rect(box.x+2,box.y+2,box.w-4,box.h-4);g.clip();
 if(state=='dialog'&&D){let acc=0;
  D.lines.forEach((L,i)=>{T(L,box.x+12,box.y+10+i*14,'#ffffff',11,'left',D.n-acc);acc+=L.length;});}
 else if(state=='menu'){
  if(!subMode)T(E.man&&E.w==9?'* The MAN can barely stand.':E.flav,box.x+12,box.y+13,'#ffffff',11);
  else if(subMode=='act'){E.acts.forEach((o,i)=>T('* '+o[0],box.x+28,box.y+9+i*17,'#ffffff',11));
   blit(S.fly[fr%20<10?0:1],box.x+10,box.y+8+sub*17);}
  else{items.forEach((o,i)=>T('* '+o.n+'   x'+o.c,box.x+28,box.y+13+i*20,o.c>0?'#ffffff':'#474459',11));
   blit(S.fly[fr%20<10?0:1],box.x+10,box.y+12+sub*20);}}
 else if(state=='fightbar'||state=='hitpause'){
  px(box.x+8,box.y+14,box.w-16,50,'#17151f');
  for(let i=0;i<(box.w-16)/8;i++)px(box.x+8+i*8,box.y+14,1,50,'#2b2838');
  px(box.x+box.w/2-1,box.y+10,2,58,'#474459');
  if(state=='fightbar'){px(bar.x-1,box.y+10,3,58,'#ffffff');px(bar.x-2,box.y+8,5,3,'#f09d2a');}
  else{const c=box.x+box.w/2;px(c-1,box.y+10,3,58,'#ffd866');
   if(gt<22)for(let i=0;i<7;i++)px(c-28+i*9,box.y+14+((i*11)%42),5,14,'#ffffff');}}
 else if(state=='attack'){
  drawBullets();
  if(atk.e.vac){const v=atk.e.vac;
   for(let i=0;i<10;i++){const yy=box.y+6+((fr*3+i*29)%(box.h-12));
    px(v[2]?box.x+box.w-18-((fr*2+i*19)%64):box.x+16+((fr*2+i*19)%64),yy,4,1,'#6fd0f5');}}
  if(atk.e.noz){px(atk.e.noz[0]-4,box.y,8,5,'#b0b6c6');frame(atk.e.noz[0]-5,box.y-1,10,7,'#07060c');}
  if(atk.e.moth){const m=atk.e.moth;blit(S.moth[fr%20<10?0:1],m[0]-26,m[1]-18);}
  if(!(P.inv>0&&fr%6<3))blit(S.fly[fr%10<5?0:1],P.x-6,P.y-5,P.face<0);}
 g.restore();

 /* HUD */
 T('FLY   LV 1',box.x+2,201,'#ffffff',10);
 T('HP',box.x+92,201,'#ffffff',10);
 px(box.x+109,200,P.max*3+2,12,'#07060c');
 px(box.x+110,201,P.max*3,10,'#8a2020');px(box.x+110,201,Math.max(0,P.hp)*3,10,'#ffd866');
 T(Math.max(0,P.hp)+' / '+P.max,box.x+114+P.max*3,201,'#ffffff',10);
 const NM=['FIGHT','ACT','ITEM','MERCY'];
 for(let i=0;i<4;i++){const bx2=14+i*74,sel=(mode=='battle'&&state=='menu'&&menu==i&&!subMode);
  let col=sel?'#ffd866':'#f09d2a';
  if(i==3&&E&&E.spare&&!sel)col='#ffd866';
  if(mode!='battle'||(E&&E.survive))col='#3a2617';
  frame(bx2,214,66,21,col);if(sel)frame(bx2+1,215,64,19,col);
  T(NM[i],bx2+33,218,col,11,'center');
  if(sel)blit(S.fly[fr%10<5?0:1],bx2+4,222);}

 if(banner){const q=banner.t;
  const w2=Math.min(320,q<10?q*32:(q>96?(112-q)*20:320));
  px(160-w2/2,44,w2,36,'#07060c');
  if(w2>20){px(160-w2/2,44,w2,2,'#c83c3c');px(160-w2/2,78,w2,2,'#c83c3c');
   if(q>8)T(banner.s,160,54,fr%6<3?'#ffd866':'#ffffff',18,'center');}}
 g.restore();
 if(flashScr>0)dith(0,0,320,240,'#ffffff',flashScr%2);}

/* ================= loop + test hook ================= */
function tick(){update();draw();for(const k in press)delete press[k];}
function loop(){tick();requestAnimationFrame(loop);}
window.__t={step:(n)=>{for(let i=0;i<(n||1);i++)tick();},
 get:()=>({mode:mode,state:state,scene:scene,enemy:E?E.id:null,w:E?E.w:0,ehp:E?E.hp:0,
  hp:P.hp,bullets:bullets.length,si:si,kills:kills,ending:ending}),
 key:(c)=>{press[c]=1;},
 goto:(id)=>{startBattle(id);},
 chapter:(n)=>{si=n;nextStep();}};
loop();
</script></body></html>
