<script>
/* ==========================================================================
   REDWATER — A Frontier Tale
   --------------------------------------------------------------------------
   THESIS   The frontier is vast, hot and silent; violence arrives as a
            half-second of white flash and black silhouettes, then silence.
   ANCHOR   "Once Upon a Time in the West" printed on an 1880s letterpress
            wanted poster. Limited ink, heavy blacks, hand-set serif, paper
            grain, raking shadows from one low sun.
   PALETTE  PAPER  #dcc39b  bleached sand / the world's ground note
            SAND2  #b8935f  worked earth, roads, wear
            SCRUB  #77824f  living things, sparse
            MESA   #a3664a  rock, blood of the land
            INK    #211a1c  ALL shadows, ALL threats, all silhouette
            NIGHT  #191f36  after dark ambient
            GOLD   #f0b429  the ONLY emissive colour. Interactive = gold.
            LAW    #4c74ab  sheriff faction
            OUTLAW #9e2b25  outlaw faction / blood
            FLASH  #fff4dc  muzzle, lightning, the white half-second
   TYPE     "Rye" (display, all headers & the mark) / "Special Elite"
            (typewriter, body & numerals). Serif + mono fallbacks.
   LEGIBILITY
            Threats render as flat INK silhouettes with a crimson trim and
            NO interior detail. Friendlies/interactables carry GOLD. Terrain
            is forbidden gold and forbidden pure black, so the eye separates
            "land / person / danger / use me" at any zoom. Only the player
            gets a rim-light. Size hierarchy: player > named NPC > mook.
   RENDERER Canvas2D. The look is flat lithographic shape + hard shadow, not
            emissive light bleed, so no WebGL is needed; the one additive
            layer (lanterns, muzzle, fire) is a half-res light buffer.
   ========================================================================== */

'use strict';

// ---------------------------------------------------------------- palette
const C = {
  paper:'#dcc39b', paper2:'#cdb086', sand:'#b8935f', sand2:'#a07c4e',
  scrub:'#77824f', scrub2:'#5e6b3e', mesa:'#a3664a', mesa2:'#7d4632',
  ink:'#211a1c', ink2:'#120d10', night:'#191f36',
  gold:'#f0b429', gold2:'#c98d18', law:'#4c74ab', outlaw:'#9e2b25',
  blood:'#8e2018', flash:'#fff4dc', bone:'#e8dcc0', water:'#4d6b74'
};
const FD = '"Rye", Georgia, "Times New Roman", serif';       // display
const FT = '"Special Elite", "Courier New", monospace';      // text

// ---------------------------------------------------------------- canvas
const cv = document.getElementById('cv');
let ctx = cv.getContext('2d', { alpha:false });
let W = 0, H = 0, DPR = 1, ready = false;
// half-res additive light buffer
const lcv = document.createElement('canvas'); const lx = lcv.getContext('2d');
// full-res grain tile
let grainTile = null;

function applySize(iw, ih){
  if (iw < 2 || ih < 2) return;                  // ignore degenerate layout passes
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.round(iw); H = Math.round(ih);
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled = true;
  lcv.width = Math.max(2,Math.round(W/2)); lcv.height = Math.max(2,Math.round(H/2));
  ready = true;
}
function resize(){ applySize(window.innerWidth||0, window.innerHeight||0); }
window.addEventListener('resize', resize);

// ---------------------------------------------------------------- math
const TAU = Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
const dist2=(x1,y1,x2,y2)=>{const a=x2-x1,b=y2-y1;return a*a+b*b;};
const angTo=(x1,y1,x2,y2)=>Math.atan2(y2-y1,x2-x1);
function angLerp(a,b,t){ let d=((b-a+Math.PI)%TAU+TAU)%TAU-Math.PI; return a+d*t; }
const easeOutCubic=t=>1-Math.pow(1-t,3);
const easeOutBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const easeInQuad=t=>t*t;
const easeInOut=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function rnd(a=1,b){ if(b===undefined){b=a;a=0;} return a+Math.random()*(b-a); }
function rndi(a,b){ return Math.floor(rnd(a,b)); }
function pick(arr){ return arr[(Math.random()*arr.length)|0]; }
function chance(p){ return Math.random()<p; }

// seeded deterministic RNG (mulberry32)
function mulberry(seed){ let a=seed>>>0; return function(){
  a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; };}
function hash2(x,y,s){ let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(s|0,1274126177);
  h=(h^h>>>13); h=Math.imul(h,1274126177); return ((h^h>>>16)>>>0)/4294967296; }

// value noise
const NP = new Uint8Array(512); { const r=mulberry(1337); const p=new Uint8Array(256);
  for(let i=0;i<256;i++)p[i]=i;
  for(let i=255;i>0;i--){const j=(r()*(i+1))|0; const t=p[i];p[i]=p[j];p[j]=t;}
  for(let i=0;i<512;i++)NP[i]=p[i&255]; }
function vnoise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=NP[(NP[xi&255]+ (yi&255))&511]/255;
  const b=NP[(NP[(xi+1)&255]+ (yi&255))&511]/255;
  const c=NP[(NP[xi&255]+ ((yi+1)&255))&511]/255;
  const d=NP[(NP[(xi+1)&255]+ ((yi+1)&255))&511]/255;
  return lerp(lerp(a,b,u), lerp(c,d,u), v);
}
function fbm(x,y,oct=4,lac=2,gain=.5){
  let s=0,amp=.5,f=1,norm=0;
  for(let i=0;i<oct;i++){ s+=vnoise(x*f,y*f)*amp; norm+=amp; amp*=gain; f*=lac; }
  return s/norm;
}

// ---------------------------------------------------------------- audio
// Procedural only. No assets. Gunfire = noise crack + low body thump.
const AU = { ctx:null, on:true, master:null, noise:null };
function audioInit(){
  if (AU.ctx) return;
  try{
    AU.ctx = new (window.AudioContext||window.webkitAudioContext)();
    AU.master = AU.ctx.createGain(); AU.master.gain.value = .4;
    const comp = AU.ctx.createDynamicsCompressor();
    comp.threshold.value=-18; comp.ratio.value=8;
    AU.master.connect(comp); comp.connect(AU.ctx.destination);
    const n = AU.ctx.sampleRate*2, buf = AU.ctx.createBuffer(1,n,AU.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    AU.noise = buf;
  }catch(e){ AU.on=false; }
}
function noiseSrc(){ const s=AU.ctx.createBufferSource(); s.buffer=AU.noise; s.loop=true;
  s.playbackRate.value = .8+Math.random()*.4; return s; }

function sfx(type, opt){
  if(!AU.on||!AU.ctx) return; opt=opt||{};
  const t = AU.ctx.currentTime, vol=(opt.vol==null?1:opt.vol);
  if(vol<=0.02) return;
  const out = AU.ctx.createGain(); out.connect(AU.master);
  try{
  switch(type){
    case 'shot': case 'shotgun': case 'rifle': {
      const big = type==='shotgun', rif = type==='rifle';
      const dur = big?.42:rif?.34:.26;
      const s=noiseSrc(); const f=AU.ctx.createBiquadFilter();
      f.type='bandpass'; f.frequency.value= rif?2600:big?900:1700; f.Q.value=.7;
      const g=AU.ctx.createGain(); g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(.9*vol,t+.004);
      g.gain.exponentialRampToValueAtTime(.0008,t+dur);
      s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t+dur+.02);
      const o=AU.ctx.createOscillator(); o.type='triangle';
      o.frequency.setValueAtTime(big?150:220,t);
      o.frequency.exponentialRampToValueAtTime(40,t+.16);
      const og=AU.ctx.createGain(); og.gain.setValueAtTime(.6*vol,t);
      og.gain.exponentialRampToValueAtTime(.0008,t+.2);
      o.connect(og); og.connect(out); o.start(t); o.stop(t+.22);
      break;
    }
    case 'click': case 'reload': {
      const o=AU.ctx.createOscillator(); o.type='square';
      o.frequency.setValueAtTime(type==='click'?900:420,t);
      o.frequency.exponentialRampToValueAtTime(type==='click'?300:180,t+.05);
      const g=AU.ctx.createGain(); g.gain.setValueAtTime(.14*vol,t);
      g.gain.exponentialRampToValueAtTime(.0008,t+.07);
      o.connect(g); g.connect(out); o.start(t); o.stop(t+.09); break;
    }
    case 'hit': {
      const s=noiseSrc(); const f=AU.ctx.createBiquadFilter();
      f.type='lowpass'; f.frequency.value=800;
      const g=AU.ctx.createGain(); g.gain.setValueAtTime(.45*vol,t);
      g.gain.exponentialRampToValueAtTime(.0008,t+.14);
      s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t+.16); break;
    }
    case 'boom': {
      const s=noiseSrc(); const f=AU.ctx.createBiquadFilter();
      f.type='lowpass'; f.frequency.setValueAtTime(1800,t);
      f.frequency.exponentialRampToValueAtTime(120,t+.7);
      const g=AU.ctx.createGain(); g.gain.setValueAtTime(1.0*vol,t);
      g.gain.exponentialRampToValueAtTime(.0008,t+.9);
      s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t+.95);
      const o=AU.ctx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(90,t); o.frequency.exponentialRampToValueAtTime(28,t+.5);
      const og=AU.ctx.createGain(); og.gain.setValueAtTime(.8*vol,t);
      og.gain.exponentialRampToValueAtTime(.0008,t+.6);
      o.connect(og); og.connect(out); o.start(t); o.stop(t+.62); break;
    }
    case 'ui': {
      const o=AU.ctx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(opt.f||520,t);
      const g=AU.ctx.createGain(); g.gain.setValueAtTime(.09*vol,t);
      g.gain.exponentialRampToValueAtTime(.0008,t+.1);
      o.connect(g); g.connect(out); o.start(t); o.stop(t+.12); break;
    }
    case 'coin': {
      for(let i=0;i<3;i++){ const fr=[880,1320,1760][i];
        const o=AU.ctx.createOscillator(); o.type='triangle'; o.frequency.value=fr;
        const g=AU.ctx.createGain(); g.gain.setValueAtTime(0,t+i*.05);
        g.gain.linearRampToValueAtTime(.1*vol,t+i*.05+.01);
        g.gain.exponentialRampToValueAtTime(.0008,t+i*.05+.16);
        o.connect(g); g.connect(out); o.start(t+i*.05); o.stop(t+i*.05+.18); }
      break;
    }
    case 'chime': {
      for(let i=0;i<4;i++){ const fr=[523,659,784,1047][i];
        const o=AU.ctx.createOscillator(); o.type='sine'; o.frequency.value=fr;
        const g=AU.ctx.createGain(); g.gain.setValueAtTime(0,t+i*.08);
        g.gain.linearRampToValueAtTime(.09*vol,t+i*.08+.02);
        g.gain.exponentialRampToValueAtTime(.0008,t+i*.08+.7);
        o.connect(g); g.connect(out); o.start(t+i*.08); o.stop(t+i*.08+.75); }
      break;
    }
    case 'drone': {
      const o=AU.ctx.createOscillator(); o.type='sawtooth';
      o.frequency.setValueAtTime(opt.f||55,t);
      const f2=AU.ctx.createBiquadFilter(); f2.type='lowpass'; f2.frequency.value=400;
      const g=AU.ctx.createGain(); g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(.16*vol,t+.3);
      g.gain.exponentialRampToValueAtTime(.0008,t+(opt.dur||2));
      o.connect(f2); f2.connect(g); g.connect(out); o.start(t); o.stop(t+(opt.dur||2)+.1); break;
    }
    case 'whoosh': {
      const s=noiseSrc(); const f=AU.ctx.createBiquadFilter(); f.type='bandpass';
      f.frequency.setValueAtTime(300,t); f.frequency.exponentialRampToValueAtTime(3000,t+.3);
      f.Q.value=2;
      const g=AU.ctx.createGain(); g.gain.setValueAtTime(.0008,t);
      g.gain.linearRampToValueAtTime(.26*vol,t+.12);
      g.gain.exponentialRampToValueAtTime(.0008,t+.4);
      s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t+.42); break;
    }
  }}catch(e){}
}
function sfxAt(type,x,y,opt){
  opt = opt||{};
  const d = dist(x,y,cam.x,cam.y);
  const v = clamp(1 - d/1100, 0, 1);
  if(v<=0.02) return;
  opt.vol = (opt.vol==null?1:opt.vol)*v*v;
  sfx(type,opt);
}

// ---------------------------------------------------------------- input
const keys = Object.create(null), keyOnce = Object.create(null);
const mouse = { x:0, y:0, wx:0, wy:0, down:false, rdown:false, clicked:false, rclicked:false, wheel:0 };
const HOLD = ['w','a','s','d',' ','tab','e','q','f','r','m','arrowup','arrowdown','arrowleft','arrowright'];
function kd(e){
  const k = e.key.length===1 ? e.key.toLowerCase() : e.key;
  if(!keys[k]) keyOnce[k]=true;
  keys[k]=true;
  if(HOLD.indexOf(k.toLowerCase())>=0) e.preventDefault();
  audioInit(); if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume();
}
function ku(e){ const k = e.key.length===1 ? e.key.toLowerCase() : e.key; keys[k]=false; }
window.addEventListener('keydown',kd); window.addEventListener('keyup',ku);
window.addEventListener('blur',function(){ for(const k in keys) keys[k]=false; mouse.down=false; });
function press(k){ if(keyOnce[k]){ keyOnce[k]=false; return true; } return false; }
function clearOnce(){ for(const k in keyOnce) keyOnce[k]=false;
  mouse.clicked=false; mouse.rclicked=false; mouse.wheel=0; }

function mpos(e){ const r=cv.getBoundingClientRect(); mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top; }
cv.addEventListener('mousemove',mpos);
cv.addEventListener('mousedown',function(e){ mpos(e);
  if(e.button===0){mouse.down=true;mouse.clicked=true;}
  if(e.button===2){mouse.rdown=true;mouse.rclicked=true;}
  audioInit(); if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume(); e.preventDefault(); });
window.addEventListener('mouseup',function(e){ if(e.button===0)mouse.down=false; if(e.button===2)mouse.rdown=false; });
cv.addEventListener('contextmenu',function(e){e.preventDefault();});
cv.addEventListener('wheel',function(e){ mouse.wheel=Math.sign(e.deltaY); e.preventDefault(); },{passive:false});

// ---------------------------------------------------------------- camera
const cam = { x:0, y:0, z:1, tz:1, trauma:0, sx:0, sy:0 };
function addTrauma(v){ cam.trauma = Math.min(1, cam.trauma + v); }
function w2sx(x){ return (x-cam.x)*cam.z + W/2 + cam.sx; }
function w2sy(y){ return (y-cam.y)*cam.z + H/2 + cam.sy; }
function s2wx(x){ return (x - W/2 - cam.sx)/cam.z + cam.x; }
function s2wy(y){ return (y - H/2 - cam.sy)/cam.z + cam.y; }

// ---------------------------------------------------------------- time of day
const DAY_LEN = 420;            // seconds per full in-game day
let dayT = 0.32;                // start mid-morning
function daylight(){
  if(dayT<0.20||dayT>0.86) return 0;
  if(dayT<0.30) return (dayT-0.20)/0.10;
  if(dayT>0.76) return 1-(dayT-0.76)/0.10;
  return 1;
}
function isNight(){ return daylight()<0.35; }
// One low sun. Shadows are long at dawn/dusk, short at noon, and rake one way.
const sun = { dx:1, dy:.6, len:1.6, warm:0 };
function updateSun(){
  const d = daylight();
  const a = lerp(-0.55, -2.55, clamp((dayT-0.22)/0.60,0,1)); // sweeps overhead
  sun.len = lerp(2.9, 0.62, Math.sin(clamp((dayT-0.22)/0.60,0,1)*Math.PI));
  sun.dx = Math.cos(a)*sun.len; sun.dy = (Math.abs(Math.sin(a))*0.45+0.38)*sun.len;
  sun.warm = d;
}
function hourStr(){
  const h24 = (dayT*24+6)%24; const h=Math.floor(h24);
  const m = Math.floor((h24-h)*60);
  const ap = h<12?'AM':'PM'; let hh=h%12; if(hh===0)hh=12;
  return hh+':'+(m<10?'0':'')+m+' '+ap;
}

// ==========================================================================
//  WORLD
// ==========================================================================
// The map proper is 6400x4800. Everything below INDOORS_Y is the "indoors
// strip": real rooms laid out off the map, so interiors reuse the exact same
// collision, lighting, AI and y-sorted renderer the outdoors uses.
const MAP_H = 4800;
const INDOORS_Y = 5000;
const WORLD = { w:6400, h:6600 };
const CH = 400;                              // chunk size in world px

// --- named places -------------------------------------------------------
const POI = [
  { id:'town',   name:'REDWATER',            x:2000, y:2400, r:520, kind:'town'  },
  { id:'camp',   name:'BLACK MESA CAMP',     x:5250, y:900,  r:380, kind:'outlaw'},
  { id:'mine',   name:'COPPER CREEK MINE',   x:900,  y:900,  r:340, kind:'work'  },
  { id:'ranch',  name:'HARGRAVE RANCH',      x:4850, y:3900, r:420, kind:'work'  },
  { id:'farm',   name:'CALLOWAY HOMESTEAD',  x:3150, y:3620, r:300, kind:'work'  },
  { id:'depot',  name:'PERDITION DEPOT',     x:3500, y:1480, r:320, kind:'work'  },
  { id:'grave',  name:'BOOT HILL',           x:1450, y:3200, r:240, kind:'quiet' },
  { id:'mission',name:'THE OLD MISSION',     x:760,  y:3000, r:260, kind:'quiet' },
  { id:'gulch',  name:'DEADFALL GULCH',      x:4150, y:2280, r:300, kind:'danger'},
  { id:'butte',  name:'SPANISH BUTTE',       x:1150, y:1850, r:280, kind:'danger'},
  { id:'wash',   name:'COYOTE WASH',         x:4400, y:3150, r:280, kind:'danger'},
  { id:'lookout',name:'WIDOWS LOOKOUT',      x:5900, y:2450, r:220, kind:'quiet' }
];
function poi(id){ for(let i=0;i<POI.length;i++) if(POI[i].id===id) return POI[i]; return null; }
function nearestPOI(x,y){ let b=null,bd=1e9; for(const p of POI){ const d=dist(x,y,p.x,p.y);
  if(d<bd){bd=d;b=p;} } return {p:b,d:bd}; }

// --- roads & river ------------------------------------------------------
// The Redwater comes in off the east edge, bends west under the depot and then
// runs south to the border. Every settlement sits clear of it: the old course
// ran straight through the Calloway homestead (Mae stood mid-stream) and the
// Black Mesa camp, and none of its bridges were actually on the water.
//   west bank: town, mine, depot, camp, farm, boot hill, mission, butte
//   east bank: deadfall gulch, coyote wash, hargrave ranch, widow's lookout
const RIVER = [[6400,1100],[5600,1500],[4700,1850],[3750,1800],[3150,2350],
               [3550,2900],[3700,3600],[3550,4300],[3700,4800]];
const ROADS = [
  [[2000,2400],[2560,2200],[3050,1900],[3500,1480]],              // town -> depot
  [[3500,1480],[4200,1220],[4800,1000],[5250,900]],               // depot -> camp
  [[2000,2400],[1600,2000],[1250,1500],[900,900]],                // town -> mine
  [[2000,2400],[2450,2760],[2800,3200],[3150,3620]],              // town -> farm
  [[3150,3620],[3800,3820],[4400,3900],[4850,3900]],              // farm -> ranch (bridge)

  [[4150,2280],[4320,2720],[4400,3150],[4620,3560],[4850,3900]],  // gulch -> wash -> ranch

];
const RAIL = [[0,1620],[1400,1600],[2600,1560],[3500,1480],[4600,1440],[5600,1420],[6400,1400]];

function plPoint(pl,t){ // t in 0..1 along polyline
  const n=pl.length-1, f=t*n, i=clamp(Math.floor(f),0,n-1), u=f-i;
  return [ lerp(pl[i][0],pl[i+1][0],u), lerp(pl[i][1],pl[i+1][1],u) ];
}
function distToPoly(pl,x,y){
  let best=1e9;
  for(let i=0;i<pl.length-1;i++){
    const x1=pl[i][0],y1=pl[i][1],x2=pl[i+1][0],y2=pl[i+1][1];
    const dx=x2-x1,dy=y2-y1, L=dx*dx+dy*dy;
    let t=L?((x-x1)*dx+(y-y1)*dy)/L:0; t=clamp(t,0,1);
    const d=dist(x,y,x1+dx*t,y1+dy*t); if(d<best)best=d;
  }
  return best;
}
const RIVER_W = 62;
function inRiver(x,y){ return distToPoly(RIVER,x,y) < RIVER_W; }
function onRoad(x,y){ for(const r of ROADS) if(distToPoly(r,x,y)<30) return true; return false; }

// Bridges are not placed by hand any more — hand-placed ones drifted off the
// water. One is built wherever a road or the railway actually crosses the river,
// laid along the road, long enough to land on dry ground both sides.
//   {x,y}  centre   a  heading of the road   len/w  deck size   rail  trestle
const BRIDGES = [];
function segX(ax,ay,bx,by,cx,cy,dx,dy){
  const r1=bx-ax, r2=by-ay, s1=dx-cx, s2=dy-cy, den=r1*s2-r2*s1;
  if(Math.abs(den)<1e-9) return null;
  const t=((cx-ax)*s2-(cy-ay)*s1)/den, u=((cx-ax)*r2-(cy-ay)*r1)/den;
  return (t>=0&&t<=1&&u>=0&&u<=1) ? [ax+r1*t, ay+r2*t, Math.atan2(r2,r1), Math.atan2(s2,s1)] : null;
}
function buildBridges(){
  BRIDGES.length=0;
  const lines = ROADS.map(function(r){ return {pl:r, rail:false}; }).concat([{pl:RAIL, rail:true}]);
  for(const L of lines){
    for(let i=0;i<L.pl.length-1;i++) for(let j=0;j<RIVER.length-1;j++){
      const h=segX(L.pl[i][0],L.pl[i][1],L.pl[i+1][0],L.pl[i+1][1],
                   RIVER[j][0],RIVER[j][1],RIVER[j+1][0],RIVER[j+1][1]);
      if(!h) continue;
      // measure the water along the road both ways (a crossing on a bend is
      // wider than the river), and land the deck well onto dry ground
      let ext=0;
      for(const sg of [1,-1]){ let u=0;
        while(u<500 && inRiver(h[0]+Math.cos(h[2])*u*sg, h[1]+Math.sin(h[2])*u*sg)) u+=4;
        ext=Math.max(ext,u); }
      BRIDGES.push({ x:h[0], y:h[1], a:h[2], len:ext*2+60, w:L.rail?52:74, rail:L.rail });
    }
  }
}
// Is (x,y) on a deck? Tested in the bridge's own frame, with a little slack on
// the sides so a rider can't snag on the rail posts.
// keep scatter off the ramps: a tree on a bridgehead is a wall
function nearBridgeApproach(x,y){
  for(const b of BRIDGES) if(dist2(x,y,b.x,b.y) < Math.pow(b.len/2+60,2)) return true;
  return false;
}
function nearBridge(x,y){
  for(let i=0;i<BRIDGES.length;i++){ const b=BRIDGES[i];
    const dx=x-b.x, dy=y-b.y, c=Math.cos(b.a), s=Math.sin(b.a);
    const u=dx*c+dy*s, v=-dx*s+dy*c;
    if(Math.abs(u)<b.len/2+10 && Math.abs(v)<b.w/2+8) return true; }
  return false;
}
function bridgeAt(x,y){
  for(let i=0;i<BRIDGES.length;i++){ const b=BRIDGES[i];
    const dx=x-b.x, dy=y-b.y, c=Math.cos(b.a), s=Math.sin(b.a);
    if(Math.abs(dx*c+dy*s)<b.len/2+10 && Math.abs(-dx*s+dy*c)<b.w/2+8) return b; }
  return null;
}

// --- ground classification ---------------------------------------------
// 0 sand   1 cracked flat   2 scrub   3 rock/mesa   4 road   5 water  6 boardwalk
function groundAt(x,y){
  if(y>=INDOORS_Y) return roomFloorAt(x,y);
  if(inRiver(x,y)) return 5;
  const e = fbm(x*0.00075, y*0.00075, 4);
  const m = fbm(x*0.0014+37.7, y*0.0014+12.3, 3);
  if(e>0.635) return 3;
  if(m>0.60 && e<0.60) return 2;
  if(m<0.40) return 1;
  return 0;
}
// 7 pine boards  8 flagstone  9 packed dirt  10 the void outside a room
const GCOL = [C.paper, C.paper2, C.scrub, C.mesa, C.sand, C.water, '#8a6b45',
              '#8a6338', '#9a9384', '#6f5a41', '#171114'];
function roomFloorAt(x,y){
  for(let i=0;i<ROOMS.length;i++){
    const R=ROOMS[i];
    if(x>R.x-R.w/2-8 && x<R.x+R.w/2+8 && y>R.y-R.h/2-8 && y<R.y+R.h/2+8) return R.floor;
  }
  return 10;
}

// --- props --------------------------------------------------------------
// {x,y,t,s,r,solid,seed}  t: cactus rock boulder bush grass bone stump tree
//                            fence barrel crate wagon post grave sign trough
//                            tent lamp campfire tower well tumble
const props = [];
const ROOMS = [];
const WALLS = [];           // axis-aligned solid rects; interiors are built from these
const BUILDINGS = [];
const SPOTS = [];                              // interactables
let pgrid = null, PG = 200, PGW=0, PGH=0;

function addProp(x,y,t,s,solid,r){
  props.push({ _k:'p', x:x, y:y, t:t, s:s||1, solid:!!solid, r:r||0, seed:(Math.random()*1e9)|0, hp:0 });
}
function buildPropGrid(){
  PGW = Math.ceil(WORLD.w/PG); PGH = Math.ceil(WORLD.h/PG);
  pgrid = new Array(PGW*PGH); for(let i=0;i<pgrid.length;i++) pgrid[i]=[];
  for(let i=0;i<props.length;i++){
    const p=props[i];
    const cx=clamp(Math.floor(p.x/PG),0,PGW-1), cy=clamp(Math.floor(p.y/PG),0,PGH-1);
    pgrid[cy*PGW+cx].push(i);
  }
}
function propsNear(x,y,rad,out){
  out.length=0;
  const x0=clamp(Math.floor((x-rad)/PG),0,PGW-1), x1=clamp(Math.floor((x+rad)/PG),0,PGW-1);
  const y0=clamp(Math.floor((y-rad)/PG),0,PGH-1), y1=clamp(Math.floor((y+rad)/PG),0,PGH-1);
  for(let cy=y0;cy<=y1;cy++) for(let cx=x0;cx<=x1;cx++){
    const cell=pgrid[cy*PGW+cx];
    for(let k=0;k<cell.length;k++) out.push(props[cell[k]]);
  }
  return out;
}

// --- buildings ----------------------------------------------------------
// kind drives roof colour, sign, and what the door opens
function addBuilding(x,y,w,h,kind,name,face){
  const b = { _k:'b', x:x, y:y, w:w, h:h, kind:kind, name:name||'', face:face||1, seed:(Math.random()*1e9)|0 };
  // door on the facing side (face 1 = door on south/bottom, -1 = north/top)
  b.dx = x; b.dy = y + (h/2+14)*b.face;
  BUILDINGS.push(b);
  return b;
}
function addSpot(x,y,r,kind,label,data){
  const s={x:x,y:y,r:r,kind:kind,label:label,data:data||{},on:true}; SPOTS.push(s); return s;
}
// A spot buried inside a solid rect can never be reached — the player is stopped
// at the wall, outside trigger range, and the prompt never appears. Sweep for it
// at world build and shove any offender out past the nearest edge.
function validateSpots(){
  const solids = BUILDINGS.concat(WALLS);
  const bad = [];
  for(const s of SPOTS){
    for(const b of solids){
      if(Math.abs(s.x-b.x) >= b.w/2 || Math.abs(s.y-b.y) >= b.h/2) continue;
      const dl = s.x-(b.x-b.w/2), dr = (b.x+b.w/2)-s.x;
      const dt = s.y-(b.y-b.h/2), db = (b.y+b.h/2)-s.y;
      const m = Math.min(dl,dr,dt,db);
      if(m===db)      s.y = b.y+b.h/2+24;
      else if(m===dt) s.y = b.y-b.h/2-24;
      else if(m===dr) s.x = b.x+b.w/2+24;
      else            s.x = b.x-b.w/2-24;
      bad.push(s.kind);
    }
  }
  return bad;
}
// Nothing should ever begin life embedded in a wall — it gets shoved sideways
// on its first step and cannot reach anything. Push it out to open ground.
function nudgeFree(e){
  const solids = BUILDINGS.concat(WALLS);
  for(let pass=0; pass<30; pass++){
    let stuck=false;
    for(const b of solids){
      if(!rectHit(b,e.x,e.y,e.r)) continue;
      stuck=true;
      const dl=e.x-(b.x-b.w/2-e.r), dr=(b.x+b.w/2+e.r)-e.x;
      const dt=e.y-(b.y-b.h/2-e.r), db=(b.y+b.h/2+e.r)-e.y;
      const m=Math.min(dl,dr,dt,db);
      if(m===db)      e.y=b.y+b.h/2+e.r+1;
      else if(m===dt) e.y=b.y-b.h/2-e.r-1;
      else if(m===dr) e.x=b.x+b.w/2+e.r+1;
      else            e.x=b.x-b.w/2-e.r-1;
    }
    if(!stuck) break;
  }
  e.home=[e.x,e.y];
}
function rectHit(b,x,y,rad){
  const hw=b.w/2+rad, hh=b.h/2+rad;
  return Math.abs(x-b.x)<hw && Math.abs(y-b.y)<hh;
}

// ------------------------------------------------------------ WILD SCATTER
function scatterWild(){
  const r = mulberry(20260917);
  const N = 5200;
  for(let i=0;i<N;i++){
    const x = r()*WORLD.w, y = r()*MAP_H;
    // keep the street and roads clear
    if(onRoad(x,y)||nearBridgeApproach(x,y)) continue;
    let near=false;
    for(const p of POI){ if(dist2(x,y,p.x,p.y) < (p.r*0.55)*(p.r*0.55)){ near=true; break; } }
    if(near) continue;
    // nothing grows through a floor: keep scatter out of every building
    for(const b of BUILDINGS){
      if(Math.abs(x-b.x)<b.w/2+24 && Math.abs(y-b.y)<b.h/2+24){ near=true; break; } }
    if(near) continue;
    const g = groundAt(x,y);
    if(g===5) continue;
    const q = r();
    if(g===3){ // rock country
      if(q<.42) addProp(x,y,'boulder',.7+r()*1.3,true,18+r()*10);
      else if(q<.7) addProp(x,y,'rock',.6+r()*.8,q<.56,12);
      else if(q<.86) addProp(x,y,'bush',.7+r()*.6,false,0);
      else addProp(x,y,'bone',.8+r()*.5,false,0);
    } else if(g===2){ // scrub
      if(q<.45) addProp(x,y,'grass',.8+r()*.8,false,0);
      else if(q<.68) addProp(x,y,'bush',.7+r()*.7,false,0);
      else if(q<.85) addProp(x,y,'tree',.8+r()*.7,true,15);
      else if(q<.94) addProp(x,y,'cactus',.8+r()*.6,true,12);
      else addProp(x,y,'stump',.9,true,12);
    } else { // sand / flats
      if(q<.30) addProp(x,y,'grass',.6+r()*.6,false,0);
      else if(q<.55) addProp(x,y,'cactus',.75+r()*.75,true,13);
      else if(q<.72) addProp(x,y,'rock',.5+r()*.7,false,0);
      else if(q<.84) addProp(x,y,'bush',.6+r()*.5,false,0);
      else if(q<.93) addProp(x,y,'bone',.7+r()*.5,false,0);
      else addProp(x,y,'stump',.8,true,11);
    }
  }
  // riverbank greenery
  for(let i=0;i<520;i++){
    const t=r(), p=plPoint(RIVER,t);
    const side=r()<.5?-1:1, off=RIVER_W+10+r()*90;
    const a=r()*TAU;
    const x=p[0]+Math.cos(a)*off, y=p[1]+Math.sin(a)*off;
    if(x<0||y<0||x>WORLD.w||y>WORLD.h) continue;
    if(inRiver(x,y)||onRoad(x,y)||nearBridgeApproach(x,y)) continue;
    const q=r();
    if(q<.40) addProp(x,y,'tree',.9+r()*.6,true,15);
    else if(q<.62) addProp(x,y,'grass',.9+r()*.8,false,0);
    else if(q<.8 && distToPoly(RIVER,x,y)<RIVER_W+34) addProp(x,y,'reed',.9+r()*.5,false,0);
    else addProp(x,y,'bush',.8+r()*.5,false,0);
  }
}

//  Each room is a real place in the indoors strip, walled with solid rects and
//  dressed with props. You walk in through the door and out the same way.
// ==========================================================================
const WALL_T = 16;
function addWall(x,y,w,h,low){ WALLS.push({x:x,y:y,w:w,h:h,_k:'w',rw:true,low:!!low}); }

// door on the SOUTH wall, split into two segments with a gap in the middle
function addRoom(o){
  const R = { id:o.id, name:o.name, x:o.x, y:o.y, w:o.w, h:o.h,
              floor:o.floor, from:o.from, doorW:o.doorW||64, _k:'r' };
  ROOMS.push(R);
  const hw=R.w/2, hh=R.h/2, g=R.doorW/2;
  addWall(R.x, R.y-hh-WALL_T/2, R.w+WALL_T*2, WALL_T);              // north
  addWall(R.x-hw-WALL_T/2, R.y, WALL_T, R.h);                        // west
  addWall(R.x+hw+WALL_T/2, R.y, WALL_T, R.h);                        // east
  const seg=(R.w-R.doorW)/2;                                         // south, split
  addWall(R.x-hw+seg/2, R.y+hh+WALL_T/2, seg+WALL_T, WALL_T, true);   // cut away low, or the
  addWall(R.x+hw-seg/2, R.y+hh+WALL_T/2, seg+WALL_T, WALL_T, true);   // room's front would hide you
  R.inDoor = [R.x, R.y+hh-26];
  addSpot(R.x, R.y+hh+6, 40, 'exit', 'STEP BACK OUTSIDE', {room:R.id});
  return R;
}
function room(id){ for(let i=0;i<ROOMS.length;i++) if(ROOMS[i].id===id) return ROOMS[i]; return null; }
function inRoom(x,y){
  for(let i=0;i<ROOMS.length;i++){ const R=ROOMS[i];
    if(x>R.x-R.w/2&&x<R.x+R.w/2&&y>R.y-R.h/2&&y<R.y+R.h/2) return R; }
  return null;
}

function spawnRoomFolk(){
  for(const id in ROOM_FOLK){
    const R=room(id); if(!R) continue;
    for(const f of ROOM_FOLK[id]){
      const e=makeEnt({x:R.x+f[1], y:R.y+f[2], team:'civ', kind:'civ',
        name:npcName(), title:f[0], hp:40, spd:26, loot:rndi(1,7)});
      e.home=[e.x,e.y]; e.indoorLine=f[3]; e.hat=chance(.4)?1:0;
    }
  }
}

// ---- going in and out ----------------------------------------------------
function enterRoom(id){
  const R=room(id); if(!R) return;
  P.outside=[P.x,P.y];
  if(P.mounted) dismount();
  P.x=R.inDoor[0]; P.y=R.inDoor[1];
  cam.x=P.x; cam.y=P.y;
  P.kx=P.ky=0; P.vx=P.vy=0;
  fadeT=0.9; sfx('ui',{f:320});
  toast(R.name,'E at the door to step back out','#d8c39b');
}
function exitRoom(){
  // Fall back to the room's own street door if we have no memory of coming in
  // (e.g. the ride was saved indoors) — never leave the player walled in.
  let dest = P.outside;
  if(!dest){
    const R = inRoom(P.x,P.y);
    if(R){ for(const s of SPOTS) if(s.data && s.data.enter===R.id){ dest=[s.x, s.y+18]; break; } }
  }
  if(!dest) dest = [2000, 2570];
  P.x=dest[0]; P.y=dest[1]; P.outside=null;
  cam.x=P.x; cam.y=P.y;
  P.kx=P.ky=0; P.vx=P.vy=0;
  fadeT=0.9; sfx('ui',{f:260});
}

// ==========================================================================
//  TERRAIN — baked chunks. Flat litho ground + stipple + inked roads.
// ==========================================================================
const DECKS = [];                    // boardwalk rects baked into terrain
const chunkCache = new Map();
let chunkFrame = 0;

function segBoxHit(x1,y1,x2,y2,bx,by,bw,bh,pad){
  const minx=Math.min(x1,x2)-pad, maxx=Math.max(x1,x2)+pad;
  const miny=Math.min(y1,y2)-pad, maxy=Math.max(y1,y2)+pad;
  return !(maxx<bx||minx>bx+bw||maxy<by||miny>by+bh);
}
function strokePoly(c,pl,ox,oy,bw,bh,width,style,cap){
  let any=false;
  c.lineWidth=width; c.strokeStyle=style; c.lineCap=cap||'round'; c.lineJoin='round';
  for(let i=0;i<pl.length-1;i++){
    if(!segBoxHit(pl[i][0]-ox,pl[i][1]-oy,pl[i+1][0]-ox,pl[i+1][1]-oy,0,0,bw,bh,width)) continue;
    if(!any){ c.beginPath(); any=true; }
    c.moveTo(pl[i][0]-ox,pl[i][1]-oy); c.lineTo(pl[i+1][0]-ox,pl[i+1][1]-oy);
  }
  if(any) c.stroke();
  return any;
}

// The land is a height field lit from the north-west, painted at a quarter
// resolution and smoothed up: mesas stand proud with sunlit rims and shaded
// cliffs, washes sink, dunes roll. Detail — grain, pebbles, tufts, cracks,
// ripples — is inked at full resolution over the top. Baked once per chunk.
const TS_ = 4;                                         // world units per height sample
const _tsm = document.createElement('canvas'); _tsm.width=_tsm.height=CH/TS_; const _tsx=_tsm.getContext('2d');
const _offCache = new Map();
function offsetPoly(pl, d){
  const key=pl.length+':'+pl[0][0]+':'+pl[0][1]+':'+d; let o=_offCache.get(key); if(o) return o;
  o=[];
  for(let i=0;i<pl.length;i++){
    const a=pl[Math.max(0,i-1)], b=pl[Math.min(pl.length-1,i+1)];
    const dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy)||1;
    o.push([pl[i][0]-dy/L*d, pl[i][1]+dx/L*d]);
  }
  _offCache.set(key,o); return o;
}
function smooth01(a,b,v){ const t=clamp((v-a)/(b-a),0,1); return t*t*(3-2*t); }
function heightAt(x,y){
  const e=fbm(x*0.00075, y*0.00075, 4);
  return e*140 + smooth01(.615,.655,e)*70 + fbm(x*.011+3,y*.011+9,2)*7;
}
const T_SAND1=[217,190,144], T_SAND2=[228,206,164], T_FLAT=[222,204,172], T_SCRUB=[160,156,98], T_ROCK=[172,108,78], T_ROCK2=[140,84,62];
function mix3(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }

function makeChunk(cx,cy){
  const c = document.createElement('canvas');
  c.width = CH; c.height = CH;
  const g = c.getContext('2d');
  const ox = cx*CH, oy = cy*CH;
  const outside = oy < MAP_H;

  if(outside){
    // ---- lit height field at quarter resolution
    const n=CH/TS_, gw=n+2, hg=new Float32Array(gw*gw);
    for(let j=0;j<gw;j++) for(let i=0;i<gw;i++) hg[j*gw+i]=heightAt(ox+(i-1)*TS_, oy+(j-1)*TS_);
    const im=_tsx.createImageData(n,n), d=im.data;
    const Lx=-.55, Ly=-.62, Lz=.56, Ln=Math.hypot(Lx,Ly,Lz);
    for(let j=0;j<n;j++) for(let i=0;i<n;i++){
      const wx=ox+i*TS_, wy=oy+j*TS_, k=(j+1)*gw+(i+1);
      if(wy>=MAP_H){ const o=(j*n+i)*4; d[o]=18; d[o+1]=13; d[o+2]=16; d[o+3]=255; continue; }
      const hx=(hg[k+1]-hg[k-1])/(2*TS_), hy=(hg[k+gw]-hg[k-gw])/(2*TS_);
      const nl=Math.hypot(hx,hy,1), lam=(-hx*Lx-hy*Ly+Lz)/(nl*Ln);
      const e=fbm(wx*0.00075, wy*0.00075, 4), m=fbm(wx*0.0014+37.7, wy*0.0014+12.3, 3);
      const wash=fbm(wx*.0009+11,wy*.0009+4,2);
      let col=mix3(T_SAND1,T_SAND2,clamp(wash*1.6-.3,0,1));
      col=mix3(col,T_FLAT,1-smooth01(.36,.44,m));
      col=mix3(col,T_SCRUB,smooth01(.57,.66,m)*(1-smooth01(.57,.62,e))*.72);
      const rk=smooth01(.61,.645,e);
      if(rk>0){ const band=.5+.5*Math.sin(hg[k]*.22); col=mix3(col,mix3(T_ROCK,T_ROCK2,band*.7),rk); }
      const sh=clamp(.74+lam*.46,.55,1.18);
      const sp=1+(hash2(i+cx*n,j+cy*n,5)-.5)*.06;
      const o=(j*n+i)*4;
      d[o]=clamp(col[0]*sh*sp,0,255); d[o+1]=clamp(col[1]*sh*sp,0,255); d[o+2]=clamp(col[2]*sh*sp,0,255); d[o+3]=255;
    }
    _tsx.putImageData(im,0,0);
    g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high';
    g.drawImage(_tsm, -TS_/2, -TS_/2, CH+TS_, CH+TS_);

    // ---- detail, inked at full resolution
    const r = mulberry((cx*73856093)^(cy*19349663));
    for(let i=0;i<1400;i++){ const x=r()*CH, y=r()*CH;
      g.fillStyle= r()<.5? 'rgba(60,40,30,.10)' : 'rgba(255,246,222,.12)'; g.fillRect(x,y,.8+r()*1.1,.8+r()*1.1); }
    for(let i=0;i<70;i++){ const x=r()*CH, y=r()*CH, wx=ox+x, wy=oy+y;
      if(inRiver(wx,wy)||onRoad(wx,wy)) continue;
      const gt=groundAt(wx,wy), s=.8+r()*(gt===3?2.8:1.6);
      g.fillStyle='rgba(50,34,26,.26)'; g.beginPath(); g.ellipse(x+.7,y+.6,s*1.2,s*.75,0,0,TAU); g.fill();
      g.fillStyle= gt===3? pick2(r,['#a8785a','#96684c','#b88a68']) : pick2(r,['#b59a7a','#a58b6c','#c7b08e','#9a8470']);
      g.beginPath(); g.ellipse(x,y,s,s*.7,r()*3,0,TAU); g.fill();
      g.fillStyle='rgba(255,248,225,.42)'; g.beginPath(); g.ellipse(x-s*.3,y-s*.3,s*.4,s*.25,0,0,TAU); g.fill(); }
    g.lineCap='round';
    for(let i=0;i<46;i++){ const x=r()*CH, y=r()*CH, wx=ox+x, wy=oy+y, gt=groundAt(wx,wy);
      if(inRiver(wx,wy)||onRoad(wx,wy)) continue;
      if(gt===2){                                      // dry grass
        for(let b=0;b<7;b++){ const a=-Math.PI/2+(r()-.5)*1.4, l=3+r()*5;
          g.strokeStyle=r()<.5?'#8c8a4e':'#b3a86a'; g.lineWidth=.8;
          g.beginPath(); g.moveTo(x+(r()-.5)*3,y); g.quadraticCurveTo(x+Math.cos(a)*l*.5,y+Math.sin(a)*l*.6,x+Math.cos(a)*l,y+Math.sin(a)*l); g.stroke(); }
      } else if(gt===1){                               // cracked flat
        g.strokeStyle='rgba(80,56,40,.22)'; g.lineWidth=.9; let px=x, py=y, a=r()*TAU;
        g.beginPath(); g.moveTo(px,py); for(let k=0;k<6;k++){ a+=(r()-.5)*1.6; px+=Math.cos(a)*9; py+=Math.sin(a)*9; g.lineTo(px,py); } g.stroke();
        g.strokeStyle='rgba(255,246,222,.18)'; g.lineWidth=.6; g.beginPath(); g.moveTo(x+.8,y+.8); g.lineTo(x+Math.cos(a)*6+.8,y+Math.sin(a)*6+.8); g.stroke();
      } else if(gt===0){                               // wind ripples in the sand
        const a=.35+(r()-.5)*.3, L=16+r()*18;
        for(let q=0;q<3;q++){ const yy=y+q*3.2;
          g.strokeStyle='rgba(120,90,60,.16)'; g.lineWidth=.9; g.beginPath(); g.moveTo(x,yy); g.quadraticCurveTo(x+L*.5,yy-2+Math.sin(a)*4,x+L,yy); g.stroke();
          g.strokeStyle='rgba(255,246,222,.20)'; g.lineWidth=.7; g.beginPath(); g.moveTo(x,yy-1); g.quadraticCurveTo(x+L*.5,yy-3+Math.sin(a)*4,x+L,yy-1); g.stroke(); }
      } else if(gt===3){                               // rubble below the cliffs
        for(let k=0;k<4;k++){ const sx=x+(r()-.5)*10, sy=y+(r()-.5)*6, s=1+r()*2;
          g.fillStyle='rgba(60,34,24,.3)'; g.fillRect(sx+.6,sy+.6,s*1.6,s); g.fillStyle=pick2(r,['#b07a5a','#9a6a4e']); g.fillRect(sx,sy,s*1.6,s); }
      }
    }

    // ---- roads: soft verge, packed earth, two ruts with a lit lip, hoof-marks
    for(const rd of ROADS){
      if(!strokePoly(g,rd,ox,oy,CH,CH,70,'rgba(120,88,56,.14)')) continue;
      strokePoly(g,rd,ox,oy,CH,CH,58,'rgba(190,150,104,.55)');
      strokePoly(g,rd,ox,oy,CH,CH,48,'#c9a476');
      g.globalAlpha=.45; strokePoly(g,rd,ox,oy,CH,CH,26,'#d4b286'); g.globalAlpha=1;
      for(const off of [-12,12]){
        strokePoly(g,offsetPoly(rd,off),ox,oy,CH,CH,3.4,'rgba(84,56,38,.38)');
        strokePoly(g,offsetPoly(rd,off+2),ox,oy,CH,CH,1.2,'rgba(255,240,212,.30)');
      }
      for(let i=0;i<40;i++){ const p=plPoint(rd,r()), x=p[0]-ox+(r()-.5)*18, y=p[1]-oy+(r()-.5)*18;
        if(x<-4||y<-4||x>CH+4||y>CH+4) continue; g.fillStyle='rgba(84,56,38,.24)'; g.beginPath(); g.ellipse(x,y,1.5,1.1,0,0,TAU); g.fill(); }
    }
    // ---- rails: ballast, ties, two steel rails with a bright top
    if(strokePoly(g,RAIL,ox,oy,CH,CH,46,'rgba(100,84,66,.35)')){
      strokePoly(g,RAIL,ox,oy,CH,CH,38,'#8e8170');
      for(let i=0;i<RAIL.length-1;i++){
        const x1=RAIL[i][0]-ox,y1=RAIL[i][1]-oy,x2=RAIL[i+1][0]-ox,y2=RAIL[i+1][1]-oy;
        if(!segBoxHit(x1,y1,x2,y2,0,0,CH,CH,40)) continue;
        const L=Math.hypot(x2-x1,y2-y1), nn=Math.floor(L/13), nx=-(y2-y1)/L, ny=(x2-x1)/L, ux=(x2-x1)/L, uy=(y2-y1)/L;
        for(let k=0;k<nn;k++){ const t=k/nn, px=lerp(x1,x2,t), py=lerp(y1,y2,t);
          if(px<-30||py<-30||px>CH+30||py>CH+30) continue;
          for(let q=0;q<3;q++){ g.fillStyle=q&1?'rgba(60,50,40,.3)':'rgba(220,210,190,.25)'; g.fillRect(px+(r()-.5)*30,py+(r()-.5)*30,1.2,1.2); }
          const tone=hash2(k,i,3);
          g.strokeStyle='rgba(30,22,16,.5)'; g.lineWidth=5.2; g.beginPath(); g.moveTo(px-nx*15+ux,py-ny*15+uy); g.lineTo(px+nx*15+ux,py+ny*15+uy); g.stroke();
          g.strokeStyle=tone<.5?'#6a5038':'#7a5a40'; g.lineWidth=4.2; g.beginPath(); g.moveTo(px-nx*15,py-ny*15); g.lineTo(px+nx*15,py+ny*15); g.stroke();
        }
      }
      for(const s of [-7,7]){ const o=offsetPoly(RAIL,s);
        strokePoly(g,o,ox,oy,CH,CH,3.2,'#3a3430'); strokePoly(g,offsetPoly(RAIL,s-.9),ox,oy,CH,CH,1.1,'#cfc6b6'); }
    }
    // ---- the river bed: wet banks, shallows, deep water down the middle
    if(strokePoly(g,RIVER,ox,oy,CH,CH,RIVER_W*2+40,'rgba(120,96,64,.22)')){
      strokePoly(g,RIVER,ox,oy,CH,CH,RIVER_W*2+22,'#a8916a');
      strokePoly(g,RIVER,ox,oy,CH,CH,RIVER_W*2+8,'#86775a');
      strokePoly(g,RIVER,ox,oy,CH,CH,RIVER_W*2,'#5f8f88');
      strokePoly(g,RIVER,ox,oy,CH,CH,RIVER_W*2-16,'#4a7f80');
      strokePoly(g,RIVER,ox,oy,CH,CH,RIVER_W*2-38,'#3d6f77');
      strokePoly(g,RIVER,ox,oy,CH,CH,RIVER_W*.7,'#33626e');
      for(let i=0;i<30;i++){ const t=r(), p=plPoint(RIVER,t), sd=r()<.5?-1:1;
        const q=offsetPoly(RIVER,sd*(RIVER_W-3+r()*8)), pp=plPoint(q,t), x=pp[0]-ox, y=pp[1]-oy;
        if(x<-10||y<-10||x>CH+10||y>CH+10) continue;
        const s=2+r()*4;
        g.fillStyle='rgba(30,40,40,.35)'; g.beginPath(); g.ellipse(x+1,y+1.2,s*1.2,s*.7,0,0,TAU); g.fill();
        g.fillStyle=pick2(r,['#8a8272','#9a9282','#7a7266']); g.beginPath(); g.ellipse(x,y,s*1.1,s*.72,r()*3,0,TAU); g.fill();
        g.fillStyle='rgba(255,255,245,.3)'; g.beginPath(); g.ellipse(x-s*.3,y-s*.3,s*.4,s*.22,0,0,TAU); g.fill();
        g.strokeStyle='rgba(235,245,240,.35)'; g.lineWidth=.8; g.beginPath(); g.ellipse(x,y+.4,s*1.5,s*.95,0,0,TAU); g.stroke(); }
    }
    // ---- bridges: deck on the water, rails standing up, a shadow on the stream
    for(const b of BRIDGES){
      const R=b.len/2+b.w;
      if(b.x<ox-R||b.x>ox+CH+R||b.y<oy-R||b.y>oy+CH+R) continue;
      const hl=b.len/2, hw=b.w/2;
      g.save(); g.translate(b.x-ox,b.y-oy); g.rotate(b.a);
      g.fillStyle='rgba(20,30,34,.45)'; g.fillRect(-hl+10,-hw+6,b.len-20,b.w+6);
      if(b.rail){
        g.fillStyle='#4a3a2c'; g.fillRect(-hl,-hw,b.len,b.w);
        for(let x=-hl+4;x<hl;x+=11){ g.fillStyle='rgba(20,14,10,.6)'; g.fillRect(x-2,-hw+2,5,b.w-4); g.fillStyle='#7a5a40'; g.fillRect(x-2,-hw+2,4,b.w-4); }
        for(const s of [-7,7]){ g.fillStyle='#3a3430'; g.fillRect(-hl,s-1.6,b.len,3.2); g.fillStyle='#cfc6b6'; g.fillRect(-hl,s-1.8,b.len,1); }
        g.fillStyle='#2a2420'; g.fillRect(-hl,-hw-3,b.len,3); g.fillRect(-hl,hw,b.len,3);
      } else {
        g.fillStyle='#5a4230'; g.fillRect(-hl-4,-hw-2,b.len+8,b.w+4);
        for(let x=-hl;x<hl;x+=7){ const t=hash2(x|0,b.x|0,7); g.fillStyle=t<.5?'#8a6a48':'#7a5c3e'; g.fillRect(x,-hw,6.4,b.w);
          g.fillStyle='rgba(255,230,190,.14)'; g.fillRect(x,-hw,6.4,1.4); g.fillStyle='rgba(20,14,10,.5)'; g.fillRect(x+6.4,-hw,.6,b.w); }
        for(const sd of [-1,1]){ const y=sd*(hw-2);
          for(let x=-hl;x<=hl;x+=24){ g.fillStyle='rgba(20,14,10,.5)'; g.fillRect(x-1.5,y-9,4,11); g.fillStyle='#6b4a2e'; g.fillRect(x-2,y-10,4,10); }
          g.fillStyle='rgba(20,14,10,.45)'; g.fillRect(-hl,y-9,b.len,3); g.fillStyle='#8a6440'; g.fillRect(-hl,y-10,b.len,2.6); g.fillStyle='rgba(255,230,190,.2)'; g.fillRect(-hl,y-10,b.len,.8); }
      }
      g.restore();
    }
  } else {
    g.fillStyle='#120d10'; g.fillRect(0,0,CH,CH);
  }

  // ---- rooms in the indoors strip: floors laid board by board
  if(oy+CH > INDOORS_Y-200){
    for(const R of ROOMS){
      const rx=R.x-R.w/2-ox, ry=R.y-R.h/2-oy;
      if(rx>CH||ry>CH||rx+R.w<0||ry+R.h<0) continue;
      g.save(); g.beginPath(); g.rect(rx,ry,R.w,R.h); g.clip();
      const rr_=mulberry(R.x|0);
      if(R.floor===7){
        g.fillStyle='#7a5634'; g.fillRect(rx,ry,R.w,R.h);
        for(let y=0,row=0;y<R.h;y+=10,row++){
          let x=-(rr_()*60);
          while(x<R.w){ const L=40+rr_()*70, t=rr_();
            g.fillStyle= t<.3? '#6e4c2e' : t<.7? '#7d5836' : '#8a6440'; g.fillRect(rx+x,ry+y,L,10);
            g.fillStyle='rgba(255,220,170,.10)'; g.fillRect(rx+x,ry+y,L,1.2);
            g.fillStyle='rgba(30,16,8,.5)'; g.fillRect(rx+x+L-.8,ry+y,.8,10);
            g.fillStyle='rgba(30,16,8,.18)'; for(let q=0;q<2;q++) g.fillRect(rx+x+rr_()*L,ry+y+3+rr_()*5,8+rr_()*16,.5);
            g.fillStyle='rgba(20,12,8,.5)'; g.fillRect(rx+x+2,ry+y+4.5,.9,.9); g.fillRect(rx+x+L-3,ry+y+4.5,.9,.9);
            x+=L; }
          g.fillStyle='rgba(20,10,6,.45)'; g.fillRect(rx,ry+y+9.4,R.w,.6);
        }
      } else if(R.floor===8){
        g.fillStyle='#7a766c'; g.fillRect(rx,ry,R.w,R.h);
        for(let y=0;y<R.h;y+=22) for(let x=-(y%44?11:0);x<R.w;x+=22){ const t=rr_();
          g.fillStyle= t<.33?'#9a9384':t<.66?'#a39c8c':'#8e887a'; g.fillRect(rx+x+1,ry+y+1,20+rr_()*2,20);
          g.fillStyle='rgba(255,255,245,.12)'; g.fillRect(rx+x+1,ry+y+1,20,1.4);
          g.fillStyle='rgba(0,0,0,.12)'; g.fillRect(rx+x+1,ry+y+19,20,1.2); }
      } else {
        g.fillStyle='#6f5a41'; g.fillRect(rx,ry,R.w,R.h);
        for(let i=0;i<R.w*R.h/60;i++){ g.fillStyle= rr_()<.5? 'rgba(40,28,18,.2)' : 'rgba(255,240,200,.1)'; g.fillRect(rx+rr_()*R.w,ry+rr_()*R.h,1.4,1.4); }
        g.strokeStyle='rgba(210,180,90,.6)'; g.lineWidth=.8;
        for(let i=0;i<R.w*R.h/220;i++){ const x=rx+rr_()*R.w, y=ry+rr_()*R.h, a=rr_()*TAU; g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*5,y+Math.sin(a)*5); g.stroke(); }
      }
      // rugs, where a room earns one
      if(R.id==='saloon'||R.id==='sheriff'||R.id==='bank'||R.id==='doctor'){
        const w=R.w*.46, h=R.h*.32, x=rx+R.w/2-w/2, y=ry+R.h*.52;
        g.fillStyle= R.id==='bank'? '#3a4a5e' : '#7a2e24'; g.fillRect(x,y,w,h);
        g.strokeStyle='#d8b060'; g.lineWidth=2; g.strokeRect(x+4,y+4,w-8,h-8);
        g.strokeStyle='rgba(240,220,170,.5)'; g.lineWidth=.8; g.strokeRect(x+8,y+8,w-16,h-16);
        g.fillStyle='rgba(240,220,170,.35)'; for(let k=0;k<5;k++){ g.beginPath(); g.arc(x+w/2+(k-2)*w*.16,y+h/2,4,0,TAU); g.fill(); }
      }
      if(R.id==='church'){ g.fillStyle='#7a2e24'; g.fillRect(rx+R.w/2-18,ry,36,R.h); g.fillStyle='rgba(216,176,96,.6)'; g.fillRect(rx+R.w/2-16,ry,2,R.h); g.fillRect(rx+R.w/2+14,ry,2,R.h); }
      // lamplight gathers in the middle and dies at the walls
      const gr=g.createRadialGradient(rx+R.w/2,ry+R.h/2,20,rx+R.w/2,ry+R.h/2,Math.max(R.w,R.h)*.7);
      gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(10,6,4,.45)'); g.fillStyle=gr; g.fillRect(rx,ry,R.w,R.h);
      g.fillStyle='rgba(10,6,4,.5)'; g.fillRect(rx,ry,R.w,14);
      g.restore();
    }
  }

  // --- boardwalks: boards run across the walk, each its own tone, a fascia
  //     on the street side and a strip of shade under it
  for(const dk of DECKS){
    if(dk.x>ox+CH||dk.x+dk.w<ox||dk.y>oy+CH+8||dk.y+dk.h<oy) continue;
    g.save(); g.translate(dk.x-ox, dk.y-oy);
    g.fillStyle='rgba(30,18,14,.35)'; g.fillRect(0,dk.h+3,dk.w,5);
    for(let x=0;x<dk.w;x+=6){ const t=hash2(x+dk.x|0,dk.y|0,5);
      g.fillStyle= t<.33?'#7a5636':t<.66?'#8a6440':'#94704a'; g.fillRect(x,0,5.6,dk.h);
      g.fillStyle='rgba(255,230,190,.12)'; g.fillRect(x,0,5.6,1);
      g.fillStyle='rgba(30,20,16,.55)'; g.fillRect(x+5.6,0,.4,dk.h);
      g.fillStyle='rgba(30,20,16,.5)'; g.fillRect(x+2.4,1.6,.8,.8); g.fillRect(x+2.4,dk.h-2.4,.8,.8); }
    g.fillStyle='#4a3322'; g.fillRect(0,dk.h,dk.w,3.4);
    g.fillStyle='rgba(255,230,190,.14)'; g.fillRect(0,dk.h,dk.w,.8);
    g.restore();
  }
  return c;
}

// ---- running water: the bed is baked, the flow is painted live -------------
const RIVER_LANES = [-.62,-.3,0,.3,.62];
function drawWater(){
  if(P && indoors()) return;
  const z=cam.z, halfW=W/(2*cam.z)+80, halfH=H/(2*cam.z)+80;
  if(distToPoly(RIVER,cam.x,cam.y) > Math.max(halfW,halfH)+RIVER_W) return;
  const d=daylight();
  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
  // current lines drifting downstream
  for(let li=0;li<RIVER_LANES.length;li++){
    const lane=offsetPoly(RIVER, RIVER_LANES[li]*RIVER_W);
    ctx.beginPath();
    for(let i=0;i<lane.length;i++){ const x=w2sx(lane[i][0]), y=w2sy(lane[i][1]); i? ctx.lineTo(x,y) : ctx.moveTo(x,y); }
    const edge=Math.abs(RIVER_LANES[li])>.5;
    ctx.setLineDash(edge? [6*z,22*z] : [14*z,34*z+li*6*z]);
    ctx.lineDashOffset = -now*(edge? 22 : 38+li*4)*z;
    ctx.strokeStyle = edge? 'rgba(240,248,240,'+(.22+d*.1)+')' : 'rgba(200,230,226,'+(.14+d*.12)+')';
    ctx.lineWidth=(edge?1.6:1.3)*z; ctx.stroke();
  }
  ctx.setLineDash([]);
  // sun (or moon) glints dancing on the surface
  const gl = d>.2? 'rgba(255,250,225,' : 'rgba(200,215,255,';
  const cxr=cam.x, cyr=cam.y;
  for(let i=0;i<360;i++){
    const t=((i*0.61803)%1), p=plPoint(RIVER,t), off=(hash2(i,7,3)-.5)*RIVER_W*1.5;
    const ai=Math.atan2(RIVER[Math.min(RIVER.length-1,Math.floor(t*(RIVER.length-1))+1)][1]-p[1], RIVER[Math.min(RIVER.length-1,Math.floor(t*(RIVER.length-1))+1)][0]-p[0]);
    const flow=(now*30+i*37)%160-80;
    const x=p[0]-Math.sin(ai)*off+Math.cos(ai)*flow, y=p[1]+Math.cos(ai)*off+Math.sin(ai)*flow;
    if(Math.abs(x-cxr)>halfW||Math.abs(y-cyr)>halfH) continue;
    const tw=Math.sin(now*3.4+i*1.7); if(tw<.3) continue;
    const sx=w2sx(x), sy=w2sy(y), s=(1+tw*2)*z;
    ctx.fillStyle=gl+(tw*.7)+')'; ctx.fillRect(sx-s,sy-.4*z,s*2,.8*z); ctx.fillRect(sx-.4*z,sy-s*.5,.8*z,s);
  }
  ctx.restore();
}

// ---- cloud shadows: a tiling field of soft dark, drifting with the wind ----
let cloudTex=null;
function pvnoise(x,y,per){ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi, u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const h=(a,b)=>hash2(((a%per)+per)%per, ((b%per)+per)%per, 77);
  return lerp(lerp(h(xi,yi),h(xi+1,yi),u), lerp(h(xi,yi+1),h(xi+1,yi+1),u), v); }
function buildClouds(){
  const N=128; cloudTex=document.createElement('canvas'); cloudTex.width=cloudTex.height=N;
  const g=cloudTex.getContext('2d'), im=g.createImageData(N,N);
  for(let j=0;j<N;j++) for(let i=0;i<N;i++){
    let s=0,a=.5,f=1,nn=0; for(let o=0;o<4;o++){ s+=pvnoise(i/N*4*f, j/N*4*f, 4*f)*a; nn+=a; a*=.5; f*=2; }
    const v=s/nn, al=smooth01(.52,.72,v)*.55, k=(j*N+i)*4;
    im.data[k]=0; im.data[k+1]=0; im.data[k+2]=0; im.data[k+3]=al*255;
  }
  g.putImageData(im,0,0);
}
function drawCloudShadows(){
  if(indoors() || daylight()<.3) return;
  if(!cloudTex) buildClouds();
  const texW=2400, z=cam.z;                           // one tile covers 2400 world units
  const ox=((now*16)%texW+texW)%texW, oy=((now*7)%texW+texW)%texW;
  const x0=cam.x-W/(2*z), y0=cam.y-H/(2*z);
  const tx0=Math.floor((x0-ox)/texW), ty0=Math.floor((y0-oy)/texW);
  ctx.save(); ctx.globalAlpha=daylight();
  ctx.imageSmoothingEnabled=true;
  for(let ty=ty0; ty*texW+oy < y0+H/z; ty++) for(let tx=tx0; tx*texW+ox < x0+W/z; tx++){
    const wx=tx*texW+ox, wy=ty*texW+oy;
    ctx.drawImage(cloudTex, w2sx(wx), w2sy(wy), texW*z+1, texW*z+1);
  }
  ctx.restore();
}

// Chunks are painted ahead of need, one per frame, in a ring past the edge of
// the view — so riding into new country never waits on a paint.
function prefetchChunk(){
  const halfW=W/(2*cam.z)+TMARGIN/cam.z+CH*.75, halfH=H/(2*cam.z)+TMARGIN/cam.z+CH*.75;
  const x0=Math.floor((cam.x-halfW)/CH), x1=Math.floor((cam.x+halfW)/CH);
  const y0=Math.floor((cam.y-halfH)/CH), y1=Math.floor((cam.y+halfH)/CH);
  for(let cy=y0;cy<=y1;cy++) for(let cx=x0;cx<=x1;cx++)
    if(!chunkCache.has(cx+','+cy)){ getChunk(cx,cy); return; }
}

// shade() is called ~8 times per figure per frame and used to build a fresh
// string every time — roughly a thousand throwaway strings a frame, which is
// what feeds the GC stalls. The set of (colour, amount) pairs is tiny, so cache.
const _shadeCache = new Map();
function shade(hex, amt){
  if(!hex || hex.charCodeAt(0)!==35) return hex;     // not '#rrggbb'
  let m = _shadeCache.get(hex);
  if(m===undefined){ m = new Map(); _shadeCache.set(hex, m); }
  const k = (amt*1000)|0;
  const hit = m.get(k);
  if(hit!==undefined) return hit;
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  r=clamp(Math.round(r+amt*255),0,255); g=clamp(Math.round(g+amt*255),0,255); b=clamp(Math.round(b+amt*255),0,255);
  const v = 'rgb('+r+','+g+','+b+')';
  m.set(k,v); return v;
}
function getChunk(cx,cy){
  const k = cx+','+cy;
  let e = chunkCache.get(k);
  if(!e){
    if(chunkCache.size>150){                      // evict least recently used
      let oldest=null, ot=1e18;
      for(const [kk,vv] of chunkCache){ if(vv.t<ot){ot=vv.t;oldest=kk;} }
      if(oldest) chunkCache.delete(oldest);
    }
    e = { c:makeChunk(cx,cy), t:chunkFrame };
    chunkCache.set(k,e);
  }
  e.t = chunkFrame;
  return e.c;
}
// The ground never changes between frames — only the camera does. So the
// visible chunks are composited ONCE into an oversized buffer and that buffer
// is blitted 1:1 each frame. Scaled bilinear blits of a dozen chunks every
// frame was the second most expensive thing in the game.
let tBuf=null, tBufW=0, tBufH=0, tValid=false;
const tCam={x:0,y:0,z:0};
const TMARGIN=224;
function invalidateTerrain(){ tValid=false; }

function drawTerrainDirect(){
  const halfW = W/(2*cam.z), halfH = H/(2*cam.z);
  const x0=Math.floor((cam.x-halfW)/CH), x1=Math.floor((cam.x+halfW)/CH);
  const y0=Math.floor((cam.y-halfH)/CH), y1=Math.floor((cam.y+halfH)/CH);
  const s=CH*cam.z;
  for(let cy=y0;cy<=y1;cy++) for(let cx=x0;cx<=x1;cx++){
    const c=getChunk(cx,cy);
    ctx.drawImage(c, w2sx(cx*CH)-.5, w2sy(cy*CH)-.5, s+1, s+1);
  }
}
function drawTerrain(){
  // While the zoom is actually changing the buffer would rebuild every frame,
  // which costs far more than it saves — so ride the direct path through the
  // transition and cache again once the zoom settles.
  if(Math.abs(cam.z-cam.tz) > 0.004){ tValid=false; drawTerrainDirect(); prefetchChunk(); return; }
  const needW=W+TMARGIN*2, needH=H+TMARGIN*2;
  if(!tBuf || tBufW!==needW || tBufH!==needH){
    tBuf=document.createElement('canvas'); tBuf.width=needW; tBuf.height=needH;
    tBufW=needW; tBufH=needH; tValid=false;
  }
  const dx=(cam.x-tCam.x)*cam.z, dy=(cam.y-tCam.y)*cam.z;
  if(!tValid || Math.abs(cam.z-tCam.z)>0.0001 || Math.abs(dx)>TMARGIN-16 || Math.abs(dy)>TMARGIN-16){
    tCam.x=cam.x; tCam.y=cam.y; tCam.z=cam.z; tValid=true;
    const g=tBuf.getContext('2d');
    g.setTransform(1,0,0,1,0,0);
    const halfW=needW/(2*cam.z), halfH=needH/(2*cam.z);
    const x0=Math.floor((cam.x-halfW)/CH), x1=Math.floor((cam.x+halfW)/CH);
    const y0=Math.floor((cam.y-halfH)/CH), y1=Math.floor((cam.y+halfH)/CH);
    const s=CH*cam.z;
    for(let cy=y0;cy<=y1;cy++) for(let cx=x0;cx<=x1;cx++){
      const c=getChunk(cx,cy);
      const bx=(cx*CH-cam.x)*cam.z + needW/2;

  depot:   {wall:'#8a6a48', trim:'#e8d6ae', roof:'#5a4a3e', mat:'tin',     sign:'#2a2a30', ff:18, porch:1},
  mine:    {wall:'#6a5a4a', trim:'#8a6a48', roof:'#7a6a58', mat:'rock',    ff:0, mine:1},

  ruin:    {wall:'#c9a07a', trim:'#b08a64', roof:'#a2947a', mat:'ruin',    ff:0}

const BSS = 2;                        // building sprite pixels per world unit

    return Object.assign({},st,{ wall:pick2(r,['#9a7a58','#8a6a4a','#a88a64','#7a6048','#b09070']), roof:pick2(r,['#6b503a','#5a4a3a','#7a5040','#4a4238','#6a6258']) }); }

function getBuildingSprite(b){

function paintBuilding(b, st, wh, wins){

        ctx.fillStyle='rgba(40,20,10,.4)'; for(let k=0;k<3;k++) ctx.fillRect(Math.min(sd*doorW/2,sd*1.4)+.6,dTop+dH*(.36+k*.12),Math.abs(doorW/2-1.4)-1.2,.6); }
    } else if(st.barnDoor){

        ctx.strokeStyle=st.trim; ctx.lineWidth=1.4; const xa=sd<0?-doorW/2:0; ctx.beginPath(); ctx.moveTo(xa+1,dTop+1); ctx.lineTo(xa+doorW/2-1,y1-1); ctx.moveTo(xa+doorW/2-1,dTop+1); ctx.lineTo(xa+1,y1-1); ctx.stroke(); ctx.strokeRect(xa+1,dTop+1,doorW/2-2,dH-2); }
    } else {
      ctx.beginPath(); ctx.rect(-doorW/2,dTop,doorW,dH); pfo(shade(st.wall,-.2),.7);
      ctx.strokeStyle='rgba(20,10,8,.35)'; ctx.lineWidth=.6; ctx.strokeRect(-doorW/2+2,dTop+2,doorW-4,dH*.4); ctx.strokeRect(-doorW/2+2,dTop+dH*.5,doorW-4,dH*.45);
      ctx.fillStyle='#d9b25a'; ctx.beginPath(); ctx.arc(doorW/2-3,dTop+dH*.55,.9,0,TAU); ctx.fill();
    }
    wins.push({x:-doorW/2,y:dTop,w:doorW,h:dH,door:1});
    // columns on the bank and the big house
    if(st.cols){ for(const xx of [-b.w*.42,-b.w*.22,b.w*.22,b.w*.42]){ ctx.beginPath(); ctx.rect(xx-2.6,rb+2,5.2,wh-2); pfo(st.trim,.7);
      ctx.fillStyle='rgba(0,0,0,.14)'; ctx.fillRect(xx+.8,rb+2,1.8,wh-2); ctx.beginPath(); ctx.rect(xx-4,rb,8,3); pfo(st.trim,.5); } }
    // lanterns either side of the door
    for(const sd of [-1,1]){ const lx=sd*(doorW/2+6);
      ctx.fillStyle='#2a2426'; ctx.fillRect(lx-.4,dTop+2,.8,3); ctx.beginPath(); rr(lx-2,dTop+4,4,5,.8); pfo('#d8c8a0',.5);
      wins.push({x:lx-1.6,y:dTop+4.5,w:3.2,h:4,lamp:1}); }
  } else {

    ctx.fillStyle='#2a1c16'; ctx.fillRect(-11,y0-3,22,3); ctx.fillStyle=st.trim; ctx.fillRect(-13,y0-4.4,26,1.6);

  if(front && st.porch){
    ctx.beginPath(); ctx.moveTo(x0-6,rb+3); ctx.lineTo(x1+6,rb+3); ctx.lineTo(x1+8,rb+14); ctx.lineTo(x0-8,rb+14); ctx.closePath(); pfo('#6e5034',1);

  } else if(front && st.awning){
    ctx.save(); ctx.beginPath(); ctx.moveTo(x0-4,rb+2); ctx.lineTo(x1+4,rb+2); ctx.lineTo(x1+6,rb+16); ctx.lineTo(x0-6,rb+16); ctx.closePath(); ctx.clip();
    for(let x=x0-8,i=0;x<x1+8;x+=8,i++){ ctx.fillStyle=i%2?'#efe2c2':st.awning; ctx.fillRect(x,rb+2,8,15); }
    ctx.fillStyle='rgba(255,240,210,.2)'; ctx.fillRect(x0-6,rb+2,b.w+12,4); ctx.restore();
    for(let x=x0-6,i=0;x<x1+6;x+=8,i++){ ctx.beginPath(); ctx.arc(x+4,rb+16,4,0,Math.PI); ctx.fillStyle=i%2?'#efe2c2':st.awning; ctx.fill(); ctx.strokeStyle=OUTL; ctx.lineWidth=.6; ctx.stroke(); }
    ctx.strokeStyle=OUTL; ctx.lineWidth=.9; ctx.beginPath(); ctx.moveTo(x0-4,rb+2); ctx.lineTo(x1+4,rb+2); ctx.stroke();

    if(peak){ ctx.lineTo(-b.w*.26,top-4); ctx.quadraticCurveTo(0,top-peak*1.6,b.w*.26,top-4); ctx.lineTo(b.w*.26,top); }
    ctx.lineTo(x1,top); ctx.lineTo(x1,rb); ctx.closePath(); pfo(st.wall,1.1);
    ctx.save(); ctx.clip();
    if(st.stone){ for(let y=top-peak*2; y<rb; y+=6){ ctx.fillStyle='rgba(40,34,30,.3)'; ctx.fillRect(x0,y,b.w,.7); } }
    else for(let x=x0; x<x1; x+=5){ ctx.fillStyle='rgba(30,18,12,.24)'; ctx.fillRect(x+4.6,top-peak*2,.5,rb-top+peak*2); }

    const sh=st.ff*.62, sy=rb-st.ff*.5-sh/2-1;
    ctx.fillStyle=st.sign; ctx.fillRect(x0+9,sy,b.w-18,sh);
    ctx.strokeStyle=st.trim; ctx.lineWidth=1.1; ctx.strokeRect(x0+11,sy+2,b.w-22,sh-4);
    const fs=Math.min(sh*.62,(b.w-26)/(b.name.length*.6));

  if(front && !st.ff && b.name && st.sign && b.kind!=='manor'){

function drawBuildingShadow(b){                       // pass 1: into the shadow layer
  const z=cam.z, hb=bWallH(b)+18+(BSTYLE[b.kind]&&BSTYLE[b.kind].steeple?40:0);
  const sx=w2sx(b.x), sy=w2sy(b.y), hw=b.w/2*z, hh=b.h/2*z;
  const dx=sun.dx*.42*hb*z, dy=-0.30*hb*z;
  ctx.fillStyle='#000';
  ctx.beginPath(); ctx.moveTo(sx-hw,sy+hh); ctx.lineTo(sx+hw,sy+hh);
  ctx.lineTo(sx+hw+dx,sy+hh+dy); ctx.lineTo(sx+hw+dx,sy-hh+dy); ctx.lineTo(sx-hw+dx,sy-hh+dy); ctx.lineTo(sx-hw,sy-hh); ctx.closePath(); ctx.fill();
  // a soft band of contact shade all round the foot of the walls
  ctx.globalAlpha=.35; ctx.fillRect(sx-hw-5*z,sy+hh-2*z,b.w*z+10*z,7*z); ctx.globalAlpha=1;
}
function drawBuildingGround(b){                       // pass 2, before bodies: things lying on the ground
  if(b.face>0 || b.kind==='mine' || b.kind==='ruin') return;
  const z=cam.z, sx=w2sx(b.x), sy=w2sy(b.y-b.h/2);
  ctx.save(); ctx.translate(sx,sy); ctx.scale(z,z);
  ctx.fillStyle='#7a5a3a'; ctx.fillRect(-22,-14,44,14);
  ctx.fillStyle='rgba(30,18,12,.45)'; for(let x=-22;x<22;x+=5.5) ctx.fillRect(x+5,-14,.5,14);
  ctx.fillStyle='rgba(255,230,190,.12)'; ctx.fillRect(-22,-14,44,1.4);
  ctx.fillStyle='#5a3e26'; ctx.fillRect(-24,-17,48,3);
  ctx.restore();
}
function drawBuilding(b){
  const z=cam.z, sx=w2sx(b.x), sy=w2sy(b.y);
  const s=getBuildingSprite(b), k=z/BSS;
  if(sx+(b.w/2+40)*z<0||sx-(b.w/2+40)*z>W||sy+(b.h/2+40)*z<0||sy-(b.h/2+140)*z>H) return;
  ctx.drawImage(s.c, sx-s.ox*k, sy-s.oy*k, s.c.width*k, s.c.height*k);
  // windows light up after dark; the lamps by the door burn
  const nd = 1-daylight();
  if(nd>.25){
    ctx.save(); ctx.globalAlpha=clamp((nd-.25)*1.6,0,1);
    for(const w of s.wins){
      ctx.fillStyle= w.lamp? '#ffe6a0' : w.door? '#f0a040' : '#ffcf6a';
      ctx.fillRect(sx+w.x*z, sy+w.y*z, w.w*z, w.h*z);
      if(!w.lamp){ ctx.fillStyle='rgba(120,60,20,.35)'; ctx.fillRect(sx+(w.x+w.w/2-.6)*z, sy+w.y*z, 1.2*z, w.h*z); }
    }
    ctx.restore();
    const la=clamp((nd-.25)*1.6,0,1);
    for(const w of s.wins) addLight(b.x+w.x+w.w/2, b.y+w.y+w.h/2+(w.lamp?0:8), w.lamp? 34 : w.door? 70 : 48, '#ffb347', (w.lamp? .30 : w.door? .22 : .15)*la);
  }
}

// ---- interior walls: a cap on top and a face toward the camera --------------
const WALL_H = 40;
function drawWall(b){
  if(!b.rw) return;
  const z=cam.z, sx=w2sx(b.x), sy=w2sy(b.y);
  const horiz=b.w>b.h, low = b.low;
  const hgt = low? 10 : WALL_H;
  ctx.save(); ctx.translate(sx,sy); ctx.scale(z,z);
  const hw=b.w/2, hh=b.h/2;
  if(horiz){
    ctx.fillStyle='#5a4030'; ctx.fillRect(-hw,hh-hgt,b.w,hgt);                   // the face
    if(!low){ ctx.fillStyle='rgba(0,0,0,.18)'; for(let x=-hw;x<hw;x+=7) ctx.fillRect(x+6.4,hh-hgt,.6,hgt);
      ctx.fillStyle='#4a3224'; ctx.fillRect(-hw,hh-hgt*.42,b.w,hgt*.42);
      ctx.fillStyle='#b98c3a'; ctx.fillRect(-hw,hh-hgt*.42,b.w,1.2); }
    ctx.fillStyle='#3a2a20'; ctx.fillRect(-hw,-hh-hgt,b.w,b.h);                   // the cap
    ctx.fillStyle='rgba(255,230,190,.12)'; ctx.fillRect(-hw,-hh-hgt,b.w,1.4);
    ctx.strokeStyle=OUTL; ctx.lineWidth=1; ctx.strokeRect(-hw,-hh-hgt,b.w,b.h+hgt);
  } else {
    ctx.fillStyle='#3a2a20'; ctx.fillRect(-hw,-hh-hgt,b.w,b.h);
    ctx.fillStyle='#5a4030'; ctx.fillRect(-hw,hh-hgt,b.w,hgt);
    ctx.fillStyle='rgba(255,230,190,.1)'; ctx.fillRect(-hw,-hh-hgt,1.4,b.h);
    ctx.strokeStyle=OUTL; ctx.lineWidth=1; ctx.strokeRect(-hw,-hh-hgt,b.w,b.h+hgt);
  }
  ctx.restore();
}
function drawWallShadow(b){
  if(!b.rw || b.low) return;
  const z=cam.z, sx=w2sx(b.x), sy=w2sy(b.y);
  ctx.fillStyle='#000'; ctx.globalAlpha=.6;
  ctx.fillRect(sx-b.w/2*z, sy+b.h/2*z, b.w*z, 10*z);
  ctx.globalAlpha=1;
}

// ==========================================================================
//  GUN SILHOUETTES
//  Top-down, muzzle toward +x, hand at the origin. One spec per model rather
//  than one draw function per model.
//
//  RARITY HAS TO SCREAM, so it escalates through the whole object, not a decal:
//    COMMON     dull pitted iron, plain wood, nothing added
//    FINE       blued steel, a brass band and buttplate
//    RARE       engraved receiver, a named grip material, a muzzle device
//    LEGENDARY  the gun stops being a gun and becomes a phenomenon — oversized,
//               gold-furnished, and carrying an ALWAYS-ON effect with its own
//               saturated signature colour, plus a motif orbiting or burning
//               on it. Holding one changes the player too.
//
//  Shape knobs (so two revolvers are not the same rectangle):
//    bl/bw barrel · cyl cylinder · stk stock · scp scope · twin double barrels
//    gat barrel cluster · drum disc magazine · tube under-barrel tube
//    muz muzzle device · lever lever loop · sight front blade · eng engraving

for(const k in GUNS){ GUNS[k].id=k; GUNS[k].art=GUN_ART[k]; }

// A gun is the same shape every frame, so it is baked once into a small sprite
// and blitted. Legendaries stay live — their cards orbit, their vents pulse,
// their barrels spin.
const gunSpr = Object.create(null);
// Baked at SS times the on-screen size, so it stays crisp when the camera
// magnifies it and when the shop shows it large.
const GUN_SS = 4;
// Where the parts of a gun sit, in its own units: the trigger hand is the
// origin, the muzzle points +x, up is -y. Profiles now — the camera is side-on
// enough that a gun reads by its outline: cylinder, lever, scope, twin barrels.
const _gunGeo = Object.create(null);
function gunGeo(g){
  let G=_gunGeo[g.id]; if(G) return G;
  const a=g.art; G={};
  if(a.cyl){
    const cl=(a.cw||3.8)*1.15;
    G.rev=true; G.cl=cl; G.ce=1.2+cl; G.bx0=G.ce; G.bx1=G.ce+a.bl;
    G.axis=-3.5+a.bw/2; G.muz=[G.bx1+(a.muz?0.8:0.1), G.axis];
    G.x0=-6.2; G.x1=G.bx1+3; G.y0=-7.5; G.y1=7.5;
  } else {
    const rf=-2.4+(a.rec||5)*1.1;
    G.rev=false; G.rf=rf; G.bx0=rf; G.bx1=rf+a.bl; G.stk=(a.stk||4)*1.3;
    G.axis = a.twin? -3.9+a.bw : a.gat? -2.2 : -3.4+a.bw/2;
    G.muz=[G.bx1+(a.muz?1.0:0.1), G.axis];
    G.fore=[rf+Math.min(a.bl*0.4,9)*0.55, G.axis+2.4];
    G.x0=-2.4-G.stk-3; G.x1=G.bx1+(a.motif==='notch'?4:3);
    G.y0=-(a.scp?9:7.5)-(a.gat&&a.drum?a.drum*1.6:0); G.y1=6.5+(a.drum&&!a.gat?a.drum*1.6:0);
  }
  return _gunGeo[g.id]=G;
}
// the muzzle, in gun units, scaled by the size the figure carries it at
function gunMuzzle(g){ return gunGeo(g).muz; }

function getGunSprite(g, sc){
  const key = g.id+'|'+sc.toFixed(3);
  let s = gunSpr[key]; if(s) return s;
  const G=gunGeo(g), pad=4, bs=sc*GUN_SS;
  const c=document.createElement('canvas');
  c.width =Math.max(2, Math.ceil((G.x1-G.x0)*bs)+pad*2);
  c.height=Math.max(2, Math.ceil((G.y1-G.y0)*bs)+pad*2);
  s={ c:c, ox:-G.x0*bs+pad, oy:-G.y0*bs+pad };
  const prev=ctx;
  try{ ctx=c.getContext('2d'); ctx.translate(s.ox, s.oy); drawGunBody(g, bs); }
  finally { ctx=prev; }
  gunSpr[key]=s; return s;
}
function drawGunArt(g, sc){
  const a = g && g.art; if(!a) return;
  if(g.rar<3){                       // bake-able: nothing on it moves
    const s=getGunSprite(g, sc);
    ctx.save(); ctx.scale(1/GUN_SS, 1/GUN_SS);
    ctx.drawImage(s.c, -s.ox, -s.oy);
    ctx.restore();
    return;
  }
  drawGunBody(g, sc);
}

function drawGunBody(g, sc){
  const a = g && g.art; if(!a) return;
  const G=gunGeo(g), rar=g.rar;
  const metal=a.metal||'#3d3734', mD=shade(metal,-.10), mL=shade(metal,.18);
  const wood=a.wood||'#6b4a2e', wD=shade(wood,-.10);
  const gold='#d8a63a', brass=a.band||'#b98c3a';
  const furn = rar===3? gold : rar===2? '#e0b855' : brass;
  ctx.save(); ctx.scale(sc,sc);
  ctx.lineJoin='round'; ctx.lineCap='round'; ctx.strokeStyle=C.ink; ctx.lineWidth=0.55;
  function P(f){ ctx.fillStyle=f; ctx.fill(); ctx.stroke(); }
  function hl(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); }

  if(G.rev){
    // ---- grip: plough handle, or a bird's head on the snubs
    ctx.beginPath();
    if(a.snub){ ctx.moveTo(-1.8,-.6); ctx.quadraticCurveTo(-3.4,1.4,-4.3,3.7); ctx.quadraticCurveTo(-4.8,5.6,-2.8,5.3);
      ctx.quadraticCurveTo(-.6,4.4,1.0,.3); }
    else { ctx.moveTo(-1.6,-.7); ctx.quadraticCurveTo(-2.9,2.2,-4.5,5.6); ctx.quadraticCurveTo(-3.3,6.8,-1.6,6.1);
      ctx.quadraticCurveTo(-.4,3,1.3,.2); }
    ctx.closePath(); P(a.grip||wood);
    hl(-2.9,1.4,.7,3.0,'rgba(255,238,205,.24)');
    if(rar>=2){ ctx.strokeStyle='rgba(30,20,16,.35)'; ctx.lineWidth=.25;          // checkered panel
      for(let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(-3.1+i*.5,1.2); ctx.lineTo(-2.2+i*.5,4.6); ctx.stroke(); }
      ctx.strokeStyle=C.ink; ctx.lineWidth=.55; }
    // ---- frame, hammer, guard
    ctx.beginPath(); rr(-2.3,-3.8,3.8,4.0,.7); P(rar===2? '#c9a24a' : mD);
    ctx.beginPath(); ctx.moveTo(-1.9,-3.6); ctx.lineTo(-3.9,-5.3); ctx.lineTo(-3.2,-5.8); ctx.lineTo(-.8,-3.9); ctx.closePath(); P(rar===3?gold:mD);
    ctx.beginPath(); ctx.arc(.35,.55,1.75,.15,Math.PI-.15); ctx.lineWidth=.75; ctx.strokeStyle= rar>=1? furn : mD; ctx.stroke();
    ctx.lineWidth=.45; ctx.strokeStyle=C.ink; ctx.beginPath(); ctx.moveTo(.2,.2); ctx.quadraticCurveTo(.7,1.2,.1,1.8); ctx.stroke(); ctx.lineWidth=.55;
    // ---- top strap, cylinder
    ctx.beginPath(); ctx.rect(-1.8,-4.15,G.ce+1.8,.8); P(mD);
    const ch=(a.cw||3.8)*1.02, cy0=-2.1-ch/2;
    ctx.beginPath(); rr(1.2,cy0,G.cl,ch,1.1); P(metal);
    ctx.fillStyle=mD; for(let i=0;i<3;i++) ctx.fillRect(1.65,cy0+ch*(.18+i*.28),G.cl-.9,ch*.11);
    hl(1.5,cy0+.35,G.cl-.6,.42,mL);
    // ---- barrel
    ctx.beginPath();
    if(a.taper){ ctx.moveTo(G.bx0,-3.5); ctx.lineTo(G.bx1,-3.5+a.bw*.14); ctx.lineTo(G.bx1,-3.5+a.bw*.86); ctx.lineTo(G.bx0,-3.5+a.bw); ctx.closePath(); }
    else rr(G.bx0,-3.5,a.bl,a.bw,.35);
    P(metal);
    hl(G.bx0+.2,-3.42,a.bl-.5,.38,mL);
    if(!a.snub){ ctx.beginPath(); rr(G.bx0,-3.5+a.bw,a.bl*.56,.95,.3); P(mD); }
    ctx.fillStyle=mD; ctx.fillRect(G.bx1-1.2,-4.25,.8,.8);
    if(a.muz){ ctx.beginPath(); rr(G.bx1-1.4,G.axis-a.muz/2,2.2,a.muz,.4); P(mL); }
    if(a.pit){ ctx.fillStyle='rgba(128,82,48,.55)';
      for(let i=0;i<7;i++) ctx.fillRect(-1.8+i*1.3,-3.2+((i*7)%3)*1.1,.6,.55); }
  } else {
    const rf=G.rf, S=G.stk;
    // ---- stock, with a real comb, heel, toe and wrist
    if(!a.gat || a.stk){
      ctx.beginPath(); ctx.moveTo(-1.6,-3.3); ctx.lineTo(-2.4-S,-2.2); ctx.quadraticCurveTo(-3.3-S,.9,-2.7-S,3.9);
      ctx.lineTo(-4.6,1.5); ctx.quadraticCurveTo(-2.2,.9,-.6,1.5); ctx.lineTo(-.6,-.2); ctx.closePath(); P(wood);
      ctx.strokeStyle='rgba(40,22,12,.30)'; ctx.lineWidth=.3;
      ctx.beginPath(); ctx.moveTo(-3,-2.2); ctx.quadraticCurveTo(-1-S*.5,-1.9,-1.8-S,-1.3); ctx.moveTo(-4,.6); ctx.lineTo(-S,.9); ctx.stroke();
      ctx.strokeStyle=C.ink; ctx.lineWidth=.55;
      hl(-1-S*.9,-2.2,S*.8,.45,'rgba(255,236,200,.22)');
      if(rar>=1){ ctx.beginPath(); rr(-3.1-S,-2.3,1.0,6.3,.35); P(rar===3?gold:brass); }
      if(a.motif==='notch'){ ctx.strokeStyle='rgba(232,220,192,.7)'; ctx.lineWidth=.3;
        for(let i=0;i<7;i++){ const x=-3.4-i*1.15; ctx.beginPath(); ctx.moveTo(x,-1.9); ctx.lineTo(x,.9); ctx.stroke(); }
        ctx.strokeStyle=C.ink; ctx.lineWidth=.55; }
    }
    // ---- wood under the barrel, magazine tube
    if(!a.gat){ ctx.beginPath(); rr(rf-.3, G.axis+(a.twin? .1 : a.bw*.3), Math.min(a.bl*.4,9), 2.3, .9); P(wD); }
    if(a.tube){ ctx.beginPath(); rr(rf, G.axis+a.bw*.5-.1, a.tube, 1.15, .45); P(mD); }
    // ---- barrels
    if(a.twin){
      ctx.beginPath(); rr(rf,-3.9,a.bl,a.bw,.35); P(metal);
      ctx.beginPath(); rr(rf,-3.9+a.bw,a.bl,a.bw,.35); P(mD);
      hl(rf+.2,-3.82,a.bl-.4,.4,mL);
    } else if(a.gat){
      const spin = a.spin? now*(P_spinning()?16:1.8) : 0, bars=[];
      for(let i=0;i<3;i++){ const ph=spin+i*2.094; bars.push([Math.cos(ph), -2.2+Math.sin(ph)*1.9]); }
      bars.sort((p,q)=>p[0]-q[0]);
      for(const b of bars){ ctx.beginPath(); rr(rf,b[1]-a.bw/2,a.bl,a.bw,.35); P(shade(metal,.10*b[0])); }
      for(const x of [rf+1.4, rf+a.bl*.55, rf+a.bl-1.2]){ ctx.beginPath(); rr(x,-5.4,1.4,6.4,.4); P(rar===3?gold:mD); }
    } else {
      ctx.beginPath();
      if(a.taper){ ctx.moveTo(rf,-3.4); ctx.lineTo(G.bx1,-3.4+a.bw*.16); ctx.lineTo(G.bx1,-3.4+a.bw*.84); ctx.lineTo(rf,-3.4+a.bw); ctx.closePath(); }
      else rr(rf,-3.4,a.bl,a.bw,.35);
      P(metal); hl(rf+.2,-3.32,a.bl-.5,.36,mL);
    }
    // ---- receiver, hammer, guard, lever
    ctx.beginPath(); rr(-2.4,-4.0,rf+2.4,4.4,.7); P(a.gat? mD : metal);
    hl(-2.1,-3.8,rf+1.8,.45,mL);
    if(!a.gat){ ctx.beginPath(); ctx.moveTo(-1.8,-3.8); ctx.lineTo(-3.4,-5.2); ctx.lineTo(-2.7,-5.6); ctx.lineTo(-.9,-4.0); ctx.closePath(); P(rar===3?gold:mD);
      if(a.twin){ ctx.beginPath(); ctx.moveTo(-.9,-3.9); ctx.lineTo(-2.2,-5.4); ctx.lineTo(-1.6,-5.7); ctx.lineTo(.1,-4.0); ctx.closePath(); P(rar===3?gold:mD); } }
    ctx.beginPath(); ctx.arc(-.2,.7,1.55,.15,Math.PI-.15); ctx.lineWidth=.7; ctx.strokeStyle= rar>=1? furn : mD; ctx.stroke();
    if(a.lever){ ctx.beginPath(); ctx.moveTo(-.6,.7); ctx.quadraticCurveTo(-1.1,4.0,1.8,3.8); ctx.quadraticCurveTo(3.6,3.4,2.2,.6);
      ctx.lineWidth=.85; ctx.strokeStyle=rar>=2? furn : mL; ctx.stroke(); }
    ctx.lineWidth=.55; ctx.strokeStyle=C.ink;
    if(a.drum){ const top=!!a.gat, dx=rf*.45, dy= top? -4.2-a.drum*.62 : 1.4+a.drum*.62, r=a.drum*.72;
      ctx.beginPath(); ctx.arc(dx,dy,r,0,TAU); P(mL);
      ctx.beginPath(); ctx.arc(dx,dy,r*.45,0,TAU); P(mD);
      ctx.fillStyle=mD; for(let i=0;i<6;i++){ const q=i/6*TAU; ctx.beginPath(); ctx.arc(dx+Math.cos(q)*r*.74,dy+Math.sin(q)*r*.74,r*.1,0,TAU); ctx.fill(); } }
    // ---- scope
    if(a.scp){
      ctx.fillStyle=mD; ctx.fillRect(.3,-5.1,1,1.3); ctx.fillRect(a.scp-1.8,-5.1,1,1.3);
      ctx.beginPath(); rr(-.5,-6.7,a.scp,1.8,.8); P(mD);
      ctx.beginPath(); rr(-1.2,-7.1,1.5,2.6,.5); P(metal);
      ctx.beginPath(); rr(a.scp-1.1,-7.3,1.8,3.0,.5); P(metal);
      if(rar>=2){ ctx.beginPath(); rr(a.scp*.4,-6.8,1.0,2.0,.3); P(furn); }
      ctx.fillStyle=a.glow||'#9ec0d4'; ctx.beginPath(); ctx.arc(a.scp+.4,-5.8,.7,0,TAU); ctx.fill();
      hl(0,-6.55,a.scp-1.2,.35,mL);
    }
    // ---- muzzle device, teeth, sight
    if(a.muz){ ctx.beginPath(); rr(G.bx1-1.6,G.axis-a.muz/2,2.6,a.muz,.5); P(mL);
      if(a.saw){ ctx.fillStyle=mL;
        for(let i=0;i<4;i++){ ctx.beginPath(); const y0=G.axis-a.muz/2+i*a.muz/4;
          ctx.moveTo(G.bx1+1,y0); ctx.lineTo(G.bx1+2.4,y0+a.muz/8); ctx.lineTo(G.bx1+1,y0+a.muz/4); ctx.closePath(); ctx.fill(); ctx.stroke(); } } }
    if(a.sight){ ctx.fillStyle=mD; ctx.fillRect(G.bx1-1.5,G.axis-a.bw/2-.8,.7,.8); }
  }

  // ---- the rarity ladder, carried by the whole object
  if(rar===1){                                   // FINE: brass bands, blued sheen
    ctx.beginPath(); rr(G.bx0+.4,(G.rev?-3.5:G.axis-a.bw/2)-.35,1.4,a.bw*(a.twin?2:1)+.7,.3); P(brass);
    hl(G.bx0+2.2,(G.rev?-3.5:G.axis-a.bw/2)+.5,(G.bx1-G.bx0)*.6,.25,'rgba(170,200,230,.35)');

  if(rar===2){                                   // RARE: engraving and a collar
    ctx.strokeStyle='rgba(240,205,120,.85)'; ctx.lineWidth=.28;
    const ex0=G.rev?-1.9:-2.1;
    for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(ex0+.9+i*1.1,-1.9,.6,Math.PI*.2,Math.PI*1.6); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(ex0+.2,-.6); ctx.quadraticCurveTo(ex0+1.9,-1.4,ex0+3.4,-.7); ctx.stroke();
    ctx.strokeStyle=C.ink; ctx.lineWidth=.55;
    ctx.beginPath(); rr(G.bx0+.3,(G.rev?-3.5:G.axis-a.bw/2)-.45,1.1,a.bw*(a.twin?2:1)+.9,.3); P('#e0b855');
  }

  ctx.restore();
}
function P_spinning(){ return !!(P && P.abMode==='spin') || !!(cine && cine.kind==='ironhorse'); }

// A legendary is not a common gun with gold on it. It is always doing something.
// Drawn inside drawGunBody's scale, so everything here is in gun units.
function drawLegendaryDress(a, G){
  const gold='#d8a63a', glow=a.glow||'#f0b429';
  const pulse = 0.6 + Math.sin(now*3)*0.25;
  const top=(G.rev?-3.5:G.axis-a.bw/2);
  function piece(f){ ctx.fillStyle=f; ctx.fill(); ctx.strokeStyle=C.ink; ctx.lineWidth=.5; ctx.stroke(); }
  // gold furniture at both ends of the barrel
  ctx.beginPath(); rr(G.bx0-.2,top-.5,1.3,a.bw*(a.twin?2:1)+1,.3); piece(gold);
  ctx.beginPath(); rr(G.bx1-2.6,top-.4,1.1,a.bw*(a.twin?2:1)+.8,.3); piece(gold);
  // an inlaid seam of the signature colour, breathing
  ctx.globalAlpha=.55+pulse*.4; ctx.fillStyle=glow;
  ctx.fillRect(G.bx0+1.6, top+a.bw*.42, (G.bx1-G.bx0)-4.6, .42);
  ctx.globalAlpha=1;
  if(a.motif==='cross'){                        // JUDGMENT — the preacher's iron
    ctx.fillStyle=gold;
    ctx.fillRect(-2.6-G.stk*.55,-1.8,3.6,.8); ctx.fillRect(-1.6-G.stk*.55,-3,.8,3.6);
    for(const yy of [-3.9+a.bw*.5, -3.9+a.bw*1.5]){        // both mouths burning, always
      ctx.globalAlpha=pulse; ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(G.bx1+.2,yy,1.5,0,TAU); ctx.fill();
      ctx.globalAlpha=pulse*.9; ctx.fillStyle='#ffe6a8'; ctx.beginPath(); ctx.arc(G.bx1+.2,yy,.7,0,TAU); ctx.fill();
      ctx.globalAlpha=pulse*.5; ctx.fillStyle=glow; ctx.beginPath();
      ctx.moveTo(G.bx1,yy-.8); ctx.quadraticCurveTo(G.bx1+2.4+Math.sin(now*11+yy)*.8,yy-2.6,G.bx1+1.2,yy-4.4);
      ctx.quadraticCurveTo(G.bx1+1.4,yy-1.6,G.bx1,yy+.6); ctx.fill();
    }
    ctx.globalAlpha=1;
  } else if(a.motif==='cards'){                 // DEAD MAN'S HAND — aces and eights
    const cx=1.2+G.cl/2, cyy=-2.1;
    ctx.fillStyle=gold; ctx.beginPath(); ctx.arc(cx,cyy,1.3,0,TAU); ctx.fill();
    ctx.fillStyle=C.ink; ctx.beginPath(); ctx.moveTo(cx,cyy-.9); ctx.lineTo(cx+.7,cyy+.2); ctx.lineTo(cx-.7,cyy+.2); ctx.closePath(); ctx.fill();
    ctx.fillRect(cx-.15,cyy,.3,.8);
    for(let i=0;i<2;i++){                        // two cards riding the air around it
      const ang = now*1.6 + i*Math.PI;
      const px = cx+2+Math.cos(ang)*7.5, py = -2.4+Math.sin(ang)*4.2;
      ctx.save(); ctx.translate(px, py); ctx.rotate(Math.sin(ang)*.5+i);
      ctx.globalAlpha=.95; ctx.fillStyle='#f4ead2';
      ctx.beginPath(); rr(-1.3,-1.8,2.6,3.6,.4); ctx.fill(); ctx.strokeStyle=C.ink; ctx.lineWidth=.35; ctx.stroke();
      ctx.fillStyle=i? C.ink : '#9b2a22'; ctx.beginPath(); ctx.arc(0,0,.7,0,TAU); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha=1;
  } else if(a.motif==='vents'){                 // IRON HORSE — heat between barrels
    const hot = P_spinning()? 1 : pulse;
    ctx.globalAlpha=hot; ctx.fillStyle=glow;
    for(let i=0;i<5;i++){ ctx.beginPath(); ctx.ellipse(G.bx0+3+i*3,-2.2,1.1,.55,0,0,TAU); ctx.fill(); }
    ctx.globalAlpha=hot*.8; ctx.fillStyle='#ffd08a';
    for(let i=0;i<5;i++){ ctx.beginPath(); ctx.ellipse(G.bx0+3+i*3,-2.2,.5,.25,0,0,TAU); ctx.fill(); }
    ctx.globalAlpha=1;
  } else if(a.motif==='notch'){                 // WIDOWMAKER — a cold line of sight
    ctx.globalAlpha=.30+Math.sin(now*2.2)*.12; ctx.fillStyle=glow;
    ctx.beginPath(); ctx.moveTo(a.scp+.6,-6.1); ctx.lineTo(a.scp+26,-5.9); ctx.lineTo(a.scp+26,-5.7); ctx.lineTo(a.scp+.6,-5.5); ctx.closePath(); ctx.fill();
    ctx.globalAlpha=pulse; ctx.beginPath(); ctx.arc(a.scp+.4,-5.8,1.0,0,TAU); ctx.fill();
    ctx.globalAlpha=1;
  }
}
