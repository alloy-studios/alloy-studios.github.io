let now = 0, dt = 0, rawDt = 0, hitstop = 0, slowmo = 1;

const PMAX = 1400;
const parts = new Array(PMAX);
for(let i=0;i<PMAX;i++) parts[i] = {a:false};
let pHead = 0;
function spawnP(x,y,vx,vy,life,size,col,type,opt){
  let p=null;
  for(let i=0;i<PMAX;i++){ const q=parts[(pHead+i)%PMAX]; if(!q.a){ p=q; pHead=(pHead+i+1)%PMAX; break; } }
  if(!p) { p = parts[pHead]; pHead=(pHead+1)%PMAX; }
  opt=opt||{};
  p.a=true; p.x=x; p.y=y; p.vx=vx; p.vy=vy; p.life=life; p.max=life;
  p.size=size; p.col=col; p.type=type;
  p.drag = opt.drag==null?0.90:opt.drag;
  p.grav = opt.grav||0;
  p.rot = opt.rot==null?Math.random()*TAU:opt.rot;
  p.vr  = opt.vr==null?(Math.random()-.5)*10:opt.vr;
  p.z   = opt.z||0; p.vz = opt.vz||0;
  return p;
}
function updateParts(d){
  for(let i=0;i<PMAX;i++){ const p=parts[i]; if(!p.a) continue;
    p.life-=d; if(p.life<=0){ p.a=false; continue; }
    p.x+=p.vx*d; p.y+=p.vy*d;
    p.vy+=p.grav*d;
    const f=Math.pow(p.drag,d*60); p.vx*=f; p.vy*=f;
    p.rot+=p.vr*d;
    if(p.vz){ p.z+=p.vz*d; p.vz-=900*d; if(p.z<0){ p.z=0; p.vz*=-0.4; p.vx*=.6; p.vy*=.6; p.vr*=.4; if(Math.abs(p.vz)<30){ p.vz=0; p.vx=p.vy=0; p.vr=0; } } }
  }
}
// A fire mote rebuilt a three-stop radial gradient every frame, hundreds of
// times over during sustained fire. Bake one blob per colour and blit it.
const _fireSpr = Object.create(null);
function getFireSprite(col){
  let s=_fireSpr[col]; if(s) return s;
  const R=32, c=document.createElement('canvas'); c.width=c.height=R*2;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(R,R,0,R,R,R);
  gr.addColorStop(0,'#fff0c0'); gr.addColorStop(.4,col); gr.addColorStop(1,'rgba(158,43,37,0)');
  g.fillStyle=gr; g.fillRect(0,0,R*2,R*2);
  _fireSpr[col]=c; return c;
}
// soft round blobs for dust, smoke and mist: one baked sprite per colour, so a
// cloud of forty puffs is forty blits instead of forty path fills
const _blob = Object.create(null);
function getBlob(col){
  let s=_blob[col]; if(s) return s;
  const R=32, c=document.createElement('canvas'); c.width=c.height=R*2;
  const g=c.getContext('2d'), gr=g.createRadialGradient(R,R,0,R,R,R);
  gr.addColorStop(0,hexA(col,1)); gr.addColorStop(.55,hexA(col,.55)); gr.addColorStop(1,hexA(col,0));
  g.fillStyle=gr; g.fillRect(0,0,R*2,R*2); return _blob[col]=c;
}
function drawParts(){
  const z=cam.z;
  for(let i=0;i<PMAX;i++){ const p=parts[i]; if(!p.a) continue;
    const t=p.life/p.max;
    const sx=w2sx(p.x), sy=w2sy(p.y)-p.z*z;
    if(sx<-60||sy<-60||sx>W+60||sy>H+60) continue;
    switch(p.type){
      case 'dust': { const r=p.size*(2.2-t)*z*1.4; ctx.globalAlpha=t*.42;
        ctx.drawImage(getBlob(p.col), sx-r, sy-r, r*2, r*2); break; }
      case 'smoke': { const r=p.size*(2.6-t*1.5)*z*1.3; ctx.globalAlpha=t*.36;
        ctx.drawImage(getBlob(p.col), sx-r, sy-r, r*2, r*2); break; }
      case 'mist': { const r=p.size*(2-t)*z; ctx.globalAlpha=t*.5;
        ctx.drawImage(getBlob(p.col), sx-r, sy-r, r*2, r*2); break; }
      case 'blood': ctx.globalAlpha=Math.min(1,t*1.6); ctx.fillStyle=p.col;
        ctx.save(); ctx.translate(sx,sy); ctx.rotate(Math.atan2(p.vy,p.vx)); ctx.beginPath();
        ctx.ellipse(0,0,p.size*z*(0.7+Math.min(1,Math.hypot(p.vx,p.vy)/300)),p.size*z*0.5,0,0,TAU); ctx.fill(); ctx.restore(); break;
      case 'spark': ctx.globalAlpha=Math.min(1,t*2); ctx.strokeStyle=p.col;
        ctx.lineWidth=Math.max(1,p.size*z*.5); ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx-p.vx*.018*z,sy-p.vy*.018*z); ctx.stroke(); break;
      case 'ember': ctx.globalAlpha=Math.min(1,t*1.4); ctx.fillStyle=p.col;
        ctx.fillRect(sx-p.size*z*.5,sy-p.size*z*.5,p.size*z,p.size*z);
        if((i&1)===0) addLight(p.x,p.y-p.z,26*p.size,p.col,t*.4); break;
      case 'fire': { ctx.globalAlpha=t*.85;
        const fr=p.size*z*(2-t);
        ctx.save(); ctx.globalCompositeOperation='lighter';
        ctx.drawImage(getFireSprite(p.col), sx-fr, sy-fr*1.25, fr*2, fr*2.2); ctx.restore();
        if((i&3)===0) addLight(p.x,p.y,70*p.size*t,'#ff9a3c',t*.6);
        break; }
      case 'shell': { ctx.globalAlpha=Math.min(1,t*3);
        ctx.save(); ctx.translate(sx,sy); ctx.rotate(p.rot);
        ctx.fillStyle=p.col; ctx.fillRect(-1.7*z,-.65*z,3.4*z,1.3*z);
        ctx.fillStyle='rgba(255,240,190,.8)'; ctx.fillRect(-1.7*z,-.65*z,1*z,1.3*z); ctx.restore();
        if(p.z<=0 && shadowA>.02){ ctx.globalAlpha=.25; ctx.fillStyle=C.ink; ctx.fillRect(sx-1.5*z,sy+.6*z,3*z,.8*z); }
        break; }
      case 'chip': ctx.globalAlpha=Math.min(1,t*2); ctx.fillStyle=p.col;
        ctx.save(); ctx.translate(sx,sy); ctx.rotate(p.rot); ctx.fillRect(-p.size*z*.5,-p.size*z*.3,p.size*z,p.size*z*.6); ctx.restore(); break;
      case 'ring': { ctx.globalAlpha=t*t*.9; ctx.strokeStyle=p.col;
        ctx.lineWidth=Math.max(1,p.size*.35*t*z);
        ctx.beginPath(); ctx.ellipse(sx,sy,(1-t)*p.size*4*z,(1-t)*p.size*4*z*.45,0,0,TAU); ctx.stroke(); break; }
      case 'flash': { ctx.globalAlpha=t*t; ctx.save(); ctx.globalCompositeOperation='lighter';
        ctx.drawImage(getBlob(p.col), sx-p.size*z*t*1.6, sy-p.size*z*t*1.6, p.size*z*t*3.2, p.size*z*t*3.2); ctx.restore();
        addLight(p.x,p.y,p.size*5*t,p.col,t); break; }
      case 'muzzle': { // a tongue of burning gas with petals either side and a white core
        ctx.save(); ctx.translate(sx,sy); ctx.rotate(p.rot); ctx.globalCompositeOperation='lighter';
        const q=t, s=p.size*z*(0.55+(1-q)*.55), L=s*(p.long?2.6:1.8);
        ctx.globalAlpha=Math.min(1,q*1.4); ctx.fillStyle=p.col2||'#ff8a2a';
        ctx.beginPath(); ctx.moveTo(0,-s*.34); ctx.quadraticCurveTo(L*.5,-s*.78,L,0); ctx.quadraticCurveTo(L*.5,s*.78,0,s*.34); ctx.closePath(); ctx.fill();
        ctx.fillStyle='#ffd070'; ctx.beginPath(); ctx.moveTo(0,-s*.22); ctx.quadraticCurveTo(L*.4,-s*.42,L*.8,0); ctx.quadraticCurveTo(L*.4,s*.42,0,s*.22); ctx.closePath(); ctx.fill();
        ctx.fillStyle=p.col2||'#ff9a3c';
        for(const sd of [-1,1]){ ctx.beginPath(); ctx.moveTo(s*.1,0); ctx.quadraticCurveTo(s*.5,sd*s*.95,s*.15,sd*s*1.25); ctx.quadraticCurveTo(-s*.1,sd*s*.45,s*.1,0); ctx.fill(); }
        ctx.fillStyle='#fffaf0'; ctx.beginPath(); ctx.arc(0,0,s*.3,0,TAU); ctx.fill();
        ctx.restore();
        addLight(p.x,p.y,p.size*7*t,C.gold,t); break; }
      case 'hat': { ctx.globalAlpha=Math.min(1,t*4);
        ctx.save(); ctx.translate(sx,sy); ctx.scale(z*p.f,z); ctx.rotate(p.rot); ctx.translate(-1.6,36);
        if(p.fit) drawHat(p.fit); ctx.restore(); break; }
      case 'feather': ctx.globalAlpha=t; ctx.fillStyle=p.col;
        ctx.save(); ctx.translate(sx,sy); ctx.rotate(p.rot); ctx.beginPath(); ctx.ellipse(0,0,p.size*z,p.size*z*.35,0,0,TAU); ctx.fill(); ctx.restore(); break;
      case 'card': { ctx.globalAlpha=Math.min(1,t*3);
        ctx.save(); ctx.translate(sx,sy); ctx.rotate(p.rot); ctx.scale(z,z);
        ctx.fillStyle='#f4ead2'; ctx.beginPath(); rr(-2.6,-3.6,5.2,7.2,.8); ctx.fill(); ctx.strokeStyle=C.ink; ctx.lineWidth=.5; ctx.stroke();
        ctx.fillStyle=(p.seed&1)? C.ink : '#9b2a22'; ctx.beginPath(); ctx.arc(0,0,1.3,0,TAU); ctx.fill(); ctx.restore();
        break; }
      default: ctx.globalAlpha=t; ctx.fillStyle=p.col;
        ctx.fillRect(sx-p.size*z*.5,sy-p.size*z*.5,p.size*z,p.size*z);
    }
  }
  ctx.globalAlpha=1;
}


// ---- decals: the ground keeps the receipts ------------------------------
const decals = []; const DECAL_MAX = 190;
function addDecal(x,y,r,type,rot){
  if(decals.length>=DECAL_MAX) decals.shift();
  decals.push({x:x,y:y,r:r,type:type,rot:rot==null?Math.random()*TAU:rot,life:type==='scorch'?26:40,max:type==='scorch'?26:40,
    seed:(Math.random()*1e9)|0});
}
function drawDecals(){
  const z=cam.z;
  for(let i=0;i<decals.length;i++){
    const d=decals[i]; const t=clamp(d.life/d.max,0,1);
    const sx=w2sx(d.x), sy=w2sy(d.y);
    if(sx<-90||sy<-90||sx>W+90||sy>H+90) continue;
    ctx.save(); ctx.translate(sx,sy); ctx.rotate(d.rot); ctx.scale(z,z);
    const r=mulberry(d.seed);
    if(d.type==='blood'){
      ctx.globalAlpha=t*.55; ctx.fillStyle=C.blood;
      ctx.beginPath(); ctx.ellipse(0,0,d.r,d.r*.62,0,0,TAU); ctx.fill();
      for(let k=0;k<4;k++){ const a=r()*TAU, dd=d.r*(.9+r()*.9);
        ctx.beginPath(); ctx.ellipse(Math.cos(a)*dd,Math.sin(a)*dd*.6,d.r*.28*r(),d.r*.2*r(),a,0,TAU); ctx.fill(); }
    } else if(d.type==='scorch'){
      ctx.globalAlpha=t*.6; ctx.fillStyle=C.ink;
      ctx.beginPath();
      for(let k=0;k<=10;k++){ const a=k/10*TAU, rr2=d.r*(.75+r()*.5);
        if(k===0)ctx.moveTo(Math.cos(a)*rr2,Math.sin(a)*rr2*.6); else ctx.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2*.6); }
      ctx.closePath(); ctx.fill();
    } else { // bullet pock
      ctx.globalAlpha=t*.45; ctx.fillStyle=C.ink;
      ctx.beginPath(); ctx.ellipse(0,0,d.r,d.r*.7,0,0,TAU); ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha=1;
}
function updateDecals(d){
  for(let i=decals.length-1;i>=0;i--){ decals[i].life-=d; if(decals[i].life<=0) decals.splice(i,1); }
}

// ---- additive light buffer (half res) -----------------------------------
// Lights were allocating an object per light per frame, then building three
// colour strings and a fresh radial gradient for each one. Now the records are
// pooled and each colour gets one baked sprite that is simply blitted.
const lights = []; let lightN = 0;
function addLight(x,y,r,col,a){
  if(lightN>=160) return;
  let L=lights[lightN];
  if(L===undefined){ L={x:0,y:0,r:0,c:'',a:0}; lights[lightN]=L; }
  L.x=x; L.y=y; L.r=r; L.c=col; L.a=a; lightN++;
}
const _lightSpr = Object.create(null);
function getLightSprite(col){
  let s=_lightSpr[col]; if(s) return s;
  const R=64, c=document.createElement('canvas'); c.width=c.height=R*2;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(R,R,0,R,R,R);
  gr.addColorStop(0, hexA(col,1)); gr.addColorStop(.45, hexA(col,.35)); gr.addColorStop(1, hexA(col,0));
  g.fillStyle=gr; g.fillRect(0,0,R*2,R*2);
  _lightSpr[col]=c; return c;
}
function renderLights(){
  if(!lcv.width) return;
  lx.setTransform(1,0,0,1,0,0);
  lx.clearRect(0,0,lcv.width,lcv.height);
  if(!lightN) return;
  lx.globalCompositeOperation='lighter';
  for(let i=0;i<lightN;i++){
    const L=lights[i];
    const sx=w2sx(L.x)/2, sy=w2sy(L.y)/2, r=Math.max(2,L.r*cam.z/2);
    if(sx<-r||sy<-r||sx>lcv.width+r||sy>lcv.height+r) continue;
    lx.globalAlpha=clamp(L.a,0,1);
    lx.drawImage(getLightSprite(L.c), sx-r, sy-r, r*2, r*2);
  }
  lx.globalAlpha=1;
  lx.globalCompositeOperation='source-over';
}
function hexA(hex,a){
  if(hex[0]!=='#') return hex;
  const n=parseInt(hex.slice(1),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+clamp(a,0,1).toFixed(3)+')';
}

}

// ==========================================================================
//  BULLETS
// ==========================================================================
const bullets = [];
function fireBullet(o){
  bullets.push({
    x:o.x, y:o.y, px:o.x, py:o.y,
    vx:Math.cos(o.a)*o.spd, vy:Math.sin(o.a)*o.spd,
    a:o.a, spd:o.spd, dmg:o.dmg, own:o.own, life:o.life||1.1,
    pierce:o.pierce||0, ric:o.ric||0, homing:o.homing||0, fire:o.fire||0,
    col:o.col||C.flash, w:o.w||2, rng:o.rng||700, travelled:0,
    tr:[o.x,o.y,o.x,o.y], big:o.big||0, hit:o.hit||null, mark:o.mark||0, card:o.card||0
  });
}
let _pn = [];
// Point-sampling a bullet's path lets fast rounds step straight over a target:
// at 4200px/s the substep is 14px while a man's hit tolerance is ~12. Test the
// whole travelled SEGMENT against the circle instead — exact, and cheaper than
// shrinking the timestep.
// What a bullet can hit on a body: an upright ellipse from boots to hat, as
// [centre y, half width, half height]. Riders sit higher, beasts lower.
function hitBox(e){
  if(e.kind==='horse') return [e.y-20, 20, 14];
  if(e.team==='beast') return e.kind==='deer'? [e.y-18,12,11] : [e.y-10,11,8];
  const sc=figScale(e), lift=(e===P&&P.mounted)?16:0;
  return [e.y-(18*sc+lift), e.r+2, 21*sc];
}
function groundPuff(x,y){
  for(let i=0;i<3;i++) spawnP(x+rnd(-3,3),y+rnd(-2,2),rnd(-30,30),rnd(-26,4),rnd(.5,.9),rnd(2,3.4),'#cdb086','dust',{drag:.9});
  for(let i=0;i<2;i++) spawnP(x,y,rnd(-50,50),rnd(-40,10),.5,1.4,'#9a8466','chip',{drag:.94,vz:rnd(60,120),z:1});
  addDecal(x,y,2.4,'pock');
}
function segCircle(x1,y1,x2,y2,cx,cy,r){
  const dx=x2-x1, dy=y2-y1, L=dx*dx+dy*dy;
  let t = L? ((cx-x1)*dx+(cy-y1)*dy)/L : 0;
  if(t<0)t=0; else if(t>1)t=1;
  const ox=x1+dx*t-cx, oy=y1+dy*t-cy;
  return ox*ox+oy*oy < r*r;
}
function updateBullets(d){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.life-=d; if(b.life<=0){ bullets.splice(i,1); continue; }
    if(b.homing>0){
      const tgt = nearestFoeOf(b.own, b.x, b.y, 460);
      if(tgt){ const want=angTo(b.x,b.y,tgt.x,hitBox(tgt)[0]);
        b.a = angLerp(b.a, want, Math.min(1, b.homing*d));
        b.vx=Math.cos(b.a)*b.spd; b.vy=Math.sin(b.a)*b.spd; }
    }
    // segCircle makes entity/prop hits step-size independent, but the BUILDING
    // test is still a point sample, so keep substeps under the 16px wall thickness.
    const steps = Math.max(1, Math.ceil(b.spd*d/10));
    const sd = d/steps;
    let dead=false;
    for(let s=0;s<steps && !dead;s++){
      b.px=b.x; b.py=b.y;
      b.x+=b.vx*sd; b.y+=b.vy*sd; b.travelled+=b.spd*sd;
      if(b.travelled>b.rng){ dead=true; groundPuff(b.x,b.y+GUN_H); break; }
      if(b.x<0||b.y<0||b.x>WORLD.w||b.y>WORLD.h){ dead=true; break; }
      // entities
      for(let k=0;k<ents.length;k++){
        const e=ents[k];
        if(e.dead||e.hp<=0) continue;
        if(e===b.own) continue;
        if(b.own && b.own.team===e.team) continue;
        if(e.noHit) continue;
        const hb=hitBox(e), hk=hb[1]/hb[2];
        if(segCircle(b.px,hb[0]+(b.py-hb[0])*hk,b.x,hb[0]+(b.y-hb[0])*hk, e.x, hb[0], hb[1])){
          if(b.hits && b.hits.indexOf(e)>=0) continue;   // a piercing round
          damage(e, b.dmg, b.own, b.a, b.fire, b);       // passes through once
          if(b.fire) igniteAt(b.x,b.y,b.fire);
          if(b.pierce>0){ b.pierce--; (b.hits=b.hits||[]).push(e); }
          else { dead=true; }
          break;
        }
      }
      if(dead) break;
      if(b.pierce<=0){
        // props
        propsNear(b.x,b.y+GUN_H,30,_pn);
        for(let k=0;k<_pn.length;k++){
          const p=_pn[k];
          if(!p.solid) continue;
          if(segCircle(b.px,b.py+GUN_H,b.x,b.y+GUN_H, p.x, p.y-p.r*.3, p.r*0.95)){
            impactProp(b,p); dead=true; break;
          }
        }
        if(dead) break;
        for(let k=0;k<BUILDINGS.length;k++){
          const bd=BUILDINGS[k];
          if(rectHit(bd,b.x,b.y+GUN_H,0)){
            impactWall(b); dead=true; break;
          }
        }
      }
    }
    // trail history (flat, tapered ribbon at draw time)
    b.tr.push(b.x,b.y); if(b.tr.length>16) b.tr.splice(0,2);
    if(dead){ bullets.splice(i,1); }
  }
}
function impactProp(b,p){

// ---- tracers: a hot core inside a wide glow, laid down additively ----------
function drawBullets(){
  const z=cam.z;
  ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.lineCap='round';
  let i_=0;
  for(const b of bullets){ i_++;
    const n=b.tr.length/2; if(n<2) continue;
    const hx=w2sx(b.x), hy=w2sy(b.y);
    const k=Math.min(n-1,6), tx=w2sx(b.tr[(n-1-k)*2]), ty=w2sy(b.tr[(n-1-k)*2+1]);
    const col = b.fire? '#ff7a1e' : b.col;
    const w = b.w*(b.big?1.6:1);
    ctx.globalAlpha=bullets.length>40? .14 : .24; ctx.strokeStyle=col; ctx.lineWidth=w*2.6*z;
    ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(hx,hy); ctx.stroke();
    ctx.globalAlpha=.9; ctx.strokeStyle= b.big? '#ffffff' : '#fff1cf'; ctx.lineWidth=Math.max(1,w*.75*z);
    const mx=lerp(tx,hx,.55), my=lerp(ty,hy,.55);
    ctx.beginPath(); ctx.moveTo(mx,my); ctx.lineTo(hx,hy); ctx.stroke();
    ctx.globalAlpha=1; ctx.fillStyle='#fffaf0';
    ctx.beginPath(); ctx.arc(hx,hy,(w*.7+(b.big?2:0))*z,0,TAU); ctx.fill();
    if(b.big || b.fire || (i_&3)===0) addLight(b.x,b.y, (b.fire?80:44)*(b.big?2:1), b.fire?'#ff8a2a':col, b.fire?.5:.26);
    if(b.fire && chance(.5)) spawnP(b.x,b.y,rnd(-20,20),rnd(-40,-10),rnd(.2,.4),rnd(3,5),'#ff7a1e','fire',{drag:.9});
    if(b.card && chance(.25)) spawnP(b.x,b.y,rnd(-30,30),rnd(-30,30),.5,1.2,C.gold,'spark',{drag:.9});
  }
  ctx.restore();
  // Dead Man's Hand rounds carry their card with them
  for(const b of bullets){ if(!b.card) continue;
    const sx=w2sx(b.x), sy=w2sy(b.y);
    ctx.save(); ctx.translate(sx,sy); ctx.rotate(now*14+b.x*.01); ctx.scale(z,z);
    ctx.fillStyle='#f4ead2'; ctx.beginPath(); rr(-2.4,-3.3,4.8,6.6,.7); ctx.fill(); ctx.strokeStyle=C.ink; ctx.lineWidth=.5; ctx.stroke();
    ctx.fillStyle=((b.x|0)&1)? C.ink : '#9b2a22'; ctx.beginPath(); ctx.arc(0,0,1.2,0,TAU); ctx.fill(); ctx.restore();
  }
}

// ---- straight beams: rail shots, the widow's line --------------------------
const beams = [];
function addBeam(x1,y1,x2,y2,col,w,life){ beams.push({x1,y1,x2,y2,col,w,life,max:life}); }
function drawBeams(){
  if(!beams.length) return;
  const z=cam.z;
  ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.lineCap='round';
  for(let i=beams.length-1;i>=0;i--){ const b=beams[i]; b.life-=rawDt; if(b.life<=0){ beams.splice(i,1); continue; }
    const t=b.life/b.max, x1=w2sx(b.x1), y1=w2sy(b.y1), x2=w2sx(b.x2), y2=w2sy(b.y2);
    ctx.globalAlpha=t*.35; ctx.strokeStyle=b.col; ctx.lineWidth=b.w*3.2*z*(0.6+t*.4);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.globalAlpha=t*.8; ctx.lineWidth=b.w*1.2*z*t; ctx.stroke();
    ctx.globalAlpha=t; ctx.strokeStyle='#ffffff'; ctx.lineWidth=Math.max(1,b.w*.4*z*t); ctx.stroke();
  }
  ctx.restore(); ctx.globalAlpha=1;
}

// ---- factions -----------------------------------------------------------
function hostile(a,b){
  if(!a||!b) return false;
  if(a.team===b.team) return false;
  if(a.team==='beast'||b.team==='beast'){
    const beast = a.team==='beast'?a:b, other = a.team==='beast'?b:a;
    return beast.kind==='coyote' && other.team!=='beast';
  }
  const t=[a.team,b.team];
  if(t.indexOf('law')>=0 && t.indexOf('outlaw')>=0) return true;
  if(t.indexOf('player')>=0){
    const o = a.team==='player'?b:a;
    if(o.team==='outlaw') return P.side!=='outlaw' ? true : (o.renegade||false);
    if(o.team==='law')   return P.side==='outlaw' ? true : (P.wanted>0);
    if(o.team==='civ')   return false;
  }
  if(t.indexOf('civ')>=0) return false;
  return false;
}
function nearestFoeOf(own,x,y,rad){
  if(!own) return null;
  let b=null,bd=rad*rad;
  for(const e of ents){ if(e.dead||e.hp<=0||e===own||e.noHit) continue;
    if(!hostile(own,e)) continue;
    const d=dist2(x,y,e.x,e.y); if(d<bd){bd=d;b=e;} }
  return b;
}

// ---- movement & collision ----------------------------------------------
let _mn=[];
function moveEnt(e,dx,dy){
  // Movement is eight-way and bridges are not: pushing into a deck's edge
  // steers you along the deck instead of stopping you at the rail.
  if((dx||dy) && e.y<INDOORS_Y){ const b=bridgeAt(e.x,e.y);
    if(b && inRiver(e.x+dx,e.y+dy) && !nearBridge(e.x+dx,e.y+dy)){
      const c=Math.cos(b.a), s=Math.sin(b.a), along=dx*c+dy*s, L=Math.hypot(dx,dy);
      if(Math.abs(along)>L*.2){ const sg=along>0?1:-1; dx=c*L*sg*.92; dy=s*L*sg*.92; } } }
  if(dx) { e.x+=dx; resolveX(e,dx); }
  if(dy) { e.y+=dy; resolveY(e,dy); }
  e.x=clamp(e.x,12,WORLD.w-12); e.y=clamp(e.y,12,WORLD.h-12);
}
function resolveX(e,dx){
  if(e===P && window.DBG && DBG.noclip) return;
  propsNear(e.x,e.y,44,_mn);
  for(const p of _mn){ if(!p.r||!p.solid) continue;
    const rr2=p.r*.8+e.r;
    if(dist2(e.x,e.y,p.x,p.y)<rr2*rr2){ e.x = p.x + (dx>0?-rr2:rr2); }
  }
  for(const b of BUILDINGS){ if(rectHit(b,e.x,e.y,e.r)){
    e.x = b.x + (dx>0? -(b.w/2+e.r) : (b.w/2+e.r)); } }
  for(const b of WALLS){ if(rectHit(b,e.x,e.y,e.r)){
    e.x = b.x + (dx>0? -(b.w/2+e.r) : (b.w/2+e.r)); } }
  if(e.y<INDOORS_Y && inRiver(e.x,e.y) && !nearBridge(e.x,e.y)) e.x -= dx;
}
function resolveY(e,dy){
  if(e===P && window.DBG && DBG.noclip) return;
  propsNear(e.x,e.y,44,_mn);
  for(const p of _mn){ if(!p.r||!p.solid) continue;
    const rr2=p.r*.8+e.r;
    if(dist2(e.x,e.y,p.x,p.y)<rr2*rr2){ e.y = p.y + (dy>0?-rr2:rr2); }
  }
  for(const b of BUILDINGS){ if(rectHit(b,e.x,e.y,e.r)){
    e.y = b.y + (dy>0? -(b.h/2+e.r) : (b.h/2+e.r)); } }
  for(const b of WALLS){ if(rectHit(b,e.x,e.y,e.r)){
    e.y = b.y + (dy>0? -(b.h/2+e.r) : (b.h/2+e.r)); } }
  if(e.y<INDOORS_Y && inRiver(e.x,e.y) && !nearBridge(e.x,e.y)) e.y -= dy;
}
// Line of sight is stable over a few frames; re-testing it every frame for every
// hostile was ~30k rect tests/frame. Cache per entity for ~0.15s.
function losCached(e,x1,y1,x2,y2){
  e._losT=(e._losT||0)-dt;
  if(e._losT<=0){ e._los=losClear(x1,y1,x2,y2); e._losT=0.12+Math.random()*0.09; }
  return e._los;
}
function losClear(x1,y1,x2,y2){
  const d=dist(x1,y1,x2,y2); if(d<1) return true;
  const steps=Math.min(26, Math.ceil(d/34));
  for(let i=1;i<steps;i++){
    const t=i/steps, x=lerp(x1,x2,t), y=lerp(y1,y2,t);
    for(const b of BUILDINGS) if(rectHit(b,x,y,0)) return false;
    for(const b of WALLS) if(rectHit(b,x,y,0)) return false;
  }
  return true;
}

// ---- damage -------------------------------------------------------------
function damage(e, amt, from, ang, fire, bullet){
  if(e.dead||e.hp<=0) return;
  if(e===P && P.iframe>0) return;
  if(e===P && window.DBG && DBG.god) return;
  let dmg = amt;
  if(e===P && P.perks.nerve) dmg*=0.82;
  if(e.markT>0) dmg*=2;
  const wasAlive = e.hp>0;
  e.hp -= dmg;
  e.hitT = 0.14; e.flash = 1;
  if(fire) e.burn = Math.max(e.burn, 2.6);
  const a = ang==null? (from? angTo(from.x,from.y,e.x,e.y) : 0) : ang;
  const kn = clamp(dmg*0.9, 8, 50)*(e.boss?0.35:1);
  e.kx = (e.kx||0) + Math.cos(a)*kn*3; e.ky = (e.ky||0) + Math.sin(a)*kn*3;

  // blood + mist
  const hb=hitBox(e);
  for(let i=0;i<Math.min(14,4+dmg*0.28);i++){
    const sa=a+rnd(-.7,.7);
    spawnP(e.x+Math.cos(a)*5, hb[0]+Math.sin(a)*4, Math.cos(sa)*rnd(60,280), Math.sin(sa)*rnd(60,280)-40,
      rnd(.3,.65), rnd(1.2,2.8), C.blood,'blood',{grav:420,drag:.9});
  }
  spawnP(e.x+Math.cos(a)*6, hb[0], Math.cos(a)*30, Math.sin(a)*20, .5, 5, '#a03020', 'mist', {drag:.9});
  spawnP(e.x,hb[0],0,0,.1,7,C.flash,'flash');
  if(chance(.5)) addDecal(e.x,e.y+rnd(-5,5),rnd(7,14),'blood');

  if(e===P){
    addTrauma(clamp(dmg/40,.12,.5)); hitstop=Math.max(hitstop,.05);
    sfx('hit',{vol:.9});
  } else {
    sfxAt('hit',e.x,e.y,{vol:.6});
  }

  if(from===P){
    P.awaken = Math.min(P.awakenMax, P.awaken + dmg*(P.perks.iron?0.34:0.21));
    addFloat(e.x+rnd(-6,6), hb[0]-hb[2]-6, Math.round(dmg)+'', e.markT>0?C.gold:C.bone, e.markT>0?15:12);
  }

  if(e.hp<=0 && wasAlive) kill(e, from);
  else if(e.team!=='player'){
    e.target = from; e.alert = 1; e.state='combat'; e.stT=0;
    alertNear(e, 260, from);
  }
}
function alertNear(e,rad,from){
  for(const o of ents){ if(o===e||o.dead||o.hp<=0) continue;
    if(o.team!==e.team) continue;
    if(dist2(o.x,o.y,e.x,e.y)<rad*rad && o.state!=='combat'){
      o.target=from; o.state='combat'; o.alert=1; o.stT=rnd(0,.35);
    }
  }
}
function kill(e, from){
  e.dead=true; e.dieT=0; e.hp=0; e.noHit=true;
  e.deathAng = from? angTo(from.x,from.y,e.x,e.y) : rnd(TAU);
  const hb=hitBox(e), fall=Math.cos(e.deathAng)>=0?1:-1;
  for(let i=0;i<18;i++){
    const sa=e.deathAng+rnd(-1.1,1.1);
    spawnP(e.x,hb[0],Math.cos(sa)*rnd(70,340),Math.sin(sa)*rnd(70,340)-60,
      rnd(.4,.9),rnd(1.6,3.4),C.blood,'blood',{grav:460,drag:.9});
  }
  addDecal(e.x+(e.kind==='horse'||e.team==='beast'?0:fall*16), e.y+2, rnd(12,20),'blood');
  // the hat goes on without him
  if(e.team!=='beast' && e.kind!=='horse'){ const o=figFit(e);
    if(o.hatK!=='none' && !e.hatOff){ e.hatOff=true;
      const hp=spawnP(e.x, e.y+1, fall*rnd(40,90), rnd(-10,20), 7, 1, '#000', 'hat',
        {z:36*figScale(e), vz:rnd(130,190), vr:rnd(6,10)*fall, rot:0, drag:.97});
      hp.fit=o; hp.f=e.fc||1; } }
  addTrauma(e.boss?.5:.14);
  if(from===P){
    hitstop=Math.max(hitstop, e.boss?.14:.07);
    P.kills++;
    const xp = e.boss?160:(e.team==='beast'?8:26);
    gainXP(xp);
    P.awaken=Math.min(P.awakenMax,P.awaken+(e.boss?28:9)*(P.perks.iron?1.6:1));
    const coin = Math.round(e.loot*(P.perks.scav?1.5:1));
    if(coin>0){ P.money+=coin; addFloat(e.x,e.y-26,'$'+coin,C.gold,14); sfxAt('coin',e.x,e.y,{vol:.4}); }
    onKill(e);
  }
  sfxAt('boom',e.x,e.y,{vol:.25});
}

function explode(x,y,rad,dmg,owner){

  for(let i=0;i<20;i++){ const a=rnd(TAU), s=rnd(40,240);

  for(let i=0;i<14;i++){ const a=rnd(TAU), s=rnd(140,460);

}

//  AI
// ==========================================================================
function aiShoot(e, tx, ty, d){
  const g = GUNS[e.gun]; if(!g) return;
  if(e.reloadT>0){ e.reloadT-=d; if(e.reloadT<=0){ e.magN=g.mag; } return; }
  if(e.magN<=0){ e.reloadT = g.rl*(e.boss?0.7:1.15); sfxAt('reload',e.x,e.y,{vol:.35}); shedEmpties(e,g); return; }
  e.fireT-=d; if(e.fireT>0) return;
  const dd = dist(e.x,e.y,tx,ty);
  if(dd > g.rng*0.95) return;
  if(!losCached(e,e.x,e.y,tx,ty)) return;
  e.fireT = 1/(g.rof*(e.boss?1.05:0.50));
  e.magN--;
  const acc = e.boss? 0.75 : 2.0;
  const base = angTo(e.x,aimFrom(e),tx,ty-FIG_SH+3);
  const mz=muzzleAt(e,base);
  for(let i=0;i<g.pel;i++){
    fireBullet({ x:mz[0], y:mz[1],
      a: base + rnd(-1,1)*g.spr*acc + rnd(-.05,.05),

}
// ---- the shot leaving the gun ---------------------------------------------
function muzzle(e, a, g){
  const m=muzzleAt(e,a), mx=m[0], my=m[1];
  const big = g.cls==='shotgun'? 1.45 : (g.cls==='rifle'? 1.15 : 1);
  const leg = g.rar===3 && g.art && g.art.glow;
  const p=spawnP(mx,my,0,0,.075, 12*big, C.flash,'muzzle',{rot:a,vr:0,drag:1});
  p.long = g.cls==='rifle'; p.col2 = leg? g.art.glow : null;
  for(let i=0;i<(g.cls==='shotgun'?12:5);i++){
    const sa=a+rnd(-.45,.45)*(g.cls==='shotgun'?1.3:1);
    spawnP(mx,my,Math.cos(sa)*rnd(160,520),Math.sin(sa)*rnd(160,520),rnd(.08,.22),rnd(1,2.2),
      pick([C.flash,'#ffd070','#ff9a3c']),'spark',{drag:.86});
  }
  for(let i=0;i<(g.cls==='shotgun'?4:2);i++){ const sa=a+rnd(-.3,.3);
    spawnP(mx+Math.cos(a)*4,my+Math.sin(a)*4,Math.cos(sa)*rnd(30,90),Math.sin(sa)*rnd(30,90)-10,rnd(.7,1.3),rnd(3,5)*big,'#d8cfc0','smoke',{drag:.93}); }
  // levers and bolts throw brass every shot; wheelguns keep theirs till reload
  if(g.cls==='rifle'||g.cls==='repeater'){
    const f=Math.cos(a)>=0?1:-1;
    spawnP(e.x+f*2,e.y-2,-f*rnd(30,70),rnd(-14,20),rnd(2.6,3.4),1,'#d9a441','shell',{drag:.97,vz:rnd(110,160),z:20,vr:rnd(-20,20)});
  }
  // one flash of light per burst, not per round: sustained fire used to white the screen out
  if(now-(e._mzL||-9)>0.05){ e._mzL=now; addLight(mx,my, g.cls==='shotgun'?200:140, leg? g.art.glow : C.flash, .85); }
  e.rec = Math.min(1.25, (e.rec||0) + g.rec*.55);
}
// wheelguns and break-actions shed their empties when you reload
function shedEmpties(e, g){
  const n = g.cls==='revolver'? Math.min(g.mag,8) : g.cls==='shotgun'? Math.min(g.mag,2) : 0;

function updateAI(e,d){
  if(e.stun>0){ e.stun-=d; return; }
  const pl = P;
  // burn damage over time
  if(e.burn>0){ e.burn-=d;
    e.hp-=14*d; if(chance(d*14)) spawnP(e.x+rnd(-6,6),e.y-rnd(0,16),rnd(-20,20),rnd(-60,-20),.5,4,'#ff8a2a','fire');
    if(e.hp<=0){ kill(e, P); return; } }
  if(e.markT>0) e.markT-=d;

  const dp = dist(e.x,e.y,pl.x,pl.y);
  const host = hostile(e,pl);

  // notice the player
  if(host && e.state!=='combat'){
    const sight = e.boss?720:520;
    if(dp<sight && losCached(e,e.x,e.y,pl.x,pl.y)){
      e.seen += d*(dp<230?3.6:1.7);
      if(e.seen>1){ e.state='combat'; e.target=pl; e.alert=1; alertNear(e,300,pl);
        if(e.team==='law'&&P.wanted>0) toastOnce('lawSpot','THE LAW HAS SEEN YOU','Lose them, or fight.',C.law); }
    } else e.seen=Math.max(0,e.seen-d);
  }
  if(e.target && (e.target.dead||e.target.hp<=0)) { e.target=null; e.state='wander'; }
  if(e.state==='combat' && !e.target) e.target = host? pl : null;
  if(e.state==='combat' && e.target && !hostile(e,e.target)) { e.target=null; e.state='wander'; }

  switch(e.state){
    case 'idle':
      e.stT-=d;
      if(e.stT<=0){ e.state='wander'; e.stT=rnd(2,6);
        const a=rnd(TAU), rr2=rnd(40,150);
        e.tx=clamp(e.home[0]+Math.cos(a)*rr2,20,WORLD.w-20);
        e.ty=clamp(e.home[1]+Math.sin(a)*rr2,20,WORLD.h-20); }
      break;
    case 'wander': {
      const dd=dist(e.x,e.y,e.tx,e.ty);
      if(dd<14||e.stT<=0){ e.state='idle'; e.stT=rnd(1.5,5); break; }
      e.stT-=d;
      const a=angTo(e.x,e.y,e.tx,e.ty);
      moveEnt(e, Math.cos(a)*e.spd*.55*d, Math.sin(a)*e.spd*.55*d);
      e.aim=angLerp(e.aim,a,d*7);
      break;
    }
    case 'flee': {
      e.stT-=d; if(e.stT<=0){ e.state='wander'; e.stT=rnd(2,5); break; }
      const a = angTo(pl.x,pl.y,e.x,e.y)+rnd(-.2,.2);
      moveEnt(e, Math.cos(a)*e.spd*1.5*d, Math.sin(a)*e.spd*1.5*d);
      e.aim=a;
      break;
    }
    case 'combat': {
      const t=e.target; if(!t){ e.state='wander'; break; }
      const dd=dist(e.x,e.y,t.x,t.y);
      e.aim = angLerp(e.aim, angTo(e.x,e.y,t.x,t.y), d*6);
      if(e.kind==='coyote'){
        // beast: rush and bite
        const a=angTo(e.x,e.y,t.x,t.y);
        moveEnt(e,Math.cos(a)*e.spd*1.5*d, Math.sin(a)*e.spd*1.5*d);
        e.fireT-=d;
        if(dd<e.r+t.r+8 && e.fireT<=0){ e.fireT=.9; damage(t,11,e,a);
          for(let i=0;i<5;i++) spawnP(t.x,t.y-8,rnd(-100,100),rnd(-120,20),.3,2,C.blood,'blood',{grav:300}); }
        break;
      }
      const g=GUNS[e.gun];
      const want = g? (g.cls==='shotgun'?150: g.cls==='rifle'?520: 260) : 40;
      const a=angTo(e.x,e.y,t.x,t.y);
      let mvx=0,mvy=0;
      if(dd>want*1.2) { mvx=Math.cos(a); mvy=Math.sin(a); }
      else if(dd<want*0.6){ mvx=-Math.cos(a); mvy=-Math.sin(a); }
      // strafe
      e.stT-=d; if(e.stT<=0){ e.strafe = chance(.5)?1:-1; e.stT=rnd(.8,2.2); }
      mvx += -Math.sin(a)*(e.strafe||1)*.85; mvy += Math.cos(a)*(e.strafe||1)*.85;
      const ml=Math.hypot(mvx,mvy)||1;
      const sp = e.spd*(e.boss?1.15:.95);
      moveEnt(e, mvx/ml*sp*d, mvy/ml*sp*d);
      aiShoot(e, t.x + t.vx*0.12, t.y + t.vy*0.12, d);
      break;
    }
  }
}

let FLASH=0, FLASHC='#fff4dc';
const _mixC=new Map();
function mixTo(c,t,to){
  if(c.charCodeAt(0)!==35) return c;
  const q=Math.round(clamp(t,0,1)*16), k=c+to+q; let v=_mixC.get(k); if(v) return v;
  const a=parseInt(c.slice(1),16), b=parseInt(to.slice(1),16), u=q/16;
  const r=Math.round(lerp((a>>16)&255,(b>>16)&255,u)), g=Math.round(lerp((a>>8)&255,(b>>8)&255,u)), bb=Math.round(lerp(a&255,b&255,u));
  v='rgb('+r+','+g+','+bb+')'; _mixC.set(k,v); return v;
}
function FF(c){ ctx.fillStyle = FLASH>.03? mixTo(c,FLASH,FLASHC) : c; ctx.fill(); }
function OO(w){ ctx.lineWidth=w||.8; ctx.strokeStyle=OUTL; ctx.stroke(); }
function capL(x1,y1,x2,y2,w,c){

}

    ctx.quadraticCurveTo(4.6,-33.6,1.8,-33.4); ctx.quadraticCurveTo(-1.2,-33,-1.6,-27.8); ctx.closePath(); FF(o.hat); OO(.7);

    ctx.strokeStyle=o.band; ctx.lineWidth=.8; ctx.beginPath(); ctx.moveTo(-1.4,-28); ctx.lineTo(2.6,-25.8); ctx.stroke(); return;
  }
  const wide = k==='flat'? 11.4 : 9.4;
  ctx.beginPath(); ctx.ellipse(1.6,-34.2,wide,2.7,-.05,0,TAU); FF(o.hat); OO(.8);

  ctx.beginPath(); ctx.moveTo(-2.9,-34.8); ctx.lineTo(-2.5,-39.4); ctx.quadraticCurveTo(-1.2,-41.6,1.7,-40.3);
  ctx.quadraticCurveTo(4.6,-41.6,5.8,-39.3); ctx.lineTo(6.1,-34.8); ctx.closePath(); FF(o.hat); OO(.8);
  ctx.fillStyle=o.band; ctx.fillRect(-2.8,-36.5,8.8,1.6);
  ctx.fillStyle=o.hatT; ctx.fillRect(-2.1,-39.2,1.3,2.5);
  ctx.strokeStyle='rgba(20,12,12,.45)'; ctx.lineWidth=.5; ctx.beginPath(); ctx.moveTo(-.4,-40.2); ctx.lineTo(3.8,-40.3); ctx.stroke();
}

// ---- a person --------------------------------------------------------------
// seatX/seatY: when riding, the world point the hips sit on.
function drawHuman(e, seatX, seatY){
  const seated = seatX!=null;
  const sc=figScale(e), o=figFit(e);
  const ca=Math.cos(e.aim); if(ca>.15) e.fc=1; else if(ca<-.15) e.fc=-1; else if(!e.fc) e.fc=1;
  const f=e.fc;
  const x = seated? seatX : e.x, y = seated? seatY+13*sc : e.y;
  if(PASS===1){ figShadow(e, seated?e.x:x, seated?e.y:y, sc, f, seated? 16 : 0); return; }
  const z=cam.z, sx=w2sx(x), sy=w2sy(y);
  if(sx<-80||sx>W+80||sy<-120||sy>H+60) return;
  const spd=seated? 0 : Math.hypot(e.vx,e.vy);
  const walk=clamp(spd/95,0,1), run=clamp((spd-170)/120,0,1);
  if(!e.dead) e.ph=(e.ph||0)+spd*dt*(0.105-run*0.025);
  const ph=e.ph||0;
  const g=entGun(e);
  const armed = !!g && (e===P || e.state==='combat' || e.boss);
  const reloading = e===P? P.reloadT>0 : e.reloadT>0;
  e.rec = Math.max(0,(e.rec||0)-dt*5);

  let la = f>0? e.aim : Math.PI-e.aim; la=Math.atan2(Math.sin(la),Math.cos(la));
  // idle breathing and an easy stance when nobody is shooting
  if(!armed && g) la = 1.05;
  if(reloading && g){ la = g.cls==='revolver'? -1.1 + Math.sin(now*9)*.08 : 0.55; }
  const rec=e.rec;
  const la2 = la - rec*(g&&g.cls==='revolver'? .6 : .3);
  const cx=Math.cos(la2), cy=Math.sin(la2), back=rec*3.2;

  FLASH = e.flash>0? e.flash : 0; FLASHC='#fff4dc';
  if(e.burn>0 && FLASH<.35){ FLASH=.28+Math.sin(now*22)*.1; FLASHC='#ff7a1e'; }
  if(SILH){ FLASH=SILH.t; FLASHC=SILH.c; }

  ctx.save(); ctx.translate(sx,sy); ctx.scale(z*sc*f, z*sc);
  if(e.dead){
    const t=clamp(e.dieT/0.55,0,1), tt = t<.75? (t/.75)*(t/.75) : 1-0.07*Math.sin((t-.75)/.25*Math.PI);
    const dir=Math.cos(e.deathAng||0)>=0? 1 : -1;
    ctx.globalAlpha=clamp(1-(e.dieT-28)/6,0,1);
    ctx.translate(-dir*f*tt*2,0); ctx.rotate(dir*f*tt*Math.PI/2*0.94);
  }
  if(e===P && P.rollT>0){
    const p=1-P.rollT/0.34, d=Math.cos(P.rollA)>=0?1:-1;
    ctx.translate(0,-12); ctx.rotate(d*f*p*TAU); ctx.scale(.94,.84); ctx.translate(0,12);
  }
  const bob = seated? Math.sin(now*14)*.8*clamp((P&&P.mounted)? Math.hypot(P.mounted.vx,P.mounted.vy)/200 : .5,0,1)
                    : -Math.abs(Math.sin(ph))*(1.3+run*1.2)*walk;
  ctx.translate(0,bob);

  // ---- legs (or a skirt, or a rider's leg down the horse's flank)
  const sw=Math.sin(ph)*(0.55+run*0.25)*walk;
  const a1= walk>.05? sw : .13, a2= walk>.05? -sw : -.09;
  const l1=Math.max(0,Math.cos(ph))*(2.4+run*2)*walk, l2=Math.max(0,-Math.cos(ph))*(2.4+run*2)*walk;
  function leg(hx,a,lift,dark){
    const hy=-13, fx=hx+Math.sin(a)*12.6, fy=hy+Math.cos(a)*12.6-lift;
    const kx=(hx+fx)/2+1.2+lift*.6, ky=(hy+fy)/2;
    const pc = dark? shade(o.pants,-.08) : o.pants;
    capL(hx,hy,kx,ky,4.8,pc); capL(kx,ky,fx,fy-1.4,4.1,pc);
    ctx.beginPath(); ctx.moveTo(fx-2.4,fy-3.6); ctx.lineTo(fx+1.6,fy-3.4); ctx.quadraticCurveTo(fx+4.8,fy-1.8,fx+4.8,fy);
    ctx.lineTo(fx-2.7,fy); ctx.closePath(); FF(dark? shade(o.boots,-.06) : o.boots); OO(.7);
  }
  const S1=[1.9,-23.6], S2=[-1.3,-23.9];
  const lean = seated? 0 : (-rec*.09 + run*.14 + (armed? clamp(Math.sin(la2),-1,1)*.04 : 0)
             - (e.hitT>0? e.hitT*1.4 : 0) + (e.stun>0? Math.sin(now*9)*.12 : 0));
  const breathe = 1+Math.sin(now*2.2+(e.seed&15))*.012;

  function hangArm(sx0,sy0,phase,dark){
    const s=Math.sin(ph+phase)*.55*walk;
    const hx=sx0+Math.sin(s)*10.5, hy=sy0+Math.cos(s)*10.5;
    const c = dark? shade(o.sleeve,-.1) : o.sleeve;
    capL(sx0,sy0,(sx0+hx)/2-.6,(sy0+hy)/2,3.6,c); capL((sx0+hx)/2-.6,(sy0+hy)/2,hx,hy,3.2,c);
    ctx.beginPath(); ctx.arc(hx,hy+.6,1.8,0,TAU); FF(o.skin); OO(.6);
  }
  const G = g? gunGeo(g) : null, gs = g? (g.rar===3? 1.15 : 1) : 1;
  const longGun = g && g.cls!=='revolver';
  const offArmOnGun = armed && (longGun || (e===P && (P.abMode==='fan' || reloading)));
  function upper(){ ctx.translate(0,-13); ctx.rotate(lean); ctx.scale(1,breathe); ctx.translate(0,13); }

  ctx.save(); upper(); if(!offArmOnGun) hangArm(S2[0],S2[1],Math.PI,true); ctx.restore();
  if(!seated && !o.dress) leg(-.9,a2,l2,true);
  ctx.save(); upper();
  if(o.duster && !seated){
    const tail=clamp(-(e.vx*f)/150,-1,1)*3.6 + Math.sin(ph*.5)*walk*.8;
    ctx.beginPath(); ctx.moveTo(-4.4,-25); ctx.quadraticCurveTo(-6.6,-15,-7.8+tail,-5.2);
    ctx.lineTo(-2+tail*.5,-4.4); ctx.lineTo(3.6,-5.8); ctx.quadraticCurveTo(5.4,-15,4.4,-24.6); ctx.closePath();
    FF(shade(o.coat,-.07)); OO(.8);
  }
  ctx.restore();
  if(seated){
    capL(.8,-13,6,-11.4,4.8,o.pants); capL(6,-11.4,5.2,-2.4,4.1,o.pants);
    ctx.beginPath(); ctx.moveTo(3,-3.6); ctx.lineTo(7,-3.4); ctx.quadraticCurveTo(9.6,-1.8,9.6,0); ctx.lineTo(2.8,0); ctx.closePath(); FF(o.boots); OO(.7);
  } else if(o.dress){
    const sway=Math.sin(ph)*1.4*walk;
    ctx.beginPath(); ctx.moveTo(-4.4,-15); ctx.quadraticCurveTo(-6.6+sway,-7,-7.4+sway,-1.4); ctx.quadraticCurveTo(0,.4,7.4+sway,-1.4);
    ctx.quadraticCurveTo(6.6+sway,-7,4.4,-15); ctx.closePath(); FF(o.dress); OO(.9);
    ctx.fillStyle='rgba(0,0,0,.12)'; ctx.fillRect(1.5+sway*.5,-12,2.2,10);
    ctx.fillStyle=o.boots; ctx.beginPath(); ctx.ellipse(-1.6+sw*3,-.6,2.2,1,0,0,TAU); ctx.fill(); ctx.beginPath(); ctx.ellipse(2.6-sw*3,-.6,2.4,1,0,0,TAU); ctx.fill();
  } else leg(.9,a1,l1,false);

  ctx.save(); upper();
  // ---- the gun arm, a closure so it can pass behind or in front of the body
  function gunArm(){
    if(!g || (!armed && !longGun && !reloading)){ hangArm(S1[0],S1[1],0,false); return; }
    if(longGun){
      const gx=S1[0]+cx*(7.6-back), gy=S1[1]+cy*(7.6-back);
      const fu=G.fore[0]*gs, fv=G.fore[1]*gs;
      const fx=gx+cx*fu-cy*fv, fy=gy+cy*fu+cx*fv;
      const bc=shade(o.sleeve,-.08);
      if(offArmOnGun){ capL(S2[0],S2[1],(S2[0]+fx)/2,(S2[1]+fy)/2+1.4,3.4,bc); capL((S2[0]+fx)/2,(S2[1]+fy)/2+1.4,fx,fy,3.1,bc); }
      ctx.save(); ctx.translate(gx,gy); ctx.rotate(la2); drawGunArt(g, gs); ctx.restore();
      if(offArmOnGun){ ctx.beginPath(); ctx.arc(fx,fy-.3,1.8,0,TAU); FF(o.skin); OO(.55); }
      capL(S1[0],S1[1],gx-cx*1.5,gy-cy*1.5+1.8,3.6,o.sleeve);
      ctx.beginPath(); ctx.arc(gx,gy+.6,1.9,0,TAU); FF(o.skin); OO(.55);
    } else {
      const hx=S1[0]+cx*(11.8-back), hy=S1[1]+cy*(11.8-back);
      const ex=S1[0]+cx*5.6-cy*.8, ey=S1[1]+cy*5.6+cx*.8+.6;
      capL(S1[0],S1[1],ex,ey,3.7,o.sleeve); capL(ex,ey,hx,hy,3.3,o.sleeve);
      ctx.beginPath(); ctx.moveTo(hx-cx*2.2-cy*1.8,hy-cy*2.2+cx*1.8); ctx.lineTo(hx-cx*2.2+cy*1.8,hy-cy*2.2-cx*1.8);
      ctx.lineWidth=1.1; ctx.strokeStyle=o.shirt; ctx.stroke();
      ctx.save(); ctx.translate(hx,hy); ctx.rotate(la2); drawGunArt(g, gs); ctx.restore();
      ctx.beginPath(); ctx.arc(hx,hy,1.95,0,TAU); FF(o.skin); OO(.55);
      if(offArmOnGun){                       // fanning the hammer, or thumbing rounds in
        const k = P.abMode==='fan'? Math.sin(now*42) : Math.sin(now*7);
        const tx=hx-cx*(2.6+k*1.2)-cy*(-4.8), ty=hy-cy*(2.6+k*1.2)+cx*(-4.8);
        const bc=shade(o.sleeve,-.08);
        capL(S2[0],S2[1],(S2[0]+tx)/2,(S2[1]+ty)/2+1.2,3.4,bc); capL((S2[0]+tx)/2,(S2[1]+ty)/2+1.2,tx,ty,3.1,bc);
        ctx.beginPath(); ctx.arc(tx,ty,1.8,0,TAU); FF(o.skin); OO(.55);
      }
    }
  }
  const behind = armed && Math.sin(la2) < -.62;
  if(behind) gunArm();

  // ---- torso
  ctx.beginPath(); rr(-4.5,-25.8,9,14.4,3.2); FF(o.shirt); OO(.9);
  if(o.vest){ ctx.beginPath(); ctx.moveTo(-4.5,-24.6); ctx.lineTo(2.2,-25.4); ctx.lineTo(3,-18); ctx.lineTo(2.2,-12);
    ctx.lineTo(-4.5,-12); ctx.closePath(); FF(o.vest); OO(.6); }
  if(o.dress){ ctx.beginPath(); rr(-4.5,-25.4,9,11.4,3); FF(o.dress); OO(.7); }
  if(o.apron){ ctx.beginPath(); rr(-.6,-21,5.4,o.dress?19.6:16,1.4); FF(o.apron); OO(.55); }
  if(o.coat && !o.duster && !o.poncho){ ctx.beginPath(); ctx.moveTo(-4.7,-25.4); ctx.lineTo(1.4,-25.8); ctx.lineTo(.6,-9.4); ctx.lineTo(-5.4,-9.2); ctx.closePath(); FF(o.coat); OO(.6); }
  ctx.globalAlpha*=.5; ctx.fillStyle=mixTo(o.vest||o.shirt,.45,'#fff0d0');
  ctx.fillRect(f>0? -4.3 : 3.3,-24,1,11); ctx.globalAlpha=e.dead? clamp(1-(e.dieT-28)/6,0,1) : 1;
  if(o.star){ ctx.fillStyle='#e8b93a'; ctx.beginPath();
    for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, r2=i%2?.8:1.9; ctx.lineTo(.2+Math.cos(a)*r2,-20.4+Math.sin(a)*r2); }
    ctx.closePath(); ctx.fill(); ctx.strokeStyle='#6a4a14'; ctx.lineWidth=.3; ctx.stroke(); }
  if(!o.dress){
    ctx.beginPath(); ctx.rect(-4.7,-14,9.4,2.2); FF('#3a2718'); OO(.5);
    if(g){ ctx.fillStyle='#c8963a'; for(let bx=-3.6;bx<0;bx+=1.2) ctx.fillRect(bx,-13.6,.6,1.4); }
    ctx.fillStyle='#d9b25a'; ctx.fillRect(1.9,-14.3,2,2.8); ctx.fillStyle='#3a2718'; ctx.fillRect(2.4,-13.6,1,1.4);
    if(g){ ctx.beginPath(); ctx.moveTo(1,-12.4); ctx.lineTo(4.6,-12.4); ctx.lineTo(4,-5.8); ctx.lineTo(1.8,-5.6); ctx.closePath(); FF('#4a3020'); OO(.5);
      if(longGun || (!armed && !reloading)){ ctx.fillStyle='#7a4e2c'; ctx.fillRect(1.6,-15.8,2.2,3.6); } }
  }
  if(o.duster || (o.coat && o.duster)){ ctx.beginPath(); ctx.moveTo(-4.8,-25.4); ctx.quadraticCurveTo(0,-27.4,4.8,-25.2); ctx.lineTo(4.4,-22.6);
    ctx.quadraticCurveTo(0,-24,-4.6,-22.4); ctx.closePath(); FF(o.coat); OO(.6); }
  if(o.poncho){
    ctx.beginPath(); ctx.moveTo(-5.2,-26); ctx.quadraticCurveTo(0,-28,5.2,-26); ctx.lineTo(7.4,-14.6); ctx.lineTo(-7.2,-14.6); ctx.closePath(); FF(o.poncho); OO(.8);
    ctx.fillStyle='#e0c890'; ctx.fillRect(-6.8,-17.2,13.8,.9); ctx.fillStyle='#2a1a14'; ctx.fillRect(-6.6,-18.8,13.4,.7);
    ctx.fillStyle='#e0c890'; for(let bx=-5;bx<6;bx+=2.6){ ctx.beginPath(); ctx.moveTo(bx,-14.6); ctx.lineTo(bx+.6,-13.2); ctx.lineTo(bx+1.2,-14.6); ctx.fill(); }
  }

  // ---- head
  capL(.9,-25.8,1.2,-27.6,3.2,o.skin);
  if(o.scarf){ ctx.beginPath(); ctx.moveTo(-1.8,-26.6); ctx.lineTo(4.8,-26.9); ctx.lineTo(2.6,-23.2); ctx.closePath(); FF(o.scarf); OO(.5); }
  if(o.collar){ ctx.fillStyle='#f4efe2'; ctx.fillRect(.4,-26.6,3.2,1.2); }
  ctx.beginPath(); ctx.arc(1.4,-30.7,4.6,0,TAU); FF(o.skin); OO(.9);
  ctx.beginPath(); ctx.arc(1.4,-30.7,4.6,1.75,4.5); ctx.closePath(); FF(o.hair);
  if(o.fem){ ctx.beginPath(); ctx.ellipse(-2.6,-27.4,2.2,3,.3,0,TAU); FF(o.hair); }
  ctx.beginPath(); ctx.moveTo(5.7,-31.4); ctx.lineTo(6.9,-29.6); ctx.lineTo(5.5,-29.2); ctx.closePath(); FF(o.skin);
  ctx.fillStyle=shade(o.skin,-.14); ctx.beginPath(); ctx.ellipse(.2,-30.2,1.1,1.5,0,0,TAU); ctx.fill();
  ctx.fillStyle=OUTL;
  if(e.dead){ ctx.fillRect(3.4,-31.6,1.4,.4); }
  else { ctx.beginPath(); ctx.arc(4.1,-31.3,.62,0,TAU); ctx.fill(); }
  if(o.moust && !o.mask){ ctx.fillStyle=o.hair; ctx.beginPath(); ctx.ellipse(4.8,-28.6,1.6,.7,-.2,0,TAU); ctx.fill(); }
  if(o.beard && !o.mask){ ctx.fillStyle=o.hair; ctx.beginPath(); ctx.moveTo(1,-28.8); ctx.quadraticCurveTo(3.2,-24.6,6,-28.2); ctx.lineTo(5.6,-29); ctx.quadraticCurveTo(3,-27.6,1.2,-29.6); ctx.fill(); }
  ctx.globalAlpha*=.28; ctx.fillStyle='#4a2a22'; ctx.beginPath(); ctx.ellipse(2.4,-32.6,4.6,1.4,0,0,TAU); ctx.fill();
  ctx.globalAlpha=e.dead? clamp(1-(e.dieT-28)/6,0,1) : 1;
  if(o.mask){ ctx.beginPath(); ctx.moveTo(-.4,-29.9); ctx.lineTo(6.4,-30.2); ctx.lineTo(6.6,-28); ctx.lineTo(4.2,-25.4);
    ctx.lineTo(1,-25.6); ctx.lineTo(-.8,-27.4); ctx.closePath(); FF(o.mask); OO(.6);
    ctx.strokeStyle='rgba(40,10,10,.4)'; ctx.lineWidth=.4; ctx.beginPath(); ctx.moveTo(2,-29); ctx.lineTo(4,-26.4); ctx.stroke(); }
  if(!e.hatOff) drawHat(o);
  // a legend changes the man carrying it: the band burns in its colour

    ctx.globalAlpha=(.6+Math.sin(now*3)*.3)*(e.dead?0:1); ctx.fillStyle=g.art.glow; ctx.fillRect(-2.8,-36.5,8.8,1.6); ctx.globalAlpha=1; }
  if(!behind) gunArm();
  ctx.restore();
  ctx.restore();
  FLASH=0; ctx.globalAlpha=1;

  // ---- legend aura: motes and a ring on the ground
  if(g && g.rar===3 && g.art && !e.dead){

    ctx.save(); ctx.globalAlpha=.22+Math.sin(now*2.6)*.08; ctx.strokeStyle=gl; ctx.lineWidth=1.6*z;
    ctx.beginPath(); ctx.ellipse(sx,sy+1*z,15*z*sc,5.4*z*sc,0,0,TAU); ctx.stroke(); ctx.restore();
    if(chance(dt*(e===P?8:3))) spawnP(x+rnd(-8,8), y-rnd(8,36), rnd(-10,10), rnd(-30,-8), rnd(.6,1.1), rnd(1,1.6), gl, 'ember', {drag:.95});
  }
  if(!e.dead && e!==P && !seated) drawHeadMarks(e, sx, sy - (seated?16:0)*z, sc);
}

// state carried above the head, in screen space so it never mirrors
function drawHeadMarks(e, sx, sy, sc){
  const z=cam.z, top=sy-48*z*sc;
  if(e.markT>0){
    ctx.save(); ctx.translate(sx,top-6*z); ctx.rotate(now*2.4);
    ctx.strokeStyle=C.gold; ctx.lineWidth=2.2*z; ctx.globalAlpha=.95;
    for(let i=0;i<4;i++){ ctx.beginPath(); ctx.arc(0,0,9*z, i*TAU/4+.3, i*TAU/4+1.2); ctx.stroke(); }
    ctx.fillStyle=C.gold; ctx.beginPath(); ctx.arc(0,0,1.8*z,0,TAU); ctx.fill();
    ctx.restore(); ctx.globalAlpha=1;
  }
  if(e.hp<e.maxhp && e.hp>0){
    const bw=26*z, fr=clamp(e.hp/e.maxhp,0,1), hy=top+4*z;
    ctx.fillStyle='rgba(18,13,16,.75)'; ctx.fillRect(sx-bw/2-1, hy-1, bw+2, 3.6*z+2);
    ctx.fillStyle = e.boss? C.gold : e.team==='law'? '#6f95cc' : e.team==='beast'? '#c8a070' : '#d4452f';
    ctx.fillRect(sx-bw/2, hy, bw*fr, 3.6*z);
    ctx.fillStyle='rgba(255,255,255,.25)'; ctx.fillRect(sx-bw/2, hy, bw*fr, 1*z);
  }
  if(e.state!=='combat' && e.seen>0.15 && hostile(e,P)){
    ctx.globalAlpha=clamp(e.seen,0,1); ctx.fillStyle=C.outlaw;
    ctx.beginPath(); ctx.moveTo(sx,top-14*z); ctx.lineTo(sx-5*z,top-4*z); ctx.lineTo(sx+5*z,top-4*z); ctx.closePath(); ctx.fill();
    ctx.fillStyle=C.flash; ctx.fillRect(sx-.8*z,top-11*z,1.6*z,4*z); ctx.globalAlpha=1;
  }
  if(e.stun>0){ for(let i=0;i<3;i++){ const a=now*5+i*TAU/3; star(sx+Math.cos(a)*9*z, top+2*z+Math.sin(a)*3*z, 2.6*z, C.gold, .9); } }
  if(e.quest){
    const yy=top-10*z+Math.sin(now*3)*2.4*z;
    ctx.fillStyle='rgba(18,13,16,.6)'; ctx.beginPath(); ctx.arc(sx,yy,8*z,0,TAU); ctx.fill();
    ctx.fillStyle=C.gold; ctx.beginPath(); ctx.moveTo(sx,yy-6*z); ctx.lineTo(sx+5*z,yy); ctx.lineTo(sx,yy+6*z); ctx.lineTo(sx-5*z,yy); ctx.closePath(); ctx.fill();
    ctx.fillStyle=C.ink; ctx.font='bold '+(8*z)+'px '+FT; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('!',sx,yy+.4*z);
    addLight(e.x,e.y-44,80,C.gold,.3);
  }
}

// ---- the horse, side on ---------------------------------------------------
function drawHorseBody(e, spd, ghost){
  const coat=ghost? '#e8dcc0' : (e.coat||'#5a4334'), dark=shade(coat,-.10), mane=ghost? '#fff4dc' : shade(coat,-.28);
  const gal=clamp(spd/200,0,1), trot=clamp(spd/60,0,1);

// the muzzle of whatever e is holding, in world space, for aim angle a
function muzzleAt(e, a){
  const g=entGun(e); const sc=figScale(e);
  const f = Math.cos(a)>=0? 1 : -1;
  const lift = (e===P && P.mounted)? 16 : 0;
  const shx=e.x+f*1.9*sc, shy=e.y-(FIG_SH*sc+lift);
  if(!g) return [shx+Math.cos(a)*12, shy+Math.sin(a)*12];
  const gs=sc*(g.rar===3?1.15:1), m=gunMuzzle(g);
  const L=(g.cls==='revolver'? 11.8 : 7.6)*sc + m[0]*gs, my=m[1]*gs*f;
  const ca=Math.cos(a), sa=Math.sin(a);
  return [shx+ca*L-sa*my, shy+sa*L+ca*my];
}

function gainXP(n){
  P.xp+=n;

  if(P.xp>=need){ P.xp-=need; P.lvl++; P.sp++;
    P.maxhp+=6; P.hp=P.maxhp;

      spawnP(P.x,P.y-8,Math.cos(a)*rnd(60,220),Math.sin(a)*rnd(60,220),rnd(.5,1),rnd(1.5,3),C.gold,'spark',{drag:.9}); }
  }
}
function lvlNeed(l){ return Math.round(120*Math.pow(1.28,l-1)); }

function addWanted(n, reason){
  const before=Math.floor(P.wanted);
  P.wanted=clamp(P.wanted+n,0,5);
  P.bounty += Math.round(n*70+rnd(0,40));
  P.noto += n*4;
  if(Math.floor(P.wanted)>before){
    toast('WANTED — '+Math.floor(P.wanted)+' STAR'+(P.wanted>=2?'S':''), reason||'The law is coming.', C.outlaw);
    sfx('drone',{f:44,dur:1.6});

  }
}
function spawnPosse(n){
  const a0=rnd(TAU);

}

function autoReload(){
  const g=gunDef(), id=gunId();
  if(P.reloadT>0) return;
  if(P.mags[id]>=g.mag) return;
  const at=AMMO_OF[g.cls];
  if(P.ammo[at]<=0){ toast('OUT OF '+AMMO_NAME[at], 'Buy more in town.', C.outlaw); return; }
  P.reloadT = g.rl*(P.perks.quick?0.72:1);
  P.reloadMax = P.reloadT;
  shedEmpties(P, g);
  sfx('reload');
}
function finishReload(){
  const g=gunDef(), id=gunId(), at=AMMO_OF[g.cls];
  const need=g.mag-P.mags[id];
  const take=Math.min(need,P.ammo[at]);
  P.mags[id]+=take; P.ammo[at]-=take;
  sfx('click');
}

function tracerCol(g){ return g.rar===3? (g.art.glow||C.gold) : g.rar===2? C.gold : g.rar===1? '#ffd28a' : '#ffc070'; }
function pm(a){ return muzzleAt(P,a); }
function playerShoot(){
  const g=gunDef(), id=gunId();
  if(P.reloadT>0||cine) return;
  const free = P.abMode==='storm'||P.abMode==='spin';
  if(!free && P.mags[id]<=0){ sfx('click',{vol:.5}); autoReload(); return; }
  if(P.fireT>0) return;
  const rofMul = P.abMode==='spin'?1.9 : P.abMode==='storm'?1.7 : 1;
  P.fireT = 1/(g.rof*rofMul);
  if(!free) P.mags[id]--;

  const inc = P.fireMod>0;
  if(inc) P.fireMod--;
  let spr = g.spr*(P.perks.sharp?0.60:1)*(P.de?0.30:1)*(P.abMode==='storm'||P.abMode==='spin'?0.35:1);
  spr *= (P.mounted?1.9:1);
  const base = P.aim + rnd(-1,1)*spr*0.35;
  const dmgMul = (P.perks.slinger?1.18:1)*(P.de?1.1:1);
  const rngMul = (P.perks.sharp?1.2:1);

  const mz=muzzleAt(P,base);
  for(let i=0;i<g.pel;i++){
    fireBullet({ x:mz[0], y:mz[1],
      a: base + (g.pel>1? rnd(-1,1)*spr : rnd(-1,1)*spr*0.5),
      spd:g.spd, dmg:g.dmg*dmgMul*(inc?1.1:1), own:P, rng:g.rng*rngMul,
      col: tracerCol(g), w: g.cls==='rifle'?2.4:(g.cls==='shotgun'?1.5:2.0), life:1.3,
      fire: inc?1:0 });
  }
  muzzle(P, base, g);
  P.recoil = Math.min(1, P.recoil + g.rec*0.14);
  cam.trauma = Math.min(1, cam.trauma + g.rec*0.055);
  P.aim -= 0; // recoil is visual only — the reticle stays honest
  sfx(g.cls==='shotgun'?'shotgun':g.cls==='rifle'?'rifle':'shot',{vol:.85});
  const kb = g.rec*9;
  P.kx = (P.kx||0) - Math.cos(base)*kb*6; P.ky = (P.ky||0) - Math.sin(base)*kb*6;
}

// ---- abilities ----------------------------------------------------------
function useAbility(){
  const g=gunDef(), id=gunId();
  if(!g.ab){ toast('NO ABILITY','This iron is honest, nothing more.','#a89a80'); return; }
  if(P.abCD>0){ sfx('click',{vol:.4}); return; }
  P.abCD = g.ab.cd;
  toast(g.ab.n, g.ab.d, RARC[g.rar]);
  sfx('whoosh');
  addTrauma(.18);
  for(let i=0;i<22;i++){ const a=rnd(TAU);
    spawnP(P.x,P.y-8,Math.cos(a)*rnd(80,250),Math.sin(a)*rnd(80,250),rnd(.3,.7),rnd(1.5,3),RARC[g.rar],'spark',{drag:.88}); }
  spawnP(P.x,P.y-6,0,0,.5,26,RARC[g.rar],'ring');

  switch(id){
    case 'rattler': P.abMode='fan'; P.abT=0.75; P.fanT=0; break;
    case 'sawtooth': P.fireMod=3; break;
    case 'whisper': railShot(g.dmg*3.2, 99, 5, C.flash); break;
    case 'roadagent': for(let i=0;i<6;i++){
        fireBullet({x:pm(P.aim)[0],y:pm(P.aim)[1],a:P.aim+rnd(-.35,.35),
          spd:g.spd*.9,dmg:g.dmg*1.1,own:P,rng:1400,col:C.gold,w:2.4,life:2.4,ric:3,homing:3.4}); }
      break;
    case 'thunder': concussion(); break;
    case 'vaquero': P.abMode='storm'; P.abT=4.0; break;
    case 'longrider': {
      const t=aimTarget(900);
      if(t){ t.markT=9; toast('MARKED','He is already dead. He just does not know.',C.gold); }
      break; }
    case 'deadmans': for(let i=0;i<8;i++){
        fireBullet({x:pm(P.aim)[0],y:pm(P.aim)[1],a:P.aim+(i-3.5)*0.13,
          spd:g.spd,dmg:g.dmg*1.15,own:P,rng:1600,col:'#e8c46a',w:2.6,life:2.6,ric:2,homing:4.2,card:1}); }
      break;
    case 'judgment': hellfire(); break;
    case 'widow': railShot(g.dmg*3.6, 99, 7, C.gold); break;
    case 'ironhorse': P.abMode='spin'; P.abT=4.5; break;
  }
}
function aimTarget(rad){
  let best=null,bs=-1;
  for(const e of ents){ if(e.dead||e.hp<=0||!hostile(P,e)) continue;
    const d=dist(P.x,P.y,e.x,e.y); if(d>rad) continue;
    const a=angTo(P.x,P.y,e.x,e.y);
    let da=Math.abs(((a-P.aim+Math.PI)%TAU+TAU)%TAU-Math.PI);
    if(da>0.5) continue;
    const s=(1-da/0.5)*2 + (1-d/rad);
    if(s>bs){bs=s;best=e;}
  }
  return best;
}
function railShot(dmg, pierce, width, col){
  const a=P.aim, len=2400;
  fireBullet({x:pm(a)[0],y:pm(a)[1],a:a,spd:4200,dmg:dmg,own:P,
    rng:len,col:col,w:width,life:1.0,pierce:pierce,big:1});
  addTrauma(.4); hitstop=Math.max(hitstop,.06);
  { const m=pm(a); addBeam(m[0],m[1],m[0]+Math.cos(a)*len,m[1]+Math.sin(a)*len,col,width,.5); }
  for(let i=0;i<40;i++){ const t=i/40;
    spawnP(P.x+Math.cos(a)*(30+t*len*0.5), aimFrom(P)+Math.sin(a)*(30+t*len*0.5),
      Math.cos(a+Math.PI/2)*rnd(-90,90), Math.sin(a+Math.PI/2)*rnd(-90,90),
      rnd(.25,.6), rnd(1.5,3.5), col,'spark',{drag:.86}); }
  sfx('rifle',{vol:1});
}
function concussion(){
  const a=P.aim;
  spawnP(P.x+Math.cos(a)*40,P.y+Math.sin(a)*40,0,0,.6,52,C.bone,'ring');
  for(let i=0;i<26;i++){ const sa=a+rnd(-1,1), v=rnd(160,420); spawnP(P.x+Math.cos(sa)*30,P.y+Math.sin(sa)*20,Math.cos(sa)*v,Math.sin(sa)*v,rnd(.5,1),rnd(4,7),'#d9c29a','dust',{drag:.9}); }
  sfx('boom',{vol:.8}); addTrauma(.5);
  for(const e of ents){ if(e.dead||e.hp<=0||!hostile(P,e)) continue;
    const d=dist(P.x,P.y,e.x,e.y); if(d>300) continue;
    const ea=angTo(P.x,P.y,e.x,e.y);
    let da=Math.abs(((ea-a+Math.PI)%TAU+TAU)%TAU-Math.PI);
    if(da>1.0) continue;
    damage(e, 46*(1-d/300)+14, P, ea);
    e.kx=(e.kx||0)+Math.cos(ea)*620; e.ky=(e.ky||0)+Math.sin(ea)*620; e.stun=1.3;
  }
  propsNear(P.x,P.y,300,_pn);
  for(const p of _pn){ if(p.t==='barrel'||p.t==='crate'){
    const ea=angTo(P.x,P.y,p.x,p.y);
    let da=Math.abs(((ea-a+Math.PI)%TAU+TAU)%TAU-Math.PI);
    if(da<1.0 && dist(P.x,P.y,p.x,p.y)<240){ p.solid=false; p.t='stump'; p.s*=.6;
      for(let i=0;i<8;i++) spawnP(p.x,p.y-8,rnd(-200,200),rnd(-220,20),.6,2.4,'#8a6b45','chip',{grav:520}); } } }
}
function hellfire(){
  const a=P.aim;
  for(let i=0;i<26;i++){
    const sa=a+rnd(-.42,.42);
    fireBullet({x:pm(a)[0],y:pm(a)[1],a:sa,spd:rnd(420,760),
      dmg:11,own:P,rng:360,col:'#ff8a2a',w:3.4,life:.8,fire:1,pierce:2});
  }
  for(let i=0;i<40;i++){ const sa=a+rnd(-.5,.5), dd=rnd(30,300);
    spawnP(P.x+Math.cos(sa)*dd,P.y-4+Math.sin(sa)*dd,Math.cos(sa)*rnd(30,120),Math.sin(sa)*rnd(30,120),
      rnd(.5,1.2),rnd(5,11),'#ff7a1e','fire',{drag:.93}); }
  sfx('boom',{vol:.9}); addTrauma(.35);
}

// ---- awakenings ---------------------------------------------------------
function canAwaken(){ const g=gunDef(); return g.aw && P.awaken>=P.awakenMax; }
function startAwaken(){
  const g=gunDef(), id=gunId();
  if(!g.aw){ toast('NO AWAKENING','Only a legend can wake.','#a89a80'); return; }
  if(P.awaken<P.awakenMax){ sfx('click',{vol:.4}); return; }
  // Gather BEFORE spending. 720 was barely a screen wide, so men just off the
  // edge were ignored and the awakening fired at nothing.
  const targets=[];
  for(const e of ents){ if(e.dead||e.hp<=0||!hostile(P,e)) continue;
    if(dist(P.x,P.y,e.x,e.y)<1300) targets.push(e); }
  targets.sort((a,b)=>dist2(P.x,P.y,a.x,a.y)-dist2(P.x,P.y,b.x,b.y));
  // The Last Hand executes a list. With an empty list it used to play the whole
  // cinematic, eat the full meter and do nothing at all — so it now refuses.
  if(id==='deadmans' && !targets.length){
    toast('NOBODY TO FINISH','The Last Hand needs a hand to play against.','#a89a80');
    sfx('click',{vol:.5}); return;
  }
  P.awaken=0;
  cine = { kind:id, name:g.aw.n, sub:g.aw.d, t:0, phase:0, targets:targets.slice(0,8),
           idx:0, ox:P.x, oy:P.y, oa:P.aim, ring:0, done:false, hits:[] };
  P.iframe = 6;
  sfx('drone',{f:38,dur:3.2}); sfx('chime');
  addTrauma(.5);
}

function updateCine(d){
  if(!cine) return;
  cine.t += d;
  const t=cine.t;
  const k=cine.kind;
  P.vx*=0.3; P.vy*=0.3;

  if(k==='deadmans'){
    slowmo = t<1.15 ? 0.03 : (t<4.0 ? 0.10 : 0.4);
    cam.tz = t<1.15? 1.55 : 1.35;
    if(t<1.15){
      if(!cine.marked){ cine.marked=true;
        for(const e of cine.targets){ e.markT=9; }
        sfx('ui',{f:180}); }
    } else if(t<4.0){
      const step=0.30;
      while(cine.idx<cine.targets.length && t-1.15 > cine.idx*step){
        const e=cine.targets[cine.idx];
        if(e && !e.dead && e.hp>0){
          const a=angTo(P.x,P.y,e.x,e.y);
          { const m=pm(a); cine.hits.push({x1:m[0],y1:m[1],x2:e.x,y2:hitBox(e)[0],t:0}); }
          muzzle(P,a,gunDef());
          damage(e, 260, P, a);
          addTrauma(.3); hitstop=Math.max(hitstop,.03);
          sfx('shot',{vol:.9});
        }
        cine.idx++;
      }
    } else if(t>4.6){ endCine(); }
  }
  else if(k==='judgment'){
    slowmo = t<1.0? 0.08 : 0.5;
    cam.tz = 1.2;
    grade.red = Math.max(grade.red, t<3.6? 0.5:0);
    if(t>1.0 && cine.ring<4 && t-1.0 > cine.ring*0.45){
      cine.ring++;
      const rad=90+cine.ring*95;
      spawnP(P.x,P.y-6,0,0,.8,rad*0.26,'#ff8a2a','ring');
      for(let i=0;i<46;i++){ const a=i/46*TAU;
        spawnP(P.x+Math.cos(a)*rad*.4,P.y-6+Math.sin(a)*rad*.4,Math.cos(a)*rad*1.5,Math.sin(a)*rad*1.5,
          rnd(.6,1.2),rnd(6,13),'#ff7a1e','fire',{drag:.9}); }
      for(let i=0;i<10;i++){ const a=rnd(TAU); addDecal(P.x+Math.cos(a)*rad*.7,P.y+Math.sin(a)*rad*.7,rnd(14,30),'scorch'); }
      for(const e of ents){ if(e.dead||e.hp<=0||!hostile(P,e)) continue;
        const dd=dist(P.x,P.y,e.x,e.y);
        if(Math.abs(dd-rad)<110) damage(e, 95, P, angTo(P.x,P.y,e.x,e.y), 1);
      }
      addTrauma(.45); sfx('boom',{vol:.85});
    }
    if(t>4.2) endCine();
  }
  else if(k==='widow'){
    slowmo = t<1.1? 0.05 : 0.14;
    cam.tz = 1.45;
    grade.mono = Math.max(grade.mono, t<3.2? 1 : 0);
    // "One shot crosses all of it" — so it always fires, whether or not anyone
    // happens to be standing in the way.
    if(t>1.1 && !cine.fired){
      cine.fired=true;
      const a2=cine.oa;
      { const m=pm(a2); cine.hits.push({x1:m[0], y1:m[1], x2:m[0]+Math.cos(a2)*2400, y2:m[1]+Math.sin(a2)*2400, t:0});
        addBeam(m[0],m[1],m[0]+Math.cos(a2)*2400,m[1]+Math.sin(a2)*2400,'#9fd4e8',9,1.1); }
      fireBullet({x:pm(a2)[0],y:pm(a2)[1], a:a2, spd:5200,
        dmg:340, own:P, rng:2600, col:'#9fd4e8', w:9, life:1.2, pierce:99, big:1});
      addTrauma(.55); hitstop=Math.max(hitstop,.05); sfx('rifle',{vol:1});
      for(let i=0;i<50;i++){ const tt=i/50;
        spawnP(P.x+Math.cos(a2)*(40+tt*1400), aimFrom(P)+Math.sin(a2)*(40+tt*1400),
          Math.cos(a2+Math.PI/2)*rnd(-70,70), Math.sin(a2+Math.PI/2)*rnd(-70,70),
          rnd(.3,.7), rnd(1.4,3), '#9fd4e8','spark',{drag:.88}); }
    }
    if(t>1.1 && cine.idx<cine.targets.length && t-1.1 > cine.idx*0.22){
      const e=cine.targets[cine.idx];
      const prev = cine.idx===0? {x:P.x,y:P.y} : cine.targets[cine.idx-1];
      if(e && !e.dead && e.hp>0){
        cine.hits.push({x1:prev.x,y1:prev.y-20,x2:e.x,y2:e.y-20,t:0});
        damage(e, 340, P, angTo(prev.x,prev.y,e.x,e.y));
        addTrauma(.26); sfx('rifle',{vol:.9}); hitstop=Math.max(hitstop,.04);
      }
      cine.idx++;
    }
    if(t>3.9) endCine();
  }
  else if(k==='ironhorse'){
    slowmo = t<0.9? 0.1 : 0.55;
    cam.tz = 1.25;
    if(t>0.9 && t<3.2){
      const sweep=(t-0.9)/2.3;
      const a=cine.oa - 1.15 + sweep*2.3;
      P.aim=a;
      cine.fireAcc=(cine.fireAcc||0)+d;
      while(cine.fireAcc>0.028){
        cine.fireAcc-=0.028;
        fireBullet({x:pm(a)[0],y:pm(a)[1],a:a+rnd(-.05,.05),
          spd:2100,dmg:30,own:P,rng:900,col:C.gold,w:2.8,life:.9,pierce:1});
        muzzle(P,a,gunDef());
      }
      addTrauma(.03);
      // ghost horses
      if(chance(d*7)){
        cine.ghosts=cine.ghosts||[];
        cine.ghosts.push({x:P.x+Math.cos(a+rnd(-.8,.8))*40,y:P.y+Math.sin(a+rnd(-.8,.8))*40,a:a,t:0});
      }
    }
    if(cine.ghosts) for(const gh of cine.ghosts){
      gh.t+=d; gh.x+=Math.cos(gh.a)*520*d; gh.y+=Math.sin(gh.a)*520*d;
      for(const e of ents){ if(e.dead||e.hp<=0||!hostile(P,e)) continue;
        if(dist2(e.x,e.y,gh.x,gh.y)<34*34){ damage(e,26,P,gh.a);
          e.kx=(e.kx||0)+Math.cos(gh.a)*300; e.ky=(e.ky||0)+Math.sin(gh.a)*300; } }
    }
    if(t>3.8) endCine();
  }
}
function endCine(){
  cine=null; slowmo=1; cam.tz=1; P.iframe=Math.max(P.iframe,.5);
}

// ---- dynamite -----------------------------------------------------------
const thrown = [];
function throwDynamite(){
  if((P.items.dynamite||0)<=0){ toast('NO DYNAMITE','Halloran sells it.','#a89a80'); return; }
  P.items.dynamite--;
  const a=P.aim, d=Math.min(340, dist(P.x,P.y,mouse.wx,mouse.wy));
  thrown.push({x:P.x,y:P.y-10,tx:P.x+Math.cos(a)*d,ty:P.y+Math.sin(a)*d,t:0,dur:.62,z:0,fuse:1.5,
    sx:P.x,sy:P.y-10});
  sfx('whoosh',{vol:.5});
}
function updateThrown(d){
  for(let i=thrown.length-1;i>=0;i--){
    const t=thrown[i];
    if(t.t<t.dur){
      t.t+=d; const u=clamp(t.t/t.dur,0,1);
      t.x=lerp(t.sx,t.tx,u); t.y=lerp(t.sy,t.ty,u);
      t.z=Math.sin(u*Math.PI)*46;
    } else {
      t.fuse-=d;
      if(chance(d*30)) spawnP(t.x,t.y-t.z,rnd(-30,30),rnd(-60,-10),.4,2,C.gold,'spark');
      if(t.fuse<=0){ explode(t.x,t.y,190,120,P); thrown.splice(i,1); }
    }
  }
}
function drawThrown(){
  for(const t of thrown){
    const sx=w2sx(t.x), sy=w2sy(t.y)-t.z*cam.z, z=cam.z;
    if(shadowA>.02){ ctx.globalAlpha=shadowA*.5; ctx.fillStyle=C.ink;
      ctx.beginPath(); ctx.ellipse(w2sx(t.x),w2sy(t.y),5*z,2.5*z,0,0,TAU); ctx.fill(); ctx.globalAlpha=1; }
    ctx.save(); ctx.translate(sx,sy); ctx.scale(z,z); ctx.rotate(now*9);
    ctx.fillStyle=C.outlaw; ctx.beginPath(); rr(-3,-7,6,14,2); ctx.fill();
    ctx.fillStyle=C.ink; ctx.fillRect(-3,-2,6,2);
    ctx.restore();
    addLight(t.x,t.y,44,C.gold,.3);
  }
}

// ==========================================================================
//  PLAYER UPDATE
// ==========================================================================
let nearSpot = null, nearNPC = null;

function updatePlayer(d){
  const m = P.mounted;

  // aim always follows the cursor
  mouse.wx = s2wx(mouse.x); mouse.wy = s2wy(mouse.y);
  if(!cine) P.aim = angTo(P.x, aimFrom(P), mouse.wx, mouse.wy);

  // ---- timers
  P.fireT-=d; P.abCD=Math.max(0,P.abCD-d); P.recoil*=Math.pow(.02,d);
  P.iframe-=d; P.rollCD-=d;
  if(P.abT>0){ P.abT-=d; if(P.abT<=0){ P.abMode=null; } }
  if(P.reloadT>0){ P.reloadT-=d; if(P.reloadT<=0) finishReload(); }
  if(P.hp<P.maxhp && P.regen>0){ const h=Math.min(P.regen*d*14, P.maxhp-P.hp); P.hp+=h; P.regen-=d; }

  // ---- fan the hammer keeps pulling the trigger for you
  if(P.abMode==='fan'){
    P.fanT-=d;
    if(P.fanT<=0 && P.mags[gunId()]>0){ P.fanT=0.075; P.fireT=0; playerShoot(); }
    if(P.mags[gunId()]<=0) P.abMode=null;
  }

  if(cine) return;

  // ---- dead eye
  const wantDE = mouse.rdown && P.deadeye>2;
  if(wantDE){
    P.de=true; P.deadeye-=d*(P.perks.eye?20:28);
    if(P.deadeye<=0){ P.deadeye=0; P.de=false; }
  } else {
    P.de=false; P.deadeye=Math.min(P.deadeyeMax, P.deadeye + d*(P.perks.eye?11:7));
  }
  slowmo = P.de? 0.34 : 1;

  // ---- roll
  if(P.rollT>0){
    P.rollT-=d;
    const s = 430*easeOutCubic(clamp(P.rollT/0.34,0,1));
    moveEnt(P, Math.cos(P.rollA)*s*d, Math.sin(P.rollA)*s*d);
    if(chance(d*40)) spawnP(P.x,P.y,rnd(-40,40),rnd(-40,40),.5,rnd(3,7),C.paper2,'dust',{drag:.9});
    P.iframe=Math.max(P.iframe,0.05);
    return;
  }

  // ---- movement
  let ix=0, iy=0;
  if(keys['a']||keys['ArrowLeft']) ix-=1;
  if(keys['d']||keys['ArrowRight']) ix+=1;
  if(keys['w']||keys['ArrowUp']) iy-=1;
  if(keys['s']||keys['ArrowDown']) iy+=1;
  const il=Math.hypot(ix,iy);
  const sprint = (keys['Shift']||keys['shift']) && P.stam>1 && il>0;

  if(m){
    // ---- mounted
    const tgtA = il>0 ? Math.atan2(iy,ix) : m.aim;
    m.aim = angLerp(m.aim, tgtA, d*(sprint?4:6));
    const sp = (sprint? 340 : 210) * (il>0?1:0);
    moveEnt(m, Math.cos(m.aim)*sp*d, Math.sin(m.aim)*sp*d);
    m.vx=Math.cos(m.aim)*sp; m.vy=Math.sin(m.aim)*sp;
    P.x=m.x; P.y=m.y-2; P.vx=m.vx; P.vy=m.vy;
    if(sprint){ P.stam=Math.max(0,P.stam-d*16); if(chance(d*22))
      spawnP(m.x-Math.cos(m.aim)*16,m.y+6,rnd(-50,50),rnd(-50,20),.6,rnd(4,9),C.paper2,'dust',{drag:.92}); }
    else P.stam=Math.min(P.maxstam,P.stam+d*20);
    if(press(' ')){ dismount(); }
  } else {
    const base = P.spd*(P.perks.light?1.12:1);
    const sp = (sprint?base*1.62:base) * (P.de?0.55:1);
    if(il>0){ moveEnt(P, ix/il*sp*d, iy/il*sp*d);
      P.vx=ix/il*sp; P.vy=iy/il*sp;
      if(sprint){ P.stam=Math.max(0,P.stam-d*26);
        if(chance(d*16)) spawnP(P.x,P.y+2,rnd(-30,30),rnd(-30,10),.5,rnd(2,5),C.paper2,'dust',{drag:.9}); }
      else P.stam=Math.min(P.maxstam,P.stam+d*14);
    } else { P.vx*=Math.pow(.001,d); P.vy*=Math.pow(.001,d);
      P.stam=Math.min(P.maxstam,P.stam+d*26); }
    // roll
    if(press(' ') && P.rollCD<=0 && P.stam>18){
      P.rollT=0.34; P.rollCD=P.perks.light?0.42:0.62; P.stam-=18;
      P.rollA = il>0? Math.atan2(iy,ix) : P.aim;
      P.iframe=0.30; sfx('whoosh',{vol:.5});
      for(let i=0;i<10;i++) spawnP(P.x,P.y,rnd(-90,90),rnd(-90,90),.5,rnd(3,7),C.paper2,'dust',{drag:.9});
    }
  }

  // ---- shooting
  const g=gunDef();
  const auto = g.cls==='repeater' || P.abMode==='spin' || P.abMode==='storm';
  if((auto? mouse.down : mouse.clicked) && !uiBlocking()) playerShoot();

  // ---- keys
  if(press('r')) autoReload();
  if(press('q')) useAbility();
  if(press('f')) startAwaken();
  if(press('g')) throwDynamite();
  if(press('1')) swapTo(0);
  if(press('2')) swapTo(1);
  if(press('3')) swapTo(2);
  if(press('4')) swapTo(3);
  if(press('5')) swapTo(4);
  if(mouse.wheel) swapTo((P.gi + (mouse.wheel>0?1:-1) + P.guns.length)%P.guns.length);
  if(press('h')) useItem('whiskey');
  if(press('j')) useItem('bandage');

  // ---- interaction
  findNear();
  if(press('e')) interact();

  // ---- wanted decay
  if(P.wanted>0){
    let anyLaw=false;
    for(const e of ents) if(e.team==='law'&&!e.dead&&e.hp>0&&e.state==='combat'&&e.target===P){anyLaw=true;break;}
    if(!anyLaw) P.wanted=Math.max(0,P.wanted-d*(P.perks.bandit?0.09:0.035));
  }
  P.noto=Math.max(0,P.noto-d*0.04);
}

function swapTo(i){
  if(i>=P.guns.length||i===P.gi) return;
  P.gi=i; P.reloadT=0; P.abMode=null; P.fireT=Math.max(P.fireT,0.22);
  sfx('click',{vol:.6});
}
function useItem(id){
  if((P.items[id]||0)<=0) return;
  P.items[id]--;
  if(id==='whiskey'){ P.hp=Math.min(P.maxhp,P.hp+30); grade.gold=0.5; }
  if(id==='tonic') P.hp=Math.min(P.maxhp,P.hp+70);
  if(id==='bandage'){ P.regen=2.0; }
  addFloat(P.x,P.y-30,'+'+(id==='tonic'?70:id==='whiskey'?30:22),'#7fa06a',15);
  sfx('coin',{vol:.5});
}

function mount(h){
  P.mounted=h; h.rider=P; h.noHit=false; h.state='ridden';
  toast('MOUNTED', h.name+' — SPACE to step down', C.gold);
  sfx('whoosh',{vol:.6});
}
function dismount(){
  const h=P.mounted; if(!h) return;
  h.rider=null; h.state='idle'; h.stT=2; P.mounted=null;
  P.x=h.x+Math.cos(h.aim+Math.PI/2)*22; P.y=h.y+Math.sin(h.aim+Math.PI/2)*22;
}

function findNear(){
  nearSpot=null; nearNPC=null;
  let bd=1e9;
  for(const s of SPOTS){ if(!s.on) continue;
    const d=dist(P.x,P.y,s.x,s.y);
    if(d<s.r && d<bd){ bd=d; nearSpot=s; } }
  let nd=1e9;
  for(const e of ents){
    if(e.dead||e.hp<=0) continue;
    if(e.kind==='horse'){
      if(P.mounted) continue;
      const d=dist(P.x,P.y,e.x,e.y);
      if(d<46 && d<nd){ nd=d; nearNPC=e; }
      continue;
    }
    if(e.team!=='civ' && !(e.quest||e.talk)) continue;
    if(hostile(P,e)) continue;
    const d=dist(P.x,P.y,e.x,e.y);
    if(d<58 && d<nd){ nd=d; nearNPC=e; }
  }
  // NPCs wander, and one parked on a doorstep must not make the door
  // unusable. A door outranks a bystander — but never outranks someone who
  // actually has business with you.
  if(nearNPC && nearSpot){
    if(nearSpot.data && nearSpot.data.enter && !nearNPC.quest) nearNPC=null;
    else if(nd < bd) nearSpot=null;
    else nearNPC=null;
  }
}
function interact(){
  if(P.mounted){ dismount(); return; }
  if(nearNPC){
    if(nearNPC.kind==='horse'){
      if(nearNPC.tamed) mount(nearNPC);
      else {
        const moving=Math.hypot(P.vx,P.vy);
        if(moving>120){ nearNPC.state='flee'; nearNPC.stT=4; toast('SPOOKED','Walk up slow next time.','#a89a80'); }
        else { nearNPC.tamed=true; toast('BROKE IN','The horse is yours.',C.gold); sfx('chime'); mount(nearNPC); }
      }
      return;
    }
    talkTo(nearNPC); return;
  }
  if(nearSpot){ useSpot(nearSpot); return; }
}
function uiBlocking(){ return mode!=='play'; }

const QUESTS = {};          // id -> quest
const activeQ = [];         // ids
let tracked = null;
const named = {};           // npcId -> entity

function defQ(o){ o.state='locked'; o.cur=0; o.prog=0; QUESTS[o.id]=o; return o; }
function q(id){ return QUESTS[id]; }
function step(qq){ return qq.steps[qq.cur]; }

function offerQ(id){ const qq=q(id); if(qq && qq.state==='locked') qq.state='avail'; }
function startQ(id){
  const qq=q(id); if(!qq||qq.state==='active'||qq.state==='done') return;
  qq.state='active'; qq.cur=0; qq.prog=0;
  activeQ.push(id); tracked=id;
  toast('NEW JOB — '+qq.title, qq.steps[0].text, C.gold);
  sfx('chime');
  if(qq.onStart) qq.onStart();
}
function advQ(id){
  const qq=q(id); if(!qq||qq.state!=='active') return;
  if(qq.steps[qq.cur].onDone) qq.steps[qq.cur].onDone();
  qq.cur++; qq.prog=0;
  if(qq.cur>=qq.steps.length){ doneQ(id); return; }
  toast('OBJECTIVE', qq.steps[qq.cur].text, C.gold);
  sfx('ui',{f:660});
}
function doneQ(id){
  const qq=q(id); qq.state='done';
  const i=activeQ.indexOf(id); if(i>=0) activeQ.splice(i,1);
  if(tracked===id) tracked = activeQ[0]||null;
  const rw=qq.rw||{};
  let sub=[];
  if(rw.money){ P.money+=rw.money; sub.push('$'+rw.money); }
  if(rw.xp){ gainXP(rw.xp); sub.push(rw.xp+' XP'); }
  if(rw.gun){ giveGun(rw.gun); sub.push(GUNS[rw.gun].name); }
  if(rw.ammo){ for(const k in rw.ammo){ P.ammo[k]=(P.ammo[k]||0)+rw.ammo[k]; } }
  if(rw.item){ for(const k in rw.item){ P.items[k]=(P.items[k]||0)+rw.item[k]; } }
  if(rw.honor){ P.honor+=rw.honor; }
  toast('JOB DONE — '+qq.title, sub.join('  ·  '), C.gold);
  sfx('chime');
  if(qq.onDone) qq.onDone();
  if(qq.next) offerQ(qq.next);
  if(qq.board) reportEvent('bounties',1);       // law bounties and Kane's jobs alike
  checkpoint();
}
function giveGun(id){
  if(P.guns.indexOf(id)>=0){ P.money+=200; return; }
  if(P.guns.length>=5){ P.guns[P.gi]=id; } else P.guns.push(id);
  P.mags[id]=GUNS[id].mag;
  const at=AMMO_OF[GUNS[id].cls];
  P.ammo[at]=(P.ammo[at]||0)+GUNS[id].mag*3;
  const g=GUNS[id];
  toast(RARN[g.rar]+' ARM — '+g.name, g.d, RARC[g.rar]);
  if(g.rar===3){ P.legend[id]=true; sfx('drone',{f:60,dur:2.4}); addTrauma(.4); grade.gold=1; }
}

// ---- objective progress hooks ------------------------------------------
function onKill(e){
  for(const id of activeQ.slice()){
    const qq=q(id), s=step(qq); if(!s) continue;
    if(s.t==='kill'){
      let ok=false;
      if(s.team && e.team===s.team) ok=true;
      if(s.kind && e.kind===s.kind) ok=true;
      if(s.tag && e.campTag===s.tag) ok=true;
      if(s.who && e.npcId===s.who) ok=true;
      if(s.near && dist(e.x,e.y,s.near[0],s.near[1])>s.near[2]) ok=false;
      if(ok){ qq.prog++; if(qq.prog>=(s.n||1)) advQ(id);
        else toast(qq.title, qq.prog+' / '+s.n+'  '+s.text, C.gold); }
    }
  }
  // bounty targets
  if(e.bountyFor){
    const qq=q(e.bountyFor);
    if(qq&&qq.state==='active'){ advQ(e.bountyFor); }
  }
}
function checkGoto(){
  for(const id of activeQ.slice()){
    const qq=q(id), s=step(qq); if(!s) continue;
    if(s.t==='goto' && dist(P.x,P.y,s.x,s.y)<(s.r||70)) advQ(id);
    if(s.t==='survive'){ qq.prog+=dt; if(qq.prog>=s.dur) advQ(id); }
  }
}
function questMark(){
  if(!tracked) return null;
  const qq=q(tracked); if(!qq||qq.state!=='active') return null;
  const s=step(qq); if(!s) return null;
  if(s.x!=null) return [s.x,s.y];
  if(s.t==='talk' && named[s.who] && !named[s.who].dead) return [named[s.who].x, named[s.who].y];
  if(s.t==='kill' && s.near) return [s.near[0],s.near[1]];
  if(s.t==='kill' && s.who && named[s.who]) return [named[s.who].x,named[s.who].y];
  if(s.t==='spot'){ for(const sp of SPOTS) if(sp.kind===s.kind) return [sp.x,sp.y]; }
  return null;
}
function objText(){
  if(!tracked) return null;
  const qq=q(tracked); if(!qq||qq.state!=='active') return null;
  const s=step(qq); if(!s) return null;
  let t=s.text;
  if(s.t==='kill'&&s.n>1) t+='  ('+qq.prog+'/'+s.n+')';
  if(s.t==='survive') t+='  ('+Math.max(0,Math.ceil(s.dur-qq.prog))+'s)';
  return {title:qq.title, text:t};
}

let boardSeed=1;
const BOUNTY_TITLES = ['THE PERDITION KID','ONE-EYE MARLOWE','RATTLESNAKE JUNE','DOC HOLLOWAY',
  'BLACKFOOT PIKE','THE OSGOOD BROTHERS','LAUGHING NED','CORA THE KNIFE','MOSE STRAND','SIX-GUN SADIE'];
function makeBountyOffer(i, outlawSide){
  const r=mulberry(boardSeed*977+i*131);
  const places=POI.filter(function(p){return p.kind!=='town';});
  const pl=places[(r()*places.length)|0];
  const n=2+Math.floor(r()*4)+Math.floor(P.lvl*0.4);
  const pay=Math.round((90+r()*140)*(1+P.lvl*0.22)*(outlawSide?1.25:1));
  const nm = BOUNTY_TITLES[(r()*BOUNTY_TITLES.length)|0];
  const id = 'board_'+(boardSeed)+'_'+i;
  const tag = 'brd'+boardSeed+'_'+i;
  const title = outlawSide? 'JOB — '+pl.name : 'BOUNTY — '+nm;
  const desc = outlawSide
    ? 'Kane pays for trouble at '+pl.name+'. '+n+' guns are in the way of it.'
    : nm+' and '+(n-1)+' others were seen near '+pl.name+'. The county pays on proof.';
  defQ({ id:id, title:title, side:outlawSide?'outlaw':'law', giver:'BOARD', board:true,
    desc:desc,
    steps:[
      {t:'goto', x:pl.x, y:pl.y, r:200, text:'Ride to '+pl.name+'.'},
      {t:'kill', tag:tag, n:n, text:'Deal with '+(outlawSide?'the guards':'the gang')+' at '+pl.name+'.'}
    ],
    rw:{money:pay, xp:80+n*26, honor:outlawSide?0:2},
    onStart:function(){
      const crew = outlawSide? (chance(.5)?'law':'outlaw') : 'outlaw';
      for(let k=0;k<n;k++){
        const a=r()*TAU, dd=60+r()*220;
        const e=makeEnt({x:clamp(pl.x+Math.cos(a)*dd,40,WORLD.w-40), y:clamp(pl.y+Math.sin(a)*dd,40,WORLD.h-40),
          team:crew, kind:crew, name:npcName(), hp:70+P.lvl*9,
          gun:pick(['rusted','navy','coach','trapper','lever','cattle','varmint']), spd:78, loot:rndi(10,40)});
        e.renegade=true; e.campTag=tag;
        if(k===0 && !outlawSide){ e.name=nm; e.boss=true; e.hp=e.maxhp=180+P.lvl*24; e.duelist=true; e.loot=pay>>1; }
      }
    }
  });
  return id;
}

  boardSeed++;
  const arr=[];
  for(let i=0;i<3;i++) arr.push(makeBountyOffer(i, kind==='heist'));
  boardOffers[kind]=arr;
}

  'Kane’s men rode through Tuesday. Nobody looked up.',
  'Cordell is a hard man. Hard is what this place takes.',
  'The Baron bought the water rights. Then the sheriff. Then the paper.',
  'They hung a man on Thursday for a horse he never rode.',
  'You look like trouble that hasn’t decided which kind yet.',
  'If you ride north, ride fast. Black Mesa does not take guests.',
  'Doc Perry will patch you. He’ll charge you for the thread.',
  'There is gold at the Old Mission. There is also whatever kept it.',
  'My boy went down Copper Creek. Three weeks. No letter.'
];
function talkTo(e){
  if(e.npcId){ talkNamed(e); return; }
  say(e.name, e.title||'REDWATER', [e.indoorLine||pick(CHATTER)], [{t:'Tip your hat', fn:function(){ P.honor+=0.2; closeDlg(); }},
    {t:'Move along', fn:closeDlg}]);
}

function talkNamed(e){
  const id=e.npcId;
  const qid=e.quest;
  // active quest talk-step?
  for(const aid of activeQ){
    const qq=q(aid), s=step(qq);
    if(s && s.t==='talk' && s.who===id){ questTalk(e,qq); return; }
    if(s && s.t==='choose' && (id==='CORDELL'||id==='KANE')){ choiceTalk(e,qq); return; }
  }
  if(qid && q(qid) && q(qid).state==='avail'){ offerTalk(e, q(qid)); return; }

  switch(id){
    case 'ARDEN': say('TOM ARDEN','SALOON BOY',
      ['Whole county’s got a side but you. Must be restful.',
       'Sheriff drinks here Thursdays. Kane’s men drink here the rest of the week.'],
      [{t:'Ask about work', fn:function(){ closeDlg(); openBoardish(); }},{t:'Leave it',fn:closeDlg}]); break;
    case 'HALLORAN': say('JEB HALLORAN','SHOPKEEP',
      ['Powder, lead, salt and lies. Everything a man needs.'],
      [{t:'Trade', fn:function(){ closeDlg(); openShop('general'); }},{t:'Leave it',fn:closeDlg}]); break;
    case 'SMITH': say('VERA STRAND','GUNSMITH',
      ['I can sell you iron. I can’t sell you nerve.',
       'The old guns, the ones with names — they don’t come through a shop door. You find those where men died holding them.'],
      [{t:'Trade', fn:function(){ closeDlg(); openShop('gun'); }},{t:'Leave it',fn:closeDlg}]); break;
    case 'DOC': say('DOC PERRY','PHYSICIAN',
      ['Sit down before you fall down.'],
      [{t:'Patch me up ($'+docPrice()+')', fn:function(){ doctorHeal(); }},{t:'Leave it',fn:closeDlg}]); break;
    case 'MAE': say('MAE CALLOWAY','HOMESTEADER',
      ['My husband is under a stone at Boot Hill with the Baron’s name on the paper that put him there.',
       'I keep the corral. I keep the lamp lit. That is all the fight I have left.'],
      [{t:'Leave it',fn:closeDlg}]); break;
    case 'CORDELL': say('ABEL CORDELL','COUNTY SHERIFF',
      P.side==='law'? ['Deputy. The board out front always has paper on it.']
                    : ['This county has one law and it is tired. Do not add to my work.'],
      P.side==='law'
        ? [{t:'Check the board', fn:function(){ closeDlg(); openBoard('bounty'); }},
           {t:'Pay my bounty ($'+Math.round(P.bounty)+')', fn:payBounty},{t:'Leave it',fn:closeDlg}]
        : [{t:'Pay my bounty ($'+Math.round(P.bounty)+')', fn:payBounty},{t:'Leave it',fn:closeDlg}]); break;
    case 'KANE': say('SILAS KANE','BLACK MESA',
      P.side==='outlaw'? ['The board’s up. Take what you can carry.']
                       : ['You ride in here wearing nothing. That is either brave or stupid, and out here they pay the same.'],
      P.side==='outlaw'
        ? [{t:'Check the board', fn:function(){ closeDlg(); openBoard('heist'); }},{t:'Leave it',fn:closeDlg}]
        : [{t:'Leave it',fn:closeDlg}]); break;
    default: say(e.name, e.title, [pick(CHATTER)], [{t:'Leave it',fn:closeDlg}]);
  }
}
function offerTalk(e,qq){
  say(e.name, e.title, [qq.desc], [
    {t:'I’ll take it', fn:function(){ startQ(qq.id); refreshQuestMarks(); closeDlg(); }},
    {t:'Not today', fn:closeDlg}]);
}
function questTalk(e,qq){
  const s=step(qq);
  say(e.name, e.title, [s.say||'Good. That’s done, then.'],
    [{t:'Continue', fn:function(){ advQ(qq.id); refreshQuestMarks(); closeDlg(); }}]);
}
function choiceTalk(e,qq){
  const law = e.npcId==='CORDELL';
  say(e.name, e.title,
    law ? ['I have got a jail full of men I cannot hang and a county full of men I cannot catch.',
           'Take the tin. You will be shot at by everyone Kane owns, which is most of them. But you will be shot at for a reason.']
        : ['Cordell will offer you tin and call it a future. Tin is what they pin on a man before they bury him.',
           'Ride with me. We take what the Baron takes, only we are honest about the taking.'],
    [{t: law?'Pin it on me':'I ride with you', fn:function(){ chooseSide(law?'law':'outlaw'); }},
     {t:'I need to think', fn:closeDlg}]);
}
function chooseSide(side){
  P.side=side;
  advQ('twooffers');
  doneQ('twooffers');
  offerQ(side==='law'?'badge':'black');
  offerQ('widowhunt'); offerQ('minetrouble');
  refreshQuestMarks();
  closeDlg();
  grade.gold=1; addTrauma(.3);
  toast(side==='law'?'YOU WEAR THE TIN':'YOU RIDE THE BLACK',
        side==='law'?'Redwater County Sheriff’s Office':'Black Mesa',
        side==='law'?C.law:C.outlaw);
  sfx('drone',{f:side==='law'?70:44,dur:2.6}); sfx('chime');
  checkpoint();
  // the other side turns on you
  for(const en of ents){
    if(side==='law'&&en.team==='outlaw') en.renegade=true;
  }
}
function docPrice(){ return Math.max(10, Math.round((P.maxhp-P.hp)*0.6)+10); }
function doctorHeal(){
  const c=docPrice();
  if(P.money<c){ say('DOC PERRY','PHYSICIAN',['Come back with money or come back dead. Either way I get paid.'],[{t:'Leave it',fn:closeDlg}]); return; }
  P.money-=c; P.hp=P.maxhp;
  sfx('chime'); toast('PATCHED UP','Good as the day before yesterday.','#7fa06a');
  closeDlg();
}
function payBounty(){
  if(P.bounty<=0){ toast('NOTHING OWED','The county has no paper on you.','#a89a80'); closeDlg(); return; }
  const c=Math.round(P.bounty);
  if(P.money<c){ toast('NOT ENOUGH','You owe $'+c+'.',C.outlaw); closeDlg(); return; }
  P.money-=c; P.bounty=0; P.wanted=0;
  for(const e of ents) if(e.posse&&!e.dead){ e.state='wander'; e.target=null; }
  toast('DEBT SETTLED','The paper comes down.',C.gold); sfx('coin'); closeDlg();
}
