<script>
/* ==========================================================================
   REDWATER — A Frontier Tale
   --------------------------------------------------------------------------
   THESIS   The frontier is vast, hot and silent; violence arrives as a
            half-second of white flash and black silhouettes, then silence.
   ANCHOR   "Once Upon a Time in the West" printed on an 1880s letterpress
            wanted poster. Limited ink, heavy blacks, hand-set serif, paper
            grain, raking shadows from one low sun.
   PALETTE  PAPER  #dcc39b  bleached sand / the world's ground note
            SAND2  #b8935f  worked earth, roads, wear
            SCRUB  #77824f  living things, sparse
            MESA   #a3664a  rock, blood of the land
            INK    #211a1c  ALL shadows, ALL threats, all silhouette
            NIGHT  #191f36  after dark ambient
            GOLD   #f0b429  the ONLY emissive colour. Interactive = gold.
            LAW    #4c74ab  sheriff faction
            OUTLAW #9e2b25  outlaw faction / blood
            FLASH  #fff4dc  muzzle, lightning, the white half-second
   TYPE     "Rye" (display, all headers & the mark) / "Special Elite"
            (typewriter, body & numerals). Serif + mono fallbacks.
   LEGIBILITY
            Threats render as flat INK silhouettes with a crimson trim and
            NO interior detail. Friendlies/interactables carry GOLD. Terrain
            is forbidden gold and forbidden pure black, so the eye separates
            "land / person / danger / use me" at any zoom. Only the player
            gets a rim-light. Size hierarchy: player > named NPC > mook.
   RENDERER Canvas2D. The look is flat lithographic shape + hard shadow, not
            emissive light bleed, so no WebGL is needed; the one additive
            layer (lanterns, muzzle, fire) is a half-res light buffer.
   ========================================================================== */

'use strict';

// ---------------------------------------------------------------- palette
const C = {
  paper:'#dcc39b', paper2:'#cdb086', sand:'#b8935f', sand2:'#a07c4e',
  scrub:'#77824f', scrub2:'#5e6b3e', mesa:'#a3664a', mesa2:'#7d4632',
  ink:'#211a1c', ink2:'#120d10', night:'#191f36',
  gold:'#f0b429', gold2:'#c98d18', law:'#4c74ab', outlaw:'#9e2b25',
  blood:'#8e2018', flash:'#fff4dc', bone:'#e8dcc0', water:'#4d6b74'
};
const FD = '"Rye", Georgia, "Times New Roman", serif';       // display
const FT = '"Special Elite", "Courier New", monospace';      // text

// ---------------------------------------------------------------- canvas
const cv = document.getElementById('cv');
let ctx = cv.getContext('2d', { alpha:false });
let W = 0, H = 0, DPR = 1, ready = false;
// half-res additive light buffer
const lcv = document.createElement('canvas'); const lx = lcv.getContext('2d');
// full-res grain tile
let grainTile = null;

function applySize(iw, ih){
  if (iw < 2 || ih < 2) return;                  // ignore degenerate layout passes
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.round(iw); H = Math.round(ih);
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled = true;
  lcv.width = Math.max(2,Math.round(W/2)); lcv.height = Math.max(2,Math.round(H/2));
  ready = true;
}
function resize(){ applySize(window.innerWidth||0, window.innerHeight||0); }
window.addEventListener('resize', resize);

// ---------------------------------------------------------------- math
const TAU = Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
const dist2=(x1,y1,x2,y2)=>{const a=x2-x1,b=y2-y1;return a*a+b*b;};
const angTo=(x1,y1,x2,y2)=>Math.atan2(y2-y1,x2-x1);
function angLerp(a,b,t){ let d=((b-a+Math.PI)%TAU+TAU)%TAU-Math.PI; return a+d*t; }
const easeOutCubic=t=>1-Math.pow(1-t,3);
const easeOutBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const easeInQuad=t=>t*t;
const easeInOut=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function rnd(a=1,b){ if(b===undefined){b=a;a=0;} return a+Math.random()*(b-a); }
function rndi(a,b){ return Math.floor(rnd(a,b)); }
function pick(arr){ return arr[(Math.random()*arr.length)|0]; }
function chance(p){ return Math.random()<p; }

// seeded deterministic RNG (mulberry32)
function mulberry(seed){ let a=seed>>>0; return function(){
  a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; };}
function hash2(x,y,s){ let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(s|0,1274126177);
  h=(h^h>>>13); h=Math.imul(h,1274126177); return ((h^h>>>16)>>>0)/4294967296; }

// value noise
const NP = new Uint8Array(512); { const r=mulberry(1337); const p=new Uint8Array(256);
  for(let i=0;i<256;i++)p[i]=i;
  for(let i=255;i>0;i--){const j=(r()*(i+1))|0; const t=p[i];p[i]=p[j];p[j]=t;}
  for(let i=0;i<512;i++)NP[i]=p[i&255]; }
function vnoise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=NP[(NP[xi&255]+ (yi&255))&511]/255;
  const b=NP[(NP[(xi+1)&255]+ (yi&255))&511]/255;
  const c=NP[(NP[xi&255]+ ((yi+1)&255))&511]/255;
  const d=NP[(NP[(xi+1)&255]+ ((yi+1)&255))&511]/255;
  return lerp(lerp(a,b,u), lerp(c,d,u), v);
}
function fbm(x,y,oct=4,lac=2,gain=.5){
  let s=0,amp=.5,f=1,norm=0;
  for(let i=0;i<oct;i++){ s+=vnoise(x*f,y*f)*amp; norm+=amp; amp*=gain; f*=lac; }
  return s/norm;
}

// ---------------------------------------------------------------- audio
// Procedural only. No assets. Gunfire = noise crack + low body thump.
const AU = { ctx:null, on:true, master:null, noise:null };
function audioInit(){
  if (AU.ctx) return;
  try{
    AU.ctx = new (window.AudioContext||window.webkitAudioContext)();
    AU.master = AU.ctx.createGain(); AU.master.gain.value = .4;
    const comp = AU.ctx.createDynamicsCompressor();
    comp.threshold.value=-18; comp.ratio.value=8;
    AU.master.connect(comp); comp.connect(AU.ctx.destination);
    const n = AU.ctx.sampleRate*2, buf = AU.ctx.createBuffer(1,n,AU.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    AU.noise = buf;
  }catch(e){ AU.on=false; }
}
function noiseSrc(){ const s=AU.ctx.createBufferSource(); s.buffer=AU.noise; s.loop=true;
  s.playbackRate.value = .8+Math.random()*.4; return s; }

function sfx(type, opt){
  if(!AU.on||!AU.ctx) return; opt=opt||{};
  const t = AU.ctx.currentTime, vol=(opt.vol==null?1:opt.vol);
  if(vol<=0.02) return;
  const out = AU.ctx.createGain(); out.connect(AU.master);
  try{
  switch(type){
    case 'shot': case 'shotgun': case 'rifle': {
      const big = type==='shotgun', rif = type==='rifle';
      const dur = big?.42:rif?.34:.26;
      const s=noiseSrc(); const f=AU.ctx.createBiquadFilter();
      f.type='bandpass'; f.frequency.value= rif?2600:big?900:1700; f.Q.value=.7;
      const g=AU.ctx.createGain(); g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(.9*vol,t+.004);
      g.gain.exponentialRampToValueAtTime(.0008,t+dur);
      s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t+dur+.02);
      const o=AU.ctx.createOscillator(); o.type='triangle';
      o.frequency.setValueAtTime(big?150:220,t);
      o.frequency.exponentialRampToValueAtTime(40,t+.16);
      const og=AU.ctx.createGain(); og.gain.setValueAtTime(.6*vol,t);
      og.gain.exponentialRampToValueAtTime(.0008,t+.2);
      o.connect(og); og.connect(out); o.start(t); o.stop(t+.22);
      break;
    }
    case 'click': case 'reload': {
      const o=AU.ctx.createOscillator(); o.type='square';
      o.frequency.setValueAtTime(type==='click'?900:420,t);
      o.frequency.exponentialRampToValueAtTime(type==='click'?300:180,t+.05);
      const g=AU.ctx.createGain(); g.gain.setValueAtTime(.14*vol,t);
      g.gain.exponentialRampToValueAtTime(.0008,t+.07);
      o.connect(g); g.connect(out); o.start(t); o.stop(t+.09); break;
    }
    case 'hit': {
      const s=noiseSrc(); const f=AU.ctx.createBiquadFilter();
      f.type='lowpass'; f.frequency.value=800;
      const g=AU.ctx.createGain(); g.gain.setValueAtTime(.45*vol,t);
      g.gain.exponentialRampToValueAtTime(.0008,t+.14);
      s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t+.16); break;
    }
    case 'boom': {
      const s=noiseSrc(); const f=AU.ctx.createBiquadFilter();
      f.type='lowpass'; f.frequency.setValueAtTime(1800,t);
      f.frequency.exponentialRampToValueAtTime(120,t+.7);
      const g=AU.ctx.createGain(); g.gain.setValueAtTime(1.0*vol,t);
      g.gain.exponentialRampToValueAtTime(.0008,t+.9);
      s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t+.95);
      const o=AU.ctx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(90,t); o.frequency.exponentialRampToValueAtTime(28,t+.5);
      const og=AU.ctx.createGain(); og.gain.setValueAtTime(.8*vol,t);
      og.gain.exponentialRampToValueAtTime(.0008,t+.6);
      o.connect(og); og.connect(out); o.start(t); o.stop(t+.62); break;
    }
    case 'ui': {
      const o=AU.ctx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(opt.f||520,t);
      const g=AU.ctx.createGain(); g.gain.setValueAtTime(.09*vol,t);
      g.gain.exponentialRampToValueAtTime(.0008,t+.1);
      o.connect(g); g.connect(out); o.start(t); o.stop(t+.12); break;
    }
    case 'coin': {
      for(let i=0;i<3;i++){ const fr=[880,1320,1760][i];
        const o=AU.ctx.createOscillator(); o.type='triangle'; o.frequency.value=fr;
        const g=AU.ctx.createGain(); g.gain.setValueAtTime(0,t+i*.05);
        g.gain.linearRampToValueAtTime(.1*vol,t+i*.05+.01);
        g.gain.exponentialRampToValueAtTime(.0008,t+i*.05+.16);
        o.connect(g); g.connect(out); o.start(t+i*.05); o.stop(t+i*.05+.18); }
      break;
    }
    case 'chime': {
      for(let i=0;i<4;i++){ const fr=[523,659,784,1047][i];
        const o=AU.ctx.createOscillator(); o.type='sine'; o.frequency.value=fr;
        const g=AU.ctx.createGain(); g.gain.setValueAtTime(0,t+i*.08);
        g.gain.linearRampToValueAtTime(.09*vol,t+i*.08+.02);
        g.gain.exponentialRampToValueAtTime(.0008,t+i*.08+.7);
        o.connect(g); g.connect(out); o.start(t+i*.08); o.stop(t+i*.08+.75); }
      break;
    }
    case 'drone': {
      const o=AU.ctx.createOscillator(); o.type='sawtooth';
      o.frequency.setValueAtTime(opt.f||55,t);
      const f2=AU.ctx.createBiquadFilter(); f2.type='lowpass'; f2.frequency.value=400;
      const g=AU.ctx.createGain(); g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(.16*vol,t+.3);
      g.gain.exponentialRampToValueAtTime(.0008,t+(opt.dur||2));
      o.connect(f2); f2.connect(g); g.connect(out); o.start(t); o.stop(t+(opt.dur||2)+.1); break;
    }
    case 'whoosh': {
      const s=noiseSrc(); const f=AU.ctx.createBiquadFilter(); f.type='bandpass';
      f.frequency.setValueAtTime(300,t); f.frequency.exponentialRampToValueAtTime(3000,t+.3);
      f.Q.value=2;
      const g=AU.ctx.createGain(); g.gain.setValueAtTime(.0008,t);
      g.gain.linearRampToValueAtTime(.26*vol,t+.12);
      g.gain.exponentialRampToValueAtTime(.0008,t+.4);
      s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t+.42); break;
    }
  }}catch(e){}
}
function sfxAt(type,x,y,opt){
  opt = opt||{};
  const d = dist(x,y,cam.x,cam.y);
  const v = clamp(1 - d/1100, 0, 1);
  if(v<=0.02) return;
  opt.vol = (opt.vol==null?1:opt.vol)*v*v;
  sfx(type,opt);
}

// ---------------------------------------------------------------- input
const keys = Object.create(null), keyOnce = Object.create(null);
const mouse = { x:0, y:0, wx:0, wy:0, down:false, rdown:false, clicked:false, rclicked:false, wheel:0 };
const HOLD = ['w','a','s','d',' ','tab','e','q','f','r','m','arrowup','arrowdown','arrowleft','arrowright'];
function kd(e){
  const k = e.key.length===1 ? e.key.toLowerCase() : e.key;
  if(!keys[k]) keyOnce[k]=true;
  keys[k]=true;
  if(HOLD.indexOf(k.toLowerCase())>=0) e.preventDefault();
  audioInit(); if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume();
}
function ku(e){ const k = e.key.length===1 ? e.key.toLowerCase() : e.key; keys[k]=false; }
window.addEventListener('keydown',kd); window.addEventListener('keyup',ku);
window.addEventListener('blur',function(){ for(const k in keys) keys[k]=false; mouse.down=false; });
function press(k){ if(keyOnce[k]){ keyOnce[k]=false; return true; } return false; }
function clearOnce(){ for(const k in keyOnce) keyOnce[k]=false;
  mouse.clicked=false; mouse.rclicked=false; mouse.wheel=0; }

function mpos(e){ const r=cv.getBoundingClientRect(); mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top; }
cv.addEventListener('mousemove',mpos);
cv.addEventListener('mousedown',function(e){ mpos(e);
  if(e.button===0){mouse.down=true;mouse.clicked=true;}
  if(e.button===2){mouse.rdown=true;mouse.rclicked=true;}
  audioInit(); if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume(); e.preventDefault(); });
window.addEventListener('mouseup',function(e){ if(e.button===0)mouse.down=false; if(e.button===2)mouse.rdown=false; });
cv.addEventListener('contextmenu',function(e){e.preventDefault();});
cv.addEventListener('wheel',function(e){ mouse.wheel=Math.sign(e.deltaY); e.preventDefault(); },{passive:false});

// ---------------------------------------------------------------- camera
const cam = { x:0, y:0, z:1, tz:1, trauma:0, sx:0, sy:0 };
function addTrauma(v){ cam.trauma = Math.min(1, cam.trauma + v); }
function w2sx(x){ return (x-cam.x)*cam.z + W/2 + cam.sx; }
function w2sy(y){ return (y-cam.y)*cam.z + H/2 + cam.sy; }
function s2wx(x){ return (x - W/2 - cam.sx)/cam.z + cam.x; }
function s2wy(y){ return (y - H/2 - cam.sy)/cam.z + cam.y; }

// ---------------------------------------------------------------- time of day
const DAY_LEN = 420;            // seconds per full in-game day
let dayT = 0.32;                // start mid-morning
function daylight(){
  if(dayT<0.20||dayT>0.86) return 0;
  if(dayT<0.30) return (dayT-0.20)/0.10;
  if(dayT>0.76) return 1-(dayT-0.76)/0.10;
  return 1;
}
function isNight(){ return daylight()<0.35; }
// One low sun. Shadows are long at dawn/dusk, short at noon, and rake one way.
const sun = { dx:1, dy:.6, len:1.6, warm:0 };
function updateSun(){
  const d = daylight();
  const a = lerp(-0.55, -2.55, clamp((dayT-0.22)/0.60,0,1)); // sweeps overhead
  sun.len = lerp(2.9, 0.62, Math.sin(clamp((dayT-0.22)/0.60,0,1)*Math.PI));
  sun.dx = Math.cos(a)*sun.len; sun.dy = (Math.abs(Math.sin(a))*0.45+0.38)*sun.len;
  sun.warm = d;
}
function hourStr(){
  const h24 = (dayT*24+6)%24; const h=Math.floor(h24);
  const m = Math.floor((h24-h)*60);
  const ap = h<12?'AM':'PM'; let hh=h%12; if(hh===0)hh=12;
  return hh+':'+(m<10?'0':'')+m+' '+ap;
}

// ==========================================================================
//  WORLD
// ==========================================================================
// The map proper is 6400x4800. Everything below INDOORS_Y is the "indoors
// strip": real rooms laid out off the map, so interiors reuse the exact same
// collision, lighting, AI and y-sorted renderer the outdoors uses.
const MAP_H = 4800;
const INDOORS_Y = 5000;
const WORLD = { w:6400, h:6600 };
const CH = 400;                              // chunk size in world px

// --- named places -------------------------------------------------------
const POI = [
  { id:'town',   name:'REDWATER',            x:2000, y:2400, r:520, kind:'town'  },
  { id:'camp',   name:'BLACK MESA CAMP',     x:5250, y:900,  r:380, kind:'outlaw'},
  { id:'mine',   name:'COPPER CREEK MINE',   x:900,  y:900,  r:340, kind:'work'  },
  { id:'ranch',  name:'HARGRAVE RANCH',      x:4850, y:3900, r:420, kind:'work'  },
  { id:'farm',   name:'CALLOWAY HOMESTEAD',  x:3150, y:3620, r:300, kind:'work'  },
  { id:'depot',  name:'PERDITION DEPOT',     x:3500, y:1480, r:320, kind:'work'  },
  { id:'grave',  name:'BOOT HILL',           x:1450, y:3200, r:240, kind:'quiet' },
  { id:'mission',name:'THE OLD MISSION',     x:760,  y:3000, r:260, kind:'quiet' },
  { id:'gulch',  name:'DEADFALL GULCH',      x:4150, y:2280, r:300, kind:'danger'},
  { id:'butte',  name:'SPANISH BUTTE',       x:1150, y:1850, r:280, kind:'danger'},
  { id:'wash',   name:'COYOTE WASH',         x:4400, y:3150, r:280, kind:'danger'},
  { id:'lookout',name:'WIDOWS LOOKOUT',      x:5900, y:2450, r:220, kind:'quiet' }
];
function poi(id){ for(let i=0;i<POI.length;i++) if(POI[i].id===id) return POI[i]; return null; }
function nearestPOI(x,y){ let b=null,bd=1e9; for(const p of POI){ const d=dist(x,y,p.x,p.y);
  if(d<bd){bd=d;b=p;} } return {p:b,d:bd}; }

// --- roads & river ------------------------------------------------------
const RIVER = [[6280,220],[5500,760],[4700,1350],[4080,1880],[3620,2500],[3260,3100],
               [3060,3760],[2880,4400],[2760,4800]];
const ROADS = [
  [[2000,2400],[2560,2200],[3050,1900],[3500,1480]],              // town -> depot
  [[3500,1480],[4200,1220],[4800,1000],[5250,900]],               // depot -> camp
  [[2000,2400],[1600,2000],[1250,1500],[900,900]],                // town -> mine
  [[2000,2400],[2450,2760],[2800,3200],[3150,3620]],              // town -> farm
  [[3150,3620],[3800,3820],[4400,3900],[4850,3900]],              // farm -> ranch
  [[2000,2400],[1750,2800],[1500,3050],[1450,3200]],              // town -> boot hill
  [[1450,3200],[1050,3100],[760,3000]],                           // hill -> mission
  [[3500,1480],[4700,1480],[5900,1500]]                           // rail-side track
];
const RAIL = [[0,1620],[1400,1600],[2600,1560],[3500,1480],[4600,1440],[5600,1420],[6400,1400]];

function plPoint(pl,t){ // t in 0..1 along polyline
  const n=pl.length-1, f=t*n, i=clamp(Math.floor(f),0,n-1), u=f-i;
  return [ lerp(pl[i][0],pl[i+1][0],u), lerp(pl[i][1],pl[i+1][1],u) ];
}
function distToPoly(pl,x,y){
  let best=1e9;
  for(let i=0;i<pl.length-1;i++){
    const x1=pl[i][0],y1=pl[i][1],x2=pl[i+1][0],y2=pl[i+1][1];
    const dx=x2-x1,dy=y2-y1, L=dx*dx+dy*dy;
    let t=L?((x-x1)*dx+(y-y1)*dy)/L:0; t=clamp(t,0,1);
    const d=dist(x,y,x1+dx*t,y1+dy*t); if(d<best)best=d;
  }
  return best;
}
const RIVER_W = 62;
function inRiver(x,y){ return distToPoly(RIVER,x,y) < RIVER_W; }
function onRoad(x,y){ for(const r of ROADS) if(distToPoly(r,x,y)<30) return true; return false; }

// bridges (river crossings are passable here)
const BRIDGES = [[3050,1900],[2800,3200],[3620,2500]];
function nearBridge(x,y){ for(const b of BRIDGES) if(dist2(x,y,b[0],b[1])<150*150) return true; return false; }

// --- ground classification ---------------------------------------------
// 0 sand   1 cracked flat   2 scrub   3 rock/mesa   4 road   5 water  6 boardwalk
function groundAt(x,y){
  if(y>=INDOORS_Y) return roomFloorAt(x,y);
  if(inRiver(x,y)) return 5;
  const e = fbm(x*0.00075, y*0.00075, 4);
  const m = fbm(x*0.0014+37.7, y*0.0014+12.3, 3);
  if(e>0.635) return 3;
  if(m>0.60 && e<0.60) return 2;
  if(m<0.40) return 1;
  return 0;
}

const GCOL = [C.paper, C.paper2, C.scrub, C.mesa, C.sand, C.water, '#8a6b45',
              '#8a6338', '#9a9384', '#6f5a41', '#171114'];
function roomFloorAt(x,y){
  for(let i=0;i<ROOMS.length;i++){
    const R=ROOMS[i];
    if(x>R.x-R.w/2-8 && x<R.x+R.w/2+8 && y>R.y-R.h/2-8 && y<R.y+R.h/2+8) return R.floor;
  }

}

// {x,y,t,s,r,solid,seed}  t: cactus rock boulder bush grass bone stump tree
//                            fence barrel crate wagon post grave sign trough
//                            tent lamp campfire tower well tumble
const props = [];
const ROOMS = [];
const WALLS = [];           // axis-aligned solid rects; interiors are built from these
const BUILDINGS = [];
const SPOTS = [];                              // interactables
let pgrid = null, PG = 200, PGW=0, PGH=0;

function addProp(x,y,t,s,solid,r){
  props.push({ _k:'p', x:x, y:y, t:t, s:s||1, solid:!!solid, r:r||0, seed:(Math.random()*1e9)|0, hp:0 });
}
function buildPropGrid(){
  PGW = Math.ceil(WORLD.w/PG); PGH = Math.ceil(WORLD.h/PG);
  pgrid = new Array(PGW*PGH); for(let i=0;i<pgrid.length;i++) pgrid[i]=[];
  for(let i=0;i<props.length;i++){
    const p=props[i];
    const cx=clamp(Math.floor(p.x/PG),0,PGW-1), cy=clamp(Math.floor(p.y/PG),0,PGH-1);
    pgrid[cy*PGW+cx].push(i);
  }
}
function propsNear(x,y,rad,out){
  out.length=0;
  const x0=clamp(Math.floor((x-rad)/PG),0,PGW-1), x1=clamp(Math.floor((x+rad)/PG),0,PGW-1);
  const y0=clamp(Math.floor((y-rad)/PG),0,PGH-1), y1=clamp(Math.floor((y+rad)/PG),0,PGH-1);
  for(let cy=y0;cy<=y1;cy++) for(let cx=x0;cx<=x1;cx++){
    const cell=pgrid[cy*PGW+cx];
    for(let k=0;k<cell.length;k++) out.push(props[cell[k]]);
  }
  return out;
}

// --- buildings ----------------------------------------------------------
// kind drives roof colour, sign, and what the door opens
function addBuilding(x,y,w,h,kind,name,face){
  const b = { _k:'b', x:x, y:y, w:w, h:h, kind:kind, name:name||'', face:face||1, seed:(Math.random()*1e9)|0 };
  // door on the facing side (face 1 = door on south/bottom, -1 = north/top)
  b.dx = x; b.dy = y + (h/2+14)*b.face;
  BUILDINGS.push(b);
  return b;
}
function addSpot(x,y,r,kind,label,data){
  const s={x:x,y:y,r:r,kind:kind,label:label,data:data||{},on:true}; SPOTS.push(s); return s;
}
// A spot buried inside a solid rect can never be reached — the player is stopped
// at the wall, outside trigger range, and the prompt never appears. Sweep for it
// at world build and shove any offender out past the nearest edge.
function validateSpots(){
  const solids = BUILDINGS.concat(WALLS);
  const bad = [];
  for(const s of SPOTS){
    for(const b of solids){
      if(Math.abs(s.x-b.x) >= b.w/2 || Math.abs(s.y-b.y) >= b.h/2) continue;
      const dl = s.x-(b.x-b.w/2), dr = (b.x+b.w/2)-s.x;
      const dt = s.y-(b.y-b.h/2), db = (b.y+b.h/2)-s.y;
      const m = Math.min(dl,dr,dt,db);
      if(m===db)      s.y = b.y+b.h/2+24;
      else if(m===dt) s.y = b.y-b.h/2-24;
      else if(m===dr) s.x = b.x+b.w/2+24;
      else            s.x = b.x-b.w/2-24;
      bad.push(s.kind);
    }
  }
  return bad;
}
// Nothing should ever begin life embedded in a wall — it gets shoved sideways
// on its first step and cannot reach anything. Push it out to open ground.
function nudgeFree(e){
  const solids = BUILDINGS.concat(WALLS);
  for(let pass=0; pass<30; pass++){
    let stuck=false;
    for(const b of solids){
      if(!rectHit(b,e.x,e.y,e.r)) continue;
      stuck=true;
      const dl=e.x-(b.x-b.w/2-e.r), dr=(b.x+b.w/2+e.r)-e.x;
      const dt=e.y-(b.y-b.h/2-e.r), db=(b.y+b.h/2+e.r)-e.y;
      const m=Math.min(dl,dr,dt,db);
      if(m===db)      e.y=b.y+b.h/2+e.r+1;
      else if(m===dt) e.y=b.y-b.h/2-e.r-1;
      else if(m===dr) e.x=b.x+b.w/2+e.r+1;
      else            e.x=b.x-b.w/2-e.r-1;
    }
    if(!stuck) break;
  }
  e.home=[e.x,e.y];
}
function rectHit(b,x,y,rad){
  const hw=b.w/2+rad, hh=b.h/2+rad;
  return Math.abs(x-b.x)<hw && Math.abs(y-b.y)<hh;
}

function scatterWild(){
  const r = mulberry(20260917);
  const N = 5200;
  for(let i=0;i<N;i++){
    const x = r()*WORLD.w, y = r()*MAP_H;
    // keep the street and roads clear
    if(onRoad(x,y)) continue;
    let near=false;
    for(const p of POI){ if(dist2(x,y,p.x,p.y) < (p.r*0.55)*(p.r*0.55)){ near=true; break; } }
    if(near) continue;
    // nothing grows through a floor: keep scatter out of every building
    for(const b of BUILDINGS){
      if(Math.abs(x-b.x)<b.w/2+24 && Math.abs(y-b.y)<b.h/2+24){ near=true; break; } }
    if(near) continue;
    const g = groundAt(x,y);
    if(g===5) continue;
    const q = r();
    if(g===3){ // rock country
      if(q<.42) addProp(x,y,'boulder',.7+r()*1.3,true,18+r()*10);
      else if(q<.7) addProp(x,y,'rock',.6+r()*.8,q<.56,12);
      else if(q<.86) addProp(x,y,'bush',.7+r()*.6,false,0);
      else addProp(x,y,'bone',.8+r()*.5,false,0);
    } else if(g===2){ // scrub
      if(q<.45) addProp(x,y,'grass',.8+r()*.8,false,0);
      else if(q<.68) addProp(x,y,'bush',.7+r()*.7,false,0);
      else if(q<.85) addProp(x,y,'tree',.8+r()*.7,true,15);
      else if(q<.94) addProp(x,y,'cactus',.8+r()*.6,true,12);
      else addProp(x,y,'stump',.9,true,12);
    } else { // sand / flats
      if(q<.30) addProp(x,y,'grass',.6+r()*.6,false,0);
      else if(q<.55) addProp(x,y,'cactus',.75+r()*.75,true,13);
      else if(q<.72) addProp(x,y,'rock',.5+r()*.7,false,0);
      else if(q<.84) addProp(x,y,'bush',.6+r()*.5,false,0);
      else if(q<.93) addProp(x,y,'bone',.7+r()*.5,false,0);
      else addProp(x,y,'stump',.8,true,11);
    }
  }
  // riverbank greenery
  for(let i=0;i<520;i++){
    const t=r(), p=plPoint(RIVER,t);
    const side=r()<.5?-1:1, off=RIVER_W+10+r()*90;
    const a=r()*TAU;
    const x=p[0]+Math.cos(a)*off, y=p[1]+Math.sin(a)*off;
    if(x<0||y<0||x>WORLD.w||y>WORLD.h) continue;
    if(inRiver(x,y)) continue;
    addProp(x,y, r()<.45?'tree':'grass', .9+r()*.8, r()<.45, 15);
  }
}

function addWall(x,y,w,h){ WALLS.push({x:x,y:y,w:w,h:h,_k:'w'}); }

function addRoom(o){

              floor:o.floor, from:o.from, doorW:o.doorW||64, _k:'r' };

  const hw=R.w/2, hh=R.h/2, g=R.doorW/2;

  addWall(R.x+hw+WALL_T/2, R.y, WALL_T, R.h);                        // east

// ---- going in and out ----------------------------------------------------
function enterRoom(id){
  const R=room(id); if(!R) return;
  P.outside=[P.x,P.y];
  if(P.mounted) dismount();
  P.x=R.inDoor[0]; P.y=R.inDoor[1];
  cam.x=P.x; cam.y=P.y;
  P.kx=P.ky=0; P.vx=P.vy=0;
  fadeT=0.9; sfx('ui',{f:320});
  toast(R.name,'E at the door to step back out','#d8c39b');
}
function exitRoom(){
  // Fall back to the room's own street door if we have no memory of coming in
  // (e.g. the ride was saved indoors) — never leave the player walled in.
  let dest = P.outside;
  if(!dest){
    const R = inRoom(P.x,P.y);
    if(R){ for(const s of SPOTS) if(s.data && s.data.enter===R.id){ dest=[s.x, s.y+18]; break; } }
  }
  if(!dest) dest = [2000, 2570];
  P.x=dest[0]; P.y=dest[1]; P.outside=null;
  cam.x=P.x; cam.y=P.y;
  P.kx=P.ky=0; P.vx=P.vy=0;
  fadeT=0.9; sfx('ui',{f:260});
}

// ==========================================================================
//  TERRAIN — baked chunks. Flat litho ground + stipple + inked roads.
// ==========================================================================
const DECKS = [];                    // boardwalk rects baked into terrain
const chunkCache = new Map();
let chunkFrame = 0;

function segBoxHit(x1,y1,x2,y2,bx,by,bw,bh,pad){
  const minx=Math.min(x1,x2)-pad, maxx=Math.max(x1,x2)+pad;
  const miny=Math.min(y1,y2)-pad, maxy=Math.max(y1,y2)+pad;
  return !(maxx<bx||minx>bx+bw||maxy<by||miny>by+bh);
}
function strokePoly(c,pl,ox,oy,bw,bh,width,style,cap){
  let any=false;
  c.lineWidth=width; c.strokeStyle=style; c.lineCap=cap||'round'; c.lineJoin='round';
  for(let i=0;i<pl.length-1;i++){
    if(!segBoxHit(pl[i][0]-ox,pl[i][1]-oy,pl[i+1][0]-ox,pl[i+1][1]-oy,0,0,bw,bh,width)) continue;
    if(!any){ c.beginPath(); any=true; }
    c.moveTo(pl[i][0]-ox,pl[i][1]-oy); c.lineTo(pl[i+1][0]-ox,pl[i+1][1]-oy);
  }
  if(any) c.stroke();
  return any;
}

function makeChunk(cx,cy){
  const c = document.createElement('canvas');
  c.width = CH; c.height = CH;
  const g = c.getContext('2d');
  const ox = cx*CH, oy = cy*CH;

  // --- base cells
  const CELL = 16, n = CH/CELL;
  for(let j=0;j<n;j++) for(let i=0;i<n;i++){
    const wx = ox+i*CELL+CELL/2, wy = oy+j*CELL+CELL/2;
    // jitter the SAMPLE, not the cell: biome edges come out ragged and organic
    // instead of a 20px staircase, and it costs nothing.
    const jx=(hash2(i+cx*n,j+cy*n,3)-0.5)*26, jy=(hash2(i+cx*n,j+cy*n,9)-0.5)*26;
    const gt = groundAt(wx+jx,wy+jy);
    const v = hash2(i+cx*n, j+cy*n, 7);
    let col = GCOL[gt];
    // per-cell jitter + a low-frequency world-space wash. The wash is sampled in
    // WORLD space, not chunk space, so it never shows a chunk seam.
    const mott = (fbm(wx*0.00085, wy*0.00085, 3)-0.5)*0.13;
    const sh = (v-0.5)*0.09 + mott;
    g.fillStyle = shade(col, sh);
    g.fillRect(i*CELL-1, j*CELL-1, CELL+2, CELL+2);
    // …then a jittered blob of the same tone. Neighbouring blobs overlap into
    // each other, so a biome edge dissolves instead of stepping down a grid.
    const bx=(hash2(i+cx*n,j+cy*n,21)-0.5)*CELL*0.6, by=(hash2(i+cx*n,j+cy*n,29)-0.5)*CELL*0.6;
    g.beginPath();
    g.ellipse(i*CELL+CELL/2+bx, j*CELL+CELL/2+by, CELL*0.84, CELL*0.84, 0, 0, TAU);
    g.fill();
  }

  // --- stipple: the letterpress grain of the land
  const r = mulberry((cx*73856093)^(cy*19349663));
  g.globalAlpha = .20;
  for(let i=0;i<900;i++){
    const x=r()*CH, y=r()*CH;
    g.fillStyle = r()<.55 ? C.ink : C.bone;
    const s = .8+r()*1.9;
    g.fillRect(x,y,s,s);
  }
  // --- larger flecks / pebbles
  g.globalAlpha = .13;
  for(let i=0;i<70;i++){
    const x=r()*CH, y=r()*CH;
    g.fillStyle = C.ink;
    g.beginPath(); g.ellipse(x,y,1.5+r()*3,1+r()*2,r()*TAU,0,TAU); g.fill();
  }
  // --- dry cracks
  g.globalAlpha=.10; g.strokeStyle=C.ink; g.lineWidth=1;
  for(let i=0;i<7;i++){
    let x=r()*CH, y=r()*CH;
    if(groundAt(ox+x,oy+y)!==1) continue;
    g.beginPath(); g.moveTo(x,y);
    let a=r()*TAU;
    for(let k=0;k<6;k++){ a+=(r()-.5)*1.6; x+=Math.cos(a)*10; y+=Math.sin(a)*10; g.lineTo(x,y); }
    g.stroke();
  }
  g.globalAlpha=1;

  // --- indoors strip: cut the grain back out of the void so each room reads as
  //     a lit island rather than a floor floating on gravel.
  if(oy+CH > INDOORS_Y){
    g.fillStyle='#120d10';
    for(let j=0;j<n;j++) for(let i=0;i<n;i++){
      const wx2=ox+i*CELL+CELL/2, wy2=oy+j*CELL+CELL/2;
      if(wy2<INDOORS_Y || roomFloorAt(wx2,wy2)===10)
        g.fillRect(i*CELL-1, j*CELL-1, CELL+2, CELL+2);
    }
  }

  // --- roads (worn earth, inked ruts)
  for(const rd of ROADS){
    if(strokePoly(g,rd,ox,oy,CH,CH,62,'rgba(33,26,28,.22)')){   // scuffed verge
      strokePoly(g,rd,ox,oy,CH,CH,50,C.sand);                    // packed earth
      g.globalAlpha=.55; strokePoly(g,rd,ox,oy,CH,CH,22,C.sand2);
      g.globalAlpha=.30;                                          // wheel ruts
      for(const off of [-13,13]) strokePoly(g, rd.map(function(p){return [p[0],p[1]+off];}), ox,oy,CH,CH,3,C.ink);
      g.globalAlpha=1;
    }
  }
  // --- rails
  if(strokePoly(g,RAIL,ox,oy,CH,CH,34,'#6f5b45')){
    g.globalAlpha=.55;
    for(let i=0;i<RAIL.length-1;i++){
      const x1=RAIL[i][0]-ox,y1=RAIL[i][1]-oy,x2=RAIL[i+1][0]-ox,y2=RAIL[i+1][1]-oy;
      if(!segBoxHit(x1,y1,x2,y2,0,0,CH,CH,30)) continue;
      const L=Math.hypot(x2-x1,y2-y1), st=16, nn=Math.floor(L/st);
      const nx=-(y2-y1)/L, ny=(x2-x1)/L;
      g.strokeStyle=C.ink; g.lineWidth=4;
      for(let k=0;k<nn;k++){ const t=k/nn, px=lerp(x1,x2,t), py=lerp(y1,y2,t);
        g.beginPath(); g.moveTo(px-nx*15,py-ny*15); g.lineTo(px+nx*15,py+ny*15); g.stroke(); }
    }
    g.globalAlpha=1;
    strokePoly(g,RAIL,ox,oy,CH,CH,2,'#3a3230');
    // two rails, offset
    g.globalAlpha=.8;
    for(const s of [-8,8]){
      const off = RAIL.map(p=>[p[0],p[1]+s]);
      strokePoly(g,off,ox,oy,CH,CH,2.4,'#8e8272');
    }
    g.globalAlpha=1;
  }
  // --- river (drawn over so banks read clean)
  if(strokePoly(g,RIVER,ox,oy,CH,CH,RIVER_W*2,C.water)){
    g.globalAlpha=.35; strokePoly(g,RIVER,ox,oy,CH,CH,RIVER_W*2+8,'rgba(33,26,28,.35)');
    g.globalAlpha=.30; strokePoly(g,RIVER,ox,oy,CH,CH,RIVER_W*1.1,'#6f8e94');
    g.globalAlpha=.22;
    for(let i=0;i<24;i++){
      const t=r(), p=plPoint(RIVER,t);
      const x=p[0]-ox+(r()-.5)*RIVER_W*1.4, y=p[1]-oy+(r()-.5)*40;
      g.strokeStyle=C.bone; g.lineWidth=1.2;
      g.beginPath(); g.moveTo(x-9,y); g.quadraticCurveTo(x,y-3,x+9,y); g.stroke();
    }
    g.globalAlpha=1;
  }
  // --- bridges
  for(const b of BRIDGES){
    if(b[0]<ox-90||b[0]>ox+CH+90||b[1]<oy-90||b[1]>oy+CH+90) continue;
    g.save(); g.translate(b[0]-ox,b[1]-oy);
    g.fillStyle='#6b5137'; g.fillRect(-70,-26,140,52);
    g.strokeStyle=C.ink; g.globalAlpha=.4; g.lineWidth=1.5;
    for(let i=-6;i<=6;i++){ g.beginPath(); g.moveTo(i*11,-26); g.lineTo(i*11,26); g.stroke(); }
    g.globalAlpha=.7; g.lineWidth=3;
    g.beginPath(); g.moveTo(-70,-26); g.lineTo(70,-26); g.moveTo(-70,26); g.lineTo(70,26); g.stroke();
    g.globalAlpha=1; g.restore();
  }
  // --- boardwalks
  for(const d of DECKS){
    if(d.x>ox+CH||d.x+d.w<ox||d.y>oy+CH||d.y+d.h<oy) continue;
    g.save(); g.translate(d.x-ox, d.y-oy);
    g.fillStyle='#8a6b45'; g.fillRect(0,0,d.w,d.h);
    g.globalAlpha=.30; g.strokeStyle=C.ink; g.lineWidth=1;
    for(let i=0;i<d.w;i+=13){ g.beginPath(); g.moveTo(i,0); g.lineTo(i,d.h); g.stroke(); }
    g.globalAlpha=.5; g.lineWidth=2;
    g.beginPath(); g.moveTo(0,d.h); g.lineTo(d.w,d.h); g.stroke();
    g.globalAlpha=1; g.restore();
  }
  return c;
}
// shade() is called ~8 times per figure per frame and used to build a fresh
// string every time — roughly a thousand throwaway strings a frame, which is
// what feeds the GC stalls. The set of (colour, amount) pairs is tiny, so cache.
const _shadeCache = new Map();
function shade(hex, amt){
  if(!hex || hex.charCodeAt(0)!==35) return hex;     // not '#rrggbb'
  let m = _shadeCache.get(hex);
  if(m===undefined){ m = new Map(); _shadeCache.set(hex, m); }
  const k = (amt*1000)|0;
  const hit = m.get(k);
  if(hit!==undefined) return hit;
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  r=clamp(Math.round(r+amt*255),0,255); g=clamp(Math.round(g+amt*255),0,255); b=clamp(Math.round(b+amt*255),0,255);
  const v = 'rgb('+r+','+g+','+b+')';
  m.set(k,v); return v;
}
function getChunk(cx,cy){
  const k = cx+','+cy;
  let e = chunkCache.get(k);
  if(!e){
    if(chunkCache.size>150){                      // evict least recently used
      let oldest=null, ot=1e18;
      for(const [kk,vv] of chunkCache){ if(vv.t<ot){ot=vv.t;oldest=kk;} }
      if(oldest) chunkCache.delete(oldest);
    }
    e = { c:makeChunk(cx,cy), t:chunkFrame };
    chunkCache.set(k,e);
  }
  e.t = chunkFrame;
  return e.c;
}
// The ground never changes between frames — only the camera does. So the
// visible chunks are composited ONCE into an oversized buffer and that buffer
// is blitted 1:1 each frame. Scaled bilinear blits of a dozen chunks every
// frame was the second most expensive thing in the game.
let tBuf=null, tBufW=0, tBufH=0, tValid=false;
const tCam={x:0,y:0,z:0};
const TMARGIN=224;
function invalidateTerrain(){ tValid=false; }

function drawTerrainDirect(){
  const halfW = W/(2*cam.z), halfH = H/(2*cam.z);
  const x0=Math.floor((cam.x-halfW)/CH), x1=Math.floor((cam.x+halfW)/CH);
  const y0=Math.floor((cam.y-halfH)/CH), y1=Math.floor((cam.y+halfH)/CH);
  const s=CH*cam.z;
  for(let cy=y0;cy<=y1;cy++) for(let cx=x0;cx<=x1;cx++){
    const c=getChunk(cx,cy);
    ctx.drawImage(c, w2sx(cx*CH)-.5, w2sy(cy*CH)-.5, s+1, s+1);
  }
}
function drawTerrain(){
  // While the zoom is actually changing the buffer would rebuild every frame,
  // which costs far more than it saves — so ride the direct path through the
  // transition and cache again once the zoom settles.
  if(Math.abs(cam.z-cam.tz) > 0.004){ tValid=false; drawTerrainDirect(); return; }
  const needW=W+TMARGIN*2, needH=H+TMARGIN*2;
  if(!tBuf || tBufW!==needW || tBufH!==needH){
    tBuf=document.createElement('canvas'); tBuf.width=needW; tBuf.height=needH;
    tBufW=needW; tBufH=needH; tValid=false;
  }
  const dx=(cam.x-tCam.x)*cam.z, dy=(cam.y-tCam.y)*cam.z;
  if(!tValid || Math.abs(cam.z-tCam.z)>0.0001 || Math.abs(dx)>TMARGIN-16 || Math.abs(dy)>TMARGIN-16){
    tCam.x=cam.x; tCam.y=cam.y; tCam.z=cam.z; tValid=true;
    const g=tBuf.getContext('2d');
    g.setTransform(1,0,0,1,0,0);
    const halfW=needW/(2*cam.z), halfH=needH/(2*cam.z);
    const x0=Math.floor((cam.x-halfW)/CH), x1=Math.floor((cam.x+halfW)/CH);
    const y0=Math.floor((cam.y-halfH)/CH), y1=Math.floor((cam.y+halfH)/CH);
    const s=CH*cam.z;
    for(let cy=y0;cy<=y1;cy++) for(let cx=x0;cx<=x1;cx++){
      const c=getChunk(cx,cy);
      const bx=(cx*CH-cam.x)*cam.z + needW/2;
      const by=(cy*CH-cam.y)*cam.z + needH/2;
      g.drawImage(c, bx-.5, by-.5, s+1, s+1);
    }
  }
  // Blit ONLY the visible window out of the buffer. Drawing the whole oversized
  // buffer means pushing 2.5x the screen's pixels every frame, which costs more
  // than the scaled chunk blits it replaced.
  const ox=Math.round(w2sx(tCam.x) - tBufW/2);
  const oy=Math.round(w2sy(tCam.y) - tBufH/2);
  const sxs=clamp(-ox, 0, tBufW-W), sys=clamp(-oy, 0, tBufH-H);
  ctx.drawImage(tBuf, sxs, sys, W, H, sxs+ox, sys+oy, W, H);
}

// ==========================================================================
//  PROPS — silhouette path is shared by object and its cast shadow.
// ==========================================================================
let shadowA = .30;
function shadowXform(h){ return { sx: sun.dx*0.62, sy: 0.30 }; }

// Every prop path is authored in local space with the BASE at (0,0), up = -y.
function propPath(p, s){
  const seed = p.seed;
  switch(p.t){
    case 'cactus': {
      const h = 34*s, w = 7*s;
      ctx.beginPath();
      rr(-w,-h,w*2,h+2,w);
      const armUp = (seed%3)-1;
      if(armUp>=0){ rr(w-1,-h*0.72,10*s,5*s,3*s); rr(w+5*s,-h*0.72,5*s,h*0.36,3*s); }
      if(armUp<=0){ rr(-w-10*s+1,-h*0.58,10*s,5*s,3*s); rr(-w-10*s,-h*0.58-h*0.3,5*s,h*0.32,3*s); }
      break;
    }
    case 'rock': { const w=9*s,h=7*s; ctx.beginPath();
      ctx.moveTo(-w,0); ctx.lineTo(-w*.7,-h); ctx.lineTo(w*.2,-h*1.25);
      ctx.lineTo(w,-h*.55); ctx.lineTo(w*.85,0); ctx.closePath(); break; }
    case 'boulder': { const w=17*s,h=16*s; ctx.beginPath();
      ctx.moveTo(-w,0); ctx.lineTo(-w*.85,-h*.55); ctx.lineTo(-w*.35,-h);
      ctx.lineTo(w*.25,-h*1.08); ctx.lineTo(w*.9,-h*.6); ctx.lineTo(w,0); ctx.closePath(); break; }
    case 'bush': { ctx.beginPath();
      for(let i=0;i<4;i++){ const a=i/4*TAU+(seed%7); const rx=(9+(i%3)*4)*s;
        ctx.moveTo(Math.cos(a)*7*s+rx, -8*s-Math.sin(a)*4*s);
        ctx.arc(Math.cos(a)*7*s, -8*s-Math.sin(a)*4*s, rx, 0, TAU); }
      break; }
    case 'grass': { ctx.beginPath();
      for(let i=0;i<5;i++){ const o=(i-2)*3*s, hh=(7+(seed>>i&3)*3)*s;
        ctx.moveTo(o-1.1*s,0); ctx.quadraticCurveTo(o+((seed>>i&1)?2:-2)*s,-hh*.6,o+((seed>>i&1)?5:-5)*s,-hh);
        ctx.quadraticCurveTo(o+1*s,-hh*.5,o+1.1*s,0); }
      break; }
    case 'bone': { const w=11*s; ctx.beginPath();
      ctx.ellipse(0,-3*s,w*.55,w*.42,0,0,TAU);
      ctx.moveTo(-w*.5,-4*s); ctx.lineTo(-w,-9*s); ctx.lineTo(-w*.72,-3*s);
      ctx.moveTo(w*.5,-4*s); ctx.lineTo(w,-9*s); ctx.lineTo(w*.72,-3*s);
      break; }
    case 'stump': { const w=10*s; ctx.beginPath(); rr(-w,-9*s,w*2,9*s,2); break; }
    case 'tree': { const h=40*s; ctx.beginPath();
      rr(-3.5*s,-h*.62,7*s,h*.62,2);
      for(let i=0;i<5;i++){ const a=(i/5)*TAU+ (seed%11)*.3;
        const rx=(13+((seed>>i)&3)*4)*s;
        ctx.moveTo(Math.cos(a)*11*s+rx, -h*.78+Math.sin(a)*7*s);
        ctx.arc(Math.cos(a)*11*s, -h*.78+Math.sin(a)*7*s, rx, 0, TAU); }
      break; }
    case 'fence': { ctx.beginPath(); rr(-2,-22*s,4,22*s,1); rr(-12,-18*s,24,3,1); rr(-12,-10*s,24,3,1); break; }
    case 'post': { ctx.beginPath(); rr(-3,-17*s,6,17*s,1.5); rr(-13,-15*s,26,3.5,1); break; }
    case 'barrel': { const w=10*s; ctx.beginPath(); rr(-w,-20*s,w*2,20*s,3*s); break; }
    case 'crate': { const w=11*s; ctx.beginPath(); rr(-w,-16*s,w*2,16*s,1.5); break; }
    case 'trough': { ctx.beginPath(); rr(-22*s,-11*s,44*s,11*s,2); break; }
    case 'grave': { ctx.beginPath();
      if(seed%3===0){ rr(-3,-24*s,6,24*s,1); rr(-10,-19*s,20,5,1); }
      else { ctx.moveTo(-8*s,0); ctx.lineTo(-8*s,-16*s);
        ctx.quadraticCurveTo(0,-26*s,8*s,-16*s); ctx.lineTo(8*s,0); ctx.closePath(); }
      break; }
    case 'sign': { ctx.beginPath(); rr(-2.5,-26*s,5,26*s,1); rr(-16*s,-30*s,32*s,14*s,2); break; }
    case 'tent': { const w=26*s,h=26*s; ctx.beginPath();
      ctx.moveTo(-w,0); ctx.lineTo(0,-h); ctx.lineTo(w,0); ctx.closePath(); break; }
    case 'lamp': { ctx.beginPath(); rr(-2.5,-34,5,34,1.5); rr(-6,-44,12,12,2); break; }
    case 'campfire': { const w=16*s; ctx.beginPath();
      ctx.moveTo(-w,-2); ctx.lineTo(w*.4,-9*s); ctx.lineTo(w*.5,-5*s); ctx.lineTo(-w*.9,2);
      ctx.moveTo(w,-2); ctx.lineTo(-w*.4,-9*s); ctx.lineTo(-w*.5,-5*s); ctx.lineTo(w*.9,2);
      break; }
    case 'tower': { const w=26*s; ctx.beginPath();
      rr(-w*.8,-30*s,5,30*s,1); rr(w*.8-5,-30*s,5,30*s,1);
      rr(-w,-64*s,w*2,36*s,4); ctx.moveTo(-w*1.12,-64*s); ctx.lineTo(0,-80*s); ctx.lineTo(w*1.12,-64*s); ctx.closePath();
      break; }
    case 'well': { const w=17*s; ctx.beginPath(); rr(-w,-11*s,w*2,11*s,4);
      rr(-w*.85,-40*s,4,30*s,1); rr(w*.85-4,-40*s,4,30*s,1);
      ctx.moveTo(-w*1.1,-40*s); ctx.lineTo(0,-52*s); ctx.lineTo(w*1.1,-40*s); ctx.closePath(); break; }
    case 'gallows': { ctx.beginPath(); rr(-26,-4,52,4,1); rr(-22,-62,6,62,1); rr(-22,-62,46,6,1);
      rr(10,-56,2.5,26,1); break; }
    case 'wagon': { const w=30*s; ctx.beginPath(); rr(-w,-16*s,w*2,16*s,2);
      ctx.moveTo(-w*.9,-16*s); ctx.quadraticCurveTo(0,-42*s,w*.9,-16*s); ctx.closePath(); break; }
    // ---- interior furniture. Authored from the same base-at-(0,0) rule, so it
    //      casts the same raked shadow as everything outdoors.
    case 'bar':    { ctx.beginPath(); rr(-120,-34,240,34,3); break; }
    case 'counter':{ ctx.beginPath(); rr(-100,-32,200,32,3); break; }
    case 'table':  { ctx.beginPath(); ctx.ellipse(0,-14,26,18,0,0,TAU); break; }
    case 'chair':  { ctx.beginPath(); rr(-9,-20,18,20,2); rr(-9,-30,18,10,2); break; }
    case 'piano':  { ctx.beginPath(); rr(-30,-40,60,40,3); rr(-26,-46,52,8,2); break; }
    case 'shelf':  { ctx.beginPath(); rr(-15,-56,30,56,2); break; }
    case 'rack':   { ctx.beginPath(); rr(-13,-48,26,48,2); break; }
    case 'desk':   { ctx.beginPath(); rr(-55,-28,110,28,2); break; }
    case 'cell':   { ctx.beginPath(); rr(-75,-70,150,14,2);
                     for(let i=-4;i<=4;i++) rr(i*16-2,-70,4,70,1); break; }
    case 'vault':  { ctx.beginPath(); rr(-60,-64,120,64,4); break; }
    case 'bed':    { ctx.beginPath(); rr(-55,-30,110,30,4); rr(-55,-38,34,12,3); break; }
    case 'altar':  { ctx.beginPath(); rr(-60,-40,120,40,3); rr(-5,-74,10,36,2); rr(-20,-62,50,10,2); break; }
    case 'pew':    { ctx.beginPath(); rr(-60,-16,120,16,2); rr(-60,-34,120,10,2); break; }
    case 'stall':  { ctx.beginPath(); rr(-50,-54,100,54,2); break; }
    case 'hay':    { ctx.beginPath(); ctx.ellipse(0,-18,22,18,0,0,TAU); break; }
    case 'ilamp':  { ctx.beginPath(); ctx.arc(0,-8,9,0,TAU); break; }
    default: { ctx.beginPath(); ctx.arc(0,-6*s,6*s,0,TAU); }
  }
}
function rr(x,y,w,h,r){  // rounded-rect subpath appended to current path
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
}

// only these earn a lit rim — small scatter reads better flat and costs nothing
const BIGPROP = { boulder:1, tree:1, cactus:1, tower:1, well:1, wagon:1, tent:1,
                  gallows:1, barrel:1, crate:1, trough:1, grave:1, sign:1 };
const PCOL = {
  cactus:'#5d7245', rock:'#9b7a5e', boulder:'#8e6b50', bush:'#67754a', grass:'#7d8a55',
  bone:'#e0d4b6', stump:'#6a5038', tree:'#5c6b40', fence:'#6b5137', post:'#6b5137',
  barrel:'#7a5a38', crate:'#8a6b45', trough:'#6b5137', grave:'#a99e86', sign:'#6b5137',
  tent:'#b7a582', lamp:'#4a4038', campfire:'#4a3a2a', tower:'#7a5f42', well:'#9b8a70',
  gallows:'#5c4530', wagon:'#7a5a38',
  bar:'#6b4326', counter:'#7a5636', table:'#6e4a2c', chair:'#5f4028', piano:'#3a2a22',
  shelf:'#7a5636', rack:'#5f4028', desk:'#6b4a2e', cell:'#5a5550', vault:'#8a8477',
  bed:'#b0a288', altar:'#c3b596', pew:'#6b4a2e', stall:'#7a5a3a', hay:'#c9a94a',
  ilamp:'#f0b429'
};
function drawPropShadow(p){
  if(shadowA<=0.02) return;
  const sx=w2sx(p.x), sy=w2sy(p.y), z=cam.z, s=p.s;
  ctx.save(); ctx.translate(sx,sy); ctx.scale(z,z);
  ctx.transform(1,0,-sun.dx*.42,0.26,0,0);
  ctx.globalAlpha=shadowA; ctx.fillStyle=C.ink;
  propPath(p,s); ctx.fill(); ctx.restore();
  ctx.globalAlpha=1;
}
function drawProp(p){
  const sx=w2sx(p.x), sy=w2sy(p.y), z=cam.z, s=p.s;
  // ---- body
  ctx.save(); ctx.translate(sx,sy); ctx.scale(z,z);
  // Sunlit rim: a lighter copy of the SAME path, offset toward the light and
  // drawn first, so the body covers all but a crescent on the lit side.
  // (A ctx.clip() per prop cost ~10ms/frame at 300 visible props. This is free.)
  if(BIGPROP[p.t] || s>1.3){
    ctx.save(); ctx.translate(-sun.dx*1.9, -1.9);
    ctx.globalAlpha=.55*(0.3+daylight()*0.7); ctx.fillStyle=C.bone;
    propPath(p,s); ctx.fill(); ctx.restore();
  }
  ctx.fillStyle = PCOL[p.t]||'#8a6b45';
  propPath(p,s); ctx.fill();
  ctx.globalAlpha=.55; ctx.lineWidth=1.4; ctx.strokeStyle=C.ink; ctx.stroke();
  ctx.globalAlpha=1;
  // ---- extras
  if(p.t==='barrel'){ ctx.globalAlpha=.5; ctx.strokeStyle=C.ink; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(-10*s,-15*s); ctx.lineTo(10*s,-15*s);
    ctx.moveTo(-10*s,-6*s); ctx.lineTo(10*s,-6*s); ctx.stroke(); ctx.globalAlpha=1; }
  if(p.t==='crate'){ ctx.globalAlpha=.45; ctx.strokeStyle=C.ink; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(-11*s,-16*s); ctx.lineTo(11*s,0);
    ctx.moveTo(11*s,-16*s); ctx.lineTo(-11*s,0); ctx.stroke(); ctx.globalAlpha=1; }
  if(p.t==='wagon'){ ctx.fillStyle='#3d2e22';
    for(const wx of [-20*s,20*s]){ ctx.beginPath(); ctx.arc(wx,0,8*s,0,TAU); ctx.fill();
      ctx.strokeStyle='#6b5137'; ctx.lineWidth=1.5; ctx.stroke(); } }
  if(p.t==='grave'&&p.seed%3!==0){ ctx.globalAlpha=.4; ctx.strokeStyle=C.ink; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(-4*s,-14*s); ctx.lineTo(4*s,-14*s);
    ctx.moveTo(-4*s,-9*s); ctx.lineTo(4*s,-9*s); ctx.stroke(); ctx.globalAlpha=1; }
  if(p.t==='campfire'){
    const f = Math.sin(now*9+p.seed)*0.5+0.5;
    ctx.fillStyle='#e07b21'; ctx.globalAlpha=.9;
    ctx.beginPath(); ctx.moveTo(-7*s,-4); ctx.quadraticCurveTo(-3*s,-(16+f*8)*s,0,-(24+f*10)*s);
    ctx.quadraticCurveTo(3*s,-(16+f*8)*s,7*s,-4); ctx.closePath(); ctx.fill();
    ctx.fillStyle=C.gold;
    ctx.beginPath(); ctx.moveTo(-4*s,-4); ctx.quadraticCurveTo(-1*s,-(10+f*6)*s,0,-(15+f*7)*s);
    ctx.quadraticCurveTo(1*s,-(10+f*6)*s,4*s,-4); ctx.closePath(); ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.restore();
  // ---- lantern / fire light into the additive buffer
  if(p.t==='ilamp') addLight(p.x,p.y-8,190,'#ffc766',.38+Math.sin(now*3+p.seed)*.05);
  if(p.t==='lamp' && isNight()) addLight(p.x,p.y-34,120,C.gold,.55);
  if(p.t==='campfire') addLight(p.x,p.y-8,190,'#ff9a3c',.75+Math.sin(now*7+p.seed)*.12);
}

// ==========================================================================
//  BUILDINGS — top-down, roof-lettered, one raked shadow.
// ==========================================================================
const ROOF = {
  saloon:'#8a4b34', store:'#6e5a3e', bank:'#8a8677', sheriff:'#54627d', doctor:'#7a6a52',
  gunsmith:'#5f4a3a', stable:'#7a5a3a', house:'#6b503a', barn:'#9a4331', church:'#c9bd9e',
  shack:'#5a4634', depot:'#6a5140', mine:'#5b4a3c', manor:'#7b6448', ruin:'#a2947a'
};
function drawWall(b){
  const sx=w2sx(b.x), sy=w2sy(b.y), z=cam.z;
  ctx.save(); ctx.translate(sx,sy); ctx.scale(z,z);
  const hw=b.w/2, hh=b.h/2;
  ctx.fillStyle='#4b3627';
  ctx.beginPath(); rr(-hw,-hh,b.w,b.h,2); ctx.fill();
  ctx.fillStyle='#6a4c33';
  ctx.beginPath(); rr(-hw,-hh,b.w,b.h-4,2); ctx.fill();
  ctx.globalAlpha=.20; ctx.strokeStyle=C.ink; ctx.lineWidth=1;
  ctx.beginPath();
  if(b.w>b.h){ for(let x=-hw+11;x<hw;x+=15){ ctx.moveTo(x,-hh); ctx.lineTo(x,hh-4); } }
  else { for(let y=-hh+11;y<hh;y+=15){ ctx.moveTo(-hw,y); ctx.lineTo(hw,y); } }
  ctx.stroke();
  ctx.globalAlpha=.65; ctx.strokeStyle=C.ink; ctx.lineWidth=1.8;
  ctx.beginPath(); rr(-hw,-hh,b.w,b.h,2); ctx.stroke();
  ctx.globalAlpha=.16; ctx.fillStyle=C.bone;
  ctx.fillRect(-hw,-hh,b.w,Math.min(5,b.h*0.3));
  ctx.globalAlpha=1; ctx.restore();
}
function drawWallShadow(b){
  if(shadowA<=.02) return;
  const sx=w2sx(b.x), sy=w2sy(b.y), z=cam.z;
  ctx.save(); ctx.translate(sx,sy); ctx.scale(z,z);
  ctx.transform(1,0,-sun.dx*.42,0.26,0,0);
  ctx.globalAlpha=shadowA*0.7; ctx.fillStyle=C.ink;
  ctx.beginPath(); rr(-b.w/2,-b.h/2-18,b.w,b.h+18,2); ctx.fill();
  ctx.restore(); ctx.globalAlpha=1;
}
function drawBuildingShadow(b){
  if(shadowA<.02) return;
  const sx=w2sx(b.x), sy=w2sy(b.y), z=cam.z;
  const hh = b.kind==='church'||b.kind==='manor' ? 46 : 32;
  ctx.save(); ctx.translate(sx,sy); ctx.scale(z,z);
  ctx.transform(1,0,-sun.dx*.42,0.26,0,0);
  ctx.globalAlpha=shadowA*0.78; ctx.fillStyle=C.ink;
  ctx.beginPath(); rr(-b.w/2,-b.h/2-hh,b.w,b.h+hh,3); ctx.fill();
  ctx.restore();
}
function drawBuilding(b){
  const sx=w2sx(b.x), sy=w2sy(b.y), z=cam.z;
  const col = ROOF[b.kind]||'#6b503a';
  ctx.save(); ctx.translate(sx,sy); ctx.scale(z,z);
  const hw=b.w/2, hh=b.h/2;

  // worn earth pad
  ctx.globalAlpha=.25; ctx.fillStyle=C.sand2;
  ctx.beginPath(); rr(-hw-12,-hh-12,b.w+24,b.h+24,8); ctx.fill(); ctx.globalAlpha=1;

  // eave (darker outline block, slightly larger than the roof)
  ctx.fillStyle = shade(col,-.10);
  ctx.beginPath(); rr(-hw-5,-hh-5,b.w+10,b.h+10,3); ctx.fill();
  // roof
  ctx.fillStyle = col;
  ctx.beginPath(); rr(-hw,-hh,b.w,b.h,2); ctx.fill();
  // planks
  ctx.globalAlpha=.16; ctx.strokeStyle=C.ink; ctx.lineWidth=1;
  ctx.beginPath();
  for(let x=-hw+10;x<hw;x+=14){ ctx.moveTo(x,-hh); ctx.lineTo(x,hh); }
  ctx.stroke();
  // ridge
  ctx.globalAlpha=.34; ctx.lineWidth=2.5; ctx.beginPath();
  ctx.moveTo(-hw,0); ctx.lineTo(hw,0); ctx.stroke();
  ctx.globalAlpha=.18; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(-hw,-3); ctx.lineTo(hw,-3); ctx.stroke();
  ctx.globalAlpha=1;
  // sun-struck half of the roof
  ctx.save(); ctx.beginPath(); rr(-hw,-hh,b.w,b.h,2); ctx.clip();
  ctx.globalAlpha=.16*(0.25+daylight()*.75); ctx.fillStyle=C.bone;
  ctx.fillRect(-hw, sun.dy>0?-hh:0, b.w, b.h/2);
  ctx.restore();
  // outline
  ctx.globalAlpha=.6; ctx.strokeStyle=C.ink; ctx.lineWidth=2;
  ctx.beginPath(); rr(-hw-5,-hh-5,b.w+10,b.h+10,3); ctx.stroke(); ctx.globalAlpha=1;

  // chimney
  if(b.kind==='house'||b.kind==='manor'||b.kind==='shack'){
    ctx.fillStyle=shade(col,-.2); ctx.beginPath(); rr(hw-26,-hh+10,13,13,2); ctx.fill();
    ctx.globalAlpha=.5; ctx.strokeStyle=C.ink; ctx.lineWidth=1.4; ctx.stroke(); ctx.globalAlpha=1;
  }
  // steeple for churches
  if(b.kind==='church'){
    ctx.fillStyle=shade(col,-.14);
    ctx.beginPath(); ctx.arc(0,-hh+30,17,0,TAU); ctx.fill();
    ctx.globalAlpha=.6; ctx.strokeStyle=C.ink; ctx.lineWidth=2; ctx.stroke(); ctx.globalAlpha=1;
    ctx.strokeStyle=C.ink; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(0,-hh+22); ctx.lineTo(0,-hh+40);
    ctx.moveTo(-7,-hh+29); ctx.lineTo(7,-hh+29); ctx.stroke();
  }
  // awning + porch posts on the facing side
  const f=b.face, ay=f>0? hh+2 : -hh-2;
  ctx.fillStyle='#9d7c53';
  ctx.beginPath(); rr(-hw-4, f>0?ay:ay-20, b.w+8, 20, 2); ctx.fill();
  ctx.globalAlpha=.28; ctx.strokeStyle=C.ink; ctx.lineWidth=1;
  ctx.beginPath();
  for(let x=-hw;x<hw;x+=12){ ctx.moveTo(x, f>0?ay:ay-20); ctx.lineTo(x, f>0?ay+20:ay); }
  ctx.stroke(); ctx.globalAlpha=.55; ctx.lineWidth=1.8;
  ctx.beginPath(); rr(-hw-4, f>0?ay:ay-20, b.w+8, 20, 2); ctx.stroke(); ctx.globalAlpha=1;
  ctx.fillStyle=C.ink;
  for(const px of [-hw+6, 0, hw-6]){ ctx.globalAlpha=.7;
    ctx.beginPath(); ctx.arc(px, f>0?ay+17:ay-17, 3, 0, TAU); ctx.fill(); }
  ctx.globalAlpha=1;
  // door
  const dy = f>0? hh-9 : -hh+9;
  ctx.fillStyle = isNight()? C.gold : '#3a2a20';
  ctx.beginPath(); rr(-9, dy-7, 18, 14, 2); ctx.fill();
  ctx.globalAlpha=.7; ctx.strokeStyle=C.ink; ctx.lineWidth=1.6; ctx.stroke(); ctx.globalAlpha=1;
  // windows
  if(b.w>100){
    ctx.fillStyle = isNight()? C.gold : '#4a3a2e';
    for(const wx of [-hw+20, hw-30]){
      ctx.globalAlpha=isNight()?.9:.55;
      ctx.beginPath(); rr(wx, dy-6, 11, 11, 1.5); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  // roof lettering — the sign is painted where you can read it
  if(b.name && b.w>=120){
    ctx.save();
    ctx.globalAlpha=.55; ctx.fillStyle=C.ink;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    let fs = Math.min(15, b.w/(b.name.length*0.62));
    ctx.font = fs+'px '+FD;
    ctx.fillText(b.name, 0, f>0? -hh*0.45 : hh*0.45);
    ctx.restore();
  }
  ctx.restore();
  if(isNight()) addLight(b.dx, b.dy, 110, C.gold, .35);
}

// ==========================================================================
//  GUN SILHOUETTES
//  Top-down, muzzle toward +x, hand at the origin. One spec per model rather
//  than one draw function per model.
//
//  RARITY HAS TO SCREAM, so it escalates through the whole object, not a decal:
//    COMMON     dull pitted iron, plain wood, nothing added
//    FINE       blued steel, a brass band and buttplate
//    RARE       engraved receiver, a named grip material, a muzzle device
//    LEGENDARY  the gun stops being a gun and becomes a phenomenon — oversized,
//               gold-furnished, and carrying an ALWAYS-ON effect with its own
//               saturated signature colour, plus a motif orbiting or burning
//               on it. Holding one changes the player too.
//
//  Shape knobs (so two revolvers are not the same rectangle):
//    bl/bw barrel · cyl cylinder · stk stock · scp scope · twin double barrels
//    gat barrel cluster · drum disc magazine · tube under-barrel tube
//    muz muzzle device · lever lever loop · sight front blade · eng engraving
//    taper barrel narrows · glow signature colour · motif cards|cross|notch|vents
// ==========================================================================

for(const k in GUNS){ GUNS[k].id=k; GUNS[k].art=GUN_ART[k]; }

// A gun is the same shape every frame, so it is baked once into a small sprite
// and blitted. That removes ~10 path fills and ~10 strokes per armed figure,
// which at 40-odd armed figures was most of the frame's path work.
// Legendaries stay live — their cards orbit, their vents pulse, their barrels spin.
const gunSpr = Object.create(null);
// Baked at SS times the on-screen size. A sprite rasterised at its own tiny
// local scale goes soft the moment the camera magnifies and rotates it; at 4x
// there is enough detail left that it is indistinguishable from the vectors.
const GUN_SS = 4;
function getGunSprite(g, sc){
  const key = g.id+'|'+sc.toFixed(3);
  let s = gunSpr[key]; if(s) return s;
  const a=g.art, pad=4, bs=sc*GUN_SS;
  const x0=-((a.stk? a.stk+3 : 4))*bs, x1=(3.4+a.bl+4.5)*bs;
  const y0=-7*bs, y1=7*bs;
  const c=document.createElement('canvas');
  c.width =Math.max(2, Math.ceil(x1-x0)+pad*2);
  c.height=Math.max(2, Math.ceil(y1-y0)+pad*2);
  s={ c:c, ox:-x0+pad, oy:-y0+pad };
  const prev=ctx;
  try{
    ctx=c.getContext('2d');
    ctx.translate(s.ox, s.oy);
    drawGunBody(g, bs);
  } finally { ctx=prev; }
  gunSpr[key]=s; return s;
}
function drawGunArt(g, sc, full){
  const a = g && g.art; if(!a) return;
  if(g.rar<3){                       // bake-able: nothing on it moves
    const s=getGunSprite(g, sc);
    ctx.save(); ctx.scale(1/GUN_SS, 1/GUN_SS);
    ctx.drawImage(s.c, -s.ox, -s.oy);
    ctx.restore();
    return;
  }
  drawGunBody(g, sc);
}
function drawGunBody(g, sc){
  const a = g && g.art; if(!a) return;
  const rar = g.rar;
  const metal = a.metal||'#3d3734';
  const wood  = a.wood ||'#6b4a2e';
  const gold  = '#d8a63a';
  const bw=a.bw*sc, bl=a.bl*sc, x0=3.4*sc, rec=(a.rec||5.0);
  ctx.lineJoin='round'; ctx.lineWidth=1.05*sc; ctx.strokeStyle=C.ink;
  function piece(fill){ ctx.fillStyle=fill; ctx.fill(); ctx.stroke(); }

  // ---- stock
  if(a.stk){
    ctx.beginPath();
    ctx.moveTo(-1*sc,-1.5*sc);
    ctx.lineTo(-a.stk*sc,-2.9*sc);
    ctx.quadraticCurveTo(-(a.stk+1.3)*sc, 0, -a.stk*sc, 2.5*sc);
    ctx.lineTo(-1*sc, 1.8*sc);
    ctx.closePath(); piece(wood);
    if(rar>=1){ // brass buttplate
      ctx.beginPath(); rr(-(a.stk+0.5)*sc, -2.6*sc, 1.4*sc, 5.0*sc, 0.5*sc);
      piece(rar===3? gold : (a.band||'#9a7b46')); }
    if(a.motif==='notch'){ // the widow's tally, cut into the stock
      ctx.strokeStyle='rgba(232,220,192,.55)'; ctx.lineWidth=0.6*sc;
      for(let i=0;i<6;i++){ const x=-(2.4+i*1.25)*sc;
        ctx.beginPath(); ctx.moveTo(x,-1.9*sc); ctx.lineTo(x,0.9*sc); ctx.stroke(); }
      ctx.strokeStyle=C.ink; ctx.lineWidth=1.05*sc;
    }
  }
  // ---- magazine tube under the barrel
  if(a.tube){ ctx.beginPath(); rr(x0, bw*0.55, a.tube*sc, 1.5*sc, 0.6*sc); piece(shade(metal,-.05)); }
  if(a.lever){ ctx.beginPath(); rr(0.4*sc, 1.3*sc, 3.8*sc, 1.6*sc, 0.75*sc); piece(shade(metal,.06)); }
  // ---- grip
  ctx.beginPath();
  if(a.snub) rr(-2.0*sc,-0.5*sc, 3.6*sc, 3.2*sc, 1.5*sc);   // bird's head
  else rr(-2.4*sc,-0.5*sc, 4.4*sc, 3.8*sc, 1.1*sc);          // plough handle
  piece(a.grip||wood);
  // ---- receiver
  ctx.beginPath(); rr(-1.8*sc, -1.45*sc, rec*sc, 2.9*sc, 0.8*sc); piece(metal);
  if(a.pit){ ctx.fillStyle='rgba(120,90,60,.45)';           // rust pitting
    for(let i=0;i<5;i++) ctx.fillRect((-1.2+i*0.9)*sc, (-0.9+(i%2)*1.2)*sc, 0.7*sc, 0.7*sc); }
  if(a.eng){ ctx.strokeStyle= rar===3? gold : 'rgba(210,180,120,.6)'; ctx.lineWidth=0.5*sc;
    for(let i=0;i<4;i++){ const x=(-1.2+i*1.1)*sc;
      ctx.beginPath(); ctx.moveTo(x,-1.0*sc); ctx.lineTo(x+0.7*sc,1.0*sc); ctx.stroke(); }
    ctx.strokeStyle=C.ink; ctx.lineWidth=1.05*sc; }
  // ---- cylinder / drum
  if(a.cyl){ const cw=(a.cw||3.8);
    ctx.beginPath(); rr(0.9*sc, -cw*0.5*sc, 3.1*sc, cw*sc, 1.2*sc); piece(shade(metal,.10));
    ctx.fillStyle='rgba(20,15,16,.55)';
    for(let i=-1;i<=1;i++){ ctx.beginPath();
      ctx.arc(2.4*sc, i*(cw*0.31)*sc, 0.48*sc, 0, TAU); ctx.fill(); } }
  if(a.drum){ ctx.beginPath(); ctx.arc(x0+1.0*sc, 0, a.drum*sc, 0, TAU); piece(shade(metal,.12));
    ctx.beginPath(); ctx.arc(x0+1.0*sc, 0, a.drum*0.42*sc, 0, TAU); piece(shade(metal,-.10)); }
  // ---- barrels
  if(a.twin){
    ctx.beginPath(); rr(x0,-2.8*sc, bl, bw, bw*0.45); piece(metal);
    ctx.beginPath(); rr(x0, 0.5*sc, bl, bw, bw*0.45); piece(shade(metal,-.05));
  } else if(a.gat){
    const spin = a.spin? now*(P&&P.abMode==='spin'?14:1.6) : 0;
    for(let i=-1;i<=1;i++){
      const yy = Math.sin(spin + i*2.094)*2.4*sc;
      ctx.beginPath(); rr(x0, yy-bw/2, bl, bw, bw*0.4);
      piece(shade(metal, 0.10*Math.cos(spin+i*2.094)));
    }
  } else {
    if(a.taper){ ctx.beginPath();
      ctx.moveTo(x0,-bw/2); ctx.lineTo(x0+bl,-bw*0.34); ctx.lineTo(x0+bl,bw*0.34); ctx.lineTo(x0,bw/2);
      ctx.closePath(); piece(metal);
    } else { ctx.beginPath(); rr(x0, -bw/2, bl, bw, bw*0.4); piece(metal); }
  }
  // ---- muzzle device
  if(a.muz){
    ctx.beginPath(); rr(x0+bl-2.0*sc, -a.muz*sc/2, 2.4*sc, a.muz*sc, 0.6*sc); piece(shade(metal,.14));
    if(a.saw){ ctx.fillStyle=shade(metal,.2);   // filed to a snarl
      for(let i=0;i<4;i++){ ctx.beginPath();
        ctx.moveTo(x0+bl+0.4*sc, (-a.muz/2+i*a.muz/4)*sc);
        ctx.lineTo(x0+bl+1.6*sc, (-a.muz/2+(i+0.5)*a.muz/4)*sc);
        ctx.lineTo(x0+bl+0.4*sc, (-a.muz/2+(i+1)*a.muz/4)*sc);
        ctx.closePath(); ctx.fill(); } }
  }
  if(a.sight){ ctx.beginPath(); rr(x0+bl-1.4*sc, -bw*0.9, 0.8*sc, bw*0.8, 0.2*sc); piece(shade(metal,.2)); }
  // ---- scope
  if(a.scp){
    ctx.beginPath(); rr(2.4*sc, -4.2*sc, a.scp*sc, 3.0*sc, 1.0*sc); piece(shade(metal,-.05));
    if(rar>=2){ ctx.fillStyle= rar===3? gold : '#9a7b46';
      ctx.beginPath(); rr(2.4*sc, -4.2*sc, 1.1*sc, 3.0*sc, 0.5*sc); ctx.fill(); }
    ctx.fillStyle = a.glow || '#9ec0d4';
    ctx.beginPath(); ctx.arc((2.4+a.scp-0.8)*sc, -2.7*sc, 0.95*sc, 0, TAU); ctx.fill();
  }
  // ---- the rarity ladder, spelled out on the object
  // FINE: a brass band wide enough to survive at 30px on screen
  if(rar===1){ ctx.beginPath(); rr(x0+0.5*sc, -bw*0.95, 2.4*sc, bw*1.9, 0.5*sc); piece(a.band||'#c9932f'); }
  // RARE: a bright brass frame block AND a collar on the barrel
  if(rar===2){ ctx.beginPath(); rr(-1.9*sc, -1.6*sc, 3.0*sc, 3.2*sc, 0.7*sc); piece('#e0b855');
    ctx.beginPath(); rr(x0+0.4*sc, -bw*0.95, 1.8*sc, bw*1.9, 0.5*sc); piece('#e0b855'); }
  if(rar===3) drawLegendaryDress(a, sc, bl, bw, x0);
}

// A legendary is not a common gun with gold on it. It is always doing something.
function drawLegendaryDress(a, sc, bl, bw, x0){
  const gold='#d8a63a', glow=a.glow||'#f0b429';
  // gold furniture down the whole frame
  ctx.beginPath(); rr(-1.9*sc, -1.6*sc, 2.6*sc, 3.2*sc, 0.7*sc); piece2(gold);
  ctx.beginPath(); rr(x0-0.4*sc, -bw*0.9, 1.5*sc, bw*1.8, 0.5*sc); piece2(gold);
  function piece2(f){ ctx.fillStyle=f; ctx.fill(); ctx.strokeStyle=C.ink; ctx.lineWidth=1.0*sc; ctx.stroke(); }

  // The always-on effect must be a SHAPE, not a blur. A soft halo reads as a
  // smudge at 30px and washes the frame; a crisp orbiting card or a cold sight
  // line still reads, and still says "this is not an ordinary gun".
  const pulse = 0.6 + Math.sin(now*3)*0.2;
  if(a.motif==='cross'){                       // JUDGMENT — the preacher's iron
    ctx.fillStyle=gold;
    ctx.beginPath(); rr(0.2*sc,-0.6*sc, 5.0*sc, 1.2*sc, 0.3*sc); ctx.fill();
    ctx.beginPath(); rr(2.0*sc,-2.6*sc, 1.2*sc, 5.2*sc, 0.3*sc); ctx.fill();
    for(const yy of [-2.2, 1.9]){              // twin mouths burning, always
      ctx.globalAlpha=pulse; ctx.fillStyle=glow;
      ctx.beginPath(); ctx.arc(x0+bl-0.2*sc, yy*sc, 2.1*sc,0,TAU); ctx.fill();
      ctx.globalAlpha=pulse*0.9; ctx.fillStyle='#ffe6a8';
      ctx.beginPath(); ctx.arc(x0+bl-0.2*sc, yy*sc, 1.0*sc,0,TAU); ctx.fill();
    }
    ctx.globalAlpha=1;
  } else if(a.motif==='cards'){                // DEAD MAN'S HAND — aces and eights
    ctx.fillStyle=gold;
    ctx.beginPath(); ctx.arc(2.4*sc, 0, 1.7*sc, 0, TAU); ctx.fill();
    ctx.fillStyle=C.ink;
    ctx.beginPath();                            // a spade cut into the cylinder
    ctx.moveTo(2.4*sc,-1.1*sc); ctx.lineTo(3.3*sc,0.1*sc);
    ctx.lineTo(1.5*sc,0.1*sc); ctx.closePath(); ctx.fill();
    ctx.fillRect(2.2*sc, 0.0*sc, 0.4*sc, 1.0*sc);
    for(let i=0;i<2;i++){                       // two cards riding the air beside it
      const ang = now*1.5 + i*Math.PI;
      const cx2 = 3.0*sc + Math.cos(ang)*5.4*sc, cy2 = Math.sin(ang)*4.2*sc;
      ctx.save(); ctx.translate(cx2, cy2); ctx.rotate(ang*0.8);
      ctx.globalAlpha=.9; ctx.fillStyle='#f4ead2';
      ctx.beginPath(); rr(-1.4*sc,-2.0*sc, 2.8*sc, 4.0*sc, 0.5*sc); ctx.fill();
      ctx.strokeStyle=C.ink; ctx.lineWidth=0.7*sc; ctx.stroke();
      ctx.fillStyle=i? C.ink : '#9b2a22';
      ctx.beginPath(); ctx.arc(0,0,0.85*sc,0,TAU); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha=1;
  } else if(a.motif==='vents'){                // IRON HORSE — heat between barrels
    ctx.globalAlpha=pulse; ctx.fillStyle=glow;
    for(let i=0;i<5;i++){ ctx.beginPath();
      ctx.arc(x0+(2.2+i*3.2)*sc, 0, 1.7*sc, 0, TAU); ctx.fill(); }
    ctx.globalAlpha=pulse*.75; ctx.fillStyle='#ffd08a';
    for(let i=0;i<5;i++){ ctx.beginPath();
      ctx.arc(x0+(2.2+i*3.2)*sc, 0, 0.8*sc, 0, TAU); ctx.fill(); }
    ctx.globalAlpha=1;
  } else if(a.motif==='notch'){                // WIDOWMAKER — a cold line of sight
    ctx.globalAlpha=.42+Math.sin(now*2.2)*.12;
    ctx.fillStyle=glow;
    ctx.beginPath();
    ctx.moveTo(x0+bl*1.0, -0.7*sc);
    ctx.lineTo(x0+bl+17*sc, -0.12*sc);
    ctx.lineTo(x0+bl+17*sc,  0.12*sc);
    ctx.lineTo(x0+bl*1.0,  0.7*sc);

}

const PMAX = 1400;
const parts = new Array(PMAX);
for(let i=0;i<PMAX;i++) parts[i] = {a:false};
let pHead = 0;
function spawnP(x,y,vx,vy,life,size,col,type,opt){
  let p=null;
  for(let i=0;i<PMAX;i++){ const q=parts[(pHead+i)%PMAX]; if(!q.a){ p=q; pHead=(pHead+i+1)%PMAX; break; } }
  if(!p) { p = parts[pHead]; pHead=(pHead+1)%PMAX; }
  opt=opt||{};
  p.a=true; p.x=x; p.y=y; p.vx=vx; p.vy=vy; p.life=life; p.max=life;
  p.size=size; p.col=col; p.type=type;

  p.grav = opt.grav||0;
  p.rot = opt.rot==null?Math.random()*TAU:opt.rot;
  p.vr  = opt.vr==null?(Math.random()-.5)*10:opt.vr;
  p.z   = opt.z||0; p.vz = opt.vz||0;

}
function updateParts(d){
  for(let i=0;i<PMAX;i++){ const p=parts[i]; if(!p.a) continue;
    p.life-=d; if(p.life<=0){ p.a=false; continue; }
    p.x+=p.vx*d; p.y+=p.vy*d;
    p.vy+=p.grav*d;
    const f=Math.pow(p.drag,d*60); p.vx*=f; p.vy*=f;
    p.rot+=p.vr*d;
    if(p.vz){ p.z+=p.vz*d; p.vz-=900*d; if(p.z<0){ p.z=0; p.vz*=-0.4; p.vx*=.6; p.vy*=.6; } }

// A fire mote rebuilt a three-stop radial gradient every frame, hundreds of
// times over during sustained fire. Bake one blob per colour and blit it.
const _fireSpr = Object.create(null);
function getFireSprite(col){
  let s=_fireSpr[col]; if(s) return s;
  const R=32, c=document.createElement('canvas'); c.width=c.height=R*2;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(R,R,0,R,R,R);
  gr.addColorStop(0,'#fff0c0'); gr.addColorStop(.4,col); gr.addColorStop(1,'rgba(158,43,37,0)');
  g.fillStyle=gr; g.fillRect(0,0,R*2,R*2);
  _fireSpr[col]=c; return c;
}
function drawParts(){
  const z=cam.z;
  for(let i=0;i<PMAX;i++){ const p=parts[i]; if(!p.a) continue;
    const t=p.life/p.max;
    const sx=w2sx(p.x), sy=w2sy(p.y)-p.z*z;
    if(sx<-40||sy<-40||sx>W+40||sy>H+40) continue;
    ctx.save(); ctx.translate(sx,sy);
    switch(p.type){
      case 'dust': ctx.globalAlpha=t*.34; ctx.fillStyle=p.col;
        ctx.beginPath(); ctx.arc(0,0,p.size*(2-t)*z,0,TAU); ctx.fill(); break;
      case 'smoke': ctx.globalAlpha=t*.30; ctx.fillStyle=p.col;
        ctx.beginPath(); ctx.arc(0,0,p.size*(2.4-t*1.4)*z,0,TAU); ctx.fill(); break;
      case 'blood': ctx.globalAlpha=Math.min(1,t*1.6); ctx.fillStyle=p.col;
        ctx.rotate(p.rot); ctx.beginPath();
        ctx.ellipse(0,0,p.size*z*(0.6+t*.6),p.size*z*0.42,0,0,TAU); ctx.fill(); break;
      case 'spark': ctx.globalAlpha=Math.min(1,t*2); ctx.strokeStyle=p.col;
        ctx.lineWidth=Math.max(1,p.size*z*.5); ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(0,0);
        ctx.lineTo(-p.vx*.014*z,-p.vy*.014*z); ctx.stroke(); break;
      case 'ember': ctx.globalAlpha=Math.min(1,t*1.4); ctx.fillStyle=p.col;
        ctx.fillRect(-p.size*z*.5,-p.size*z*.5,p.size*z,p.size*z);
        if((i&1)===0) addLight(p.x,p.y,26*p.size,p.col,t*.4); break;
      case 'fire': { ctx.globalAlpha=t*.8;
        const fr=p.size*z*(2-t);
        ctx.drawImage(getFireSprite(p.col), -fr, -fr, fr*2, fr*2);
        // every fire mote used to add its own light; a quarter of them reads the same
        if((i&3)===0) addLight(p.x,p.y,70*p.size*t,'#ff9a3c',t*.6);
        break; }
      case 'shell': ctx.globalAlpha=Math.min(1,t*3); ctx.fillStyle=p.col; ctx.rotate(p.rot);
        ctx.fillRect(-2.4*z,-1.1*z,4.8*z,2.2*z); break;
      case 'chip': ctx.globalAlpha=Math.min(1,t*2); ctx.fillStyle=p.col; ctx.rotate(p.rot);
        ctx.fillRect(-p.size*z*.5,-p.size*z*.5,p.size*z,p.size*z); break;
      case 'ring': { ctx.globalAlpha=t*t*.9; ctx.strokeStyle=p.col;
        ctx.lineWidth=Math.max(1,p.size*.35*t*z);
        ctx.beginPath(); ctx.arc(0,0,(1-t)*p.size*4*z,0,TAU); ctx.stroke(); break; }
      case 'flash': { ctx.globalAlpha=t*t; ctx.fillStyle=p.col;
        ctx.beginPath(); ctx.arc(0,0,p.size*z*t,0,TAU); ctx.fill();
        addLight(p.x,p.y,p.size*5*t,p.col,t); break; }
      case 'muzzle': { // a cone of burning gas with a cross-star at the muzzle
        ctx.globalAlpha=Math.min(1,t*1.5); ctx.rotate(p.rot);
        const L=p.size*z*(0.55+t*0.95), Wd=p.size*z*0.40*t;
        ctx.fillStyle=p.col;
        ctx.beginPath(); ctx.moveTo(0,-Wd*0.55);
        ctx.lineTo(L,-Wd); ctx.lineTo(L*1.22,0); ctx.lineTo(L,Wd);
        ctx.lineTo(0,Wd*0.55); ctx.closePath(); ctx.fill();
        ctx.fillStyle='rgba(255,255,248,.92)';
        ctx.beginPath(); ctx.moveTo(-Wd*1.1,0); ctx.lineTo(0,-Wd*1.9);
        ctx.lineTo(Wd*1.1,0); ctx.lineTo(0,Wd*1.9); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.arc(0,0,Wd*0.7,0,TAU); ctx.fill();
        addLight(p.x,p.y,p.size*6*t,C.gold,t); break; }
      case 'feather': ctx.globalAlpha=t; ctx.fillStyle=p.col; ctx.rotate(p.rot);
        ctx.beginPath(); ctx.ellipse(0,0,p.size*z,p.size*z*.35,0,0,TAU); ctx.fill(); break;
      default: ctx.globalAlpha=t; ctx.fillStyle=p.col;
        ctx.fillRect(-p.size*z*.5,-p.size*z*.5,p.size*z,p.size*z);
    }
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

// ---- additive light buffer (half res) -----------------------------------
// Lights were allocating an object per light per frame, then building three
// colour strings and a fresh radial gradient for each one. Now the records are
// pooled and each colour gets one baked sprite that is simply blitted.
const lights = []; let lightN = 0;
function addLight(x,y,r,col,a){
  if(lightN>=160) return;
  let L=lights[lightN];
  if(L===undefined){ L={x:0,y:0,r:0,c:'',a:0}; lights[lightN]=L; }
  L.x=x; L.y=y; L.r=r; L.c=col; L.a=a; lightN++;
}
const _lightSpr = Object.create(null);
function getLightSprite(col){
  let s=_lightSpr[col]; if(s) return s;
  const R=64, c=document.createElement('canvas'); c.width=c.height=R*2;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(R,R,0,R,R,R);
  gr.addColorStop(0, hexA(col,1)); gr.addColorStop(.45, hexA(col,.35)); gr.addColorStop(1, hexA(col,0));
  g.fillStyle=gr; g.fillRect(0,0,R*2,R*2);
  _lightSpr[col]=c; return c;
}
function renderLights(){
  if(!lcv.width) return;
  lx.setTransform(1,0,0,1,0,0);
  lx.clearRect(0,0,lcv.width,lcv.height);
  if(!lightN) return;
  lx.globalCompositeOperation='lighter';
  for(let i=0;i<lightN;i++){
    const L=lights[i];
    const sx=w2sx(L.x)/2, sy=w2sy(L.y)/2, r=Math.max(2,L.r*cam.z/2);
    if(sx<-r||sy<-r||sx>lcv.width+r||sy>lcv.height+r) continue;
    lx.globalAlpha=clamp(L.a,0,1);
    lx.drawImage(getLightSprite(L.c), sx-r, sy-r, r*2, r*2);
  }
  lx.globalAlpha=1;
  lx.globalCompositeOperation='source-over';
}
function hexA(hex,a){
  if(hex[0]!=='#') return hex;
  const n=parseInt(hex.slice(1),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+clamp(a,0,1).toFixed(3)+')';
}

const bullets = [];
function fireBullet(o){
  bullets.push({
    x:o.x, y:o.y, px:o.x, py:o.y,
    vx:Math.cos(o.a)*o.spd, vy:Math.sin(o.a)*o.spd,
    a:o.a, spd:o.spd, dmg:o.dmg, own:o.own, life:o.life||1.1,
    pierce:o.pierce||0, ric:o.ric||0, homing:o.homing||0, fire:o.fire||0,
    col:o.col||C.flash, w:o.w||2, rng:o.rng||700, travelled:0,
    tr:[o.x,o.y,o.x,o.y], big:o.big||0, hit:o.hit||null, mark:o.mark||0
  });
}
let _pn = [];
// Point-sampling a bullet's path lets fast rounds step straight over a target:
// at 4200px/s the substep is 14px while a man's hit tolerance is ~12. Test the
// whole travelled SEGMENT against the circle instead — exact, and cheaper than
// shrinking the timestep.
function segCircle(x1,y1,x2,y2,cx,cy,r){
  const dx=x2-x1, dy=y2-y1, L=dx*dx+dy*dy;
  let t = L? ((cx-x1)*dx+(cy-y1)*dy)/L : 0;
  if(t<0)t=0; else if(t>1)t=1;
  const ox=x1+dx*t-cx, oy=y1+dy*t-cy;
  return ox*ox+oy*oy < r*r;
}
function updateBullets(d){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.life-=d; if(b.life<=0){ bullets.splice(i,1); continue; }
    if(b.homing>0){
      const tgt = nearestFoeOf(b.own, b.x, b.y, 460);
      if(tgt){ const want=angTo(b.x,b.y,tgt.x,tgt.y-6);
        b.a = angLerp(b.a, want, Math.min(1, b.homing*d));
        b.vx=Math.cos(b.a)*b.spd; b.vy=Math.sin(b.a)*b.spd; }
    }
    // segCircle makes entity/prop hits step-size independent, but the BUILDING
    // test is still a point sample, so keep substeps under the 16px wall thickness.
    const steps = Math.max(1, Math.ceil(b.spd*d/10));
    const sd = d/steps;
    let dead=false;
    for(let s=0;s<steps && !dead;s++){
      b.px=b.x; b.py=b.y;
      b.x+=b.vx*sd; b.y+=b.vy*sd; b.travelled+=b.spd*sd;
      if(b.travelled>b.rng){ dead=true; break; }
      if(b.x<0||b.y<0||b.x>WORLD.w||b.y>WORLD.h){ dead=true; break; }
      // entities
      for(let k=0;k<ents.length;k++){
        const e=ents[k];
        if(e.dead||e.hp<=0) continue;
        if(e===b.own) continue;
        if(b.own && b.own.team===e.team) continue;
        if(e.noHit) continue;
        const rr2=(e.r+3);
        if(segCircle(b.px,b.py,b.x,b.y, e.x, e.y-e.r*0.4, rr2)){
          if(b.hits && b.hits.indexOf(e)>=0) continue;   // a piercing round
          damage(e, b.dmg, b.own, b.a, b.fire, b);       // passes through once
          if(b.fire) igniteAt(b.x,b.y,b.fire);
          if(b.pierce>0){ b.pierce--; (b.hits=b.hits||[]).push(e); }
          else { dead=true; }
          break;
        }
      }
      if(dead) break;
      if(b.pierce<=0){
        // props
        propsNear(b.x,b.y,30,_pn);
        for(let k=0;k<_pn.length;k++){
          const p=_pn[k];
          if(!p.solid) continue;
          if(segCircle(b.px,b.py,b.x,b.y, p.x, p.y-p.r*.3, p.r*0.95)){
            impactProp(b,p); dead=true; break;
          }
        }
        if(dead) break;
        for(let k=0;k<BUILDINGS.length;k++){
          const bd=BUILDINGS[k];
          if(rectHit(bd,b.x,b.y,0)){
            impactWall(b); dead=true; break;
          }
        }
      }
    }
    // trail history (flat, tapered ribbon at draw time)
    b.tr.push(b.x,b.y); if(b.tr.length>16) b.tr.splice(0,2);
    if(dead){ bullets.splice(i,1); }
  }
}
function impactProp(b,p){
  if(b.ric>0){
    // bounce toward the nearest hostile — the Road Agent trick
    const t=nearestFoeOf(b.own,b.x,b.y,520);
    b.ric--; b.travelled=0; b.life=Math.max(b.life,.5);
    b.a = t? angTo(b.x,b.y,t.x,t.y-8) : b.a+Math.PI+rnd(-.5,.5);
    b.vx=Math.cos(b.a)*b.spd; b.vy=Math.sin(b.a)*b.spd;
    b.x+=b.vx*0.02; b.y+=b.vy*0.02;
    for(let i=0;i<5;i++) spawnP(b.x,b.y,rnd(-90,90),rnd(-90,90),.22,1.6,C.gold,'spark');
    sfxAt('click',b.x,b.y,{vol:.5});
    return true;
  }
  for(let i=0;i<5;i++) spawnP(b.x,b.y,rnd(-110,110),rnd(-110,40),.3,1.8,'#c9b28a','chip',{grav:420,drag:.94});
  spawnP(b.x,b.y,0,0,.13,7,C.bone,'flash');
  addDecal(b.x,b.y,3.5,'pock');
  sfxAt('hit',b.x,b.y,{vol:.35});
  return false;
}
function impactWall(b){
  for(let i=0;i<4;i++) spawnP(b.x,b.y,rnd(-80,80),rnd(-80,20),.28,1.6,'#a99a80','chip',{grav:400,drag:.94});
  spawnP(b.x,b.y,0,0,.12,6,C.bone,'flash');
  sfxAt('hit',b.x,b.y,{vol:.3});
}
function drawBullets(){
  const z=cam.z;
  for(const b of bullets){
    const n=b.tr.length/2;
    if(n<2) continue;
    // tapered ribbon — thin tail, belly ~40% along, thin head
    ctx.beginPath();
    let first=true;
    for(let side=0; side<2; side++){
      for(let k=0;k<n;k++){
        const i = side===0? k : n-1-k;
        const x=b.tr[i*2], y=b.tr[i*2+1];
        const t=i/(n-1);
        const taper = Math.sin(Math.pow(t,0.7)*Math.PI);
        const nx0 = (i<n-1? b.tr[(i+1)*2]-x : x-b.tr[(i-1)*2]);
        const ny0 = (i<n-1? b.tr[(i+1)*2+1]-y : y-b.tr[(i-1)*2+1]);
        const L=Math.hypot(nx0,ny0)||1;
        const nx=-ny0/L*(b.w*taper)*(side?-1:1), ny=nx0/L*(b.w*taper)*(side?-1:1);
        const sx=w2sx(x+nx), sy=w2sy(y+ny);
        if(first){ ctx.moveTo(sx,sy); first=false; } else ctx.lineTo(sx,sy);
      }
    }
    ctx.closePath();
    ctx.fillStyle = b.fire? '#ff8a2a' : b.col;
    ctx.globalAlpha=.9; ctx.fill(); ctx.globalAlpha=1;
    // head
    const hx=w2sx(b.x), hy=w2sy(b.y);
    ctx.fillStyle=C.flash;
    ctx.beginPath(); ctx.arc(hx,hy,(b.w*.9+ (b.big?2.5:0))*z,0,TAU); ctx.fill();
    addLight(b.x,b.y, (b.fire?80:46)*(b.big?2:1), b.fire?'#ff8a2a':C.gold, b.fire?.5:.22);
  }
}

function makeEnt(o){
  const e = {
    _k:'e', x:o.x, y:o.y, vx:0, vy:0, r:o.r||10,
    hp:o.hp||40, maxhp:o.hp||40, team:o.team||'civ', kind:o.kind||'civ',
    name:o.name||'', title:o.title||'',
    face:1, aim:rnd(TAU), lean:0, bob:rnd(TAU),
    dead:false, dieT:0, hitT:0, flash:0, knock:0,
    state:'idle', stT:rnd(1,4), tx:o.x, ty:o.y, home:[o.x,o.y],
    gun:o.gun||null, magN:0, fireT:0, reloadT:0, burst:0, burstT:0,
    target:null, alert:0, seen:0, spd:o.spd||62, agg:o.agg||1,
    loot:o.loot==null?rndi(4,22):o.loot, boss:!!o.boss, quest:o.quest||null,
    seed:(Math.random()*1e9)|0, mount:null, rider:null, tamed:!!o.tamed,
    talk:o.talk||null, idleAnim:rnd(TAU), fear:0, burn:0, markT:0, stun:0,
    hat:o.hat==null?1:o.hat, scale:o.scale||1, noHit:false, spawnT:0
  };
  if(e.gun){ e.magN = GUNS[e.gun].mag; }
  ents.push(e);
  return e;
}

  p.tut=0;
  return p;
}
