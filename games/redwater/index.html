// ---- factions -----------------------------------------------------------
function hostile(a,b){
  if(!a||!b) return false;
  if(a.team===b.team) return false;
  if(a.team==='beast'||b.team==='beast'){
    const beast = a.team==='beast'?a:b, other = a.team==='beast'?b:a;
    return beast.kind==='coyote' && other.team!=='beast';
  }
  const t=[a.team,b.team];
  if(t.indexOf('law')>=0 && t.indexOf('outlaw')>=0) return true;
  if(t.indexOf('player')>=0){
    const o = a.team==='player'?b:a;
    if(o.team==='outlaw') return P.side!=='outlaw' ? true : (o.renegade||false);
    if(o.team==='law')   return P.side==='outlaw' ? true : (P.wanted>0);
    if(o.team==='civ')   return false;
  }
  if(t.indexOf('civ')>=0) return false;
  return false;
}
function nearestFoeOf(own,x,y,rad){
  if(!own) return null;
  let b=null,bd=rad*rad;
  for(const e of ents){ if(e.dead||e.hp<=0||e===own||e.noHit) continue;
    if(!hostile(own,e)) continue;
    const d=dist2(x,y,e.x,e.y); if(d<bd){bd=d;b=e;} }
  return b;
}

// ---- movement & collision ----------------------------------------------
let _mn=[];
function moveEnt(e,dx,dy){
  if(dx) { e.x+=dx; resolveX(e,dx); }
  if(dy) { e.y+=dy; resolveY(e,dy); }
  e.x=clamp(e.x,12,WORLD.w-12); e.y=clamp(e.y,12,WORLD.h-12);
}
function resolveX(e,dx){
  if(e===P && window.DBG && DBG.noclip) return;
  propsNear(e.x,e.y,44,_mn);
  for(const p of _mn){ if(!p.r||!p.solid) continue;
    const rr2=p.r*.8+e.r;
    if(dist2(e.x,e.y,p.x,p.y)<rr2*rr2){ e.x = p.x + (dx>0?-rr2:rr2); }
  }
  for(const b of BUILDINGS){ if(rectHit(b,e.x,e.y,e.r)){
    e.x = b.x + (dx>0? -(b.w/2+e.r) : (b.w/2+e.r)); } }
  for(const b of WALLS){ if(rectHit(b,e.x,e.y,e.r)){
    e.x = b.x + (dx>0? -(b.w/2+e.r) : (b.w/2+e.r)); } }
  if(e.y<INDOORS_Y && inRiver(e.x,e.y) && !nearBridge(e.x,e.y)) e.x -= dx;
}
function resolveY(e,dy){
  if(e===P && window.DBG && DBG.noclip) return;
  propsNear(e.x,e.y,44,_mn);
  for(const p of _mn){ if(!p.r||!p.solid) continue;
    const rr2=p.r*.8+e.r;
    if(dist2(e.x,e.y,p.x,p.y)<rr2*rr2){ e.y = p.y + (dy>0?-rr2:rr2); }
  }
  for(const b of BUILDINGS){ if(rectHit(b,e.x,e.y,e.r)){
    e.y = b.y + (dy>0? -(b.h/2+e.r) : (b.h/2+e.r)); } }
  for(const b of WALLS){ if(rectHit(b,e.x,e.y,e.r)){
    e.y = b.y + (dy>0? -(b.h/2+e.r) : (b.h/2+e.r)); } }
  if(e.y<INDOORS_Y && inRiver(e.x,e.y) && !nearBridge(e.x,e.y)) e.y -= dy;
}
// Line of sight is stable over a few frames; re-testing it every frame for every
// hostile was ~30k rect tests/frame. Cache per entity for ~0.15s.
function losCached(e,x1,y1,x2,y2){
  e._losT=(e._losT||0)-dt;
  if(e._losT<=0){ e._los=losClear(x1,y1,x2,y2); e._losT=0.12+Math.random()*0.09; }
  return e._los;
}
function losClear(x1,y1,x2,y2){
  const d=dist(x1,y1,x2,y2); if(d<1) return true;
  const steps=Math.min(26, Math.ceil(d/34));
  for(let i=1;i<steps;i++){
    const t=i/steps, x=lerp(x1,x2,t), y=lerp(y1,y2,t);
    for(const b of BUILDINGS) if(rectHit(b,x,y,0)) return false;
    for(const b of WALLS) if(rectHit(b,x,y,0)) return false;
  }
  return true;
}

// ---- damage -------------------------------------------------------------
function damage(e, amt, from, ang, fire, bullet){
  if(e.dead||e.hp<=0) return;
  if(e===P && P.iframe>0) return;
  if(e===P && window.DBG && DBG.god) return;
  let dmg = amt;
  if(e===P && P.perks.nerve) dmg*=0.82;
  if(e.markT>0) dmg*=2;
  const wasAlive = e.hp>0;
  e.hp -= dmg;
  e.hitT = 0.14; e.flash = 1;
  if(fire) e.burn = Math.max(e.burn, 2.6);
  const a = ang==null? (from? angTo(from.x,from.y,e.x,e.y) : 0) : ang;
  const kn = clamp(dmg*0.9, 8, 50)*(e.boss?0.35:1);
  e.kx = (e.kx||0) + Math.cos(a)*kn*3; e.ky = (e.ky||0) + Math.sin(a)*kn*3;

  // blood + mist
  for(let i=0;i<Math.min(14,4+dmg*0.28);i++){
    const sa=a+rnd(-.7,.7);
    spawnP(e.x+Math.cos(a)*e.r, e.y-e.r*.5+Math.sin(a)*e.r, Math.cos(sa)*rnd(60,280), Math.sin(sa)*rnd(60,280),
      rnd(.3,.65), rnd(1.4,3.2), C.blood,'blood',{grav:340,drag:.9});
  }
  spawnP(e.x,e.y-e.r*.5,0,0,.1,9,C.flash,'flash');
  if(chance(.5)) addDecal(e.x,e.y+rnd(-5,5),rnd(7,14),'blood');

  if(e===P){
    addTrauma(clamp(dmg/40,.12,.5)); hitstop=Math.max(hitstop,.05);
    sfx('hit',{vol:.9});
  } else {
    sfxAt('hit',e.x,e.y,{vol:.6});
  }

  if(from===P){
    P.awaken = Math.min(P.awakenMax, P.awaken + dmg*(P.perks.iron?0.34:0.21));
    addFloat(e.x+rnd(-6,6), e.y-e.r*1.6, Math.round(dmg)+'', e.markT>0?C.gold:C.bone, e.markT>0?15:12);
  }

  if(e.hp<=0 && wasAlive) kill(e, from);
  else if(e.team!=='player'){
    e.target = from; e.alert = 1; e.state='combat'; e.stT=0;
    alertNear(e, 260, from);
  }
}
function alertNear(e,rad,from){
  for(const o of ents){ if(o===e||o.dead||o.hp<=0) continue;
    if(o.team!==e.team) continue;
    if(dist2(o.x,o.y,e.x,e.y)<rad*rad && o.state!=='combat'){
      o.target=from; o.state='combat'; o.alert=1; o.stT=rnd(0,.35);
    }
  }
}
function kill(e, from){
  e.dead=true; e.dieT=0; e.hp=0; e.noHit=true;
  e.deathAng = from? angTo(from.x,from.y,e.x,e.y) : rnd(TAU);
  for(let i=0;i<18;i++){
    const sa=e.deathAng+rnd(-1.1,1.1);
    spawnP(e.x,e.y-e.r*.6,Math.cos(sa)*rnd(70,340),Math.sin(sa)*rnd(70,340),
      rnd(.4,.9),rnd(1.8,4),C.blood,'blood',{grav:380,drag:.9});
  }
  addDecal(e.x,e.y,rnd(14,24),'blood');
  addTrauma(e.boss?.5:.14);
  if(from===P){
    hitstop=Math.max(hitstop, e.boss?.14:.07);
    P.kills++;
    const xp = e.boss?160:(e.team==='beast'?8:26);
    gainXP(xp);
    P.awaken=Math.min(P.awakenMax,P.awaken+(e.boss?28:9)*(P.perks.iron?1.6:1));
    const coin = Math.round(e.loot*(P.perks.scav?1.5:1));
    if(coin>0){ P.money+=coin; addFloat(e.x,e.y-26,'$'+coin,C.gold,14); sfxAt('coin',e.x,e.y,{vol:.4}); }
    onKill(e);
  }
  sfxAt('boom',e.x,e.y,{vol:.25});
}
function igniteAt(x,y,pow){
  for(let i=0;i<5;i++)
    spawnP(x+rnd(-8,8),y+rnd(-8,8),rnd(-40,40),rnd(-70,-10),rnd(.3,.7),rnd(4,8),'#ff7a1e','fire',{drag:.92});
}

// ---- explosions ---------------------------------------------------------
function explode(x,y,rad,dmg,owner){
  addTrauma(.55); hitstop=Math.max(hitstop,.09);
  sfxAt('boom',x,y,{vol:1});
  spawnP(x,y,0,0,.3,rad*.5,C.flash,'flash');
  spawnP(x,y,0,0,.55,rad*.28,C.gold,'ring');
  for(let i=0;i<34;i++){ const a=rnd(TAU), s=rnd(90,rad*4.2);
    spawnP(x,y,Math.cos(a)*s,Math.sin(a)*s,rnd(.35,.9),rnd(3,8),pick(['#ff9a3c','#e0561e','#ffd98a']),'fire',{drag:.9}); }
  for(let i=0;i<20;i++){ const a=rnd(TAU), s=rnd(40,240);
    spawnP(x,y,Math.cos(a)*s,Math.sin(a)*s,rnd(.8,1.8),rnd(7,16),'#5a4a44','smoke',{drag:.93}); }
  for(let i=0;i<14;i++){ const a=rnd(TAU), s=rnd(140,460);
    spawnP(x,y,Math.cos(a)*s,Math.sin(a)*s,rnd(.4,.9),2.4,'#3d3128','chip',{grav:500,drag:.94}); }
  addDecal(x,y,rad*.62,'scorch');
  for(const e of ents){ if(e.dead||e.hp<=0) continue;
    const d=dist(x,y,e.x,e.y);
    if(d<rad){ const f=1-d/rad;
      if(e===owner) { damage(e, dmg*f*0.35, null, angTo(x,y,e.x,e.y)); }
      else damage(e, dmg*f, owner, angTo(x,y,e.x,e.y), 1);
    }
  }
  // blow apart light props
  propsNear(x,y,rad,_pn);
  for(const p of _pn){ if(p.t==='barrel'||p.t==='crate'||p.t==='fence'||p.t==='tent'){
    if(dist2(p.x,p.y,x,y)<rad*rad*.6){ p.solid=false; p.t = p.t==='tent'?'rock':'stump'; p.s*=.5; } } }
}

function aiShoot(e, tx, ty, d){
  const g = GUNS[e.gun]; if(!g) return;
  if(e.reloadT>0){ e.reloadT-=d; if(e.reloadT<=0){ e.magN=g.mag; } return; }
  if(e.magN<=0){ e.reloadT = g.rl*(e.boss?0.7:1.15); sfxAt('reload',e.x,e.y,{vol:.35}); return; }
  e.fireT-=d; if(e.fireT>0) return;
  const dd = dist(e.x,e.y,tx,ty);
  if(dd > g.rng*0.95) return;
  if(!losCached(e,e.x,e.y,tx,ty)) return;
  e.fireT = 1/(g.rof*(e.boss?1.05:0.50));
  e.magN--;
  const acc = e.boss? 0.75 : 2.0;
  const base = angTo(e.x,e.y-6,tx,ty);
  for(let i=0;i<g.pel;i++){
    fireBullet({ x:e.x+Math.cos(base)*13, y:e.y-7+Math.sin(base)*13,
      a: base + rnd(-1,1)*g.spr*acc + rnd(-.05,.05),
      spd: g.spd*.82, dmg: g.dmg*(e.boss?1.1:0.50), own:e,
      rng:g.rng, col:'#d9b98a', w:1.6, life:1.2 });
  }
  muzzle(e, base, g);
  sfxAt(g.cls==='shotgun'?'shotgun':g.cls==='rifle'?'rifle':'shot', e.x,e.y,{vol:.55});
}
function muzzle(e, a, g){
  const mx=e.x+Math.cos(a)*16, my=e.y-7+Math.sin(a)*16;
  spawnP(mx,my,0,0,.085, g.cls==='shotgun'?26:17, C.flash,'muzzle',{rot:a,vr:0,drag:1});
  for(let i=0;i<(g.cls==='shotgun'?9:5);i++){
    const sa=a+rnd(-.5,.5);
    spawnP(mx,my,Math.cos(sa)*rnd(120,420),Math.sin(sa)*rnd(120,420),rnd(.1,.26),rnd(1,2.4),
      pick([C.flash,C.gold,'#ffb347']),'spark',{drag:.86});
  }
  spawnP(mx,my,Math.cos(a)*40,Math.sin(a)*40,.7,7,'#b8a894','smoke',{drag:.92});
  const ea=a+Math.PI*.6;
  spawnP(e.x,e.y-8,Math.cos(ea)*rnd(60,120),Math.sin(ea)*rnd(60,120),.9,1,'#d9a441','shell',{grav:520,drag:.96,vz:120,z:8});
  addLight(mx,my, g.cls==='shotgun'?190:140, C.flash, .85);
}

function updateAI(e,d){
  if(e.stun>0){ e.stun-=d; return; }
  const pl = P;
  // burn damage over time
  if(e.burn>0){ e.burn-=d;
    e.hp-=14*d; if(chance(d*14)) spawnP(e.x+rnd(-6,6),e.y-rnd(0,16),rnd(-20,20),rnd(-60,-20),.5,4,'#ff8a2a','fire');
    if(e.hp<=0){ kill(e, P); return; } }
  if(e.markT>0) e.markT-=d;

  const dp = dist(e.x,e.y,pl.x,pl.y);
  const host = hostile(e,pl);

  // notice the player
  if(host && e.state!=='combat'){
    const sight = e.boss?720:520;
    if(dp<sight && losCached(e,e.x,e.y,pl.x,pl.y)){
      e.seen += d*(dp<230?3.6:1.7);
      if(e.seen>1){ e.state='combat'; e.target=pl; e.alert=1; alertNear(e,300,pl);
        if(e.team==='law'&&P.wanted>0) toastOnce('lawSpot','THE LAW HAS SEEN YOU','Lose them, or fight.',C.law); }
    } else e.seen=Math.max(0,e.seen-d);
  }
  if(e.target && (e.target.dead||e.target.hp<=0)) { e.target=null; e.state='wander'; }
  if(e.state==='combat' && !e.target) e.target = host? pl : null;
  if(e.state==='combat' && e.target && !hostile(e,e.target)) { e.target=null; e.state='wander'; }

  switch(e.state){
    case 'idle':
      e.stT-=d;
      if(e.stT<=0){ e.state='wander'; e.stT=rnd(2,6);
        const a=rnd(TAU), rr2=rnd(40,150);
        e.tx=clamp(e.home[0]+Math.cos(a)*rr2,20,WORLD.w-20);
        e.ty=clamp(e.home[1]+Math.sin(a)*rr2,20,WORLD.h-20); }
      break;
    case 'wander': {
      const dd=dist(e.x,e.y,e.tx,e.ty);
      if(dd<14||e.stT<=0){ e.state='idle'; e.stT=rnd(1.5,5); break; }
      e.stT-=d;
      const a=angTo(e.x,e.y,e.tx,e.ty);
      moveEnt(e, Math.cos(a)*e.spd*.55*d, Math.sin(a)*e.spd*.55*d);
      e.aim=angLerp(e.aim,a,d*7);
      break;
    }
    case 'flee': {
      e.stT-=d; if(e.stT<=0){ e.state='wander'; e.stT=rnd(2,5); break; }
      const a = angTo(pl.x,pl.y,e.x,e.y)+rnd(-.2,.2);
      moveEnt(e, Math.cos(a)*e.spd*1.5*d, Math.sin(a)*e.spd*1.5*d);
      e.aim=a;
      break;
    }
    case 'combat': {
      const t=e.target; if(!t){ e.state='wander'; break; }
      const dd=dist(e.x,e.y,t.x,t.y);
      e.aim = angLerp(e.aim, angTo(e.x,e.y,t.x,t.y), d*6);
      if(e.kind==='coyote'){
        // beast: rush and bite
        const a=angTo(e.x,e.y,t.x,t.y);
        moveEnt(e,Math.cos(a)*e.spd*1.5*d, Math.sin(a)*e.spd*1.5*d);
        e.fireT-=d;
        if(dd<e.r+t.r+8 && e.fireT<=0){ e.fireT=.9; damage(t,11,e,a);
          for(let i=0;i<5;i++) spawnP(t.x,t.y-8,rnd(-100,100),rnd(-120,20),.3,2,C.blood,'blood',{grav:300}); }
        break;
      }
      const g=GUNS[e.gun];
      const want = g? (g.cls==='shotgun'?150: g.cls==='rifle'?520: 260) : 40;
      const a=angTo(e.x,e.y,t.x,t.y);
      let mvx=0,mvy=0;
      if(dd>want*1.2) { mvx=Math.cos(a); mvy=Math.sin(a); }
      else if(dd<want*0.6){ mvx=-Math.cos(a); mvy=-Math.sin(a); }
      // strafe
      e.stT-=d; if(e.stT<=0){ e.strafe = chance(.5)?1:-1; e.stT=rnd(.8,2.2); }
      mvx += -Math.sin(a)*(e.strafe||1)*.85; mvy += Math.cos(a)*(e.strafe||1)*.85;
      const ml=Math.hypot(mvx,mvy)||1;
      const sp = e.spd*(e.boss?1.15:.95);
      moveEnt(e, mvx/ml*sp*d, mvy/ml*sp*d);
      aiShoot(e, t.x + t.vx*0.12, t.y + t.vy*0.12 - 6, d);
      break;
    }
  }
}

function spawnWildlife(){
  for(let i=0;i<26;i++){
    const x=rnd(300,WORLD.w-300), y=rnd(300,MAP_H-300);
    if(inRiver(x,y)) continue;
    const near=nearestPOI(x,y);
    if(near.d<420) continue;

    else { const e=makeEnt({x:x,y:y,team:'beast',kind:'deer',hp:34,spd:120,r:9,loot:0,name:'DEER'}); e.skittish=true; }
  }
}
function spawnHorses(){

// ==========================================================================
//  ENTITY RENDERING
//  Rule: anything that can hurt you is a flat INK silhouette with a faction
//  trim and no interior detail. Friendlies are sand. Only the player is lit.
// ==========================================================================
function bodyTone(e){
  if(e===P) return P.side==='law' ? '#6f89a8' : P.side==='outlaw' ? '#6b555e' : '#bda284';
  if(e.team==='civ') return '#9c7d57';
  if(e.team==='beast') return e.kind==='deer' ? '#a3794d' : '#43372f';
  return C.ink;
}
function trimTone(e){
  if(e===P) return C.gold;
  if(e.team==='law') return C.law;
  if(e.team==='outlaw') return C.outlaw;
  if(e.team==='civ') return '#efe4c8';   // bone collar: civilians must separate from ANY ground
  return '#4a3a32';
}

function entShadow(e, wide, tall){
  if(PASS===2 || shadowA<.02) return;
  const sx=w2sx(e.x), sy=w2sy(e.y), z=cam.z;
  ctx.save(); ctx.translate(sx,sy); ctx.scale(z,z);
  ctx.transform(1,0,-sun.dx*.42,0.26,0,0);
  ctx.globalAlpha=shadowA*(e.dead?.5:1); ctx.fillStyle=C.ink;
  ctx.beginPath(); ctx.ellipse(0,-tall*.5,wide,tall*.55,0,0,TAU); ctx.fill();
  ctx.restore();
}

function drawHuman(e){
  const z=cam.z, sx=w2sx(e.x), sy=w2sy(e.y);
  const sc=(e.scale||1)*(e.boss?1.16:1);
  const spd=Math.hypot(e.vx,e.vy);
  const walk=Math.min(1,spd/90);
  const ph=e.bob;
  const lift = 7*sc;
  const tone=bodyTone(e), trim=trimTone(e);

  if(e.dead){
    const t=clamp(e.dieT/0.45,0,1);
    entShadow(e, 13*sc, 6*sc);
    if(PASS===1) return;
    ctx.save(); ctx.translate(sx,sy); ctx.scale(z,z);
    ctx.rotate(e.deathAng||0);
    ctx.globalAlpha=clamp(1-(e.dieT-28)/6,0,1);
    ctx.fillStyle=tone;
    ctx.beginPath(); ctx.ellipse(6*t*sc,0,13*sc,7*sc,0,0,TAU); ctx.fill();
    ctx.globalAlpha*=.9; ctx.strokeStyle=C.ink; ctx.lineWidth=1.6; ctx.stroke();
    ctx.fillStyle=C.ink;
    ctx.beginPath(); ctx.ellipse(16*t*sc,2*sc,8*sc,6*sc,0,0,TAU); ctx.fill();
    ctx.globalAlpha=1; ctx.restore();
    return;
  }

  entShadow(e, 9*sc, 12*sc);
  if(PASS===1){
    // the player alone gets a hard contact shadow, so you can always find yourself
    if(e===P && shadowA>.02){ ctx.save(); ctx.globalAlpha=.34; ctx.fillStyle=C.ink;
      ctx.beginPath(); ctx.ellipse(sx,sy+1.5*z,10.5*z,4.6*z,0,0,TAU); ctx.fill(); ctx.restore(); }
    return;
  }
  ctx.save(); ctx.translate(sx, sy - lift*z);
  ctx.scale(z,z);
  const bobY = Math.sin(now*11+ph)*walk*1.5;
  ctx.translate(0,bobY);
  ctx.rotate(e.aim);

  const g = e===P ? gunDef() : (e.gun? GUNS[e.gun] : null);
  const longGun = g && g.cls!=='revolver';
  const ls=Math.sin(now*11+ph)*walk*4;

  // From directly above a man is mostly hat, with shoulders either side and a
  // coat behind. So the three shapes have to differ in BOTH size and value, or
  // they stack into concentric rings and read as a target instead of a person.
  //   coat   widest, darkest   · torso  mid       · brim  dark ring
  //   crown  smallest, lightest
  const flare = 1 + walk*0.42, sway = Math.sin(now*5.5+ph)*walk*1.8;

  // ---- duster, well clear of the shoulders so it reads as cloth
  ctx.fillStyle=shade(tone,-.24);
  ctx.beginPath();
  ctx.moveTo(2*sc, -8.4*sc);
  ctx.quadraticCurveTo(-8*sc, -14.5*sc*flare, -15*sc*flare, (-6+sway)*sc);
  ctx.quadraticCurveTo(-11.5*sc, -1.2*sc, -11*sc, 0);
  ctx.quadraticCurveTo(-11.5*sc, 1.2*sc, -15*sc*flare, (6+sway)*sc);
  ctx.quadraticCurveTo(-8*sc, 14.5*sc*flare, 2*sc, 8.4*sc);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha=.6; ctx.strokeStyle=C.ink; ctx.lineWidth=1.6; ctx.stroke(); ctx.globalAlpha=1;

  // ---- boots, swinging under the hem
  ctx.fillStyle=shade(tone,-.36);
  ctx.beginPath(); ctx.ellipse(-4*sc, (-4.4+ls*.34)*sc, 3.2*sc, 2.2*sc, 0,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-4*sc, ( 4.4-ls*.34)*sc, 3.2*sc, 2.2*sc, 0,0,TAU); ctx.fill();

  // ---- torso
  ctx.fillStyle=tone;
  ctx.beginPath(); ctx.ellipse(-0.4*sc,0,7.0*sc,9.6*sc,0,0,TAU); ctx.fill();
  ctx.globalAlpha=.85; ctx.strokeStyle=C.ink; ctx.lineWidth=1.9; ctx.stroke(); ctx.globalAlpha=1;

  // ---- gunbelt and holster, ON TOP of the torso or you never see them
  ctx.fillStyle=shade(tone,-.40);
  ctx.beginPath(); rr(-4.4*sc, -8.6*sc, 2.4*sc, 17.2*sc, 1.1*sc); ctx.fill();
  ctx.fillStyle=shade(tone,-.48);
  ctx.beginPath(); rr(-6.0*sc, 5.6*sc, 4.2*sc, 4.6*sc, 1.3*sc); ctx.fill();

  // ---- arms, also ON TOP, so the gun is connected to a body instead of floating
  if(g){
    ctx.strokeStyle=C.ink; ctx.lineWidth=1.3;
    ctx.fillStyle=shade(tone,-.14);
    ctx.beginPath(); rr(0*sc, 1.8*sc, 11.5*sc, 3.4*sc, 1.7*sc); ctx.fill();
    ctx.globalAlpha=.55; ctx.stroke(); ctx.globalAlpha=1;
    if(longGun){
      ctx.fillStyle=shade(tone,-.20);
      ctx.beginPath(); rr(1.5*sc, -5.2*sc, 9.5*sc, 3.2*sc, 1.6*sc); ctx.fill();
      ctx.globalAlpha=.55; ctx.stroke(); ctx.globalAlpha=1;
    }
  }

  // ---- the iron, at the end of the hand
  if(g){ ctx.save(); ctx.translate(10.5*sc, longGun? 0.2*sc : 3.4*sc); drawGunArt(g, sc*0.92*(g.rar===3?1.2:1), e===P); ctx.restore(); }

  // ---- carrying a legend is visible on the man, not just in his hand
  if(g && g.rar===3 && g.art){
    const gl = g.art.glow || C.gold;
    const mx = 10.5+ (3.4 + g.art.bl) * 0.92, my = (longGun? 0.2 : 3.4);
    ctx.save(); ctx.rotate(-e.aim);
    ctx.globalAlpha=.20+Math.sin(now*2.6)*.07;
    ctx.strokeStyle=gl; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.ellipse(0, 7*sc, 16*sc, 7*sc, 0, 0, TAU); ctx.stroke();
    ctx.globalAlpha=1; ctx.restore();
    // heat/haze living at the muzzle, and motes drifting off the man
    const wx = e.x + Math.cos(e.aim)*mx*sc - Math.sin(e.aim)*my*sc;
    const wy = e.y - 7*sc + Math.sin(e.aim)*mx*sc + Math.cos(e.aim)*my*sc;
    addLight(wx, wy, 15, gl, .13+Math.sin(now*3)*.04);
    if(chance(dt*(e===P?9:3)))
      spawnP(wx+rnd(-3,3), wy+rnd(-3,3), rnd(-14,14), rnd(-26,-6),
             rnd(.5,1.0), rnd(1.1,1.8), gl, 'chip', {drag:.94});
  }

  // ---- hat: a DARK brim ring around a LIGHT crown reads unmistakably as a hat
  if(e.hat){
    ctx.fillStyle=shade(tone,-.30);
    ctx.beginPath(); ctx.ellipse(1.2*sc,0,6.2*sc,6.6*sc,0,0,TAU); ctx.fill();
    ctx.globalAlpha=.95; ctx.strokeStyle=C.ink; ctx.lineWidth=1.7; ctx.stroke(); ctx.globalAlpha=1;
    ctx.fillStyle=shade(tone,.22);
    ctx.beginPath(); ctx.ellipse(2.6*sc,0,3.5*sc,3.8*sc,0,0,TAU); ctx.fill();
    ctx.globalAlpha=.7; ctx.strokeStyle=C.ink; ctx.lineWidth=1.2; ctx.stroke(); ctx.globalAlpha=1;
    // the pinch down the crown — one line that makes it a Stetson, not a dome
    ctx.strokeStyle='rgba(36,26,28,.5)'; ctx.lineWidth=0.9;
    ctx.beginPath(); ctx.moveTo(0.2*sc,0); ctx.lineTo(5.4*sc,0); ctx.stroke();
    // hatband in the colour of whoever he rides for — thin, at the crown base
    ctx.strokeStyle=(g&&g.rar===3&&g.art&&g.art.glow)? g.art.glow : trim;
    ctx.lineWidth=(g&&g.rar===3)?1.35:0.85; ctx.globalAlpha=.9;
    ctx.beginPath(); ctx.ellipse(2.6*sc,0,4.1*sc,4.4*sc,0,0,TAU); ctx.stroke(); ctx.globalAlpha=1;
  } else {
    ctx.fillStyle=shade(tone,.24);
    ctx.beginPath(); ctx.ellipse(1.4*sc,0,4.2*sc,4.4*sc,0,0,TAU); ctx.fill();
    ctx.globalAlpha=.75; ctx.strokeStyle=C.ink; ctx.lineWidth=1.4; ctx.stroke(); ctx.globalAlpha=1;
  }

  // faction trim LAST, outside everything — a shoulder collar you can read at a glance
  ctx.strokeStyle=trim; ctx.lineWidth=(e===P||e.boss)?3.0:2.4; ctx.globalAlpha=.95;
  ctx.beginPath(); ctx.ellipse(-0.6*sc,0,8.2*sc,11.4*sc,0,-2.05,2.05); ctx.stroke();
  ctx.globalAlpha=1;

  // rim light — the player alone catches the sun
  if(e===P){
    ctx.save(); ctx.rotate(-e.aim);
    ctx.beginPath(); ctx.ellipse(0,0,12.6*sc,12.6*sc,0,0,TAU); ctx.clip();
    ctx.globalAlpha=.30+daylight()*.35; ctx.fillStyle=C.bone;
    const rl = Math.atan2(-sun.dy, -sun.dx);
    ctx.rotate(rl);
    ctx.fillRect(4.5*sc,-12*sc,9*sc,24*sc);
    ctx.restore();
  }
  // hit flash — a white half-second
  if(e.flash>0){
    ctx.globalAlpha=e.flash*.85; ctx.fillStyle=C.flash;
    ctx.beginPath(); ctx.ellipse(0,0,12.6*sc,12.6*sc,0,0,TAU); ctx.fill(); ctx.globalAlpha=1;
  }
  if(e.burn>0){ ctx.globalAlpha=.4+Math.sin(now*22)*.15; ctx.fillStyle='#ff7a1e';
    ctx.beginPath(); ctx.ellipse(0,0,13.0*sc,13.0*sc,0,0,TAU); ctx.fill(); ctx.globalAlpha=1; }
  ctx.restore();

  // ---- above-head state
  if(e!==P && !e.dead){
    if(e.markT>0){
      ctx.save(); ctx.translate(sx,sy-30*z); ctx.rotate(now*2.4);
      ctx.strokeStyle=C.gold; ctx.lineWidth=2.2*z; ctx.globalAlpha=.9;
      for(let i=0;i<4;i++){ ctx.beginPath();
        ctx.arc(0,0,9*z, i*TAU/4+.3, i*TAU/4+1.2); ctx.stroke(); }
      ctx.restore(); ctx.globalAlpha=1;
    }
    if(e.hp<e.maxhp && e.hp>0){
      const bw=26*z, f=clamp(e.hp/e.maxhp,0,1);
      ctx.fillStyle='rgba(18,13,16,.7)'; ctx.fillRect(sx-bw/2, sy-34*z, bw, 3.6*z);
      ctx.fillStyle = e.boss? C.gold : trim;
      ctx.fillRect(sx-bw/2, sy-34*z, bw*f, 3.6*z);
    }
    if(e.state!=='combat' && e.seen>0.15 && hostile(e,P)){
      ctx.globalAlpha=clamp(e.seen,0,1); ctx.fillStyle=C.outlaw;
      ctx.beginPath(); ctx.moveTo(sx,sy-44*z); ctx.lineTo(sx-5*z,sy-34*z); ctx.lineTo(sx+5*z,sy-34*z);
      ctx.closePath(); ctx.fill(); ctx.globalAlpha=1;
    }
    if(e.quest && !e.dead){
      const yy=sy-40*z+Math.sin(now*3)*2.4*z;
      ctx.fillStyle=C.gold; ctx.globalAlpha=.95;
      ctx.beginPath(); ctx.moveTo(sx,yy+7*z); ctx.lineTo(sx-6*z,yy-4*z); ctx.lineTo(sx+6*z,yy-4*z);
      ctx.closePath(); ctx.fill(); ctx.globalAlpha=1;
      addLight(e.x,e.y-28,70,C.gold,.3);
    }
  }
}

function drawHorse(e){
  const z=cam.z, sx=w2sx(e.x), sy=w2sy(e.y);
  const coat=e.coat||'#5a4334';
  entShadow(e, 20, 10);
  if(PASS===1) return;
  ctx.save(); ctx.translate(sx, sy-8*z); ctx.scale(z,z); ctx.rotate(e.aim);
  const spd=Math.hypot(e.vx,e.vy), gal=Math.min(1,spd/220);
  const lg=Math.sin(now*14)*gal*5;
  ctx.fillStyle=shade(coat,-.12);
  for(const o of [[-9,-7],[-9,7],[9,-6],[9,6]]){
    ctx.beginPath(); ctx.ellipse(o[0]+lg*Math.sign(o[0]), o[1], 3.4, 2.4, 0,0,TAU); ctx.fill(); }
  ctx.fillStyle=coat;
  ctx.beginPath(); ctx.ellipse(0,0,19,10,0,0,TAU); ctx.fill();
  ctx.globalAlpha=.7; ctx.strokeStyle=C.ink; ctx.lineWidth=1.8; ctx.stroke(); ctx.globalAlpha=1;
  // neck + head
  ctx.fillStyle=shade(coat,-.05);
  ctx.beginPath(); ctx.ellipse(16,0,9,5.5,0,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(24,0,6,3.6,0,0,TAU); ctx.fill();
  ctx.globalAlpha=.6; ctx.strokeStyle=C.ink; ctx.lineWidth=1.4; ctx.stroke(); ctx.globalAlpha=1;
  // mane + tail
  ctx.fillStyle=shade(coat,-.22);
  ctx.beginPath(); ctx.ellipse(12,0,5,4,0,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-20-gal*2,0,6,3,0,0,TAU); ctx.fill();
  if(e.tamed){ // saddle
    ctx.fillStyle='#6b4a2e'; ctx.beginPath(); ctx.ellipse(-1,0,7,8,0,0,TAU); ctx.fill();
    ctx.globalAlpha=.6; ctx.strokeStyle=C.ink; ctx.lineWidth=1.4; ctx.stroke(); ctx.globalAlpha=1; }
  if(e.flash>0){ ctx.globalAlpha=e.flash*.7; ctx.fillStyle=C.flash;
    ctx.beginPath(); ctx.ellipse(0,0,20,11,0,0,TAU); ctx.fill(); ctx.globalAlpha=1; }
  ctx.restore();
}

function drawBeast(e){
  const z=cam.z, sx=w2sx(e.x), sy=w2sy(e.y);
  const deer = e.kind==='deer';
  const tone = bodyTone(e);
  if(e.dead){
    entShadow(e,9,5);
    if(PASS===1) return;
    ctx.save(); ctx.translate(sx,sy); ctx.scale(z,z);
    ctx.globalAlpha=clamp(1-(e.dieT-22)/5,0,1);
    ctx.fillStyle=tone; ctx.beginPath(); ctx.ellipse(0,0,10,5,e.deathAng||0,0,TAU); ctx.fill();
    ctx.globalAlpha=1; ctx.restore(); return;
  }
  entShadow(e, 10, 6);
  if(PASS===1) return;
  ctx.save(); ctx.translate(sx,sy-5*z); ctx.scale(z,z); ctx.rotate(e.aim);
  const spd=Math.hypot(e.vx,e.vy), run=Math.min(1,spd/120), lg=Math.sin(now*17)*run*3.4;
  ctx.fillStyle=shade(tone,-.15);
  for(const o of [[-6,-4],[-6,4],[6,-4],[6,4]]){
    ctx.beginPath(); ctx.ellipse(o[0]+lg*Math.sign(o[0]),o[1],2.4,1.8,0,0,TAU); ctx.fill(); }
  ctx.fillStyle=tone;
  ctx.beginPath(); ctx.ellipse(0,0,deer?12:10,deer?6:5.4,0,0,TAU); ctx.fill();
  ctx.globalAlpha=.7; ctx.strokeStyle=C.ink; ctx.lineWidth=1.5; ctx.stroke(); ctx.globalAlpha=1;
  ctx.beginPath(); ctx.ellipse(deer?13:11,0,deer?5:4.6,3.4,0,0,TAU); ctx.fillStyle=shade(tone,-.06); ctx.fill();
  if(deer){ ctx.strokeStyle='#d8c6a0'; ctx.lineWidth=1.4;
    ctx.beginPath();
    ctx.moveTo(14,-2); ctx.lineTo(19,-6); ctx.moveTo(16,-3); ctx.lineTo(18,-8);
    ctx.moveTo(14, 2); ctx.lineTo(19, 6); ctx.moveTo(16, 3); ctx.lineTo(18, 8);
    ctx.stroke();
  } else { // coyote: ears + a crimson trim so it reads as a threat
    ctx.fillStyle=C.ink;
    ctx.beginPath(); ctx.moveTo(10,-3); ctx.lineTo(13,-7); ctx.lineTo(8,-5); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(10, 3); ctx.lineTo(13, 7); ctx.lineTo(8, 5); ctx.closePath(); ctx.fill();
    ctx.strokeStyle=C.outlaw; ctx.lineWidth=1.6; ctx.globalAlpha=.9;
    ctx.beginPath(); ctx.ellipse(0,0,10,5.4,0,-1.8,1.8); ctx.stroke(); ctx.globalAlpha=1;
  }
  ctx.fillStyle=shade(tone,-.2);
  ctx.beginPath(); ctx.ellipse(-11,0,4,2,0,0,TAU); ctx.fill();
  if(e.flash>0){ ctx.globalAlpha=e.flash*.8; ctx.fillStyle=C.flash;
    ctx.beginPath(); ctx.ellipse(0,0,11,6,0,0,TAU); ctx.fill(); ctx.globalAlpha=1; }
  ctx.restore();
  if(e.hp<e.maxhp&&e.hp>0){ const bw=20*z,f=e.hp/e.maxhp;
    ctx.fillStyle='rgba(18,13,16,.7)'; ctx.fillRect(sx-bw/2,sy-26*z,bw,3*z);
    ctx.fillStyle=deer?'#a3794d':C.outlaw; ctx.fillRect(sx-bw/2,sy-26*z,bw*f,3*z); }
}

function drawEnt(e){
  if(e.kind==='horse') drawHorse(e);
  else if(e.team==='beast') drawBeast(e);
  else drawHuman(e);
}

// ---- interactable spot markers -----------------------------------------
function drawSpot(s){
  if(!s.on) return;
  const d = dist(P.x,P.y,s.x,s.y);
  if(d>560) return;
  const sx=w2sx(s.x), sy=w2sy(s.y), z=cam.z;
  const near = d<s.r;
  const pulse = .55+Math.sin(now*2.6)*.18;
  ctx.save();
  ctx.globalAlpha = (near?.95:.42)*clamp((560-d)/200,0,1);
  ctx.strokeStyle=C.gold; ctx.lineWidth=(near?2.6:1.6)*z;
  ctx.beginPath(); ctx.ellipse(sx,sy,(near?20:14)*z*pulse*1.3,(near?11:8)*z*pulse*1.3,0,0,TAU); ctx.stroke();
  if(near){
    ctx.globalAlpha=.9;
    const yy = sy-30*z + Math.sin(now*3)*2*z;
    ctx.fillStyle=C.gold; ctx.beginPath();
    ctx.arc(sx,yy,9*z,0,TAU); ctx.fill();
    ctx.fillStyle=C.ink; ctx.font='bold '+(11*z)+'px '+FT;
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('E',sx,yy+.5*z);
    addLight(s.x,s.y,120,C.gold,.35);
  }
  ctx.restore(); ctx.globalAlpha=1;
}

// ---- pickups ------------------------------------------------------------
const pickups = [];
function dropPickup(x,y,kind,data){
  pickups.push({_k:'u',x:x,y:y,kind:kind,data:data||{},t:0,vz:rnd(60,140),z:6,life:180});
}
function drawPickup(pk){
  const sx=w2sx(pk.x), sy=w2sy(pk.y)-pk.z*cam.z, z=cam.z;
  const bob=Math.sin(now*3+pk.x*.01)*3*z;
  if(shadowA>.02){ ctx.globalAlpha=shadowA*.6; ctx.fillStyle=C.ink;
    ctx.beginPath(); ctx.ellipse(w2sx(pk.x),w2sy(pk.y),7*z,3.4*z,0,0,TAU); ctx.fill(); ctx.globalAlpha=1; }
  ctx.save(); ctx.translate(sx,sy+bob); ctx.scale(z,z);
  if(pk.kind==='gun'){
    const g=GUNS[pk.data.id];
    // lying on the ground, angled, drawn as the gun it actually is
    ctx.save(); ctx.rotate(-0.42); ctx.translate(-(g.art? g.art.bl*0.45 : 6), 0);
    ctx.scale(0.85,0.85); drawGunArt(g, 1); ctx.restore();
    addLight(pk.x,pk.y,90,RARC[g.rar],.4+Math.sin(now*4)*.12);
  } else if(pk.kind==='money'){
    ctx.fillStyle=C.gold; ctx.beginPath(); ctx.arc(0,0,5,0,TAU); ctx.fill();

  } else {
    ctx.fillStyle='#8a6b45'; ctx.beginPath(); rr(-6,-6,12,12,2); ctx.fill();
    ctx.strokeStyle=C.gold; ctx.lineWidth=1.6; ctx.stroke();
    addLight(pk.x,pk.y,60,C.gold,.25);
  }
  ctx.restore();
}

// ==========================================================================
//  PLAYER
// ==========================================================================
let cine = null;                       // active cinematic
let grade = { mono:0, red:0, gold:0 };  // post-process grade pushes

function gainXP(n){
  P.xp+=n;
  const need=lvlNeed(P.lvl);
  if(P.xp>=need){ P.xp-=need; P.lvl++; P.sp++;
    P.maxhp+=6; P.hp=P.maxhp;
    toast('LEVEL '+P.lvl, 'A skill point earned — press K', C.gold);
    sfx('chime'); addTrauma(.12);
    for(let i=0;i<26;i++){ const a=rnd(TAU);
      spawnP(P.x,P.y-8,Math.cos(a)*rnd(60,220),Math.sin(a)*rnd(60,220),rnd(.5,1),rnd(1.5,3),C.gold,'spark',{drag:.9}); }
  }
}
function lvlNeed(l){ return Math.round(120*Math.pow(1.28,l-1)); }

function addWanted(n, reason){
  const before=Math.floor(P.wanted);
  P.wanted=clamp(P.wanted+n,0,5);
  P.bounty += Math.round(n*70+rnd(0,40));
  P.noto += n*4;
  if(Math.floor(P.wanted)>before){
    toast('WANTED — '+Math.floor(P.wanted)+' STAR'+(P.wanted>=2?'S':''), reason||'The law is coming.', C.outlaw);
    sfx('drone',{f:44,dur:1.6});
    spawnPosse(Math.floor(P.wanted));
  }
}
function spawnPosse(n){
  const a0=rnd(TAU);
  for(let i=0;i<n+1;i++){
    const a=a0+i*0.6, d=760+rnd(0,160);
    const e=makeEnt({x:clamp(P.x+Math.cos(a)*d,40,WORLD.w-40), y:clamp(P.y+Math.sin(a)*d,40,WORLD.h-40),
      team:'law', kind:'law', name:npcName(), title:'POSSE', hp:85+n*12,
      gun:pick(['peace','coach','trapper','lever']), spd:80, loot:rndi(16,44)});
    e.state='combat'; e.target=P; e.posse=true;
  }
}

function autoReload(){
  const g=gunDef(), id=gunId();
  if(P.reloadT>0) return;
  if(P.mags[id]>=g.mag) return;
  const at=AMMO_OF[g.cls];
  if(P.ammo[at]<=0){ toast('OUT OF '+AMMO_NAME[at], 'Buy more in town.', C.outlaw); return; }
  P.reloadT = g.rl*(P.perks.quick?0.72:1);
  P.reloadMax = P.reloadT;
  sfx('reload');
}
function finishReload(){
  const g=gunDef(), id=gunId(), at=AMMO_OF[g.cls];
  const need=g.mag-P.mags[id];
  const take=Math.min(need,P.ammo[at]);
  P.mags[id]+=take; P.ammo[at]-=take;
  sfx('click');
}

function playerShoot(){
  const g=gunDef(), id=gunId();
  if(P.reloadT>0||cine) return;
  const free = P.abMode==='storm'||P.abMode==='spin';
  if(!free && P.mags[id]<=0){ sfx('click',{vol:.5}); autoReload(); return; }
  if(P.fireT>0) return;
  const rofMul = P.abMode==='spin'?1.9 : P.abMode==='storm'?1.7 : 1;
  P.fireT = 1/(g.rof*rofMul);
  if(!free) P.mags[id]--;

  const inc = P.fireMod>0;
  if(inc) P.fireMod--;
  let spr = g.spr*(P.perks.sharp?0.60:1)*(P.de?0.30:1)*(P.abMode==='storm'||P.abMode==='spin'?0.35:1);
  spr *= (P.mounted?1.9:1);
  const base = P.aim + rnd(-1,1)*spr*0.35;
  const dmgMul = (P.perks.slinger?1.18:1)*(P.de?1.1:1);
  const rngMul = (P.perks.sharp?1.2:1);

  for(let i=0;i<g.pel;i++){
    fireBullet({ x:P.x+Math.cos(base)*17, y:P.y-8+Math.sin(base)*17,
      a: base + (g.pel>1? rnd(-1,1)*spr : rnd(-1,1)*spr*0.5),
      spd:g.spd, dmg:g.dmg*dmgMul*(inc?1.1:1), own:P, rng:g.rng*rngMul,
      col: g.rar===3?C.gold:C.flash, w: g.cls==='rifle'?2.6:2.0, life:1.3,
      fire: inc?1:0 });
  }
  muzzle(P, base, g);
  P.recoil = Math.min(1, P.recoil + g.rec*0.14);
  cam.trauma = Math.min(1, cam.trauma + g.rec*0.055);
  P.aim -= 0; // recoil is visual only — the reticle stays honest
  sfx(g.cls==='shotgun'?'shotgun':g.cls==='rifle'?'rifle':'shot',{vol:.85});
  const kb = g.rec*9;
  P.kx = (P.kx||0) - Math.cos(base)*kb*6; P.ky = (P.ky||0) - Math.sin(base)*kb*6;
}

// ---- abilities ----------------------------------------------------------
function useAbility(){
  const g=gunDef(), id=gunId();
  if(!g.ab){ toast('NO ABILITY','This iron is honest, nothing more.','#a89a80'); return; }
  if(P.abCD>0){ sfx('click',{vol:.4}); return; }
  P.abCD = g.ab.cd;
  toast(g.ab.n, g.ab.d, RARC[g.rar]);
  sfx('whoosh');
  addTrauma(.18);
  for(let i=0;i<22;i++){ const a=rnd(TAU);
    spawnP(P.x,P.y-8,Math.cos(a)*rnd(80,250),Math.sin(a)*rnd(80,250),rnd(.3,.7),rnd(1.5,3),RARC[g.rar],'spark',{drag:.88}); }
  spawnP(P.x,P.y-6,0,0,.5,26,RARC[g.rar],'ring');

  switch(id){
    case 'rattler': P.abMode='fan'; P.abT=0.75; P.fanT=0; break;
    case 'sawtooth': P.fireMod=3; break;
    case 'whisper': railShot(g.dmg*3.2, 99, 5, C.flash); break;
    case 'roadagent': for(let i=0;i<6;i++){
        fireBullet({x:P.x+Math.cos(P.aim)*17,y:P.y-8+Math.sin(P.aim)*17,a:P.aim+rnd(-.35,.35),
          spd:g.spd*.9,dmg:g.dmg*1.1,own:P,rng:1400,col:C.gold,w:2.4,life:2.4,ric:3,homing:3.4}); }
      break;
    case 'thunder': concussion(); break;
    case 'vaquero': P.abMode='storm'; P.abT=4.0; break;
    case 'longrider': {
      const t=aimTarget(900);
      if(t){ t.markT=9; toast('MARKED','He is already dead. He just does not know.',C.gold); }
      break; }
    case 'deadmans': for(let i=0;i<8;i++){
        fireBullet({x:P.x+Math.cos(P.aim)*17,y:P.y-8+Math.sin(P.aim)*17,a:P.aim+(i-3.5)*0.13,
          spd:g.spd,dmg:g.dmg*1.15,own:P,rng:1600,col:C.gold,w:2.6,life:2.6,ric:2,homing:4.2}); }
      break;
    case 'judgment': hellfire(); break;
    case 'widow': railShot(g.dmg*3.6, 99, 7, C.gold); break;
    case 'ironhorse': P.abMode='spin'; P.abT=4.5; break;
  }
}
function aimTarget(rad){
  let best=null,bs=-1;
  for(const e of ents){ if(e.dead||e.hp<=0||!hostile(P,e)) continue;
    const d=dist(P.x,P.y,e.x,e.y); if(d>rad) continue;
    const a=angTo(P.x,P.y,e.x,e.y);
    let da=Math.abs(((a-P.aim+Math.PI)%TAU+TAU)%TAU-Math.PI);
    if(da>0.5) continue;
    const s=(1-da/0.5)*2 + (1-d/rad);
    if(s>bs){bs=s;best=e;}
  }
  return best;
}
function railShot(dmg, pierce, width, col){
  const a=P.aim, len=2400;
  fireBullet({x:P.x+Math.cos(a)*18,y:P.y-8+Math.sin(a)*18,a:a,spd:4200,dmg:dmg,own:P,
    rng:len,col:col,w:width,life:1.0,pierce:pierce,big:1});
  addTrauma(.4); hitstop=Math.max(hitstop,.06);
  for(let i=0;i<40;i++){ const t=i/40;
    spawnP(P.x+Math.cos(a)*(30+t*len*0.5), P.y-8+Math.sin(a)*(30+t*len*0.5),
      Math.cos(a+Math.PI/2)*rnd(-90,90), Math.sin(a+Math.PI/2)*rnd(-90,90),
      rnd(.25,.6), rnd(1.5,3.5), col,'spark',{drag:.86}); }
  sfx('rifle',{vol:1});
}
function concussion(){
  const a=P.aim;
  spawnP(P.x+Math.cos(a)*40,P.y-8+Math.sin(a)*40,0,0,.6,52,C.bone,'ring');
  sfx('boom',{vol:.8}); addTrauma(.5);
  for(const e of ents){ if(e.dead||e.hp<=0||!hostile(P,e)) continue;
    const d=dist(P.x,P.y,e.x,e.y); if(d>300) continue;
    const ea=angTo(P.x,P.y,e.x,e.y);
    let da=Math.abs(((ea-a+Math.PI)%TAU+TAU)%TAU-Math.PI);
    if(da>1.0) continue;
    damage(e, 46*(1-d/300)+14, P, ea);
    e.kx=(e.kx||0)+Math.cos(ea)*620; e.ky=(e.ky||0)+Math.sin(ea)*620; e.stun=1.3;
  }
  propsNear(P.x,P.y,300,_pn);
  for(const p of _pn){ if(p.t==='barrel'||p.t==='crate'){
    const ea=angTo(P.x,P.y,p.x,p.y);
    let da=Math.abs(((ea-a+Math.PI)%TAU+TAU)%TAU-Math.PI);
    if(da<1.0 && dist(P.x,P.y,p.x,p.y)<240){ p.solid=false; p.t='stump'; p.s*=.6;
      for(let i=0;i<8;i++) spawnP(p.x,p.y-8,rnd(-200,200),rnd(-220,20),.6,2.4,'#8a6b45','chip',{grav:520}); } } }
}
function hellfire(){
  const a=P.aim;
  for(let i=0;i<26;i++){
    const sa=a+rnd(-.42,.42);
    fireBullet({x:P.x+Math.cos(a)*16,y:P.y-8+Math.sin(a)*16,a:sa,spd:rnd(420,760),
      dmg:11,own:P,rng:360,col:'#ff8a2a',w:3.4,life:.8,fire:1,pierce:2});
  }
  for(let i=0;i<40;i++){ const sa=a+rnd(-.5,.5), dd=rnd(30,300);
    spawnP(P.x+Math.cos(sa)*dd,P.y-8+Math.sin(sa)*dd,Math.cos(sa)*rnd(30,120),Math.sin(sa)*rnd(30,120),
      rnd(.5,1.2),rnd(5,11),'#ff7a1e','fire',{drag:.93}); }
  sfx('boom',{vol:.9}); addTrauma(.35);
}

// ---- awakenings ---------------------------------------------------------
function canAwaken(){ const g=gunDef(); return g.aw && P.awaken>=P.awakenMax; }
function startAwaken(){
  const g=gunDef(), id=gunId();
  if(!g.aw){ toast('NO AWAKENING','Only a legend can wake.','#a89a80'); return; }
  if(P.awaken<P.awakenMax){ sfx('click',{vol:.4}); return; }
  // Gather BEFORE spending. 720 was barely a screen wide, so men just off the
  // edge were ignored and the awakening fired at nothing.
  const targets=[];
  for(const e of ents){ if(e.dead||e.hp<=0||!hostile(P,e)) continue;
    if(dist(P.x,P.y,e.x,e.y)<1300) targets.push(e); }
  targets.sort((a,b)=>dist2(P.x,P.y,a.x,a.y)-dist2(P.x,P.y,b.x,b.y));
  // The Last Hand executes a list. With an empty list it used to play the whole
  // cinematic, eat the full meter and do nothing at all — so it now refuses.
  if(id==='deadmans' && !targets.length){
    toast('NOBODY TO FINISH','The Last Hand needs a hand to play against.','#a89a80');
    sfx('click',{vol:.5}); return;
  }
  P.awaken=0;
  cine = { kind:id, name:g.aw.n, sub:g.aw.d, t:0, phase:0, targets:targets.slice(0,8),
           idx:0, ox:P.x, oy:P.y, oa:P.aim, ring:0, done:false, hits:[] };
  P.iframe = 6;
  sfx('drone',{f:38,dur:3.2}); sfx('chime');
  addTrauma(.5);
}

function updateCine(d){
  if(!cine) return;
  cine.t += d;
  const t=cine.t;
  const k=cine.kind;
  P.vx*=0.3; P.vy*=0.3;

  if(k==='deadmans'){
    slowmo = t<1.15 ? 0.03 : (t<4.0 ? 0.10 : 0.4);
    cam.tz = t<1.15? 1.55 : 1.35;
    if(t<1.15){
      if(!cine.marked){ cine.marked=true;
        for(const e of cine.targets){ e.markT=9; }
        sfx('ui',{f:180}); }
    } else if(t<4.0){
      const step=0.30;
      while(cine.idx<cine.targets.length && t-1.15 > cine.idx*step){
        const e=cine.targets[cine.idx];
        if(e && !e.dead && e.hp>0){
          const a=angTo(P.x,P.y,e.x,e.y);
          cine.hits.push({x1:P.x,y1:P.y-8,x2:e.x,y2:e.y-8,t:0});
          muzzle(P,a,gunDef());
          damage(e, 260, P, a);
          addTrauma(.3); hitstop=Math.max(hitstop,.03);
          sfx('shot',{vol:.9});
        }
        cine.idx++;
      }
    } else if(t>4.6){ endCine(); }
  }
  else if(k==='judgment'){
    slowmo = t<1.0? 0.08 : 0.5;
    cam.tz = 1.2;
    grade.red = Math.max(grade.red, t<3.6? 0.5:0);
    if(t>1.0 && cine.ring<4 && t-1.0 > cine.ring*0.45){
      cine.ring++;
      const rad=90+cine.ring*95;
      spawnP(P.x,P.y-6,0,0,.8,rad*0.26,'#ff8a2a','ring');
      for(let i=0;i<46;i++){ const a=i/46*TAU;
        spawnP(P.x+Math.cos(a)*rad*.4,P.y-6+Math.sin(a)*rad*.4,Math.cos(a)*rad*1.5,Math.sin(a)*rad*1.5,
          rnd(.6,1.2),rnd(6,13),'#ff7a1e','fire',{drag:.9}); }
      for(let i=0;i<10;i++){ const a=rnd(TAU); addDecal(P.x+Math.cos(a)*rad*.7,P.y+Math.sin(a)*rad*.7,rnd(14,30),'scorch'); }
      for(const e of ents){ if(e.dead||e.hp<=0||!hostile(P,e)) continue;
        const dd=dist(P.x,P.y,e.x,e.y);
        if(Math.abs(dd-rad)<110) damage(e, 95, P, angTo(P.x,P.y,e.x,e.y), 1);
      }
      addTrauma(.45); sfx('boom',{vol:.85});
    }
    if(t>4.2) endCine();
  }
  else if(k==='widow'){
    slowmo = t<1.1? 0.05 : 0.14;
    cam.tz = 1.45;
    grade.mono = Math.max(grade.mono, t<3.2? 1 : 0);
    // "One shot crosses all of it" — so it always fires, whether or not anyone
    // happens to be standing in the way.
    if(t>1.1 && !cine.fired){
      cine.fired=true;
      const a2=cine.oa;
      cine.hits.push({x1:P.x, y1:P.y-8,
        x2:P.x+Math.cos(a2)*2400, y2:P.y-8+Math.sin(a2)*2400, t:0});
      fireBullet({x:P.x+Math.cos(a2)*18, y:P.y-8+Math.sin(a2)*18, a:a2, spd:5200,
        dmg:340, own:P, rng:2600, col:'#9fd4e8', w:9, life:1.2, pierce:99, big:1});
      addTrauma(.55); hitstop=Math.max(hitstop,.05); sfx('rifle',{vol:1});
      for(let i=0;i<50;i++){ const tt=i/50;
        spawnP(P.x+Math.cos(a2)*(40+tt*1400), P.y-8+Math.sin(a2)*(40+tt*1400),
          Math.cos(a2+Math.PI/2)*rnd(-70,70), Math.sin(a2+Math.PI/2)*rnd(-70,70),
          rnd(.3,.7), rnd(1.4,3), '#9fd4e8','spark',{drag:.88}); }
    }
    if(t>1.1 && cine.idx<cine.targets.length && t-1.1 > cine.idx*0.22){
      const e=cine.targets[cine.idx];
      const prev = cine.idx===0? {x:P.x,y:P.y-8} : cine.targets[cine.idx-1];
      if(e && !e.dead && e.hp>0){
        cine.hits.push({x1:prev.x,y1:prev.y-8,x2:e.x,y2:e.y-8,t:0});
        damage(e, 340, P, angTo(prev.x,prev.y,e.x,e.y));
        addTrauma(.26); sfx('rifle',{vol:.9}); hitstop=Math.max(hitstop,.04);
      }
      cine.idx++;
    }
    if(t>3.9) endCine();
  }
  else if(k==='ironhorse'){
    slowmo = t<0.9? 0.1 : 0.55;
    cam.tz = 1.25;
    if(t>0.9 && t<3.2){
      const sweep=(t-0.9)/2.3;
      const a=cine.oa - 1.15 + sweep*2.3;
      P.aim=a;
      cine.fireAcc=(cine.fireAcc||0)+d;
      while(cine.fireAcc>0.028){
        cine.fireAcc-=0.028;
        fireBullet({x:P.x+Math.cos(a)*18,y:P.y-8+Math.sin(a)*18,a:a+rnd(-.05,.05),
          spd:2100,dmg:30,own:P,rng:900,col:C.gold,w:2.8,life:.9,pierce:1});
        muzzle(P,a,gunDef());
      }
      addTrauma(.03);
      // ghost horses
      if(chance(d*7)){
        cine.ghosts=cine.ghosts||[];
        cine.ghosts.push({x:P.x+Math.cos(a+rnd(-.8,.8))*40,y:P.y+Math.sin(a+rnd(-.8,.8))*40,a:a,t:0});
      }
    }
    if(cine.ghosts) for(const gh of cine.ghosts){
      gh.t+=d; gh.x+=Math.cos(gh.a)*520*d; gh.y+=Math.sin(gh.a)*520*d;
      for(const e of ents){ if(e.dead||e.hp<=0||!hostile(P,e)) continue;
        if(dist2(e.x,e.y,gh.x,gh.y)<34*34){ damage(e,26,P,gh.a);
          e.kx=(e.kx||0)+Math.cos(gh.a)*300; e.ky=(e.ky||0)+Math.sin(gh.a)*300; } }
    }
    if(t>3.8) endCine();
  }
}
function endCine(){
  cine=null; slowmo=1; cam.tz=1; P.iframe=Math.max(P.iframe,.5);
}

// ---- dynamite -----------------------------------------------------------
const thrown = [];
function throwDynamite(){
  if((P.items.dynamite||0)<=0){ toast('NO DYNAMITE','Halloran sells it.','#a89a80'); return; }
  P.items.dynamite--;
  const a=P.aim, d=Math.min(340, dist(P.x,P.y,mouse.wx,mouse.wy));
  thrown.push({x:P.x,y:P.y-10,tx:P.x+Math.cos(a)*d,ty:P.y+Math.sin(a)*d,t:0,dur:.62,z:0,fuse:1.5,
    sx:P.x,sy:P.y-10});
  sfx('whoosh',{vol:.5});
}
function updateThrown(d){
  for(let i=thrown.length-1;i>=0;i--){
    const t=thrown[i];
    if(t.t<t.dur){
      t.t+=d; const u=clamp(t.t/t.dur,0,1);
      t.x=lerp(t.sx,t.tx,u); t.y=lerp(t.sy,t.ty,u);
      t.z=Math.sin(u*Math.PI)*46;
    } else {
      t.fuse-=d;
      if(chance(d*30)) spawnP(t.x,t.y-t.z,rnd(-30,30),rnd(-60,-10),.4,2,C.gold,'spark');
      if(t.fuse<=0){ explode(t.x,t.y,190,120,P); thrown.splice(i,1); }
    }
  }
}
function drawThrown(){
  for(const t of thrown){
    const sx=w2sx(t.x), sy=w2sy(t.y)-t.z*cam.z, z=cam.z;
    if(shadowA>.02){ ctx.globalAlpha=shadowA*.5; ctx.fillStyle=C.ink;
      ctx.beginPath(); ctx.ellipse(w2sx(t.x),w2sy(t.y),5*z,2.5*z,0,0,TAU); ctx.fill(); ctx.globalAlpha=1; }
    ctx.save(); ctx.translate(sx,sy); ctx.scale(z,z); ctx.rotate(now*9);
    ctx.fillStyle=C.outlaw; ctx.beginPath(); rr(-3,-7,6,14,2); ctx.fill();
    ctx.fillStyle=C.ink; ctx.fillRect(-3,-2,6,2);
    ctx.restore();
    addLight(t.x,t.y,44,C.gold,.3);
  }
}

// ==========================================================================
//  PLAYER UPDATE
// ==========================================================================
let nearSpot = null, nearNPC = null;

function updatePlayer(d){
  const m = P.mounted;

  // aim always follows the cursor
  mouse.wx = s2wx(mouse.x); mouse.wy = s2wy(mouse.y);
  if(!cine) P.aim = angTo(P.x, P.y-8, mouse.wx, mouse.wy);

  // ---- timers
  P.fireT-=d; P.abCD=Math.max(0,P.abCD-d); P.recoil*=Math.pow(.02,d);
  P.iframe-=d; P.rollCD-=d;
  if(P.abT>0){ P.abT-=d; if(P.abT<=0){ P.abMode=null; } }
  if(P.reloadT>0){ P.reloadT-=d; if(P.reloadT<=0) finishReload(); }
  if(P.hp<P.maxhp && P.regen>0){ const h=Math.min(P.regen*d*14, P.maxhp-P.hp); P.hp+=h; P.regen-=d; }

  // ---- fan the hammer keeps pulling the trigger for you
  if(P.abMode==='fan'){
    P.fanT-=d;
    if(P.fanT<=0 && P.mags[gunId()]>0){ P.fanT=0.075; P.fireT=0; playerShoot(); }
    if(P.mags[gunId()]<=0) P.abMode=null;
  }

  if(cine) return;

  // ---- dead eye
  const wantDE = mouse.rdown && P.deadeye>2;
  if(wantDE){
    P.de=true; P.deadeye-=d*(P.perks.eye?20:28);
    if(P.deadeye<=0){ P.deadeye=0; P.de=false; }
  } else {
    P.de=false; P.deadeye=Math.min(P.deadeyeMax, P.deadeye + d*(P.perks.eye?11:7));
  }
  slowmo = P.de? 0.34 : 1;

  // ---- roll
  if(P.rollT>0){
    P.rollT-=d;
    const s = 430*easeOutCubic(clamp(P.rollT/0.34,0,1));
    moveEnt(P, Math.cos(P.rollA)*s*d, Math.sin(P.rollA)*s*d);
    if(chance(d*40)) spawnP(P.x,P.y,rnd(-40,40),rnd(-40,40),.5,rnd(3,7),C.paper2,'dust',{drag:.9});
    P.iframe=Math.max(P.iframe,0.05);
    return;
  }

  // ---- movement
  let ix=0, iy=0;
  if(keys['a']||keys['ArrowLeft']) ix-=1;
  if(keys['d']||keys['ArrowRight']) ix+=1;
  if(keys['w']||keys['ArrowUp']) iy-=1;
  if(keys['s']||keys['ArrowDown']) iy+=1;
  const il=Math.hypot(ix,iy);
  const sprint = (keys['Shift']||keys['shift']) && P.stam>1 && il>0;

  if(m){
    // ---- mounted
    const tgtA = il>0 ? Math.atan2(iy,ix) : m.aim;
    m.aim = angLerp(m.aim, tgtA, d*(sprint?4:6));
    const sp = (sprint? 340 : 210) * (il>0?1:0);
    moveEnt(m, Math.cos(m.aim)*sp*d, Math.sin(m.aim)*sp*d);
    m.vx=Math.cos(m.aim)*sp; m.vy=Math.sin(m.aim)*sp;
    P.x=m.x; P.y=m.y-2; P.vx=m.vx; P.vy=m.vy;
    if(sprint){ P.stam=Math.max(0,P.stam-d*16); if(chance(d*22))
      spawnP(m.x-Math.cos(m.aim)*16,m.y+6,rnd(-50,50),rnd(-50,20),.6,rnd(4,9),C.paper2,'dust',{drag:.92}); }
    else P.stam=Math.min(P.maxstam,P.stam+d*20);
    if(press(' ')){ dismount(); }
  } else {
    const base = P.spd*(P.perks.light?1.12:1);
    const sp = (sprint?base*1.62:base) * (P.de?0.55:1);
    if(il>0){ moveEnt(P, ix/il*sp*d, iy/il*sp*d);
      P.vx=ix/il*sp; P.vy=iy/il*sp;
      if(sprint){ P.stam=Math.max(0,P.stam-d*26);
        if(chance(d*16)) spawnP(P.x,P.y+2,rnd(-30,30),rnd(-30,10),.5,rnd(2,5),C.paper2,'dust',{drag:.9}); }
      else P.stam=Math.min(P.maxstam,P.stam+d*14);
    } else { P.vx*=Math.pow(.001,d); P.vy*=Math.pow(.001,d);
      P.stam=Math.min(P.maxstam,P.stam+d*26); }
    // roll
    if(press(' ') && P.rollCD<=0 && P.stam>18){
      P.rollT=0.34; P.rollCD=P.perks.light?0.42:0.62; P.stam-=18;
      P.rollA = il>0? Math.atan2(iy,ix) : P.aim;
      P.iframe=0.30; sfx('whoosh',{vol:.5});
      for(let i=0;i<10;i++) spawnP(P.x,P.y,rnd(-90,90),rnd(-90,90),.5,rnd(3,7),C.paper2,'dust',{drag:.9});
    }
  }

  // ---- shooting
  const g=gunDef();
  const auto = g.cls==='repeater' || P.abMode==='spin' || P.abMode==='storm';
  if((auto? mouse.down : mouse.clicked) && !uiBlocking()) playerShoot();

  // ---- keys
  if(press('r')) autoReload();
  if(press('q')) useAbility();
  if(press('f')) startAwaken();
  if(press('g')) throwDynamite();
  if(press('1')) swapTo(0);
  if(press('2')) swapTo(1);
  if(press('3')) swapTo(2);
  if(press('4')) swapTo(3);
  if(press('5')) swapTo(4);
  if(mouse.wheel) swapTo((P.gi + (mouse.wheel>0?1:-1) + P.guns.length)%P.guns.length);
  if(press('h')) useItem('whiskey');
  if(press('j')) useItem('bandage');

  // ---- interaction
  findNear();
  if(press('e')) interact();

  // ---- wanted decay
  if(P.wanted>0){
    let anyLaw=false;
    for(const e of ents) if(e.team==='law'&&!e.dead&&e.hp>0&&e.state==='combat'&&e.target===P){anyLaw=true;break;}
    if(!anyLaw) P.wanted=Math.max(0,P.wanted-d*(P.perks.bandit?0.09:0.035));
  }
  P.noto=Math.max(0,P.noto-d*0.04);
}

function swapTo(i){
  if(i>=P.guns.length||i===P.gi) return;
  P.gi=i; P.reloadT=0; P.abMode=null; P.fireT=Math.max(P.fireT,0.22);
  sfx('click',{vol:.6});
}
function useItem(id){
  if((P.items[id]||0)<=0) return;
  P.items[id]--;
  if(id==='whiskey'){ P.hp=Math.min(P.maxhp,P.hp+30); grade.gold=0.5; }
  if(id==='tonic') P.hp=Math.min(P.maxhp,P.hp+70);
  if(id==='bandage'){ P.regen=2.0; }
  addFloat(P.x,P.y-30,'+'+(id==='tonic'?70:id==='whiskey'?30:22),'#7fa06a',15);
  sfx('coin',{vol:.5});
}

function mount(h){
  P.mounted=h; h.rider=P; h.noHit=false; h.state='ridden';
  toast('MOUNTED', h.name+' — SPACE to step down', C.gold);
  sfx('whoosh',{vol:.6});
}
function dismount(){
  const h=P.mounted; if(!h) return;
  h.rider=null; h.state='idle'; h.stT=2; P.mounted=null;
  P.x=h.x+Math.cos(h.aim+Math.PI/2)*22; P.y=h.y+Math.sin(h.aim+Math.PI/2)*22;
}

function findNear(){
  nearSpot=null; nearNPC=null;
  let bd=1e9;
  for(const s of SPOTS){ if(!s.on) continue;
    const d=dist(P.x,P.y,s.x,s.y);
    if(d<s.r && d<bd){ bd=d; nearSpot=s; } }
  let nd=1e9;
  for(const e of ents){
    if(e.dead||e.hp<=0) continue;
    if(e.kind==='horse'){
      if(P.mounted) continue;
      const d=dist(P.x,P.y,e.x,e.y);
      if(d<46 && d<nd){ nd=d; nearNPC=e; }
      continue;
    }
    if(e.team!=='civ' && !(e.quest||e.talk)) continue;
    if(hostile(P,e)) continue;
    const d=dist(P.x,P.y,e.x,e.y);
    if(d<58 && d<nd){ nd=d; nearNPC=e; }
  }
  // NPCs wander, and one parked on a doorstep must not make the door
  // unusable. A door outranks a bystander — but never outranks someone who
  // actually has business with you.
  if(nearNPC && nearSpot){
    if(nearSpot.data && nearSpot.data.enter && !nearNPC.quest) nearNPC=null;
    else if(nd < bd) nearSpot=null;
    else nearNPC=null;
  }
}
function interact(){
  if(P.mounted){ dismount(); return; }
  if(nearNPC){
    if(nearNPC.kind==='horse'){
      if(nearNPC.tamed) mount(nearNPC);
      else {
        const moving=Math.hypot(P.vx,P.vy);
        if(moving>120){ nearNPC.state='flee'; nearNPC.stT=4; toast('SPOOKED','Walk up slow next time.','#a89a80'); }
        else { nearNPC.tamed=true; toast('BROKE IN','The horse is yours.',C.gold); sfx('chime'); mount(nearNPC); }
      }
      return;
    }
    talkTo(nearNPC); return;
  }
  if(nearSpot){ useSpot(nearSpot); return; }
}
function uiBlocking(){ return mode!=='play'; }

// ==========================================================================
//  QUESTS
// ==========================================================================
const QUESTS = {};          // id -> quest
const activeQ = [];         // ids
let tracked = null;
const named = {};           // npcId -> entity

function defQ(o){ o.state='locked'; o.cur=0; o.prog=0; QUESTS[o.id]=o; return o; }
function q(id){ return QUESTS[id]; }
function step(qq){ return qq.steps[qq.cur]; }

function offerQ(id){ const qq=q(id); if(qq && qq.state==='locked') qq.state='avail'; }
function startQ(id){
  const qq=q(id); if(!qq||qq.state==='active'||qq.state==='done') return;
  qq.state='active'; qq.cur=0; qq.prog=0;
  activeQ.push(id); tracked=id;
  toast('NEW JOB — '+qq.title, qq.steps[0].text, C.gold);
  sfx('chime');
  if(qq.onStart) qq.onStart();
}
function advQ(id){
  const qq=q(id); if(!qq||qq.state!=='active') return;
  if(qq.steps[qq.cur].onDone) qq.steps[qq.cur].onDone();
  qq.cur++; qq.prog=0;
  if(qq.cur>=qq.steps.length){ doneQ(id); return; }
  toast('OBJECTIVE', qq.steps[qq.cur].text, C.gold);
  sfx('ui',{f:660});
}
function doneQ(id){
  const qq=q(id); qq.state='done';
  const i=activeQ.indexOf(id); if(i>=0) activeQ.splice(i,1);
  if(tracked===id) tracked = activeQ[0]||null;
  const rw=qq.rw||{};
  let sub=[];
  if(rw.money){ P.money+=rw.money; sub.push('$'+rw.money); }
  if(rw.xp){ gainXP(rw.xp); sub.push(rw.xp+' XP'); }
  if(rw.gun){ giveGun(rw.gun); sub.push(GUNS[rw.gun].name); }
  if(rw.ammo){ for(const k in rw.ammo){ P.ammo[k]=(P.ammo[k]||0)+rw.ammo[k]; } }
  if(rw.item){ for(const k in rw.item){ P.items[k]=(P.items[k]||0)+rw.item[k]; } }
  if(rw.honor){ P.honor+=rw.honor; }
  toast('JOB DONE — '+qq.title, sub.join('  ·  '), C.gold);
  sfx('chime');
  if(qq.onDone) qq.onDone();
  if(qq.next) offerQ(qq.next);
}
function giveGun(id){
  if(P.guns.indexOf(id)>=0){ P.money+=200; return; }
  if(P.guns.length>=5){ P.guns[P.gi]=id; } else P.guns.push(id);
  P.mags[id]=GUNS[id].mag;
  const at=AMMO_OF[GUNS[id].cls];
  P.ammo[at]=(P.ammo[at]||0)+GUNS[id].mag*3;
  const g=GUNS[id];
  toast(RARN[g.rar]+' ARM — '+g.name, g.d, RARC[g.rar]);
  if(g.rar===3){ P.legend[id]=true; sfx('drone',{f:60,dur:2.4}); addTrauma(.4); grade.gold=1; }
}

// ---- objective progress hooks ------------------------------------------
function onKill(e){
  for(const id of activeQ.slice()){
    const qq=q(id), s=step(qq); if(!s) continue;
    if(s.t==='kill'){
      let ok=false;
      if(s.team && e.team===s.team) ok=true;
      if(s.kind && e.kind===s.kind) ok=true;
      if(s.tag && e.campTag===s.tag) ok=true;
      if(s.who && e.npcId===s.who) ok=true;
      if(s.near && dist(e.x,e.y,s.near[0],s.near[1])>s.near[2]) ok=false;
      if(ok){ qq.prog++; if(qq.prog>=(s.n||1)) advQ(id);
        else toast(qq.title, qq.prog+' / '+s.n+'  '+s.text, C.gold); }
    }
  }
  // bounty targets
  if(e.bountyFor){
    const qq=q(e.bountyFor);
    if(qq&&qq.state==='active'){ advQ(e.bountyFor); }
  }
}
function checkGoto(){
  for(const id of activeQ.slice()){
    const qq=q(id), s=step(qq); if(!s) continue;
    if(s.t==='goto' && dist(P.x,P.y,s.x,s.y)<(s.r||70)) advQ(id);
    if(s.t==='survive'){ qq.prog+=dt; if(qq.prog>=s.dur) advQ(id); }
  }
}
function questMark(){
  if(!tracked) return null;
  const qq=q(tracked); if(!qq||qq.state!=='active') return null;
  const s=step(qq); if(!s) return null;
  if(s.x!=null) return [s.x,s.y];
  if(s.t==='talk' && named[s.who] && !named[s.who].dead) return [named[s.who].x, named[s.who].y];
  if(s.t==='kill' && s.near) return [s.near[0],s.near[1]];
  if(s.t==='kill' && s.who && named[s.who]) return [named[s.who].x,named[s.who].y];
  if(s.t==='spot'){ for(const sp of SPOTS) if(sp.kind===s.kind) return [sp.x,sp.y]; }
  return null;
}
function objText(){
  if(!tracked) return null;
  const qq=q(tracked); if(!qq||qq.state!=='active') return null;
  const s=step(qq); if(!s) return null;
  let t=s.text;
  if(s.t==='kill'&&s.n>1) t+='  ('+qq.prog+'/'+s.n+')';
  if(s.t==='survive') t+='  ('+Math.max(0,Math.ceil(s.dur-qq.prog))+'s)';
  return {title:qq.title, text:t};
}

let boardSeed=1;
const BOUNTY_TITLES = ['THE PERDITION KID','ONE-EYE MARLOWE','RATTLESNAKE JUNE','DOC HOLLOWAY',
  'BLACKFOOT PIKE','THE OSGOOD BROTHERS','LAUGHING NED','CORA THE KNIFE','MOSE STRAND','SIX-GUN SADIE'];
function makeBountyOffer(i, outlawSide){
  const r=mulberry(boardSeed*977+i*131);
  const places=POI.filter(function(p){return p.kind!=='town';});
  const pl=places[(r()*places.length)|0];
  const n=2+Math.floor(r()*4)+Math.floor(P.lvl*0.4);
  const pay=Math.round((90+r()*140)*(1+P.lvl*0.22)*(outlawSide?1.25:1));
  const nm = BOUNTY_TITLES[(r()*BOUNTY_TITLES.length)|0];
  const id = 'board_'+(boardSeed)+'_'+i;
  const tag = 'brd'+boardSeed+'_'+i;
  const title = outlawSide? 'JOB — '+pl.name : 'BOUNTY — '+nm;
  const desc = outlawSide
    ? 'Kane pays for trouble at '+pl.name+'. '+n+' guns are in the way of it.'
    : nm+' and '+(n-1)+' others were seen near '+pl.name+'. The county pays on proof.';
  defQ({ id:id, title:title, side:outlawSide?'outlaw':'law', giver:'BOARD', board:true,
    desc:desc,
    steps:[
      {t:'goto', x:pl.x, y:pl.y, r:200, text:'Ride to '+pl.name+'.'},
      {t:'kill', tag:tag, n:n, text:'Deal with '+(outlawSide?'the guards':'the gang')+' at '+pl.name+'.'}
    ],
    rw:{money:pay, xp:80+n*26, honor:outlawSide?0:2},
    onStart:function(){
      const crew = outlawSide? (chance(.5)?'law':'outlaw') : 'outlaw';
      for(let k=0;k<n;k++){
        const a=r()*TAU, dd=60+r()*220;
        const e=makeEnt({x:clamp(pl.x+Math.cos(a)*dd,40,WORLD.w-40), y:clamp(pl.y+Math.sin(a)*dd,40,WORLD.h-40),
          team:crew, kind:crew, name:npcName(), hp:70+P.lvl*9,
          gun:pick(['rusted','navy','coach','trapper','lever','cattle','varmint']), spd:78, loot:rndi(10,40)});
        e.renegade=true; e.campTag=tag;
        if(k===0 && !outlawSide){ e.name=nm; e.boss=true; e.hp=e.maxhp=180+P.lvl*24; e.duelist=true; e.loot=pay>>1; }
      }
    }
  });
  return id;
}

function say(name, title, lines, opts){

function spawnNamed(){
  function mk(id,name,title,x,y,team,gun,hp){
    const e=makeEnt({x:x,y:y,team:team||'civ',kind:team==='law'?'law':team==='outlaw'?'outlaw':'civ',
      name:name,title:title,hp:hp||90,gun:gun||null,spd:54,loot:0});
    e.npcId=id; e.home=[x,y]; e.state='idle'; named[id]=e; return e;
  }
  const T=poi('town'), st=T.y;
  mk('ARDEN','TOM ARDEN','SALOON BOY',1700,st-40,'civ');
  mk('HALLORAN','JEB HALLORAN','SHOPKEEP',2070,st-46,'civ');
  mk('SMITH','VERA STRAND','GUNSMITH',2240,st+46,'civ');
  mk('DOC','DOC PERRY','PHYSICIAN',1920,st+46,'civ');
  mk('CORDELL','ABEL CORDELL','COUNTY SHERIFF',1700,st+46,'law','longrider',300).title='COUNTY SHERIFF';
  const K=poi('camp');
  mk('KANE','SILAS KANE','BLACK MESA',K.x-40,K.y+50,'outlaw','vaquero',300);
  const F=poi('farm');
  mk('MAE','MAE CALLOWAY','HOMESTEADER',F.x-30,F.y-70,'civ');
  named['KANE'].hat=1; named['CORDELL'].hat=1;
  refreshQuestMarks();
}
function refreshQuestMarks(){
  for(const k in named) named[k].quest=null;
  for(const id in QUESTS){
    const qq=QUESTS[id];
    if(qq.state==='avail' && qq.giver && named[qq.giver]) named[qq.giver].quest=id;
    if(qq.state==='active'){
      const s=step(qq);
      if(s && s.t==='talk' && named[s.who]) named[s.who].quest=id;
      if(s && s.t==='choose'){ if(named['CORDELL'])named['CORDELL'].quest=id; if(named['KANE'])named['KANE'].quest=id; }
    }
  }
}

function useSpot(s){
  if(s.kind==='exit'){ exitRoom(); return; }
  // A door is a door. Quest 'spot' steps are satisfied by the counter INSIDE,
  // so "step into the Dry Gulch" means actually stepping into the Dry Gulch.
  if(s.data && s.data.enter){ enterRoom(s.data.enter); return; }
  // satisfy quest 'spot' objectives first
  for(const aid of activeQ.slice()){
    const qq=q(aid), st2=step(qq);
    if(st2 && st2.t==='spot' && st2.kind===s.kind){ advQ(aid); refreshQuestMarks(); }
  }
  switch(s.kind){
    case 'saloon': saloonMenu(); break;
    case 'shop_general': openShop('general'); break;
    case 'shop_gun': openShop('gun'); break;
    case 'doctor': say('PHYSICIAN','REDWATER',['Doc Perry keeps hours and a bill.'],
        [{t:'Patch me up ($'+docPrice()+')',fn:doctorHeal},{t:'Leave it',fn:closeDlg}]); break;

    case 'board_bounty': openBoard('bounty'); break;

    case 'camp': campMenu(); break;
    case 'church': churchMenu(); break;

        [{t:'Pay respects', fn:function(){ P.honor+=1; P.hp=Math.min(P.maxhp,P.hp+15); closeDlg(); }},{t:'Leave',fn:closeDlg}]); break;
    case 'lookout': lookoutMenu(); break;
    case 'ruin': ruinMenu(); break;
    case 'mine': say('COPPER CREEK MINE','',
        [q('minetrouble').state==='done'? 'The shafts are quiet now. Honestly quiet.'
          : 'The cage is down and the lamps are still burning. Somebody is in there.'],
        [q('minetrouble').state==='locked'
          ? {t:'Look into it', fn:function(){ offerQ('minetrouble'); startQ('minetrouble'); refreshQuestMarks(); closeDlg(); }}
          : {t:'Leave',fn:closeDlg}, {t:'Leave',fn:closeDlg}]); break;

    case 'manor': manorMenu(); break;

function openShop(kind){

      {id:'dynamite',type:'item'},{id:'ammo_pistol',type:'item'},{id:'ammo_shell',type:'item'},{id:'ammo_rifle',type:'item'});

function buy(entry){
  if(entry.type==='gun'){
    const g=GUNS[entry.id];
    if(P.guns.indexOf(entry.id)>=0){ toast('ALREADY OWNED','',C.bone); return; }
    if(P.money<g.price){ toast('NOT ENOUGH COIN','$'+g.price+' is the price.',C.outlaw); sfx('click'); return; }
    P.money-=g.price; giveGun(entry.id); sfx('coin');
  } else {
    const it=ITEMS[entry.id];
    if(P.money<it.price){ toast('NOT ENOUGH COIN','',C.outlaw); sfx('click'); return; }
    P.money-=it.price;
    if(entry.id==='ammo_pistol') P.ammo.pistol+=24;
    else if(entry.id==='ammo_shell') P.ammo.shell+=16;
    else if(entry.id==='ammo_rifle') P.ammo.rifle+=20;
    else P.items[entry.id]=(P.items[entry.id]||0)+1;
    sfx('coin'); addFloat(P.x,P.y-30,it.n,C.gold,12);
  }
}
function openBoard(kind){
  if(kind==='bounty' && P.side==='outlaw'){ toast('NOT FOR YOU','That board has your face on it.',C.outlaw); return; }
  if(kind==='heist' && P.side!=='outlaw'){ toast('NOT FOR YOU','Kane does not deal with tin.',C.outlaw); return; }
  if(!boardOffers[kind].length) refreshBoard(kind);
  // drop finished ones
  boardOffers[kind]=boardOffers[kind].filter(function(id){ return q(id) && q(id).state!=='done'; });
  while(boardOffers[kind].length<3){ boardOffers[kind].push(makeBountyOffer(boardOffers[kind].length+(boardSeed++), kind==='heist')); }
  board={kind:kind, sel:0}; mode='board'; sfx('ui',{f:440});
}

function startDuel(opponent){
  const nm = opponent? opponent.name : pick(BOUNTY_TITLES);
  slowmo = 1;
  duel = { name:nm, t:0, phase:'stare', wait:rnd(1.8,3.6), drawT:rnd(0.30,0.62),
           playerT:-1, foeT:-1, sweep:0, acc:0, result:null, stake:opponent?0:80,
           opp:opponent||null, sway:rnd(TAU) };
  mode='duel'; sfx('drone',{f:52,dur:3});
}
function updateDuel(d){
  const D=duel; D.t+=d;
  if(D.phase==='stare'){
    if(mouse.clicked){ // drew early
      D.phase='over'; D.result='early'; D.t=0; sfx('shot',{vol:.6});
    } else if(D.t>=D.wait){ D.phase='draw'; D.t=0; sfx('ui',{f:1200}); }
  } else if(D.phase==='draw'){
    D.sweep = (D.sweep + d*2.6) % 1;
    if(mouse.clicked && D.playerT<0){
      D.playerT=D.t;
      const s=Math.abs(Math.sin(D.sweep*Math.PI*2));
      D.acc = 1-Math.abs(D.sweep-0.5)*2;          // 1 at centre
      D.acc = clamp(D.acc,0,1);
      const beat = D.playerT < D.drawT;
      const good = D.acc>0.62;
      D.result = (beat&&good)? 'win' : (beat? 'graze' : 'lose');
      D.phase='over'; D.t=0;
      sfx('shot',{vol:1}); addTrauma(.6);
    } else if(D.t>D.drawT+0.55){ D.result='lose'; D.phase='over'; D.t=0; sfx('shot',{vol:1}); }
  } else {
    if(D.t>2.2){
      const r=D.result;
      mode='play'; duel=null;
      if(r==='win'){
        const pay = 240+P.lvl*40;
        P.money+=pay; gainXP(160); P.noto+=3;
        toast('HE WAS SLOW','+$'+pay+'. The room saw it.',C.gold); sfx('chime');
        if(D.opp){ D.opp.hp=0; kill(D.opp,P); }
      } else if(r==='graze'){
        P.money+=60; gainXP(60); P.hp=Math.max(6,P.hp-22);
        toast('BOTH OF YOU BLED','You walked out. He did not.','#a89a80');
      } else {
        P.hp=Math.max(4,P.hp-46); P.honor-=1;
        toast(r==='early'?'YOU DREW EARLY':'HE WAS FASTER','You woke at Doc Perry’s with a bill.',C.outlaw);
      }
    }
  }
}

let fadeT = 0, jTab = 0, jSel = 0;
const shownOnce = {};
function toastOnce(key,a,b,c){ if(shownOnce[key]) return; shownOnce[key]=1; toast(a,b,c); }

function hit(x,y,w,h){ return mouse.x>=x&&mouse.x<=x+w&&mouse.y>=y&&mouse.y<=y+h; }
function paper(x,y,w,h,alpha){
  ctx.save();
  ctx.globalAlpha=(alpha==null?1:alpha)*.55; ctx.fillStyle=C.ink2;
  ctx.beginPath(); rr(x+5,y+7,w,h,3); ctx.fill();
  ctx.globalAlpha=(alpha==null?1:alpha);
  ctx.fillStyle=C.paper; ctx.beginPath(); rr(x,y,w,h,3); ctx.fill();
  // paper tooth
  ctx.globalAlpha=(alpha==null?1:alpha)*.09; ctx.fillStyle=C.ink;
  const r=mulberry(((x*31+y*17+w)|0)>>>0);
  for(let i=0;i<Math.min(260,w*h/420);i++) ctx.fillRect(x+r()*w,y+r()*h,1.6,1.6);
  ctx.globalAlpha=(alpha==null?1:alpha);
  ctx.strokeStyle=C.ink; ctx.lineWidth=2.4; ctx.beginPath(); rr(x,y,w,h,3); ctx.stroke();
  ctx.globalAlpha=(alpha==null?1:alpha)*.6; ctx.strokeStyle=C.gold; ctx.lineWidth=1;
  ctx.beginPath(); rr(x+5,y+5,w-10,h-10,2); ctx.stroke();
  ctx.restore();
}
function head(t,x,y,size,col,align){
  ctx.font=(size||20)+'px '+FD; ctx.fillStyle=col||C.ink;
  ctx.textAlign=align||'left'; ctx.textBaseline='alphabetic';
  ctx.fillText(t,x,y);
}
function body(t,x,y,size,col,align){
  ctx.font=(size||13)+'px '+FT; ctx.fillStyle=col||C.ink;
  ctx.textAlign=align||'left'; ctx.textBaseline='alphabetic';
  ctx.fillText(t,x,y);
}
function wrapText(t,x,y,maxw,lh,size,col){
  ctx.font=(size||13)+'px '+FT; ctx.fillStyle=col||C.ink; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  const words=t.split(' '); let line='', yy=y;
  for(let i=0;i<words.length;i++){
    const test=line+words[i]+' ';
    if(ctx.measureText(test).width>maxw && line){ ctx.fillText(line,x,yy); line=words[i]+' '; yy+=lh; }
    else line=test;
  }
  ctx.fillText(line,x,yy);
  return yy+lh;
}
function btn(x,y,w,h,label,enabled,accent){
  const on = enabled!==false;
  const over = on && hit(x,y,w,h);
  ctx.save();
  ctx.fillStyle = over? (accent||C.gold) : 'rgba(33,26,28,.10)';
  ctx.beginPath(); rr(x,y,w,h,2); ctx.fill();
  ctx.strokeStyle= on? C.ink : 'rgba(33,26,28,.35)'; ctx.lineWidth=1.8;
  ctx.beginPath(); rr(x,y,w,h,2); ctx.stroke();
  ctx.font=Math.min(15,h*0.5)+'px '+FT;
  ctx.fillStyle= over? C.ink : (on? C.ink : 'rgba(33,26,28,.4)');
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText(label, x+12, y+h/2+1);
  ctx.restore();
  if(over && mouse.clicked){ mouse.clicked=false; sfx('ui',{f:600}); return true; }
  return false;
}

  ctx.fillStyle = P.side==='law'? C.law : P.side==='outlaw'? C.outlaw : 'rgba(232,220,192,.45)';
  ctx.fillText(P.side==='law'?'SHERIFF’S DEPUTY':P.side==='outlaw'?'BLACK MESA':'NO SIDE', pad, pad+46);

  ctx.fillStyle='rgba(18,13,16,.5)'; ctx.beginPath(); rr(pad,pad+52,120,3,1.5); ctx.fill();

    ctx.fillText(ob.title, x+12, y+20);
    ctx.fillStyle='rgba(232,220,192,.85)'; ctx.font='11px '+FT;
    const words=ob.text.split(' '); let line='', yy=y+36;
    for(let i=0;i<words.length;i++){ const t=line+words[i]+' ';
      if(ctx.measureText(t).width>w-24 && line){ ctx.fillText(line,x+12,yy); line=words[i]+' '; yy+=13; if(yy>y+50)break; }

  let ty=H*0.15;

    else if(nearSpot) label = nearSpot.label.replace(/&rsquo;/g,'’').replace(/&amp;/g,'&');
    if(label){

      ctx.fillStyle=C.gold; ctx.beginPath(); ctx.arc(x+20,y+15,9,0,TAU); ctx.fill();
      ctx.fillStyle=C.ink; ctx.font='bold 11px '+FT; ctx.fillText('E',x+20,y+19);
      ctx.fillStyle=C.bone; ctx.font='13px '+FT; ctx.textAlign='left';

  // ======= reticle
  if(mode==='play'&&!cine) drawReticle();
}
function star(x,y,r,col,alpha){
  ctx.save(); ctx.globalAlpha=alpha==null?1:alpha; ctx.fillStyle=col; ctx.beginPath();
  for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr2=i%2?r*0.45:r;
    const px=x+Math.cos(a)*rr2, py=y+Math.sin(a)*rr2;
    if(i===0)ctx.moveTo(px,py); else ctx.lineTo(px,py); }
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function drawDial(x,y,r,f,key,label,col,ready){
  ctx.save();
  ctx.fillStyle='rgba(18,13,16,.62)'; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
  ctx.strokeStyle='rgba(232,220,192,.18)'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.arc(x,y,r-4,0,TAU); ctx.stroke();
  ctx.strokeStyle=col; ctx.lineWidth=4; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(x,y,r-4,-Math.PI/2,-Math.PI/2+TAU*clamp(f,0,1)); ctx.stroke();
  if(ready){ ctx.globalAlpha=.35+Math.sin(now*5)*.25; ctx.strokeStyle=col; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(x,y,r+3,0,TAU); ctx.stroke(); ctx.globalAlpha=1; }
  ctx.fillStyle= ready? col : 'rgba(232,220,192,.5)';
  ctx.font='bold 15px '+FT; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(key,x,y+1);
  ctx.font='8px '+FT; ctx.fillStyle='rgba(232,220,192,.5)'; ctx.textBaseline='top';
  ctx.fillText(label.length>14?label.slice(0,13)+'…':label, x, y+r+4);
  ctx.restore();
}
function drawReticle(){
  const x=mouse.x, y=mouse.y;
  const g=gunDef();
  const sprPx = g.spr*(P.perks.sharp?.6:1)*(P.de?.3:1)*260 + P.recoil*30;
  // Gold on pale sand is nearly invisible. Every mark gets an ink backing first,
  // so the reticle reads on ANY ground — bleached flats, wood floors, night.
  ctx.save();
  ctx.lineCap='round';
  const r=Math.max(5,sprPx);
  const core = P.de? C.flash : '#fff6e2';
  for(let pass=0; pass<2; pass++){
    ctx.strokeStyle = pass? core : 'rgba(18,13,16,.85)';
    ctx.lineWidth   = pass? (P.de?2.0:1.7) : (P.de?4.8:4.2);
    ctx.globalAlpha = pass? .95 : .8;
    for(let i=0;i<4;i++){
      const a=i*TAU/4 + (P.de?now*1.2:0);
      ctx.beginPath();
      ctx.moveTo(x+Math.cos(a)*r, y+Math.sin(a)*r);
      ctx.lineTo(x+Math.cos(a)*(r+8), y+Math.sin(a)*(r+8));
      ctx.stroke();
    }
  }
  // centre pip: dark ring, bright dot
  ctx.globalAlpha=.85; ctx.fillStyle='rgba(18,13,16,.85)';
  ctx.beginPath(); ctx.arc(x,y,3.4,0,TAU); ctx.fill();
  ctx.globalAlpha=1; ctx.fillStyle=core;
  ctx.beginPath(); ctx.arc(x,y,1.6,0,TAU); ctx.fill();
  // a thin gold ring only while Dead Eye is up, so the state still reads
  if(P.de){ ctx.globalAlpha=.9; ctx.strokeStyle=C.gold; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.arc(x,y,r+12,0,TAU); ctx.stroke(); }
  ctx.restore();
}
function drawCompass(){
  const cw=380, cx=W/2-cw/2, cy=14;
  ctx.save();
  ctx.fillStyle='rgba(18,13,16,.45)'; ctx.beginPath(); rr(cx,cy,cw,26,3); ctx.fill();
  ctx.strokeStyle='rgba(232,220,192,.18)'; ctx.lineWidth=1; ctx.beginPath(); rr(cx,cy,cw,26,3); ctx.stroke();
  ctx.save(); ctx.beginPath(); rr(cx,cy,cw,26,3); ctx.clip();
  const facing = P.mounted? P.mounted.aim : P.aim;
  function place(a){ let d=((a-facing+Math.PI*3)%TAU)-Math.PI; return cx+cw/2 + d/(Math.PI*0.9)*(cw/2); }
  // cardinal ticks
  const cards=[['E',0],['S',Math.PI/2],['W',Math.PI],['N',-Math.PI/2]];
  ctx.font='10px '+FT; ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const c of cards){ const px=place(c[1]);
    ctx.fillStyle='rgba(232,220,192,.5)'; ctx.fillText(c[0],px,cy+13); }
  for(let i=0;i<24;i++){ const px=place(i/24*TAU);
    ctx.strokeStyle='rgba(232,220,192,.16)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(px,cy+20); ctx.lineTo(px,cy+24); ctx.stroke(); }
  // POI marks
  for(const p of POI){
    const d=dist(P.x,P.y,p.x,p.y); if(d>2400) continue;
    const px=place(angTo(P.x,P.y,p.x,p.y));
    ctx.globalAlpha=clamp(1-d/2400,.2,.8);
    ctx.fillStyle='rgba(232,220,192,.8)';
    ctx.beginPath(); ctx.moveTo(px,cy+4); ctx.lineTo(px-3,cy+9); ctx.lineTo(px+3,cy+9); ctx.closePath(); ctx.fill();
    ctx.globalAlpha=1;
  }
  const qm=questMark();
  if(qm){
    const px=place(angTo(P.x,P.y,qm[0],qm[1]));
    ctx.fillStyle=C.gold;
    ctx.beginPath(); ctx.moveTo(px,cy+2); ctx.lineTo(px-5,cy+10); ctx.lineTo(px+5,cy+10); ctx.closePath(); ctx.fill();
    ctx.font='9px '+FT; ctx.textAlign='center'; ctx.fillStyle=C.gold;
    ctx.fillText(Math.round(dist(P.x,P.y,qm[0],qm[1])/10)+'m', px, cy+19);
  }
  ctx.restore();
  // nearest place name
  const here = indoors()? inRoom(P.x,P.y) : null;
  if(here){
    ctx.font='12px '+FD; ctx.textAlign='center'; ctx.fillStyle='rgba(240,180,41,.85)';
    ctx.fillText(here.name, W/2, cy+42);
  } else {
    const np=nearestPOI(P.x,P.y);
    if(np.d<np.p.r*1.6){
      ctx.font='12px '+FD; ctx.textAlign='center'; ctx.fillStyle='rgba(232,220,192,.7)';
      ctx.fillText(np.p.name, W/2, cy+42);
    }
  }
  ctx.restore();
}
function drawRadar(cx,cy,r){
  ctx.save();
  ctx.fillStyle='rgba(18,13,16,.5)'; ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU); ctx.fill();
  ctx.strokeStyle='rgba(232,220,192,.2)'; ctx.lineWidth=1.4; ctx.stroke();
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,r-2,0,TAU); ctx.clip();
  const scale = r/760;
  for(const s of SPOTS){ if(!s.on) continue;
    const dx=(s.x-P.x)*scale, dy=(s.y-P.y)*scale;
    if(dx*dx+dy*dy>r*r) continue;
    ctx.fillStyle='rgba(240,180,41,.55)'; ctx.fillRect(cx+dx-1.5,cy+dy-1.5,3,3); }
  for(const e of ents){ if(e.dead||e.hp<=0) continue;
    const dx=(e.x-P.x)*scale, dy=(e.y-P.y)*scale;
    if(dx*dx+dy*dy>r*r) continue;
    if(e.kind==='horse'){ ctx.fillStyle='rgba(232,220,192,.45)'; ctx.fillRect(cx+dx-1.5,cy+dy-1.5,3,3); continue; }
    const h=hostile(P,e);
    if(!h && e.team==='beast') continue;
    ctx.fillStyle = h? (e.state==='combat'?C.outlaw:'rgba(158,43,37,.55)') : 'rgba(200,190,170,.4)';
    ctx.beginPath(); ctx.arc(cx+dx,cy+dy, h?2.6:2, 0,TAU); ctx.fill();
  }
  const qm=questMark();
  if(qm){ let dx=(qm[0]-P.x)*scale, dy=(qm[1]-P.y)*scale;
    const L=Math.hypot(dx,dy); if(L>r-6){ dx=dx/L*(r-6); dy=dy/L*(r-6); }
    ctx.fillStyle=C.gold; ctx.beginPath(); ctx.arc(cx+dx,cy+dy,3.4,0,TAU); ctx.fill(); }
  ctx.restore();
  // player pip
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(P.mounted?P.mounted.aim:P.aim);
  ctx.fillStyle=C.bone; ctx.beginPath(); ctx.moveTo(5,0); ctx.lineTo(-3,-3.4); ctx.lineTo(-3,3.4); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.restore();
}

function dimScreen(a){ ctx.fillStyle='rgba(12,9,11,'+(a||.6)+')'; ctx.fillRect(0,0,W,H); }

function drawDialog(){
  dimScreen(.55);
  const w=Math.min(680,W-60), h=270, x=W/2-w/2, y=H-h-60;

  head(dlg.name, x+26, y+40, 26, C.ink);
  if(dlg.title){ body(dlg.title, x+26, y+58, 11, 'rgba(33,26,28,.55)'); }
  ctx.save();
  ctx.strokeStyle='rgba(33,26,28,.35)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x+26,y+68); ctx.lineTo(x+w-26,y+68); ctx.stroke();
  ctx.restore();
  let yy=y+92;
  for(let i=0;i<=dlg.li && i<dlg.lines.length;i++){

    if(g.ab){ ty+=10; body('ABILITY [Q] — '+g.ab.n, dx, ty, 13, C.gold); ty+=16;

    let yy=cy+30;

    wrapText(P.side===null

      : P.side==='law'
        ? 'You wear Cordell’s tin. Black Mesa knows your face now, and so does the Baron who pays for both sides of every argument in this county.'
        : 'You ride for Silas Kane. The law has paper on you and the Baron has men. Kane says that is the same problem wearing two hats.',
      dx, cy+30, cw*0.46, 18, 12, 'rgba(33,26,28,.8)');
  }
  if(btn(x+w-160, y+h-48, 136, 32, 'CLOSE  [TAB]')||press('Tab')||press('Escape')){ mode='play'; }
  if(btn(x+28, y+h-48, 120, 32, 'SAVE')){ saveGame(); }
}

// ---- the map -------------------------------------------------------------
function drawMap(){
  dimScreen(.75);
  const pad=48;
  const aw=W-pad*2, ah=H-pad*2;
  const sc=Math.min(aw/WORLD.w, ah/MAP_H);
  const mw=WORLD.w*sc, mh=MAP_H*sc;
  const mx=W/2-mw/2, my=H/2-mh/2;
  paper(mx-14,my-14,mw+28,mh+28);
  ctx.save();
  ctx.beginPath(); rr(mx,my,mw,mh,2); ctx.clip();
  ctx.fillStyle=C.paper2; ctx.fillRect(mx,my,mw,mh);
  // ink hatching for rock country
  const r=mulberry(77);
  ctx.globalAlpha=.10; ctx.fillStyle=C.ink;
  for(let i=0;i<2600;i++){
    const wx=r()*WORLD.w, wy=r()*WORLD.h;
    const g=groundAt(wx,wy);
    if(g===3){ ctx.fillRect(mx+wx*sc,my+wy*sc,1.6,1.6); }
    else if(g===2 && r()<.4){ ctx.fillRect(mx+wx*sc,my+wy*sc,1.1,1.1); }
  }
  ctx.globalAlpha=1;
  // river
  ctx.strokeStyle=C.water; ctx.lineWidth=Math.max(2,RIVER_W*sc*1.4); ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.beginPath();
  for(let i=0;i<RIVER.length;i++){ const p=RIVER[i];
    if(i===0)ctx.moveTo(mx+p[0]*sc,my+p[1]*sc); else ctx.lineTo(mx+p[0]*sc,my+p[1]*sc); }
  ctx.stroke();
  // roads
  ctx.strokeStyle='rgba(33,26,28,.45)'; ctx.lineWidth=1.6; ctx.setLineDash([5,4]);
  for(const rd of ROADS){ ctx.beginPath();
    for(let i=0;i<rd.length;i++){ const p=rd[i];
      if(i===0)ctx.moveTo(mx+p[0]*sc,my+p[1]*sc); else ctx.lineTo(mx+p[0]*sc,my+p[1]*sc); }
    ctx.stroke(); }
  ctx.setLineDash([]);
  // rail
  ctx.strokeStyle='rgba(33,26,28,.6)'; ctx.lineWidth=2; ctx.beginPath();
  for(let i=0;i<RAIL.length;i++){ const p=RAIL[i];
    if(i===0)ctx.moveTo(mx+p[0]*sc,my+p[1]*sc); else ctx.lineTo(mx+p[0]*sc,my+p[1]*sc); }
  ctx.stroke();
  // POIs
  for(const p of POI){
    const px=mx+p.x*sc, py=my+p.y*sc;
    ctx.fillStyle=C.ink;
    if(p.kind==='town'){ ctx.fillRect(px-5,py-5,10,10); ctx.fillRect(px-9,py-1,18,2); }
    else if(p.kind==='outlaw'){ ctx.beginPath(); ctx.moveTo(px,py-7); ctx.lineTo(px+6,py+5); ctx.lineTo(px-6,py+5); ctx.closePath(); ctx.fill(); }
    else if(p.kind==='danger'){ ctx.strokeStyle=C.outlaw; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(px-5,py-5); ctx.lineTo(px+5,py+5); ctx.moveTo(px+5,py-5); ctx.lineTo(px-5,py+5); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(px,py,4.5,0,TAU); ctx.fill(); }
    ctx.font='11px '+FD; ctx.fillStyle='rgba(33,26,28,.8)'; ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText(p.name, px, py+9);
  }
  // quest marker
  const qm=questMark();
  if(qm){ const px=mx+qm[0]*sc, py=my+qm[1]*sc;
    ctx.strokeStyle=C.gold; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.arc(px,py,11+Math.sin(now*3)*2,0,TAU); ctx.stroke();
    ctx.fillStyle=C.gold; ctx.beginPath(); ctx.arc(px,py,3.6,0,TAU); ctx.fill(); }
  // player — shown at the doorway you came in by, if you are indoors
  const pw = (indoors() && P.outside) ? P.outside : [P.x, P.y];
  const px=mx+pw[0]*sc, py=my+pw[1]*sc;
  ctx.save(); ctx.translate(px,py); ctx.rotate(P.aim);
  ctx.fillStyle=C.outlaw; ctx.beginPath(); ctx.moveTo(9,0); ctx.lineTo(-5,-6); ctx.lineTo(-5,6); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=C.ink; ctx.lineWidth=1.4; ctx.stroke();
  ctx.restore();
  ctx.restore();
  // title + compass rose
  head('REDWATER COUNTY', mx, my-26, 22);
  body('SURVEYED 1878   ·   '+hourStr(), mx+mw, my-26, 11, 'rgba(33,26,28,.55)','right');
  if(btn(W/2-70, my+mh+22, 140, 30, '   CLOSE  [M]')||press('m')||press('Escape')) mode='play';
}

// ---- title / death -------------------------------------------------------
let titleT=0;
function drawTitle(){
  // a poster, not a menu
  ctx.fillStyle='#120d10'; ctx.fillRect(0,0,W,H);
  titleT+=dt;
  // sun
  const cx=W/2, cy=H*0.42;
  const g=ctx.createRadialGradient(cx,cy,10,cx,cy,Math.max(W,H)*0.5);
  g.addColorStop(0,'#e8a33c'); g.addColorStop(.25,'#a8552a'); g.addColorStop(.62,'#3d2230'); g.addColorStop(1,'#120d10');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // mesa silhouettes
  ctx.fillStyle='#1c1418';
  for(let l=0;l<3;l++){
    const base=H*0.62+l*44, amp=26-l*7;
    ctx.beginPath(); ctx.moveTo(0,H);
    for(let x=0;x<=W;x+=18){
      const y=base + Math.sin(x*0.004+l*2.1)*amp + (fbm(x*0.002+l*7,l*3,2)-0.5)*54;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W,H); ctx.closePath();
    ctx.globalAlpha=.55+l*.2; ctx.fill();
  }
  ctx.globalAlpha=1;
  // lone rider crossing
  const rx = (titleT*36)%(W+200)-100;
  ctx.save(); ctx.translate(rx, H*0.70); ctx.scale(1.2,1.2);
  ctx.fillStyle='#0d0a0c';
  ctx.beginPath(); ctx.ellipse(0,0,18,7,0,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(14,-5,7,5,0,0,TAU); ctx.fill();
  ctx.fillRect(-14,0,3,12); ctx.fillRect(-4,0,3,12); ctx.fillRect(8,0,3,12); ctx.fillRect(15,0,3,11);
  ctx.beginPath(); ctx.ellipse(-2,-13,5,7,0,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-2,-19,9,3,0,0,TAU); ctx.fill();
  ctx.restore();
  // dust
  if(chance(dt*10)) spawnP(0,0,0,0,.01,1,'#000','dust');
  // the mark
  ctx.save(); ctx.textAlign='center';
  ctx.font=Math.min(96,W*0.13)+'px '+FD;
  ctx.fillStyle=C.paper;
  ctx.shadowColor='rgba(18,13,16,.85)'; ctx.shadowBlur=24; ctx.shadowOffsetY=6;
  ctx.fillText('REDWATER', W/2, H*0.30);
  ctx.shadowBlur=0; ctx.shadowOffsetY=0;
  ctx.strokeStyle='rgba(240,180,41,.75)'; ctx.lineWidth=1.2;
  const tw=ctx.measureText('REDWATER').width;
