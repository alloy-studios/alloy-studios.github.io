function useSpot(s){
  if(s.kind==='exit'){ exitRoom(); return; }
  // A door is a door. Quest 'spot' steps are satisfied by the counter INSIDE,
  // so "step into the Dry Gulch" means actually stepping into the Dry Gulch.
  if(s.data && s.data.enter){ enterRoom(s.data.enter); return; }
  // satisfy quest 'spot' objectives first
  for(const aid of activeQ.slice()){
    const qq=q(aid), st2=step(qq);
    if(st2 && st2.t==='spot' && st2.kind===s.kind){ advQ(aid); refreshQuestMarks(); }
  }
  switch(s.kind){
    case 'saloon': saloonMenu(); break;
    case 'shop_general': openShop('general'); break;
    case 'shop_gun': openShop('gun'); break;
    case 'doctor': say('PHYSICIAN','REDWATER',['Doc Perry keeps hours and a bill.'],
        [{t:'Patch me up ($'+docPrice()+')',fn:doctorHeal},{t:'Leave it',fn:closeDlg}]); break;
    case 'bank': bankMenu(); break;
    case 'sheriff': sheriffMenu(); break;
    case 'board_bounty': openBoard('bounty'); break;
    case 'board_heist': openBoard('heist'); break;
    case 'stable': stableMenu(); break;
    case 'camp': campMenu(); break;
    case 'church': churchMenu(); break;
    case 'grave': say('BOOT HILL','','Rows of them. Half have no name, just a date and a reason nobody wrote down.',
        [{t:'Pay respects', fn:function(){ P.honor+=1; P.hp=Math.min(P.maxhp,P.hp+15); closeDlg(); }},{t:'Leave',fn:closeDlg}]); break;
    case 'lookout': lookoutMenu(); break;
    case 'ruin': ruinMenu(); break;
    case 'mine': say('COPPER CREEK MINE','',
        [q('minetrouble').state==='done'? 'The shafts are quiet now. Honestly quiet.'
          : 'The cage is down and the lamps are still burning. Somebody is in there.'],
        [q('minetrouble').state==='locked'
          ? {t:'Look into it', fn:function(){ offerQ('minetrouble'); startQ('minetrouble'); refreshQuestMarks(); closeDlg(); }}
          : {t:'Leave',fn:closeDlg}, {t:'Leave',fn:closeDlg}]); break;
    case 'depot': say('PERDITION DEPOT','',['The eastbound comes through at dusk. Freight, payroll, and men who watch both.'],
        [{t:'Leave',fn:closeDlg}]); break;
    case 'farm': say('CALLOWAY HOMESTEAD','',['A lamp in the window and a rifle by the door.'],[{t:'Leave',fn:closeDlg}]); break;
    case 'manor': manorMenu(); break;
    default: say(s.label||'','',['Nothing here but dust.'],[{t:'Leave',fn:closeDlg}]);
  }
}

function openShop(kind){
  const list=[];
  if(kind==='general'){
    list.push({id:'whiskey',type:'item'},{id:'bandage',type:'item'},{id:'tonic',type:'item'},
      {id:'dynamite',type:'item'},{id:'ammo_pistol',type:'item'},{id:'ammo_shell',type:'item'},{id:'ammo_rifle',type:'item'});
  } else {
    const stock=['navy','peace','coach','trapper','cattle','dblbarrel','lever','varmint'];
    if(P.lvl>=4) stock.push('rattler');
    if(P.lvl>=6) stock.push('thunder');
    if(P.lvl>=8) stock.push('sawtooth');
    for(const g of stock) list.push({id:g,type:'gun'});
    list.push({id:'ammo_pistol',type:'item'},{id:'ammo_shell',type:'item'},{id:'ammo_rifle',type:'item'});
  }
  shop = { kind:kind, list:list, sel:0, title: kind==='general'?'HALLORAN & SON':'STRAND GUNWORKS' };
  mode='shop'; sfx('ui',{f:440});
}
function buy(entry){
  if(entry.type==='gun'){
    const g=GUNS[entry.id];
    if(P.guns.indexOf(entry.id)>=0){ toast('ALREADY OWNED','',C.bone); return; }
    if(P.money<g.price){ toast('NOT ENOUGH COIN','$'+g.price+' is the price.',C.outlaw); sfx('click'); return; }
    P.money-=g.price; giveGun(entry.id); sfx('coin'); checkpoint();
  } else {
    const it=ITEMS[entry.id];
    if(P.money<it.price){ toast('NOT ENOUGH COIN','',C.outlaw); sfx('click'); return; }
    P.money-=it.price;
    if(entry.id==='ammo_pistol') P.ammo.pistol+=24;
    else if(entry.id==='ammo_shell') P.ammo.shell+=16;
    else if(entry.id==='ammo_rifle') P.ammo.rifle+=20;
    else P.items[entry.id]=(P.items[entry.id]||0)+1;
    sfx('coin'); addFloat(P.x,P.y-30,it.n,C.gold,12); checkpoint();
  }
}
function openBoard(kind){
  if(kind==='bounty' && P.side==='outlaw'){ toast('NOT FOR YOU','That board has your face on it.',C.outlaw); return; }
  if(kind==='heist' && P.side!=='outlaw'){ toast('NOT FOR YOU','Kane does not deal with tin.',C.outlaw); return; }
  if(!boardOffers[kind].length) refreshBoard(kind);
  // drop finished ones
  boardOffers[kind]=boardOffers[kind].filter(function(id){ return q(id) && q(id).state!=='done'; });
  while(boardOffers[kind].length<3){ boardOffers[kind].push(makeBountyOffer(boardOffers[kind].length+(boardSeed++), kind==='heist')); }
  board={kind:kind, sel:0}; mode='board'; sfx('ui',{f:440});
}

function startDuel(opponent){
  const nm = opponent? opponent.name : pick(BOUNTY_TITLES);
  slowmo = 1;
  duel = { name:nm, t:0, phase:'stare', wait:rnd(1.8,3.6), drawT:rnd(0.30,0.62),
           playerT:-1, foeT:-1, sweep:0, acc:0, result:null, stake:opponent?0:80,
           opp:opponent||null, sway:rnd(TAU) };
  mode='duel'; sfx('drone',{f:52,dur:3});
}
function updateDuel(d){
  const D=duel; D.t+=d;
  if(D.phase==='stare'){
    if(mouse.clicked){ // drew early
      D.phase='over'; D.result='early'; D.t=0; sfx('shot',{vol:.6});
    } else if(D.t>=D.wait){ D.phase='draw'; D.t=0; sfx('ui',{f:1200}); }
  } else if(D.phase==='draw'){
    D.sweep = (D.sweep + d*2.6) % 1;
    if(mouse.clicked && D.playerT<0){
      D.playerT=D.t;
      const s=Math.abs(Math.sin(D.sweep*Math.PI*2));
      D.acc = 1-Math.abs(D.sweep-0.5)*2;          // 1 at centre
      D.acc = clamp(D.acc,0,1);
      const beat = D.playerT < D.drawT;
      const good = D.acc>0.62;
      D.result = (beat&&good)? 'win' : (beat? 'graze' : 'lose');
      D.phase='over'; D.t=0;
      sfx('shot',{vol:1}); addTrauma(.6);
    } else if(D.t>D.drawT+0.55){ D.result='lose'; D.phase='over'; D.t=0; sfx('shot',{vol:1}); }
  } else {
    if(D.t>2.2){
      const r=D.result;
      mode='play'; duel=null;
      if(r==='win'){
        const pay = 240+P.lvl*40;
        P.money+=pay; gainXP(160); P.noto+=3;
        toast('HE WAS SLOW','+$'+pay+'. The room saw it.',C.gold); sfx('chime');
        if(D.opp){ D.opp.hp=0; kill(D.opp,P); }
      } else if(r==='graze'){
        P.money+=60; gainXP(60); P.hp=Math.max(6,P.hp-22);
        toast('BOTH OF YOU BLED','You walked out. He did not.','#a89a80');
      } else {
        P.hp=Math.max(4,P.hp-46); P.honor-=1;
        toast(r==='early'?'YOU DREW EARLY':'HE WAS FASTER','You woke at Doc Perry’s with a bill.',C.outlaw);
      }
      if(r==='win') reportEvent('duels',1);
      checkpoint();
    }
  }
}

let fadeT = 0, jTab = 0, jSel = 0;
const shownOnce = {};
function toastOnce(key,a,b,c){ if(shownOnce[key]) return; shownOnce[key]=1; toast(a,b,c); }

function hit(x,y,w,h){ return mouse.x>=x&&mouse.x<=x+w&&mouse.y>=y&&mouse.y<=y+h; }
// Parchment: a warm sheet, darker at the edges, a deckled double rule, brass
// studs at the corners, and a hard shadow underneath.
function paper(x,y,w,h,alpha){
  const A=(alpha==null?1:alpha);
  ctx.save();
  ctx.globalAlpha=A*.6; ctx.fillStyle='#0a0708';
  ctx.beginPath(); rr(x+6,y+8,w,h,4); ctx.fill();
  ctx.globalAlpha=A;
  const gr=ctx.createRadialGradient(x+w*.45,y+h*.4,Math.min(w,h)*.2,x+w/2,y+h/2,Math.max(w,h)*.75);
  gr.addColorStop(0,'#e8d2a8'); gr.addColorStop(.7,'#d8bd90'); gr.addColorStop(1,'#b8966a');
  ctx.fillStyle=gr; ctx.beginPath(); rr(x,y,w,h,4); ctx.fill();
  // paper tooth and a couple of old stains
  const r=mulberry(((x*31+y*17+w)|0)>>>0);
  ctx.globalAlpha=A*.10; ctx.fillStyle=C.ink;
  for(let i=0;i<Math.min(320,w*h/380);i++) ctx.fillRect(x+r()*w,y+r()*h,1.4,1.4);
  ctx.globalAlpha=A*.07; ctx.fillStyle='#6a4020';
  for(let i=0;i<3;i++){ ctx.beginPath(); ctx.ellipse(x+r()*w,y+r()*h,20+r()*50,14+r()*30,r()*3,0,TAU); ctx.fill(); }
  ctx.globalAlpha=A;
  ctx.strokeStyle='#2a1c16'; ctx.lineWidth=2.6; ctx.beginPath(); rr(x,y,w,h,4); ctx.stroke();
  ctx.strokeStyle='rgba(60,36,22,.55)'; ctx.lineWidth=1; ctx.beginPath(); rr(x+7,y+7,w-14,h-14,2); ctx.stroke();
  ctx.strokeStyle='rgba(160,110,40,.55)'; ctx.lineWidth=1; ctx.beginPath(); rr(x+10,y+10,w-20,h-20,2); ctx.stroke();
  for(const c of [[x+7,y+7],[x+w-7,y+7],[x+7,y+h-7],[x+w-7,y+h-7]]){
    ctx.fillStyle='#8a6424'; ctx.beginPath(); ctx.arc(c[0],c[1],4,0,TAU); ctx.fill();
    ctx.fillStyle='#e8c46a'; ctx.beginPath(); ctx.arc(c[0]-1,c[1]-1,1.8,0,TAU); ctx.fill(); }
  ctx.restore();
}
function head(t,x,y,size,col,align){

function wrapText(t,x,y,maxw,lh,size,col){
  ctx.font=(size||13)+'px '+FT; ctx.fillStyle=col||C.ink; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  const words=t.split(' '); let line='', yy=y;
  for(let i=0;i<words.length;i++){
    const test=line+words[i]+' ';
    if(ctx.measureText(test).width>maxw && line){ ctx.fillText(line,x,yy); line=words[i]+' '; yy+=lh; }

}
// A button is a stamped plate: ink rule, clipped corners, gold when you are on it.
function btn(x,y,w,h,label,enabled,accent){
  const on = enabled!==false;
  const over = on && hit(x,y,w,h);
  const c=Math.min(6,h*.22);
  ctx.save();
  ctx.beginPath(); ctx.moveTo(x+c,y); ctx.lineTo(x+w-c,y); ctx.lineTo(x+w,y+c); ctx.lineTo(x+w,y+h-c); ctx.lineTo(x+w-c,y+h);
  ctx.lineTo(x+c,y+h); ctx.lineTo(x,y+h-c); ctx.lineTo(x,y+c); ctx.closePath();
  if(over){ const gr=ctx.createLinearGradient(0,y,0,y+h); gr.addColorStop(0,'#f6c94a'); gr.addColorStop(1,accent||'#d49a1c'); ctx.fillStyle=gr; }
  else ctx.fillStyle = on? 'rgba(33,26,28,.12)' : 'rgba(33,26,28,.05)';
  ctx.fill();
  ctx.strokeStyle= on? '#2a1c16' : 'rgba(33,26,28,.35)'; ctx.lineWidth=over?2.2:1.6; ctx.stroke();
  if(over){ ctx.fillStyle='rgba(255,250,230,.35)'; ctx.fillRect(x+c,y+2,w-c*2,2); }
  ctx.font=Math.min(15,h*0.5)+'px '+FT;
  ctx.fillStyle= on? '#1e1416' : 'rgba(33,26,28,.4)';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText(label, x+12, y+h/2+1);
  ctx.restore();
  if(over && mouse.clicked){ mouse.clicked=false; sfx('ui',{f:600}); return true; }
  return false;
}

// a gun drawn at a size, centred on a box — the shop, the book, the belt
function gunPlate(g, cx, cy, maxW){
  const G=gunGeo(g), len=G.x1-G.x0, sc=Math.min(maxW/len, 5);
  ctx.save(); ctx.translate(cx-(G.x0+len/2)*sc, cy+2*sc);
  if(g.rar===3){ const gl=g.art.glow||C.gold;
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=.22+Math.sin(now*3)*.08;
    ctx.drawImage(getBlob(gl), (G.x0+len/2)*sc-len*sc*.6, -len*sc*.3, len*sc*1.2, len*sc*.6); ctx.restore(); }
  drawGunArt(g, sc);
  ctx.restore();
}

function bar(x,y,w,h,f,col,col2,back){
  ctx.fillStyle=back||'rgba(14,10,12,.72)'; ctx.beginPath(); rr(x-2,y-2,w+4,h+4,h/2+2); ctx.fill();
  if(f>0){ const gr=ctx.createLinearGradient(0,y,0,y+h); gr.addColorStop(0,col2||col); gr.addColorStop(1,col);
    ctx.fillStyle=gr; ctx.beginPath(); rr(x,y,Math.max(h,w*f),h,h/2); ctx.fill();
    ctx.fillStyle='rgba(255,255,240,.22)'; ctx.fillRect(x+h/2,y+1,Math.max(0,w*f-h),Math.max(1,h*.28)); }
}
function drawAmmo(g, id, x, y){
  const mg=P.mags[id]||0;
  if(g.cls==='revolver' && g.mag<=8){
    // the cylinder, turning a chamber for every shot
    P._cylA = lerp(P._cylA||0, (g.mag-mg)*TAU/g.mag, .25);
    const R=22, cx=x+R, cy=y+R;
    ctx.save(); ctx.translate(cx,cy);
    ctx.fillStyle='#1a1416'; ctx.beginPath(); ctx.arc(0,0,R+2,0,TAU); ctx.fill();
    const gr=ctx.createRadialGradient(-6,-8,2,0,0,R); gr.addColorStop(0,'#8a8680'); gr.addColorStop(1,'#3a3634');
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(0,0,R,0,TAU); ctx.fill();
    ctx.rotate(-P._cylA);
    for(let i=0;i<g.mag;i++){ const a=-Math.PI/2+i*TAU/g.mag, px=Math.cos(a)*R*.6, py=Math.sin(a)*R*.6, full=i<mg;
      ctx.fillStyle='#141012'; ctx.beginPath(); ctx.arc(px,py,R*.22,0,TAU); ctx.fill();
      if(full){ ctx.fillStyle='#d9a441'; ctx.beginPath(); ctx.arc(px,py,R*.18,0,TAU); ctx.fill();
        ctx.fillStyle='#f5d58a'; ctx.beginPath(); ctx.arc(px-1,py-1,R*.07,0,TAU); ctx.fill();
        ctx.fillStyle='#8a6424'; ctx.beginPath(); ctx.arc(px,py,R*.06,0,TAU); ctx.fill(); } }
    ctx.fillStyle='#1a1416'; ctx.beginPath(); ctx.arc(0,0,R*.16,0,TAU); ctx.fill();
    ctx.restore();
    return R*2+8;
  }
  const shell = g.cls==='shotgun';
  const big = g.mag>16, n=big? 1 : g.mag;
  if(big){ bar(x,y+14,150,10,mg/g.mag,'#c98d18','#f6d27a'); body(mg+' / '+g.mag, x+158, y+23, 11, C.bone); return 210; }
  const pw= shell? 9 : 5, ph= shell? 22 : 24, gap= shell? 4 : 3;
  for(let i=0;i<n;i++){ const px=x+i*(pw+gap), full=i<mg;
    if(shell){ ctx.fillStyle= full? '#b8342a' : 'rgba(232,220,192,.12)'; ctx.beginPath(); rr(px,y+6,pw,ph-8,2); ctx.fill();
      ctx.fillStyle= full? '#d9a441' : 'rgba(232,220,192,.12)'; ctx.fillRect(px,y+ph-4,pw,5); }
    else { ctx.fillStyle= full? '#d9a441' : 'rgba(232,220,192,.12)'; ctx.beginPath(); rr(px,y+8,pw,ph-8,1.4); ctx.fill();
      if(full){ ctx.fillStyle='#a8743a'; ctx.beginPath(); ctx.moveTo(px,y+8); ctx.lineTo(px+pw/2,y+1); ctx.lineTo(px+pw,y+8); ctx.closePath(); ctx.fill();
        ctx.fillStyle='rgba(255,240,190,.5)'; ctx.fillRect(px+.6,y+9,1,ph-10); } }
  }
  return n*(pw+gap)+6;
}

function star(x,y,r,col,alpha){
  ctx.save(); ctx.globalAlpha=alpha==null?1:alpha; ctx.fillStyle=col; ctx.beginPath();
  for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr2=i%2?r*0.45:r;
    const px=x+Math.cos(a)*rr2, py=y+Math.sin(a)*rr2;
    if(i===0)ctx.moveTo(px,py); else ctx.lineTo(px,py); }
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function drawDial(x,y,r,f,key,label,col,ready){
  ctx.save();
  const gr=ctx.createRadialGradient(x-r*.3,y-r*.4,2,x,y,r+4); gr.addColorStop(0,'#3a2e2a'); gr.addColorStop(1,'#140e10');
  ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(x,y,r+3,0,TAU); ctx.fill();
  ctx.strokeStyle='#8a6424'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,r+3,0,TAU); ctx.stroke();
  ctx.strokeStyle='rgba(232,220,192,.14)'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(x,y,r-4,0,TAU); ctx.stroke();
  ctx.strokeStyle=col; ctx.lineWidth=4; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(x,y,r-4,-Math.PI/2,-Math.PI/2+TAU*clamp(f,0,1)); ctx.stroke();
  if(ready){ ctx.globalAlpha=.35+Math.sin(now*5)*.25; ctx.strokeStyle=col; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(x,y,r+7,0,TAU); ctx.stroke(); ctx.globalAlpha=1;
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=.25+Math.sin(now*5)*.1;
    ctx.drawImage(getBlob(col.charCodeAt(0)===35?col:C.gold), x-r*1.6, y-r*1.6, r*3.2, r*3.2); ctx.restore(); }
  ctx.fillStyle= ready? col : 'rgba(232,220,192,.55)';
  ctx.font='bold 16px '+FT; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(key,x,y+1);
  ctx.font='8px '+FT; ctx.fillStyle='rgba(232,220,192,.6)'; ctx.textBaseline='top';
  ctx.fillText(label.length>15?label.slice(0,14)+'…':label, x, y+r+7);
  ctx.restore();
}

function drawReticle(){
  const x=mouse.x, y=mouse.y;
  const g=gunDef();
  const sprPx = g.spr*(P.perks.sharp?.6:1)*(P.de?.3:1)*260 + P.recoil*30;
  // Gold on pale sand is nearly invisible. Every mark gets an ink backing first,
  // so the reticle reads on ANY ground — bleached flats, wood floors, night.
  ctx.save();
  ctx.lineCap='round';
  const r=Math.max(5,sprPx);
  const core = P.de? C.flash : '#fff6e2';
  for(let pass=0; pass<2; pass++){
    ctx.strokeStyle = pass? core : 'rgba(18,13,16,.85)';
    ctx.lineWidth   = pass? (P.de?2.0:1.7) : (P.de?4.8:4.2);
    ctx.globalAlpha = pass? .95 : .8;
    for(let i=0;i<4;i++){
      const a=i*TAU/4 + (P.de?now*1.2:0);
      ctx.beginPath();
      ctx.moveTo(x+Math.cos(a)*r, y+Math.sin(a)*r);
      ctx.lineTo(x+Math.cos(a)*(r+8), y+Math.sin(a)*(r+8));
      ctx.stroke();
    }
  }
  // centre pip: dark ring, bright dot
  ctx.globalAlpha=.85; ctx.fillStyle='rgba(18,13,16,.85)';
  ctx.beginPath(); ctx.arc(x,y,3.4,0,TAU); ctx.fill();
  ctx.globalAlpha=1; ctx.fillStyle=core;
  ctx.beginPath(); ctx.arc(x,y,1.6,0,TAU); ctx.fill();
  // a thin gold ring only while Dead Eye is up, so the state still reads
  if(P.de){ ctx.globalAlpha=.9; ctx.strokeStyle=C.gold; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.arc(x,y,r+12,0,TAU); ctx.stroke(); }
  ctx.restore();
}
function drawCompass(){
  const cw=380, cx=W/2-cw/2, cy=14;
  ctx.save();
  ctx.fillStyle='rgba(18,13,16,.45)'; ctx.beginPath(); rr(cx,cy,cw,26,3); ctx.fill();
  ctx.strokeStyle='rgba(232,220,192,.18)'; ctx.lineWidth=1; ctx.beginPath(); rr(cx,cy,cw,26,3); ctx.stroke();
  ctx.save(); ctx.beginPath(); rr(cx,cy,cw,26,3); ctx.clip();
  const facing = P.mounted? P.mounted.aim : P.aim;
  function place(a){ let d=((a-facing+Math.PI*3)%TAU)-Math.PI; return cx+cw/2 + d/(Math.PI*0.9)*(cw/2); }
  // cardinal ticks
  const cards=[['E',0],['S',Math.PI/2],['W',Math.PI],['N',-Math.PI/2]];
  ctx.font='10px '+FT; ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const c of cards){ const px=place(c[1]);
    ctx.fillStyle='rgba(232,220,192,.5)'; ctx.fillText(c[0],px,cy+13); }
  for(let i=0;i<24;i++){ const px=place(i/24*TAU);
    ctx.strokeStyle='rgba(232,220,192,.16)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(px,cy+20); ctx.lineTo(px,cy+24); ctx.stroke(); }
  // POI marks
  for(const p of POI){
    const d=dist(P.x,P.y,p.x,p.y); if(d>2400) continue;
    const px=place(angTo(P.x,P.y,p.x,p.y));
    ctx.globalAlpha=clamp(1-d/2400,.2,.8);
    ctx.fillStyle='rgba(232,220,192,.8)';
    ctx.beginPath(); ctx.moveTo(px,cy+4); ctx.lineTo(px-3,cy+9); ctx.lineTo(px+3,cy+9); ctx.closePath(); ctx.fill();
    ctx.globalAlpha=1;
  }
  const qm=questMark();
  if(qm){
    const px=place(angTo(P.x,P.y,qm[0],qm[1]));
    ctx.fillStyle=C.gold;
    ctx.beginPath(); ctx.moveTo(px,cy+2); ctx.lineTo(px-5,cy+10); ctx.lineTo(px+5,cy+10); ctx.closePath(); ctx.fill();
    ctx.font='9px '+FT; ctx.textAlign='center'; ctx.fillStyle=C.gold;
    ctx.fillText(Math.round(dist(P.x,P.y,qm[0],qm[1])/10)+'m', px, cy+19);
  }
  ctx.restore();
  // nearest place name
  const here = indoors()? inRoom(P.x,P.y) : null;
  if(here){
    ctx.font='12px '+FD; ctx.textAlign='center'; ctx.fillStyle='rgba(240,180,41,.85)';
    ctx.fillText(here.name, W/2, cy+42);
  } else {
    const np=nearestPOI(P.x,P.y);
    if(np.d<np.p.r*1.6){
      ctx.font='12px '+FD; ctx.textAlign='center'; ctx.fillStyle='rgba(232,220,192,.7)';
      ctx.fillText(np.p.name, W/2, cy+42);
    }
  }
  ctx.restore();
}
function drawRadar(cx,cy,r){
  ctx.save();
  ctx.fillStyle='rgba(18,13,16,.5)'; ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU); ctx.fill();
  ctx.strokeStyle='rgba(232,220,192,.2)'; ctx.lineWidth=1.4; ctx.stroke();
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,r-2,0,TAU); ctx.clip();
  const scale = r/760;
  for(const s of SPOTS){ if(!s.on) continue;
    const dx=(s.x-P.x)*scale, dy=(s.y-P.y)*scale;
    if(dx*dx+dy*dy>r*r) continue;
    ctx.fillStyle='rgba(240,180,41,.55)'; ctx.fillRect(cx+dx-1.5,cy+dy-1.5,3,3); }
  for(const e of ents){ if(e.dead||e.hp<=0) continue;
    const dx=(e.x-P.x)*scale, dy=(e.y-P.y)*scale;
    if(dx*dx+dy*dy>r*r) continue;
    if(e.kind==='horse'){ ctx.fillStyle='rgba(232,220,192,.45)'; ctx.fillRect(cx+dx-1.5,cy+dy-1.5,3,3); continue; }
    const h=hostile(P,e);
    if(!h && e.team==='beast') continue;
    ctx.fillStyle = h? (e.state==='combat'?C.outlaw:'rgba(158,43,37,.55)') : 'rgba(200,190,170,.4)';
    ctx.beginPath(); ctx.arc(cx+dx,cy+dy, h?2.6:2, 0,TAU); ctx.fill();
  }
  const qm=questMark();
  if(qm){ let dx=(qm[0]-P.x)*scale, dy=(qm[1]-P.y)*scale;
    const L=Math.hypot(dx,dy); if(L>r-6){ dx=dx/L*(r-6); dy=dy/L*(r-6); }
    ctx.fillStyle=C.gold; ctx.beginPath(); ctx.arc(cx+dx,cy+dy,3.4,0,TAU); ctx.fill(); }
  ctx.restore();
  // player pip
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(P.mounted?P.mounted.aim:P.aim);
  ctx.fillStyle=C.bone; ctx.beginPath(); ctx.moveTo(5,0); ctx.lineTo(-3,-3.4); ctx.lineTo(-3,3.4); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.restore();
}

// ---- the map -------------------------------------------------------------
function drawMap(){
  dimScreen(.75);
  const pad=48;
  const aw=W-pad*2, ah=H-pad*2;
  const sc=Math.min(aw/WORLD.w, ah/MAP_H);
  const mw=WORLD.w*sc, mh=MAP_H*sc;
  const mx=W/2-mw/2, my=H/2-mh/2;
  paper(mx-14,my-14,mw+28,mh+28);
  ctx.save();
  ctx.beginPath(); rr(mx,my,mw,mh,2); ctx.clip();
  ctx.fillStyle=C.paper2; ctx.fillRect(mx,my,mw,mh);
  // ink hatching for rock country
  const r=mulberry(77);
  ctx.globalAlpha=.10; ctx.fillStyle=C.ink;
  for(let i=0;i<2600;i++){
    const wx=r()*WORLD.w, wy=r()*WORLD.h;
    const g=groundAt(wx,wy);
    if(g===3){ ctx.fillRect(mx+wx*sc,my+wy*sc,1.6,1.6); }
    else if(g===2 && r()<.4){ ctx.fillRect(mx+wx*sc,my+wy*sc,1.1,1.1); }
  }
  ctx.globalAlpha=1;
  // river
  ctx.strokeStyle=C.water; ctx.lineWidth=Math.max(2,RIVER_W*sc*1.4); ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.beginPath();
  for(let i=0;i<RIVER.length;i++){ const p=RIVER[i];
    if(i===0)ctx.moveTo(mx+p[0]*sc,my+p[1]*sc); else ctx.lineTo(mx+p[0]*sc,my+p[1]*sc); }
  ctx.stroke();
  // roads
  ctx.strokeStyle='rgba(33,26,28,.45)'; ctx.lineWidth=1.6; ctx.setLineDash([5,4]);
  for(const rd of ROADS){ ctx.beginPath();
    for(let i=0;i<rd.length;i++){ const p=rd[i];
      if(i===0)ctx.moveTo(mx+p[0]*sc,my+p[1]*sc); else ctx.lineTo(mx+p[0]*sc,my+p[1]*sc); }
    ctx.stroke(); }
  ctx.setLineDash([]);
  // bridges: the only ways across
  for(const b of BRIDGES){ ctx.save(); ctx.translate(mx+b.x*sc,my+b.y*sc); ctx.rotate(b.a);
    const L=Math.max(10,b.len*sc), Wd=Math.max(4,b.w*sc*1.4);
    ctx.fillStyle='#5a3e26'; ctx.fillRect(-L/2,-Wd/2,L,Wd); ctx.fillStyle='#b8905a'; ctx.fillRect(-L/2+1,-Wd/2+1,L-2,Wd-2);
    ctx.fillStyle='#5a3e26'; for(let x=-L/2+2;x<L/2;x+=3) ctx.fillRect(x,-Wd/2+1,.8,Wd-2);
    ctx.restore(); }
  // rail
  ctx.strokeStyle='rgba(33,26,28,.6)'; ctx.lineWidth=2; ctx.beginPath();
  for(let i=0;i<RAIL.length;i++){ const p=RAIL[i];
    if(i===0)ctx.moveTo(mx+p[0]*sc,my+p[1]*sc); else ctx.lineTo(mx+p[0]*sc,my+p[1]*sc); }
  ctx.stroke();
  // POIs
  for(const p of POI){
    const px=mx+p.x*sc, py=my+p.y*sc;
    ctx.fillStyle=C.ink;
    if(p.kind==='town'){ ctx.fillRect(px-5,py-5,10,10); ctx.fillRect(px-9,py-1,18,2); }
    else if(p.kind==='outlaw'){ ctx.beginPath(); ctx.moveTo(px,py-7); ctx.lineTo(px+6,py+5); ctx.lineTo(px-6,py+5); ctx.closePath(); ctx.fill(); }
    else if(p.kind==='danger'){ ctx.strokeStyle=C.outlaw; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(px-5,py-5); ctx.lineTo(px+5,py+5); ctx.moveTo(px+5,py-5); ctx.lineTo(px-5,py+5); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(px,py,4.5,0,TAU); ctx.fill(); }
    ctx.font='11px '+FD; ctx.fillStyle='rgba(33,26,28,.8)'; ctx.textAlign='center'; ctx.textBaseline='top';

  ctx.restore();

  head('REDWATER COUNTY', mx, my-26, 22);
  body('SURVEYED 1878   ·   '+hourStr(), mx+mw, my-26, 11, 'rgba(33,26,28,.55)','right');
  if(btn(W/2-70, my+mh+22, 140, 30, '   CLOSE  [M]')||press('m')||press('Escape')) mode='play';
}

// ---- world-space drawing for screens that are not the world -----------------
// Borrow the camera: park it so that world (0,0) is the screen centre at zoom z.
function withCam(z, fn){
  const s={x:cam.x,y:cam.y,z:cam.z,sx:cam.sx,sy:cam.sy};
  cam.x=0; cam.y=0; cam.z=z; cam.sx=0; cam.sy=0;
  try{ fn(); } finally { cam.x=s.x; cam.y=s.y; cam.z=s.z; cam.sx=s.sx; cam.sy=s.sy; }
}

const _duelP={x:0,y:0,vx:0,vy:0,aim:0,seed:1,name:'',title:'',team:'player',state:'idle',gun:'rusted',_fitK:'x',
  flash:0,burn:0,dead:false,hitT:0,stun:0,rec:0,r:10,hp:1,maxhp:1};

function drawDuelScreen(){
  const D=duel;
  ctx.fillStyle='#120d10'; ctx.fillRect(0,0,W,H);

  const pDrawn = D.playerT>=0 || D.phase==='over';

  if(D.phase==='stare'){
    ctx.font='16px '+FT; ctx.fillStyle='rgba(232,220,192,.7)';
    ctx.fillText('hold…', W/2, hz-sr*0.35-10);
    // tension: the heartbeat line
    const amp=6+ (D.t/D.wait)*14;
    ctx.strokeStyle='rgba(240,180,41,.5)'; ctx.lineWidth=1.6; ctx.beginPath();
    for(let x=-120;x<=120;x+=4){
      const y = H*0.20 + Math.sin(x*0.09+now*9)*amp*Math.exp(-Math.abs(x)/60);
      if(x===-120)ctx.moveTo(W/2+x,y); else ctx.lineTo(W/2+x,y);
    }
    ctx.stroke();
  } else if(D.phase==='draw'){
    ctx.font=Math.min(72,W*0.09)+'px '+FD; ctx.fillStyle=C.outlaw;

    ctx.fillStyle='rgba(18,13,16,.7)'; ctx.beginPath(); rr(bx,by,bw,16,3); ctx.fill();
    ctx.fillStyle='rgba(240,180,41,.30)'; ctx.fillRect(bx+bw*0.40,by,bw*0.20,16);
    ctx.fillStyle=C.gold; ctx.fillRect(bx+bw*0.47,by,bw*0.06,16);
    ctx.fillStyle=C.flash; ctx.fillRect(bx+bw*D.sweep-2, by-5, 4, 26);
    ctx.strokeStyle=C.ink; ctx.lineWidth=2; ctx.beginPath(); rr(bx,by,bw,16,3); ctx.stroke();
    ctx.font='12px '+FT; ctx.fillStyle='rgba(232,220,192,.7)';
    ctx.fillText('CLICK — fast and centred', W/2, by+40);
  } else {
    const txt = D.result==='win'?'HE WAS SLOW' : D.result==='graze'?'BOTH OF YOU BLED'
      : D.result==='early'?'YOU DREW EARLY' : 'HE WAS FASTER';
    ctx.font=Math.min(58,W*0.075)+'px '+FD;
    ctx.fillStyle = D.result==='win'? C.gold : C.outlaw;
    ctx.globalAlpha=clamp(D.t*3,0,1);
    ctx.fillText(txt, W/2, H*0.26);
    ctx.globalAlpha=1;

function drawCineOverlay(){
  if(!cine) return;
  const t=cine.t;
  const inT=clamp(t/0.35,0,1), outT=clamp((cine.total||4.6)-t,0,1);
  const lb=H*0.12*Math.min(inT, clamp(t<0.6?1:1,0,1));
  ctx.fillStyle='#0b0809';
  ctx.fillRect(0,0,W,lb); ctx.fillRect(0,H-lb,W,lb);

  // slashes between shooter and marks
  for(const h of cine.hits){
    h.t+=rawDt*2.2;
    const a=clamp(1-h.t,0,1); if(a<=0) continue;
    const x1=w2sx(h.x1), y1=w2sy(h.y1), x2=w2sx(h.x2), y2=w2sy(h.y2);
    ctx.save();
    ctx.globalAlpha=a; ctx.strokeStyle=C.flash; ctx.lineWidth=1+a*5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.globalAlpha=a*.5; ctx.strokeStyle=C.gold; ctx.lineWidth=1+a*11;
    ctx.stroke();
    ctx.restore();
  }
  // ghost horses
  if(cine.ghosts){
    for(const gh of cine.ghosts){
      const a=clamp(1-gh.t/1.2,0,1); if(a<=0) continue;
      const f=Math.cos(gh.a)>=0?1:-1;
      ctx.save(); ctx.translate(w2sx(gh.x),w2sy(gh.y)); ctx.scale(cam.z*f*1.15,cam.z*1.15);
      ctx.globalAlpha=a*.6; ctx.globalCompositeOperation='lighter';
      gh.ph=(gh.ph||0)+rawDt*16; FLASH=0; drawHorseBody({ph:gh.ph,seed:5,tamed:false,rider:null}, 300, true);
      ctx.restore(); ctx.globalAlpha=1;
      addLight(gh.x,gh.y,120,C.bone,a*.3);
    }
  }
  // title card
  const show = clamp((t-0.15)/0.3,0,1) * clamp((1.7-t)/0.4,0,1);
  if(show>0.01){
    ctx.save(); ctx.textAlign='center'; ctx.globalAlpha=show;
    const y=H*0.34;
    ctx.font='11px '+FT; ctx.fillStyle='rgba(232,220,192,.7)';
    ctx.fillText('A W A K E N I N G', W/2, y-34);
    ctx.font=Math.min(66,W*0.085)+'px '+FD;
    ctx.fillStyle=C.paper; ctx.shadowColor='rgba(12,9,11,.9)'; ctx.shadowBlur=22;
    ctx.fillText(cine.name, W/2, y+16);
    ctx.shadowBlur=0;
    const tw=ctx.measureText(cine.name).width;
    ctx.strokeStyle=C.gold; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(W/2-tw/2, y+30); ctx.lineTo(W/2+tw/2, y+30); ctx.stroke();
    ctx.font='12px '+FT; ctx.fillStyle='rgba(232,220,192,.8)';
    ctx.fillText(cine.sub, W/2, y+52);
    ctx.restore(); ctx.globalAlpha=1;
  }
}

// ==========================================================================
//  POST — grade, light, vignette, grain
//
//  This was the single most expensive thing in the frame: six full-screen
//  passes, two of them blend-mode fills and one a pattern fill under 'overlay',
//  plus a radial gradient re-evaluated across every pixel every frame.
//  The look is unchanged; the vignette, the hurt flush and the grain are now
//  baked ONCE into offscreen layers and blitted, and the passes that only ever
//  darkened are folded into a single tint.
// ==========================================================================
let fxW=0, fxH=0, vigLayer=null, hurtLayer=null, grainLayer=null;
const GRAIN_PAD = 128;

function buildFxLayers(){
  fxW=W; fxH=H;
  // --- vignette, baked
  vigLayer=document.createElement('canvas'); vigLayer.width=W; vigLayer.height=H;
  let g=vigLayer.getContext('2d');
  let grad=g.createRadialGradient(W/2,H*0.5,Math.min(W,H)*0.30,W/2,H*0.5,Math.max(W,H)*0.70);
  grad.addColorStop(0,'rgba(12,9,11,0)');
  grad.addColorStop(.62,'rgba(12,9,11,.24)');
  grad.addColorStop(1,'rgba(12,9,11,.66)');
  g.fillStyle=grad; g.fillRect(0,0,W,H);
  // --- the red flush when you are nearly out, baked at full strength
  hurtLayer=document.createElement('canvas'); hurtLayer.width=W; hurtLayer.height=H;
  g=hurtLayer.getContext('2d');
  grad=g.createRadialGradient(W/2,H/2,Math.min(W,H)*0.25,W/2,H/2,Math.max(W,H)*0.62);
  grad.addColorStop(0,'rgba(158,43,37,0)');
  grad.addColorStop(1,'rgba(158,43,37,1)');
  g.fillStyle=grad; g.fillRect(0,0,W,H);
  // --- film grain. Same light-grey noise the original pattern used (200-255,
  //     opaque) so that blending it with 'overlay' keeps the black point where
  //     it was. Three screens of it cycle, which is cheaper than a repeating
  //     pattern fill but looks identical.
  grainLayer=[];
  for(let v=0; v<3; v++){
    const lc=document.createElement('canvas'); lc.width=W; lc.height=H;
    const lg=lc.getContext('2d');
    const im=lg.createImageData(W,H), dta=im.data;
    for(let i=0;i<dta.length;i+=4){
      const g2 = 200 + (Math.random()*55|0);
      dta[i]=dta[i+1]=dta[i+2]=g2; dta[i+3]=255;
    }
    lg.putImageData(im,0,0);
    grainLayer.push(lc);
  }
}
let fxFrame=0;

function post(){
  if(!vigLayer || fxW!==W || fxH!==H) buildFxLayers();
  const inside = P && indoors();
  const d = inside ? 1 : daylight();

  // --- ONE tint pass covers indoors lamplight and night/dusk alike
  if(inside){
    ctx.save(); ctx.globalCompositeOperation='multiply';
    ctx.globalAlpha=.30; ctx.fillStyle='#7a5638'; ctx.fillRect(0,0,W,H);
    ctx.restore();
  } else if(d<1){
    ctx.save(); ctx.globalCompositeOperation='multiply';
    ctx.globalAlpha=(1-d)*0.80;
    ctx.fillStyle = dayT>0.5 ? '#42354f' : '#2f3a58';   // the old screen pass folded in
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
  // --- golden hour, only inside the dawn/dusk windows
  const gh = clamp(1-Math.abs(dayT-0.30)/0.10,0,1)+clamp(1-Math.abs(dayT-0.76)/0.10,0,1);
  if(gh>0.02 && !inside){
    ctx.save(); ctx.globalCompositeOperation='overlay';
    ctx.globalAlpha=gh*0.26; ctx.fillStyle='#e07a2a'; ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
  // --- the sun has a side: warm where it comes from, cooler in the lee
  if(!inside && d>0.05){
    const lx0 = sun.dx>0? 0 : W, g2=ctx.createLinearGradient(lx0,0,W-lx0,H*.6);
    g2.addColorStop(0,'rgba(255,186,104,'+(0.30*d).toFixed(3)+')'); g2.addColorStop(1,'rgba(80,100,160,'+(0.22*d).toFixed(3)+')');
    ctx.save(); ctx.globalCompositeOperation='soft-light'; ctx.fillStyle=g2; ctx.fillRect(0,0,W,H); ctx.restore();
  }
  // --- additive lights. Skip the whole pass when nothing is lit — at midday
  // with no fires or legendaries that is a free screen back every frame.
  if(lightN){
    ctx.save(); ctx.globalCompositeOperation="lighter";
    ctx.globalAlpha = 0.55 + (1-d)*0.55;
    ctx.drawImage(lcv,0,0,W,H);
    ctx.restore();
  }

  // --- ult grades (rare, so they can afford the real blend modes)
  if(grade.mono>0){
    ctx.save(); ctx.globalCompositeOperation='saturation';
    ctx.globalAlpha=grade.mono; ctx.fillStyle='#808080'; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='multiply'; ctx.globalAlpha=grade.mono*.35;
    ctx.fillStyle='#c9b79a'; ctx.fillRect(0,0,W,H); ctx.restore();
  }
  if(grade.red>0 || grade.gold>0){
    ctx.save(); ctx.globalCompositeOperation='overlay';
    if(grade.red>0){ ctx.globalAlpha=grade.red*0.35; ctx.fillStyle='#b3241a'; ctx.fillRect(0,0,W,H); }
    if(grade.gold>0){ ctx.globalAlpha=grade.gold*0.30; ctx.fillStyle=C.gold; ctx.fillRect(0,0,W,H); }
    ctx.restore();
  }
  // --- hurt flush: a blit at varying alpha, not a gradient rebuilt per frame
  if(P && P.hp>0 && P.hp/P.maxhp<0.34 && mode==='play'){
    const p=(1-P.hp/P.maxhp);
    ctx.globalAlpha=clamp(0.28*p+Math.sin(now*4)*0.06*p,0,1);
    ctx.drawImage(hurtLayer,0,0); ctx.globalAlpha=1;
  }
  // --- vignette + grain, both plain blits
  // --- vignette, then grain under 'overlay' exactly as before
  ctx.drawImage(vigLayer,0,0);
  fxFrame=(fxFrame+1)%3;
  ctx.save(); ctx.globalCompositeOperation='overlay'; ctx.globalAlpha=0.055;
  ctx.drawImage(grainLayer[fxFrame],0,0);
  ctx.restore();
  // --- fade
  if(fadeT>0){ ctx.fillStyle='rgba(12,9,11,'+clamp(Math.sin(clamp(fadeT,0,1.2)/1.2*Math.PI),0,1).toFixed(3)+')';
    ctx.fillRect(0,0,W,H); }
  grade.mono=Math.max(0,grade.mono-dt*2);
  grade.red=Math.max(0,grade.red-dt*1.2);
  grade.gold=Math.max(0,grade.gold-dt*1.2);
}

let PASS = 2;
const drawList = [];
let shCv=null, shCx=null;
function renderWorld(){
  lightN=0;
  drawTerrain();
  if(typeof drawWater==='function') drawWater();
  drawDecals();

  const halfW=W/(2*cam.z)+140, halfH=H/(2*cam.z)+160;
  const x0=cam.x-halfW, x1=cam.x+halfW, y0=cam.y-halfH, y1=cam.y+halfH+90;

  drawList.length=0;
  const cx0=clamp(Math.floor(x0/PG),0,PGW-1), cx1=clamp(Math.floor(x1/PG),0,PGW-1);
  const cy0=clamp(Math.floor(y0/PG),0,PGH-1), cy1=clamp(Math.floor(y1/PG),0,PGH-1);
  for(let cy=cy0;cy<=cy1;cy++) for(let cx=cx0;cx<=cx1;cx++){
    const cell=pgrid[cy*PGW+cx];
    for(let k=0;k<cell.length;k++){ const p=props[cell[k]];
      if(p.x<x0||p.x>x1||p.y<y0||p.y>y1) continue;
      drawList.push(p); }
  }
  for(const b of BUILDINGS){ if(b.x<x0-160||b.x>x1+160||b.y<y0-200||b.y>y1+200) continue; drawList.push(b); }
  for(const b of WALLS){ if(!b.rw) continue; if(b.x<x0-160||b.x>x1+160||b.y<y0-200||b.y>y1+200) continue; drawList.push(b); }
  for(const e of ents){ if(e.x<x0||e.x>x1||e.y<y0||e.y>y1) continue;
    if(e===P && P.mounted) continue; drawList.push(e); }
  for(const pk of pickups){ if(pk.x<x0||pk.x>x1||pk.y<y0||pk.y>y1) continue; drawList.push(pk); }

  // PASS 1 — every shadow into one layer at full ink, then laid down once at one
  // strength: overlapping shadows no longer stack into darker blots, and each
  // caster costs a flat fill instead of a translucent one.
  if(shadowA>.02){
    if(!shCv || shCv.width!==cv.width || shCv.height!==cv.height){
      shCv=document.createElement('canvas'); shCv.width=cv.width; shCv.height=cv.height; shCx=shCv.getContext('2d'); }
    shCx.setTransform(1,0,0,1,0,0); shCx.clearRect(0,0,shCv.width,shCv.height);
    shCx.setTransform(DPR,0,0,DPR,0,0);
    const main=ctx; ctx=shCx; PASS=1;
    try{
      if(typeof drawCloudShadows==='function') drawCloudShadows();
      for(let i=0;i<drawList.length;i++){
        const o=drawList[i], k=o._k;
        if(k==='p') drawPropShadow(o);
        else if(k==='b') drawBuildingShadow(o);
        else if(k==='w') drawWallShadow(o);
        else if(k==='e') drawEnt(o);
      }
    } finally { ctx=main; PASS=2; }
    ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=shadowA; ctx.drawImage(shCv,0,0); ctx.restore();
  }
  PASS=2;
  // things that lie on the ground, under everybody's boots
  for(let i=0;i<drawList.length;i++){ const o=drawList[i];
    if(o._k==='b') drawBuildingGround(o);
    else if(o._k==='e') drawThreatRing(o); }
  for(const s of SPOTS) drawSpotRing(s);

  // PASS 2 — bodies, back to front
  drawList.sort(function(a,b){ return a.y-b.y; });
  for(let i=0;i<drawList.length;i++){
    const o=drawList[i], k=o._k;
    if(k==='p') drawProp(o);
    else if(k==='b') drawBuilding(o);
    else if(k==='w') drawWall(o);
    else if(k==='e') drawEnt(o);
    else drawPickup(o);
  }

  drawThrown();
  for(const s of SPOTS) drawSpot(s);
  drawBullets();
  drawBeams();
  drawParts();
  drawFloats();
  if(cine) drawCineOverlay();
  renderLights();
}

let eventT = 26, repopT = 40, ambT = 0;

function updateEnts(d){
  for(let i=ents.length-1;i>=0;i--){
    const e=ents[i];
    e.flash=Math.max(0,e.flash-d*7);
    e.hitT=Math.max(0,e.hitT-d);
    if(e.dead){
      e.dieT+=d;
      if(e.dieT>34){ ents.splice(i,1); }
      continue;
    }
    if(e.hp<=0){ kill(e,null); continue; }
    const px0=e.x, py0=e.y;

    if(e===P){
      // knockback only; input handled in updatePlayer
      if(e.kx||e.ky){ moveEnt(e,e.kx*d,e.ky*d);
        const f=Math.pow(.02,d); e.kx*=f; e.ky*=f;
        if(Math.abs(e.kx)<2)e.kx=0; if(Math.abs(e.ky)<2)e.ky=0; }
      e.vx=(e.x-px0)/Math.max(d,1e-4); e.vy=(e.y-py0)/Math.max(d,1e-4);
      continue;
    }
    if(e.kind==='horse'){
      if(e.rider){ e.vx=(e.x-px0)/Math.max(d,1e-4); e.vy=(e.y-py0)/Math.max(d,1e-4); continue; }
      e.stT-=d;
      if(e.state==='flee'){ const a=angTo(P.x,P.y,e.x,e.y);
        moveEnt(e,Math.cos(a)*220*d,Math.sin(a)*220*d); e.aim=a;
        if(e.stT<=0) e.state='idle';
      } else if(e.stT<=0){ e.state='idle'; e.stT=rnd(2,6);
        e.tx=clamp(e.x+rnd(-140,140),20,WORLD.w-20); e.ty=clamp(e.y+rnd(-140,140),20,WORLD.h-20);
      } else if(dist(e.x,e.y,e.tx,e.ty)>18){
        const a=angTo(e.x,e.y,e.tx,e.ty); e.aim=angLerp(e.aim,a,d*4);
        moveEnt(e,Math.cos(a)*54*d,Math.sin(a)*54*d);
      }
      e.vx=(e.x-px0)/Math.max(d,1e-4); e.vy=(e.y-py0)/Math.max(d,1e-4);
      continue;
    }
    if(e.skittish && dist2(P.x,P.y,e.x,e.y)<250*250 && e.state!=='flee'){ e.state='flee'; e.stT=4; }
    updateAI(e,d);
    if(e.kx||e.ky){ moveEnt(e,e.kx*d,e.ky*d);
      const f=Math.pow(.02,d); e.kx*=f; e.ky*=f;
      if(Math.abs(e.kx)<2)e.kx=0; if(Math.abs(e.ky)<2)e.ky=0; }
    e.vx=(e.x-px0)/Math.max(d,1e-4); e.vy=(e.y-py0)/Math.max(d,1e-4);
  }
}

function updateWorldEvents(d){
  eventT-=d; repopT-=d;
  if(eventT<=0){
    eventT=rnd(55,110);
    const np=nearestPOI(P.x,P.y);
    if(np.d>520 && onRoad(P.x,P.y) && !cine){
      // a road ambush
      const n=2+rndi(0,2+Math.floor(P.lvl*0.3));
      const a0=angTo(P.x,P.y,P.x+P.vx,P.y+P.vy)||rnd(TAU);
      for(let i=0;i<n;i++){
        const a=a0+rnd(-.9,.9), dd=380+rnd(0,140);
        const e=makeEnt({x:clamp(P.x+Math.cos(a)*dd,40,WORLD.w-40),y:clamp(P.y+Math.sin(a)*dd,40,WORLD.h-40),
          team: P.side==='outlaw'&&chance(.5)?'law':'outlaw', kind:'outlaw', name:npcName(),
          hp:70+P.lvl*8, gun:pick(['rusted','navy','coach','trapper','lever']), spd:80, loot:rndi(12,40)});
        e.renegade=true; e.state='combat'; e.target=P;
      }
      toast('ROAD AGENTS','They were waiting on this stretch.',C.outlaw);
      sfx('drone',{f:46,dur:1.6});
    }
  }
  if(repopT<=0){
    repopT=90;
    let coy=0, camp=0;
    for(const e of ents){ if(e.dead) continue;
      if(e.kind==='coyote') coy++;
      if(e.team==='outlaw'&&!e.renegade) camp++; }
    if(coy<10) for(let i=0;i<6;i++){
      const x=rnd(300,WORLD.w-300), y=rnd(300,MAP_H-300);
      if(inRiver(x,y)||nearestPOI(x,y).d<420||dist(x,y,P.x,P.y)<900) continue;
      makeEnt({x:x,y:y,team:'beast',kind:'coyote',hp:28,spd:98,r:8,loot:0,name:'COYOTE'});
    }
    if(camp<5 && dist(P.x,P.y,poi('camp').x,poi('camp').y)>900) spawnCampOutlaws();
  }
  // ambient life: dust, birds, tumbleweed
  ambT-=d;
  if(ambT<=0){
    ambT=rnd(.06,.20);
    if(indoors()) return;                    // no wind-blown dust indoors
    const a=rnd(TAU), dd=rnd(120, Math.max(W,H)/cam.z*0.6);
    const x=cam.x+Math.cos(a)*dd, y=cam.y+Math.sin(a)*dd;
    spawnP(x,y,rnd(14,44),rnd(-10,6),rnd(2.5,5),rnd(1.2,3),C.bone,'dust',{drag:.999,grav:0});
  }
}

function updateCamera(d){
  let tx=P.x, ty=P.y-20;
  if(mode==='play'&&!cine){
    const dx=clamp(mouse.wx-P.x,-260,260), dy=clamp(mouse.wy-P.y,-260,260);
    tx+=dx*0.18; ty+=dy*0.18;
  }
  if(cine){ tx=P.x; ty=P.y; }
  const k=1-Math.pow(0.0015,d);
  cam.x=lerp(cam.x,tx,k); cam.y=lerp(cam.y,ty,k);
  if(!cine) cam.tz = P.mounted? 1.12 : P.de? 1.52 : 1.36;
  cam.z=lerp(cam.z,cam.tz,1-Math.pow(0.02,d));
  if(Math.abs(cam.z-cam.tz)<0.004) cam.z=cam.tz;   // settle, so the terrain buffer can cache
  cam.trauma=Math.max(0,cam.trauma-d*1.6);
  const sh=cam.trauma*cam.trauma*24;
  cam.sx=(Math.random()*2-1)*sh; cam.sy=(Math.random()*2-1)*sh;
}

function sim(d){
  now+=d;
  if(mode==='play'||mode==='dialog'||mode==='shop'||mode==='board'||mode==='journal'||mode==='map'){
    dayT=(dayT + d/DAY_LEN)%1;
  }
  updateSun();
  shadowA = indoors()? 0.17 : 0.10 + daylight()*0.24;
  if(fadeT>0) fadeT-=d;

  if(mode==='title'){ return; }
  if(mode==='duel'){ updateDuel(d); return; }
  if(mode==='dead'){ updateParts(d); updateDecals(d); return; }

  const paused = (mode!=='play');
  if(!paused || cine){
    if(cine) updateCine(rawDt);   // cinematics run on wall-clock, not slow-mo
    updatePlayer(d);
    updateEnts(d);
    updateBullets(d);
    updateThrown(d);
    checkGoto();
    updateWorldEvents(d);
    // routine account save; the client coalesces these to one per 20s anyway
    if(AA && mode==='play'){ cloudRoutineT-=rawDt; if(cloudRoutineT<=0){ cloudRoutineT=30; cloudSave(false); } }
    // pickups
    for(let i=pickups.length-1;i>=0;i--){ const pk=pickups[i];
      pk.life-=d;
      if(pk.z>0||pk.vz){ pk.vz-=700*d; pk.z+=pk.vz*d; if(pk.z<0){pk.z=0;pk.vz=0;} }
      if(dist2(pk.x,pk.y,P.x,P.y)<30*30){
        if(pk.kind==='gun') giveGun(pk.data.id);
        else if(pk.kind==='money'){ P.money+=pk.data.n; addFloat(P.x,P.y-30,'$'+pk.data.n,C.gold,14); }
        sfx('coin'); pickups.splice(i,1); continue; }
      if(pk.life<=0) pickups.splice(i,1);
    }
    if(P.hp<=0 && mode==='play'){ P.hp=0; mode='dead'; grade.red=1; addTrauma(.8); slowmo=1;
      sfx('drone',{f:36,dur:3}); }
  }
  updateParts(d); updateDecals(d); updateFloats(d);
  for(let i=toasts.length-1;i>=0;i--){ toasts[i].life-=d; if(toasts[i].life<=0) toasts.splice(i,1); }
  updateCamera(d);
  refreshQuestMarks();
}

function tick(d){
  if(!W||!ready){ resize(); if(!W||!ready) return; }
  if(window.DBG && DBG.speed !== 1) d *= DBG.speed;
  if(window.DBG && DBG.on) DBG._t0=performance.now();
  rawDt = d;                                  // before hitstop: a cinematic must
  if(hitstop>0){ hitstop-=d; d*=0.10; }       // not be slowed by its own impacts
  // Hide the OS pointer only while aiming — menus and the title need a cursor.
  const wantCur = (mode==='play' && !cine) ? 'aiming' : '';
  if(cv.className!==wantCur) cv.className=wantCur;
  dt = d*slowmo;
  sim(dt);
  // UI keys that work in any non-modal mode
  if(mode==='play'){
    if(press('Tab')||press('k')){ mode='journal'; jTab=press('k')?2:0; sfx('ui',{f:500}); }
    if(press('m')){ mode='map'; sfx('ui',{f:500}); }
    if(press('Escape')){ mode='journal'; }
  }
  draw();
  if(window.dbgTick) dbgTick(d);
  clearOnce();
}

let last=performance.now(), acc=0;
function frame(t){
  const raw=Math.min(0.05,(t-last)/1000); last=t;
  tick(raw);
  requestAnimationFrame(frame);
}

function applySave(data){
  initWorld();
  const guns = (Array.isArray(data.guns) && data.guns.length) ? data.guns.filter(function(g){ return GUNS[g]; }) : [];
  P.guns = guns.length ? guns : ['rusted'];
  P.gi = clamp(data.gi|0, 0, P.guns.length-1);
  P.mags = data.mags||{};
  for(const g of P.guns) if(P.mags[g]==null) P.mags[g]=GUNS[g].mag;
  P.x=data.x; P.y=data.y; P.maxhp=data.maxhp||140; P.hp=clamp(data.hp||P.maxhp,1,P.maxhp);
  P.money=data.money||0; P.xp=data.xp||0; P.lvl=data.lvl||1; P.sp=data.sp||0;
  P.side=data.side||null; P.honor=data.honor||0; P.noto=data.noto||0;
  P.wanted=data.wanted||0; P.bounty=data.bounty||0;
  P.ammo=Object.assign({pistol:0,shell:0,rifle:0}, data.ammo||{});
  P.items=Object.assign({whiskey:0,bandage:0,dynamite:0,tonic:0}, data.items||{});
  P.perks=data.perks||{};
  P.awaken=data.awaken||0; P.kills=data.kills||0;
  P.flags=data.flags||{}; P.legend=data.legend||{};
  P.outside=data.outside||null;
  if(P.perks.eye){ P.deadeyeMax=160; P.deadeye=160; }
  dayT=(data.dayT==null)?0.32:data.dayT;
  for(const id in (data.q||{})){ if(QUESTS[id]){ QUESTS[id].state=data.q[id].s;
    QUESTS[id].cur=data.q[id].c; QUESTS[id].prog=data.q[id].p; } }
  activeQ.length=0;
  for(const id of (data.active||[])) if(QUESTS[id]) activeQ.push(id);
  tracked=data.tracked||activeQ[0]||null;
  // re-arm any active quest that spawns its own trouble
  for(const id of activeQ.slice()){ const qq=QUESTS[id]; if(qq&&qq.onStart) qq.onStart(); }
  refreshQuestMarks();
  cam.x=P.x; cam.y=P.y;
  mode='play'; fadeT=1.2;
}

//  ALLOY ACCOUNT
//  Optional. The site shell hands this iframe window.AlloyAccount; opened as a
//  file, or anywhere without the site, AA is null and everything stays local.
//  The server re-checks every field we send (alloy/validator.js), so nothing
//  here needs to be trusted — it only has to be careful not to lose progress.
// ==========================================================================
const AA = (function(){
  try { return window.parent !== window ? window.parent.AlloyAccount || null : null; }
  catch (_) { return null; }
})();
const AA_ID = 'redwater';
// loaded: the first AA.load finished, so writing is safe.  tried: we asked.
const cloud = { signedIn:false, tried:false, loaded:false, ok:false, events:[], rewards:[] };
let cloudSeq = 0, cloudRoutineT = 30;

// Which of two saves is further along. A fresh guest ride must never be uploaded
// over an account that is thirty levels deep, and offline progress on this
// device must not be thrown away for an older cloud copy — so neither "cloud
// always wins" nor "newest wins" is safe. Progress is: level, then story jobs
// finished, then experience. Ties go to the cloud.
function saveRank(s){
  if(!s) return [-1,0,0];
  let done=0; if(s.q) for(const k in s.q) if(s.q[k] && s.q[k].s==='done') done++;
  return [s.lvl||0, done, s.xp||0];
}
function aheadOf(a,b){
  const x=saveRank(a), y=saveRank(b);
  for(let i=0;i<3;i++) if(x[i]!==y[i]) return x[i]>y[i];
  return false;
}

async function pullCloud(){
  if(!AA) return;
  cloud.signedIn = !!AA.user();
  cloud.tried=false; cloud.loaded=false; cloud.ok=false; cloud.events=[];
  if(!cloud.signedIn) return;
  let r=null;
  try{ r = await AA.load(AA_ID); }catch(e){ r=null; }
  cloud.tried = true;
  if(!r) return;                                  // unreachable: stay local, write nothing
  cloud.rewards = r.rewards || [];
  const playing = mode!=='title';
  const mine = playing ? buildSave() : readLocal();
  const theirs = r.data;
  cloud.loaded = true;
  if(theirs && !aheadOf(mine, theirs)){
    writeLocal(theirs);
    if(playing){ applySave(theirs); toast('YOUR RIDE','Picked up from your Alloy account.',C.gold); }
    cloud.ok = true;
  } else if(mine){
    const res = await AA.save(AA_ID, mine, {now:true}).catch(function(){ return null; });
    cloud.ok = !!(res && res.ok);
    if(cloud.ok){ if(playing) adoptClamps(mine, res.data); writeLocal(playing? buildSave() : res.data); }
  } else cloud.ok = true;                         // nothing anywhere yet
  try{ cloud.events = (await AA.events(AA_ID)).filter(function(e){ return e.live; }); }catch(e){}
}

// The server's reply is what exists. But the player keeps playing while a save
// is in flight, so the reply is adopted as a CORRECTION to what was sent — a
// clamp of 300 coins takes 300 coins, it does not undo the 50 earned since.
function adoptClamps(sent, got){
  if(!got || !P) return;
  const nums = ['money','xp','lvl','sp','maxhp','kills','awaken'];
  for(const k of nums){ const d=(got[k]||0)-(sent[k]||0); if(d) P[k]=(P[k]||0)+d; }
  for(const k of ['pistol','shell','rifle']){
    const d=((got.ammo||{})[k]||0)-((sent.ammo||{})[k]||0); if(d) P.ammo[k]=Math.max(0,(P.ammo[k]||0)+d); }
  for(const k in (sent.items||{})){
    const d=((got.items||{})[k]||0)-((sent.items||{})[k]||0); if(d) P.items[k]=Math.max(0,(P.items[k]||0)+d); }
  if(Array.isArray(got.guns)){
    P.guns = P.guns.filter(function(g){ return sent.guns.indexOf(g)<0 || got.guns.indexOf(g)>=0; });
    if(!P.guns.length) P.guns=['rusted'];
    P.gi = clamp(P.gi,0,P.guns.length-1);
  }
  if(got.perks) for(const k in P.perks) if(sent.perks[k] && !got.perks[k]) delete P.perks[k];
  P.hp = Math.min(P.hp, P.maxhp);
}

function cloudSave(now){
  if(!AA || !cloud.loaded || !AA.user()) return;  // never write before the first load
  const my = ++cloudSeq, sent = buildSave();
  AA.save(AA_ID, sent, {now:!!now}).then(function(res){
    if(my!==cloudSeq) return;                     // a newer save supersedes this reply
    cloud.ok = !!(res && res.ok);
    if(cloud.ok){ adoptClamps(sent, res.data); writeLocal(buildSave()); }
  }).catch(function(){ if(my===cloudSeq) cloud.ok=false; });
}

// Event metrics — only the two the validator can bound (see alloy/validator.js).
function reportEvent(metric, n){
  if(!AA || !AA.user()) return;
  for(const e of cloud.events)
    if(e.metric===metric && e.type!=='leaderboard'){ try{ AA.progress(e.id, n); }catch(_){} }
}

function cloudStatus(){
  if(!AA) return null;
  if(!AA.user()) return { t:'Sign in to keep your ride on your Alloy account', c:'#a89a80', signIn:true };
  if(!cloud.tried) return { t:'Reaching your Alloy account…', c:'#a89a80' };
  if(!cloud.loaded || !cloud.ok) return { t:'Alloy account unreachable — saving on this device', c:C.outlaw };
  return { t:'Saved to your Alloy account', c:C.gold };
}
// One small line wherever the ride is saved or lost. `onPaper` picks ink over
// bone for the journal's paper panel.
function drawCloudLine(x, y, align, onPaper){
  const s=cloudStatus(); if(!s) return;
  ctx.save(); ctx.textAlign=align||'left'; ctx.textBaseline='alphabetic'; ctx.font='11px '+FT;
  ctx.fillStyle = onPaper && s.c==='#a89a80' ? 'rgba(33,26,28,.6)' : s.c;
  ctx.fillText(s.t, x, y);
  const tw=ctx.measureText(s.t).width;
  ctx.restore();
  if(s.signIn){
    // Its own pill: the paper-panel btn() is ink on paper and vanishes on the
    // dark title and death screens, which is exactly where this button lives.
    const w=96, h=24, bx = align==='center' ? x-w/2 : x+tw+12, by = align==='center' ? y+10 : y-17;
    const over = hit(bx,by,w,h), dark = !onPaper;
    ctx.save();
    ctx.fillStyle = over ? C.gold : (dark ? 'rgba(240,180,41,.14)' : 'rgba(33,26,28,.08)');
    ctx.beginPath(); rr(bx,by,w,h,h/2); ctx.fill();
    ctx.strokeStyle = dark ? C.gold : C.ink; ctx.lineWidth=1.4; ctx.stroke();
    ctx.fillStyle = over ? C.ink : (dark ? C.gold : C.ink);
    ctx.font='11px '+FT; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('SIGN IN', bx+w/2, by+h/2+1);
    ctx.restore();
    if(over && mouse.clicked){ mouse.clicked=false; sfx('ui',{f:600}); try{ AA.signIn(); }catch(_){} }
  }
}

      try{ (new Function(b.dataset.do))(); }catch(err){ console.warn('[bench]',err); }
      dbgRender();
    };
  });
  const day=d.querySelector('#dbgDay');
  if(day) day.oninput=function(){ dayT=(+day.value)/1000; updateSun(); };
}

function dbgGo(x,y){
  if(P.mounted) dismount();
  P.outside=null; P.x=x; P.y=y+90; cam.x=P.x; cam.y=P.y;
  P.kx=P.ky=0; fadeT=0.7;
}
function dbgSpawn(kind,n){
  for(let i=0;i<n;i++){
    const a=rnd(TAU), dd=rnd(150,320);
    const x=clamp(P.x+Math.cos(a)*dd,40,WORLD.w-40), y=clamp(P.y+Math.sin(a)*dd,40,WORLD.h-40);
    let e;
    if(kind==='coyote') e=makeEnt({x:x,y:y,team:'beast',kind:'coyote',hp:28,spd:98,r:8,name:'COYOTE'});
    else if(kind==='horse'){ e=makeEnt({x:x,y:y,team:'none',kind:'horse',hp:130,spd:300,r:14,name:'HORSE',tamed:true});
      e.coat=pick(['#5a4334','#2f2a28','#8a6b45']); }
    else if(kind==='boss'){ e=makeEnt({x:x,y:y,team:'outlaw',kind:'outlaw',name:'TEST BOSS',title:'BENCH',
      hp:600,gun:'vaquero',spd:92,boss:true,loot:200}); e.renegade=true; e.state='combat'; e.target=P; }
    else { e=makeEnt({x:x,y:y,team:kind,kind:kind,name:npcName(),hp:80,
      gun:pick(['navy','peace','coach','lever','trapper']),spd:80,loot:20});
      e.renegade=true; e.state='combat'; e.target=P; }
  }
}
function dbgClear(){
  for(let i=ents.length-1;i>=0;i--){ const e=ents[i];
    if(e===P||e.kind==='horse') continue;
    if(e.team==='civ') continue;
    ents.splice(i,1); }
}
function dbgAwaken(id){
  if(P.guns.indexOf(id)<0) P.guns.push(id);
  P.gi=P.guns.indexOf(id); P.mags[id]=GUNS[id].mag;
  P.ammo[AMMO_OF[GUNS[id].cls]]=999;
  P.awaken=P.awakenMax;
  dbgSpawn('outlaw',6);
  setTimeout(function(){ startAwaken(); }, 260);
}

// Real frame-cost readout. fps alone hides stutter: a run that is 60fps with a
// 300ms hitch every second feels far worse than a steady 40fps, and only the
// worst-frame number tells them apart.
DBG.ring = new Float32Array(180); DBG.ringN = 0;
function dbgTick(dt2){
  if(!DBG.on) return;
  const ms = performance.now() - (DBG._t0 || performance.now());
  DBG.ring[DBG.ringN % 180] = ms; DBG.ringN++;
  DBG._fn++; DBG._ft+=dt2;
  let med=0, p95=0, worst=0, jank=0;
  if(DBG._ft>0.35){
    DBG.fps=Math.round(DBG._fn/DBG._ft); DBG._fn=0; DBG._ft=0;
    const n=Math.min(DBG.ringN,180), a=Array.prototype.slice.call(DBG.ring,0,n).sort(function(x,y){return x-y;});
    med=a[n>>1]||0; p95=a[Math.floor(n*0.95)]||0; worst=a[n-1]||0;
    for(let i=0;i<n;i++) if(a[i]>33) jank++;
    DBG.stats={med:med.toFixed(1), p95:p95.toFixed(1), worst:worst.toFixed(0), jank:jank};
  }
  const st=DBG.stats||{med:'-',p95:'-',worst:'-',jank:0};
  const s=document.getElementById('dbgStat');
  if(s) s.textContent =
    DBG.fps+' fps    frame  med '+st.med+'  p95 '+st.p95+'  worst '+st.worst+' ms\n'+
    'janky frames (>33ms) last 3s: '+st.jank+' / 180\n'+
    'ents '+ents.length+'   parts '+parts.filter(function(p){return p.a;}).length+
    '   lights '+lightN+'\n'+
    'x '+Math.round(P.x)+'  y '+Math.round(P.y)+'   '+hourStr()+
    (indoors()? '   [indoors]':'') + (DBG.god?'   [god]':'') + (DBG.noclip?'   [noclip]':'');
}
function dbgToggle(){
  dbgBuild();
  DBG.on=!DBG.on;
  DBG.el.classList.toggle('hid', !DBG.on);
  if(DBG.on) dbgRender();
}
if(LOCAL_DEV){
  window.addEventListener('keydown', function(e){
    if(e.key==='`' || e.key==='~'){ e.preventDefault(); dbgToggle(); }
  });
  if(DBG_WANTED){ dbgBuild(); DBG.on=true; }
  else { dbgBuild(); DBG.on=false; DBG.el.classList.add('hid'); }
}
