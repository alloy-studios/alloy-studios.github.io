// ==========================================================================
//  POST — grade, light, vignette, grain
//
//  This was the single most expensive thing in the frame: six full-screen
//  passes, two of them blend-mode fills and one a pattern fill under 'overlay',
//  plus a radial gradient re-evaluated across every pixel every frame.
//  The look is unchanged; the vignette, the hurt flush and the grain are now
//  baked ONCE into offscreen layers and blitted, and the passes that only ever
//  darkened are folded into a single tint.
// ==========================================================================
let fxW=0, fxH=0, vigLayer=null, hurtLayer=null, grainLayer=null;
const GRAIN_PAD = 128;

function buildFxLayers(){
  fxW=W; fxH=H;
  // --- vignette, baked
  vigLayer=document.createElement('canvas'); vigLayer.width=W; vigLayer.height=H;
  let g=vigLayer.getContext('2d');
  let grad=g.createRadialGradient(W/2,H*0.5,Math.min(W,H)*0.30,W/2,H*0.5,Math.max(W,H)*0.70);
  grad.addColorStop(0,'rgba(12,9,11,0)');
  grad.addColorStop(.62,'rgba(12,9,11,.24)');
  grad.addColorStop(1,'rgba(12,9,11,.66)');
  g.fillStyle=grad; g.fillRect(0,0,W,H);
  // --- the red flush when you are nearly out, baked at full strength
  hurtLayer=document.createElement('canvas'); hurtLayer.width=W; hurtLayer.height=H;
  g=hurtLayer.getContext('2d');
  grad=g.createRadialGradient(W/2,H/2,Math.min(W,H)*0.25,W/2,H/2,Math.max(W,H)*0.62);
  grad.addColorStop(0,'rgba(158,43,37,0)');
  grad.addColorStop(1,'rgba(158,43,37,1)');
  g.fillStyle=grad; g.fillRect(0,0,W,H);
  // --- film grain. Same light-grey noise the original pattern used (200-255,
  //     opaque) so that blending it with 'overlay' keeps the black point where
  //     it was. Three screens of it cycle, which is cheaper than a repeating
  //     pattern fill but looks identical.
  grainLayer=[];
  for(let v=0; v<3; v++){
    const lc=document.createElement('canvas'); lc.width=W; lc.height=H;
    const lg=lc.getContext('2d');
    const im=lg.createImageData(W,H), dta=im.data;
    for(let i=0;i<dta.length;i+=4){
      const g2 = 200 + (Math.random()*55|0);
      dta[i]=dta[i+1]=dta[i+2]=g2; dta[i+3]=255;
    }
    lg.putImageData(im,0,0);
    grainLayer.push(lc);
  }
}
let fxFrame=0;

function post(){
  if(!vigLayer || fxW!==W || fxH!==H) buildFxLayers();
  const inside = P && indoors();
  const d = inside ? 1 : daylight();

  // --- ONE tint pass covers indoors lamplight and night/dusk alike
  if(inside){
    ctx.save(); ctx.globalCompositeOperation='multiply';
    ctx.globalAlpha=.30; ctx.fillStyle='#7a5638'; ctx.fillRect(0,0,W,H);
    ctx.restore();
  } else if(d<1){
    ctx.save(); ctx.globalCompositeOperation='multiply';
    ctx.globalAlpha=(1-d)*0.80;
    ctx.fillStyle = dayT>0.5 ? '#42354f' : '#2f3a58';   // the old screen pass folded in
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
  // --- golden hour, only inside the dawn/dusk windows
  const gh = clamp(1-Math.abs(dayT-0.30)/0.10,0,1)+clamp(1-Math.abs(dayT-0.76)/0.10,0,1);
  if(gh>0.02 && !inside){
    ctx.save(); ctx.globalCompositeOperation='overlay';
    ctx.globalAlpha=gh*0.26; ctx.fillStyle='#e07a2a'; ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
  // --- additive lights. Skip the whole pass when nothing is lit — at midday
  // with no fires or legendaries that is a free screen back every frame.
  if(lightN){
    ctx.save(); ctx.globalCompositeOperation="lighter";
    ctx.globalAlpha = 0.55 + (1-d)*0.55;
    ctx.drawImage(lcv,0,0,W,H);
    ctx.restore();
  }

  // --- ult grades (rare, so they can afford the real blend modes)
  if(grade.mono>0){
    ctx.save(); ctx.globalCompositeOperation='saturation';
    ctx.globalAlpha=grade.mono; ctx.fillStyle='#808080'; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='multiply'; ctx.globalAlpha=grade.mono*.35;
    ctx.fillStyle='#c9b79a'; ctx.fillRect(0,0,W,H); ctx.restore();
  }
  if(grade.red>0 || grade.gold>0){
    ctx.save(); ctx.globalCompositeOperation='overlay';
    if(grade.red>0){ ctx.globalAlpha=grade.red*0.35; ctx.fillStyle='#b3241a'; ctx.fillRect(0,0,W,H); }
    if(grade.gold>0){ ctx.globalAlpha=grade.gold*0.30; ctx.fillStyle=C.gold; ctx.fillRect(0,0,W,H); }
    ctx.restore();
  }
  // --- hurt flush: a blit at varying alpha, not a gradient rebuilt per frame
  if(P && P.hp>0 && P.hp/P.maxhp<0.34 && mode==='play'){
    const p=(1-P.hp/P.maxhp);
    ctx.globalAlpha=clamp(0.28*p+Math.sin(now*4)*0.06*p,0,1);
    ctx.drawImage(hurtLayer,0,0); ctx.globalAlpha=1;
  }
  // --- vignette + grain, both plain blits
  // --- vignette, then grain under 'overlay' exactly as before
  ctx.drawImage(vigLayer,0,0);
  fxFrame=(fxFrame+1)%3;
  ctx.save(); ctx.globalCompositeOperation='overlay'; ctx.globalAlpha=0.055;
  ctx.drawImage(grainLayer[fxFrame],0,0);
  ctx.restore();
  // --- fade
  if(fadeT>0){ ctx.fillStyle='rgba(12,9,11,'+clamp(Math.sin(clamp(fadeT,0,1.2)/1.2*Math.PI),0,1).toFixed(3)+')';
    ctx.fillRect(0,0,W,H); }
  grade.mono=Math.max(0,grade.mono-dt*2);
  grade.red=Math.max(0,grade.red-dt*1.2);
  grade.gold=Math.max(0,grade.gold-dt*1.2);
}

let PASS = 2;
const drawList = [];
function renderWorld(){
  lightN=0;
  drawTerrain();
  drawDecals();

  const halfW=W/(2*cam.z)+120, halfH=H/(2*cam.z)+140;
  const x0=cam.x-halfW, x1=cam.x+halfW, y0=cam.y-halfH, y1=cam.y+halfH;

  drawList.length=0;
  // props in view
  const cx0=clamp(Math.floor(x0/PG),0,PGW-1), cx1=clamp(Math.floor(x1/PG),0,PGW-1);
  const cy0=clamp(Math.floor(y0/PG),0,PGH-1), cy1=clamp(Math.floor(y1/PG),0,PGH-1);
  for(let cy=cy0;cy<=cy1;cy++) for(let cx=cx0;cx<=cx1;cx++){
    const cell=pgrid[cy*PGW+cx];
    for(let k=0;k<cell.length;k++){ const p=props[cell[k]];
      if(p.x<x0||p.x>x1||p.y<y0||p.y>y1) continue;
      drawList.push(p); }
  }
  for(const b of BUILDINGS){ if(b.x<x0-140||b.x>x1+140||b.y<y0-160||b.y>y1+160) continue; drawList.push(b); }
  for(const b of WALLS){ if(b.x<x0-140||b.x>x1+140||b.y<y0-160||b.y>y1+160) continue; drawList.push(b); }
  for(const e of ents){ if(e.x<x0||e.x>x1||e.y<y0||e.y>y1) continue;
    if(e.rider) continue; drawList.push(e); }
  for(const pk of pickups){ if(pk.x<x0||pk.x>x1||pk.y<y0||pk.y>y1) continue; drawList.push(pk); }

  // PASS 1 — every shadow, so nothing casts onto a thing in front of it
  PASS=1;
  for(let i=0;i<drawList.length;i++){
    const o=drawList[i], k=o._k;
    if(k==='p') drawPropShadow(o);
    else if(k==='b') drawBuildingShadow(o);
    else if(k==='w') drawWallShadow(o);
    else if(k==='e') drawEnt(o);
  }
  PASS=2;

  // PASS 2 — bodies, back to front
  drawList.sort(function(a,b){ return a.y-b.y; });
  for(let i=0;i<drawList.length;i++){
    const o=drawList[i], k=o._k;
    if(k==='p') drawProp(o);
    else if(k==='b') drawBuilding(o);
    else if(k==='w') drawWall(o);
    else if(k==='e') drawEnt(o);
    else drawPickup(o);
  }
  // the rider sits on the horse
  if(P.mounted) drawHuman(P);

  drawThrown();
  for(const s of SPOTS) drawSpot(s);
  drawBullets();
  drawParts();
  drawFloats();
  if(cine) drawCineOverlay();
  renderLights();
}

// ==========================================================================
//  SIM
// ==========================================================================
let eventT = 26, repopT = 40, ambT = 0;

function updateEnts(d){
  for(let i=ents.length-1;i>=0;i--){
    const e=ents[i];
    e.flash=Math.max(0,e.flash-d*7);
    e.hitT=Math.max(0,e.hitT-d);
    if(e.dead){
      e.dieT+=d;
      if(e.dieT>34){ ents.splice(i,1); }
      continue;
    }
    if(e.hp<=0){ kill(e,null); continue; }
    const px0=e.x, py0=e.y;

    if(e===P){
      // knockback only; input handled in updatePlayer
      if(e.kx||e.ky){ moveEnt(e,e.kx*d,e.ky*d);
        const f=Math.pow(.02,d); e.kx*=f; e.ky*=f;
        if(Math.abs(e.kx)<2)e.kx=0; if(Math.abs(e.ky)<2)e.ky=0; }
      e.vx=(e.x-px0)/Math.max(d,1e-4); e.vy=(e.y-py0)/Math.max(d,1e-4);
      continue;
    }
    if(e.kind==='horse'){
      if(e.rider){ e.vx=(e.x-px0)/Math.max(d,1e-4); e.vy=(e.y-py0)/Math.max(d,1e-4); continue; }
      e.stT-=d;
      if(e.state==='flee'){ const a=angTo(P.x,P.y,e.x,e.y);
        moveEnt(e,Math.cos(a)*220*d,Math.sin(a)*220*d); e.aim=a;
        if(e.stT<=0) e.state='idle';
      } else if(e.stT<=0){ e.state='idle'; e.stT=rnd(2,6);
        e.tx=clamp(e.x+rnd(-140,140),20,WORLD.w-20); e.ty=clamp(e.y+rnd(-140,140),20,WORLD.h-20);
      } else if(dist(e.x,e.y,e.tx,e.ty)>18){
        const a=angTo(e.x,e.y,e.tx,e.ty); e.aim=angLerp(e.aim,a,d*4);
        moveEnt(e,Math.cos(a)*54*d,Math.sin(a)*54*d);
      }
      e.vx=(e.x-px0)/Math.max(d,1e-4); e.vy=(e.y-py0)/Math.max(d,1e-4);
      continue;
    }
    if(e.skittish && dist2(P.x,P.y,e.x,e.y)<250*250 && e.state!=='flee'){ e.state='flee'; e.stT=4; }
    updateAI(e,d);
    if(e.kx||e.ky){ moveEnt(e,e.kx*d,e.ky*d);
      const f=Math.pow(.02,d); e.kx*=f; e.ky*=f;
      if(Math.abs(e.kx)<2)e.kx=0; if(Math.abs(e.ky)<2)e.ky=0; }
    e.vx=(e.x-px0)/Math.max(d,1e-4); e.vy=(e.y-py0)/Math.max(d,1e-4);
  }
}

function updateWorldEvents(d){
  eventT-=d; repopT-=d;
  if(eventT<=0){
    eventT=rnd(55,110);
    const np=nearestPOI(P.x,P.y);
    if(np.d>520 && onRoad(P.x,P.y) && !cine){
      // a road ambush
      const n=2+rndi(0,2+Math.floor(P.lvl*0.3));
      const a0=angTo(P.x,P.y,P.x+P.vx,P.y+P.vy)||rnd(TAU);
      for(let i=0;i<n;i++){
        const a=a0+rnd(-.9,.9), dd=380+rnd(0,140);
        const e=makeEnt({x:clamp(P.x+Math.cos(a)*dd,40,WORLD.w-40),y:clamp(P.y+Math.sin(a)*dd,40,WORLD.h-40),
          team: P.side==='outlaw'&&chance(.5)?'law':'outlaw', kind:'outlaw', name:npcName(),
          hp:70+P.lvl*8, gun:pick(['rusted','navy','coach','trapper','lever']), spd:80, loot:rndi(12,40)});
        e.renegade=true; e.state='combat'; e.target=P;
      }
      toast('ROAD AGENTS','They were waiting on this stretch.',C.outlaw);
      sfx('drone',{f:46,dur:1.6});
    }
  }
  if(repopT<=0){
    repopT=90;
    let coy=0, camp=0;
    for(const e of ents){ if(e.dead) continue;
      if(e.kind==='coyote') coy++;
      if(e.team==='outlaw'&&!e.renegade) camp++; }
    if(coy<10) for(let i=0;i<6;i++){
      const x=rnd(300,WORLD.w-300), y=rnd(300,MAP_H-300);
      if(inRiver(x,y)||nearestPOI(x,y).d<420||dist(x,y,P.x,P.y)<900) continue;
      makeEnt({x:x,y:y,team:'beast',kind:'coyote',hp:28,spd:98,r:8,loot:0,name:'COYOTE'});
    }
    if(camp<5 && dist(P.x,P.y,poi('camp').x,poi('camp').y)>900) spawnCampOutlaws();
  }
  // ambient life: dust, birds, tumbleweed
  ambT-=d;
  if(ambT<=0){
    ambT=rnd(.06,.20);
    if(indoors()) return;                    // no wind-blown dust indoors
    const a=rnd(TAU), dd=rnd(120, Math.max(W,H)/cam.z*0.6);
    const x=cam.x+Math.cos(a)*dd, y=cam.y+Math.sin(a)*dd;
    spawnP(x,y,rnd(14,44),rnd(-10,6),rnd(2.5,5),rnd(1.2,3),C.bone,'dust',{drag:.999,grav:0});
  }
}

function updateCamera(d){
  let tx=P.x, ty=P.y-6;
  if(mode==='play'&&!cine){
    const dx=clamp(mouse.wx-P.x,-260,260), dy=clamp(mouse.wy-P.y,-260,260);
    tx+=dx*0.18; ty+=dy*0.18;
  }
  if(cine){ tx=P.x; ty=P.y; }
  const k=1-Math.pow(0.0015,d);
  cam.x=lerp(cam.x,tx,k); cam.y=lerp(cam.y,ty,k);
  if(!cine) cam.tz = P.mounted? 1.12 : P.de? 1.52 : 1.36;
  cam.z=lerp(cam.z,cam.tz,1-Math.pow(0.02,d));
  if(Math.abs(cam.z-cam.tz)<0.004) cam.z=cam.tz;   // settle, so the terrain buffer can cache
  cam.trauma=Math.max(0,cam.trauma-d*1.6);
  const sh=cam.trauma*cam.trauma*24;
  cam.sx=(Math.random()*2-1)*sh; cam.sy=(Math.random()*2-1)*sh;
}

function sim(d){
  now+=d;
  if(mode==='play'||mode==='dialog'||mode==='shop'||mode==='board'||mode==='journal'||mode==='map'){
    dayT=(dayT + d/DAY_LEN)%1;
  }
  updateSun();
  shadowA = indoors()? 0.17 : 0.10 + daylight()*0.24;
  if(fadeT>0) fadeT-=d;

  if(mode==='title'){ return; }
  if(mode==='duel'){ updateDuel(d); return; }
  if(mode==='dead'){ updateParts(d); updateDecals(d); return; }

  const paused = (mode!=='play');
  if(!paused || cine){
    if(cine) updateCine(rawDt);   // cinematics run on wall-clock, not slow-mo
    updatePlayer(d);
    updateEnts(d);
    updateBullets(d);
    updateThrown(d);
    checkGoto();
    updateWorldEvents(d);
    // pickups
    for(let i=pickups.length-1;i>=0;i--){ const pk=pickups[i];
      pk.life-=d;
      if(pk.z>0||pk.vz){ pk.vz-=700*d; pk.z+=pk.vz*d; if(pk.z<0){pk.z=0;pk.vz=0;} }
      if(dist2(pk.x,pk.y,P.x,P.y)<30*30){
        if(pk.kind==='gun') giveGun(pk.data.id);
        else if(pk.kind==='money'){ P.money+=pk.data.n; addFloat(P.x,P.y-30,'$'+pk.data.n,C.gold,14); }
        sfx('coin'); pickups.splice(i,1); continue; }
      if(pk.life<=0) pickups.splice(i,1);
    }
    if(P.hp<=0 && mode==='play'){ P.hp=0; mode='dead'; grade.red=1; addTrauma(.8); slowmo=1;
      sfx('drone',{f:36,dur:3}); }
  }
  updateParts(d); updateDecals(d); updateFloats(d);
  for(let i=toasts.length-1;i>=0;i--){ toasts[i].life-=d; if(toasts[i].life<=0) toasts.splice(i,1); }
  updateCamera(d);
  refreshQuestMarks();
}

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(mode==='title'){ drawTitle(); post(); return; }
  if(mode==='duel'){ drawDuelScreen(); post(); return; }

  ctx.fillStyle='#0d0a0c'; ctx.fillRect(0,0,W,H);
  renderWorld();
  post();
  drawHUD();

  if(mode==='dialog') drawDialog();
  else if(mode==='shop') drawShop();
  else if(mode==='board') drawBoard();
  else if(mode==='journal') drawJournal();
  else if(mode==='map') drawMap();
  else if(mode==='dead') drawDeath();

  if(cine){
    // cinematic bars sit above the HUD
    const lb=H*0.12;
    ctx.fillStyle='#0b0809'; ctx.fillRect(0,0,W,lb); ctx.fillRect(0,H-lb,W,lb);
  }
}

function tick(d){
  if(!W||!ready){ resize(); if(!W||!ready) return; }
  if(window.DBG && DBG.speed !== 1) d *= DBG.speed;
  if(window.DBG && DBG.on) DBG._t0=performance.now();
  rawDt = d;                                  // before hitstop: a cinematic must
  if(hitstop>0){ hitstop-=d; d*=0.10; }       // not be slowed by its own impacts
  // Hide the OS pointer only while aiming — menus and the title need a cursor.
  const wantCur = (mode==='play' && !cine) ? 'aiming' : '';
  if(cv.className!==wantCur) cv.className=wantCur;
  dt = d*slowmo;
  sim(dt);
  // UI keys that work in any non-modal mode
  if(mode==='play'){
    if(press('Tab')||press('k')){ mode='journal'; jTab=press('k')?2:0; sfx('ui',{f:500}); }
    if(press('m')){ mode='map'; sfx('ui',{f:500}); }
    if(press('Escape')){ mode='journal'; }
  }
  draw();
  if(window.dbgTick) dbgTick(d);
  clearOnce();
}

let last=performance.now(), acc=0;
function frame(t){
  const raw=Math.min(0.05,(t-last)/1000); last=t;
  tick(raw);
  requestAnimationFrame(frame);
}

function respawn(){
  P.hp=P.maxhp; P.stam=P.maxstam;
  P.money=Math.max(0,Math.round(P.money*0.6));
  P.wanted=Math.max(0,P.wanted-2);

  P.mounted=null; P.deadeye=P.deadeyeMax;
  for(const e of ents) if(e.state==='combat'&&e.target===P){ e.state='wander'; e.target=null; e.seen=0; }
  mode='play'; fadeT=1.2; grade.red=0;

}
function saveGame(){
  try{
    const qs={};
    for(const id in QUESTS) qs[id]={s:QUESTS[id].state,c:QUESTS[id].cur,p:QUESTS[id].prog};
    const data={
      v:1, x:P.x, y:P.y, hp:P.hp, maxhp:P.maxhp, money:P.money, xp:P.xp, lvl:P.lvl, sp:P.sp,
      side:P.side, honor:P.honor, noto:P.noto, wanted:P.wanted, bounty:P.bounty,
      guns:P.guns, gi:P.gi, mags:P.mags, ammo:P.ammo, items:P.items, perks:P.perks,
      awaken:P.awaken, kills:P.kills, dayT:dayT, flags:P.flags, legend:P.legend,
      outside:P.outside||null,
      q:qs, active:activeQ.slice(), tracked:tracked
    };
    localStorage.setItem('redwater_save', JSON.stringify(data));
    toast('SAVED','The ride is written down.',C.gold); sfx('chime');
  }catch(e){ toast('COULD NOT SAVE','',C.outlaw); }
}
function loadGame(){
  let data=null;
  try{ data=JSON.parse(localStorage.getItem('redwater_save')); }catch(e){}
  if(!data){ newGame(); return; }
  initWorld();
  P.x=data.x; P.y=data.y; P.hp=data.hp; P.maxhp=data.maxhp;
  P.money=data.money; P.xp=data.xp; P.lvl=data.lvl; P.sp=data.sp;
  P.side=data.side; P.honor=data.honor; P.noto=data.noto;
  P.wanted=data.wanted; P.bounty=data.bounty;
  P.guns=data.guns; P.gi=Math.min(data.gi,data.guns.length-1);
  P.mags=data.mags; P.ammo=data.ammo; P.items=data.items; P.perks=data.perks||{};
  P.awaken=data.awaken||0; P.kills=data.kills||0;
  P.flags=data.flags||{}; P.legend=data.legend||{};
  P.outside=data.outside||null;
  if(P.perks.grit) {} // maxhp already stored
  if(P.perks.eye){ P.deadeyeMax=160; P.deadeye=160; }
  dayT=data.dayT||0.32;
  for(const id in data.q){ if(QUESTS[id]){ QUESTS[id].state=data.q[id].s;
    QUESTS[id].cur=data.q[id].c; QUESTS[id].prog=data.q[id].p; } }
  activeQ.length=0;
  for(const id of (data.active||[])) if(QUESTS[id]) activeQ.push(id);
  tracked=data.tracked||activeQ[0]||null;
  // re-arm any active quest that spawns its own trouble
  for(const id of activeQ.slice()){ const qq=QUESTS[id]; if(qq&&qq.onStart) qq.onStart(); }
  refreshQuestMarks();
  cam.x=P.x; cam.y=P.y;
  mode='play'; fadeT=1.2;
  toast('SADDLED UP','Where you left off.',C.gold);
}

  ROOMS.forEach(function(R){ h+= dbgBtn(R.name.replace(/&rsquo;/g,"'"), 'enterRoom("'+R.id+'")'); });
  h+= dbgBtn('STEP OUT','exitRoom()') + '</div>';

  h+= dbgSection('Set pieces');
  h+= '<div class="row">'
    + dbgBtn('DUEL','startDuel()')
    + dbgBtn('EXPLOSION','explode(P.x+70,P.y,190,120,P)')
    + dbgBtn('BANK HEIST','startHeist()')
    + dbgBtn('POSSE','spawnPosse(3)')
    + '</div><div class="row"><span class="tag">awakenings &mdash; spawns targets first</span>'
    + ['deadmans','judgment','widow','ironhorse'].map(function(k){
        return dbgBtn(GUNS[k].aw.n.replace(/&rsquo;/g,"'"), 'dbgAwaken("'+k+'")','lg'); }).join('')
    + '</div>';

  h+= dbgSection('Quests');
  h+='<div class="row">'
    + dbgBtn('UNLOCK ALL','for(var k in QUESTS){if(QUESTS[k].state==="locked")QUESTS[k].state="avail"}refreshQuestMarks()')
    + dbgBtn('FINISH TRACKED','if(tracked)doneQ(tracked)')
    + dbgBtn('SKIP STEP','if(tracked)advQ(tracked)')
    + '</div>';
  for(const k in QUESTS){
    const q2=QUESTS[k]; if(q2.board) continue;
    h+='<div class="row"><span class="tag">'+q2.title.replace(/&rsquo;/g,"'")+' &mdash; '+q2.state+'</span>'
      + dbgBtn('start','QUESTS["'+k+'"].state="avail";startQ("'+k+'");refreshQuestMarks()')
      + dbgBtn('done','QUESTS["'+k+'"].state="active";if(activeQ.indexOf("'+k+'")<0)activeQ.push("'+k+'");doneQ("'+k+'")')
      + '</div>';
  }

  d.innerHTML=h;
  d.querySelectorAll('button').forEach(function(b){
    b.onclick=function(){
      try{ (new Function(b.dataset.do))(); }catch(err){ console.warn('[bench]',err); }
      dbgRender();
    };
  });
  const day=d.querySelector('#dbgDay');
  if(day) day.oninput=function(){ dayT=(+day.value)/1000; updateSun(); };
}

function dbgGo(x,y){
  if(P.mounted) dismount();
  P.outside=null; P.x=x; P.y=y+90; cam.x=P.x; cam.y=P.y;
  P.kx=P.ky=0; fadeT=0.7;
}
function dbgSpawn(kind,n){
  for(let i=0;i<n;i++){
    const a=rnd(TAU), dd=rnd(150,320);
    const x=clamp(P.x+Math.cos(a)*dd,40,WORLD.w-40), y=clamp(P.y+Math.sin(a)*dd,40,WORLD.h-40);
    let e;
    if(kind==='coyote') e=makeEnt({x:x,y:y,team:'beast',kind:'coyote',hp:28,spd:98,r:8,name:'COYOTE'});
    else if(kind==='horse'){ e=makeEnt({x:x,y:y,team:'none',kind:'horse',hp:130,spd:300,r:14,name:'HORSE',tamed:true});
      e.coat=pick(['#5a4334','#2f2a28','#8a6b45']); }
    else if(kind==='boss'){ e=makeEnt({x:x,y:y,team:'outlaw',kind:'outlaw',name:'TEST BOSS',title:'BENCH',
      hp:600,gun:'vaquero',spd:92,boss:true,loot:200}); e.renegade=true; e.state='combat'; e.target=P; }
    else { e=makeEnt({x:x,y:y,team:kind,kind:kind,name:npcName(),hp:80,
      gun:pick(['navy','peace','coach','lever','trapper']),spd:80,loot:20});
      e.renegade=true; e.state='combat'; e.target=P; }
  }
}
function dbgClear(){
  for(let i=ents.length-1;i>=0;i--){ const e=ents[i];
    if(e===P||e.kind==='horse') continue;
    if(e.team==='civ') continue;
    ents.splice(i,1); }
}
function dbgAwaken(id){
  if(P.guns.indexOf(id)<0) P.guns.push(id);
  P.gi=P.guns.indexOf(id); P.mags[id]=GUNS[id].mag;
  P.ammo[AMMO_OF[GUNS[id].cls]]=999;
  P.awaken=P.awakenMax;
  dbgSpawn('outlaw',6);
  setTimeout(function(){ startAwaken(); }, 260);
}

// Real frame-cost readout. fps alone hides stutter: a run that is 60fps with a
// 300ms hitch every second feels far worse than a steady 40fps, and only the
// worst-frame number tells them apart.
DBG.ring = new Float32Array(180); DBG.ringN = 0;
function dbgTick(dt2){
  if(!DBG.on) return;
  const ms = performance.now() - (DBG._t0 || performance.now());
  DBG.ring[DBG.ringN % 180] = ms; DBG.ringN++;
  DBG._fn++; DBG._ft+=dt2;
  let med=0, p95=0, worst=0, jank=0;
  if(DBG._ft>0.35){
    DBG.fps=Math.round(DBG._fn/DBG._ft); DBG._fn=0; DBG._ft=0;
    const n=Math.min(DBG.ringN,180), a=Array.prototype.slice.call(DBG.ring,0,n).sort(function(x,y){return x-y;});
    med=a[n>>1]||0; p95=a[Math.floor(n*0.95)]||0; worst=a[n-1]||0;
    for(let i=0;i<n;i++) if(a[i]>33) jank++;
    DBG.stats={med:med.toFixed(1), p95:p95.toFixed(1), worst:worst.toFixed(0), jank:jank};
  }
  const st=DBG.stats||{med:'-',p95:'-',worst:'-',jank:0};
  const s=document.getElementById('dbgStat');
  if(s) s.textContent =
    DBG.fps+' fps    frame  med '+st.med+'  p95 '+st.p95+'  worst '+st.worst+' ms\n'+
    'janky frames (>33ms) last 3s: '+st.jank+' / 180\n'+
    'ents '+ents.length+'   parts '+parts.filter(function(p){return p.a;}).length+
    '   lights '+lightN+'\n'+
    'x '+Math.round(P.x)+'  y '+Math.round(P.y)+'   '+hourStr()+
    (indoors()? '   [indoors]':'') + (DBG.god?'   [god]':'') + (DBG.noclip?'   [noclip]':'');
}
function dbgToggle(){
  dbgBuild();
  DBG.on=!DBG.on;
  DBG.el.classList.toggle('hid', !DBG.on);
  if(DBG.on) dbgRender();
}
window.addEventListener('keydown', function(e){
  if(e.key==='`' || e.key==='~'){ e.preventDefault(); dbgToggle(); }
});
if(DBG_WANTED){ dbgBuild(); DBG.on=true; }
else { dbgBuild(); DBG.on=false; DBG.el.classList.add('hid'); }
</script>
