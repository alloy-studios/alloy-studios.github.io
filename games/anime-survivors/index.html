        ctx.fillStyle = '#c9a8ec';
        ctx.beginPath(); ctx.moveTo(-r*0.45, -r*0.6); ctx.quadraticCurveTo(-r*1.15, -r*0.8, -r*1.0, -r*1.35); ctx.quadraticCurveTo(-r*0.7, -r*0.9, -r*0.25, -r*0.75); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(r*0.45, -r*0.6); ctx.quadraticCurveTo(r*1.15, -r*0.8, r*1.0, -r*1.35); ctx.quadraticCurveTo(r*0.7, -r*0.9, r*0.25, -r*0.75); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#4b2570'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.shadowBlur = 0;

        // Forehead gem (glows when charging)
        let gemGlow = this.charging ? (0.6 + Math.sin(this.wobble*10)*0.4) : 0.15;
        ctx.save(); ctx.globalCompositeOperation = 'screen';
        ctx.fillStyle = `rgba(255,0,255,${gemGlow})`;
        ctx.beginPath(); ctx.arc(0, -r*0.68, r*0.22, 0, Math.PI*2); ctx.fill();
        ctx.restore();
        ctx.fillStyle = this.charging ? '#ff44ff' : '#8a2be2';
        ctx.beginPath(); ctx.ellipse(0, -r*0.62, r*0.1, r*0.13, 0, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#3a1854'; ctx.lineWidth = 1.5; ctx.stroke();

        // Eyes -- angled magenta almonds
        ctx.fillStyle = '#ff2fd8';
        ctx.beginPath(); ctx.ellipse(-r*0.24, -r*0.35, r*0.15, r*0.09, -0.25, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(r*0.24, -r*0.35, r*0.15, r*0.09, 0.25, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#1a0022';
        ctx.beginPath(); ctx.arc(-r*0.24, -r*0.35, r*0.045, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(r*0.24, -r*0.35, r*0.045, 0, Math.PI*2); ctx.fill();

        // Thin smirking mouth
        ctx.strokeStyle = '#6b6b85'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(-r*0.12, -r*0.05); ctx.quadraticCurveTo(0, r*0.0, r*0.14, -r*0.08); ctx.stroke();

        ctx.restore();
    }
}

class MadaraBoss extends Boss {
    constructor(x, y, cycle) { super(x, y, 1200 * cycle, 40, '#8B0000', 70, "GHOST NINJA"); this.casting = 0; this.tomoeSpin = 0; }
    update(dt) {
        let adjDt = dt * globalTimeScale; if(adjDt === 0) return;
        super.update(dt); if (this.frozenTimer > 0) return;
        this.attackTimer += adjDt;
        this.tomoeSpin += adjDt * (this.casting > 0 ? 6 : 1.2);
        let interval = this.enraged ? 3.2 : 4.0;
        if (this.attackTimer > interval - 0.5) this.casting = Math.min(1, this.casting + adjDt * 3);
        if (this.attackTimer > interval) {
            this.attackTimer = 0; this.casting = 0;
            createGlow(this.x, this.y, '#ff2222', 14, { speed: 60, life: 0.4, radius: 4 });
            triggerShake(4);
            dangerZones.push(new DangerZone(player.x, player.y, 150, 2.0, 40));
        }
    }
    draw(camLeft, camRight, camTop, camBottom) {
        if(this.x < camLeft - 120 || this.x > camRight + 120 || this.y < camTop - 120 || this.y > camBottom + 120) return;
        this.drawBossFX();
        let r = this.radius; let sway = Math.sin(this.wobble * 0.6) * 0.08;
        ctx.save(); ctx.translate(this.x, this.y);
        let sq = 1 + Math.cos(this.wobble)*0.05;
        ctx.scale(sq, 1/sq);

        // Tattered cloak behind, swaying
        ctx.save(); ctx.rotate(sway);
        let cloakGrad = ctx.createLinearGradient(0, -r*0.3, 0, r*1.6);
        cloakGrad.addColorStop(0, '#5a0a0a'); cloakGrad.addColorStop(1, '#1a0000');
        ctx.fillStyle = cloakGrad;
        ctx.beginPath(); ctx.moveTo(-r*0.9, -r*0.2);
        ctx.lineTo(-r*1.1, r*1.1); ctx.lineTo(-r*0.7, r*0.85); ctx.lineTo(-r*0.5, r*1.3);
        ctx.lineTo(-r*0.15, r*0.9); ctx.lineTo(0, r*1.4); ctx.lineTo(r*0.15, r*0.9);
        ctx.lineTo(r*0.5, r*1.3); ctx.lineTo(r*0.7, r*0.85); ctx.lineTo(r*1.1, r*1.1);
        ctx.lineTo(r*0.9, -r*0.2);
        ctx.closePath(); ctx.fill();
        ctx.restore();

        if (this.enraged || this.casting > 0) { ctx.shadowBlur = 18 + this.casting*10; ctx.shadowColor = '#ff0000'; }

        // Hood
        let hoodGrad = ctx.createRadialGradient(0, -r*0.3, r*0.1, 0, -r*0.1, r*0.95);
        hoodGrad.addColorStop(0, this.flashTimer > 0 ? '#fff' : '#7a1515'); hoodGrad.addColorStop(1, '#2a0505');
        ctx.fillStyle = hoodGrad;
        ctx.beginPath();
        ctx.moveTo(-r*0.7, r*0.35);
        ctx.quadraticCurveTo(-r*0.85, -r*0.55, -r*0.35, -r*0.9);
        ctx.quadraticCurveTo(0, -r*1.05, r*0.35, -r*0.9);
        ctx.quadraticCurveTo(r*0.85, -r*0.55, r*0.7, r*0.35);
        ctx.quadraticCurveTo(0, r*0.55, -r*0.7, r*0.35);
        ctx.closePath(); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#1a0000'; ctx.lineWidth = 2; ctx.stroke();

        // Hood peak accent
        ctx.fillStyle = '#3a0808';
        ctx.beginPath(); ctx.moveTo(0, -r*1.05); ctx.lineTo(-r*0.1, -r*0.65); ctx.lineTo(r*0.1, -r*0.65); ctx.closePath(); ctx.fill();

        // Bone mask across lower face
        ctx.fillStyle = '#e8dcc8';
        ctx.beginPath(); ctx.ellipse(0, r*0.05, r*0.55, r*0.35, 0, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#a89878'; ctx.lineWidth = 1.5; ctx.stroke();
        // Red war-paint streaks
        ctx.strokeStyle = '#c0202080'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(-r*0.45, -r*0.05); ctx.lineTo(-r*0.2, r*0.2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(r*0.45, -r*0.05); ctx.lineTo(r*0.2, r*0.2); ctx.stroke();
        // Mouth guard vents
        ctx.strokeStyle = '#8a7a5c'; ctx.lineWidth = 1.5;
        for (let i=-1;i<=1;i++) { ctx.beginPath(); ctx.moveTo(-r*0.18, r*0.18+i*6); ctx.lineTo(r*0.18, r*0.18+i*6); ctx.stroke(); }

        // Shadowed closed eye (left)
        ctx.fillStyle = '#0a0000';
        ctx.beginPath(); ctx.ellipse(-r*0.28, -r*0.15, r*0.12, r*0.06, -0.1, 0, Math.PI*2); ctx.fill();

        // Glowing Sharingan eye (right) with orbiting tomoe
        let eyeR = r*0.16;
        ctx.save(); ctx.translate(r*0.28, -r*0.15);
        ctx.save(); ctx.globalCompositeOperation = 'screen';
        ctx.fillStyle = `rgba(255,0,0,${0.5 + this.casting*0.4})`;
        ctx.beginPath(); ctx.arc(0, 0, eyeR*2.2, 0, Math.PI*2); ctx.fill();
        ctx.restore();
        ctx.fillStyle = '#dd0000'; ctx.beginPath(); ctx.arc(0, 0, eyeR, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0, 0, eyeR*0.35, 0, Math.PI*2); ctx.fill();
        for (let i=0;i<3;i++) {
            let a = this.tomoeSpin + i*(Math.PI*2/3);
            let tx = Math.cos(a)*eyeR*0.6, ty = Math.sin(a)*eyeR*0.6;
            ctx.save(); ctx.translate(tx, ty); ctx.rotate(a + Math.PI/2);
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(0, 0, eyeR*0.22, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.moveTo(0,-eyeR*0.22); ctx.quadraticCurveTo(eyeR*0.35,-eyeR*0.1, 0, eyeR*0.05); ctx.quadraticCurveTo(-eyeR*0.1,-eyeR*0.1,0,-eyeR*0.22); ctx.fill();
            ctx.restore();
        }
        ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0,0,eyeR,0,Math.PI*2); ctx.stroke();
        ctx.restore();

        ctx.restore();
    }
}

class DioBoss extends Boss {
    constructor(x, y, cycle) { super(x, y, 700 * cycle, 90, '#f1c40f', 55, "VAMPIRE LORD"); this.timeStopped = false; this.warmup = 0; }
    update(dt) {
        if (this.frozenTimer > 0) { this.frozenTimer -= dt; return; }
        this.wobble += dt * 5; let angle = Math.atan2(player.y - this.y, player.x - this.x);
        this.x += Math.cos(angle) * this.speed * dt; this.y += Math.sin(angle) * this.speed * dt;
        if(this.flashTimer > 0) this.flashTimer -= dt;
        if(this.spawnGrow < 1) this.spawnGrow = Math.min(1, this.spawnGrow + dt * 6);
        
        if (Math.abs(this.x - player.x) < 50 && Math.abs(this.y - player.y) < 50) {
            if (getDistSq(this.x, this.y, player.x, player.y) < (this.radius + player.radius)**2) {
                player.takeDamage(this.damage); this.x -= Math.cos(angle) * 40; this.y -= Math.sin(angle) * 40;
            }
        }

        this.attackTimer += dt;
        // Brief golden warmup flash right before the world stops, so it never feels like a free hit
        if (this.attackTimer > 5.6 && !this.timeStopped) {
            this.warmup += dt;
            if (Math.random() < 0.3) createSparks(this.x, this.y, '#f1c40f', 1, 0.5);
        }
        if (this.attackTimer > 6.0 && !this.timeStopped) {
            this.timeStopped = true; this.warmup = 0; globalTimeScale = 0.0; 
            createFloatingText(this.x, this.y - 100, "ZA WARUDO!", "#f1c40f"); triggerShake(10);
            createShockwave(this.x, this.y, '#f1c40f', 400, 0.6); triggerFlash('241,196,15', 0.4);
            SoundEngine.timeStop();
            
            // Fewer, slightly weaker knives than before -- still threatening, less of a guaranteed chunk of HP
            const knifeCount = 6, knifeDamage = 12;
            for(let i=0; i<knifeCount; i++) {
                setTimeout(() => {
                    if (GAME_STATE !== 'PLAYING') return;
                    let a = Math.atan2(player.y - this.y, player.x - this.x) + (Math.random()-0.5)*0.5;
                    projectiles.push(new Projectile(this.x, this.y, a, 700, knifeDamage, 8, '#ccc', 'knife', 1, 1, this));
                }, 500 + i*150);
            }
            setTimeout(() => { globalTimeScale = 1.0; this.timeStopped = false; this.attackTimer = 0; }, 2500);
        }
    }
    draw(camLeft, camRight, camTop, camBottom) {
        if(this.x < camLeft - 120 || this.x > camRight + 120 || this.y < camTop - 120 || this.y > camBottom + 120) return;
        this.drawBossFX();
        let r = this.radius;
        ctx.save(); ctx.translate(this.x, this.y);
        let sq = 1 + Math.cos(this.wobble)*0.05;
        ctx.scale(sq, 1/sq);
        let glowAmt = this.warmup > 0 ? 30 : 14;

        // Popped cape collar behind head/shoulders
        let capeGrad = ctx.createLinearGradient(0, -r*0.2, 0, r*0.9);
        capeGrad.addColorStop(0, '#2ecc71'); capeGrad.addColorStop(1, '#0e5c34');
        ctx.fillStyle = capeGrad;
        ctx.beginPath();
        ctx.moveTo(-r*0.2, r*0.6);
        ctx.quadraticCurveTo(-r*0.75, r*0.3, -r*0.95, -r*0.55);
        ctx.quadraticCurveTo(-r*0.5, -r*0.15, -r*0.35, r*0.15);
        ctx.lineTo(r*0.35, r*0.15);
        ctx.quadraticCurveTo(r*0.5, -r*0.15, r*0.95, -r*0.55);
        ctx.quadraticCurveTo(r*0.75, r*0.3, r*0.2, r*0.6);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 2; ctx.stroke();

        ctx.shadowBlur = glowAmt; ctx.shadowColor = '#f1c40f';
        // Pale face
        let faceGrad = ctx.createRadialGradient(-r*0.15, -r*0.2, r*0.1, 0, 0, r*0.75);
        faceGrad.addColorStop(0, this.flashTimer > 0 ? '#fff' : '#fdeee0'); faceGrad.addColorStop(1, '#e8c9a8');
        ctx.fillStyle = faceGrad;
        ctx.beginPath(); ctx.ellipse(0, r*0.05, r*0.55, r*0.62, 0, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;

        // Pompadour hair -- bold swept spikes
        ctx.fillStyle = '#f1c40f';
        ctx.beginPath();
        ctx.moveTo(-r*0.55, -r*0.1);
        ctx.quadraticCurveTo(-r*0.65, -r*0.7, -r*0.3, -r*0.75);
        ctx.quadraticCurveTo(-r*0.35, -r*1.15, 0, -r*1.3);
        ctx.quadraticCurveTo(r*0.35, -r*1.15, r*0.3, -r*0.75);
        ctx.quadraticCurveTo(r*0.65, -r*0.7, r*0.55, -r*0.1);
        ctx.quadraticCurveTo(r*0.3, -r*0.45, 0, -r*0.35);
        ctx.quadraticCurveTo(-r*0.3, -r*0.45, -r*0.55, -r*0.1);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 1.5; ctx.stroke();
        // Widow's peak
        ctx.fillStyle = '#fdeee0';
        ctx.beginPath(); ctx.moveTo(-r*0.1, -r*0.3); ctx.lineTo(r*0.1, -r*0.3); ctx.lineTo(0, -r*0.12); ctx.closePath(); ctx.fill();

        // Sharp angular red eyes
        ctx.fillStyle = this.warmup > 0 ? '#ff5555' : '#c0392b';
        ctx.beginPath(); ctx.moveTo(-r*0.38, -r*0.02); ctx.lineTo(-r*0.12, -r*0.08); ctx.lineTo(-r*0.14, r*0.05); ctx.lineTo(-r*0.36, r*0.08); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(r*0.38, -r*0.02); ctx.lineTo(r*0.12, -r*0.08); ctx.lineTo(r*0.14, r*0.05); ctx.lineTo(r*0.36, r*0.08); ctx.closePath(); ctx.fill();

        // Smirk with fangs
        ctx.strokeStyle = '#8a5a3a'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(-r*0.15, r*0.32); ctx.quadraticCurveTo(0, r*0.4, r*0.2, r*0.28); ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.moveTo(-r*0.08, r*0.34); ctx.lineTo(-r*0.04, r*0.34); ctx.lineTo(-r*0.06, r*0.44); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(r*0.1, r*0.32); ctx.lineTo(r*0.14, r*0.32); ctx.lineTo(r*0.12, r*0.42); ctx.closePath(); ctx.fill();

        ctx.restore();
    }
}

class DangerZone {
    constructor(x, y, radius, time, damage) { this.x = x; this.y = y; this.radius = radius; this.maxTime = time; this.time = time; this.damage = damage; }
    update(dt) {
        this.time -= dt;
        if (this.time <= 0) {
            triggerShake(10); createParticles(this.x, this.y, '#ff4500', 30);
            if (getDistSq(this.x, this.y, player.x, player.y) < (this.radius + player.radius)**2) player.takeDamage(this.damage);
            return true; 
        } return false;
    }
    draw(camLeft, camRight, camTop, camBottom) {
        if(this.x < camLeft - this.radius || this.x > camRight + this.radius || this.y < camTop - this.radius || this.y > camBottom + this.radius) return;
        let progress = 1 - this.time / this.maxTime; // 0 -> 1 as detonation approaches
        ctx.save(); ctx.translate(this.x, this.y);
        ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI*2);
        ctx.fillStyle = `rgba(255, 0, 0, ${0.15 + progress * 0.35})`; ctx.fill();
        // Pulsing warning ring that speeds up as it closes in on detonation
        let pulse = Math.sin(progress * Math.PI * (4 + progress * 6));
        ctx.beginPath(); ctx.arc(0, 0, this.radius * (0.85 + pulse * 0.08), 0, Math.PI*2);
        ctx.strokeStyle = `rgba(255, 60, 40, ${0.6 + progress * 0.4})`; ctx.lineWidth = 3 + progress * 3; ctx.stroke();
        // Crosshair
        ctx.strokeStyle = `rgba(255,255,255,${0.4 + progress*0.4})`; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(-this.radius*0.25,0); ctx.lineTo(this.radius*0.25,0); ctx.moveTo(0,-this.radius*0.25); ctx.lineTo(0,this.radius*0.25); ctx.stroke();
        ctx.restore();
    }
}

function drawFist(ctx, radius, isHaki, isFire) {
    ctx.fillStyle = isHaki ? '#111' : '#fceabb';
    ctx.strokeStyle = isFire ? '#ff4500' : '#000';
    ctx.lineWidth = 3;
    
    // Palm
    ctx.beginPath(); ctx.roundRect(-radius, -radius*0.8, radius*1.8, radius*1.6, 5); ctx.fill(); ctx.stroke();
    // Fingers
    ctx.fillStyle = isHaki ? '#222' : '#e5c9a0';
    for(let i=0; i<4; i++) {
        ctx.beginPath(); ctx.roundRect(radius*0.6, -radius*0.7 + i*(radius*0.4), radius*0.4, radius*0.35, 3); ctx.fill(); ctx.stroke();
    }
    // Thumb
    ctx.beginPath(); ctx.roundRect(-radius*0.3, radius*0.5, radius*0.8, radius*0.35, 3); ctx.fill(); ctx.stroke();
}

// Reusable layered glow orb: hot white core -> saturated color -> transparent edge
function drawEnergyOrb(radius, colorCore, colorEdge, coreStop = 0.35) {
    let grd = ctx.createRadialGradient(0, 0, 0, 0, 0, radius);
    grd.addColorStop(0, '#ffffff');
    grd.addColorStop(coreStop, colorCore);
    grd.addColorStop(1, colorEdge);
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill();
}
// Draws a soft outer bloom behind something -- call before the main shape
function drawBloom(radius, color, alphaMul = 1) {
    ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha *= alphaMul;
    let grd = ctx.createRadialGradient(0, 0, 0, 0, 0, radius);
    grd.addColorStop(0, color); grd.addColorStop(1, 'transparent');
    ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
}
// Proper crescent-moon blade. The key: THICKNESS tapers to zero at both ends, which
// produces genuine sharp horns/cusps like a crescent moon. (Previously the outer radius
// was tapered against a constant inner radius, which left blunt stumps at both tips and
// made the whole thing read as a bent band instead of a blade.)
// `curve` >1 pushes the belly of the blade outward for a fuller, more aggressive arc.
function buildCrescentBlade(arcArc, R, thickness, curve = 1.0) {
    let steps = 30;
    ctx.beginPath();
    // Outer (leading) edge
    for (let s = 0; s <= steps; s++) {
        let t = s / steps; let a = -arcArc + t * arcArc * 2;
        let belly = Math.sin(t * Math.PI);
        let r = R * (1 + (curve - 1) * belly);
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    // Inner (trailing) edge, back toward the start -- thickness vanishes at both tips
    for (let s = steps; s >= 0; s--) {
        let t = s / steps; let a = -arcArc + t * arcArc * 2;
        let belly = Math.sin(t * Math.PI);
        let r = R * (1 + (curve - 1) * belly) - thickness * belly;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
}

function drawLightningArc(x1, y1, x2, y2, color, width = 2, segments = 6, jitter = 10) {
    ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1);
    for (let i = 1; i < segments; i++) {
        let t = i / segments;
        let mx = x1 + (x2 - x1) * t + (Math.random() - 0.5) * jitter;
        let my = y1 + (y2 - y1) * t + (Math.random() - 0.5) * jitter;
        ctx.lineTo(mx, my);
    }
    ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
}

class Projectile {
    constructor(x, y, angle, speed, damage, radius, color, style, pierce, level, originEntity = null) {
        this.x = x; this.y = y; this.angle = angle; this.speed = speed;
        this.damage = damage; this.radius = radius; this.color = color;
        this.style = style; this.pierce = pierce; this.level = level; this.originEntity = originEntity;
        
        if(style === 'fist') this.lifespan = 0.3 + level*0.05;
        else if(style === 'reaper_slash') this.lifespan = 1.5;
        else if(style === 'judgement_cut') this.lifespan = 0.8;
        else if(style === 'water_wheel' || style === 'sun_wheel') this.lifespan = 0.5 + level*0.2;
        else if(style === 'dragon') this.lifespan = 999999; // persistent companion, not a short-lived burst
        else if(style === 'domain') this.lifespan = 3.0;
        else if(style === 'bajrang') this.lifespan = 1.0;
        else if(style === 'hyper_beam') this.lifespan = 1.5;
        else if(style === 'mugetsu') this.lifespan = 1.5;
        else if(style === 'chibaku') this.lifespan = 3.0; 
        else if(style === 'death_beam' || style === 'knife') this.lifespan = 3.0; 
        else this.lifespan = 5.0;
        
        this.hitTargets = new Map(); 
        this.age = 0; this.history = []; this.rotation = Math.random() * Math.PI*2; this.dragonTrail = [];
        this.spawnX = x; this.spawnY = y;
        
        // Initial setup for dropping attacks
        if(this.style === 'bajrang') {
            this.targetY = y; this.y = y - 800; // Start high up
            this.impactDone = false;
        }
    }

    update(dt) {
        let adjDt = dt;
        if (this.originEntity instanceof Boss || this.style === 'death_beam' || this.style === 'knife') { adjDt = dt; } 
        else { adjDt = dt * globalTimeScale; if (adjDt === 0) return; }

        this.age += adjDt; this.rotation += adjDt * (this.style === 'sun_wheel' ? 20 : 10);
        this.history.push({x: this.x, y: this.y}); if(this.history.length > 8) this.history.shift(); 
        
        if (this.style === 'water_wheel' || this.style === 'sun_wheel' || this.style === 'domain') {
            this.x = player.x; this.y = player.y; 
            if(this.style !== 'domain') {
                this.radius += (250 + this.level*50) * adjDt;
                if (Math.random() < 0.7) {
                    let a = Math.random() * Math.PI * 2;
                    let px = this.x + Math.cos(a) * this.radius, py = this.y + Math.sin(a) * this.radius;
                    if (this.style === 'sun_wheel') createGlow(px, py, '#ff8800', 1, { speed: 40, life: 0.3, radius: 2 + Math.random()*2 });
                    else createDust(px, py, 'rgba(150,210,255,0.7)', 1);
                }
            } else {
                // Paralyze everything inside -- Unlimited Void immobilizes rather than
                // damaging. Continuously refreshed so anyone who wanders in mid-domain
                // gets caught too, and thaws naturally ~0.3s after leaving or the domain ending.
                let rSq = this.radius * this.radius;
                enemies.concat(bosses).forEach(e => {
                    if (getDistSq(this.x, this.y, e.x, e.y) < rSq && e.frozenTimer < 0.3) e.frozenTimer = 0.3;
                });
            }
        } else if (this.style === 'dragon') {
            let orbitR = this.orbitRadius || 230; let dir = this.orbitDir || 1;
            this.rotation += adjDt * 1.7 * dir;
            this.x = player.x + Math.cos(this.rotation) * orbitR; this.y = player.y + Math.sin(this.rotation) * orbitR;
            this.dragonTrail.push({x: this.x, y: this.y}); if(this.dragonTrail.length > 30) this.dragonTrail.shift();
            if (Math.random() < 0.6) createGlow(this.x, this.y, '#ff6a00', 1, { speed: 30, life: 0.35, radius: 3 + Math.random()*2 });
        } else if (this.style === 'judgement_cut' || this.style === 'chibaku' || this.style === 'mugetsu') {
            // stationary -- Mugetsu's wave expands via its draw/collision radius, anchored
            // at the point it was unleashed rather than traveling as a projectile
            // stationary
        } else if (this.style === 'bajrang') {
            // Drop logic
            let progress = Math.min(1, this.age / 0.3); // Drops in 0.3s
            this.y = this.targetY - 800 * (1 - Math.pow(progress, 3)); // easeIn cubic
            if(progress >= 1 && !this.impactDone) { this.impactDone = true; triggerShake(25); triggerImpactFrame(0.07); triggerFlash('255,120,0', 0.3); } // Impact!
        } else if (this.style === 'hyper_beam') {
            this.x = player.x; this.y = player.y; this.angle += adjDt * 0.5; 
        } else {
            this.x += Math.cos(this.angle) * this.speed * adjDt; this.y += Math.sin(this.angle) * this.speed * adjDt;
        }

        // Particle generation
        if (this.style === 'reaper_slash') {
            // Dark energy shedding off the two horn tips -- the crackling "bleed" an anime
            // energy blade leaves in its wake
            let arcArc = Math.PI / 2.6;
            let R = this.radius + 10 + this.level * 2;
            for (let side = -1; side <= 1; side += 2) {
                if (Math.random() > 0.55) continue;
                let a = this.angle + side * arcArc;
                let hx = this.x + Math.cos(a) * R, hy = this.y + Math.sin(a) * R;
                createGlow(hx, hy, '#000', 1, { angle: this.angle + Math.PI + (Math.random()-0.5), speed: 60 + Math.random()*90, life: 0.25 + Math.random()*0.2, radius: 3 + Math.random()*4 });
                if (Math.random() < 0.5) createSparks(hx, hy, this.color, 1, 0.5);
            }
            // Embers peeling back off the leading edge
            if (Math.random() < 0.7) {
                let a = this.angle + (Math.random() - 0.5) * arcArc * 1.6;
                let ex = this.x + Math.cos(a) * R, ey = this.y + Math.sin(a) * R;
                createGlow(ex, ey, this.color, 1, { angle: this.angle + Math.PI + (Math.random()-0.5)*1.2, speed: 70 + Math.random()*70, life: 0.2 + Math.random()*0.15, radius: 1.5 + Math.random()*2 });
            }
        }
        if (this.style === 'mugetsu') {
            // Rising black smoke/veil -- canon Mugetsu "causes a massive veil of black
            // Reiatsu to erupt upward, darkening the sky"
            if (Math.random() < 0.8) {
                let px = this.x + (Math.random() - 0.5) * this.radius * 3;
                let py = this.y + (Math.random() - 0.5) * this.radius * 2;
                createGlow(px, py, 'rgba(8,8,10,0.6)', 1, { angle: -Math.PI/2 + (Math.random()-0.5) * 0.8, speed: 50 + Math.random()*50, life: 0.5 + Math.random()*0.3, radius: 4 + Math.random()*5 });
            }
            // Void debris and pale streaks torn along the advancing wave front
            let grow = Math.min(1, this.age / 0.45);
            let ease = 1 - Math.pow(1 - grow, 3);
            let waveR = 70 + ease * (this.radius * 4.2);
            if (this.age < 0.7 && Math.random() < 0.85) {
                let a = this.angle + (Math.random() - 0.5) * (Math.PI / 1.75) * 2;
                let wx = this.x + Math.cos(a) * waveR, wy = this.y + Math.sin(a) * waveR;
                createGlow(wx, wy, '#0a0a0f', 1, { angle: a, speed: 120 + Math.random()*160, life: 0.3 + Math.random()*0.25, radius: 5 + Math.random()*7 });
                if (Math.random() < 0.45) createSparks(wx, wy, '#dfe6ff', 1, 0.7);
                if (Math.random() < 0.2) createShards(wx, wy, '#11121a', 1);
            }
        }
        if (this.style === 'spirit_blast' && Math.random() < 0.5) {
            createGlow(this.x, this.y, this.color, 1, { speed: 15, life: 0.18, radius: 1.5 });
        }
        if (this.style === 'cursed_purple' && Math.random() < 0.4) {
            let a = this.rotation + Math.random() * Math.PI * 2;
            createGlow(this.x + Math.cos(a) * this.radius * 0.7, this.y + Math.sin(a) * this.radius * 0.7, '#8a2be2', 1, { speed: -40, life: 0.3, radius: 2 });
        }
        if (this.style === 'knife' && Math.random() < 0.5) {
            createSparks(this.x, this.y, '#eee', 1, 0.3);
        }

        if (this.style === 'death_beam') {
            // Only the segment the bolt has actually traveled (spawn -> current tip) can hit --
            // previously this checked 1200px *ahead* of the current position every frame, which
            // meant the beam could hit the player almost the instant it fired with no way to dodge.
            let l2 = getDistSq(this.spawnX, this.spawnY, this.x, this.y);
            let projX, projY;
            if (l2 > 1) {
                let t = ((player.x - this.spawnX) * (this.x - this.spawnX) + (player.y - this.spawnY) * (this.y - this.spawnY)) / l2;
                t = Math.max(0, Math.min(1, t));
                projX = this.spawnX + t * (this.x - this.spawnX); projY = this.spawnY + t * (this.y - this.spawnY);
            } else { projX = this.x; projY = this.y; }
            if (getDistSq(player.x, player.y, projX, projY) < (player.radius + this.radius)**2) {
                player.takeDamage(this.damage); this.pierce--;
            }
            return;
        } else if (this.style === 'knife') {
            if (getDistSq(this.x, this.y, player.x, player.y) < (this.radius + player.radius)**2) { player.takeDamage(this.damage); this.pierce--; }
            return;
        }

        if (this.style === 'cursed_purple' && this.level >= 3) {
            let suckRadiusSq = (this.radius * (this.level >= 5 ? 5 : 3))**2;
            let mobs = enemies.concat(bosses);
            mobs.forEach(e => {
                let distSq = getDistSq(this.x, this.y, e.x, e.y);
                if(distSq < suckRadiusSq) {
                    let pullAngle = Math.atan2(this.y - e.y, this.x - e.x);
                    e.x += Math.cos(pullAngle) * (150 * adjDt); e.y += Math.sin(pullAngle) * (150 * adjDt);
                }
            });
        } else if (this.style === 'chibaku') {
            let mobs = enemies.concat(bosses);
            mobs.forEach(e => {
                let distSq = getDistSq(this.x, this.y, e.x, e.y);
                if(distSq < 1000**2) { 
                    let pullAngle = Math.atan2(this.y - e.y, this.x - e.x);
                    e.x += Math.cos(pullAngle) * (150 * adjDt); e.y += Math.sin(pullAngle) * (150 * adjDt);
                }
            });
            if(Math.random() < 0.3) {
                let a = Math.random() * Math.PI*2;
                cosmicDebris.push({x: this.x + Math.cos(a)*400, y: this.y + Math.sin(a)*400, targetX: this.x, targetY: this.y});
            }
        }

        // Damage Collision Phase
        let maxSearchRadius = this.radius + 60; 
        if(this.style === 'hyper_beam') maxSearchRadius = 1500; 
        else if(this.style === 'domain') maxSearchRadius = 450;
        else if(this.style === 'mugetsu') maxSearchRadius = 900;

        let targets = enemies.concat(bosses);

        for (let i = targets.length - 1; i >= 0; i--) {
            let e = targets[i];
            
            let hitCooldown = 0.2;
            if(this.style === 'chibaku') hitCooldown = 0.5; 
            else if(this.style === 'domain') hitCooldown = 0.5; 
            else if(this.style === 'bajrang') hitCooldown = 999; // HITS ONLY ONCE
            else if(this.style === 'mugetsu') hitCooldown = 999; // the wave sweeps through each target once

            let lastHit = this.hitTargets.get(e);
            if (lastHit !== undefined && this.age - lastHit < hitCooldown) continue;

            if (this.style !== 'hyper_beam' && this.style !== 'domain') {
                if (Math.abs(this.x - e.x) > maxSearchRadius || Math.abs(this.y - e.y) > maxSearchRadius) continue;
            }

            let isHit = false;

            if (this.style === 'reaper_slash') {
                let dist = Math.sqrt(getDistSq(this.x, this.y, e.x, e.y));
                let outerR = this.radius + 16 + this.level * 3 + e.radius;
                let innerR = Math.max(0, this.radius - 10 - this.level - e.radius);
                if (dist > innerR && dist < outerR) {
                    let angleToEnemy = Math.atan2(e.y - this.y, e.x - this.x);
                    let diff = Math.atan2(Math.sin(angleToEnemy - this.angle), Math.cos(angleToEnemy - this.angle));
                    let arcWidth = Math.PI / (3.6 - this.level * 0.12);
                    if (Math.abs(diff) < arcWidth) isHit = true;
                }
            } else if (this.style === 'mugetsu') {
                // Expanding crescent-wave band -- mirrors the draw's growth curve, arc
                // width and thickness exactly so the hitbox matches what's on screen
                let grow = Math.min(1, this.age / 0.45);
                let ease = 1 - Math.pow(1 - grow, 3);
                let R = 70 + ease * (this.radius * 4.2);
                let thick = 130 + ease * 190;
                let dist = Math.sqrt(getDistSq(this.x, this.y, e.x, e.y));
                if (dist < R + e.radius && dist > R - thick - e.radius) {
                    let angleToEnemy = Math.atan2(e.y - this.y, e.x - this.x);
                    let diff = Math.atan2(Math.sin(angleToEnemy - this.angle), Math.cos(angleToEnemy - this.angle));
                    if (Math.abs(diff) < Math.PI / 1.75) isHit = true;
                }
            } else if (this.style === 'water_wheel' || this.style === 'sun_wheel') {
                let dist = Math.sqrt(getDistSq(this.x, this.y, e.x, e.y));
                if (Math.abs(dist - this.radius) < 30 + e.radius) isHit = true;
            } else if (this.style === 'hyper_beam') {
                let beamEndX = this.x + Math.cos(this.angle) * 1500; let beamEndY = this.y + Math.sin(this.angle) * 1500;
                let l2 = getDistSq(this.x, this.y, beamEndX, beamEndY);
                if(l2 !== 0) {
                    let t = ((e.x - this.x) * (beamEndX - this.x) + (e.y - this.y) * (beamEndY - this.y)) / l2;
                    t = Math.max(0, Math.min(1, t));
                    let projX = this.x + t * (beamEndX - this.x); let projY = this.y + t * (beamEndY - this.y);
                    if (getDistSq(e.x, e.y, projX, projY) < (e.radius + this.radius)**2) isHit = true;
                }
            } else if (this.style === 'domain') {
                if (getDistSq(this.x, this.y, e.x, e.y) < this.radius**2) isHit = true;
            } else if (this.style === 'dragon') {
                if (getDistSq(this.x, this.y, e.x, e.y) < (this.radius + e.radius)**2) isHit = true;
            } else if (this.style === 'bajrang') {
                // Only deal damage if it has fully dropped
                if (this.age >= 0.3 && getDistSq(this.x, this.targetY, e.x, e.y) < (this.radius + e.radius)**2) isHit = true;
            } else {
                if (getDistSq(this.x, this.y, e.x, e.y) < (this.radius + e.radius)**2) isHit = true;
            }

            if (isHit) {
                let killed = e.takeDamage(this.damage);
                if (killed) {
                    if(e instanceof Enemy && !(e instanceof Boss)) enemies.splice(enemies.indexOf(e), 1);
                    else if (e instanceof Boss) bosses.splice(bosses.indexOf(e), 1);
                }
                this.hitTargets.set(e, this.age); 
                createParticles(e.x, e.y, this.style === 'mugetsu' ? '#fff' : this.color, 3);
                if (!killed) createSparks(e.x, e.y, '#fff', this.style === 'fist' || this.style === 'bajrang' ? 5 : 3, 0.6);
                if ((this.style === 'fist' && this.level >= 5) || this.style === 'bajrang' || this.style === 'mugetsu') {
                    createShockwave(e.x, e.y, this.style === 'mugetsu' ? '#fff' : this.color, e.radius * 2.5, 0.25);
                }
                
                if (this.style !== 'domain' && this.style !== 'hyper_beam' && this.style !== 'mugetsu' && this.style !== 'chibaku' && this.style !== 'bajrang') {
                    this.pierce--; if (this.pierce <= 0) break;
                }
            }
        }
    }

    draw(camLeft, camRight, camTop, camBottom) {
        if(this.style !== 'hyper_beam' && this.style !== 'domain' && this.style !== 'mugetsu' && this.style !== 'death_beam' && (this.x < camLeft - this.radius || this.x > camRight + this.radius || this.y < camTop - this.radius || this.y > camBottom + this.radius)) return;

        ctx.save();
        let alpha = Math.max(0, 1 - (this.age / this.lifespan));
        
        if (this.style === 'fist') {
            ctx.globalAlpha = alpha;
            if(this.originEntity) {
                ctx.beginPath(); ctx.moveTo(this.originEntity.x, this.originEntity.y); ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = this.level >= 5 ? '#ff4500' : '#fceabb'; ctx.lineWidth = this.radius * 0.8; ctx.lineCap = 'round'; ctx.stroke();
            }
            // Speed streaks trailing the punch
            ctx.save(); ctx.globalAlpha = alpha * 0.5; ctx.strokeStyle = this.level >= 5 ? '#ffb066' : '#fff';
            for (let i = 0; i < this.history.length - 1; i++) {
                let h = this.history[i];
                ctx.lineWidth = 2 + i; ctx.beginPath();
                ctx.moveTo(h.x - Math.cos(this.angle) * 6, h.y - Math.sin(this.angle) * 6);
                ctx.lineTo(h.x + Math.cos(this.angle) * 6, h.y + Math.sin(this.angle) * 6);
                ctx.stroke();
            }
            ctx.restore();
            ctx.translate(this.x, this.y); ctx.rotate(this.angle); 
            if (this.level >= 5) { ctx.shadowBlur = 16; ctx.shadowColor = '#ff4500'; drawBloom(this.radius * 1.8, 'rgba(255,120,0,0.5)'); }
            drawFist(ctx, this.radius, this.level >= 4, this.level >= 5);
            ctx.shadowBlur = 0;
            
        } else if (this.style === 'bajrang') {
            // REDRAWN BAJRANG: Giant Haki Fist with shadow
            ctx.translate(this.x, this.y);
            let dropProgress = Math.min(1, this.age / 0.3);
            
            // Draw Ground Shadow
            ctx.save();
            ctx.translate(0, this.targetY - this.y); // Offset to target
            let shadowScale = 0.5 + (0.5 * dropProgress);
            ctx.scale(shadowScale, shadowScale * 0.5);
            ctx.fillStyle = `rgba(0,0,0,${0.5 * dropProgress})`;
            ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI*2); ctx.fill();
            
            // Impact Shockwave (double ring for more weight) + crater cracks
            if(this.age > 0.3) {
                ctx.beginPath(); ctx.arc(0, 0, (this.age - 0.3) * 1000, 0, Math.PI*2);
                ctx.strokeStyle = `rgba(255, 69, 0, ${alpha})`; ctx.lineWidth = 30; ctx.stroke();
                ctx.beginPath(); ctx.arc(0, 0, (this.age - 0.3) * 700, 0, Math.PI*2);
                ctx.strokeStyle = `rgba(255, 220, 150, ${alpha*0.8})`; ctx.lineWidth = 10; ctx.stroke();
                if (this.age < 0.6) {
                    let crackA = alpha * (1 - (this.age-0.3)/0.3);
                    for (let i = 0; i < 7; i++) {
                        drawLightningArc(0, 0, Math.cos(i*0.9)*this.radius*3, Math.sin(i*0.9)*this.radius*1.2, `rgba(80,40,10,${crackA})`, 3, 4, 12);
                    }
                }
            }
            ctx.restore();

            // Wind streaks trailing the falling fist
            if (dropProgress < 1) {
                ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 3;
                for (let i = 0; i < 4; i++) {
                    let ox = (i - 1.5) * this.radius * 0.5;
                    ctx.beginPath(); ctx.moveTo(ox, -60 - (1-dropProgress)*100); ctx.lineTo(ox, -20); ctx.stroke();
                }
            }

            // Draw Fist
            ctx.globalAlpha = alpha;
            ctx.rotate(Math.PI/2); // point down
            if (dropProgress >= 1) drawBloom(this.radius * 2, 'rgba(255,120,0,0.6)');
            drawFist(ctx, this.radius, true, true);
            
        } else if (this.style === 'spirit_blast') {
            ctx.globalAlpha = alpha;
            // Simple tapering comet trail -- a fading string of shrinking circles behind the blast
            if (this.history.length > 1) {
                for (let i = 0; i < this.history.length; i++) {
                    let t = i / this.history.length; // 0 = oldest/tail, 1 = newest/near head
                    let h = this.history[i];
                    ctx.globalAlpha = alpha * t * 0.55;
                    ctx.fillStyle = this.color;
                    ctx.beginPath(); ctx.arc(h.x, h.y, this.radius * 0.85 * t, 0, Math.PI * 2); ctx.fill();
                }
                ctx.globalAlpha = alpha;
            }
            ctx.translate(this.x, this.y);
            drawBloom(this.radius * 2.8, this.color, 0.9);

            // Wavering, unstable outer edge -- the flickering energy look that reads as "ki"
            // rather than a smooth magic-circle orb
            let edgeGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.radius * 1.3);
            edgeGrad.addColorStop(0, '#fff'); edgeGrad.addColorStop(0.45, this.color); edgeGrad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = edgeGrad;
            ctx.beginPath();
            let steps = 18;
            for (let s = 0; s <= steps; s++) {
                let a = (Math.PI * 2 / steps) * s;
                let jitter = Math.sin(a * 5 + this.age * 26) * this.radius * 0.13 + Math.sin(a * 3 - this.age * 19) * this.radius * 0.07;
                let r = this.radius * 1.15 + jitter;
                let px = Math.cos(a) * r, py = Math.sin(a) * r;
                if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath(); ctx.fill();

            // Pulsing "breathing" ring
            let pulse = (this.age * 5.5) % 1;
            ctx.strokeStyle = `rgba(255,255,255,${(1 - pulse) * 0.55})`; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(0, 0, this.radius * (0.55 + pulse * 0.75), 0, Math.PI * 2); ctx.stroke();

            // Blinding hot core
            drawEnergyOrb(this.radius * 0.6, '#fff', this.color, 0.5);
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, this.radius * 0.3, 0, Math.PI * 2); ctx.fill();
        } else if (this.style === 'hyper_beam') {
            // Rebuilt to match Aura Fighters' beam construction: additive "lighter" blending,
            // a stroked line with a pulsing width (not a filled rect), a muzzle flare at the
            // origin, and a separate white-hot core stroke layered on top of the glow.
            ctx.globalAlpha = alpha;
            let chargeT = Math.min(1, this.age / 0.15);
            if (chargeT < 1) { ctx.save(); ctx.translate(this.x, this.y); drawBloom(this.radius * 4 * chargeT, '#fff', 1); ctx.restore(); }

            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            let cos = Math.cos(this.angle), sin = Math.sin(this.angle);
            let sx = this.x, sy = this.y;
            let ex = this.x + cos * 2000 * chargeT, ey = this.y + sin * 2000 * chargeT;
            let cw = this.radius * (0.7 + chargeT * 1.3) * (0.85 + Math.random() * 0.3); // pulsing width

            // Muzzle flare at the origin
            let flareR = cw * 1.4;
            let flareGrad = ctx.createRadialGradient(sx, sy, 0, sx, sy, flareR);
            flareGrad.addColorStop(0, '#ffffff'); flareGrad.addColorStop(0.4, '#ffee00'); flareGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = flareGrad;
            ctx.beginPath(); ctx.arc(sx, sy, flareR, 0, Math.PI * 2); ctx.fill();

            // Outer glow
            ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = cw; ctx.shadowBlur = 32; ctx.shadowColor = '#ffcc00';
            ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();

            // White-hot core
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = cw * 0.4; ctx.shadowBlur = 12; ctx.shadowColor = '#ffffff';
            ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
            ctx.shadowBlur = 0;

            // Traveling energy pulses racing down the beam
            for (let i = 0; i < 4; i++) {
                let phase = (this.age * 3 + i * 0.3) % 1;
                ctx.globalAlpha = alpha * (1 - phase) * 0.8 * chargeT;
                ctx.fillStyle = '#fff';
                let px = sx + cos * phase * 1800, py = sy + sin * phase * 1800;
                ctx.beginPath(); ctx.ellipse(px, py, 26, cw * 0.5, 0, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
        } else if (this.style === 'reaper_slash') {
            // GETSUGA TENSHO -- a crescent-moon energy wave. Black core with a searing red
            // rim (the Bankai "Black Getsuga"). Built from a real crescent with sharp horns.
            ctx.globalAlpha = alpha;

            // Lingering "cut scar" -- the glowing tear the blade rips through the air,
            // drawn in world space along the path already traveled. Classic anime slash cue.
            if (this.history.length > 2) {
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                let perp = this.angle + Math.PI / 2;
                for (let pass = 0; pass < 2; pass++) {
                    ctx.beginPath();
                    for (let i = 0; i < this.history.length; i++) {
                        let t = i / (this.history.length - 1);
                        let h = this.history[i];
                        let w = (pass === 0 ? 16 : 5) * Math.sin(t * Math.PI) * t;
                        ctx.lineTo(h.x + Math.cos(perp) * w, h.y + Math.sin(perp) * w);
                    }
                    for (let i = this.history.length - 1; i >= 0; i--) {
                        let t = i / (this.history.length - 1);
                        let h = this.history[i];
                        let w = (pass === 0 ? 16 : 5) * Math.sin(t * Math.PI) * t;
                        ctx.lineTo(h.x - Math.cos(perp) * w, h.y - Math.sin(perp) * w);
                    }
                    ctx.closePath();
                    ctx.globalAlpha = alpha * (pass === 0 ? 0.28 : 0.6);
                    ctx.fillStyle = pass === 0 ? this.color : '#fff';
                    ctx.fill();
                }
                ctx.restore();
                ctx.globalAlpha = alpha;
            }

            ctx.translate(this.x, this.y); ctx.rotate(this.angle);

            let arcArc = Math.PI / 2.6;                      // wide, sweeping crescent
            let R = this.radius + 10 + this.level * 2;
            let thick = 26 + this.level * 4;                 // fat belly, sharp horns
            let curve = 1.16;

            // Trailing wake -- receding ghost crescents, pure black
            for (let i = 4; i >= 1; i--) {
                ctx.globalAlpha = alpha * 0.10 * i;
                buildCrescentBlade(arcArc * (1 - i * 0.05), R - i * 9, thick * (1 - i * 0.14), curve);
                ctx.fillStyle = '#000'; ctx.fill();
            }
            ctx.globalAlpha = alpha;

            // Outer red aura -- layered soft strokes under the blade so it haloes rather
            // than washing it out (avoids ctx.filter blur, which is costly per-frame)
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.lineJoin = 'round';
            for (let i = 3; i >= 1; i--) {
                ctx.globalAlpha = alpha * 0.13;
                ctx.strokeStyle = this.color; ctx.lineWidth = 6 * i;
                buildCrescentBlade(arcArc, R, thick, curve); ctx.stroke();
            }
            ctx.restore();

            // Solid black body -- no shadow active, so it stays truly black
            buildCrescentBlade(arcArc, R, thick, curve);
            ctx.fillStyle = '#000'; ctx.fill();

            // Searing red rim
            ctx.save();
            ctx.shadowBlur = 16; ctx.shadowColor = this.color;
            ctx.strokeStyle = this.color; ctx.lineWidth = 3.5; ctx.lineJoin = 'round';
            buildCrescentBlade(arcArc, R, thick, curve); ctx.stroke();
            ctx.restore();

            // White-hot leading edge, hugging the outer curve only
            ctx.save();
            ctx.globalAlpha = alpha * 0.9;
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.lineCap = 'round';
            ctx.beginPath();
            for (let s = 0; s <= 30; s++) {
                let t = s / 30; let a = -arcArc + t * arcArc * 2;
                let belly = Math.sin(t * Math.PI);
                let r = R * (1 + (curve - 1) * belly);
                ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
            }
            ctx.stroke();
            ctx.restore();
        } else if (this.style === 'mugetsu') {
            // MUGETSU -- a colossal wall of pure black reiatsu that erupts and engulfs
            // everything, pitch black with a thin pale-white searing edge. Not a projectile
            // blade like stage 1: it's an expanding wave that swallows the screen.
            ctx.globalAlpha = alpha;
            ctx.translate(this.x, this.y); ctx.rotate(this.angle);

            let grow = Math.min(1, this.age / 0.45);
            let ease = 1 - Math.pow(1 - grow, 3);            // fast burst, then settle
            let R = 70 + ease * (this.radius * 4.2);
            let arcArc = Math.PI / 1.75;                     // enormous sweep, nearly a wall
            let thick = 130 + ease * 190;
            let curve = 1.1;
            let fade = Math.max(0, (this.age - 0.85) / 0.55);
            ctx.globalAlpha = alpha * (1 - fade);

            // Billowing black smoke body behind the wave
            for (let i = 5; i >= 1; i--) {
                ctx.globalAlpha = alpha * (1 - fade) * 0.16 * i;
                let wob = Math.sin(this.age * 7 + i) * 7;
                buildCrescentBlade(arcArc * (1 - i * 0.02), R - i * 16 + wob, thick * (1 - i * 0.09), curve);
                ctx.fillStyle = '#000'; ctx.fill();
            }
            ctx.globalAlpha = alpha * (1 - fade);

            // The wave itself -- absolute black
            buildCrescentBlade(arcArc, R, thick, curve);
            ctx.fillStyle = '#000'; ctx.fill();

            // Pale searing edge along the leading curve -- the only light in the technique
            ctx.save();
            ctx.shadowBlur = 26; ctx.shadowColor = '#dfe6ff';
            ctx.strokeStyle = 'rgba(233,238,255,0.95)'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
            ctx.beginPath();
            for (let s = 0; s <= 40; s++) {
                let t = s / 40; let a = -arcArc + t * arcArc * 2;
                let belly = Math.sin(t * Math.PI);
                let r = R * (1 + (curve - 1) * belly) + Math.sin(t * 14 + this.age * 9) * 4;
                ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
            }
            ctx.stroke();
            ctx.restore();

            // Faint white streaks streaming through the void, along the sweep
            ctx.save();
            ctx.globalAlpha = alpha * (1 - fade) * 0.5;
            ctx.strokeStyle = '#cdd6f5'; ctx.lineWidth = 1.5;
            for (let i = 0; i < 9; i++) {
                let t = (i + 0.5) / 9; let a = -arcArc + t * arcArc * 2;
                let belly = Math.sin(t * Math.PI);
                let rOut = R * (1 + (curve - 1) * belly) - 6;
                let rIn = rOut - thick * belly * (0.55 + Math.sin(i * 2.3 + this.age * 5) * 0.25);
                ctx.beginPath();
                ctx.moveTo(Math.cos(a) * rIn, Math.sin(a) * rIn);
                ctx.lineTo(Math.cos(a) * rOut, Math.sin(a) * rOut);
                ctx.stroke();
            }
            ctx.restore();
        } else if (this.style === 'judgement_cut') {
            ctx.globalAlpha = alpha;
            ctx.translate(this.x, this.y);
            // Bright white flash on the very first frames -- "you're already cut" feel
            if (this.age < 0.1) {
                ctx.save(); ctx.globalAlpha = alpha * (1 - this.age/0.1) * 0.8;
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, this.radius*1.3, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            }
            ctx.shadowBlur = 18; ctx.shadowColor = '#fff';
            for(let i=0; i<9; i++) {
                ctx.rotate(Math.random() * Math.PI); ctx.beginPath();
                ctx.moveTo(-this.radius + Math.random()*20, (Math.random()-0.5)*20);
                ctx.lineTo(this.radius - Math.random()*20, (Math.random()-0.5)*20);
                ctx.strokeStyle = i%2===0 ? '#000' : '#fff'; ctx.lineWidth = Math.random() * 8 + 2; ctx.stroke();
            }
            ctx.shadowBlur = 0;
            let burstGrad = ctx.createRadialGradient(0,0,0,0,0,this.radius);
            burstGrad.addColorStop(0, 'rgba(255,255,255,0.5)'); burstGrad.addColorStop(0.4, 'rgba(0,0,0,0.35)'); burstGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI*2);
            ctx.fillStyle = burstGrad; ctx.fill();
        } else if (this.style === 'chibaku') {
            // Planetary Devastation -- a colossal chunk of rock held together by crushing
            // purple gravity. Previously the silhouette used Math.random() every single
            // frame, which reshuffled the whole outline 60 times a second into a vibrating
            // mess instead of a solid asteroid; now it's a stable shape (seeded once) that
            // just slowly rotates.
            ctx.globalAlpha = alpha;
            ctx.translate(this.x, this.y);
            let size = this.radius * Math.min(1, this.age / 1.5);
            if (this.chibakuSeed === undefined) this.chibakuSeed = Math.random() * 1000;

            // Soft purple bloom halo behind everything
            drawBloom(size * 2.2, 'rgba(138,43,226,0.55)', 1);

            ctx.save(); ctx.rotate(this.rotation * 0.25);
            ctx.beginPath();
            let steps = 20;
            for (let i = 0; i <= steps; i++) {
                let a = (Math.PI * 2 / steps) * i;
                let n = Math.sin(a * 3.1 + this.chibakuSeed) * 0.16 + Math.sin(a * 5.7 + this.chibakuSeed * 2) * 0.09;
                let r = size * (1 + n);
                if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
                else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
            }
            ctx.closePath();
            let rockGrad = ctx.createRadialGradient(-size * 0.3, -size * 0.3, size * 0.1, 0, 0, size * 1.1);
            rockGrad.addColorStop(0, '#3a2a4a'); rockGrad.addColorStop(0.55, '#221830'); rockGrad.addColorStop(1, '#0d0812');
            ctx.fillStyle = rockGrad; ctx.fill();
            ctx.strokeStyle = 'rgba(138,43,226,0.5)'; ctx.lineWidth = 2; ctx.stroke();

            // Branching purple energy cracks across the surface
            ctx.strokeStyle = `rgba(180,90,255,${0.65 + Math.sin(this.age * 6) * 0.3})`;
            ctx.lineWidth = 2; ctx.shadowBlur = 10; ctx.shadowColor = '#8a2be2';
            for (let i = 0; i < 5; i++) {
                let a = i * 1.257 + this.chibakuSeed;
                let midR = size * 0.55, endR = size * 0.92;
                let mx = Math.cos(a) * midR, my = Math.sin(a) * midR;
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(mx, my); ctx.stroke();
                // fork
                let forkA = a + 0.5;
                ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(Math.cos(forkA) * endR, Math.sin(forkA) * endR); ctx.stroke();
            }
            ctx.shadowBlur = 0;
            ctx.restore();

            // Orbiting rock chunks -- bigger, shaded, with a faint trailing glow
            for (let i = 0; i < 5; i++) {
                let a = this.rotation * (0.6 + i * 0.1) + i * (Math.PI * 2 / 5);
                let orbR = size * 1.55 + Math.sin(this.age * 2 + i) * 7;
                let cx = Math.cos(a) * orbR, cy = Math.sin(a) * orbR;
                ctx.save(); ctx.translate(cx, cy); ctx.rotate(a * 1.4);
                let chunkGrad = ctx.createLinearGradient(-6, -6, 6, 6);
                chunkGrad.addColorStop(0, '#4a3a5e'); chunkGrad.addColorStop(1, '#181022');
                ctx.fillStyle = chunkGrad;
                ctx.beginPath();
                ctx.moveTo(-5, -5); ctx.lineTo(6, -4); ctx.lineTo(5, 6); ctx.lineTo(-6, 4); ctx.closePath(); ctx.fill();
                ctx.strokeStyle = 'rgba(180,90,255,0.5)'; ctx.lineWidth = 1; ctx.stroke();
                ctx.restore();
            }

            // Event horizon core -- swirling void with a pulsing ring
            let corePulse = 1 + Math.sin(this.age * 5) * 0.08;
            let coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 0.42 * corePulse);
            coreGrad.addColorStop(0, '#1a0a2a'); coreGrad.addColorStop(0.7, '#050005'); coreGrad.addColorStop(1, '#000');
            ctx.fillStyle = coreGrad;
            ctx.beginPath(); ctx.arc(0, 0, size * 0.42 * corePulse, 0, Math.PI * 2); ctx.fill();
            ctx.save();
            ctx.shadowBlur = 18; ctx.shadowColor = '#a855f7';
            ctx.strokeStyle = 'rgba(180,90,255,0.9)'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(0, 0, size * 0.42 * corePulse, 0, Math.PI * 2); ctx.stroke();
            ctx.restore();
        } else if (this.style === 'cursed_purple') {
            ctx.globalAlpha = alpha;
            ctx.translate(this.x, this.y);
            ctx.shadowBlur = 26; ctx.shadowColor = this.color;
            let pulse = (Math.sin(this.age * 8) + 1) / 2;

            // Core
            let grd = ctx.createRadialGradient(0,0,this.radius*0.15, 0,0,this.radius);
            grd.addColorStop(0, '#fff'); grd.addColorStop(0.3, '#000'); grd.addColorStop(0.6, this.color); grd.addColorStop(1, 'transparent');
            ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;

            // Warped distortion rings -- reads as space itself bending inward
            ctx.strokeStyle = 'rgba(200,120,255,0.35)'; ctx.lineWidth = 2;
            for (let i = 0; i < 3; i++) {
                ctx.save(); ctx.rotate(this.rotation * (i % 2 === 0 ? 1 : -1) * 0.5 + i);
                ctx.beginPath(); ctx.ellipse(0, 0, this.radius * (0.5 + i*0.22), this.radius * (0.3 + i*0.15), 0, 0, Math.PI*2); ctx.stroke();
                ctx.restore();
            }

            // Two spiraling energy arms (red & blue) converging inward -- Hollow Purple reference
            for (let arm = 0; arm < 2; arm++) {
                let col = arm === 0 ? '#ff2222' : '#3355ff';
                ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath();
                let steps = 16;
                for (let s = 0; s <= steps; s++) {
                    let t = s / steps;
                    let spiralA = this.rotation * (arm === 0 ? 1 : -1) + t * Math.PI * 3 + arm * Math.PI;
                    let spiralR = this.radius * (1 - t) * 0.85;
                    let sx = Math.cos(spiralA) * spiralR, sy = Math.sin(spiralA) * spiralR;
                    if (s === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
                }
                ctx.stroke();

class Gem {

class Particle {

        this.speed = opts.speed !== undefined ? opts.speed : Math.random() * 150;

    update(dt) {

    draw(camLeft, camRight, camTop, camBottom) {
        let pad = this.radius + 24;
        if(this.x < camLeft - pad || this.x > camRight + pad || this.y < camTop - pad || this.y > camBottom + pad) return;

            ctx.beginPath(); ctx.arc(this.x, this.y, Math.max(0, this.radius), 0, Math.PI * 2); ctx.stroke();

            ctx.beginPath(); ctx.moveTo(this.x, this.y);

class FloatingText {
    constructor(x, y, text, color) { this.x = x + (Math.random()*20-10); this.y = y + (Math.random()*10-5); this.text = text; this.color = color; this.life = 0.7; this.maxLife = 0.7; this.vy = -80; this.scale = 1.5; }
    update(dt) { this.y += this.vy * dt; this.vy *= 0.9; this.life -= dt; if(this.scale > 1) this.scale -= dt * 2; }
    draw(camLeft, camRight, camTop, camBottom) {

const MAX_PARTICLES = 750;
function createParticles(x, y, color, count) { if (particles.length > MAX_PARTICLES) return; for(let i=0; i<count; i++) particles.push(new Particle(x, y, color)); }
function createSparks(x, y, color, count, speedMult = 1) {
    if (particles.length > MAX_PARTICLES) return;
    for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color, { type: 'spark', speed: (180 + Math.random() * 260) * speedMult, life: 0.12 + Math.random() * 0.16, radius: 1.5 + Math.random() * 1.5, drag: 0.82 }));
    }
}
function createShockwave(x, y, color, maxRadius = 60, life = 0.35) {
    particles.push(new Particle(x, y, color, { type: 'ring', speed: 0, radius: 4, growth: (maxRadius - 4) / life, life }));
}
function createDust(x, y, color, count = 1) {
    if (particles.length > MAX_PARTICLES) return;
    for (let i = 0; i < count; i++) {
        let a = -Math.PI / 2 + (Math.random() - 0.5) * 1.6;
        particles.push(new Particle(x, y, color, { type: 'circle', angle: a, speed: 15 + Math.random() * 35, life: 0.3 + Math.random() * 0.25, radius: 1.5 + Math.random() * 2, drag: 0.9, gravity: 90 }));
    }
}
function createGlow(x, y, color, count = 1, opts = {}) {
    if (particles.length > MAX_PARTICLES) return;
    for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color, Object.assign({ type: 'circle', glow: true, speed: 8 + Math.random() * 18, life: 0.22 + Math.random() * 0.18, radius: 2.5 + Math.random() * 2, drag: 0.9 }, opts)));
    }
}
function createShards(x, y, color, count = 4) {
    if (particles.length > MAX_PARTICLES) return;
    for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color, { type: 'shard', speed: 100 + Math.random() * 220, life: 0.3 + Math.random() * 0.25, radius: 3 + Math.random() * 3, drag: 0.88, spin: (Math.random() - 0.5) * 12 }));
    }
}
function createFloatingText(x, y, text, color) { if (floatingTexts.length > 50) floatingTexts.shift(); floatingTexts.push(new FloatingText(x, y, text, color)); }

/**
 * GAME LOOP
 */

const MAX_ENEMIES = 260;
function spawnEnemy() {

    if (side === 0) { x = camera.x + Math.random() * canvas.width; y = camera.y - margin; } 
    else if (side === 1) { x = camera.x + canvas.width + margin; y = camera.y + Math.random() * canvas.height; } 
    else if (side === 2) { x = camera.x + Math.random() * canvas.width; y = camera.y + canvas.height + margin; } 
    else { x = camera.x - margin; y = camera.y + Math.random() * canvas.height; } 

    let hpMod = 1 + (gameTime / 120); let hp = 15 * hpMod;
    // Speed grows with time but is capped well below player base speed so late fights stay dodgeable
    let speed = Math.min(50 + Math.random() * 30 + (gameTime / 25), 190);
    let colors = ['#8e44ad', '#34495e', '#e74c3c', '#d35400', '#2980b9']; let color = colors[Math.floor(Math.random() * colors.length)];
    let e = new Enemy(x, y, hp, speed, color, 18);
    // Contact damage creeps up slowly over a run instead of staying flat forever
    e.damage = Math.min(10 + Math.floor(gameTime / 100) * 2, 24);
    enemies.push(e);
}

function spawnBoss() {
    enemies.forEach(e => createParticles(e.x, e.y, e.color, 5));
    enemies = [];
    triggerShake(20);
    bossMinuteCounter++;
    SoundEngine.bossSpawn();
    
    bossWarning.style.opacity = 1;
    setTimeout(() => { bossWarning.style.opacity = 0; }, 3000);

    let angle = Math.random() * Math.PI * 2;
    let x = player.x + Math.cos(angle) * 400; let y = player.y + Math.sin(angle) * 400;
    
    let type = Math.floor(Math.random() * 3);
    if(type === 0) bosses.push(new FriezaBoss(x, y, bossMinuteCounter));
    else if(type === 1) bosses.push(new MadaraBoss(x, y, bossMinuteCounter));
    else bosses.push(new DioBoss(x, y, bossMinuteCounter));
}

function updateUI() {
    let expPercent = (player.exp / player.maxExp) * 100; expBar.style.width = `${expPercent}%`; expText.innerText = `EXP ${Math.floor(player.exp)} / ${player.maxExp}`;
    let hpPercent = Math.max(0, (player.hp / player.maxHp) * 100); hpBar.style.width = `${hpPercent}%`; hpText.innerText = `HP ${Math.floor(player.hp)} / ${player.maxHp}`;
    levelText.innerText = `LVL ${player.level}`; timerText.innerText = formatTime(gameTime);
    lowHpVignette.style.opacity = hpPercent < 30 ? String(1 - hpPercent / 30) : '0';
}

let lastBossHpPercent = 1;
function updateBossUI() {
    if (bosses.length === 0) { bossHpWrap.classList.remove('show'); return; }
    // Track the boss with the lowest HP as the "focus" boss for the bar
    let b = bosses.reduce((a, c) => (c.hp < a.hp ? c : a), bosses[0]);
    bossHpWrap.classList.add('show');
    bossNameEl.innerText = bosses.length > 1 ? `${b.name} (+${bosses.length - 1})` : b.name;
    let pct = Math.max(0, b.hp / b.maxHp) * 100;
    bossHpBar.style.width = `${pct}%`;
    bossHpBar.style.background = b.enraged
        ? 'linear-gradient(90deg, #ff0000 0%, #ff5500 60%, #ffcc00 100%)'
        : 'linear-gradient(90deg, #ff0044 0%, #ff5566 60%, #ffaa00 100%)';
    if (pct < lastBossHpPercent - 0.01) {
        bossHpFlash.style.transition = 'none'; bossHpFlash.style.width = `${lastBossHpPercent}%`; bossHpFlash.style.opacity = '0.7';
        requestAnimationFrame(() => {
            bossHpFlash.style.transition = 'width 0.3s ease-out, opacity 0.3s ease-out 0.1s';
            bossHpFlash.style.width = `${pct}%`; bossHpFlash.style.opacity = '0';
        });
    }
    lastBossHpPercent = pct;
}

function hash2(x, y) { let s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function drawStarLayer(parallax, cellSize, minR, maxR, alpha) {
    let px = camera.x * parallax, py = camera.y * parallax;
    let startX = Math.floor(px / cellSize) * cellSize - cellSize;
    let startY = Math.floor(py / cellSize) * cellSize - cellSize;
    let endX = px + canvas.width + cellSize; let endY = py + canvas.height + cellSize;
    ctx.fillStyle = '#ffffff';
    for (let x = startX; x < endX; x += cellSize) {
        for (let y = startY; y < endY; y += cellSize) {
            let hx = hash2(x, y); let hy = hash2(y, x);
            let sx = x + hx * cellSize - px; let sy = y + hy * cellSize - py;
            let tw = 0.6 + 0.4 * Math.sin(gameTime * 1.5 + hx * 60);
            let r = minR + hx * (maxR - minR);
            ctx.globalAlpha = alpha * tw;
            ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();
        }
    }
    ctx.globalAlpha = 1;
}

function drawBackground() {
    // Deep space gradient rather than a flat fill, for a bit of depth
    let grd = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, Math.max(canvas.width, canvas.height) * 0.75);
    grd.addColorStop(0, '#0b0b14'); grd.addColorStop(1, '#020203');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawStarLayer(0.12, 260, 0.5, 1.3, 0.3);
    drawStarLayer(0.3, 160, 0.8, 1.8, 0.45);

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.025)'; ctx.lineWidth = 2; let gridSize = 100;
    let startX = -(camera.x % gridSize); let startY = -(camera.y % gridSize);
    if (startX > 0) startX -= gridSize; if (startY > 0) startY -= gridSize;
    ctx.beginPath();
    for (let x = startX; x < canvas.width; x += gridSize) { ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); }
    for (let y = startY; y < canvas.height; y += gridSize) { ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); }
    ctx.stroke();
    
    if (globalTimeScale < 1.0) {
        ctx.fillStyle = 'rgba(120, 100, 0, 0.22)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    if (bosses.length > 0) {
        let enraged = bosses.some(b => b.enraged);
        ctx.fillStyle = enraged ? `rgba(140,0,0,${0.09 + 0.05 * Math.sin(gameTime * 6)})` : 'rgba(60,0,10,0.06)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
}

function drawJoystick() {
    if (!joystick.active) return;
    ctx.save(); ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.arc(joystick.startX, joystick.startY, 50, 0, Math.PI*2);
    ctx.fillStyle = '#444'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    let stickX = joystick.startX + (joystick.dx * 50); let stickY = joystick.startY + (joystick.dy * 50);
    ctx.beginPath(); ctx.arc(stickX, stickY, 25, 0, Math.PI*2); ctx.fillStyle = '#ddd'; ctx.fill(); ctx.stroke(); ctx.restore();
}

function mainLoop(timestamp) {
    if (!lastTime) lastTime = timestamp; const dt = Math.min((timestamp - lastTime) / 1000, 0.1); lastTime = timestamp;

    // Impact frame: a very brief true freeze on big hits (shake/particles keep moving) --
    // capped at 0.09s in triggerImpactFrame() so this can never compound into a long freeze.
    let simDt = dt;
    if (impactFrameTimer > 0) { impactFrameTimer -= dt; simDt = dt * 0.015; }

    if (GAME_STATE === 'PLAYING') {
        gameTime += simDt * globalTimeScale;
        
        let currentInterval = Math.floor(gameTime / 120);
        if (currentInterval > bossMinuteCounter && currentInterval > 0) {
            if (bosses.length === 0) spawnBoss();
        }
        
        if (globalTimeScale > 0 && bosses.length === 0) {
            spawnRate = Math.max(0.4, 1.5 - (gameTime / 180)); spawnTimer += simDt;
            if (spawnTimer >= spawnRate) { spawnTimer = 0; let spawnCount = Math.min(1 + Math.floor(gameTime / 90), 6); for(let i=0; i<spawnCount; i++) spawnEnemy(); }
        }

        player.update(simDt);
        
        if(screenShake > 0) screenShake -= dt * 30; if(screenShake < 0) screenShake = 0;
        camera.x = player.x - canvas.width / 2 + ((Math.random() - 0.5) * screenShake); camera.y = player.y - canvas.height / 2 + ((Math.random() - 0.5) * screenShake);

        for (let i = enemies.length - 1; i >= 0; i--) enemies[i].update(simDt);
        for (let i = bosses.length - 1; i >= 0; i--) bosses[i].update(simDt);
        updateBossUI();
        
        for (let i = dangerZones.length - 1; i >= 0; i--) { if(dangerZones[i].update(simDt * globalTimeScale)) dangerZones.splice(i, 1); }

        for (let i = projectiles.length - 1; i >= 0; i--) {
            let p = projectiles[i]; p.update(simDt);
            if (p.pierce <= 0 || p.age >= p.lifespan || getDistSq(p.x, p.y, player.x, player.y) > 6000000) projectiles.splice(i, 1);
        }
        
        for (let i = cosmicDebris.length - 1; i >= 0; i--) {
            let d = cosmicDebris[i];
            let dx = d.targetX - d.x; let dy = d.targetY - d.y;
            d.x += dx * 5 * simDt; d.y += dy * 5 * simDt;
            if(Math.abs(dx) < 10 && Math.abs(dy) < 10) cosmicDebris.splice(i, 1);
        }

        for (let i = particles.length - 1; i >= 0; i--) { particles[i].update(dt * globalTimeScale); if(particles[i].life <= 0) particles.splice(i, 1); }
        for (let i = floatingTexts.length - 1; i >= 0; i--) { floatingTexts[i].update(dt * globalTimeScale); if(floatingTexts[i].life <= 0) floatingTexts.splice(i, 1); }
        if (gems.length > 500) gems.shift();
        timerText.innerText = formatTime(gameTime);
    }

    if (GAME_STATE === 'PLAYING' || GAME_STATE === 'LEVEL_UP') {
        ctx.clearRect(0,0, canvas.width, canvas.height); drawBackground();
        ctx.save(); ctx.translate(-camera.x, -camera.y);
        let pad = 100; let cL = camera.x - pad, cR = camera.x + canvas.width + pad; let cT = camera.y - pad, cB = camera.y + canvas.height + pad;
        
        ctx.globalCompositeOperation = 'source-over'; 
        dangerZones.forEach(d => d.draw(cL, cR, cT, cB));
        gems.forEach(g => g.draw(cL, cR, cT, cB)); 
        enemies.forEach(e => e.draw(cL, cR, cT, cB));
        bosses.forEach(b => b.draw(cL, cR, cT, cB));
        
        ctx.save(); ctx.shadowBlur = 6; ctx.shadowColor = '#a855f7'; ctx.fillStyle = '#6b5b7a';
        cosmicDebris.forEach(d => { ctx.beginPath(); ctx.arc(d.x, d.y, 3, 0, Math.PI*2); ctx.fill(); });
        ctx.restore();

        ctx.globalCompositeOperation = 'screen'; particles.forEach(p => p.draw(cL, cR, cT, cB)); projectiles.forEach(p => p.draw(cL, cR, cT, cB)); 
        ctx.globalCompositeOperation = 'source-over'; player.draw(); floatingTexts.forEach(ft => ft.draw(cL, cR, cT, cB));
        ctx.restore(); drawJoystick();
    }
    requestAnimationFrame(mainLoop);
}

/**
 * MENU & STATE MANAGEMENT
 */

function startGame() {
    player = new Player(0, 0); camera = { x: -canvas.width/2, y: -canvas.height/2 }; screenShake = 0;
    enemies = []; bosses = []; dangerZones = []; projectiles = []; gems = []; particles = []; floatingTexts = []; cosmicDebris = [];
    gameTime = 0; spawnTimer = 0; bossMinuteCounter = 0; globalTimeScale = 1.0; lastBossHpPercent = 1;
    
    startMenu.classList.add('hidden'); gameOverMenu.classList.add('hidden');
    uiTopBar.classList.remove('hidden'); timerText.classList.remove('hidden');
    bossHpWrap.classList.remove('show'); lowHpVignette.style.opacity = '0';
    updateUI(); GAME_STATE = 'PLAYING';
    SoundEngine.init();
}

function triggerGameOver() {
    GAME_STATE = 'GAME_OVER'; uiTopBar.classList.add('hidden'); timerText.classList.add('hidden');
    bossHpWrap.classList.remove('show'); lowHpVignette.style.opacity = '0';
    triggerShake(18); createShockwave(player.x, player.y, '#ff3333', 200, 0.6); triggerFlash('255,0,0', 0.5);
    gameOverMenu.classList.remove('hidden'); document.getElementById('survival-time').innerText = `You survived for: ${formatTime(gameTime)}`;
}

function triggerLevelUp() {
    GAME_STATE = 'LEVEL_UP'; levelUpMenu.classList.remove('hidden'); upgradeContainer.innerHTML = '';
    let availablePool = UPGRADE_POOL.filter(u => {
        if(u.type === 'weapon') { let existing = player.weapons.find(w => w.id === u.id); return !existing || existing.level < 10; } return true; 
    });
    if(availablePool.length === 0) availablePool.push({ id: 'HEAL', type: 'stat', name: 'Senzu Bean', icon: '🟢', desc: 'Restores all HP.' });

    let choices = []; let poolCopy = [...availablePool];
    for(let i=0; i<3; i++) { if(poolCopy.length === 0) break; let idx = Math.floor(Math.random() * poolCopy.length); choices.push(poolCopy.splice(idx, 1)[0]); }

    choices.forEach(choice => {
        let card = document.createElement('div'); card.className = 'upgrade-card'; let icon, title, desc, levelClass = "", levelStr = "";
        
        if (choice.type === 'weapon') {
            let def = WEAPON_TYPES[choice.id]; icon = def.icon;
            let existing = player.weapons.find(w => w.id === choice.id);
            if(existing) {
                title = `${def.name}`; 
                if(existing.level + 1 === 10) { levelStr = "ULTIMATE"; levelClass="ultimate"; desc = def.desc.split('<b>LVL 10:</b> ')[1]; }
                else if(existing.level + 1 === 5) { levelStr = "AWAKEN"; levelClass="awaken"; desc = def.desc.split('<br>')[1].split('<b>LVL 5:</b> ')[1]; }
                else { levelStr = `LVL ${existing.level + 1}`; desc = `Upgrade damage, speed, and efficiency.`; }
            } else { title = `${def.name}`; levelStr = "NEW"; desc = def.desc.split('<br>')[0]; }
        } else { icon = choice.icon; title = choice.name; desc = choice.desc; }

        card.innerHTML = `<div class="upgrade-icon">${icon}</div><h3 class="upgrade-title">${title}</h3>${levelStr ? `<div class="upgrade-level ${levelClass}">${levelStr}</div>` : ''}<p class="upgrade-desc">${desc}</p>`;
        card.addEventListener('click', () => applyUpgrade(choice)); upgradeContainer.appendChild(card);
    });
}

function applyUpgrade(choice) {
    if (choice.type === 'weapon') player.addWeapon(choice.id);
    else if (choice.type === 'stat') {
        if(choice.id === 'MAX_HP') { player.maxHp += 30; player.hp += 30; } 
        else if (choice.id === 'SPEED') { player.speed += 35; } 
        else if (choice.id === 'MAGNET') { player.magnetRange += 60; }
        else if (choice.id === 'HEAL') { player.hp = player.maxHp; }
    }
    
    if(player.pendingUpgrades > 0) player.pendingUpgrades--;
    levelUpMenu.classList.add('hidden'); updateUI();
    if (player.pendingUpgrades > 0) { triggerLevelUp(); } else { GAME_STATE = 'PLAYING'; }
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);
requestAnimationFrame(mainLoop);
</script>
