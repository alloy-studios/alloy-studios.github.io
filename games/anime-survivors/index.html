<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anime Survivors - Visually Remastered</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Roboto+Mono:wght@700&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #030303; overflow: hidden;
            font-family: 'Roboto Mono', monospace; touch-action: none;
        }
        canvas { display: block; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; z-index: 10;
        }

        #top-bar { padding: 10px; pointer-events: auto; }
        .bar-container {
            width: 100%; max-width: 400px; height: 20px; background: #111;
            border: 2px solid #444; border-radius: 10px; margin-bottom: 5px;
            position: relative; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.8);
        }
        #exp-bar {
            height: 100%; width: 0%; background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%);
            transition: width 0.2s ease-out; box-shadow: 0 0 10px #00d2ff;
        }
        #hp-bar {
            height: 100%; width: 100%; background: linear-gradient(90deg, #10b981 0%, #059669 100%);
            transition: width 0.2s ease-out; box-shadow: 0 0 10px #10b981;
        }
        .bar-text {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 13px; font-weight: bold; text-shadow: 1px 1px 2px black;
        }
        #level-text {
            color: #ffd700; font-family: 'Bangers', cursive; font-size: 32px;
            letter-spacing: 2px; text-shadow: 2px 2px 0px #000, 0 0 15px #ffd700; margin-bottom: 5px;
        }
        #timer {
            position: absolute; top: 20px; right: 20px; color: white;
            font-size: 26px; font-weight: bold; text-shadow: 2px 2px 0px black;
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column;
            align-items: center; justify-content: center; pointer-events: auto;
            z-index: 20; backdrop-filter: blur(8px);
        }
        .hidden { display: none !important; }

        h1 { font-family: 'Bangers', cursive; color: #ffcc00; font-size: 4rem; text-shadow: 4px 4px 0px #ff0000; margin-bottom: 20px; text-align: center; }
        p { color: white; font-size: 1.2rem; text-align: center; max-width: 600px; margin-bottom: 30px; line-height: 1.5; }

        .btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b); border: 3px solid #fff;
            color: white; padding: 15px 40px; font-size: 1.5rem; font-family: 'Bangers', cursive;
            border-radius: 30px; cursor: pointer; box-shadow: 0 6px 0 #cc0000; transition: all 0.1s; margin: 10px;
        }
        .btn:active { transform: translateY(6px); box-shadow: 0 0px 0 #cc0000; }

        #upgrade-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 1000px; padding: 20px; }
        .upgrade-card {
            background: linear-gradient(135deg, #1e293b, #334155); border: 3px solid #f1c40f;
            border-radius: 15px; padding: 20px; width: 260px; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column;
            align-items: center; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .upgrade-card:hover { transform: scale(1.05); box-shadow: 0 15px 30px rgba(241, 196, 15, 0.6); background: linear-gradient(135deg, #2c3e50, #475569); }
        .upgrade-icon { font-size: 4rem; margin-bottom: 10px; filter: drop-shadow(2px 4px 6px black); }
        .upgrade-title { color: #f1c40f; font-family: 'Bangers', cursive; font-size: 1.7rem; margin: 0 0 10px 0; text-shadow: 2px 2px 0px #000; }
        .upgrade-level { color: #ff4b2b; font-weight: bold; font-size: 1.1rem; margin-bottom: 10px; }
        .upgrade-level.awaken { color: #ff00ff; text-shadow: 0 0 8px #ff00ff; }
        .upgrade-level.ultimate { color: #00ffff; text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff; font-size: 1.5rem; animation: pulse 0.5s infinite alternate; }
        .upgrade-desc { color: #e2e8f0; font-size: 0.9rem; margin: 0; }
        
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }
        
        .modal-box { background: #1a1a1a; padding: 30px; border: 2px solid #00d2ff; border-radius: 10px; text-align: center; box-shadow: 0 10px 40px rgba(0, 210, 255, 0.2); max-width: 400px; width: 90%; }
        .modal-box input { padding: 10px; font-family: monospace; width: 80%; margin-bottom: 15px; border-radius: 5px; border: 1px solid #555; background: #000; color: white; font-size: 1.2rem; text-align: center; }
        
        #boss-warning {
            position: absolute; top: 20%; left: 0; width: 100%; text-align: center;
            color: #ff0000; font-family: 'Bangers', cursive; font-size: 5rem; letter-spacing: 5px;
            text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000; opacity: 0; pointer-events: none; z-index: 15;
            transition: opacity 0.2s;
        }

        #vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 4;
            box-shadow: inset 0 0 60px 10px rgba(0,0,0,0.55), inset 0 0 160px 40px rgba(0,0,0,0.35);
        }
        #screen-flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 16; opacity: 0; background: #fff;
            transition: opacity 0.06s linear;
        }
        #low-hp-vignette {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 6; opacity: 0;
            box-shadow: inset 0 0 100px 20px rgba(255,0,0,0.55), inset 0 0 220px 60px rgba(255,0,0,0.35);
            transition: opacity 0.4s ease; animation: lowhp-pulse 1s infinite;
        }
        @keyframes lowhp-pulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.4); } }

        #boss-hp-wrap {
            position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
            width: 60%; max-width: 520px; pointer-events: none; text-align: center;
            opacity: 0; transition: opacity 0.4s ease;
        }
        #boss-hp-wrap.show { opacity: 1; }
        #boss-name {
            font-family: 'Bangers', cursive; letter-spacing: 3px; font-size: 1.4rem;
            color: #ff5566; text-shadow: 2px 2px 0 #000, 0 0 12px rgba(255,0,60,0.8); margin-bottom: 3px;
        }
        #boss-hp-container {
            width: 100%; height: 16px; background: #100004; border: 2px solid #550015;
            border-radius: 8px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,0.8), 0 0 20px rgba(255,0,60,0.3);
            position: relative;
        }
        #boss-hp-bar {
            height: 100%; width: 100%; background: linear-gradient(90deg, #ff0044 0%, #ff5566 60%, #ffaa00 100%);
            box-shadow: 0 0 12px #ff0044; transition: width 0.15s ease-out;
        }
        #boss-hp-flash { position:absolute; top:0; left:0; height:100%; width:100%; background:#fff; opacity:0; transition: width 0.3s ease-out, opacity 0.3s ease-out 0.1s; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    <div id="vignette"></div>
    <div id="low-hp-vignette"></div>
    <div id="screen-flash"></div>

    <div id="ui-layer">
        <div id="top-bar" class="hidden">
            <div id="level-text">LVL 1</div>
            <div class="bar-container">
                <div id="exp-bar"></div>
                <div class="bar-text" id="exp-text">EXP 0 / 10</div>
            </div>
            <div class="bar-container">
                <div id="hp-bar"></div>
                <div class="bar-text" id="hp-text">HP 100 / 100</div>
            </div>
        </div>
        
        <div id="timer" class="hidden">00:00</div>
        <div id="boss-warning">ANOMALY DETECTED</div>

        <div id="boss-hp-wrap">
            <div id="boss-name">BOSS</div>
            <div id="boss-hp-container">
                <div id="boss-hp-bar"></div>
                <div id="boss-hp-flash"></div>
            </div>
        </div>
    </div>

    <div id="start-menu" class="overlay">
        <h1>Anime Survivors</h1>
        <p>Reach <strong>LEVEL 5</strong> to Awaken your weapons.<br>Reach <strong>LEVEL 10</strong> to unleash their true <strong>ULTIMATE</strong> forms.</p>
        <p style="color: #ccc; font-size: 1rem;">Desktop: WASD/Arrows to move.<br>Mobile: Touch and drag to move.</p>
        <button class="btn" id="start-btn">FIGHT!</button>
    </div>

    <div id="level-up-menu" class="overlay hidden">
        <h1 style="color: #00d2ff; text-shadow: 4px 4px 0px #005f99;">CHOOSE POWER</h1>
        <div id="upgrade-container"></div>
    </div>

    <div id="game-over-menu" class="overlay hidden">
        <h1 style="color: #ff3333; text-shadow: 4px 4px 0px #660000; font-size: 6rem;">DEFEATED</h1>
        <p id="survival-time" style="font-size: 1.5rem;">You survived for: 00:00</p>
        <button class="btn" id="restart-btn">TRY AGAIN</button>
    </div>

<script>
/**
 * ANIME SURVIVORS - Visually Remastered & Rebalanced
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const uiTopBar = document.getElementById('top-bar');
const expBar = document.getElementById('exp-bar');
const expText = document.getElementById('exp-text');
const hpBar = document.getElementById('hp-bar');
const hpText = document.getElementById('hp-text');
const levelText = document.getElementById('level-text');
const timerText = document.getElementById('timer');
const bossWarning = document.getElementById('boss-warning');
const screenFlashEl = document.getElementById('screen-flash');
const lowHpVignette = document.getElementById('low-hp-vignette');
const bossHpWrap = document.getElementById('boss-hp-wrap');
const bossNameEl = document.getElementById('boss-name');
const bossHpBar = document.getElementById('boss-hp-bar');
const bossHpFlash = document.getElementById('boss-hp-flash');

const startMenu = document.getElementById('start-menu');
const levelUpMenu = document.getElementById('level-up-menu');
const gameOverMenu = document.getElementById('game-over-menu');
const upgradeContainer = document.getElementById('upgrade-container');

let GAME_STATE = 'START'; 
let PREV_STATE = 'START';
let lastTime = 0;
let gameTime = 0; 
let spawnTimer = 0;
let screenShake = 0;

let globalTimeScale = 1.0; 
let bossMinuteCounter = 0;

let player;
let enemies = [];
let bosses = [];
let projectiles = [];
let dangerZones = []; 
let gems = [];
let particles = [];
let floatingTexts = [];
let cosmicDebris = []; 

let camera = { x: 0, y: 0 };
const keys = {};
let joystick = { active: false, startX: 0, startY: 0, currentX: 0, currentY: 0, dx: 0, dy: 0 };

const SoundEngine = {
    ctx: null,
    lastPickupTime: 0,
    lastHitTime: 0,
    lastShootTime: 0,
    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
    },
    playOsc(type, fStart, fEnd, dur, vStart=0.1) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(fStart, this.ctx.currentTime);
        if (fEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(1, fEnd), this.ctx.currentTime + dur);
        gain.gain.setValueAtTime(vStart, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + dur);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + dur);
    },
    playNoise(dur, vStart=0.1) {
        if (!this.ctx) return;
        const bufSize = this.ctx.sampleRate * dur;
        const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource(); noise.buffer = buf;
        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 1000;
        gain.gain.setValueAtTime(vStart, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + dur);
        noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
        noise.start();
    },
    pickup() {
        const now = Date.now(); if (now - this.lastPickupTime < 40) return;
        this.lastPickupTime = now; this.playOsc('sine', 800, 1200, 0.1, 0.02);
    },
    shoot() {
        const now = Date.now(); if (now - this.lastShootTime < 50) return;
        this.lastShootTime = now; this.playOsc('square', 400, 200, 0.1, 0.01);
    },
    heavyShoot() { this.playOsc('sawtooth', 300, 100, 0.2, 0.03); },
    ultimate() { this.playOsc('sawtooth', 150, 40, 1.5, 0.1); this.playNoise(1.5, 0.1); },
    hit() {
        const now = Date.now(); if (now - this.lastHitTime < 50) return;
        this.lastHitTime = now; this.playNoise(0.15, 0.03);
    },
    hurt() { this.playOsc('sawtooth', 200, 50, 0.4, 0.1); },
    levelUp() {
        setTimeout(() => this.playOsc('square', 440, 440, 0.1, 0.05), 0);
        setTimeout(() => this.playOsc('square', 554, 554, 0.1, 0.05), 100);
        setTimeout(() => this.playOsc('square', 659, 659, 0.1, 0.05), 200);
        setTimeout(() => this.playOsc('square', 880, 880, 0.4, 0.05), 300);
    },
    bossSpawn() {
        this.playOsc('square', 300, 600, 0.5, 0.05);
        setTimeout(() => this.playOsc('square', 600, 300, 0.5, 0.05), 500);
        setTimeout(() => this.playOsc('square', 300, 600, 0.5, 0.05), 1000);
    },
    timeStop() { this.playOsc('sine', 800, 20, 2.0, 0.1); this.playNoise(2.0, 0.05); }
};

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

function getDistSq(x1, y1, x2, y2) { return (x2 - x1)**2 + (y2 - y1)**2; }
function formatTime(seconds) {
    const m = Math.floor(seconds / 60).toString().padStart(2, '0');
    const s = Math.floor(seconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
}
function triggerShake(intensity) { screenShake = Math.max(screenShake, intensity); }

let impactFrameTimer = 0;
// Brief freeze-frame on big impacts, like an anime "impact frame" -- hard capped so a
// bug anywhere else in the code can never accidentally cause a long or runaway freeze.
function triggerImpactFrame(duration) { impactFrameTimer = Math.min(0.09, Math.max(impactFrameTimer, duration)); }

let flashTimeout = null;
function triggerFlash(color = '255,255,255', peakAlpha = 0.5) {
    screenFlashEl.style.background = `rgb(${color})`;
    screenFlashEl.style.transition = 'none';
    screenFlashEl.style.opacity = peakAlpha;
    requestAnimationFrame(() => {
        screenFlashEl.style.transition = 'opacity 0.35s ease-out';
        screenFlashEl.style.opacity = 0;
    });
}

// Inputs
window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
});
window.addEventListener('keyup', (e) => keys[e.code] = false);

canvas.addEventListener('touchstart', (e) => {
    if(GAME_STATE !== 'PLAYING') return; joystick.active = true;
    joystick.startX = e.touches[0].clientX; joystick.startY = e.touches[0].clientY;
    joystick.currentX = e.touches[0].clientX; joystick.currentY = e.touches[0].clientY; updateJoystickDelta();
});
canvas.addEventListener('touchmove', (e) => {
    if(!joystick.active || GAME_STATE !== 'PLAYING') return;
    joystick.currentX = e.touches[0].clientX; joystick.currentY = e.touches[0].clientY; updateJoystickDelta();
});
canvas.addEventListener('touchend', (e) => { joystick.active = false; joystick.dx = 0; joystick.dy = 0; });

function updateJoystickDelta() {
    const dx = joystick.currentX - joystick.startX; const dy = joystick.currentY - joystick.startY;
    const distance = Math.hypot(dx, dy); const maxDist = 50;
    if (distance > 0) { joystick.dx = (dx / distance) * Math.min(distance / maxDist, 1); joystick.dy = (dy / distance) * Math.min(distance / maxDist, 1); } 
    else { joystick.dx = 0; joystick.dy = 0; }
}

function findNearestEnemy(x, y) {
    let nearest = null; let minDistSq = Infinity;
    for(let i=0; i<bosses.length; i++) {
        let b = bosses[i];
        let dSq = getDistSq(x, y, b.x, b.y);
        if(dSq < minDistSq) { minDistSq = dSq; nearest = b; }
    }
    for(let i=0; i<enemies.length; i++) {
        let e = enemies[i];
        if (Math.abs(e.x - x) > 1200 || Math.abs(e.y - y) > 1200) continue;
        let dSq = getDistSq(x, y, e.x, e.y);
        if(dSq < minDistSq) { minDistSq = dSq; nearest = e; }
    }
    return nearest;
}

/**
 * WEAPONS DATA - 10 LEVELS (Awaken at 5, Ultimate at 10)
 */
const WEAPON_TYPES = {
    SPIRIT_BLAST: {
        id: 'SPIRIT_BLAST', name: 'Spirit Blast', icon: '☄️',
        desc: 'Auto-targeting blasts.<br><b>LVL 5:</b> Barrage.<br><b>LVL 10:</b> Final Flash beam.',
        baseCooldown: 1.2, baseDamage: 25, color: '#00d2ff',
        onFire: (wep, p) => {
            const target = findNearestEnemy(p.x, p.y);
            const baseAngle = target ? Math.atan2(target.y - p.y, target.x - p.x) : p.facingAngle;
            
            if (wep.level >= 10) {
                triggerShake(15); triggerImpactFrame(0.08); triggerFlash('255,255,100', 0.3);
                SoundEngine.ultimate();
                projectiles.push(new Projectile(p.x, p.y, baseAngle, 0, wep.damage * 0.5, 90, '#ffff00', 'hyper_beam', 9999, wep.level, p));
            } else if (wep.level >= 5) {
                SoundEngine.heavyShoot();
                for(let i=0; i < (10 + wep.level); i++) {
                    setTimeout(() => {
                        if (GAME_STATE !== 'PLAYING') return;
                        let angle = baseAngle + (Math.random() - 0.5) * 0.5;
                        projectiles.push(new Projectile(p.x, p.y, angle, 600 + Math.random()*300, wep.damage * 0.6, 15, '#ffd700', 'spirit_blast', 1, wep.level));
                    }, i * 25);
                }
            } else {
                SoundEngine.shoot();
                let count = wep.level >= 3 ? 2 : 1;
                let spread = 0.3; let startAngle = baseAngle - (spread * (count-1))/2;
                for(let i=0; i<count; i++) {
                    let angle = startAngle + (spread * i);
                    let pierce = 1 + Math.floor(wep.level/2);
                    projectiles.push(new Projectile(p.x, p.y, angle, 400 + (wep.level * 40), wep.damage, 10 + (wep.level*2), wep.color, 'spirit_blast', pierce, wep.level));
                }
            }
        }
    },
    REAPER_SLASH: {
        id: 'REAPER_SLASH', name: 'Reaper Slash', icon: '🌙',
        desc: 'Piercing wave.<br><b>LVL 5:</b> Judgement Cut.<br><b>LVL 10:</b> Mugetsu wave.',
        baseCooldown: 2.0, baseDamage: 40, color: '#c0182b',
        onFire: (wep, p) => {
            const target = findNearestEnemy(p.x, p.y);
            let angle = target ? Math.atan2(target.y - p.y, target.x - p.x) : p.facingAngle;

            if (wep.level >= 10) {
                triggerShake(20); triggerImpactFrame(0.09); triggerFlash('255,255,255', 0.35);
                SoundEngine.ultimate();
                // A brief black pulse right after the white slash-flash -- "a massive veil of
                // black Reiatsu erupts upward, darkening the sky" per canon Mugetsu.
                setTimeout(() => { if (GAME_STATE === 'PLAYING') triggerFlash('0,0,0', 0.5); }, 130);
                // Eruption burst at the swing: pale shockwave rings + void debris hurled out
                createShockwave(p.x, p.y, '#e9eeff', 340, 0.45);
                setTimeout(() => { if (GAME_STATE === 'PLAYING') createShockwave(p.x, p.y, '#e9eeff', 520, 0.5); }, 90);
                createShards(p.x, p.y, '#11121a', 14);
                createSparks(p.x, p.y, '#dfe6ff', 16, 1.3);
                // A colossal wall of black reiatsu erupting outward from the swing.
                projectiles.push(new Projectile(p.x, p.y, angle, 0, wep.damage * 2.2, 130, '#000', 'mugetsu', 9999, wep.level));
            } else if (wep.level >= 5) {
                SoundEngine.heavyShoot();
                let targets = enemies.concat(bosses).slice(0, 4 + wep.level); 
                targets.forEach((t, i) => {
                    setTimeout(() => {
                        if (GAME_STATE !== 'PLAYING') return;
                        projectiles.push(new Projectile(t.x, t.y, 0, 0, wep.damage * 1.2, 50 + (wep.level*4), '#000', 'judgement_cut', 9999, wep.level));
                        triggerShake(2);
                    }, i * 50);
                });
                for(let i=0; i<3; i++) {
                    setTimeout(() => {
                        if (GAME_STATE !== 'PLAYING') return;
                        let a = Math.random()*Math.PI*2; let dist = Math.random()*150;
                        projectiles.push(new Projectile(p.x + Math.cos(a)*dist, p.y + Math.sin(a)*dist, 0, 0, wep.damage, 60, '#000', 'judgement_cut', 9999, wep.level));
                    }, 250 + i * 50);
                }
            } else {
                SoundEngine.shoot();
                // Launch burst -- energy shedding backward off the swing
                for (let i = 0; i < 6; i++) {
                    createGlow(p.x, p.y, i % 2 ? wep.color : '#000', 1, { angle: angle + Math.PI + (Math.random()-0.5)*1.4, speed: 90 + Math.random()*110, life: 0.22, radius: 2 + Math.random()*3 });
                }
                createSparks(p.x, p.y, wep.color, 4, 0.8);
                projectiles.push(new Projectile(p.x, p.y, angle, 300 + (wep.level * 20), wep.damage, 50 + (wep.level * 10), wep.color, 'reaper_slash', 9999, wep.level));
            }
        }
    },
    TRUTH_ORBS: {
        id: 'TRUTH_ORBS', name: 'Truth Orbs', icon: '⚫',
        desc: 'Orbiting spheres.<br><b>LVL 5:</b> Fast Void spin.<br><b>LVL 10:</b> Planetary Devastation.',
        baseCooldown: 8.0, baseDamage: 18, color: '#111', 
        levelUpLogic: (wep) => {
            wep.orbCount = wep.level < 10 ? wep.level : 6; 
            if(!wep.orbitals) wep.orbitals = [];
            if(wep.orbitAngle === undefined) wep.orbitAngle = 0;
            while(wep.orbitals.length < wep.orbCount) { wep.orbitals.push({ history: [] }); }
        },
        update: (wep, p, dt) => {
            if(!wep.orbitals) return;
            let speedMulti = wep.level >= 5 ? 8 : 2 + (wep.level * 0.5); 
            let radius = wep.level >= 5 ? 100 : 70 + (wep.level * 5); 

            // One shared rotation for the whole group -- each orb's slot is purely a fixed
            // offset from it, so the balls always stay evenly spaced no matter when each
            // one was added (previously each orb tracked its own independent angle that
            // started accumulating whenever it was created, so orbs added at different
            // weapon levels drifted out of sync with each other).
            wep.orbitAngle = (wep.orbitAngle || 0) + speedMulti * dt * globalTimeScale;

            wep.orbitals.forEach((orb, idx) => {
                let targetBase = (Math.PI*2 / wep.orbCount) * idx;
                const ox = p.x + Math.cos(wep.orbitAngle + targetBase) * radius;
                const oy = p.y + Math.sin(wep.orbitAngle + targetBase) * radius;
                
                orb.history.push({x: ox, y: oy});
                if(orb.history.length > (wep.level>=5 ? 15 : 10)) orb.history.shift();

                let allMobs = enemies.concat(bosses);
                for(let i=allMobs.length-1; i>=0; i--) {
                    let e = allMobs[i];
                    if (Math.abs(ox - e.x) > 100 || Math.abs(oy - e.y) > 100) continue;
                    if(getDistSq(ox, oy, e.x, e.y) < (e.radius + 20)**2) {
                        if(!e.hitByOrbTimer) e.hitByOrbTimer = 0;
                        if(e.hitByOrbTimer <= 0) {
                            createSparks(ox, oy, '#fff', 3, 0.5);
                            if(e.takeDamage(wep.damage)) {
                                if(e instanceof Enemy && !(e instanceof Boss)) enemies.splice(enemies.indexOf(e), 1);
                                else if(e instanceof Boss) bosses.splice(bosses.indexOf(e), 1);
                            }
                            e.hitByOrbTimer = wep.level >= 5 ? 0.15 : 0.4; 
                        }
                    }
                }
            });
        },
        onFire: (wep, p) => {
            if (wep.level >= 10) {
                const target = findNearestEnemy(p.x, p.y) || p;
                triggerImpactFrame(0.08); triggerFlash('138,43,226', 0.3); triggerShake(10);
                SoundEngine.ultimate();
                projectiles.push(new Projectile(target.x, target.y, 0, 0, wep.damage * 3, 160, '#000', 'chibaku', 9999, wep.level));
            }
        },
        draw: (wep, p) => {
            if(!wep.orbitals) return;
            wep.orbitals.forEach(orb => {
                if(orb.history.length > 1) {
                    // Fading black trail with a white contour edge, matching the orb itself
                    for (let i = 0; i < orb.history.length - 1; i++) {
                        let h0 = orb.history[i], h1 = orb.history[i+1];
                        let t = i / orb.history.length;
                        ctx.globalAlpha = t * 0.5;
                        ctx.strokeStyle = '#111';
                        ctx.lineWidth = (wep.level >= 5 ? 20 : 13) * t; ctx.lineCap = 'round';
                        ctx.beginPath(); ctx.moveTo(h0.x, h0.y); ctx.lineTo(h1.x, h1.y); ctx.stroke();
                    }
                    ctx.globalAlpha = 1;
                    ctx.beginPath(); ctx.moveTo(orb.history[0].x, orb.history[0].y);
                    for(let i=1; i<orb.history.length; i++) ctx.lineTo(orb.history[i].x, orb.history[i].y);
                    ctx.strokeStyle = `rgba(255,255,255,0.75)`; ctx.lineWidth = 4; ctx.stroke();
                }
                let current = orb.history[orb.history.length-1];
                if(current) {
                    let r = wep.level >= 5 ? 20 : 15;
                    ctx.save(); ctx.translate(current.x, current.y);
                    // Solid matte-black sphere -- the Truth-Seeking Ball itself
                    let grd = ctx.createRadialGradient(-r*0.3, -r*0.3, 1, 0, 0, r);
                    grd.addColorStop(0, '#333'); grd.addColorStop(1, '#000');
                    ctx.fillStyle = grd;
                    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
                    // Iconic white swirl contour line dividing the sphere
                    ctx.save(); ctx.rotate(wep.orbitAngle * (wep.level >= 5 ? 2.2 : 1));
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = wep.level >= 5 ? 3 : 2.5;
                    ctx.beginPath();
                    ctx.moveTo(0, -r);
                    ctx.quadraticCurveTo(r*0.65, -r*0.5, 0, 0);
                    ctx.quadraticCurveTo(-r*0.65, r*0.5, 0, r);
                    ctx.stroke();
                    ctx.restore();
                    // Thin white rim
                    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.5;
                    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.stroke();
                    // Subtle dark chakra shimmer at max level -- accent, not a full recolor
                    if (wep.level >= 10) drawBloom(r * 1.7, 'rgba(80,40,120,0.3)');
                    ctx.restore();
                }
            });
        }
    },
    CURSED_PURPLE: {
        id: 'CURSED_PURPLE', name: 'Cursed Purple', icon: '🟣',
        desc: 'Devastating vortex.<br><b>LVL 5:</b> Piercing Hollow Orb.<br><b>LVL 10:</b> Domain Expansion.',
        baseCooldown: 5.2, baseDamage: 95, color: '#8a2be2',
        onFire: (wep, p) => {
            const target = findNearestEnemy(p.x, p.y);
            if (wep.level >= 10) {
                // Domain Expansion gets its own fixed, much longer cooldown -- the shared
                // per-level formula worked out to ~1.2s at max level, far too often for a
                // battlefield-freezing ultimate.
                wep.cooldownMax = 9.0;
                triggerShake(15); triggerImpactFrame(0.09); triggerFlash('138,43,226', 0.35);
                SoundEngine.ultimate();
                projectiles.push(new Projectile(p.x, p.y, 0, 0, wep.damage * 0.15, 400, '#fff', 'domain', 9999, wep.level, p));
            } else if (wep.level >= 5 && target) {

            } else {

            }

    },
    GUM_GATLING: {
        id: 'GUM_GATLING', name: 'Gum Gatling', icon: '👊',
        desc: 'Barrage of punches.<br><b>LVL 5:</b> Red Roc fists.<br><b>LVL 10:</b> Bajrang Gun drop.',
        baseCooldown: 1.5, baseDamage: 12, color: '#f39c12',

            } else {

                const punchCount = wep.level >= 5 ? Math.min(10, 8 + Math.floor((wep.level - 5) / 2)) : 3 + (wep.level * 2); 
                for(let i=0; i<punchCount; i++) {

                    let d2 = new Projectile(p.x, p.y, 0, 0, wep.damage * 1.5, 50, '#ffcc00', 'dragon', 9999, wep.level, p);

    { id: 'SPIRIT_BLAST', type: 'weapon' }, { id: 'REAPER_SLASH', type: 'weapon' },

/**
 * CLASSES
 */

class Player {
    constructor(x, y) {
        this.x = x; this.y = y; this.radius = 16; this.speed = 220;
        this.maxHp = 100; this.hp = 100; this.level = 1; 
        this.exp = 0; this.maxExp = 15; 
        this.weapons = []; this.facingAngle = 0; this.godMode = false; this.pendingUpgrades = 0; 
        this.magnetRange = 100;
        this.auraPhase = 0;
        this.trail = []; this.trailTimer = 0; this.dustTimer = 0;
        this.bobPhase = 0; this.isMoving = false; this.stretch = 1; this.hurtTimer = 0;
        this.addWeapon('SPIRIT_BLAST');
    }

    addWeapon(weaponId) {
        let existing = this.weapons.find(w => w.id === weaponId);
        if (existing) {
            if(existing.level < 10) {
                existing.level++;
                existing.damage = Math.floor(existing.baseDamage * (1 + (existing.level - 1) * 0.3));
                existing.cooldownMax = existing.baseCooldown * Math.pow(0.85, existing.level - 1);
                if(existing.typeDef.levelUpLogic) existing.typeDef.levelUpLogic(existing);
            }
        } else {
            const def = WEAPON_TYPES[weaponId];
            const wep = {
                id: weaponId, typeDef: def, level: 1, baseDamage: def.baseDamage, baseCooldown: def.baseCooldown,
                damage: def.baseDamage, cooldownMax: def.baseCooldown, cooldown: def.baseCooldown, color: def.color
            };
            if(def.levelUpLogic) def.levelUpLogic(wep);
            this.weapons.push(wep);
        }
    }

    update(dt) {
        let adjDt = dt * globalTimeScale; 
        this.auraPhase += dt * 5;
        let dx = 0, dy = 0;
        if (joystick.active) { dx = joystick.dx; dy = joystick.dy; } 
        else {
            if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
            if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
            if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
        }

        this.isMoving = (dx !== 0 || dy !== 0);
        let targetStretch = this.isMoving ? 1.16 : 1.0;
        this.stretch += (targetStretch - this.stretch) * Math.min(1, dt * 12);

        if (this.isMoving) {
            const length = Math.hypot(dx, dy); dx /= length; dy /= length;
            this.facingAngle = Math.atan2(dy, dx);
            const speedMod = joystick.active ? Math.hypot(joystick.dx, joystick.dy) : 1;
            this.x += dx * this.speed * adjDt * speedMod; 
            this.y += dy * this.speed * adjDt * speedMod;
            this.bobPhase += adjDt * 13;

            if (globalTimeScale > 0) {
                // Afterimage trail
                this.trailTimer -= adjDt;
                if (this.trailTimer <= 0) {
                    this.trailTimer = 0.04;
                    this.trail.push({ x: this.x, y: this.y, angle: this.facingAngle, age: 0 });
                    if (this.trail.length > 7) this.trail.shift();
                }
                // Ground dust kicked up behind the player
                this.dustTimer -= adjDt;
                if (this.dustTimer <= 0) {
                    this.dustTimer = 0.07;
                    createDust(this.x - Math.cos(this.facingAngle) * 6, this.y + this.radius * 0.7, 'rgba(190,225,255,0.55)', 1);
                }
                // Trailing energy motes
                if (Math.random() < 0.55) {
                    createGlow(this.x - Math.cos(this.facingAngle) * this.radius * 0.5, this.y - Math.sin(this.facingAngle) * this.radius * 0.5,
                        this.godMode ? 'rgba(255,215,0,0.5)' : 'rgba(0,210,255,0.5)', 1, { speed: 6, life: 0.2, radius: 2 + Math.random() });
                }
            }
        } else {
            this.bobPhase += adjDt * 3.5;
        }

        // Age out and drop old afterimages
        for (let i = this.trail.length - 1; i >= 0; i--) {
            this.trail[i].age += adjDt;
            if (this.trail[i].age > 0.3) this.trail.splice(i, 1);
        }

        this.weapons.forEach(wep => {
            if(wep.typeDef.update) wep.typeDef.update(wep, this, adjDt);
            if(wep.typeDef.onFire) {
                wep.cooldown -= adjDt;
                if(wep.cooldown <= 0 && globalTimeScale > 0) {
                    wep.typeDef.onFire(wep, this); wep.cooldown = wep.cooldownMax;
                    createGlow(this.x, this.y, wep.color, wep.level >= 10 ? 14 : (wep.level >= 5 ? 8 : 5), { speed: 90, life: 0.22, radius: 3 });
                }
            }
        });
        // Magnetism
        let pRSq = this.magnetRange**2;
        for(let i = gems.length - 1; i >= 0; i--) {
            let g = gems[i];
            if (Math.abs(this.x - g.x) > this.magnetRange || Math.abs(this.y - g.y) > this.magnetRange) continue;
            let distSq = getDistSq(this.x, this.y, g.x, g.y);
            if (distSq < pRSq) {
                let angle = Math.atan2(this.y - g.y, this.x - g.x);
                g.x += Math.cos(angle) * 700 * adjDt; g.y += Math.sin(angle) * 700 * adjDt;
                if (distSq < (this.radius + g.radius)**2) { this.gainExp(g.value); gems.splice(i, 1); SoundEngine.pickup(); }
            }
        }
    }

    gainExp(amount) {
        if(globalTimeScale === 0) return; 
        this.exp += amount; let leveledUp = false;
        while(this.exp >= this.maxExp) {
            this.exp -= this.maxExp; this.level++; 
            this.maxExp = 15 + (this.level * 15); 
            this.pendingUpgrades++; leveledUp = true;
        }
        updateUI();
        if(leveledUp && GAME_STATE === 'PLAYING') {
            triggerLevelUp(); SoundEngine.levelUp();
            createShockwave(this.x, this.y, '#ffd700', 150, 0.5);
            createGlow(this.x, this.y, '#ffd700', 26, { speed: 150, life: 0.55, radius: 4 });
            triggerFlash('255,215,0', 0.32);
        }
    }

    takeDamage(amount) {
        if(this.godMode) return; 
        this.hp -= amount; createFloatingText(this.x, this.y - 20, Math.floor(amount), '#ff3333');
        createSparks(this.x, this.y, '#ff3333', 8);
        updateUI(); this.hurtTimer = 0.15; triggerShake(5); SoundEngine.hurt();
        // Throttled so a swarm of hits in the same instant can't strobe the screen
        const now = performance.now();
        if (!this.lastDamageFlash || now - this.lastDamageFlash > 220) {
            this.lastDamageFlash = now;
            triggerFlash('255,30,30', Math.min(0.3, 0.08 + amount / 200));
        }
        if (this.hp <= 0) triggerGameOver();
    }

    draw() {
        // Ground shadow (stays put, doesn't bob)
        ctx.save();
        ctx.beginPath(); ctx.ellipse(this.x, this.y + this.radius * 0.85, this.radius * (0.85 * this.stretch), this.radius * 0.32, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill();
        ctx.restore();

        // Afterimage trail (fades with age)
        for (let i = 0; i < this.trail.length; i++) {
            let t = this.trail[i];
            let a = Math.max(0, 1 - t.age / 0.3) * 0.22;
            if (a <= 0) continue;
            ctx.save(); ctx.globalAlpha = a; ctx.translate(t.x, t.y); ctx.rotate(t.angle);
            ctx.fillStyle = this.godMode ? '#f1c40f' : '#00d2ff';
            ctx.beginPath(); ctx.ellipse(0, 0, this.radius * 0.9, this.radius * 0.65, 0, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        let bobOffset = Math.sin(this.bobPhase) * (this.isMoving ? 2.4 : 1.1);
        ctx.save(); ctx.translate(this.x, this.y + bobOffset);

        // Ambient aura -- subtle always, stronger once transcendent (lvl>10) or god mode
        ctx.globalCompositeOperation = 'screen';
        let auraR = this.radius + 6 + Math.sin(this.auraPhase) * 3 + (this.level > 10 ? 7 : 0);
        let auraColor = this.godMode ? 'rgba(241,196,15,0.4)' : (this.level > 10 ? 'rgba(0,210,255,0.32)' : 'rgba(0,210,255,0.16)');
        ctx.beginPath(); ctx.arc(0, 0, auraR, 0, Math.PI * 2); ctx.fillStyle = auraColor; ctx.fill();
        ctx.globalCompositeOperation = 'source-over';

        // Body -- squashed/stretched along facing direction for a sense of motion
        let baseColor = this.godMode ? '#f1c40f' : '#00d2ff';
        if (this.hurtTimer > 0) { baseColor = '#ff3333'; this.hurtTimer -= 1 / 60; }
        ctx.save();
        ctx.rotate(this.facingAngle);
        ctx.scale(this.stretch, 1 / this.stretch);
        let grad = ctx.createRadialGradient(-this.radius * 0.3, -this.radius * 0.3, 1, 0, 0, this.radius * 1.1);
        grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.4, baseColor); grad.addColorStop(1, this.godMode ? '#8a6d00' : '#004b6e');
        ctx.shadowBlur = 16; ctx.shadowColor = baseColor;
        ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.fillStyle = grad; ctx.fill();
        ctx.shadowBlur = 0; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();

        // Facing chevron
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.moveTo(this.radius - 3, -6); ctx.lineTo(this.radius + 11, 0); ctx.lineTo(this.radius - 3, 6); ctx.closePath(); ctx.fill();
        ctx.restore();
        ctx.restore();

        this.weapons.forEach(wep => { if(wep.typeDef.draw) wep.typeDef.draw(wep, this); });
    }
}

class Enemy {
    constructor(x, y, hp, speed, color, radius) {
        this.x = x; this.y = y; this.hp = hp; this.maxHp = hp;
        this.speed = speed; this.color = color; this.radius = radius;
        this.damage = 10; this.hitByOrbTimer = 0; this.flashTimer = 0; this.wobble = Math.random() * Math.PI * 2;
        this.shape = Math.floor(Math.random() * 3); 
        this.history = [];
        this.moveAngle = 0; this.spawnGrow = 0; this.frozenTimer = 0;
    }

    update(dt) {
        let adjDt = dt * globalTimeScale; 
        if(adjDt === 0) return;

        if(this.hitByOrbTimer > 0) this.hitByOrbTimer -= adjDt;
        if(this.flashTimer > 0) this.flashTimer -= adjDt;
        if(this.spawnGrow < 1) this.spawnGrow = Math.min(1, this.spawnGrow + adjDt * 6);

        if (this.frozenTimer > 0) {
            this.frozenTimer -= adjDt;
            return; // paralyzed: no movement, no contact damage, no animation
        }

        this.wobble += adjDt * 5;

        let angle = Math.atan2(player.y - this.y, player.x - this.x);
        this.moveAngle = angle;
        this.x += Math.cos(angle) * this.speed * adjDt + Math.cos(this.wobble)*0.5;
        this.y += Math.sin(angle) * this.speed * adjDt + Math.sin(this.wobble)*0.5;

        // Trail history
        if (Math.random() < 0.3) {
            this.history.push({x: this.x, y: this.y});
            if(this.history.length > 3) this.history.shift();
        }

        if (Math.abs(this.x - player.x) < 50 && Math.abs(this.y - player.y) < 50) {
            if (getDistSq(this.x, this.y, player.x, player.y) < (this.radius + player.radius)**2) {
                player.takeDamage(this.damage); this.x -= Math.cos(angle) * 40; this.y -= Math.sin(angle) * 40;
            }
        }
        
        if (getDistSq(this.x, this.y, player.x, player.y) > (Math.max(canvas.width, canvas.height) + 400)**2) {
            let respawnAngle = Math.random() * Math.PI * 2; let respawnDistance = Math.max(canvas.width, canvas.height) / 2 + 100;
            this.x = player.x + Math.cos(respawnAngle) * respawnDistance; this.y = player.y + Math.sin(respawnAngle) * respawnDistance;
            this.history = [];
        }
    }

    takeDamage(amount) {
        this.hp -= amount; this.flashTimer = 0.1;
        createFloatingText(this.x, this.y - this.radius, Math.floor(amount), '#fff');
        let angle = Math.atan2(this.y - player.y, this.x - player.x);
        this.x += Math.cos(angle) * 5; this.y += Math.sin(angle) * 5;
        if (this.hp <= 0) { this.die(); return true; }
        return false;
    }

    die() {
        createParticles(this.x, this.y, this.color, Math.floor(this.radius/4)); 
        createShards(this.x, this.y, this.color, 4);
        createShockwave(this.x, this.y, this.color, this.radius * 2.2, 0.25);
        gems.push(new Gem(this.x, this.y, 1));
        SoundEngine.hit();
    }

    draw(camLeft, camRight, camTop, camBottom) {
        if(this.x < camLeft || this.x > camRight || this.y < camTop || this.y > camBottom) return;
        ctx.save(); 

        // Ground shadow
        ctx.beginPath(); ctx.ellipse(this.x, this.y + this.radius * 0.75, this.radius * 0.8, this.radius * 0.3, 0, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fill();
        
        // Draw trailing shadows (motion smear)
        ctx.globalAlpha = 0.25; ctx.fillStyle = this.color;
        this.history.forEach((h, i) => {
            ctx.beginPath();
            if (this.shape === 0) ctx.arc(h.x, h.y, this.radius * (i/3), 0, Math.PI * 2);
            else if (this.shape === 1) ctx.rect(h.x-this.radius, h.y-this.radius, this.radius*2, this.radius*2);
            else { ctx.moveTo(h.x, h.y-this.radius); ctx.lineTo(h.x+this.radius, h.y+this.radius); ctx.lineTo(h.x-this.radius, h.y+this.radius); }
            ctx.fill();
        });
        
        ctx.globalAlpha = 1.0;
        ctx.translate(this.x, this.y);
        let spawnScale = this.spawnGrow < 1 ? (0.4 + this.spawnGrow * 0.6) : 1;
        ctx.scale(spawnScale, spawnScale);
        if (this.frozenTimer > 0) { ctx.fillStyle = '#4a2f66'; ctx.shadowBlur = 10; ctx.shadowColor = '#b57bff'; }
        else if (this.flashTimer > 0) { ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 12; ctx.shadowColor = '#fff'; } 
        else { ctx.fillStyle = this.color; ctx.shadowBlur = 6; ctx.shadowColor = this.color; }
        
        ctx.beginPath(); ctx.scale(1 + Math.cos(this.wobble)*0.1, 1 + Math.sin(this.wobble)*0.1);
        if (this.shape === 0) { ctx.arc(0, 0, this.radius, 0, Math.PI * 2); } 
        else if (this.shape === 1) { ctx.roundRect(-this.radius, -this.radius, this.radius*2, this.radius*2, 4); } 
        else {
            ctx.rotate(this.moveAngle + Math.PI/2);
            ctx.moveTo(0, -this.radius); ctx.lineTo(this.radius, this.radius); ctx.lineTo(-this.radius, this.radius); ctx.closePath();
        }
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // Evil red eyes -- dimmed to a paralyzed purple glow while frozen
        ctx.fillStyle = this.frozenTimer > 0 ? '#e0c8ff' : '#ff0000';
        ctx.beginPath(); ctx.arc(-this.radius*0.3, -this.radius*0.2, this.radius*0.2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(this.radius*0.3, -this.radius*0.2, this.radius*0.2, 0, Math.PI*2); ctx.fill();
        
        ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();

        // Pulsing void-glyph ring around anything paralyzed by the domain
        if (this.frozenTimer > 0) {
            ctx.strokeStyle = `rgba(190,130,255,${0.5 + Math.sin(this.frozenTimer * 10) * 0.3})`;
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(0, 0, this.radius * 1.35, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.restore();
    }
}

class Boss extends Enemy {
    constructor(x, y, hp, speed, color, radius, name) {
        super(x, y, hp, speed, color, radius);
        this.name = name; this.maxHp = hp; this.attackTimer = 0;
        createFloatingText(this.x, this.y - 80, `BOSS: ${name}`, color);
        triggerFlash('255,0,60', 0.22);
    }
    get enraged() { return this.hp < this.maxHp * 0.3; }
    die() {
        createParticles(this.x, this.y, this.color, 50);
        createShards(this.x, this.y, this.color, 16);
        createShockwave(this.x, this.y, this.color, 240, 0.55);
        createShockwave(this.x, this.y, '#fff', 160, 0.4);
        triggerShake(22); triggerFlash('255,255,255', 0.55); triggerImpactFrame(0.09);
        gems.push(new Gem(this.x, this.y, 100 * (bossMinuteCounter || 1)));
        SoundEngine.ultimate();
    }
    // Shared ground shadow + enrage aura, called by subclasses in world space before translating
    drawBossFX() {
        ctx.beginPath(); ctx.ellipse(this.x, this.y + this.radius * 0.8, this.radius * 0.9, this.radius * 0.35, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fill();
        if (this.enraged) {
            ctx.save(); ctx.globalCompositeOperation = 'screen';
            let r = this.radius + 16 + Math.sin(this.wobble * 2) * 6;
            ctx.beginPath(); ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,20,20,0.28)'; ctx.fill();
            ctx.restore();
        }
        if (this.frozenTimer > 0) {
            ctx.save(); ctx.globalCompositeOperation = 'screen';
            ctx.beginPath(); ctx.arc(this.x, this.y, this.radius * 1.1, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(150,90,230,0.35)'; ctx.fill();
            ctx.restore();
            ctx.strokeStyle = `rgba(190,130,255,${0.5 + Math.sin(this.frozenTimer * 10) * 0.3})`;
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.radius * 1.3, 0, Math.PI * 2); ctx.stroke();
        }
    }
}

class FriezaBoss extends Boss {

    update(dt) {
        let adjDt = dt * globalTimeScale; if(adjDt === 0) return;
        super.update(dt); if (this.frozenTimer > 0) return;
        this.attackTimer += adjDt;
        // Longer, honest windup so the sight-line gives a real dodge window
        let windup = this.enraged ? 0.55 : 0.75;
        if (!this.charging && this.attackTimer > this.chargeTime - windup) {
            this.charging = true;
            // Aim is LOCKED the moment charging begins -- it no longer tracks the player
            // all the way up to the shot, which is what made the beam unavoidable.
            this.beamAngle = Math.atan2(player.y - this.y, player.x - this.x);
        }
        if (this.charging && Math.random() < 0.5) createSparks(this.x, this.y, '#ff00ff', 1, 0.4);
        if (this.attackTimer > this.chargeTime) {
            this.attackTimer = 0; this.charging = false;
            triggerShake(6); createGlow(this.x, this.y, '#ff00ff', 10, { speed: 60, life: 0.3, radius: 4 });
            projectiles.push(new Projectile(this.x, this.y, this.beamAngle, 1200, 20, 10, '#ff00ff', 'death_beam', 1, 1, this));

            ctx.save(); ctx.globalAlpha = 0.45 + chargeProgress*0.25 + Math.sin(this.wobble * 6) * 0.15;
            ctx.strokeStyle = '#ff00ff'; ctx.lineWidth = 2; ctx.setLineDash([10, 8]);
            ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.x + Math.cos(this.beamAngle) * 1400, this.y + Math.sin(this.beamAngle) * 1400); ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();
        }
        let r = this.radius; let bob = Math.sin(this.wobble) * 3;
        ctx.save(); ctx.translate(this.x, this.y + bob);
        let sq = 1 + Math.cos(this.wobble)*0.04;
        ctx.scale(sq, 1/sq);
        if (this.enraged) { ctx.shadowBlur = 22; ctx.shadowColor = '#ff0000'; }

        ctx.strokeStyle = '#6b2fa3'; ctx.lineWidth = r*0.22; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(r*0.3, r*0.5);
        ctx.quadraticCurveTo(r*1.6, r*0.8 + Math.sin(this.wobble*0.7)*8, r*1.3, r*1.8 + Math.sin(this.wobble*0.7)*10);
        ctx.stroke();
        ctx.fillStyle = '#6b2fa3'; ctx.beginPath();
        let tx = r*1.3, ty = r*1.8 + Math.sin(this.wobble*0.7)*10;
        ctx.moveTo(tx, ty-8); ctx.lineTo(tx+16, ty+6); ctx.lineTo(tx-2, ty+14); ctx.closePath(); ctx.fill();
        ctx.restore();

        // Torso -- hourglass silhouette
        let torsoGrad = ctx.createLinearGradient(0, r*0.2, 0, r*1.3);
        torsoGrad.addColorStop(0, '#9d6fd1'); torsoGrad.addColorStop(1, '#5a2d8c');
        ctx.fillStyle = torsoGrad;
        ctx.beginPath();
        ctx.moveTo(-r*0.55, r*0.25); ctx.quadraticCurveTo(-r*0.15, r*0.55, -r*0.4, r*1.1);
        ctx.quadraticCurveTo(0, r*1.35, r*0.4, r*1.1);
        ctx.quadraticCurveTo(r*0.15, r*0.55, r*0.55, r*0.25);
        ctx.closePath(); ctx.fill();

        // Shoulder pauldrons
        ctx.fillStyle = '#c9a8ec';
        ctx.beginPath(); ctx.ellipse(-r*0.62, r*0.15, r*0.32, r*0.22, -0.3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(r*0.62, r*0.15, r*0.32, r*0.22, 0.3, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#4b2570'; ctx.lineWidth = 2;
        ctx.stroke();

        // Neck spike collar
        ctx.fillStyle = '#5a2d8c';
        for (let i = -3; i <= 3; i++) {
            let a = i * 0.22;
            ctx.save(); ctx.rotate(a); ctx.translate(0, -r*0.05);
            ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(5, 0); ctx.lineTo(0, -r*0.32); ctx.closePath(); ctx.fill();
            ctx.restore();
        }

        ctx.shadowBlur = this.enraged ? 22 : 0; ctx.shadowColor = '#ff0000';
        // Head -- elongated dome

        headGrad.addColorStop(0, '#ffffff'); headGrad.addColorStop(0.55, this.flashTimer > 0 ? '#ffffff' : '#e8e8f5'); headGrad.addColorStop(1, '#b9b9d0');
        ctx.fillStyle = headGrad;
        ctx.beginPath();
        ctx.moveTo(-r*0.55, -r*0.1);
        ctx.quadraticCurveTo(-r*0.7, -r*0.85, 0, -r*0.95);
        ctx.quadraticCurveTo(r*0.7, -r*0.85, r*0.55, -r*0.1);
        ctx.quadraticCurveTo(r*0.3, r*0.15, 0, r*0.18);
        ctx.quadraticCurveTo(-r*0.3, r*0.15, -r*0.55, -r*0.1);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#8888a0'; ctx.lineWidth = 1.5; ctx.stroke();
