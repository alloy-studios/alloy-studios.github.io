<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
/* Alloy Studios home check - keep this the FIRST script in <head>. */
(function () {
  var GAME = "nitro-pitch";                                 // this game's id on the site
  var h = location.hostname;
  var home = h === "alloy-studios.github.io" || h === "localhost" || h === "127.0.0.1" || location.protocol === "file:";
  var stranger = false;
  try { stranger = window.top !== window.self && window.top.location.hostname !== h; }
  catch (e) { stranger = true; }                             // can't read the parent: someone else's page
  if (home && !stranger) return;
  var url = "https://alloy-studios.github.io/" + GAME + "/";
  document.documentElement.innerHTML =
    '<head><meta charset="utf-8"><title>Alloy Studios</title></head>' +
    '<body style="margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;' +
    'background:#0b0d14;color:#eef1f7;font:16px/1.5 system-ui,sans-serif;text-align:center">' +
    '<div><p style="margin:0 0 10px;font-size:22px;font-weight:700">This game is by Alloy Studios</p>' +
    '<p style="margin:0 0 24px;color:#9aa3b8">You’re playing an unofficial copy. The real one is free.</p>' +
    '<a href="' + url + '" target="_top" rel="noopener" style="display:inline-block;padding:11px 22px;' +
    'border-radius:999px;background:#7c5cff;color:#fff;text-decoration:none;font-weight:600">' +
    'Play it at alloy-studios.github.io</a></div></body>';
  if (window.stop) window.stop();                            // stop the rest of the page loading
  throw new Error("Alloy Studios: not on the home site");
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Nitro Pitch</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0e1a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; background: #0a0e1a; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, #16223f 0%, #0a0e1a 70%);
          color: #eef1f7; font: italic 800 16px/1.2 system-ui, "Segoe UI", sans-serif; transition: opacity .4s; }
  #load .box { width: min(440px, 80vw); text-align: center; }
  #load .title { font-size: clamp(34px, 7vw, 60px); letter-spacing: .02em; margin-bottom: 4px; }
  #load .title span { background: linear-gradient(90deg, #2f7bff, #ff7a1a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #load .sub { font-style: normal; font-weight: 600; color: #8e9abf; font-size: 13px; letter-spacing: .16em; margin-bottom: 26px; }
  #load .bar { height: 8px; border-radius: 99px; background: #1b2440; overflow: hidden; }
  #load .fill { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #2f7bff, #ff7a1a); transition: width .2s; }
  #load .hint { margin-top: 14px; font-style: normal; font-weight: 500; color: #6f7a9c; font-size: 13px; }
  #err { display: none; margin-top: 18px; font-style: normal; font-weight: 500; color: #ff8a7a; font-size: 14px; }
</style>
</head>
<body>
<canvas id="game" tabindex="-1"></canvas>
<div id="load"><div class="box">
  <div class="title">NITRO <span>PITCH</span></div>
  <div class="sub">ROCKET-POWERED CAR SOCCER</div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="hint">Click the game once it loads to use the keyboard. Controllers work too.</div>
  <div id="err"></div>
</div></div>
<script>
  var canvas = document.getElementById("game");
  var fill = document.getElementById("fill");
  var load = document.getElementById("load");
  var buildUrl = "Build";
  var config = {
    dataUrl: buildUrl + "/1cdd17142ce314bb13213b49ea652388.data.unityweb",
    frameworkUrl: buildUrl + "/67819c1dd52700e34ba3298342a7f27f.framework.js.unityweb",
    codeUrl: buildUrl + "/cac26afa3472f2884850ffb4d6a945c5.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "NitroPitch",
    productName: "Nitro Pitch",
    productVersion: "0.1.0",
    // Render at CSS pixel size: high-DPI canvases cost far more GPU time than they add on laptops.
    devicePixelRatio: 1,
    // Settings and loadout (PlayerPrefs) sync to IndexedDB on every write.
    autoSyncPersistentDataPath: true,
  };
  canvas.addEventListener("pointerdown", function () { canvas.focus(); });
  var script = document.createElement("script");
  script.src = buildUrl + "/9c7a7558b20ecd1ca35d5aa1067d6ed0.loader.js";
  script.onload = function () {
    createUnityInstance(canvas, config, function (p) { fill.style.width = (100 * p) + "%"; })
      .then(function () { load.style.opacity = 0; setTimeout(function () { load.remove(); }, 450); canvas.focus(); })
      .catch(function (m) { var e = document.getElementById("err"); e.style.display = "block"; e.textContent = "Couldn't start the game: " + m; });
  };
  document.body.appendChild(script);
</script>
</body>
</html>
