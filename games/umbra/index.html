<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UMBRA — a duel of shadows</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none}
  canvas{display:block;position:fixed;inset:0;cursor:default}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* =======================================================================
   U M B R A  —  a duel of shadows
   Single-file browser fighter. Every fighter is a silhouette with one colour.
   ======================================================================= */

/* ---------------- math ---------------- */
const TAU=Math.PI*2,PI=Math.PI;
const rnd=(a=1,b=0)=>b+Math.random()*(a-b), rint=n=>0|(Math.random()*n), pick=a=>a[rint(a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, sgn=v=>v<0?-1:1;
const hash=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);};
const seg01=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const E={
  l:t=>t,
  i:t=>t*t*t, o:t=>1-Math.pow(1-t,3), io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  i2:t=>t*t, o2:t=>1-(1-t)*(1-t), s:t=>1-Math.pow(1-t,5), ss:t=>t*t*(3-2*t),
  b:t=>{const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);},
  el:t=>t===0||t===1?t:Math.pow(2,-10*t)*Math.sin((t*10-.75)*TAU/3)+1,
};
const ez=(n)=>typeof n==='function'?n:(E[n]||E.io);
/* keyframed scalar track: keys [[t,v,ease],...] (ease applies to the segment ending at that key) */
function tk(t,keys){
  if(t<=keys[0][0])return keys[0][1];
  for(let i=1;i<keys.length;i++){const b=keys[i];if(t<=b[0]){const a=keys[i-1];return lerp(a[1],b[1],ez(b[2])((t-a[0])/(b[0]-a[0]||1)));}}
  return keys[keys.length-1][1];
}
const rot2=(x,y,a)=>[x*Math.cos(a)-y*Math.sin(a),x*Math.sin(a)+y*Math.cos(a)];
const add2=(p,v,k)=>[p[0]+v[0]*(k===undefined?1:k),p[1]+v[1]*(k===undefined?1:k)];
const lerp2=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t)];
const dirA=a=>[Math.sin(a),Math.cos(a)];            // pose angle (0=down, +forward) -> vector
const dist2=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);

/* ---------------- colour ---------------- */
function hx(h){
  if(h[0]!=='#'){const m=h.match(/\d+(\.\d+)?/g);return[+m[0],+m[1],+m[2]];}
  h=h.slice(1);if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
const h2=v=>{v=clamp(Math.round(v),0,255);return(v<16?'0':'')+v.toString(16);};
function mixC(a,b,k){const A=hx(a),B=hx(b);return'#'+h2(A[0]+(B[0]-A[0])*k)+h2(A[1]+(B[1]-A[1])*k)+h2(A[2]+(B[2]-A[2])*k);}
const _rgb=new Map();
function rgba(c,a){let v=_rgb.get(c);if(!v){v=hx(c);_rgb.set(c,v);}return`rgba(${v[0]},${v[1]},${v[2]},${a})`;}

/* ---------------- game-time scheduler (pauses with hitstop, menus, cinematics) ---------------- */
const timers=[];
function later(s,fn){timers.push({t:s,fn});}
function tickTimers(dt){for(let i=timers.length-1;i>=0;i--){const q=timers[i];q.t-=dt;if(q.t<=0){timers.splice(i,1);q.fn();}}}

/* =======================================================================
   SKELETON + POSES + CLIPS
   Pose angles: 0 = straight down, + = toward the facing direction.
   aF/aB = [shoulder, elbow, wrist] (in the chest frame)   lF/lB = [hip, knee, foot]
   Knees flex backward (<=0), elbows forward (>=0). y pushes the hips down (crouch).
   ======================================================================= */
const SK={THIGH:44,SHIN:44,ANK:6,SP1:22,SP2:28,NECK:9,HR:11,UA:31,FA:29,HAND:9,HIP:92};
const _PKEYS=['x','y','lean','ch','hd','pt'],_ANG=['rot','wa','wb'];
function P(o){return Object.assign({x:0,y:0,lean:0,ch:0,hd:0,rot:0,wa:0,wb:0,wl:1,pt:0,gF:0,gB:0,
  aF:[.3,.4,0],aB:[.2,.45,0],lF:[-.15,-.1,0],lB:[.15,-.2,0]},o);}
/* two-bone IK in the pose convention, knee pointing forward */
function ik2(hx,hy,tx,ty,a,b){
  const dx=tx-hx,dy=ty-hy,d=clamp(Math.hypot(dx,dy),Math.abs(a-b)+.01,(a+b)*.9995);
  const phi=Math.atan2(dx,dy),al=Math.acos(clamp((a*a+d*d-b*b)/(2*a*d),-1,1)),th=phi+al;
  const kx=hx+Math.sin(th)*a,ky=hy+Math.cos(th)*a;return[th,Math.atan2(tx-kx,ty-ky)-th];
}
/* author grounded poses by where the feet stand: fx=[frontX,backX] */
function SP(o){
  const p=P(o);
  if(o.fx){const hy=-SK.HIP+p.y,ay=-SK.ANK,x0=p.x||0,fy=o.fy||[0,0];
    const f=ik2(x0+4.5,hy,o.fx[0],ay-fy[0],SK.THIGH,SK.SHIN),b=ik2(x0-4.5,hy,o.fx[1],ay-fy[1],SK.THIGH,SK.SHIN);
    p.lF=[f[0],f[1],p.lF[2]];p.lB=[b[0],b[1],p.lB[2]];}
  return p;
}
function copyPose(p){const o=Object.assign({},p);o.aF=p.aF.slice();o.aB=p.aB.slice();o.lF=p.lF.slice();o.lB=p.lB.slice();return o;}
function mixPose(a,b,t){
  const o={};
  for(const k of _PKEYS)o[k]=lerp(a[k]||0,b[k]||0,t);
  // angles that spin (weapon, whole body) take the short way unless a key steps > 1.25 half-turns
  for(const k of _ANG){const A=a[k]||0;let d=(b[k]||0)-A;while(d>3.93)d-=TAU;while(d<-3.93)d+=TAU;o[k]=A+d*t;}
  for(const k of['aF','aB','lF','lB']){const A=a[k],B=b[k];o[k]=[lerp(A[0],B[0],t),lerp(A[1],B[1],t),lerp(A[2]||0,B[2]||0,t)];}
  o.wl=lerp(a.wl===undefined?1:a.wl,b.wl===undefined?1:b.wl,t);
  const d=t<.5?a:b;o.gF=d.gF;o.gB=d.gB;
  return o;
}
function withP(p,ov){return Object.assign(copyPose(p),ov);}

/* ---------------- skeleton ---------------- */
function skel(po,S,gw,plant){
  const K={S};gw=gw||1;
  const hy=(-SK.HIP+po.y)*S,hx=(po.x||0)*S;
  const le=po.lean,l2=le+po.ch;
  K.hip=[hx,hy];K.le=le;K.lt=l2;
  K.waist=add2(K.hip,[Math.sin(le),-Math.cos(le)],SK.SP1*S);
  K.chest=add2(K.waist,[Math.sin(l2),-Math.cos(l2)],SK.SP2*S);
  K.fw=[Math.cos(l2),Math.sin(l2)];K.up=[Math.sin(l2),-Math.cos(l2)];
  K.neck=add2(K.chest,K.up,3*S);
  K.ha=l2+po.hd;
  K.head=add2(K.neck,[Math.sin(K.ha),-Math.cos(K.ha)],(SK.NECK+SK.HR*.55)*S);
  const shF=add2(add2(K.chest,K.fw,2*S*gw),K.up,-4*S),shB=add2(add2(K.chest,K.fw,-4.5*S*gw),K.up,-3.5*S);
  const arm=(sp,a)=>{const A1=a[0]-l2,e=add2(sp,dirA(A1),SK.UA*S),A2=A1+a[1],w=add2(e,dirA(A2),SK.FA*S),A3=A2+(a[2]||0),h=add2(w,dirA(A3),SK.HAND*S);
    return{s:sp,e,w,h,A1,A2,A3};};
  K.aF=arm(shF,po.aF);K.aB=arm(shB,po.aB);
  const leg=(hj,l)=>{const k=add2(hj,dirA(l[0]),SK.THIGH*S),A2=l[0]+l[1],a=add2(k,dirA(A2),SK.SHIN*S);return{h:hj,k,a,A1:l[0],A2,f:l[2]||0,plant:0};};
  const hjF=[hx+4.5*S*gw,hy+1.5*S],hjB=[hx-4.5*S*gw,hy];
  K.lF=leg(hjF,po.lF);K.lB=leg(hjB,po.lB);
  if(plant&&Math.abs(po.rot||0)<.2){
    for(const L of[K.lF,K.lB]){const gy=-SK.ANK*S;
      if(L.a[1]>gy-12*S){const r=ik2(L.h[0],L.h[1],L.a[0],gy,SK.THIGH*S,SK.SHIN*S);
        L.A1=r[0];L.A2=r[0]+r[1];L.k=add2(L.h,dirA(L.A1),SK.THIGH*S);L.a=add2(L.k,dirA(L.A2),SK.SHIN*S);L.plant=1;}}
  }
  // foot: flat when planted, otherwise perpendicular to the shin and pointed by pt
  for(const L of[K.lF,K.lB]){L.fa=L.plant?0:(-L.A2+lerp(.2,1.25,po.pt||0))+L.f;
    L.toe=add2(L.a,[Math.cos(L.fa),Math.sin(L.fa)],15*S);L.heel=add2(L.a,[Math.cos(L.fa),Math.sin(L.fa)],-4*S);}
  return K;
}

/* ---------------- clips ----------------
   clip: {d, k:[[t,pose|name,ease],...], rm:[[t,dx,dy?,ease]...] root motion (units, facing space)}
   ease on a key shapes the segment arriving at that key.                         */
let POSEFN=null;          // resolver for named poses (set by the pose library)
function clipPose(clip,t,f){
  const K=clip.k,rp=v=>typeof v==='string'?POSEFN(v,f):v;
  if(t<=K[0][0])return rp(K[0][1]);
  for(let i=1;i<K.length;i++){const b=K[i];if(t<=b[0]){const a=K[i-1];
    return mixPose(rp(a[1]),rp(b[1]),ez(b[2]||'io')((t-a[0])/((b[0]-a[0])||1)));}}
  return rp(K[K.length-1][1]);
}
function clipRoot(clip,t){
  if(!clip.rm)return[0,0];const R=clip.rm;
  if(t<=R[0][0])return[R[0][1],R[0][2]||0];
  for(let i=1;i<R.length;i++){const b=R[i];if(t<=b[0]){const a=R[i-1],u=ez(b[3]||'io')((t-a[0])/((b[0]-a[0])||1));
    return[lerp(a[1],b[1],u),lerp(a[2]||0,b[2]||0,u)];}}
  const e=R[R.length-1];return[e[1],e[2]||0];
}

/* =======================================================================
   POSE LIBRARY — silhouettes read through negative space, so every stance
   keeps limbs off the torso and the weapon clear of the body.
   Weapon angles (wa/wb) are absolute: 0 down, PI/2 forward, PI up.
   ======================================================================= */
const SD={
 blade   :{fx:[28,-26],y:18,lean:.36,ch:.12,hd:.3,aF:[.62,.55,.2],aB:[-.25,.4,.2],wa:1.3,gB:1},
 assassin:{fx:[24,-28],y:22,lean:.42,ch:.1,hd:.05,aF:[1.1,1.6,-.2],aB:[.7,1.8,-.3],wa:-.45,wb:-.8},
 heavy   :{fx:[30,-30],y:14,lean:.15,ch:.05,hd:.1,aF:[.55,.75,0],aB:[.9,1.1,0],wa:-2.72},
 monk    :{fx:[30,-30],y:20,lean:.1,ch:-.05,hd:0,aF:[1.35,.35,.15],aB:[.35,2.2,0],gF:2,gB:0},
 caster  :{fx:[14,-16],y:4,lean:-.04,hd:-.05,aF:[.5,.45,-.15],aB:[.9,1.9,-.3],wa:2.1,gB:1},
 reaper  :{fx:[16,-18],y:6,lean:.16,ch:.08,hd:.2,aF:[.95,1.15,0],aB:[.45,1.3,0],wa:2.55,gB:1},
 boxer   :{fx:[24,-24],y:14,lean:.22,ch:.12,hd:.2,aF:[1.0,2.1,0],aB:[.85,2.2,0]},
 lancer  :{fx:[28,-30],y:18,lean:.2,ch:.05,hd:.05,aF:[1.2,.35,-.2],aB:[.55,1.25,-.1],wa:1.62},
};
const STANCE={};for(const k in SD)STANCE[k]=SP(SD[k]);
/* airborne base (no feet on the ground) */
const AIR={y:-6,lean:.15,lF:[1.2,-1.9,0],lB:[.3,-1.4,0],pt:.9};
/* Q: a pose from a base (stance name, 'air', or raw def) with overrides.
   Arm angles given here are ABSOLUTE (0 = hanging, PI/2 = pointing forward);
   kF/kB set a kicking leg directly instead of planting it.                  */
function Q(base,o){
  const b=Object.assign({},base==='air'?AIR:typeof base==='string'?SD[base]:base);
  const r=Object.assign(b,o),l2=(r.lean||0)+(r.ch||0);
  if(o.aF)r.aF=[o.aF[0]+l2,o.aF[1],o.aF[2]||0];
  if(o.aB)r.aB=[o.aB[0]+l2,o.aB[1],o.aB[2]||0];
  if(base==='air'||(typeof base==='object'&&!b.fx&&!o.fx))delete r.fx;
  const p=SP(r);
  if(o.kF)p.lF=o.kF.slice();if(o.kB)p.lB=o.kB.slice();
  return p;
}
const POSE={
 idle  :SP({fx:[14,-14],y:3}),
 crouch:SP({fx:[26,-24],y:40,lean:.35,ch:.15,hd:-.1,aF:[1.2,1.6,0],aB:[.9,1.8,0]}),
 crouchB:SP({fx:[24,-26],y:40,lean:.2,ch:.1,hd:.1,aF:[1.9,1.9,.2],aB:[1.6,2.0,0],gF:1}),
 block : SP({fx:[20,-22],y:12,lean:-.12,ch:-.05,hd:.15,aF:[1.9,2.1,.2],aB:[1.7,2.2,0],gF:1}),
 prejump:SP({fx:[18,-18],y:26,lean:.35,aF:[-.8,.6,0],aB:[-.9,.5,0]}),
 jump  : P({y:-6,lean:.12,aF:[-1.4,.7,0],aB:[-1.7,.6,0],lF:[1.2,-2.1,0],lB:[.35,-1.4,0],pt:.9}),
 fall  : P({y:-2,lean:-.02,aF:[-2.2,.5,0],aB:[-2.5,.4,0],lF:[.5,-.8,0],lB:[-.3,-.6,0],pt:.7}),
 land  : SP({fx:[24,-22],y:30,lean:.35,aF:[-.6,.8,0],aB:[.6,1.0,0]}),
 dashF : P({y:6,lean:.55,ch:.1,hd:-.3,aF:[-1.3,.5,0],aB:[-1.6,.4,0],lF:[1.3,-1.0,0],lB:[-.95,-1.2,0],pt:.6}),
 dashB : P({y:-6,lean:-.3,hd:.2,aF:[.9,1.2,0],aB:[1.2,1.0,0],lF:[.6,-1.5,0],lB:[.2,-1.2,0],pt:.9}),
 hurtH : P({y:4,lean:-.45,ch:-.25,hd:-.6,aF:[-.8,.8,0],aB:[-1.2,.6,0],lF:[.35,-.3,0],lB:[-.25,-.4,0],gF:1,gB:1}),
 hurtM : SP({fx:[10,-24],y:18,lean:.7,ch:.3,hd:.5,aF:[.2,1.1,0],aB:[.6,1.3,0],gF:1,gB:1}),
 hurtL : SP({fx:[8,-18],y:12,lean:-.2,hd:.2,aF:[-.6,.7,0],aB:[-.9,.6,0],gF:1,gB:1}),
 tumble: P({lean:-.8,ch:-.3,hd:-.5,aF:[-2.6,.4,0],aB:[-.5,.8,0],lF:[-.3,-1.0,0],lB:[.9,-.4,0],gF:1,gB:1,pt:.8}),
 down  : P({rot:-1.52,y:78,hd:.25,aF:[-2.7,.3,0],aB:[-3,.2,0],lF:[.2,-.3,0],lB:[.05,-.2,0],gF:1,gB:1,pt:.7}),
 kneel : SP({fx:[26,-30],y:44,lean:.45,hd:-.1,aF:[.4,.6,0],aB:[.9,1.0,0],gF:1}),
 tuck  : P({y:-14,lean:.35,ch:.25,hd:.35,aF:[1.0,1.9,0],aB:[.8,2.0,0],lF:[2.1,-2.5,0],lB:[1.8,-2.4,0],pt:.8}),
 recover:P({y:-4,lean:.3,aF:[-1.2,.4,0],aB:[1.7,.5,0],lF:[1.0,-2.0,0],lB:[.4,-1.8,0],pt:.8}),
 thrown: P({rot:-2.4,y:10,lean:-.4,aF:[-2.8,.3,0],aB:[-2,.4,0],lF:[.6,-.4,0],lB:[-.4,-.8,0],gF:1,gB:1}),
 grab  : SP({fx:[26,-24],y:14,lean:.4,aF:[1.55,.25,0],aB:[1.35,.5,0],gF:1,gB:1}),
 taunt : SP({fx:[12,-12],y:2,lean:-.08,hd:-.25,aF:[-.3,.2,0],aB:[.2,.3,0]}),
};
/* defensive arm/weapon overlays per stance (applied to block + crouch-block) */
const BLK={
 blade   :{aF:[1.2,1.9,0],aB:[.9,2.0,0],wa:3.05},
 assassin:{aF:[1.2,2.1,0],aB:[1.0,2.3,0],wa:2.6,wb:3.5},
 heavy   :{aF:[1.25,1.35,0],aB:[.95,1.55,0],wa:3.0},
 monk    :{},
 caster  :{aF:[1.25,.95,0],aB:[1.0,1.5,0],wa:3.0},
 reaper  :{aF:[1.25,1.1,0],aB:[.9,1.6,0],wa:3.1},
 boxer   :{aF:[1.35,2.55,0],aB:[1.15,2.6,0]},
 lancer  :{aF:[1.2,1.2,0],aB:[.95,1.6,0],wa:3.05},
};
/* victory poses (per fighter), absolute weapon angles */
const WIN={
 ashen  :SP({fx:[12,-14],y:4,lean:.18,hd:.4,aF:[.25,.1,0],aB:[.1,.2,0],wa:-1.3}),
 vex    :SP({fx:[10,-12],y:2,lean:-.05,hd:-.1,aF:[-.2,2.5,.3],aB:[.3,.4,0],wa:-.15,wb:.45}),
 goliath:SP({fx:[26,-26],y:6,lean:-.1,hd:-.3,aF:[-2.8,.25,0],aB:[.6,1.5,0],wa:-2.45}),
 sol    :SP({fx:[4,-6],y:2,lean:0,hd:.25,aF:[1.2,1.9,.3],aB:[1.2,1.9,.3],gF:2,gB:2}),
 morrow :SP({fx:[10,-12],y:2,lean:-.1,hd:-.2,aF:[.4,.3,0],aB:[-2.5,.4,0],wa:2.2,gB:1}),
 grim   :SP({fx:[12,-14],y:2,lean:.05,hd:.35,aF:[.4,.6,0],aB:[.1,.3,0],wa:3.3,gB:1}),
 bolt   :SP({fx:[14,-14],y:2,lean:-.05,hd:-.2,aF:[-2.9,.3,0],aB:[.6,1.8,0]}),
 rin    :SP({fx:[10,-8],y:0,lean:-.05,hd:-.15,aF:[.1,.2,0],aB:[.9,1.9,0],wa:1.85}),
};
/* per-fighter pose sets: generic poses keep the fighter's stance grip on the weapon */
const _A3=(p,a)=>p[a][0]-(p.lean+p.ch)+p[a][1]+(p[a][2]||0);
function poseSet(ch){
  if(ch._poses)return ch._poses;
  const st=STANCE[ch.stance],gF=_A3(st,'aF')-st.wa,gB=_A3(st,'aB')-(st.wb||0),out={stance:st,win:WIN[ch.id]||st};
  for(const k in POSE){const p=copyPose(POSE[k]);p.wa=_A3(p,'aF')-gF;p.wb=_A3(p,'aB')-gB;out[k]=p;}
  const cr=SP(Object.assign({},SD[ch.stance],{fx:[26,-24],y:40,lean:.35,ch:.15,hd:-.1}));out.crouch=cr;
  const bo=BLK[ch.stance]||{};
  for(const k of['block','crouchB']){const b=POSE[k],l2=b.lean+b.ch,p=copyPose(out[k]);
    if(bo.aF)p.aF=[bo.aF[0]+l2,bo.aF[1],bo.aF[2]];if(bo.aB)p.aB=[bo.aB[0]+l2,bo.aB[1],bo.aB[2]];
    if(bo.wa!==undefined)p.wa=bo.wa;if(bo.wb!==undefined)p.wb=bo.wb;
    if(ch.wep!=='none'&&ch.wep!=='gauntlets')p.gF=3;out[k]=p;}
  ch._poses=out;return out;
}
POSEFN=(n,f)=>{const s=poseSet(f.ch);return s[n]||s.stance;};

/* =======================================================================
   ROSTER — eight shadows. Each is pure black with exactly one colour.
   Silhouette identity comes from shape: hair, headgear, cloth and weapon.
   ======================================================================= */
const ROSTER=[
 {id:'ashen',name:'ASHEN',title:'The Crimson Revenant',col:'#ff2436',
  h:1.07,w:.94,hair:'wild',coat:1,collar:1,eyes:'demon',wep:'odachi',stance:'blade',move:'stalk',stage:'dusk',
  hp:1000,spd:1,pow:1.08,
  bio:'Died on a burning battlefield. Something else got up.'},
 {id:'vex',name:'VEX',title:'Blade of the Silent Moon',col:'#2ee6ff',
  h:.95,w:.86,fem:1,hair:'ponytail',scarf:1,eyes:'slit',wep:'daggers',stance:'assassin',move:'run',stage:'bamboo',
  hp:900,spd:1.18,pow:.9,
  bio:'An assassin who never misses — and never once has been seen.'},
 {id:'goliath',name:'GOLIATH',title:'Forgeborn Juggernaut',col:'#ff7418',

/* =======================================================================
   SILHOUETTE RENDERER
   Bodies are ink-black. Far limbs are a hair lighter for depth. The one
   accent colour is drawn separately into the glow layer (eyes, edges,
   energy) so it can bloom without lifting the blacks.
   Coordinates: feet at (0,0), facing +x, up is -y.
   ======================================================================= */
const INK='#040407',INKF='#0e0e16';
let RS=null;
/* ---- path primitives ---- */
function segPath(c,A,B,w0,wm,w1,mt){
  mt=mt===undefined?.38:mt;
  const ax=A[0],ay=A[1],bx=B[0],by=B[1],dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy)||1e-3;
  const nx=-dy/L,ny=dx/L,an=Math.atan2(ny,nx),mx=ax+dx*mt,my=ay+dy*mt;
  const c1x=2*(mx+nx*wm)-(ax+nx*w0+bx+nx*w1)/2,c1y=2*(my+ny*wm)-(ay+ny*w0+by+ny*w1)/2;
  const c2x=2*(mx-nx*wm)-(ax-nx*w0+bx-nx*w1)/2,c2y=2*(my-ny*wm)-(ay-ny*w0+by-ny*w1)/2;
  c.moveTo(ax+nx*w0,ay+ny*w0);c.quadraticCurveTo(c1x,c1y,bx+nx*w1,by+ny*w1);
  c.arc(bx,by,w1,an,an-PI,true);c.quadraticCurveTo(c2x,c2y,ax-nx*w0,ay-ny*w0);c.arc(ax,ay,w0,an+PI,an,true);c.closePath();
}
function smoothTo(c,pts,move){
  const n=pts.length;if(move)c.moveTo(pts[0][0],pts[0][1]);else c.lineTo(pts[0][0],pts[0][1]);
  for(let i=1;i<n-1;i++)c.quadraticCurveTo(pts[i][0],pts[i][1],(pts[i][0]+pts[i+1][0])/2,(pts[i][1]+pts[i+1][1])/2);
  c.lineTo(pts[n-1][0],pts[n-1][1]);
}
function tubePath(c,P,Wd,round){
  const n=P.length,A=[],B=[];
  for(let i=0;i<n;i++){const a=P[Math.max(0,i-1)],b=P[Math.min(n-1,i+1)];
    let dx=b[0]-a[0],dy=b[1]-a[1];const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
    const w=Wd[i];A.push([P[i][0]-dy*w,P[i][1]+dx*w]);B.push([P[i][0]+dy*w,P[i][1]-dx*w]);}
  smoothTo(c,A,true);
  if(round){const e=P[n-1];c.arc(e[0],e[1],Math.max(.01,Wd[n-1]),Math.atan2(A[n-1][1]-e[1],A[n-1][0]-e[0]),Math.atan2(B[n-1][1]-e[1],B[n-1][0]-e[0]),true);}
  smoothTo(c,B.reverse(),false);c.closePath();
}
function fp(c,path,col){c.beginPath();path(c);c.fillStyle=col||RS.ink;c.fill();}
/* glow layer: accent draws happen in the same transform on the glow context */
function glow(fn){
  if(RS.lite)return;
  const g=RS.g,c=RS.c;
  if(g===c){c.save();c.globalCompositeOperation='lighter';fn(c);c.restore();return;}
  g.save();g.setTransform(c.getTransform());fn(g);g.restore();
}

/* ---- the body ---- */
function TP(x,y){const {S,K,gw}=RS;          // torso space: x forward, y up (negative) from the hip
  if(y>=-SK.SP1){const r=rot2(x*S*gw,y*S,K.le);return[K.hip[0]+r[0],K.hip[1]+r[1]];}
  const r=rot2(x*S*gw,(y+SK.SP1)*S,K.lt);return[K.waist[0]+r[0],K.waist[1]+r[1]];}
function torsoPath(c){
  const f=RS.ch.fem;
  const B=f?[[-12,6],[-13.5,-6],[-9,-20],[-11,-34],[-12,-44],[-8,-51],[-4,-53.5]]
           :[[-11,6],[-12.5,-6],[-11,-19],[-13,-32],[-15.5,-43],[-12,-50],[-5.5,-54]];
  const F=f?[[3,-54],[9,-51],[13,-45],[15,-38],[14,-33],[9.5,-28],[8.5,-20],[11,-8],[11.5,4],[1,9]]
           :[[4,-55],[11,-51.5],[16,-45],[16.5,-37],[12.5,-29],[11,-20],[12,-8],[11,4],[1,9]];
  smoothTo(c,B.map(p=>TP(p[0],p[1])),true);smoothTo(c,F.map(p=>TP(p[0],p[1])),false);c.closePath();
}
function handPath(c,h,A3,shape,k){
  c.save();c.translate(h[0],h[1]);c.rotate(PI/2-A3);c.beginPath();
  if(shape===1){                        // open hand, fingers spread
    c.moveTo(-3*k,-3.4*k);c.lineTo(4*k,-4.2*k);c.lineTo(10.5*k,-4*k);c.lineTo(10.8*k,-2.6*k);c.lineTo(6*k,-2*k);
    c.lineTo(11.5*k,-1*k);c.lineTo(11.5*k,.6*k);c.lineTo(6*k,.6*k);c.lineTo(10.5*k,2.4*k);c.lineTo(10*k,3.6*k);c.lineTo(4*k,3*k);
    c.lineTo(-3*k,3.2*k);c.closePath();c.moveTo(2*k,-3.6*k);c.lineTo(6*k,-7*k);c.lineTo(7.4*k,-6*k);c.lineTo(4.4*k,-2.6*k);c.closePath();
  } else if(shape===2){                 // blade hand
    c.moveTo(-3*k,-3*k);c.quadraticCurveTo(6*k,-3.8*k,12*k,-1.6*k);c.lineTo(12*k,1*k);c.quadraticCurveTo(5*k,3.4*k,-3*k,3*k);c.closePath();
  } else {                              // fist / grip
    c.moveTo(-3*k,-3.6*k);c.quadraticCurveTo(4*k,-5*k,8.4*k,-3.6*k);c.quadraticCurveTo(10*k,0,8.4*k,3.8*k);
    c.quadraticCurveTo(3*k,5*k,-3*k,3.4*k);c.closePath();
  }
  c.fillStyle=RS.col;c.fill();c.restore();
}
function footPath(c,L,k){
  c.save();c.translate(L.a[0],L.a[1]);c.rotate(L.fa);c.beginPath();
  c.moveTo(-4*k,-4.5*k);c.lineTo(-5.5*k,2*k);c.quadraticCurveTo(-5.5*k,SK.ANK*k,-2*k,SK.ANK*k);
  c.lineTo(13*k,SK.ANK*k);c.quadraticCurveTo(18*k,SK.ANK*k,17*k,2.5*k);c.quadraticCurveTo(14*k,-1*k,8*k,-2.2*k);c.lineTo(3.5*k,-4.8*k);c.closePath();
  c.fillStyle=RS.col;c.fill();c.restore();
}
function drawLeg(c,L,far){
  const {S,ch}=RS,g=RS.gw*(ch.fem?.94:1),loose=ch.loose;
  RS.col=far?RS.far:RS.ink;
  const tw=loose?1.3:1;
  fp(c,cc=>segPath(cc,L.h,L.k,10*S*g*tw,10.8*S*g*tw,7.4*S*g*(loose?1.35:1),.3),RS.col);
  fp(c,cc=>segPath(cc,L.k,L.a,7.4*S*g*(loose?1.35:1),7.2*S*g*(loose?1.5:1),4.4*S*g*(loose?1.6:1),.3),RS.col);
  footPath(c,L,S*Math.min(1.12,g));
}
function drawArm(c,A,far,shape){
  const {S,ch}=RS,g=RS.gw*(ch.fem?.9:1),bulk=ch.wep==='gauntlets';
  RS.col=far?RS.far:RS.ink;
  fp(c,cc=>segPath(cc,A.s,A.e,7.4*S*g,7.6*S*g,5.3*S*g,.22),RS.col);
  fp(c,cc=>segPath(cc,A.e,A.w,5.3*S*g,(bulk?8.2:5.9)*S*g,(bulk?7.4:4.1)*S*g,.35),RS.col);
  if(ch.flare){const d=dirA(A.A2),n=[-d[1],d[0]],b=lerp2(A.e,A.w,1);    // wide witch sleeve
    fp(c,cc=>{cc.moveTo(A.e[0]+n[0]*5*S,A.e[1]+n[1]*5*S);cc.quadraticCurveTo(b[0]+n[0]*12*S,b[1]+n[1]*12*S+6*S,b[0]+n[0]*14*S+d[0]*4*S,b[1]+n[1]*14*S+10*S);
      cc.lineTo(b[0]-n[0]*8*S,b[1]-n[1]*8*S+4*S);cc.lineTo(A.e[0]-n[0]*5*S,A.e[1]-n[1]*5*S);cc.closePath();},RS.col);}
  handPath(c,A.w,A.A3,shape,S*g*(bulk?1.35:1));
}
function headPath(c,r,fem){
  c.moveTo(-.95*r,.35*r);c.arc(0,-.02*r,r,2.78,5.95,false);
  c.quadraticCurveTo(.99*r,.02*r,.97*r,.2*r);c.quadraticCurveTo(1.05*r,.34*r,1.09*r,.46*r);   // brow, nose
  c.lineTo(.98*r,.52*r);c.quadraticCurveTo(1.0*r,.64*r,.94*r,.74*r);
  if(fem)c.quadraticCurveTo(.82*r,.98*r,.56*r,1.0*r);else c.quadraticCurveTo(.9*r,1.02*r,.6*r,1.06*r);
  c.quadraticCurveTo(.2*r,.96*r,-.2*r,.66*r);c.quadraticCurveTo(-.6*r,.58*r,-.95*r,.35*r);c.closePath();
}

/* ---- cloth: verlet chains in the fighter's own space; body motion arrives as air drag ---- */
function chain(key,anchor,n,seg,env){
  const st=RS.opt.cloth,S=RS.S,t=RS.t;
  if(!st){const out=[];for(let i=0;i<n;i++)out.push([anchor[0]-i*seg*(env.back||.4)+Math.sin(t*1.9+i*.6+key.length)*i*seg*.06,anchor[1]+i*seg*.88-(env.lift||0)*i*seg]);return out;}
  let C=st[key];
  if(!C||C.p.length!==n||Math.abs(C.p[0][0]-anchor[0])>80*S||Math.abs(C.p[0][1]-anchor[1])>80*S){
    C=st[key]={p:[]};for(let i=0;i<n;i++){const x=anchor[0]-i*seg*.4,y=anchor[1]+i*seg*.88;C.p.push([x,y,x,y]);}}
  const P=C.p,dt=Math.min(RS.dt||0,1/30);
  if(dt>0){const g=(env.g||1100)*S,dr=env.drag||2.4,vx=RS.opt.vx||0,vy=RS.opt.vy||0,dm=env.damp||.96;
    for(let i=1;i<n;i++){const q=P[i],px=(q[0]-q[2])/dt,py=(q[1]-q[3])/dt;
      const ax=-(vx+px)*dr-(env.bias||60)*S+Math.sin(t*(env.fq||5)+i*.9+key.length)*(env.wind||120)*S*i/n;
      const ay=g-(vy+py)*dr*.6;
      const nx=q[0]+(q[0]-q[2])*dm+ax*dt*dt,ny=q[1]+(q[1]-q[3])*dm+ay*dt*dt;q[2]=q[0];q[3]=q[1];q[0]=nx;q[1]=ny;}}
  P[0][0]=P[0][2]=anchor[0];P[0][1]=P[0][3]=anchor[1];
  for(let it=0;it<4;it++){
    for(let i=1;i<n;i++){const a=P[i-1],b=P[i],dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy)||1e-4,df=(d-seg)/d;
      if(i===1){b[0]-=dx*df;b[1]-=dy*df;}else{a[0]+=dx*df*.5;a[1]+=dy*df*.5;b[0]-=dx*df*.5;b[1]-=dy*df*.5;}}
    if(env.maxX!==undefined)for(let i=1;i<n;i++){const lim=env.maxX+i*(env.slope||0);if(P[i][0]>lim)P[i][0]=lim;}
    for(let i=1;i<n;i++)if(P[i][1]>-.5*S)P[i][1]=-.5*S;
  }
  return P.map(q=>[q[0],q[1]]);
}
function headPt(x,y){const {K,S}=RS,r=SK.HR*S;const p=rot2(x*r,y*r,K.ha);return[K.head[0]+p[0],K.head[1]+p[1]];}
function ragged(c,P,Wd,teeth){                  // ribbon whose far end is torn into points
  const n=P.length,e=P[n-1],p2=P[n-2],d=[e[0]-p2[0],e[1]-p2[1]],L=Math.hypot(d[0],d[1])||1,nx=-d[1]/L,ny=d[0]/L,w=Wd[n-1];
  c.beginPath();for(let i=0;i<=teeth*2;i++){const u=i/(teeth*2)*2-1,k=i%2?1:.1;c.lineTo(e[0]+nx*w*u+d[0]/L*k*RS.S*12,e[1]+ny*w*u+d[1]/L*k*RS.S*12);}
  c.closePath();c.fillStyle=RS.ink;c.fill();
}
function drawBackCloth(c){
  const {ch,S,K}=RS;
  if(ch.coat||ch.cloak){                        // long coat / cloak hanging from the shoulders
    const an=TP(-9,-50),n=ch.cloak?7:6,seg=(ch.cloak?15:13)*S;
    const P=chain('coat',an,n,seg,{g:1150,drag:2.2,bias:80,wind:ch.cloak?200:130,maxX:an[0]+4*S,slope:-.4*S,back:.45});
    const Wd=P.map((_,i)=>lerp(8,ch.cloak?19:15,i/(n-1))*S);
    fp(c,cc=>tubePath(cc,P,Wd));ragged(c,P,Wd,ch.cloak?5:3);
  }
  const H=ch.hair;
  if(H==='wild'){                               // mane of long wild hair
    const an=headPt(-.6,-.1),P=chain('mane',an,6,9*S,{g:900,drag:2.6,bias:120,wind:160,back:.7,lift:.12});
    const Wd=P.map((_,i)=>lerp(10,2,i/5)*S);fp(c,cc=>tubePath(cc,P,Wd,1));
    const P2=chain('mane2',headPt(-.3,-.6),5,8*S,{g:700,drag:2.6,bias:140,wind:200,back:.8,lift:.3});
    fp(c,cc=>tubePath(cc,P2,P2.map((_,i)=>lerp(7,1,i/4)*S),1));
  }
  if(H==='ponytail'){const an=headPt(-.55,-.75),P=chain('tail',an,6,8*S,{g:1000,drag:2.8,bias:90,wind:120,back:.6,lift:.25});
    fp(c,cc=>tubePath(cc,P,P.map((_,i)=>lerp(5.5,1.5,i/5)*S*(i===1?1.3:1)),1));}
  if(H==='long'){const an=headPt(-.7,.2),P=chain('long',an,7,9*S,{g:1200,drag:3,bias:70,wind:80,back:.3});
    fp(c,cc=>tubePath(cc,P,P.map((_,i)=>lerp(10,2,Math.pow(i/6,1.2))*S),1));}
  if(H==='twintails'){for(const[k,x,y]of[['twA',-.7,-.55],['twB',-.2,-.85]]){
      const P=chain(k,headPt(x,y),7,8.5*S,{g:1100,drag:2.6,bias:80,wind:140,back:.4});
      fp(c,cc=>tubePath(cc,P,P.map((_,i)=>lerp(5,1.5,i/6)*S*(i===1?1.25:1)),1),k==='twA'?RS.ink:RS.far);}}
  if(ch.scarf){const an=TP(-5,-55),P=chain('scarf',an,8,9*S,{g:500,drag:2.2,bias:260,wind:420,fq:9,back:.8,lift:.15});
    fp(c,cc=>tubePath(cc,P,P.map((_,i)=>lerp(4.5,3,i/7)*S)));ragged(c,P,P.map(()=>3*S),2);}
  if(ch.sash){const an=TP(-10,-2),P=chain('sash',an,5,9*S,{g:900,drag:2.4,bias:120,wind:180,back:.5});
    fp(c,cc=>tubePath(cc,P,P.map((_,i)=>lerp(3.5,2.6,i/4)*S)));}
  if(ch.wraps){for(const[k,A]of[['wrF',K.aF],['wrB',K.aB]]){const P=chain(k,lerp2(A.w,A.e,.15),4,6*S,{g:600,drag:2.2,bias:200,wind:300,fq:11,back:.7});
    fp(c,cc=>tubePath(cc,P,P.map((_,i)=>lerp(2.4,1.2,i/3)*S)));}}
}
function drawSkirt(c){
  const {ch,S,K}=RS;
  if(ch.robe){                                  // floor-length robe whose hem follows both feet
    const L=K.lB,F=K.lF,hB=add2(L.a,[-6*S,-2*S]),hF=add2(F.a,[8*S,-2*S]),wl=TP(-14,-6),wr=TP(13,-6);
    fp(c,cc=>{cc.moveTo(wl[0],wl[1]);cc.quadraticCurveTo(L.k[0]-10*S,L.k[1],hB[0]-4*S,hB[1]);
      for(let i=0;i<=8;i++){const q=lerp2(hB,hF,i/8);cc.lineTo(q[0],q[1]+(i%2?-5:2)*S+Math.sin(RS.t*4+i)*1.4*S);}
      cc.quadraticCurveTo(F.k[0]+10*S,F.k[1],wr[0],wr[1]);cc.closePath();});
  }
  if(ch.skirt){const wl=TP(-13,-4),wr=TP(12.5,-4),kB=lerp2(K.lB.h,K.lB.k,.55),kF=lerp2(K.lF.h,K.lF.k,.55);
    fp(c,cc=>{cc.moveTo(wl[0],wl[1]);cc.lineTo(kB[0]-10*S,kB[1]+4*S);for(let i=0;i<=5;i++){const q=lerp2([kB[0]-10*S,kB[1]+4*S],[kF[0]+10*S,kF[1]+4*S],i/5);cc.lineTo(q[0],q[1]+(i%2?-4:1)*S);}
      cc.lineTo(wr[0],wr[1]);cc.closePath();});}
}
function drawHeadgear(c,r){

      s.forEach((p,i)=>{let a=p[0];if(p[1]>1.2)a-=.2+(RS.opt.sway||0)*.3;const x=Math.cos(a)*p[1]*r,y=Math.sin(a)*p[1]*r;i?cc.lineTo(x,y):cc.moveTo(x,y);});cc.closePath();});}

      s.forEach((p,i)=>{const x=Math.cos(p[0])*p[1]*r,y=Math.sin(p[0])*p[1]*r;i?cc.lineTo(x,y):cc.moveTo(x,y);});cc.closePath();});}

    fp(c,cc=>{cc.moveTo(-1.02*r,.55*r);cc.arc(0,-.06*r,1.1*r,2.65,-.5,false);cc.lineTo(1.08*r,-.05*r);cc.lineTo(.86*r,-.22*r);

    for(const[s,fx]of[[1,0],[-1,1]])fp(c,cc=>{const bx=(fx?-.55:.35)*r,by=-.75*r;
      cc.moveTo(bx-.3*r,by+.2*r);cc.quadraticCurveTo(bx-1.2*r,by-.6*r,bx-.6*r,by-1.9*r);cc.quadraticCurveTo(bx-.7*r,by-1.0*r,bx+.3*r,by+.1*r);cc.closePath();},fx?RS.far:RS.ink);

function drawHead(c){
  const {ch,S,K}=RS,r=SK.HR*S*(ch.helm?1.12:1);
  fp(c,cc=>segPath(cc,add2(K.neck,K.up,-5*S),add2(K.head,dirA(K.ha),.5*r),5.6*S*RS.gw,5.4*S*RS.gw,5*S*RS.gw));

  const ex=ch.hood?[.62,.98]:[.5,.9],ey=ch.hood?.18:.12;

    if(type==='void'){for(const[x,s]of[[.5,1],[.9,.72]]){g.beginPath();g.ellipse(x*r,ey*r,.14*r*s,.1*r,0,0,TAU);g.fill();}return;}
    const len=type==='demon'?.52:.38,tilt=type==='calm'?.0:.34;

      g.lineTo((x+len*s*.4)*r,(ey+tilt*.12+.12)*r);g.lineTo((x-len*s*.45)*r,(ey-tilt*.12+.09)*r);g.closePath();g.fill();}
  });

    fp(c,cc=>{cc.moveTo(7*k,-2.6*k);cc.quadraticCurveTo(22*k,-5*k,34*k,-1*k);cc.quadraticCurveTo(22*k,1*k,7*k,2.4*k);cc.closePath();},ink);
    edge(g=>{g.lineWidth=1.8*k;g.beginPath();g.moveTo(8*k,-2.8*k);g.quadraticCurveTo(22*k,-5.2*k,33*k,-1.2*k);g.stroke();},1);
  } else if(w==='hammer'){

    edge(g=>{g.lineWidth=2*k;g.lineJoin='round';g.beginPath();g.moveTo(56*k,-18*k);g.lineTo(66*k,-6*k);g.lineTo(62*k,4*k);g.lineTo(74*k,16*k);
      g.moveTo(80*k,-20*k);g.lineTo(74*k,-4*k);g.lineTo(84*k,6*k);g.stroke();g.globalAlpha*=.8;g.drawImage(glowSprite(col),50*k,-26*k,44*k,52*k);},1.2);
  } else if(w==='staff'){
    fp(c,cc=>{cc.moveTo(-40*k,-2.4*k);cc.quadraticCurveTo(20*k,-5*k,96*k,-2*k);cc.lineTo(96*k,2.6*k);cc.quadraticCurveTo(20*k,0,-40*k,2.4*k);cc.closePath();},ink);
    fp(c,cc=>{for(const s of[-1,1]){cc.moveTo(94*k,s*1*k);cc.quadraticCurveTo(104*k,s*14*k,114*k,s*6*k);cc.quadraticCurveTo(106*k,s*6*k,98*k,s*1.4*k);}},ink);
    glow(g=>{const R=(9+hot*5+Math.sin(RS.t*5)*1)*k;g.drawImage(glowSprite(col),108*k-R*3,-R*3,R*6,R*6);g.fillStyle=mixC(col,'#fff',.6);g.beginPath();g.arc(108*k,0,R*.5,0,TAU);g.fill();});
  } else if(w==='scythe'){

function drawGauntletGlow(A){
  const {S}=RS;if(RS.ch.wep!=='gauntlets')return;
  glow(g=>{const R=(6+(RS.opt.hot||0)*3.5)*S;g.globalAlpha=.4+(RS.opt.hot||0)*.3;g.drawImage(glowSprite(RS.accent),A.w[0]-R*2,A.w[1]-R*2,R*4,R*4);

/* ======================= drawBody =======================
   opt: g (glow ctx), cloth (state), dt, vx/vy (local velocity for cloth), sway,
        plant, hot (0..1 accent intensity), lite (flat, no glow), spin, sq          */
function drawBody(c,ch,po,sc,t,opt){
  opt=opt||{};
  const S=sc*ch.h,gw=ch.w,K=skel(po,S,gw,opt.plant);
  const prev=RS;
  RS={c,g:opt.g||c,ch,S,gw,K,po,t,opt,dt:opt.nosim?0:(opt.dt||0),accent:opt.accent||ch.col,
      ink:opt.inkCol||INK,far:opt.farCol||(opt.inkCol||INKF),col:INK,lite:opt.lite,eyes:null};
  RS.inv=c.getTransform().inverse();           // body frame at call time (eye positions report in it)
  c.save();
  const piv=a=>{c.translate(K.hip[0],K.hip[1]-6*S);c.rotate(a);c.translate(-K.hip[0],-K.hip[1]+6*S);};
  if(opt.sq)c.scale(1+opt.sq*.25,1-opt.sq*.25);
  if(opt.spin)piv(opt.spin);
  if(po.rot)piv(po.rot);
  try{
    drawBackCloth(c);
    const wB=ch.wep==='daggers';
    drawArm(c,K.aB,true,po.gB!==undefined?po.gB:(wB?3:0));
    if(wB)drawWeapon(c,K.aB,'B',po.wb,po.wl);
    drawGauntletGlow(K.aB);
    drawLeg(c,K.lB,true);
    fp(c,torsoPath,RS.ink);
    if(ch.pads){for(const s of[RS.far,RS.ink]){const A=s===RS.ink?K.aF:K.aB,o=add2(A.s,dirA(A.A1),3*S);
      fp(c,cc=>{cc.ellipse(o[0],o[1],13*S,10*S,PI/2-A.A1,0,TAU);for(let i=0;i<3;i++){const a=-PI/2-A.A1*.3+(i-1)*.5,b=add2(o,[Math.cos(a),Math.sin(a)],11*S);
        cc.moveTo(b[0]-3*S,b[1]);cc.lineTo(b[0]+Math.cos(a)*9*S,b[1]+Math.sin(a)*9*S);cc.lineTo(b[0]+3*S,b[1]);}},s);}}
    if(ch.beads){fp(c,cc=>{for(let i=0;i<9;i++){const a=.6+i*.24,q=TP(Math.cos(a)*14-2,-50+Math.sin(a)*14);cc.moveTo(q[0]+2.6*S,q[1]);cc.arc(q[0],q[1],2.6*S,0,TAU);}});}
    drawLeg(c,K.lF,false);
    drawSkirt(c);
    drawHead(c);
    const armed=ch.wep!=='none'&&ch.wep!=='gauntlets';
    drawArm(c,K.aF,false,po.gF!==undefined?po.gF:(armed?3:0));
    drawWeapon(c,K.aF,'F',po.wa,po.wl);
    drawGauntletGlow(K.aF);
  }finally{c.restore();}
  const eyes=RS.eyes;RS=prev;
  return{K,eyes};
}

/* ---------------- cached glow sprites ---------------- */
const _glow=new Map();
function glowSprite(col,hard){
  const key=col+(hard?'h':'');let s=_glow.get(key);if(s)return s;
  s=document.createElement('canvas');s.width=s.height=64;
  const g=s.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);
  if(hard){gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.22,rgba(col,1));gr.addColorStop(.55,rgba(col,.35));gr.addColorStop(1,rgba(col,0));}
  else{gr.addColorStop(0,rgba(mixC(col,'#ffffff',.5),.9));gr.addColorStop(.28,rgba(col,.5));gr.addColorStop(1,rgba(col,0));}
  g.fillStyle=gr;g.fillRect(0,0,64,64);_glow.set(key,s);return s;
}

/* =======================================================================
   FX — two layers. The main layer holds dark matter (dust, ink, debris);
   the glow layer holds light (sparks, trails, eyes, energy) and blooms.
   ======================================================================= */
let parts=[],effs=[],decals=[];
function pt(o){if(parts.length<1600)parts.push(Object.assign({x:0,y:0,vx:0,vy:0,l:.5,m:.5,s:4,c:'#fff',t:'spark',g:900,r:rnd(TAU),vr:rnd(9,-9),dr:.35},o,{m:o.l||.5}));}
function sparks(x,y,n,col,spd,dirA,spread,size,life){
  for(let i=0;i<n;i++){const a=(dirA===undefined?rnd(TAU):dirA+rnd(spread,-spread)),s=rnd(spd,spd*.3);
    pt({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(life||.45,(life||.45)*.4),s:rnd(size||3,(size||3)*.4),c:col,t:'spark',g:700});}
}
function ink(x,y,n,dir,spd){for(let i=0;i<n;i++){const a=(dir>0?0:PI)+rnd(.9,-.9);
  pt({x,y,vx:Math.cos(a)*rnd(spd,spd*.3),vy:Math.sin(a)*rnd(spd,spd*.3)-rnd(200,0),l:rnd(.7,.3),s:rnd(4.5,1.5),c:INK,t:'ink',g:1400,dr:.7});}}
function dust(x,n,dir,k,y){k=k||1;for(let i=0;i<n;i++)pt({x:x+rnd(12,-12),y:(y||0)-rnd(6,0),vx:(dir||0)*rnd(240,40)+rnd(90,-90),vy:-rnd(80,10)*k,l:rnd(.9,.45),s:rnd(20,10)*k,c:'#000',t:'dust',g:-20,dr:.25});}
function debris(x,y,n,spd,sz){for(let i=0;i<n;i++){const a=-PI/2+rnd(1.3,-1.3);pt({x,y,vx:Math.cos(a)*rnd(spd,spd*.3),vy:Math.sin(a)*rnd(spd,spd*.3),l:rnd(1.3,.7),s:rnd(sz||7,2),c:INK,t:'rock',g:1900,dr:.8,vr:rnd(14,-14)});}}
function embers(x,y,n,col,spd){for(let i=0;i<n;i++)pt({x:x+rnd(20,-20),y:y+rnd(20,-20),vx:rnd(spd,-spd),vy:-rnd(spd*1.4,spd*.3),l:rnd(1.4,.6),s:rnd(3,1.2),c:col,t:'ember',g:-120});}
function ring(x,y,col,r0,r1,life,w,flat,glowL){effs.push({t:0,l:life,glow:glowL!==false,d(c,p){
  const r=lerp(r0,r1,E.o(p));c.globalAlpha=(1-p);c.strokeStyle=col;c.lineWidth=(w||6)*(1-p*.8);
  c.beginPath();c.ellipse(x,y,r,r*(flat||1),0,0,TAU);c.stroke();}});}
/* impact starburst — needle rays + a hot core, in the glow layer */
function burstFX(x,y,dir,col,power){
  const big=power>1,n=big?14:9,ro=rnd(TAU),sp=[];for(let i=0;i<n;i++)sp.push(.5+hash(ro*7+i)*.8);
  effs.push({t:0,l:big?.22:.14,glow:1,d(c,p){c.save();c.translate(x,y);c.rotate(ro);const R=lerp(14,big?70:44,E.o(p)),a=1-p;
    for(const[k,cc,al]of[[1.3,col,.85],[.75,'#ffffff',1]]){c.globalAlpha=a*al;c.fillStyle=cc;c.beginPath();
      for(let i=0;i<n*2;i++){const an=i*PI/n,rr=i%2?R*.14*k:R*sp[i>>1]*k;c.lineTo(Math.cos(an)*rr,Math.sin(an)*rr);}c.closePath();c.fill();}
    c.restore();}});
  for(let i=0;i<(big?8:5);i++){const an=(dir>0?0:PI)+rnd(1,-1),L=rnd(big?150:90,40),w=rnd(3,1.5)*(big?1.4:1);
    effs.push({t:0,l:rnd(.16,.08),glow:1,d(c,p){const q=E.o(p),r0=q*L*.5,r1=q*L+14,cx=Math.cos(an),cy=Math.sin(an);c.globalAlpha=1-p;c.fillStyle=i%2?col:'#fff';
      c.beginPath();c.moveTo(x+cx*r0-cy*w,y+cy*r0+cx*w);c.lineTo(x+cx*r1,y+cy*r1);c.lineTo(x+cx*r0+cy*w,y+cy*r0-cx*w);c.fill();}});}
  const gs=glowSprite(col);effs.push({t:0,l:.22,glow:1,d(c,p){c.globalAlpha=(1-p)*.9;const r=(big?110:70)*(1+p*.5);c.drawImage(gs,x-r,y-r,r*2,r*2);}});
}
/* weapon swing smear: a lit crescent in the glow layer + a faint dark smear on the main layer */
function swingArc(x,y,dir,col,r,a0,a1,life,w){
  effs.push({t:0,l:life||.18,glow:1,d(c,p){c.save();c.translate(x,y);c.scale(dir,1);
    const k=1-p,sa=lerp(a0,a1,E.o(Math.min(1,p*2.2))),th=(w||14)*k;
    c.globalAlpha=k*.8;c.fillStyle=col;c.beginPath();c.arc(0,0,r+th,a0,sa,a1<a0);c.arc(0,0,r-th*.4,sa,a0,a1>=a0);c.closePath();c.fill();
    c.globalAlpha=k;c.strokeStyle='#fff';c.lineWidth=th*.25;c.beginPath();c.arc(0,0,r+th*.4,a0+(sa-a0)*.3,sa,a1<a0);c.stroke();c.restore();}});
}
function crack(x,power,col,y){
  const arms=[],n=5+rint(3);y=y||0;
  for(let i=0;i<n;i++){const pts=[[x,y]];let px=x,py=y,an=(i/n)*PI+rnd(.25,-.25);
    for(let j=0;j<4;j++){an+=rnd(.5,-.5);const L=rnd(34,14)*power;px+=Math.cos(an)*L*1.6;py+=Math.abs(Math.sin(an))*L*.2;pts.push([px,py]);}arms.push(pts);}
  decals.push({t:0,l:2.2,d(c,p,gl){c.globalAlpha=(p<.7?1:(1-p)/.3);c.lineJoin='round';
    if(gl){c.globalAlpha*=Math.max(0,1-p*2);c.strokeStyle=col;c.lineWidth=2*power;}else{c.strokeStyle=INK;c.lineWidth=4*power;}
    for(const a of arms){c.beginPath();a.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.stroke();}}});
}
function bolt(x1,y1,x2,y2,col,w){
  const pts=[[x1,y1]],n=9;w=w||1;
  for(let i=1;i<n;i++)pts.push([lerp(x1,x2,i/n)+rnd(28,-28),lerp(y1,y2,i/n)+rnd(14,-14)]);pts.push([x2,y2]);
  effs.push({t:0,l:.2,glow:1,d(c,p){c.globalAlpha=1-p;c.lineJoin='round';c.lineCap='round';
    for(const[lw,cc]of[[16*w,rgba(col,.35)],[6*w,col],[2.4*w,'#fff']]){c.strokeStyle=cc;c.lineWidth=lw;c.beginPath();pts.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.stroke();}}});
}

function updFX(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;if(p.l<=0){parts.splice(i,1);continue;}
    p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const d=Math.pow(p.dr,dt);p.vx*=d;if(p.t==='dust')p.vy*=d;p.r+=p.vr*dt;
    if(p.t==='rock'&&p.y>0){p.y=0;p.vy*=-.35;p.vx*=.6;p.vr*=.6;}
    if(p.t==='ink'&&p.y>0){p.y=0;p.vy=0;p.vx*=.2;}}
  for(let i=effs.length-1;i>=0;i--){effs[i].t+=dt;if(effs[i].t>=effs[i].l)effs.splice(i,1);}
  for(let i=decals.length-1;i>=0;i--){decals[i].t+=dt;if(decals[i].t>=decals[i].l)decals.splice(i,1);}
}
/* main layer: dark matter */
function drawPartsMain(c,dustCol){

/* =======================================================================
   VIEW + STAGES
   World units: ground y=0, up negative, a fighter stands ~180 tall.
   Screen: (x-cam.x)*k + W/2, (y-cam.y)*k + H/2 with k = k0*cam.z.
   Background layers have a depth p (0 = at the horizon, 1 = the fight plane)
   and are baked once into tiling strips.
   ======================================================================= */
const V={W:1280,H:720,k0:1.5,HZ:590,dpr:1};
const cam={x:0,y:0,z:1,roll:0,shx:0,shy:0};
const camK=()=>V.k0*cam.z;
const GSY=()=>V.H*.5-cam.y*camK();
function layerK(p){return p>1?V.k0*cam.z*p:V.k0*lerp(1,cam.z,p);}
function layerY(p){const GS=GSY();return p>1?GS+(p-1)*V.H*.5:V.HZ+(GS-V.HZ)*lerp(.3,1,p);}
function w2s(x,y){const k=camK();return[V.W/2+(x-cam.x)*k,V.H/2+(y-cam.y)*k];}

/* ---------------- baking ---------------- */
let STG=null;
function bakeLayer(st,L,rf){
  const fixed=L.p<.35,P=L.P||1600,top=L.top,bot=L.bot===undefined?20:L.bot,r=fixed?V.k0:rf*(L.p>1?.5:1);
  const cw=Math.min(8000,Math.ceil(P*r)),hh=Math.max(2,Math.ceil((bot-top)*r));
  const cnv=document.createElement('canvas');cnv.width=cw;cnv.height=hh;
  const c=cnv.getContext('2d');c.setTransform(cw/P,0,0,r,0,-top*r);
  const col=L.col||mixC(st.haze,ST_INK,L.k);c.fillStyle=col;c.strokeStyle=col;
  L.draw(c,srng(Math.round(L.p*9173)+st.name.length*31),P,col,st);
  let out=cnv;
  if(L.blur&&typeof c.filter==='string'){const b=document.createElement('canvas');b.width=cw;b.height=hh;const bx=b.getContext('2d');
    bx.filter=`blur(${L.blur*r}px)`;bx.drawImage(cnv,0,0);out=b;}
  return{cnv:out,L,P,top,bot,fixed,r};
}
function loadStage(id){
  const st=STAGES[id]||STAGES.dusk,rf=Math.min(3,V.k0*1.2);
  if(STG&&STG.id===id&&STG.rf===rf&&STG.k0===V.k0)return STG;
  const keepT=STG&&STG.id===id?STG.t:0;
  STG={id,st,rf,k0:V.k0,layers:st.layers.map(L=>bakeLayer(st,L,rf)),wx:[],flash:0,bolt:null,nextBolt:3,t:keepT,
    dust:mixC(st.haze,ST_INK,.55),stars:[]};
  if(st.stars)for(let i=0;i<120;i++)STG.stars.push([rnd(1),rnd(1)*.62,rnd(1.6,.4),rnd(TAU)]);
  seedWeather();
  return STG;
}

/* ---------------- weather ----------------
   particles live at a depth d (like layers) so they parallax; d>1 is foreground */
function wxProj(d){const kd=layerK(d),Yb=layerY(Math.min(d,1));return[kd,Yb];}
function newWx(type,init){
  const d=type==='mist'?rnd(1.05,.3):type==='rain'?rnd(1.6,.25):rnd(1.5,.2);
  const [kd]=wxProj(d),hw=V.W/2/kd+60;
  const o={type,d,x:cam.x*Math.min(d,1)+rnd(hw,-hw),y:0,vx:0,vy:0,s:1,r:rnd(TAU),vr:rnd(3,-3),t:rnd(10),l:1,m:1};
  const top=-(V.H*.9)/kd;
  if(type==='embers'){o.y=init?rnd(0,top):rnd(20,-10);o.vy=-rnd(70,20);o.vx=rnd(30,-10);o.s=rnd(2.4,.9);o.l=o.m=rnd(6,3);}
  else if(type==='ash'||type==='leaves'||type==='petals'){o.y=init?rnd(0,top):top-rnd(40);o.vy=rnd(60,25)*(type==='ash'?.6:1);o.vx=rnd(50,-10)+(type==='petals'?30:0);o.s=rnd(type==='ash'?2.2:4.5,1.5);o.l=o.m=99;}
  else if(type==='rain'){o.y=init?rnd(0,top):top-rnd(60);o.vy=rnd(1300,1000);o.vx=-160;o.s=rnd(1.4,.6);o.l=o.m=99;}
  else if(type==='wisps'||type==='fireflies'||type==='motes'||type==='souls'){o.y=init?rnd(-20,-260):type==='souls'?20:rnd(-20,-240);o.vx=rnd(12,-12);o.vy=type==='souls'?-rnd(40,18):rnd(8,-8);
    o.s=type==='wisps'?rnd(5,3):type==='souls'?rnd(4,2.5):rnd(1.8,.8);o.l=o.m=rnd(9,5);}
  else if(type==='mist'){o.y=-rnd(90,0);o.vx=rnd(24,8)*(rnd()<.5?-1:1);o.s=rnd(260,140);o.l=o.m=99;}
  return o;
}
function seedWeather(){const w=STG.st.weather||{};STG.wx=[];
  for(const k in w){if(k==='sparks')continue;for(let i=0;i<w[k];i++)STG.wx.push(newWx(k,1));}}
function updStage(dt){
  if(!STG)return;STG.t+=dt;const st=STG.st;
  for(let i=STG.wx.length-1;i>=0;i--){const o=STG.wx[i];o.t+=dt;o.l-=dt;
    o.x+=(o.vx+Math.sin(o.t*1.3+o.r)*(o.type==='leaves'||o.type==='petals'?40:o.type==='ash'?18:6))*dt;o.y+=o.vy*dt;o.r+=o.vr*dt;
    const [kd]=wxProj(o.d),hw=V.W/2/kd+80,cx=cam.x*Math.min(o.d,1);
    if(o.x<cx-hw)o.x+=hw*2;else if(o.x>cx+hw)o.x-=hw*2;
    const dead=o.l<=0||(o.y>6&&o.vy>0&&o.type!=='mist')||(o.y<-(V.H*1.1)/kd&&o.vy<0);
    if(dead){if(o.type==='rain'&&o.d>.8&&o.d<1.2&&rnd()<.25)pt({x:o.x+(cam.x-cx),y:0,vx:rnd(60,-60),vy:-rnd(120,40),l:.25,s:1.4,c:'#9cc4f0',t:'splash',g:900});
      STG.wx[i]=newWx(o.type,0);}
  }
  if(st.weather&&st.weather.sparks&&rnd()<dt*1.6){const x=cam.x+rnd(500,-500);
    for(let i=0;i<14;i++)pt({x,y:-rnd(260,160),vx:rnd(220,-220),vy:-rnd(300,40),l:rnd(1.2,.5),s:rnd(2.4,1),c:'#ffb040',t:'spark',g:800});}
  if(st.lightning){STG.flash=Math.max(0,STG.flash-dt*2.6);STG.nextBolt-=dt;
    if(STG.nextBolt<=0){STG.nextBolt=rnd(9,4);STG.flash=1;
      const x0=rnd(.9,.1)*V.W,pts=[[x0,0]];let x=x0;for(let y=0;y<V.HZ*.8;y+=rnd(40,16)){x+=rnd(40,-40);pts.push([x,y]);}
      STG.bolt={pts,t:.22,br:[pts.slice(4+rint(4)).map(p=>[p[0]+rnd(60,-60),p[1]+rnd(40)])]};
      later(rnd(.9,.3),()=>SFX.thunder&&SFX.thunder());}
    if(STG.bolt){STG.bolt.t-=dt;if(STG.bolt.t<=0)STG.bolt=null;}}
}

/* ---------------- drawing ---------------- */
function fogBand(X,y,h,a,col){if(a<=0)return;const g=X.createLinearGradient(0,y-h,0,y);g.addColorStop(0,rgba(col,0));g.addColorStop(1,rgba(col,a));X.fillStyle=g;X.fillRect(-V.W,y-h,V.W*3,h+2);}
function drawLayerStrip(X,B){
  const L=B.L,p=L.p,kL=B.fixed?V.k0:layerK(p),Yb=layerY(p),w=B.P*kL;
  let ox=V.W/2-(cam.x*Math.min(p,1.6))*kL+(L.drift?STG.t*L.drift*kL:0);
  ox=((ox%w)+w)%w-w;
  const y=Yb+B.top*kL,h=(B.bot-B.top)*kL;
  if(y>V.H*1.5||y+h<-V.H*.5)return;
  X.globalAlpha=L.a||1;
  const cw=B.cnv.width,chh=B.cnv.height,sx=cw/w,sy=chh/h,mg=cam.roll?V.W*.3:0;
  // only the visible part of each tile is resampled; far layers are baked at screen scale and blitted 1:1
  const y0=Math.max(y,-mg),y1=Math.min(y+h,V.H+mg);if(y1<=y0){X.globalAlpha=1;return;}
  for(let x=ox-(cam.roll?w:0);x<V.W+(cam.roll?w:0);x+=w){
    const x0=Math.max(x,-mg),x1=Math.min(x+w,V.W+mg);if(x1<=x0)continue;
    const srx=(x0-x)*sx,sry=(y0-y)*sy,srw=Math.min(cw-srx,(x1-x0)*sx),srh=Math.min(chh-sry,(y1-y0)*sy);if(srw<=0||srh<=0)continue;
    if(B.fixed)X.drawImage(B.cnv,Math.round(srx),Math.round(sry),Math.round(srw),Math.round(srh),Math.round(x0),Math.round(y0),Math.round(srw),Math.round(srh));
    else X.drawImage(B.cnv,srx,sry,srw,srh,x0,y0,x1-x0+.5,y1-y0);}
  X.globalAlpha=1;
  if(L.fog)fogBand(X,Yb,L.fog[0]*kL,L.fog[1],STG.st.haze);
}
function skyGrad(X,st,bright){
  const y0=layerY(0),top=y0-430*V.k0,M=V.W;
  const g=X.createLinearGradient(0,top,0,y0);for(const s of st.sky)g.addColorStop(s[0],s[1]);
  X.fillStyle=g;X.fillRect(-M,-M,V.W+M*2,y0+M+2);
  const h=st.sky[st.sky.length-1][1];X.fillStyle=h;X.fillRect(-M,y0,V.W+M*2,V.H+M);
  if(bright>0){X.save();X.globalCompositeOperation='lighter';X.globalAlpha=bright;X.fillStyle='#9ab8e8';X.fillRect(-M,-M,V.W+M*2,y0+M);X.restore();}
}
function drawSun(X,st){
  const s=st.sun;if(!s)return;const k=V.k0,x=V.W/2+(s.x-cam.x*.012)*k,y=layerY(0)+s.y*k,r=s.r*k;
  X.save();X.globalCompositeOperation='lighter';
  X.globalAlpha=.55;X.drawImage(glowSprite(s.glow),x-r*7,y-r*7,r*14,r*14);
  X.globalAlpha=.5;X.drawImage(glowSprite(s.col),x-r*2.4,y-r*2.4,r*4.8,r*4.8);
  if(s.rays){const t=STG.t*.03;for(let i=0;i<9;i++){const a=t+i*TAU/9+Math.sin(i*3.1)*.3,w=.05+hash(i)*.06,L=r*(9+hash(i*2)*6);
    const g=X.createLinearGradient(x,y,x+Math.cos(a)*L,y+Math.sin(a)*L);g.addColorStop(0,rgba(s.glow,.16));g.addColorStop(1,rgba(s.glow,0));
    X.globalAlpha=1;X.fillStyle=g;X.beginPath();X.moveTo(x,y);X.lineTo(x+Math.cos(a-w)*L,y+Math.sin(a-w)*L);X.lineTo(x+Math.cos(a+w)*L,y+Math.sin(a+w)*L);X.fill();}}
  X.restore();
  X.fillStyle=s.col;X.beginPath();X.arc(x,y,r,0,TAU);X.fill();
  if(s.moon){X.fillStyle=rgba(s.glow,.12);for(let i=0;i<6;i++){X.beginPath();X.arc(x+(hash(i)-.5)*r*1.2,y+(hash(i+9)-.5)*r*1.2,r*(.1+hash(i+3)*.18),0,TAU);X.fill();}}
}
function drawWxBack(X,front){
  const st=STG.st;
  for(const o of STG.wx){if((o.d>1)!==front)continue;const [kd,Yb]=wxProj(o.d),x=V.W/2+(o.x-cam.x*Math.min(o.d,1.6))*kd,y=Yb+o.y*kd;
    if(x<-60||x>V.W+60)continue;
    if(o.type==='ash'){X.fillStyle=ST_INK;X.globalAlpha=.8;X.fillRect(x,y,o.s*kd,o.s*kd*.7);}
    else if(o.type==='leaves'||o.type==='petals'){X.globalAlpha=o.d>1?.95:lerp(.4,.9,o.d);X.fillStyle=o.type==='petals'?(o.r%2>1?'#ff7eb0':mixC('#ff7eb0',ST_INK,.6)):ST_INK;
      X.save();X.translate(x,y);X.rotate(o.r);X.scale(1,Math.abs(Math.sin(o.t*3+o.r))*.8+.2);X.beginPath();X.ellipse(0,0,o.s*kd*1.4,o.s*kd*.55,0,0,TAU);X.fill();X.restore();}
    else if(o.type==='rain'){X.globalAlpha=lerp(.15,.45,Math.min(1,o.d));X.strokeStyle='#a8c8f0';X.lineWidth=o.s*kd*.8;X.beginPath();X.moveTo(x,y);X.lineTo(x-o.vx*.03*kd,y-o.vy*.03*kd);X.stroke();}
    else if(o.type==='mist'){X.globalAlpha=.16;X.drawImage(mistSprite(st.haze),x-o.s*kd,y-o.s*kd*.35,o.s*kd*2,o.s*kd*.7);}
  }
  X.globalAlpha=1;
}
function drawWxGlow(g){
  const st=STG.st;
  for(const o of STG.wx){const T=o.type;if(T!=='embers'&&T!=='wisps'&&T!=='fireflies'&&T!=='motes'&&T!=='souls')continue;
    const [kd,Yb]=wxProj(o.d),x=V.W/2+(o.x-cam.x*Math.min(o.d,1.6))*kd,y=Yb+o.y*kd;if(x<-60||x>V.W+60)continue;
    const a=clamp(o.l/o.m*3,0,1)*clamp((o.m-o.l)*2,0,1);
    const col=T==='embers'?'#ff8a30':T==='motes'?st.haze:T==='fireflies'?mixC(st.haze,'#ffffff',.3):T==='souls'?'#9cff7a':'#c07cff';
    const fl=T==='fireflies'?(.5+.5*Math.sin(o.t*4+o.r*9)):1;
    g.globalAlpha=a*fl*(T==='motes'?.5:.9);const r=o.s*kd*(T==='wisps'?4:3);g.drawImage(glowSprite(col,1),x-r,y-r,r*2,r*2);}
  g.globalAlpha=1;
  if(STG.bolt){const b=STG.bolt;g.save();g.lineJoin='round';g.globalAlpha=b.t/.22;
    for(const[lw,cc]of[[10,'rgba(120,170,255,.35)'],[3,'#cfe4ff'],[1.2,'#ffffff']]){g.strokeStyle=cc;g.lineWidth=lw*V.k0*.5;g.beginPath();b.pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();}
    g.restore();}
}

/* ---------------- input buffer ---------------- */

/* ---------------- moves ---------------- */

/* ---------------- geometry ---------------- */
function segD(ax,ay,bx,by,cx,cy,dx,dy){

function fSkel(f){const S=f.ch.h;return skel(f.pose,S,f.ch.w,false);}

/* ---------------- hits ---------------- */
function prorate(n){return Math.max(.3,1-.12*Math.max(0,n-1));}

/* ---------------- projectiles ---------------- */
function spawnProj(f,o){
  const p=Object.assign({own:f,x:f.x+(o.dx||60)*f.face,y:f.y+f.ry+(o.dy||-100),vx:(o.v||700)*f.face,vy:0,r:22,life:2,t:0,h:{dmg:60,hs:.45,bs:.28,kb:220,stop:.08,cls:'S'},kind:'orb',hitN:1},o);

    if(p.upd)p.upd(p,dt);

/* =======================================================================
   COMBAT FX — impacts, projectiles, eye + weapon trails.
   Shadows bleed ink. Everything that emits light lives in the glow layer.
   ======================================================================= */
function slashLine(x,y,an,len,col,life,w){
  effs.push({t:0,l:life||.2,glow:1,d(c,p){const k=E.o(Math.min(1,p*3)),a=1-E.i2(p),L=len*(.3+.7*k),cx=Math.cos(an),cy=Math.sin(an),ww=(w||5)*(1-p*.7);
    c.globalAlpha=a;c.fillStyle=col;c.beginPath();c.moveTo(x-cx*L,y-cy*L);c.lineTo(x-cy*ww,y+cx*ww);c.lineTo(x+cx*L,y+cy*L);c.lineTo(x+cy*ww,y-cx*ww);c.fill();
    c.fillStyle='#ffffff';c.beginPath();c.moveTo(x-cx*L*.8,y-cy*L*.8);c.lineTo(x-cy*ww*.3,y+cx*ww*.3);c.lineTo(x+cx*L*.8,y+cy*L*.8);c.lineTo(x+cy*ww*.3,y-cx*ww*.3);c.fill();}});
}
function hitFX(x,y,dir,col,pow,kind){
  const big=pow>1;
  burstFX(x,y,dir,col,pow);
  sparks(x,y,big?22:12,col,big?900:620,dir>0?0:PI,1.1,big?3.6:2.8,.4);
  sparks(x,y,big?8:4,'#ffffff',big?800:560,dir>0?0:PI,.8,2.2,.25);
  ink(x,y,big?16:8,dir,big?520:360);
  if(kind==='slash'){const an=(dir>0?-.75:-PI+.75)+rnd(.35,-.35);slashLine(x,y,an,big?120:80,col,.22,big?7:5);}
  else if(kind==='pierce'){slashLine(x,y,dir>0?0:PI,big?150:100,col,.2,4);}
  else if(kind==='blunt'||kind==='palm'){ring(x,y,col,8,big?110:70,.3,big?8:5);if(kind==='palm')ring(x,y,'#ffffff',4,big?80:50,.22,3);}
  else if(kind==='hex'){ring(x,y,col,8,90,.35,6);for(let i=0;i<8;i++)pt({x,y,vx:rnd(300,-300),vy:rnd(300,-300),l:rnd(.7,.3),s:rnd(4,2),c:col,t:'orb',g:-100});}
  else if(kind==='volt'){for(let i=0;i<3;i++){const a=(dir>0?0:PI)+rnd(1.2,-1.2);bolt(x,y,x+Math.cos(a)*rnd(120,60),y+Math.sin(a)*rnd(120,60),col,.7);}ring(x,y,col,8,80,.25,5);}
  if(big)dust(x,4,dir,.6,Math.min(0,y+40));
}
function blockFX(x,y,dir,colD,colA){
  sparks(x,y,14,'#e8f0ff',700,dir>0?PI:0,1.2,2.4,.3);
  sparks(x,y,6,colA,500,dir>0?PI:0,1,2,.25);
  effs.push({t:0,l:.18,glow:1,d(c,p){c.globalAlpha=1-p;c.strokeStyle=colD;c.lineWidth=4*(1-p);c.beginPath();
    const r=24+p*30;for(let i=0;i<=6;i++){const a=i/6*TAU+PI/6;c.lineTo(x+Math.cos(a)*r*.6,y+Math.sin(a)*r);}c.stroke();}});
}
function flatArc(x,y,dir,col,r){
  effs.push({t:0,l:.22,glow:1,d(c,p){const k=E.o(Math.min(1,p*2.4)),a=1-p;c.save();c.translate(x,y);c.scale(dir,.22);
    c.globalAlpha=a*.8;c.strokeStyle=col;c.lineWidth=10*(1-p);c.beginPath();c.arc(-r*.4,0,r,-PI*.9,-PI*.9+k*PI*1.5);c.stroke();
    c.strokeStyle='#fff';c.lineWidth=3*(1-p);c.beginPath();c.arc(-r*.4,0,r,-PI*.9+k*PI*1.1,-PI*.9+k*PI*1.5);c.stroke();c.restore();}});
}

  crack(x,pow,col,0);debris(x,-4,Math.round(14*pow),720*pow,8);dust(x,Math.round(14*pow),0,1.3*pow);

function recordTrails(f,eyes){
  const now=gameT,life=f.ch.id==='ashen'?.3:.18;

      T.unshift({x:f.x+e[0]*f.face,y:f.y+f.ry+e[1],t:now});while(T.length>2&&now-T[T.length-1].t>life)T.pop();if(T.length>40)T.pop();}}

function fightCam(dt,snap){
  const a=FTR[0],b=FTR[1],mid=(a.x+b.x)/2,sep=Math.abs(a.x-b.x),visW=V.W/V.k0;
  const tz=clamp(visW/(sep+340),1,1.3),kk=snap?1:1-Math.pow(.03,dt);
  FC.z=lerp(FC.z,tz,kk);
  const k=V.k0*FC.z,top=Math.min(a.y+a.ry,b.y+b.ry)-210;
  let cy=-(V.H*.32)/k;const topS=V.H/2+(top-cy)*k;if(topS<V.H*.1)cy=top-(V.H*.1-V.H/2)/k;
  FC.y=snap?cy:lerp(FC.y,cy,1-Math.pow(.02,dt));
  const hw=(V.W/2)/k;let cx=clamp(mid,-ARENA-70+hw,ARENA+70-hw);if(hw>ARENA+70)cx=0;
  FC.x=snap?cx:lerp(FC.x,cx,1-Math.pow(.006,dt));
  cam.x=FC.x;cam.y=FC.y;cam.z=FC.z;cam.roll=snap?0:lerp(cam.roll,0,kk);
}
/* ---------------- transforms ---------------- */
function screenXf(c){c.setTransform(1,0,0,1,cam.shx,cam.shy);if(cam.roll){c.translate(V.W/2,V.H/2);c.rotate(cam.roll);c.translate(-V.W/2,-V.H/2);}}
function worldXf(c){screenXf(c);const k=camK();c.translate(V.W/2-cam.x*k,V.H/2-cam.y*k);c.scale(k,k);}

/* ---------------- drawing ---------------- */
function drawShadow(f){const h=Math.max(0,-(f.y+f.ry)),s=1/(1+h/220);X.globalAlpha=.55*s;X.fillStyle='#000';X.beginPath();X.ellipse(f.x,1,58*f.ch.w*s,7*s,0,0,TAU);X.fill();X.globalAlpha=1;}
function drawFighter(f,dt,inkOver){
  const vx=(f.x-(f.lx===undefined?f.x:f.lx))/Math.max(dt,1e-3),vy=(f.y+f.ry-(f.ly===undefined?f.y+f.ry:f.ly))/Math.max(dt,1e-3);f.lx=f.x;f.ly=f.y+f.ry;
  const sh=f.shk>0?(hash(gameT*97+f.side)-.5)*7:0;
  X.save();X.translate(f.x+sh,f.y+f.ry);X.scale(f.face,1);
  if(f.alpha<1)X.globalAlpha=f.alpha;
  const air=!f.ground||f.ry<-2||f.st==='air'||(f.st==='move'&&f.mv&&f.mv.air);
  const r=drawBody(X,f.ch,f.pose,1,gameT,{g:G,cloth:f.cloth,dt:hitstop>0?0:dt,vx:clamp(vx*f.face,-2500,2500),vy:clamp(vy,-2500,2500),plant:!air&&f.st!=='down'&&f.st!=='ko',hot:f.hot,sway:clamp(vx*f.face/600,-1,1),
    inkCol:inkOver,farCol:inkOver});
  if(f.flash>0&&!inkOver){G.save();G.setTransform(X.getTransform());G.globalAlpha=Math.min(1,f.flash/.12)*.2;drawBody(G,f.ch,f.pose,1,gameT,{lite:1,nosim:1,cloth:f.cloth,inkCol:opp(f).ch.col});G.restore();}
  X.restore();
  recordTrails(f,r.eyes);
}
function drawGhosts(f){
  if(!f.ghosts.length)return;G.save();worldXf(G);const dk=mixC(f.ch.col,'#000000',.55);
  for(const g of f.ghosts){const u=g.t/.26;G.save();G.translate(g.x,g.y);G.scale(g.face,1);G.globalAlpha=.13*(1-u);
    drawBody(G,f.ch,g.pose,1,gameT,{lite:1,nosim:1,cloth:f.cloth,inkCol:dk});G.restore();}
  G.restore();
}
function drawGhostsMain(f){
  if(!f.ghosts.length)return;
  for(const g of f.ghosts){const u=g.t/.26;X.save();X.translate(g.x,g.y);X.scale(g.face,1);X.globalAlpha=.42*(1-u)*(1-u);
    drawBody(X,f.ch,g.pose,1,gameT,{lite:1,nosim:1,cloth:f.cloth,inkCol:mixC(f.ch.col,INK,.8)});X.restore();}
}
function bloom(str){
  if(str<=0)return;
  BX1.globalCompositeOperation='copy';if(HAS_FILTER)BX1.filter='blur(1.5px)';BX1.drawImage(GL,0,0,B1.width,B1.height);if(HAS_FILTER)BX1.filter='none';
  BX2.globalCompositeOperation='copy';if(HAS_FILTER)BX2.filter='blur(2px)';BX2.drawImage(B1,0,0,B2.width,B2.height);if(HAS_FILTER)BX2.filter='none';
  X.save();X.setTransform(1,0,0,1,0,0);X.globalCompositeOperation='lighter';X.imageSmoothingEnabled=true;
  X.globalAlpha=.75*str;X.drawImage(B1,0,0,V.W,V.H);X.globalAlpha=.9*str;X.drawImage(B2,0,0,V.W,V.H);X.restore();
}
/* One frame of the world. actors = fighters (or cinematic puppets).
   o.bg: 'stage' | fn(X) custom backdrop; o.imp: impact frame {bg,ink}           */
function renderWorld(dt,actors,o){
  o=o||{};
  X.setTransform(1,0,0,1,0,0);X.globalAlpha=1;X.globalCompositeOperation='source-over';
  G.setTransform(1,0,0,1,0,0);G.clearRect(0,0,V.W,V.H);
  const imp=o.imp||POST.imp;
  if(imp){ // impact frame: flat two-tone, no light at all
    X.fillStyle=imp.bg;X.fillRect(0,0,V.W,V.H);worldXf(X);
    for(const f of actors)if(f.alpha>0)drawFighter(f,0,imp.ink);
    if(o.impExtra)o.impExtra(X,imp);
    X.setTransform(1,0,0,1,0,0);drawHudLetter();return;}
  screenXf(X);
  if(o.bg&&o.bg!=='stage')o.bg(X);else drawStageBack(X);
  if(POST.tint>0){X.save();X.setTransform(1,0,0,1,0,0);X.globalAlpha=POST.tint;X.fillStyle=POST.tintC;X.fillRect(0,0,V.W,V.H);X.restore();}
  worldXf(X);
  if(!o.noShadow)for(const f of actors)if(f.alpha>0)drawShadow(f);
  drawDecals(X,false);
  if(o.under)o.under(X);
  for(const f of actors)drawGhostsMain(f);
  for(const f of actors)drawFighter(f,dt);
  drawProjs(X,(worldXf(G),G));
  drawPartsMain(X,STG?STG.dust:'#222');
  drawEffs(X,false);
  if(o.over)o.over(X);
  screenXf(X);if(!o.noFront&&(!o.bg||o.bg==='stage'))drawStageFront(X);
  // light
  worldXf(G);
  for(const f of actors){drawWeaponTrail(G,f);drawEyeTrails(G,f);}
  drawDecals(G,true);drawPartsGlow(G);drawEffs(G,true);
  if(o.glow)o.glow(G);
  for(const f of actors)drawGhosts(f);
  screenXf(G);if(STG&&(!o.bg||o.bg==='stage'))drawWxGlow(G);
  X.setTransform(1,0,0,1,0,0);X.save();X.globalCompositeOperation='lighter';X.drawImage(GL,0,0);X.restore();
  bloom(QUAL.lvl>=3?0:POST.bloom);
  if(POST.vig)X.drawImage(VIG,0,0,V.W,V.H);
  if(POST.flash>0){X.globalAlpha=Math.min(1,POST.flash);X.fillStyle=POST.flashC;X.fillRect(0,0,V.W,V.H);X.globalAlpha=1;}
  drawHudLetter();
}
function drawHudLetter(){if(POST.letter>0){const h=V.H*.11*E.o(POST.letter);X.fillStyle='#000';X.fillRect(0,0,V.W,h);X.fillRect(0,V.H-h,V.W,h);}}

/* =======================================================================
   CINEMATICS — shot lists in story time.
   Each shot: {d, speed:[[t,scale,ease]..] (story-time ramp), bg, enter, upd(u,t,S,dt),
   ev:[[t,fn]], imp:[[t0,t1,kind]] (two-tone impact frames), post(X,u) screen overlay}
   Real time = story time / speed, so a slow-motion beat is just a low speed key.
   ======================================================================= */
let CINE=null,FLASH=null;
function puppet(ch,side){const p=mkFighter(ch,side||0,'none');p.st='cine';p.M=MOVES[ch.id];return p;}
function playCine(C){
  CINE=Object.assign({i:0,t:0,rt:0,S:{},extra:[]},C);
  for(const f of FTR){f.st='cine';f.ghosts.length=0;f.alpha=1;f.hot=0;f.ry=0;f.wtr.length=0;}
  PROJ.length=0;
  enterShot();
}
function enterShot(){const sh=CINE.shots[CINE.i];sh._ev=new Set();if(sh.enter)sh.enter(CINE.S,CINE);CINE.cut=1;}
function cineActors(){return[...(CINE.back||[]),...FTR.filter(f=>!f.hide),...CINE.extra];}
function updCine(rdt){
  const C=CINE;if(!C)return 0;const sh=C.shots[C.i];
  const sp=sh.speed?Math.max(.005,tk(C.t,sh.speed)):1,dt=rdt*sp;
  C.t+=dt;C.rt+=rdt;gameT+=dt;C.dt=dt;
  if(sh.ev)sh.ev.forEach((e,k)=>{if(!sh._ev.has(k)&&C.t>=e[0]){sh._ev.add(k);e[1](C.S,C);}});
  if(sh.upd)sh.upd(Math.min(1,C.t/sh.d),C.t,C.S,dt,C);
  for(const f of cineActors()){for(let i=f.ghosts.length-1;i>=0;i--){f.ghosts[i].t+=dt;if(f.ghosts[i].t>.26)f.ghosts.splice(i,1);}
    if(f.ghostT>0){f.ghostT-=dt;f.ghostAcc=(f.ghostAcc||0)+dt;if(f.ghostAcc>.03){f.ghostAcc=0;f.ghosts.push({pose:copyPose(f.pose),x:f.x,y:f.y+f.ry,face:f.face,t:0});}}
    if(f.ctrail){const s=trailSeg(f,{seg:f.ctrail});f.wtr.unshift({a:s[0],b:s[1],t:gameT});}
    if(f.flash>0)f.flash-=dt;if(f.shk>0)f.shk-=dt;}
  updFX(dt);tickTimers(dt);updCamFX(rdt);
  if(STG)updStage(dt);
  if(C.skip&&C.skipT===undefined&&C.canSkip!==false){C.skipT=0;}
  if(C.t>=sh.d){if(sh.exit)sh.exit(C.S,C);C.i++;C.t=0;if(C.i>=C.shots.length){endCine();return dt;}enterShot();}
  return dt;
}
function endCine(){const C=CINE;CINE=null;POST.imp=null;POST.tint=0;POST.flash=0;cam.roll=0;
  for(const f of FTR){f.alpha=1;f.hot=0;f.ctrail=null;f.hide=0;f.ghosts.length=0;if(f.st==='cine'){f.st='idle';f.t=0;f.y=0;f.ry=0;f.ground=1;f.mv=null;}}
  if(C.done)C.done(C.S,C);}
function renderCine(rdt){
  const C=CINE,sh=C.shots[C.i];
  const im=sh.imp&&sh.imp.find(q=>C.t>=q[0]&&C.t<q[1]);
  const imp=im?IMPK(im[2],C):null;
  renderWorld(C.dt||0,cineActors(),{bg:sh.bg,imp,glow:sh.glow,over:sh.over,under:sh.under,noShadow:sh.noShadow,noFront:sh.noFront,impExtra:sh.impExtra});
  if(sh.post&&!imp){X.setTransform(1,0,0,1,0,0);sh.post(X,Math.min(1,C.t/sh.d),C.t,C.S);}
  if(C.title&&C.i<=1){drawCineTitle(C);}
  if(C.cut){C.cut=0;}
}
function IMPK(k,C){const col=(C.A&&C.A.ch.col)||'#fff';
  return k==='b'?{bg:'#000000',ink:'#ffffff'}:k==='a'?{bg:col,ink:'#000000'}:k==='ai'?{bg:'#000000',ink:col}:{bg:'#ffffff',ink:'#000000'};}
function drawCineTitle(C){
  const t=C.rt,a=clamp(t*3,0,1)*clamp((1.9-t)*2,0,1);if(a<=0)return;
  const s=V.H/720;X.save();X.globalAlpha=a;X.textBaseline='alphabetic';X.textAlign='left';
  X.font=`600 ${Math.round(13*s)}px ${UIF}`;X.fillStyle=C.A.ch.col;X.fillText(C.A.ch.name,V.W*.06,V.H*.83);
  X.font=`300 ${Math.round(30*s)}px ${UIF}`;X.fillStyle='#fff';
  const txt=C.title.split('').join(String.fromCharCode(8202));X.fillText(txt,V.W*.06,V.H*.83+34*s);
  X.fillStyle=C.A.ch.col;X.fillRect(V.W*.06,V.H*.83+44*s,Math.min(1,t*2)*220*s,2*s);X.restore();
}

/* ---------------- shot helpers ---------------- */
const CU={
  at(f,x,y,face){f.x=x;f.y=y||0;f.ry=0;if(face)f.face=face;},
  clip(f,key,t){const m=f.M[key]||MOVES[f.ch.id][key];f.pose=clipPose(m,clamp(t,0,m.d),f);},
  cam(x,y,z,roll){cam.x=x;cam.y=y;cam.z=z;cam.roll=roll||0;},
  /* camera centred on a body point: dy = height above feet */
  on(f,dx,dy,z,roll){cam.x=f.x+dx*f.face;cam.y=f.y+f.ry-dy;cam.z=z;cam.roll=roll||0;},
  lerpCam(a,b,u){cam.x=lerp(a[0],b[0],u);cam.y=lerp(a[1],b[1],u);cam.z=lerp(a[2],b[2],u);cam.roll=lerp(a[3]||0,b[3]||0,u);},
  head(f){const K=skel(f.pose,f.ch.h,f.ch.w,false);return[f.x+K.head[0]*f.face,f.y+f.ry+K.head[1]];},
  chest(f){const K=skel(f.pose,f.ch.h,f.ch.w,false);return[f.x+K.chest[0]*f.face,f.y+f.ry+K.chest[1]];},
  hand(f){return trailSeg(f)[1];},
  hurt(f,k){f.pose=f.P[k||'hurtM'];},
};
/* ---------------- backdrops (screen space, drawn before the world) ---------------- */
function bgGrad(stops){return X=>{const M=V.W;const g=X.createLinearGradient(0,0,0,V.H);stops.forEach(s=>g.addColorStop(s[0],s[1]));X.fillStyle=g;X.fillRect(-M,-M,V.W+2*M,V.H+2*M);};}
/* silhouettes against a giant disc: the most classic shot there is */
function bgDisc(o){return X=>{
  const M=V.W;const g=X.createLinearGradient(0,0,0,V.H);g.addColorStop(0,o.top||'#050205');g.addColorStop(.6,o.mid||mixC(o.col,'#000000',.7));g.addColorStop(1,o.bot||mixC(o.col,'#000000',.4));
  X.fillStyle=g;X.fillRect(-M,-M,V.W+2*M,V.H+2*M);
  const k=V.k0*(o.zk||1),x=V.W/2+((o.x||0)-cam.x*(o.par||.08))*k,y=V.H/2+((o.y||0)-cam.y*(o.par||.08))*k,r=(o.r||260)*k*(o.rz?cam.z:1);
  X.save();X.globalCompositeOperation='lighter';X.globalAlpha=.8;X.drawImage(glowSprite(o.col),x-r*2.6,y-r*2.6,r*5.2,r*5.2);X.restore();
  X.fillStyle=o.disc||mixC(o.col,'#ffffff',.55);X.beginPath();X.arc(x,y,r,0,TAU);X.fill();
  if(o.ring){X.strokeStyle=rgba(o.col,.5);X.lineWidth=2*k;X.beginPath();X.arc(x,y,r*1.08,0,TAU);X.stroke();}
  if(o.after)o.after(X,x,y,r);
};}
function bgStageTint(col,a){return X=>{drawStageBack(X);X.save();X.setTransform(1,0,0,1,0,0);X.globalAlpha=a;X.fillStyle=col;X.fillRect(0,0,V.W,V.H);X.restore();};}
/* screen-space streaks on the glow layer (dash / fall / whip pans) */
function streaks(dirx,diry,col,a,seed,n){
  G.save();G.setTransform(1,0,0,1,0,0);G.globalAlpha=a;G.fillStyle=col;n=n||40;const L=Math.hypot(V.W,V.H);
  for(let i=0;i<n;i++){const h1=hash(i+seed),h2=hash(i*7+seed),len=(.2+h2*.5)*L,w=(1+h1*3)*V.px;
    const off=((gameT*3.5*(1+h1)+h2)%1.4-.2);
    if(diry===0){const y=h1*V.H,x=(dirx>0?off:1-off)*V.W*1.4-len*.5;G.fillRect(x,y,len,w);}
    else{const x=h1*V.W,y=(diry>0?off:1-off)*V.H*1.4-len*.5;G.fillRect(x,y,w,len);}}
  G.restore();
}
function radialLines(cx,cy,col,a,inner,seed){
  X.save();X.globalAlpha=a;X.fillStyle=col;const R=Math.hypot(V.W,V.H);
  for(let i=0;i<60;i++){const an=i/60*TAU+hash(i+seed)*.1,w=.004+hash(i*3+seed)*.01,r0=inner*(1+hash(i*5+seed)*.6);
    X.beginPath();X.moveTo(cx+Math.cos(an-w)*R,cy+Math.sin(an-w)*R);X.lineTo(cx+Math.cos(an)*r0,cy+Math.sin(an)*r0);X.lineTo(cx+Math.cos(an+w)*R,cy+Math.sin(an+w)*R);X.fill();}
  X.restore();
}

/* ---------------- super flash (before an ultimate executes) ---------------- */
function superFlash(f){
  FLASH={f,t:0,d:.62};SFX.flash&&SFX.flash();hitstop=0;
  const h=CU.head(f);ring(h[0],h[1],f.ch.col,6,160,.5,6);sparks(h[0],h[1],30,f.ch.col,700,undefined,0,3,.5);

}
function updFlash(rdt){
  const F=FLASH;F.t+=rdt;const u=F.t/F.d,f=F.f;
  POST.tint=.72*Math.sin(Math.min(1,u)*PI);POST.tintC=mixC(f.ch.col,'#000000',.35);
  const h=CU.head(f),k=E.io(Math.sin(Math.min(1,u)*PI));
  fightCam(0,1);cam.x=lerp(cam.x,h[0],k*.5);cam.y=lerp(cam.y,h[1]+20,k*.35);cam.z*=1+k*.35;
  f.hot=1;updFX(rdt*.3);updCamFX(rdt);

}
function drawFlashOverlay(){
  const F=FLASH;if(!F)return;const u=F.t/F.d,f=F.f,h=CU.head(f),k=camK();
  const sx=V.W/2+(h[0]-cam.x)*k,sy=V.H/2+(h[1]-cam.y)*k,a=Math.sin(Math.min(1,u)*PI);
  X.save();X.globalCompositeOperation='lighter';X.globalAlpha=a*.9;
  const w=V.W*1.2*E.o(Math.min(1,u*3)),g=X.createLinearGradient(sx-w/2,0,sx+w/2,0);g.addColorStop(0,rgba(f.ch.col,0));g.addColorStop(.5,'#ffffff');g.addColorStop(1,rgba(f.ch.col,0));
  X.fillStyle=g;X.fillRect(sx-w/2,sy-1.5*V.px,w,3*V.px);X.globalAlpha=a*.5;X.fillStyle=rgba(f.ch.col,1);X.fillRect(sx-w/2,sy-8*V.px,w,16*V.px);X.restore();
}

/* ---------------- ultimate hand-off ---------------- */
function startUlt(a,d){
  const cut=CUTS[a.ch.id];if(!cut){return;}
  hitstop=0;const home={ax:a.x,dx:d.x,face:a.face};
  const C=cut(a,d);
  C.A=a;C.D=d;
  const dmg=C.dmg||320;
  C.done=()=>{
    // land the damage, put the victim on the floor, hand control back
    const dd=Math.round(dmg*a.ch.pow);d.hp=Math.max(0,d.hp-dd);d.redT=1.2;a.stats.dmg+=dd;a.combo=(a.combo||1)+(C.hits||8);a.comboDmg+=dd;a.comboT=1.5;
    a.stats.maxCombo=Math.max(a.stats.maxCombo,a.combo);
    const mid=clamp((home.ax+home.dx)/2,-ARENA+140,ARENA-140),s=home.face;
    a.x=mid-s*90;d.x=clamp(mid+s*170,-ARENA,ARENA);a.y=d.y=0;a.ry=d.ry=0;a.vx=a.vy=d.vx=d.vy=0;a.ground=d.ground=1;a.face=s;d.face=-s;
    a.st='idle';a.t=0;a.mv=null;blendTo(a,.2);a.pose=copyPose(a.P.stance);
    d.st=d.hp<=0?'ko':'down';d.t=0;d.downT=1.1;d.inv=1.2;d.mv=null;d.pose=copyPose(d.P.down);d.from=null;d.bt=0;
    for(const f of FTR){f.cloth={};f.eyeTr=[[],[]];f.wtr.length=0;f.lx=f.x;f.ly=f.y;}
    parts.length=0;effs.length=0;
    fightCam(0,1);POST.letter=0;
    if(d.hp<=0)onKO(a,d,{fromCine:1});
  };
  playCine(C);POST.letter=0;
}

/* =======================================================================
   ULTIMATE CUTSCENES — each is a short piece of choreography with real
   camera language: close-up, whip, wide, a slow-motion beat, a release.
   Durations are STORY time; slow shots run longer in real time.
   ======================================================================= */
const CUTS={};
/* helpers shared by the cuts */
function eyeFlare(g,f,a,len){if(!f.eyeTr[0].length)return;const e=f.eyeTr[0][0],col=f.ch.col;len=len||260;
  g.save();g.globalCompositeOperation='lighter';g.globalAlpha=a;const gr=g.createLinearGradient(e.x-len,0,e.x+len,0);gr.addColorStop(0,rgba(col,0));gr.addColorStop(.5,'#ffffff');gr.addColorStop(1,rgba(col,0));
  g.fillStyle=gr;g.fillRect(e.x-len,e.y-.6,len*2,1.2);g.globalAlpha=a*.5;g.fillStyle=col;g.fillRect(e.x-len*.6,e.y-3,len*1.2,6);g.drawImage(glowSprite(col),e.x-24,e.y-16,48,32);g.restore();}
function fly(f,dt,g,bounce){f.vy+=(g||2400)*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.y>0){f.y=0;if(bounce&&f.vy>200){f.vy*=-.3;f.vx*=.5;dust(f.x,10,0,1.2);SFX.land(.8);}else{f.vy=0;f.vx*=.8;}}}
/* hanging cuts: slashes that freeze in the air, then detonate */

/* =======================================================================
   AI — sees the world through a reaction delay, keeps its preferred range,
   blocks the right height, anti-airs, whiff-punishes and hit-confirms.
   It plays through the same input channel a human does.
   ======================================================================= */
const AIL=[
 {name:'NOVICE',react:.42,block:.2,aa:.08,punish:.15,combo:.25,aggr:.9,throwP:.03,ult:.3,tech:.05},
 {name:'FIGHTER',react:.28,block:.5,aa:.35,punish:.45,combo:.6,aggr:1.3,throwP:.08,ult:.7,tech:.2},
 {name:'MASTER',react:.19,block:.75,aa:.6,punish:.75,combo:.85,aggr:1.6,throwP:.12,ult:.9,tech:.45},
 {name:'SHADOW',react:.12,block:.9,aa:.82,punish:.92,combo:.96,aggr:1.9,throwP:.16,ult:1,tech:.7},
];
const PREF={ashen:190,vex:120,goliath:150,sol:110,morrow:360,grim:230,bolt:100,rin:240};
const ZONER={morrow:1,ashen:.4,sol:.5,rin:.35,goliath:.25,bolt:.3,vex:.3,grim:.15};
const _reach={};
function moveReach(ch,k){
  const key=ch.id+k;if(_reach[key]!==undefined)return _reach[key];
  const m=MOVES[ch.id][k];let best=0;
  if(m&&m.hits)for(const h of m.hits){const t=(h.t[0]+h.t[1])/2,f={ch,x:0,y:0,ry:0,face:1,P:poseSet(ch)};f.pose=clipPose(m,t,f);const r=clipRoot(m,t);
    if(h.seg==='path'){best=Math.max(best,(m.rm?m.rm[m.rm.length-1][1]:0)+40);continue;}
    for(const s of atkSegs(f,h))best=Math.max(best,Math.max(s[0],s[2])+s[4]+r[0]);}
  if(m&&m.on&&!m.hits)best=700;
  return _reach[key]=best;
}
function aiThink(f,dt){
  const o=opp(f),L=AIL[f.aiLvl||0],I=f.in;
  const ai=f.ai||(f.ai={hist:[],cool:.6,plan:null,pt:0,blockFor:null,decided:{},walkT:0,walkD:0});
  for(const k of['l','r','u','d','L','H','S','T','U','D'])I[k]=0;
  ai.hist.push({t:gameT,st:o.st,mk:o.mk,mt:o.mt,mv:o.mv,air:!o.ground,x:o.x,y:o.y,vy:o.vy,id:o.st==='move'?o.mk+'@'+(gameT-o.mt).toFixed(2):''});
  while(ai.hist.length>2&&gameT-ai.hist[1].t>L.react)ai.hist.shift();
  const seen=ai.hist[0];
  ai.cool-=dt;ai.pt-=dt;
  const dx=o.x-f.x,dist=Math.abs(dx),F=dx>0?'r':'l',B=dx>0?'l':'r';
  const press=(b,dir,dn)=>{I[b]=1;if(dir>0)I[F]=1;if(dir<0)I[B]=1;if(dn)I.d=1;};
  if(!GAME.fighting||f.st==='cine')return;
  // --- inside a move: hit-confirm into the next piece
  if(f.st==='move'){const m=f.mv;
    if(f.landed===1&&m.can&&f.mt>=m.can[0]&&!ai.decided[f.mk+f.t]){ai.decided[f.mk+f.t]=1;
      if(rnd()<L.combo){const k=f.mk;
        if(f.meter>=100&&rnd()<L.ult*.7&&o.st==='hit')press('U');
        else if(k==='L1'&&f.M.L2)press('L');else if(k==='L2'&&f.M.L3&&rnd()<.6)press('L');
        else if(k==='L2'||k==='L3'||k==='H'||k==='cL')press('S',rnd()<.5?1:0);
        else if(k==='cH'||k==='jH')press('S',1);}}
    return;}
  if(f.st==='air'){if(dist<170&&o.ground&&f.vy>-200&&rnd()<.5)press(rnd()<.6?'H':'L');else if(dist<150&&!o.ground&&rnd()<.3)press('L');return;}
  if(f.st==='block'||f.st==='hit'){if(o.st!=='move')I[B]=1;return;}
  if(f.st==='thrown'){if(f.thrT<.2&&rnd()<L.tech*dt*12)press('T');return;}
  if(f.st!=='idle'&&f.st!=='land')return;
  // --- defence: an attack we have perceived
  const oMove=seen.st==='move'&&seen.mv;
  if(oMove&&seen.mv.hits){const key=seen.id;
    if(ai.decided[key]===undefined)ai.decided[key]=rnd()<L.block;
    const reach=moveReach(o.ch,seen.mk);
    if(ai.decided[key]&&dist<reach+90){I[B]=1;const lvl=seen.mv.hits[0].lvl;if(lvl==='low'||(seen.mk[0]==='c'))I.d=1;return;}}
  // projectiles coming at us
  for(const p of PROJ)if(p.own===o&&Math.abs(p.x-f.x)<260&&Math.sign(p.vx||0)===Math.sign(f.x-p.x)){
    const k='p'+PROJ.indexOf(p)+p.kind;if(ai.decided[k]===undefined)ai.decided[k]=rnd();
    if(ai.decided[k]<L.block){I[B]=1;return;}if(ai.decided[k]<L.block+.15&&p.kind!=='thorns'){I.u=1;I[F]=1;return;}}
  // anti-air
  if(seen.air&&dist<230&&seen.vy>-300&&o.y<-60){const k='aa'+Math.round(seen.t*2);if(ai.decided[k]===undefined)ai.decided[k]=rnd()<L.aa;
    if(ai.decided[k]){press(rnd()<.6?'S':'H',rnd()<.6?-1:0);return;}}
  // punish recovery / knockdowns
  if(o.st==='move'&&o.mv.hits&&o.mt>o.mv.hits[o.mv.hits.length-1].t[1]+.02&&o.mv.d-o.mt>.12){
    const k='pn'+o.mk+o.t.toFixed(1);if(ai.decided[k]===undefined)ai.decided[k]=rnd()<L.punish;
    if(ai.decided[k]){if(f.meter>=100&&dist<moveReach(f.ch,'U')+20&&rnd()<L.ult){press('U');return;}
      if(dist<moveReach(f.ch,'L1')+10){press('L');return;}if(dist<moveReach(f.ch,'H')+10){press('H');return;}if(dist<moveReach(f.ch,'FS')+20){press('S',1);return;}}}
  // --- neutral
  const pref=PREF[f.ch.id]||180;
  if(ai.cool<=0){
    const r=rnd(),ag=L.aggr;ai.cool=rnd(.7,.25)/ag;
    const inL=dist<moveReach(f.ch,'L1')+14,inH=dist<moveReach(f.ch,'H')+10,inC=dist<moveReach(f.ch,'cH')+8;
    if(f.meter>=100&&o.st!=='down'&&dist<moveReach(f.ch,'U')+10&&r<.12*L.ult){press('U');return;}
    if(dist<70&&r<L.throwP*4){press('T');return;}
    if(o.st==='down'||o.st==='getup'){ai.walkT=.3;ai.walkD=dist>pref?1:0;return;}
    if(inL&&r<.35){press('L',0,rnd()<.3);return;}
    if(inH&&r<.55){press('H',rnd()<.25?1:0);return;}
    if(inC&&r<.65){press('H',0,1);return;}
    if(dist>pref+60&&r<.2+ZONER[f.ch.id]*.5&&f.M.S&&(f.ch.id==='morrow'||f.ch.id==='ashen'||f.ch.id==='sol'||f.ch.id==='vex'||f.ch.id==='rin'||f.ch.id==='goliath'||f.ch.id==='bolt')){press('S');return;}
    if(dist>pref+40&&dist<moveReach(f.ch,'FS')+40&&r<.72){press('S',1);return;}
    if(dist>140&&dist<360&&r<.8){I.u=1;I[F]=1;return;}
    ai.walkT=rnd(.5,.15);ai.walkD=dist>pref+20?1:dist<pref-30?-1:(rnd()<.5?1:-1);
    if(ai.walkD>0&&dist>pref+160&&rnd()<.3)press('D',1);
    if(ai.walkD<0&&rnd()<.15)press('D',-1);
  }
  if(ai.walkT>0){ai.walkT-=dt;if(ai.walkD>0)I[F]=1;else if(ai.walkD<0)I[B]=1;}
}

const PADS=[{},{}],PADPREV=[{},{}];
function readPads(){
  const ps=navigator.getGamepads?[...navigator.getGamepads()].filter(Boolean):[];
  for(let i=0;i<2;i++){const p=ps[i],o={};if(p){const b=k=>p.buttons[k]&&p.buttons[k].pressed,ax=p.axes[0]||0,ay=p.axes[1]||0;
      o.l=b(14)||ax<-.45;o.r=b(15)||ax>.45;o.u=b(12)||ay<-.55||b(0);o.d=b(13)||ay>.55;o.L=b(2);o.H=b(3);o.S=b(1);o.T=b(5);o.U=b(7)||b(6);o.D=b(4);o.P=b(9);o.A=b(0);o.B=b(1);o.mu=b(12)||ay<-.55;o.md=b(13)||ay>.55;}
    PADPREV[i]=PADS[i];PADS[i]=o;}
}
const padHit=(i,k)=>PADS[i][k]&&!PADPREV[i][k];
function keyIn(map){const o={};for(const k in map)o[k]=map[k].some(c=>KEYS.has(c))?1:0;return o;}
function humanInput(f,idx){
  const pvp=GAME.mode==='pvp',k=keyIn(idx===0?K1:K2);
  if(idx===0&&!pvp){const k2=keyIn(K2);for(const q in k2)k[q]=k[q]||k2[q];}
  const pad=PADS[idx]||{};for(const q in k)k[q]=k[q]||(pad[q]?1:0);
  Object.assign(f.in,k);
}
/* menu navigation: any device */
function nav(){
  const r={up:0,down:0,left:0,right:0,ok:0,back:0,pause:0,p2ok:0};
  for(const c of PRESS){if(c==='KeyW'||c==='ArrowUp')r.up=1;if(c==='KeyS'||c==='ArrowDown')r.down=1;if(c==='KeyA'||c==='ArrowLeft')r.left=1;if(c==='KeyD'||c==='ArrowRight')r.right=1;
    if(c==='Enter'||c==='KeyJ'||c==='Space'||c==='NumpadEnter')r.ok=1;if(c==='Escape'||c==='KeyK'||c==='Backspace')r.back=1;if(c==='Escape'||c==='KeyP')r.pause=1;}
  for(let i=0;i<2;i++){if(padHit(i,'mu'))r.up=1;if(padHit(i,'md'))r.down=1;if(padHit(i,'l'))r.left=1;if(padHit(i,'r'))r.right=1;if(padHit(i,'A')||padHit(i,'L'))r.ok=1;if(padHit(i,'B'))r.back=1;if(padHit(i,'P'))r.pause=1;}
  return r;
}

function resetRound(full){

function beginRoundCall(){

  later(1.25,()=>{GAME.ann={txt:'FIGHT',t:0,d:.7,big:true};SFX.slash(.8);GAME.fighting=true;GAME.phase='fight';});
}
function onKO(a,d,H){
  if(GAME.demo){GAME.fighting=false;later(2.2,()=>demoReset());GAME.slow=.3;later(.9,()=>GAME.slow=1);return;}
  if(GAME.mode==='train'){d.hp=1;return;}
  if(GAME.phase==='ko')return;
  GAME.fighting=false;GAME.phase='ko';GAME.koT=0;GAME.koWin=a;GAME.koLose=d;CALL.length=0;
  d.downT=99;SFX.ko();shake(18);
  if(d.st==='down')setSt(d,'ko',.05);else if(d.ground&&d.st!=='ko'){d.st='hit';d.t=0;d.ground=0;d.y=-1;d.vy=-520;d.vx=(sgn(d.x-a.x)||a.face)*280;d.kd=1;d.mv=null;}
  if(!H||!H.fromCine){GAME.slow=.18;POST.imp={bg:'#ffffff',ink:'#000000'};setTimeout(()=>{POST.imp={bg:'#000000',ink:'#ffffff'};},50);setTimeout(()=>{POST.imp=null;},100);}
  later(.55,()=>{GAME.slow=1;});
  later(.25,()=>{GAME.ann={txt:'K.O.',t:0,d:1.6,big:true,col:a.ch.col};});
  later(2.1,()=>{a.wins++;if(a.st!=='ko'&&a.hp>0){setSt(a,'win',.2);}
    later(1.4,()=>{if(a.wins>=2)endMatch(a);else{GAME.round++;resetRound(false);beginRoundCall();}});});
}
function timeOver(){
  GAME.fighting=false;GAME.phase='ko';const [a,b]=FTR,ra=a.hp/a.hpMax,rb=b.hp/b.hpMax;
  GAME.ann={txt:'TIME',t:0,d:1.4,big:true};
  later(1.6,()=>{if(Math.abs(ra-rb)<.001){GAME.ann={txt:'DRAW',t:0,d:1.2,big:false};later(1.4,()=>{GAME.round++;resetRound(false);beginRoundCall();});return;}
    const w=ra>rb?a:b;w.wins++;setSt(w,'win',.2);later(1.4,()=>{if(w.wins>=2)endMatch(w);else{GAME.round++;resetRound(false);beginRoundCall();}});});
}

/* ---------------- training ---------------- */
function dummyThink(f,dt){const I=f.in,o=opp(f);for(const k of['l','r','u','d','L','H','S','T','U','D'])I[k]=0;
  const B=o.x>f.x?'l':'r',m=TRAIN.dummy;
  if(m===1)I.d=1;else if(m===2){if(o.st==='move'||PROJ.length){I[B]=1;if(o.st==='move'&&o.mv.hits&&o.mv.hits[0].lvl==='low')I.d=1;}}
  else if(m===3){if(f.st==='idle'&&rnd()<dt*1.5)I.u=1;}else if(m===4)aiThink(f,dt);
  // recover health between combos
  if(f.st==='idle'&&o.st!=='move'){TRAIN.idleT+=dt;if(TRAIN.idleT>1){f.hp=Math.min(f.hpMax,f.hp+f.hpMax*dt*2);f.red=f.hp;}}else TRAIN.idleT=0;
  if(o.combo>0)TRAIN.last={hits:o.combo,dmg:o.comboDmg};
  if(TRAIN.meter)FTR[0].meter=100;f.hp=Math.max(1,f.hp);}

/* ---------------- per-frame fight step ---------------- */
function stepFight(rdt){
  if(CINE){updCine(rdt);if(CINE)renderCine(rdt);else renderWorld(0,FTR);return;}
  if(FLASH){updFlash(rdt);renderWorld(0,FTR);drawFlashOverlay();if(!GAME.demo)drawHud();return;}
  const dt=rdt*GAME.slow;
  FTR.forEach((f,i)=>{if(f.ctrl==='human')humanInput(f,i);else if(f.ctrl==='cpu')aiThink(f,dt);else if(f.ctrl==='dummy')dummyThink(f,dt);pollInput(f);});
  if(hitstop>0){hitstop-=rdt;for(const f of FTR){if(f.shk>0)f.shk-=rdt;}updFX(dt*.15);}
  else{gameT+=dt;for(const f of FTR)updFighter(f,dt);resolvePush(dt);updProj(dt);tickTimers(dt);
    for(const f of FTR)animFighter(f,dt);updFX(dt);}
  // turn keeps facing sane mid-throw etc.
  if(STG)updStage(dt);updCamFX(rdt);
  fightCam(rdt);
  if(GAME.phase==='ko'&&GAME.koLose&&!GAME.demo){GAME.koT+=rdt;const L=GAME.koLose,u=E.io(clamp(GAME.koT/.7,0,1)*clamp((2.6-GAME.koT)/.8,0,1));
    const z=FC.z*(1+.3*u),k=V.k0*z;cam.z=z;cam.x=lerp(FC.x,L.x,.55*u);cam.y=lerp(FC.y,-(V.H*.32)/k+(L.y+L.ry)*.5,u);}
  if(GAME.fighting&&GAME.mode!=='train'&&!GAME.demo){GAME.timer-=dt;if(GAME.timer<=0){GAME.timer=0;timeOver();}}
  renderWorld(hitstop>0?0:dt,FTR);
  if(!GAME.demo)drawHud();
}

    if(s===0)GAME.paused=false;else if(s===1){GAME.paused=false;startMatch(FTR[0].ch,FTR[1].ch,STG.id,GAME.mode);}
    else if(s===2){GAME.paused=false;GAME.scene='select';PICK.step=0;PICK.l1=PICK.l2=false;ambStop();musStop();}
    else if(s===3){GAME.paused=false;GAME.scene='title';MENU.sel=0;FTR=[];ambStop();musStop();}
    else if(s===4)auMute();else if(s===5)AU.music=!AU.music;}
}
function sceneResults(rdt){
  const w=GAME.winner,l=opp(w);gameT+=rdt;
  w.st='win';w.pose=breathe(w,w.P.win);l.st='ko';l.pose=l.P.down;cam.x=w.x+60*w.face;cam.z=1.3;cam.y=-(V.H*.32)/camK()-40;cam.roll=0;
  updFX(rdt);if(STG)updStage(rdt);renderWorld(rdt,FTR);
  const S=US();X.setTransform(1,0,0,1,0,0);const g=X.createLinearGradient(0,0,V.W*.6,0);g.addColorStop(0,'rgba(0,0,0,.8)');g.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=g;X.fillRect(0,0,V.W,V.H);
  txt(GAME.mode==='pvp'?(w.side?'PLAYER 2':'PLAYER 1'):(w.side?'DEFEAT':'VICTORY'),V.W*.08,V.H*.2,11,{w:600,track:2,c:w.ch.col});
  txt(w.ch.name,V.W*.08,V.H*.2+46*S,48,{w:200,track:1});
  txt('DAMAGE  '+w.stats.dmg,V.W*.08,V.H*.2+80*S,10,{w:500,track:2,c:'#aaa'});txt('BEST COMBO  '+w.stats.maxCombo,V.W*.08,V.H*.2+96*S,10,{w:500,track:2,c:'#aaa'});
  const items=['REMATCH','CHARACTER SELECT','TITLE'];menuItems(items,V.W*.08,V.H*.58,13,30,'left');hoverMenu();
  const nv=nav();if(nv.up)MENU.sel=(MENU.sel+2)%3;if(nv.down)MENU.sel=(MENU.sel+1)%3;
  if(nv.ok||clickMenu()){SFX.pick();if(MENU.sel===0)startMatch(FTR[0].ch,FTR[1].ch,STG.id,GAME.mode);else if(MENU.sel===1){GAME.scene='select';PICK.step=0;PICK.l1=PICK.l2=false;ambStop();musStop();}else{GAME.scene='title';MENU.sel=0;FTR=[];ambStop();musStop();}}
}

/* ---------------- loop ---------------- */
let lastT=performance.now(),FPS={n:0,t:0,v:60};
function frame(now){
  const rdt=Math.min(.05,Math.max(0,(now-lastT)/1000));lastT=now;FPS.n++;FPS.t+=rdt;if(FPS.t>=1){FPS.v=FPS.n/FPS.t;FPS.n=0;FPS.t=0;}
  readPads();
  if(!QUAL.lock&&!document.hidden&&rdt>0){QUAL.ema=lerp(QUAL.ema,rdt,.04);if(QUAL.ema>1/38){QUAL.t+=rdt;if(QUAL.t>2.2&&QUAL.lvl<QUAL.scale.length-1){QUAL.lvl++;QUAL.t=0;QUAL.ema=1/50;resize();}}else QUAL.t=Math.max(0,QUAL.t-rdt);}
  if(PRESS.includes('KeyM'))auMute();
  try{
    if(GAME.scene==='title')sceneTitle(rdt);else if(GAME.scene==='select')sceneSelect(rdt);else if(GAME.scene==='fight')sceneFight(rdt);else if(GAME.scene==='results')sceneResults(rdt);
  }catch(e){console.error(e);}
  PRESS.length=0;MOUSE.click=0;
  requestAnimationFrame(frame);
}
addEventListener('resize',resize);resize();
if(!window.__NOLOOP)requestAnimationFrame(frame);
</script>
