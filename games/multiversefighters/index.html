<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MULTIVERSE — Fighters</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05060c;overflow:hidden;
    font-family:"Segoe UI",Inter,system-ui,sans-serif;color:#e8ecff;
    -webkit-font-smoothing:antialiased;user-select:none}
  canvas{display:block}
  #game{position:fixed;inset:0}

  /* ---------- SELECT SCREEN ---------- */
  #select{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
    background:radial-gradient(140% 100% at 50% -10%,#1b2450 0%,#0a0c1c 45%,#04050b 100%);}
  #select.hide{display:none}
  #select::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:
      repeating-linear-gradient(115deg,rgba(120,160,255,.035) 0 2px,transparent 2px 9px),
      radial-gradient(60% 50% at 50% 0%,rgba(120,80,255,.28),transparent 70%);}
  .head{position:relative;padding:18px 34px 8px;display:flex;align-items:flex-end;gap:18px}
  .logo{font-size:40px;font-weight:900;letter-spacing:12px;line-height:1;
    background:linear-gradient(180deg,#fff 0%,#9fd0ff 45%,#6c7bff 75%,#c86bff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(120,140,255,.55))}
  .sub{font-size:11px;letter-spacing:5px;color:#7f8cc4;padding-bottom:8px;text-transform:uppercase}
  .body{position:relative;flex:1;display:flex;gap:26px;padding:6px 34px 26px;min-height:0}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:12px;flex:1;min-width:0}
  .card{position:relative;border-radius:14px;cursor:pointer;overflow:hidden;
    background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015));
    border:1px solid rgba(255,255,255,.09);transition:transform .12s,border-color .12s,box-shadow .12s;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px}
  .card canvas{position:absolute;top:2px;left:50%;transform:translateX(-50%)}
  .card .nm{position:relative;font-size:12px;font-weight:800;letter-spacing:2.2px;z-index:2}
  .card .un{position:relative;font-size:8.5px;letter-spacing:1.6px;color:#8f9ad0;z-index:2;text-transform:uppercase}
  .card .glow{position:absolute;inset:0;opacity:.28;
    background:radial-gradient(75% 60% at 50% 78%,var(--c) 0%,transparent 70%)}
  .card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.28)}
  .card.sel{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 10px 34px -8px var(--c);transform:translateY(-4px)}
  .card.sel .glow{opacity:.55}

  .panel{width:400px;flex:none;border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;
    background:linear-gradient(180deg,rgba(12,16,38,.9),rgba(6,8,20,.92));
    border:1px solid rgba(255,255,255,.1);box-shadow:0 24px 60px -20px #000}
  #prev{border-radius:12px;background:radial-gradient(70% 70% at 50% 65%,rgba(255,255,255,.07),transparent 70%);align-self:center}
  .pname{font-size:29px;font-weight:900;letter-spacing:4px;margin-top:2px}
  .puni{font-size:10px;letter-spacing:3.4px;color:#8f9ad0;text-transform:uppercase;margin-bottom:10px}
  .stat{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:9.5px;letter-spacing:1.6px;color:#98a3d8}
  .stat b{width:56px;font-weight:600}
  .bar{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--c),#fff)}
  .moves{margin-top:10px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;min-height:0;flex:1;padding-right:4px}
  .moves::-webkit-scrollbar{width:5px}.moves::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
  .mv{display:flex;gap:8px;align-items:center;font-size:10.5px;padding:4px 7px;border-radius:7px;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06)}
  .mv kbd{font:700 9px/1 ui-monospace,monospace;padding:4px 5px;border-radius:5px;min-width:34px;text-align:center;flex:none;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#dfe6ff}
  .mv span{color:#b9c2ea}
  .mv.sp{background:rgba(120,160,255,.10);border-color:rgba(140,170,255,.28)}
  .mv.ult{background:linear-gradient(90deg,rgba(255,90,60,.22),rgba(255,200,60,.08));border-color:rgba(255,150,70,.4)}
  .mv.ult span{color:#ffd9a8;font-weight:800;letter-spacing:1px}
  .oppline{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:9px;letter-spacing:1.8px;color:#98a3d8}
  .oppline b{font-weight:600;flex:none}
  .oppline span{flex:1;text-align:center;font-weight:800;font-size:11px;letter-spacing:2.4px;color:#e8ecff}
  .oppline button{width:22px;height:22px;border-radius:6px;cursor:pointer;flex:none;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#dfe6ff;font:700 13px/1 inherit}
  .oppline button:hover{background:rgba(255,255,255,.18)}
  .diffrow{display:flex;gap:4px;margin-top:8px}
  .diffrow button{flex:1;padding:7px 2px;border-radius:7px;cursor:pointer;font:800 8.5px/1 inherit;
    letter-spacing:1px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#98a3d8}
  .diffrow button:hover{background:rgba(255,255,255,.14);color:#e8ecff}
  .diffrow button.on{background:linear-gradient(180deg,#ff9a3d,#ff3d5a);border-color:transparent;color:#1a0c12}
  .diffrow button.on:first-child{background:linear-gradient(180deg,#8fa4cc,#5a6a8a);color:#0b0e18}
  .difftag{margin-top:5px;font-size:9px;letter-spacing:.6px;color:#7f8cc4;min-height:22px;line-height:1.35}
  .go{margin-top:auto;padding:13px;border:none;border-radius:11px;cursor:pointer;font:900 15px/1 inherit;
    letter-spacing:6px;color:#07091a;background:linear-gradient(90deg,#7ce0ff,#8f7bff,#ff7bd2);
    box-shadow:0 10px 30px -8px #6f7bff}
  .go:hover{filter:brightness(1.12)}
  .hint{text-align:center;font-size:9.5px;letter-spacing:2px;color:#6a74a8;margin-top:8px}
  @media(max-width:1080px){.panel{width:320px}.logo{font-size:30px;letter-spacing:8px}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="select">
  <div class="head">
    <div class="logo">MULTIVERSE</div>
    <div class="sub">Fighters &nbsp;·&nbsp; Training Grounds</div>
  </div>
  <div class="body">
    <div class="grid" id="grid"></div>
    <div class="panel">
      <canvas id="prev" width="360" height="230"></canvas>
      <div class="pname" id="pname"></div>
      <div class="puni" id="puni"></div>
      <div class="stat"><b>POWER</b><div class="bar"><i id="s1"></i></div></div>
      <div class="stat"><b>SPEED</b><div class="bar"><i id="s2"></i></div></div>
      <div class="stat"><b>RANGE</b><div class="bar"><i id="s3"></i></div></div>
      <div class="moves" id="moves"></div>
      <div class="oppline"><b>OPPONENT</b><button id="oppPrev">&lsaquo;</button><span id="oppName">RANDOM</span><button id="oppNext">&rsaquo;</button></div>
      <div class="diffrow" id="diffrow"></div>
      <div class="difftag" id="difftag"></div>
      <button class="go" id="go">FIGHT</button>
      <div class="hint">A·D move   SPACE double-jump   W·S aim   SHIFT dash / air-dash   TAB movelist</div>
    </div>
  </div>
</div>

/* ---------------- math + color utils ---------------- */
const TAU=Math.PI*2, rnd=(a=1,b=0)=>b+Math.random()*(a-b), rint=n=>0|(Math.random()*n);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function hx(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function shade(c,k){const[r,g,b]=hx(c);const f=v=>clamp(Math.round(k<0?v*(1+k):v+(255-v)*k),0,255);
  return`rgb(${f(r)},${f(g)},${f(b)})`;}
function rgba(c,a){const[r,g,b]=hx(c);return`rgba(${r},${g},${b},${a})`;}

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth;H=innerHeight;GY=Math.round(H*.84);
  CV.width=W*DPR|0;CV.height=H*DPR|0;CV.style.width=W+'px';CV.style.height=H+'px';
}
function onResize(){
  resize();
  if(!W||!H||!pl.ch)return;                 // keep the fight valid across viewport changes
  for(const f of[pl,dum]){f.x=clamp(f.x,60,W-60);if(f.onG||f.y>GY)f.y=GY;}
  dum.home=clamp(dum.home||W*.68,90,W-90);

}

/* cam.zoom is the CINEMATIC multiplier (ultimates); cam.z is the dynamic
   action zoom driven by how far apart the fighters are. zz is the product. */
const cam={sh:0,zoom:1,z:1,zz:1,cx:0,cy:0,kick:0,flash:0,flashC:'#fff',dark:0,letter:0,slow:1};
function updCamera(rdt){
  let fx,fy,tz;
  if(koT>0&&koWho){fx=koWho.x;fy=koWho.y-72;tz=1.95;}
  else{
    const sep=Math.abs(pl.x-dum.x), top=Math.min(pl.y,dum.y)-118, bot=GY+10;
    fx=(pl.x+dum.x)/2;
    fy=(top+bot)/2-6;
    tz=clamp(Math.min(W/(sep+335),H/((bot-top)+210)),1.05,2.15);
    if(ult)tz=Math.min(tz,1.25);              // pull back so ultimates read
  }
  cam.z=lerp(cam.z,tz,rdt*3.4);
  cam.kick=Math.max(0,cam.kick-rdt*3.6);
  const z=cam.zz=cam.z*cam.zoom*(1+cam.kick);
  const hw=(W/2)/z, hh=(H/2)/z, top=-150, bot=H;
  cam.cx=lerp(cam.cx,clamp(fx,hw,Math.max(hw,W-hw)),rdt*6.5);
  cam.cy=lerp(cam.cy,(top+hh>bot-hh)?(top+bot)/2:clamp(fy,top+hh,bot-hh),rdt*5.5);
}
function camReset(){cam.z=cam.zz=1;cam.zoom=1;cam.kick=0;cam.cx=W/2;cam.cy=H/2;}

       e=TILT[C.id][i];t=TLT_T[i];k=TLT_K[i];fast=!HEAVYSLOT[kind];}

    d:pick(o.d,t[0])/(fast?C.spd:1),a:pick(o.a,t[1]),r:pick(o.r,t[2]),

// Smash-style resolution: direction held + button -> which move comes out
function resolveAtk(f,btn,inp){
  const air=!f.onG, dn=inp.d, up=inp.u;
  if(air) return (btn==='k'||dn)?'ak':'aj';
  if(dn)  return btn==='j'?'dl':'dh';
  if(up)  return btn==='j'?'ul':'uh';
  return btn==='j'?(f.chain===1?'l2':f.chain===2?'l3':'l1'):'h';
}

function bolt(x1,y1,x2,y2,col){

  for(let i=1;i<n;i++)pts.push([lerp(x1,x2,i/n)+rnd(34,-34),lerp(y1,y2,i/n)+rnd(18,-18)]);
  pts.push([x2,y2]);
  effs.push({t:0,l:.22,d(c,p){c.globalAlpha=(1-p);c.lineJoin='round';
    c.strokeStyle=col;c.lineWidth=9;c.shadowBlur=26;c.shadowColor=col;
    c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(const q of pts)c.lineTo(q[0],q[1]);c.stroke();
    c.strokeStyle='#fff';c.lineWidth=3;c.stroke();c.shadowBlur=0;}});
}

// generalised swing arc — rot aims it, span widens it, r0/r1 set the sweep radius
function crescent(x,y,dir,col,sc,rot,span,life,r0,r1,wid){
  span=span||1.1;life=life||.22;r0=r0||28;r1=r1||86;wid=wid||16;
  effs.push({t:0,l:life,d(c,p){c.save();c.translate(x,y);c.scale(dir,1);c.rotate(rot);c.scale(sc,sc);
    const a=1-p, r=lerp(r0,r1,ease(p));

    c.beginPath();c.arc(0,0,r,-span,span);c.stroke();

/* ---------------- ultimate ---------------- */
function startUlt(){
  if(pl.meter<100||ult)return;
  pl.meter=0;pl.st='ult';pl.t=0;pl.vx=0;
  const u=CH.ult;
  ult={t:0,dur:u.k==='rush'||u.k==='rain'?3.3:3.0,k:u.k,c:u.c,c2:u.c2,n:u.n,dmg:u.dmg,hitI:0,done:[]};
  cam.slow=.35;flash('#fff',.5);shake(10);
}
function ultTick(dt){
  const u=ult,p=u.t/u.dur;
  u.t+=dt;
  const cm=ULTCAM[u.k]||ULTCAM._;
  cam.letter=lerp(cam.letter,p>.92?0:1,dt*8);
  cam.dark=lerp(cam.dark,p<.34?cm.dark:(p<.42?.2:.34),dt*9);
  cam.zoom=lerp(cam.zoom,p<.34?cm.zoom:1.06,dt*6);
  cam.slow=lerp(cam.slow,p<.32?cm.slow:(p<.4?1.15:1),dt*5);
  if(p<.34){                                  // each ultimate stages its own wind-up
    pl.face=dum.x>pl.x?1:-1;
    (CHARGE[u.k]||CHARGE.clones)(u,Math.min(1,p/.34),dt);
  }
  const dmgTick=(f,n)=>{ // deal fraction f of ult damage, n = index guard
    if(u.done[n])return;u.done[n]=1;
    dealDmg(u.dmg*f,u.c,true);
  };
  (ULT[u.k]||ULT.clones)(u,p,dt,dmgTick);
  if(u.t>=u.dur){
    ult=null;pl.st='idle';pl.t=0;cam.zoom=1;cam.dark=0;cam.letter=0;cam.slow=1;
    pl.spinX=0;pl.y=GY;pl.vy=0;pl.onG=true;pl.jumps=1;pl.airDash=1;
  }
}

  for(let i=0;i<16;i++)pt(x+rnd(60,-60),y+rnd(60,-60),rnd(90,-90),rnd(-40,-160),rnd(1.2,.6),rnd(50,24),'#20242f','smoke',-40);

/* ======================= ULTIMATES =======================
   One handler each — no two share a presentation. Signature (u, p, dt, dmgTick)
   where p is 0..1 through the cinematic; p < .34 is the charge window.        */
function once(u,k,fn){if(u.done[k])return false;u.done[k]=1;fn();return true;}
function step(u,p,from,span,n,fn,key){ // fire fn(i) once per slice of the window
  if(p<from||p>from+span)return;
  const i=Math.floor((p-from)/span*n), k=(key||'s')+i;
  if(!u.done[k]){u.done[k]=1;fn(i);}
}

const ULT={

/* KAGE — a ring of clones collapses inward, then one spiral orb finishes it */
clones(u,p,dt,dmgTick){
  if(p>.30&&p<.86){
    step(u,p,.30,.56,10,i=>{
      const a=i*TAU/10+.3, r=190;
      const gx=dum.x+Math.cos(a)*r, gy=GY-Math.abs(Math.sin(a))*150;
      pl.ghost.push({x:gx,y:gy,l:.34,m:.34,pose:i%2?'punch_s':'spinkick_s',face:gx<dum.x?1:-1});
      for(let j=0;j<3;j++)pt(gx,gy-60,(dum.x-gx)*2.6,(dum.y-70-gy)*2.6,.24,rnd(7,4),u.c,'spark',0);
      crescent(dum.x,dum.y-60-rnd(40,-20),gx<dum.x?1:-1,u.c2,.9,rnd(1.5,-1.5),1.3,.18,18,70,9);
      dealDmg(u.dmg/14,u.c,false);shake(6);hitstop=.025;dum.wobV+=(dum.x>gx?1:-1)*4;});
  }
  if(p>.62)once(u,'orb',()=>{pl.x=dum.x-pl.face*120;});
  if(p>.62&&p<.93){ // the spiral builds in his palm
    const cx=pl.x+pl.face*46,cy=pl.y-74,g=(p-.62)/.31;
    effs.push({t:0,l:.06,d(c,q){c.save();c.translate(cx,cy);c.globalAlpha=.9;
      const R=18+g*34;
      const gr=c.createRadialGradient(0,0,2,0,0,R);
      gr.addColorStop(0,'#fff');gr.addColorStop(.45,u.c2);gr.addColorStop(1,rgba(u.c,0));
      c.fillStyle=gr;c.beginPath();c.arc(0,0,R,0,TAU);c.fill();
      c.strokeStyle=rgba('#ffffff',.85);c.lineWidth=3;
      for(let k=0;k<3;k++){c.beginPath();
        for(let t2=0;t2<3.2;t2+=.25){const ang=t2*2.4+T*16+k*2.1;
          c.lineTo(Math.cos(ang)*t2/3.2*R,Math.sin(ang)*t2/3.2*R);}c.stroke();}c.restore();}});
    if(Math.random()<.8){const a=rnd(TAU),r=rnd(120,60);
      pt(cx+Math.cos(a)*r,cy+Math.sin(a)*r,-Math.cos(a)*r*3,-Math.sin(a)*r*3,.3,rnd(6,3),u.c,'orb',0);}
  }
  if(p>.93)once(u,'fin',()=>{pl.x=dum.x-pl.face*70;
    bigImpact(dum.x,dum.y-70,u.c,u.c2);dealDmg(u.dmg*.36,u.c,true);
    for(let k=0;k<3;k++)ring(dum.x,dum.y-70,rgba(u.c2,.9),30,300+k*90,.6,18);});
},

/* REIKA — one colossal descending crescent that splits the screen */
moonfang(u,p,dt,dmgTick){
  if(p<.34&&Math.random()<.5){const a=rnd(TAU);
    pt(pl.x+Math.cos(a)*160,pl.y-70+Math.sin(a)*130,-Math.cos(a)*300,-Math.sin(a)*300,.4,rnd(8,3),u.c,'shard',0);}
  if(p>.20)once(u,'moon',()=>{ // a moon rises behind the arena
    effs.push({t:0,l:2.2,d(c,q){c.globalAlpha=(1-Math.abs(q-.5)*1.6)*.6;
      const my=lerp(GY*.8,GY*.34,Math.min(1,q*3));
      const g=c.createRadialGradient(W*.5,my,10,W*.5,my,190);
      g.addColorStop(0,rgba('#ffffff',.9));g.addColorStop(.5,rgba(u.c,.5));g.addColorStop(1,rgba(u.c,0));
      c.fillStyle=g;c.beginPath();c.arc(W*.5,my,190,0,TAU);c.fill();}});});
  if(p>.42)once(u,'cut',()=>{
    const dir=pl.face;
    effs.push({t:0,l:1.0,d(c,q){const r=lerp(80,W*1.25,ease(Math.min(1,q*1.5)));
      c.save();c.translate(pl.x,pl.y-70);c.scale(dir,1);c.rotate(-.5+q*.5);
      c.globalAlpha=(1-q)*.95;c.strokeStyle=u.c;c.lineWidth=165*(1-q*.6);c.shadowBlur=70;c.shadowColor=u.c;
      c.beginPath();c.arc(0,0,r,-.9,.9);c.stroke();
      c.strokeStyle='#fff';c.lineWidth=58*(1-q*.7);c.beginPath();c.arc(0,0,r,-.72,.72);c.stroke();c.restore();}});
    for(let i=0;i<90;i++)pt(pl.x+dir*rnd(320,20),pl.y-70+rnd(230,-230),dir*rnd(1500,400),rnd(-220,220),
      rnd(.9,.3),rnd(10,3),i%3?u.c:'#fff',i%4?'spark':'shard',0);
    flash(u.c,.55);shake(28);dealDmg(u.dmg*.55,u.c,true);});
  if(p>.55)step(u,p,.55,.3,6,()=>{dealDmg(u.dmg*.075,u.c,false);shake(5);});
},

/* VANTA — the lights go out; you only see the cuts landing */
blackout(u,p,dt,dmgTick){
  cam.dark=lerp(cam.dark,p>.28&&p<.88?.96:.3,dt*7);
  if(p>.30&&p<.86){
    const ex=dum.x+Math.cos(p*19)*150, ey=dum.y-110+Math.sin(p*13)*60;
    effs.push({t:0,l:.05,d(c){c.globalAlpha=.95;c.fillStyle=u.c;c.shadowBlur=20;c.shadowColor=u.c;
      c.beginPath();c.ellipse(ex-9,ey,6,2.6,-.2,0,TAU);c.fill();
      c.beginPath();c.ellipse(ex+9,ey,6,2.6,.2,0,TAU);c.fill();}});
    step(u,p,.30,.56,11,i=>{
      const side=i%2?1:-1,hy=dum.y-40-rnd(110,0);
      crescent(dum.x,hy,side,'#ffffff',1.15,rnd(1.6,-1.6),1.25,.16,20,110,11);
      burst(dum.x,hy,7,u.c,300,3,'spark',0);
      dealDmg(u.dmg/14,u.c,false);shake(6);hitstop=.03;dum.wobV+=side*5;flash(u.c,.06);});
  }
  if(p>.88)once(u,'lights',()=>{ // lights slam back on
    pl.x=dum.x-pl.face*72;flash('#ffffff',.75);
    bigImpact(dum.x,dum.y-64,u.c,'#ffffff');dealDmg(u.dmg*.3,u.c,true);});
},

/* AEGIS — shield charge across the arena, disc ricochets off both walls */
charge(u,p,dt,dmgTick){
  if(p>.32&&p<.74){
    const q=(p-.32)/.42, from=dum.x-260*pl.face, to=dum.x+150*pl.face;
    pl.x=lerp(from,to,ease(q));
    if(Math.random()<.9){pl.ghost.push({x:pl.x,y:pl.y,l:.22,m:.22,pose:'tackle_s',face:pl.face});
      pt(pl.x-pl.face*30,GY,-pl.face*rnd(300,80),-rnd(220,40),.5,rnd(9,4),u.c2,'shard',700);}
    step(u,p,.32,.42,7,()=>{dealDmg(u.dmg/12,u.c,false);shake(8);
      ring(pl.x,pl.y-70,rgba(u.c,.8),12,90,.25,7);},'ch');
    shake(4);
  }
  if(p>.42)step(u,p,.42,.44,5,i=>{ // the disc bounces wall to wall
    const y=dum.y-70-rnd(50,-30), sx=i%2?0:W, ex=i%2?W:0;
    effs.push({t:0,l:.34,d(c,q){c.save();c.translate(lerp(sx,ex,q),y);c.rotate(q*34);
      c.globalAlpha=1-q*.4;c.strokeStyle=u.c;c.lineWidth=6;c.shadowBlur=24;c.shadowColor=u.c;
      c.beginPath();c.arc(0,0,20,0,TAU);c.stroke();
      c.fillStyle='#f2f5ff';c.beginPath();c.arc(0,0,12,0,TAU);c.fill();
      c.fillStyle=u.c;c.beginPath();c.arc(0,0,6,0,TAU);c.fill();c.restore();}});
    setTimeout(()=>{if(!ult)return;dealDmg(u.dmg/13,u.c,false);
      elementFX('holy',dum.x,y,1,12);shake(7);},170);},'dc');
  if(p>.9)once(u,'fin',()=>{pl.x=dum.x-pl.face*80;
    bigImpact(dum.x,dum.y-70,u.c,u.c2);dealDmg(u.dmg*.28,u.c,true);});
},

/* PYRA — the sky reddens, one huge meteor lands, the ground keeps burning */
meteor(u,p,dt,dmgTick){
  if(p>.2){effs.push({t:0,l:.05,d(c){c.globalAlpha=Math.min(.5,(p-.2)*2)*(p>.9?(1-p)*10:1);
    const g=c.createLinearGradient(0,0,0,GY);g.addColorStop(0,rgba(u.c,.85));g.addColorStop(1,rgba(u.c,0));
    c.fillStyle=g;c.fillRect(-W,-H,W*3,H*2+GY);}});}
  if(p>.34)once(u,'rock',()=>{
    const tx=dum.x;
    effs.push({t:0,l:1.25,d(c,q){const e2=ease(Math.min(1,q/.72));
      const xx=lerp(tx+420,tx,e2), yy=lerp(-420,GY-46,e2), R=lerp(26,120,e2);
      if(q>.72)return;
      c.save();c.translate(xx,yy);
      const g=c.createRadialGradient(0,0,R*.15,0,0,R);
      g.addColorStop(0,'#ffffff');g.addColorStop(.32,u.c2);g.addColorStop(.7,u.c);g.addColorStop(1,rgba(u.c,0));
      c.fillStyle=g;c.beginPath();c.arc(0,0,R,0,TAU);c.fill();
      c.fillStyle='#2a1410';c.beginPath();
      for(let i=0;i<9;i++){const a=i*TAU/9;c.lineTo(Math.cos(a)*R*.42*(.7+(i%3)*.16),Math.sin(a)*R*.42*(.7+(i%3)*.16));}
      c.closePath();c.fill();c.restore();
      for(let i=0;i<3;i++)pt(xx+rnd(40,-40),yy+rnd(40,-40),rnd(220,-220),rnd(160,-40),.6,rnd(12,5),i%2?u.c:u.c2,'orb',-260);}});
    setTimeout(()=>{if(!ult)return;
      bigImpact(tx,GY-40,u.c,u.c2);dealDmg(u.dmg*.5,u.c,true);
      for(let k=0;k<3;k++)ring(tx,GY,rgba(u.c2,.9),20,320+k*120,.7,20);
      for(let i=0;i<60;i++)pt(tx+rnd(90,-90),GY,rnd(760,-760),-rnd(700,150),rnd(1.1,.4),rnd(11,4),i%2?u.c:u.c2,'shard',800);
    },880);});
  if(p>.62){ // lingering firestorm
    if(Math.random()<.9)pt(dum.x+rnd(150,-150),GY,rnd(60,-60),-rnd(420,140),rnd(1,.5),rnd(9,4),Math.random()<.5?u.c:u.c2,'orb',-300);
    step(u,p,.62,.33,8,()=>{dealDmg(u.dmg*.055,u.c,false);shake(4);});
  }
},

/* NULL-9 — charge rings converge, then a beam that shoves him backwards */
railgun(u,p,dt,dmgTick){
  const mx=()=>pl.x+pl.face*50, my=()=>pl.y-72;
  if(p<.36&&Math.random()<.9){ // intake rings
    effs.push({t:0,l:.3,d(c,q){c.save();c.translate(mx(),my());c.globalAlpha=(1-q)*.8;
      c.strokeStyle=u.c;c.lineWidth=3;const r=lerp(120,14,ease(q));
      c.beginPath();for(let i=0;i<=6;i++){const a=i*TAU/6+q*2;c.lineTo(Math.cos(a)*r,Math.sin(a)*r*.8);}
      c.closePath();c.stroke();c.restore();}});
  }
  if(p>.38)once(u,'fire',()=>{
    const dir=pl.face,y=my();
    effs.push({t:0,l:1.5,d(c,q){const w=200*Math.sin(Math.min(1,q*5)*Math.PI*.5)*(1-q*.45);
      const g=c.createLinearGradient(pl.x,0,pl.x+dir*W,0);
      g.addColorStop(0,rgba(u.c,.98));g.addColorStop(.55,rgba(u.c,.85));g.addColorStop(1,rgba(u.c,.06));
      c.fillStyle=g;c.fillRect(dir>0?pl.x:0,y-w,W,w*2);
      c.fillStyle='rgba(255,255,255,.98)';c.fillRect(dir>0?pl.x:0,y-w*.30,W,w*.60);
      c.globalAlpha=.3;c.fillStyle=rgba(u.c,.6);c.fillRect(dir>0?pl.x:0,y-w*1.8,W,w*3.6);
      c.globalAlpha=1;c.strokeStyle=rgba('#ffffff',.5);c.lineWidth=3; // travelling pulse rings
      for(let k=0;k<5;k++){const px=(dir>0?pl.x:W)+dir*(((q*2.4+k*.2)%1)*W);
        c.beginPath();c.ellipse(px,y,10,w*1.05,0,0,TAU);c.stroke();}}});
    flash('#ffffff',.55);});
  if(p>.38&&p<.9){
    pl.x-=pl.face*120*dt;                        // recoil
    pl.x=clamp(pl.x,50,W-50);
    for(let i=0;i<2;i++)pt(mx(),my()+rnd(40,-40),-pl.face*rnd(500,150),rnd(180,-180),.4,rnd(8,3),u.c,'sq',0);
    step(u,p,.38,.52,14,()=>{dealDmg(u.dmg/17,u.c,false);shake(9);
      pt(dum.x+rnd(60,-60),dum.y-rnd(140,0),rnd(500,-500),-rnd(520,120),.5,rnd(9,3),u.c,'sq',-200);});
  }
  if(p>.9)once(u,'fin',()=>{bigImpact(dum.x,dum.y-70,u.c,u.c2);dealDmg(u.dmg*.2,u.c,true);});
},

/* SYLVA — a giant spectral bow, one great arrow, then the sky fills with them */
rootstorm(u,p,dt,dmgTick){
  if(p<.4){ // the bow draws
    effs.push({t:0,l:.05,d(c){const g2=Math.min(1,p/.34);
      c.save();c.translate(pl.x+pl.face*30,pl.y-80);c.scale(pl.face,1);c.globalAlpha=.85*g2;
      c.strokeStyle=u.c;c.lineWidth=9;c.shadowBlur=30;c.shadowColor=u.c;
      c.beginPath();c.arc(0,0,110,-1.3,1.3);c.stroke();
      c.strokeStyle='#fff';c.lineWidth=3;
      c.beginPath();c.moveTo(Math.cos(-1.3)*110,Math.sin(-1.3)*110);
      c.lineTo(-46*g2,0);c.lineTo(Math.cos(1.3)*110,Math.sin(1.3)*110);c.stroke();c.restore();}});
  }
  if(p>.40)once(u,'big',()=>{const dir=pl.face;
    effs.push({t:0,l:.45,d(c,q){const xx=lerp(pl.x,pl.x+dir*W,ease(q));
      c.save();c.translate(xx,pl.y-80);c.scale(dir,1);c.globalAlpha=1-q*.5;
      c.fillStyle=u.c;c.shadowBlur=34;c.shadowColor=u.c;
      c.beginPath();c.moveTo(90,0);c.lineTo(-60,26);c.lineTo(-36,0);c.lineTo(-60,-26);c.closePath();c.fill();
      c.globalAlpha=(1-q)*.6;c.fillRect(-320,-9,300,18);c.restore();}});
    setTimeout(()=>{if(!ult)return;dealDmg(u.dmg*.26,u.c,true);
      elementFX('nature',dum.x,dum.y-70,1,40);shake(16);},190);});
  if(p>.48)step(u,p,.48,.42,26,()=>{ // volley rains in
    const tx=dum.x+rnd(150,-150), from=rnd(280,-40);
    effs.push({t:0,l:.44,d(c,q){const yy=lerp(-360,GY-16,ease(q)),xx=lerp(tx+from,tx,ease(q));
      c.save();c.translate(xx,yy);c.rotate(Math.atan2(GY+360,-from));
      c.fillStyle=u.c;c.shadowBlur=18;c.shadowColor=u.c;
      c.beginPath();c.moveTo(0,-30);c.lineTo(7,12);c.lineTo(-7,12);c.closePath();c.fill();c.restore();}});
    setTimeout(()=>{if(!ult)return;
      for(let i=0;i<5;i++)pt(tx,GY,rnd(200,-200),-rnd(340,90),.7,rnd(8,3),u.c2,'leaf',300);
      if(Math.abs(tx-dum.x)<120){dealDmg(u.dmg*.022,u.c,false);shake(4);}},440);});
  if(p>.72&&Math.random()<.5){ // roots erupt underfoot
    const rx=dum.x+rnd(110,-110);
    effs.push({t:0,l:.5,d(c,q){c.globalAlpha=(1-q)*.9;c.strokeStyle=u.c;c.lineWidth=7*(1-q*.4);c.lineCap='round';
      c.beginPath();c.moveTo(rx,GY);
      for(let i=1;i<=4;i++)c.lineTo(rx+Math.sin(i*1.7+rx)*16*i*ease(q),GY-i*26*ease(q));c.stroke();}});
  }
  if(p>.92)once(u,'fin',()=>{bigImpact(dum.x,dum.y-60,u.c,u.c2);dealDmg(u.dmg*.2,u.c,true);});
},

/* ZAP — a rubber-hose tornado that spits furniture */
tornado(u,p,dt,dmgTick){
  if(p>.30&&p<.90){
    const a=u.t*15;
    pl.x=dum.x+Math.cos(a)*78;pl.y=GY-Math.abs(Math.sin(a*.7))*140;
    effs.push({t:0,l:.05,d(c){c.save();c.globalAlpha=.5;c.strokeStyle=u.c;c.lineWidth=9;
      for(let j=0;j<8;j++){const rr=26+j*15,ang=a+j*.75;
        c.beginPath();c.ellipse(dum.x,dum.y-j*28,rr,rr*.28,0,ang,ang+4.3);c.stroke();}
      c.globalAlpha=.25;c.strokeStyle=u.c2;c.lineWidth=4;
      for(let j=0;j<8;j++){const rr=32+j*15,ang=-a+j*.9;
        c.beginPath();c.ellipse(dum.x,dum.y-j*28,rr,rr*.28,0,ang,ang+3.4);c.stroke();}c.restore();}});
    // props orbiting in the funnel
    for(let k=0;k<3;k++){const ang=a*1.4+k*2.1,rr=50+k*26,yy=dum.y-40-k*55;
      const px=dum.x+Math.cos(ang)*rr, py=yy+Math.sin(ang)*12;
      effs.push({t:0,l:.05,d(c){c.save();c.translate(px,py);c.rotate(ang*1.6);
        c.fillStyle=['#2b3040','#6b4a2a','#b9c4d6'][k];c.strokeStyle='#14161f';c.lineWidth=2.5;
        if(k===0){c.beginPath();c.moveTo(-17,-5);c.lineTo(17,-5);c.lineTo(12,6);c.lineTo(-12,6);c.closePath();c.fill();c.stroke();
          c.fillRect(-13,6,26,7);}
        else if(k===1){c.fillRect(-20,-11,40,22);c.fillStyle='#f2f5ff';
          for(let n2=0;n2<7;n2++)c.fillRect(-18+n2*5.2,-9,3.4,9);c.strokeRect(-20,-11,40,22);}
        else{c.beginPath();for(let n2=0;n2<10;n2++){const aa=n2*TAU/10;const r2=n2%2?6:15;
          c.lineTo(Math.cos(aa)*r2,Math.sin(aa)*r2);}c.closePath();c.fill();c.stroke();}
        c.restore();}});}
    step(u,p,.30,.60,20,()=>{dealDmg(u.dmg/26,u.c,false);shake(5);dum.wobV+=rnd(5,-5);});
    if(Math.random()<.6)pt(dum.x+rnd(120,-120),dum.y-rnd(200,0),rnd(300,-300),-rnd(380,120),.5,rnd(8,3),
      Math.random()<.5?u.c:u.c2,'star',-90);
  }
  if(p>.90)once(u,'fin',()=>{pl.x=dum.x-90;pl.y=GY;
    dum.vy=-760;dum.air=true;dum.vx=190;
    elementFX('toon',dum.x,dum.y-70,1,40);bigImpact(dum.x,dum.y-70,u.c,u.c2);
    dealDmg(u.dmg*.24,u.c,true);});
},

/* MORGRIM — a gate opens overhead, chains bind, the soul is pulled out */
gate(u,p,dt,dmgTick){
  const gx=dum.x, gy=dum.y-210;
  if(p>.28){
    const open=clamp((p-.28)*3.4,0,1)*(p>.88?clamp((1-p)*8,0,1):1);
    effs.push({t:0,l:.05,d(c){const r=150*open;
      c.save();c.globalAlpha=.95;
      const g=c.createRadialGradient(gx,gy,r*.1,gx,gy,r);
      g.addColorStop(0,'#000');g.addColorStop(.62,rgba(u.c2,.85));g.addColorStop(1,rgba(u.c,0));
      c.fillStyle=g;c.beginPath();c.ellipse(gx,gy,r,r*.86,0,0,TAU);c.fill();
      c.strokeStyle=u.c;c.lineWidth=5;c.globalAlpha=.9;
      c.beginPath();c.ellipse(gx,gy,r*.9,r*.78,0,0,TAU);c.stroke();
      c.lineWidth=2;c.globalAlpha=.5;                       // runes around the rim
      for(let i=0;i<12;i++){const a=i*TAU/12+T*.6;
        c.beginPath();c.moveTo(gx+Math.cos(a)*r*.95,gy+Math.sin(a)*r*.82);
        c.lineTo(gx+Math.cos(a)*r*1.1,gy+Math.sin(a)*r*.95);c.stroke();}c.restore();}});
  }
  if(p>.38&&p<.9){
    // chains from the gate to the dummy
    effs.push({t:0,l:.05,d(c){c.save();c.strokeStyle=u.c;c.globalAlpha=.8;c.lineWidth=4;
      for(let k=-2;k<=2;k++){const ex=dum.x+k*18,ey=dum.y-70-Math.abs(k)*10;
        c.beginPath();c.moveTo(gx+k*40,gy);
        for(let s2=1;s2<=6;s2++){const t2=s2/6;
          c.lineTo(lerp(gx+k*40,ex,t2)+Math.sin(s2*2+T*6)*5,lerp(gy,ey,t2));}
        c.stroke();}c.restore();}});
    // soul essence drains upward into the gate
    if(Math.random()<.95){const sx=dum.x+rnd(30,-30);
      pt(sx,dum.y-rnd(120,10),(gx-sx)*1.6,-rnd(420,220),.55,rnd(8,4),u.c,'orb',-60);}
    step(u,p,.38,.52,18,()=>{dealDmg(u.dmg/24,u.c,false);shake(5);});
    dum.y=lerp(dum.y,GY-40,dt*1.4);dum.air=true;dum.vy=0;   // hoisted off the floor
  }
  if(p>.9)once(u,'fin',()=>{dum.air=true;dum.vy=520;
    for(let i=0;i<40;i++){const a=rnd(TAU),r=rnd(220,90);
      pt(gx+Math.cos(a)*r,gy+Math.sin(a)*r,-Math.cos(a)*r*3.6,-Math.sin(a)*r*3.6,.34,rnd(9,4),u.c,'orb',0);}
    bigImpact(dum.x,dum.y-70,u.c,u.c2);dealDmg(u.dmg*.26,u.c,true);});
},

/* TITANA — storm front, thrown hammer, then a column of lightning */
stormfall(u,p,dt,dmgTick){
  if(p>.16){effs.push({t:0,l:.05,d(c){c.save();c.globalAlpha=Math.min(.55,(p-.16)*2.5)*(p>.9?(1-p)*9:1);
    c.fillStyle='#0b1024';
    for(let i=0;i<7;i++){const cx=(i*W/6+T*12)%(W+300)-150, cy=60+(i%3)*34;
      c.beginPath();c.ellipse(cx,cy,150,44,0,0,TAU);c.ellipse(cx+90,cy+16,110,34,0,0,TAU);c.fill();}
    c.restore();}});}
  if(p>.34)once(u,'throw',()=>{const dir=pl.face;
    effs.push({t:0,l:.7,d(c,q){const xx=q<.5?lerp(pl.x,dum.x+dir*230,q*2):lerp(dum.x+dir*230,pl.x,(q-.5)*2);
      const yy=pl.y-80-Math.sin(q*Math.PI)*60;
      c.save();c.translate(xx,yy);c.rotate(q*44);
      c.fillStyle='#3a2a1e';c.fillRect(-34,-4,68,8);
      c.fillStyle='#b9c4d6';c.fillRect(26,-19,26,38);
      c.fillStyle=rgba(u.c,.9);c.fillRect(32,-7,14,14);c.restore();
      pt(xx,yy,rnd(120,-120),rnd(120,-120),.3,rnd(6,3),u.c,'spark',0);}});
    setTimeout(()=>{if(!ult)return;dealDmg(u.dmg*.14,u.c,false);
      elementFX('volt',dum.x,dum.y-70,1,30);shake(12);},330);});
  if(p>.46)step(u,p,.46,.36,7,()=>{
    bolt(dum.x+rnd(190,-190),20,dum.x+rnd(80,-80),GY-rnd(80,0),u.c);
    dealDmg(u.dmg*.055,u.c,false);shake(11);flash(u.c,.18);
    burst(dum.x,GY-20,14,u.c,420,5,'spark',300);});
  if(p>.84)once(u,'col',()=>{ // the column
    effs.push({t:0,l:.9,d(c,q){const w=105*Math.sin(Math.min(1,q*4)*Math.PI*.5)*(1-q*.5);
      const g=c.createLinearGradient(dum.x-w,0,dum.x+w,0);
      g.addColorStop(0,rgba(u.c,0));g.addColorStop(.5,rgba('#ffffff',.95));g.addColorStop(1,rgba(u.c,0));
      c.fillStyle=g;c.fillRect(dum.x-w,-100,w*2,GY+100);
      c.globalAlpha=.4;c.fillStyle=rgba(u.c,.7);c.fillRect(dum.x-w*2.1,-100,w*4.2,GY+100);}});
    for(let i=0;i<6;i++)bolt(dum.x+rnd(60,-60),-40,dum.x+rnd(40,-40),GY,u.c);
    bigImpact(dum.x,GY-60,u.c,u.c2);dealDmg(u.dmg*.36,u.c,true);
    for(let k=0;k<3;k++)ring(dum.x,GY,rgba(u.c,.9),20,280+k*110,.6,16);});
},

/* RONIN — time stops, every cut is drawn, then they all land at once */
thousandcuts(u,p,dt,dmgTick){
  if(p>.30&&p<.80){
    cam.slow=lerp(cam.slow,.06,dt*10);            // near-frozen
    if(!u.cuts)u.cuts=[];
    if(u.cuts.length<34&&Math.random()<.85){
      const a=rnd(TAU),L=rnd(200,110),cx=dum.x+rnd(50,-50),cy=dum.y-70+rnd(70,-70);
      u.cuts.push([cx-Math.cos(a)*L/2,cy-Math.sin(a)*L/2,cx+Math.cos(a)*L/2,cy+Math.sin(a)*L/2]);
      pl.ghost.push({x:dum.x+rnd(150,-150),y:GY-rnd(90,0),l:.5,m:.5,pose:'swing_s',face:Math.random()<.5?1:-1});
    }
    effs.push({t:0,l:.05,d(c){c.save();                 // desaturated frozen frame
      c.globalAlpha=.30;c.fillStyle='#9aa4c8';c.fillRect(-W,-H,W*3,H*3);
      c.globalAlpha=1;c.strokeStyle='#ffffff';c.lineWidth=3;c.shadowBlur=14;c.shadowColor=u.c;
      for(const q of u.cuts){c.beginPath();c.moveTo(q[0],q[1]);c.lineTo(q[2],q[3]);c.stroke();}
      c.restore();}});
  }
  if(p>.80)once(u,'release',()=>{                  // time resumes — all cuts resolve
    cam.slow=1;flash('#ffffff',.7);shake(30);hitstop=.12;
    const cuts=u.cuts||[];
    cuts.forEach((q,i)=>setTimeout(()=>{if(!ult)return;
      const mx2=(q[0]+q[2])/2,my2=(q[1]+q[3])/2;
      crescent(mx2,my2,1,'#ffffff',.8,Math.atan2(q[3]-q[1],q[2]-q[0]),1.4,.2,20,90,8);
      burst(mx2,my2,6,u.c,340,4,'spark',200);
      dealDmg(u.dmg*.62/Math.max(1,cuts.length),u.c,false);shake(4);},i*22));
    setTimeout(()=>{if(!ult)return;bigImpact(dum.x,dum.y-64,u.c,u.c2);dealDmg(u.dmg*.3,u.c,true);},
      Math.min(900,cuts.length*22+140));});
},

/* NOVA — collapse into a singularity, then blow it outward */
singularity(u,p,dt,dmgTick){
  const cx=dum.x,cy=dum.y-80;
  if(p>.26&&p<.72){                                 // implosion
    const g2=(p-.26)/.46;
    cam.zoom=lerp(cam.zoom,1.02+g2*.14,dt*4);
    for(let i=0;i<3;i++){const a=rnd(TAU),r=rnd(420,180);
      pt(cx+Math.cos(a)*r,cy+Math.sin(a)*r,-Math.cos(a)*r*2.3,-Math.sin(a)*r*2.3,.5,rnd(7,2),
        i%2?u.c:u.c2,i%3?'star':'orb',0);}
    effs.push({t:0,l:.05,d(c){const R=18+g2*46;
      c.save();c.globalAlpha=1;
      const g=c.createRadialGradient(cx,cy,R*.5,cx,cy,R*3.2);   // lensed ring, black core
      g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.34,'rgba(0,0,0,.95)');
      g.addColorStop(.42,rgba(u.c,.95));g.addColorStop(.62,rgba(u.c2,.5));g.addColorStop(1,rgba(u.c,0));
      c.fillStyle=g;c.beginPath();c.arc(cx,cy,R*3.2,0,TAU);c.fill();
      c.strokeStyle=rgba('#ffffff',.55);c.lineWidth=2;    // accretion disc
      for(let k=0;k<4;k++){c.beginPath();
        c.ellipse(cx,cy,R*(1.5+k*.42),R*(.3+k*.1),T*1.4+k,0,TAU);c.stroke();}
      c.restore();}});
    dum.x=lerp(dum.x,cx,dt*.6);
    step(u,p,.26,.46,12,()=>{dealDmg(u.dmg*.022,u.c,false);shake(4);});
  }
  if(p>.72)once(u,'boom',()=>{
    cam.zoom=1;flash('#ffffff',.85);
    for(let w=0;w<4;w++)setTimeout(()=>{if(!ult)return;
      ring(cx,cy,rgba(w%2?u.c2:u.c,.95),24,W*1.0,.75,30);shake(22);flash(w%2?u.c2:u.c,.34);
      dealDmg(u.dmg*.17,u.c,false);
      for(let i=0;i<55;i++){const a=rnd(TAU);
        pt(cx,cy,Math.cos(a)*rnd(1250,300),Math.sin(a)*rnd(900,200),rnd(1,.4),rnd(11,3),
          i%2?u.c:u.c2,i%3?'star':'spark',0);}},w*150);
    setTimeout(()=>{if(!ult)return;bigImpact(cx,cy,u.c,u.c2);dealDmg(u.dmg*.3,u.c,true);},700);});
},
};

/* ---------------- damage ---------------- */
function dealDmg(d,col,big,tgt,src){
  tgt=tgt||dum;src=src||pl;
  const blocked=tgt.guard>0&&Math.sign(src.x-tgt.x)===tgt.face;
  d=Math.round(d*(blocked?.16:1)*(tgt.brain?tgt.brain.taken:1));
  if(tgt.hpMax<9999)tgt.hp=Math.max(0,tgt.hp-d);
  if(src===pl){                                  // training readouts track your damage
    tgt.tot+=d;tgt.combo++;tgt.comboT=1.35;tgt.best=Math.max(tgt.best,tgt.combo);dps.acc+=d;}
  num(tgt.x+rnd(20,-20),tgt.y-rnd(150,70),d,blocked?'#9aa4c8':(col||'#fff'),big);
  if(blocked){tgt.guardFX=.18;burst(tgt.x+tgt.face*22,tgt.y-70,8,'#bcd0ff',240,4,'spark',0);}
  src.meter=Math.min(100,src.meter+(ult?0:d*.55));
  tgt.meter=Math.min(100,tgt.meter+d*.30);       // taking hits builds meter too
  tgt.wobV+=src.face*(big?9:3.4);
  if(tgt.hpMax<9999&&tgt.hp<=0&&!koT)ko(tgt);
}

/* ---------------- input ---------------- */
const K={},press={};
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k))e.preventDefault();
  if(!K[k])press[k]=1;K[k]=1;
  if(k==='escape')backToSelect();
  if(k==='tab'){e.preventDefault();showMoves=!showMoves;}
});
addEventListener('keyup',e=>{K[e.key.toLowerCase()]=0;});
// W / Up is an AIM direction (needed for up-tilts and the up-special), so jump
// lives on its own key rather than doubling up.
const L=()=>K['a']||K['arrowleft'],Rt=()=>K['d']||K['arrowright'],
      UPK=()=>K['w']||K['arrowup'],D=()=>K['s']||K['arrowdown'];

/* ---------------- player update ---------------- */
function startAtk(f,kind,keepMomentum){
  const a=atkDef(f,kind);if(!a)return;
  f.atk={...a,kind,t:0,T:a.d+a.a+a.r,fired:false};
  f.st='atk';f.t=0;
  if(f.onG&&!keepMomentum)f.vx*=.25;
}
/* ---- input shape: holds (l/r/u/d) + one-shot presses (pJ/pK/pL/pJump/pDash) ---- */
function blankInput(){return{l:0,r:0,u:0,d:0,pJ:0,pK:0,pL:0,pJump:0,pDash:0,slot:'n'};}
const PIN=blankInput();
function playerInput(){
  PIN.l=L()?1:0;PIN.r=Rt()?1:0;PIN.u=UPK()?1:0;PIN.d=D()?1:0;
  PIN.pJ=press['j']?1:0;PIN.pK=press['k']?1:0;PIN.pL=press['l']?1:0;
  PIN.pJump=press[' ']?1:0;PIN.pDash=press['shift']?1:0;
  PIN.slot=D()?'d':UPK()?'u':'n';
  return PIN;
}

function updFighter(f,dt,inp){
  const c=f.ch,spd=405*c.spd;
  f.hurtT=Math.max(0,f.hurtT-dt);f.dashCd=Math.max(0,f.dashCd-dt);
  f.buffT=Math.max(0,f.buffT-dt);f.inv=Math.max(0,f.inv-dt);
  f.spCd=Math.max(0,(f.spCd||0)-dt);f.guardFX=Math.max(0,f.guardFX-dt);
  f.chainT=Math.max(0,f.chainT-dt);if(!f.chainT)f.chain=0;
  f.squash=Math.max(0,f.squash-dt*6);f.stretch=Math.max(0,f.stretch-dt*7);
  f.spinT=Math.max(0,f.spinT-dt);
  {const tgt=clamp(-f.vx*f.face*.0011-f.vy*.0005,-.8,.8);
   f.swayV+=(tgt-f.sway)*dt*90;f.swayV*=Math.pow(.015,dt);f.sway+=f.swayV*dt;}
  if(f.st==='atk')pushTrail(f);
  f.guard=0;

  if(f.st==='hurt'){                                  // hitstun — no input accepted
    f.vx*=Math.pow(.25,dt);
    if(!f.onG)f.vy+=1900*dt;
    f.y+=f.vy*dt;f.x+=f.vx*dt;
    if(f.y>=GY){if(!f.onG)land(f);f.y=GY;f.vy=0;f.onG=true;}
    if(f.hurtT<=0)f.st=f.onG?'idle':'fall';
  }
  else if(f.st==='ult'){f.vx=0;}
  else if(f.st==='atk'){
    const a=f.atk;a.t+=dt;
    if(!a.fired&&a.t>=a.d){a.fired=true;
      const hx0=f.x+f.face*a.reach*.72,hy0=f.y+a.ry;
      hits.push({own:f,x:hx0,y:hy0,r:a.reach*.62,dmg:a.dmg,kb:a.kb,ky:a.ky,l:a.a,
                 sfx:a.sfx,el:a.el,col:a.col});
      shapeFX(a.sfx,hx0,hy0,f.face,a.col,a.el,a.dmg);
      f.vx+=f.face*(HEAVYSLOT[a.kind]?180:70);
      f.squash=HEAVYSLOT[a.kind]?.45:.22;
    }
    if(a.t>=a.T){f.st=f.onG?'idle':'fall';f.atk=null;}
    else if(a.t>a.d+a.a)tryAttack(f,inp);
    if(!f.onG){f.vy+=1750*dt;f.y+=f.vy*dt;f.x+=f.vx*dt;
      if(f.y>=GY){f.y=GY;f.vy=0;f.onG=true;
        if(a.kind==='aj'||a.kind==='ak'){
          f.st='idle';f.atk=null;burst(f.x,GY,8,'#8a93b8',190,5,'smoke',-60);}}}
  } else {
    let mv=0;if(inp.l)mv-=1;if(inp.r)mv+=1;
    const crouch=inp.d&&f.onG, dashing=f.st==='dash'||f.st==='adash';
    if(mv&&!dashing)f.face=mv;
    if(f.onG&&mv&&Math.abs(f.vx)>210&&Math.sign(mv)!==Math.sign(f.vx)){
      f.skidT=.15;
      if(Math.random()<.7)pt(f.x-Math.sign(f.vx)*10,GY,-Math.sign(f.vx)*rnd(280,90),-rnd(80,10),.4,rnd(9,4),'#9aa4c8','smoke',-40);
    }
    f.skidT=Math.max(0,f.skidT-dt);
    if(!dashing){
      f.vx=lerp(f.vx,crouch?0:mv*spd,dt*(f.onG?(f.skidT>0?34:26):9));
      if(f.onG)f.st=f.skidT>0?'skid':crouch?(!mv?'block':'crouch'):(Math.abs(f.vx)>26?'run':'idle');
    } else {f.t+=dt;if(f.t>(f.st==='adash'?.17:.20))f.st=f.onG?'idle':'fall';}
    if(f.st==='block')f.guard=1;
    if(inp.pDash&&!dashing){
      if(f.onG&&f.dashCd<=0){
        f.st='dash';f.t=0;f.dashCd=.42;f.vx=f.face*880;f.inv=.18;
        ring(f.x,GY,rgba(c.c3,.8),6,76,.3,5);
        for(let i=0;i<12;i++)pt(f.x,f.y-rnd(110,10),-f.face*rnd(300,70),rnd(-70,20),.4,rnd(9,3),c.c3,'orb',-100);
        f.ghost.push({x:f.x,y:f.y,l:.25,m:.25,pose:'dash',face:f.face});
      } else if(!f.onG&&f.airDash>0){
        f.airDash--;f.st='adash';f.t=0;f.inv=.14;
        f.vy=inp.d?300:(inp.u?-430:0);f.vx=f.face*1010;
        ring(f.x,f.y-60,rgba(c.c3,.85),8,88,.3,6);
        for(let i=0;i<14;i++)pt(f.x,f.y-rnd(110,10),-f.face*rnd(360,90),rnd(-90,30),.4,rnd(9,3),c.c3,'orb',0);
        f.ghost.push({x:f.x,y:f.y,l:.26,m:.26,pose:'adash',face:f.face});
      }
    }
    if(inp.pJump){
      if(f.onG){f.vy=-760;f.onG=false;f.st='jump';f.stretch=1;
        burst(f.x,GY,10,'#8a93b8',200,5,'smoke',-60);}
      else if(f.jumps>0){
        f.jumps--;f.vy=-640;f.spinT=.36;f.st='jump';
        ring(f.x,f.y-56,rgba(c.c3,.85),8,72,.34,5);
        for(let i=0;i<14;i++){const a=rnd(TAU);
          pt(f.x+Math.cos(a)*22,f.y-56+Math.sin(a)*22,Math.cos(a)*270,Math.sin(a)*210,.4,rnd(7,3),c.c3,'spark',120);}}
    }
    if(inp.d&&!f.onG&&f.vy>-260&&f.st!=='ffall'&&!dashing){f.vy=1080;f.st='ffall';
      for(let i=0;i<6;i++)pt(f.x,f.y-rnd(90,20),rnd(60,-60),-rnd(180,40),.3,rnd(6,3),c.c3,'spark',0);}
    if(!f.onG&&!dashing){f.vy+=1900*dt;
      if(f.st!=='ffall')f.st=f.vy<0?'jump':'fall';}
    f.y+=f.vy*dt;f.x+=f.vx*dt;
    if(f.y>=GY){if(!f.onG)land(f);f.y=GY;f.vy=0;f.onG=true;}
    if(f.st==='run'&&Math.random()<.22)
      pt(f.x-f.face*8,GY,-f.face*rnd(140,30),-rnd(70,10),.35,rnd(7,3),'#9aa4c8','smoke',-40);
    tryAttack(f,inp);
  }
  f.x=clamp(f.x,40,W-40);
  if(f.st==='dash'&&Math.random()<.6)f.ghost.push({x:f.x,y:f.y,l:.22,m:.22,pose:'dash',face:f.face});
  for(let i=f.ghost.length-1;i>=0;i--){f.ghost[i].l-=dt;if(f.ghost[i].l<=0)f.ghost.splice(i,1);}
}

function updPlayer(dt){
  updFighter(pl,dt,playerInput());
  if(press['m'])pl.meter=100;
  if(press['u']||press['i'])startUlt();
  if(press['r'])resetDummy();
}
function land(f){
  f.jumps=1;f.airDash=1;f.spinT=0;
  const hard=f.vy>900;
  f.squash=hard?1:.6;
  burst(f.x,GY,hard?16:9,'#8a93b8',hard?300:190,5,'smoke',-60);
  if(hard){ring(f.x,GY,'rgba(200,210,235,.6)',6,80,.28,5);if(f===pl)shake(4);}
}
let spCd=0;
const SP_POSE={orb:'slam',quake:'slam',mine:'cast',counter:'shieldbash',field:'cast',buff:'ult',
  rise:'uppercut',teleport:'cast',rocket:'uppercut',beam:'cast',souls:'cast',well:'cast',
  iaido:'thrust',clap:'cast',anvil:'cast'};
function tryAttack(f,inp){
  const btn=inp.pJ?'j':inp.pK?'k':null;
  if(btn){
    // attacking out of a dash keeps the momentum and always gives the slide/lunge
    const dashing=f.st==='dash'||f.st==='adash';
    const kd=dashing?'dh':resolveAtk(f,btn,inp);
    startAtk(f,kd,dashing);
    f.chain=kd==='l1'?1:kd==='l2'?2:0;
    f.chainT=.6;
    return true;
  }
  if(inp.pL){doSpecialWrap(f,inp.slot||'n');return true;}
  return false;
}
function doSpecialWrap(f,slot){
  if(f.spCd>0)return;
  const sp=specDef(f,slot);
  f.spCd=slot==='n'?.42:.62;
  f.atk={...atkDef(f,'l1'),pose:SP_POSE[sp.k]||'cast',
    t:0,T:slot==='n'?.42:.5,d:.14,a:.05,r:slot==='n'?.23:.31,fired:true,dmg:0,reach:0,kind:'sp'};
  f.st='atk';setTimeout(()=>{if(!ult&&!koT&&f.st==='atk')doSpecial(f,slot);},110);
}

/* ---------------- dummy ---------------- */
/* ======================= OPPONENTS =======================
   Level 0 is the old training dummy (inert, infinite HP). Levels 1-4 are real
   fighters driven by the same updFighter() the player uses — they can only do
   what you can do, they just decide differently.                          */
const AI_LEVELS=[
 {n:'TRAINING DUMMY',dummy:1,hp:9999,react:0  ,aggr:0  ,block:0  ,sp:0  ,dash:0  ,dmg:1  ,taken:1,
  tag:'Stands still. Infinite HP — pure combo practice.'},
 {n:'ROOKIE' ,hp: 800,react:.55,aggr:.32,block:.04,sp:.04,dash:.04,dmg:.55,taken:1.18,
  tag:'Wanders in and swings. Hardly ever guards.'},
 {n:'FIGHTER',hp:1050,react:.34,aggr:.55,block:.22,sp:.18,dash:.18,dmg:.85,taken:1,
  tag:'Light chains and heavies. Guards sometimes.'},
 {n:'VETERAN',hp:1250,react:.22,aggr:.72,block:.40,sp:.34,dash:.38,dmg:1.05,taken:.92,
  tag:'Spaces well, anti-airs, punishes whiffs.'},
 {n:'MASTER' ,hp:1500,react:.13,aggr:.86,block:.55,sp:.50,dash:.56,dmg:1.25,taken:.84,
  tag:'Dashes in and out, uses everything, rarely whiffs.'},
];
let aiLvl=0, aiPick=-1, koT=0, koWho=null, wins={p:0,a:0};
const isDummy=()=>!!AI_LEVELS[aiLvl].dummy;

function resetDummy(){        // full round reset (name kept — R still calls it)
  const lv=AI_LEVELS[aiLvl];
  dum.brain=lv.dummy?null:lv;
  dum.hpMax=lv.hp;dum.hp=lv.hp;
  dum.tot=0;dum.combo=0;dum.best=0;dps.val=0;dps.acc=0;
  dum.x=dum.home=W*.68;dum.y=GY;dum.vy=0;dum.vx=0;dum.air=false;dum.rot=0;dum.rotV=0;
  dum.st='idle';dum.atk=null;dum.hurtT=0;dum.meter=0;dum.onG=true;dum.face=-1;
  dum.trail.length=0;dum.ghost.length=0;dum.spCd=0;dum.buffT=0;dum.spinX=0;
  pl.hp=pl.hpMax;pl.st='idle';pl.atk=null;pl.hurtT=0;pl.onG=true;pl.vy=0;pl.vx=0;
  pl.y=GY;pl.rot=0;pl.rotV=0;pl.trail.length=0;pl.ghost.length=0;pl.spCd=0;pl.spinX=0;
  koT=0;koWho=null;pl.x=W*.32;
}
function ko(loser){
  koT=2.8;koWho=loser;
  cam.slow=.25;flash('#fff',.8);shake(32);hitstop=.22;
  loser.st='hurt';loser.hurtT=4;loser.atk=null;loser.onG=false;
  loser.vy=-540;loser.vx=Math.sign(loser.x-loser.foe.x||1)*430;
  loser.rotV=Math.sign(loser.vx)*rnd(16,9);
  bigImpact(loser.x,loser.y-70,'#ff5a3d','#ffd166');
  if(loser===pl)wins.a++;else wins.p++;
}

/* ---- the brain: pick an action, hold it for one reaction window ---- */
const AIN=blankInput();
function aiInput(f,dt){
  const b=f.brain,fo=f.foe;
  AIN.l=AIN.r=AIN.u=AIN.d=AIN.pJ=AIN.pK=AIN.pL=AIN.pJump=AIN.pDash=0;AIN.slot='n';
  if(!b||koT>0||ult)return AIN;                  // stands down during your ultimate
  const d=fo.x-f.x, ad=Math.abs(d), dir=Math.sign(d)||1, dy=fo.y-f.y;
  f.aiT-=dt;
  if(f.aiT<=0||!f.aiAct){f.aiT=b.react*rnd(1.55,.55);f.aiAct=aiChoose(f,b,ad,dy);}
  const a=f.aiAct;
  if(a.move==='in'&&ad>(a.range||70))AIN[dir>0?'r':'l']=1;
  else if(a.move==='out')AIN[dir>0?'l':'r']=1;
  else if(f.st==='idle'||f.st==='block')f.face=dir;   // hold/guard: keep facing
  if(a.block)AIN.d=1;
  if(a.down)AIN.d=1;
  if(a.up)AIN.u=1;
  if(!a.fired){a.fired=1;
    if(a.press==='j')AIN.pJ=1;else if(a.press==='k')AIN.pK=1;
    else if(a.press==='l'){AIN.pL=1;AIN.slot=a.slot||'n';}
    else if(a.press==='jump')AIN.pJump=1;else if(a.press==='dash')AIN.pDash=1;}
  return AIN;
}
function aiChoose(f,b,ad,dy){
  const a={move:'hold',press:null,slot:'n',fired:0,range:70};
  const foe=f.foe;
  if(f.hp<f.hpMax*.28&&Math.random()<b.block*.8){a.block=1;a.move='out';return a;} // turtle when hurt
  if(dy<-80&&ad<170&&Math.random()<b.aggr){a.press='k';a.up=1;return a;}           // anti-air
  if(foe.st==='atk'&&ad<150&&Math.random()<b.block){a.block=1;return a;}           // react to a swing
  if(!f.onG){                                                                      // airborne: aerials
    if(ad<130&&Math.random()<b.aggr){a.press=Math.random()<.4?'k':'j';return a;}
    a.move='in';a.range=60;return a;}
  if(ad>360){
    if(Math.random()<b.sp){a.press='l';a.slot='n';return a;}                       // zone with a projectile
    if(Math.random()<b.dash){a.press='dash';a.move='in';a.range=90;return a;}
    a.move='in';a.range=90;return a;}
  if(ad>150){
    if(Math.random()<b.dash*.75){a.press='dash';a.move='in';a.range=70;return a;}  // dash attack range
    if(Math.random()<b.sp*.6){a.press='l';a.slot=Math.random()<.5?'d':'n';return a;}
    a.move='in';a.range=70;return a;}
  const r=Math.random();
  if(r<.09)                {a.move='out';return a;}
  if(r<.17&&b.block>0)     {a.block=1;return a;}
  if(r<.29)                {a.press='k';a.move='in';a.range=80;return a;}
  if(r<.38&&b.sp>0)        {a.press='l';a.slot='d';return a;}
  if(r<.46)                {a.press='j';a.down=1;return a;}
  if(r<.53&&b.sp>0)        {a.press='l';a.slot='u';return a;}
  if(r<.60&&b.aggr>.6)     {a.press='jump';a.move='in';a.range=60;return a;}
  a.press='j';a.move='in';a.range=70;return a;
}

/* ---- knockback reactions shared by both fighters ---- */
function reactPhysics(f,dt){
  if(f.st==='hurt'&&!f.onG){f.rot+=f.rotV*dt;f.rotV*=Math.pow(.55,dt);}
  else{f.rotV*=Math.pow(.01,dt);f.rot=lerp(f.rot,0,dt*9);}
  f.wobV-=f.wob*460*dt;f.wobV*=Math.pow(.02,dt);f.wob+=f.wobV*dt;f.wob=clamp(f.wob,-.7,.7);
  if((f.st==='hurt'||f===dum&&isDummy())&&((f.x<82&&f.vx<-240)||(f.x>W-82&&f.vx>240))){
    const wx=f.x<82?70:W-70;
    f.vx*=-.62;f.rotV=-f.rotV*.8+rnd(6,-6);f.vy=Math.min(f.vy,-260);f.air=true;f.onG=false;
    ring(wx,f.y-70,'rgba(255,255,255,.85)',8,120,.35,8);
    burst(wx,f.y-70,18,'#cfe0ff',420,5,'shard',500);
    num(wx,f.y-140,'WALL!','#ffd166',true);shake(12);hitstop=.05;
  }
}
function updDummy(dt){
  dum.comboT-=dt;if(dum.comboT<=0&&dum.combo)dum.combo=0;
  dps.t+=dt;if(dps.t>=1){dps.val=dps.acc;dps.acc=0;dps.t=0;}
  reactPhysics(dum,dt);
  if(!isDummy()){updFighter(dum,dt,aiInput(dum,dt));reactPhysics(pl,dt);return;}
  // --- inert sandbag mode ---
  if(dum.air||dum.y<GY){dum.vy+=1750*dt;dum.y+=dum.vy*dt;dum.x+=dum.vx*dt;dum.vx*=Math.pow(.35,dt);
    if(dum.y>=GY){dum.y=GY;
      if(dum.vy>220){dum.vy*=-.34;burst(dum.x,GY,14,'#9aa4c8',300,5,'smoke',-70);shake(5);}
      else{dum.vy=0;dum.air=false;}}
  } else {dum.x+=dum.vx*dt;dum.vx*=Math.pow(.006,dt);
    if(dum.comboT<-.9&&Math.abs(dum.x-dum.home)>4){
      dum.x=lerp(dum.x,dum.home,dt*1.4);
      if(Math.random()<.3)pt(dum.x,GY,rnd(30,-30),-rnd(30,5),.4,rnd(6,2),'#8a93b8','smoke',-40);}
  }
  dum.x=clamp(dum.x,70,W-70);
  dum.face=pl.x<dum.x?-1:1;
}

function box(o){return o.box?o.box:[o.x-o.r,o.y-o.r*.9,o.r*2,o.r*1.8];}
function hurtBox(f){return[f.x-30,f.y-118,60,118];}
function applyHit(own,tgt,h){
  const sgn=Math.sign(tgt.x-own.x)||1;
  const blocked=tgt.guard>0&&Math.sign(own.x-tgt.x)===tgt.face;
  dealDmg(h.dmg,h.col,h.dmg>18,tgt,own);
  impactFX(tgt.x-sgn*24,tgt.y-70,h.col,h.dmg,h.el,h.sfx,sgn);
  tgt.vx+=sgn*h.kb*26*(blocked?.35:1);
  tgt.rotV+=sgn*h.kb*.55;
  if(h.ky&&!blocked){tgt.vy=h.ky*46;tgt.air=true;tgt.onG=false;}
  if(tgt.brain&&!blocked||tgt===pl&&!blocked&&!isDummy()){
    tgt.hurtT=Math.max(tgt.hurtT,h.dmg>18?.40:.20);tgt.st='hurt';tgt.atk=null;tgt.spinT=0;}
  hitstop=Math.max(hitstop,h.dmg>18?.085:.045);
  cam.kick=Math.max(cam.kick,h.dmg>18?.085:.03);
  shake(h.dmg>18?13:5);
}
function updHits(dt){
  for(let i=hits.length-1;i>=0;i--){const h=hits[i];h.l-=dt;
    const own=h.own||pl, tgt=own===pl?dum:pl;
    if(!h.hit&&tgt.inv<=0){
      const[bx,by,bw,bh]=box(h),[tx,ty,tw,th]=hurtBox(tgt);
      if(bx<tx+tw&&bx+bw>tx&&by<ty+th&&by+bh>ty){
        h.hit=!h.ticks;
        if(h.ticks){h.ticks--;h.l=Math.max(h.l,.04);}
        applyHit(own,tgt,h);
      }
    }
    if(h.l<=0)hits.splice(i,1);
  }
  for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.t+=dt;s.l-=dt;
    const own=s.own||pl, tgt=own===pl?dum:pl;
    if(s.wig)s.vy=Math.sin(s.t*16)*260;
    if(s.hom){const dx=tgt.x-s.x,dy=(tgt.y-70)-s.y,d=Math.hypot(dx,dy)||1;
      s.vx=lerp(s.vx,dx/d*620,dt*5);s.vy=lerp(s.vy,dy/d*620,dt*5);}
    if(s.ret&&s.t>.55){s.vx=lerp(s.vx,(own.x-s.x)*3,dt*6);s.vy=lerp(s.vy,(own.y-70-s.y)*3,dt*6);}
    s.x+=s.vx*dt;s.y+=s.vy*dt;
    if(Math.random()<.9)pt(s.x,s.y,rnd(60,-60),rnd(60,-60),.3,s.r*.55,s.c,'orb',-60);
    const[tx,ty,tw,th]=hurtBox(tgt);
    if(tgt.inv<=0&&s.x>tx&&s.x<tx+tw+10&&s.y>ty&&s.y<ty+th){
      applyHit(own,tgt,{dmg:s.dmg,col:s.c,el:s.el,sfx:'jab',kb:2.6,ky:0});
      if(!s.pierce){shots.splice(i,1);continue;}
    }
    if(s.l<=0||s.x<-60||s.x>W+60)shots.splice(i,1);
  }
}
/* ======================= VFX: shape (the swing) + element (the hit) =======================
   Every attack picks one shape and every fighter owns one element, so no two
   characters' lights read the same even when they share a pose.              */
const EPAL={
 wind  :{a:'#dff3ff',b:'#9fe0ff'}, frost :{a:'#a8e4ff',b:'#ffffff'},
 shadow:{a:'#7d8cff',b:'#2a1a4a'}, holy  :{a:'#ffe9a8',b:'#fff6da'},
 fire  :{a:'#ff7a1f',b:'#ffd166'}, plasma:{a:'#38f2d8',b:'#c9fff6'},
 nature:{a:'#8ef07a',b:'#e9ffc2'}, toon  :{a:'#ffd83d',b:'#ff5ab0'},
 void  :{a:'#8cff6a',b:'#4b2a7a'}, volt  :{a:'#9fe8ff',b:'#ffffff'},
 blade :{a:'#ffffff',b:'#cfe0ff'}, cosmic:{a:'#63f0ff',b:'#ff8ae0'},
};
const EP=e=>EPAL[e]||EPAL.blade;

function shapeFX(k,x,y,dir,col,el,pw){
  const P2=EP(el), big=pw>18, sc=big?1.45:1;
  switch(k){
  case 'arc':   crescent(x,y,dir,col,sc,rnd(.35,-.15),1.05);break;
  case 'wide':  crescent(x,y,dir,col,sc*1.25,.1,1.75,.28,34,120,20);
                crescent(x,y,dir,'#fff',sc*1.2,.1,1.55,.2,30,110,7);break;
  case 'drop':  crescent(x,y,dir,col,sc*1.1,-1.15,1.15,.24,26,104,18);break;
  case 'rise':  crescent(x,y,dir,col,sc*1.05,1.25,1.0,.24,22,96,17);
                for(let i=0;i<8;i++)pt(x+rnd(16,-16),y,rnd(60,-60),-rnd(460,180),.4,rnd(6,3),P2.a,'spark',300);break;
  case 'stab':{ const len=big?170:120;
    effs.push({t:0,l:.2,d(c,p){c.save();c.translate(x,y);c.scale(dir,1);c.globalAlpha=1-p;
      const l=lerp(len*.4,len,ease(p));
      const g=c.createLinearGradient(0,0,l,0);g.addColorStop(0,col);g.addColorStop(1,rgba(col,0));
      c.fillStyle=g;c.beginPath();c.moveTo(-10,-13*(1-p));c.lineTo(l,0);c.lineTo(-10,13*(1-p));c.closePath();c.fill();
      c.fillStyle='#fff';c.beginPath();c.moveTo(-6,-4*(1-p));c.lineTo(l*.8,0);c.lineTo(-6,4*(1-p));c.closePath();c.fill();c.restore();}});
    for(let i=0;i<10;i++)pt(x+dir*rnd(len,0),y+rnd(10,-10),dir*rnd(500,200),rnd(50,-50),.3,rnd(5,2),P2.b,'spark',0);
    break;}
  case 'pound':{ const gy=GY;
    ring(x,gy,rgba(P2.a,.95),10,big?190:120,.4,big?11:7);
    ring(x,gy,rgba('#ffffff',.8),6,big?110:70,.26,5);
    for(let i=0;i<(big?22:12);i++)pt(x+rnd(40,-40),gy,rnd(360,-360),-rnd(620,180),rnd(.8,.35),rnd(8,3),i%2?P2.a:P2.b,'shard',900);
    for(let i=0;i<8;i++)pt(x+rnd(70,-70),gy,rnd(140,-140),-rnd(90,20),rnd(1,.5),rnd(30,14),'#000','smoke',-30);
    effs.push({t:0,l:.3,d(c,p){c.globalAlpha=(1-p)*.7;c.strokeStyle=P2.a;c.lineWidth=3;
      for(let i=-2;i<=2;i++){c.beginPath();c.moveTo(x,gy);
        c.lineTo(x+i*46*(1+p),gy-14-Math.abs(i)*5);c.stroke();}}});
    shake(big?16:8);break;}
  case 'spin':{
    effs.push({t:0,l:.26,d(c,p){c.save();c.translate(x,y);c.globalAlpha=1-p;
      const r=lerp(24,big?120:86,ease(p));
      c.strokeStyle=col;c.lineWidth=14*(1-p*.7);c.shadowBlur=22;c.shadowColor=col;
      c.beginPath();c.ellipse(0,0,r,r*.62,.2,0,TAU);c.stroke();
      c.strokeStyle='#fff';c.lineWidth=5*(1-p*.7);c.beginPath();c.ellipse(0,0,r*.9,r*.56,.2,0,TAU);c.stroke();c.restore();}});
    for(let i=0;i<14;i++){const a=rnd(TAU);
      pt(x+Math.cos(a)*30,y+Math.sin(a)*20,Math.cos(a)*rnd(420,160),Math.sin(a)*rnd(260,90),.4,rnd(6,3),P2.a,'spark',0);}
    break;}
  case 'blast':{
    effs.push({t:0,l:.22,d(c,p){c.save();c.translate(x,y);c.scale(dir,1);c.globalAlpha=(1-p)*.9;
      const l=lerp(30,big?150:110,ease(p));
      const g=c.createRadialGradient(0,0,2,0,0,l);g.addColorStop(0,'#fff');g.addColorStop(.35,col);g.addColorStop(1,rgba(col,0));
      c.fillStyle=g;c.beginPath();c.moveTo(0,0);c.arc(0,0,l,-.62,.62);c.closePath();c.fill();c.restore();}});
    for(let i=0;i<(big?20:12);i++){const a=rnd(.6,-.6);
      pt(x,y,dir*Math.cos(a)*rnd(640,220),Math.sin(a)*rnd(420,120),.4,rnd(7,3),i%2?P2.a:P2.b,'orb',60);}
    break;}
  default:{ // 'jab' — tight, fast, low-cost
    effs.push({t:0,l:.14,d(c,p){c.save();c.translate(x,y);c.scale(dir,1);c.globalAlpha=1-p;
      c.strokeStyle=col;c.lineWidth=7*(1-p);c.lineCap='round';
      c.beginPath();c.moveTo(lerp(-14,26,p),0);c.lineTo(lerp(30,62,p),0);c.stroke();c.restore();}});
    for(let i=0;i<5;i++)pt(x,y+rnd(9,-9),dir*rnd(420,160),rnd(90,-90),.25,rnd(4,2),P2.b,'spark',0);
  }}
}

function elementFX(el,x,y,dir,pw){
  const P2=EP(el), n=pw>18?18:10, sp=pw>18?520:330;
  switch(el){
  case 'fire':
    for(let i=0;i<n;i++)pt(x+rnd(14,-14),y,rnd(220,-220),-rnd(400,80),rnd(.9,.4),rnd(8,3),i%2?P2.a:P2.b,'orb',-320);
    for(let i=0;i<5;i++)pt(x,y,rnd(90,-90),-rnd(120,30),rnd(1.1,.6),rnd(26,12),'#000','smoke',-60);
    ring(x,y,rgba(P2.b,.8),6,70,.26,6);break;
  case 'frost':
    for(let i=0;i<n;i++)pt(x,y,rnd(sp,-sp),rnd(sp,-sp)*.7,rnd(.8,.35),rnd(9,4),i%3?P2.a:P2.b,'shard',700);
    effs.push({t:0,l:.26,d(c,p){c.save();c.translate(x,y);c.globalAlpha=(1-p)*.9;c.strokeStyle=P2.a;c.lineWidth=3;
      for(let i=0;i<6;i++){const a=i*TAU/6+p;const r=lerp(8,52,ease(p));
        c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(a)*r,Math.sin(a)*r);c.stroke();}c.restore();}});break;
  case 'volt':
    for(let i=0;i<3;i++)bolt(x,y,x+rnd(110,-110),y+rnd(90,-90),P2.a);
    burst(x,y,n,P2.b,sp*1.2,4,'spark',0);flash(P2.a,.12);break;
  case 'shadow':
    for(let i=0;i<n;i++)pt(x+rnd(20,-20),y+rnd(20,-20),rnd(190,-190),rnd(120,-190),rnd(.9,.4),rnd(24,10),P2.b,'ink',-40);
    burst(x,y,8,P2.a,sp,4,'spark',120);
    effs.push({t:0,l:.24,d(c,p){c.globalAlpha=(1-p)*.85;c.strokeStyle=P2.a;c.lineWidth=5*(1-p);
      c.beginPath();c.arc(x,y,lerp(64,10,ease(p)),0,TAU);c.stroke();}});break; // implodes inward
  case 'holy':
    effs.push({t:0,l:.3,d(c,p){c.save();c.translate(x,y);c.globalAlpha=(1-p);
      const s=lerp(20,big2(pw)?96:64,ease(p));c.fillStyle=P2.b;c.shadowBlur=30;c.shadowColor=P2.a;
      c.beginPath();c.moveTo(0,-s);c.lineTo(s*.16,-s*.16);c.lineTo(s,0);c.lineTo(s*.16,s*.16);
      c.lineTo(0,s);c.lineTo(-s*.16,s*.16);c.lineTo(-s,0);c.lineTo(-s*.16,-s*.16);c.closePath();c.fill();c.restore();}});
    for(let i=0;i<n;i++)pt(x+rnd(26,-26),y+rnd(20,-20),rnd(70,-70),-rnd(220,60),rnd(1,.5),rnd(5,2),P2.b,'orb',-150);break;
  case 'plasma':
    effs.push({t:0,l:.24,d(c,p){c.save();c.translate(x,y);c.rotate(p*.6);c.globalAlpha=1-p;
      c.strokeStyle=P2.a;c.lineWidth=4;const r=lerp(12,74,ease(p));
      c.beginPath();for(let i=0;i<=6;i++){const a=i*TAU/6;c.lineTo(Math.cos(a)*r,Math.sin(a)*r);}c.closePath();c.stroke();c.restore();}});
    for(let i=0;i<n;i++)pt(x,y,rnd(sp,-sp),rnd(sp,-sp)*.8,rnd(.6,.25),rnd(7,3),i%2?P2.a:P2.b,'sq',0);break;
  case 'nature':
    for(let i=0;i<n+4;i++)pt(x+rnd(18,-18),y,rnd(250,-250),-rnd(300,40),rnd(1.3,.6),rnd(9,4),i%2?P2.a:P2.b,'leaf',260);
    ring(x,y,rgba(P2.a,.8),6,72,.3,5);break;
  case 'toon':{
    const word=['POW!','BAM!','WHAM!','ZOK!','KAPOW!'][rint(5)];
    effs.push({t:0,l:.42,d(c,p){c.save();c.translate(x,y);c.rotate(-.18+p*.1);
      const s=lerp(.3,1.15,ease(Math.min(1,p*2.4)))*(pw>18?1.35:1);c.scale(s,s);c.globalAlpha=p>.7?(1-p)/.3:1;
      c.fillStyle=P2.a;c.strokeStyle='#241d12';c.lineWidth=4;c.beginPath();
      for(let i=0;i<14;i++){const a=i*TAU/14,r=i%2?26:52;c.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
      c.closePath();c.fill();c.stroke();
      c.font='900 21px Segoe UI,sans-serif';c.textAlign='center';c.lineWidth=5;
      c.strokeText(word,0,7);c.fillStyle='#241d12';c.fillText(word,0,7);c.textAlign='left';c.restore();}});
    for(let i=0;i<n;i++)pt(x,y,rnd(sp,-sp),rnd(sp,-sp),rnd(.8,.4),rnd(7,3),i%2?P2.b:'#6ec8ff','star',500);break;}
  case 'void':
    // particles fly INWARD then vanish — reads as a collapse, not a burst
    for(let i=0;i<n+6;i++){const a=rnd(TAU),r=rnd(110,50);
      pt(x+Math.cos(a)*r,y+Math.sin(a)*r,-Math.cos(a)*r*3.4,-Math.sin(a)*r*3.4,.32,rnd(7,3),P2.a,'orb',0);}
    effs.push({t:0,l:.3,d(c,p){c.globalAlpha=(1-p)*.9;
      const g=c.createRadialGradient(x,y,2,x,y,lerp(10,66,ease(p)));
      g.addColorStop(0,'#000');g.addColorStop(.6,rgba(P2.b,.8));g.addColorStop(1,rgba(P2.a,0));
      c.fillStyle=g;c.beginPath();c.arc(x,y,lerp(10,66,ease(p)),0,TAU);c.fill();}});break;
  case 'cosmic':
    for(let i=0;i<n;i++)pt(x,y,rnd(sp,-sp),rnd(sp,-sp),rnd(1,.4),rnd(6,2),i%2?P2.a:P2.b,'star',0);
    effs.push({t:0,l:.34,d(c,p){c.globalAlpha=(1-p)*.75;
      const r=lerp(14,90,ease(p));const g=c.createRadialGradient(x,y,2,x,y,r);
      g.addColorStop(0,rgba('#ffffff',.9));g.addColorStop(.4,rgba(P2.b,.6));g.addColorStop(1,rgba(P2.a,0));
      c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();}});break;
  case 'wind':
    for(let i=0;i<3;i++)crescent(x+rnd(24,-24),y+rnd(20,-20),dir,P2.a,.55,rnd(1.4,-1.4),1.5,.2,14,58,7);
    burst(x,y,n,P2.b,sp,3,'spark',0);break;
  default: // 'blade' — clean, minimal, three fast cuts
    for(let i=0;i<3;i++)crescent(x+rnd(20,-20),y+rnd(18,-18),dir,'#fff',.6,rnd(1.6,-1.6),1.3,.16,16,62,6);
    burst(x,y,n,P2.b,sp,4,'spark',300);
  }
}
function big2(p){return p>18;}

function impactFX(x,y,col,d,el,sfx,dir){
  el=el||EL();dir=dir||1;
  burst(x,y,d>18?14:8,'#ffffff',d>18?420:260,d>18?5:3,'spark',380);

/* ---------------- FIGHTER RENDERING ---------------- */
function cap(c,x1,y1,x2,y2,w,col){
  c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';
  c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();
}
function limb(c,x,y,a1,l1,a2,l2,w1,w2,col){
  const ex=x+Math.sin(a1)*l1,ey=y+Math.cos(a1)*l1;
  cap(c,x,y,ex,ey,w1,col);
  const a=a1+a2,fx=ex+Math.sin(a)*l2,fy=ey+Math.cos(a)*l2;
  cap(c,ex,ey,fx,fy,w2,col);
  return[fx,fy,a];
}
// draws fighter with feet at (0,0), facing +x
function drawBody(c,ch,po,sc,t,opt){
  opt=opt||{};
  const S=sc*ch.h, gw=ch.w;
  const hipY=-46*S, shY=-84*S, neck=-90*S, hdY=-101*S, hdR=11.5*S*Math.min(1.06,gw);
  const lean=po.lean, ty=po.ty*S;
  const dark=shade(ch.c1,-.42), mid=ch.c1, lite=shade(ch.c1,.12);
  const skinD=shade(ch.skin,-.25);
  const sway=opt.sway||0;
  c.save();
  // squash & stretch anchored at the feet, plus whole-body spin for the flip jump
  const sq=opt.sq||0;
  if(sq)c.scale(1+sq*.30,1-sq*.30);
  if(opt.spin){c.translate(0,hipY);c.rotate(opt.spin);c.translate(0,-hipY);}
  c.translate(0,ty);
  // ---- back arm
  c.save();c.translate(0,hipY);c.rotate(lean);c.translate(0,-hipY);
  const shx=Math.sin(lean)*(hipY-shY)*-1;
  const hb=limb(c,shx-3*S*gw,shY,po.aB[0],23*S,po.aB[1],21*S,9.5*S*gw,8*S*gw,dark);
  c.restore();
  // ---- back leg
  limb(c,-3*S*gw,hipY,po.lB[0],26*S,po.lB[1],25*S,11.5*S*gw,9.5*S*gw,shade(ch.c2,-.15));
  // ---- cape
  if(ch.cape){
    c.save();c.translate(0,shY);c.rotate(lean*.6);
    const sw=Math.sin(t*2.2)*.12+(opt.vx||0)*-.0008+sway*.9;
    c.fillStyle=ch.capeC;c.beginPath();c.moveTo(-2*S,-6*S);
    c.quadraticCurveTo(-34*S+sw*40,26*S,-30*S+sw*60,74*S);
    c.quadraticCurveTo(-8*S,66*S,4*S,-4*S);c.closePath();c.fill();
    c.fillStyle=rgba(ch.c3,.14);c.fill();c.restore();
  }
  // ---- torso
  c.save();c.translate(0,hipY);c.rotate(lean);c.translate(0,-hipY);
  const tw=15*S*gw;
  const g=c.createLinearGradient(-tw,shY,tw,hipY);
  g.addColorStop(0,shade(mid,-.2));g.addColorStop(.5,mid);g.addColorStop(1,shade(mid,-.35));
  c.fillStyle=g;
  c.beginPath();
  c.moveTo(-tw*1.15,shY+4*S);c.quadraticCurveTo(-tw*1.35,lerp(shY,hipY,.45),-tw*.78,hipY+3*S);
  c.lineTo(tw*.78,hipY+3*S);c.quadraticCurveTo(tw*1.35,lerp(shY,hipY,.45),tw*1.15,shY+4*S);
  c.quadraticCurveTo(0,shY-7*S,-tw*1.15,shY+4*S);c.closePath();c.fill();
  // chest accent
  c.fillStyle=rgba(ch.c3,.5);
  c.beginPath();c.moveTo(-tw*.5,shY+9*S);c.lineTo(tw*.5,shY+9*S);c.lineTo(0,shY+26*S);c.closePath();c.fill();
  c.fillStyle=shade(ch.c2,.02);c.fillRect(-tw*.85,hipY-8*S,tw*1.7,9*S);
  // neck
  cap(c,0,shY-1*S,0,neck,7.5*S,skinD);
  // ---- head
  c.save();c.translate(0,hdY);c.rotate(po.head);
  c.fillStyle=ch.skin;c.beginPath();c.ellipse(0,0,hdR*.92,hdR,0,0,TAU);c.fill();
  // face
  if(ch.mask==='visor'){c.fillStyle=shade(ch.c2,.05);c.beginPath();c.ellipse(1*S,-1*S,hdR*.95,hdR*.75,0,0,TAU);c.fill();
    c.fillStyle=ch.c3;c.shadowBlur=14;c.shadowColor=ch.c3;c.fillRect(-hdR*.2,-hdR*.28,hdR*1.15,hdR*.28);c.shadowBlur=0;}
  else if(ch.mask==='cowl'){c.fillStyle=ch.hairC;c.beginPath();c.ellipse(0,-2*S,hdR*1.02,hdR*1.0,0,Math.PI,TAU);c.fill();
    c.fillRect(-hdR,-2*S,hdR*2,hdR*.5);
    c.fillStyle='#dfe6ff';c.shadowBlur=10;c.shadowColor='#9fb0ff';
    c.fillRect(hdR*.05,-hdR*.28,hdR*.62,hdR*.2);c.fillRect(-hdR*.62,-hdR*.28,hdR*.42,hdR*.2);c.shadowBlur=0;}
  else if(ch.mask==='void'){c.fillStyle='#07040f';c.beginPath();c.ellipse(0,0,hdR*.95,hdR,0,0,TAU);c.fill();
    c.fillStyle=ch.c3;c.shadowBlur=16;c.shadowColor=ch.c3;
    c.beginPath();c.ellipse(hdR*.3,-hdR*.15,hdR*.2,hdR*.13,0,0,TAU);c.fill();
    c.beginPath();c.ellipse(-hdR*.3,-hdR*.15,hdR*.18,hdR*.12,0,0,TAU);c.fill();c.shadowBlur=0;}
  else{
    c.fillStyle='#1a1c26';
    c.beginPath();c.ellipse(hdR*.34,-hdR*.12,hdR*.13,hdR*.17,0,0,TAU);c.fill();
    c.beginPath();c.ellipse(-hdR*.12,-hdR*.12,hdR*.11,hdR*.16,0,0,TAU);c.fill();
    if(ch.hair==='toon'){c.fillStyle='#fff';
      c.beginPath();c.ellipse(hdR*.34,-hdR*.14,hdR*.3,hdR*.34,0,0,TAU);c.fill();
      c.beginPath();c.ellipse(-hdR*.16,-hdR*.14,hdR*.27,hdR*.32,0,0,TAU);c.fill();
      c.fillStyle='#1a1c26';
      c.beginPath();c.arc(hdR*.4,-hdR*.1,hdR*.14,0,TAU);c.fill();
      c.beginPath();c.arc(-hdR*.1,-hdR*.1,hdR*.13,0,TAU);c.fill();}
    if(ch.mask==='scarf'||ch.mask==='mempo'){
      c.fillStyle=ch.mask==='mempo'?shade(ch.c2,.1):shade(ch.c1,-.3);
      c.beginPath();c.ellipse(0,hdR*.42,hdR*.9,hdR*.48,0,0,Math.PI);c.fill();}
  }
  // hair — swings on its own spring, lagging behind the body
  c.save();c.rotate(sway*.62);
  c.fillStyle=ch.hairC;
  const HH=ch.hair;
  if(HH==='spiky'){for(let i=-3;i<=3;i++){c.save();c.rotate(i*.33);
      c.beginPath();c.moveTo(-4*S,-hdR*.85);c.lineTo(0,-hdR*2.0);c.lineTo(4*S,-hdR*.85);c.closePath();c.fill();c.restore();}}
  else if(HH==='long'||HH==='longg'){c.beginPath();c.ellipse(0,-hdR*.42,hdR*1.06,hdR*.95,0,Math.PI,TAU);c.fill();
    c.beginPath();c.moveTo(-hdR,-hdR*.4);c.quadraticCurveTo(-hdR*1.5,hdR*2.6,-hdR*.5,hdR*3.0);

/* ---- motion smear: track the front hand / weapon tip and ribbon it ---- */
const WEP_LEN={katana:90,blade:90,cleaver:96,staff:72,hammer:76,scythe:70,bow:38,shield:40,claw:32,cannon:50,none:8};
// forward-kinematics for the front hand, in the fighter's own space (pre-face-flip)
function frontTip(ch,po,sc){
  const S=sc*ch.h,gw=ch.w,hipY=-46*S,shY=-84*S;
  const cs=Math.cos(po.lean),sn=Math.sin(po.lean);
  const dx=3*S*gw, dy=shY-hipY;                     // shoulder, rotated about the hip
  const sx=dx*cs-dy*sn, sy=hipY+dx*sn+dy*cs;
  const a1=po.aF[0]+po.lean, l1=23*S;
  const ex=sx+Math.sin(a1)*l1, ey=sy+Math.cos(a1)*l1;
  const a2=a1+po.aF[1], l2=21*S;
  const hx=ex+Math.sin(a2)*l2, hy=ey+Math.cos(a2)*l2;
  const th=Math.PI*.5-a2, len=(WEP_LEN[ch.wep]||8)*S;
  return[hx+Math.cos(th)*len, hy+Math.sin(th)*len+po.ty*S];
}
function pushTrail(f){
  const po=fighterPose(f), [lx,ly]=frontTip(f.ch,po,PS);
  f.trail.push({x:f.x+f.face*lx, y:f.y+ly, l:.15, m:.15});
  if(f.trail.length>16)f.trail.shift();
}
function drawTrail(f){
  const tr=f.trail;if(tr.length<3)return;
  X.save();X.globalCompositeOperation='lighter';X.lineCap='round';X.lineJoin='round';
  for(let pass=0;pass<2;pass++){
    for(let i=1;i<tr.length;i++){
      const a=tr[i],b=tr[i-1],age=clamp(a.l/a.m,0,1),near=i/tr.length;
      X.globalAlpha=age*near*(pass?.95:.5);
      X.strokeStyle=pass?'#ffffff':f.ch.c3;
      X.lineWidth=(pass?6:19)*age*near;
      X.beginPath();X.moveTo(b.x,b.y);X.lineTo(a.x,a.y);X.stroke();
    }
  }
  X.restore();
}

/* pose selection for player */
function fighterPose(f){
  const s=f.st;
  if(s==='atk'&&f.atk){
    const a=f.atk,base=POSE[a.pose+'_w']?a.pose:'punch';
    const w=POSE[base+'_w'],st=POSE[base+'_s'];
    // 4 phases: anticipate -> SNAP -> follow-through overshoot -> settle.
    // The overshoot is extrapolated past the strike, so it costs no extra poses.
    if(a.t<a.d)          return hl(mixPose(POSE.idle,w,eOut(a.t/a.d)));
    if(a.t<a.d+a.a)      return hl(mixPose(w,st,eSnap((a.t-a.d)/a.a)));
    const rp=clamp((a.t-a.d-a.a)/a.r,0,1), ov=overshoot(w,st,.17);
    if(rp<.40)           return hl(mixPose(st,ov,eOut(rp/.40)));
    return hl(mixPose(ov,POSE.idle,eInOut((rp-.40)/.60)));
  }
  if(s==='ult'){
    const p=ult?ult.t/ult.dur:0, up=ULTPOSE[ult&&ult.k]||['ult_w','ult_s'];
    const w=POSE[up[0]]||POSE.ult_w, st=POSE[up[1]]||POSE.ult_s;
    if(p<.34){                       // settle into the stance, then tremble as it builds
      const g=Math.min(1,p/.30), b=mixPose(POSE.idle,w,eOut(g)), tr=g*g;
      b.lean+=Math.sin(T*34)*tr*.05;
      b.ty  +=Math.sin(T*41)*tr*2.0;
      return hl(b);
    }
    return hl(mixPose(w,st,eSnap(clamp((p-.34)/.12,0,1))));
  }
  if(s==='run'){
    // proper gait: thigh swings fore/aft, knee flexes (negative) hardest on the
    // rear swing so the heel kicks up behind; arms counter-swing to their own leg.
    const t=T*11*f.ch.spd, back=Math.sin(t), front=-back;
    const knee=v=>-(.10+1.45*Math.max(0,-v));      // near-straight ahead, tucked behind
    const elbow=v=>.80+.55*Math.max(0,v);
    const b={...POSE.run};
    b.lB=[1.02*back ,knee(back) ];  b.aB=[1.05*front,elbow(front)];
    b.lF=[1.02*front,knee(front)];  b.aF=[1.05*back ,elbow(back) ];
    b.ty=-2-Math.abs(Math.cos(t))*3.5;             // two bobs per full cycle
    b.lean=.20+Math.sin(t*2)*.03;
    return b;}
  if(s==='jump')return hl(POSE.jump);
  if(s==='fall')return hl(POSE.fall);
  if(s==='ffall')return hl(POSE.ffall);
  if(s==='crouch')return hl(POSE.crouch);
  if(s==='block')return hl(POSE.block);
  if(s==='hurt'){const b={...POSE.hurt};       // recoil that shudders as stun ticks out
    const q=clamp(f.hurtT/.4,0,1);
    b.lean=POSE.hurt.lean*(.5+q*.6)+Math.sin(T*46)*q*.05;
    b.ty=POSE.hurt.ty-q*3;return hl(b);}
  if(s==='dash')return hl(POSE.dash);
  if(s==='adash')return hl(POSE.adash);
  if(s==='skid')return hl(POSE.skid);
  // idle: two breathing frequencies + a slow weight shift so it never loops visibly
  const b={...POSE.idle},br=Math.sin(T*2.4),sh=Math.sin(T*.83);
  b.ty=br*2.2;b.lean=POSE.idle.lean+sh*.035;
  b.aB=[POSE.idle.aB[0]+br*.07+sh*.05,POSE.idle.aB[1]+br*.05];
  b.aF=[POSE.idle.aF[0]-br*.07+sh*.05,POSE.idle.aF[1]-br*.05];
  b.lB=[POSE.idle.lB[0]+sh*.04,POSE.idle.lB[1]];
  b.lF=[POSE.idle.lF[0]+sh*.04,POSE.idle.lF[1]];
  b.head=br*.03;
  return hl(b);
}
const eOut  =t=>1-Math.pow(1-t,3);
const eSnap =t=>1-Math.pow(1-t,5);
const eInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function overshoot(w,s,k){   // extrapolate past the strike along windup->strike
  const o={ty:s.ty+(s.ty-w.ty)*k,lean:s.lean+(s.lean-w.lean)*k,head:s.head+(s.head-w.head)*k};
  for(const q of['aB','aF','lB','lF'])
    o[q]=[s[q][0]+(s[q][0]-w[q][0])*k, s[q][1]+(s[q][1]-w[q][1])*k];
  return o;
}
// head lags the torso. Copies — POSE entries are shared constants, never mutate them.
function hl(p){return Object.assign({},p,{head:(p.head||0)-p.lean*.32});}

/* ---------------- background ---------------- */
const stars=[];for(let i=0;i<160;i++)stars.push({x:Math.random(),y:Math.random(),s:rnd(1.8,.4),p:rnd(TAU)});

/* seeded parallax skyline, cached per stage+width */
function srand(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
let bgKey='',bgL=[];
function buildSkyline(s){
  bgL=[];
  for(let L=0;L<3;L++){
    const rr2=srand(1337+L*911+s.t.charCodeAt(0)*31);
    const items=[],near=L/2;
    const gap=(W/(9+L*5))*(1+rr2()*.1);
    let x=-W*.45;                       // built wider than the screen so panning never runs out
    while(x<W*1.45+gap){
      const h0=(60+L*70)*(1+rr2()*1.35), w0=gap*(.35+rr2()*.7);
      items.push({x,w:w0,h:h0,r:rr2(),r2:rr2()});
      x+=w0+gap*(.25+rr2()*.85);
    }
    bgL.push(items);
  }
}
function drawSkyline(s){
  const key=s.t+'|'+(W|0);
  if(key!==bgKey){bgKey=key;buildSkyline(s);}
  const par=cam.cx-W/2;                 // far layers lag the camera -> real parallax
  for(let L=0;L<3;L++){
    const yb=GY-(2-L)*22, near=L/2;
    X.save();X.translate(par*(.55-L*.18),0);
    // atmospheric perspective: far = washed toward fog, near = near-black
    const col=L===0?shade(s.a,.20):L===1?shade(s.a,.06):shade(s.a,-.35);
    X.save();X.globalAlpha=.62+L*.14;X.fillStyle=col;X.beginPath();
    for(const it of bgL[L]){
      const x=it.x,w2=it.w,h=it.h;
      if(s.t==='city'||s.t==='lab'){
        X.rect(x,yb-h,w2,h+70);
        if(it.r>.6)X.rect(x+w2*.35,yb-h-26*(1+it.r2),w2*.3,30*(1+it.r2)); // antenna/spire
        if(s.t==='lab'&&it.r2>.5)X.rect(x-w2*.2,yb-h*.45,w2*1.4,10);      // pipe
      } else if(s.t==='trees'){
        const tw=w2*(.5+it.r*.5);
        X.moveTo(x-tw,yb+50);
        X.lineTo(x+w2*.5,yb-h*(1+it.r2*.5));
        X.lineTo(x+w2+tw,yb+50);
        if(it.r>.45){ // second tier for fuller canopy
          X.moveTo(x-tw*.6,yb-h*.34);X.lineTo(x+w2*.5,yb-h*(1.15+it.r2*.5));X.lineTo(x+w2+tw*.6,yb-h*.34);}
      } else if(s.t==='temple'||s.t==='ruins'){
        const broken=it.r>.55?h*(.35+it.r2*.3):0;
        X.rect(x,yb-h+broken,w2*.55,h-broken+70);
        if(!broken){X.rect(x-w2*.24,yb-h-14,w2*1.03,16);                  // capital
          if(it.r2>.4){X.moveTo(x+w2*.55,yb-h);X.lineTo(x+w2*1.5,yb-h);
            X.lineTo(x+w2*1.5,yb-h+14);X.lineTo(x+w2*.55,yb-h+14);}}      // lintel
      } else if(s.t==='toon'){
        X.moveTo(x,yb+50);X.lineTo(x,yb-h);
        X.arc(x+w2*.5,yb-h,w2*.5,Math.PI,0);X.lineTo(x+w2,yb+50);
        if(it.r>.5)X.rect(x+w2*.62,yb-h-w2*.55,w2*.2,w2*.6);              // chimney
      } else { // space — floating rocks + arcs
        const rad=h*.32;
        X.moveTo(x+rad,yb+30-it.r*90);
        X.arc(x,yb+30-it.r*90,rad,0,TAU);
      }
    }
    X.fill();X.restore();
    // haze slab between layers
    X.save();X.globalAlpha=.10-L*.03;X.fillStyle=s.fog;
    X.fillRect(-W,yb-210,W*3,240);X.restore();
    X.restore();                        // parallax offset
  }
}
function drawBG(t){

  for(let i=0;i<16;i++){const y=GY+Math.pow(i/16,1.9)*(H-GY);X.beginPath();X.moveTo(-200,y);X.lineTo(W+200,y);X.stroke();}
  for(let i=-10;i<=10;i++){X.beginPath();X.moveTo(W/2+i*40,GY);X.lineTo(W/2+i*420,H+200);X.stroke();}
  X.restore();
}

function bar(x,y,w,h,p,c1,c2,label){
  X.fillStyle='rgba(6,8,18,.72)';X.fillRect(x-2,y-2,w+4,h+4);
  X.fillStyle='rgba(255,255,255,.07)';X.fillRect(x,y,w,h);
  const g=X.createLinearGradient(x,0,x+w,0);g.addColorStop(0,c1);g.addColorStop(1,c2);
  X.fillStyle=g;X.fillRect(x,y,w*clamp(p,0,1),h);
  X.strokeStyle='rgba(255,255,255,.22)';X.lineWidth=1;X.strokeRect(x-.5,y-.5,w+1,h+1);
  if(label){X.fillStyle='rgba(255,255,255,.55)';X.font='700 9px Segoe UI,sans-serif';X.fillText(label,x,y-6);}
}

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

/* ---------------- particle drawing ---------------- */
function drawParts(dt){
  // smoke first (normal blend)
  X.save();
  for(const p of parts){if(p.t!=='smoke')continue;
    const a=clamp(p.l/p.m,0,1);X.globalAlpha=a*.5;
    const g=X.createRadialGradient(p.x,p.y,0,p.x,p.y,p.s*(2-a));
    g.addColorStop(0,rgba('#8a93b8',.55));g.addColorStop(1,rgba('#8a93b8',0));
    X.fillStyle=g;X.beginPath();X.arc(p.x,p.y,p.s*(2-a),0,TAU);X.fill();}
  X.restore();
  // ink = light-absorbing shadow motes, so they blend normally like smoke
  for(const p of parts){if(p.t!=='ink')continue;
    const a=clamp(p.l/p.m,0,1);X.globalAlpha=a*.7;
    const g=X.createRadialGradient(p.x,p.y,0,p.x,p.y,p.s*(1.6-a*.5));
    g.addColorStop(0,rgba(p.c,.9));g.addColorStop(1,rgba(p.c,0));
    X.fillStyle=g;X.beginPath();X.arc(p.x,p.y,p.s*(1.6-a*.5),0,TAU);X.fill();}
  X.globalAlpha=1;
  X.save();X.globalCompositeOperation='lighter';
  for(const p of parts){
    if(p.t==='smoke'||p.t==='ink')continue;
    const a=clamp(p.l/p.m,0,1);X.globalAlpha=a;
    switch(p.t){
    case 'spark':
      X.strokeStyle=p.c;X.lineWidth=Math.max(1,p.s*a);X.lineCap='round';
      X.beginPath();X.moveTo(p.x,p.y);X.lineTo(p.x-p.vx*.022,p.y-p.vy*.022);X.stroke();break;
    case 'shard':{ // ice / debris splinter, flies point-first
      const ang=Math.atan2(p.vy,p.vx);
      X.save();X.translate(p.x,p.y);X.rotate(ang);X.fillStyle=p.c;X.shadowBlur=10;X.shadowColor=p.c;
      X.beginPath();X.moveTo(p.s*1.9,0);X.lineTo(-p.s,p.s*.62);X.lineTo(-p.s,-p.s*.62);X.closePath();X.fill();X.restore();break;}
    case 'sq':{ // plasma / digital chip
      X.save();X.translate(p.x,p.y);X.rotate(p.r);X.fillStyle=p.c;X.shadowBlur=12;X.shadowColor=p.c;
      X.fillRect(-p.s,-p.s,p.s*2,p.s*2);X.restore();break;}
    case 'star':{
      X.save();X.translate(p.x,p.y);X.rotate(p.r);X.fillStyle=p.c;X.shadowBlur=14;X.shadowColor=p.c;
      X.beginPath();for(let i=0;i<8;i++){const ang=i*TAU/8;const r=i%2?p.s*.36:p.s*2.1;
        X.lineTo(Math.cos(ang)*r,Math.sin(ang)*r);}X.closePath();X.fill();X.restore();break;}
    case 'leaf':{
      X.save();X.translate(p.x,p.y);X.rotate(p.r);X.fillStyle=p.c;X.globalAlpha=a*.9;
      X.beginPath();X.ellipse(0,0,p.s*1.7,p.s*.6,0,0,TAU);X.fill();X.restore();break;}
    default:{
      const g=X.createRadialGradient(p.x,p.y,0,p.x,p.y,p.s*2.2);
      g.addColorStop(0,rgba('#ffffff',.9*a));g.addColorStop(.35,p.c);g.addColorStop(1,rgba(p.c,0));
      X.fillStyle=g;X.beginPath();X.arc(p.x,p.y,p.s*2.2,0,TAU);X.fill();}
    }
  }
  X.restore();
}
function drawShots(){
  X.save();X.globalCompositeOperation='lighter';
  for(const s of shots){
    X.save();X.translate(s.x,s.y);
    if(s.k==='arrow'){X.rotate(Math.atan2(s.vy,s.vx));
      X.fillStyle=s.c;X.shadowBlur=18;X.shadowColor=s.c;
      X.beginPath();X.moveTo(22,0);X.lineTo(-14,4);X.lineTo(-14,-4);X.closePath();X.fill();
      X.globalAlpha=.5;X.fillRect(-46,-2,36,4);}
    else if(s.k==='wave'){X.rotate(Math.atan2(s.vy,s.vx));
      X.strokeStyle=s.c;X.lineWidth=13;X.shadowBlur=26;X.shadowColor=s.c;X.lineCap='round';
      X.beginPath();X.arc(-16,0,34,-1.15,1.15);X.stroke();
      X.strokeStyle='#fff';X.lineWidth=5;X.beginPath();X.arc(-16,0,34,-.95,.95);X.stroke();}
    else if(s.k==='disc'){X.rotate(s.t*22);
      X.strokeStyle=s.c;X.lineWidth=6;X.shadowBlur=22;X.shadowColor=s.c;
      X.beginPath();X.arc(0,0,17,0,TAU);X.stroke();
      X.fillStyle='#f2f5ff';X.beginPath();X.arc(0,0,10,0,TAU);X.fill();
      X.fillStyle=s.c2;X.beginPath();X.arc(0,0,5,0,TAU);X.fill();}
    else{
      const r=s.r*(1+Math.sin(s.t*20)*.1);
      const g=X.createRadialGradient(0,0,1,0,0,r*2.4);
      g.addColorStop(0,'#ffffff');g.addColorStop(.3,s.c);g.addColorStop(1,rgba(s.c,0));
      X.fillStyle=g;X.beginPath();X.arc(0,0,r*2.4,0,TAU);X.fill();
      if(s.k==='soul'){X.fillStyle=rgba('#ffffff',.8);
        X.beginPath();X.arc(-3,-3,r*.35,0,TAU);X.fill();}
    }
    X.restore();
  }
  X.restore();
}

function reflectFighter(f){
  X.save();X.translate(f.x,GY+(GY-f.y)*.5);X.scale(f.face,-.5);
  drawBody(X,f.ch,fighterPose(f),PS,T);X.restore();

function drawFighter(f,t){
  for(const g of f.ghost){const a=g.l/g.m;
    X.save();X.globalAlpha=a*.42;X.globalCompositeOperation='lighter';
    X.translate(g.x,g.y);X.scale(g.face,1);
    drawBody(X,f.ch,POSE[g.pose]||POSE.idle,PS,t);X.restore();}
  drawTrail(f);
  const sh=clamp(1-(GY-f.y)/320,.25,1);
  X.save();X.globalAlpha=.42*sh;X.fillStyle='#000';X.beginPath();
  X.ellipse(f.x,GY+2,40*sh,10*sh,0,0,TAU);X.fill();X.restore();
  X.save();X.translate(f.x,f.y);X.scale(f.face,1);
  if(f.rot){X.translate(0,-60);X.rotate(f.rot);X.translate(0,60);}
  const C=f.ch, mine=f===pl, casting=ult&&mine;
  if(f.meter>=100||casting){X.save();X.globalCompositeOperation='lighter';
    const r=casting?lerp(60,150,Math.sin(t*6)*.5+.5):66;
    const g2=X.createRadialGradient(0,-64,4,0,-64,r);
    g2.addColorStop(0,rgba(C.c3,casting?.5:.24));g2.addColorStop(1,rgba(C.c3,0));
    X.fillStyle=g2;X.beginPath();X.arc(0,-64,r,0,TAU);X.fill();X.restore();
    if(Math.random()<(casting?.9:.3))pt(f.x+rnd(34,-34),f.y-rnd(20,0),rnd(40,-40),-rnd(280,90),.6,rnd(7,3),C.c3,'orb',-160);}
  if(f.buffT>0){X.save();X.globalCompositeOperation='lighter';
    X.globalAlpha=.25+Math.sin(t*9)*.1;X.fillStyle=rgba(C.c3,.5);
    X.beginPath();X.ellipse(0,-62,42,72,0,0,TAU);X.fill();X.restore();}
  if(f.guard>0||f.guardFX>0){                         // guard bubble
    X.save();X.globalCompositeOperation='lighter';
    X.globalAlpha=(f.guardFX>0?.55:.26)+Math.sin(t*12)*.05;
    X.strokeStyle='#bcd0ff';X.lineWidth=3;
    X.beginPath();X.ellipse(6,-62,34,62,0,0,TAU);X.stroke();
    X.globalAlpha*=.28;X.fillStyle='#8fb4ff';X.fill();X.restore();}
  drawBody(X,C,fighterPose(f),PS,t,{vx:f.vx*f.face,sway:f.sway,
    sq:f.squash*.6-f.stretch*.5,
    spin:(f.spinT>0?(1-f.spinT/.36)*TAU:0)+f.spinX});
  X.restore();
}
