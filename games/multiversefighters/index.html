  X.beginPath();X.arc(4.5,-126,2.2+eo,0,TAU);X.fill();
  X.strokeStyle='#241d12';X.lineWidth=1.6;X.beginPath();
  X.arc(0,-118,4.5,0,Math.PI);X.stroke();
  X.restore();
}

/* ---------------- main loop ---------------- */
const PS=1.22;
let showMoves=false;
let T=0,last=performance.now(),running=false;
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(.045,(now-last)/1000);last=now;
  const rdt=dt;                       // real time — flash/shake decay must ignore slow-mo
  if(!running){return;}
  if(hitstop>0){hitstop-=dt;dt*=.06;}
  dt*=cam.slow;
  T+=dt;spCd=Math.max(0,spCd-dt);
  // update
  if(koT>0){koT-=rdt;cam.slow=lerp(cam.slow,koT>1.7?.28:1,rdt*3);
    if(koT<=0){resetDummy();cam.slow=1;hpShown=dum.hpMax;plHpShown=pl.hpMax;}}
  if(ult)ultTick(dt);
  else if(koT>0)updFighter(pl,dt,NOIN);
  else updPlayer(dt);
  updDummy(dt);updHits(dt);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;
    if(p.l<=0){parts.splice(i,1);continue;}
    p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.35,dt);p.r+=p.vr*dt;}
  for(let i=pl.trail.length-1;i>=0;i--){pl.trail[i].l-=dt;if(pl.trail[i].l<=0)pl.trail.splice(i,1);}
  for(let i=effs.length-1;i>=0;i--){effs[i].t+=dt;if(effs[i].t>=effs[i].l)effs.splice(i,1);}
  for(let i=nums.length-1;i>=0;i--){const n=nums[i];n.l-=dt;n.y+=n.vy*dt;n.vy+=180*dt;if(n.l<=0)nums.splice(i,1);}
  cam.sh*=Math.pow(.02,rdt);cam.flash*=Math.pow(.0006,rdt);
  for(const k in press)delete press[k];

  // ---- render
  X.setTransform(DPR,0,0,DPR,0,0);
  X.clearRect(0,0,W,H);
  if(W!==innerWidth||H!==innerHeight)onResize();   // self-heal any layout change
  updCamera(rdt);
  const sx=rnd(cam.sh,-cam.sh),sy=rnd(cam.sh,-cam.sh);
  X.save();
  X.translate(W/2+sx,H/2+sy);X.scale(cam.zz,cam.zz);X.translate(-cam.cx,-cam.cy);
  drawBG(T);
  if(cam.dark>0){X.fillStyle=rgba('#05060c',cam.dark);X.fillRect(-W,-H,W*3,H*3);}
  // effects behind
  X.save();X.globalCompositeOperation='lighter';
  for(const e of effs){X.save();X.globalAlpha=1;e.d(X,clamp(e.t/e.l,0,1));X.restore();}
  X.restore();
  // floor reflections
  X.save();
  X.beginPath();X.rect(-W,GY,W*3,H*2);X.clip();
  X.globalAlpha=.17;
  if(isDummy()){X.save();X.translate(dum.x,GY+(GY-dum.y)*.5);X.scale(1,-.5);X.rotate(dum.wob*.5+dum.rot);dummyArt(T);X.restore();}
  else reflectFighter(dum);
  reflectFighter(pl);
  X.restore();
  if(isDummy())drawDummy(T);else drawFighter(dum,T);
  drawFighter(pl,T);
  drawShots();
  drawParts(dt);
  // damage numbers
  X.save();X.textAlign='center';
  for(const n of nums){const a=clamp(n.l/n.m,0,1);
    X.globalAlpha=a;X.font='900 '+n.s*(1+(1-a)*.15)+'px Segoe UI,sans-serif';
    X.lineWidth=5;X.strokeStyle='rgba(0,0,0,.6)';
    X.strokeText(n.v,n.x+n.ox,n.y);
    const g=X.createLinearGradient(0,n.y-n.s,0,n.y);g.addColorStop(0,'#fff');g.addColorStop(1,n.c);
    X.fillStyle=g;X.fillText(n.v,n.x+n.ox,n.y);}
  X.restore();X.textAlign='left';
  X.restore(); // camera

  // vignette
  const vg=X.createRadialGradient(W/2,H/2,Math.min(W,H)*.34,W/2,H/2,Math.max(W,H)*.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.62)');
  X.fillStyle=vg;X.fillRect(0,0,W,H);
  // letterbox
  if(cam.letter>.01){X.fillStyle='#000';const b=cam.letter*H*.11;
    X.fillRect(0,0,W,b);X.fillRect(0,H-b,W,b);}
  drawUltBanner();
  if(cam.flash>.01){X.globalAlpha=Math.min(1,cam.flash);X.fillStyle=cam.flashC;
    X.fillRect(0,0,W,H);X.globalAlpha=1;}
  drawHUD(T);
  if(showMoves)drawMoveList();
  if(koT>0)drawKO();
}
requestAnimationFrame(frame);

/* ---------------- select screen ---------------- */
const grid=document.getElementById('grid'),prev=document.getElementById('prev'),PX=prev.getContext('2d');
let selIdx=0;
R.forEach((c,i)=>{
  const d=document.createElement('div');d.className='card';d.style.setProperty('--c',c.c3);
  d.innerHTML='<div class="glow"></div><canvas width="150" height="150"></canvas>'+
    '<div class="nm">'+c.name+'</div><div class="un">'+c.uni+'</div>';
  const cc=d.querySelector('canvas').getContext('2d');
  cc.setTransform(1,0,0,1,0,0);cc.save();cc.translate(75,132);drawBody(cc,c,POSE.idle,1.02,0);cc.restore();
  d.onclick=()=>sel(i);
  grid.appendChild(d);
});
function sel(i){
  selIdx=i;CH=R[i];ST=STAGE[CH.id];
  [...grid.children].forEach((e,j)=>e.classList.toggle('sel',j===i));
  document.getElementById('pname').textContent=CH.name;
  document.getElementById('puni').textContent=CH.uni;
  for(const[id,v]of[['s1',CH.pow],['s2',CH.spd],['s3',CH.rng]]){
    const e=document.getElementById(id);e.style.width=clamp(v/1.4,.15,1)*100+'%';
    e.parentElement.parentElement.style.setProperty('--c',CH.c3);}
  const m=MOVES[CH.id].a, t=TILT[CH.id], s=SPX[CH.id];
  const row=(k,v,cls)=>'<div class="mv '+(cls||'')+'"><kbd>'+k+'</kbd><span>'+v+'</span></div>';
  document.getElementById('moves').innerHTML=
   row('J',m[0][5]+' &rsaquo; '+m[1][5]+' &rsaquo; '+m[2][5])+
   row('K',m[3][5])+
   row('S+J',t[0][5])+row('S+K',t[1][5])+
   row('W+J',t[2][5])+row('W+K',t[3][5])+
   row('air J',t[4][5])+row('air K',t[5][5]+' <i style="opacity:.6;font-style:normal">spike</i>')+
   row('L',CH.sp.n,'sp')+row('S+L',s.d.n,'sp')+row('W+L',s.u.n,'sp')+
   row('U',CH.ult.n,'ult')+
   '<div class="stat" style="margin-top:4px"><b>ELEMENT</b><span style="color:'+EPAL[MOVES[CH.id].el].a+
     ';letter-spacing:2px;font-weight:800">'+MOVES[CH.id].el.toUpperCase()+'</span></div>';
}
/* ---- difficulty + opponent pickers ---- */
const diffrow=document.getElementById('diffrow');
AI_LEVELS.forEach((lv,i)=>{
  const b=document.createElement('button');
  b.textContent=lv.n==='TRAINING DUMMY'?'DUMMY':lv.n;
  b.onclick=()=>setDiff(i);
  diffrow.appendChild(b);
});
function setDiff(i){
  aiLvl=i;
  [...diffrow.children].forEach((e,j)=>e.classList.toggle('on',j===i));
  document.getElementById('difftag').textContent=AI_LEVELS[i].tag;
  document.getElementById('go').textContent=AI_LEVELS[i].dummy?'TRAIN':'FIGHT';
}
function setOpp(i){
  aiPick=i;
  document.getElementById('oppName').textContent=i<0?'RANDOM':R[i].name;
}
document.getElementById('oppPrev').onclick=()=>setOpp(aiPick<0?R.length-1:aiPick-1);
document.getElementById('oppNext').onclick=()=>setOpp(aiPick>=R.length-1?-1:aiPick+1);
setDiff(0);setOpp(-1);

sel(0);
let pt0=performance.now();
(function previewLoop(now){
  requestAnimationFrame(previewLoop);
  if(document.getElementById('select').classList.contains('hide'))return;
  const t=(now-pt0)/1000;
  PX.clearRect(0,0,360,230);
  PX.save();
  const g=PX.createRadialGradient(180,180,10,180,180,190);
  g.addColorStop(0,rgba(CH.c3,.22));g.addColorStop(1,rgba(CH.c3,0));
  PX.fillStyle=g;PX.fillRect(0,0,360,230);
  PX.globalAlpha=.3;PX.fillStyle='#000';PX.beginPath();PX.ellipse(180,210,54,9,0,0,TAU);PX.fill();PX.globalAlpha=1;
  PX.translate(180,210);
  const po={...POSE.idle};po.ty=Math.sin(t*2.2)*2.6;
  po.aB=[POSE.idle.aB[0]+Math.sin(t*2.2)*.08,POSE.idle.aB[1]];
  po.aF=[POSE.idle.aF[0]-Math.sin(t*2.2)*.08,POSE.idle.aF[1]];
  drawBody(PX,CH,po,1.5,t);
  PX.restore();
})(pt0);

function start(){
  document.getElementById('select').classList.add('hide');
  running=true;resize();
  pl.x=W*.32;pl.y=GY;pl.vx=pl.vy=0;pl.face=1;pl.st='idle';pl.meter=0;pl.ghost.length=0;pl.atk=null;pl.buffT=0;pl.inv=0;pl.chain=0;
  pl.trail.length=0;pl.jumps=1;pl.airDash=1;pl.spinT=pl.spinX=pl.squash=pl.stretch=pl.sway=pl.swayV=pl.skidT=0;
  parts.length=effs.length=shots.length=hits.length=nums.length=0;
  ult=null;cam.dark=0;cam.letter=0;cam.slow=1;cam.sh=0;camReset();
  pl.ch=CH;
  dum.ch=R[aiPick>=0?aiPick:rint(R.length)];
  pl.hpMax=1000;pl.hp=1000;
  wins.p=wins.a=0;
  resetDummy();hpShown=dum.hpMax;plHpShown=pl.hpMax;last=performance.now();
}
const NOIN=blankInput();
function drawKO(){
  const won=koWho!==pl;
  const a=clamp((2.8-koT)/.22,0,1)*clamp(koT/.4,0,1);
  const y=H*.38;
  X.save();X.globalAlpha=a;X.textAlign='center';X.lineJoin='round';
  X.font='900 '+Math.min(112,W*.1)+'px Segoe UI,sans-serif';
  const g=X.createLinearGradient(0,y-72,0,y+20);
  g.addColorStop(0,'#ffffff');g.addColorStop(.5,won?'#ffd166':'#ff5a6a');
  g.addColorStop(1,won?'#ff7a1f':'#7a1330');
  X.lineWidth=12;X.strokeStyle='rgba(0,0,0,.7)';
  X.strokeText('K.O.',W/2,y);X.fillStyle=g;X.fillText('K.O.',W/2,y);
  X.font='900 22px Segoe UI,sans-serif';X.lineWidth=7;
  X.strokeText(won?'YOU WIN':'YOU LOSE',W/2,y+44);
  X.fillStyle='#fff';X.fillText(won?'YOU WIN':'YOU LOSE',W/2,y+44);
  X.font='700 11px Segoe UI,sans-serif';X.fillStyle='#8f9ad0';
  X.fillText('next round in '+Math.max(0,koT).toFixed(1)+'s',W/2,y+72);
  X.restore();X.textAlign='left';
}
function backToSelect(){running=false;document.getElementById('select').classList.remove('hide');}
document.getElementById('go').onclick=start;
</script>
